# trivy-rendered-profiles.yaml — настройки прохода IaC-скана по ОТРЕНДЕРЕННЫМ ПРОФИЛЯМ
# зонтика (`deploy/scripts/render-umbrella-profiles.sh`): каждый стек таблицы
# `deploy/stacks.txt` — цепочкой своих `values*.yaml`, с хуками, по файлу на шаблон.
#
# Здесь сканер читает готовые манифесты, а не чарты: значения профиля уже применены
# рендером. Поэтому заглушек нет и быть не может; список объявлен ЯВНО пустым, иначе
# trivy подхватил бы корневой `trivy.yaml` сам.
#
# Пути целей — от каталога рендера: `<стек>/<чарт>/<путь шаблона>`. В этой форме CI
# применяет `.trivyignore.yaml`, и в ней стоят записи прохода.
misconfiguration:
  helm:
    set: []
