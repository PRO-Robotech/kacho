# .trivyignore.yaml — ОТСЛЕЖИВАЕМЫЕ исключения IaC-гейта.
#
# Перечень был доведён до НОЛЯ фиксами (2026-08-09) и снова непуст с 2026-10-01:
# записи ниже пришли вместе с осмотром подчартов зонтика (#2980) — разбор у самих
# записей. `TRIVY_IGNOREFILE` в security-scan.yml указывает сюда, и
# запись, дописанная ниже, начнёт действовать сразу.
#
# ── ПРАВИЛА, ПО КОТОРЫМ ЗАПИСЬ ЗАВОДИТСЯ ─────────────────────────────────────
#
# 1. Исключение привязано к ПУТИ, а не к правилу целиком. Глобальный `AVD-KSV-0118`
#    отключил бы проверку и там, где она работает; правило обязано остаться живым
#    для всего остального дерева.
# 2. Путь перечисляется ПОФАЙЛОВО, а не образцом. Цена — строка на файл; выгода в
#    том, что оба события становятся видимы правкой этого файла, а не молчанием:
#    файл вычистили — строка тут лишняя (гейт самоистечения на ней краснеет);
#    появился новый файл того же рода — он НЕ накрыт, скан краснеет и требует
#    решения, вместо того чтобы унаследовать чужое послабление по совпадению пути.
#    Это выведено из реального случая: сайт документации iam уже был вычищен, а
#    образец продолжал накрывать его по трём правилам — исключение предъявляло
#    закрытый долг за открытый.
# 3. Запись несёт `statement` с причиной и НОМЕРОМ ТИКЕТА. Исключение — это
#    отложенная работа, у которой есть адрес, а не молча пониженный порог.
# 4. «Находки по пути нет» — НЕ основание завести или сохранить запись, пока не
#    установлено, что путь вообще ОСМАТРИВАЕТСЯ. Отсутствие осмотра и отсутствие
#    дефекта в отчёте выглядят одинаково; различает их census целей, который
#    печатает гейт.
#
# ── ЧЕМ ЭТОТ ФАЙЛ ДЕРЖИТСЯ ───────────────────────────────────────────────────
# `deploy/scripts/assert-iac-exclusions-still-have-a-subject.py` — прогоняет скан
# БЕЗ ignorefile и требует, чтобы у каждой записи ниже был предмет; запись,
# которой больше нечего исключать, — находка. Пустой перечень для него законен и
# печатается как таковой.
# `deploy/scripts/assert-iac-scan-covers-every-chart.py` — держит предпосылку
# пункта 4: каждый отслеживаемый чарт с шаблонами обязан дать сканеру хотя бы одну
# цель, иначе «ноль находок» по нему означает «ноль прочитанного».
#
# ── ЧТО ЗДЕСЬ СТОЯЛО И ЧЕМ ЗАКРЫТО (kacho#4) ────────────────────────────────
# 2026-08-03: 29 записей, 60 находок — security-scan впервые покрыл весь
#   репозиторий (в polyrepo IaC-скан стоял только там, где k8s-манифестов не было
#   вовсе, и зеленел, не проверяя ничего). Находки были не новые — новым был скан.
# 2026-08-08: сайты документации и remotes ui-future переведены на образ
#   nginx-unprivileged с `USER 101` и деплойменты с read-only корнем → 5 записей.
# 2026-08-09: закрыт остаток. Шесть нагрузочных Job'ов (k6 + четыре ghz nlb +
#   ghz vpc) получили securityContext пода и контейнера с read-only корнем —
#   посадка проверена прогоном образов под `--read-only`, а не выведена из чтения.
#   Последняя запись (StatefulSet хранилища слоёв zot) не судилась вовсе: чарт
#   реестра не попадал в цели сканера, потому что намеренно ОТКАЗЫВАЕТ в рендере
#   без учётных данных. Сначала путь введён в осмотр (корневой `trivy.yaml`), и
#   только потом вынесен вердикт: находка была настоящей и закрыта включением
#   read-only корня у zot.
#
# Ноль исключений — не повод снимать механизм: он стоит ровно ради следующей
# записи, и она обязана прийти по правилам выше.
#
# ── 2026-10-01: ОТРЕНДЕРЕННЫЕ ПРОФИЛИ ЗОНТИКА (#2980) ────────────────────────
# Зонтик и его подчарты осматриваются тем, что РАЗВЁРТЫВАЕТСЯ: каждый стек таблицы
# `deploy/stacks.txt` отрендерен цепочкой своих values, с хуками, по файлу на шаблон
# (`deploy/scripts/render-umbrella-profiles.sh`, проход «профили зонтика»). Пути ниже —
# в форме этого прохода: `<стек>/kacho-umbrella/<путь шаблона>`; к ней CI и применяет
# этот файл. Пара «правило × отрендеренный путь профиля» — пофайлово, по правилу 2:
# новый стек того же вида записи не наследует.
#
# Замер 2026-10-01, trivy 0.70.0, 7 стеков: 786 целей, 19 пар «правило × путь шаблона»,
# 85 строк «правило × путь × стек». Три рода записей, и они НЕ равны:
#   * права, без которых сторонний контроллер не выполняет свою функцию — принятый
#     риск по существу (cert-manager, контроллер входа, его хук допуска);
#   * hostPort контроллера входа — только цепочки с `values.dev.yaml` (kind);
#   * ДОЛГ развёртывания: корень ФС на запись и контекст безопасности по умолчанию у
#     контроллера входа (с хуками), PostgreSQL (все псевдонимы `pg-*`) и реестра в
#     fe3455. Исправляется значениями зонтика с проверкой подъёмом на стенде.
# Записи самоистекают по построению прохода: исправление значений делает рендер
# чистым, и гейт исключений называет запись без предмета; профиль перестал рендерить
# путь — запись «без пути», тоже находка.

