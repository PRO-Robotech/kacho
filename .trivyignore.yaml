# .trivyignore.yaml — ОТСЛЕЖИВАЕМЫЕ исключения IaC-гейта.
#
# Перечень был доведён до НОЛЯ фиксами (2026-08-09) и снова непуст с 2026-10-01:
# записи ниже пришли вместе с осмотром подчартов зонтика (#2980) — разбор у самих
# записей. `TRIVY_IGNOREFILE` в security-scan.yml указывает сюда, и
# запись, дописанная ниже, начнёт действовать сразу.
#
# ── ПРАВИЛА, ПО КОТОРЫМ ЗАПИСЬ ЗАВОДИТСЯ ─────────────────────────────────────
#
# 1. Исключение привязано к ПУТИ, а не к правилу целиком. Глобальный `AVD-KSV-0118`
#    отключил бы проверку и там, где она работает; правило обязано остаться живым
#    для всего остального дерева.
# 2. Путь перечисляется ПОФАЙЛОВО, а не образцом. Цена — строка на файл; выгода в
#    том, что оба события становятся видимы правкой этого файла, а не молчанием:
#    файл вычистили — строка тут лишняя (гейт самоистечения на ней краснеет);
#    появился новый файл того же рода — он НЕ накрыт, скан краснеет и требует
#    решения, вместо того чтобы унаследовать чужое послабление по совпадению пути.
#    Это выведено из реального случая: сайт документации iam уже был вычищен, а
#    образец продолжал накрывать его по трём правилам — исключение предъявляло
#    закрытый долг за открытый.
# 3. Запись несёт `statement` с причиной и НОМЕРОМ ТИКЕТА. Исключение — это
#    отложенная работа, у которой есть адрес, а не молча пониженный порог.
# 4. «Находки по пути нет» — НЕ основание завести или сохранить запись, пока не
#    установлено, что путь вообще ОСМАТРИВАЕТСЯ. Отсутствие осмотра и отсутствие
#    дефекта в отчёте выглядят одинаково; различает их census целей, который
#    печатает гейт.
#
# ── ЧЕМ ЭТОТ ФАЙЛ ДЕРЖИТСЯ ───────────────────────────────────────────────────
# `deploy/scripts/assert-iac-exclusions-still-have-a-subject.py` — прогоняет скан
# БЕЗ ignorefile и требует, чтобы у каждой записи ниже был предмет; запись,
# которой больше нечего исключать, — находка. Пустой перечень для него законен и
# печатается как таковой.
# `deploy/scripts/assert-iac-scan-covers-every-chart.py` — держит предпосылку
# пункта 4: каждый отслеживаемый чарт с шаблонами обязан дать сканеру хотя бы одну
# цель, иначе «ноль находок» по нему означает «ноль прочитанного».
#
# ── ЧТО ЗДЕСЬ СТОЯЛО И ЧЕМ ЗАКРЫТО (kacho#4) ────────────────────────────────
# 2026-08-03: 29 записей, 60 находок — security-scan впервые покрыл весь
#   репозиторий (в polyrepo IaC-скан стоял только там, где k8s-манифестов не было
#   вовсе, и зеленел, не проверяя ничего). Находки были не новые — новым был скан.
# 2026-08-08: сайты документации и remotes ui-future переведены на образ
#   nginx-unprivileged с `USER 101` и деплойменты с read-only корнем → 5 записей.
# 2026-08-09: закрыт остаток. Шесть нагрузочных Job'ов (k6 + четыре ghz nlb +
#   ghz vpc) получили securityContext пода и контейнера с read-only корнем —
#   посадка проверена прогоном образов под `--read-only`, а не выведена из чтения.
#   Последняя запись (StatefulSet хранилища слоёв zot) не судилась вовсе: чарт
#   реестра не попадал в цели сканера, потому что намеренно ОТКАЗЫВАЕТ в рендере
#   без учётных данных. Сначала путь введён в осмотр (корневой `trivy.yaml`), и
#   только потом вынесен вердикт: находка была настоящей и закрыта включением
#   read-only корня у zot.
#
# Ноль исключений — не повод снимать механизм: он стоит ровно ради следующей
# записи, и она обязана прийти по правилам выше.
#
# ── 2026-10-01: ПОДЧАРТЫ-АРХИВЫ ЗОНТИКА (#2980) ──────────────────────────────
# Пять сторонних архивов `deploy/helm/umbrella/charts/` впервые введены в осмотр
# третьим проходом (`trivy-umbrella-subcharts.yaml`): 44 цели, 15 находок
# CRITICAL/HIGH в 9 парах «правило × файл». Пути ниже — в форме, которую trivy
# пишет для этого прохода (от `deploy/helm/umbrella/charts`), к ней CI и применяет
# этот файл. Подчарт рендерится СВОИМИ умолчаниями, а не значениями зонтика (граница
# прохода — шапка файла настроек).
#
# Два рода записей, и они НЕ равны:
#   * права, без которых сторонний контроллер не выполняет свою функцию (выпуск
#     сертификатов в Secret, подстановка CA в конфигурацию вебхуков, решатель ACME
#     через Ingress, чтение TLS-секретов контроллером входа, синхронизация клиентов
#     OAuth в Secret) — принятый риск по существу;
#   * KSV-0014 и KSV-0118 у контроллера входа и PostgreSQL — находка ВЕРНА и для
#     развёртывания: значения зонтика `readOnlyRootFilesystem` и контекст безопасности
#     пода не задают (grep по `deploy/helm/umbrella/values*.yaml`, 2026-10-01). Это
#     ДОЛГ, а не принятый риск: исправляется значениями зонтика с проверкой подъёмом
#     на стенде; до исправления записи держат конвейер, а не прощают находку.
# Запись, чей архив больше не отслеживается, — находка гейта исключений: так
# запись снимается вместе со своим подчартом.
#
# Запись KSV-0041 у контроллера синхронизации клиентов OAuth в подчарте снимаемого
# издателя личности называет издателя путём — это одна привязка сверх потолка гейта
# `TestRetiredIdentityVendorBindingsStayUnderTheirCeiling`. Она разрешена решением
# владельца 2026-10-01 «+1 к потолку до релиза» и записана в гейте отпечатком строки
# (`internal/repohygiene/retiredidentityvendorceilinggrant.go`). Снимается вместе с
# подчартом в релизе отказа от издателя (kacho#2824): архив ушёл — красное и здесь
# (гейт исключений: «пути нет в дереве»), и там (грант без предмета).

misconfigurations:
  - id: KSV-0041
    paths:
      - "cert-manager-v1.16.5.tgz:templates/cainjector-rbac.yaml"
      - "cert-manager-v1.16.5.tgz:templates/rbac.yaml"
    statement: "#2980: cert-manager выпускает сертификаты В Secret и читает их — право на secrets есть его функция; принятый риск"
  - id: KSV-0114
    paths:
      - "cert-manager-v1.16.5.tgz:templates/cainjector-rbac.yaml"
    statement: "#2980: cainjector подставляет CA в validating/mutating webhook configurations — это его функция; принятый риск"
  - id: KSV-0056
    paths:
      - "cert-manager-v1.16.5.tgz:templates/rbac.yaml"
    statement: "#2980: решатель ACME HTTP-01 cert-manager создаёт Ingress/Service — право на сетевые объекты есть его функция; принятый риск"
  - id: KSV-0041
    paths:
      - "ingress-nginx-4.15.1.tgz:templates/clusterrole.yaml"
    statement: "#2980: контроллер входа читает TLS-секреты, на которые ссылаются Ingress; принятый риск"
  - id: KSV-0014
    paths:
      - "ingress-nginx-4.15.1.tgz:templates/controller-deployment.yaml"
      - "postgresql-13.4.4.tgz:templates/primary/statefulset.yaml"
    statement: "#2980: ДОЛГ — корень ФС контроллера входа и PostgreSQL доступен на запись и в развёртывании; исправить значениями зонтика с проверкой подъёмом на стенде"
  - id: KSV-0118
    paths:
      - "ingress-nginx-4.15.1.tgz:templates/controller-deployment.yaml"
    statement: "#2980: ДОЛГ — у пода контроллера входа контекст безопасности по умолчанию и в развёртывании; исправить значениями зонтика с проверкой подъёмом на стенде"
  - id: KSV-0041
    paths:
      - "hydra-0.62.1.tgz:charts/hydra-maester/templates/rbac.yaml"
    statement: "#2980: контроллер синхронизации клиентов OAuth пишет их в Secret — принятый риск по решению владельца 2026-10-01; снять вместе с подчартом в релизе отказа от издателя личности (kacho#2824)"
