# trivy-umbrella-subcharts.yaml — настройки ТРЕТЬЕГО прохода IaC-скана: сторонние
# подчарты-архивы зонтичного чарта `deploy/helm/umbrella/charts/` (#2980), БЕЗ заглушек.
#
# ЗАЧЕМ. Родитель этих архивов снят с осмотра послаблением гейта покрытия (не
# рендерится без сборки локальных сабчартов), и через него подчарты не осматривались
# вовсе: пять архивов, 44 цели, 15 находок CRITICAL/HIGH вне скана.
#
# `kube-version` — НЕ послабление, а штатный параметр рендера (то же, что
# `helm template --kube-version`). Без него trivy рендерит под умолчанием v1.20.0, и
# cert-manager (`>= 1.22.0-0`) с ingress-nginx (`>=1.21.0-0`) отказывают в рендере,
# выходя из осмотра. Значение — версия узла стенда: kind 0.32.0 ставит
# `kindest/node:v1.36.1` (`.github/workflows/e2e-newman.yml`, записка у шага kind).
# Совпадение с узлом стенда держится вниманием: устареет — рендер не откажет, пока
# требование чарта ниже значения.
#
# ГРАНИЦА. Подчарт рендерится со СВОИМИ умолчаниями, а не со значениями зонтика:
# области чарта у trivy нет ни для заглушек, ни для файла значений, а `postgresql`
# стоит в зонтике пятью псевдонимами с разными значениями. Осмотр отвечает на вопрос
# «что несёт сторонний чарт», а не «что развёрнуто». Разбор находок — в
# `.trivyignore.yaml`.
#
# Почему список заглушек ЯВНО пустой — как у `trivy-vendored-charts.yaml`: trivy
# подхватил бы корневой `trivy.yaml` сам.
misconfiguration:
  helm:
    set: []
    kube-version: "1.36.1"
