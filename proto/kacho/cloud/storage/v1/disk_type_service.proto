syntax = "proto3";

package kacho.cloud.storage.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "kacho/cloud/storage/v1/disk_type.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/storage/v1;storagev1";

// A set of methods to retrieve information about disk types (public :9090; REST
// /storage/v1/diskTypes).
//
// Read стоит на отношении `viewer` кластерного синглтона, которое производит
// СИСТЕМНАЯ ВЫДАЧА с подстановочным субъектом: каталог администрируется
// платформой, одинаков для всех и обязан читаться ВСЯКИМ аутентифицированным
// арендатором, иначе он не выберет ни размер, ни тип. authN остаётся
// обязательным. Админские глаголы каталога — `system_admin` на кластере.
//
// ДВЕ ПРЕЖНИЕ РЕДАКЦИИ, И ОБЕ ВЕРНЫ НАПОЛОВИНУ. Первая объявляла то же отношение,
// которого НЕ ПРОИЗВОДИЛ никто, — оба чтения отвечали отказом каждому, и создать
// было нельзя ничего. Вторая (#892) снимала проверку полосой `<exempt>` — отказ
// уходил, но вместе с ним и видимость: доступ, выданный освобождением, не
// показывается перечислением выдач и закрывается только выкаткой. Производитель
// заведён (#893/#895), поэтому оба свойства верны сразу. Держат два гейта дерева:
// TestClusterScopedCatalogEntryNamesARelationSomeoneProduces (у отношения есть
// производитель) и TestCatalog_WildcardSatisfiableRelations_AreNamedReferenceCatalogues
// (такое отношение позволено только глобальному справочнику, названному поимённо).
service DiskTypeService {
  // Returns the information about the specified disk type.
  //
  // To get the list of available disk types, make a [List] request.
  rpc Get(GetDiskTypeRequest) returns (DiskType) {
    option (google.api.http) = {get: "/storage/v1/diskTypes/{disk_type_id}"};
    // Ambient placement-catalog read. Стоит на отношении `viewer` кластерного
    // синглтона, которое производит СИСТЕМНАЯ ВЫДАЧА с подстановочным субъектом:
    // справочник обязан читать всякий аутентифицированный арендатор, и подстановка
    // выполняет отношение за него, поэтому арендатор с нулём собственных выдач не
    // получает отказа.
    //
    // Здесь недолго стояла полоса `<exempt>` (#892): отношение тогда не производил
    // НИКТО, и проверка отвечала отказом каждому. Освобождение это чинило, но
    // делало доступ невидимым — он не показывался перечислением выдач и
    // закрывался только выкаткой. Теперь верны оба свойства сразу (#893/#895).
    option (kacho.iam.authz.v1.permission) = "storage.disk_types.get";
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Retrieves the list of disk types.
  rpc List(ListDiskTypesRequest) returns (ListDiskTypesResponse) {
    option (google.api.http) = {get: "/storage/v1/diskTypes"};
    // Ambient placement-catalog read — то же отношение и тот же производитель,
    // что у соседнего чтения этого сервиса (#893/#895).
    option (kacho.iam.authz.v1.permission) = "storage.disk_types.list";
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

// InternalDiskTypeService — kacho-only admin API for managing the read-only
// DiskType catalog. Exposed ONLY on the cluster-internal port of kacho-storage
// (:9091); proxied through api-gateway internal mux to /storage/v1/diskTypes —
// NOT on the external TLS endpoint (workspace CLAUDE.md ban #6).
//
// IMPORTANT, on how that isolation actually holds: Create/Update/Delete share
// their REST path with the PUBLIC catalog read (`GET /storage/v1/diskTypes[/{id}]`
// — DiskTypeService) and differ from it ONLY by HTTP method (POST/PATCH/DELETE).
// The api-gateway external-isolation gate is therefore keyed on the (method,
// path) PAIR, never on the path alone: a path-only classifier cannot tell these
// bindings apart and routes the admin mutations to the public mux. The source
// of truth for that classification is the set of Internal*Service REST bindings
// read from the proto descriptors
// (gateway/internal/restmux/internal_routes.go), so a new RPC on this service
// is isolated automatically.
//
// SetLifecycle путь с публичным чтением не делит (у него suffix-действие), но
// изолируется ТЕМ ЖЕ правилом: источник классификации — принадлежность RPC этому
// сервису, а не форма его пути. Полагаться на суффикс было бы вторым правилом об
// одном предмете, и оно разошлось бы с первым на следующем же добавлении.
service InternalDiskTypeService {
  rpc Create(CreateDiskTypeRequest) returns (DiskType) {
    option (google.api.http) = {
      post: "/storage/v1/diskTypes"
      body: "*"
    };
    option (kacho.iam.authz.v1.permission)        = "storage.disk_types.create";
    option (kacho.iam.authz.v1.required_relation) = "system_admin";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
  rpc Update(UpdateDiskTypeRequest) returns (DiskType) {
    option (google.api.http) = {
      patch: "/storage/v1/diskTypes/{disk_type_id}"
      body: "*"
    };
    option (kacho.iam.authz.v1.permission)        = "storage.disk_types.update";
    option (kacho.iam.authz.v1.required_relation) = "system_admin";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
  rpc Delete(DeleteDiskTypeRequest) returns (DeleteDiskTypeResponse) {
    option (google.api.http) = {delete: "/storage/v1/diskTypes/{disk_type_id}"};
    option (kacho.iam.authz.v1.permission)        = "storage.disk_types.delete";
    option (kacho.iam.authz.v1.required_relation) = "system_admin";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Переводит класс в другое состояние обращения (в обращение / из обращения).
  //
  // Отдельный глагол, а не поле правки. Причина в семантике маски: пустая маска у
  // Update означает полную замену изменяемых полей, поэтому состояние обращения в
  // его теле возвращало бы выведенный класс в обращение при правке описания —
  // молча и без заявленного намерения. Здесь намерение и есть весь запрос.
  //
  // Вывод из обращения НЕ трогает существующие тома: они продолжают читаться,
  // обновляться и удаляться. Отказ получают только новые (DEPRECATED/RETIRED →
  // FAILED_PRECONDITION "DiskType <id> is not accepting new volumes"), а удаление
  // самого класса по-прежнему упирается в ссылающиеся тома (FK RESTRICT).
  //
  // Синхронный и возвращает ресурс: у админ-справочника нет длящейся работы, и
  // оборачивать её в Operation значило бы заставлять администратора поллить готовое.
  rpc SetLifecycle(SetDiskTypeLifecycleRequest) returns (DiskType) {
    option (google.api.http) = {
      patch: "/storage/v1/diskTypes/{disk_type_id}:setLifecycle"
      body: "*"
    };
    option (kacho.iam.authz.v1.permission)        = "storage.disk_types.setLifecycle";
    option (kacho.iam.authz.v1.required_relation) = "system_admin";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetDiskTypeRequest {
  // ID of the disk type to return information about.
  string disk_type_id = 1;
}

message ListDiskTypesRequest {
  // The maximum number of results per page to return.
  int64 page_size = 1;

  // Page token. To get the next page of results, set [page_token] to the
  // [ListDiskTypesResponse.next_page_token] returned by a previous list request.
  string page_token = 2;
}

message ListDiskTypesResponse {
  // List of disk types.
  repeated DiskType disk_types = 1;

  // This token allows you to get the next page of results for list requests.
  string next_page_token = 2;
}

message CreateDiskTypeRequest {
  // DiskType ID — admin sets it explicitly (e.g. "network-ssd"). Primary key, immutable.
  string id = 1;

  // Human-readable name of the disk type.
  string name = 2;

  // Description of the disk type.
  string description = 3;

  // Availability zones where this disk type is offered.
  repeated string zone_ids = 4;

  // Поле 5 несло ярус свободной строкой — см. разбор у [DiskType]. Номер и имя
  // закрыты здесь по той же причине: запрос и ресурс обязаны говорить об одном
  // предмете одинаково, иначе строка, отвергнутая ресурсом, проходила бы через
  // запрос и расхождение обнаруживалось бы только на записи.
  reserved 5;
  reserved "performance_tier";

  // Ярус класса. Омит законен (класс вправе не называть ярус); значение вне
  // словаря — INVALID_ARGUMENT.
  DiskType.PerformanceTier tier = 6;

  // Состояние обращения регистрируемого класса. Омит означает ACTIVE — умолчание
  // проставляет край в одном названном месте; домен незаполненное состояние
  // отвергает, чтобы не принять опечатку за намерение.
  DiskType.Lifecycle lifecycle = 7;

  // Границы размера тома, объявляемые классом. Ноль в любом из полей означает
  // «класс не сужает» с этой стороны.
  DiskType.SizeLimits limits = 8;

  // Способностей здесь нет намеренно: их источник истины — действующие ревизии
  // привязки (:9091), а класс их ВЫВОДИТ пересечением. Принять их на вход значило
  // бы завести второй источник одного факта; принять и не сохранить — молча
  // выбросить параметр, который вызывающий считает применённым.
}

message UpdateDiskTypeRequest {
  // ID изменяемого класса. Неизменяем: адресация идёт по нему.
  string disk_type_id = 1;

  string name = 2;
  string description = 3;

  // Список зон, в которых предлагается класс. Замещается целиком, когда назван
  // маской (или когда маска пуста) — частичного добавления зоны у этого поля нет.
  repeated string zone_ids = 4;

  // Поле 5 несло ярус свободной строкой — см. [CreateDiskTypeRequest] и [DiskType].
  reserved 5;
  reserved "performance_tier";

  // Маска изменяемых полей. Заведена потому, что без неё правка была полной
  // заменой: тело без `zone_ids` обнуляло список у справочника, от которого
  // зависит размещение данных, — и запрос, менявший одно имя, снимал класс со
  // всех зон, ничего об этом не сказав.
  //
  // Пустая маска остаётся полной заменой изменяемых полей (единая дисциплина
  // платформы), неизвестное поле в маске — INVALID_ARGUMENT, неизменяемое —
  // "<field> is immutable after DiskType.Create".
  google.protobuf.FieldMask update_mask = 6;

  // Ярус класса.
  DiskType.PerformanceTier tier = 7;

  // Границы размера тома.
  DiskType.SizeLimits limits = 8;

  // Состояния обращения здесь нет намеренно: оно меняется глаголом SetLifecycle.
  // При пустой маске полная замена изменяемых полей вернула бы выведенный класс в
  // обращение правкой описания — исход, которого вызывающий не заявлял.
  // Способностей нет по причине из [CreateDiskTypeRequest].
}

message SetDiskTypeLifecycleRequest {
  // ID класса, состояние обращения которого меняется.
  string disk_type_id = 1;

  // Новое состояние обращения. Обязательно и называется явно: у этого запроса нет
  // умолчания — «не указано» здесь неотличимо от «верни в обращение», а такой
  // исход обязан быть выбран, а не получен по недосмотру.
  DiskType.Lifecycle lifecycle = 2;
}

message DeleteDiskTypeRequest {
  // ID of the DiskType.
  string disk_type_id = 1;
}

message DeleteDiskTypeResponse {}
