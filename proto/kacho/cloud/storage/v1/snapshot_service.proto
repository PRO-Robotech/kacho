syntax = "proto3";

package kacho.cloud.storage.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "kacho/cloud/api/operation.proto";
import "kacho/cloud/operation/operation.proto";
import "kacho/cloud/storage/v1/snapshot.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/storage/v1;storagev1";

// A set of methods for managing Snapshot resources (public :9090; REST /storage/v1/snapshots).
service SnapshotService {
  // Returns the specified Snapshot resource.
  //
  // To get the list of available Snapshot resources, make a [List] request.
  rpc Get(GetSnapshotRequest) returns (Snapshot) {
    option (google.api.http) = {get: "/storage/v1/snapshots/{snapshot_id}"};
    option (kacho.iam.authz.v1.permission)        = "storage.snapshots.get";
    option (kacho.iam.authz.v1.required_relation) = "v_get";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "storage_snapshot"
      from_request_field: "snapshot_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Retrieves the list of Snapshot resources in the specified project.
  rpc List(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option (google.api.http) = {get: "/storage/v1/snapshots"};
    option (kacho.iam.authz.v1.permission)        = "storage.snapshots.list";
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Creates a snapshot of the specified volume.
  rpc Create(CreateSnapshotRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/storage/v1/snapshots"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "CreateSnapshotMetadata"
      response: "Snapshot"
    };
    option (kacho.iam.authz.v1.permission)        = "storage.snapshots.create";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Копирует снимок в другую зону. Создаёт НОВЫЙ снимок; исходный не меняется —
  // ни его зона, ни состояние, ни состав засеянных им томов.
  //
  // # Почему копия, а не «перенос»
  //
  // Зона тома неизменяема, значит восстановить снимок в чужой зоне нельзя by
  // construction. Копия — единственный законный путь провести данные через
  // границу размещения: сначала снимок оказывается в целевой зоне, и только
  // потом из него засевается том. Глагола «сменить зону снимку» не существует и
  // не заводится: он означал бы, что уже засеянные тома ссылаются на источник,
  // размещения которого больше нет.
  //
  // Гейт спрашивает право СОЗДАВАТЬ В ПРОЕКТЕ — `editor@project`, ровно как у
  // Create, и это не формальность.
  //
  // Соблазн спросить про источник (v_get на снимок, «кто вправе читать, тот
  // вправе копировать») выглядит естественно и НЕВЕРЕН: копия — новый ресурс,
  // она занимает квоту, имя и деньги. Роль наблюдателя материализует v_get на
  // КАЖДЫЙ объект проекта, поэтому такой гейт дал бы читателю право
  // неограниченно порождать снимки — повышение привилегии из чтения в запись,
  // неотличимое в дифе от обычной строки каталога.
  //
  // Пообъектного `v_create` в платформе нет вовсе (см. authzmap: «создать» —
  // операция не над объектом, которого ещё нет, а над родителем), поэтому
  // единственная законная форма — та же, что у всякого Create.
  //
  // Читаемость источника при этом не теряется: `project_id` обязан совпадать с
  // проектом снимка, а роль, дающая editor в проекте, материализует и v_get на
  // его объекты. Копировать чужое из другого проекта нельзя by construction.
  rpc Copy(CopySnapshotRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/storage/v1/snapshots/{snapshot_id}:copy"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "CopySnapshotMetadata"
      response: "Snapshot"
    };
    option (kacho.iam.authz.v1.permission)        = "storage.snapshots.copy";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Updates the specified snapshot.
  //
  // Values of omitted parameters are not changed.
  rpc Update(UpdateSnapshotRequest) returns (operation.Operation) {
    option (google.api.http) = {
      patch: "/storage/v1/snapshots/{snapshot_id}"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateSnapshotMetadata"
      response: "Snapshot"
    };
    option (kacho.iam.authz.v1.permission)        = "storage.snapshots.update";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "storage_snapshot"
      from_request_field: "snapshot_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Deletes the specified snapshot.
  rpc Delete(DeleteSnapshotRequest) returns (operation.Operation) {
    option (google.api.http) = {delete: "/storage/v1/snapshots/{snapshot_id}"};
    option (kacho.cloud.api.operation) = {
      metadata: "DeleteSnapshotMetadata"
      response: "google.protobuf.Empty"
    };
    option (kacho.iam.authz.v1.permission)        = "storage.snapshots.delete";
    option (kacho.iam.authz.v1.required_relation) = "v_delete";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "storage_snapshot"
      from_request_field: "snapshot_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Отдаёт журнал операций этого снимка.
  //
  // Мутации асинхронны и возвращают Operation, поэтому «что с моим снимком
  // происходило» отвечается только журналом: клиент, потерявший идентификатор
  // операции, иначе не восстановит ни её исход, ни причину отказа. У тома и
  // образа такой журнал есть — у снимка его не было, и паритет между тремя
  // ресурсами одного домена держится перечнем методов, а не памятью.
  rpc ListOperations(ListSnapshotOperationsRequest) returns (ListSnapshotOperationsResponse) {
    option (google.api.http) = {get: "/storage/v1/snapshots/{snapshot_id}/operations"};
    option (kacho.iam.authz.v1.permission)        = "storage.snapshots.listOperations";
    option (kacho.iam.authz.v1.required_relation) = "v_list";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "storage_snapshot"
      from_request_field: "snapshot_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetSnapshotRequest {
  // ID of the Snapshot resource to return.
  // To get the snapshot ID, use a [SnapshotService.List] request.
  string snapshot_id = 1;
}

message ListSnapshotsRequest {
  // ID of the project to list snapshots in.
  // To get the project ID, use a [kacho.cloud.iam.v1.ProjectService.List] request.
  string project_id = 1;

  // The maximum number of results per page to return.
  int64 page_size = 2;

  // Page token. To get the next page of results, set [page_token] to the
  // [ListSnapshotsResponse.next_page_token] returned by a previous list request.
  string page_token = 3;

  // A filter expression that filters resources listed in the response. Currently
  // filtering is supported on the `name` field only.
  string filter = 4;

  // Field 5 held `order_by`, a free-form sort expression. It was accepted,
  // length-checked and then read by nothing: no handler, use-case or repository
  // ever looked at it, and its documented default ("id asc") did not describe the
  // order the query produced either. It could not have been honoured as declared —
  // this List pages with a keyset cursor over (created_at, id), which is the page
  // token itself, so a caller-chosen order leaves the cursor describing a position
  // in an order that no longer exists, and ordering by an unindexed column turns a
  // page read into a full scan. Removed deliberately; the slot stays shut so it
  // cannot return meaning something else. A descending listing, if ever wanted, is
  // its own field with a closed set of values.
  reserved 5;
  reserved "order_by";
}

message ListSnapshotsResponse {
  // List of snapshots.
  repeated Snapshot snapshots = 1;

  // This token allows you to get the next page of results for list requests.
  string next_page_token = 2;
}

message CreateSnapshotRequest {
  // ID of the project to create a snapshot in.
  // To get the project ID, use a [kacho.cloud.iam.v1.ProjectService.List] request.
  string project_id = 1;

  // ID of the source volume to create the snapshot from.
  // To get the volume ID, use a [VolumeService.List] request.
  string source_volume_id = 2;

  // Name of the snapshot.
  string name = 3;

  // Description of the snapshot.
  string description = 4;

  // Resource labels as `key:value` pairs.
  // At most 64 pairs.
  map<string, string> labels = 5;
}

message CreateSnapshotMetadata {
  // ID of the snapshot that is being created.
  string snapshot_id = 1;

  // ID of the source volume used to create this snapshot.
  string source_volume_id = 2;
}

message CopySnapshotRequest {
  // Проект, в котором создаётся копия. Он же обязан быть проектом источника —
  // копия проект не меняет, и расхождение отвергается синхронно.
  //
  // Поле обязательно, хотя выглядит выводимым из источника, и это НЕ избыточность:
  // именно оно — объект вопроса о правах. Право «создать» в Kachō спрашивают у
  // РОДИТЕЛЯ (`editor@project`), пообъектного `v_create` в платформе нет вовсе.
  // Выведи мы проект из источника молча — у края не осталось бы поля, на которое
  // сослаться, и вопрос пришлось бы задать про сам снимок, то есть про чтение.
  string project_id = 6;

  // ID снимка-источника. Копия читает его данные; сам он не меняется.
  string snapshot_id = 1;

  // Зона, в которой создаётся копия. Обязательна и называется вызывающим явно:
  // умолчание «та же зона» превратило бы глагол переноса в дубликатор без
  // предмета, а угадывать целевое размещение за арендатора не наше дело.
  // Существование зоны проверяется у kacho-geo на пути запроса.
  string target_zone_id = 2;

  // Имя копии. Своё, а не унаследованное: имя уникально в пределах проекта, и
  // копия с именем источника не создалась бы вовсе.
  string name = 3;

  // Описание копии.
  string description = 4;

  // Метки копии. Метки источника не наследуются: перенос данных не переносит
  // смысл, который арендатор вложил в метки исходного снимка.
  // At most 64 pairs.
  map<string, string> labels = 5;
}

message CopySnapshotMetadata {
  // ID НОВОГО снимка — того, который создаётся копированием.
  string snapshot_id = 1;

  // ID снимка-источника.
  string source_snapshot_id = 2;
}

message UpdateSnapshotRequest {
  // ID of the Snapshot resource to update.
  // To get the snapshot ID, use a [SnapshotService.List] request.
  string snapshot_id = 1;

  // Field mask that specifies which fields of the Snapshot resource are going to be
  // updated.
  google.protobuf.FieldMask update_mask = 2;

  // Name of the snapshot.
  string name = 3;

  // Description of the snapshot.
  string description = 4;

  // Resource labels as `key:value` pairs.
  //
  // Existing set of `labels` is completely replaced by the provided set.
  // At most 64 pairs.
  map<string, string> labels = 5;
}

message UpdateSnapshotMetadata {
  // ID of the Snapshot resource that is being updated.
  string snapshot_id = 1;
}

message DeleteSnapshotRequest {
  // ID of the snapshot to delete.
  // To get the snapshot ID, use a [SnapshotService.List] request.
  string snapshot_id = 1;
}

message DeleteSnapshotMetadata {
  // ID of the snapshot that is being deleted.
  string snapshot_id = 1;
}

message ListSnapshotOperationsRequest {
  // ID снимка, чьи операции перечисляются.
  string snapshot_id = 1;

  // The maximum number of results per page to return.
  int64 page_size = 2;

  // Page token. To get the next page of results, set [page_token] to the
  // [ListSnapshotOperationsResponse.next_page_token] returned by a previous list request.
  string page_token = 3;
}

message ListSnapshotOperationsResponse {
  // List of operations for the specified snapshot.
  repeated operation.Operation operations = 1;

  // This token allows you to get the next page of results for list requests.
  string next_page_token = 2;
}
