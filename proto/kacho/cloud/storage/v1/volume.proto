syntax = "proto3";

package kacho.cloud.storage.v1;

import "google/protobuf/timestamp.proto";
import "kacho/cloud/reference/reference.proto";
import "kacho/cloud/storage/v1/status_reason.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/storage/v1;storagev1";

// A Volume resource — a zone-level persistent block disk owned by kacho-storage.
//
// Standalone lifecycle: a Volume may live in AVAILABLE indefinitely with zero
// attachments. The guest OS is NOT stored on it (OS is delivered as an OCI image
// on instance boot); a Volume is pure persistent block state.
message Volume {

  enum Status {
    STATUS_UNSPECIFIED = 0;

    // Volume is being created.
    CREATING = 1;

    // Volume is ready and not attached to any instance.
    AVAILABLE = 2;

    // Volume is ready and attached to an instance (derived from attachments).
    IN_USE = 3;

    // Volume is being deleted.
    DELETING = 4;

    // Volume encountered a problem and cannot operate.
    ERROR = 5;

    // Том переезжает на другой класс диска: принят ChangeDiskType, объект у
    // бэкенда переносится. Отдельное состояние заведено потому, что перенос
    // ДЛИТСЯ и наблюдаем: без него том всё это время выглядел бы готовым, а
    // арендатор не отличал бы «класс уже сменился» от «смена идёт». Из
    // MIGRATING том возвращается в AVAILABLE/IN_USE (перенос завершён) либо
    // уходит в ERROR с причиной (перенос отказал) — данные при отказе остаются
    // на исходном классе.
    MIGRATING = 6;
  }

  // ID of the volume. Prefix "vol". Immutable.
  string id = 1;

  // ID of the project that owns the volume. Immutable. Peer-validated against kacho-iam.
  string project_id = 2;

  // Creation timestamp. Truncated to seconds on the wire.
  google.protobuf.Timestamp created_at = 3;

  // Last modification timestamp. Truncated to seconds on the wire.
  google.protobuf.Timestamp updated_at = 4;

  // Name of the volume. 1-63 characters long, lowercase. Unique within
  // (project_id, name) when non-empty.
  string name = 5;

  // Description of the volume. 0-256 characters long.
  string description = 6;

  // Resource labels as `key:value` pairs. Maximum of 64 per resource.
  map<string, string> labels = 7;

  // ID of the availability zone where the volume resides. TEXT reference to
  // kacho-geo (peer-validated, no FK). Immutable.
  string zone_id = 8;

  // ID класса диска. FK на DiskType в своей БД (ON DELETE RESTRICT).
  //
  // Меняется ТОЛЬКО глаголом [VolumeService.ChangeDiskType] и никогда не входит
  // в update_mask: смена класса — перемещение данных, а не правка поля. Через
  // Update поле отвергается как неизменяемое — см. комментарий к этому RPC.
  string disk_type_id = 9;

  // Size of the volume, specified in bytes. Must be > 0. Update — increase only.
  int64 size_bytes = 10;

  // Номер 11 занимало block_size — размер блока тома в байтах.
  //
  // Поле принималось на Create, подставлялось умолчанием, хранилось колонкой и
  // возвращалось в ответе — и НИ ОДИН путь не читал его значение, чтобы что-то
  // сделать иначе. Единственное место логики, где оно упоминалось, — перечень
  // неизменяемых полей маски, то есть охрана величины, которая ни на что не
  // влияла. Арендатор читал назад собственный ввод и принимал зеркало за
  // подтверждение применения: принято-и-проигнорировано — не исход.
  //
  // Из трёх законных исходов выбран третий — снять с контракта: размер блока
  // задаёт бэкенд вместе с классом диска, а не арендатор по каждому тому.
  // Понадобится управление им — это свойство класса, а не поле тома.
  //
  // Ломающее изменение осознанное. Номер и имя закрыты навсегда: слот не
  // переиспользуется, иначе старый клиент, всё ещё шлющий block_size, попал бы
  // в поле с другим смыслом, а его значение прочиталось бы как новое намерение.
  reserved 11;
  reserved "block_size";

  // Фактически занятые байты, наблюдённые у бэкенда (output-only, вход не
  // принимается).
  //
  // Поле НЕ заполняется, когда бэкенд потребление не сообщил, — и тогда оно
  // ОТСУТСТВУЕТ, а не равно нулю. Отсюда `optional`: ноль — это утверждение
  // «том пуст», и на неотвеченном бэкенде такое утверждение было бы ложью,
  // причём ложью правдоподобной — по ней строят биллинг и решают о ресайзе.
  // Отсутствие значения обязано быть представимо отдельно от значения.
  optional int64 used_bytes = 18;

  // ID of the source snapshot the volume was restored from. Optional (empty = a
  // fresh volume). Same-DB FK to Snapshot (ON DELETE SET NULL). Immutable.
  // Mutually exclusive with source_image_id (a volume is seeded from one source).
  string source_snapshot_id = 12;

  // Текущее состояние тома. Отдельной колонкой не хранится — выводится, и у
  // двух групп значений источники РАЗНЫЕ:
  //
  //   AVAILABLE / IN_USE          — из наличия привязки (attachments), поэтому
  //                                 разойтись с состоянием привязки не могут;
  //   CREATING / MIGRATING /      — из расхождения желаемого и наблюдённого:
  //   DELETING / ERROR              наша строка объявила одно, у бэкенда пока
  //                                 (или уже) другое.
  //
  // Разделение названо здесь потому, что оно объясняет, почему статус нельзя
  // выставить запросом: у каждой группы есть свой производитель, и запись
  // «поверх» сделала бы дрейф ненаходимым — ровно то, ради чего желаемое и
  // наблюдённое разведены.
  Status status = 13;

  // Почему том оказался в своём состоянии (output-only). Заполняется у ERROR;
  // в штатных состояниях STATUS_REASON_UNSPECIFIED.
  //
  // Закрытый словарь НАШИХ полос, а не текст бэкенда: свободная строка причины
  // — прямой канал утечки физики (имя пула, координата узла), который гейт
  // двухпроекционности не увидит, потому что перечисляет ИМЕНА полей. См.
  // [StatusReason].
  StatusReason status_reason = 17;

  // ID of the source image the boot volume was materialised from. Optional (empty =
  // a non-boot / snapshot-seeded / fresh volume). Same-DB FK to Image (ON DELETE SET
  // NULL — provenance, NOT a live dependency: deleting the Image clears this lineage
  // but leaves the block data intact). Mutually exclusive with source_snapshot_id.
  // Immutable.
  string source_image_id = 16;

  // Authoritative attach-state of the volume (public, lean projection).
  //
  // НАБОР, а не упорядоченное поле: порядок элементов не значим и не сохраняется,
  // сверять их надо ПО СОСТАВУ, а не по индексу. Клиент, ведущий состояние,
  // обязан моделировать это поле как множество — иначе перестановка прочитается
  // как «первая привязка сменила инстанс, вторая сменила устройство».
  //
  // Сказано явно, потому что умолчание здесь лжёт: и чтение, и поток изменений
  // отдают привязки в УСТОЙЧИВОМ порядке — ради того, чтобы одинаковое состояние
  // давало одинаковую нагрузку и сравнение двух проекций не считало изменением
  // перестановку. Устойчивость там — свойство РЕАЛИЗАЦИИ, а не обещание
  // контракта: полагаться на неё нельзя, и менять её мы вправе без объявления
  // ломающего изменения.
  //
  // Заполняется КАЖДЫМ чтением ресурса (Get, List) и состоянием события в потоке
  // изменений, причём ПОЛНОСТЬЮ — то есть проекции, которая это поле не наполняет
  // или наполняет частично, у Volume нет. Прежде это было верно лишь для тома с
  // одной привязкой: чтение соединяло привязки без агрегации, поэтому Get отдавал
  // одну из многих, а List повторял том по разу на каждую.
  repeated VolumeAttachment attachments = 14;

  // Output-only generic projection of `attachments` for uniform dependents/impact
  // tooling. Same source of truth as `attachments`; not accepted on Create/Update.
  //
  // НАБОР — по тем же основаниям и с той же оговоркой, что у `attachments`:
  // поле выводится из них один к одному, поэтому и порядок наследует их порядок,
  // то есть никакой.
  repeated kacho.cloud.reference.Reference used_by = 15;
}

// VolumeAttachment — the source of truth for a single Volume↔Instance binding.
message VolumeAttachment {

  enum Mode {
    MODE_UNSPECIFIED = 0;

    // Read-write attachment.
    READ_WRITE = 1;

    // Read-only attachment.
    READ_ONLY = 2;
  }

  // ID of the instance the volume is attached to. TEXT, without a cross-service FK
  // (kacho-compute owns Instance).
  string instance_id = 1;

  // Name of the instance at attach time (write-time snapshot; storage never reads
  // it back from compute).
  string instance_name = 2;

  // Name of the guest device. Unique within the instance.
  string device_name = 3;

  // Whether the volume acts as the persistent root overlay (usually false for a
  // data volume).
  bool is_boot = 4;

  // Access mode of the attachment.
  Mode mode = 5;

  // Whether the volume is deleted together with the instance.
  bool auto_delete = 6;

  // Attach timestamp. Truncated to seconds on the wire (truncation applies to the
  // sub-record as well).
  google.protobuf.Timestamp attached_at = 7;
}
