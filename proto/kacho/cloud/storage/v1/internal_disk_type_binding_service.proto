syntax = "proto3";

package kacho.cloud.storage.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/storage/v1;storagev1";

// InternalDiskTypeBindingService — ревизии политики: чем и на каких условиях
// исполняется класс диска в конкретной зоне. Cluster-internal (порт 9091, mTLS), на
// внешнем TLS-эндпоинте не выставлен ни одним методом (ban #6).
//
// # Несущее свойство: ревизии append-only и НЕИЗМЕНЯЕМЫ
//
// Ревизия — это снимок политики, а не строка справочника. Её содержание — бэкенд,
// локатор, способности, QoS — не правится НИКОГДА и никаким методом: Update у этого
// ресурса нет и быть не должно. Заведение новой ревизии на ту же пару (класс, зона)
// снимает прежнюю с действия (`SUPERSEDED`), но её саму не редактирует.
//
// Механизм здесь именно в отсутствии Update. Ресурс ссылается на ревизию, под
// которой создан, поэтому правка класса физически не может задним числом изменить
// его свойства: том, созданный под ревизией с `multiAttach = false`, остаётся с ней
// даже после того, как администратор объявил классу другую политику. Будь у ревизии
// Update — та же ссылка означала бы «политика на момент чтения», и правка
// справочника молча меняла бы свойства уже созданных ресурсов, включая те, что
// проверялись при их создании.
//
// Отсюда же и запрет удаления: строка живёт, пока на неё ссылается хоть один ресурс
// (FK RESTRICT). Ревизия без ссылок — тоже не мусор: она объясняет, на каких
// условиях создавались ресурсы, которых уже нет.
//
// # Почему запись инфра-чувствительна ЦЕЛИКОМ
//
// Локатор называет пул и единицу изоляции арендатора, способности и QoS вместе с
// бэкендом описывают устройство плоскости данных. На публичный DiskType из ревизии
// проецируются ТОЛЬКО булевы способности и производная формула производительности —
// без имён пулов, шаблонов и координат, и только если бэкенд их действительно
// энфорсит.
//
// # Почему всё синхронно и gRPC-only
//
// Это админ-справочник: за записью ревизии нет длящейся работы, оборачивать её в
// Operation значило бы заставить администратора поллить готовое. REST-привязок нет
// по той же причине, что у реестра бэкендов: потребителя вне кластера у этих
// методов сегодня нет, а объявленный путь без потребителя — поверхность, за которую
// никто не отвечает.
//
// AuthN (mTLS) и AuthZ (per-RPC Check) действуют здесь так же, как на публичном
// листенере. Отношение везде `system_admin` на синглтоне `cluster`: политика
// исполнения не принадлежит ни проекту, ни аккаунту.
service InternalDiskTypeBindingService {
  // Create — заводит новую ревизию политики на пару (класс, зона).
  //
  // `revision` присваивает сервис (следующий номер для этой пары), а не вызывающий:
  // номер, названный клиентом, — это потерянное обновление, когда два
  // администратора называют один и тот же.
  //
  // Прежняя действующая ревизия этой пары переводится в `SUPERSEDED` в той же
  // транзакции. «Ровно одна действующая на пару» держится частичным уникальным
  // индексом `(disk_type_id, zone_id) WHERE status = 'ACTIVE'`, а не проверкой
  // «прочитал — записал»: при двух конкурентных Create одна проходит, вторая
  // получает `ALREADY_EXISTS` от БД, и исход не зависит от планировщика.
  rpc Create(CreateDiskTypeBindingRequest) returns (DiskTypeBinding) {
    option (google.api.http) = {
      post: "/storage/v1/diskTypeBindings"
      body: "*"
    };

    option (kacho.iam.authz.v1.permission)        = "storage.disk_type_bindings.create";
    option (kacho.iam.authz.v1.required_relation) = "system_admin";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Get — возвращает ревизию по id. Отвечает и на вытесненную: ресурсы ссылаются на
  // неё и после вытеснения, значит прочитать её обязано быть можно.
  rpc Get(GetDiskTypeBindingRequest) returns (DiskTypeBinding) {
    option (google.api.http) = {get: "/storage/v1/diskTypeBindings/{disk_type_binding_id}"};

    option (kacho.iam.authz.v1.permission)        = "storage.disk_type_bindings.get";
    option (kacho.iam.authz.v1.required_relation) = "system_admin";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // List — перечисляет ревизии, включая вытесненные: история политики и есть предмет
  // этого ресурса. Курсорная пагинация `(created_at, id)`; `page_size` вне
  // `[0..1000]` отвергается, а не подрезается, мусорный `page_token` —
  // `INVALID_ARGUMENT`.
  rpc List(ListDiskTypeBindingsRequest) returns (ListDiskTypeBindingsResponse) {
    option (google.api.http) = {get: "/storage/v1/diskTypeBindings"};

    option (kacho.iam.authz.v1.permission)        = "storage.disk_type_bindings.list";
    option (kacho.iam.authz.v1.required_relation) = "system_admin";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

// DiskTypeBinding — неизменяемая ревизия политики для пары (класс диска, зона):
// каким бэкендом класс исполняется в этой зоне, где именно лежат объекты, что
// бэкенд умеет и какую производительность обещает.
//
// Ресурс (том, снимок, образ) фиксирует ссылку на действующую ревизию в момент
// своего создания. Ссылка на неизменяемую строку равносильна копии политики, но
// нормализована: джойн не может «уехать», потому что цель не меняется.
message DiskTypeBinding {
  // Полоса действия ревизии. Значений два, и оба — про то, принимает ли ревизия
  // НОВЫЕ ресурсы; на уже созданные полоса не влияет никак.
  enum Status {
    STATUS_UNSPECIFIED = 0;

    // Действующая ревизия пары (класс, зона). Такая ровно одна — частичный
    // уникальный индекс.
    ACTIVE = 1;

    // Вытеснена новой ревизией той же пары. Новые ресурсы
    // на неё не ссылаются, существующие ссылаются и дальше.
    SUPERSEDED = 2;
  }

  // ID ревизии. Префикс `dtb-` (дефисный канон), присваивается на Create,
  // неизменяем.
  string id = 1;

  // ID класса диска. FK на DiskType в своей БД (ON DELETE RESTRICT).
  string disk_type_id = 2;

  // ID зоны. Ссылка на kacho-geo (TEXT, без FK), валидируется peer-вызовом на пути
  // запроса.
  string zone_id = 3;

  // ID бэкенда, исполняющего эту ревизию. FK на StorageBackend в своей БД
  // (ON DELETE RESTRICT).
  string backend_id = 4;

  // Номер ревизии в пределах пары (класс, зона), начиная с 1. Присваивается
  // сервисом. Существует ради читаемости истории: по нему видно порядок, не сверяя
  // отметки времени.
  int32 revision = 5;

  // Где у бэкенда лежат объекты этой ревизии. Инфра-чувствительно.
  BackendLocator locator = 6;

  // Что бэкенд умеет под этой ревизией. Из способностей выводятся отказы
  // публичных путей — см. [BindingCapabilities].
  BindingCapabilities capabilities = 7;

  // Обещание производительности. Блок ОТСУТСТВУЕТ целиком, если бэкенд QoS не
  // энфорсит: пустой блок с нулями читался бы как «производительность нулевая», а
  // отсутствие обязано быть представимо отдельно от значения.
  BindingQoS qos = 8;

  // Полоса действия ревизии.
  Status status = 9;

  // Отметка создания. Усечена до секунд на проводе. Отметки изменения у ревизии нет
  // и не может быть: строка не меняется.
  google.protobuf.Timestamp created_at = 10;
}

// BackendLocator — координата объектов ревизии у бэкенда. Инфра-чувствительно
// целиком: ни одно из этих полей не проецируется на публичную поверхность.
message BackendLocator {
  // Пул бэкенда, в котором лежат объекты ресурсов этой ревизии.
  string pool = 1;

  // Шаблон единицы изоляции арендатора, подставляется идентификатором проекта.
  //
  // Хранится ШАБЛОНОМ, а не готовым значением, потому что изоляция вычисляется на
  // каждый ресурс: одна ревизия обслуживает все проекты, а разделяет их именно эта
  // подстановка. Готовое значение означало бы ревизию на проект — и ту же политику,
  // размноженную столько раз, сколько у нас арендаторов.
  string namespace_template = 2;
}

// BindingCapabilities — что бэкенд умеет под этой ревизией.
//
// Это не декларация вежливости, а предикаты, из которых выводятся отказы публичных
// путей: способность, объявленная шире фактической, превращается в отказ бэкенда
// ПОСЛЕ нашего успеха — арендатор получил Operation, а результата не будет.
// Способности объявляются по ответам команды бэкенда, а не по нашим ожиданиям.
message BindingCapabilities {
  // Снимки поддерживаются. `false` → Snapshot.Create отвергается
  // `FAILED_PRECONDITION`.
  bool snapshots = 1;

  // Том можно засеять из снимка. `false` → засев из снимка отвергается тем же тоном.
  bool clone_from_snapshot = 2;

  // Загрузочный том можно материализовать из образа. `false` → засев из образа
  // отвергается тем же тоном.
  //
  // Поле объявлено здесь потому, что у публичного `DiskType.Capabilities` есть
  // одноимённое, и оно output-only: класс выводит способности ПЕРЕСЕЧЕНИЕМ
  // действующих ревизий. Без источника на ревизии публичная способность оказалась бы
  // полем, которое некому произвести, — то есть утверждением о классе, не опирающимся
  // ни на что.
  bool clone_from_image = 8;

  // Клон остаётся зависим от родителя (clone v2: родитель освобождается только
  // после отвязки детей).
  //
  // `true` меняет семантику удаления ИСТОЧНИКА: наша строка обнулила бы ссылку
  // происхождения, а у бэкенда родитель продолжал бы занимать место. Поэтому
  // удаление источника с живыми детьми отвергается, пока дети не отвязаны. Это
  // поведение ВЫВОДИТСЯ из способности, а не выбирается нами.
  bool clone_keeps_parent = 3;

  // Расширение без отвязки. `false` → увеличение размера требует отсутствия
  // привязок.
  bool online_grow = 4;

  // Одновременная привязка к нескольким машинам. `false` → вторая привязка
  // отвергается; предикат читается прямо в CAS вставки привязки, а не проверкой
  // «прочитал — записал».
  bool multi_attach = 5;

  // Шифрование на носителе. `false` → класс не публикует шифрование: обещать его
  // без энфорсмента бэкендом значит соврать в самой чувствительной точке.
  bool encryption_at_rest = 6;

  // Задержка освобождения ёмкости после удаления, в секундах. `0` — освобождается
  // сразу.
  //
  // Значение больше нуля учитывается в потреблении проекта: удалённый ресурс ещё
  // занимает место, и не сказать об этом значит показать потребление меньше
  // фактического — ровно в тот момент, когда арендатор удаляет, чтобы освободить.
  int64 trash_ttl_seconds = 7;
}

// BindingQoS — обещание производительности как ФОРМУЛА, а не константа.
//
// Действующее значение — `baseline + за_гиб × размер`, ограниченное сверху `max`.
// Константа лгала бы на краях диапазона: один и тот же класс на 10 ГиБ и на 10 ТиБ
// не даёт одинаковых чисел ни у одного провайдера, а опубликованная константа
// становится либо недостижимым обещанием на малом томе, либо занижением на большом.
message BindingQoS {
  // Базовые IOPS, независимо от размера.
  int64 baseline_iops = 1;

  // Добавка IOPS на каждый ГиБ размера.
  int64 iops_per_gib = 2;

  // Потолок IOPS: выше него формула не поднимается.
  int64 max_iops = 3;

  // Базовая полоса, МиБ/с.
  int64 baseline_throughput_mibps = 4;

  // Добавка полосы на каждый ГиБ размера, МиБ/с.
  //
  // Единственное дробное поле блока, и это не небрежность: коэффициент за гибибайт
  // дробен по природе (0.5 МиБ/с на ГиБ — обычная величина). Целочисленное поле с
  // этим именем округлило бы такой коэффициент до нуля, то есть молча отменило бы
  // формулу, оставив только базовую полосу.
  double throughput_per_gib_mibps = 5;

  // Потолок полосы, МиБ/с.
  int64 max_throughput_mibps = 6;
}

message CreateDiskTypeBindingRequest {
  // ID класса диска, для которого заводится ревизия.
  string disk_type_id = 1;

  // ID зоны. Обязана входить в список обслуживаемых зон бэкенда.
  string zone_id = 2;

  // ID бэкенда. Бэкенд в `DRAINING`/`DISABLED` новых ревизий не принимает — в этом
  // и состоит смысл `DRAINING`.
  string backend_id = 3;

  // Координата объектов у бэкенда.
  BackendLocator locator = 4;

  // Способности бэкенда под этой ревизией.
  BindingCapabilities capabilities = 5;

  // Обещание производительности. Опускается целиком, если бэкенд QoS не энфорсит.
  BindingQoS qos = 6;
}

message GetDiskTypeBindingRequest {
  // ID ревизии, о которой спрашивают.
  string disk_type_binding_id = 1;
}

message ListDiskTypeBindingsRequest {
  // Максимальное число записей на странице.
  int64 page_size = 1;

  // Курсор страницы: значение [ListDiskTypeBindingsResponse.next_page_token] из
  // предыдущего ответа.
  string page_token = 2;
}

message ListDiskTypeBindingsResponse {
  // Страница ревизий, включая вытесненные.
  repeated DiskTypeBinding disk_type_bindings = 1;

  // Курсор следующей страницы. Пуст, когда страница последняя.
  string next_page_token = 2;
}

