syntax = "proto3";

package kacho.cloud.storage.v1;

import "google/protobuf/timestamp.proto";
import "kacho/cloud/storage/v1/image.proto";
import "kacho/cloud/storage/v1/status_reason.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/storage/v1;storagev1";

// InternalImageService — cluster-internal RPC (port 9091; ban #6), reachable ONLY on
// the internal listener over mTLS, NOT on the external TLS endpoint.
//
// Несёт две вещи, которых на публичной поверхности нет и не будет: инфра-проекцию
// образа и регистрацию образа, внесённого в хранилище провайдером.
//
// Сервис gRPC-only: google.api.http не объявляется НИ У ОДНОГО его RPC, поэтому на
// краю у него нет маршрута — ни на публичном мультиплексоре, ни на внутреннем. AuthN
// (mTLS) и per-RPC authZ действуют и здесь: внутренний периметр не доверенный.
service InternalImageService {
  // GetInternal — полная (инфра) проекция образа, только внутри кластера.
  rpc GetInternal(GetInternalImageRequest) returns (ImageInternal) {
    option (kacho.iam.authz.v1.permission)        = "storage.images.getInternal";
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "storage_image"
      from_request_field: "image_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Register — регистрация образа, внесённого в хранилище командой провайдера.
  //
  // Метод обязан существовать, и причина не в удобстве. Единственный источник ОС для
  // машины — storage-образ, а публичный ImageService.Create делает образ ТОЛЬКО из
  // тома или снимка. На чистой установке нет ни того, ни другого, поэтому без
  // регистрации первая машина не запускается by construction.
  //
  // Блоб-конвейера у нас нет и он не проектируется: байты вносит команда провайдера
  // вне облака, облако регистрирует handle уже лежащего объекта.
  //
  // Синхронный и отдаёт ресурс, а не Operation: за регистрацией нет длящейся работы —
  // это запись строки о том, что у бэкенда уже есть. Оборачивать её в операцию значило
  // бы заставить администратора поллить готовое.
  //
  // system_admin @ cluster: образ вносит оператор установки, а не арендатор. Отношение
  // взято уровнем кластера намеренно — предмет регистрации появляется ДО того, как у
  // него есть собственный объект, про который можно спросить.
  rpc Register(RegisterImageRequest) returns (Image) {
    option (kacho.iam.authz.v1.permission)        = "storage.images.register";
    option (kacho.iam.authz.v1.required_relation) = "system_admin";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetInternalImageRequest {
  // ID of the image to return the internal projection for.
  string image_id = 1;
}

// RegisterImageRequest — handle уже внесённого объекта плюс то, что облако о нём
// обязано знать. Байты через этот запрос не проходят.
message RegisterImageRequest {
  // ID проекта, которому принадлежит образ. Peer-валидируется у kacho-iam.
  string project_id = 1;

  // ID региона, в котором образ доступен (REGIONAL/anycast). Peer-валидируется у
  // kacho-geo.
  string region_id = 2;

  // Имя образа. Границы те же, что у публичного Create: у зарегистрированного и у
  // созданного образа один контракт имени, иначе арендатор увидел бы два разных
  // правила на одном поле.
  string name = 3;

  // Описание образа.
  string description = 4;

  // Resource labels as `key:value` pairs.
  // At most 64 pairs.
  map<string, string> labels = 5;

  // Имя объекта у бэкенда — тот самый handle, ради которого метод существует.
  //
  // ЕДИНСТВЕННОЕ место контракта, где имя объекта приходит извне. На всех прочих путях
  // адаптер выводит его сам (префикс установки + наш id) и из запроса не принимает —
  // принимая, он позволил бы вызывающему адресовать чужой объект. Здесь выводить не из
  // чего: объект внесён ДО того, как у облака появилась строка, и его имя — факт, а не
  // наше решение.
  string backend_object = 6;

  // Виртуальный размер образа в байтах.
  int64 size_bytes = 7;

  // Минимальный размер принимающего загрузочного тома в байтах. Том меньше этого числа
  // образом не засевается.
  //
  // Оба числа называет регистрирующий: у зарегистрированного образа источника внутри
  // облака нет, выводить их не из чего.
  int64 min_disk_bytes = 8;
}

// ImageInternal — инфра-проекция образа: то, чего на публичном Image нет и не будет
// (ban #6 + инфра-чувствительные данные). Живёт ТОЛЬКО на внутреннем листенере.
//
// Разделение не косметическое: по имени объекта у бэкенда и по ревизии привязки
// картируется раскладка хранилища. Арендатору адресовано «намерение и исход», оператору
// — где это лежит и что об этом видно.
message ImageInternal {
  // Наблюдаемое состояние объекта у бэкенда — то, что сверщик УВИДЕЛ, а не то, что мы
  // заказывали.
  //
  // Отдельно от Image.Status намеренно: пока желаемое и наблюдаемое — две величины,
  // дрейф между нашей строкой и хранилищем находим. Свести их в одну колонку значит
  // сделать расхождение невидимым by construction.
  enum ObservedState {
    // Сверки ещё не было: observed_at пуст. Отличимо от ABSENT — «не смотрели» и
    // «смотрели и не нашли» требуют разных действий оператора.
    OBSERVED_STATE_UNSPECIFIED = 0;

    // Объекта у бэкенда нет.
    ABSENT = 1;

    // Объект есть и пригоден к засеву тома.
    READY = 2;
  }

  // Публичная проекция образа.
  Image image = 1;

  // ID неизменяемой ревизии привязки, под которой лежит объект образа: локатор
  // (бэкенд, пул, namespace) читается из неё, а не из справочника классов. Поэтому
  // правка справочника не может задним числом переселить уже внесённый объект.
  string binding_id = 2;

  // Имя объекта у бэкенда — координата, по которой образ находится в хранилище.
  string backend_object = 3;

  // Что сверщик увидел у бэкенда в последний раз.
  ObservedState observed_state = 4;

  // Когда сверщик смотрел на объект в последний раз. Пусто — не смотрел ни разу.
  // Усечено до секунд, как и прочие метки времени на wire.
  google.protobuf.Timestamp observed_at = 5;

  // Причина НАБЛЮДЁННОГО состояния: чем закончилась последняя сверка.
  //
  // Это не дубль причины у вложенного Image: та объясняет арендатору состояние
  // РЕСУРСА, эта — оператору исход последней сверки. Расходятся они ровно в момент
  // дрейфа, ради обнаружения которого проекция и заведена.
  StatusReason status_reason = 6;

  // Номера 7..15 остаются забронированы под инфра-поля data-plane — как и было до
  // этого изменения (`reserved 2 to 15`). Занять их полем можно, сняв номер отсюда;
  // молча — нельзя.
  //
  // Бронь здесь — НЕ надгробие снятому полю: поля с номерами 2..15 в этом сообщении
  // не существовало НИ РАЗУ за всю его историю (проверено по каждой ревизии файла),
  // поэтому старый клиент этих номеров не шлёт и переиспользование 2..6 под
  // наблюдаемые поля выше безопасно на wire. Именно ради этого номера и держались.
  //
  // Сохранена та часть брони, которую это изменение НЕ израсходовало. Снятие её
  // целиком было бы потерей защиты, за которой никто не следит: 7..15 не занимает
  // ни одно поле, и отличить «номер свободен намеренно» от «номер забыли» стало бы
  // невозможно.
  reserved 7 to 15;
}
