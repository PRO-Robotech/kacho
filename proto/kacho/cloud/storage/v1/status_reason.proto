syntax = "proto3";

package kacho.cloud.storage.v1;

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/storage/v1;storagev1";

// StatusReason — почему ресурс оказался в своём состоянии. Закрытый словарь НАШИХ
// полос, а не таксономия бэкенда.
//
// # Почему закрытый словарь, а не строка
//
// Свободная строка причины — самый прямой канал утечки: в неё естественно попадает
// текст бэкенда целиком (имя пула, координата узла, идентификатор объекта). Гейт
// двухпроекционности перечисляет ИМЕНА полей и такое значение не увидит. Поэтому
// причина перечисляется, а текст к каждому значению берётся из фиксированной
// таблицы на краю.
//
// # Почему НАШИ полосы, а не причины бэкенда
//
// Значения вида POOL_FULL / REPLICA_DEGRADED / OSD_DOWN называют физику и в этом
// словаре невозможны by construction. Арендатору адресовано то, что он может
// изменить своим действием, либо то, что он обязан переждать, — а не устройство
// плоскости данных, которой он не управляет.
enum StatusReason {
  // Причины нет: ресурс в штатном состоянии.
  STATUS_REASON_UNSPECIFIED = 0;

  // Бэкенд не ответил в отведённый срок либо недоступен. Повторяемо: состояние
  // временное, сверщик вернётся к ресурсу.
  BACKEND_UNAVAILABLE = 1;

  // Бэкенд отказал по существу запроса. НЕ повторяемо: идентичный повтор не пройдёт.
  BACKEND_REJECTED = 2;

  // У бэкенда нет места. НЕ повторяемо без вмешательства оператора либо
  // высвобождения ёмкости.
  BACKEND_CAPACITY_EXHAUSTED = 3;

  // Источник (снимок либо образ) не готов к засеву.
  SOURCE_NOT_READY = 4;

  // Состояние ресурса не позволяет запрошенное действие.
  PRECONDITION_FAILED = 5;

  // Внутренняя ошибка. Текст фиксирован и не несёт деталей ни БД, ни бэкенда.
  INTERNAL_ERROR = 6;
}
