syntax = "proto3";

package kacho.cloud.storage.v1;

import "google/protobuf/timestamp.proto";
import "kacho/cloud/reference/reference.proto";
import "kacho/cloud/storage/v1/status_reason.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/storage/v1;storagev1";

// An Image resource — a VM boot image owned by kacho-storage (prefix "img").
//
// A storage Image is the seed for a boot Volume: a Volume with source_image_id set
// is materialised from this Image. Image is a REGIONAL (anycast) resource — it is
// region-scoped (region_id, placement_type == REGIONAL), zone-independent, and a
// ZONAL boot Volume is coherent with it when the volume's zone belongs to the
// image's region.
//
// A storage Image is addressed as a `storage.image` Referrer (orthogonal to a
// registry OCI `registry.image`: the imageKind discriminator keeps a bare image id
// unambiguous between the two owners).
//
// A storage Image is created from EXACTLY ONE source — a Snapshot
// (source_snapshot_id) OR a Volume (source_volume_id). A blank upload (data-plane
// blob pipeline) is deferred and out of scope.
message Image {

  enum Status {
    STATUS_UNSPECIFIED = 0;

    // Image is being created.
    CREATING = 1;

    // Image is ready to seed boot volumes.
    READY = 2;

    // Image is being deleted.
    DELETING = 3;

    // Image encountered a problem and cannot operate.
    ERROR = 4;
  }

  // Placement family of the image. A storage Image is always REGIONAL (anycast).
  enum PlacementType {
    PLACEMENT_TYPE_UNSPECIFIED = 0;

    // Region-scoped, zone-independent (anycast).
    REGIONAL = 1;
  }

  // Image disk format — a native Kachō enum (single-tier default; NOT a foreign
  // format literal). Output-only.
  enum Format {
    FORMAT_UNSPECIFIED = 0;

    // Standard single-tier Kachō image format.
    STANDARD = 1;
  }

  // ID of the image. Prefix "img". Immutable.
  string id = 1;

  // ID of the project that owns the image. Immutable. Peer-validated against kacho-iam.
  string project_id = 2;

  // Creation timestamp. Truncated to seconds on the wire.
  google.protobuf.Timestamp created_at = 3;

  // Last modification timestamp. Truncated to seconds on the wire.
  google.protobuf.Timestamp updated_at = 4;

  // Name of the image. 1-63 characters long, lowercase. Unique within
  // (project_id, name) when non-empty.
  string name = 5;

  // Description of the image. 0-256 characters long.
  string description = 6;

  // Resource labels as `key:value` pairs. Maximum of 64 per resource.
  map<string, string> labels = 7;

  // ID of the region where the image lives (REGIONAL/anycast). TEXT reference to
  // kacho-geo (peer-validated, no FK). Immutable.
  string region_id = 8;

  // Placement family — output-only, always REGIONAL for a storage Image.
  PlacementType placement_type = 9;

  // ID of the source snapshot the image was created from. Same-DB FK to Snapshot
  // (ON DELETE SET NULL, provenance). Mutually exclusive with source_volume_id.
  // Immutable.
  string source_snapshot_id = 10;

  // ID of the source volume the image was created from. Same-DB FK to Volume
  // (ON DELETE SET NULL, provenance). Mutually exclusive with source_snapshot_id.
  // Immutable.
  string source_volume_id = 11;

  // ID of the image this one was COPIED from, set by Copy. A copy's origin is the
  // image it was made from — a third origin kind next to snapshot and volume, and
  // mutually exclusive with both: an image is created from a snapshot or a volume,
  // or copied from another image. Output-only (Create never accepts it), immutable,
  // same-DB FK to Image (ON DELETE SET NULL, provenance).
  //
  // The column has always been written by Copy; until it was surfaced here the
  // tenant had no way to tell where a copy came from, and the domain rule did not
  // recognise it as an origin at all — which made Copy unusable.
  string source_image_id = 18;

  // Virtual disk size of the image, in bytes. Output-only (derived from the source).
  //
  // У зарегистрированного образа (InternalImageService.Register) источника внутри
  // облака нет вовсе, и число приходит от регистрации. Output-only это не отменяет:
  // публичные Create/Update его по-прежнему не принимают.
  int64 size_bytes = 12;

  // Minimum size (in bytes) of a receiving boot Volume. Output-only (derived from
  // the source). Enforced by kacho-storage itself, inside the Volume insert: a
  // Volume with source_image_id set and size_bytes < min_disk_bytes is refused with
  // INVALID_ARGUMENT "Volume size %d is less than image min_disk_bytes %d". The
  // bound is inclusive. An image the caller cannot reach never reports its minimum —
  // it answers with the same "Image <id> not found" a real miss produces.
  //
  // У зарегистрированного образа число приходит от регистрации — по той же причине,
  // что и size_bytes: выводить его не из чего.
  int64 min_disk_bytes = 13;

  // Image disk format. Output-only native Kachō enum.
  Format format = 14;

  // Current status of the image.
  Status status = 15;

  // Почему образ оказался в этом состоянии. Закрытый словарь НАШИХ полос, output-only.
  //
  // Один status на это не отвечает: ERROR не различает «бэкенд не ответил, сверщик
  // вернётся» и «отказал по существу, идентичный повтор не пройдёт», — а арендатор
  // решает по этой разнице, ждать ему или звать оператора. В штатном состоянии
  // значение STATUS_REASON_UNSPECIFIED: причины нет.
  StatusReason status_reason = 16;

  // Тома, засеянные этим образом. Output-only обобщённая проекция; на вход Create /
  // Update не принимается.
  //
  // Нужна ДО удаления, а не после: удаление образа проходит и очищает происхождение
  // засеянных томов (FK ON DELETE SET NULL — блочные данные живут, родословная
  // теряется). Без этого списка арендатор стирает связь, не видя, у скольких томов.
  repeated kacho.cloud.reference.Reference used_by = 17;
}
