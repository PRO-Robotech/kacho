syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/api/annotations.proto";
import "kacho/cloud/quota/v1/quota.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// QuotaService — what this domain's ceilings are and how much of them is spent.
//
// WHY THE TENANT MUST BE ABLE TO READ THIS. Until this service existed the whole
// quota surface was administrative: the ceilings were readable only on the
// internal listener. A tenant meeting `RESOURCE_EXHAUSTED` therefore saw a
// refusal and no way to learn their own ceiling, their own consumption, or who
// states the value — which makes a working limit indistinguishable from a broken
// platform, and turns every exhaustion into a support request.
//
// READ ONLY. There is no Create/Update/Delete here and there will not be: the
// value is administered through `iam.v1.InternalLimitService` under `system_admin`
// on the internal listener. A tenant who can raise their own ceiling does not have
// one.
service QuotaService {
  // List the quotas of one project for THIS domain.
  //
  // NO PAGINATION, DELIBERATELY. The catalogue of kinds is closed and small —
  // eight for this domain — and it is bounded by a migration, not by tenant
  // behaviour. A cursor here would add a failure mode (a tenant reading page two
  // of their eight ceilings) to buy nothing. If a domain ever grows a catalogue
  // that does not fit one answer, that is a contract change with its own
  // acceptance, not a field quietly added here.
  rpc List (ListQuotasRequest) returns (ListQuotasResponse) {
    option (google.api.http) = { get: "/vpc/v1/quotas" };

    // Project-scope Check, the same shape the eight sibling top-level Lists of
    // this domain declare. `viewer` on the project named by the request — NOT a
    // cluster-scoped relation: `viewer @ cluster` is satisfiable by the wildcard
    // tuple the platform writes for its global catalogues, so it would answer
    // "yes" to every authenticated caller, and these numbers are per tenant.
    //
    // Per-object narrowing has no place here either, and the difference is worth
    // stating: a quota row is not an object with an owner, it is a property of the
    // project. There is nothing to narrow — the project either is readable by this
    // caller or it is not, and that is exactly one question.
    option (kacho.iam.authz.v1.permission)        = "vpc.quotas.list";
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

// Request for QuotaService.List.
message ListQuotasRequest {
  // Project whose quotas are read. Required, and the requirement is enforced by
  // the handler as its FIRST statement, not by an annotation: it is both the
  // subject of the answer and the object the authorization Check is made
  // against, so an empty value is not "all projects" — it is an unanswerable
  // question, refused by name with `INVALID_ARGUMENT "project_id: required"`.
  //
  // Left to the edge alone, an empty value would reach a scope extractor that
  // cannot resolve it and come back as an authorization refusal — a statement
  // about permission on a question that was never well-formed.
  string project_id = 1;
}

// Response for QuotaService.List.
message ListQuotasResponse {
  // Every kind this domain counts, always — one row per kind of the catalogue,
  // never a subset and never an empty array.
  //
  // A project that has created nothing reads the full set with `used = 0`. The
  // empty array is reserved for a statement this service never makes: "this
  // project has no quotas". A tenant given `[]` would conclude they are
  // unlimited, and they are not (api-conventions, "an empty value must mean
  // empty").
  repeated kacho.cloud.quota.v1.Quota quotas = 1;
}
