syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/protobuf/timestamp.proto";
import "kacho/cloud/reference/reference.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// An Address resource. For more information, see [Address](https://vpc.kacho.cloud/api/address).
message Address {
  reserved 9 to 14;

  enum Type {
    TYPE_UNSPECIFIED = 0;

    // Internal IP address.
    INTERNAL = 1;

    // Public IP address.
    EXTERNAL = 2;
  }

  enum IpVersion {
    IP_VERSION_UNSPECIFIED = 0;

    // IPv4 address.
    IPV4 = 1;

    // IPv6 address.
    IPV6 = 2;
  }

  // ID of the address. Generated at creation time.
  string id = 1;

  // ID of the project that the address belongs to.
  string project_id = 2;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 3;

  // Name of the address.
  // The name is unique within the project.
  // Value must match the regular expression `[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?` —
  // RFC 1123 DNS label: lowercase letters, digits and hyphens, 1..63 characters.
  // Empty on Create means "server, name it": a name derived from the id is
  // substituted. Empty on Update is rejected — a resource has no nameless state.
  string name = 4;

  // Description of the address. 0-256 characters long.
  string description = 5;

  // Address labels as `key:value` pairs. 
  // No more than 64 per resource. 
  // The maximum string length in characters for each value is 63.
  // Each value must match the regular expression `[-_0-9a-z]*`. 
  // The string length in characters for each key must be 1-63. 
  // Each key must match the regular expression `[a-z][-_0-9a-z]*`.
  map<string, string> labels = 6;

  oneof address {
    // External ipv4 address specification.
    ExternalIpv4Address external_ipv4_address = 7;
    // Internal ipv4 address specification
    InternalIpv4Address internal_ipv4_address = 8;
    // Internal ipv6 address specification (IPv6 vertical).
    InternalIpv6Address internal_ipv6_address = 22;
    // External ipv6 address specification.
    ExternalIpv6Address external_ipv6_address = 23;
  }

  // Whether the address is held by the project in its own right.
  //
  // Reserved means the tenant asked for the address itself, so it outlives every
  // consumer that borrows it and goes away only on an explicit Delete. The
  // opposite is an address allocated as a side effect of creating something else,
  // whose life is tied to that consumer.
  //
  // A freshly created address is reserved. `AddressService.Create` is the tenant
  // asking for an address, and it is the only way an address comes into being on
  // the public surface, so `Create` sets this to true; `reserved` is deliberately
  // absent from `CreateAddressRequest` because there is nothing to choose, not
  // because the value starts out false. The RPC written to undo it says the same
  // from the other side: `InternalAddressService.MarkAddressEphemeralInUse` exists
  // to clear the flag on an address auto-allocated for an interface, which it
  // could not do had `Create` not set it.
  //
  // Giving up the reservation is the tenant's decision and is taken through
  // `AddressService.Update` (`update_mask = "reserved"`).
  //
  // What this flag does NOT do today: nothing consults it. Deletion is gated by
  // `used` and `deletion_protection`, and no reclaimer, sweeper or lease expiry
  // exists in this service — an address survives until someone deletes it whether
  // reserved or not. So `reserved` is a truthful statement of how the address came
  // to be, addressed to the tenant reading it, and not an enforcement point. Do not
  // read it as protection until something enforces it.
  bool reserved = 15;

  // Specifies if address is used or not.
  bool used = 16;

  // Type of the IP address.
  Type type = 17;

  // Version of the IP address.
  IpVersion ip_version = 18;

  // Specifies if address protected from deletion.
  bool deletion_protection = 19;

  // Field 20 held `dns_records`, the output half of a DNS promise this service never
  // kept. Nothing ever wrote it: no handler, use-case or repository referenced the
  // field or its message, so it came back empty on every Get and List while the
  // published documentation told callers it was "reserved, handling deferred". The input half
  // (`dns_record_specs` on Create/Update) is withdrawn in address_service.proto for
  // the same reason, and leaving the output behind would keep advertising records
  // nothing can produce. DNS needs a zone somebody owns, record sets with their own
  // lifecycle, TTL and propagation, and its own authorization — a domain of its own.
  // Withdrawn deliberately; number and name stay shut so the slot cannot return
  // meaning something else.
  reserved 20;
  reserved "dns_records";

  // Resources currently using
  // this address. Output-only — populated by the service on Get/List; ignored
  // on Create/Update. For compute instance NIC/NAT addresses, contains a
  // reference with referrer.type='compute_instance' and referrer.id=<instance_id>.
  // Mirrors the shape of SubnetService UsedAddress.references[].
  repeated kacho.cloud.reference.Reference used_by = 21;

  // 24 держал `apply_state` — состояние применения намерения текущей ревизии.
  //
  // Снято вместе со ВСЕМ швом исполнителя датаплейна (kacho#400): исполнителя не
  // существует, поэтому подтверждения не приходило ни одного, и поле отвечало
  // арендатору «не применено» всегда и на каждом ресурсе. Это обещание
  // возможности, которой нет, — а у такого поля три законных исхода, и здесь
  // верен третий: снять с контракта.
  //
  // Номер И имя зарезервированы намеренно. Вернуть величину можно только вместе
  // с исполнителем, который её производит, — и тогда она заводится заново, под
  // новым номером, а не занимает этот.
  reserved 24;
  reserved "apply_state";
}

message ExternalIpv4Address {
  // Value of address.
  string address = 1;

  // Availability zone from which the address will be allocated.
  string zone_id = 2;

  // Parameters of the allocated address, for example DDoS Protection.
  // 3 — requirements, СНЯТО с контракта вместе с сообщением AddressRequirements.
  //
  // Сообщение несло РОВНО ДВА поля, и оба сняты, поэтому оставлять его значило бы
  // держать пустую разновидность — тот же дефект, что у пустого варианта шлюза.
  //
  // Что было в этих полях:
  //   - защита от распределённых атак: словарь допустимых значений в ОБЩЕМ фундаменте
  //     называл имя конкретного ВНЕШНЕГО поставщика, то есть публичное поле опознавало
  //     конкретную оснастку; при этом ни одна ветвь на значении не ветвилась —
  //     принято-и-проигнорировано;
  //   - возможность исходящей почты: у поля не было ни одного законного непустого
  //     входа (любое непустое значение отвергалось всегда), то есть поле не несло
  //     ничего.
  //
  // Целая подсистема защиты от атак заводится своим доменом со своей приёмкой, а не
  // полем в чужом сообщении. Разрывы объявлены в proto/declared-breaks.yaml.
  reserved 3;
  reserved "requirements";
}

message InternalIpv4Address {
  // Value of address.
  string address = 1;

  oneof scope {
    // Subnet from which the address will be allocated
    string subnet_id = 2;
  }
}

message InternalIpv6Address {
  // Value of address.
  string address = 1;

  oneof scope {
    // Subnet (with a v6_cidr_block) from which the address will be allocated
    string subnet_id = 2;
  }
}

// External IPv6 address. Mirrors ExternalIpv4Address;
// allocated from a global address pool (kind=EXTERNAL_PUBLIC) with an IPv6
// CIDR block via the sparse IPv6 IPAM allocator (counter-based).
message ExternalIpv6Address {
  // Value of address.
  string address = 1;

  // Availability zone from which the address will be allocated.
  string zone_id = 2;

  // Parameters of the allocated address. Same wire shape as for
  // ExternalIpv4Address, even if some attributes are not relevant for v6.
  // 3 — requirements, СНЯТО с контракта вместе с сообщением AddressRequirements.
  //
  // Сообщение несло РОВНО ДВА поля, и оба сняты, поэтому оставлять его значило бы
  // держать пустую разновидность — тот же дефект, что у пустого варианта шлюза.
  //
  // Что было в этих полях:
  //   - защита от распределённых атак: словарь допустимых значений в ОБЩЕМ фундаменте
  //     называл имя конкретного ВНЕШНЕГО поставщика, то есть публичное поле опознавало
  //     конкретную оснастку; при этом ни одна ветвь на значении не ветвилась —
  //     принято-и-проигнорировано;
  //   - возможность исходящей почты: у поля не было ни одного законного непустого
  //     входа (любое непустое значение отвергалось всегда), то есть поле не несло
  //     ничего.
  //
  // Целая подсистема защиты от атак заводится своим доменом со своей приёмкой, а не
  // полем в чужом сообщении. Разрывы объявлены в proto/declared-breaks.yaml.
  reserved 3;
  reserved "requirements";
}


// DnsRecord used to live here, referenced only by the withdrawn `dns_records` field
// above. With that gone nothing referenced it, and keeping it would advertise a shape
// the service has no way to honour.
