syntax = "proto3";

package kacho.cloud.vpc.v1;

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// apply_state.proto — что платформа говорит АРЕНДАТОРУ о применении его
// намерения, и закрытый словарь классов отказа, единый на приём и на выдачу.
//
// # Почему отдельный, НЕЙТРАЛЬНЫЙ файл
//
// Словарь классов был объявлен в файле внутреннего сервиса шва. Оставить его там
// значило бы, что каждое из семи публичных сообщений ресурсов импортирует файл,
// чьё имя называет внутренний сервис, и справочник API арендатора ссылается на
// него на каждом ресурсе. Полное имя типа при переезде не меняется — ни провод,
// ни JSON не затронуты.
//
// # Почему словарь ОДИН, а не два
//
// Второй перечень разошёлся бы с первым молча, и разошёлся бы там, где
// расхождение не видно: класс, добавленный в публичный контракт и забытый в
// проверке приёма, отвергался бы у исполнителя; класс, забытый в публичном, не
// доезжал бы до арендатора. Серверный код это уже знает — его словарь заведён
// единым источником с той же мотивировкой.

// ApplyState — применено ли намерение ТЕКУЩЕЙ ревизии ресурса, и если нет —
// класс причины. Только чтение.
//
// # Почему сообщение, а не два скалярных поля на ресурсе
//
// Различать нужно ТРИ состояния, а не два: «платформа утверждает, что
// применено», «платформа утверждает, что не применено» и «платформа не делает
// утверждения вовсе». У скалярного `bool` третьего представления нет —
// незаполненное и `false` неотличимы по проводу, и «данных нет» немедленно
// стало бы читаться как «не применено». У поля-сообщения присутствие выражает
// третье состояние by construction, и путь, не получивший ответа от проекции,
// отдаёт ПУСТОЕ, а не правдоподобное.
//
// # Чего здесь нет и не появится
//
// Ни ревизии намерения, ни ревизии отчёта, ни времени отчёта, ни имени узла, ни
// кода ядра. Последовательность ревизий одна на весь домен, поэтому номер
// ревизии на объекте одного арендатора есть счётчик мутаций всего облака: два
// чтения с интервалом дали бы темп изменений у всех остальных. Состав заперт
// пробой, падающей на любом третьем поле.
message ApplyState {
  // Намерение текущей ревизии подтверждено исполнителем как применённое.
  //
  // `false` означает «не подтверждено», а не «сломано»: сюда попадает и
  // изменение, до которого исполнитель ещё не дошёл. Что именно — говорит
  // `reason`.
  bool applied = 1;

  // Класс причины отказа. Назван ТОЛЬКО когда исполнитель отчитался отказом
  // именно по текущей ревизии.
  //
  // `APPLY_FAILURE_REASON_UNSPECIFIED` при `applied = false` означает «отказа не
  // было» — намерение в работе, и чинить арендатору нечего.
  ApplyFailureReason reason = 2;
}

// ApplyFailureReason — закрытый словарь классов отказа исполнителя.
//
// Класс, а не текст, — решение о безопасности, а не об удобстве: свободной
// строки в этом контракте нет вовсе, поэтому имя интерфейса на узле, номер порта
// коммутатора или идентификатор туннеля физически нечем сюда положить.
// Арендатору достаётся «не применено» и класс причины; устройство фабрики
// остаётся у фабрики.
enum ApplyFailureReason {
  APPLY_FAILURE_REASON_UNSPECIFIED = 0;

  // Ресурса фабрики не хватило (ёмкость исчерпана).
  APPLY_FAILURE_REASON_CAPACITY = 1;

  // Намерение противоречит уже применённому.
  APPLY_FAILURE_REASON_CONFLICT = 2;

  // Намерение выразимо контрактом, но этой фабрикой не поддерживается.
  APPLY_FAILURE_REASON_UNSUPPORTED = 3;

  // Намерение опирается на объект, которого исполнитель ещё не применил.
  APPLY_FAILURE_REASON_DEPENDENCY_NOT_READY = 4;

  // Временный отказ; исполнитель повторит сам.
  APPLY_FAILURE_REASON_TRANSIENT = 5;

  // Внутренний отказ исполнителя.
  APPLY_FAILURE_REASON_EXECUTOR_INTERNAL = 6;
}
