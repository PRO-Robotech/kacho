syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/protobuf/timestamp.proto";
import "kacho/cloud/reference/reference.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// A NetworkInterface (NIC) resource — самостоятельный сетевой интерфейс
// (first-class, отдельно от Instance). Принадлежит подсети (и транзитивно —
// сети), несет один primary
// private IPv4 (выделяется из CIDR подсети), `security_group_ids`, и может быть
// приаттачен к compute Instance (по `index`). Создается отдельным запросом
// (`NetworkInterfaceService.Create`) либо inline при `Instance.Create`.
//
// Публичная (tenant-facing) проекция — этот message. На уровне proto
// выставляется только она; никакой internal data-plane-проекции NIC нет.
message NetworkInterface {
  // ID интерфейса. Генерируется при создании.
  string id = 1;

  // ID фолдера, которому принадлежит интерфейс.
  string project_id = 2;

  // Имя интерфейса. Уникально в пределах фолдера.
  // Value must match the regular expression `[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?` —
  // RFC 1123 DNS label: lowercase letters, digits and hyphens, 1..63 characters.
  // Empty on Create means "server, name it": a name derived from the id is
  // substituted. Empty on Update is rejected — a resource has no nameless state.
  string name = 4;

  // Описание интерфейса. 0-256 символов.
  string description = 5;

  // Метки `key:value`. Не более 64 на ресурс.
  map<string, string> labels = 6;

  // Время создания.
  google.protobuf.Timestamp created_at = 3;

  // ID подсети, из которой выделен primary-адрес интерфейса.
  string subnet_id = 7;

  // Адреса интерфейса — ССЫЛКИ на Address-ресурсы (internal_ipv4 / internal_ipv6
  // в той же подсети, что и NIC). Единая ресурсная модель: каждый IP — это
  // Address-ресурс (как Network ← Subnet ← Address); NIC «потребляет» их.
  // Чтобы получить сам IP — следовать ссылке. У NIC может быть несколько v4 и v6.
  repeated string v4_address_ids = 16;
  repeated string v6_address_ids = 17;

  reserved 8, 9, 11, 12, 14, 15; // ранее: network_id(8), primary_v4_address(9), instance_id(11), index(12), secondary_v4_addresses(14), v6_addresses(15) — network_id выводится из subnet; instance_id/index → used_by + compute-сторона; raw-IP → *_address_ids

  // ID security-групп, привязанных к интерфейсу. Дефолт при создании —
  // default_security_group_id сети (наследуется); можно переопределить.
  repeated string security_group_ids = 10;

  // Кто использует/приаттачил этот NIC (напр. {type: compute_instance, id: <instance_id>}).
  // Output-only денорм: ставится AttachToInstance, снимается DetachFromInstance —
  // по образцу Address.used_by. Сам index (device-index на инстансе) живет на
  // compute.v1.NetworkInterface.index, не здесь.
  kacho.cloud.reference.Reference used_by = 18;

  // MAC-адрес интерфейса. Output-only. Назначается при NetworkInterfaceService.Create
  // и стабилен на протяжении жизни NIC (Attach/Detach его не меняют). Уникален в
  // пределах всего облака (cloud-wide UNIQUE constraint в БД).
  // Клиент задать MAC не может.
  //
  // Формат — lowercase, colon-separated, всегда 6 октетов. Префикс `0e:`
  // (locally-administered, unicast) зарезервирован под Kachō, остальные 5 байт
  // — `crypto/rand` (40 бит ≈ 1T значений). Пример: `0e:1a:2b:3c:4d:5e`.
  string mac_address = 19;

  // Верхняя граница полосы интерфейса, Мбит/с, заданная АРЕНДАТОРОМ. Ноль —
  // ограничения нет (единственное представление отсутствия).
  //
  // Поле принимается ТОЛЬКО на стенде, чей исполнитель датаплейна объявил умение
  // ограничивать полосу логического порта. Там, где умения нет, непустая величина
  // отвергается синхронно с именем поля и причиной: принять её значило бы отдать
  // арендатору успех на настройке, которая не действует.
  //
  // Промежуток — (гарантированная полоса продукта; гарантия, объявленная этим
  // стендом]. Ниже пола ограничение противоречило бы обещанию платформы «не менее
  // 1 Гбит/с на интерфейс», выше объявленной гарантии — ограничивать нечего.
  // Величина ИЗМЕНЯЕМА: это настройка, а не идентичность.
  int64 bandwidth_limit_mbps = 20;

  // Состояние ПРИВЯЗКИ интерфейса — только чтение.
  //
  // Отвечает ровно на один вопрос: занят интерфейс потребителем или свободен.
  // О том, доехало ли изменение до сети, это поле не говорит НИЧЕГО — и не
  // говорит сегодня НИ ОДНО поле этого контракта: величину, отвечавшую на тот
  // вопрос, сняли вместе с её несуществующим производителем (kacho#400).
  Status status = 13;

  // Status — занят интерфейс потребителем или свободен.
  //
  // Значения перечислены здесь ровно те, у которых есть производитель:
  // `AVAILABLE` ставит создание интерфейса и его отвязка, `ACTIVE` — привязка.
  // Три значения, заявлявшие программирование датаплейна (`PROVISIONING`,
  // `FAILED`, `DELETING`), сняты: их не производил никто. Их предмет —
  // применение намерения — не выражает сегодня НИЧТО: поле, заведённое под
  // него, снято тем же доводом и по тому же признаку (kacho#400). Номера и
  // имена закрыты, чтобы слот не вернулся под другой смысл.
  enum Status {
    reserved 1, 4, 5;
    reserved "PROVISIONING", "FAILED", "DELETING";

    STATUS_UNSPECIFIED = 0;
    // Интерфейс привязан к потребителю (см. `used_by`).
    ACTIVE = 2;
    // Интерфейс создан и не привязан ни к одному потребителю.
    AVAILABLE = 3;
  }

  // 21 держал `apply_state` — состояние применения намерения текущей ревизии.
  //
  // Снято вместе со ВСЕМ швом исполнителя датаплейна (kacho#400): исполнителя не
  // существует, поэтому подтверждения не приходило ни одного, и поле отвечало
  // арендатору «не применено» всегда и на каждом ресурсе. Это обещание
  // возможности, которой нет, — а у такого поля три законных исхода, и здесь
  // верен третий: снять с контракта.
  //
  // Номер И имя зарезервированы намеренно. Вернуть величину можно только вместе
  // с исполнителем, который её производит, — и тогда она заводится заново, под
  // новым номером, а не занимает этот.
  reserved 21;
  reserved "apply_state";
}
