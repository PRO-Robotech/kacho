syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/protobuf/timestamp.proto";
import "kacho/cloud/reference/reference.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

message SecurityGroup {

    // Field 8 (`Status status`) and the nested `enum Status` were
    // removed from the contract (SG has no provisioning lifecycle). Reserved to
    // prevent wire-number / JSON-name reuse.
    reserved 8;
    reserved "status";

    // ID of the security group.
    string id = 1;

    // ID of the project that the security group belongs to.
    string project_id = 2;

    // Creation timestamp in [RFC3339](https://www.ietf.org/rfc/rfc3339.txt) text format.
    google.protobuf.Timestamp created_at = 3;

    // Name of the security group. 
    // The name must be unique within the project. 
    // Value must match the regular expression `[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?` —
    // RFC 1123 DNS label: lowercase letters, digits and hyphens, 1..63 characters.
    // Empty on Create means "server, name it": a name derived from the id is
    // substituted. Empty on Update is rejected — a resource has no nameless state.
    string name = 4;

    // Description of the security group. 0-256 characters long.
    string description = 5;

    // Resource labels as `key:value` pairs. 
    // No more than 64 per resource.
    // The maximum string length in characters for each value is 63. 
    // Each value must match the regular expression `[-_./\\@0-9a-z]*`. 
    // The string length in characters for each key must be 1-63. 
    // Each key must match the regular expression `[a-z][-_./\\@0-9a-z]*`.
    map<string, string> labels = 6;

    // ID of the network that the security group belongs to.
    string network_id = 7;

    // List of the security group rules.
    //
    // Правила только РАЗРЕШАЮЩИЕ, и фильтрация ведётся С УЧЁТОМ СОСТОЯНИЯ: обратный
    // трафик разрешённого соединения проходит сам, зеркальное правило в обратную
    // сторону не нужно.
    //
    // СНЯТИЕ ПРАВИЛА ОБРЫВАЕТ СОЕДИНЕНИЯ, КОТОРЫЕ ИМ РАЗРЕШАЛИСЬ. Пока правило
    // есть, установленное соединение живёт; после снятия его обратный трафик больше
    // ничем не разрешён, и соединение обрывается — оно НЕ доживает до своего
    // закрытия. Обрываются ровно те соединения, которых не разрешает ни одно из
    // ОСТАВШИХСЯ правил: правило, покрывающее тот же трафик шире, их сохраняет.
    //
    // Следствие, которое вызывающий обязан знать ДО правки на живом трафике: снятие
    // правила — это не «новые соединения не пойдут», а разрыв текущих, наблюдаемый
    // клиентами немедленно. Планируйте снятие как изменение с немедленным эффектом,
    // а замену набора целиком (`UpdateSecurityGroupRequest.rule_specs`) — как
    // одновременное снятие всех правил, которых в новом списке нет.
    repeated SecurityGroupRule rules = 9;

    // Flag that indicates that the security group is the default for the network.
    bool default_for_network = 10;

    // Consumers of this security group ("Пользователь" — to whom the
    // SG is attached). Output-only, derived-on-read: network_interface
    // (NIC.security_group_ids contains this SG) + network
    // (default_security_group_id == this SG). NOT rule-references-another-SG.
    repeated kacho.cloud.reference.Reference used_by = 11;

  // 12 держал `apply_state` — состояние применения намерения текущей ревизии.
  //
  // Снято вместе со ВСЕМ швом исполнителя датаплейна (kacho#400): исполнителя не
  // существует, поэтому подтверждения не приходило ни одного, и поле отвечало
  // арендатору «не применено» всегда и на каждом ресурсе. Это обещание
  // возможности, которой нет, — а у такого поля три законных исхода, и здесь
  // верен третий: снять с контракта.
  //
  // Номер И имя зарезервированы намеренно. Вернуть величину можно только вместе
  // с исполнителем, который её производит, — и тогда она заводится заново, под
  // новым номером, а не занимает этот.
  reserved 12;
  reserved "apply_state";
}

message SecurityGroupRule {
    // 10 — predefined_target, СНЯТО с контракта (ветвь `oneof target`).
    //
    // Свободная строка без словаря: платформа не называла ни одного значения,
    // сервис не ветвился ни на одном, и вызывающий не мог узнать, что в ней
    // написать. Ввести закрытый словарь значило бы завести подсистему именованных
    // назначений — она заводится своим доменом со своей приёмкой, а не полем в
    // чужом сообщении.
    //
    // Резервирование стоит НА СООБЩЕНИИ, а не в `oneof`: язык не допускает его
    // внутри `oneof`, а нумерация полей у них общая — значит номер защищён.
    reserved 10;
    reserved "predefined_target";

    // ID of the rule.
    string id = 1; //generated by api server after rule creation

    // Description of the rule. 0-256 characters long.
    string description = 2;

    // Resource labels as `` key:value `` pairs. Maximum of 64 per resource.    
    map<string, string> labels = 3;

    // The direction of network traffic allowed by this rule.
    Direction direction = 4;

    // The range of ports that allow traffic to pass through. Null value means any.
    PortRange ports = 5;

    // Protocol name. Null value means any protocol.
    // Values from [IANA](https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml).
    string protocol_name = 6;

    // Protocol number from [IANA protocol numbers](https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml).
    int64 protocol_number = 7;

    oneof target {
        // Target of the security rule.

        // CIDR blocks to allow to receive or send traffic.
        CidrBlocks cidr_blocks = 8;

        // ID of the security group to add rule to.
        string security_group_id = 9;

        // ID of the CidrGroup whose members this rule allows traffic to or from.
        //
        // The third branch of the target exists so that a list repeated across
        // many rules stops being copied into each of them: the rule names the
        // set, the set is edited once. The group must belong to the same project
        // as the security group, and it must not be empty — an empty referenced
        // set is refused at the door rather than quietly widening or narrowing
        // what the rule allows.
        string cidr_group_id = 11;
    }

    enum Direction {
        DIRECTION_UNSPECIFIED = 0;

        // Allows ingress traffic.
        INGRESS = 1;

        // Allows egress traffic.
        EGRESS = 2;
    }
}

message PortRange {
    // The lowest port in the range.
    int64 from_port = 1;

    // The highest port in the range.
    int64 to_port = 2;
}

message CidrBlocks {
    // IPv4 CIDR blocks to allow traffic to.
    repeated string v4_cidr_blocks = 1;

    // IPv6 CIDR blocks to allow traffic to.
    repeated string v6_cidr_blocks = 2;
}
