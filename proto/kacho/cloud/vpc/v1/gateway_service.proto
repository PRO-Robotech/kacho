syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "kacho/cloud/api/operation.proto";
import "kacho/cloud/operation/operation.proto";
import "kacho/cloud/vpc/v1/gateway.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

service GatewayService {
  // Returns the specified Gateway resource.
  //
  // To get the list of all available Gateway resources, make a [List] request.
  rpc Get (GetGatewayRequest) returns (Gateway) {
    option (google.api.http) = {get: "/vpc/v1/gateways/{gateway_id}"};
    option (kacho.iam.authz.v1.permission)        = "vpc.gateways.get";
    option (kacho.iam.authz.v1.required_relation) = "v_get";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_gateway"
      from_request_field: "gateway_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Retrieves the list of Gateway resources in the specified project.
  rpc List (ListGatewaysRequest) returns (ListGatewaysResponse) {
    option (google.api.http) = {get: "/vpc/v1/gateways"};
    option (kacho.iam.authz.v1.permission)        = "vpc.gateways.list";
    // Top-level List is gated by the READ TIER on the parent project, not by the
    // project's own `v_list` verb. In the model those are independent sets, and
    // `project#v_list` means object-level access to the PROJECT ITSELF — the model
    // says of the `v_*` set "never to its contents" — so it answers a different
    // question than "may this subject list what is inside". The tier is the same
    // axis Create already takes here (`editor`), and the same convention the
    // storage/iam project-scoped List RPCs carry. Rows stay narrowed per object by
    // the owning service's list filter; this option only decides who may ask.
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Creates a gateway in the specified project.
  rpc Create (CreateGatewayRequest) returns (operation.Operation) {
    option (google.api.http) = {post: "/vpc/v1/gateways" body: "*"};
    option (kacho.cloud.api.operation) = {
      metadata: "CreateGatewayMetadata"
      response: "Gateway"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.gateways.create";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  };

  // Updates the specified gateway.
  rpc Update (UpdateGatewayRequest) returns (operation.Operation) {
    option (google.api.http) = {patch: "/vpc/v1/gateways/{gateway_id}" body: "*"};
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateGatewayMetadata"
      response: "Gateway"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.gateways.update";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_gateway"
      from_request_field: "gateway_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  };

  // Deletes the specified gateway.
  rpc Delete (DeleteGatewayRequest) returns (operation.Operation) {
    option (google.api.http) = {delete: "/vpc/v1/gateways/{gateway_id}"};
    option (kacho.cloud.api.operation) = {
      metadata: "DeleteGatewayMetadata"
      response: "google.protobuf.Empty"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.gateways.delete";
    option (kacho.iam.authz.v1.required_relation) = "v_delete";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_gateway"
      from_request_field: "gateway_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  };

  // List operations for the specified gateway.
  rpc ListOperations (ListGatewayOperationsRequest) returns (ListGatewayOperationsResponse) {
    option (google.api.http) = {get: "/vpc/v1/gateways/{gateway_id}/operations"};
    option (kacho.iam.authz.v1.permission)        = "vpc.gateway_operations.listOperations";
    option (kacho.iam.authz.v1.required_relation) = "v_list";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_gateway"
      from_request_field: "gateway_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetGatewayRequest {
  // ID of the Gateway resource to return.
  //
  // To get Gateway resource ID make a [GatewayService.List] request.
  string gateway_id = 1;
}

message ListGatewaysRequest {
  // ID of the project to list gateways in.
  //
  // To get the project ID use a [kacho.cloud.iam.v1.ProjectService.List] request.
  string project_id = 1;

  // The maximum number of results per page to return. If the number of available
  // results is larger than `page_size`, the service returns a [ListGatewaysResponse.next_page_token]
  // that can be used to get the next page of results in subsequent list requests.
  // Default value: 100.
  int64 page_size = 2;

  // Page token. To get the next page of results, set `page_token` to the
  // [ListGatewaysResponse.next_page_token] returned by a previous list request.
  string page_token = 3;

  // A filter expression that filters Gateway listed in the response.
  //
  // The expression must specify:
  // 1. The field name. Currently you can use filtering only on [Gateway.name] field.
  // 2. An `=` operator.
  // 3. The value in double quotes (`"`). The value is compared to the resource
  //    name as-is, so only a value in the name form can match anything:
  //    `[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?`. Beyond that, the filter refuses a
  //    value longer than 256 characters, or one containing a NUL character,
  //    with INVALID_ARGUMENT naming the field and the rule. It applies no
  //    alphabet rule of its own: filterable fields elsewhere hold identifiers
  //    and enum spellings, not names.
  // Example of a filter: `name=my-gateway`.
  string filter = 4;
}

message ListGatewaysResponse {
  // List of gateways.
  repeated Gateway gateways = 1;

  // Token for getting the next page of the list. If the number of results is greater than
  // the specified [ListGatewaysRequest.page_size], use `next_page_token` as the value
  // for the [ListGatewaysRequest.page_token] parameter in the next list request.
  //
  // Each subsequent page will have its own `next_page_token` to continue paging through the results.
  string next_page_token = 2;
}

message ListGatewayOperationsRequest {
  // ID of the gateway to list operations for.
  //
  // To get a gateway ID make a [GatewayService.List] request.
  string gateway_id = 1;

  // The maximum number of results per page to return. If the number of available
  // results is larger than [page_size], the service returns a [ListGatewayOperationsResponse.next_page_token]
  // that can be used to get the next page of results in subsequent list requests.
  // Default value: 100.
  int64 page_size = 2;

  // Page token. To get the next page of results, set [page_token] to the
  // [ListGatewayOperationsResponse.next_page_token] returned by a previous list request.
  string page_token = 3;
}

message ListGatewayOperationsResponse {
  // List of operations for the specified gateway.
  repeated operation.Operation operations = 1;

  // Token for getting the next page of the list. If the number of results is greater than
  // the specified [ListGatewayOperationsRequest.page_size], use `next_page_token` as the value
  // for the [ListGatewayOperationsRequest.page_token] parameter in the next list request.
  //
  // Each subsequent page will have its own `next_page_token` to continue paging through the results.
  string next_page_token = 2;
}

// Specification of a public IPv4 egress-translation gateway. Carries no
// parameter: choosing the arm IS the specification. See [NatGateway].
//
// In particular it carries no address: the external address is allocated by the
// service from the pool of the anchor subnet's zone, and its ID comes back in
// [NatGateway.address_id]. Naming an address of one's own is not accepted here —
// an input the service does not read would be worse than its absence — and the
// zone is not accepted either, since it is inherited from the anchor subnet and
// a second way to state it could only disagree with the first.
message NatGatewaySpec {
}

// Specification of an IPv6 egress-only gateway. Carries no parameter — no public
// address is allocated, which is the point of the arm. See [EgressOnlyGateway].
message EgressOnlyGatewaySpec {
}

message CreateGatewayRequest {
  // ID of the project to create a gateway in.
  //
  // To get a project ID make a [kacho.cloud.iam.v1.ProjectService.List] request.
  string project_id = 1;

  // Name of the gateway.
  // The name must be unique within the project.
  string name = 2;

  // Description of the gateway.
  string description = 3;

  // Gateway labels as `key:value` pairs.
  map<string, string> labels = 4;

  // ID of the subnet to attach the gateway to. Required — it is both the
  // gateway's binding and its placement anchor (see [Gateway.subnet_id]).
  // Immutable after creation.
  //
  // The subnet must belong to the same project as the gateway (a subnet of
  // another project answers as absent) and must carry a CIDR block of the family
  // the chosen arm serves.
  string subnet_id = 6;

  // What the gateway does. Required — a gateway with no arm has no behaviour to
  // create, and an omitted arm is refused synchronously with INVALID_ARGUMENT
  // naming `gateway`. Immutable after creation.
  oneof gateway {
    // Public egress translation for IPv4.
    NatGatewaySpec nat_gateway_spec = 7;

    // Egress-only reachability for IPv6.
    EgressOnlyGatewaySpec egress_only_gateway_spec = 8;
  }

  // 5 held `shared_egress_gateway_spec` — the single previous arm, whose message
  // carried no field. Replaced by the two arms above, which are answerable for
  // what they claim (family of the anchor subnet, family of the routes that may
  // name the gateway).
  reserved 5;
  reserved "shared_egress_gateway_spec";
}

message CreateGatewayMetadata {
  // ID of the gateway that is being created.
  string gateway_id = 1;
}

message UpdateGatewayRequest {
  // ID of the gateway to update.
  //
  // To get the gateway ID make a [GatewayService.List] request.
  string gateway_id = 1;

  // Field mask that specifies which attributes of the Gateway should be updated.
  google.protobuf.FieldMask update_mask = 2;

  // New name for the gateway.
  // The name must be unique within the project.
  string name = 3;

  // New description of the gateway.
  string description = 4;

  // Gateway labels as `key:value` pairs.
  //
  // Existing set of labels is completely replaced by the provided set, so if you just want
  // to add or remove a label:
  // 1. Get the current set of labels with a [GatewayService.Get] request.
  // 2. Add or remove a label in this set.
  // 3. Send the new set in this field.
  map<string, string> labels = 5;

  // 6 held `shared_egress_gateway_spec`, an arm of a `gateway` oneof on the
  // UPDATE request. The kind of a gateway is chosen at creation time and is
  // immutable, so nothing on the update path could ever read it — accepted and
  // ignored is not a lawful outcome, and the number and the name are held here
  // instead. Naming `nat_gateway` / `egress_only_gateway` / `subnet_id` in
  // `update_mask` is refused with INVALID_ARGUMENT
  // "<field> is immutable after Gateway.Create".
  reserved 6;
  reserved "shared_egress_gateway_spec";
}

message UpdateGatewayMetadata {
  // ID of the Gateway that is being updated.
  string gateway_id = 1;
}

message DeleteGatewayRequest {
  // ID of the gateway to delete.
  //
  // To get a gateway ID make a [GatewayService.List] request.
  string gateway_id = 1;
}

message DeleteGatewayMetadata {
  // ID of the gateway that is being deleted.
  string gateway_id = 1;
}
