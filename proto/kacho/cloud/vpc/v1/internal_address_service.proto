syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/protobuf/timestamp.proto";
import "kacho/cloud/operation/operation.proto";
import "kacho/cloud/vpc/v1/address_service.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// InternalAddressService — internal RPC, exposed только на cluster-internal порту
// kacho-vpc (не через api-gateway). Используется kacho-vpc-controllers для
// IP-allocation (IPAM встроен в kacho-vpc) и
// peer-сервисами (kacho-compute) для привязки/отвязки "кто использует адрес"
// (referrer-tracking, surfaced через SubnetService.ListUsedAddresses).
//
// Контракт всех RPC: атомарное выполнение в одной Postgres-tx, идемпотентность
// по `address_id` (повторный вызов на уже-allocated address возвращает existing
// IP без изменений).
service InternalAddressService {
  // AllocateInternalIP резолвит target subnet (через addresses.internal_ipv4.subnet_id),
  // выбирает next-free IPv4 из subnet.v4_cidr_blocks[0], атомарно вставляет в БД
  // под защитой UNIQUE (subnet_id, internal_ip) constraint (миграция 0014).
  // Retry на UNIQUE-violation внутри сервиса; max attempts настраивается deploy-time.
  //
  // Errors:
  //   - NotFound: address или subnet не существует.
  //   - FailedPrecondition: address уже имеет allocated IP (idempotent повтор
  //     возвращает Ok с existing IP без error'а).
  //   - ResourceExhausted: subnet exhausted (нет free IP после max retries).
  rpc AllocateInternalIP(AllocateInternalIPRequest) returns (AllocateIPResponse) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.allocateInternalIp";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "vpc_address"
      from_request_field: "address_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // AllocateInternalIPv6 — как AllocateInternalIP, но для internal_ipv6 Address:
  // резолвит target subnet через addresses.internal_ipv6.subnet_id, выбирает
  // адрес из subnet.v6_cidr_blocks[0] (random-from-prefix + retry на UNIQUE).
  rpc AllocateInternalIPv6(AllocateInternalIPRequest) returns (AllocateIPResponse) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.allocateInternalIpv6";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "vpc_address"
      from_request_field: "address_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // AllocateExternalIP резолвит pool через cascade:
  //   1. address_pool_address_override (если есть) → использовать этот пул.
  //   2. address_pool_network_default (через subnet→network если у Address-а
  //      указан subnet, иначе из умолчания проекта) — этот пул.
  //   3. region default pool (AddressPool.is_default=true в данном region).
  // Атомарно вставляет в БД под защитой UNIQUE (pool_id, external_ip) constraint.
  rpc AllocateExternalIP(AllocateExternalIPRequest) returns (AllocateIPResponse) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.allocateExternalIp";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "vpc_address"
      from_request_field: "address_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // AllocateExternalIPv6 — как AllocateExternalIP, но для external_ipv6 Address:
  // резолвит pool тем же cascade'ом (override → network_default → region default),
  // фильтруя пулы по IPv6-family (kind=EXTERNAL_PUBLIC, v6_cidr_blocks). Выделяет
  // адрес sparse counter-аллокатором (pop released offset → fresh cursor) под
  // защитой UNIQUE (pool_id, ip). Идемпотентно по address_id.
  //
  // Errors:
  //   - NotFound: address не существует.
  //   - FailedPrecondition: у address нет external_ipv6-spec, pool без
  //     v6_cidr_blocks, либо pool исчерпан. Idempotent повтор на уже-allocated
  //     address возвращает Ok с existing IP без error'а.
  rpc AllocateExternalIPv6(AllocateExternalIPRequest) returns (AllocateIPResponse) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.allocateExternalIpv6";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "vpc_address"
      from_request_field: "address_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // SetAddressReference устанавливает (upsert) referrer для адреса — кто его
  // использует. Идемпотентно: повторный вызов с тем же/другим referrer'ом
  // перезаписывает запись. Также выставляет `Address.used = true`. Один
  // referrer на адрес (control-plane модель одна-ВМ↔один-адрес).
  //
  // Errors:
  //   - NotFound: address не существует.
  //   - InvalidArgument: пустой address_id / referrer_type / referrer_id.
  rpc SetAddressReference(SetAddressReferenceRequest) returns (AddressReference) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.setReference";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "vpc_address"
      from_request_field: "address_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // ClearAddressReference удаляет referrer-запись адреса (если есть) и
  // выставляет `Address.used = false`. No-op если referrer'а нет.
  //
  // Errors:
  //   - NotFound: address не существует.
  //   - InvalidArgument: пустой address_id.
  rpc ClearAddressReference(ClearAddressReferenceRequest) returns (ClearAddressReferenceResponse) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.clearReference";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "vpc_address"
      from_request_field: "address_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // GetAddressReference возвращает referrer-запись адреса.
  //
  // Errors:
  //   - NotFound: address не существует ИЛИ у него нет referrer'а.
  //   - InvalidArgument: пустой address_id.
  rpc GetAddressReference(GetAddressReferenceRequest) returns (AddressReference) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.getReference";
    option (kacho.iam.authz.v1.required_relation) = "v_get";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "vpc_address"
      from_request_field: "address_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // MarkAddressEphemeralInUse атомарно (в одной tx): выставляет
  // `Address.reserved = false`, `Address.used = true` и upsert'ит referrer-row
  // (= SetAddressReference). Используется kacho-compute для эфемерных NIC/NAT
  // Address-ресурсов, которые он сам создал: те создаются через публичный
  // AddressService.Create с `reserved = true`, но для авто-аллоцированного
  // NIC-адреса это неверно — такой адрес НЕ должен быть reserved.
  // Идемпотентно.
  //
  // Errors:
  //   - NotFound: address не существует.
  //   - InvalidArgument: пустой address_id / referrer_type / referrer_id.
  rpc MarkAddressEphemeralInUse(MarkAddressEphemeralInUseRequest) returns (MarkAddressEphemeralInUseResponse) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.markEphemeralInUse";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "vpc_address"
      from_request_field: "address_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // CreateOwnedAddress — создать адрес СРАЗУ привязанным к владельцу: вставка
  // строки, IPAM-аллокация и referrer-запись выполняются в ОДНОЙ writer-TX.
  //
  // ЗАЧЕМ ОТДЕЛЬНЫЙ RPC, А НЕ ПАРА Create + SetAddressReference. Пара делит одно
  // намерение на два запроса, и ВТОРОЙ гейтится на объекте, которого в момент
  // начала операции не существовало: доступ к нему появляется у создателя не
  // мгновенно (owner-tuple материализуется вне мутации), поэтому вызывающий был
  // вынужден крутить ограниченный ретрай и — когда окно шире его бюджета —
  // получал отказ на СВОЙ ЖЕ адрес, выделенный мгновение назад. Замер прогона
  // CI 31002239590: 8 таких отказов на пути создания балансировщика утянули за
  // собой 44 каскадных утверждения (фикстура не получала id, дальше по кейсу всё
  // рушилось). Поднимать бюджет ретрая было бы маскировкой; здесь снимается сама
  // зависимость от окна — второго решения о доступе на свежесозданном объекте
  // больше нет.
  //
  // Право проверяется РОВНО то же, что у публичного `AddressService.Create`:
  // `editor` на project'е из `address.project_id`. Достижимое состояние
  // прежнее — вызывающий и раньше мог создать адрес и привязать его; менялось
  // лишь то, сколько решений о доступе принимается по дороге.
  //
  // Асинхронный, как и публичный Create: возвращает `Operation`, ответом
  // которой служит `Address`. Идемпотентности по имени нет — её обеспечивает
  // UNIQUE(project,name), как и у публичного пути. Отказ на любом шаге
  // откатывает ВСЮ транзакцию, поэтому half-allocated адреса и компенсации у
  // вызывающего больше не существует by construction.
  rpc CreateOwnedAddress(CreateOwnedAddressRequest) returns (operation.Operation) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.createOwned";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "project"
      from_request_field: "address.project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // ReleaseOwnedAddress снимает аренду адреса ПО ПРЕДЪЯВЛЕНИЮ ВЛАДЕНИЯ ею и
  // называет исход ПОЛЕМ ОТВЕТА.
  //
  // ЗАЧЕМ ОТДЕЛЬНЫЙ ГЛАГОЛ, А НЕ ПАРА ClearAddressReference + AddressService.Delete.
  // Пара анкорит право ПООБЪЕКТНО, на самом `vpc_address`. Отказ на пообъектном
  // имени платформа обязана делать неотличимым от отсутствия объекта, иначе по
  // различию ответов устанавливают существование чужих ресурсов. Правило верное и
  // остаётся; следствие у него такое: код ответа владельца НЕ несёт утверждения
  // «аренды нет» — его не несёт и не должен нести. Вызывающий, который выводил
  // «работа сделана» из кода ошибки, строил необратимый шаг на утверждении,
  // которого не делали.
  //
  // Здесь право анкорится на `project` — ТОМ ЖЕ якоре, что у CreateOwnedAddress, —
  // поэтому пообъектной пробы существования у глагола нет вовсе, а вместе с ней
  // нет и полосы скрытия. Неоднозначность устраняется не тем, что её научились
  // различать, а тем, что её больше нечем породить.
  //
  // Принадлежность КОНКРЕТНОЙ аренды решает не отношение вызывающего к адресу, а
  // сверка предъявленной пары (referrer_type, referrer_id) и project_id внутри
  // собственной транзакции vpc — одним стейтментом с проверкой кардинальности.
  // Право звать глагол и право снять ЭТУ аренду — разные вопросы, и второй не
  // решается моделью прав.
  //
  // Синхронный, в отличие от CreateOwnedAddress: исход обязан приехать ПОЛЕМ, а
  // форма Operation унесла бы его за опрос публичного OperationService — то есть
  // за ту самую поверхность, с которой глагол уходит. Отступление от ban #9
  // записано в services/vpc/docs/engineering/architecture/07-known-divergences.md.
  //
  // NOT_FOUND этот глагол НЕ ПРОИЗВОДИТ НИ НА ОДНОМ ВХОДЕ: отсутствие — законный
  // исход, и он назван (ALREADY_RELEASED / ALREADY_DETACHED).
  //
  // Errors:
  //   - InvalidArgument: пустое любое из четырёх полей; негодный address_id.
  //   - FailedPrecondition: аренда принадлежит другому потребителю ЛИБО адрес
  //     принадлежит другому проекту.
  //   - Unavailable: хранилище недоступно (fail-closed — НИКОГДА не успех).
  rpc ReleaseOwnedAddress(ReleaseOwnedAddressRequest) returns (ReleaseOwnedAddressResponse) {
    option (kacho.iam.authz.v1.permission) = "vpc.addresses.releaseOwned";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message AllocateInternalIPRequest {
  string address_id = 1;
}

message AllocateExternalIPRequest {
  string address_id = 1;
}

message AllocateIPResponse {
  // Allocated IPv4 string (e.g. "10.0.0.7" or "203.0.113.42").
  string ip = 1;
  // Resolved pool_id (только для external; для internal — пусто).
  string pool_id = 2;
  // Если true — IP не аллоцирован сейчас, а уже был allocated ранее (idempotency).
  bool already_allocated = 3;
}

// AddressReference — кто использует Address (referrer-tracking).
message AddressReference {
  // ID адреса.
  string address_id = 1;
  // Тип ресурса-владельца, напр. "compute_instance" (расширяемо).
  string referrer_type = 2;
  // ID ресурса-владельца, напр. id ВМ.
  string referrer_id = 3;
  // Имя ресурса-владельца на момент привязки (best-effort; может устареть).
  string referrer_name = 4;
  // Когда привязка установлена.
  google.protobuf.Timestamp attached_at = 5;
  // owned — referrer владеет адресом (lifecycle адреса связан с referrer'ом), а
  // не просто ссылается. true — адрес заказан referrer'ом неявно (release =
  // ClearReference + Delete); false — адрес создан tenant'ом заранее и
  // залинкован (release = только ClearReference, адрес остается).
  bool owned = 6;
}

message SetAddressReferenceRequest {
  string address_id = 1;
  string referrer_type = 2;
  string referrer_id = 3;
  string referrer_name = 4;
  // owned — объявляет владение адресом (см. AddressReference.owned). Default
  // false (link-семантика).
  bool owned = 5;
}

message ClearAddressReferenceRequest {
  string address_id = 1;
}

message ClearAddressReferenceResponse {}

message GetAddressReferenceRequest {
  string address_id = 1;
}

message MarkAddressEphemeralInUseRequest {
  string address_id = 1;
  string referrer_type = 2;
  string referrer_id = 3;
  string referrer_name = 4;
}

message MarkAddressEphemeralInUseResponse {}

// CreateOwnedAddressRequest — публичная форма создания адреса плюс владелец,
// которому он привязывается в той же транзакции.
message CreateOwnedAddressRequest {
  // Тело создания — ТО ЖЕ сообщение, что у публичного `AddressService.Create`.
  // Переиспользуется целиком, а не переписывается полями: иначе внутренний путь
  // тихо разошёлся бы с публичным на первом же новом поле спецификации адреса.
  CreateAddressRequest address = 1;
  // Тип ресурса-владельца, напр. "nlb_network_load_balancer".
  string referrer_type = 2;
  // ID ресурса-владельца.
  string referrer_id = 3;
  // Имя владельца на момент привязки (best-effort зеркало).
  string referrer_name = 4;
  // owned — владелец распоряжается жизненным циклом адреса (release =
  // ClearReference + Delete), а не просто ссылается на него.
  bool owned = 5;
}

// ReleaseOwnedAddressRequest — предъявление владения арендой.
//
// `owned` здесь НЕ передаётся намеренно: ветку «удалить адрес» либо «оставить
// адрес арендатора» выбирает vpc по СВОЕЙ колонке address_references.owned.
// Один ограниченный источник вместо решения, принимаемого потребителем по
// собственной копии признака.
message ReleaseOwnedAddressRequest {
  // Якорь авторизации — тот же, что у CreateOwnedAddress. Required.
  string project_id = 1;
  // Адрес, аренду которого снимают. Required.
  string address_id = 2;
  // Тип потребителя, предъявляющего владение, напр. "nlb_network_load_balancer".
  // Required.
  string referrer_type = 3;
  // ID потребителя. Required.
  string referrer_id = 4;
}

// ReleaseOwnedAddressResponse — ИСХОД НАЗВАН ПОЛЕМ, а не выведен из кода ошибки.
//
// Прецедент в этом же контракте — AllocateIPResponse.already_allocated: повтор
// выражается полем, а не молчаливым «как будто выделили».
message ReleaseOwnedAddressResponse {
  // Исход. У каждого «сделал сейчас» есть свой «сделано ранее»: без этого повтор
  // после DETACHED попал бы в отказ, а отказ на полосе освобождения перманентен и
  // заклинил бы снос потребителя навсегда.
  enum Outcome {
    // Сервер, вернувший это, дефектен: исход обязателен.
    OUTCOME_UNSPECIFIED = 0;
    // ЭТИМ вызовом: ссылка снята, адрес удалён, IP возвращён в свободный список.
    RELEASED = 1;
    // Строки адреса у владельца нет — аренда снята ранее.
    ALREADY_RELEASED = 2;
    // ЭТИМ вызовом: адрес арендатора (owned=false) — ссылка снята, адрес оставлен.
    DETACHED = 3;
    // Адрес есть, ссылки этого потребителя на нём нет — снята ранее.
    ALREADY_DETACHED = 4;
  }
  Outcome outcome = 1;
}
