syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "kacho/cloud/api/operation.proto";
import "kacho/cloud/vpc/v1/cidr_group.proto";
import "kacho/cloud/operation/operation.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// A set of methods for managing CidrGroup resources — named sets of CIDR
// prefixes that security group rules reference instead of copying the list.
service CidrGroupService {
  // Returns the specified CidrGroup resource.
  rpc Get (GetCidrGroupRequest) returns (CidrGroup) {
    option (google.api.http) = { get: "/vpc/v1/cidrGroups/{cidr_group_id}" };
    option (kacho.iam.authz.v1.permission)        = "vpc.cidr_groups.get";
    option (kacho.iam.authz.v1.required_relation) = "v_get";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_cidr_group"
      from_request_field: "cidr_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Retrieves the list of CidrGroup resources in the specified project.
  rpc List (ListCidrGroupsRequest) returns (ListCidrGroupsResponse) {
    option (google.api.http) = { get: "/vpc/v1/cidrGroups" };
    // The page is narrowed per row: kacho-vpc reads it from its own database by
    // cursor and then asks the authorization model about the ids OF THAT PAGE,
    // in batches, on the same relation a single-object read is gated on
    // (`v_get`). The narrowing sits ON TOP of the project-scope Check declared
    // here, and the two are not two opinions on one question: the Check answers
    // "may this caller read THIS PROJECT's groups at all", the narrowing answers
    // "which of them". Drop the Check and a caller holding a per-object grant
    // anywhere may name any project and receive its page — narrowing cannot
    // refuse that, because narrowing is not a refusal.
    //
    // This mirrors the seven sibling top-level Lists of the domain rather than
    // standing alone.
    option (kacho.iam.authz.v1.permission)        = "vpc.cidr_groups.list";
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Creates a CIDR group in the specified project.
  // Method starts an asynchronous operation that can be cancelled while it is in progress.
  rpc Create (CreateCidrGroupRequest) returns (operation.Operation) {
    option (google.api.http) = { post: "/vpc/v1/cidrGroups" body: "*" };
    option (kacho.cloud.api.operation) = {
      metadata: "CreateCidrGroupMetadata"
      response: "CidrGroup"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.cidr_groups.create";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Updates the cosmetic fields of the specified CIDR group — name, description
  // and labels, and nothing else.
  //
  // The MEMBERSHIP is deliberately out of reach here. Replacing a set wholesale
  // means two editors, each sending the full list, and the second silently
  // overwrites the first; the cap would also have to be judged on a difference
  // of two sets rather than on a delta. Membership is edited by the two verbs
  // below, where "add 5 to 62" can be refused naming both the cap and the
  // current size.
  rpc Update (UpdateCidrGroupRequest) returns (operation.Operation) {
    option (google.api.http) = { patch: "/vpc/v1/cidrGroups/{cidr_group_id}" body: "*" };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateCidrGroupMetadata"
      response: "CidrGroup"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.cidr_groups.update";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_cidr_group"
      from_request_field: "cidr_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Adds CIDR block(s) to the group. Idempotent: a block already in the group is
  // a success without change, because the verb is asynchronous and a client that
  // did not learn the outcome must be able to repeat it.
  rpc AddCidrBlocks (AddCidrGroupCidrBlocksRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/vpc/v1/cidrGroups/{cidr_group_id}:add-cidr-blocks"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateCidrGroupMetadata"
      response: "CidrGroup"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.cidr_group_blocks.addCidrBlocks";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_cidr_group"
      from_request_field: "cidr_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Removes CIDR block(s) from the group. Idempotent in the same sense: removing
  // a block that is not a member is a success without change.
  //
  // Emptying a family that a live rule points at is refused
  // (FAILED_PRECONDITION): an empty referenced set would either make the rule
  // vanish or make its filter disappear — the first silently narrows, the second
  // silently widens, and both are a control with a form and no substance.
  rpc RemoveCidrBlocks (RemoveCidrGroupCidrBlocksRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/vpc/v1/cidrGroups/{cidr_group_id}:remove-cidr-blocks"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateCidrGroupMetadata"
      response: "CidrGroup"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.cidr_group_blocks.removeCidrBlocks";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_cidr_group"
      from_request_field: "cidr_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Deletes the specified CIDR group. A group a rule still points at cannot be
  // deleted (FAILED_PRECONDITION); the refusal names how many security groups
  // and rules hold it, never which.
  rpc Delete (DeleteCidrGroupRequest) returns (operation.Operation) {
    option (google.api.http) = { delete: "/vpc/v1/cidrGroups/{cidr_group_id}" };
    option (kacho.cloud.api.operation) = {
      metadata: "DeleteCidrGroupMetadata"
      response: "google.protobuf.Empty"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.cidr_groups.delete";
    option (kacho.iam.authz.v1.required_relation) = "v_delete";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_cidr_group"
      from_request_field: "cidr_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Lists operations for the specified CIDR group.
  rpc ListOperations (ListCidrGroupOperationsRequest) returns (ListCidrGroupOperationsResponse) {
    option (google.api.http) = { get: "/vpc/v1/cidrGroups/{cidr_group_id}/operations" };
    option (kacho.iam.authz.v1.permission)        = "vpc.cidr_group_operations.listOperations";
    option (kacho.iam.authz.v1.required_relation) = "v_list";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_cidr_group"
      from_request_field: "cidr_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetCidrGroupRequest {
  // ID of the CidrGroup resource to return.
  string cidr_group_id = 1;
}

message ListCidrGroupsRequest {
  // ID of the project to list CIDR groups in.
  string project_id = 1;

  // The maximum number of results per page to return. Rejected outside [0..1000]
  // rather than clamped; 0 means the service default.
  int64 page_size = 2;

  // Page token returned by a previous list request.
  string page_token = 3;

  // A filter expression. Filtering is available on [CidrGroup.name].
  string filter = 4;
}

message ListCidrGroupsResponse {
  // List of CidrGroup resources.
  repeated CidrGroup cidr_groups = 1;

  // Token for the next page of results, empty when this page is the last one.
  string next_page_token = 2;
}

message CreateCidrGroupRequest {
  // ID of the project to create the CIDR group in.
  string project_id = 1;

  // Name of the CIDR group. Unique within the project.
  string name = 2;

  // Description of the CIDR group.
  string description = 3;

  // Resource labels as `` key:value `` pairs.
  map<string, string> labels = 4;

  // Initial IPv4 members, canonical network form (host bits zero). At most 64
  // per family — the cap is what the set becomes as a rule size at the executor.
  repeated string v4_cidr_blocks = 5;

  // Initial IPv6 members. Mirror of v4_cidr_blocks.
  repeated string v6_cidr_blocks = 6;
}

message CreateCidrGroupMetadata {
  // ID of the CidrGroup that is being created.
  string cidr_group_id = 1;
}

message UpdateCidrGroupRequest {
  // ID of the CidrGroup resource to update.
  string cidr_group_id = 1;

  // Field mask specifying which fields are updated. Membership fields are not
  // updatable here — use :add-cidr-blocks / :remove-cidr-blocks.
  google.protobuf.FieldMask update_mask = 2;

  // Name of the CIDR group.
  string name = 3;

  // Description of the CIDR group.
  string description = 4;

  // Resource labels as `` key:value `` pairs.
  map<string, string> labels = 5;
}

message UpdateCidrGroupMetadata {
  // ID of the CidrGroup resource that is being updated.
  string cidr_group_id = 1;
}

message AddCidrGroupCidrBlocksRequest {
  // ID of the CidrGroup whose membership is being extended.
  string cidr_group_id = 1;

  // IPv4 block(s) to add, canonical network form (host bits zero).
  repeated string v4_cidr_blocks = 2;

  // IPv6 block(s) to add.
  repeated string v6_cidr_blocks = 3;
}

message RemoveCidrGroupCidrBlocksRequest {
  // ID of the CidrGroup whose membership is being reduced.
  string cidr_group_id = 1;

  // IPv4 block(s) to remove.
  repeated string v4_cidr_blocks = 2;

  // IPv6 block(s) to remove.
  repeated string v6_cidr_blocks = 3;
}

message DeleteCidrGroupRequest {
  // ID of the CidrGroup resource to delete.
  string cidr_group_id = 1;
}

message DeleteCidrGroupMetadata {
  // ID of the CidrGroup that is being deleted.
  string cidr_group_id = 1;
}

message ListCidrGroupOperationsRequest {
  // ID of the CidrGroup resource to list operations for.
  string cidr_group_id = 1;

  // The maximum number of results per page to return.
  int64 page_size = 2;

  // Page token returned by a previous list request.
  string page_token = 3;
}

message ListCidrGroupOperationsResponse {
  // List of operations for the specified CIDR group.
  repeated operation.Operation operations = 1;

  // Token for the next page of results, empty when this page is the last one.
  string next_page_token = 2;
}
