syntax = "proto3";

package kacho.cloud.vpc.v1;

import "kacho/iam/authz/v1/authz_options.proto";
import "kacho/cloud/vpc/v1/address.proto";
import "kacho/cloud/vpc/v1/apply_state.proto";
import "kacho/cloud/vpc/v1/gateway.proto";
import "kacho/cloud/vpc/v1/network.proto";
import "kacho/cloud/vpc/v1/network_interface.proto";
import "kacho/cloud/vpc/v1/route_table.proto";
import "kacho/cloud/vpc/v1/security_group.proto";
import "kacho/cloud/vpc/v1/subnet.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// InternalDataplaneService — шов между control plane и ИСПОЛНИТЕЛЕМ ДАТАПЛЕЙНА.
//
// Cluster-internal (:9091, запрет #6). Ни один метод не публикуется на внешнем
// TLS-эндпоинте и не монтируется на публичный REST-мультиплексор края: поток
// несёт НАМЕРЕНИЕ по всем арендаторам сразу и координату изоляции сети
// (`NetworkIntent.vrf_id`), а это инфра-чувствительные данные.
//
// # Почему имя НЕ `InternalResourceLifecycleService`
//
// В переписи снятой поверхности (`internal/repohygiene/retiredrpcsurface_test.go`)
// стоит `kacho.cloud.vpc.v1.InternalResourceLifecycleService/Subscribe` — мёртвое
// объявление фида ЖИЗНЕННОГО ЦИКЛА (создан / удалён / переехал), снятое за
// отсутствием сервера, клиента и хоть одной неgenerated-ссылки. Запись оставлена
// в силе: здесь другой предмет, и занять снятое имя значило бы вернуть его под
// чужой замысел — ровно то, что надгробие запрещает.
//
// Разница по существу, а не по вкусу: фид жизненного цикла сообщает, ЧТО
// случилось с ресурсом; этот поток отдаёт ЖЕЛАЕМОЕ СОСТОЯНИЕ целиком — с полной
// выдачей от нуля, ревизией на каждом объекте, снятием намерения и отдельным
// исходом «твоя ревизия слишком стара». Событийный фид ни одного из этих
// свойств не несёт.
service InternalDataplaneService {
  // WatchIntent — поток НАМЕРЕНИЯ: полная выдача текущего состояния, затем его
  // изменения.
  //
  // Поток НЕ является источником истины и не претендует им быть: исполнитель,
  // пропустивший сколько угодно изменений, обязан уметь начать с нуля, и
  // `known_revision = 0` — ровно этот вход. Поток, отдающий только изменения,
  // оставил бы пропустившего в рассинхроне навсегда.
  //
  // Разрыв соединения — ШТАТНЫЙ исход, а не ошибка: срок жизни подписки
  // ограничен носителем, и по его истечении поток закрывается без ошибки.
  // Исполнитель переподключается с последней применённой ревизией.
  rpc WatchIntent (WatchIntentRequest) returns (stream WatchIntentResponse) {
    option (kacho.iam.authz.v1.permission) = "vpc.dataplane.watch_intent";
    // system_viewer — read-ярус инфра-поверхности. Отношение НЕ выполнимо
    // подстановочным кортежем (`user:*` его не удовлетворяет), поэтому проверка
    // сужает, а не отвечает «да» каждому аутентифицированному: ровно по этой
    // причине здесь не стоит `viewer` глобального справочника.
    option (kacho.iam.authz.v1.required_relation) = "system_viewer";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // ReportIntentApplied — исполнитель сообщает, что намерение ревизии N
  // применено либо не применено с названным КЛАССОМ причины.
  //
  // Мутация состояния control plane, поэтому admin-ярус: подтверждение решает,
  // что платформа считает применённым, и право его писать не может совпадать с
  // правом читать поток.
  rpc ReportIntentApplied (ReportIntentAppliedRequest) returns (ReportIntentAppliedResponse) {
    option (kacho.iam.authz.v1.permission) = "vpc.dataplane.report_applied";
    option (kacho.iam.authz.v1.required_relation) = "system_admin";
    option (kacho.iam.authz.v1.scope_extractor) = {
      object_type: "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

// WatchIntentRequest — с чего продолжить.
message WatchIntentRequest {
  // Ревизия, до которой исполнитель уже привёл датаплейн.
  //
  // 0 — «состояния у меня нет, отдай полную выдачу». Любое другое значение —
  // продолжение: сервер отдаёт только объекты, чья ревизия больше названной.
  // Ревизия, до которой сервер продолжить не может (её след уже уплотнён),
  // получает в ответ `resync`, а не молчание: потерянное изменение неотличимо
  // от непришедшего, и единственный честный исход — заставить начать сначала.
  //
  // Отрицательное значение отвергается синхронно (`INVALID_ARGUMENT`): ревизии
  // выдаются последовательностью, начинающейся с единицы, и отрицательного
  // номера не существует ни у одного объекта.
  int64 known_revision = 1;
}

// WatchIntentResponse — одно сообщение потока. Ровно один из трёх исходов.
message WatchIntentResponse {
  oneof event {
    // Намерение по одному объекту (объявлено либо снято).
    DataplaneIntent intent = 1;
    // Выдача, начатая этим потоком, доведена до конца.
    IntentStreamSynced synced = 2;
    // Продолжить с названной ревизии невозможно — начинай с полной выдачи.
    IntentResyncRequired resync = 3;
  }
}

// DataplaneIntent — намерение по ОДНОМУ объекту на ОДНОЙ ревизии.
//
// # Тип объекта выражен ветвью `object`, и только ею
//
// Отдельного поля «вид объекта» здесь нет намеренно: вид, названный дважды —
// полем и ветвью, — рано или поздно назовут по-разному, и получатель не сможет
// решить, какому из двух утверждений верить. Ветвь `oneof` уже отвечает на этот
// вопрос однозначно и проверяется системой типов на обоих концах.
message DataplaneIntent {
  // Ревизия НАМЕРЕНИЯ ЭТОГО объекта — монотонно возрастающая величина,
  // выдаваемая платформой на каждое изменение объекта.
  //
  // Ревизия принадлежит ОБЪЕКТУ, а не потоку: по ней исполнитель отличает
  // «применил устаревшее» от «применил новое» и после переподключения знает,
  // с чего продолжить. Величина выдаётся в порядке фиксации транзакций, поэтому
  // «всё, что меньше или равно N, я видел» — верное утверждение, а не надежда.
  int64 revision = 1;

  // Намерение СНЯТО: объекта в control plane больше нет, исполнитель обязан
  // убрать применённое.
  //
  // Тело снятого намерения несёт ТОЛЬКО идентификатор объекта: остальных полей
  // у удалённого ресурса не существует, и досочинять их было бы утверждением о
  // состоянии, которого нет. Идентификатор для адресации достаточен — он
  // неизменяем и глобально уникален (запрет #15).
  bool withdrawn = 2;

  oneof object {
    NetworkIntent network = 10;
    Subnet subnet = 11;
    NetworkInterface network_interface = 12;
    SecurityGroup security_group = 13;
    RouteTable route_table = 14;
    Gateway gateway = 15;
    // Адрес — часть намерения, а не служебная запись: интерфейс несёт ССЫЛКИ
    // на адреса (`v4_address_ids` / `v6_address_ids`), а не сами IP, поэтому без
    // этой ветви исполнителю нечего программировать на интерфейсе.
    Address address = 16;
  }
}

// NetworkIntent — сеть вместе с координатой изоляции.
//
// `vrf_id` живёт ТОЛЬКО здесь и в `InternalNetworkService.GetNetwork` — обе
// поверхности cluster-internal. На публичном `NetworkService` его нет и быть не
// может: по нему опознаётся устройство изоляции датаплейна.
message NetworkIntent {
  // Публичная проекция сети (без инфра-полей).
  Network network = 1;

  // Координата изоляции тенант-домена. Выдаётся один раз на всю жизнь сети и
  // никогда не выдаётся повторно (миграция 0031): исполнитель с отставшей
  // записью иначе применил бы правило к чужой сети.
  uint32 vrf_id = 2;
}

// IntentStreamSynced — выдача, начатая этим потоком, доведена до конца.
//
// Сообщение приходит РОВНО ОДИН РАЗ на поток, после того как отдано всё, что
// было на момент подписки. До него исполнитель держит частичную картину; после
// него — полную на названной ревизии, и, если он подписывался с нуля, вправе
// убрать у себя всё, чего в выдаче не было.
message IntentStreamSynced {
  // Ревизия, на которой выдача сомкнулась.
  int64 revision = 1;
}

// IntentResyncRequired — продолжение невозможно, начинай с полной выдачи.
//
// Отдельный исход, а не молчание и не ошибка: молчание неотличимо от «изменений
// не было», а ошибка транспорта — от сетевого сбоя, после которого клиент
// повторит тот же невозможный запрос.
message IntentResyncRequired {
  ResyncCause cause = 1;
}

// ResyncCause — почему продолжение невозможно. Перечень ЗАКРЫТ: исход, у
// которого нет своей причины, был бы корзиной «прочее», и в неё молча попадала
// бы следующая причина.
enum ResyncCause {
  RESYNC_CAUSE_UNSPECIFIED = 0;

  // След названной ревизии уже уплотнён: снятия намерений старше срока хранения
  // удалены, поэтому «что изменилось с тех пор» на неё больше не отвечается.
  RESYNC_CAUSE_REVISION_TOO_OLD = 1;

  // Исполнитель не успевал забирать, и предел незавершённых сообщений на поток
  // был исчерпан. Отбросить сообщение молча нельзя: потерянное изменение
  // неотличимо от непришедшего.
  RESYNC_CAUSE_STREAM_OVERFLOW = 2;

  // Названная ревизия выше всего, что платформа когда-либо выдавала: такой
  // позиции у неё нет. Молчание здесь было бы худшим исходом из возможных —
  // запрос «что изменилось после несуществующей позиции» отвечается пустотой
  // ВСЕГДА, и исполнитель ждал бы изменений вечно, считая себя в синхроне.
  RESYNC_CAUSE_REVISION_UNKNOWN = 3;
}

// ReportIntentAppliedRequest — подтверждение применения.
//
// Вида объекта здесь нет и не нужно: идентификатор ресурса неизменяем и
// глобально уникален (запрет #15), поэтому он один адресует намерение.
message ReportIntentAppliedRequest {
  // Идентификатор объекта, о котором отчитывается исполнитель.
  string resource_id = 1;

  // Ревизия ТОГО ЖЕ намерения, что было доставлено потоком.
  //
  // Подтверждение старее уже записанного не засчитывается за свежее: иначе
  // отчёт о применении вчерашнего правила выглядел бы как применение
  // сегодняшнего. Ревизия, которой платформа этому объекту не выдавала,
  // отвергается (`FAILED_PRECONDITION`).
  int64 revision = 2;

  // Чем кончилось применение.
  ApplyOutcome outcome = 3;

  // КЛАСС причины отказа. Обязателен при `APPLY_OUTCOME_FAILED` и запрещён при
  // `APPLY_OUTCOME_APPLIED` (иначе успех нёс бы причину неуспеха).
  //
  // Класс, а не текст, — решение о безопасности, а не об удобстве: свободной
  // строки в этом контракте нет вовсе, поэтому имя интерфейса на узле, номер
  // порта коммутатора или идентификатор туннеля физически нечем сюда положить.
  // Арендатору достаётся «не применено» и класс причины; устройство фабрики
  // остаётся у фабрики.
  ApplyFailureReason reason = 4;
}

// ApplyOutcome — чем кончилось применение намерения.
enum ApplyOutcome {
  APPLY_OUTCOME_UNSPECIFIED = 0;
  APPLY_OUTCOME_APPLIED = 1;
  APPLY_OUTCOME_FAILED = 2;
}

// ApplyFailureReason объявлен в `apply_state.proto` — НЕЙТРАЛЬНОМ файле пакета,
// а не здесь. Причина названа там же: словарь у приёма отчёта и у публичной
// проекции ОДИН, и публичным сообщениям семи ресурсов не место в импорте файла,
// чьё имя называет внутренний сервис. Полное имя типа при переезде не менялось.

// ReportIntentAppliedResponse — что платформа записала.
message ReportIntentAppliedResponse {
  // Подтверждение записано. false означает, что оно СТАРЕЕ уже записанного и
  // за свежее не засчитано.
  //
  // Это не ошибка: гонка «применил N, платформа успела выдать N+1» штатна, и
  // отвечать на неё отказом значило бы называть отказом нормальный ход работы.
  bool recorded = 1;

  // Ревизия намерения, действующая у платформы СЕЙЧАС. По ней исполнитель
  // видит, отстал ли он, не дожидаясь следующего сообщения потока.
  int64 current_revision = 2;
}
