syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// A Network resource. For more information, see [Network](https://vpc.kacho.cloud/api/network).
message Network {
  // ID of the network.
  string id = 1;

  // ID of the project that the network belongs to.
  string project_id = 2;

  // Creation timestamp in [RFC3339](https://www.ietf.org/rfc/rfc3339.txt) text format.
  google.protobuf.Timestamp created_at = 3;

  // Name of the network.
  // The name is unique within the project. 
  // Value must match the regular expression `[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?` —
  // RFC 1123 DNS label: lowercase letters, digits and hyphens, 1..63 characters.
  // Empty on Create means "server, name it": a name derived from the id is
  // substituted. Empty on Update is rejected — a resource has no nameless state.
  string name = 4;

  // Optional description of the network. 0-256 characters long.
  string description = 5;

  // Resource labels as `key:value` pairs. 
  // No more than 64 per resource.
  // The maximum string length in characters for each value is 63. 
  // Each value must match the regular expression `[-_0-9a-z]*`.
  // The string length in characters for each key must be 1-63. 
  // Each key must match the regular expression `[a-z][-_0-9a-z]*`.
  map<string, string> labels = 6;

  // ID of default security group for network.
  string default_security_group_id = 7;

  // Declared IPv4 supernet block(s) for the network. Every Subnet.ipv4_cidr_primary
  // must be a subset of one of these blocks. There is no primary at the network
  // level — this is a pure set of supernet blocks. Mutated only via
  // :add-cidr-blocks / :remove-cidr-blocks (immutable through Update).
  //
  // Optional at Create — and the consequence is stated rather than left implied:
  // a network that declares no IPv4 supernet REFUSES IPv4 subnets
  // (INVALID_ARGUMENT), because there is nothing to carve them from. Declare the
  // blocks here or grow them later via :add-cidr-blocks. The constraint above is
  // unconditional: it is never silently skipped for an empty list.
  repeated string ipv4_cidr_blocks = 8;

  // Declared IPv6 supernet block(s) for the network. Mirror of ipv4_cidr_blocks.
  repeated string ipv6_cidr_blocks = 9;

  // ° ID of the system-provisioned default route table, created at Network.Create
  // and auto-associated to every new Subnet of this network. Output-only.
  string default_route_table_id = 10;

  // 11 держал `apply_state` — состояние применения намерения текущей ревизии.
  //
  // Снято вместе со ВСЕМ швом исполнителя датаплейна (kacho#400): исполнителя не
  // существует, поэтому подтверждения не приходило ни одного, и поле отвечало
  // арендатору «не применено» всегда и на каждом ресурсе. Это обещание
  // возможности, которой нет, — а у такого поля три законных исхода, и здесь
  // верен третий: снять с контракта.
  //
  // Номер И имя зарезервированы намеренно. Вернуть величину можно только вместе
  // с исполнителем, который её производит, — и тогда она заводится заново, под
  // новым номером, а не занимает этот.
  reserved 11;
  reserved "apply_state";
}
