syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// A RouteTable resource. For more information, see [RouteTable](https://vpc.kacho.cloud/api/route-table).
message RouteTable {
  // ID of the route table.
  string id = 1;

  // ID of the project that the route table belongs to.
  string project_id = 2;

  // Creation timestamp in [RFC3339](https://www.ietf.org/rfc/rfc3339.txt) text format.
  google.protobuf.Timestamp created_at = 3;

  // Name of the route table. 
  // The name must be unique within the project. 
  // Value must match the regular expression `[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?` —
  // RFC 1123 DNS label: lowercase letters, digits and hyphens, 1..63 characters.
  // Empty on Create means "server, name it": a name derived from the id is
  // substituted. Empty on Update is rejected — a resource has no nameless state.
  string name = 4;

  // Optional description of the route table. 0-256 characters long.
  string description = 5;

  // Resource labels, `key:value` pairs.
  // No more than 64 per resource. 
  // The string length in characters for each key must be 1-63.
  // Each value must match the regular expression `[-_0-9a-z]*`. 
  // Each key must match the regular expression `[a-z][-_0-9a-z]*`.
  map<string, string> labels = 6;

  // ID of the network the route table belongs to.
  string network_id = 7;

  // List of static routes.
  repeated StaticRoute static_routes = 8;

  // 9 держал `apply_state` — состояние применения намерения текущей ревизии.
  //
  // Снято вместе со ВСЕМ швом исполнителя датаплейна (kacho#400): исполнителя не
  // существует, поэтому подтверждения не приходило ни одного, и поле отвечало
  // арендатору «не применено» всегда и на каждом ресурсе. Это обещание
  // возможности, которой нет, — а у такого поля три законных исхода, и здесь
  // верен третий: снять с контракта.
  //
  // Номер И имя зарезервированы намеренно. Вернуть величину можно только вместе
  // с исполнителем, который её производит, — и тогда она заводится заново, под
  // новым номером, а не занимает этот.
  reserved 9;
  reserved "apply_state";
}

// A StaticRoute resource. For more information, see [RouteTable](https://vpc.kacho.cloud/api/route-table).
message StaticRoute {

  oneof destination {
    // Destination subnet in CIDR notation
    string destination_prefix = 1;
  }

  oneof next_hop {
    // Next hop IP address
    string next_hop_address = 2;

    // ID of the Gateway resource to route through.
    //
    // Resolved, not recorded. The gateway is owned by vpc itself, so the id is
    // read from vpc's own database on the request path: no row → NOT_FOUND
    // "Gateway <id> not found". A gateway that exists but cannot serve this route
    // → FAILED_PRECONDITION. Three conditions have to hold, and each of them is
    // enforced by the write statement itself rather than by a check preceding it:
    //
    //  * same network — the gateway's anchor subnet belongs to the network of
    //    this route table;
    //  * placement coherence — zonal to zonal means the same zone; a REGIONAL
    //    anycast subnet on either side carries no zone and is therefore out of the
    //    zonal comparison by construction;
    //  * family — an IPv4 destination routes through a NAT gateway, an IPv6
    //    destination through an egress-only gateway.
    //
    // A gateway named by a live route cannot be deleted (FAILED_PRECONDITION
    // "gateway is in use").
    string gateway_id = 4;
  }

  // Resource labels as `` key:value `` pairs. Maximum of 64 per resource.
  map<string, string> labels = 3;
}
