syntax = "proto3";

package kacho.cloud.vpc.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "kacho/cloud/api/operation.proto";
import "kacho/cloud/operation/operation.proto";
import "kacho/cloud/reference/reference.proto";
import "kacho/cloud/vpc/v1/subnet.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/vpc/v1;vpcv1";

// A set of methods for managing Subnet resources.
service SubnetService {
  // Returns the specified Subnet resource.
  //
  // To get the list of available Subnet resources, make a [List] request.
  rpc Get(GetSubnetRequest) returns (Subnet) {
    option (google.api.http) = {get: "/vpc/v1/subnets/{subnet_id}"};
    option (kacho.iam.authz.v1.permission)        = "vpc.subnets.get";
    option (kacho.iam.authz.v1.required_relation) = "v_get";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_subnet"
      from_request_field: "subnet_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Retrieves the list of Subnet resources in the specified project.
  rpc List(ListSubnetsRequest) returns (ListSubnetsResponse) {
    option (google.api.http) = {get: "/vpc/v1/subnets"};
    option (kacho.iam.authz.v1.permission)        = "vpc.subnets.list";
    // Top-level List is gated by the READ TIER on the parent project, not by the
    // project's own `v_list` verb. In the model those are independent sets, and
    // `project#v_list` means object-level access to the PROJECT ITSELF — the model
    // says of the `v_*` set "never to its contents" — so it answers a different
    // question than "may this subject list what is inside". The tier is the same
    // axis Create already takes here (`editor`), and the same convention the
    // storage/iam project-scoped List RPCs carry. Rows stay narrowed per object by
    // the owning service's list filter; this option only decides who may ask.
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Creates a subnet in the specified project and network.
  // Method starts an asynchronous operation that can be cancelled while it is in progress.
  rpc Create(CreateSubnetRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/vpc/v1/subnets"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "CreateSubnetMetadata"
      response: "Subnet"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.subnets.create";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Updates the specified subnet.
  // Method starts an asynchronous operation that can be cancelled while it is in progress.
  rpc Update(UpdateSubnetRequest) returns (operation.Operation) {
    option (google.api.http) = {
      patch: "/vpc/v1/subnets/{subnet_id}"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateSubnetMetadata"
      response: "Subnet"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.subnets.update";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_subnet"
      from_request_field: "subnet_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Adds CIDR blocks to the specified subnet.
  // Method starts an asynchronous operation that can be cancelled while it is in progress.
  rpc AddCidrBlocks(AddSubnetCidrBlocksRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/vpc/v1/subnets/{subnet_id}:add-cidr-blocks"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateSubnetMetadata"
      response: "Subnet"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.subnet_cidr_blocks.addCidrBlocks";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_subnet"
      from_request_field: "subnet_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Removes CIDR blocks from the specified subnet.
  // Method starts an asynchronous operation that can be cancelled while it is in progress.
  rpc RemoveCidrBlocks(RemoveSubnetCidrBlocksRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/vpc/v1/subnets/{subnet_id}:remove-cidr-blocks"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateSubnetMetadata"
      response: "Subnet"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.subnet_cidr_blocks.removeCidrBlocks";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_subnet"
      from_request_field: "subnet_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Deletes the specified subnet.
  rpc Delete(DeleteSubnetRequest) returns (operation.Operation) {
    option (google.api.http) = {delete: "/vpc/v1/subnets/{subnet_id}"};
    option (kacho.cloud.api.operation) = {
      metadata: "DeleteSubnetMetadata"
      response: "google.protobuf.Empty"
    };
    option (kacho.iam.authz.v1.permission)        = "vpc.subnets.delete";
    option (kacho.iam.authz.v1.required_relation) = "v_delete";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_subnet"
      from_request_field: "subnet_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // List operations for the specified subnet.
  rpc ListOperations(ListSubnetOperationsRequest) returns (ListSubnetOperationsResponse) {
    option (google.api.http) = {get: "/vpc/v1/subnets/{subnet_id}/operations"};
    option (kacho.iam.authz.v1.permission)        = "vpc.subnet_operations.listOperations";
    option (kacho.iam.authz.v1.required_relation) = "v_list";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_subnet"
      from_request_field: "subnet_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // List used addresses in specified subnet.
  rpc ListUsedAddresses(ListUsedAddressesRequest) returns (ListUsedAddressesResponse) {
    option (google.api.http) = {get: "/vpc/v1/subnets/{subnet_id}/addresses"};
    option (kacho.iam.authz.v1.permission)        = "vpc.used_addresses.listUsedAddresses";
    option (kacho.iam.authz.v1.required_relation) = "v_list";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "vpc_subnet"
      from_request_field: "subnet_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetSubnetRequest {
  // ID of the Subnet resource to return.
  // To get the subnet ID use a [SubnetService.List] request.
  string subnet_id = 1;
}

message ListSubnetsRequest {
  // ID of the project to list subnets in.
  // To get the project ID use a [kaname.cloud.iam.v1.ProjectService.List] request.
  string project_id = 1;

  // The maximum number of results per page to return. If the number of available
  // results is larger than [page_size],
  // the service returns a [ListSubnetsResponse.next_page_token]
  // that can be used to get the next page of results in subsequent list requests. Default value: 100.
  int64 page_size = 2;

  // Page token. To get the next page of results, set [page_token] to the
  // [ListSubnetsResponse.next_page_token] returned by a previous list request.
  string page_token = 3;

  // A filter expression that filters resources listed in the response.
  // The expression must specify:
  // 1. The field name. Currently you can use filtering only on [Subnet.name] field.
  // 2. An `=` operator.
  // 3. The value in double quotes (`"`). The value is compared to the resource
  //    name as-is, so only a value in the name form can match anything:
  //    `[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?`. Beyond that, the filter refuses a
  //    value longer than 256 characters, or one containing a NUL character,
  //    with INVALID_ARGUMENT naming the field and the rule. It applies no
  //    alphabet rule of its own: filterable fields elsewhere hold identifiers
  //    and enum spellings, not names.
  string filter = 4;
}

message ListSubnetsResponse {
  // List of Subnet resources.
  repeated Subnet subnets = 1;

  // This token allows you to get the next page of results for list requests. If the number of results
  // is larger than [ListSubnetsRequest.page_size], use
  // the [next_page_token] as the value
  // for the [ListSubnetsRequest.page_token] query parameter
  // in the next list request. Subsequent list requests will have their own
  // [next_page_token] to continue paging through the results.
  string next_page_token = 2;
}

message CreateSubnetRequest {
  // 7/11 — legacy v4_cidr_blocks/v6_cidr_blocks (retired VPC-1 F7:
  // Create takes the immutable primary anchor only; additional ranges via
  // AddCidrBlocks). 8 — retired oneof slot. 10 — legacy dhcp_options
  // (retired VPC-1-43: DHCP/DNS knobs dropped by design).
  //
  // Имена сняты вместе с номерами (api-conventions, «принято-и-проигнорировано»:
  // снять с контракта = зарезервировать номер И ИМЯ). Прежде стоял только номер,
  // и это было наблюдаемо дорого: край не мог отличить снятый ключ от опечатки и
  // отбрасывал `v4CidrBlocks` молча — тело с ним создавало подсеть ВООБЩЕ БЕЗ
  // диапазона и получало 200. Набор проб этого домена несёт тот же разбор своими
  // словами: тридцать три создания везли ключ, которого никто не читал.
  reserved 7, 8, 10, 11;
  reserved "dhcp_options", "v4_cidr_blocks", "v6_cidr_blocks";
  // ID of the project to create a subnet in.
  // To get project ID use a [kaname.cloud.iam.v1.ProjectService.List] request.
  string project_id = 1;

  // Name of the subnet.
  // The name must be unique within the project.
  string name = 2;

  // Description of the subnet.
  string description = 3;

  // Resource labels, `` key:value `` pairs.
  map<string, string> labels = 4;

  // ID of the network to create subnet in.
  string network_id = 5;

  // Placement discriminator — SERVER-DERIVED, НЕ ВХОД.
  //
  // Поле остаётся в запросе, но любое непустое значение ОТВЕРГАЕТСЯ синхронно:
  // `INVALID_ARGUMENT "placement_type is server-derived; set zone_id or region_id
  // instead"`. Дискриминатор выводится из того, ЧТО ИЗ ДВУХ задано: `zone_id` → ZONAL,
  // `region_id` → REGIONAL; оба или ни одного — отказ.
  //
  // ПОЧЕМУ ПОЛЕ НЕ СНЯТО, хотя вход всегда отвергается. Снятие дало бы вызывающему,
  // который его прислал, МОЛЧАЛИВЫЙ сброс: разбор тела на крае отбрасывает неизвестные
  // ключи, и вместо «так нельзя, задайте зону» он получил бы успех с выведенным не тем
  // размещением. Явный отказ по имени поля — исход лучше снятия ровно здесь, и это
  // осознанный выбор из трёх, а не отсрочка.
  //
  // Прежний текст этого комментария утверждал ОБРАТНОЕ: «required; UNSPECIFIED →
  // InvalidArgument… enforced in the handler». Он описывал замысел, которого код не
  // исполняет ни в одной ветви, и читался чаще прочего — это авторитетное место.
  SubnetPlacementType placement_type = 13;

  // ID of the availability zone (set iff placement_type == ZONAL).
  // To get a list of available zones, use the [kacho.cloud.geo.v1.ZoneService.List] request.
  string zone_id = 6;

  // ID of the region (set iff placement_type == REGIONAL).
  // To get a list of available regions, use the [kacho.cloud.geo.v1.RegionService.List] request.
  string region_id = 12;

  // Primary IPv4 CIDR anchor (immutable placement-anchor). Must be a subset of one
  // of the parent network's ipv4_cidr_blocks supernet blocks. Optional: a subnet
  // may be v6-only (empty ipv4_cidr_primary). Additional ranges via AddCidrBlocks.
  // For example, 10.20.0.0/24. Minimum /28, maximum /16.
  string ipv4_cidr_primary = 14;

  // Primary IPv6 CIDR anchor (immutable). Optional: a subnet may be v4-only.
  string ipv6_cidr_primary = 15;

  // ID of route table the subnet is linked to.
  string route_table_id = 9;
}

message CreateSubnetMetadata {
  // ID of the subnet that is being created.
  string subnet_id = 1;
}

message UpdateSubnetRequest {
  // ID of the Subnet resource to update.
  string subnet_id = 1;

  // Field mask that specifies which fields of the Subnet resource are going to be updated.
  google.protobuf.FieldMask update_mask = 2;

  // Name of the subnet.
  // The name must be unique within the project.
  string name = 3;

  // Description of the subnet.
  string description = 4;

  // Resource labels as `` key:value `` pairs.
  map<string, string> labels = 5;

  // ID of route table the subnet is linked to.
  string route_table_id = 6;

  // 7 — legacy dhcp_options (retired VPC-1-43: DHCP/DNS knobs dropped by
  // design). 8/9 — legacy v4_cidr_blocks/v6_cidr_blocks (retired VPC-1 F7).
  // CIDR is immutable via Update: the primary anchor never changes; additional
  // ranges go through AddCidrBlocks/RemoveCidrBlocks.
  //
  // Имена сняты вместе с номерами — см. разбор у `CreateSubnetRequest`.
  reserved 7, 8, 9;
  reserved "dhcp_options", "v4_cidr_blocks", "v6_cidr_blocks";
}

message UpdateSubnetMetadata {
  // ID of the Subnet resource that is being updated.
  string subnet_id = 1;
}

message AddSubnetCidrBlocksRequest {
  // ID of the Subnet resource that is being updated.
  string subnet_id = 1;

  // CIDR block.
  // The range of internal addresses that should be added to this subnet.
  // For example, 10.0.0.0/22 or 192.168.0.0/24.
  // Minimum subnet size is /28, maximum subnet size is /16.
  repeated string ipv4_cidr_blocks = 2;

  // IPv6 CIDR block(s) to add to this subnet (e.g. fd00:1234::/64). (IPv6 vertical.)
  repeated string ipv6_cidr_blocks = 3;
}

message RemoveSubnetCidrBlocksRequest {
  // ID of the Subnet resource that is being updated.
  string subnet_id = 1;

  // CIDR block.
  // The range of internal addresses that are removed from this subnet.
  repeated string ipv4_cidr_blocks = 2;

  // IPv6 CIDR block(s) to remove from this subnet. (IPv6 vertical.)
  repeated string ipv6_cidr_blocks = 3;
}

message DeleteSubnetRequest {
  // ID of the subnet to delete.
  // To get the subnet ID use a [SubnetService.List] request.
  string subnet_id = 1;
}

message DeleteSubnetMetadata {
  // ID of the Subnet resource that is being deleted.
  string subnet_id = 1;
}

message ListSubnetOperationsRequest {
  // ID of the Subnet resource to list operations for.
  string subnet_id = 1;

  // The maximum number of results per page that should be returned. If the number of available
  // results is larger than [page_size], the service returns a [ListSubnetOperationsResponse.next_page_token]
  // that can be used to get the next page of results in subsequent list requests. Default value: 100.
  int64 page_size = 2;

  // Page token. To get the next page of results, set [page_token] to the
  // [ListSubnetOperationsResponse.next_page_token] returned by a previous list request.
  string page_token = 3;
}

message ListSubnetOperationsResponse {
  // List of operations for the specified Subnet resource.
  repeated operation.Operation operations = 1;

  // This token allows you to get the next page of results for list requests. If the number of results
  // is larger than [ListSubnetOperationsRequest.page_size], use the [next_page_token] as the value
  // for the [ListSubnetOperationsRequest.page_token] query parameter in the next list request.
  // Each subsequent list request will have its own [next_page_token] to continue paging through the results.
  string next_page_token = 2;
}

message ListUsedAddressesRequest {
  // ID of the Subnet whose allocated addresses are listed.
  string subnet_id = 1;
  // Maximum number of results per page. 0 selects the service default (50);
  // a value above 1000 is rejected with INVALID_ARGUMENT rather than clamped.
  int64 page_size = 2;
  string page_token = 3;

  // NOT ACCEPTED. The response is a subnet occupancy projection
  // (address / ipVersion / references), not the Address resource, so there is no
  // field a filter expression could name. A set value is refused synchronously
  // with INVALID_ARGUMENT naming this field (accepted-and-ignored is not a
  // lawful outcome). Kept on the contract rather than removed because the REST
  // edge discards unknown query keys, so removal would turn a named refusal back
  // into a silent 200 over an unnarrowed list.
  string filter = 4;
}

message ListUsedAddressesResponse {
  repeated UsedAddress addresses = 1;
  string next_page_token = 2;
}

message UsedAddress {
  string address = 1;
  IpVersion ip_version = 2;
  repeated reference.Reference references = 3;
}
