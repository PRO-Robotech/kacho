syntax = "proto3";

package kacho.cloud.loadbalancer.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/loadbalancer/v1;loadbalancerv1";

// Listener is a standalone first-class resource in kacho-nlb — it is NOT an
// inline child of NetworkLoadBalancer.
// Reasons: independent FGA object type `nlb_listener`, independent VIP
// allocation lifecycle, per-Listener operations history, hierarchy tuple
// `nlb_listener#load_balancer@nlb_load_balancer:<lb_id>` (design §6.1).
message Listener {
  // Reserved for future Listener-level extensions (mirror policy, TLS opts).
  // Numbers 50-59 are claimed up front to keep low numbers contiguous for
  // hot-path fields.
  //
  // VIP переехал Listener→LoadBalancer: листенер больше не несёт собственного
  // адреса (один anycast VIP на LB на семейство). Сняты ip_version=12,
  // address_id=13, allocated_address=14, subnet_id=15 → reserved 12-15. Денорм
  // region_id=4 уходит (region нативно на load_balancers); тег и имя
  // резервируются ради wire-safety — переиспользование тега 4 с несовместимой
  // семантикой запрещено (иначе buf breaking непоследователен).
  //
  // proxy_protocol_v2=16 СНЯТ с контракта. Заголовок PROXY-протокола по его
  // спецификации уходит ДО любых данных соединения, то есть вставить его может
  // только владелец байтового потока к бекенду. Балансировщик четвёртого уровня
  // потоком не владеет — он его пересылает; у рассмотренного программного
  // датаплейна такого обрамления нет вовсе. Исполнителя не существует ни в одном
  // из рассмотренных вариантов, значит поле принималось и не исполнялось —
  // «принято-и-проигнорировано», что конвенция запрещает прямо. Если потребность
  // реальна, обрамление приходит свойством слушателя НОВОГО ВИДА, владеющего
  // соединением, со своей приёмкой и своей ценой по задержке, а не булевым полем
  // на L4 (решение и предикат пересмотра — план датаплейна §7.11).
  // target_port=11 СНЯТ с контракта (NLB-1b, сценарий NLB-1-25). Backend-порт —
  // одна величина, и у неё один хозяин: `TargetGroup.port`. Поле слушателя
  // записывалось, отдавалось обратно и не читалось ничем — решение о том, куда
  // уходит трафик, принимала группа, а её порт и так виден здесь эхом
  // (`resolved_backend_port`). Вдобавок поле было обязательным на деле и
  // необязательным на словах: ноль отвергался проверкой диапазона, поэтому
  // объявленное умолчание «не задан → наследуется порт группы» не исполнялось ни
  // при каком входе. Нужен другой backend-порт — ссылайтесь на ДРУГУЮ группу
  // целей: она дешёвая и переиспользуемая, а порт у неё ровно один.
  reserved 4, 11, 12, 13, 14, 15, 16;
  reserved "region_id", "target_port", "ip_version", "address_id", "allocated_address", "subnet_id", "proxy_protocol_v2";
  reserved 50 to 59;

  // Lifecycle status (design §2.3). Distinct from NetworkLoadBalancer.Status —
  // a Listener can be UPDATING while its LB stays ACTIVE.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    CREATING = 1;
    ACTIVE = 2;
    UPDATING = 3;
    DELETING = 4;
  }

  // L4 protocol carried by the listener. Inlined here (and not on the
  // embedded-listener message in network_load_balancer.proto) because the
  // standalone Listener is now the source of truth.
  enum Protocol {
    PROTOCOL_UNSPECIFIED = 0;
    TCP = 1;
    UDP = 2;
  }

  // Substatus — NLB-1b EXPAND (additive, output-only, derived): whether the
  // listener resolves a target group. OK when target_group_id resolves to an
  // existing TargetGroup; MISCONFIGURED when it does not (no/dangling TG). A
  // pure server/client-derived value (not persisted).
  enum Substatus {
    SUBSTATUS_UNSPECIFIED = 0;
    OK = 1;
    MISCONFIGURED = 2;
  }

  // ID of the listener (prefix `lst`).
  string id = 1;

  // ID of the project that owns the listener. Denormalized from the parent
  // load balancer; kept in sync via Move (design §4.7) so keyset pagination
  // by (project_id, id) can skip a join.
  string project_id = 2;

  // ID of the parent NetworkLoadBalancer (FK `listeners.load_balancer_id`).
  string load_balancer_id = 3;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 5;

  // Name of the listener. Unique per parent load balancer.
  string name = 6;

  // Description.
  string description = 7;

  // Resource labels.
  map<string, string> labels = 8;

  // L4 protocol of the listener.
  Protocol protocol = 9;

  // Port for incoming traffic.
  int64 port = 10;

  // default_target_group_id — OUTPUT-ONLY MIRROR of target_group_id (#1596).
  // Kept so existing readers keep working; it always carries the same value as
  // target_group_id above and never differs from it.
  //
  // NOT an input: setting it in Create, or naming it in Update's update_mask,
  // is an EXPLICIT InvalidArgument reject. There is exactly one input for the
  // wiring, and it is target_group_id.
  //
  // The name is also a misnomer this product never earned: "default" implied a
  // fallback among per-listener routing rules, and no such rules exist — a
  // listener wires to exactly one target group.
  string default_target_group_id = 17;

  // Current lifecycle status.
  Status status = 18;

  // target_group_id — THE target group the listener wires to. The single
  // authoritative input (Create + Update) and the authoritative output.
  // LIVE-mutable: naming it in update_mask repoints the listener, an empty
  // value clears the wiring.
  //
  // The M:N attach pivot this field once coexisted with is gone (migration
  // 0022 dropped it); default_target_group_id below is now an output-only
  // mirror, so no precedence between inputs exists by construction.
  string target_group_id = 19;

  // resolved_backend_port — NLB-1b EXPAND (additive, output-only, derived).
  // Echo of the wired TargetGroup.port (NLB-1-19); 0 when no TG resolves. Not
  // the frontend `port`.
  int64 resolved_backend_port = 20;

  // substatus — NLB-1b EXPAND (additive, output-only, derived). OK when the
  // wired target group resolves, MISCONFIGURED otherwise.
  Substatus substatus = 21;
}