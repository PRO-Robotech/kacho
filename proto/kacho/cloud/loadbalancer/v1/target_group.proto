syntax = "proto3";

package kacho.cloud.loadbalancer.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "kacho/cloud/loadbalancer/v1/health_check.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/loadbalancer/v1;loadbalancerv1";

// TargetGroup — collection of L4 targets with a single embedded HealthCheck.
// HealthCheck lives on the group (not per-attachment) to align with the
// `target_groups.health_check JSONB` column (design §5.2). The
// `AttachedTargetGroup` still carries a snapshot for back-compat JSON
// clients but the TG is authoritative.
message TargetGroup {
  // Reserved for future TG-level fields (TLS terminator, per-group session
  // affinity overrides). Numbered up so low slots stay for hot-path data.
  reserved 8;
  reserved 50 to 59;
  // Fields 11/12 previously held int32-seconds deregistration_delay_seconds /
  // slow_start_seconds — replaced in NLB-1c (B8) by Duration fields
  // deregistration_delay=15 / slow_start=16 below.
  reserved 11, 12;
  reserved "deregistration_delay_seconds", "slow_start_seconds";

  // Lifecycle status (design §2.3). Only two transitions — TG has no
  // STARTING/STOPPED — it is either ACTIVE or being torn down.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    ACTIVE = 1;
    DELETING = 2;
  }

  string id = 1;
  string project_id = 2;
  google.protobuf.Timestamp created_at = 3;
  string name = 4;
  string description = 5;
  map<string, string> labels = 6;
  string region_id = 7;

  // Inline targets snapshot. Source of truth is the `targets` child table
  // (design §5.2). Add/Remove go through dedicated RPCs
  // (TargetGroupService.AddTargets / RemoveTargets).
  //
  // Which reads populate it: BOTH — Get and List. A list page loads the targets
  // of every group on it, so an empty array here always means "this group has no
  // targets" and never "this read does not fill the field". The two are
  // indistinguishable on the wire, and a client that syncs its state from the
  // cheap path (List) would read the second as "all targets were deleted".
  //
  // Is the order significant: NO — this is a SET, not a sequence. The server
  // does not preserve the order targets were supplied in and gives no other
  // ordering guarantee; compare the field by MEMBERSHIP, never by index. A
  // client that diffs positionally will read a reshuffle as "target 1 changed
  // its address, target 2 changed its weight" and revert what it just wrote.
  // Per-target traffic share is `Target.weight`; position carries no meaning.
  repeated Target targets = 9;

  // Embedded health check — single HC per group (hoisted to TG-level; embedded
  // value-object, redesigned in NLB-1c to drop `name` and carry the 4-way
  // tcp/http/https/grpc oneof).
  HealthCheck health_check = 10;

  Status status = 13;

  // port — single backend port of the group (net-new, NLB-1b F6-co-req). Every
  // target of the group receives forwarded traffic on this port; it is the sole
  // backend-port source echoed by Listener.resolved_backend_port (design NLB-1
  // §Listener wiring). Required, range 1..65535. LIVE-mutable in NLB-1c
  // (re-echoes into wired listeners' resolved_backend_port).
  int32 port = 14;

  // deregistration_delay — drain timeout applied when a target is removed
  // (design §4.4 two-phase RemoveTargets). NLB-1c (B8): Duration string,
  // bounds [0s, 3600s]; default 300s. Replaces int32 deregistration_delay_seconds.
  google.protobuf.Duration deregistration_delay = 15;

  // slow_start — ramp window for newly added targets. NLB-1c (B8): Duration
  // string, bounds [0s, 900s]; default 0s (no ramp). Replaces int32
  // slow_start_seconds.
  google.protobuf.Duration slow_start = 16;
}

// Target — one backend endpoint. 4-way identity oneof (design §2.5):
// in-cloud via Instance, in-cloud via NIC, in-cloud raw IP in a subnet, or
// out-of-cloud raw IP. Replaces the earlier 2-field (subnet_id, address)
// shape — subnet_id+address kept available as a single oneof case
// (`ip_ref.subnet_id` + `ip_ref.address`) but no longer top-level.
message Target {
  // Old top-level `subnet_id` (was 1) and `address` (was 2) are reserved
  // so wire-level tags can never be reused with different semantics.
  reserved 1, 2;
  reserved "subnet_id", "address";
  // Reserved for the future GlobalLoadBalancer cross-region composition
  // (design §«Future TODO»: GLB may need region/anycast hints per target).
  reserved 10 to 19;

  // In-cloud, addressed via the parent compute Instance — kacho-nlb resolves
  // primary NIC IP at worker validate time.
  message InCloudIP {
    // VPC subnet the target sits in (soft cross-service ref to kacho-vpc).
    string subnet_id = 1;
    // Concrete IP within that subnet's CIDR.
    string address = 2;
  }

  // Out-of-cloud raw IP. Bogon-class addresses (loopback / link-local /
  // multicast / unspecified) are rejected sync at validate time.
  message ExternalIP {
    string address = 1;
    // Optional zonal hint for placement decisions; empty means region-default.
    string zone_id = 2;
  }

  // Exactly one of the four identity forms must be set (validated in domain).
  oneof identity {
    // (1) Compute instance — primary NIC IP resolved at worker.
    string instance_id = 3;
    // (2) Specific VPC NIC — IP read from that NIC at worker.
    string nic_id = 4;
    // (3) Raw in-cloud IP scoped to a subnet.
    InCloudIP ip_ref = 5;
    // (4) Raw out-of-cloud IP.
    ExternalIP external_ip = 6;
  }

  // Per-target weight inside the group. 0 disables traffic without removing
  // the row (drain-with-keepalive use case). 0-1000.
  int32 weight = 7;

  // Lifecycle state of one target inside the group. RemoveTargets is
  // two-phase (design §4.4): phase A marks the target DRAINING, phase B
  // deletes it once `TargetGroup.deregistration_delay` has elapsed. Between
  // the two the target is still listed, and without this field the caller
  // cannot tell a draining target from an ordinary one — the removal looks
  // like it did nothing.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // Serving.
    ACTIVE = 1;
    // Removal requested; the target is draining and disappears once the
    // group's deregistration delay has elapsed.
    DRAINING = 2;
  }

  // Output-only. Never read from AddTargets/CreateTargetGroup — the state is
  // decided by RemoveTargets and the drain runner, not by the caller.
  Status status = 8;

  // Output-only. Moment phase A marked this target as draining; unset while
  // the target is ACTIVE. Together with `TargetGroup.deregistration_delay` it
  // tells the caller when the target actually goes away.
  google.protobuf.Timestamp drain_started_at = 9;
}