syntax = "proto3";

package kacho.cloud.loadbalancer.v1;

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "kacho/cloud/api/operation.proto";
import "kacho/cloud/loadbalancer/v1/health_check.proto";
import "kacho/cloud/loadbalancer/v1/target_group.proto";
import "kacho/cloud/operation/operation.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/loadbalancer/v1;loadbalancerv1";

service TargetGroupService {
  rpc Get(GetTargetGroupRequest) returns (TargetGroup) {
    option (google.api.http) = {get: "/nlb/v1/targetGroups/{target_group_id}"};
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.targetGroups.get";
    option (kacho.iam.authz.v1.required_relation) = "v_get";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_target_group"
      from_request_field: "target_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc List(ListTargetGroupsRequest) returns (ListTargetGroupsResponse) {
    option (google.api.http) = {get: "/nlb/v1/targetGroups"};
    // Scope-filtered List: handler читает страницу курсором из своей БД и сужает
    // её пообъектно, батчами, тем же отношением, которым каталог гейтит одиночное
    // чтение — `v_get` на `nlb_target_group:<id>`. Страница не может быть шире
    // чтения: это один и тот же вопрос, заданный по строке. Поэтому каталог
    // объявляет полосу `scope_filtered` — единый project-scope Check отклонил бы
    // вызывающего `no path` 403 ещё до сужения. Снят именно Check, а НЕ аутентификация:
    // полоса требует названного принципала, иначе сужать не для кого.
    //
    // Прежде здесь назывался обратный порядок — перечислить у iam разрешённые
    // объекты и отфильтровать ими. Перечисление снято: у него жёсткий серверный
    // предел и нет продолжения, поэтому ресурсы сверх предела становились владельцу
    // невидимы при живых правах.
    option (kacho.iam.authz.v1.permission) = "loadbalancer.targetGroups.list";
    option (kacho.iam.authz.v1.scope_filtered) = true;
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc Create(CreateTargetGroupRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/nlb/v1/targetGroups"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "CreateTargetGroupMetadata"
      response: "TargetGroup"
    };
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.targetGroups.create";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "project"
      from_request_field: "project_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc Update(UpdateTargetGroupRequest) returns (operation.Operation) {
    option (google.api.http) = {
      patch: "/nlb/v1/targetGroups/{target_group_id}"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateTargetGroupMetadata"
      response: "TargetGroup"
    };
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.targetGroups.update";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_target_group"
      from_request_field: "target_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc Delete(DeleteTargetGroupRequest) returns (operation.Operation) {
    option (google.api.http) = {delete: "/nlb/v1/targetGroups/{target_group_id}"};
    option (kacho.cloud.api.operation) = {
      metadata: "DeleteTargetGroupMetadata"
      response: "google.protobuf.Empty"
    };
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.targetGroups.delete";
    option (kacho.iam.authz.v1.required_relation) = "v_delete";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_target_group"
      from_request_field: "target_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Move the target group to another project. Blocked if currently attached
  // to any NetworkLoadBalancer (design §3.4).
  rpc Move(MoveTargetGroupRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/nlb/v1/targetGroups/{target_group_id}:move"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "MoveTargetGroupMetadata"
      response: "TargetGroup"
    };
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.targetGroups.move";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    // Source-project scope; destination editor check added by a
    // scope-conditional extractor in kacho-nlb (design §6.5).
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_target_group"
      from_request_field: "target_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc AddTargets(AddTargetsRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/nlb/v1/targetGroups/{target_group_id}:addTargets"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "AddTargetsMetadata"
      response: "TargetGroup"
    };
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.targetGroups.addTargets";
    // NLB-TGT-1: управление СОСТАВОМ группы — собственное отношение, объявленное
    // надмножеством `v_update` в канонической модели. Пока здесь стояло `v_update`,
    // право управлять составом было невыдаваемо отдельно от права менять саму группу.
    option (kacho.iam.authz.v1.required_relation) = "v_addtargets";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_target_group"
      from_request_field: "target_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc RemoveTargets(RemoveTargetsRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/nlb/v1/targetGroups/{target_group_id}:removeTargets"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "RemoveTargetsMetadata"
      response: "TargetGroup"
    };
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.targetGroups.removeTargets";
    // NLB-TGT-1 — см. AddTargets выше: собственное отношение, надмножество `v_update`.
    option (kacho.iam.authz.v1.required_relation) = "v_removetargets";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_target_group"
      from_request_field: "target_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc ListOperations(ListTargetGroupOperationsRequest) returns (ListTargetGroupOperationsResponse) {
    option (google.api.http) = {get: "/nlb/v1/targetGroups/{target_group_id}/operations"};
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.targetGroups.listOperations";
    option (kacho.iam.authz.v1.required_relation) = "v_list";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_target_group"
      from_request_field: "target_group_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetTargetGroupRequest {
  // ID of the TargetGroup.
  string target_group_id = 1;
}

message ListTargetGroupsRequest {
  // ID of the Project.
  string project_id = 1;
  // Maximum number of results per page. 0 selects the service default (50);
  // a value above 1000 is rejected with INVALID_ARGUMENT rather than clamped.
  int64 page_size = 2;
  // Page token. To get the next page of results, set [page_token] to the
  // [ListTargetGroupsResponse.next_page_token] returned by a previous list request.
  string page_token = 3;
  // Filter expression. Currently only the [name] field is filterable: the field
  // name, an `=` operator, and the value in double quotes.
  string filter = 4;
}

message ListTargetGroupsResponse {
  repeated TargetGroup target_groups = 1;
  string next_page_token = 2;
}

message CreateTargetGroupRequest {
  reserved 6;
  // Fields 9/10 previously held int32-seconds deregistration_delay_seconds /
  // slow_start_seconds — replaced in NLB-1c (B8) by Duration fields at 12/13.
  reserved 9, 10;
  reserved "deregistration_delay_seconds", "slow_start_seconds";

  // ID of the Project.
  string project_id = 1;
  // Name of the TargetGroup. Must be a DNS label (lowercase letters, digits and
  // hyphens, 1-63 characters) and is unique within the project. Empty on Create
  // makes the server derive the name from the assigned id.
  string name = 2;
  // Description of the TargetGroup.
  string description = 3;
  // Resource labels as `` key:value `` pairs.
  map<string, string> labels = 4;
  // ID of the Region.
  string region_id = 5;

  // Inline initial targets accepted at Create time. Validation: per-target
  // domain.Validate() + peer-resolve in worker (design §4.3).
  repeated Target targets = 7;

  // Required — single embedded HC per group (design §2.2).
  HealthCheck health_check = 8;

  // Required — single backend port of the group (NLB-1b F6-co-req). Every
  // target receives forwarded traffic on this port; echoed by
  // Listener.resolved_backend_port. Range 1..65535.
  int32 port = 11;

  // Drain timeout for removed targets (design §4.4). NLB-1c (B8): Duration,
  // bounds [0s, 3600s]. Default 300s when unset.
  google.protobuf.Duration deregistration_delay = 12;

  // Slow-start ramp window for added targets. NLB-1c (B8): Duration, bounds
  // [0s, 900s]. Default 0s (off).
  google.protobuf.Duration slow_start = 13;
}

message CreateTargetGroupMetadata {
  string target_group_id = 1;
}

message UpdateTargetGroupRequest {
  // Fields 8/9 previously held int32-seconds deregistration_delay_seconds /
  // slow_start_seconds — replaced in NLB-1c (B8) by Duration fields at 10/11.
  reserved 8, 9;
  reserved "deregistration_delay_seconds", "slow_start_seconds";

  // ID of the TargetGroup.
  string target_group_id = 1;
  google.protobuf.FieldMask update_mask = 2;
  // Name of the TargetGroup. Must be a DNS label (lowercase letters, digits and
  // hyphens, 1-63 characters) and is unique within the project. Empty on Create
  // makes the server derive the name from the assigned id.
  string name = 3;
  // Description of the TargetGroup.
  string description = 4;
  // Resource labels as `` key:value `` pairs.
  map<string, string> labels = 5;

  // Targets list replacement is rejected on this RPC — use AddTargets /
  // RemoveTargets so each target mutation goes through its own Operation
  // history and idempotency keys (design §3.4). The refusal is driven by the
  // BODY, not by update_mask: a non-empty list is refused whatever the mask says
  // (including the empty full-object PATCH mask), because accepted-and-ignored
  // is not a lawful outcome.
  repeated Target targets = 6;

  HealthCheck health_check = 7;

  // NLB-1c (B8): Duration, bounds [0s, 3600s]. Replaces int32
  // deregistration_delay_seconds.
  google.protobuf.Duration deregistration_delay = 10;

  // NLB-1c (B8): Duration, bounds [0s, 900s]. Replaces int32 slow_start_seconds.
  google.protobuf.Duration slow_start = 11;

  // port — single backend port of the group. LIVE-mutable (NLB-1c NLB-1-56):
  // updating it re-echoes into wired listeners' resolved_backend_port. Range
  // 1..65535 (validated in domain when present in update_mask).
  int32 port = 12;
}

message UpdateTargetGroupMetadata {
  string target_group_id = 1;
}

message DeleteTargetGroupRequest {
  // ID of the TargetGroup.
  string target_group_id = 1;
}

message DeleteTargetGroupMetadata {
  string target_group_id = 1;
}

message MoveTargetGroupRequest {
  // ID of the TargetGroup being moved.
  string target_group_id = 1;
  // ID of the Project the target group is moved to.
  string destination_project_id = 2;
}

message MoveTargetGroupMetadata {
  string target_group_id = 1;
  string destination_project_id = 2;
}

message AddTargetsRequest {
  // ID of the TargetGroup.
  string target_group_id = 1;
  // Targets to add. Membership is a set: order is not preserved and repeating an
  // existing target is a no-op.
  repeated Target targets = 2;
}

message AddTargetsMetadata {
  string target_group_id = 1;
}

message RemoveTargetsRequest {
  // ID of the TargetGroup.
  string target_group_id = 1;
  // Targets to remove. Membership is a set: removing an absent target is a no-op.
  repeated Target targets = 2;
}

message RemoveTargetsMetadata {
  string target_group_id = 1;
}

message ListTargetGroupOperationsRequest {
  // ID of the TargetGroup.
  string target_group_id = 1;
  // Maximum number of results per page. 0 selects the service default (50);
  // a value above 1000 is rejected with INVALID_ARGUMENT rather than clamped.
  int64 page_size = 2;
  // Page token. To get the next page of results, set [page_token] to the
  // [ListTargetGroupOperationsResponse.next_page_token] returned by a previous list request.
  string page_token = 3;
}

message ListTargetGroupOperationsResponse {
  repeated operation.Operation operations = 1;
  string next_page_token = 2;
}