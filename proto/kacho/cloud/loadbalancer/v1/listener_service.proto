syntax = "proto3";

package kacho.cloud.loadbalancer.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "kacho/cloud/api/operation.proto";
import "kacho/cloud/loadbalancer/v1/listener.proto";
import "kacho/cloud/operation/operation.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/loadbalancer/v1;loadbalancerv1";

// ListenerService manages Listener resources as a first-class FGA object
// (`nlb_listener`). Replaces the inline AddListener/RemoveListener pattern of
// an earlier revision (design §3.3, §6.1).
service ListenerService {
  rpc Get(GetListenerRequest) returns (Listener) {
    option (google.api.http) = {get: "/nlb/v1/listeners/{listener_id}"};
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.listeners.get";
    option (kacho.iam.authz.v1.required_relation) = "v_get";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_listener"
      from_request_field: "listener_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc List(ListListenersRequest) returns (ListListenersResponse) {
    option (google.api.http) = {get: "/nlb/v1/listeners"};
    // Project-scoped, scope-filtered List: listeners carry a denormalized
    // project_id; load_balancer_id is an optional filter. The handler reads the
    // page from its own database by cursor and narrows it per row, in batches, on
    // the same relation the permission catalog gates a single-object read on —
    // `v_get` on `nlb_listener:<id>`. The page can never be wider than the read:
    // it is the same question, asked per row. The catalog therefore declares the
    // scope-filtered lane (`scope_filtered`) — a single project-scope Check would
    // reject the caller with `no path` 403 before the narrowing runs. What is removed
    // is the Check, NOT the authentication: the lane requires a named principal,
    // because a per-row filter has nobody to filter for without one.
    //
    // The reverse order used to be named here — enumerate the objects iam allows
    // and filter by them. That enumeration is gone: it carries a hard server-side
    // cap and has no continuation, so resources past the cap became invisible to
    // their own owner while the grants were live.
    option (kacho.iam.authz.v1.permission) = "loadbalancer.listeners.list";
    option (kacho.iam.authz.v1.scope_filtered) = true;
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Creates a listener under the specified load balancer. VIP allocation
  // (BYO `address_id` or auto via vpc.InternalAddressService) happens in
  // the worker — see design §4.2.
  rpc Create(CreateListenerRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/nlb/v1/listeners"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "CreateListenerMetadata"
      response: "Listener"
    };
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.listeners.create";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    // Scope on parent LB rather than project: nlb_listener inherits from
    // nlb_load_balancer (design §6.1).
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_network_load_balancer"
      from_request_field: "load_balancer_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc Update(UpdateListenerRequest) returns (operation.Operation) {
    option (google.api.http) = {
      patch: "/nlb/v1/listeners/{listener_id}"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateListenerMetadata"
      response: "Listener"
    };
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.listeners.update";
    option (kacho.iam.authz.v1.required_relation) = "v_update";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_listener"
      from_request_field: "listener_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc Delete(DeleteListenerRequest) returns (operation.Operation) {
    option (google.api.http) = {delete: "/nlb/v1/listeners/{listener_id}"};
    option (kacho.cloud.api.operation) = {
      metadata: "DeleteListenerMetadata"
      response: "google.protobuf.Empty"
    };
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.listeners.delete";
    option (kacho.iam.authz.v1.required_relation) = "v_delete";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_listener"
      from_request_field: "listener_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  rpc ListOperations(ListListenerOperationsRequest) returns (ListListenerOperationsResponse) {
    option (google.api.http) = {get: "/nlb/v1/listeners/{listener_id}/operations"};
    option (kacho.iam.authz.v1.permission)        = "loadbalancer.listeners.listOperations";
    option (kacho.iam.authz.v1.required_relation) = "v_list";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "nlb_listener"
      from_request_field: "listener_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetListenerRequest {
  // ID of the Listener.
  string listener_id = 1;
}

message ListListenersRequest {
  // ID of the project whose listeners are listed (KAC-229: project-scoped,
  // parity with NLB/TG List).
  string project_id = 5;

  // Optional filter: restrict to listeners of a single parent load balancer.
  // Empty = all listeners in the project.
  string load_balancer_id = 1;

  // Maximum number of results per page. 0 selects the service default (50);
  // a value above 1000 is rejected with INVALID_ARGUMENT rather than clamped.
  int64 page_size = 2;
  // Page token. To get the next page of results, set [page_token] to the
  // [ListListenersResponse.next_page_token] returned by a previous list request.
  string page_token = 3;

  // Filter currently supports `name = "..."`.
  string filter = 4;
}

message ListListenersResponse {
  repeated Listener listeners = 1;
  string next_page_token = 2;
}

message CreateListenerRequest {
  // VIP переехал Listener→LoadBalancer: листенер больше не аллоцирует адрес.
  // ip_version=8 и address_spec=9 сняты → reserved (наследует один anycast VIP
  // родительского LB на семейство).
  //
  // proxy_protocol_v2=10 СНЯТ вместе с полем ресурса: исполнителя обрамления не
  // существует ни в одном рассмотренном датаплейне (см. listener.proto). Вход,
  // у которого нет ни исполнителя, ни выхода, — «принято-и-проигнорировано».
  //
  // target_port=7 СНЯТ вместе с полем ресурса (NLB-1-25): backend-порт живёт на
  // группе целей и виден эхом `resolved_backend_port`. Здесь он вдобавок нёс
  // неисполнимую возможность — объявлен необязательным, а ноль отвергался
  // проверкой диапазона, поэтому обещанное наследование порта группы не
  // срабатывало ни при каком входе.
  reserved 7, 8, 9, 10;
  reserved "target_port", "ip_version", "address_spec", "proxy_protocol_v2";

  // ID of the parent NetworkLoadBalancer. Immutable after Listener.Create.
  string load_balancer_id = 1;

  // Name of the Listener. Must be a DNS label (lowercase letters, digits and
  // hyphens, 1-63 characters) and is unique within the PARENT LOAD BALANCER —
  // NOT within the project. The scope is the one the database enforces:
  // `listeners_lb_name_uniq (load_balancer_id, name)`, so `https` may be reused
  // on every load balancer of a project. Empty on Create makes the server derive
  // the name from the assigned id.
  string name = 2;
  // Description of the Listener.
  string description = 3;
  // Resource labels as `` key:value `` pairs.
  map<string, string> labels = 4;

  // Transport protocol of the listener. Immutable after Listener.Create.
  Listener.Protocol protocol = 5;
  // Port the listener accepts traffic on. Must be 1-65535 and unique within the load balancer.
  int64 port = 6;

  // default_target_group_id — RETIRED AS AN INPUT (#1596). Retained as a request
  // field ONLY so that a client that sets it gets an EXPLICIT InvalidArgument
  // reject rather than a silent drop at the edge (the REST edge runs with
  // DiscardUnknown by deliberate product decision, so removing the field
  // outright would turn a wrong-but-well-meant request into a listener created
  // with NO target group). Same idiom as type/placement_type on
  // CreateNetworkLoadBalancerRequest.
  //
  // Setting it → InvalidArgument naming target_group_id as the replacement.
  string default_target_group_id = 11;

  // target_group_id — the target group the listener wires to. THE single input
  // for the wiring; optional. resolved_backend_port°/substatus° echo the wired
  // TG. Because there is only one input, no precedence between fields exists.
  string target_group_id = 12;
}

message CreateListenerMetadata {
  string listener_id = 1;
  string load_balancer_id = 2;
}

message UpdateListenerRequest {
  // proxy_protocol_v2=6 СНЯТ вместе с полем ресурса и полем создания. Путь маски
  // с этим именем теперь отвергается как НЕИЗВЕСТНЫЙ — вызывающий видит отказ,
  // а не молчаливое принятие настройки, которую никто не исполняет.
  reserved 6;
  reserved "proxy_protocol_v2";

  // ID of the Listener.
  string listener_id = 1;

  // Immutable fields rejected here: load_balancer_id, protocol, port (design
  // §3.3). Адресных полей у листенера больше нет — address_id/ip_version из
  // immutable-списка ушли вместе с переездом VIP на LoadBalancer.
  google.protobuf.FieldMask update_mask = 2;

  // Name of the Listener. Must be a DNS label (lowercase letters, digits and
  // hyphens, 1-63 characters) and is unique within the PARENT LOAD BALANCER —
  // NOT within the project. The scope is the one the database enforces:
  // `listeners_lb_name_uniq (load_balancer_id, name)`, so `https` may be reused
  // on every load balancer of a project. Empty on Create makes the server derive
  // the name from the assigned id.
  string name = 3;
  // Description of the Listener.
  string description = 4;
  // Resource labels as `` key:value `` pairs.
  map<string, string> labels = 5;

  // default_target_group_id — RETIRED AS AN INPUT (#1596). Retained only for the
  // explicit reject: SETTING it, or naming it in update_mask, → InvalidArgument
  // that names target_group_id as the replacement. See CreateListenerRequest for
  // why the field is kept rather than removed.
  //
  // The reject keys on the BODY too, not just the mask, because an empty mask
  // means a full-object PATCH: target_group_id would then be applied with its
  // own (empty) body value, so a request that used to WIRE a target group would
  // silently UNWIRE it instead.
  string default_target_group_id = 7;

  // target_group_id — repoint the listener to another target group. THE single
  // input for the wiring: present in update_mask it rewires the listener, an
  // empty value clears it. No precedence between fields exists.
  string target_group_id = 8;
}

message UpdateListenerMetadata {
  string listener_id = 1;
}

message DeleteListenerRequest {
  // ID of the Listener.
  string listener_id = 1;
}

message DeleteListenerMetadata {
  string listener_id = 1;
  string load_balancer_id = 2;
}

message ListListenerOperationsRequest {
  // ID of the Listener.
  string listener_id = 1;
  // Maximum number of results per page. 0 selects the service default (50);
  // a value above 1000 is rejected with INVALID_ARGUMENT rather than clamped.
  int64 page_size = 2;
  // Page token. To get the next page of results, set [page_token] to the
  // [ListListenerOperationsResponse.next_page_token] returned by a previous list request.
  string page_token = 3;
}

message ListListenerOperationsResponse {
  repeated operation.Operation operations = 1;
  string next_page_token = 2;
}