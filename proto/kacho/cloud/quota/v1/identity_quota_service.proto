syntax = "proto3";

package kacho.cloud.quota.v1;

import "google/api/annotations.proto";
import "kacho/cloud/quota/v1/quota.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/quota/v1;quotav1";

// IdentityQuotaService — the ceilings carried by the CALLER THEMSELVES.
//
// # Why this one service lives beside the shape instead of inside its owner
//
// Every other owner declares its `QuotaService` in its own package. This one
// cannot: the shared answer shape imports `kaname.cloud.iam.v1` for the scope of a
// stated value, so declaring the service inside `iam.v1` would make the two
// packages depend on each other — and a package cycle is refused by `buf lint`,
// not by taste. It therefore lives beside the message it returns.
//
// This is NOT the "single summary endpoint" the shared message's doc rules out.
// That one is refused because it would need `iam -> owner` calls to learn what is
// spent elsewhere, closing a cycle in the service graph. This service answers
// about ONE kind, counted in iam's own database, and calls nobody.
//
// # Why the subject is a human and not a project
//
// The account is the root of tenancy, so a ceiling over accounts is carried by
// the identity that creates them — the only thing that exists before an account
// and outlives it. There is no project to name here, and naming one would be a
// question about the wrong subject.
//
// # Why the tenant must be able to read this
//
// Account creation is self-service. Until this service existed the ceiling over
// it was invisible: a human who had reached it saw a refusal on the one action
// the platform invites them to perform first, with no way to learn their ceiling,
// their consumption, or that a ceiling exists at all — indistinguishable, from
// their side, from a broken platform.
//
// READ ONLY. The value is administered through `iam.v1.InternalLimitService`
// under `system_admin` on the internal listener. A tenant who can raise their own
// ceiling does not have one.
service IdentityQuotaService {
  // List the quotas carried by the calling identity.
  //
  // NO REQUEST FIELDS, AND THAT IS THE POINT. The subject is the authenticated
  // caller and nobody else: there is no id to supply, so there is no id to
  // substitute. One identity cannot ask about another's consumption because the
  // question is not expressible — a stronger guarantee than a check that would
  // have to be right every time.
  //
  // NO PAGINATION, DELIBERATELY. One kind is carried by the identity today, and
  // the catalogue that could add more is closed and bounded by a migration.
  rpc List (ListIdentityQuotasRequest) returns (ListIdentityQuotasResponse) {
    option (google.api.http) = { get: "/iam/v1/quotas" };

    // EXEMPT from the per-RPC scope Check, for the same reason `Account.Create`
    // is: there is no parent object to check against. The answer is derived from
    // the verified principal, never from a caller-supplied id, so the only
    // question that could be asked here — "may this caller see this?" — is
    // answered by authentication alone.
    //
    // A cluster-scoped relation would be WORSE than exempt, not stricter: `viewer
    // @ cluster` is satisfiable by the wildcard tuple the platform writes for its
    // global catalogues, so it would answer "yes" to every authenticated caller
    // while looking like a gate. Exempt says the same thing and says it honestly.
    //
    // authN is NOT waived: the edge's exempt branch still requires a valid
    // principal, and an anonymous call has no identity to answer about.
    option (kacho.iam.authz.v1.permission) = "<exempt>";
    option (kacho.iam.authz.v1.exempt_reason)  = "SELF_SERVICE";
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

// Request for IdentityQuotaService.List.
//
// Empty, and it stays empty: a field naming whose quotas to read would turn a
// question about oneself into a question about someone else.
message ListIdentityQuotasRequest {}

// Response for IdentityQuotaService.List.
message ListIdentityQuotasResponse {
  // Every kind carried by the identity, always — never a subset and never an
  // empty array.
  //
  // A human who has created nothing reads the full set with `used = 0`. The empty
  // array is reserved for a statement this service never makes: "you have no
  // quotas". A tenant given `[]` would conclude they are unlimited, and they are
  // not (api-conventions, "an empty value must mean empty").
  //
  // `carrier_type` is `identity` and `carrier_id` is the caller's own login
  // subject: the row describes the carrier it is counted against, and here that
  // carrier is the reader.
  repeated Quota quotas = 1;
}
