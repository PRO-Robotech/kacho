syntax = "proto3";

package kacho.cloud.iam.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "kacho/cloud/api/operation.proto";
import "kacho/cloud/iam/v1/user.proto";
import "kacho/cloud/operation/operation.proto";
import "kacho/cloud/validation.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/iam/v1;iamv1";

// A set of methods for managing User resources per-Account scope.
//
// Модель User (per-Account):
// - User per-Account: каждый User-row принадлежит ровно одному Account.
// - Invite RPC — admin Account'а приглашает email; backend создает PENDING-row.
// - Activate-on-first-login — при первом login через Kratos с матчингом email
//   PENDING → ACTIVE через InternalUserService.UpsertFromIdentity.
// - Create RPC — DEPRECATED; возвращает FailedPrecondition «Use Invite».
service UserService {
  // Returns the specified User resource.
  rpc Get (GetUserRequest) returns (User) {
    option (google.api.http) = { get: "/iam/v1/users/{user_id}" };
    option (kacho.iam.authz.v1.permission)        = "iam.users.get";
    option (kacho.iam.authz.v1.required_relation) = "v_get";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "iam_user"
      from_request_field: "user_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Retrieves the list of User resources scoped by Account.
  rpc List (ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = { get: "/iam/v1/users" };
    // User.List is default-deny via a SCOPE-FILTER, not
    // a PermissionDenied. The kacho-iam handler returns 200 with only the
    // Users in Accounts where the principal is a member (EMPTY list when the
    // caller is not a member of the requested Account — never 403). The
    // handler is the authoritative scope-filter gate, so the gateway
    // middleware exempts this RPC. Anonymous is still rejected by the IAM
    // anti-anonymous interceptor.
    // Сужение происходит НА ДАННЫХ, и это объявлено машинно, а не прозой:
    // обработчик читает страницу курсором и спрашивает модель про идентификаторы
    // ЭТОЙ страницы. Единого объекта, про который край мог бы спросить заранее,
    // у такого чтения нет by construction.
    //
    // Полоса `scope_filtered`, а НЕ `<exempt>`: последняя несёт второй смысл,
    // которому здесь не место — она допускает вызов внутреннего слушателя
    // ВООБЩЕ БЕЗ ПРИНЦИПАЛА, на основании сетевого положения. Пообъектный фильтр
    // ниже по стеку без принципала бессмыслен, поэтому лоток обязан быть тот,
    // который идёт ПОСЛЕ его извлечения.
    option (kacho.iam.authz.v1.permission)     = "iam.users.list";
    option (kacho.iam.authz.v1.scope_filtered) = true;
  }

  // Invite a user by email. Если user уже invited в этот Account
  // (idempotent re-invite) — Operation возвращается, AB опционально создается.
  // Permission: requires `admin` OR `editor` relation на account_id.
  rpc Invite (InviteUserRequest) returns (operation.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/users:invite"
      body: "*"
    };
    option (kacho.cloud.api.operation) = {
      metadata: "InviteUserMetadata"
      response: "User"
    };
    // CanInviteUsers == `editor` on the target Account.
    option (kacho.iam.authz.v1.permission)        = "iam.users.invite";
    option (kacho.iam.authz.v1.required_relation) = "editor";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "account"
      from_request_field: "account_id"
    };
    // Step-up (acr=2) — Invite is a PRIVILEGE-GRANT surface, not routine
    // lifecycle: `project_id` + `role_id` make it create an AccessBinding
    // ATOMICALLY with the invite row (see the Invite use-case), i.e. it hands
    // out exactly what AccessBindingService/Create hands out. Leaving it at the
    // AAL1 floor while Create demands acr=2 would be a step-up BYPASS — the same
    // grant issued through the cheaper door. Step-up stays sensitive-only (the
    // routine User lifecycle Get/Update/Delete keeps "1").
    option (kacho.iam.authz.v1.required_acr_min) = "2";
  }

  // Updates the specified User. Единственное mutable-поле — `labels` (User —
  // label-selectable наравне с account/project). Identity-поля (`external_id`
  // — IdP `sub`, и иные IdP-projected identity-ключи) hard-immutable: их наличие
  // в update_mask → INVALID_ARGUMENT "<field> is immutable after User.Create".
  // Async — возвращает Operation (как Update всех iam-ресурсов).
  //
  // WHO may call it is `record_writer` on `iam_user`, and it carries NO
  // account-level source (#1102). The row is a GLOBAL identity — one per person
  // for the whole platform — so `labels`, its only mutable field, decides which
  // selector grants match the person in EVERY Account, not just the one the label
  // was set from. A label being per-Account in meaning while living on a global
  // row is its own subject (#1126); the right to write it stopped being an
  // account-level one already.
  //
  // Reading the record keeps its account-level sources on purpose: seeing the
  // people of your own Account is the Account's business (`v_get` / `v_list`).
  rpc Update (UpdateUserRequest) returns (operation.Operation) {
    option (google.api.http) = { patch: "/iam/v1/users/{user_id}" body: "*" };
    option (kacho.cloud.api.operation) = {
      metadata: "UpdateUserMetadata"
      response: "User"
    };
    option (kacho.iam.authz.v1.permission)        = "iam.users.update";
    option (kacho.iam.authz.v1.required_relation) = "record_writer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "iam_user"
      from_request_field: "user_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Deletes the specified user.
  rpc Delete (DeleteUserRequest) returns (operation.Operation) {
    option (google.api.http) = { delete: "/iam/v1/users/{user_id}" };
    option (kacho.cloud.api.operation) = {
      metadata: "DeleteUserMetadata"
      response: "google.protobuf.Empty"
    };
    option (kacho.iam.authz.v1.permission)        = "iam.users.delete";
    option (kacho.iam.authz.v1.required_relation) = "v_delete";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "iam_user"
      from_request_field: "user_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Blocks the specified person: the identity may no longer authenticate
  // anywhere on the platform.
  //
  // WHAT IT IS SCOPED TO, because getting this wrong is a cross-tenant outage.
  // A `users` row is NO LONGER a membership. One person is ONE row for the whole
  // platform (global keys `users_identity_email_uniq` /
  // `users_identity_external_id_uniq`, migration 20260823050000), and belonging
  // to Accounts is expressed by `memberships` rows, of which there may be many.
  // The state written here therefore reaches EVERY Account the person is in:
  // token issuance walks the membership set and serves the first row that may
  // authenticate, and now "none can" arrives at once, because the state is one
  // per person. This is the owner's decision "a block is a property of the
  // identity" (question В-8 of the IAM-ID-1 acceptance), not a side effect.
  //
  // > This paragraph used to say the opposite — that a block belonged to the
  // > Account that issued it and that the admin of Account A could not switch a
  // > person off in Account B. That was true until the row stopped being a
  // > membership, and it outlived its subject. It is restated here rather than
  // > deleted because it reads as an active security boundary: the next reader
  // > looking for the radius of a block would have taken it for a fact. The code
  // > side of the same correction is in the Block use-case
  // > (`api/user/set_blocked.go`); the observable one is
  // > `api/audit/user_block_integration_test.go`.
  //
  // WHY AN ACTION AND NOT A FIELD ON Update. This is the reason the state was
  // never ADDED to UpdateUserRequest, not a description of a bug that was there:
  // an empty `update_mask` means full-object replacement by platform convention,
  // and a proto3 enum cannot say "not sent", so the obvious design — one more
  // maskable field — would let a client block a membership by simply not filling
  // it in. The state that decides whether a person still has access must not be
  // reachable by forgetting something. It is also an EVENT ("this membership was
  // suspended"), not the editing of an attribute, and the audit trail has to be
  // able to say so.
  //
  // Step-up (acr=2) — this is a security-posture change, not routine lifecycle,
  // and it is classified with the credential surface for the same reason
  // ServiceAccountService/Disable is: it decides whether a principal may
  // authenticate at all. The floor is INTERACTIVE-ONLY: a service-account
  // principal is exempt from it by platform rule, so for machine callers this
  // RPC costs exactly what Update costs. It raises assurance for people; it is
  // not a second authorization gate.
  //
  // WHO may call it is `identity_suspender` on `iam_user` — a relation of its
  // own, with NO account-level source: neither a per-object grant, nor the
  // delegated Account administrator, nor the Account owner (#1102).
  //
  // It used to be `v_update`, shared with Update, and the argument for sharing
  // was that whoever may rename a membership may also suspend it. That argument
  // died with the membership: the state now switches the person off on the whole
  // platform, so an Account administrator holding it decides for Accounts he has
  // nothing to do with. What the person who invited him keeps is what the owner's
  // directive names — adding and removing rights in his own Account
  // (`iam_access_binding`), plus reading his people (`v_get` / `v_list` keep
  // their account-level sources deliberately).
  //
  // An ordinary member does NOT hold it on their own row, and neither does the
  // person himself: `subject` is not a source here, so self-lifting is
  // impossible by construction.
  //
  // Per-account exclusion as an ACTION does not exist yet — `memberships` has no
  // suspended state and no removal RPC — so "block within my Account" is
  // expressed by withdrawing the grants. Subject and removal predicate: #1127.
  //
  // IDEMPOTENT: the argument is the STATE, not a transition. Blocking a
  // membership that is already blocked succeeds and reports it blocked — the
  // safe direction of this control must never be the one that fails on retry.
  //
  // A PENDING invitation cannot be blocked: it carries no external identity yet
  // (DB CHECK `users_invite_status_consistency`), so there is nothing to refuse
  // — FAILED_PRECONDITION. Revoke the invitation instead.
  //
  // Already-issued access tokens are NOT invalidated by this call; they expire
  // on their own schedule. What stops immediately is every path that mints a
  // NEW one (token hook, refresh hook, personal-token issuance, subject
  // resolution at the edge).
  rpc Block (BlockUserRequest) returns (operation.Operation) {
    option (google.api.http) = { post: "/iam/v1/users/{user_id}:block" body: "*" };
    option (kacho.cloud.api.operation) = {
      metadata: "BlockUserMetadata"
      response: "User"
    };
    option (kacho.iam.authz.v1.permission)        = "iam.users.block";
    option (kacho.iam.authz.v1.required_relation) = "identity_suspender";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "iam_user"
      from_request_field: "user_id"
    };
    option (kacho.iam.authz.v1.required_acr_min)  = "2";
  }

  // Unblocks the specified User membership: it may authenticate into that
  // Account again.
  //
  // The counterpart of Block, and it exists for the same reason the state is a
  // column rather than a deletion — a suspended membership has to be able to
  // come back. A one-way control is one an operator will not reach for, and a
  // person with no administrative way back is locked out permanently: self-serve
  // password recovery deliberately does NOT lift a block (it proves ownership of
  // a mailbox, which is not what the administrator called into question).
  //
  // Same shape throughout: action not field, Operation, step-up, idempotent
  // (unblocking an active membership succeeds). A PENDING invitation is refused
  // here too — turning an unconfirmed invitee into an active member is
  // activation-on-first-login, a different path with a different subject.
  rpc Unblock (UnblockUserRequest) returns (operation.Operation) {
    option (google.api.http) = { post: "/iam/v1/users/{user_id}:unblock" body: "*" };
    option (kacho.cloud.api.operation) = {
      metadata: "UnblockUserMetadata"
      response: "User"
    };
    option (kacho.iam.authz.v1.permission)        = "iam.users.unblock";
    option (kacho.iam.authz.v1.required_relation) = "identity_suspender";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "iam_user"
      from_request_field: "user_id"
    };
    option (kacho.iam.authz.v1.required_acr_min)  = "2";
  }

  // Lists operations for the specified user.
  rpc ListOperations (ListUserOperationsRequest) returns (ListUserOperationsResponse) {
    option (google.api.http) = { get: "/iam/v1/users/{user_id}/operations" };
    option (kacho.iam.authz.v1.permission)        = "iam.user_operationses.listOperations";
    option (kacho.iam.authz.v1.required_relation) = "v_list";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "iam_user"
      from_request_field: "user_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetUserRequest {
  // ID of the User resource to return.
  string user_id = 1 [(required) = true, (length) = "<=20"];
}

message ListUsersRequest {
  // Account-scope filter. Required для регулярного user (default-deny
  // фильтрует Users по Account). system-admin может оставить пустым (видит всех).
  string account_id = 4 [(length) = "<=20"];

  // The maximum number of results per page to return. Default value: 100.
  int64 page_size = 1 [(value) = "<=1000"];

  // Page token.
  string page_token = 2 [(length) = "<=100"];

  // A filter expression. Exactly one term, in the form `field="value"`.
  //
  //   email="a@b.io"          exact match, case-insensitive
  //   external_id="..."       exact match
  //   invite_status="ACTIVE"  exact match
  //   search="min.ops"        case-insensitive SUBSTRING over email AND id
  //
  // `search` is the term a console types into: a User has no `name`, and the
  // exact-match terms above only answer someone who already knows the whole
  // value. `%` and `_` in its value are matched literally, not as wildcards.
  string filter = 3 [(length) = "<=1000"];
}

message ListUsersResponse {
  // List of User resources.
  repeated User users = 1;

  // This token allows you to get the next page of results for list requests.
  string next_page_token = 2;
}

// Invite a user by email.
message InviteUserRequest {
  // Account where the user is invited. Required.
  string account_id = 1 [(required) = true, (length) = "<=20"];

  // Email of the invitee. Required, case-insensitive lookup.
  string email = 2 [(required) = true, (length) = "1..256"];

  // Display name to seed the User-row (optional; will be overwritten on first
  // login from Kratos identity traits).
  string display_name = 3 [(length) = "<=256"];

  // Optional: project_id + role_id pair to create AccessBinding atomically.
  // Если оба не заполнены — только invite-row создается (admin позже выдает роли
  // через AccessBindingService.Create).
  string project_id = 4 [(length) = "<=20"];
  string role_id = 5 [(length) = "<=20"];
}

message UpdateUserRequest {
  // Flat-форма request'а (паритет с UpdateRole/ServiceAccount/AccessBinding/...):
  // mutable-поля лежат на верхнем уровне, без вложенного ресурса.
  reserved 3;
  reserved "user";

  // ID of the User resource to update.
  string user_id = 1 [(required) = true, (length) = "<=20"];

  // Field mask. Allowed field: `labels` (единственное mutable-поле).
  // external_id и иные IdP-projected identity-поля immutable: их наличие в
  // update_mask → INVALID_ARGUMENT. Пустой mask → full-PATCH над mutable
  // `labels` (immutable-поля resource-пути silently игнорируются).
  google.protobuf.FieldMask update_mask = 2;

  // Tenant-facing метки самого ресурса User (mutable; `labels` в update_mask).
  // Единственное применяемое mutable-поле; identity-поля (`external_id` и иные
  // IdP-projected) hard-immutable и в request не переносятся. Аннотации
  // (size/key/value pattern) — паритет account/project/group/role request `labels`.
  map<string, string> labels = 4 [(kacho.cloud.size) = "<=64", (length) = "<=63", (pattern) = "[-_0-9a-z]*", (map_key).length = "1-63", (map_key).pattern = "[a-z][-_0-9a-z]*"];
}

message DeleteUserRequest {
  // ID of the User resource to delete.
  string user_id = 1 [(required) = true, (length) = "<=20"];
}

message BlockUserRequest {
  // ID of the User membership row to block. The only input: the state is the
  // verb, so there is no field that could be forgotten.
  string user_id = 1 [(required) = true, (length) = "<=20"];
}

message UnblockUserRequest {
  // ID of the User membership row to unblock.
  string user_id = 1 [(required) = true, (length) = "<=20"];
}

message ListUserOperationsRequest {
  // ID of the User resource to list operations for.
  string user_id = 1 [(required) = true, (length) = "<=20"];

  // The maximum number of results per page that should be returned.
  int64 page_size = 2 [(value) = "<=1000"];

  // Page token.
  string page_token = 3 [(length) = "<=100"];
}

message ListUserOperationsResponse {
  // List of operations for the specified user.
  repeated operation.Operation operations = 1;

  // This token allows you to get the next page of results for list requests.
  string next_page_token = 2;
}
