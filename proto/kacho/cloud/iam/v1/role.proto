syntax = "proto3";

package kacho.cloud.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/iam/v1;iamv1";

// A Role resource. Named permission bundle.
//
// Roles бывают двух типов:
//   - system roles (is_system=true, cluster_id='cluster_kacho_root') — seed'ятся
//     миграциями kacho-iam, read-only через публичный API (Update/Delete на
//     system role → FailedPrecondition).
//   - custom roles (is_system=false) — multi-scope: точно один из
//     `account_id` / `project_id` non-empty, другой пустой. Mutual exclusion
//     enforced DB-level CHECK `roles_scope_xor`.
//     (B2B Organization scope fully removed.)
//
// Backward-compat: existing pre-0011 rows with `account_id` set
// remain valid — они классифицируются как account-scoped custom branch.
//
// Permission string format — `<domain>.<resource>.<verb>`.
//
// Policy model (authored `rules` vs compiled `permissions`):
//   - `rules` (tag 11) — authored-политика И публичная API-поверхность роли:
//     UI/клиенты рендерят роль из `rules[]` (источник истины).
//   - `permissions` (tag 5, live) — INTERNAL compiled-форма для FGA-эмиссии
//     (anchor/resource_names-армы, 4-сегмент `module.resource.resourceName.verb`);
//     matchLabels-правила в `permissions` НЕ компилируются. Помечено
//     `[deprecated=true]`: нельзя удалить (buf-breaking), но это внутренняя
//     проекция — в `Get`/`List`-ответах для rules-ролей НЕ заполняется (пустое),
//     на входе `Create`/`Update` ИГНОРИРУЕТСЯ (client-sent → INVALID_ARGUMENT).
//
// aggregationRule (composite roles) — пока не реализовано; будет добавлено
// append-only позже отдельным tag'ом (tag НЕ зарезервирован заранее).
//
// Resource id prefix: `rol` (concatenated form, `ids.NewID`).
message Role {
  // ID of the role.
  string id = 1;

  // ID of the Account that owns this custom Role (legacy account-scoped
  // branch). Empty for system roles and for org/project/cluster-scoped roles.
  string account_id = 2;

  // Name of the role. Unique within the active scope (one of cluster_id /
  // account_id / project_id; partial UNIQUE indexes per scope).
  string name = 3;

  // Description of the role.
  string description = 4;

  // INTERNAL compiled-форма (anchor/resource_names-армы) для FGA-эмиссии. НЕ
  // часть публичного API-ответа для rules-ролей (пустое в Get/List).
  // Публичная поверхность роли — `rules` (tag 11).
  //
  // На входе исход зависит от ПУТИ и от МАСКИ, и он ровно один на каждый:
  //   Create, значение непусто             -> INVALID_ARGUMENT
  //       "Illegal argument permissions (compiled/output-only)";
  //   Update, поле названо в update_mask   -> INVALID_ARGUMENT
  //       "permissions is immutable after Role.Create";
  //   Update, поле в теле, маска молчит    -> значение не читается вовсе
  //       (конвенционный full-object PATCH: immutable из тела не применяются).
  // Присланное значение не применяется ни одним путём: два пути отвергают его
  // синхронно, третий не читает. Прежняя редакция называла все три «на входе
  // Create/Update игнорируется» — верно только для третьего.
  //
  // Три исхода закреплены пробами пакета role (имена, а не координаты — они
  // переживают вставку строк): TestRoleHandler_A02_CreateRejectsPermissions,
  // TestRoleHandler_A08_UpdateRejectsPermissionsMask,
  // TestRoleHandler_UpdatePermissionsInBodyWithoutMask_IsNotRead и парный к
  // нему TestRoleHandler_UpdatePermissionsDiscriminatorIsTheMask.
  repeated string permissions = 5 [deprecated = true];

  // True for system roles (seed'ятся миграциями, read-only публично). When
  // true, `cluster_id` MUST equal `cluster_kacho_root` and the other scope
  // fields MUST be empty (DB CHECK `roles_scope_xor`).
  bool is_system = 6;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 7;

  // ID of the Cluster that owns this Role. Non-empty only for system roles
  // (literal `cluster_kacho_root`).
  string cluster_id = 8;

  // TOMBSTONE (DB column dropped in migration 0008; proto field also
  // dropped). Org-scoped roles были упразднены вместе с
  // B2B Organization. Tag 9 & name `organization_id` зарезервированы и никогда
  // не переиспользуются (append-only / buf-breaking tombstone discipline,
  // enforced by scripts/tombstone_enforce.sh).
  reserved 9;
  reserved "organization_id";

  // ID of the Project that owns this Role. Non-empty only for project-scoped
  // custom roles.
  string project_id = 10;

  // --- APPEND-ONLY; tag'и ≥11 ---

  // Authored-политика роли: 1..64 правил. Источник истины И публичная
  // API-поверхность (UI/клиенты рендерят роль из `rules`). Каждое Rule —
  // однородный грант `{verbs}` над `{module} × resources` (ровно один модуль
  // на правило), опц. суженный `resource_names` XOR `match_labels`.
  // Роль, покрывающая несколько модулей = несколько правил (по одному на модуль).
  repeated Rule rules = 11;

  // Optimistic-concurrency token (xmin-backed) для Role.Update под
  // конкуренцией. Output на Get/List; обязателен на входе Update при
  // изменении `rules` (OCC).
  string resource_version = 12;

  // ID of the User that authored this Role (governance/audit).
  string created_by_user_id = 13;

  // Last-update timestamp.
  google.protobuf.Timestamp updated_at = 14;

  // Tenant-facing метки самого ресурса Role (НЕ путать с `Rule.match_labels`,
  // которое отбирает ОБЪЕКТЫ под грантом). Единая модель видимости
  // IAM-ресурсов: Role — label-selectable, как account/project; ARM_LABELS-грант
  // на iam.role материализует v_list по совпадению `labels @> matchLabels`
  // (iam-direct same-DB), а List фильтрует через `viewer ∪ v_list`. Mutable
  // через Update (`labels` в update_mask).
  map<string, string> labels = 15;

  // Definition tier (redesign-2026 F4) — the hierarchy tier this role is DEFINED
  // at, dotted (`iam.cluster` | `iam.account` | `iam.project`) + the anchor id.
  // Output projection over the within-service typed scope columns
  // (cluster_id / account_id / project_id); the word "scope" is reserved for the
  // AccessBinding anchor. `is_system` (tag 6) is DERIVED from the tier
  // (tier_type == `iam.cluster`), not an independently stored provenance flag.
  DefinitionTier definition_tier = 16;

  // Authored verb set (redesign-2026 F6) — the DEDUPED, canonically-ordered union
  // of the verbs the role's `rules[]` grant (output-only derived preview; `*`
  // expands to full CRUD). Empty for a label-only role.
  repeated string authored_verbs = 17;

  // Effective verb set (redesign-2026 F6) — the HONEST co-materialized preview of
  // what the role actually grants. It equals `authored_verbs` PLUS, for an
  // editor-tier role (grants `update` but not `delete`/`*`), the `delete*`
  // qualifier: an editor may delete the in-scope leaf objects it edits (but NOT
  // the account/project anchor). Output-only derived.
  repeated string effective_verbs = 18;

  // Per-verb notes (redesign-2026 F6) — clarifies the derived preview. Keyed by
  // the verb; e.g. `verb_notes["delete*"]` explains the editor delete-qualifier.
  // Output-only derived.
  map<string, string> verb_notes = 19;

  // Display name of a CANONICAL role (redesign-2026 F6) — the label of the four
  // catalog names and of nothing else: `view` -> "Viewer", `edit` -> "Editor",
  // `admin` -> "Admin", `owner` -> "Owner". Output-only.
  //
  // For every OTHER role this field equals `name`, and that is the contract
  // rather than a gap. A role declared by a module manifest reads back its own
  // identifier here (`vpc.address.admin`), exactly as a custom role does. The
  // human prose of such a role is carried by `description`: the module author
  // writes it in the module manifest, and it reaches this response unchanged.
  // A second carrier for the same prose is deliberately not introduced (#1925).
  string display_name = 20;

  // Purpose of a CANONICAL role (redesign-2026 F6) — a one-line statement of
  // what the role is for, held by the same catalog of four names. Output-only.
  //
  // EMPTY for every other role, a module role included, and the empty value
  // means "this catalog has no entry for that role" — not "the role has no
  // purpose". A module role states its purpose in `description` (#1925).
  string purpose = 21;

  // Целость роли (#1035) — даёт ли роль то, что объявляет. Output-only,
  // производное; на входе Create/Update поля нет вовсе (перечень полей запроса
  // его не содержит), поэтому прислать его нельзя ни одним путём.
  //
  // ЗАПОЛНЯЮТ ЧТЕНИЯ РЕСУРСА — `Get` и `List`, ОДИНАКОВО и одним производителем.
  // Ответ операции (`Create`/`Update` → `Operation.response`) его НЕ несёт:
  // `ROLE_HEALTH_UNSPECIFIED` там означает «этим ответом не вычислено» и
  // НИКОГДА «роль здорова».
  //
  // ИСТОЧНИК У НЕГО ДРУГОЙ, ЧЕМ У `authored_verbs` / `effective_verbs`, и это
  // решение, а не расхождение. Те считаются от СКОМПИЛИРОВАННОЙ таблицы типов,
  // это — от строк, которые читает вердикт. Расходятся они в обе стороны:
  //   - строка каталога снята → те не меняются, это меняется;
  //   - тип объявлен, но модель его не знает → те показывают ВЕСЬ словарь
  //     глаголов платформы (запасной словарь неизвестного типа), это — EMPTY.
  // Складывать их в один предикат нельзя: они отвечают на разные вопросы —
  // «что роль обещает» и «что вердикт по ней даёт».
  RoleHealth health = 22;

  // Сколько АДРЕСУЕМЫХ сегментов объявляют правила роли (#1035). Output-only.
  //
  // Сегмент — пара «точечный ресурс × глагол» либо «точечный ресурс × любой
  // глагол» (правило с `verbs: ["*"]` даёт ОДИН сегмент, а не по одному на
  // глагол типа). Подстановка в модуле и в ресурсе сегментов не даёт: она
  // называет не имя, а «все», и терять ей нечего.
  //
  // Ноль законен (роль `*.*`, унаследованная роль без правил) и от «не считали»
  // отличается СОСТОЯНИЕМ рядом, а не собственной величиной.
  int32 declared_segments = 23;

  // Сколько из объявленных сегментов не дают НИ ОДНОЙ строки проекции,
  // которую читает вердикт (#1035). Output-only.
  //
  // Равен нулю у здоровой роли, равен `declared_segments` у роли, не дающей
  // ничего. Значим только при `health != ROLE_HEALTH_UNSPECIFIED`.
  int32 unresolved_segments = 24;

  // Что у роли ОТОБРАНО и почему (#1992). Output-only, производное.
  //
  // `unresolved_segments` говорит СКОЛЬКО сегментов перестало проецироваться и
  // не говорит, ЧТО именно и по какой причине. Со стороны арендатора «право
  // отобрали» без этого неотличимо от «права не было».
  //
  // ЗАПОЛНЯЮТ ЧТЕНИЯ РЕСУРСА — `Get` и `List`, ОДИНАКОВО и одним производителем,
  // тем же, что и три поля выше. Ответ операции (`Create`/`Update`) поля не
  // несёт: пустой список там означает «этим ответом не вычислено», ровно как
  // `ROLE_HEALTH_UNSPECIFIED` рядом.
  //
  // ИСТОЧНИК — ведомость переселения: строки проекций, потерявшие референт при
  // снятии строки каталога, ПЕРЕСЕЛЯЮТСЯ в неё, а не отбираются молча. Поэтому
  // список ОБЪЯСНЯЕТ состояние и не определяет его: у роли, пострадавшей вторым
  // путём (тип объявлен, а модель прав его не знает), переселения не было вовсе,
  // и список пуст при `health != HEALTHY`. Судить целость по этому списку
  // значило бы читать такую роль здоровой.
  //
  // ПУСТОЙ СПИСОК ОЗНАЧАЕТ «ПУСТО»: у роли, ничего не терявшей, отобранного нет.
  // Порядок элементов НЕ ЗНАЧИМ — это набор; сверять его надо по составу, а не
  // по индексу.
  repeated WithdrawnGrant withdrawn_grants = 25;
}

// WithdrawnGrant — одна проекция правила роли, потерявшая референт при снятии
// строки каталога платформы (#1992).
//
// Пара «тип объекта + глагол» адресует ровно то, что перестало действовать.
// Пустой `verb` — ЯКОРЬ: строка пришла из объявления правила, у которого глагол
// не назван поимённо.
message WithdrawnGrant {
  // Точечный тип объекта (`<модуль>.<ресурс>`), чью строку каталога сняли.
  string object_type = 1;

  // Глагол. ПУСТАЯ строка — якорь объявления правила, а не «любой глагол».
  string verb = 2;

  // Из какой проекции правила переселена строка.
  WithdrawnGrantSource source = 3;

  // Причина снятия строки каталога, записанная применителем манифеста.
  // Это причина ПЛАТФОРМЫ, а не действие арендатора: свою роль он не менял.
  string reason = 4;

  // Момент переселения. Время ТРАНЗАКЦИИ применения: у всего, что отобрано
  // одним применением, он совпадает дословно.
  google.protobuf.Timestamp withdrawn_at = 5;
}

// WithdrawnGrantSource — из какой проекции правила переселена строка.
//
// Популяции РАЗДЕЛЕНЫ намеренно: «право отобрано» и «правило перестало
// резолвиться» — разные события для того, кто разбирает последствия, и сложив
// их, мы потеряли бы именно это различие.
enum WithdrawnGrantSource {
  // Не вычислено ЭТИМ ответом. Никогда не означает «популяция неизвестна».
  WITHDRAWN_GRANT_SOURCE_UNSPECIFIED = 0;

  // Выдача глагола: право по этой паре действовало и перестало.
  WITHDRAWN_GRANT_SOURCE_GRANT = 1;

  // Объявление правила: сегмент правила перестал резолвиться в каталог.
  WITHDRAWN_GRANT_SOURCE_RULE_REFERENCE = 2;
}

// RoleHealth — состояние целости роли (#1035): даёт ли она то, что объявляет.
//
// Выводится из ТОГО ЖЕ, что читает вердикт: «правило есть, строк проекции нет»
// ⇒ не HEALTHY, какова бы ни была причина. Каталог и ведомость снятого только
// ОБЪЯСНЯЮТ и состояния не определяют — иначе роль, чьё написание в каталоге
// законно, а проекция пуста, читалась бы здоровой (форма инцидента 513001).
enum RoleHealth {
  // Не вычислено ЭТИМ ответом. НИКОГДА не означает «роль здорова»: ответы
  // операций поля не несут, и нулевой вариант отличает их от вычисленного нуля.
  ROLE_HEALTH_UNSPECIFIED = 0;

  // Каждый адресуемый сегмент роли имеет строку проекции. Роль без адресуемых
  // сегментов тоже здорова: терять ей нечего.
  ROLE_HEALTH_HEALTHY = 1;

  // Часть сегментов проекции не даёт, часть даёт: роль даёт МЕНЬШЕ объявленного.
  ROLE_HEALTH_DEGRADED = 2;

  // Сегменты объявлены, проекции нет ни одной: роль не даёт НИЧЕГО, оставаясь
  // на вид действующей. Это и есть форма инцидента 513001.
  ROLE_HEALTH_EMPTY = 3;
}

// DefinitionTier is the hierarchy tier a Role is defined at (redesign-2026 F4):
// `tier_type` dotted (`iam.cluster` | `iam.account` | `iam.project`) + `tier_id`
// the anchor object id. A projection over the within-service typed scope columns
// (cluster_id / account_id / project_id). `is_system` is derived
// (tier_type == `iam.cluster`), never a stored provenance flag (roles_definition_tier_xor
// DB CHECK keeps exactly one tier anchor non-null).
message DefinitionTier {
  // Dotted tier type: `iam.cluster` | `iam.account` | `iam.project`.
  string tier_type = 1;

  // Anchor object id (`cluster_kacho_root` | `acc…` | `prj…`).
  string tier_id = 2;
}

// Rule — один однородный грант: `{verbs}` над `{module} × resources` (ровно
// ОДИН модуль на правило), опционально суженный `resource_names`
// (pin-by-id) XOR `match_labels` (наше расширение над K8s RBAC, AND-equality).
// Отсутствие обоих селекторов = ВСЕ инстансы `{module} × resources` в пределах
// scope биндинга (ARM_ANCHOR).
//
// `arm` (ARM_ANCHOR / ARM_LABELS / ARM_NAMES) выводится клиентом из формы
// правила — отдельного диагностического поля нет. Feed-доступность типа —
// жесткий feed-gate на Role.Create (`match_labels` на не-fed тип →
// INVALID_ARGUMENT), не поле ответа.
message Rule {
  // `Rule.modules` (repeated) → `Rule.module`
  // (scalar). Ровно ОДИН модуль на правило: декартово `modules × resources`
  // схлопывается в `{module} × resources × verbs` (resources чисто отображаются
  // на module). Роль, покрывающая несколько модулей, выражается несколькими
  // правилами (по одному на модуль). Намеренный major bump — tag 1 + имя
  // `modules` зарезервированы tombstone-дисциплиной (тот же прием, что
  // `AccessBinding` reserved 16/18; reserved, НЕ [deprecated]),
  // никогда не реюзаются (enforced — scripts/tombstone_enforce.sh).
  reserved 1;
  reserved "modules";

  // Типы ресурсов гранта. 1..16; lowercase. Literal `"*"` — SYSTEM-ONLY;
  // только как единственный элемент.
  repeated string resources = 2;

  // Глаголы гранта. 1..16; lowercase. Literal `"*"` — SYSTEM-ONLY; только как
  // единственный элемент.
  repeated string verbs = 3;

  // Pin-by-id селекция инстансов (K8s-native). ≤256; opaque-id; literal `"*"`
  // запрещен как элемент. Взаимоисключающе с `match_labels`.
  repeated string resource_names = 4;

  // Label-equality селекция инстансов (наше расширение; AND-equality). ≤16
  // ключей; если задано — непусто. Взаимоисключающе с `resource_names`.
  map<string, string> match_labels = 5;

  // Domain-модуль гранта (ровно один). lowercase; грамматика
  // `^[a-z][a-z0-9-]*$`; член закрытого набора модулей платформы
  // (`iam`/`vpc`/`compute`/`loadbalancer`/`registry`/`storage`). Набор ВЫВОДИТСЯ
  // из домена (`domain.KnownModules`), а этот перечень его лишь называет —
  // расхождение между ними держит гейт, а не внимание. Literal `"*"` — SYSTEM-ONLY
  // (в custom-роли → INVALID_ARGUMENT). `(size)` не переносится из
  // прежнего repeated `modules` — это cardinality repeated-поля, у scalar ее
  // нет. tag 6 — первый свободный (1–5 заняты).
  string module = 6;
}

message CreateRoleMetadata {
  // ID of the Role that is being created.
  string role_id = 1;
}

message UpdateRoleMetadata {
  // ID of the Role that is being updated.
  string role_id = 1;
}

message DeleteRoleMetadata {
  // ID of the Role that is being deleted.
  string role_id = 1;
}
