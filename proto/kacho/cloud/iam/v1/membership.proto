syntax = "proto3";

package kacho.cloud.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/iam/v1;iamv1";

// Membership — принадлежность человека аккаунту, ОТДЕЛЬНАЯ связь.
//
// Человек в Kachō — глобальная личность (`iam_user`), и состоять он может в
// нескольких аккаунтах сразу. Принадлежность поэтому не поле человека, а
// собственная сущность: у неё своя идентичность, своё состояние и свой след
// приглашения.
//
// Ресурс ВЫХОДНОЙ: глаголов создания, правки и снятия у него на этой поверхности
// нет — членство заводит приглашение, а снимает исключение из аккаунта, и оба
// принадлежат потоку человека.
//
// Инфраструктурного на этой поверхности нет: ни внутренних идентификаторов, ни
// признаков размещения, ни следов очередей материализации.
//
// Resource id prefix: `mbr-`.
message Membership {
  // Идентификатор членства.
  //
  // Вычисляется из пары «человек × аккаунт» неизменяемой функцией и потому
  // ПЕРЕИСПОЛЬЗУЕТСЯ: снятие членства есть удаление строки, и повторное
  // приглашение того же человека в тот же аккаунт вернёт ТОТ ЖЕ
  // идентификатор. Признак «строка заведена заново» — `created_at`, а не `id`.
  string id = 1;

  // Аккаунт, которому принадлежит членство.
  string account_id = 2;

  // Человекочитаемое имя аккаунта — ЗЕРКАЛО, источник истины сам аккаунт
  // (`AccountService.Get`). Заполняется best-effort: пустое значение означает
  // «имя не задано», а НЕ «аккаунта нет».
  string account_name = 3;

  // Человек.
  string user_id = 4;

  // Состояние членства.
  State state = 5;

  // Кто пригласил, идентификатор человека. Это и есть след приглашения,
  // ПЕРЕЖИВАЮЩИЙ вход: активация трогает `state` и `updated_at` и не трогает
  // его. Пусто у членства, заведённого не приглашением.
  string invited_by = 6;

  // Когда членство заведено; для приглашения — когда оно выписано. Усечено до
  // секунд.
  google.protobuf.Timestamp created_at = 7;

  // Когда состояние менялось в последний раз. Усечено до секунд.
  google.protobuf.Timestamp updated_at = 8;

  // Состояний ровно два, и это закреплено конструкцией хранилища.
  //
  // Различающим состояние является в аккаунт-скоупном чтении: приглашённого
  // видит распорядитель аккаунта. В своём списке `PENDING` недостижим by
  // construction — приглашённому нечем аутентифицироваться, а первый вход
  // переводит в `ACTIVE` ВСЕ его членства разом.
  enum State {
    STATE_UNSPECIFIED = 0;
    // Человек приглашён и ещё не входил.
    PENDING = 1;
    // Человек состоит в аккаунте.
    ACTIVE = 2;
  }
}
