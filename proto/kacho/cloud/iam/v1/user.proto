syntax = "proto3";

package kacho.cloud.iam.v1;

import "google/protobuf/timestamp.proto";
import "kacho/cloud/validation.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/iam/v1;iamv1";

// A User resource. Local mirror of Kratos identity per-Account scope.
//
// Per-Account User scope: один Kratos identity = N User-rows (по одному
// per Account, куда invited). External_id (Kratos sub) уникален per-Account, не
// глобально. Активируется при первом login через Kratos с матчингом email.
//
// Resource id prefix: `usr-`.
message User {
  // Аккаунт снят с ресурса пользователя (kacho#471, IAM-ID-1-19).
  //
  // Поле объявляло, что у человека РОВНО ОДИН аккаунт, — так было, пока человек
  // был строкой В аккаунте. После отрыва принадлежность выражается членствами,
  // которых у него может быть несколько, и одно значение из множества читалось
  // бы вызывающим как факт о человеке.
  //
  // Резервируются И номер, И имя: номер — чтобы следующее поле не переиспользовало
  // его и старый клиент не прочитал чужое значение как аккаунт; имя — потому что
  // JSON разбирается по имени, и один резерв номера от воскрешения имени не спасает.
  //
  // «Кто состоит в этом аккаунте» спрашивается списком пользователей, суженным
  // аккаунтом: этот фильтр читает членства, а не снятую колонку.
  reserved 6;
  reserved "account_id";

  // ID of the user (kacho-iam internal id).
  string id = 1;

  // External identity provider id (Kratos `sub` claim). Может быть пустым для
  // PENDING (invited but never logged in).
  string external_id = 2;

  // Email (case-insensitive lookup). При Invite — email указывается admin'ом;
  // при first-login через Kratos — матчится с identity email.
  string email = 3;

  // Human-readable display name (snapshot из Kratos identity traits).
  string display_name = 4;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 5;

  // invite-status.
  // PENDING — invited, еще не login'нулся.
  // ACTIVE  — login'нулся через Kratos, external_id заполнен.
  // BLOCKED — участие в ЭТОМ Account'е запрещено администратором
  //   (`UserService.Block`; снимается `UserService.Unblock`).
  //
  // Состояние принадлежит СТРОКЕ ЧЛЕНСТВА, а не человеку: одна личность держит
  // по строке на каждый Account, и запрет в одном Account'е не отключает её в
  // остальных. Выдача токена перебирает набор членств и обслуживает первое
  // аутентифицирующееся; отказ приходит, только когда ни одно не может.
  //
  // НЕ ИЗМЕНЯЕТСЯ через Update: у пустой `update_mask` семантика полной замены
  // объекта, а enum в proto3 неотличим от незаданного — клиент, не приславший
  // поле, запретил бы участие каждому, кого коснулся. Поэтому состояние меняют
  // ДЕЙСТВИЯ, у которых маски нет.
  InviteStatus invite_status = 7;

  // User.id того, кто пригласил (nullable для self-signup bootstrap-row).
  string invited_by = 8;

  // Tenant-facing метки. Единая модель видимости IAM-ресурсов: User —
  // label-selectable, как account/project; ARM_LABELS-грант на iam.user
  // материализует глаголы своей роли на объектах, чьи `labels` покрывают
  // `matchLabels` (iam-direct same-DB), а страница List сужается тем же
  // отношением, которым каталог гейтит одиночное чтение — `v_get`; строка
  // попадает в выдачу ровно тогда, когда вызывающий вправе прочитать её по id.
  // Роль, дающая только `list` без `get`, объект в списке не показывает — иначе
  // выдача раскрывала бы содержимое, которое чтение по id отказывает (List
  // возвращает то же сообщение ресурса, что и Get). Mutable через
  // UserService.Update (`labels` в update_mask). Аннотации (size/key/value
  // pattern) энфорсят sync-INVALID_ARGUMENT на request-layer — паритет
  // account/project/group request `labels`; это request-input для UpdateUser
  // (тело UpdateUserRequest.user).
  map<string, string> labels = 9 [(kacho.cloud.size) = "<=64", (length) = "<=63", (pattern) = "[-_0-9a-z]*", (map_key).length = "1-63", (map_key).pattern = "[a-z][-_0-9a-z]*"];

  enum InviteStatus {
    INVITE_STATUS_UNSPECIFIED = 0;
    PENDING = 1;
    ACTIVE = 2;
    BLOCKED = 3;
  }
}

message DeleteUserMetadata {
  // ID of the User that is being deleted.
  string user_id = 1;

  // ID of the owning Account (denormalized for account-scoped operations
  // listing — AccountService.ListAllOperations). Non-first field so the
  // corelib resource_id extractor (first `_id`-suffix match) still picks
  // `user_id`. Read by exact field name `account_id` by corelib. May be
  // empty for account-less users (written as SQL NULL — excluded from the
  // account-scoped list).
  string account_id = 2;
}

message UpdateUserMetadata {
  // ID of the User that is being updated.
  string user_id = 1;

  // ID of the owning Account (denormalized for account-scoped operations
  // listing — AccountService.ListAllOperations). Non-first field so the
  // corelib resource_id extractor (first `_id`-suffix match) still picks
  // `user_id`. Read by exact field name `account_id` by corelib. May be empty
  // for account-less users (written as SQL NULL — excluded from the
  // account-scoped list).
  string account_id = 2;
}

message BlockUserMetadata {
  // ID of the User membership row that is being blocked.
  string user_id = 1;

  // ID of the owning Account (denormalized; non-first, see UpdateUserMetadata).
  // Never empty here: a membership row always has an account, and the block is
  // an act OF that account.
  string account_id = 2;
}

message UnblockUserMetadata {
  // ID of the User membership row that is being unblocked.
  string user_id = 1;

  // ID of the owning Account (denormalized; non-first, see UpdateUserMetadata).
  string account_id = 2;
}

// Invite-flow.
message InviteUserMetadata {
  string user_id = 1;
  string account_id = 2;
  // Kratos recovery / magic-link URL. Admin копирует и отправляет вручную
  // (email-sending не интегрирован). Пустой если re-invite-existing-active.
  string magic_link_url = 3;
}
