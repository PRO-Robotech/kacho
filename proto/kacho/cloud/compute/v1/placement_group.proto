syntax = "proto3";

package kacho.cloud.compute.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/compute/v1;computev1";

// PlacementGroup — правило взаимного размещения машин.
//
// # Что арендатор просит и что мы обещаем
//
// Он просит РАЗНЕСТИ машины либо СБЛИЗИТЬ их. Разнесение — чтобы отказ одного
// куска железа не унёс всю группу; сближение — чтобы машины видели друг друга
// коротким путём. Это ровно два намерения, и оба выразимы без единого числа.
//
// # Почему числового параметра разнесения здесь НЕТ
//
// «Разнести на N доменов отказа» звучит точнее и является хуже: число описывает
// НАШУ раскладку железа, а не намерение арендатора. Опубликовав его, мы
// обязались бы держать эту раскладку неизменной — и потеряли бы право менять
// собственную инфраструктуру, ничего не сломав снаружи. Число остаётся решением
// исполнителя и наружу не выходит.
//
// # Якорь размещения взаимоисключающий
//
// Группа либо ЗОНАЛЬНАЯ (машины в одной зоне), либо РЕГИОНАЛЬНАЯ (машины в одном
// регионе, зоны разные). Это дискриминатор, а не пара необязательных полей:
// строка, где заполнены оба, описывает размещение, которого не бывает, и
// закреплено это проверкой схемы, а не дисциплиной вызывающего.
message PlacementGroup {
  // Идентификатор (канонический "plg-<base32>"), неизменяем на всю жизнь.
  string id = 1;

  string project_id = 2;

  // Человекочитаемое имя. Косметическое, уникально в пределах проекта.
  string name = 3;

  string description = 4;

  google.protobuf.Timestamp created_at = 5;

  map<string, string> labels = 6;

  // Что группа делает с машинами.
  Strategy strategy = 7;

  // Якорь размещения: ровно одна из двух координат.
  PlacementType placement_type = 8;

  // Зона — при ZONAL, иначе пусто.
  string zone_id = 9;

  // Регион — при REGIONAL, иначе пусто.
  string region_id = 10;

  // Strategy — что группа делает с машинами.
  enum Strategy {
    STRATEGY_UNSPECIFIED = 0;

    // Разнести: отказ одного куска железа не должен унести всю группу.
    SPREAD = 1;

    // Сблизить: машины видят друг друга коротким путём.
    PACK = 2;
  }

  // PlacementType — какой координатой закреплена группа.
  enum PlacementType {
    PLACEMENT_TYPE_UNSPECIFIED = 0;
    ZONAL = 1;
    REGIONAL = 2;
  }
}
