syntax = "proto3";

package kacho.cloud.compute.v1;

import "google/protobuf/timestamp.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/compute/v1;computev1";

// InternalRealizationService — входящий канал узлового агента.
//
// # Зачем отдельный сервис, а не поле в публичном контракте
//
// Наша запись о машине — НАМЕРЕНИЕ. Что на узле происходит на самом деле, знает
// только узел, и это два разных факта: намерение пишет арендатор, наблюдаемое
// сообщает исполнитель. Держать их одной колонкой значит потерять расхождение
// между ними — а именно расхождение и есть то, ради чего наблюдаемое собирают.
//
// Две колонки на ПУБЛИЧНОЙ проекции завели бы второй источник истины для
// арендатора и вынесли бы наружу факт исполнителя. Поэтому наблюдаемое живёт
// только здесь, а публично отдаётся ОДНО производное состояние: расхождение
// разрешается в пользу наблюдаемого — машина есть машина, — а причина
// сообщается человекочитаемым полем, уже существующим на публичной проекции.
//
// # Только внутренний слушатель
//
// :9091, взаимный TLS, отдельное отношение записи. Агент — новый класс
// принципала, и право писать о ЧУЖОЙ машине сужается областью: без неё
// предъявитель сертификата отчитывался бы о любой машине облака.
service InternalRealizationService {

  // ReportInstanceRealization — узел сообщает, что он наблюдает.
  //
  // # Почему синхронный ответ, а не операция
  //
  // Общее правило продукта: мутации возвращают операцию. Здесь исключение, и
  // оно обосновано предметом: агент сообщает УЖЕ СЛУЧИВШИЙСЯ факт, а не просит
  // что-то сделать. Операция описывала бы намерение изменить наблюдаемое — то
  // есть ровно то, чего сделать нельзя: наблюдаемое не назначают.
  //
  // # Почему номер события, а не поколение ресурса
  //
  // Отчёт привязывается к номеру события доставки, по которому агент получил
  // намерение. Монотонная колонка на самом ресурсе — это то же поколение под
  // другим именем: она требует правки при КАЖДОЙ мутации и заводит вторую
  // механику ревизии рядом с той, что уже выбрана для доставки намерения.
  //
  // Меньший номер молча отбрасывается как устаревший — переупорядочение в сети
  // не должно откатывать наблюдаемое. Неизвестный отвергается: отчёт о
  // намерении, которого мы не отправляли, означает расхождение, а не новость.
  rpc ReportInstanceRealization(ReportInstanceRealizationRequest) returns (ReportInstanceRealizationResponse) {
    option (kacho.iam.authz.v1.permission)        = "compute.instances.reportRealization";
    option (kacho.iam.authz.v1.required_relation) = "realization_writer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "compute_instance"
      from_request_field: "instance_id"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

// ObservedState — то, что узел ВИДИТ, а не то, что мы просили.
//
// Набор закрыт и совпадает с ограничением схемы поэлементно: значение, которое
// код умеет прислать, а база не умеет принять, даёт отказ хранилища без имени
// поля — сигнал, по которому нельзя понять, что именно не так.
enum ObservedState {
  OBSERVED_STATE_UNSPECIFIED = 0;

  // Узел взял машину в работу: ресурсы выделены, запуск идёт.
  OBSERVED_STARTING = 1;

  // Машина исполняется.
  OBSERVED_RUNNING = 2;

  // Идёт остановка, инициированная нами либо гостем.
  OBSERVED_STOPPING = 3;

  // Машина остановлена и её ресурсы освобождены.
  OBSERVED_STOPPED = 4;

  // Машина завершилась НЕОЖИДАННО: не по нашей команде и не по штатному
  // выключению гостя. Отдельное значение от остановки, потому что решения по
  // ним разные — остановленную не перезапускают, эту, возможно, да.
  OBSERVED_TERMINATED_UNEXPECTEDLY = 5;
}

// ReportInstanceRealizationRequest — один отчёт об одной машине.
message ReportInstanceRealizationRequest {
  // Машина, о которой отчёт. Область права берётся отсюда: агент получает
  // право писать о КОНКРЕТНОЙ машине, а не обо всех сразу.
  string instance_id = 1;

  // Что узел наблюдает.
  ObservedState observed_state = 2;

  // Номер события доставки, по которому агент получил намерение. Меньший
  // молча отбрасывается, неизвестный отвергается.
  int64 delivery_sequence_no = 3;

  // Момент наблюдения ПО ЧАСАМ УЗЛА. Мы не подменяем его своим временем: узел
  // мог наблюдать факт заметно раньше, чем сумел о нём сообщить, и подмена
  // стёрла бы эту разницу — единственный след того, что связь была потеряна.
  google.protobuf.Timestamp observed_at = 4;

  // Человекочитаемая причина, если наблюдаемое требует пояснения (отказ
  // запуска, неожиданное завершение). Пустая строка законна.
  string reason = 5;
}

// ReportInstanceRealizationResponse — подтверждение приёма.
message ReportInstanceRealizationResponse {
  // Отчёт принят и применён. False означает «принят и отброшен как устаревший»
  // — это не отказ: агент не обязан знать, что его обогнал более свежий отчёт,
  // и повторять ему нечего.
  bool applied = 1;

  // Номер события, к которому относится ДЕЙСТВУЮЩЕЕ наблюдаемое состояние
  // после обработки этого отчёта. Агент, увидев номер больше своего, узнаёт,
  // что отстал, не задавая второго вопроса.
  int64 current_sequence_no = 2;
}
