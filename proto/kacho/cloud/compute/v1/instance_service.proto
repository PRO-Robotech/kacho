  // ID of the instance.
  string instance_id = 1;

  // ID of the storage Volume (prefix "vol").
  string volume_id = 2;
}

message DetachInstanceDiskRequest {
  // ID of the instance to detach the disk from.
  // To get the instance ID, use a [InstanceService.List] request.
  string instance_id = 1;

  oneof disk {
    // ID of the storage Volume (prefix "vol") that should be detached.
    string volume_id = 2;

    // Serial number of the disk that should be detached. This value is reflected into the /dev/disk/by-id/ tree
    // of a Linux operating system running within the instance.
    string device_name = 3;
  }
}

message DetachInstanceDiskMetadata {
  // ID of the instance.
  string instance_id = 1;

  // ID of the storage Volume (prefix "vol").
  string volume_id = 2;
}

// AttachedNicSpec — NIC-reference attach spec: attaches an *existing* kacho-vpc
// NetworkInterface (NIC) to the instance by id. The NIC is a first-class VPC
// resource (source of truth = kacho-vpc); the instance only references and mirrors
// it. Re-enables the explicit NIC↔Instance binding deferred in KAC-266.
message AttachedNicSpec {
  // ID of an existing kacho-vpc NetworkInterface (NIC, prefix "enp") to attach.
  string nic_id = 1;

  // Slot index on the instance (eth0=0, eth1=1, …), unique within the instance.
  // Optional: if unset, the server assigns the first free slot atomically.
  int32 index = 2;
}

message AttachInstanceNetworkInterfaceRequest {
  // Old subnet-spec attach form (created a NIC inline from subnet/address/sg) —
  // replaced by NIC-reference attach (attach an existing kacho-vpc NIC by id).
  reserved 2, 3, 4, 5, 6;
  reserved "network_interface_index", "subnet_id", "primary_v4_address_spec", "security_group_ids";

  // ID of the instance to attach the network interface to.
  string instance_id = 1;

  // NIC to attach (existing kacho-vpc NetworkInterface, referenced by id).
  AttachedNicSpec attached_nic_spec = 7;
}

message AttachInstanceNetworkInterfaceMetadata {
  reserved 2;
  reserved "network_interface_index";

  // ID of the instance the network interface is being attached to.
  string instance_id = 1;

  // ID of the kacho-vpc NetworkInterface (NIC) being attached.
  string nic_id = 3;
}

message DetachInstanceNetworkInterfaceRequest {
  reserved 2;
  reserved "network_interface_index";

  // ID of the instance to detach the network interface from.
  string instance_id = 1;

  oneof network_interface {
    // ID of the kacho-vpc NetworkInterface (NIC, prefix "enp") to detach.
    string nic_id = 3;

    // Slot index of the network interface to detach.
    int32 index = 4;
  }
}

message DetachInstanceNetworkInterfaceMetadata {
  reserved 2;
  reserved "network_interface_index";

  // ID of the instance the network interface is being detached from.
  string instance_id = 1;

  // ID of the kacho-vpc NetworkInterface (NIC) being detached.
  string nic_id = 3;
}

message SimulateInstanceMaintenanceEventRequest {
  // ID of the Instance the simulated maintenance event is delivered to.
  string instance_id = 1;
}

message SimulateInstanceMaintenanceEventMetadata {
  string instance_id = 1;
}

message ListInstanceOperationsRequest {
  // ID of the Instance resource to list operations for.
  string instance_id = 1;

  // The maximum number of results per page to return. If the number of available
  // results is larger than [page_size], the service returns a [ListInstanceOperationsResponse.next_page_token]
  // that can be used to get the next page of results in subsequent list requests.
  int64 page_size = 2;

  // Page token. To get the next page of results, set [page_token] to the
  // [ListInstanceOperationsResponse.next_page_token] returned by a previous list request.
  string page_token = 3;
}

message ListInstanceOperationsResponse {
  // List of operations for the specified instance.
  repeated operation.Operation operations = 1;

  // This token allows you to get the next page of results for list requests. If the number of results
  // is larger than [ListInstanceOperationsRequest.page_size], use the [next_page_token] as the value
  // for the [ListInstanceOperationsRequest.page_token] query parameter in the next list request.
  // Each subsequent list request will have its own [next_page_token] to continue paging through the results.
  string next_page_token = 2;
}

message AttachedDiskSpec {
  enum Mode {
    MODE_UNSPECIFIED = 0;

    // Read-only access.
    READ_ONLY = 1;

    // Read/Write access. Default value.
    READ_WRITE = 2;
  }

  // The mode in which to attach this disk.
  Mode mode = 1;

  // Specifies a unique serial number of your choice that is reflected into the /dev/disk/by-id/ tree
  // of a Linux operating system running within the instance.
  //
  // This value can be used to reference the device for mounting, resizing, and so on, from within the instance.
  // If not specified, a random value will be generated.
  string device_name = 2;

  // Specifies whether the disk will be auto-deleted when the instance is deleted.
  bool auto_delete = 3;

  // ID of the storage Volume (prefix "vol") that should be attached.
  string volume_id = 5;

  // Field 4 carried `DiskSpec` — an inline "create a disk while attaching it" form
  // over compute's own Disk resource. That resource is retired: kacho-storage owns
  // block storage, so a volume is created through storage.v1.VolumeService and then
  // attached here by id. The arm is withdrawn rather than left standing, because it
  // had already stopped meaning anything — the handler read only `volume_id` and
  // dropped `disk_spec` silently, so a caller who sent it was told the attach had
  // succeeded while nothing of what it asked for was applied.
  reserved 4;
  reserved "disk_spec";
}

message AttachedLocalDiskSpec {
  // Size of the disk, specified in bytes.
  int64 size = 1;

  oneof type {
    // Local disk configuration
    PhysicalLocalDiskSpec physical_local_disk = 2;
  }
}

message PhysicalLocalDiskSpec {
  // ID of KMS key for disk encryption
  string kms_key_id = 1;
}

message AttachedFilesystemSpec {
  enum Mode {
    MODE_UNSPECIFIED = 0;

    // Read-only access.
    READ_ONLY = 1;

    // Read/Write access. Default value.
    READ_WRITE = 2;
  }

  // Mode of access to the filesystem that should be attached.
  Mode mode = 1;

  // Name of the device representing the filesystem on the instance.
  //
  // The name should be used for referencing the filesystem from within the instance
  // when it's being mounted, resized etc.
  //
  // If not specified, a random value will be generated.
  string device_name = 2;

  // ID of the filesystem that should be attached.
  string filesystem_id = 3;
}

// NetworkInterfaceSpec — интерфейс, который compute создаёт в kacho-vpc и
// подключает к машине при Create.
//
// ЧИТАЮТСЯ ДВА ПОЛЯ: `subnet_id` (обязателен) и `security_group_ids`. Остальные
// четыре сервис ОТВЕРГАЕТ ПО ИМЕНИ синхронно (InvalidArgument +
// `BadRequest.field_violations`, путь вида `network_interface_specs.<поле>`), и это
// осознанный второй исход правила «принято-и-проигнорировано» — прежде их принимали
// и молча теряли в отображении proto → domain.
//
// Комментарии ниже описывают РЕАЛЬНОЕ поведение. Прежняя редакция обещала
// «attaching an existing NIC» и «Exactly one of {subnet_id, nic_id}», тогда как
// валидация требовала `subnet_id` безусловно, а `nic_id` не доезжал до домена вовсе.
// Лок: services/compute/internal/handler/instance_create_unsupported_fields_test.go.
message NetworkInterfaceSpec {
  reserved 4 to 5;
  // ID of the subnet. REQUIRED — there is no other way to specify the interface.
  string subnet_id = 1;

  // NOT SUPPORTED — rejected by name. The address is allocated by the subnet's IPAM
  // in kacho-vpc; compute has no path to pin a requested one.
  PrimaryAddressSpec primary_v4_address_spec = 2;

  // NOT SUPPORTED — rejected by name, same reason as the IPv4 spec above.
  PrimaryAddressSpec primary_v6_address_spec = 3;

  // ID's of security groups attached to the interface
  repeated string security_group_ids = 6;

  // NOT SUPPORTED — rejected by name. The server assigns interface indexes
  // (0,1,2…); accepting a chosen one promised a choice that does not exist.
  string index = 7;

  // NOT SUPPORTED AT CREATE — rejected by name. Attaching an EXISTING kacho-vpc
  // NetworkInterface is done by its own implemented RPC,
  // `InstanceService.AttachNetworkInterface`, not through this spec.
  string nic_id = 8;
}

message PrimaryAddressSpec {
  // An IPv4 internal network address that is assigned to the instance for this network interface.
  // If not specified by the user, an unused internal IP is assigned by the system.
  string address = 1; // optional, manual set static internal IP

  // An external IP address configuration.
  // If not specified, then this instance will have no external internet access.
  OneToOneNatSpec one_to_one_nat_spec = 2;

  // Field 3 held `dns_record_specs`. WITHDRAWN — number and name stay reserved.
  //
  // It was unreachable by construction: this message is reached only through the NIC
  // spec fields the service REJECTS BY NAME
  // (`network_interface_specs.primary_v4_address_spec` / `…v6…`) and through the request
  // of `UpdateNetworkInterface`, which has no handler and answers `Unimplemented`. So no
  // caller could deliver a record spec even in principle — and if one ever could,
  // nothing behind it would have acted on it.
  //
  // And it is not implementable as an attribute of an interface: a DNS record needs a
  // zone somebody owns, a record set with its own lifecycle, TTL and propagation
  // semantics, and its own authorization — that is a domain with its own acceptance.
  // `dns_zone_id` referred to a zone resource this platform does not have at all. Same
  // reading, same decision as the withdrawn vpc DNS surface. Lock:
  // pkg/api/kacho/cloud/compute/v1/dns_contract_test.go.
  reserved 3;
  reserved "dns_record_specs";
}

message OneToOneNatSpec {
  // External IP address version.
  IpVersion ip_version = 1; //only if address unspecified
  string address = 2; //set static IP by value

  // Field 3 held `dns_record_specs`. WITHDRAWN — same story as on PrimaryAddressSpec
  // above. The note here used to name a second door, a request message of an
  // add-one-to-one-NAT verb; neither that verb nor that message exists in the tree,
  // so the note pointed at a coordinate that could not be resolved (kacho#581).
  // Number and name stay reserved.
  reserved 3;
  reserved "dns_record_specs";
}
