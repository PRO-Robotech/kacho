syntax = "proto3";

package kacho.cloud.compute.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/compute/v1;computev1";

// GuestAccessKey — публичный ключ, с которым арендатор входит в свою машину.
//
// # Почему это ресурс, а не поле запроса
//
// Ключ, переданный полем при создании машины, живёт ровно столько, сколько
// машина, и не существует отдельно от неё: его нельзя ни отозвать, ни заменить,
// ни узнать, где ещё он используется. Ресурс со своим жизненным циклом отвечает
// на все три вопроса, и это не удобство — это разница между «ключ у нас есть» и
// «мы знаем, кто может войти».
//
// # Почему только публичная половина
//
// Закрытая половина не покидает машину арендатора и здесь не хранится никогда.
// Хранилище закрытых ключей — отдельный домен со своей моделью угроз; принять
// её сюда значило бы сделать эту базу целью, которой она быть не должна.
//
// # Отношение к пути через модель прав
//
// Ключ — вход НАПРЯМУЮ в машину, минуя плоскость управления. Он не отзывается
// снятием права и не виден в журнале действий: тот, кто вошёл ключом, для нас
// неотличим от того, кто вошёл законно. Поэтому путь через модель прав, когда
// он появится, СНИМАЕТ этот — а не сосуществует с ним: два входа с разной
// отзываемостью означают, что отозвать доступ нельзя.
message GuestAccessKey {
  // Идентификатор ключа (канонический "gak-<base32>"). Неизменяем на всю жизнь
  // ресурса: ссылка на ключ из машины обязана переживать переименование.
  string id = 1;

  // Проект, которому ключ принадлежит.
  string project_id = 2;

  // Человекочитаемое имя. Косметическое: меняется свободно, в ссылках не
  // участвует — иначе переименование ломало бы привязку к машине.
  string name = 3;

  // Материал публичного ключа в форме, которую понимает гостевая система.
  // Проверяется на разбор при создании: строка, которую нельзя разобрать,
  // попадёт в машину и молча не сработает, а отладка начнётся с гостя.
  string public_key = 4;

  // Отпечаток, вычисленный НАМИ из материала. Служит для сверки: арендатор
  // сравнивает его с тем, что видит у себя, и узнаёт, тот ли ключ доехал.
  // Output-only — присланный на входе означал бы, что мы верим чужому счёту.
  string fingerprint = 5;

  google.protobuf.Timestamp created_at = 6;

  // Метки.
  map<string, string> labels = 7;
}
