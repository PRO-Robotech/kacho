syntax = "proto3";

package kacho.cloud.compute.v1;

import "google/api/annotations.proto";
import "kacho/cloud/compute/v1/machine_type.proto";
import "kacho/iam/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/compute/v1;computev1";

// MachineTypeService — public, read-only sync catalog (discovery before launch).
// Admin CRUD over the catalog — see InternalMachineTypeService in
// internal_machine_type_service.proto (:9091, system_admin).
//
// Read стоит на отношении `viewer` кластерного синглтона, которое производит
// СИСТЕМНАЯ ВЫДАЧА с подстановочным субъектом: каталог администрируется
// платформой, одинаков для всех и обязан читаться ВСЯКИМ аутентифицированным
// арендатором, иначе он не выберет ни размер, ни тип. authN остаётся
// обязательным. Админские глаголы каталога — `system_admin` на кластере.
//
// ДВЕ ПРЕЖНИЕ РЕДАКЦИИ, И ОБЕ ВЕРНЫ НАПОЛОВИНУ. Первая объявляла то же отношение,
// которого НЕ ПРОИЗВОДИЛ никто, — оба чтения отвечали отказом каждому, и создать
// было нельзя ничего. Вторая (#892) снимала проверку полосой `<exempt>` — отказ
// уходил, но вместе с ним и видимость: доступ, выданный освобождением, не
// показывается перечислением выдач и закрывается только выкаткой. Производитель
// заведён (#893/#895), поэтому оба свойства верны сразу. Держат два гейта дерева:
// TestClusterScopedCatalogEntryNamesARelationSomeoneProduces (у отношения есть
// производитель) и TestCatalog_WildcardSatisfiableRelations_AreNamedReferenceCatalogues
// (такое отношение позволено только глобальному справочнику, названному поимённо).
service MachineTypeService {
  // Returns information about the specified machine type. To get the list, use List.
  rpc Get (GetMachineTypeRequest) returns (MachineType) {
    option (google.api.http) = { get: "/compute/v1/machineTypes/{machine_type_id}" };
    // Ambient placement-catalog read. Стоит на отношении `viewer` кластерного
    // синглтона, которое производит СИСТЕМНАЯ ВЫДАЧА с подстановочным субъектом:
    // справочник обязан читать всякий аутентифицированный арендатор, и подстановка
    // выполняет отношение за него, поэтому арендатор с нулём собственных выдач не
    // получает отказа.
    //
    // Здесь недолго стояла полоса `<exempt>` (#892): отношение тогда не производил
    // НИКТО, и проверка отвечала отказом каждому. Освобождение это чинило, но
    // делало доступ невидимым — он не показывался перечислением выдач и
    // закрывался только выкаткой. Теперь верны оба свойства сразу (#893/#895).
    option (kacho.iam.authz.v1.permission) = "compute.machineTypes.get";
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }

  // Retrieves the list of machine types. Filter whitelist: name=, family=, minGpus=.
  rpc List (ListMachineTypesRequest) returns (ListMachineTypesResponse) {
    option (google.api.http) = { get: "/compute/v1/machineTypes" };
    // Ambient placement-catalog read — то же отношение и тот же производитель,
    // что у соседнего чтения этого сервиса (#893/#895).
    option (kacho.iam.authz.v1.permission) = "compute.machineTypes.list";
    option (kacho.iam.authz.v1.required_relation) = "viewer";
    option (kacho.iam.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (kacho.iam.authz.v1.required_acr_min) = "1";
  }
}

message GetMachineTypeRequest {
  // ID of the machine type to return (mt-<base32>).
  string machine_type_id = 1;
}

message ListMachineTypesRequest {
  // The maximum number of results per page. See ListMachineTypesResponse.next_page_token.
  int64 page_size = 1;

  // Page token from a previous ListMachineTypesResponse.next_page_token.
  string page_token = 2;

  // Filter (whitelist): exact machine type name (e.g. "std-v3-2"). Empty = no filter.
  string name = 3;

  // Filter (whitelist): family (e.g. "GPU"). Empty = no filter.
  string family = 4;

  // Filter (whitelist): minimum GPU count (e.g. 4). 0 = no filter.
  int32 min_gpus = 5;
}

message ListMachineTypesResponse {
  // List of machine types.
  repeated MachineType machine_types = 1;

  // Token for getting the next page of results.
  string next_page_token = 2;
}
