syntax = "proto3";

package kacho.cloud.api;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/PRO-Robotech/kacho/pkg/api/kacho/cloud/api;apiv1";

// secret_bearing — ПОМЕТКА ПОЛЯ-НОСИТЕЛЯ СЕКРЕТА (приёмка BAT-1 §4.3.3).
//
// ─────────────────────────────────────────────────────────────────────────────
// ЗАЧЕМ ОПЦИЯ, А НЕ ПЕРЕЧЕНЬ ИМЁН НА СТОРОНЕ Go
//
// Рядом с таблицей операций живёт подметающий бэкстоп, обходящий её по перечню
// «тип ответа → поля»; поле, которого перечень не называет, он пропускает, и
// таблица читается чистой навсегда. Гейт обязан требовать, чтобы КАЖДОЕ
// помеченное поле стояло в этом перечне, — иначе отсутствие записи неотличимо
// от «поле проверено и чисто».
//
// Общее объявление на стороне Go (перечень имён рядом с подметальщиком) области
// не меняет, но заставляет гейт сравнивать перечень САМ С СОБОЙ: новое
// непомеченное поле-носитель не краснит его НИКОГДА. Это ровно «форма проверки
// без содержания» — класс, который приёмка ловит в §4.3.2, и заводить его в
// собственный гейт нельзя. Пометка обязана жить в КОНТРАКТЕ и быть перечислимой
// из дескрипторов.
//
// ─────────────────────────────────────────────────────────────────────────────
// ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ ПРАВКА `kacho/cloud/validation.proto`
//
// Тот файл импортируют десятки контрактов восьми доменов, и правка его вытянула
// бы область фазы на всё дерево. Этот файл не обязан импортировать никто, кроме
// того, кто пометку ставит. Прецедент в дереве той же формы —
// `kacho/iam/authz/v1/authz_options.proto`.
//
// ─────────────────────────────────────────────────────────────────────────────
// НОМЕР РАСШИРЕНИЯ
//
// У полевых опций дерева заняты 101501…101506, 101510, 101511
// (`kacho/cloud/validation.proto`); берётся следующий свободный за ними. 101400
// в этот счёт не входит — он расширяет `OneofOptions`, а номера расширений
// считаются по расширяемому типу; брать его всё равно не будем, запас в сторону
// осторожности здесь ничего не стоит.
//
// ─────────────────────────────────────────────────────────────────────────────
// ЧЕГО ПОМЕТКА НЕ ДЕРЖИТ — НАЗВАНО, ЧТОБЫ ЕЁ НЕ СОЧЛИ ПОЛНЫМ ПОКРЫТИЕМ
//
// Поле-носитель, ЧЬЁ ИМЯ НИ НА ЧТО НЕ ПОХОЖЕ и которое не пометили, не ловится
// ничем механическим: пометки нет, образец имени не совпал. Здесь гейт
// кончается, и держит это обзор изменения контракта на глаголе, который выдаёт
// удостоверение.
extend google.protobuf.FieldOptions {
  // true — значение этого поля есть СЕКРЕТ ПРЕДЪЯВИТЕЛЯ: оно показывается
  // вызывающему один раз и не имеет права осесть ни в строке операции, ни в
  // журнале аудита, ни в ленте подписки, ни в строке ресурса.
  bool secret_bearing = 101512;
}
