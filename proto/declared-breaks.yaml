# ЗАПИСИ ИСТЕКЛИ (#2362): переезд объявления службы чтения потолка личности в
# контракт службы доступа влит в ствол, база сравнения поднялась, находок
# по нему больше нет. Разбор сохранён — он переживает саму запись.
#
# ПЕРЕЕЗД, А НЕ СНЯТИЕ ВОЗМОЖНОСТИ. Объявление службы арендаторского чтения
# квот личности ушло из пакета общей ФОРМЫ ответа в собственный контракт службы
# доступа (`kaname/cloud/iam/v1/identity_quota_service.proto`). Служба, её метод,
# HTTP-путь `/iam/v1/quotas`, форма ответа, имена и номера ВСЕХ полей и арм —
# прежние дословно; согласие двух объявлений держит проба дескрипторов
# `TestIdentityQuotaShapeMatchesThePlatformShapeVerbatim`, а не обещание.
#
# Что для клиента ДЕЙСТВИТЕЛЬНО меняется — полное имя метода gRPC
# (`kacho.cloud.quota.v1.…` → `kaname.cloud.iam.v1.…`). Для клиента REST не
# меняется ничто: путь и JSON прежние.
#
# ЗАПИСЬ ИСТЕКЛА САМА, как и предписывает шапка: на стволе база сравнения — сам
# ствол, находок ноль by construction, значит предмета у записи быть не может.
# Снять её обязано то же изменение, которое подняло базу.
# ===========================================================================

