# Объявленные ломающие изменения контракта.
#
# Конвейер зовёт `buf breaking --against …#branch=main` и роняет прогон на любом разрыве.
# Осознанный разрыв проходит ТОЛЬКО через этот перечень, и запись живёт РОВНО ПОКА у неё
# есть предмет: находка вне перечня — красное, запись без находки — ТОЖЕ красное.
# Этим адъюдикация отличается от `breaking.ignore` в buf.yaml, где исключение по пути
# ослепляет проверку на целом файле навсегда.
#
# Разрыв, ставший историей (база сравнения поднялась после вливания в main), обязан быть
# удалён отсюда. Держит это не память исполнителя, а сам конвейер: адъюдикация идёт И НА
# PUSH В СТВОЛ, поэтому истёкшая запись называется поимённо там же и тогда же, где её
# предмет истёк, — на первом прогоне ствола после вливания (kacho#490).
#
# НОРМАЛЬНОЕ СОСТОЯНИЕ ПЕРЕЧНЯ НА СТВОЛЕ — ПУСТО, и это не пожелание, а следствие:
# на стволе база сравнения — сам ствол, находок 0 по построению, значит ни у одной
# записи предмета быть не может. Запись живёт ровно от объявления разрыва в ветке до
# вливания этой ветки.
#
# Поля обязательны все пять, и у каждого есть причина:
#   rule    — идентификатор правила buf (`RPC_NO_DELETE`); без него запись не сопоставима;
#   path    — путь к .proto относительно этого каталога; без него запись пропускала бы
#             разрыв в любом файле;
#   symbol  — имя снятого символа; buf называет его в сообщении в кавычках;
#   reason  — причина одной фразой; объявление без причины нечем оспорить при снятии;
#   issue   — РАЗРЕШИМАЯ ссылка (`kacho#244` либо полный URL): по голому `#71` объявление
#             не может истечь даже в принципе.
#
# СНЯТИЕ ФАЙЛА ЦЕЛИКОМ (`FILE_NO_DELETE`) объявляется так же, как всё прочее, но `path` и
# `symbol` у него СОВПАДАЮТ — и это не описка:
#
#   - rule: FILE_NO_DELETE
#     path: kacho/cloud/vpc/v1/internal_dataplane_service.proto
#     symbol: kacho/cloud/vpc/v1/internal_dataplane_service.proto
#
# Причина в предмете: у снятия файла предмет ровно один — сам файл, и buf называет в
# сообщении в кавычках именно путь (`Previously present file "kacho/…/x.proto" was
# deleted.`), а поля `path` у такой находки не печатает вовсе — указывать не на что.
# Короткое имя файла в `symbol` не подойдёт: сопоставление ищет символ В КАВЫЧКАХ, а в
# кавычках стоит полный путь. Ошибиться не страшно — исход называется отдельно
# («символ не совпал») и печатает фактическое сообщение buf, где предмет и виден.
#
# Проверяет: tools/declaredbreak (cmd/adjudicate-declared-breaks), шаг конвейера
# «adjudicate breaking (vs main)».

# Одиннадцать записей kacho#747 — стадия S6 снимает внешний движок прав, и вместе с ним
# то в контракте, что существовало только ради него.
#
# Предметов три, и они разные:
#
#   1. `AuthorizeService.ListObjects` с парой своих сообщений — перечисление всего,
#      что субъекту доступно. Метод не был постраничен by construction: `page_token`
#      отвергался, `next_page_token` не заполнялся никогда, поэтому объявленное
#      усечение не имело продолжения и объекты сверх потолка были недостижимы при
#      живых правах. Заменителя нет: «что мне видно» отвечает постраничный `List`
#      ресурсной службы, сужающий страницу проверкой её же идентификаторов.
#
#   2. Графовые рёбра `UsersetTree` (`computed`, `tuple_to_userset`) с их сообщениями
#      и поле `authorization_model_id` в ОБОИХ ответах, где оно стояло
#      (`AuthorizeCheckResponse`, `ExpandRelationsResponse`) — форма ответа внешнего
#      движка. Источник вердикта теперь реляционный и плоский; заполнять эти поля
#      нечем никогда, а оставленное поле обещало бы то, чего нет. Снимается НЕ модель
#      прав (она остаётся источником, из которого выведена реляционная форма), а
#      идентификатор её версии в чужом хранилище. Той же правде подчинён и запрос:
#      `ExpandRelationsRequest.max_depth` ограничивал спуск, пока ответ был деревом,
#      и после перехода к плоскому перечню его никто не читает — принятое и
#      проигнорированное поле запрещено прямо, поэтому оно снято, а не оставлено.
#
#   3. `internal_authorize_service.proto` целиком — служба администрирования самого
#      движка (его хранилище кортежей, пин идентификатора модели, сведения о сторе).
#      Движка нет — предмета не осталось ни у одного из её четырёх глаголов.
#
#   4. `builtin_condition.proto` целиком — перечисление известных условий. Осиротело
#      от пункта 3: его единственным импортёром был снятый файл (`TupleCondition.builtin`),
#      а арендаторская поверхность условий снята раньше приёмкой IAM-C. Читателей в
#      непорождённом коде ноль.
#
#      ГРАНИЦА, названная явно: снимается ПЕРЕЧИСЛЕНИЕ, а не механизм условий.
#      Условия по-прежнему вычисляются — реляционной формой, своим кодом
#      (`services/iam/internal/repo/kacho/pg/relverdict/condition.go`), и этого
#      контракта она не читает. Живой остаётся и модельная половина: `condition …`
#      в `fga_model.fga` (6 определений, 4 ограничения `with mfa_fresh`) и сбор
#      контекста условия на крае (`gateway/internal/middleware/context_extractor.go`,
#      провязан в composition root) — оба проверены отдельно и не тронуты.
#
#      ВНИМАНИЕ ЧИТАТЕЛЮ, КОТОРЫЙ НАЙДЁТ ОБРАТНОЕ РЕШЕНИЕ: приёмка IAM-C
#      (`services/iam/docs/engineering/acceptance/retire-tenant-condition-surface.md`)
#      этот файл СОХРАНИЛА ОСОЗНАННО — пункт Р10 отвергает его снятие «за компанию», а
#      §4 числит перечисление среди живого. Основание того решения названо там же и
#      сегодня ИСТЕКЛО дословно: «его читает `TupleCondition.builtin` внутреннего
#      листенера» — листенера нет, читателя нет. Снятие не отменяет то решение задним
#      числом, а исполняет его собственный предикат.
#
# Записи живут от объявления до вливания этой ветки в ствол: после него база сравнения
# поднимется, находок не станет, и адъюдикация назовёт их истёкшими поимённо.
declared:
  - rule: RPC_NO_DELETE
    path: kacho/cloud/iam/v1/authorize_service.proto
    symbol: ListObjects
    reason: перечисление вселенной вместо сужения страницы; не постраничен by construction, продолжения у ответа нет
    issue: kacho#747
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/iam/v1/authorize_service.proto
    symbol: ListObjectsRequest
    reason: запрос снятого глагола ListObjects, других вызывающих у сообщения нет
    issue: kacho#747
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/iam/v1/authorize_service.proto
    symbol: ListObjectsResponse
    reason: ответ снятого глагола ListObjects, других вызывающих у сообщения нет
    issue: kacho#747
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/iam/v1/authorize_service.proto
    symbol: computed
    reason: ребро графа усерсетов; реляционный источник плоский, заполнять поле нечем никогда
    issue: kacho#747
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/iam/v1/authorize_service.proto
    symbol: tuple_to_userset
    reason: ребро графа усерсетов; реляционный источник плоский, заполнять поле нечем никогда
    issue: kacho#747
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/iam/v1/authorize_service.proto
    symbol: ComputedUsersetEdge
    reason: тип снятого ребра графа усерсетов, других вызывающих у сообщения нет
    issue: kacho#747
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/iam/v1/authorize_service.proto
    symbol: TupleToUsersetEdge
    reason: тип снятого ребра графа усерсетов, других вызывающих у сообщения нет
    issue: kacho#747
  # ОДНА запись на ДВЕ находки, и это названо, а не умолчано: поле с этим именем
  # стояло и в AuthorizeCheckResponse (номер 3), и в ExpandRelationsResponse
  # (номер 4). Сопоставление идёт по правилу, пути и символу В КАВЫЧКАХ, а
  # различить сообщения нечем: имя поля у них общее, а номера («3», «4») не
  # уникальны — «3» назван ещё и снятым UsersetTree.tuple_to_userset. Следствие,
  # которое надо знать при снятии: запись истечёт только когда исчезнут ОБЕ
  # находки, то есть после вливания ветки, а не после половины работы.
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/iam/v1/authorize_service.proto
    symbol: authorization_model_id
    reason: идентификатор версии модели в хранилище внешнего движка (оба ответа); движка нет, поле обещало бы несуществующее
    issue: kacho#747
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/iam/v1/authorize_service.proto
    symbol: max_depth
    reason: ответ перестал быть деревом — глубина у плоского перечня оснований не определена, поле никто не читает
    issue: kacho#747
  - rule: FILE_NO_DELETE
    path: kacho/cloud/iam/v1/builtin_condition.proto
    symbol: kacho/cloud/iam/v1/builtin_condition.proto
    reason: последний импортёр — снятая служба администрирования хранилища отношений; арендаторская поверхность условий снята приёмкой IAM-C; читателей в непорождённом коде ноль
    issue: kacho#747
  - rule: FILE_NO_DELETE
    path: kacho/cloud/iam/v1/internal_authorize_service.proto
    symbol: kacho/cloud/iam/v1/internal_authorize_service.proto
    reason: служба существовала только ради администрирования внешнего движка прав, снятого стадией S6
    issue: kacho#747

# ИСТОРИЯ ПЕРЕЧНЯ — почему его нормальное состояние ПУСТО.
#
# Девять записей (kacho#400 — снятие шва исполнителя датаплейна vpc: два файла и
# семь полей `apply_state`) сняты вслед за вливанием `29ad7b78` в ствол. База
# сравнения поднялась, `buf breaking` их больше не показывает — находок 0, — и
# адъюдикация обязана краснеть исходом «послабление истекло».
#
# КЛАСС ПОВТОРЯЛСЯ ШЕСТЬ РАЗ: 21 запись (kacho#246), 2 (kacho#231), 4 (kacho#296),
# 9 (kacho#400), 8 (kacho#716), 7 (kacho#788). Каждый раз предмет истекал в момент ВЛИВАНИЯ накопительной ветки в
# ствол, а не в момент правки контракта, — поэтому прежнее требование шапки «снимать
# запись ТЕМ ЖЕ изменением, которое поднимает базу» было буквально невыполнимо:
# изменение контракта и подъём базы разнесены во времени и делаются разными
# изменениями. Правило существовало, было записано здесь и не выполнилось ни разу.
#
# ПОЧЕМУ ЭТО НЕ ЛОВИЛОСЬ НА СТВОЛЕ, а доставалось постороннему PR: шаг адъюдикации был
# объявлен `if: github.event_name == 'pull_request'`, поэтому push в ствол его не
# исполнял вовсе. Цена названа числом: 2026-08-16 девять записей снимали ДВЕ линии
# независимо (kacho#488 и соседняя), потому что обе наткнулись на одно и то же и ни
# одна не видела другую.
#
# ЗАКРЫТО В kacho#490: условие снято, шаг идёт и на push в ствол. Теперь истечение
# обнаруживается там, где происходит, и чинится один раз в стволе, а не каждым PR по
# очереди. Предикат, по которому это проверяется наблюдением: пять последовательных
# вливаний, и ни один PR не получает красное «послабление истекло» по чужому предмету.
#
# ШЕСТОЙ РАЗ (kacho#788, семь записей) предикат наблюдения НЕ ВЫДЕРЖАЛ: истечение
# наступило при вливании «второй волны ролевой модели» в ствол, шаг на push его назвал —
# и остался неубранным, поэтому красное досталось постороннему PR той же линии, как и
# прежде. Обнаружение работает; чинит его по-прежнему тот, кто наткнулся. Значит
# недостаёт не шага, а того, чтобы вливающий ствол снимал истёкшее ТЕМ ЖЕ заходом.
