# Объявленные ломающие изменения контракта.
#
# Конвейер зовёт `buf breaking --against …#branch=main` и роняет прогон на любом разрыве.
# Осознанный разрыв проходит ТОЛЬКО через этот перечень, и запись живёт РОВНО ПОКА у неё
# есть предмет: находка вне перечня — красное, запись без находки — ТОЖЕ красное.
# Этим адъюдикация отличается от `breaking.ignore` в buf.yaml, где исключение по пути
# ослепляет проверку на целом файле навсегда.
#
# Разрыв, ставший историей (база сравнения поднялась после вливания в main), обязан быть
# удалён отсюда ТЕМ ЖЕ изменением, которое поднимает базу. Иначе прогон краснеет по
# исходу «послабление истекло» — и это не придирка, а единственное, что не даёт перечню
# стать свалкой.
#
# Поля обязательны все пять, и у каждого есть причина:
#   rule    — идентификатор правила buf (`RPC_NO_DELETE`); без него запись не сопоставима;
#   path    — путь к .proto относительно этого каталога; без него запись пропускала бы
#             разрыв в любом файле;
#   symbol  — имя снятого символа; buf называет его в сообщении в кавычках;
#   reason  — причина одной фразой; объявление без причины нечем оспорить при снятии;
#   issue   — РАЗРЕШИМАЯ ссылка (`kacho#244` либо полный URL): по голому `#71` объявление
#             не может истечь даже в принципе.
#
# Проверяет: tools/declaredbreak (cmd/adjudicate-declared-breaks), шаг конвейера
# «adjudicate breaking (vs main)».

declared: []
