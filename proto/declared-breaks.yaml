# Объявленные ломающие изменения контракта.
#
# Конвейер зовёт `buf breaking --against …#branch=main` и роняет прогон на любом разрыве.
# Осознанный разрыв проходит ТОЛЬКО через этот перечень, и запись живёт РОВНО ПОКА у неё
# есть предмет: находка вне перечня — красное, запись без находки — ТОЖЕ красное.
# Этим адъюдикация отличается от `breaking.ignore` в buf.yaml, где исключение по пути
# ослепляет проверку на целом файле навсегда.
#
# Разрыв, ставший историей (база сравнения поднялась после вливания в main), обязан быть
# удалён отсюда ТЕМ ЖЕ изменением, которое поднимает базу. Иначе прогон краснеет по
# исходу «послабление истекло» — и это не придирка, а единственное, что не даёт перечню
# стать свалкой.
#
# Поля обязательны все пять, и у каждого есть причина:
#   rule    — идентификатор правила buf (`RPC_NO_DELETE`); без него запись не сопоставима;
#   path    — путь к .proto относительно этого каталога; без него запись пропускала бы
#             разрыв в любом файле;
#   symbol  — имя снятого символа; buf называет его в сообщении в кавычках;
#   reason  — причина одной фразой; объявление без причины нечем оспорить при снятии;
#   issue   — РАЗРЕШИМАЯ ссылка (`kacho#244` либо полный URL): по голому `#71` объявление
#             не может истечь даже в принципе.
#
# Проверяет: tools/declaredbreak (cmd/adjudicate-declared-breaks), шаг конвейера
# «adjudicate breaking (vs main)».

declared:
  # Словарь классов отказа переехал из файла ВНУТРЕННЕГО сервиса шва в нейтральный
  # `apply_state.proto` того же пакета. Полное имя типа не изменилось — ни провод,
  # ни JSON не затронуты; изменилась только раскладка символов по файлам, за которой
  # следит категория FILE.
  - rule: ENUM_NO_DELETE
    path: kacho/cloud/vpc/v1/internal_dataplane_service.proto
    symbol: ApplyFailureReason
    reason: >-
      Словарь классов отказа стал общим для приёма отчёта и публичной проекции семи
      ресурсов. Оставь он имя внутреннего сервиса в импорте — справочник арендатора
      ссылался бы на него с каждого ресурса. Полное имя типа сохранено, потребителя
      у внутреннего контракта в дереве нет.
    issue: kacho#296

  # Три значения статуса интерфейса, у которых не было производителя НИ ОДНОГО, при
  # том что их комментарии заявляли предмет поля состояния применения. Номера и имена
  # зарезервированы; потребителей измерено ноль (консоль, провайдер, сквозные пробы).
  - rule: ENUM_VALUE_NO_DELETE
    path: kacho/cloud/vpc/v1/network_interface.proto
    symbol: "1"
    reason: >-
      PROVISIONING снят: производителя не было ни одного, а его предмет —
      программирование сети — теперь выражает поле состояния применения. Контракт
      не вправе отвечать на один вопрос двумя способами, из которых один мёртв.
    issue: kacho#296
  - rule: ENUM_VALUE_NO_DELETE
    path: kacho/cloud/vpc/v1/network_interface.proto
    symbol: "4"
    reason: >-
      FAILED снят по тому же основанию: значение без производителя, чей комментарий
      обещал арендатору отчёт исполнителя, которого это поле никогда не несло.
    issue: kacho#296
  - rule: ENUM_VALUE_NO_DELETE
    path: kacho/cloud/vpc/v1/network_interface.proto
    symbol: "5"
    reason: >-
      DELETING снят по тому же основанию: производителя нет, а удаление наблюдается
      исчезновением ресурса, а не значением поля, которое никто не выставляет.
    issue: kacho#296

# Записи выше САМОИСТЕКАЮЩИЕ: они обязаны быть сняты тем же изменением, которое
# поднимет базу сравнения (вливанием в ствол). До этого дня перечень был пуст, и это
# его нормальное состояние.
#
# Две записи про backend-порт слушателя (kacho#231) сняты: их разрывы влиты в
# ствол волной 2026-08-14, база сравнения поднялась, и `buf breaking` их больше
# не показывает. Правило шапки требует снимать такую запись ТЕМ ЖЕ изменением,
# которое поднимает базу; здесь это сделано отдельно, потому что база поднялась
# вливанием накопительной ветки, а не самим изменением контракта.
#
# Класс за сутки повторился дважды (21 запись kacho#246, затем эти две), и оба
# раза предмет истекал в момент вливания в ствол — не в момент правки контракта.
