# Объявленные ломающие изменения контракта.
#
# Конвейер зовёт `buf breaking --against …#branch=main` и роняет прогон на любом разрыве.
# Осознанный разрыв проходит ТОЛЬКО через этот перечень, и запись живёт РОВНО ПОКА у неё
# есть предмет: находка вне перечня — красное, запись без находки — ТОЖЕ красное.
# Этим адъюдикация отличается от `breaking.ignore` в buf.yaml, где исключение по пути
# ослепляет проверку на целом файле навсегда.
#
# Разрыв, ставший историей (база сравнения поднялась после вливания в main), обязан быть
# удалён отсюда ТЕМ ЖЕ изменением, которое поднимает базу. Иначе прогон краснеет по
# исходу «послабление истекло» — и это не придирка, а единственное, что не даёт перечню
# стать свалкой.
#
# Поля обязательны все пять, и у каждого есть причина:
#   rule    — идентификатор правила buf (`RPC_NO_DELETE`); без него запись не сопоставима;
#   path    — путь к .proto относительно этого каталога; без него запись пропускала бы
#             разрыв в любом файле;
#   symbol  — имя снятого символа; buf называет его в сообщении в кавычках;
#   reason  — причина одной фразой; объявление без причины нечем оспорить при снятии;
#   issue   — РАЗРЕШИМАЯ ссылка (`kacho#244` либо полный URL): по голому `#71` объявление
#             не может истечь даже в принципе.
#
# СНЯТИЕ ФАЙЛА ЦЕЛИКОМ (`FILE_NO_DELETE`) объявляется так же, как всё прочее, но `path` и
# `symbol` у него СОВПАДАЮТ — и это не описка:
#
#   - rule: FILE_NO_DELETE
#     path: kacho/cloud/vpc/v1/internal_dataplane_service.proto
#     symbol: kacho/cloud/vpc/v1/internal_dataplane_service.proto
#
# Причина в предмете: у снятия файла предмет ровно один — сам файл, и buf называет в
# сообщении в кавычках именно путь (`Previously present file "kacho/…/x.proto" was
# deleted.`), а поля `path` у такой находки не печатает вовсе — указывать не на что.
# Короткое имя файла в `symbol` не подойдёт: сопоставление ищет символ В КАВЫЧКАХ, а в
# кавычках стоит полный путь. Ошибиться не страшно — исход называется отдельно
# («символ не совпал») и печатает фактическое сообщение buf, где предмет и виден.
#
# Проверяет: tools/declaredbreak (cmd/adjudicate-declared-breaks), шаг конвейера
# «adjudicate breaking (vs main)».

# Снятие шва исполнителя датаплейна vpc целиком (kacho#400).
#
# Девять записей — один предмет. Решение владельца: у величины, которую платформа
# обещает арендатору, обязан быть производитель; исполнителя датаплейна не
# существует, поэтому поле состояния применения отвечало «не применено» всегда и
# на каждом из семи ресурсов. Из трёх законных исходов («реализовать» ·
# «отвергать явно» · «снять с контракта») здесь верен третий.
#
# Два файла + семь полей. Номера и имена полей зарезервированы надгробиями в
# самих контрактах, имена обеих RPC — в переписи снятой поверхности
# (`internal/repohygiene/retiredrpcsurface_test.go`).
declared:
  - rule: FILE_NO_DELETE
    path: kacho/cloud/vpc/v1/internal_dataplane_service.proto
    symbol: kacho/cloud/vpc/v1/internal_dataplane_service.proto
    reason: >-
      поверхность шва с исполнителем датаплейна: поток намерения и приём отчёта о
      применении. Вызывающей стороны не существовало ни у одного из двух методов
    issue: kacho#400
  - rule: FILE_NO_DELETE
    path: kacho/cloud/vpc/v1/apply_state.proto
    symbol: kacho/cloud/vpc/v1/apply_state.proto
    reason: >-
      сообщение состояния применения и закрытый словарь классов отказа
      исполнителя. Снимается вместе с семью полями, которые были его
      единственными потребителями
    issue: kacho#400
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/network.proto
    symbol: apply_state
    reason: поле без производителя на публичной поверхности сети
    issue: kacho#400
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/subnet.proto
    symbol: apply_state
    reason: поле без производителя на публичной поверхности подсети
    issue: kacho#400
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/network_interface.proto
    symbol: apply_state
    reason: поле без производителя на публичной поверхности интерфейса
    issue: kacho#400
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/address.proto
    symbol: apply_state
    reason: поле без производителя на публичной поверхности адреса
    issue: kacho#400
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/security_group.proto
    symbol: apply_state
    reason: поле без производителя на публичной поверхности группы правил
    issue: kacho#400
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/route_table.proto
    symbol: apply_state
    reason: поле без производителя на публичной поверхности таблицы маршрутизации
    issue: kacho#400
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/gateway.proto
    symbol: apply_state
    reason: поле без производителя на публичной поверхности шлюза
    issue: kacho#400

# ИСТОРИЯ ПЕРЕЧНЯ — почему его нормальное состояние ПУСТО.
#
# Четыре записи (kacho#296) сняты: их разрывы влиты в ствол волной 2026-08-14.
# База сравнения поднялась, `buf breaking` их больше не показывает, и адъюдикация
# обязана краснеть исходом «послабление истекло».
#
# КЛАСС ПОВТОРИЛСЯ ЗА СУТКИ ТРИЖДЫ: 21 запись (kacho#246), затем 2 (kacho#231),
# теперь 4 (kacho#296). Каждый раз предмет истекал в момент ВЛИВАНИЯ накопительной
# ветки в ствол, а не в момент правки контракта, — поэтому требование шапки «снимать
# запись ТЕМ ЖЕ изменением, которое поднимает базу» буквально невыполнимо: изменение
# контракта и подъём базы разнесены во времени и делаются разными изменениями.
#
# Пока механизма нет, порядок такой: после КАЖДОГО вливания накопительной ветки в
# ствол прогнать `bash scripts/ci-local.sh proto` на свежем `main` и снять записи,
# оставшиеся без предмета. Предикат: адъюдикация зелёная, число сопоставленных равно
# числу находок buf.
