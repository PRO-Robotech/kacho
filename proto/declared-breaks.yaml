# ===========================================================================
# ЗАПИСИ ЭТОЙ ВЕТКИ — kacho#2601: форма операции переименована в `corelib.operation`.
#
# ЧТО СНЯТО И ПОЧЕМУ. Три файла `kacho/cloud/operation/*.proto` — конверт
# асинхронной мутации, служба его чтения и опции пакета — переехали под
# нейтральный корень (`corelib/operation/*.proto`) и называются теперь
# `corelib.operation`. Заглушку публикует фундамент, как и прежде; меняется имя,
# а не дом: операцию берут оба продукта, и возврат контракта в платформу завёл бы
# ребро «служба → платформа», которого в топологии нет.
#
# ЧТО ЭТО ЗНАЧИТ ДЛЯ ВЫЗЫВАЮЩЕГО — ДВЕ РАЗНЫЕ ВЕЩИ, И ОНИ НАЗВАНЫ РАЗДЕЛЬНО.
#
#   Сообщение `Operation`. Полное имя сообщения не участвует ни в двоичном
#   кодировании (номера полей), ни в JSON (имена полей); в `google.protobuf.Any`
#   его не упаковывает ни одна служба ни одного из трёх деревьев (замер по
#   прод-коду: `anypb.New` от операции и адрес типа операции — ноль вхождений).
#   Состав сообщения не изменён ни на поле. Отсюда форма находок: смена ТИПА
#   ответа у 100 глаголов и типа поля `operations` у 18 сообщений — все сто
#   восемнадцать называют одну и ту же пару имён, и ни одна не называет поле.
#
#   Служба `OperationService`. Её полное имя задаёт путь вызова gRPC, и он
#   МЕНЯЕТСЯ: `/corelib.operation.OperationService/Get` и `…/Cancel`. REST-пути
#   (`GET /operations/{operation_id}`, `POST /operations/{operation_id}:cancel`)
#   задаются аннотацией и не изменились ни одним знаком — таблица маршрутов края
#   перерождена, пар «метод + шаблон» 296 до и 296 после, различие только в
#   полном имени метода у двух строк. Край, владельцы и служба доступа
#   выкатываются вместе: образы платформы собираются от одного дерева, а служба
#   доступа поднимает глагол из того же выпуска фундамента.
#
# ПОЧЕМУ ЗАПИСЬ НА ФАЙЛ, А НЕ НА ГЛАГОЛ. Символ записи — прежнее имя ТИПА
# (`kacho.cloud.operation.Operation`), которое buf называет в кавычках у каждой
# находки о смене типа. Решатель сопоставляет запись со ВСЕМИ находками того же
# правила в том же файле, чей текст несёт этот символ, — то есть запись прощает
# ровно смену этого типа и никакой другой: смена ответа на иной тип в том же
# файле останется необъявленной находкой. Записей поэтому 44, а не 121:
# три снятия файла и сорок одна пара «правило + файл».
#
# ПРЕДИКАТ СНЯТИЯ — ОБЩИЙ У ВСЕХ СОРОКА ЧЕТЫРЁХ: вливание этой ветки в ствол. База
# сравнения поднимется, находок станет ноль, и решатель назовёт каждую запись
# потерявшей предмет на первом же прогоне ствола. Снимает их изменение, которое
# следует за вливанием, — у записей нет поля даты, их срок и есть база.
# ===========================================================================

