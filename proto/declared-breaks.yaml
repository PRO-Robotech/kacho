# Объявленные ломающие изменения контракта.
#
# Конвейер зовёт `buf breaking --against …#branch=main` и роняет прогон на любом разрыве.
# Осознанный разрыв проходит ТОЛЬКО через этот перечень, и запись живёт РОВНО ПОКА у неё
# есть предмет: находка вне перечня — красное, запись без находки — ТОЖЕ красное.
# Этим адъюдикация отличается от `breaking.ignore` в buf.yaml, где исключение по пути
# ослепляет проверку на целом файле навсегда.
#
# Разрыв, ставший историей (база сравнения поднялась после вливания в main), обязан быть
# удалён отсюда. Держит это не память исполнителя, а сам конвейер: адъюдикация идёт И НА
# PUSH В СТВОЛ, поэтому истёкшая запись называется поимённо там же и тогда же, где её
# предмет истёк, — на первом прогоне ствола после вливания (kacho#490).
#
# НОРМАЛЬНОЕ СОСТОЯНИЕ ПЕРЕЧНЯ НА СТВОЛЕ — ПУСТО, и это не пожелание, а следствие:
# на стволе база сравнения — сам ствол, находок 0 по построению, значит ни у одной
# записи предмета быть не может. Запись живёт ровно от объявления разрыва в ветке до
# вливания этой ветки.
#
# Поля обязательны все пять, и у каждого есть причина:
#   rule    — идентификатор правила buf (`RPC_NO_DELETE`); без него запись не сопоставима;
#   path    — путь к .proto относительно этого каталога; без него запись пропускала бы
#             разрыв в любом файле;
#   symbol  — имя снятого символа; buf называет его в сообщении в кавычках;
#   reason  — причина одной фразой; объявление без причины нечем оспорить при снятии;
#   issue   — РАЗРЕШИМАЯ ссылка (`kacho#244` либо полный URL): по голому `#71` объявление
#             не может истечь даже в принципе.
#
# СНЯТИЕ ФАЙЛА ЦЕЛИКОМ (`FILE_NO_DELETE`) объявляется так же, как всё прочее, но `path` и
# `symbol` у него СОВПАДАЮТ — и это не описка:
#
#   - rule: FILE_NO_DELETE
#     path: kacho/cloud/vpc/v1/internal_dataplane_service.proto
#     symbol: kacho/cloud/vpc/v1/internal_dataplane_service.proto
#
# Причина в предмете: у снятия файла предмет ровно один — сам файл, и buf называет в
# сообщении в кавычках именно путь (`Previously present file "kacho/…/x.proto" was
# deleted.`), а поля `path` у такой находки не печатает вовсе — указывать не на что.
# Короткое имя файла в `symbol` не подойдёт: сопоставление ищет символ В КАВЫЧКАХ, а в
# кавычках стоит полный путь. Ошибиться не страшно — исход называется отдельно
# («символ не совпал») и печатает фактическое сообщение buf, где предмет и виден.
#
# Проверяет: tools/declaredbreak (cmd/adjudicate-declared-breaks), шаг конвейера
# «adjudicate breaking (vs main)».

declared:
  # Записи kacho#499 (12 разрывов MESSAGE_NO_DELETE) СНЯТЫ здесь, потому что их
  # предмет истёк ровно тем способом, ради которого механизм и написан: ветка
  # release/platform-contract вошла в ствол, база сравнения поднялась, и `buf
  # breaking` этих разрывов больше не показывает. Адъюдикация назвала все
  # двенадцать поимённо («послаблению нечего исключать»), и снимает их та линия,
  # что догоняет ствол второй, — тем же изменением, которым догоняет.

  # Двенадцать сообщений, переживших СВОИ ГЛАГОЛЫ. Восемь методов сняты коммитом
  # 7675925f (задачи 10, 12, 13, 45): он убрал глаголы, хендлеры, строки каталога
  # прав, маршруты края, кейсы и пробы — и оставил их сообщения запроса и ответа.
  # Имена самих методов уже стоят в перечне снятой поверхности
  # (internal/repohygiene/retiredrpcsurface_test.go), поэтому вернуться молча они
  # не могут; здесь снимается то, что от них осталось в контракте.
  #
  # Почему это ЗАВЕРШЕНИЕ снятия, а не новое решение: причина, по которой сняты
  # глаголы правки маршрутов, названа тем коммитом дословно — идентичности
  # маршрута в модели нет, адресовать правку было нечем. Сообщения, требующие
  # такой идентификатор, ей и остались надгробием.
  # ── kacho#580: домен доступа, который не обслуживал ни один сервис ──────────
  #
  # Файл объявлял 23 сообщения и перечисление и НИ ОДНОГО сервиса; ни один другой
  # контракт его не импортировал, ни одна строка прод-кода не читала его типы.
  # Единственной ссылкой во всём дереве был пустой импорт в переписи гейта края —
  # то есть файл держался тем, что его считали, а не тем, что им пользовались.
  #
  # Снятие целиком, а не «ждёт своего сервиса»: держать поверхность «на будущее»
  # значит держать обещание, за которое никто не отвечает. Предмет домена доступа
  # живёт в `kacho.cloud.iam.v1` (AccessBinding и его глаголы) — то есть у этой
  # поверхности есть не только отсутствующий владелец, но и действующий двойник.
  - rule: FILE_NO_DELETE
    path: kacho/cloud/access/access.proto
    symbol: kacho/cloud/access/access.proto
    reason: контракт без единого сервиса и без импортёров; предмет живёт в kacho.cloud.iam.v1
    issue: kacho#580

  # ── kacho#581: сообщения метаданных, которых не называет ни одна операция ────
  #
  # Метаданные операции — то, что вызывающий читает из `Operation.metadata`, пока
  # операция идёт. Сообщение, не названное ни одной опцией `kacho.cloud.api.operation`,
  # туда не попадёт никогда.
  #
  # Снимаются ТОЛЬКО те пять, у которых нет производителя вовсе. Остальные шесть
  # находок задачи оказались обратным классом — их ПИШЕТ прод-код, а контракт о них
  # молчал, — и закрыты противоположным исходом (глагол объявляет их своими
  # метаданными). Перечень задачи брал их одной меркой; замер по второму признаку
  # (референт в прод-коде) эти два случая разделил.
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/vpc/v1/subnet_service.proto
    symbol: AddSubnetCidrBlocksMetadata
    reason: глагол AddCidrBlocks объявляет метаданными UpdateSubnetMetadata; у этого имени производителя нет
    issue: kacho#581
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/vpc/v1/subnet_service.proto
    symbol: RemoveSubnetCidrBlocksMetadata
    reason: глагол RemoveCidrBlocks объявляет метаданными UpdateSubnetMetadata; у этого имени производителя нет
    issue: kacho#581
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/compute/v1/instance_service.proto
    symbol: AddInstanceOneToOneNatMetadata
    reason: глагола AddOneToOneNat в InstanceService нет — метаданные без операции
    issue: kacho#581
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/compute/v1/instance_service.proto
    symbol: RemoveInstanceOneToOneNatMetadata
    reason: глагола RemoveOneToOneNat в InstanceService нет — метаданные без операции
    issue: kacho#581
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/compute/v1/instance_service.proto
    symbol: UpdateInstanceMetadataMetadata
    reason: глагола UpdateMetadata в InstanceService нет; правка машины несёт UpdateInstanceMetadata
    issue: kacho#581

# ИСТОРИЯ ПЕРЕЧНЯ — почему его нормальное состояние ПУСТО.
#
# Девять записей (kacho#400 — снятие шва исполнителя датаплейна vpc: два файла и
# семь полей `apply_state`) сняты вслед за вливанием `29ad7b78` в ствол. База
# сравнения поднялась, `buf breaking` их больше не показывает — находок 0, — и
# адъюдикация обязана краснеть исходом «послабление истекло».
#
# КЛАСС ПОВТОРЯЛСЯ ЧЕТЫРЕ РАЗА: 21 запись (kacho#246), 2 (kacho#231), 4 (kacho#296),
# 9 (kacho#400). Каждый раз предмет истекал в момент ВЛИВАНИЯ накопительной ветки в
# ствол, а не в момент правки контракта, — поэтому прежнее требование шапки «снимать
# запись ТЕМ ЖЕ изменением, которое поднимает базу» было буквально невыполнимо:
# изменение контракта и подъём базы разнесены во времени и делаются разными
# изменениями. Правило существовало, было записано здесь и не выполнилось ни разу.
#
# ПОЧЕМУ ЭТО НЕ ЛОВИЛОСЬ НА СТВОЛЕ, а доставалось постороннему PR: шаг адъюдикации был
# объявлен `if: github.event_name == 'pull_request'`, поэтому push в ствол его не
# исполнял вовсе. Цена названа числом: 2026-08-16 девять записей снимали ДВЕ линии
# независимо (kacho#488 и соседняя), потому что обе наткнулись на одно и то же и ни
# одна не видела другую.
#
# ЗАКРЫТО В kacho#490: условие снято, шаг идёт и на push в ствол. Теперь истечение
# обнаруживается там, где происходит, и чинится один раз в стволе, а не каждым PR по
# очереди. Предикат, по которому это проверяется наблюдением: пять последовательных
# вливаний, и ни один PR не получает красное «послабление истекло» по чужому предмету.
