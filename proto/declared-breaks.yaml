# ЗАПИСИ kacho#2601 СНЯТЫ 2026-09-15 — два контракта фундамента под нейтральным
# корнем.
#
# ПРЕДИКАТ СНЯТИЯ ИСПОЛНЕН. Линия влита в ствол (#2650), база сравнения поднялась,
# находок buf стало 0, и адъюдикатор назвал потерявшей предмет каждую из восьми
# записей — на первом же прогоне ствола, ровно как предписывал их текст. Ствол
# покраснел на шаге «adjudicate breaking (vs main)», и это было самоистечение
# послабления, а не поломка.
#
# Проверено опытом в обе стороны, а не прочтением (форма конвейера,
# `--error-format=json`, тот же решатель):
#
#   база — ствол до вливания (3f1471b413):   находок 8, записей 8, сопоставлено 8 — PASS
#   база — ствол после вливания (edc98869b7): находок 0, записей 8 — восемь ИСТЕКЛО
#
# То есть каждая запись описывала настоящий разрыв один к одному, и ни одного из
# восьми больше нет. Держать их значило бы держать послабление, которому нечего
# прощать.
#
# Разбор сохранён — он переживает сами записи:
#
#   ФОРМА ОТВЕТА УЧЁТА (`kacho.cloud.quota.v1` → `corelib.quota.v1`), шесть записей:
#   одно `FILE_NO_DELETE` на снятый файл `kacho/cloud/quota/v1/quota.proto` плюс пять
#   `FIELD_SAME_TYPE` — по одному на владельца, поле `quotas` сообщения
#   `ListQuotasResponse` у vpc, compute, storage, loadbalancer и registry. Сообщение
#   `Quota` объявляет форму ответа, общую обоим продуктам, и платформенное имя
#   утверждало владение, которого нет. Проволочной несовместимости у арендатора не
#   было: полное имя сообщения не участвует ни в двоичном кодировании (номера
#   полей), ни в JSON (имена полей), `Quota` не встречается ни в одном
#   `google.protobuf.Any` и службы в своём пакете не объявляет. Менялся только
#   дескриптор — отсюда и форма находок, ни одной об оболочке запроса.
#
#   ФОРМА ПОДПИСКИ (`kacho.cloud.subscription` → `corelib.subscription`), две записи
#   `FILE_NO_DELETE`, по числу файлов. Заглушку публикует фундамент, как и прежде;
#   менялось имя, а не дом. Вернуть контракт в платформу было нельзя: у формы
#   подписки два продукта-потребителя, и возврат завёл бы ребро «служба →
#   платформа», которого в топологии нет. Для арендатора не менялось ничего: глагол
#   пакета один и он внутренний (`InternalSubscriptionService/Subscribe`), наружу его
#   не пускают два независимых механизма, ни один из которых переименованием не
#   затронут — перечень внешне маршрутизируемых методов и признак имени службы
#   (`HasInternalSuffix` судит имя службы, а не пакет). Оба утверждения держит
#   `gateway/internal/allowlist/subscription_verb_test.go`. Внутри менялось полное
#   имя метода, поэтому край и владельцы журнала выкатываются вместе — by
#   construction, они собираются от одного дерева.
#
# Третий контракт фундамента с платформенным именем — форма операции — стал
# предметом записей ниже (та же задача, та же форма рассуждения).
