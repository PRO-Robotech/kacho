# Объявленные ломающие изменения контракта.
#
# Конвейер зовёт `buf breaking --against …#branch=main` и роняет прогон на любом разрыве.
# Осознанный разрыв проходит ТОЛЬКО через этот перечень, и запись живёт РОВНО ПОКА у неё
# есть предмет: находка вне перечня — красное, запись без находки — ТОЖЕ красное.
# Этим адъюдикация отличается от `breaking.ignore` в buf.yaml, где исключение по пути
# ослепляет проверку на целом файле навсегда.
#
# Разрыв, ставший историей (база сравнения поднялась после вливания в main), обязан быть
# удалён отсюда. Держит это не память исполнителя, а сам конвейер: адъюдикация идёт И НА
# PUSH В СТВОЛ, поэтому истёкшая запись называется поимённо там же и тогда же, где её
# предмет истёк, — на первом прогоне ствола после вливания (kacho#490).
#
# НОРМАЛЬНОЕ СОСТОЯНИЕ ПЕРЕЧНЯ НА СТВОЛЕ — ПУСТО, и это не пожелание, а следствие:
# на стволе база сравнения — сам ствол, находок 0 по построению, значит ни у одной
# записи предмета быть не может. Запись живёт ровно от объявления разрыва в ветке до
# вливания этой ветки.
#
# Поля обязательны все пять, и у каждого есть причина:
#   rule    — идентификатор правила buf (`RPC_NO_DELETE`); без него запись не сопоставима;
#   path    — путь к .proto относительно этого каталога; без него запись пропускала бы
#             разрыв в любом файле;
#   symbol  — имя снятого символа; buf называет его в сообщении в кавычках;
#   reason  — причина одной фразой; объявление без причины нечем оспорить при снятии;
#   issue   — РАЗРЕШИМАЯ ссылка (`kacho#244` либо полный URL): по голому `#71` объявление
#             не может истечь даже в принципе.
#
# СНЯТИЕ ФАЙЛА ЦЕЛИКОМ (`FILE_NO_DELETE`) объявляется так же, как всё прочее, но `path` и
# `symbol` у него СОВПАДАЮТ — и это не описка:
#
#   - rule: FILE_NO_DELETE
#     path: kacho/cloud/vpc/v1/internal_dataplane_service.proto
#     symbol: kacho/cloud/vpc/v1/internal_dataplane_service.proto
#
# Причина в предмете: у снятия файла предмет ровно один — сам файл, и buf называет в
# сообщении в кавычках именно путь (`Previously present file "kacho/…/x.proto" was
# deleted.`), а поля `path` у такой находки не печатает вовсе — указывать не на что.
# Короткое имя файла в `symbol` не подойдёт: сопоставление ищет символ В КАВЫЧКАХ, а в
# кавычках стоит полный путь. Ошибиться не страшно — исход называется отдельно
# («символ не совпал») и печатает фактическое сообщение buf, где предмет и виден.
#
# Проверяет: tools/declaredbreak (cmd/adjudicate-declared-breaks), шаг конвейера
# «adjudicate breaking (vs main)».

# ЗАПИСЬ ОДНА, и она живёт от объявления разрыва в этой ветке до её вливания.
#
# Что снято: файл `kacho/cloud/validation.proto` объявлял девять расширений описателя —
# семейство ограничений полей (`required`, `pattern`, `value`, `size`, `length`, `unique`,
# `map_key`, `bytes` и `exactly_one` на группе). Исполнителя на пути запроса у него не
# было ни одного: поле принимало что угодно независимо от объявленного (kacho#1255).
#
# ВНИМАНИЕ, И ЭТО НЕ ФОРМАЛЬНОСТЬ: `buf` моделирует лишь ПОЛОВИНУ этого разрыва. Снятие
# опций у 750 полей он не флагует вовсе — находка ровно одна, и она про удаление файла.
# Молчание гейта объявлением не является, поэтому существо разрыва объявлено ЗДЕСЬ,
# а не отсылкой к чужому месту.
#
# Прежняя редакция этого абзаца отсылала за существом «в сообщение коммита». Отсылка
# была ложной в момент, когда её писали: снятие приехало коммитом-снимком, чьё
# собственное тело обещало, что сообщение перепишут при завершении полосы, — и его не
# переписали. Отсылка была бы негодной и в том случае, если бы сообщение написали:
# работа вливается схлопыванием, то есть сообщение, на которое ссылаются, до ствола
# не доезжает. Место объявления обязано переживать способ вливания.
#
# СУЩЕСТВО РАЗРЫВА (замер по ОПИСАТЕЛЮ дерева до снятия, не по тексту — текстовый
# предикат завышает на собственных объяснениях в комментариях):
#
#   объявлений на полях          1185   у 750 различных полей
#   объявлений на группах oneof    10
#   файлов контрактов              53   в восьми доменах: compute geo iam
#                                       loadbalancer operation registry storage vpc
#   по опциям                     length 562 · required 316 · pattern 107 · value 90 ·
#                                 size 62 · map_key 48 · exactly_one 10 ·
#                                 unique 0 · bytes 0
#
# Что это значит для читающего контракт: из него исчезают машиночитаемые ограничения
# полей — обязательность, образец, диапазон, размер, длина. Что это НЕ значит:
# поведение сервисов не сдвинуто ни на одном пути (исполнителя не было), а клиентская
# поверхность не изменилась by construction — расширение частное, с частными номерами,
# и не читалось ни одним существующим генератором клиентов.
# Записей нет — и это ЦЕЛЬ перечня, а не его отсутствие.
#
# Последняя запись (снятие семейства ограничений полей, kacho#1255) истекла сама, как и
# задумано: работа влита в ствол, разрыва больше нет, и гейт назвал запись потерявшей
# предмет. Держать её дальше значило бы держать послабление, которому нечего прощать, —
# ровно тот класс, который перечень и стережёт.
#
# Разбор снятого семейства сохранён выше: он объясняет, ПОЧЕМУ buf моделирует лишь
# половину такого разрыва, и это знание переживает саму запись.

# ЗАПИСЬ СНЯТА 2026-08-29: слом состоялся и лежит в стволе (эпик #1016, PR #1457),
# поэтому buf разрыва больше не находит, а гейт назвал запись потерявшей предмет.
# Разбор сохранён — он переживает саму запись:
#
#   Был снят контракт службы, которой владелец прав гасил кэш решений края. Предмет
#   записи — НАПРАВЛЕНИЕ, а не механизм: ребро вело из листа графа обратно к
#   потребителю, а обязательная ручка адреса потребителя не давала владельцу
#   подняться там, где потребителя нет вовсе. Замена — чтение журнала, которое
#   потребитель открывает сам; имя легло в надгробие retiredRPCSurface вместе с
#   причиной, по которой не должно вернуться. Снят был ВЕСЬ файл и весь пакет
#   контракта, поэтому path и symbol совпадали — buf называет в кавычках путь.

# ===========================================================================
# ЗАПИСИ ЭТОЙ ВЕТКИ — переезд контракта доступа под собственный корень.
#
# ЧТО СНЯТО. Дерево контрактов службы доступа переехало из `kacho/cloud/iam/v1`
# в `kaname/cloud/iam/v1` вместе с именем пакета (`kacho.cloud.iam.v1` →
# `kaname.cloud.iam.v1`). Для `buf` это снятие 39 файлов и заведение 39 новых:
# правило `FILE_NO_DELETE` даёт по одной находке НА ФАЙЛ, поэтому и записей 39,
# а `path` и `symbol` у каждой совпадают — у снятия файла предмет ровно один.
#
# СОРОКОВАЯ ЗАПИСЬ — ДРУГОГО РОДА, и её стоит прочитать отдельно. Общая форма
# ответа о величинах (`kacho.cloud.quota.v1`) НЕ переименовывается: это контракт
# платформы, из которого читают пять доменов, и имя службы на нём не появляется.
# Одно её поле называло тип области ИЗ КОНТРАКТА ДОСТУПА — теперь не называет.
#
# ПРИЧИНА ЭТОЙ ЗАПИСИ СМЕНИЛАСЬ ВМЕСТЕ С ЕЁ ПРЕДМЕТОМ (задача #2117, стадия S2),
# и это сказано здесь, а не поправлено молча: находка `buf` та же самая, а
# ломающее изменение под ней стало ДРУГИМ. Прежде поле меняло тип потому, что у
# заимствованного перечисления сменилось полное имя вместе с именем пакета
# службы; теперь перечисление не заимствуется вовсе — общий контракт учёта
# объявляет СВОЁ (`kacho.cloud.quota.v1.Quota.Scope`).
#
# ЗАЧЕМ ЭТО СДЕЛАНО. Служба доступа выносится отдельным продуктом. Пока её
# контракт импортировался платформенным, платформа не собиралась без службы, а
# снять контракт службы было нельзя, пока этот импорт жив, — приёмка называет
# это ребром между стадиями. Импорт был ОДИН на всё дерево контрактов платформы,
# и он снят.
#
# ЧТО ЭТО ЗНАЧИТ ДЛЯ ВЫЗЫВАЮЩЕГО — НИЧЕГО, и это проверяемо, а не обещано.
# Арендатор читает это поле, а не объявляет его: имена ветвей и их номера
# прежние, поэтому JSON (он кодирует перечисление ИМЕНЕМ) и провод (он кодирует
# НОМЕРОМ) не изменились ни на байт. Изменилось полное имя типа, и
# `FIELD_SAME_TYPE` справедливо считает это сменой типа: сравнивать полные имена
# — его работа. Перекомпиляции требует тот, кто собирал стабы платформы; тот,
# кто читает REST, не замечает ничего.
#
# Прежние REST-пути арендатора (`/iam/v1/…`) не изменились ни одним шаблоном: они
# бренда не несут и в предмет переезда не входили.
#
# ЗАПИСИ ИСТЕКАЮТ САМИ. База сравнения — ствол; после вливания разрыва больше
# нет, находок ноль, и адъюдикатор назовёт каждую запись потерявшей предмет.
# Снять их обязано то же изменение, которое поднимет базу, — иначе перечень
# начнёт прощать пустоту.
# ===========================================================================

# ===========================================================================
# ЗАПИСИ ЭТОЙ ВЕТКИ — контракты службы доступа УЕХАЛИ В ЕЁ РЕПОЗИТОРИЙ.
#
# РЕШЕНИЕ. Владелец 2026-09-13 (`kacho#2616`, исход C «дом по владельцу, провод
# неизменен», разбор — `kacho#2617`): контракты, относящиеся к службе доступа,
# живут в `PRO-Robotech/kaname`, и в этом дереве их не остаётся. Заглушки Go
# публикует её модуль; платформа берёт их зависимостью.
#
# ЧТО СНЯТО. Сорок один файл `kaname/cloud/iam/v1/*.proto` (плюс не-контрактный
# `fga_model.fga`, которого buf не видит). `FILE_NO_DELETE` даёт по одной находке
# НА ФАЙЛ, поэтому и записей 41, а `path` и `symbol` у каждой совпадают — у
# снятия файла предмет ровно один.
#
# ЧЕГО НЕ СНЯТО, И ЭТО НЕСУЩЕЕ. Имя proto-пакета (`kaname.cloud.iam.v1`), путь
# файла внутри дерева контрактов, номера полей, номера расширений, шаблоны REST
# — НЕ ИЗМЕНИЛИСЬ НИ ОДНИМ ЗНАКОМ. Изменилась ровно одна строка в каждом файле:
# `option go_package`, то есть КТО ПУБЛИКУЕТ заглушки. Замер: различие 41
# контракта против копии в репозитории службы — ровно эта строка, по одной на
# файл (`diff` по каждому из 42 путей, 41 отличие в одну строку + прозаический
# абзац в `fga_model.fga`).
#
# ЧТО ЭТО ЗНАЧИТ ДЛЯ ВЫЗЫВАЮЩЕГО — НИЧЕГО, и это проверяемо, а не обещано.
# Развёрнутый клиент адресует методы полным именем (`kaname.cloud.iam.v1.…`) и
# путями REST (`/iam/v1/…`); ни одно из них не тронуто. Каталог прав края
# остался ПОБАЙТОВО тем же (350 записей, sha256 неизменен), таблица маршрутов —
# тоже (308 строк, из них 104 службы). Перекомпиляции требует тот, кто собирал
# заглушки службы из модуля платформы; таких потребителей два, оба свои.
#
# ПОЧЕМУ РАЗРЫВ НЕИЗБЕЖЕН, А НЕ ВЫБРАН. `buf breaking` сравнивает ДЕРЕВО против
# дерева: файл, которого в этом дереве больше нет, для него снят — независимо от
# того, что тот же путь с тем же содержимым публикуется другим модулем. Модели
# «файл переехал» у правила нет, и заводить её не наше дело. Альтернатива —
# оставить копию здесь, то есть публиковать один путь `.proto` дважды; это даёт
# панику регистрации дескрипторов у транзитивного потребителя, отказ времени
# ИСПОЛНЕНИЯ, который сборкой не ловится.
#
# ПРЕДИКАТ СНЯТИЯ ИСПОЛНЕН 2026-09-13, и записей здесь больше нет. База поднята
# вливанием выноса службы: файлов не стало ни в дереве, ни в базе, находок buf
# стало 0, и адъюдикатор назвал потерявшей предмет каждую из 41 записи. Все 41
# сняты этим изменением — ровно как предписывала прежняя редакция абзаца: снять
# их обязано то изменение, которое поднимет базу.
#
# Предикат, которым это перемеряется (форма конвейера, база — ствол на github):
#
#     cd proto && buf breaking \
#       --against "https://github.com/PRO-Robotech/kacho.git#branch=main,subdir=proto" \
#       --error-format=json | <решатель> proto/declared-breaks.yaml
#
# → «осмотрено находок buf 0, записей перечня 0; сопоставлено 0», код 0.
#
# ЛОВУШКА, СТОИВШАЯ ОТПРАВКИ. Хук отправки сравнивает с ЛОКАЛЬНОЙ ссылкой
# `origin/main`, и на отставшей копии истёкшими выглядели 15 записей из 41 —
# то есть число находок зависело от свежести рабочей копии, а не от дерева.
# Перечень пуст by construction: пустая ведомость есть ЦЕЛЬ, и решатель на ней
# проходит, а не падает.
# ===========================================================================

