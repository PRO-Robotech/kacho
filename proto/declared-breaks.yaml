# Объявленные ломающие изменения контракта.
#
# Конвейер зовёт `buf breaking --against …#branch=main` и роняет прогон на любом разрыве.
# Осознанный разрыв проходит ТОЛЬКО через этот перечень, и запись живёт РОВНО ПОКА у неё
# есть предмет: находка вне перечня — красное, запись без находки — ТОЖЕ красное.
# Этим адъюдикация отличается от `breaking.ignore` в buf.yaml, где исключение по пути
# ослепляет проверку на целом файле навсегда.
#
# Разрыв, ставший историей (база сравнения поднялась после вливания в main), обязан быть
# удалён отсюда ТЕМ ЖЕ изменением, которое поднимает базу. Иначе прогон краснеет по
# исходу «послабление истекло» — и это не придирка, а единственное, что не даёт перечню
# стать свалкой.
#
# Поля обязательны все пять, и у каждого есть причина:
#   rule    — идентификатор правила buf (`RPC_NO_DELETE`); без него запись не сопоставима;
#   path    — путь к .proto относительно этого каталога; без него запись пропускала бы
#             разрыв в любом файле;
#   symbol  — имя снятого символа; buf называет его в сообщении в кавычках;
#   reason  — причина одной фразой; объявление без причины нечем оспорить при снятии;
#   issue   — РАЗРЕШИМАЯ ссылка (`kacho#244` либо полный URL): по голому `#71` объявление
#             не может истечь даже в принципе.
#
# Проверяет: tools/declaredbreak (cmd/adjudicate-declared-breaks), шаг конвейера
# «adjudicate breaking (vs main)».

declared:
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/network_service.proto
    symbol: create_default_security_group
    reason: >-
      поле позволяло сети остаться без группы правил по умолчанию, тогда как модель
      закрыта в обе стороны и интерфейс наследует группу своей сети — сеть без группы
      означала бы интерфейс без единого правила
    issue: kacho#246
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/security_group.proto
    symbol: predefined_target
    reason: >-
      свободная строка без словаря и без ветвления: платформа не называла ни одного
      значения, поэтому вызывающий не мог узнать, что в ней написать
    issue: kacho#246
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/security_group_service.proto
    symbol: predefined_target
    reason: >-
      та же ветвь цели в списочном запросе правил: снимается вместе с проекцией,
      иначе вход принимал бы то, чего в ответе нет
    issue: kacho#246
  - rule: RPC_NO_DELETE
    path: kacho/cloud/vpc/v1/route_table_service.proto
    symbol: AddRoutes
    reason: >-
      метод отвечал отказом при ЛЮБОМ входе: идентичности маршрута в модели нет, адресовать правку было нечем
    issue: kacho#246
  - rule: RPC_NO_DELETE
    path: kacho/cloud/vpc/v1/route_table_service.proto
    symbol: RemoveRoutes
    reason: >-
      метод отвечал отказом при ЛЮБОМ входе: идентичности маршрута в модели нет, адресовать правку было нечем
    issue: kacho#246
  - rule: RPC_NO_DELETE
    path: kacho/cloud/vpc/v1/route_table_service.proto
    symbol: UpdateRoute
    reason: >-
      метод отвечал отказом при ЛЮБОМ входе: идентичности маршрута в модели нет, адресовать правку было нечем
    issue: kacho#246
  - rule: RPC_NO_DELETE
    path: kacho/cloud/vpc/v1/address_service.proto
    symbol: GetByValue
    reason: >-
      внешняя ветвь неавторизуема по построению — область бралась из подсети, которой у внешнего адреса нет; замена — список с сужением по значению
    issue: kacho#246
  - rule: RPC_NO_DELETE
    path: kacho/cloud/vpc/v1/address_service.proto
    symbol: ListBySubnet
    reason: >-
      строгое подмножество списка, который уже несёт сужение по подсети: два пути к одному ответу с разными объектами проверки прав
    issue: kacho#246
  - rule: RPC_NO_DELETE
    path: kacho/cloud/vpc/v1/network_service.proto
    symbol: ListSubnets
    reason: >-
      второй путь к ответу списка подсетей, объект проверки прав другой (сеть, а не ресурс); замена — список с сужением по сети
    issue: kacho#246
  - rule: RPC_NO_DELETE
    path: kacho/cloud/vpc/v1/network_service.proto
    symbol: ListSecurityGroups
    reason: >-
      второй путь к ответу списка групп правил, объект проверки прав другой; замена — список с сужением по сети
    issue: kacho#246
  - rule: RPC_NO_DELETE
    path: kacho/cloud/vpc/v1/network_service.proto
    symbol: ListRouteTables
    reason: >-
      второй путь к ответу списка таблиц маршрутизации, объект проверки прав другой; замена — список с сужением по сети
    issue: kacho#246
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/address.proto
    symbol: requirements
    reason: >-
      сообщение требований несло ровно два поля, и оба сняты: словарь защиты от атак в
      общем фундаменте называл конкретного внешнего поставщика и ни на чём не ветвился,
      а у возможности исходящей почты не было ни одного законного непустого входа
    issue: kacho#246
  - rule: FIELD_NO_DELETE
    path: kacho/cloud/vpc/v1/address_service.proto
    symbol: requirements
    reason: >-
      сообщение требований несло ровно два поля, и оба сняты: словарь защиты от атак в
      общем фундаменте называл конкретного внешнего поставщика и ни на чём не ветвился,
      а у возможности исходящей почты не было ни одного законного непустого входа
    issue: kacho#246
  - rule: MESSAGE_NO_DELETE
    path: kacho/cloud/vpc/v1/address.proto
    symbol: AddressRequirements
    reason: >-
      оба поля сообщения сняты, и оставлять его значило бы держать пустую разновидность —
      тот же дефект, что у пустого варианта шлюза
    issue: kacho#246
