version: v2
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: ../pkg/api
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc]
    out: ../pkg/api
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
  - local: [go, run, github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway]
    out: ../pkg/api
    opt:
      - paths=source_relative
      - generate_unbound_methods=true
# Контракты КЛАССА ФУНДАМЕНТА здесь НЕ порождаются, и это не сужение охвата, а
# единственность регистрации. Их заглушки живут в общей библиотеке
# (`github.com/PRO-Robotech/corelib/api/...`), которую платформа импортирует как
# зависимость. Породи их ещё раз сюда — и двоичное слинкует ДВА пакета, каждый из
# которых регистрирует ОДНО И ТО ЖЕ имя файла контракта; отказ приходит не сборкой,
# а паникой при инициализации, и приходит ТРАНЗИТИВНО — у потребителя, который ни
# одного из двух путей не называл.
#
# Исключение не отменяет разбора: перечисленные каталоги остаются входом модуля,
# поэтому контракты платформы, которые их ИМПОРТИРУЮТ, компилируются как прежде, а
# порождённый код называет их по объявленному `go_package` — то есть путём общей
# библиотеки. Сверка держится `generate-diff` в `scripts/ci-local.sh`.
#
# Перечень выведен из карты классов (`internal/repohygiene/foundationboundary.go`),
# а не выписан по памяти: класс каталога объявляется там, и второе место об одном
# предмете разошлось бы молча — на каталоге, заведённом после.
# Корня `kaname` здесь БОЛЬШЕ НЕТ, и это не сужение охвата, а тот же довод
# единственности регистрации, что у фундамента: контракты службы доступа уехали
# в её репозиторий (решение владельца 2026-09-13, kacho#2616, исход C), их
# заглушки публикует модуль `github.com/PRO-Robotech/kaname`. Породи их ещё раз
# сюда — и повторится ровно тот отказ, о котором абзац выше.
#
# Дерево контрактов службы платформе по-прежнему НУЖНО — генераторам края, — но
# приезжает оно модулем, а не лежит здесь: сборку входа держит
# `kacho_assemble_contract_root` (gateway/scripts/lib/stage-proto-tree.sh).
inputs:
  - directory: .
    paths:
      - kacho
    exclude_paths:
      - kacho/cloud/operation
      - kacho/cloud/subscription
