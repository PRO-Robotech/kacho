syntax = "proto3";

package corelib.operation;

import "google/api/annotations.proto";
import "corelib/operation/operation.proto";
import "corelib/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/corelib/api/corelib/operation;operationv1";

// A set of methods for managing operations for asynchronous API requests.
service OperationService {
  // Returns the specified Operation resource.
  rpc Get (GetOperationRequest) returns (Operation) {
    option (google.api.http) = { get: "/operations/{operation_id}" };
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "HANDLER_DECIDES";
  }

  // Cancels the specified operation.
  //
  // Cancellation is owner-only and atomic: a caller may cancel only an operation
  // it started. An operation that has already reached a terminal state is
  // refused with FAILED_PRECONDITION; an operation that does not exist, and one
  // that belongs to another caller, are refused identically with NOT_FOUND.
  rpc Cancel (CancelOperationRequest) returns (Operation) {
    option (google.api.http) = { post: "/operations/{operation_id}:cancel" body: "*" };
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "HANDLER_DECIDES";
  }
}

message GetOperationRequest {
  // ID of the Operation resource to return.
  string operation_id = 1;
}

message CancelOperationRequest {
  // ID of the operation to cancel.
  string operation_id = 1;
}
