# Второй выход генерации — типы для Terraform-провайдера.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ БЛОК В buf.gen.yaml. `managed` — ключ УРОВНЯ ФАЙЛА: он
# действует на все перечисленные в нём плагины. Положи переопределение префикса в общий
# шаблон — и три существующих плагина начнут писать `pkg/api` с чужим путём импорта.
# Отдельный файл снимает этот вопрос по построению: общий шаблон не меняется вовсе.
#
# ЗАЧЕМ ПЕРЕОПРЕДЕЛЕНИЕ ПРЕФИКСА. `go_package` в самих .proto указывает в модуль
# продукта. Без переопределения порождённый здесь код импортировал бы `pkg/api`, модуль
# провайдера получил бы `require` на продукт, а следом единственным выходом стал бы
# `replace`, который топология запрещает. Гейт `TestProviderModuleIsIsolated` проверяет
# оба конца этой цепочки: и результат (`require`), и причину (импорт в порождённом).
#
# ЗАЧЕМ `disable` ДЛЯ google. Измерено, а не предположено: без него managed переписывает
# и сторонние дескрипторы, и выход начинает импортировать
# `…/terraform/internal/api/google/api`, которого не существует. С `disable` аннотации
# остаются на `google.golang.org/genproto/...`, а в выход попадает только своё дерево.
#
# ЗАЧЕМ ТОЛЬКО protoc-gen-go. Провайдер говорит с краем по HTTP и сериализует тела
# `protojson`, поэтому ему нужны message-типы — и больше ничего. gRPC- и gateway-стабы
# были бы мёртвым кодом: без импортёров, зато в графе сборки и в поверхности анализа.
version: v2
managed:
  enabled: true
  disable:
    - path: google
  override:
    - file_option: go_package_prefix
      value: github.com/PRO-Robotech/kacho/terraform/internal/api
plugins:
  - local: protoc-gen-go
    out: ../terraform/internal/api
    opt: paths=source_relative
# Только то, что нужно ресурсам под-фазы TF-1, плюс их транзитивные зависимости.
# Домены, которых здесь нет (compute, nlb, registry, storage, geo, iam), приедут вместе
# со своими ресурсами: выход, порождённый «на будущее», — это мёртвый код, который
# выглядит рабочим.
inputs:
  - directory: .
    paths:
      - kacho/cloud/vpc/v1
      - kacho/cloud/operation
      - kacho/cloud/api
      - kacho/cloud/reference
      - kacho/cloud/validation.proto
      - kacho/iam/authz/v1
