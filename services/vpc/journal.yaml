# Объявление журнала модуля — вход notifygen init -journal (corelib
# cmd/notifygen, NTF-3 З10): из него генератор выводит тело функции базы
# resource-event на таблице журнала. Значения — те же, что объявляет журнал на
# Go (internal/subscriptionjournal, Journal при включённом флаге ленты):
# расхождение держит проба TestJournalDeclaration_AgreesWithTheJournal пакета
# subscriptionjournal. Правка объявления — затем notifygen init -journal:
# действующее тело функции, отставшее от объявления, notifygen -check судит
# красным.

module: vpc
table: kacho_vpc.vpc_outbox
columns:
  kind: resource_kind
  id: resource_id
  change: event_type
  payload: payload
  project: project_id
  initiator: initiator
  occurred_at: created_at
kinds:
  Network: {name_form: dns, scope: project}
  Subnet: {name_form: dns, scope: project}
  SecurityGroup: {name_form: dns, scope: project}
  RouteTable: {name_form: dns, scope: project}
  Address: {name_form: dns, scope: project}
  Gateway: {name_form: dns, scope: project}
  NetworkInterface: {name_form: dns, scope: project}
  CidrGroup: {name_form: dns, scope: project}
  AddressPool: {name_form: dns, scope: cluster}
  notification: {name_form: none, scope: cluster}
changes:
  CREATED: CREATED
  UPDATED: UPDATED
  DELETED: DELETED
