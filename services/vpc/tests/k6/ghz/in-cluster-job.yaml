# In-cluster ghz Job — бьет прямо в vpc.kacho.svc:9090, минуя api-gateway
# И port-forward (port-forward падает под нагрузкой concurrency >300).
#
# Build образа: docker build -t ghz-local:dev <dir с ghz binary> ; kind load docker-image ghz-local:dev --name kacho
#
# Применение: kubectl apply -f in-cluster-job.yaml ; kubectl -n kacho wait --for=condition=complete job/ghz-create-burst --timeout=300s
# Результаты: kubectl -n kacho logs -l job-name=ghz-create-burst
apiVersion: batch/v1
kind: Job
metadata:
  name: ghz-create-burst
  namespace: kacho
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # Хардening пода (trivy KSV-0118): непривилегированный запуск + seccomp.
      # uid 65532 — тот же, под которым работает апстримный образ ghz
      # (`ghcr.io/bojand/ghz`, Config.User=65532); локальная сборка `ghz-local:dev`
      # (см. заголовок файла) обязана оставить бинарь исполняемым для этого uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ghz
        image: ghz-local:dev
        imagePullPolicy: Never
        # Хардening контейнера (trivy KSV-0014/KSV-0118): корень только на чтение,
        # без повышения привилегий, все capabilities сняты. Тома под запись НЕ
        # нужны: без `-O/-o` ghz пишет отчёт только в stdout. Проверено прогоном,
        # а не выведено из чтения: ghz под `--read-only` и uid 65532 отработал
        # 200 gRPC-вызовов через reflection и вышел кодом 0.
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        args:
          - "--insecure"
          - "--call"
          - "kacho.cloud.vpc.v1.NetworkService.Create"
          - "--total"
          - "600000"
          - "--concurrency"
          - "600"
          - "--connections"
          - "40"
          - "--metadata"
          - '{"x-kacho-actor":"ghz-loadtest","x-kacho-project-id":"<PROJECT_ID>"}'
          - "--data"
          - '{"project_id":"<PROJECT_ID>","name":"ghz-{{.RequestNumber}}-{{.TimestampUnixNano}}"}'
          - "vpc.kacho.svc.cluster.local:9090"
