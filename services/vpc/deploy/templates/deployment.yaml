apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: kacho
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        # ── ОБЪЯВЛЕНИЕ СБОРА ВЕЛИЧИН ──────────────────────────────────────────
        #
        # Поверхность процесса (`GET /metrics`) поднята и отвечает — и до этой
        # аннотации к ней НИКТО НЕ ПРИХОДИЛ. Поднятая поверхность без того, кто
        # её читает, неотличима от отсутствующей: это та же форма без содержания,
        # только этажом выше.
        #
        # Аннотация пода, а не описатель сбора: описателя обслуживает оператор
        # сбора, а типа его ресурса в этом кластере нет. Аннотацию читают агенты
        # обоих семейств и обращаются к ПОДУ напрямую — поэтому порт в Service и
        # `containerPort` для сбора не нужны и здесь не заводятся.
        #
        # Порт обязан совпадать с адресом, который процесс берёт из своей
        # конфигурации; это сверяет декларативная проверка
        # `TestEveryRenderedChartDeclaresItsScrape`, читающая ОБЪЯВЛЕНИЯ, а не
        # отрендеренный манифест.
        {{- if .Values.metricsScrape.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsScrape.port | quote }}
        prometheus.io/path: /metrics
        {{- else }}
        # Сбор выключен ОБЪЯВЛЕНИЕМ, и причина едет в кластер вместе с подом:
        # оператор, увидевший процесс без объявления сбора, обязан прочитать
        # ПОЧЕМУ, а не гадать, забыли ли. Пустая причина при выключенном сборе —
        # находка декларативной проверки, а не пустая строка.
        kacho.cloud/metrics-scrape-disabled-because: {{ .Values.metricsScrape.disabledBecause | quote }}
        {{- end }}
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ОБРАЗА.
        #
        # Тег локального образа (`kacho-*:dev`) неизменен, поэтому пересборка под
        # тем же тегом НЕ меняет шаблон пода: Kubernetes не видит разницы и под не
        # перекатывается — процесс продолжает работать СТАРЫМ бинарником под новым
        # тегом. Ровно тот же разрыв между намерением и исходом, что и у настроек,
        # приезжающих массовым импортом (инцидент 2026-07-25), и лечится он так же —
        # аннотацией, привязанной к содержимому.
        #
        # Значение — идентификатор содержимого образа; его пишет `make build-services`
        # в helm/umbrella/values.image-ids.yaml сразу после сборки. Профиль, который
        # этот файл не накладывает (offline-рендер, чужой реестр), получает "unset" —
        # и тогда привязки нет, что честно: привязывать не к чему.
        kacho.cloud/image-id: {{ dig "kachoImageIds" "vpc" "unset" (.Values.global | default dict) | quote }}
        # ConfigMap-content hash → pod rolling-restart при изменении config.yaml.
        kacho.cloud/config-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.opa.enabled }}
        # То же самое для OPA-политики. Отдельная аннотация, а не «и так покрыто»:
        # config-checksum выше хэширует ТОЛЬКО configmap.yaml, поэтому правка
        # политики меняла бы vpc-opa-config, НЕ меняла бы pod-template — и
        # sidecar продолжал бы применять политику, загруженную на старте.
        # Ровно класс инцидента kacho-storage (2026-07-25), только на authz-политике.
        kacho.cloud/opa-config-checksum: {{ include (print $.Template.BasePath "/opa-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      # INFRA sec-hardening (2026-07-16) — единый floor, идентичный kaname.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        # Writable scratch для read-only-rootfs контейнеров.
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ .Values.name }}-config
        {{- if .Values.mtls.enable }}
        # mTLS — cert-manager internal-CA secrets (server + client),
        # раздельные volume'ы. cert-manager пишет tls.crt/tls.key/ca.crt.
        - name: mtls-server
          secret:
            secretName: {{ .Values.mtls.serverSecretName | quote }}
        - name: mtls-client
          secret:
            secretName: {{ .Values.mtls.clientSecretName | quote }}
        {{- end }}
        {{- if .Values.opa.enabled }}
        # OPA sidecar для guardrails. Bundle подтягивается с kaname Internal :9091
        # + signed JWS verification.
        - name: opa-config
          configMap:
            name: {{ .Values.name }}-opa-config
        {{- end }}
      initContainers:
        # Миграции БД исполняет отдельный binary `kacho-migrator` (cobra-based CLI),
        # не subcommand основного. Тот же image — оба binary build'ятся в Dockerfile
        # multi-stage. DSN собирается мигратором из KACHO_VPC_DB_* env (через
        # config-fallback в cmd/migrator/main.go) — одно helm-values покрывает оба binary.
        - name: migrate
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/kacho-migrator", "up"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/kacho-vpc
              readOnly: true
          env:
            - name: KACHO_VPC_CONFIG_PATH
              value: /etc/kacho-vpc/config.yaml
            - name: KACHO_VPC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/kacho-vpc", "serve"]
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: grpc-internal
              containerPort: {{ .Values.ports.internalGrpc }}
            # Диагностическая поверхность (/metrics, /healthz, /readyz). Порт
            # объявляется здесь, потому что по нему идут пробы: без записи в
            # `ports:` его нельзя назвать именем, и оператор, ищущий, куда
            # постучаться за причиной неготовности, не находит его в описании
            # пода вовсе.
            - name: metrics
              containerPort: {{ .Values.metricsScrape.port }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/kacho-vpc
              readOnly: true
            {{- if .Values.mtls.enable }}
            - name: mtls-server
              mountPath: {{ printf "%s/server" .Values.mtls.mountPath | quote }}
              readOnly: true
            - name: mtls-client
              mountPath: {{ printf "%s/client" .Values.mtls.mountPath | quote }}
              readOnly: true
            {{- end }}
          env:
            - name: KACHO_VPC_CONFIG_PATH
              value: /etc/kacho-vpc/config.yaml
            - name: KACHO_VPC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
            {{- if .Values.mtls.enable }}
            {{- $srv := printf "%s/server" .Values.mtls.mountPath }}
            {{- $cli := printf "%s/client" .Values.mtls.mountPath }}
            # mTLS server-creds (both listeners) — corelib grpcsrv.TLSServer
            # via config.LoadPrefixed("KACHO_VPC"). RequireAndVerifyClientCert
            # against the internal-CA bundle (ca.crt in the server secret).
            - name: KACHO_VPC_PUBLIC_SERVER_MTLS_ENABLE
              value: "true"
            - name: KACHO_VPC_PUBLIC_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KACHO_VPC_PUBLIC_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KACHO_VPC_PUBLIC_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            - name: KACHO_VPC_INTERNAL_SERVER_MTLS_ENABLE
              value: "true"
            - name: KACHO_VPC_INTERNAL_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KACHO_VPC_INTERNAL_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KACHO_VPC_INTERNAL_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- if .Values.mtls.edges.iamRegister }}
            # vpc→iam (register-drainer) client-creds — grpcclient.TLSClient.
            - name: KACHO_VPC_IAM_REGISTER_MTLS_ENABLE
              value: "true"
            - name: KACHO_VPC_IAM_REGISTER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_VPC_IAM_REGISTER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_VPC_IAM_REGISTER_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_VPC_IAM_REGISTER_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.iamRegister | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.iamProject }}
            # vpc→iam ProjectService.Get (existence/leaf-owner) client-creds —
            # grpcclient.TLSClient. Reuses the SAME already-mounted client secret
            # ($cli = kacho-vpc-client-tls); ServerName = kaname (:9090 dial-host).
            - name: KACHO_VPC_IAM_PROJECT_MTLS_ENABLE
              value: "true"
            - name: KACHO_VPC_IAM_PROJECT_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_VPC_IAM_PROJECT_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_VPC_IAM_PROJECT_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_VPC_IAM_PROJECT_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.iamProject | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.iamAuthz }}
            # vpc→iam InternalIAMService.Check (per-RPC authz gate +
            # project-level list-filter — one conn) client-creds. Reuses the SAME
            # $cli secret; ServerName = kaname-internal (:9091 dial-host).
            - name: KACHO_VPC_IAM_AUTHZ_MTLS_ENABLE
              value: "true"
            - name: KACHO_VPC_IAM_AUTHZ_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_VPC_IAM_AUTHZ_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_VPC_IAM_AUTHZ_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_VPC_IAM_AUTHZ_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.iamAuthz | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.quotaAuthority }}
            # vpc→домен величин: ОБЕ полосы одного ребра (Resolve на пути
            # запроса и ListChangedSince фоновой дельтой) — удостоверение одно.
            - name: KACHO_VPC_QUOTA_AUTHORITY_MTLS_ENABLE
              value: "true"
            - name: KACHO_VPC_QUOTA_AUTHORITY_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_VPC_QUOTA_AUTHORITY_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_VPC_QUOTA_AUTHORITY_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_VPC_QUOTA_AUTHORITY_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.quotaAuthority | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.geo }}
            # vpc→geo (geo.v1.ZoneService.Get) client-creds. Geography —
            # leaf-домен kacho-geo.
            - name: KACHO_VPC_GEO_MTLS_ENABLE
              value: "true"
            - name: KACHO_VPC_GEO_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_VPC_GEO_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_VPC_GEO_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_VPC_GEO_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.geo | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # ГОТОВНОСТЬ СПРАШИВАЕТСЯ ПО ТОМУ, ЧТО СЕРВИС СТРОИТ. `/readyz` собирает
          # чекеры критичных зависимостей — коннект к базе, boot-gate дренера
          # регистраций, канал к iam, живой LRO-worker (buildReadinessCheckers в
          # cmd/vpc/observability.go). Прежде здесь стоял `tcpSocket: grpc`, то есть
          # вопрос «открыт ли порт»; сокет открыт и у процесса, который отвергает
          # каждую мутацию, поэтому под рапортовал Ready при недоступном iam, а
          # kubelet не снимал его из ротации никогда.
          #
          # Живость НЕ включает зависимости намеренно: `/healthz` — чистая живость
          # (agg.LiveHandler), иначе деградация соседа вызывала бы restart-storm.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
        {{- if .Values.opa.enabled }}
        # OPA sidecar.
        #
        # Pull-mode: signed bundle from kaname Internal :9091 endpoint
        # `/v1/bundles/kaname-guardrails`. Decision logs → stdout
        # (`decision_logs.console=true`).
        #
        # Sidecar accessible from kacho-vpc on localhost:{{ .Values.opa.port }} for OPA-based
        # checks beyond FGA (rate-limit guardrails, complex conditions); FGA-filtered
        # List handlers использует kaname AuthorizeService directly, не OPA.
        - name: opa
          image: "{{ .Values.opa.image }}"
          imagePullPolicy: {{ .Values.opa.imagePullPolicy }}
          args:
            - "run"
            - "--server"
            - "--addr=127.0.0.1:{{ .Values.opa.port }}"
            - "--config-file=/etc/opa/config.yaml"
            - "--log-level={{ .Values.opa.logLevel }}"
            - "--log-format=json"
          ports:
            - name: opa-http
              containerPort: {{ .Values.opa.port }}
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: opa-config
              mountPath: /etc/opa
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: opa-http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: opa-http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: {{ .Values.opa.resources.requests.cpu }}
              memory: {{ .Values.opa.resources.requests.memory }}
            limits:
              cpu: {{ .Values.opa.resources.limits.cpu }}
              memory: {{ .Values.opa.resources.limits.memory }}
        {{- end }}
