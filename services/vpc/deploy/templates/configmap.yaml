{{/*
ConfigMap с YAML-конфигом kacho-vpc.

Сервис читает config из /etc/kacho-vpc/config.yaml; конкретные поля можно
override'ить через ENV (`KACHO_VPC_REPOSITORY__POSTGRES__URL` и т.п.).

Содержимое рендерится из values.yaml: смотри ключ `config` или legacy-ключи
`ports.*` / `db.*` / `resourceManagerAddr` (см. deploy/values.yaml).

DB-пароль НЕ кладется сюда (secret); подтягивается через
`repository.postgres.password-from-env: KACHO_VPC_DB_PASSWORD` и Secret-ENV
в deployment.yaml.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: kacho
data:
  config.yaml: |
    logger:
      level: {{ default "INFO" .Values.logger.level | quote }}

    api-server:
      endpoint: {{ printf "tcp://0.0.0.0:%v" .Values.ports.grpc | quote }}
      internal-endpoint: {{ printf "tcp://0.0.0.0:%v" .Values.ports.internalGrpc | quote }}
      graceful-shutdown: {{ default "10s" .Values.apiServer.gracefulShutdown | quote }}
      # request-timeout — server-side deadline на один RPC (bounded-pool exhaustion
      # guard, CWE-770). 0 → без границы (нет long-lived server-streams в kacho-vpc).
      request-timeout: {{ default "30s" .Values.apiServer.requestTimeout | quote }}

    metrics:
      enable: {{ default true .Values.metrics.enable }}
    healthcheck:
      enable: {{ default true .Values.healthcheck.enable }}

    repository:
      type: POSTGRES
      postgres:
        url: {{ printf "postgres://%s@%s:%v/%s" .Values.db.user .Values.db.host .Values.db.port .Values.db.name | quote }}
        max-conns: {{ default 0 .Values.repository.postgres.maxConns }}
        # serving-only DB-тайм-ауты (в миграции не попадают): бесконечно висящий
        # запрос/lock не держит pooled-connection (CWE-770/400). 0 → без лимита.
        statement-timeout: {{ default "30s" .Values.repository.postgres.statementTimeout | quote }}
        lock-timeout: {{ default "15s" .Values.repository.postgres.lockTimeout | quote }}
        # ЯВНО ЗАДАННЫЙ, А НЕ ПОДРАЗУМЕВАЕМЫЙ. Здесь стояло `default "disable"`:
        # профиль, обнуливший ручку, получал открытый канал к базе МОЛЧА — рендер
        # зелёный, в манифесте `disable` неотличим от объявленного. `required`
        # превращает это в отказ с именем настройки, который видит оператор.
        # Умолчание чарта (values.yaml) осталось на месте — снят только невидимый
        # подстановочный путь. Что sslmode обязан быть НЕ открытым на боевом
        # стеке, держит deploy/dbtls_declaration_test.go.
        ssl-mode: {{ required "repository.postgres.sslMode не задан: канал к Postgres обязан быть объявлен явно (disable|require|verify-ca|verify-full); пустое значение молча дало бы открытый текст" .Values.repository.postgres.sslMode | quote }}
        password-from-env: KACHO_VPC_DB_PASSWORD

    authn:
      mode: {{ default "production" .Values.authn.mode | quote }}
      # trusted-forwarder — в production (non-strict) без server-mTLS публичный
      # :9090 listener принимает client-asserted x-kacho-* principal'а только под
      # этим явным подтверждением (оператор гарантирует, что listener стоит за
      # аутентифицирующим forwarder'ом/mesh). false + mode=production + без
      # public-mTLS → отказ старта (fail-closed). production-strict игнорирует флаг.
      trusted-forwarder: {{ default false .Values.authn.trustedForwarder }}

    # per-RPC Check — kacho-iam.InternalIAMService.Check на INTERNAL :9091
    # (authz.iam-endpoint).
    #
    # Фильтр видимости (list-filter) — ОТДЕЛЬНОЕ соединение: он спрашивает
    # AuthorizeService.BatchCheck на PUBLIC :9090 по адресу
    # list-filter.authorize-endpoint (пусто → запасной authz.iam-endpoint), и все
    # ключи ниже сервис читает. Раньше здесь стояло обратное утверждение — что
    # фильтр идёт тем же Check'ом на :9091, а ключи «код больше не читает»; оно
    # было ложным и скрывало, что у этого соединения свой транспорт: боевая
    # посадка без list-filter.authorize-tls.enable (или без общего client-cert'а
    # KACHO_VPC_IAM_AUTHZ_MTLS_ENABLE) НЕ СТАРТУЕТ.
    authz:
      iam-endpoint: {{ default "kacho-iam-internal.kacho.svc.cluster.local:9091" .Values.authz.iamEndpoint | quote }}
      breakglass: {{ default false .Values.authz.breakglass }}
      # Круг отправителей, которым разрешено передавать личность конечного
      # пользователя. Пустой список НЕ запрещает — он не сужает (см. values.yaml);
      # производственная посадка на нём не стартует.
      trusted-forwarder-sans:
        {{- range .Values.authz.trustedForwarderSANs }}
        - {{ . | quote }}
        {{- end }}
      check-timeout: {{ default "2s" .Values.authz.checkTimeout | quote }}
      cache-ttl: {{ default "5s" .Values.authz.cacheTtl | quote }}
      deny-rate-limit-per-sec: {{ default 100 .Values.authz.denyRateLimitPerSec }}
      list-filter:
        # Значение рендерится НАПРЯМУЮ, без `default false`. Прежняя запись
        # объявляла небезопасное умолчание второй раз: удали ключ из values.yaml —
        # и рендер всё равно дал бы выключенный фильтр, поэтому правка одного
        # values.yaml не имела бы силы. Без `default` отсутствующий ключ даёт
        # невалидный конфиг и падение на разборе, а не тихое сужение-которого-нет.
        # Так же рендерят соседи по классу (nlb, storage).
        enabled: {{ .Values.authz.listFilter.enabled }}
        authorize-endpoint: {{ default "" .Values.authz.listFilter.authorizeEndpoint | quote }}
        authorize-tls:
          enable: {{ default false .Values.authz.listFilter.authorizeTls.enable }}
        timeout-ms: {{ default 1000 .Values.authz.listFilter.timeoutMs }}
        cache-ttl: {{ default "5s" .Values.authz.listFilter.cacheTtl | quote }}
        max-entries: {{ default 10000 .Values.authz.listFilter.maxEntries }}
        fail-open: {{ default false .Values.authz.listFilter.failOpen }}

    # iam — путь доставки намерения о владении ресурсом.
    #
    # require — fail-closed загрузочный гейт (pkg/outbox/bootgate): мутирующий
    # Create отвергается, а под остаётся NotReady, пока register-drainer не
    # подключён к kacho-iam. Смысл ровно в том, чтобы ресурс не создавался,
    # пока намерение о владении им некуда доставить: созданный в это окно
    # ресурс останется без владельца, и его создатель получит отказ на своём же
    # ресурсе.
    #
    # Значение рендерится НАПРЯМУЮ, без `default`: умолчание, вписанное здесь
    # вторым местом, пережило бы удаление ключа из values.yaml и молча вернуло
    # бы выключенный гейт — правка одного values.yaml не имела бы силы. Так же
    # и по той же причине рендерится соседний фильтр видимости.
    iam:
      require: {{ .Values.iam.require }}

    extapi:
      def-dial-duration: 10s
      iam:
        endpoint: {{ default "kacho-iam.kacho.svc.cluster.local:9090" .Values.iamAddr | quote }}
        tls:
          enable: {{ default false .Values.extapi.iam.tls.enable }}
        dns-lb: {{ default false .Values.extapi.iam.dnsLb }}
      geo:
        endpoint: {{ default "kacho-geo.kacho.svc.cluster.local:9090" .Values.extapi.geo.endpoint | quote }}
        tls:
          enable: {{ default false .Values.extapi.geo.tls.enable }}

    network:
      default-sg-inline: {{ default true .Values.network.defaultSgInline }}
      project-cache:
        positive-ttl: {{ default "30s" .Values.network.projectCache.positiveTtl | quote }}
        negative-ttl: {{ default "5s" .Values.network.projectCache.negativeTtl | quote }}
        max-size: {{ default 10000 .Values.network.projectCache.maxSize }}
