{{/*
ConfigMap с YAML-конфигом kacho-vpc.

Сервис читает config из /etc/kacho-vpc/config.yaml; конкретные поля можно
override'ить через ENV (`KACHO_VPC_REPOSITORY__POSTGRES__URL` и т.п.).

Содержимое рендерится из values.yaml: смотри ключ `config` или legacy-ключи
`ports.*` / `db.*` / `resourceManagerAddr` (см. deploy/values.yaml).

DB-пароль НЕ кладется сюда (secret); подтягивается через
`repository.postgres.password-from-env: KACHO_VPC_DB_PASSWORD` и Secret-ENV
в deployment.yaml.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: kacho
data:
  config.yaml: |
    logger:
      level: {{ default "INFO" .Values.logger.level | quote }}

    api-server:
      endpoint: {{ printf "tcp://0.0.0.0:%v" .Values.ports.grpc | quote }}
      internal-endpoint: {{ printf "tcp://0.0.0.0:%v" .Values.ports.internalGrpc | quote }}
      graceful-shutdown: {{ default "10s" .Values.apiServer.gracefulShutdown | quote }}
      # Потолок ОДНОВРЕМЕННЫХ потоков подписки. Рендерится НАПРЯМУЮ, без
      # умолчания в шаблоне: второе умолчание пережило бы снятие ключа из
      # values.yaml, правка одного объявления не имела бы силы, а величина молча
      # стала бы нулём — на нём страж старта отказывает, называя ручку.
      subscription-max-streams: {{ .Values.subscription.maxStreams }}
      # request-timeout — server-side deadline на один RPC (bounded-pool exhaustion
      # guard, CWE-770). 0 → без границы (нет long-lived server-streams в kacho-vpc).
      request-timeout: {{ default "30s" .Values.apiServer.requestTimeout | quote }}
      # rate-limit — темп и одновременность запросов НА ВЫЗЫВАЮЩЕГО, по одному
      # набору на листенер. Срок обработки выше ограничивает ОДИН запрос; здесь
      # ограничивается их ПОТОК, и это разные защиты.
      #
      # Значения рендерятся НАПРЯМУЮ, без `default` — по той же причине, что у
      # профиля исполнителя и перечня служебных диапазонов ниже: умолчание,
      # вписанное здесь вторым местом, пережило бы удаление ключа из values.yaml,
      # правка одного values.yaml не имела бы силы, и величина молча стала бы
      # нулём. Ноль означает «не ограничиваем», а не «ограничивать нечего», и
      # боевая посадка на нём НЕ СТАРТУЕТ (config.ValidateRequestRateLimits
      # называет ручку в отказе).
      rate-limit:
        public:
          read-per-sec: {{ .Values.apiServer.rateLimit.public.readPerSec }}
          mutation-per-sec: {{ .Values.apiServer.rateLimit.public.mutationPerSec }}
          burst-factor: {{ .Values.apiServer.rateLimit.public.burstFactor }}
          in-flight: {{ .Values.apiServer.rateLimit.public.inFlight }}
        internal:
          read-per-sec: {{ .Values.apiServer.rateLimit.internal.readPerSec }}
          mutation-per-sec: {{ .Values.apiServer.rateLimit.internal.mutationPerSec }}
          burst-factor: {{ .Values.apiServer.rateLimit.internal.burstFactor }}
          in-flight: {{ .Values.apiServer.rateLimit.internal.inFlight }}

    metrics:
      enable: {{ default true .Values.metrics.enable }}
    healthcheck:
      enable: {{ default true .Values.healthcheck.enable }}

    repository:
      type: POSTGRES
      postgres:
        url: {{ printf "postgres://%s@%s:%v/%s" .Values.db.user .Values.db.host .Values.db.port .Values.db.name | quote }}
        max-conns: {{ default 0 .Values.repository.postgres.maxConns }}
        # serving-only DB-тайм-ауты (в миграции не попадают): бесконечно висящий
        # запрос/lock не держит pooled-connection (CWE-770/400). 0 → без лимита.
        statement-timeout: {{ default "30s" .Values.repository.postgres.statementTimeout | quote }}
        lock-timeout: {{ default "15s" .Values.repository.postgres.lockTimeout | quote }}
        # ЯВНО ЗАДАННЫЙ, А НЕ ПОДРАЗУМЕВАЕМЫЙ. Здесь стояло `default "disable"`:
        # профиль, обнуливший ручку, получал открытый канал к базе МОЛЧА — рендер
        # зелёный, в манифесте `disable` неотличим от объявленного. `required`
        # превращает это в отказ с именем настройки, который видит оператор.
        # Умолчание чарта (values.yaml) осталось на месте — снят только невидимый
        # подстановочный путь. Что sslmode обязан быть НЕ открытым на боевом
        # стеке, держит deploy/dbtls_declaration_test.go.
        ssl-mode: {{ required "repository.postgres.sslMode не задан: канал к Postgres обязан быть объявлен явно (disable|require|verify-ca|verify-full); пустое значение молча дало бы открытый текст" .Values.repository.postgres.sslMode | quote }}
        password-from-env: KACHO_VPC_DB_PASSWORD

    authn:
      mode: {{ default "production" (include "kacho-vpc.authMode" .) | quote }}
      # trusted-forwarder — в production (non-strict) без server-mTLS публичный
      # :9090 listener принимает client-asserted x-kacho-* principal'а только под
      # этим явным подтверждением (оператор гарантирует, что listener стоит за
      # аутентифицирующим forwarder'ом/mesh). false + mode=production + без
      # public-mTLS → отказ старта (fail-closed). production-strict игнорирует флаг.
      trusted-forwarder: {{ default false .Values.authn.trustedForwarder }}

    # per-RPC Check — kaname.InternalIAMService.Check по authz.iam-endpoint.
    #
    # Фильтр видимости (list-filter) — ОТДЕЛЬНОЕ соединение и ДРУГОЙ глагол
    # (AuthorizeService.BatchCheck), со своим адресом и своим транспортом; все ключи
    # ниже сервис читает. Какой это адрес и почему слушатель здесь не называется —
    # сказано один раз в values.yaml, в шапке раздела authz.
    #
    # Здесь стояло «на PUBLIC :9090». Утверждение верно лишь там, где профиль задал
    # authorize-endpoint явно: при пустом значении адрес наследуется от
    # authz.iam-endpoint, чьё умолчание ниже — внутренний kaname-internal:9091.
    # Снято как второе место об одном предмете.
    #
    # Что остаётся верным независимо от адреса: боевая посадка без
    # list-filter.authorize-tls.enable (или без общего client-cert'а
    # KACHO_VPC_IAM_AUTHZ_MTLS_ENABLE) НЕ СТАРТУЕТ.
    # Объявление домена величин: одно на обе полосы ребра. Пустое значение
    # отвергает страж старта — умолчания у него нет by construction.
    quota:
      authority: {{ required "quota.authority is required: address host:port or the word not-deployed" .Values.quota.authority | quote }}
    authz:
      iam-endpoint: {{ default "kaname-internal.kacho.svc:9091" .Values.authz.iamEndpoint | quote }}
      # Круг отправителей, которым разрешено передавать личность конечного
      # пользователя. Пустой список НЕ запрещает — он не сужает (см. values.yaml);
      # производственная посадка на нём не стартует.
      trusted-forwarder-sans:
        {{- range .Values.authz.trustedForwarderSANs }}
        - {{ . | quote }}
        {{- end }}
      # Домен доверия установки: то, чьи сертификаты процесс признаёт своими.
      # Круг выше называет, КОМУ позволено говорить за пользователя; домен
      # отвечает на предыдущий вопрос — чьи предъявители вообще наши. Берётся из
      # ТОГО ЖЕ объявления, под которым чеканится собственный сертификат
      # (certificate.yaml): взятые по отдельности, стороны расходятся молча.
      trust-domain: {{ include "vpc.trustDomain" . | quote }}
      check-timeout: {{ default "2s" .Values.authz.checkTimeout | quote }}
      cache-ttl: {{ default "5s" .Values.authz.cacheTtl | quote }}
      deny-rate-limit-per-sec: {{ default 100 .Values.authz.denyRateLimitPerSec }}
      list-filter:
        # Значение рендерится НАПРЯМУЮ, без `default false`. Прежняя запись
        # объявляла небезопасное умолчание второй раз: удали ключ из values.yaml —
        # и рендер всё равно дал бы выключенный фильтр, поэтому правка одного
        # values.yaml не имела бы силы. Без `default` отсутствующий ключ даёт
        # невалидный конфиг и падение на разборе, а не тихое сужение-которого-нет.
        # Так же рендерят соседи по классу (nlb, storage).
        enabled: {{ .Values.authz.listFilter.enabled }}
        authorize-endpoint: {{ default "" .Values.authz.listFilter.authorizeEndpoint | quote }}
        authorize-tls:
          enable: {{ default false .Values.authz.listFilter.authorizeTls.enable }}
        timeout-ms: {{ default 1000 .Values.authz.listFilter.timeoutMs }}
        cache-ttl: {{ default "5s" .Values.authz.listFilter.cacheTtl | quote }}
        max-entries: {{ default 10000 .Values.authz.listFilter.maxEntries }}
        fail-open: {{ default false .Values.authz.listFilter.failOpen }}

    # iam — путь доставки намерения о владении ресурсом.
    #
    # require — fail-closed загрузочный гейт (pkg/outbox/bootgate): мутирующий
    # Create отвергается, а под остаётся NotReady, пока register-drainer не
    # подключён к kaname. Смысл ровно в том, чтобы ресурс не создавался,
    # пока намерение о владении им некуда доставить: созданный в это окно
    # ресурс останется без владельца, и его создатель получит отказ на своём же
    # ресурсе.
    #
    # Значение рендерится НАПРЯМУЮ, без `default`: умолчание, вписанное здесь
    # вторым местом, пережило бы удаление ключа из values.yaml и молча вернуло
    # бы выключенный гейт — правка одного values.yaml не имела бы силы. Так же
    # и по той же причине рендерится соседний фильтр видимости.
    iam:
      require: {{ .Values.iam.require }}

    extapi:
      def-dial-duration: 10s
      iam:
        endpoint: {{ default "kaname.kacho.svc:9090" .Values.iamAddr | quote }}
        tls:
          enable: {{ default false .Values.extapi.iam.tls.enable }}
        dns-lb: {{ default false .Values.extapi.iam.dnsLb }}
      geo:
        endpoint: {{ default "kacho-geo.kacho.svc:9090" .Values.extapi.geo.endpoint | quote }}
        tls:
          enable: {{ default false .Values.extapi.geo.tls.enable }}

    network:
      project-cache:
        positive-ttl: {{ default "30s" .Values.network.projectCache.positiveTtl | quote }}
        negative-ttl: {{ default "5s" .Values.network.projectCache.negativeTtl | quote }}
        max-size: {{ default 10000 .Values.network.projectCache.maxSize }}

    # dataplane.executor — что посадка ЗАЯВЛЯЕТ об исполнителе, которому контур
    # отдаёт принятое от арендатора (диапазоны, правила, ограничение полосы).
    # Возможностей исполнителя контур не знает — их объявляет профиль; необъявленный
    # исполнитель не считается способным, и боевая посадка на пустом профиле НЕ
    # СТАРТУЕТ (config.ValidateExecutorProfile называет ручку в отказе).
    #
    # Значения рендерятся НАПРЯМУЮ, без `default`. Умолчание, вписанное здесь вторым
    # местом, пережило бы удаление ключа из values.yaml: правка одного values.yaml не
    # имела бы силы, а несущий признак молча стал бы «не объявлен». Так же и по той же
    # причине рендерятся фильтр видимости и загрузочный гейт выше.
    # dataplane.reserved-prefixes — адресные диапазоны, которые платформа держит ЗА
    # СОБОЙ (служебные адреса узлов, адреса служб внутри подсети, точка получения
    # метаданных экземпляра). Подсеть арендатора поверх такого диапазона
    # принимается контуром и не работает, а симптом выглядит сетевым.
    #
    # Значения рендерятся НАПРЯМУЮ, без `default`: умолчание, вписанное здесь
    # вторым местом, пережило бы удаление ключа из values.yaml — правка одного
    # values.yaml не имела бы силы, и перечень молча стал бы пустым. Пустой
    # перечень означает «не сужаем», а не «нечего сужать», и боевая посадка на нём
    # НЕ СТАРТУЕТ (config.ValidateReservedPrefixes называет ручку в отказе).
    dataplane:
      reserved-prefixes:
        {{- range .Values.dataplane.reservedPrefixes }}
        - {{ . | quote }}
        {{- end }}
      executor:
        overlapping-tenant-addresses: {{ .Values.dataplane.executor.overlappingTenantAddresses }}
        state-tracking-families:
          {{- range .Values.dataplane.executor.stateTrackingFamilies }}
          - {{ . | quote }}
          {{- end }}
        named-set-reference-in-rule: {{ .Values.dataplane.executor.namedSetReferenceInRule }}
        guaranteed-payload-bytes: {{ .Values.dataplane.executor.guaranteedPayloadBytes }}
        guaranteed-bandwidth-per-interface-mbps: {{ .Values.dataplane.executor.guaranteedBandwidthPerInterfaceMbps }}
        connection-limit-per-interface: {{ .Values.dataplane.executor.connectionLimitPerInterface }}
        connection-rate-limit-per-interface-per-second: {{ .Values.dataplane.executor.connectionRateLimitPerInterfacePerSecond }}
        connection-rate-burst-per-interface: {{ .Values.dataplane.executor.connectionRateBurstPerInterface }}
        tenant-settable-bandwidth-limit: {{ .Values.dataplane.executor.tenantSettableBandwidthLimit }}
