name: vpc
replicas: 1
image: kacho-vpc:dev
imagePullPolicy: IfNotPresent
ports:
  grpc: 9090
  internalGrpc: 9091
db:
  host: kacho-umbrella-pg-vpc
  port: "5432"
  user: vpc
  name: kacho_vpc
  passwordSecretName: kacho-umbrella-pg-vpc
  passwordSecretKey: password
iamAddr: "kacho-iam.kacho.svc:9090"

# ─── Config sections (viper YAML config) ──────────────────────────────
# Все ключи ниже рендерятся в /etc/kacho-vpc/config.yaml через
# deploy/templates/configmap.yaml. Любой ключ можно override через
# ENV KACHO_VPC_<SECTION>__<KEY>=... (см. internal/apps/kacho/config).
logger:
  level: INFO
apiServer:
  gracefulShutdown: 10s
  # server-side deadline на один RPC (bounded-pool exhaustion guard, CWE-770).
  # 0 → без границы. В kacho-vpc нет long-lived server-streams, поэтому безопасно.
  requestTimeout: 30s
  # ─── Темп и одновременность запросов НА ВЫЗЫВАЮЩЕГО ───────────────────
  # Срок обработки выше ограничивает ОДИН запрос; здесь ограничивается их ПОТОК,
  # и это разные защиты: тысяча запросов, каждый из которых уложился в срок,
  # занимает базу целиком. Стоимость запроса высокая по построению — три строки
  # в базе на каждую мутацию (ресурс, очередь намерения, операция) и до 1000
  # объектов на страницу с проверкой прав партиями на каждое чтение, — поэтому
  # неограниченный темп бьёт не в сеть, а в БАЗУ.
  #
  # Умолчание загрузчика по каждой оси — НОЛЬ, то есть «не объявлено» (см.
  # defaults.go), и полярность выбрана осознанно: ноль означает «не
  # ограничиваем», а не «ограничивать нечего». Боевая посадка (а `authn.mode`
  # здесь `production`) с необъявленными величинами НЕ СТАРТУЕТ:
  # config.ValidateRequestRateLimits отказывает и называет ручку.
  #
  # ЧИСЛА ПУБЛИЧНОГО ЛИСТЕНЕРА — ОПУБЛИКОВАННЫЙ ПОЛ ПРОДУКТА, А НЕ ПОТОЛОК.
  # Ведро живёт В ПРОЦЕССЕ, без внешнего хранилища, поэтому при N репликах
  # эффективный предел равен N × объявленного: «не менее 100/с» остаётся правдой
  # при любом N, а «не более 100/с» стало бы ложью при первой же второй реплике.
  # Размен назван, а не спрятан: точное деление требовало бы общего счётчика, то
  # есть внешней зависимости НА ПУТИ КАЖДОГО ЗАПРОСА, — с ней ограничитель сам
  # становится причиной отказа.
  rateLimit:
    # Публичный листенер: ключ — личность конечного пользователя (арендатор).
    public:
      # Чтение стоит до полной страницы объектов с проверкой прав партиями.
      readPerSec: 100
      # Мутация стоит три строки в базе, поэтому её темп ниже.
      mutationPerSec: 20
      # Кратность всплеска. Меньше единицы — самопротиворечие, страж отвергает.
      burstFactor: 5
      # Одновременных запросов на арендатора. ОТДЕЛЬНАЯ ось от темпа, и сводить
      # их в одну нельзя: она ограничивает стоимость одного мгновения независимо
      # от `page_size`, чего темп сам по себе не делает.
      inFlight: 16
    # Внутренний листенер: ключ — личность СЕРТИФИКАТА вызывающего модуля, а не
    # арендатора (запрос модуля несёт личности разных арендаторов, и ключ по
    # арендатору дробил бы бюджет соседа на тысячу вёдер).
    #
    # Величины заведомо выше публичных, и это решение, а не щедрость:
    # ограничитель, задушивший наш собственный поток намерения, воспроизводит
    # заклинивание головы очереди — класс, при котором работа перестаёт доезжать
    # БЕЗ ЕДИНОГО ВИДИМОГО СИМПТОМА, потому что «работает» и «не доехало»
    # выглядят одинаково.
    internal:
      readPerSec: 1000
      mutationPerSec: 500
      burstFactor: 5
      inFlight: 256
metrics:
  enable: true
healthcheck:
  enable: true
repository:
  postgres:
    # ШИРИНА ПУЛА НА ОДНУ РЕПЛИКУ. Выбрана вместе с `autoscaling.maxReplicas`
    # ниже, и порознь эти два числа смысла не имеют: базе достаётся их
    # ПРОИЗВЕДЕНИЕ (40 × 5 = 200 при `max_connections = 210` минус 3 слота
    # суперпользователя = 207 отдаваемых). Держит это
    # deploy/pool_fits_database_test.go — он читает объявления обоих файлов и
    # роняет прогон, когда произведение перестаёт помещаться.
    #
    # ЗДЕСЬ СТОЯЛО 200, И ЭТО БЫЛО НАСЛЕДИЕМ ПОСАДКИ, КОТОРОЙ БОЛЬШЕ НЕТ (#709).
    # Число пришло с замера 2026-05-14 (services/vpc/tests/k6/results/BASELINE.md):
    # 15 подов службы против базы, объявлявшей `max_connections = 2000`. Позже
    # предел базы привели в область возможного по памяти — 210 на боевых стеках,
    # 300 на стенде разработки, — а ширину пула не тронул никто. Получилось
    # обещание в 2000 соединений (200 × 10) базе, принимающей 207: порог
    # переходился уже на ВТОРОМ поде, а первый мог занять собой всё.
    #
    # Наступало это ровно под нагрузкой: масштабирование срабатывает по загрузке
    # процессора, то есть тогда, когда соединения уже заняты, — и второй под
    # приходит просить их у базы, у которой не осталось.
    #
    # ПОЧЕМУ 40, А НЕ 20 ПРИ ПРЕЖНЕМ ПОТОЛКЕ В 10 ПОДОВ. Глубина пула — не
    # вкусовая величина, и в этом дереве она измерена ровно один раз (#883,
    # служба прав, прогретое состояние, различие ТОЛЬКО в глубине): 20 на
    # реплику дали p99 139 мс, 40 — 16 мс, в 8.7 раза лучше при нуле отказов.
    # Профиль «почти все запросы мгновенно, единицы очень долго» при свободном
    # процессоре означает ожидание соединения, а не счёт, — поэтому мельчить
    # глубину ради ширины запрещено. Отсюда: глубину держим на измеренной
    # величине, а ширину флота выводим из предела базы.
    #
    # ЧТО ЭТО ЗНАЧИТ ДЛЯ ОДНОГО ПОДА: он получает 40 соединений вместо 200.
    # Отнятого не было — база отдаёт 207 на всех, и 200 у одного пода означали
    # «второму не достанется». Суммарное обещание базе не выросло и не упало:
    # было 200 (один под), стало 200 (пять подов). Ни один профиль базы
    # править не понадобилось, и арифметика памяти в них остаётся верной
    # дословно.
    #
    # Своей глубины для vpc НЕ ИЗМЕРЕНО — сказано прямо, чтобы 40 не читалось
    # как замер. Предикат пересмотра: прогон вида #883 на этой службе (подача,
    # прогретое состояние, различие только в глубине). Он же назовёт, стоит ли
    # поднимать предел самой базы — сегодня память это позволяет
    # (512MB + 210 × 8MB = 2192MiB при пределе 4Gi на боевом профиле).
    maxConns: 40
    # serving-only DB-тайм-ауты (не применяются к миграциям): висящий запрос/lock
    # не держит pooled-connection бесконечно (CWE-770/400). 0 → без лимита.
    statementTimeout: 30s
    lockTimeout: 15s
    sslMode: disable
authn:
  # secure-by-default (core rule #16); dev — явный opt-in dev-профиля.
  # trustedForwarder — только для mode=production БЕЗ public server-mTLS: явное
  # подтверждение оператора, что :9090 стоит за аутентифицирующим forwarder'ом/mesh
  # (client identity терминируется до listener'а). Иначе production-старт без
  # public-mTLS отвергается (fail-closed, CWE-290). production-strict игнорирует.
  trustedForwarder: false
# per-RPC Check — kacho-iam.InternalIAMService.Check по адресу authz.iamEndpoint.
#
# Фильтр видимости (listFilter) идёт ОТДЕЛЬНЫМ соединением и ДРУГИМ глаголом —
# AuthorizeService.BatchCheck. Его адрес задаёт listFilter.authorizeEndpoint, а
# пустое значение означает «взять authz.iamEndpoint». На какой слушатель iam этот
# адрес приходит, решает ПРОФИЛЬ, а не сервис: AuthorizeService зарегистрирована на
# ОБОИХ слушателях iam. Состав слушателей описан в одном месте —
# services/iam/cmd/kacho-iam/grpc_register.go, — и здесь не пересказывается.
#
# Здесь стояло «list-filter тоже идёт через InternalIAMService.Check на INTERNAL
# :9091 — НЕ на public :9090»: неверно названы и глагол, и соединение. Снято потому,
# что этим утверждением обосновывали вывод «публичных служб на внутреннем слушателе
# нет», и вывод был неверен.
#
# listFilter.authorizeEndpoint КОД ЧИТАЕТ. Здесь стояло обратное («наследие старого
# ListObjects-подхода, код их больше не читает»), и это было неверно: его читает
# Config.ListFilterAuthorizeEndpoint() (config.go), а production boot-guard
# ValidateListFilter ОТКАЗЫВАЕТ в старте, когда фильтр включён, а ни
# authorizeEndpoint, ни iamEndpoint не заданы. Пустое значение здесь означает не
# «не используется», а «взять iamEndpoint». Пометка «код не читает» на ручке,
# от которой зависит решение о доступе, — прямое приглашение её удалить.
authz:
  iamEndpoint: ""           # default cluster-internal kacho-iam-internal:9091
  checkTimeout: 2s
  cacheTtl: 5s
  denyRateLimitPerSec: 100
  # Кто вправе ПЕРЕДАВАТЬ личность конечного пользователя (x-kacho-principal-*).
  # Пусто по умолчанию — и это НЕ «никому»: contract corelib сужает круг только на
  # непустом списке, поэтому пусто означает «любой пир с сертификатом внутреннего
  # CA может действовать от имени любого тенанта». Боевая посадка на пустом списке
  # НЕ СТАРТУЕТ (config.Validate), поэтому значение обязан задать профиль стенда.
  # Перечислять надо ВСЕХ фактических отправителей — их у vpc три
  # (api-gateway, compute, nlb); сужение до одного шлюза сломало бы привязку
  # интерфейса и резолв подсети. Канонический список — values.prod.
  trustedForwarderSANs: []
  # FGA-filtered List handlers. Включён ПО УМОЛЧАНИЮ.
  #
  # Здесь стояло `enabled: false` с пояснением «Dev: enabled=false → use-case'ы
  # возвращают unfiltered list». Умолчание выключало сужение страницы, то есть
  # stock-посадка отдавала каждому участнику проекта все его строки, а помеченные
  # ScopeFiltered RPC — вообще без object-scope авторизации. Профили prod и dev
  # значение переопределяли, поэтому дыра открывалась ровно на тех профилях,
  # которые этого не сделали, и таких в umbrella большинство (перепись — в
  # list_filter_default_test.go). Соседи по классу (nlb, storage) объявляют true;
  # vpc был единственным исключением.
  #
  # Умолчание обязано быть безопасным: посадка, которая ручку не тронула, должна
  # получать сужение, а не терять его молча. Страж старта (ValidateListFilter)
  # отказывает в старте при выключенном фильтре на ЛЮБОЙ посадке, включая dev.
  listFilter:
    enabled: true
    # Адрес iam AuthorizeService. Пусто → берётся authz.iamEndpoint, чьё умолчание —
    # внутренний kacho-iam-internal:9091; публичный адрес тоже законен (служба стоит
    # на обоих слушателях, см. шапку раздела).
    # Соединение поднимается ОТДЕЛЬНО от ребра per-RPC Check и требует проверяемого
    # транспорта: боевая посадка без authorizeTls.enable (или без общего с Check
    # client-cert'а KACHO_VPC_IAM_AUTHZ_MTLS_ENABLE) НЕ СТАРТУЕТ.
    authorizeEndpoint: ""
    authorizeTls:
      enable: false
    timeoutMs: 1000          # Per-call FGA timeout (ONE BatchCheck; the whole-filter budget is derived)
    cacheTtl: 5s             # LRU TTL
    maxEntries: 10000        # Cache hard cap (LRU eviction)
    # Мягкий проход. Для ScopeFiltered RPC фильтр — единственная авторизация, и
    # боевая посадка с failOpen: true на таких методах НЕ СТАРТУЕТ.
    failOpen: false
# iam — путь доставки намерения о владении ресурсом (register-drainer → kacho-iam).
iam:
  # require — fail-closed загрузочный гейт. true → мутирующий Create отвергается
  # (UNAVAILABLE), а под остаётся NotReady, пока register-drainer не подключён к
  # kacho-iam: ресурс не создаётся, пока его намерение о владении некуда
  # доставить. Иначе созданный в этом окне ресурс остаётся без владельца, а его
  # создатель получает отказ на собственном ресурсе.
  #
  # Гейт был написан, провязан в цепочку интерсепторов и в пробу готовности — и
  # не исполнялся ни разу, потому что ручку не выставлял ни один профиль. Эта
  # строка и есть его производитель; без неё код гейта — мёртвая ветка.
  #
  # Умолчание true: посадка, которая ручку не тронула, обязана получать защиту,
  # а не терять её молча (тот же довод, что у фильтра видимости выше). Путь
  # доставки поднимается при непустом authz.iamEndpoint — он непуст по
  # умолчанию, поэтому взведённый гейт открывается сразу после старта дренажа.
  require: true
extapi:
  # peer kacho-iam.ProjectService.Get.
  iam:
    tls:
      enable: false
    dnsLb: false
  # zone_id валидируется через kacho-geo (leaf-домен Geography).
  geo:
    # Dial-host = geo k8s Service `kacho-geo` on its public :9090 listener
    # (ZoneService.Get/List); matches geo server-cert SAN (kacho-geo.*).
    endpoint: "kacho-geo.kacho.svc:9090"
    tls:
      enable: false
network:
  projectCache:
    positiveTtl: 30s
    negativeTtl: 5s
    maxSize: 10000

# ─── Профиль возможностей исполнителя датаплейна ───────────────────────
# Управляющий контур принимает от арендатора то, что исполнять будет НЕ он:
# адресные диапазоны, правила со ссылкой на именованный набор, ограничение полосы.
# Возможностей исполнителя контур не знает и вывести не может — их ОБЪЯВЛЯЕТ
# посадка. Пока объявления нет, «принято» и «реализуемо» неотличимы: запрос
# проходит проверку контура и не может быть исполнен.
#
# Умолчание загрузчика по каждому признаку — «НЕ объявлено» (см. defaults.go), и
# полярность выбрана осознанно: незаявленный исполнитель не считается способным.
# Поэтому значения обязан объявить чарт — что и сделано ниже. Боевая посадка (а
# `authn.mode` здесь `production`) с необъявленным профилем НЕ СТАРТУЕТ:
# config.ValidateExecutorProfile отказывает и называет ручку.
#
# ЧИСЛА — ЗАЯВЛЕНИЕ ЭТОГО СТЕНДА, А НЕ КОНСТАНТЫ ПРОДУКТА. Стенд с другим
# исполнителем переопределяет их своим профилем. Страж требует от них
# положительности: ноль — отсутствие гарантии, а не гарантия нуля.
dataplane:
  # ─── Адресные диапазоны, которые платформа держит ЗА СОБОЙ ────────────
  # Часть адресного пространства обслуживает саму платформу: служебные адреса
  # узлов, адреса служб внутри подсети, точка получения метаданных экземпляра.
  # Подсеть арендатора, объявленная поверх такого диапазона, проходит все
  # проверки контура и НЕ РАБОТАЕТ — причём симптом выглядит сетевым, а причина
  # лежит в перекрытии. Поэтому перечень проверяется на пути запроса
  # (Subnet.Create и `:addCidrBlocks` — единственные два места, где диапазон
  # подсети объявляется), и пересечение отвергается синхронно.
  #
  # ЭТО ЗАЯВЛЕНИЕ ПОСАДКИ, А НЕ КОНСТАНТА ПРОДУКТА. Базовый перечень ниже
  # содержит только то, что зарезервировано на ЛЮБОЙ посадке: link-local обоих
  # семейств — там же живёт точка получения метаданных экземпляра, и подсеть
  # поверх неё сломана везде. Стенд, чьи служебные адреса узлов или адреса служб
  # внутри подсети лежат в других диапазонах, ДОБАВЛЯЕТ их своим профилем: их
  # знает посадка, а не продукт.
  #
  # Умолчание загрузчика — ПУСТО (см. defaults.go), и полярность выбрана
  # осознанно: перечень, вшитый в код, описывал бы один стенд и выглядел бы
  # работающей защитой на всех остальных. Пустой перечень означает «не сужаем», а
  # не «нечего сужать», поэтому боевая посадка (а `authn.mode` здесь
  # `production`) с необъявленным перечнем НЕ СТАРТУЕТ:
  # config.ValidateReservedPrefixes отказывает и называет ручку.
  #
  # Записи — CIDR в канонической форме (host-биты нулевые). Негодную запись
  # (опечатка, непустые host-биты, форма IPv4-в-IPv6, всё семейство целиком)
  # страж старта отвергает и НАЗЫВАЕТ: молча отброшенная запись оставила бы
  # диапазон, который оператор считает зарезервированным, а контур — нет.
  reservedPrefixes:
    - 169.254.0.0/16
    - fe80::/10
  executor:
    # Несущий признак: исполнитель изолирует ОДИНАКОВЫЕ адреса разных
    # арендаторов. Диапазоны у vpc уникальны только в пределах сети по построению
    # (`EXCLUDE USING gist (network_id WITH =, …)` в миграциях подсетей и пулов),
    # поэтому два арендатора штатно держат один и тот же диапазон. Исполнитель,
    # который их не различает, сводит трафик вместе — пока изоляция не заявлена,
    # принимать пересекающиеся диапазоны нельзя, и посадка не поднимается.
    overlappingTenantAddresses: true
    # Семейства, для которых исполнитель отслеживает состояние соединения.
    # Пустой список — «НЕИЗВЕСТНО», а не «ничего не отслеживаем»: обратный трафик
    # разрешается состоянием. Одинокая запятая объявлением НЕ является — она
    # нормализуется в ноль семейств, и страж читает то же нормализованное
    # значение, что и остальной процесс.
    stateTrackingFamilies:
      - v4
      - v6
    # Цель правила группы безопасности задаётся ЛИБО диапазонами, ЛИБО
    # идентификатором группы — обе ветви уже приняты контрактом, поэтому
    # исполнитель обязан уметь ссылку на именованный набор.
    namedSetReferenceInRule: true
    # Полезный размер кадра, который исполнитель проносит без фрагментации.
    guaranteedPayloadBytes: 1450
    # Полоса, гарантированная одному интерфейсу, Мбит/с.
    guaranteedBandwidthPerInterfaceMbps: 1000
    # Предел одновременно отслеживаемых соединений на интерфейс.
    connectionLimitPerInterface: 65536
    # Темп установления новых соединений на интерфейс, в секунду, и его
    # кратковременный всплеск.
    #
    # Обе величины ОБЯЗАНЫ быть не ниже опубликованных продуктом потолков (2 000 и
    # 8 000): опубликованное число арендатор читает в документации и планирует по
    # нему нагрузку, а измерить этот стенд ему нечем. Стенд, держащий меньше,
    # ломает его молча и на пороге, которого нет ни в одном документе, — поэтому
    # такую посадку страж старта не поднимает. Держать БОЛЬШЕ законно и не
    # отвергается: опубликованное число не уменьшается никогда, а запас железа
    # обещания не ломает.
    connectionRateLimitPerInterfacePerSecond: 4000
    connectionRateBurstPerInterface: 16000
    # Вправе ли арендатор сам задать ограничение полосы своего интерфейса
    # (`NetworkInterface.bandwidthLimitMbps`). Пока признак не объявлен, непустая
    # величина отвергается краем синхронно и с именем поля — принять её без
    # исполнителя значило бы отдать арендатору успех на настройке, которая не
    # действует.
    #
    # Объявляется вместе с guaranteedBandwidthPerInterfaceMbps, и та обязана быть
    # СТРОГО ВЫШЕ полосы, которую продукт обещает интерфейсу (1000 Мбит/с):
    # ограничение принимается строго выше обещанного пола и не выше гарантии этого
    # стенда, поэтому гарантия на уровне пола оставляет ПУСТОЙ промежуток —
    # умение объявлено, воспользоваться им нельзя ни разу. Обе негодные пары
    # (гарантия не объявлена · промежуток пуст) отвергает страж старта.
    tenantSettableBandwidthLimit: false

# ─── ENV-block ─────────────────────────────────────────────────────────
# `env:` уважается deployment.yaml — сюда можно складывать overrides и
# debug-флаги (например, `KACHO_VPC_AUTH_MODE=production`) без правки configmap.
env: {}

# ─── mTLS — per-edge opt-in (cert-manager internal-CA certs) ───────────
# enable=false (default) → НИ один cert-secret НЕ монтируется и НИ одна
# KACHO_VPC_*_MTLS_* env НЕ выставляется → insecure-поведение dev. umbrella
# прокидывает .mtls.enable + per-edge флаги через global.kacho.mtls.
#
# При enable=true:
#   - монтируются secret'ы cert-manager: server (kacho-vpc-server-tls) +
#     client (kacho-vpc-client-tls) — оба в раздельных volume'ах;
#   - выставляются env по corelib LoadPrefixed (config/mtls.go):
#       server  (оба listener'а): KACHO_VPC_PUBLIC_SERVER_MTLS_* /
#                                 KACHO_VPC_INTERNAL_SERVER_MTLS_*
#       vpc→iam (register-drainer): KACHO_VPC_IAM_REGISTER_MTLS_*  (:9091)
#       vpc→iam (ProjectService.Get): KACHO_VPC_IAM_PROJECT_MTLS_*  (:9090)
#       vpc→iam (Check+list-filter):  KACHO_VPC_IAM_AUTHZ_MTLS_*    (:9091)
#       vpc→geo (zone_id):          KACHO_VPC_GEO_MTLS_*
#   - serverName на dial-стороне = фактический dial-host (SAN из cert-manager
#     server-cert): iam-register/iam-authz=kacho-iam-internal (:9091),
#     iam-project=kacho-iam (:9090), geo=kacho-geo (:9090).
mtls:
  enable: false
  # ─── internal-CA leaf-cert issuance (этот чарт владеет своим Certificate) ─
  # Rendered by templates/certificate.yaml when enable=true; signed by the umbrella
  # `kacho-internal-ca` ClusterIssuer.
  issuer:
    name: kacho-internal-ca
    kind: ClusterIssuer   # ClusterIssuer (cluster-scoped), NOT namespaced Issuer
  serverHosts: ["vpc"]              # server-cert DNS-SAN dial-host (Service = vpc)
  spiffe:
    trustDomain: kacho.cloud
    namespace: kacho
    saName: kacho-vpc              # client-cert URI-SAN identity (= pod SA)
  leafDuration: 2160h
  leafRenewBefore: 720h
  # cert-manager secret-имена (ключ серта = kacho-vpc).
  serverSecretName: kacho-vpc-server-tls
  clientSecretName: kacho-vpc-client-tls
  mountPath: /etc/kacho-vpc/tls   # <mountPath>/server/{tls.crt,tls.key,ca.crt}
                                  # <mountPath>/client/{tls.crt,tls.key,ca.crt}
  # per-edge включение клиентских ребер (server-listener идет вместе с enable).
  edges:
    iamRegister: false   # vpc→iam InternalIAMService.Register (drainer, :9091)
    iamProject: false    # vpc→iam ProjectService.Get (existence/leaf-owner, :9090)
    iamAuthz: false      # vpc→iam InternalIAMService.Check (per-RPC gate + list-filter, :9091)
    geo: false           # vpc→geo geo.v1.ZoneService.Get (zone_id validation)
  # serverName на dial-стороне = реальный dial-host (∈ server-SAN пира).
  # iam server-cert SAN покрывает оба host'а: kacho-iam (:9090) + kacho-iam-internal (:9091).
  serverName:
    iamRegister: kacho-iam-internal.kacho.svc
    iamProject: kacho-iam.kacho.svc           # :9090 public dial-host
    iamAuthz: kacho-iam-internal.kacho.svc    # :9091 internal dial-host
    geo: kacho-geo.kacho.svc                  # vpc→geo dial-host (= Service kacho-geo + cert SAN)

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

# ПОТОЛОК ЧИСЛА ПОДОВ. `replicas` выше — стартовое значение, а НАСТОЯЩИЙ потолок
# здесь: столько подов посадка поднимает САМА, без участия человека, и столько
# пулов приходит к базе (#709).
#
# 5, а не 10: предел базы (`max_connections = 210` на боевых профилях, минус 3
# слота суперпользователя) делится на измеренную глубину пула — 207 ÷ 40 = 5.
# То есть ширину флота задаёт база, а не запас по процессору. Прежние 10 при
# пуле 200 означали обещание в 2000 соединений — вчетверо больше, чем база
# принимает даже теоретически.
#
# Правишь любое из двух чисел — правь второе: их произведение проверяет
# deploy/pool_fits_database_test.go.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# ─── OPA Sidecar ───────────────────────────────────────────────────────
# OPA sidecar для guardrails. Bundle pulled from kacho-iam Internal :9091
# с signed JWS verification.
#
# Decision-logs → stdout (collected by cluster log aggregator).
# Resource limits 256MB / 100m matching kacho-iam baseline.
opa:
  enabled: false                       # production: true
  image: "openpolicyagent/opa:0.62.0"
  imagePullPolicy: IfNotPresent
  port: 8181
  logLevel: info
  bundleSource:
    # kacho-iam Internal :9091 — OpaBundleService.
    url: "http://kacho-iam-internal.kacho.svc:9091"
    headers: {}                        # e.g. {Authorization: "Bearer <sa-token>"}
  bundlePolling:
    minDelaySeconds: 60
    maxDelaySeconds: 120
  bundleSigning:
    keyID: "kacho-iam-bundle-key-v1"
    algorithm: "RS256"
    # publicKey — PEM-encoded RSA public key (provided by kacho-iam admin).
    # В production загружается из Secret + mounted; placeholder здесь —
    # values-prod.yaml override обязателен.
    publicKey: |
      -----BEGIN PUBLIC KEY-----
      MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA<replace-with-real-key>
      -----END PUBLIC KEY-----
    excludeFiles:
      - ".manifest"
  decisionLogs:
    console: true                      # → stdout, scraped by cluster log agg
  statusLogs:
    console: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

# INFRA sec-hardening — единый security-floor, идентичный kacho-iam/geo/nlb/registry.
#
# Заведён 2026-07-16: trivy config-скан впервые покрыл ВЕСЬ репозиторий и нашёл, что
# securityContext есть лишь у половины сервисов. В polyrepo IaC-скан был ТОЛЬКО у
# kacho-iam, а в том репо нет ни одного k8s-манифеста (чарты жили в kacho-deploy) —
# гейт зеленел, не проверяя ничего.
#
# runAsUser 65532 совпадает с `USER 65532` в Dockerfile — образ уже собран под nonroot.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem требует writable-scratch: контейнер монтирует emptyDir на /tmp
# (см. deployment.yaml). Без него сервис падает на первой же записи во временный файл.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# metricsScrape — объявление СБОРА величин диагностической поверхности.
#
# Выключение требует ПРИЧИНЫ: пустая строка при enabled=false — это «забыли», и
# декларативная проверка не отличила бы её от «сбора здесь нет намеренно».
metricsScrape:
  enabled: true
  disabledBecause: ""  # port — тот же адрес, который процесс берёт из своей конфигурации.
  # Отдельного ключа портов у этого чарта нет, поэтому он объявлен здесь; там,
  # где ключ уже есть, аннотация читает ЕГО — два места об одном порте
  # разъехались бы молча.
  port: 9095

# subscription — потолок ОДНОВРЕМЕННЫХ потоков подписки этого процесса.
#
# Величина объявляется здесь потому, что её обязан видеть тот, кто разворачивает:
# каждый поток держит выделенное соединение ВНЕ ПУЛА всё время своей жизни, то
# есть это арифметика соединений базы, а не вкус —
#
#	число реплик × этот потолок + пулы всех реплик ≤ max_connections базы
#
# ЗНАЧЕНИЕ БАЙТ-В-БАЙТ РАВНО вкомпилированному умолчанию: объявление делает
# величину видимой профилю и сверяемой, а не меняет поведение. До него ключ жил
# только в коде, и распоряжаться им профиль не мог.
#
# Асимметрия, задающая выбор: упереться в СВОЙ потолок — чистый отказ ОДНОМУ
# вызывающему (`RESOURCE_EXHAUSTED`, повтор осмыслен); упереться в предел БАЗЫ —
# отказ всему процессу и всем арендаторам сразу, включая тех, кто подписок не
# открывал.
#
# Потолок КРАЯ обязан помещаться сюда: `replicas(края) × maxStreams(края)` не
# больше этой величины, иначе исчерпание наступает у владельца — у всех сразу.
# Сверяет gateway/deploy/subscription_stream_budget_test.go, читая это объявление.
subscription:
  maxStreams: 16

# ── ПОСАДКА БЕЗОПАСНОСТИ ─────────────────────────────────────────────────
#
# ОДИН адрес на весь флот: `authMode` в корне значений сервиса. Ручку звали
# шестью разными адресами и двумя именами, и вопрос «в какой посадке работает
# этот кластер» нельзя было задать одной командой. Прежний адрес (authn.mode)
# снят; профиль, всё ещё задающий его, получает отказ рендера с обоими
# значениями в тексте — молчаливого отката к умолчанию не будет.
authMode: production
