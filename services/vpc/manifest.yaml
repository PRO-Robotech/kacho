# --------------------------------------------------------------------------
#  seed — что заводит УСТАНОВКА модуля (#1891).
#
#  Здесь объявлено то, что у модуля уже лежит в базе, и согласие с ней
#  доказывается ПРОГОНОМ, а не чтением миграций:
#      go test -C services/iam ./internal/moduleseedparity/
#
#  ЧЕГО ЗДЕСЬ НЕТ, и это не недосмотр: `groups`.
#
#  Групп у этого модуля НЕТ вовсе. `module-quota-readers` и
#  `module-relation-writers` заводит платформа, а модуль в них лишь ВСТУПАЕТ —
#  об этом говорит подраздел `joins` ниже.
#
#  ЗДЕСЬ СТОЯЛО «выдачу объявить нечем» — утверждение пережило свой предмет.
#  Оно было верно и называло причину точно: форма требовала `roleId`, а
#  `kacho-vpc` наделён ОТНОШЕНИЕМ `system_viewer`, ключа для которого у
#  формы не было ни одного. Задача #1936 завела ключ `grantedRelation` вместе с
#  правилом о допустимом виде получателя (одного ключа было мало: канон
#  объявляет `cluster.system_viewer` принимающим `user` и `service_account`, и
#  путь «через группу» для него неисполним). Выдача объявлена ниже.
#
#  Гейт паритета судит все четыре подраздела и печатает перепись; строк,
#  выведенных из-под вердикта пометкой «ВНЕ ВЕРДИКТА», у этого модуля больше
#  нет — и это предикат снятия #1936 и вторая половина предиката #1891.
seed:
  serviceAccounts:
    # Личность самого модуля: под ней он ходит к соседям. Назначение взято
    # ДОСЛОВНО у живой строки — применитель кладёт объявленное поверх неё, и
    # расхождение здесь было бы переписыванием того, что уже действует.
    - name: kacho-vpc
      account: kacho-system
      description: "Module SA: kacho-vpc (SEC-C least-priv)"
  accessBindings:
    # Право, которое модуль получает при установке: чтение внутренней
    # поверхности соседей под своей личностью. Выдаётся ОТНОШЕНИЕМ, а не ролью,
    # и это не выбор автора — встроенные права платформы выражены именованными
    # отношениями, а роль раздаёт глаголы своими правилами: подобрать роль под
    # `system_viewer` означало бы завести роль с пустым правилом.
    #
    # Получатель — служебная запись САМОГО модуля, и это ровно исключение B18
    # (`data-integrity.md`): получатель один и меняться не будет, его личность и
    # есть предмет выдачи.
    #
    # Живая строка заведена применённой миграцией
    # `0014_reader_sa_system_viewer.sql`; здесь она ОБЪЯВЛЯЕТСЯ, а не заводится
    # заново.
    - subjects:
        - {type: serviceAccount, name: kacho-vpc}
      grantedRelation: system_viewer
      scopeType: iam.cluster
      scopeId: cluster_root
      target: allInScope

  joins:
    # Вступления в ЧУЖИЕ группы: членство заявляет вступающий, а не
    # перечисляет владелец группы — владелец своих потребителей не знает.
    - serviceAccount: {account: kacho-system, name: kacho-vpc}
      group: {account: kacho-system, name: module-quota-readers}
      why: "читать действующие пределы своего домена перед списанием (#291)"
    - serviceAccount: {account: kacho-system, name: kacho-vpc}
      group: {account: kacho-system, name: module-relation-writers}
      why: "писать кортежи владения через iam, не ходя в хранилище прав напрямую (#914)"
