# ==========================================================================
#  vpc — манифест домена: что модуль объявляет платформе о своих правах.
#
#  Девять адресуемых ресурсов. Десятого — квоты — здесь НЕТ: пообъектной адресации
#  у неё нет вовсе, право на неё проверяется на проекте, и типа объекта в закрытой
#  таблице у неё не заведено. Ресурс без типа объекта записи не имеет by
#  construction: ключ `objectType` обязателен.
#
#  Раздел `resources` порождает блоки типов модели доступов; сверка с каноном
#  `proto/kaname/cloud/iam/v1/fga_model.fga` ПОБАЙТОВАЯ:
#      make -C services/iam model-canon-check
#  Форму документа судит один разбор:
#      make -C services/iam module-manifest-check
#
#  Что ВЫВОДИТСЯ и здесь не пишется: класс канонического действия — из его
#  имени; умолчательный состав субъектов `[user, service_account, group#member]`;
#  цепочка ярусов admin→editor→viewer от супер-доступа; каскад
#  `super_admin from <первый указатель>`; источник действия — супер-доступ.
#  Названо только то, что от умолчания ОТЛИЧАЕТСЯ.
#
#  ЧЕГО ЗДЕСЬ НЕТ, и это сказано, чтобы манифест не читался как полный.
#
#  РАЗДЕЛ `roles` ЗДЕСЬ ЕСТЬ — внизу файла. Он объявляет то, что у модуля уже
#  лежит в базе, и согласие с ней доказывается ПРОГОНОМ, а не чтением:
#      go test -C services/iam ./internal/moduleroleparity/
#
#  Здесь стояло «раздел `roles` этот манифест НЕ объявляет, и это не недосмотр:
#  14 из 18 живых ролей несут назначение короче предела прозы». Утверждение было
#  верно и снято вместе со своим ОСНОВАНИЕМ, а не обойдено: предел выносил
#  приговор по длине имени типа (`Admin RouteTable` 16 знаков проходило,
#  `Edit RouteTable` 15 — нет) и делал 27 живых ролей из 42 невыразимыми ни при
#  каком написании. Величина предела и довод обеими сторонами —
#  `services/iam/internal/manifest/roles.go`, `minRoleDescriptionRunes` (#1904).
#  ВЕДОМОСТЬ ГЕЙТА ПУСТА, и это перемерено, а не унаследовано: живые роли
#  объявили все четыре модуля, у которых они есть, — `compute` (3 из 3),
#  `iam` (19 из 19), `loadbalancer` (2 из 2), `vpc` (18 из 18); всего 42 роли
#  из 48 живых кластерных, остальные шесть модуля-владельца не имеют
#  by construction. У `iam` было своё, ВТОРОЕ основание отсрочки — две роли
#  называли класс без пригодных действий; правила приведены миграцией
#  20260902180800 (#1916).
#
#  Раздел `seed` не объявлен НИ ОДНИМ манифестом дерева: посев модулей пишут
#  применённые миграции, и его согласие с живой базой ещё никем не сверяется.
#  Предмет и предикат снятия — задача продукта #1891.
# ==========================================================================

apiVersion: iam/v1
module: vpc

resources:

  - name: network
    objectType: vpc_network
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete
      - {name: internalGetNetwork, class: get, internal: true}
      - {name: internalSetDefaultSecurityGroupId, class: update, internal: true}

  - name: subnet
    objectType: vpc_subnet
    parents: [project]
    producer: derived
    notes:
      - before: v_get
        text: |
          # ЗДЕСЬ СТОЯЛО `use` — «взять подсеть в работу, не правя её», — И ОНО СНЯТО
          # (#1115) вместе со всем семейством. Причина записана один раз, у
          # `iam_service_account`, где снято третье объявление того же замысла.
    verbs:
      - get
      - list
      - update
      - delete

  - name: address
    objectType: vpc_address
    parents: [project]
    producer: derived
    notes:
      - before: v_get
        text: |
          # ЗДЕСЬ СТОЯЛО `use` — «взять адрес в работу, не правя его», — И ОНО СНЯТО
          # (#1115) вместе со всем семейством. Причина записана один раз, у
          # `iam_service_account`, где снято третье объявление того же замысла.
    verbs:
      - get
      - list
      - update
      - delete
      - {name: internalAllocateExternalIP, class: update, internal: true}
      - {name: internalAllocateExternalIPv6, class: update, internal: true}
      - {name: internalAllocateInternalIP, class: update, internal: true}
      - {name: internalAllocateInternalIPv6, class: update, internal: true}
      - {name: internalClearAddressReference, class: update, internal: true}
      - {name: internalCreateOwnedAddress, class: create, internal: true}
      - {name: internalGetAddressReference, class: get, internal: true}
      - {name: internalMarkAddressEphemeralInUse, class: update, internal: true}
      - {name: internalReleaseOwnedAddress, class: delete, internal: true}
      - {name: internalSetAddressReference, class: update, internal: true}

  - name: securityGroup
    objectType: vpc_security_group
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

  - name: routeTable
    objectType: vpc_route_table
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

  - name: gateway
    objectType: vpc_gateway
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

  - name: networkInterface
    objectType: vpc_network_interface
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete
      - {name: internalAttach, class: update, internal: true}
      - {name: internalDetach, class: update, internal: true}
      - {name: internalListByInstance, class: list, internal: true}

  - name: addressPool
    objectType: vpc_address_pool
    parents: [cluster]
    producer: authored
    subjects: [user, service_account]
    tiers: [admin, viewer]
    cascade:
      - {relation: any_admin, from: cluster}
    notes:
      - before: cluster
        text: |
          # kacho:latent — cluster-anchored admin resource; its RPCs gate on
          # cluster:cluster_root#system_admin directly, so no module registers an
          # address pool and nothing writes this pointer today. Declared ahead of that
          # producer deliberately: the type is admin-curated and the anchor is what the
          # super-admin cascade below derives over. The marker expires by itself — the
          # moment a producer appears, the gate demands it be removed.
    verbs:
      - get
      - list
      - update
      - delete

  - name: cidrGroup
    objectType: vpc_cidr_group
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

# --------------------------------------------------------------------------
#  roles — системные роли модуля, объявленные ДАННЫМИ (#1891, #1904).
#
#  Писатель этих строк — применитель манифеста, а не миграция: он приводит
#  `kaname.roles` к объявленному здесь состоянию. Согласие объявления с живой
#  базой держит ПРОГОН, а не чтение:
#      go test -C services/iam ./internal/moduleroleparity/
#  Гейт поднимает Postgres, играет цепочку миграций дерева и сравнивает строки
#  с тем, что произвёл бы применитель ИЗ ЭТОГО раздела. Расхождение по
#  идентификатору, назначению либо праву — находка с именем роли.
#
#  Почему `description` по-английски и почему его нельзя «причесать»: текст
#  сверяется с живой строкой ДОСЛОВНО. Применитель пишет его как есть, поэтому
#  правка здесь — правка того, что читает арендатор, выбирая роль; она идёт
#  своим решением и своей миграцией, а не попутно с объявлением. Ровно поэтому
#  предел длины назначения равен ОДНОМУ знаку, а не шестнадцати, как у прочей
#  прозы манифеста: длина выносила приговор по длине имени типа и делала
#  двадцать семь живых ролей из сорока двух невыразимыми (#1904).
#
#  Почему правила перечислены В ЭТОМ порядке и не отсортированы: `rules` —
#  упорядоченное поле хранимой формы, и применитель кладёт его дословно.
#  Пересортировав, объявление разошлось бы со строкой, ничего не изменив по
#  существу. По той же причине `classes` у чтения записаны `[list, get]`, а не
#  `[get, list]`: так их написала применённая миграция.
#
#  Ключ права — `classes`; `verbs` снят и отвергается явно. Подстановка `"*"`
#  законна ровно потому, что роль системная: у неё она значит «все классы типа».
# --------------------------------------------------------------------------

roles:

  - id: vpc.address.admin
    description: "Admin Address"
    tier:
      tierType: iam.cluster
      tierId: cluster_root
    rules:
      - module: vpc
        resources: [address]
        classes: ["*"]

  - id: vpc.address.edit
    description: "Edit Address"
    tier:
      tierType: iam.cluster
      tierId: cluster_root
    rules:
      - module: vpc
        resources: [address]
        classes: [get, list, update]

  - id: vpc.address.view
