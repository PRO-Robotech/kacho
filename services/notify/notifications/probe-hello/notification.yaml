# Шаблон пробы-источника notify-probe (стендовый объект): письмо, которое
# сквозная проба ставит внутренним глаголом и ждёт у приёмника стенда. Класс
# notice — проба не несёт ни секрета, ни права; кнопка ведёт на origin
# установки (путь «/» подаёт глагол пробы).
name: probe-hello
class: notice
ttl: 1h
attributes:
  target: {type: path, presence: required}
subject:
  ru: "Проба доставки почты"
