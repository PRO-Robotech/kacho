apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      annotations:
        # ── ОБЪЯВЛЕНИЕ СБОРА ВЕЛИЧИН ──────────────────────────────────────────
        #
        # Поверхность процесса (`GET /metrics`) поднята и отвечает — и до этой
        # аннотации к ней НИКТО НЕ ПРИХОДИЛ. Поднятая поверхность без того, кто
        # её читает, неотличима от отсутствующей: это та же форма без содержания,
        # только этажом выше.
        #
        # Аннотация пода, а не описатель сбора: описателя обслуживает оператор
        # сбора, а типа его ресурса в этом кластере нет. Аннотацию читают агенты
        # обоих семейств и обращаются к ПОДУ напрямую — поэтому порт в Service и
        # `containerPort` для сбора не нужны и здесь не заводятся.
        #
        # Порт обязан совпадать с адресом, который процесс берёт из своей
        # конфигурации; это сверяет декларативная проверка
        # `TestEveryRenderedChartDeclaresItsScrape`, читающая ОБЪЯВЛЕНИЯ, а не
        # отрендеренный манифест.
        {{- if .Values.metricsScrape.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.metricsPort | quote }}
        prometheus.io/path: /metrics
        {{- else }}
        # Сбор выключен ОБЪЯВЛЕНИЕМ, и причина едет в кластер вместе с подом:
        # оператор, увидевший процесс без объявления сбора, обязан прочитать
        # ПОЧЕМУ, а не гадать, забыли ли. Пустая причина при выключенном сборе —
        # находка декларативной проверки, а не пустая строка.
        kacho.cloud/metrics-scrape-disabled-because: {{ .Values.metricsScrape.disabledBecause | quote }}
        {{- end }}
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ОБРАЗА.
        #
        # Тег локального образа (`kacho-*:dev`) неизменен, поэтому пересборка под
        # тем же тегом НЕ меняет шаблон пода: Kubernetes не видит разницы и под не
        # перекатывается — процесс продолжает работать СТАРЫМ бинарником под новым
        # тегом. Ровно тот же разрыв между намерением и исходом, что и у настроек,
        # приезжающих массовым импортом (инцидент 2026-07-25), и лечится он так же —
        # аннотацией, привязанной к содержимому.
        #
        # Значение — идентификатор содержимого образа; его пишет `make build-services`
        # в helm/umbrella/values.image-ids.yaml сразу после сборки. Профиль, который
        # этот файл не накладывает (offline-рендер, чужой реестр), получает "unset" —
        # и тогда привязки нет, что честно: привязывать не к чему.
        kacho.cloud/image-id: {{ dig "kachoImageIds" "registry" "unset" (.Values.global | default dict) | quote }}
      labels:
        app: {{ .Values.name }}
    spec:
      # INFRA sec-hardening — pod-level securityContext (runAsNonRoot + seccomp
      # RuntimeDefault). Per-container floor applied on each container below.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # goose migrator (separate binary, evgeniy §9 K.1 / AP-9) — applies the
        # kacho_registry schema BEFORE the API server starts. KACHO_REGISTRY_DB_PASSWORD
        # is required:true → the migrator needs the same DB env as the server.
        - name: migrate
          image: "{{ include "registry.image" . }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/kacho-migrator", "up"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: KACHO_REGISTRY_DB_HOST
              value: "{{ .Values.db.host }}"
            - name: KACHO_REGISTRY_DB_PORT
              value: "{{ .Values.db.port }}"
            - name: KACHO_REGISTRY_DB_USER
              value: "{{ .Values.db.user }}"
            - name: KACHO_REGISTRY_DB_NAME
              value: "{{ .Values.db.name }}"
            - name: KACHO_REGISTRY_DB_SSLMODE
              value: "{{ include "registry.dbSslMode" .Values.db }}"
            - name: KACHO_REGISTRY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret }}
                  key: {{ .Values.db.passwordSecretKey }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ include "registry.image" . }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/kacho-registry", "serve"]
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            - name: grpc-internal
              containerPort: {{ .Values.service.internalGrpcPort }}
            - name: dataplane
              containerPort: {{ .Values.service.dataplanePort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            # ─── Postgres (schema kacho_registry) ───
            - name: KACHO_REGISTRY_DB_HOST
              value: "{{ .Values.db.host }}"
            - name: KACHO_REGISTRY_DB_PORT
              value: "{{ .Values.db.port }}"
            - name: KACHO_REGISTRY_DB_USER
              value: "{{ .Values.db.user }}"
            - name: KACHO_REGISTRY_DB_NAME
              value: "{{ .Values.db.name }}"
            - name: KACHO_REGISTRY_DB_SSLMODE
              value: "{{ include "registry.dbSslMode" .Values.db }}"
            - name: KACHO_REGISTRY_DB_MAX_CONNS
              value: "{{ .Values.db.maxConns }}"
            - name: KACHO_REGISTRY_DB_STATEMENT_TIMEOUT
              value: "{{ .Values.db.statementTimeout }}"
            - name: KACHO_REGISTRY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret }}
                  key: {{ .Values.db.passwordSecretKey }}
            # ─── Listeners ───
            - name: KACHO_REGISTRY_GRPC_PORT
              value: "{{ .Values.service.grpcPort }}"
            - name: KACHO_REGISTRY_INTERNAL_PORT
              value: "{{ .Values.service.internalGrpcPort }}"
            - name: KACHO_REGISTRY_DATAPLANE_ADDR
              value: ":{{ .Values.service.dataplanePort }}"
            # Diagnostic-листенер: /healthz + /metrics. Единственное место, где
            # состояние очереди регистраций (глубина, возраст головы, доставленное
            # по направлению) вообще наблюдаемо — без него застрявшая очередь
            # молчит ровно так же, как пустая.
            - name: KACHO_REGISTRY_METRICS_ADDR
              value: ":{{ .Values.service.metricsPort }}"
            # AuthN fail-closed gate (dev | production | production-strict).
            - name: KACHO_REGISTRY_AUTH_MODE
              value: "{{ .Values.authMode }}"
            # ─── registry→iam edges + authz ───
            # INTERNAL (:9091): per-RPC Check + fga-proxy RegisterResource/Unregister.
            - name: KACHO_REGISTRY_AUTHZ_IAM_GRPC_ADDR
              value: "{{ .Values.authz.iamGrpcAddr }}"
            # PUBLIC (:9090): ProjectService.Get existence-validation on Create.
            - name: KACHO_REGISTRY_IAM_PROJECT_GRPC_ADDR
              value: "{{ .Values.authz.iamProjectGrpcAddr }}"
            # registry→geo (REG-1 F4): RegionService.Get existence-validation of
            # Registry.region_id on Create (public :9090, separate conn — geo leaf).
            # Empty → geo-client nil → Create fail-closed (RegionExists Unavailable).
            - name: KACHO_REGISTRY_GEO_GRPC_ADDR
              value: "{{ .Values.authz.geoGrpcAddr }}"
            # Who may FORWARD an end-user identity (x-kacho-principal-*) into
            # registry. Empty is refused at boot in any production mode: corelib
            # narrows the circle only on a non-empty list, so empty means ANY
            # certificate-verified peer may act as any tenant. See values.yaml.
            - name: KACHO_REGISTRY_AUTHZ_TRUSTED_FORWARDER_SANS
              value: "{{ .Values.authz.trustedForwarderSANs }}"
            - name: KACHO_REGISTRY_AUTHZ_BREAKGLASS
              value: "{{ .Values.authz.breakglass }}"
            # ─── zot OCI backend (cluster-internal, never public) ───
            - name: KACHO_REGISTRY_ZOT_ADDR
              value: "{{ include "registry.zotAddr" . }}"
            {{- if .Values.zot.enabled }}
            # Учётные данные хранилища слоёв: zot аутентифицирует ВСЕХ (иначе его
            # порт — объезд всей плоскости данных), поэтому и адаптер плоскости
            # управления, и форвардер плоскости данных предъявляются им. Приходят
            # секретом, НЕ значением в pod-spec. В production/production-strict их
            # отсутствие — отказ в старте (requireZotCredentials).
            - name: KACHO_REGISTRY_ZOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.zot.auth.existingSecret | default (printf "%s-auth" .Values.zot.serviceName) }}
                  key: username
            - name: KACHO_REGISTRY_ZOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.zot.auth.existingSecret | default (printf "%s-auth" .Values.zot.serviceName) }}
                  key: password
            {{- end }}
            # ─── data-plane OCI auth-proxy (registry.kacho.local) ───
            # registry-iam-jwks-unify — the docker-Bearer verifier fetches its JWKS from
            # the cluster-INTERNAL kaname JWKS proxy (:9097), a byte-for-byte mirror of
            # Hydra's PUBLIC JWKS, instead of dialing Hydra directly. Hydra stays the
            # signer/issuer (issuer-pin below is unchanged — separate knob). The registry
            # pod trusts the internal-CA leaf terminating iam :9097 via SSL_CERT_DIR (the
            # ca.crt mounted at /etc/registry-ca — see the internal-ca volume, present
            # whenever mtls (prod) or the data-plane TLS-sidecar is on). The sidecar no
            # longer proxies JWKS — iam serves it over TLS directly.
            # F1 (#897) — издатель токена стал МНОЖЕСТВОМ, и у каждого принимаемого
            # издателя СВОЯ объявленная запись источника ключей. Объединить наборы
            # было бы дешевле и уничтожило бы ровно ту защиту, ради которой развязка
            # делается: ключ одного издателя проверял бы токен, объявляющий другого.
            # Адрес записи ОБЪЯВЛЯЕТСЯ перечислением и никогда не выводится из
            # издателя — издатель приходит от предъявителя.
            - name: KACHO_REGISTRY_TOKEN_ISSUERS
              value: "{{ .Values.tokenAcceptance.issuers }}"
            - name: KACHO_REGISTRY_TOKEN_ISSUER_KEYSETS
              value: "{{ .Values.tokenAcceptance.issuerKeySets }}"
            - name: KACHO_REGISTRY_PLATFORM_TOKEN_ISSUER
              value: "{{ .Values.tokenAcceptance.platformIssuer }}"
            # Отзыв читается НА ПРЕДЪЯВЛЕНИИ: контроль, действующий только там, где
            # удостоверение выдают, отзывом не является — он лишь не выдаёт нового.
            # Адрес задаётся явно; выведенный из адреса соседа он был бы всегда
            # непуст, то есть контроль выглядел бы включённым, ведя в никуда.
            - name: KACHO_REGISTRY_TOKEN_REVOCATION_URL
              value: "{{ .Values.tokenAcceptance.revocationUrl }}"
            - name: KACHO_REGISTRY_DATAPLANE_TLS_TERMINATED_EXTERNALLY
              value: "{{ .Values.dataplaneTLSTerminatedExternally }}"
            - name: KACHO_REGISTRY_TOKEN_REALM
              value: "{{ .Values.tokenRealm }}"
            # Имя службы полосы — ОДНО объявление на обе её стороны
            # (см. registry.laneServiceAud). То же имя чеканит в `aud` подписант
            # iam; разойтись им нечем, а объявленные врозь и по-разному роняют
            # рендер с текстом, называющим обе величины.
            - name: KACHO_REGISTRY_SERVICE_AUD
              value: {{ include "registry.laneServiceAud" . | quote }}
            - name: KACHO_REGISTRY_ENDPOINT_BASE
              value: "{{ .Values.endpointBase }}"
            {{- if or .Values.mtls.enable (and .Values.service.dataplaneLB.enabled .Values.service.dataplaneLB.tlsSidecar.enabled) }}
            # registry-iam-jwks-unify — internal-CA trust anchor for the https JWKS fetch
            # from kaname :9097. The mounted ca.crt is the cluster internal-CA
            # (kacho-internal-ca) — the SAME CA that signs the kaname-internal leaf
            # terminating :9097 — added to the system pool via SSL_CERT_DIR. Present when
            # mtls is on (prod — from the registry mTLS server secret) OR the data-plane
            # TLS-sidecar cert is mounted. AuthMode stays production (requireSecureKeySetURL
            # passes — every declared key-set URL in tokenAcceptance.issuerKeySets is https).
            # The same anchor serves the revocation authority (tokenAcceptance.revocationUrl):
            # it is the same listener. Without this the https fetch fails the TLS handshake
            # → fail-closed 401 on every pull (risk R3). The sidecar no longer proxies the
            # key set (that role dropped now that iam serves TLS directly).
            - name: SSL_CERT_DIR
              value: /etc/registry-ca
            {{- end }}
            {{- if .Values.mtls.enable }}
            {{- $srv := printf "%s/server" .Values.mtls.mountPath }}
            {{- $cli := printf "%s/client" .Values.mtls.mountPath }}
            # mTLS server-creds (both gRPC listeners) — corelib grpcsrv.TLSServer via
            # config.LoadPrefixed("KACHO_REGISTRY"). ca.crt = client-CA bundle.
            # Internal :9091 is NOT exempt from mTLS (security.md AuthN+AuthZ ВЕЗДЕ).
            - name: KACHO_REGISTRY_PUBLIC_SERVER_MTLS_ENABLE
              value: "true"
            - name: KACHO_REGISTRY_PUBLIC_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KACHO_REGISTRY_PUBLIC_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KACHO_REGISTRY_PUBLIC_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            - name: KACHO_REGISTRY_INTERNAL_SERVER_MTLS_ENABLE
              value: "true"
            - name: KACHO_REGISTRY_INTERNAL_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KACHO_REGISTRY_INTERNAL_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KACHO_REGISTRY_INTERNAL_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- if .Values.mtls.edges.iamAuthz }}
            # registry→iam Check + fga-proxy (internal :9091) client-creds —
            # grpcclient.TLSClient. ServerName = kaname-internal (∈ iam server-SAN).
            - name: KACHO_REGISTRY_IAM_AUTHZ_MTLS_ENABLE
              value: "true"
            - name: KACHO_REGISTRY_IAM_AUTHZ_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_REGISTRY_IAM_AUTHZ_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_REGISTRY_IAM_AUTHZ_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_REGISTRY_IAM_AUTHZ_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.iamAuthz | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.tokenRevocation }}
            # registry→iam авторитет отзыва (internal :9097) client-creds. Ребро
            # СВОЁ: маршруту отзыва присылают предъявленный токен, поэтому
            # исключение из аутентификации, которым живёт маршрут набора ключей,
            # сюда не распространяется. Якорь объявлен и непригоден → отказ в
            # СТАРТЕ: откат на системные корни всегда «работает» и делает ошибку
            # в якоре ненаблюдаемой.
            - name: KACHO_REGISTRY_TOKEN_REVOCATION_MTLS_ENABLE
              value: "true"
            - name: KACHO_REGISTRY_TOKEN_REVOCATION_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_REGISTRY_TOKEN_REVOCATION_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_REGISTRY_TOKEN_REVOCATION_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_REGISTRY_TOKEN_REVOCATION_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.tokenRevocation | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.iamProject }}
            # registry→iam ProjectService.Get (public :9090) client-creds — same client
            # leaf as iamAuthz, ServerName = kaname (public dial-host, ∈ iam server-SAN).
            - name: KACHO_REGISTRY_IAM_PROJECT_MTLS_ENABLE
              value: "true"
            - name: KACHO_REGISTRY_IAM_PROJECT_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_REGISTRY_IAM_PROJECT_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_REGISTRY_IAM_PROJECT_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_REGISTRY_IAM_PROJECT_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.iamProject | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.geo }}
            # registry→geo RegionService.Get (public :9090) client-creds — same
            # client leaf as the iam edges, ServerName = kacho-geo (∈ geo server-SAN).
            - name: KACHO_REGISTRY_GEO_MTLS_ENABLE
              value: "true"
            - name: KACHO_REGISTRY_GEO_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_REGISTRY_GEO_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_REGISTRY_GEO_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_REGISTRY_GEO_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.geo | quote }}
            {{- end }}
            {{- end }}
            # Потолок ОДНОВРЕМЕННЫХ потоков подписки. Рендерится НАПРЯМУЮ, без
            # умолчания в шаблоне: второе умолчание пережило бы снятие ключа из
            # values.yaml, правка одного объявления не имела бы силы, а величина
            # молча стала бы нулём — на нём страж старта отказывает, называя ручку.
            - name: KACHO_REGISTRY_SUBSCRIPTION_MAX_STREAMS
              value: "{{ .Values.subscription.maxStreams }}"
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            # Writable scratch for the read-only-rootfs container.
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.mtls.enable (and .Values.service.dataplaneLB.enabled .Values.service.dataplaneLB.tlsSidecar.enabled) }}
            # registry-iam-jwks-unify — internal-CA trust-anchor (ca.crt = kacho-internal-ca)
            # для верификации https-JWKS cluster-internal kaname proxy (:9097).
            # SSL_CERT_DIR=/etc/registry-ca. Источник ca.crt — mTLS-секрет (prod) или
            # sidecar-серт (см. volume ниже).
            - name: internal-ca
              mountPath: /etc/registry-ca
              readOnly: true
            {{- end }}
            {{- if .Values.mtls.enable }}
            # mTLS — cert-manager internal-CA server + client secrets in separate
            # dirs. cert-manager writes tls.crt/tls.key/ca.crt.
            - name: mtls-server
              mountPath: {{ printf "%s/server" .Values.mtls.mountPath | quote }}
              readOnly: true
            - name: mtls-client
              mountPath: {{ printf "%s/client" .Values.mtls.mountPath | quote }}
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          # ── ЖИВОСТЬ И ГОТОВНОСТЬ — РАЗНЫЕ ВОПРОСЫ, И СПРАШИВАЮТСЯ ОНИ РАЗНЫМ ──
          #
          # Живость отвечает «жив ли процесс»; готовность — «может ли он
          # ОБСЛУЖИВАТЬ». Перечень зависимостей называет САМ ПРОЦЕСС именованными
          # проверками — здесь он намеренно не переписывается: второе место об
          # одном предмете разошлось бы с первым молча. Прежде в слоте готовности
          # стояла живость, и обещанного NotReady не наступало ни при каких
          # условиях: под рапортовал Ready, отвергая каждый вызов, а kubelet слал
          # в него трафик.
          #
          # Пробируется то, что процесс СТРОИТ (`/readyz` — набор именованных
          # проверок зависимостей); совпадение двух полос держит гейт дерева
          # `TestReadinessProbeAsksWhatTheServiceActuallyServes`.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
        {{- if and .Values.service.dataplaneLB.enabled .Values.service.dataplaneLB.tlsSidecar.enabled }}
        # data-plane TLS-sidecar — nginx терминирует TLS на :8443 (server-cert
        # registry-dataplane-tls) и проксирует OCI-трафик в плейнтекстовый data-plane
        # (127.0.0.1:8080), а также JWKS/token-эндпоинты (см. registry-dataplane-nginx).
        # docker требует https для non-localhost registry — публичный 443-VIP таргетит
        # этот порт (dp-tls). unprivileged-образ слушает :8443 без root.
        - name: dataplane-tls
          image: {{ .Values.service.dataplaneLB.tlsSidecar.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: dp-tls
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: registry-dataplane-tls
              mountPath: /etc/registry-tls
              readOnly: true
            - name: registry-dataplane-nginx
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # Trust-anchor для проверки iam-леафа на хопе `/iam/token`: без него
            # proxy_ssl_verify нечем удовлетворить, и следующий человек «починил бы»
            # это выключением проверки. Тот же том, которым сам data-plane верифицирует
            # JWKS-леаф iam (условие рендера тома совпадает с условием sidecar'а).
            - name: internal-ca
              mountPath: /etc/registry-ca
              readOnly: true
        {{- end }}
      volumes:
        # Writable scratch for the read-only-rootfs container.
        - name: tmp
          emptyDir: {}
        {{- if and .Values.service.dataplaneLB.enabled .Values.service.dataplaneLB.tlsSidecar.enabled }}
        # data-plane TLS-sidecar: server-cert + nginx-конфиг. Имя секрета — из values
        # (tlsSidecar.cert.secretName): публичный VIP терминируется публично-доверенным
        # цертом (LE), иначе docker отвергает internal-CA leaf как unknown authority.
        - name: registry-dataplane-tls
          secret:
            secretName: {{ .Values.service.dataplaneLB.tlsSidecar.cert.secretName | quote }}
        - name: registry-dataplane-nginx
          configMap:
            name: registry-dataplane-nginx
        {{- end }}
        {{- if .Values.mtls.enable }}
        # mTLS — cert-manager internal-CA secrets (server + client).
        - name: mtls-server
          secret:
            secretName: {{ .Values.mtls.serverSecretName | quote }}
        - name: mtls-client
          secret:
            secretName: {{ .Values.mtls.clientSecretName | quote }}
        {{- end }}
        {{- if or .Values.mtls.enable (and .Values.service.dataplaneLB.enabled .Values.service.dataplaneLB.tlsSidecar.enabled) }}
        # registry-iam-jwks-unify — internal-CA (kacho-internal-ca) ca.crt projected as a
        # single-file trust store at /etc/registry-ca/internal-ca.crt (SSL_CERT_DIR) so the
        # data-plane trusts the leaf terminating the kaname JWKS proxy (:9097). Source:
        # the registry mTLS server secret when mtls is on (prod), else the data-plane
        # TLS-sidecar cert. ca.crt-only projection keeps private keys out of the trust dir.
        # NB: the two sources coincide ONLY while the sidecar cert is internal-CA-issued.
        # A public issuer (tlsSidecar.cert.issuerRef → letsencrypt-*) makes the sidecar
        # secret's ca.crt a PUBLIC chain, which would not verify the iam :9097 leaf — hence
        # a public sidecar issuer requires mtls.enable=true (prod), where ca.crt comes from
        # the mTLS secret instead. See values.yaml (tlsSidecar.cert, trust-anchor note).
        - name: internal-ca
          secret:
            secretName: {{ if .Values.mtls.enable }}{{ .Values.mtls.serverSecretName | quote }}{{ else }}{{ .Values.service.dataplaneLB.tlsSidecar.cert.secretName | quote }}{{ end }}
            items:
              - key: ca.crt
                path: internal-ca.crt
        {{- end }}