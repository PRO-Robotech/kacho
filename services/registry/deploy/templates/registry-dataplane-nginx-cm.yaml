{{/*
nginx-конфиг data-plane TLS-sidecar. Терминирует TLS на :8443 (server-cert из
секрета registry-dataplane-tls) и маршрутизирует:
  - `/iam/token` → iam registry-token shim (:9096) — Docker Registry v2 token-endpoint,
    куда docker идёт за Bearer-токеном по WWW-Authenticate realm;
  - `/` → data-plane OCI-прокси registry (127.0.0.1:8080), плейнтекст в том же pod.
registry-iam-jwks-unify — sidecar БОЛЬШЕ НЕ проксирует `/.well-known/jwks.json`: JWKS-
верификация тянет ключи напрямую из cluster-internal kaname JWKS-proxy (:9097, TLS),
доверие к internal-CA — через SSL_CERT_DIR (см. deployment.yaml). Upstream iam-token-shim
параметризован через values (tlsSidecar.iamTokenShimUpstream); loopback на data-plane
фиксирован (один pod). Рендерится только при включённом LB + TLS-sidecar.
*/}}
{{- if and .Values.service.dataplaneLB.enabled .Values.service.dataplaneLB.tlsSidecar.enabled }}
{{- include "registry.requireSidecarForwarderIdentity" . }}
{{- $s := .Values.service.dataplaneLB.tlsSidecar }}
{{- $cli := include "registry.sidecarClientDir" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-dataplane-nginx
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ .Values.name }}
    app.kubernetes.io/component: registry-dataplane-nginx
    app.kubernetes.io/managed-by: helm
data:
  default.conf: |
    server {
      listen 8443 ssl;
      http2 on;
      server_name registry.in-cloud.io _;
      ssl_certificate     /etc/registry-tls/tls.crt;
      ssl_certificate_key /etc/registry-tls/tls.key;
      client_max_body_size 0;
      chunked_transfer_encoding on;
      # Docker Registry v2 token endpoint → iam registry-token shim (:9096).
      #
      # ХОП ШИФРУЕТСЯ И СОБЕСЕДНИК ПРОВЕРЯЕТСЯ. По нему `docker login` шлёт HTTP
      # Basic, чей ПАРОЛЬ — приватный ключ ключа служебной учётки: iam его не
      # хранит (сверяет выведенный SPKI с сохранённым публичным), срок жизни ключа
      # не ограничен и ротации нет. Снятый с провода, он предъявляется напрямую и
      # без окна TTL — поэтому одного шифрования мало: без проверки сертификата
      # подставленный слушатель собирал бы ключи, оставаясь «зашифрованным».
      # Trust-anchor — тот же internal-CA, которым data-plane уже верифицирует
      # JWKS-леаф iam (том internal-ca, см. deployment.yaml).
      location = /iam/token {
        proxy_pass https://{{ $s.iamTokenShimUpstream }}/iam/token;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/registry-ca/internal-ca.crt;
        proxy_ssl_name {{ regexReplaceAll ":[0-9]+$" $s.iamTokenShimUpstream "" }};
        proxy_ssl_server_name on;
        # ДОВЕРЕННЫЙ ПЕРЕСЫЛЬЩИК (kacho#3330, kaname#930). Сайдкар предъявляет
        # службе доступа клиентский лист реестра (URI SAN
        # spiffe://<домен доверия>/ns/<пространство>/sa/kacho-registry,
        # kacho-internal-ca, clientAuth), и только у пира с этим проверенным
        # листом служба берёт адрес клиента из X-Forwarded-For — ключ темпа
        # анонимной выдачи на источник.
        proxy_ssl_certificate     {{ $cli }}/tls.crt;
        proxy_ssl_certificate_key {{ $cli }}/tls.key;
        # ЗАГОЛОВОК ПЕРЕЗАПИСЫВАЕТСЯ, а не дополняется. Служба читает ОДНО значение;
        # `$proxy_add_x_forwarded_for` дописал бы адрес к присланному клиентом, и
        # клиент выбирал бы себе ключ темпа сам. `$remote_addr` — пир сайдкара,
        # то есть адрес клиента только при externalTrafficPolicy Local у службы
        # плоскости данных (иначе — адрес узла; страж в _helpers.tpl).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
      }
      # OCI data-plane (/v2/…) → registry data-plane (:8080).
      location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
      }
    }
{{- end }}