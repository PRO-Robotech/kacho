{{/*
Dedicated external VIP for the registry DATA-PLANE (the OCI Registry-v2 endpoint
`docker login/push/pull` hits) — a type=LoadBalancer Service so the cloud LB
(fe3455: Beget + Cilium LB-IPAM) assigns a separate external IP, independent of the
console (kacho.in-cloud.io / uif-lb). The control-plane gRPC (:9090) stays on the
in-cluster `registry` Service; only the data-plane :8080 is published here.

The data-plane pod serves plaintext HTTP; на публичном VIP оно закрывается либо
TLS-sidecar'ом (dp-tls :8443), либо внешним терминатором.

ОТКРЫТАЯ ПОРТ-ЗАПИСЬ НЕ РЕНДЕРИТСЯ БЕЗ ЯВНОГО ТРЕБОВАНИЯ (plaintext.enabled).
По этому сокету едет живой предъявитель: клиент получает Bearer по TLS, а затем
отправляет его на КАЖДЫЙ запрос, и ответ blob-GET может нести подписанную ссылку
на объектное хранилище. Прежде запись port 80 → :8080 рендерилась безусловно, а
шапка обещала «поставьте перед VIP внешний терминатор» — при том что файл
значений боевого профиля фиксирует, что внешнего терминатора там НЕТ (ради этого
и заведён sidecar). Предпосылку контроля опровергал соседний артефакт, поэтому
запись стала opt-in: тот, кто действительно держит внешний терминатор, включает
её осознанно. Gated on service.dataplaneLB.enabled.
*/}}
{{- if .Values.service.dataplaneLB.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-lb
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    app.kubernetes.io/component: registry-dataplane-lb
  {{- with .Values.service.dataplaneLB.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.service.dataplaneLB.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with .Values.service.dataplaneLB.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  selector:
    app: {{ .Values.name }}
  ports:
    {{- if .Values.service.dataplaneLB.plaintext.enabled }}
    - name: dataplane
      port: {{ .Values.service.dataplaneLB.plaintext.port | default 80 }}
      targetPort: dataplane
    {{- end }}
    {{- if .Values.service.dataplaneLB.httpsPort }}
    # При включённом TLS-sidecar 443 таргетит sidecar (dp-tls :8443, TLS-терминация
    # внутри pod); иначе — плейнтекстовый data-plane (внешняя TLS-терминация на edge).
    - name: dataplane-https
      port: {{ .Values.service.dataplaneLB.httpsPort }}
      targetPort: {{ if .Values.service.dataplaneLB.tlsSidecar.enabled }}dp-tls{{ else }}dataplane{{ end }}
    {{- end }}
{{- end }}