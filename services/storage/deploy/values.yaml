# Helm-values kacho-storage. mTLS-секреты / peer-адреса / DB-секрет донастраивает
# umbrella при интеграции в стенд (values.fe3455-prod.yaml).

# fullnameOverride — фиксирует базовое имя ресурсов (Service/Deployment/DNS) как
# `kacho-storage` вместо release-производного `<Release.Name>-storage`. ВСЕ консумеры
# ждут именно `kacho-storage`: compute→storage (storageInternalAddr default
# kacho-storage.kacho.svc:9091 + compute server-cert serverName.storage
# SAN), config-дефолты, deploy/Makefile reload-svc (DEPLOY_NAME=kacho-storage). Без
# override Service рендерится `kacho-umbrella-storage` → DNS не резолвится, mTLS-SAN
# не совпадает. См. templates/_helpers.tpl.
fullnameOverride: kacho-storage

replicaCount: 1

image:
  repository: kacho-storage
  tag: dev
  pullPolicy: IfNotPresent

# Порты сервиса.
ports:
  public: 9090     # Volume/Snapshot/DiskType Service
  internal: 9091   # Internal* (cluster-internal only, ban #6)
  metrics: 9095    # /healthz diagnostic listener

# ─── DB — existingSecret-паттерн (выровнен с compute/vpc) ────────────────────
# Пароль НИКОГДА не лежит в values (git-committed) — берётся из
# operator-/bitnami-provisioned Secret по ссылке (passwordSecretName/Key). deployment
# монтирует его через secretKeyRef в migrator init-container И main-container. Ключи
# host/port/user/name/sslMode/passwordSecretName/passwordSecretKey совпадают с
# umbrella overlay (values.fe3455-prod.yaml storage.db.*).
db:
  host: kacho-storage-postgres
  port: "5432"
  user: storage
  name: kacho_storage
  # sslMode — postgres sslmode для DSN (migrator + serve). Прод обязан require|
  # verify-ca|verify-full (security.md: TLS-канал БД). disable — только dev-стенд.
  sslMode: require
  # existingSecret: пароль читается из этого Secret'а по ключу passwordSecretKey.
  # umbrella пинит на bitnami-provisioned kacho-umbrella-pg-storage (ключ password).
  passwordSecretName: kacho-storage-postgres
  passwordSecretKey: password
  # maxConns — ширина пула pgx на ОДНУ реплику (KACHO_STORAGE_DB_MAX_CONNS).
  #
  # Объявлена, а не унаследована умолчанием драйвера (#709). Умолчание —
  # `max(4, число ядер УЗЛА)`: величина, которую никто не выбирал и которая
  # меняется от смены узла без единой правки дерева. Пока она не объявлена,
  # произведение «пул × потолок подов» проверить не с чем, и «не объявлено»
  # молча читается как «не ограничиваем».
  #
  # 20 — из арифметики: pg-storage объявляет `max_connections = 100` на боевых
  # профилях (а на стенде разработки не объявляет вовсе, и тогда действует то
  # же умолчание сборки образа — 100), минус 3 слота суперпользователя = 97
  # отдаваемых. Автомасштабирования у службы нет, потолок подов — `replicaCount`
  # = 1, поэтому 20 × 1 = 20 ≤ 97 с большим запасом.
  #
  # Своей глубины для storage НЕ ИЗМЕРЕНО. Заведёшь автомасштабирование —
  # произведение пересчитается само в deploy/pool_fits_database_test.go, и он
  # покраснеет, если перестанет помещаться.
  maxConns: 20

# ─── Env (KACHO_STORAGE_*) не-секретные / не-mTLS. Секрет БД — через secretKeyRef;
# mTLS-env рендерит deployment.yaml по mtls.* ──────────────────────────────────
config:
  # ── Плоскость данных: ЧЕМ обслуживается блочное хранение ──────────────────
  #
  # Пустой `kind` означает «не подключена»: сервис поднимается, каталог читается,
  # но сверщик не запускается и НИ ОДИН том не станет готовым. Это законное
  # состояние для профиля без кластера хранения — и НЕ законное для боевого.
  #
  # `values.prod` обязан назвать вид, префикс установки и каталог ссылок: страж
  # старта отказывает в старте на неполной посадке, поэтому профиль, который
  # только рендерится, настроенным не считается.
  blockBackend:
    # Вид плоскости данных. Объявленный вид без исполнителя в бинаре роняет
    # старт — принять его и молча ничего не делать значило бы завести сверщик,
    # который каждый проход берёт работу и не двигает её.
    kind: ""
    # Префикс имени объектов ЭТОГО развёртывания: отличает наши объекты от
    # объектов соседнего облака в общем кластере. Пустой боевой страж не пропускает.
    installPrefix: ""
    # Каталог, в котором разрешаются ССЫЛКИ на учётный материал. Сам материал
    # монтируется, а не хранится: строка ресурса переживает ротацию и уезжает в
    # резервные копии.
    credentialsDir: /etc/kacho/storage/credentials
    # Срок ОДНОГО обращения. Неположительный недопустим: неотвечающий кластер
    # без срока паркует слот сверщика навсегда.
    callTimeout: 30s
    reconcileInterval: 15s
    reconcileBatch: 100
    ceph:
      # Названы явно, а не собраны из имени: собранное умолчание всегда непусто
      # и потому выглядит настроенным.
      binary: /usr/bin/rbd
      clientName: client.kacho-storage
  # authMode — fail-closed режим: dev | production | production-strict.
  # Peer-адреса (runtime cross-domain edges). Пусто → клиент fail-closed.
  geoGrpcAddr: ""      # storage→geo ZoneService.Get (zone_id), public :9090
  iamGrpcAddr: ""      # storage→iam ProjectService.Get (project_id), public :9090
  # authzIamGrpcAddr — kacho-iam INTERNAL :9091: несёт per-RPC Check И
  # RegisterResource/UnregisterResource (FGA-proxy owner-tuple, SEC-D). Пусто →
  # authz-интерсептор и register-drainer не подключаются (dev). Прод ОБЯЗАН задать.
  authzIamGrpcAddr: ""
  # trustedForwarderSANs — список через запятую тех личностей клиентского
  # сертификата (SPIFFE-SAN), которым разрешено ПЕРЕДАВАТЬ личность конечного
  # пользователя (заголовки x-kacho-principal-*). Уезжает в оба листенера.
  #
  # Пустая строка НЕ означает «не принимаем ни от кого»: контракт corelib сужает
  # круг только на непустом списке, а на пустом принимает переданную личность от
  # ЛЮБОГО пира, прошедшего проверку сертификата. Внутренний периметр объявлен
  # НЕдоверенным, поэтому пусто = сосед со своим законным сертификатом действует от
  # имени любого тенанта. Боевой режим на пустом списке НЕ СТАРТУЕТ
  # (Config.Validate, refuse-to-start).
  #
  # Законных отправителя ДВА, и оба обязаны быть в списке:
  #   - kacho-api-gateway — публичный :9090 (запросы пользователя);
  #   - kacho-compute — внутренний :9091 (привязка/отвязка тома идёт под личностью
  #     того, кто её инициировал). Без него ломается привязка тома к машине.
  # Дефолт чарта непустой — как у compute: профиль, забывший ручку, не должен
  # отгружать «доверяем любому». Именно на этом дефолте держатся профили, которые
  # ручку не задают (values.prod её повторяет, dev-prod и fe3455-prod — нет).
  #
  # В dev дефолт ТОЖЕ действует и круг ТОЖЕ сужается: dev-профиль поднимает storage
  # с mTLS на обоих листенерах, поэтому список работает точно так же — просто старт
  # на пустом там не запрещён. Оба законных отправителя в dev предъявляют свои
  # сертификаты (у gateway и compute включено ребро на storage), поэтому дефолт
  # ничего не ломает. Пусто имеет смысл ставить только там, где mTLS нет вовсе.
  trustedForwarderSANs: "spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway,spiffe://kacho.cloud/ns/kacho/sa/kacho-compute"
  # fgaRegisterDrainerEnabled — SEC-D/CS-1 GAP-D: register-drainer применяет
  # owner-tuple register-intent'ы (kacho_storage.fga_register_outbox) через kacho-iam
  # RegisterResource по ребру storage→iam (authzIamGrpcAddr, mTLS). Без него
  # созданные Volume/Snapshot не получают owner-tuple → gateway scope_extractor
  # {storage_volume,volume_id}/{storage_snapshot,snapshot_id} не резолвит target→
  # project (анти-BOLA). Требует непустой authzIamGrpcAddr (иначе intents durable).
  fgaRegisterDrainerEnabled: true
  # listFilter — per-object фильтр видимости: прочитанная страница прогоняется
  # через kacho-iam AuthorizeService.BatchCheck на `viewer` (то же отношение, что
  # энфорсит Get: в списке видно ровно то, что Get отдаст) по тому же
  # authzIamGrpcAddr. Защищает ДВЕ разные по цене поверхности:
  #
  #   1. публичный List (Volume/Snapshot/Image) — фильтр ВТОРОЙ слой: за ним
  #      остаётся per-RPC Check, но тот гейтит List лишь на project-tier viewer,
  #      поэтому без фильтра ЛЮБОЙ член проекта видит каждый том/снимок/образ
  #      проекта, включая объекты без per-object гранта (over-show / BOLA-lite);
  #   2. InternalVolumeService/ListAttachments (:9091) — фильтр ЕДИНСТВЕННЫЙ гейт:
  #      этот RPC помечен ScopeFiltered (единичного объекта нет — инстансы называет
  #      вызывающий), поэтому per-RPC Check за него не задаётся вовсе. Здесь цена
  #      отказа фильтра не внутрипроектная, а межтенантная.
  #
  # production boot-guard (Config.Validate) отказывает старту при enabled=false —
  # и, пока в карте прав есть ScopeFiltered-запись, при failOpen=true (см. ниже).
  listFilter:
    enabled: true
    # timeoutMs — per-call deadline ОДНОГО BatchCheck (батч ≤100 id), НЕ бюджет всей
    # фильтрации: бюджет операции выводится из него и параллелизма (страница максимума
    # = 4 волны). Занижать не нужно — это делает хрупким один хоп, не ускоряет запрос.
    timeoutMs: 1000
    # cacheTtlMs — TTL ПОЛОЖИТЕЛЬНОГО вердикта (revoke виден ≤ TTL). Отрицательные
    # вердикты не кешируются вовсе.
    cacheTtlMs: 5000
    cacheMaxEntries: 10000
    # failOpen — degraded mode: на ошибке iam отдать страницу НЕотфильтрованной
    # (+ audit-WARN). Default false = fail-closed (Unavailable).
    #
    # Это НЕ «мягкая» настройка производительности: включённый фильтр, который на
    # первой ошибке iam отдаёт страницу целиком, защищает не больше выключенного —
    # он просто выключается позже и по чужой аварии. Для ScopeFiltered-RPC (см.
    # выше) за ним не остаётся ничего.
    #
    # Поэтому production boot-guard (Config.Validate) ОТКАЗЫВАЕТ в старте при
    # failOpen=true, пока карта прав несёт хотя бы одну запись ScopeFiltered.
    # Размен осознанный: стенд, намеренно выставивший fail-open, не поднимется.
    failOpen: false

# Init-контейнер миграций (kacho-migrator up) до старта основного pod.
migrator:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ─── SEC-F mTLS — per-edge opt-in (cert-manager internal-CA leaf-сертификаты) ───
# enable=false (default) → НИ Certificate, НИ KACHO_STORAGE_*_MTLS_* env → insecure
# dev (нулевая регрессия). umbrella прокидывает .mtls.enable + per-edge флаги.
#
# При enable=true (corelib LoadPrefixed("KACHO_STORAGE"), config.go):
#   server (оба листенера): KACHO_STORAGE_PUBLIC_SERVER_MTLS_* /
#                           KACHO_STORAGE_INTERNAL_SERVER_MTLS_*
#   storage→geo (zone_id):  KACHO_STORAGE_GEO_CLIENT_MTLS_*   (:9090 ZoneService.Get)
#   storage→iam (все рёбра): KACHO_STORAGE_IAM_CLIENT_MTLS_*   (:9090 ProjectService.Get
#                           + :9091 Check + :9091 RegisterResource fga-register)
# Один client-cert (kacho-storage-client-tls) обслуживает ВСЕ storage→iam-дозвоны:
# serverName=kacho-iam.kacho.svc входит в SAN iam-server-cert'а
# (serverHosts ["kacho-iam","kacho-iam-internal"]), поэтому валиден и для :9090, и
# для internal :9091 (тот же pod предъявляет один cert на обоих листенерах).
mtls:
  # enable=true в проде: server-mTLS на обоих листенерах. flip в false ТОЛЬКО вместе
  # с auth.mode=dev (локальный insecure-стенд). Per-edge client-mTLS (.edges.*) —
  # независимый opt-in для staged rollout.
  enable: false
  # ─── internal-CA leaf-cert issuance (этот чарт владеет своим Certificate, rule #1) ─
  # client-cert URI-SAN saName ОБЯЗАН совпасть с IAM module-SA seed (migration
  # 0057_storage_sa_least_priv): kacho-storage → sva(md5("kacho-storage")) держит
  # fga_writer@iam_fgaproxy:system → RegisterResource storage_* авторизован.
  issuer:
    name: kacho-internal-ca
    kind: ClusterIssuer   # cluster-scoped, НЕ namespaced Issuer
  serverHosts: ["kacho-storage"]   # server-cert DNS-SAN dial-host (Service = kacho-storage)
  spiffe:
    trustDomain: kacho.cloud
    namespace: kacho-storage
    saName: kacho-storage
  leafDuration: 2160h
  leafRenewBefore: 720h
  serverSecretName: kacho-storage-server-tls
  clientSecretName: kacho-storage-client-tls
  mountPath: /etc/kacho-storage/tls   # <mp>/server|client/{tls.crt,tls.key,ca.crt}
  edges:
    geo: false    # storage→geo ZoneService.Get (zone_id, :9090)
    iam: false    # storage→iam ProjectService.Get (:9090) + Check + RegisterResource (:9091)
  serverName:
    geo: kacho-geo.kacho.svc     # :9090 ZoneService.Get dial-host (∈ geo server-SAN)
    iam: kacho-iam.kacho.svc     # ∈ iam server-SAN — валиден для :9090 И internal :9091

# INFRA sec-hardening — единый security-floor, идентичный kacho-iam/geo/nlb/registry.
#
# Заведён 2026-07-16: trivy config-скан впервые покрыл ВЕСЬ репозиторий и нашёл, что
# securityContext есть лишь у половины сервисов. В polyrepo IaC-скан был ТОЛЬКО у
# kacho-iam, а в том репо нет ни одного k8s-манифеста (чарты жили в kacho-deploy) —
# гейт зеленел, не проверяя ничего.
#
# runAsUser 65532 совпадает с `USER 65532` в Dockerfile — образ уже собран под nonroot.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem требует writable-scratch: контейнер монтирует emptyDir на /tmp
# (см. deployment.yaml). Без него сервис падает на первой же записи во временный файл.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# metricsScrape — объявление СБОРА величин диагностической поверхности.
#
# Выключение требует ПРИЧИНЫ: пустая строка при enabled=false — это «забыли», и
# декларативная проверка не отличила бы её от «сбора здесь нет намеренно».
metricsScrape:
  enabled: true
  disabledBecause: ""

# subscription — потолок ОДНОВРЕМЕННЫХ потоков подписки этого процесса.
#
# Величина объявляется здесь потому, что её обязан видеть тот, кто разворачивает:
# каждый поток держит выделенное соединение ВНЕ ПУЛА всё время своей жизни, то
# есть это арифметика соединений базы, а не вкус —
#
#	число реплик × этот потолок + пулы всех реплик ≤ max_connections базы
#
# ЗНАЧЕНИЕ БАЙТ-В-БАЙТ РАВНО вкомпилированному умолчанию: объявление делает
# величину видимой профилю и сверяемой, а не меняет поведение. До него ключ жил
# только в коде, и распоряжаться им профиль не мог.
#
# Асимметрия, задающая выбор: упереться в СВОЙ потолок — чистый отказ ОДНОМУ
# вызывающему (`RESOURCE_EXHAUSTED`, повтор осмыслен); упереться в предел БАЗЫ —
# отказ всему процессу и всем арендаторам сразу, включая тех, кто подписок не
# открывал.
#
# Потолок КРАЯ обязан помещаться сюда: `replicas(края) × maxStreams(края)` не
# больше этой величины, иначе исчерпание наступает у владельца — у всех сразу.
# Сверяет gateway/deploy/subscription_stream_budget_test.go, читая это объявление.
subscription:
  maxStreams: 16

# ── ПОСАДКА БЕЗОПАСНОСТИ ─────────────────────────────────────────────────
#
# ОДИН адрес на весь флот: `authMode` в корне значений сервиса. Ручку звали
# шестью разными адресами и двумя именами, и вопрос «в какой посадке работает
# этот кластер» нельзя было задать одной командой. Прежний адрес (config.authMode)
# снят; профиль, всё ещё задающий его, получает отказ рендера с обоими
# значениями в тексте — молчаливого отката к умолчанию не будет.
authMode: production
