apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storage.fullname" . }}
  labels:
    {{- include "storage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "storage.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "storage.fullname" . }}
      annotations:
        # ── ОБЪЯВЛЕНИЕ СБОРА ВЕЛИЧИН ──────────────────────────────────────────
        #
        # Поверхность процесса (`GET /metrics`) поднята и отвечает — и до этой
        # аннотации к ней НИКТО НЕ ПРИХОДИЛ. Поднятая поверхность без того, кто
        # её читает, неотличима от отсутствующей: это та же форма без содержания,
        # только этажом выше.
        #
        # Аннотация пода, а не описатель сбора: описателя обслуживает оператор
        # сбора, а типа его ресурса в этом кластере нет. Аннотацию читают агенты
        # обоих семейств и обращаются к ПОДУ напрямую — поэтому порт в Service и
        # `containerPort` для сбора не нужны и здесь не заводятся.
        #
        # Порт обязан совпадать с адресом, который процесс берёт из своей
        # конфигурации; это сверяет декларативная проверка
        # `TestEveryRenderedChartDeclaresItsScrape`, читающая ОБЪЯВЛЕНИЯ, а не
        # отрендеренный манифест.
        {{- if .Values.metricsScrape.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.ports.metrics | quote }}
        prometheus.io/path: /metrics
        {{- else }}
        # Сбор выключен ОБЪЯВЛЕНИЕМ, и причина едет в кластер вместе с подом:
        # оператор, увидевший процесс без объявления сбора, обязан прочитать
        # ПОЧЕМУ, а не гадать, забыли ли. Пустая причина при выключенном сборе —
        # находка декларативной проверки, а не пустая строка.
        kacho.cloud/metrics-scrape-disabled-because: {{ .Values.metricsScrape.disabledBecause | quote }}
        {{- end }}
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ОБРАЗА.
        #
        # Тег локального образа (`kacho-*:dev`) неизменен, поэтому пересборка под
        # тем же тегом НЕ меняет шаблон пода: Kubernetes не видит разницы и под не
        # перекатывается — процесс продолжает работать СТАРЫМ бинарником под новым
        # тегом. Ровно тот же разрыв между намерением и исходом, что и у настроек,
        # приезжающих массовым импортом (инцидент 2026-07-25), и лечится он так же —
        # аннотацией, привязанной к содержимому.
        #
        # Значение — идентификатор содержимого образа; его пишет `make build-services`
        # в helm/umbrella/values.image-ids.yaml сразу после сборки. Профиль, который
        # этот файл не накладывает (offline-рендер, чужой реестр), получает "unset" —
        # и тогда привязки нет, что честно: привязывать не к чему.
        kacho.cloud/image-id: {{ dig "kachoImageIds" "storage" "unset" (.Values.global | default dict) | quote }}
        # Roll pods when ConfigMap content changes (same pattern as kacho-nlb).
        #
        # WHY THIS IS SECURITY-CRITICAL, not cosmetic: every storage security knob
        # (KACHO_STORAGE_AUTH_MODE, KACHO_STORAGE_DB_SSLMODE, AUTHZ_IAM_GRPC_ADDR)
        # reaches the container through `envFrom: configMapRef` below — i.e. it is
        # read ONCE, at process start. A ConfigMap-only change does NOT alter the
        # pod template, so Kubernetes never rolls the pod and the running process
        # keeps its BOOT-time env. Flipping the stand to production posture
        # (values.dev-prod.yaml sets authMode dev→production, sslMode disable→
        # require) therefore left kacho-storage running with auth_mode=dev +
        # db_sslmode=disable while its ConfigMap read `production`/`require` —
        # and `make dev-prod-up` reported success, because assert-production-
        # posture inspects the ConfigMap, not the live process. The production
        # boot-guard (Config.Validate, config/validate.go) never re-ran: it cannot
        # refuse a start that never happened. Measured 2026-07-25: pod booted
        # "auth_mode":"dev","db_sslmode":"disable" 36s BEFORE the phase-3 upgrade,
        # and pg_stat_ssl showed its DB backends on plaintext.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # INFRA sec-hardening (2026-07-16) — единый floor, идентичный kacho-iam.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        # Writable scratch для read-only-rootfs контейнеров (безусловно: rootfs
        # read-only независимо от mtls).
        - name: tmp
          emptyDir: {}
        {{- if .Values.mtls.enable }}
        # SEC-F mTLS — cert-manager internal-CA secrets (server + client, req #5).
        - name: mtls-server
          secret:
            secretName: {{ .Values.mtls.serverSecretName | quote }}
        - name: mtls-client
          secret:
            secretName: {{ .Values.mtls.clientSecretName | quote }}
        {{- end }}
      {{- if .Values.migrator.enabled }}
      initContainers:
        - name: migrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/usr/local/bin/kacho-migrator", "up"]
          envFrom:
            - configMapRef:
                name: {{ include "storage.fullname" . }}-config
          env:
            # SEC: DB password из existingSecret (никогда не в values). migrator
            # DB-канал так же TLS (sslmode из configmap = serve).
            - name: KACHO_STORAGE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName | quote }}
                  key: {{ .Values.db.passwordSecretKey | quote }}
      {{- end }}
      containers:
        - name: storage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.mtls.enable }}
            # SEC-F mTLS — server + client leaf в раздельных каталогах (req #5).
            # cert-manager пишет tls.crt/tls.key/ca.crt.
            - name: mtls-server
              mountPath: {{ printf "%s/server" .Values.mtls.mountPath | quote }}
              readOnly: true
            - name: mtls-client
              mountPath: {{ printf "%s/client" .Values.mtls.mountPath | quote }}
              readOnly: true
            {{- end }}
          args: ["serve"]
          ports:
            - name: grpc-public
              containerPort: {{ .Values.ports.public }}
            - name: grpc-internal
              containerPort: {{ .Values.ports.internal }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          envFrom:
            - configMapRef:
                name: {{ include "storage.fullname" . }}-config
          env:
            # SEC: DB password из existingSecret (никогда не в values).
            - name: KACHO_STORAGE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName | quote }}
                  key: {{ .Values.db.passwordSecretKey | quote }}
            {{- if .Values.mtls.enable }}
            {{- $srv := printf "%s/server" .Values.mtls.mountPath }}
            {{- $cli := printf "%s/client" .Values.mtls.mountPath }}
            # SEC-F mTLS server-creds (оба листенера) — corelib grpcsrv.TLSServer
            # через config.LoadPrefixed("KACHO_STORAGE"). ca.crt = client-CA bundle.
            - name: KACHO_STORAGE_PUBLIC_SERVER_MTLS_ENABLE
              value: "true"
            - name: KACHO_STORAGE_PUBLIC_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KACHO_STORAGE_PUBLIC_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KACHO_STORAGE_PUBLIC_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            - name: KACHO_STORAGE_INTERNAL_SERVER_MTLS_ENABLE
              value: "true"
            - name: KACHO_STORAGE_INTERNAL_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KACHO_STORAGE_INTERNAL_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KACHO_STORAGE_INTERNAL_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- if .Values.mtls.edges.geo }}
            # storage→geo (geo.v1.ZoneService.Get, zone_id, public :9090) client-creds
            # — grpcclient.TLSClient. ServerName=kacho-geo (∈ geo server-cert SAN).
            - name: KACHO_STORAGE_GEO_CLIENT_MTLS_ENABLE
              value: "true"
            - name: KACHO_STORAGE_GEO_CLIENT_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_STORAGE_GEO_CLIENT_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_STORAGE_GEO_CLIENT_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_STORAGE_GEO_CLIENT_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.geo | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.iam }}
            # storage→iam client-creds — ОДИН leaf на все iam-дозвоны: ProjectService.Get
            # (:9090), per-RPC Check (:9091) и RegisterResource/UnregisterResource
            # (fga-register owner-tuple, :9091, Internal-only ban #6). ServerName=kacho-iam
            # ∈ iam server-cert SAN (serverHosts ["kacho-iam","kacho-iam-internal"]) →
            # валиден и для :9090, и для internal :9091.
            - name: KACHO_STORAGE_IAM_CLIENT_MTLS_ENABLE
              value: "true"
            - name: KACHO_STORAGE_IAM_CLIENT_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_STORAGE_IAM_CLIENT_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_STORAGE_IAM_CLIENT_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_STORAGE_IAM_CLIENT_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.iam | quote }}
            {{- end }}
            {{- end }}
            # Потолок ОДНОВРЕМЕННЫХ потоков подписки. Рендерится НАПРЯМУЮ, без
            # умолчания в шаблоне: второе умолчание пережило бы снятие ключа из
            # values.yaml, правка одного объявления не имела бы силы, а величина
            # молча стала бы нулём — на нём страж старта отказывает, называя ручку.
            - name: KACHO_STORAGE_SUBSCRIPTION_MAX_STREAMS
              value: "{{ .Values.subscription.maxStreams }}"
          # ── ЖИВОСТЬ И ГОТОВНОСТЬ — РАЗНЫЕ ВОПРОСЫ, И СПРАШИВАЮТСЯ ОНИ РАЗНЫМ ──
          #
          # Живость отвечает «жив ли процесс»; готовность — «может ли он
          # ОБСЛУЖИВАТЬ». Перечень зависимостей называет САМ ПРОЦЕСС именованными
          # проверками — здесь он намеренно не переписывается: второе место об
          # одном предмете разошлось бы с первым молча. Прежде в слоте готовности
          # стояла живость, и обещанного NotReady не наступало ни при каких
          # условиях: под рапортовал Ready, отвергая каждый вызов, а kubelet слал
          # в него трафик.
          #
          # Пробируется то, что процесс СТРОИТ (`/readyz` — набор именованных
          # проверок зависимостей); совпадение двух полос держит гейт дерева
          # `TestReadinessProbeAsksWhatTheServiceActuallyServes`.
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.ports.metrics }}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ports.metrics }}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
