apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "storage.fullname" . }}-config
  labels:
    {{- include "storage.labels" . | nindent 4 }}
data:
  KACHO_STORAGE_AUTH_MODE: {{ include "kacho-storage.authMode" . | quote }}
  KACHO_STORAGE_GRPC_PORT: {{ .Values.ports.public | quote }}
  KACHO_STORAGE_INTERNAL_PORT: {{ .Values.ports.internal | quote }}
  KACHO_STORAGE_METRICS_ADDR: {{ printf ":%v" .Values.ports.metrics | quote }}
  KACHO_STORAGE_DB_HOST: {{ .Values.db.host | quote }}
  KACHO_STORAGE_DB_PORT: {{ .Values.db.port | quote }}
  KACHO_STORAGE_DB_USER: {{ .Values.db.user | quote }}
  KACHO_STORAGE_DB_NAME: {{ .Values.db.name | quote }}
  KACHO_STORAGE_DB_SSLMODE: {{ .Values.db.sslMode | quote }}
  # Ширина пула на ОДНУ реплику. Общий configmap читают оба контейнера, и это
  # безопасно: `MigrateDSN` строит строку без пуловых параметров (config.go),
  # поэтому миграционный шаг значение просто не увидит.
  KACHO_STORAGE_DB_MAX_CONNS: {{ .Values.db.maxConns | quote }}
  KACHO_STORAGE_GEO_GRPC_ADDR: {{ .Values.config.geoGrpcAddr | quote }}
  KACHO_STORAGE_IAM_GRPC_ADDR: {{ .Values.config.iamGrpcAddr | quote }}
  KACHO_STORAGE_AUTHZ_IAM_GRPC_ADDR: {{ .Values.config.authzIamGrpcAddr | quote }}
  # Объявление домена величин: одно на обе полосы ребра. Пустое значение
  # отвергает страж старта — умолчания у него нет by construction.
  KACHO_STORAGE_QUOTA_AUTHORITY: {{ required "quota.authority is required: address host:port or the word not-deployed" .Values.quota.authority | quote }}
  # Круг отправителей, которым разрешено передавать личность конечного пользователя.
  # Пустая строка = «принимаем от любого пира с сертификатом» (контракт corelib), и
  # боевой режим на ней не стартует — см. values.yaml config.trustedForwarderSANs.
  KACHO_STORAGE_AUTHZ_TRUSTED_FORWARDER_SANS: {{ .Values.config.trustedForwarderSANs | quote }}
  # Домен доверия установки: то, чьи сертификаты процесс признаёт своими. Берётся
  # из ТОГО ЖЕ объявления, под которым чеканится его собственный сертификат
  # (certificate.yaml): взятые по отдельности, стороны расходятся молча.
  KACHO_STORAGE_AUTHZ_TRUST_DOMAIN: {{ include "storage.trustDomain" . | quote }}
  KACHO_STORAGE_FGA_REGISTER_DRAINER_ENABLED: {{ .Values.config.fgaRegisterDrainerEnabled | quote }}
  KACHO_STORAGE_LIST_FILTER_ENABLED: {{ .Values.config.listFilter.enabled | quote }}
  KACHO_STORAGE_LIST_FILTER_TIMEOUT_MS: {{ .Values.config.listFilter.timeoutMs | quote }}
  KACHO_STORAGE_LIST_FILTER_CACHE_TTL_MS: {{ .Values.config.listFilter.cacheTtlMs | quote }}
  KACHO_STORAGE_LIST_FILTER_CACHE_MAX_ENTRIES: {{ .Values.config.listFilter.cacheMaxEntries | quote }}
  KACHO_STORAGE_LIST_FILTER_FAIL_OPEN: {{ .Values.config.listFilter.failOpen | quote }}

  # ── Плоскость данных: ЧЕМ обслуживается блочное хранение ──────────────────
  #
  # Ручки объявлены здесь ЦЕЛИКОМ, а не по одной по мере надобности: сервис их
  # читает, и необъявленная ручка означает боевой профиль, который рендерится, но
  # не поднимается — страж старта отказывает на неполной посадке. Такой профиль
  # выглядит исправным ровно до `helm install`.
  #
  # Вид ПУСТОЙ по умолчанию — это «плоскость данных не подключена», и сверщик
  # тогда не запускается вовсе. Вид, объявленный без своего исполнителя в бинаре,
  # роняет старт: принять его и молча ничего не делать значило бы завести
  # сверщик, который каждый проход берёт работу и не двигает её, при здоровом
  # рапорте сервиса и томах, стоящих создаваемыми навсегда.
  KACHO_STORAGE_BLOCK_BACKEND_KIND: {{ .Values.config.blockBackend.kind | quote }}
  # Префикс имени объектов ЭТОГО развёртывания. Отличает наши объекты от объектов
  # соседнего облака в общем кластере хранения; пустой боевой страж не пропускает.
  KACHO_STORAGE_BLOCK_BACKEND_INSTALL_PREFIX: {{ .Values.config.blockBackend.installPrefix | quote }}
  # Каталог, в котором разрешаются ССЫЛКИ на учётный материал. Сам материал сюда
  # не попадает: в ресурсе лежит имя секрета, секрет монтируется, значение не
  # проходит ни через API, ни через БД.
  KACHO_STORAGE_BLOCK_BACKEND_CREDENTIALS_DIR: {{ .Values.config.blockBackend.credentialsDir | quote }}
  # Срок ОДНОГО обращения к плоскости данных. Неположительный недопустим:
  # неотвечающий кластер без срока паркует слот сверщика навсегда.
  KACHO_STORAGE_BLOCK_BACKEND_CALL_TIMEOUT: {{ .Values.config.blockBackend.callTimeout | quote }}
  KACHO_STORAGE_BLOCK_BACKEND_RECONCILE_INTERVAL: {{ .Values.config.blockBackend.reconcileInterval | quote }}
  KACHO_STORAGE_BLOCK_BACKEND_RECONCILE_BATCH: {{ .Values.config.blockBackend.reconcileBatch | quote }}
  # Инструмент и учётная запись в кластере. Названы явно, а не собраны из имени:
  # собранное умолчание всегда непусто и потому выглядит настроенным.
  KACHO_STORAGE_CEPH_RBD_BINARY: {{ .Values.config.blockBackend.ceph.binary | quote }}
  KACHO_STORAGE_CEPH_CLIENT_NAME: {{ .Values.config.blockBackend.ceph.clientName | quote }}
