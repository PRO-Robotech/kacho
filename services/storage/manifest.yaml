# ==========================================================================
#  storage — манифест домена: что модуль объявляет платформе о своих правах.
#
#  Три ресурса блочного хранения, все — умолчательной формы: указатель на проект,
#  умолчательный каскад, три яруса, четыре действия. Авторских отношений и прозы
#  в блоках нет ни одной строки.
#
#  Раздел `resources` порождает блоки типов модели доступов; сверка с каноном
#  `proto/kaname/cloud/iam/v1/fga_model.fga` ПОБАЙТОВАЯ, и её исполнитель — цель
#  `model-canon-check` репозитория PRO-Robotech/kaname; форму документа судит там
#  же `module-manifest-check`. Служба доступа уехала вместе с ними (#2598), и в
#  ЭТОМ дереве обеих сверок не ведёт НИКТО. Остаток назван числом, а не умолчан:
#  предмет — #2613.
#
#  Что о СВОЁМ документе утверждает платформа, не владея его схемой, судится здесь:
#      go test ./internal/repohygiene/ -run TestModuleManifestsOfThePlatformAreReadable -count=1
#      go test ./internal/repohygiene/ -run TestManifestIsNotASecondDeclarationOfARight -count=1
#  А что всякий названный этой шапкой держатель ИСПОЛНИМ в дереве, где она лежит:
#      go test ./internal/repohygiene/ -run TestManifestNamedPredicateIsRunnableInThisTree -count=1
#
#  Что ВЫВОДИТСЯ и здесь не пишется: класс канонического действия — из его
#  имени; умолчательный состав субъектов `[user, service_account, group#member]`;
#  цепочка ярусов admin→editor→viewer от супер-доступа; каскад
#  `super_admin from <первый указатель>`; источник действия — супер-доступ.
#  Названо только то, что от умолчания ОТЛИЧАЕТСЯ.
#
#  ЧЕГО ЗДЕСЬ НЕТ, и это сказано, чтобы манифест не читался как полный.
#
#  Раздела `roles` здесь нет потому, что объявлять нечего: живых системных ролей
#  у модуля НОЛЬ — перепись печатает пакет `internal/moduleroleparity`
#  репозитория PRO-Robotech/kaname; в этом дереве его нет (#2613).
#  Пустой раздел был бы вторым способом сказать то же самое, и он разошёлся бы с
#  деревом молча в день появления первой роли: гейт краснеет, если живая роль
#  модуля не объявлена, а раздел уже есть.
#
#  Раздел `seed` не объявлен НИ ОДНИМ манифестом дерева: посев модулей пишут
#  применённые миграции, и его согласие с живой базой ещё никем не сверяется.
#  Предмет и предикат снятия — задача продукта #1891.
#
#  ИМЯ РЕСУРСА здесь — написание ЗАКРЫТОЙ ТАБЛИЦЫ типов, и оно множественное.
#  Выбрано оно потому, что у него есть ЧИТАТЕЛЬ на пути запроса: проверка правил
#  роли отвергает правило, назвавшее ресурс иначе, и тем же ключом резолвится тип
#  объекта. У написания, выведенного из имени службы, читателя нет ни одного.
#
#  Прежде здесь стояло, что действия этого модуля с каталогом НЕ сопоставляются
#  ни при каком написании. Это было верно в день записи и перестало быть верным:
#  привязка записей каталога переведена на общий словарь (#1884), и не
#  сопоставлено стало 4 действия из 109 вместо 35.
# ==========================================================================

apiVersion: iam/v1
module: storage

resources:

  - name: volumes
    objectType: storage_volume
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete
      - {name: internalAttach, class: update, internal: true}
      - {name: internalDetach, class: update, internal: true}
      - {name: internalGetInternal, class: get, internal: true}
      - {name: internalListAttachments, class: list, internal: true}

  - name: snapshots
    objectType: storage_snapshot
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

  - name: images
    objectType: storage_image
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete
      - {name: internalGetInternal, class: get, internal: true}
      - {name: internalRegister, class: create, internal: true}

# --------------------------------------------------------------------------
#  seed — что заводит УСТАНОВКА модуля (#1891).
#
#  Здесь объявлено то, что у модуля уже лежит в базе, и согласие с ней
#  доказывается ПРОГОНОМ, а не чтением миграций: пакет `internal/moduleseedparity`
#  репозитория PRO-Robotech/kaname. В этом дереве такого прогона нет (#2613).
#
#  ЧЕГО ЗДЕСЬ НЕТ, и это не недосмотр: `groups` и `accessBindings`. Живых строк
#  этих двух видов у модуля НЕТ ни одной, и это утверждение ПРОВЕРЯЕТСЯ: гейт
#  паритета судит все четыре подраздела и печатает по каждому «с владельцем 0».
#
#  `module-quota-readers` и `module-relation-writers` заводит платформа, а модуль
#  в них лишь ВСТУПАЕТ — об этом говорит подраздел `joins` ниже. Почему выдача
#  ОТНОШЕНИЕМ необъявима вовсе, — #1936.
seed:
  serviceAccounts:
    # Личность самого модуля: под ней он ходит к соседям. Назначение взято
    # ДОСЛОВНО у живой строки — применитель кладёт объявленное поверх неё, и
    # расхождение здесь было бы переписыванием того, что уже действует.
    - name: kacho-storage
      account: kacho-system
      description: "Module SA: kacho-storage (SEC-C least-priv)"
  joins:
    # Вступления в ЧУЖИЕ группы: членство заявляет вступающий, а не
    # перечисляет владелец группы — владелец своих потребителей не знает.
    - serviceAccount: {account: kacho-system, name: kacho-storage}
      group: {account: kacho-system, name: module-quota-readers}
      why: "читать действующие пределы своего домена перед списанием (#291)"
    - serviceAccount: {account: kacho-system, name: kacho-storage}
      group: {account: kacho-system, name: module-relation-writers}
      why: "писать кортежи владения через iam, не ходя в хранилище прав напрямую (#914)"
