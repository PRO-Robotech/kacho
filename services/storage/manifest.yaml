# ==========================================================================
#  storage — манифест домена: что модуль объявляет платформе о своих правах.
#
#  Три ресурса блочного хранения, все — умолчательной формы: указатель на проект,
#  умолчательный каскад, три яруса, четыре действия. Авторских отношений и прозы
#  в блоках нет ни одной строки.
#
#  Раздел `resources` порождает блоки типов модели доступов; сверка с каноном
#  `proto/kacho/cloud/iam/v1/fga_model.fga` ПОБАЙТОВАЯ:
#      make -C services/iam model-canon-check
#  Форму документа судит один разбор:
#      make -C services/iam module-manifest-check
#
#  Что ВЫВОДИТСЯ и здесь не пишется: класс канонического действия — из его
#  имени; умолчательный состав субъектов `[user, service_account, group#member]`;
#  цепочка ярусов admin→editor→viewer от супер-доступа; каскад
#  `super_admin from <первый указатель>`; источник действия — супер-доступ.
#  Названо только то, что от умолчания ОТЛИЧАЕТСЯ.
#
#  ЧЕГО ЗДЕСЬ НЕТ, и это сказано, чтобы манифест не читался как полный:
#  разделы `roles` и `seed` не объявлены НИ ОДНИМ манифестом дерева. Роли и
#  посев у модулей есть — их пишут четырнадцать применённых миграций, и
#  действующее состояние не лежит нигде одним куском. `resources` выводится из
#  канона и проверяется побайтовой сверкой, поэтому ошибка в нём невозможна
#  молча; у двух других разделов такого единственного документа нет, а
#  применитель пишет ими живые выдачи. Предмет и предикат снятия — задача
#  продукта #1891.
#
#  ИМЯ РЕСУРСА здесь — написание ЗАКРЫТОЙ ТАБЛИЦЫ типов, и оно множественное.
#  Выбрано оно потому, что у него есть ЧИТАТЕЛЬ на пути запроса: проверка правил
#  роли отвергает правило, назвавшее ресурс иначе, и тем же ключом резолвится тип
#  объекта. У написания, выведенного из имени службы, читателя нет ни одного.
#
#  Прежде здесь стояло, что действия этого модуля с каталогом НЕ сопоставляются
#  ни при каком написании. Это было верно в день записи и перестало быть верным:
#  привязка записей каталога переведена на общий словарь (#1884), и не
#  сопоставлено стало 4 действия из 109 вместо 35.
# ==========================================================================

apiVersion: iam/v1
module: storage

resources:

  - name: volumes
    objectType: storage_volume
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

  - name: snapshots
    objectType: storage_snapshot
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

  - name: images
    objectType: storage_image
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete
