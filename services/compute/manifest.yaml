# ==========================================================================
#  compute — манифест домена: что модуль объявляет платформе о своих правах.
#
#  Машина несёт два авторских отношения доступа к ней (`ssh`, `console`) и одно
#  служебное (`realization_writer`) — ни под одним из трёх RPC нет.
#
#  Раздел `resources` порождает блоки типов модели доступов; сверка с каноном
#  `proto/kacho/cloud/iam/v1/fga_model.fga` ПОБАЙТОВАЯ:
#      make -C services/iam model-canon-check
#  Форму документа судит один разбор:
#      make -C services/iam module-manifest-check
#
#  Что ВЫВОДИТСЯ и здесь не пишется: класс канонического действия — из его
#  имени; умолчательный состав субъектов `[user, service_account, group#member]`;
#  цепочка ярусов admin→editor→viewer от супер-доступа; каскад
#  `super_admin from <первый указатель>`; источник действия — супер-доступ.
#  Названо только то, что от умолчания ОТЛИЧАЕТСЯ.
#
#  ЧЕГО ЗДЕСЬ НЕТ, и это сказано, чтобы манифест не читался как полный:
#  разделы `roles` и `seed` не объявлены НИ ОДНИМ манифестом дерева. Роли и
#  посев у модулей есть — их пишут четырнадцать применённых миграций, и
#  действующее состояние не лежит нигде одним куском. `resources` выводится из
#  канона и проверяется побайтовой сверкой, поэтому ошибка в нём невозможна
#  молча; у двух других разделов такого единственного документа нет, а
#  применитель пишет ими живые выдачи. Предмет и предикат снятия — задача
#  продукта #1891.
# ==========================================================================

apiVersion: iam/v1
module: compute

resources:

  - name: instance
    objectType: compute_instance
    parents: [project]
    producer: derived
    notes:
      - before: realization_writer
        text: |
          # realization_writer — входящий канал плоскости исполнения:
          # `InternalRealizationService/ReportInstanceRealization` (:9091, взаимный TLS).
          #
          # Отношение объявлено ЗДЕСЬ, потому что каталог прав его ТРЕБУЕТ. Запись
          # каталога, ссылающаяся на отношение, которого нет в модели, — не «строгий по
          # умолчанию отказ», а сломанная по построению проверка: хранилище прав
          # отвергает такой вопрос как ошибку модели, и RPC отказывает КАЖДОМУ
          # предъявителю. Тот же класс уже стоил трёх разборов (`nlb_listener`
          # `project`, `storage_*`, `nlb` `announce_writer`).
          #
          # Носитель — ТОЛЬКО исполнитель этой машины. Право не выдаётся заранее и не
          # распространяется на облако: оно материализуется вместе с обменом владением
          # (узел взял машину) и снимается вместе с ним. Иначе предъявитель
          # сертификата отчитывался бы о ЛЮБОЙ машине облака, а наблюдаемое состояние —
          # это то, на что опирается решение о перезапуске.
          #
          # Арендатор его не получает ни при какой роли: наблюдаемое сообщает
          # исполнитель, и возможность «сообщить о себе» сделала бы факт исполнителя
          # управляемым извне.
    relations:
      - name: ssh
        definition: '[user with mfa_fresh, service_account] or admin'
      - name: console
        definition: '[user with mfa_fresh] or admin'
      - name: realization_writer
        definition: '[service_account]'
        position: afterVerbs
    verbs:
      - get
      - list
      - update
      - delete

  - name: guestAccessKey
    objectType: compute_guest_access_key
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

  - name: placementGroup
    objectType: compute_placement_group
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete
