# ==========================================================================
#  compute — манифест домена: что модуль объявляет платформе о своих правах.
#
#  Машина несёт два авторских отношения доступа к ней (`ssh`, `console`) и одно
#  служебное (`realization_writer`) — ни под одним из трёх RPC нет.
#
#  Раздел `resources` порождает блоки типов модели доступов; сверка с каноном
#  `proto/kacho/cloud/iam/v1/fga_model.fga` ПОБАЙТОВАЯ:
#      make -C services/iam model-canon-check
#  Форму документа судит один разбор:
#      make -C services/iam module-manifest-check
#
#  Что ВЫВОДИТСЯ и здесь не пишется: класс канонического действия — из его
#  имени; умолчательный состав субъектов `[user, service_account, group#member]`;
#  цепочка ярусов admin→editor→viewer от супер-доступа; каскад
#  `super_admin from <первый указатель>`; источник действия — супер-доступ.
#  Названо только то, что от умолчания ОТЛИЧАЕТСЯ.
#
#  ЧЕГО ЗДЕСЬ НЕТ, и это сказано, чтобы манифест не читался как полный.
#
#  РАЗДЕЛ `roles` ЗДЕСЬ ЕСТЬ — внизу файла. Он объявляет то, что у модуля уже
#  лежит в базе, и согласие с ней доказывается ПРОГОНОМ, а не чтением:
#      go test ./services/iam/internal/moduleroleparity/
#
#  Здесь стояло «раздел `roles` этот манифест НЕ объявляет, и это не недосмотр:
#  3 из 3 живых ролей несут назначение короче предела прозы». Утверждение было
#  верно и снято вместе со своим ОСНОВАНИЕМ, а не обойдено: предел выносил
#  приговор по длине имени типа (`Admin RouteTable` 16 знаков проходило,
#  `Edit RouteTable` 15 — нет) и делал 27 живых ролей из 42 невыразимыми ни при
#  каком написании. Величина предела и довод обеими сторонами —
#  `services/iam/internal/manifest/roles.go`, `minRoleDescriptionRunes` (#1904).
#  ВЕДОМОСТЬ ГЕЙТА ПУСТА, и это перемерено, а не унаследовано: живые роли
#  объявили все четыре модуля, у которых они есть, — `compute` (3 из 3),
#  `iam` (19 из 19), `loadbalancer` (2 из 2), `vpc` (18 из 18); всего 42 роли
#  из 48 живых кластерных, остальные шесть модуля-владельца не имеют
#  by construction. У `iam` было своё, ВТОРОЕ основание отсрочки — две роли
#  называли класс без пригодных действий; правила приведены миграцией
#  20260902180800 (#1916).
#
#  Раздел `seed` не объявлен НИ ОДНИМ манифестом дерева: посев модулей пишут
#  применённые миграции, и его согласие с живой базой ещё никем не сверяется.
#  Предмет и предикат снятия — задача продукта #1891.
# ==========================================================================

apiVersion: iam/v1
module: compute

resources:

  - name: instance
    objectType: compute_instance
    parents: [project]
    producer: derived
    notes:
      - before: realization_writer
        text: |
          # realization_writer — входящий канал плоскости исполнения:
          # `InternalRealizationService/ReportInstanceRealization` (:9091, взаимный TLS).
          #
          # Отношение объявлено ЗДЕСЬ, потому что каталог прав его ТРЕБУЕТ. Запись
          # каталога, ссылающаяся на отношение, которого нет в модели, — не «строгий по
          # умолчанию отказ», а сломанная по построению проверка: хранилище прав
          # отвергает такой вопрос как ошибку модели, и RPC отказывает КАЖДОМУ
          # предъявителю. Тот же класс уже стоил трёх разборов (`nlb_listener`
          # `project`, `storage_*`, `nlb` `announce_writer`).
          #
          # Носитель — ТОЛЬКО исполнитель этой машины. Право не выдаётся заранее и не
          # распространяется на облако: оно материализуется вместе с обменом владением
          # (узел взял машину) и снимается вместе с ним. Иначе предъявитель
          # сертификата отчитывался бы о ЛЮБОЙ машине облака, а наблюдаемое состояние —
          # это то, на что опирается решение о перезапуске.
          #
          # Арендатор его не получает ни при какой роли: наблюдаемое сообщает
          # исполнитель, и возможность «сообщить о себе» сделала бы факт исполнителя
          # управляемым извне.
    relations:
      - name: ssh
        definition: '[user with mfa_fresh, service_account] or admin'
      - name: console
        definition: '[user with mfa_fresh] or admin'
      - name: realization_writer
        definition: '[service_account]'
        position: afterVerbs
    verbs:
      - get
      - list
      - update
      - delete

  - name: guestAccessKey
    objectType: compute_guest_access_key
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

  - name: placementGroup
    objectType: compute_placement_group
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - update
      - delete

# --------------------------------------------------------------------------
#  roles — системные роли модуля, объявленные ДАННЫМИ (#1891, #1904).
#
#  Писатель этих строк — применитель манифеста, а не миграция: он приводит
#  `kacho_iam.roles` к объявленному здесь состоянию. Согласие объявления с живой
#  базой держит ПРОГОН, а не чтение:
#      go test ./services/iam/internal/moduleroleparity/
#  Гейт поднимает Postgres, играет цепочку миграций дерева и сравнивает строки
#  с тем, что произвёл бы применитель ИЗ ЭТОГО раздела. Расхождение по
#  идентификатору, назначению либо праву — находка с именем роли.
#
#  Почему `description` по-английски и почему его нельзя «причесать»: текст
#  сверяется с живой строкой ДОСЛОВНО. Применитель пишет его как есть, поэтому
#  правка здесь — правка того, что читает арендатор, выбирая роль; она идёт
#  своим решением и своей миграцией, а не попутно с объявлением. Ровно поэтому
#  предел длины назначения равен ОДНОМУ знаку, а не шестнадцати, как у прочей
#  прозы манифеста: длина выносила приговор по длине имени типа и делала
#  двадцать семь живых ролей из сорока двух невыразимыми (#1904).
#
#  Почему правила перечислены В ЭТОМ порядке и не отсортированы: `rules` —
#  упорядоченное поле хранимой формы, и применитель кладёт его дословно.
#  Пересортировав, объявление разошлось бы со строкой, ничего не изменив по
#  существу. По той же причине `classes` у чтения записаны `[list, get]`, а не
#  `[get, list]`: так их написала применённая миграция.
#
#  Ключ права — `classes`; `verbs` снят и отвергается явно. Подстановка `"*"`
#  законна ровно потому, что роль системная: у неё она значит «все классы типа».
# --------------------------------------------------------------------------

roles:

  - id: compute.instance.admin
    description: "Admin Instance"
    tier:
      tierType: iam.cluster
      tierId: cluster_kacho_root
    rules:
      - module: compute
        resources: [instance]
        classes: ["*"]

  - id: compute.instance.edit
    description: "Edit Instance"
    tier:
      tierType: iam.cluster
      tierId: cluster_kacho_root
    rules:
      - module: compute
        resources: [instance]
        classes: [get, list, update]

  - id: compute.instance.view
    description: "Read Instance"
    tier:
      tierType: iam.cluster
      tierId: cluster_kacho_root
    rules:
      - module: compute
        resources: [instance]
        classes: [list, get]

# --------------------------------------------------------------------------
#  seed — что заводит УСТАНОВКА модуля (#1891).
#
#  Здесь объявлено то, что у модуля уже лежит в базе, и согласие с ней
#  доказывается ПРОГОНОМ, а не чтением миграций:
#      go test ./services/iam/internal/moduleseedparity/
#
#  ЧЕГО ЗДЕСЬ НЕТ, и это не недосмотр: `groups` и `accessBindings`. Группы
#  платформы (`module-quota-readers`, `module-relation-writers`) заводит iam, а
#  не этот модуль; выдачи же, которыми они наделены, — выдачи ОТНОШЕНИЕМ
#  (`quota_reader`, `fga_writer`), и ключа для отношения у `seed.accessBindings`
#  нет ни одного: форма требует `roleId`. Живых выдач РОЛЬЮ, которые завела бы
#  установка модуля, в базе ноль. Разбор и числа — #1936; гейт паритета считает
#  такие строки отдельно и печатает их число, поэтому граница видна, а не
#  подразумевается.
seed:
  serviceAccounts:
    # Личность самого модуля: под ней он ходит к соседям. Назначение взято
    # ДОСЛОВНО у живой строки — применитель кладёт объявленное поверх неё, и
    # расхождение здесь было бы переписыванием того, что уже действует.
    - name: kacho-compute
      account: kacho-system
      description: "Module SA: kacho-compute (SEC-C least-priv)"
  joins:
    # Вступления в ЧУЖИЕ группы: членство заявляет вступающий, а не
    # перечисляет владелец группы — владелец своих потребителей не знает.
    - serviceAccount: {account: kacho-system, name: kacho-compute}
      group: {account: kacho-system, name: module-quota-readers}
      why: "читать действующие пределы своего домена перед списанием (#291)"
    - serviceAccount: {account: kacho-system, name: kacho-compute}
      group: {account: kacho-system, name: module-relation-writers}
      why: "писать кортежи владения через iam, не ходя в хранилище прав напрямую (#914)"
