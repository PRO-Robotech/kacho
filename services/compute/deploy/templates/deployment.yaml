apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: kacho
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        # ── ОБЪЯВЛЕНИЕ СБОРА ВЕЛИЧИН ──────────────────────────────────────────
        #
        # Поверхность процесса (`GET /metrics`) поднята и отвечает — и до этой
        # аннотации к ней НИКТО НЕ ПРИХОДИЛ. Поднятая поверхность без того, кто
        # её читает, неотличима от отсутствующей: это та же форма без содержания,
        # только этажом выше.
        #
        # Аннотация пода, а не описатель сбора: описателя обслуживает оператор
        # сбора, а типа его ресурса в этом кластере нет. Аннотацию читают агенты
        # обоих семейств и обращаются к ПОДУ напрямую — поэтому порт в Service и
        # `containerPort` для сбора не нужны и здесь не заводятся.
        #
        # Порт обязан совпадать с адресом, который процесс берёт из своей
        # конфигурации; это сверяет декларативная проверка
        # `TestEveryRenderedChartDeclaresItsScrape`, читающая ОБЪЯВЛЕНИЯ, а не
        # отрендеренный манифест.
        {{- if .Values.metricsScrape.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsScrape.port | quote }}
        prometheus.io/path: /metrics
        {{- else }}
        # Сбор выключен ОБЪЯВЛЕНИЕМ, и причина едет в кластер вместе с подом:
        # оператор, увидевший процесс без объявления сбора, обязан прочитать
        # ПОЧЕМУ, а не гадать, забыли ли. Пустая причина при выключенном сборе —
        # находка декларативной проверки, а не пустая строка.
        kacho.cloud/metrics-scrape-disabled-because: {{ .Values.metricsScrape.disabledBecause | quote }}
        {{- end }}
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ОБРАЗА.
        #
        # Тег локального образа (`kacho-*:dev`) неизменен, поэтому пересборка под
        # тем же тегом НЕ меняет шаблон пода: Kubernetes не видит разницы и под не
        # перекатывается — процесс продолжает работать СТАРЫМ бинарником под новым
        # тегом. Ровно тот же разрыв между намерением и исходом, что и у настроек,
        # приезжающих массовым импортом (инцидент 2026-07-25), и лечится он так же —
        # аннотацией, привязанной к содержимому.
        #
        # Значение — идентификатор содержимого образа; его пишет `make build-services`
        # в helm/umbrella/values.image-ids.yaml сразу после сборки. Профиль, который
        # этот файл не накладывает (offline-рендер, чужой реестр), получает "unset" —
        # и тогда привязки нет, что честно: привязывать не к чему.
        kacho.cloud/image-id: {{ dig "kachoImageIds" "compute" "unset" (.Values.global | default dict) | quote }}
    spec:
      # INFRA sec-hardening (2026-07-16) — единый floor, идентичный kaname.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/usr/local/bin/kacho-migrator", "up"]
          env:
            - name: KACHO_COMPUTE_DB_HOST
              value: "{{ .Values.db.host }}"
            - name: KACHO_COMPUTE_DB_PORT
              value: "{{ .Values.db.port }}"
            - name: KACHO_COMPUTE_DB_USER
              value: "{{ .Values.db.user }}"
            - name: KACHO_COMPUTE_DB_NAME
              value: "{{ .Values.db.name }}"
            # SEC: migrator DB channel must be TLS too (same sslMode as serve).
            - name: KACHO_COMPUTE_DB_SSLMODE
              value: {{ .Values.db.sslMode | quote }}
            - name: KACHO_COMPUTE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/kacho-compute", "serve"]
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: grpc-internal
              containerPort: {{ .Values.ports.internalGrpc }}
            # Диагностическая поверхность (/metrics, /healthz, /readyz). Порт
            # объявляется здесь, потому что по нему идут пробы: без записи в
            # `ports:` его нельзя назвать именем, и оператор, ищущий, куда
            # постучаться за причиной неготовности, не находит его в описании
            # пода вовсе.
            - name: metrics
              containerPort: {{ .Values.metricsScrape.port }}
          env:
            - name: KACHO_COMPUTE_DB_HOST
              value: "{{ .Values.db.host }}"
            - name: KACHO_COMPUTE_DB_PORT
              value: "{{ .Values.db.port }}"
            - name: KACHO_COMPUTE_DB_USER
              value: "{{ .Values.db.user }}"
            - name: KACHO_COMPUTE_DB_NAME
              value: "{{ .Values.db.name }}"
            - name: KACHO_COMPUTE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
            # Ширина пула на ЭТУ реплику. Стоит только у обслуживающего
            # контейнера: миграционный шаг открывает одно соединение и живёт
            # секунды, а `pool_max_conns` в его DSN сузил бы не тот предмет.
            - name: KACHO_COMPUTE_DB_MAX_CONNS
              value: "{{ .Values.db.maxConns }}"
            - name: KACHO_COMPUTE_GRPC_PORT
              value: "{{ .Values.ports.grpc }}"
            - name: KACHO_COMPUTE_INTERNAL_PORT
              value: "{{ .Values.ports.internalGrpc }}"
            # ─── SEC auth posture — arms fail-closed production gates ──────
            # cmd/compute/main.go::validateAuthMode + requireDBSSLMode +
            # Config.Validate (круг отправителей) + RequireIAM boot-gate. Chart defaults to
            # production (rules/security.md: every deploy is production-mode); a
            # dev stand overrides auth.mode=dev + mtls.enable=false + db.sslMode=disable.
            - name: KACHO_COMPUTE_AUTH_MODE
              value: {{ include "kacho-compute.authMode" . | quote }}
            - name: KACHO_COMPUTE_DB_SSLMODE
              value: {{ .Values.db.sslMode | quote }}
            - name: KACHO_COMPUTE_REQUIRE_IAM
              value: {{ .Values.auth.requireIAM | quote }}
            {{- with .Values.auth.trustedForwarderSANs }}
            - name: KACHO_COMPUTE_AUTHZ_TRUSTED_FORWARDER_SANS
              value: {{ . | quote }}
            {{- end }}
            # KAC-106 (E1): peer for project-existence switched to kaname.
            - name: KACHO_COMPUTE_IAM_GRPC_ADDR
              value: "{{ .Values.iamAddr }}"
            {{- if .Values.mtls.enable }}
            {{- $srv := printf "%s/server" .Values.mtls.mountPath }}
            {{- $cli := printf "%s/client" .Values.mtls.mountPath }}
            # SEC-F mTLS server-creds (both listeners) — corelib grpcsrv.TLSServer
            # via config.LoadPrefixed("KACHO_COMPUTE"). ca.crt = client-CA bundle.
            - name: KACHO_COMPUTE_PUBLIC_SERVER_MTLS_ENABLE
              value: "true"
            - name: KACHO_COMPUTE_PUBLIC_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KACHO_COMPUTE_PUBLIC_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KACHO_COMPUTE_PUBLIC_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            - name: KACHO_COMPUTE_INTERNAL_SERVER_MTLS_ENABLE
              value: "true"
            - name: KACHO_COMPUTE_INTERNAL_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KACHO_COMPUTE_INTERNAL_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KACHO_COMPUTE_INTERNAL_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- if .Values.mtls.edges.iamRegister }}
            # compute→iam (register-drainer) client-creds — grpcclient.TLSClient.
            - name: KACHO_COMPUTE_IAM_REGISTER_MTLS_ENABLE
              value: "true"
            - name: KACHO_COMPUTE_IAM_REGISTER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_COMPUTE_IAM_REGISTER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_COMPUTE_IAM_REGISTER_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_COMPUTE_IAM_REGISTER_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.iamRegister | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.iamProject }}
            # SEC-I compute→iam ProjectService.Get (existence/leaf-owner, public
            # :9090) client-creds — grpcclient.TLSClient. ServerName=kaname (∈ SAN).
            - name: KACHO_COMPUTE_IAM_PROJECT_MTLS_ENABLE
              value: "true"
            - name: KACHO_COMPUTE_IAM_PROJECT_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_COMPUTE_IAM_PROJECT_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_COMPUTE_IAM_PROJECT_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_COMPUTE_IAM_PROJECT_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.iamProject | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.iamAuthz }}
            # SEC-I compute→iam Check + FGA-filtered List (internal :9091)
            # client-creds. ServerName=kaname-internal (∈ SAN).
            - name: KACHO_COMPUTE_IAM_AUTHZ_MTLS_ENABLE
              value: "true"
            - name: KACHO_COMPUTE_IAM_AUTHZ_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_COMPUTE_IAM_AUTHZ_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_COMPUTE_IAM_AUTHZ_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_COMPUTE_IAM_AUTHZ_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.iamAuthz | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.vpc }}
            # compute→vpc — ДВА провода, оба под одним ключом edges.vpc: они делят
            # один клиентский сертификат, один CA и один Service `vpc`, чей
            # server-cert покрывает оба порта, поэтому включать их врозь нечего.
            #
            # Провод 1 — SubnetService.Get на ПУБЛИЧНОМ :9090 (placement-валидация
            # подсети NIC-спеки на Instance.Create). Группа VPC_MTLS.
            - name: KACHO_COMPUTE_VPC_MTLS_ENABLE
              value: "true"
            - name: KACHO_COMPUTE_VPC_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_COMPUTE_VPC_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_COMPUTE_VPC_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_COMPUTE_VPC_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.vpc | quote }}
            # Провод 2 — InternalNetworkInterfaceService на ВНУТРЕННЕМ :9091
            # (привязка/снятие интерфейса и его высвобождение на удалении машины).
            # Группа VPC_NIC_MTLS. Листенер :9091 требует проверенный клиентский
            # сертификат, поэтому без этой группы ребро не «слабее защищено», а не
            # работает вовсе: дозвон открытым текстом обрывается на рукопожатии и
            # возвращается вызывающему как codes.Unavailable. Парность объявления
            # и производителя держит гейт peer_mtls_producer_test.go.
            - name: KACHO_COMPUTE_VPC_NIC_MTLS_ENABLE
              value: "true"
            - name: KACHO_COMPUTE_VPC_NIC_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_COMPUTE_VPC_NIC_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_COMPUTE_VPC_NIC_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_COMPUTE_VPC_NIC_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.vpc | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.geo }}
            # kacho-geo epic (Stage S4) — compute→geo (geo.v1.ZoneService.Get,
            # Instance.zone_id validation, public :9090) client-creds. Reuses the same
            # kacho-compute-client-tls SPIFFE cert as the vpc/iam edges (one client cert
            # per consumer, all edges). ServerName=kacho-geo (∈ geo server-cert SAN).
            - name: KACHO_COMPUTE_GEO_MTLS_ENABLE
              value: "true"
            - name: KACHO_COMPUTE_GEO_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_COMPUTE_GEO_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_COMPUTE_GEO_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_COMPUTE_GEO_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.geo | quote }}
            {{- end }}
            {{- if .Values.mtls.edges.storage }}
            # compute/storage split — compute→storage (storage.v1.InternalVolumeService
            # Attach/Detach, volume↔Instance attach-saga, internal :9091) client-creds.
            # Reuses the same kacho-compute-client-tls SPIFFE leaf as the vpc/geo/iam
            # edges. ServerName=kacho-storage (∈ storage server-cert SAN serverHosts).
            - name: KACHO_COMPUTE_STORAGE_MTLS_ENABLE
              value: "true"
            - name: KACHO_COMPUTE_STORAGE_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KACHO_COMPUTE_STORAGE_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KACHO_COMPUTE_STORAGE_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            - name: KACHO_COMPUTE_STORAGE_MTLS_SERVERNAME
              value: {{ .Values.mtls.serverName.storage | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # KAC-127: KACHO_COMPUTE_RESOURCE_MANAGER_GRPC_ADDR удалён — RM-fallback убран.
            - name: KACHO_COMPUTE_VPC_GRPC_ADDR
              value: "{{ .Values.vpcAddr }}"
            - name: KACHO_COMPUTE_VPC_INTERNAL_GRPC_ADDR
              value: "{{ .Values.vpcInternalAddr }}"
            # kacho-geo epic (Stage S4): compute→geo dial host (geo.v1.ZoneService.Get,
            # Instance.zone_id validation). config.go cfg.GeoGRPCAddr — public :9090.
            - name: KACHO_COMPUTE_GEO_GRPC_ADDR
              value: "{{ .Values.geoAddr }}"
            # compute/storage split: compute→storage dial host (storage.v1.
            # InternalVolumeService Attach/Detach, volume↔Instance attach-saga). config.go
            # cfg.StorageInternalGRPCAddr — internal :9091. Empty "" (present) →
            # NoopStorageClient (attach fail-closed; used by storage-less dev profiles).
            - name: KACHO_COMPUTE_STORAGE_INTERNAL_GRPC_ADDR
              value: "{{ .Values.storageInternalAddr }}"
            - name: KACHO_COMPUTE_SKIP_PEER_VALIDATION
              value: "{{ .Values.skipPeerValidation }}"
            # KAC-127 Phase 4 — FGA-filtered List + per-RPC authz endpoint.
            {{- with .Values.authzIam }}
            - name: KACHO_COMPUTE_AUTHZ_IAM_GRPC_ADDR
              value: "{{ .grpcAddr }}"
            {{- end }}
            {{- with .Values.listFilter }}
            - name: KACHO_COMPUTE_LIST_FILTER_ENABLED
              value: "{{ .enabled }}"
            - name: KACHO_COMPUTE_LIST_FILTER_TIMEOUT_MS
              value: "{{ .timeoutMs }}"
            - name: KACHO_COMPUTE_LIST_FILTER_CACHE_TTL_MS
              value: "{{ .cacheTtlMs }}"
            - name: KACHO_COMPUTE_LIST_FILTER_CACHE_MAX_ENTRIES
              value: "{{ .cacheMaxEntries }}"
            - name: KACHO_COMPUTE_LIST_FILTER_FAIL_OPEN
              value: "{{ .failOpen }}"
            {{- end }}
            # Потолок ОДНОВРЕМЕННЫХ потоков подписки. Рендерится НАПРЯМУЮ, без
            # умолчания в шаблоне: второе умолчание пережило бы снятие ключа из
            # values.yaml, правка одного объявления не имела бы силы, а величина
            # молча стала бы нулём — на нём страж старта отказывает, называя ручку.
            - name: KACHO_COMPUTE_SUBSCRIPTION_MAX_STREAMS
              value: "{{ .Values.subscription.maxStreams }}"
          volumeMounts:
            # Writable scratch для read-only-rootfs (безусловно: rootfs read-only
            # независимо от mtls).
            - name: tmp
              mountPath: /tmp
          {{- if .Values.mtls.enable }}
            # SEC-F mTLS — cert-manager internal-CA server + client secrets in
            # separate dirs (req #5). cert-manager writes tls.crt/tls.key/ca.crt.
            - name: mtls-server
              mountPath: {{ printf "%s/server" .Values.mtls.mountPath | quote }}
              readOnly: true
            - name: mtls-client
              mountPath: {{ printf "%s/client" .Values.mtls.mountPath | quote }}
              readOnly: true
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          # ГОТОВНОСТЬ СПРАШИВАЕТСЯ ПО ТОМУ, ЧТО СЕРВИС СТРОИТ. `/readyz` собирает
          # чекеры критичных зависимостей — коннект к базе, boot-gate дренера
          # регистраций (KACHO_COMPUTE_REQUIRE_IAM), живой LRO-worker. Страница
          # развёртывания прямо обещает оператору «сервис NotReady», пока дренер не
          # связался с kaname; прежде здесь стоял `tcpSocket: grpc`, и обещанное
          # не наступало ни при каких условиях: compute отвергал каждый мутирующий
          # Create, а под рапортовал 1/1 Running Ready.
          #
          # Живость НЕ включает зависимости намеренно: `/healthz` — чистая живость
          # (agg.LiveHandler), иначе деградация соседа вызывала бы restart-storm.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
      # volumes БЕЗУСЛОВНЫ: /tmp нужен всегда, потому что rootfs read-only независимо от
      # mtls. Раньше блок был гейтован условием по ручкам — и при выключенных (ровно
      # профиль umbrella-фазы 1, MTLS_OFF) том исчезал, а volumeMounts на него оставался
      # → `Deployment.apps "compute" is invalid: volumeMounts[0].name: Not found: "tmp"`.
      # Standalone `helm template` этого не показывал: там дефолтные values, где ручки
      # включены.
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.mtls.enable }}
        # SEC-F mTLS — cert-manager internal-CA secrets (server + client).
        - name: mtls-server
          secret:
            secretName: {{ .Values.mtls.serverSecretName | quote }}
        - name: mtls-client
          secret:
            secretName: {{ .Values.mtls.clientSecretName | quote }}
        {{- end }}
