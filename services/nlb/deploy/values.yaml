# ─── Workload identity / image ────────────────────────────────────────────────
name: kacho-nlb
namespace: kacho
replicas: 1

image:
  repository: docker.io/prorobotech/kacho-nlb
  tag: ""          # defaults to .Chart.AppVersion via _helpers.tpl
  pullPolicy: IfNotPresent
imagePullSecrets: []   # e.g. [{ name: registry-creds }]

# Override labels merged into all generated objects.
extraLabels: {}
# Annotations merged into the Deployment pod template.
podAnnotations: {}

# ─── Ports ────────────────────────────────────────────────────────────────────
ports:
  grpc: 9090            # public gRPC (clients → api-gateway → here)
  internalGrpc: 9091    # cluster-internal gRPC (peer services + Watch)
  metrics: 9101         # Prometheus /metrics

# ─── Service account / RBAC ───────────────────────────────────────────────────
serviceAccount:
  # Set false to skip creating a SA and bind to an existing one via .name.
  create: true
  # If unset, defaults to .Values.name.
  name: ""
  annotations: {}

rbac:
  # Minimal RBAC: kacho-nlb only reads its own ConfigMap + Secret. Disabled by
  # default because most clusters give SAs read-access automatically; flip to
  # true for strict pod-security clusters.
  create: false

# ─── Pod-level security ──────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ─── Config (mounted at /etc/kacho-nlb/config.yaml) ───────────────────────────
config:
  logger:
    level: INFO               # FATAL | ERROR | WARN | INFO | DEBUG
  apiServer:
    gracefulShutdown: 10s
    grpcGwEnable: false       # gRPC-gateway lives in kacho-api-gateway
    # Upper bound on handling ONE call, set by the shared serving carrier on the
    # incoming context. Mandatory: a call with no deadline holds a pooled DB
    # connection for as long as its query runs, so pool_max_conns such calls take
    # the whole service down (CWE-770).
    handlingBudget: 30s
  authn:
    type: none                # none | tls
    # When type=tls fill these:
    # tls:
    #   keyFile: /etc/kacho-nlb/tls/tls.key
    #   certFile: /etc/kacho-nlb/tls/tls.crt
    #   client:
    #     verify: skip        # skip | certs-required | verify
    #     caFiles: []
  authz:
    cache:
      enable: true
      ttl: 5s
    # Sustained rate (per second, per principal) of the authorization checks the
    # verdict cache does NOT absorb: denials, no-path misses, model outages.
    # Beyond it the decision link answers ResourceExhausted without asking
    # kacho-iam — it sheds the denial storm off the neighbour. Must be > 0:
    # a non-positive value reads as "no limit" to the mechanism, so the cut-off
    # would switch itself off silently.
    denyBudgetPerSec: 100
    # RBAC sub-phase D §11 (issue #111): per-object filtered List via kacho-iam
    # AuthorizeService.BatchCheck (reuse peers.iam conn). default on.
    # fail-closed (security.md) — failOpen=false; iam down → List → UNAVAILABLE.
    listFilter:
      enabled: true
      # per-call deadline of ONE iam.BatchCheck (NOT the whole-filter budget,
      # which authzfilter derives). 1s: page batches fan out bounded (5), so the
      # max-page worst case is 4 waves, not 20 sequential hops.
      timeout: 1s
      cacheTtl: 5s
      cacheMaxEntries: 10000
      failOpen: false
    # Anti-impersonation allow-list: cert-identity SANs permitted to forward the
    # end-user principal (x-kacho-principal-*). Empty list = trust ANY mTLS-verified
    # peer (back-compat), which is a confused-deputy vector in a shared mTLS mesh.
    # REQUIRED (non-empty) when mode=production AND mtls.enable=true — usually the
    # api-gateway SPIFFE SAN, e.g. ["spiffe://kacho.cloud/ns/kacho/sa/api-gateway"].
    trustedForwarderSANs: []
  fga:
    endpoint: ""              # OpenFGA HTTP/gRPC endpoint (empty → tuple-write disabled)
    storeId: ""
    modelId: ""
    # requireIam — fail-closed загрузочный гейт. true → мутирующий Create
    # отвергается (UNAVAILABLE), а под остаётся NotReady, пока register-drainer
    # не подключён к kacho-iam: ресурс не создаётся, пока его намерение о
    # владении некуда доставить. Иначе созданный в этом окне балансировщик
    # остаётся без владельца, а его создатель получает отказ на своём ресурсе.
    #
    # Гейт был написан, провязан в пробу готовности и в цепочку интерсепторов —
    # и не исполнялся ни разу, потому что ручку не выставлял ни один профиль.
    # Эта строка и есть его производитель; без неё код гейта — мёртвая ветка.
    #
    # Умолчание true: посадка, которая ручку не тронула, обязана получать
    # защиту, а не терять её молча. Путь доставки поднимается при непустом
    # peers.iam.internalAddr — он непуст по умолчанию, поэтому взведённый гейт
    # открывается сразу после старта дренажа.
    requireIam: true
    tupleWrite:
      timeout: 2s
      maxRetries: 3
  jobs:
    targetDrain:
      interval: 10s
  repository:
    postgres:
      # Ширина пула pgx на ОДНУ реплику и потолок жизни соединения. Доезжают до
      # пула через config.DSN() (`pool_max_conns` / `pool_max_conn_lifetime`).
      #
      # ЗДЕСЬ СТОЯЛ НОЛЬ, и это не «ширина ноль», а «действует умолчание
      # драйвера» — `max(4, число ядер УЗЛА)` (#709). Величину никто не
      # выбирал, она меняется от смены узла без единой правки дерева, а
      # произведение «пул × потолок подов» при ней не проверить ничем: ноль в
      # сомножителе обращает его в ноль и проходит любую проверку.
      #
      # 15 — из арифметики: pg-nlb объявляет `max_connections = 100` на боевых
      # профилях (200 на стенде разработки), минус 3 слота суперпользователя =
      # 97 отдаваемых. Автомасштабирование ниже объявлено и ВЫКЛЮЧЕНО, поэтому
      # действующий потолок подов — `replicas` = 1; величина выбрана так, чтобы
      # его включение (`maxReplicas` = 5) тоже помещалось: 15 × 5 = 75 ≤ 97.
      #
      # Своей глубины для nlb НЕ ИЗМЕРЕНО. Произведение проверяет
      # deploy/pool_fits_database_test.go — он читает и это число, и блок
      # автомасштабирования.
      maxConns: 15
      connLifetime: 0s

# ─── Database (PostgreSQL `kacho_nlb` schema) ─────────────────────────────────
db:
  host: kacho-pg-nlb
  port: 5432
  user: kacho_nlb
  name: kacho_nlb
  # `sslmode` and `search_path` are appended automatically in the helper.
  # Production fail-closed (config.Validate, audit SEC #1): mode=production
  # rejects disable/allow/prefer — the DB connection must be TLS. Override to
  # `disable` only for a dev-mode (mode=dev) stand.
  sslMode: require
  # Either set `existingSecret` to bind an out-of-chart Secret, or let the chart
  # create one from `password` (the latter is dev-only — do NOT commit a real
  # password to values.yaml).
  existingSecret: ""
  existingSecretKey: password
  password: ""                # ignored when existingSecret is set

# ─── Peer services (gRPC) ─────────────────────────────────────────────────────
peers:
  iam:
    # KAC-178 §2 follow-up: ProjectService.Get живёт на PUBLIC iam listener (9090).
    # InternalIAMService.{Check,RegisterResource} — на INTERNAL (9091).
    # Раньше defaults были оба на 9091 + неверный service `kacho-iam:9091`
    # (у него только port 9090) → ProjectService Unimplemented → 'project lookup failed'.
    addr: kacho-iam.kacho.svc:9090              # ProjectService (public 9090)
    internalAddr: kacho-iam-internal.kacho.svc:9091  # InternalIAMService.{Check, RegisterResource}
    tls: false
    dialDuration: 10s
  vpc:
    addr: kacho-vpc.kacho.svc:9090              # AddressService / SubnetService
    internalAddr: kacho-vpc.kacho.svc:9091      # InternalAddressService
    tls: false
    dialDuration: 10s
  compute:
    addr: kacho-compute.kacho.svc:9090          # InstanceService (instance-resolve — NOT geography)
    internalAddr: ""
    tls: false
    dialDuration: 10s
  geo:
    # nlb→geo (epic kacho-geo): RegionService.Get на PUBLIC geo listener (9090).
    # Region-валидация NetworkLoadBalancer.region_id / TargetGroup.region_id
    # переехала с compute на kacho-geo (leaf-owner Geography). Этот addr
    # рендерится в config.yaml как extapi.geo.addr (override пустого default'а
    # из config/defaults.go) → config.go также читает KACHO_NLB_GEO_GRPC_ADDR.
    addr: kacho-geo.kacho.svc:9090
    internalAddr: ""
    tls: false
    dialDuration: 10s

# Authz — параметры ВЫЗОВА per-RPC Check. Адрес ребра здесь не задаётся:
# Check идёт по соединению `iam-internal`, чей адрес берётся из
# peers.iam.internalAddr (extapi.iam.internal-addr). Он же обязателен при
# config.mode = production.
authz:
  iam:
    dialDeadline: 3s
    requestTimeout: 500ms

# ─── SEC-F mTLS — per-edge opt-in (cert-manager internal-CA certs) ─────────────
# enable=false (default) → НИ cert-secret, НИ `mtls:` секция в config.yaml →
# текущее insecure dev (нулевая регрессия, SEC-F-05). umbrella прокидывает
# .mtls.enable + per-edge флаги (КРИТ#3). config.go MTLSConfig (viper mapstructure):
#   mtls.server       → server-cert на public+internal listener'ах
#   mtls.iam-register → nlb→iam-internal :9091 (Check + RegisterResource drainer)
#   mtls.iam-project  → nlb→iam :9090 (ProjectService.Get read edge, SEC-I)
#   mtls.vpc          → nlb→vpc (Address/Subnet/NIC IPAM)
#   mtls.compute      → nlb→compute (Instance-resolve — NOT geography)
#   mtls.geo          → nlb→geo :9090 (RegionService.Get, epic kacho-geo)
# serverName на dial-стороне = реальный dial-host (∈ server-SAN пира, КРИТ#1).
# SEC-I (OQ-5 (b)): iam-register=kacho-iam-internal.* (:9091), iam-project=
# kacho-iam.* (:9090) — per-listener split (единый ServerName не покрывает оба
# iam-listener'а под SEC-H RequireAndVerifyClientCert; I6 / latent-bug D-04).
mtls:
  enable: false
  # ─── internal-CA leaf-cert issuance (this chart owns its Certificate, rule #1) ─
  # client-cert URI-SAN saName MUST match the IAM module-SA seed (SEC-C migration
  # 0009): kacho-nlb → sva(md5("kacho-nlb")) holds fga_writer@iam_fgaproxy.
  issuer:
    name: kacho-internal-ca
    kind: ClusterIssuer   # ClusterIssuer (cluster-scoped), NOT namespaced Issuer
  serverHosts: ["kacho-nlb", "kacho-nlb-internal"]   # public + internal Service dial-hosts
  spiffe:
    trustDomain: kacho.cloud
    namespace: kacho
    saName: kacho-nlb
  leafDuration: 2160h
  leafRenewBefore: 720h
  serverSecretName: kacho-nlb-server-tls   # cert key = kacho-nlb (КРИТ#1)
  clientSecretName: kacho-nlb-client-tls
  mountPath: /etc/kacho-nlb/tls            # <mp>/server|client/{tls.crt,tls.key,ca.crt}
  edges:
    iamRegister: false   # nlb→iam-internal :9091 (Check + RegisterResource drainer)
    iamProject: false    # nlb→iam :9090 ProjectService.Get (SEC-I read edge)
    vpc: false           # nlb→vpc Address/Subnet/NIC
    compute: false       # nlb→compute Instance-resolve (NOT geography)
    geo: false           # nlb→geo :9090 RegionService.Get (epic kacho-geo)
  serverName:
    iamRegister: kacho-iam-internal.kacho.svc
    iamProject: kacho-iam.kacho.svc
    vpc: vpc.kacho.svc
    compute: compute.kacho.svc
    # serverName = реальный :9090 dial-host (∈ geo server-SAN, КРИТ#1).
    geo: kacho-geo.kacho.svc

# ─── Resource requests/limits + probes ────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# ─── Migrator init-container ─────────────────────────────────────────────────
migrator:
  enable: true
  # By default reuses .Values.image; override only when migrator ships as a
  # separate image.
  image:
    repository: ""
    tag: ""

# ─── Autoscaling (HPA) ───────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# ─── NetworkPolicy ───────────────────────────────────────────────────────────
networkPolicy:
  enable: true
  # Selector that matches kacho-api-gateway pods (allowed to reach :9090).
  apiGatewayPodSelector:
    matchLabels:
      app: kacho-api-gateway
  # Selector(s) matching peer services allowed to reach :9091 (internal).
  internalPodSelector:
    matchLabels:
      kacho.io/peer: "true"
  # Allow Prometheus to scrape :9101.
  metricsPodSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus

# ─── ServiceMonitor (Prometheus Operator) ────────────────────────────────────
# metricsScrape — объявление СБОРА величин диагностической поверхности.
#
# Выключение требует ПРИЧИНЫ: пустая строка при enabled=false — это «забыли», и
# декларативная проверка не отличила бы её от «сбора здесь нет намеренно».
metricsScrape:
  enabled: true
  disabledBecause: ""

# subscription — потолок ОДНОВРЕМЕННЫХ потоков подписки этого процесса.
#
# Величина объявляется здесь потому, что её обязан видеть тот, кто разворачивает:
# каждый поток держит выделенное соединение ВНЕ ПУЛА всё время своей жизни, то
# есть это арифметика соединений базы, а не вкус —
#
#	число реплик × этот потолок + пулы всех реплик ≤ max_connections базы
#
# ЗНАЧЕНИЕ БАЙТ-В-БАЙТ РАВНО вкомпилированному умолчанию: объявление делает
# величину видимой профилю и сверяемой, а не меняет поведение. До него ключ жил
# только в коде, и распоряжаться им профиль не мог.
#
# Асимметрия, задающая выбор: упереться в СВОЙ потолок — чистый отказ ОДНОМУ
# вызывающему (`RESOURCE_EXHAUSTED`, повтор осмыслен); упереться в предел БАЗЫ —
# отказ всему процессу и всем арендаторам сразу, включая тех, кто подписок не
# открывал.
#
# Потолок КРАЯ обязан помещаться сюда: `replicas(края) × maxStreams(края)` не
# больше этой величины, иначе исчерпание наступает у владельца — у всех сразу.
# Сверяет gateway/deploy/subscription_stream_budget_test.go, читая это объявление.
subscription:
  maxStreams: 16

# ── ПОСАДКА БЕЗОПАСНОСТИ ─────────────────────────────────────────────────
#
# ОДИН адрес на весь флот: `authMode` в корне значений сервиса. Ручку звали
# шестью разными адресами и двумя именами, и вопрос «в какой посадке работает
# этот кластер» нельзя было задать одной командой. Прежний адрес (config.mode)
# снят; профиль, всё ещё задающий его, получает отказ рендера с обоими
# значениями в тексте — молчаливого отката к умолчанию не будет.
authMode: production
