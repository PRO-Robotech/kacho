# ghz job — gRPC-direct smoke against kacho-nlb (mirrors scenarios/smoke.js).
#
# Calls NetworkLoadBalancerService.List with page_size=20 — minimal mutation
# risk, cheapest possible read. Bypasses api-gateway entirely.
#
# Fill in PROJECT_ID + IAM_TOKEN via kustomize patch or `envsubst` before apply:
#   envsubst < smoke-job.yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: ghz-nlb-smoke
  namespace: kacho
  labels:
    app: ghz
    scenario: smoke
    service: kacho-nlb
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: ghz
        scenario: smoke
    spec:
      restartPolicy: Never
      # Хардening пода (trivy KSV-0118): непривилегированный запуск + seccomp.
      # uid 65532 — тот же, под которым работает апстримный образ ghz
      # (`ghcr.io/bojand/ghz`, Config.User=65532); локальная сборка `ghz:dev`
      # (см. README рядом) обязана оставить бинарь исполняемым для этого uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ghz
          image: ghz:dev
          imagePullPolicy: IfNotPresent
          # Хардening контейнера (trivy KSV-0014/KSV-0118): корень только на чтение,
          # без повышения привилегий, все capabilities сняты. Тома под запись НЕ
          # нужны: без `-O/-o` ghz пишет отчёт только в stdout. Проверено прогоном,
          # а не выведено из чтения: ghz под `--read-only` и uid 65532 отработал
          # 200 gRPC-вызовов через reflection и вышел кодом 0.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - "--insecure"
            - "--call"
            - "kacho.cloud.loadbalancer.v1.NetworkLoadBalancerService.List"
            - "--total"
            - "3000"
            - "--rps"
            - "100"
            - "--concurrency"
            - "20"
            - "--connections"
            - "5"
            - "--timeout"
            - "10s"
            - "--metadata"
            - '{"authorization":"Bearer ${IAM_TOKEN}","x-kacho-actor":"ghz-loadtest","x-kacho-project-id":"${PROJECT_ID}"}'
            - "--data"
            - '{"project_id":"${PROJECT_ID}","page_size":20}'
            - "nlb.kacho.svc:9090"
