# golangci-lint config (v2 schema) — ЕДИНЫЙ на всю монорепу.
#
# Раньше конфиг был у КАЖДОГО репо (8 копий, уже разъехавшихся: 71 строка у
# vpc/compute/geo/storage/corelib, 79 у iam, 23 у api-gateway). В монорепе линтер
# запускается из КОРНЯ, поэтому per-service конфиги в подкаталогах не подхватываются —
# без корневого работали бы дефолты, и, например, errcheck начинал ругаться на
# `defer ln.Close()` в тестах gateway (реально сломало CI-джобу).
#
# Здесь объединены все три варианта: база vpc/geo/storage/corelib + QF1008/QF1011 из
# api-gateway + staticcheck-исключения слоёв iam.
version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - copyloopvar

  settings:
    misspell:
      # `requrie` — намеренная опечатка: она вход пробы `pkg/db/sslmode_test.go`
      # и предмет объяснения в `pkg/db/sslmode.go`, где сказано, почему
      # перечисляются ДОПУСТИМЫЕ значения, а не запрещённые (перечень запретов
      # пропустил бы `sslmode=requrie` как безопасный). Директива `nolint` внутри
      # комментарного блока не действует — отсюда словарь.
      ignore-rules:
        - requrie
    revive:
      rules:
        - name: var-naming
          # acronym-fixes (Ip→IP, Smtp→SMTP, Id→ID) ломают proto-mirror naming
          # в domain/. Поля обязаны совпадать с proto, не trivially переименуешь.
          # Оставляем правило, но exclusions ниже скрывают domain-/handler-файлы.
        - name: package-comments
          disabled: true   # по умолчанию комментарии не пишем
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: unused-receiver
          disabled: true
    errcheck:
      # defer X.Close() — стандартная практика, не баг. Ошибки на close не
      # actionable (мы уже выходим из функции).
      exclude-functions:
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Close
        - (*google.golang.org/grpc.ClientConn).Close
        - (*database/sql.DB).Close
        - (*os.File).Close
        - (io.Closer).Close

  exclusions:
    paths:
      # ui-future/ — JS/TS фронт; node_modules может содержать сторонние .go-файлы
      # (напр. flatted/golang/…/flatted.go), которые линтить нельзя. На self-hosted /
      # shared-workspace node_modules переживает между job'ами и попадает в скан.
      - (^|/)node_modules($|/)
      - ^ui-future/
    rules:
      # Сгенерённые стабы (buf generate → pkg/api). Их пишет генератор — линтить
      # бессмысленно. Был путь polyrepo `gen/go/`; в монорепе стабы в pkg/api/.
      - path: 'pkg/api/'
        linters: [revive, staticcheck, unused, govet, errcheck]
      - path: '_test\.go$'
        linters: [revive, errcheck, unused, staticcheck, bodyclose]
      # Acronym ревайв-правила vs proto-mirror naming.
      # Поля типа IpVersion / OutgoingSmtpCapability / DnsOptions и метод
      # SetDefaultSecurityGroupId — точные копии proto. Service/handler/domain
      # слои зеркалят это naming, не переименовать без breaking changes
      # proto-API.
      # proto-mirror naming (IpVersion / OutgoingSmtpCapability / SetDefaultSecurityGroupId):
      # поля и методы — точные копии proto, переименование = breaking change API.
      # Путь расширен на apps/kaname/{api,services}: там ровно тот же зеркальный naming,
      # а прежний список (domain|handler|service) его не покрывал.
      - path: 'internal/(domain|handler|service|apps/kaname/(api|services))/'
        linters: [revive]
        text: 'var-naming'
      # Из конфига api-gateway: косметические staticcheck-quickfix'ы. QF1011 вдобавок
      # воюет с НАМЕРЕННЫМИ compile-time type-assertion'ами.
      - linters: [staticcheck]
        text: 'QF1008|QF1011'
      # Из конфига iam: слои, зеркалящие proto/доменные имена.
      #
      # ПРАВИЛО ЗАПИСАНО ДВАЖДЫ, И ЭТО НЕ ДУБЛЬ. Служба iam несёт свой `go.mod`,
      # поэтому её линтуют ДВА разных прогона, и путь файла у них разный:
      # из корня монорепо — `services/iam/internal/…`, из модуля службы —
      # `internal/…`. Одной записи хватало ровно до разделения модулей; после
      # него второй прогон перестал бы видеть исключение, и линт покраснел бы на
      # намеренном зеркальном именовании.
      #
      # Вторая форма ЗАЯКОРЕНА в начало пути намеренно. Без якоря она накрыла бы
      # одноимённые слои соседних служб при прогоне из корня — то есть тихо
      # расширила бы послабление на чужой код. С якорем она срабатывает только
      # там, где корнем прогона и является каталог службы.
      - path: 'services/iam/internal/(domain|errors|repo|service|apps/kaname/api)/'
        linters: [staticcheck]
      - path: '^internal/(domain|errors|repo|service|apps/kaname/api)/'
        linters: [staticcheck]

formatters:
  enable:
    - gofmt
    - goimports
  # Форматтеры — ОТДЕЛЬНЫЙ блок со своими exclusions: исключения из `linters.exclusions`
  # выше на них НЕ распространяются. Из-за этого генерённые стабы, явно исключённые из
  # линтеров, всё равно проверялись на форматирование и давали 52 замечания (50 goimports
  # + 2 misspell) — гейт линта был красным независимо от содержимого веток. Пути здесь
  # обязаны повторять `linters.exclusions.paths` + правило на pkg/api.
  exclusions:
    paths:
      - (^|/)node_modules($|/)
      - ^ui-future/
      # Сгенерённые стабы (buf generate → pkg/api) — их форматирует генератор.
      - ^pkg/api/

issues:
  # 0 = БЕЗ ОГРАНИЧЕНИЯ, и это здесь единственное защитимое значение.
  #
  # Потолок отбрасывает находки МОЛЧА: в выводе не остаётся ни числа отброшенных,
  # ни следа их существования — прогон при этом выглядит содержательным (ненулевой
  # код возврата, полсотни строк). Отбрасываются при этом РАЗНЫЕ находки, а не
  # повторы одной, то есть исчезнуть может ровно та, ради которой линтер и
  # запускался. Замер на синтетическом пакете: линтер порождает 119 находок,
  # при `max-issues-per-linter: 100` печатается «100 issues» и ни слова про 19.
  #
  # Прежние значения (50 / 100) ставились как защита от простыни в выводе. Цена
  # оказалась не той: простыня видна и разбирается, а молчаливая усечёнка — нет.
  # Гейт: internal/repohygiene/lintverdict_test.go.
  max-same-issues: 0
  max-issues-per-linter: 0
