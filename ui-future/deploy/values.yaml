# Compatibility surface for kacho-deploy's existing umbrella values.
name: ui
replicas: 1
image: kacho-ui-future-host:dev
imagePullPolicy: IfNotPresent
port: 8080

ingress:
  enabled: true
  className: nginx
  host: console.kacho.local
  annotations: {}
  tls: []

# Response security headers emitted by every nginx UI server (host + remotes).
# Internal serving config only - no API/proto/wire contract surface.
# Everything the console talks to (api-gateway, kratos, hydra) is reached
# same-origin through the host nginx proxy, so a 'self'-based CSP is sufficient.
#
# style-src carries 'unsafe-inline' (script-src does NOT). antd v6 renders its
# component styles through a runtime CSS-in-JS engine that injects <style> tags
# without a per-tag nonce, so a nonce/hash style-src cannot be satisfied while
# antd v6 is the UI kit. Because script-src stays 'self', no attacker-controlled
# JS can execute, so the residual exposure is bounded to CSS-only vectors and is
# only reachable if a DOM-injection sink is separately introduced. Accepted as a
# documented residual (see docs/architecture/known-divergences.md, запись
# `csp:style-src-unsafe-inline`); revisit if antd exposes nonce-based
# StyleProvider integration. Запись держит scripts/check-csp-divergence-records.mjs:
# уехал пин antd — обоснование про v6 больше не относится к дереву, гейт краснеет.
#
# ОЖИДАЕМОЕ НАРУШЕНИЕ НА СТРАНИЦЕ ВХОДА, КОТОРОЕ НЕ НАДО «ЧИНИТЬ» ОТСЮДА.
# Полосу входа/регистрации край консоли проксирует стороннему UI провайдера
# личности, поэтому эта политика применяется и к чужой странице; одну её
# конструкцию она отвергает, и браузер печатает об этом ошибку. Отказ ничего не
# ломает — измерено на стенде.
#
# Отсюда следует ровно один запрет, и он адресован тому, кто правит эту строку:
# `script-src` НЕ ослаблять и хеш не добавлять. Послабление ради чужого
# встроенного скрипта открыло бы исполнение произвольных встроенных скриптов на
# страницах ВВОДА ПАРОЛЯ, а хеш протух бы при первом обновлении провайдера.
#
# Разбор, отвергнутые способы снять, условие снятия и пины, против которых оно
# измерено, — в ОДНОМ месте: docs/architecture/known-divergences.md, запись
# `csp:login-page-inline-script`. Держит её (и роняет прогон, когда условие
# наступило) scripts/check-csp-divergence-records.mjs — включая случай, когда
# `script-src` ослаблен ровно тем способом, который запрещён абзацем выше.
security:
  enabled: true
  # HSTS: force https on subsequent navigations (SSL-strip / downgrade defense).
  # Emitted only over TLS-terminated responses; safe to also set here because the
  # UI is always served behind the https ingress. Set to "" to defer to an
  # upstream ingress controller that already injects HSTS.
  strictTransportSecurity: "max-age=63072000; includeSubDomains"
  contentSecurityPolicy: >-
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self' data:;
    connect-src 'self';
    worker-src 'self' blob:;
    frame-ancestors 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self'

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

host:
  name: ""
  replicas: null
  image: ""
  imagePullPolicy: ""
  port: null
  resources: {}
  # ─── ПОЛНАЯ форма имени здесь ОБЯЗАТЕЛЬНА ───────────────────────────────────
  # Эти адреса потребляет nginx через `resolver` + переменную в `proxy_pass`. В
  # такой связке nginx резолвит СВОИМ клиентом, который `/etc/resolv.conf` не
  # читает вовсе — что доказывает соседний `resolver-from-resolvconf.envsh`: он
  # достаёт оттуда адрес сервера имён вручную ИМЕННО потому, что nginx его не
  # видит. Поискового списка у nginx, следовательно, нет тоже, и короткая форма
  # `<svc>.<ns>.svc` не резолвится НИКОГДА — все апстримы консоли отвечают 502.
  #
  # Это отличает данный случай от вызовов сервис→сервис (там резолвит libc,
  # поисковый список применяется, и короткая форма правильна — см. #145).
  # Признак различения: КТО резолвит, а не «какая форма короче».
  upstreams:
    apiGateway: api-gateway.kacho.svc.cluster.local:8080
    kratosPublic: kacho-umbrella-kratos-public.kacho.svc.cluster.local:80
    hydraPublic: kacho-umbrella-hydra-public.kacho.svc.cluster.local:4444
    kratosUi: kratos-selfservice-ui.kacho.svc.cluster.local:3000
    dashboard: ""
    vpc: ""
    iam: ""
    nlb: ""
    registry: ""
    system: ""
    compute: ""
    storage: ""

dashboard:
  name: ui-dashboard
  replicas: 1
  # When empty, the chart derives this from the host image by replacing "host"
  # with "dashboard", e.g. kacho-ui-future-host:dev -> kacho-ui-future-dashboard:dev.
  image: ""
  imagePullPolicy: ""
  port: 8080
  resources:
    requests:
      cpu: 30m
      memory: 48Mi
    limits:
      cpu: 150m
      memory: 192Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

