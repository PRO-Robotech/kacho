# Compatibility surface for kacho-deploy's existing umbrella values.
name: ui
replicas: 1
image: kacho-ui-future-host:dev
imagePullPolicy: IfNotPresent
port: 8080

ingress:
  enabled: true
  className: nginx
  host: console.kacho.local
  annotations: {}
  # Записи TLS Ingress: `[{hosts: [<хост>], secretName: <секрет>}]`. Пусто ⇒
  # контроллер раздаёт хост по открытому http, и Secure-печенье формы браузер
  # с него не хранит (kacho#3025): пустой перечень годится только стенду, где
  # консоль впереди закрывает собственная раздача (`publicFront`).
  tls: []
  # Лист для каждой записи `tls`. true ⇒ чарт заводит cert-manager Certificate
  # в `secretName` записи с её `hosts` у поставщика `issuerRef`; false ⇒ секрет
  # заводит оператор. Поставщик — решение площадки, а не продукта: умолчания у
  # него нет, и включённый блок без поставщика рендер отказывает.
  certificate:
    create: false
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io

# ─── ВНЕШНИЙ ВХОД КОНСОЛИ БЕЗ INGRESS-КОНТРОЛЛЕРА: TLS НА САМОЙ РАЗДАЧЕ ──────
#
# ЗАЧЕМ (kacho#3024). Служба доступа выдаёт печенье контекста формы и носитель
# сессии с `Secure`, и это боевая форма. Браузер Secure-печенье с происхождения
# `http`, отличного от `localhost`, не хранит: на стенде, отдававшем консоль
# балансировщиком площадки по открытому 80/http, законная регистрация получала
# `403 FORM_TOKEN_REJECTED` — признак формы пришёл, контекста нет. Чинится
# посадка, а не защита: TLS завершается на пользовательском крае.
#
# ЧТО ДЕЛАЕТ БЛОК. Раздача консоли слушает TLS сама (`httpsPort`) сертификатом из
# секрета `tls.secretName`; чарт публикует Service типа LoadBalancer с ДВУМЯ
# портами: 443 → TLS раздачи и 80 → отдельный слушатель `redirectPort`, который
# НИЧЕГО не обслуживает и отвечает `308` на объявленное происхождение консоли.
# Происхождение берётся из ОДНОЙ величины — `global.kacho.identity.appBaseURL`,
# той же, что служба доступа читает как адрес консоли: две копии одного адреса
# разошлись бы молча. Внутренний порт раздачи (`port`) остаётся как был — его
# читают пробы готовности и внутрикластерные потребители, наружу он не
# публикуется.
#
# ОТКАЗ РЕНДЕРА, А НЕ УМОЛЧАНИЕ. Включённый блок без секрета, без поставщика
# сертификата, без имени в сертификате, либо с происхождением не по `https`
# (или не покрытым сертификатом) рендер ОТКАЗЫВАЕТ и называет ручку.
#
# ПРОДЛЕНИЕ. Сертификат меняется в секрете на месте; раздача перечитывает его
# сама (`tlsReload.intervalSeconds` ниже — один сторож на все листы раздачи), без
# перезапуска пода: иначе после продления под отдавал бы прежний, истекающий
# лист до случайного перезапуска.
# ─── СТОРОЖ ЛИСТОВ РАЗДАЧИ ───────────────────────────────────────────────────
# Один на все листы раздачи: лист звена к краю (`host.edgeLink`, всегда) и лист
# пользовательского края (`publicFront.tls`, когда включён). Период в секундах,
# (0, 3600]: продлённый лист nginx перечитывает сам, без перезапуска пода.
tlsReload:
  intervalSeconds: 300

publicFront:
  enabled: false
  service:
    # Пусто ⇒ `<имя раздачи>-public`. Имя существующего Service площадки
    # объявляется здесь, когда адрес балансировщика нужно сохранить: принятие
    # объекта во владение — шаг раскатки (`helm upgrade --take-ownership`).
    name: ""
    annotations: {}
  httpsPort: 8443
  redirectPort: 8081
  tls:
    # Секрет `kubernetes.io/tls` (ключи tls.crt / tls.key).
    secretName: ""
    certificate:
      # true ⇒ чарт заводит cert-manager Certificate в этот секрет у поставщика
      # `issuerRef`. false ⇒ секрет заводит оператор; чарт его только монтирует.
      create: true
      issuerRef:
        name: ""
        kind: ClusterIssuer
        group: cert-manager.io
      # Имена сертификата. Хост происхождения консоли обязан быть среди них:
      # IP-литерал — в `ipAddresses`, доменное имя — в `dnsNames`.
      dnsNames: []
      ipAddresses: []
      # Пусто ⇒ срок решает поставщик (у публичного ACME он задан профилем).
      duration: ""
      renewBefore: ""

# Проекция потока изменений в браузер — ручка края `/subscription/v1/events`
# (kacho#1020). Консоль ходит на тот же источник, что и страница, поэтому запрос
# потока идёт ЧЕРЕЗ раздачу консоли и через внешний вход. Оба посредника
# перечислены здесь одной величиной намеренно: две копии одного числа разошлись
# бы молча — обе непусты, обе выглядят действующими, и ни одна не знает о другой.
subscriptionStream:
  # proxyReadTimeout — сколько посредник ждёт следующей порции, СЕКУНДЫ.
  #
  # ОБЯЗАН быть больше срока жизни потока, который объявляет край
  # (`gateway/deploy/values.yaml` → `subscriptionStream.streamBudget`, сегодня
  # 90 с): иначе поток рвёт посредник, и клиент читает это сетевым сбоем вместо
  # чистого закрытия по сроку, после которого он возобновляется со своей позиции.
  # Сверяет ui-future/deploy/subscription_stream_serving_test.go — он читает срок
  # У КРАЯ, а не выписывает его копию здесь.
  proxyReadTimeout: "120"
  # ingress.enabled — объявляет ли ЭТОТ чарт свой вход для пути потока
  # (templates/ingress-subscription-stream.yaml). У пары host+path вход ровно
  # один: контроллер отвергает второй объект на ту же пару при приёме. Зонт,
  # который ведёт полосы края на хосте консоли сам (console-edge-lanes,
  # kacho#3028), выключает здесь этот вход — путь потока у него идёт прямо к
  # краю, а не через раздачу. Отдельно поставленный чарт оставляет `true`.
  ingress:
    enabled: true

# Response security headers emitted by every nginx UI server (host + remotes).
# Internal serving config only - no API/proto/wire contract surface.
# Everything the console talks to (the api-gateway) is reached
# same-origin through the host nginx proxy, so a 'self'-based CSP is sufficient.
#
# style-src carries 'unsafe-inline' (script-src does NOT). antd v6 renders its
# component styles through a runtime CSS-in-JS engine that injects <style> tags
# without a per-tag nonce, so a nonce/hash style-src cannot be satisfied while
# antd v6 is the UI kit. Because script-src stays 'self', no attacker-controlled
# JS can execute, so the residual exposure is bounded to CSS-only vectors and is
# only reachable if a DOM-injection sink is separately introduced. Accepted as a
# documented residual (see docs/architecture/known-divergences.md, запись
# `csp:style-src-unsafe-inline`); revisit if antd exposes nonce-based
# StyleProvider integration. Запись держит scripts/check-csp-divergence-records.mjs:
# уехал пин antd — обоснование про v6 больше не относится к дереву, гейт краснеет.
security:
  enabled: true
  # HSTS: force https on subsequent navigations (SSL-strip / downgrade defense).
  # Emitted only over TLS-terminated responses; safe to also set here because the
  # UI is always served behind the https ingress. Set to "" to defer to an
  # upstream ingress controller that already injects HSTS.
  strictTransportSecurity: "max-age=63072000; includeSubDomains"
  contentSecurityPolicy: >-
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self' data:;
    connect-src 'self';
    worker-src 'self' blob:;
    frame-ancestors 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self'

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

host:
  name: ""
  replicas: null
  image: ""
  imagePullPolicy: ""
  port: null
  resources: {}
  # ─── ПОЛНАЯ форма имени здесь ОБЯЗАТЕЛЬНА ───────────────────────────────────
  # Эти адреса потребляет nginx через `resolver` + переменную в `proxy_pass`. В
  # такой связке nginx резолвит СВОИМ клиентом, который `/etc/resolv.conf` не
  # читает вовсе — что доказывает соседний `resolver-from-resolvconf.envsh`: он
  # достаёт оттуда адрес сервера имён вручную ИМЕННО потому, что nginx его не
  # видит. Поискового списка у nginx, следовательно, нет тоже, и короткая форма
  # `<svc>.<ns>.svc` не резолвится НИКОГДА — все апстримы консоли отвечают 502.
  #
  # Это отличает данный случай от вызовов сервис→сервис (там резолвит libc,
  # поисковый список применяется, и короткая форма правильна — см. #145).
  # Признак различения: КТО резолвит, а не «какая форма короче».
  #
  # ─── АДРЕСА ВНЕШНЕГО ПОСТАВЩИКА ЛИЧНОСТИ У ЧАРТА НЕТ ────────────────────
  #
  # Ни экрана входа поставщика, ни его публичного края раздача не знает:
  # поставщик снят (#1276), адреса церемоний (`/login`, `/registration`, …)
  # достаются оболочке консоли, и маршруты для них — предмет самой консоли
  # (приёмка F8, Р1). Держит deploy/tests/helm/console-serves-identity-flows-test.sh
  # — он судит РЕНДЕР каждой цепочки deploy/stacks.txt: на цепочке, где обе
  # половины стоят на посадке own, полоса к чужому экрану и полоса к публичному
  # краю поставщика — находка, и таких цепочек с консолью обязана быть хотя бы
  # одна (приёмка F8, §4). Отсутствие адресов поставщика у наших нагрузок держит
  # deploy/stack_render_carries_no_vendor_residue_test.go.
  # ─── ЗВЕНО ФРОНТА К КРАЮ (kacho#3028) ───────────────────────────────────────
  # Полосы раздачи к краю идут по TLS на его ВНЕШНИЙ слушатель (порт `tls`
  # края, 8443) и предъявляют лист звена: край принимает адрес клиента из
  # `X-Forwarded-For` только от пира, предъявившего лист якоря звеньев с именем
  # звена. Открытый порт края (`cmux`, 8080) раздача больше не зовёт: на нём
  # рукопожатия нет, и звено там не опознаётся — все клиенты раздачи были бы
  # для края одним адресом её пода.
  #
  #   secretName   — лист звена (tls.crt/tls.key); выпускает его умбрелла
  #                  выпускающим якоря звеньев (templates/api-gateway-front-link-pki.yaml);
  #   caSecretName — секрет, из которого берётся ТОЛЬКО ca.crt: удостоверяющий
  #                  центр серверного листа края (им раздача проверяет край);
  #   продление листа — сторож `tlsReload` (ниже).
  edgeLink:
    secretName: api-gateway-front-console-link
    caSecretName: api-gateway-tls
  upstreams:
    # Адрес ВНЕШНЕГО TLS-слушателя края; его хост — имя сервера, которое
    # раздача сверяет с листом края (ui.edgeServerName).
    apiGateway: api-gateway.kacho.svc.cluster.local:8443
    dashboard: ""
    vpc: ""
    iam: ""
    nlb: ""
    registry: ""
    system: ""
    compute: ""
    storage: ""

dashboard:
  name: ui-dashboard
  replicas: 1
  # When empty, the chart derives this from the host image by replacing "host"
  # with "dashboard", e.g. kacho-ui-future-host:dev -> kacho-ui-future-dashboard:dev.
  image: ""
  imagePullPolicy: ""
  port: 8080
  resources:
    requests:
      cpu: 30m
      memory: 48Mi
    limits:
      cpu: 150m
      memory: 192Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

