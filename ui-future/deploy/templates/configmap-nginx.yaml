apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ui.hostName" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
data:
  default.conf.template: |
    {{- include "ui.publicFrontGuard" . }}
    server {
        listen {{ include "ui.hostPort" . }};
        {{- if .Values.publicFront.enabled }}
        # TLS пользовательского края (kacho#3024): тот же серверный блок, что и
        # внутренний порт, — второй копии маршрутов консоли нет и разойтись нечему.
        listen {{ .Values.publicFront.httpsPort }} ssl;
        ssl_certificate /etc/console-tls/tls.crt;
        ssl_certificate_key /etc/console-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:console_tls:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        {{- end }}
        server_name _;

        resolver ${KUBE_DNS_SERVER} valid=10s ipv6=off;

        root /usr/share/nginx/html;
        index index.html;
        {{- include "ui.securityHeaders" . | nindent 8 }}

        # АДРЕС КЛИЕНТА К КРАЮ (kacho#3028). Раздача — доверенное звено края:
        # край берёт адрес клиента из `X-Forwarded-For`, только если пир — она.
        # Поэтому заголовок она ПИШЕТ сама адресом своего TCP-пира, а не
        # дописывает его к пришедшему от клиента (`$proxy_add_x_forwarded_for`):
        # заявление клиента о себе дальше раздачи не уходит, и ни одному звену
        # за ней не нужно угадывать, какая запись цепочки настоящая.
        #
        # Путь ассетов модуля обязан лежать ВНЕ пространства маршрутов консоли:
        # суффикс `-remote` — то, что его оттуда выводит. Здесь стоял
        # `/dashboard/`, и он заслонял маршрут, на который оболочка уводит с
        # корня И с любого неизвестного пути, — прямой заход и обновление
        # страницы отдавали голый модуль вместо консоли. В разработке этого не
        # видно: там у каждого модуля свой порт, общего пространства путей нет.
        location ^~ /dashboard-remote/ {
            set $dashboard_upstream "${KACHO_UI_DASHBOARD_UPSTREAM}";
            rewrite ^/dashboard-remote/(.*)$ /$1 break;
            proxy_pass http://$dashboard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ^~ /vpc-remote/ {
            set $vpc_upstream "${KACHO_UI_VPC_UPSTREAM}";
            rewrite ^/vpc-remote/(.*)$ /$1 break;
            proxy_pass http://$vpc_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ^~ /iam-remote/ {
            set $iam_upstream "${KACHO_UI_IAM_UPSTREAM}";
            rewrite ^/iam-remote/(.*)$ /$1 break;
            proxy_pass http://$iam_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ^~ /nlb-remote/ {
            set $nlb_upstream "${KACHO_UI_NLB_UPSTREAM}";
            rewrite ^/nlb-remote/(.*)$ /$1 break;
            proxy_pass http://$nlb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ^~ /registry-remote/ {
            set $registry_upstream "${KACHO_UI_REGISTRY_UPSTREAM}";
            rewrite ^/registry-remote/(.*)$ /$1 break;
            proxy_pass http://$registry_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ^~ /system-remote/ {
            set $system_upstream "${KACHO_UI_SYSTEM_UPSTREAM}";
            rewrite ^/system-remote/(.*)$ /$1 break;
            proxy_pass http://$system_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ^~ /compute-remote/ {
            set $compute_upstream "${KACHO_UI_COMPUTE_UPSTREAM}";
            rewrite ^/compute-remote/(.*)$ /$1 break;
            proxy_pass http://$compute_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ^~ /storage-remote/ {
            set $storage_upstream "${KACHO_UI_STORAGE_UPSTREAM}";
            rewrite ^/storage-remote/(.*)$ /$1 break;
            proxy_pass http://$storage_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ ^/(vpc|compute|storage|geo|nlb|registry|operations)/ {
            set $api_gw_upstream "${KACHO_UI_API_GATEWAY_UPSTREAM}";
            proxy_pass http://$api_gw_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ ^/iam/v1/ {
            set $api_gw_upstream "${KACHO_UI_API_GATEWAY_UPSTREAM}";
            proxy_pass http://$api_gw_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Поток изменений — единственная ручка края, отдающая браузеру не ответ, а
        # ПОСЛЕДОВАТЕЛЬНОСТЬ кадров. До этого блока её адрес не покрывала ни одна
        # полоса: он доставался общему `location /`, а тот отдаёт `index.html` с
        # кодом `200` и типом `text/html`. Приёмник событий браузера на неверном
        # типе закрывает соединение НАВСЕГДА и выдаёт ошибку без подробностей —
        # со стороны это тишина: в журнале края ни строки, в журнале раздачи `200`.
        #
        # ТОЧНОЕ совпадение, а не префикс `/subscription/`. Край держит на этом же
        # порту и внутренние глаголы; префикс открыл бы наружу всё пространство
        # имени разом, включая то, чего в нём ещё нет. Точный блок открывает ровно
        # один адрес и не может открыть второго (запрет #6).
        location = /subscription/v1/events {
            set $api_gw_upstream "${KACHO_UI_API_GATEWAY_UPSTREAM}";
            proxy_pass http://$api_gw_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $http_x_request_id;

            # Три величины, и каждая при умолчании ломает ровно то, ради чего
            # ручка заведена. Умолчание здесь не «разумное»: его никто не
            # выбирал, а отказ от него не виден ничем — коды, типы и события
            # остаются теми же.
            #
            # Накопление: раздача по умолчанию КОПИТ ответ и отдаёт его целиком
            # по завершении. Край просит снять накопление заголовком
            # `X-Accel-Buffering: no`, и раздача его слушает, — но тогда форма
            # ответа зависела бы от того, что край не забыл этот заголовок
            # поставить. Здесь она не зависит ни от чего.
            proxy_buffering off;
            proxy_cache off;
            # Сжатие: сегодня оно не срабатывает лишь потому, что тип потока не
            # назван в перечне `gzip_types` серверного блока. То есть поток
            # держится чужим перечнем, о котором ничего не знает, и первая же
            # строка в тот перечень накопила бы ответ обратно.
            gzip off;
            # Предел ожидания следующей порции ОБЯЗАН пережить срок жизни потока,
            # который объявляет край: иначе поток рвёт посредник, и клиент читает
            # это сетевым сбоем вместо чистого закрытия по сроку, после которого
            # он возобновляется со своей позиции. Обе величины сверяет
            # ui-future/deploy/subscription_stream_serving_test.go.
            proxy_read_timeout {{ .Values.subscriptionStream.proxyReadTimeout }}s;
        }

        # ЭКРАНЫ ЦЕРЕМОНИЙ ВХОДА РИСУЕТ КОНСОЛЬ (приёмка F8, Р1): их адреса
        # обслуживает оболочка консоли общим `location /`. Полосы к внешнему
        # экрану входа здесь нет: внешний поставщик личности снят (#1276), а
        # возврат такой полосы на цепочке посадки own — находка рендер-гейта
        # deploy/tests/helm/console-serves-identity-flows-test.sh.

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            {{- include "ui.securityHeaders" . | nindent 12 }}
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            {{- include "ui.securityHeaders" . | nindent 12 }}
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            {{- include "ui.securityHeaders" . | nindent 12 }}
        }

        location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot|otf)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            {{- include "ui.securityHeaders" . | nindent 12 }}
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
    {{- if .Values.publicFront.enabled }}

    # Порт 80 балансировщика. НЕ обслуживает ничего: ни консоль, ни края, ни
    # формы — только переадресация на объявленное происхождение. Хост ответа
    # берётся из объявления, а не из заголовка `Host` запроса: отражать чужой
    # заголовок в `Location` значило бы уводить браузер туда, куда скажет
    # запрос. `308`, а не `301`: метод и тело сохраняются, и форма, отправленная
    # по http, уходит на https, а не теряется превращением в GET.
    server {
        listen {{ .Values.publicFront.redirectPort }};
        server_name _;
        {{- include "ui.securityHeaders" . | nindent 8 }}
        location / {
            return 308 {{ include "ui.publicFrontOrigin" . }}$request_uri;
        }
    }
    {{- end }}
  resolver-from-resolvconf.envsh: |
    # Sourced (.envsh) до nginx 20-envsubst: экспортирует адрес кластерного DNS из
    # /etc/resolv.conf в KUBE_DNS_SERVER, чтобы envsubst подставил его в
    # `resolver ${KUBE_DNS_SERVER}` шаблона. Экспорт (не sed по read-only
    # ConfigMap-mount) — mount доступен только на чтение, in-place правка невозможна.
    ns="$(awk '/^nameserver/ {print $2; exit}' /etc/resolv.conf)"
    if [ -z "$ns" ]; then
      echo "[05-resolver] FATAL: no nameserver in /etc/resolv.conf" >&2
      return 1 2>/dev/null || exit 1
    fi
    export KUBE_DNS_SERVER="$ns"
    echo "[05-resolver] KUBE_DNS_SERVER=$ns exported for envsubst"
  {{- if .Values.publicFront.enabled }}
  tls-reload.sh: |
    # Исполняется до nginx (docker-entrypoint.d) и оставляет в фоне сторожа:
    # cert-manager продлевает сертификат В СЕКРЕТЕ, kubelet меняет файлы тома на
    # месте, а nginx держит в памяти лист, прочитанный при старте. Без сторожа
    # под отдавал бы прежний лист до истечения. Сторож сверяет отпечаток пары
    # файлов и на расхождении просит nginx перечитать настройку (`-s reload`:
    # соединения не рвутся). Проверка конфигурации — ДО перечтения: битая пара в
    # секрете не должна гасить раздачу, она остаётся на прежнем листе и говорит
    # об этом в журнал.
    set -eu
    dir=/etc/console-tls
    every={{ int .Values.publicFront.tls.reloadIntervalSeconds }}
    for f in "$dir/tls.crt" "$dir/tls.key"; do
      if [ ! -s "$f" ]; then
        echo "[06-tls-reload] FATAL: $f пуст или отсутствует — TLS пользовательского края не завершается" >&2
        exit 1
      fi
    done
    (
      seen="$(cat "$dir/tls.crt" "$dir/tls.key" | cksum)"
      while sleep "$every"; do
        now="$(cat "$dir/tls.crt" "$dir/tls.key" 2>/dev/null | cksum)" || continue
        [ "$now" = "$seen" ] && continue
        if nginx -t -q 2>/dev/null && nginx -s reload; then
          seen="$now"
          echo "[06-tls-reload] сертификат пользовательского края сменился — nginx перечитал настройку"
        else
          echo "[06-tls-reload] сертификат сменился, но конфигурация не прошла проверку — остаёмся на прежнем листе" >&2
        fi
      done
    ) &
    echo "[06-tls-reload] сторож сертификата запущен, период ${every}s"
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ui.iamName" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
data:
  default.conf.template: |
    server {
        listen {{ .Values.iam.port }};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        {{- include "ui.securityHeaders" . | nindent 8 }}

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            {{- include "ui.securityHeaders" . | nindent 12 }}
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            {{- include "ui.securityHeaders" . | nindent 12 }}
        }

        # Точка входа федеративного модуля — ЕДИНСТВЕННЫЙ ассет, чьё имя не
        # меняется от сборки к сборке (у остальных в имени хэш содержимого).
        # Общее правило ниже пометило бы её `immutable`, то есть «не
        # перепроверяй никогда», и обновление страницы этого не сбрасывает:
        # клиент федерации продолжал бы грузить куски прежней сборки. Правило
        # обязано стоять ДО общего — nginx берёт первый совпавший location.
        location ~* /remoteEntry\.js$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            {{- include "ui.securityHeaders" . | nindent 12 }}
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            {{- include "ui.securityHeaders" . | nindent 12 }}
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
