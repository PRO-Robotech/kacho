            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            {{- include "ui.securityHeaders" . | nindent 12 }}
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
