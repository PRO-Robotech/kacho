        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ui.computeName" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
data:
  default.conf.template: |
    server {
        listen {{ .Values.compute.port }};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Точка входа федеративного модуля — ЕДИНСТВЕННЫЙ ассет, чьё имя не
        # меняется от сборки к сборке (у остальных в имени хэш содержимого).
        # Общее правило ниже пометило бы её `immutable`, то есть «не
        # перепроверяй никогда», и обновление страницы этого не сбрасывает:
        # клиент федерации продолжал бы грузить куски прежней сборки. Правило
        # обязано стоять ДО общего — nginx берёт первый совпавший location.
        location ~* /remoteEntry\.js$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            {{- include "ui.securityHeaders" . | nindent 12 }}
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
