apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ui.vpcName" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
data:
  default.conf.template: |
    server {
        listen {{ .Values.vpc.port }};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        {{- include "ui.securityHeaders" . | nindent 8 }}

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            {{- include "ui.securityHeaders" . | nindent 12 }}
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            {{- include "ui.securityHeaders" . | nindent 12 }}
        }

        # Точка входа федеративного модуля — ЕДИНСТВЕННЫЙ ассет, чьё имя не
