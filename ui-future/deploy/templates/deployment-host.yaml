apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ui.hostName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
    {{- include "ui.hostSelectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ include "ui.hostReplicas" . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ui.hostSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ui.labels" . | nindent 8 }}
        {{- include "ui.hostSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        # Привязка к содержимому образа (kacho#3026): тег `:dev` неизменен, и без
        # идентификатора содержимого пересобранный модуль не перекатился бы.
        kacho.cloud/image-id: {{ dig "kachoImageIds" "ui-future/host" "unset" (.Values.global | default dict) | quote }}
    spec:
      # Ужесточение пода (trivy KSV-0118): non-root + seccomp RuntimeDefault.
      # uid 101 — пользователь образа nginx-unprivileged.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      enableServiceLinks: false
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-template
          configMap:
            name: {{ include "ui.hostName" . }}-nginx
            items:
              - key: default.conf.template
                path: default.conf.template
        - name: nginx-entrypoint
          configMap:
            name: {{ include "ui.hostName" . }}-nginx
            defaultMode: 0755
            items:
              - key: resolver-from-resolvconf.envsh
                path: 05-resolver-from-resolvconf.envsh
              - key: tls-reload.sh
                path: 06-tls-reload.sh
        # ЛИСТ ЗВЕНА К КРАЮ (kacho#3028): раздача предъявляет его краю на каждой
        # полосе к нему — край узнаёт звено фронта по имени в листе якоря
        # звеньев и только тогда принимает от неё адрес клиента. Том — НЕ
        # subPath: при продлении kubelet меняет файлы на месте, и сторож их видит.
        - name: edge-link
          secret:
            secretName: {{ required "host.edgeLink.secretName обязателен: без листа звена край не примет адрес клиента от раздачи" .Values.host.edgeLink.secretName | quote }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        # Удостоверяющий центр СЕРВЕРНОГО листа края — им раздача проверяет, что
        # говорит с краем. Из секрета берётся только ca.crt: ключа края в поде
        # раздачи нет.
        - name: edge-ca
          secret:
            secretName: {{ required "host.edgeLink.caSecretName обязателен: раздаче нечем проверить лист края" .Values.host.edgeLink.caSecretName | quote }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        {{- if .Values.publicFront.enabled }}
        # Лист TLS пользовательского края (kacho#3024). Том — НЕ subPath: только
        # так kubelet меняет файлы на месте при продлении, и сторож их видит.
        - name: console-tls
          secret:
            secretName: {{ .Values.publicFront.tls.secretName | quote }}
            defaultMode: 0440
        {{- end }}
      containers:
        - name: host
          image: {{ include "ui.hostImage" . | quote }}
          imagePullPolicy: {{ include "ui.hostImagePullPolicy" . }}
          # Ужесточение контейнера (trivy KSV-0014/KSV-0118): read-only rootfs, запрет
          # повышения привилегий, снятие ВСЕХ capabilities. Записываемых мест ровно три,
          # и все три — emptyDir ниже: /tmp (pid и временные файлы nginx),
          # /var/cache/nginx (кэш) и /etc/nginx/conf.d — туда
          # `20-envsubst-on-templates.sh` рендерит шаблон конфига из ConfigMap, без
          # записи в этот каталог контейнер не стартует вовсе.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ include "ui.hostPort" . }}
            {{- if .Values.publicFront.enabled }}
            - name: https
              containerPort: {{ .Values.publicFront.httpsPort }}
            - name: redirect
              containerPort: {{ .Values.publicFront.redirectPort }}
            {{- end }}
          env:
            - name: KACHO_UI_API_GATEWAY_UPSTREAM
              value: {{ .Values.host.upstreams.apiGateway | quote }}
            - name: KACHO_UI_DASHBOARD_UPSTREAM
              value: {{ include "ui.dashboardUpstream" . | quote }}
            - name: KACHO_UI_VPC_UPSTREAM
              value: {{ include "ui.vpcUpstream" . | quote }}
            - name: KACHO_UI_IAM_UPSTREAM
              value: {{ include "ui.iamUpstream" . | quote }}
            - name: KACHO_UI_NLB_UPSTREAM
              value: {{ include "ui.nlbUpstream" . | quote }}
            - name: KACHO_UI_REGISTRY_UPSTREAM
              value: {{ include "ui.registryUpstream" . | quote }}
            - name: KACHO_UI_SYSTEM_UPSTREAM
              value: {{ include "ui.systemUpstream" . | quote }}
            - name: KACHO_UI_COMPUTE_UPSTREAM
              value: {{ include "ui.computeUpstream" . | quote }}
            - name: KACHO_UI_STORAGE_UPSTREAM
              value: {{ include "ui.storageUpstream" . | quote }}
            {{- if and .Values.publicFront.enabled (.Values.publicFront.acme).enabled }}
            # Решатель ACME этого релиза (kacho#3024): к нему уходит ТОЛЬКО вызов
            # подтверждения владения на порту переадресации.
            - name: KACHO_UI_ACME_SOLVER_UPSTREAM
              value: {{ printf "%s.%s.svc.cluster.local:%s" (include "ui.publicFrontAcmeSolverName" .) .Release.Namespace (include "ui.acmeSolverPort" .) | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            - name: nginx-entrypoint
              mountPath: /docker-entrypoint.d/05-resolver-from-resolvconf.envsh
              subPath: 05-resolver-from-resolvconf.envsh
              readOnly: true
            - name: nginx-entrypoint
              mountPath: /docker-entrypoint.d/06-tls-reload.sh
              subPath: 06-tls-reload.sh
              readOnly: true
            - name: edge-link
              mountPath: {{ include "ui.edgeLinkDir" . }}
              readOnly: true
            - name: edge-ca
              mountPath: {{ include "ui.edgeCADir" . }}
              readOnly: true
            {{- if .Values.publicFront.enabled }}
            - name: console-tls
              mountPath: /etc/console-tls
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- include "ui.hostResources" . | nindent 12 }}
