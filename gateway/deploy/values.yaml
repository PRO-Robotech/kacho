name: api-gateway
replicas: 1
image: kacho-api-gateway:dev
imagePullPolicy: IfNotPresent

port: 8080
tlsPort: 8443
# Dedicated cluster-internal admin REST listener. It is the ONLY listener that
# serves Internal* REST paths (/vpc/v1/addressPools, `:internal` projections,
# InternalRegistry/Cluster/Operations admin). SECURITY (ban #6): the ingress
# MUST NOT target this port — it is exposed only as the cluster-internal
# `internal-rest` Service port for admin-UI / port-forward / in-cluster tooling.
# Every other listener (cmux :8080 that the ingress hits, and TLS :8443) is
# external and 404s Internal* REST. Set internalRestPort to "" to disable.
internalRestPort: 8081

# Адреса активных backend-сервисов (KACHO_API_GATEWAY_*_GRPC env vars).
# Публичные RPC nlb обслуживаются под /nlb/v1/*.
backends:
  vpc: vpc.kacho.svc:9090
  vpcInternal: vpc.kacho.svc:9091
  compute: compute.kacho.svc:9090
  computeInternal: compute.kacho.svc:9091
  # kaname public + internal endpoints
  iam: kaname.kacho.svc:9090
  iamInternal: kaname-internal.kacho.svc:9091
  # kacho-nlb public + internal endpoints
  nlb: kacho-nlb.kacho.svc:9090
  nlbInternal: kacho-nlb.kacho.svc:9091
  # kacho-geo public + internal endpoints (Geography Region/Zone leaf service).
  # The geo k8s Service is "kacho-geo" / "kacho-geo-internal" (mirrors kaname /
  # kaname-internal). The bare "geo.kacho.svc" host does NOT resolve
  # (NXDOMAIN) → grpc "no children to pick from" 503 on every /geo/v1/* request.
  geo: kacho-geo.kacho.svc:9090
  geoInternal: kacho-geo-internal.kacho.svc:9091
  # kacho-registry public + internal endpoints (OCI/Docker image registry leaf).
  # Public RegistryService on /registry/v1/*; InternalRegistryService (GC/stats)
  # on the internal :9091 mux (ban #6). The registry data-plane :8080 is NOT
  # gateway-routed — docker push/pull go through the registry.kacho.local ingress.
  registry: kacho-registry.kacho.svc:9090
  registryInternal: kacho-registry.kacho.svc:9091
  # kacho-storage public + internal endpoints (блочное хранение: Volume/Snapshot/
  # Image/DiskType). Публичные RPC на /storage/v1/*, InternalVolumeService и
  # InternalDiskTypeService — на внутреннем :9091 (ban #6).
  #
  # Имя Service — `kacho-storage`: чарт хранилища фиксирует его
  # `fullnameOverride` (services/storage/deploy/values.yaml), а не выводит из
  # имени релиза, поэтому оно НЕ зависит от того, как назван релиз.
  #
  # Ветка появилась вместе с #145: до неё адрес хранилища не объявлял НИ ОДИН
  # чарт, и живым значением работало вкомпилированное умолчание — то есть адрес,
  # которого не называл ни один профиль. Значение здесь БАЙТ-В-БАЙТ равно тому
  # умолчанию: ветка делает адрес видимым профилю, а не меняет его.
  # Пустое значение → storage-handlers не регистрируются вовсе (как у registry/geo/nlb).
  storage: kacho-storage.kacho.svc:9090
  storageInternal: kacho-storage.kacho.svc:9091

# TLS termination на api-gateway pod. Включается автоматически когда tls.secretName указан.
# Cert поставляется внешне через `kubectl create secret tls api-gateway-tls --cert=tls.crt --key=tls.key`.
# Используется TLS-only клиентами.
tls:
  enabled: true
  secretName: api-gateway-tls
  certPath: /etc/api-gateway/tls/tls.crt
  keyPath: /etc/api-gateway/tls/tls.key

ingress:
  enabled: true
  host: api.kacho.local
  proxyReadTimeout: "120"

# Проекция потока изменений в браузер — ЕДИНСТВЕННАЯ ручка `/subscription/v1/events`
# (kacho#1020). Разбор решения и цена отвергнутых способов —
# gateway/docs/engineering/architecture/subscription-stream-projection.md.
subscriptionStream:
  # owners — ЗАКРЫТЫЙ перечень владельцев журналов через запятую.
  #
  # ИМЯ ВЛАДЕЛЬЦА — ДОМЕН КОНТРАКТА (`kacho.cloud.<домен>.v1`), и это НЕ ключ
  # блока `backends:` ниже. Слово «backends» означает здесь две разные вещи, и
  # спутать их стоит полного цикла выкатки:
  #
  #   · `backends:` этого файла — блок АДРЕСОВ, его ключи `nlb` / `nlbInternal`;
  #   · карта СОЕДИНЕНИЙ края, которой резолвится владелец, — ключи по домену
  #     контракта: `loadbalancer` / `loadbalancerInternal`. Шаблон подаёт первый
  #     адрес во вторую карту под другим именем, через переменную окружения.
  #
  # То есть для балансировщика верно `loadbalancer`, а `nlb` — отказ старта.
  # Принимаемые написания перечислены первой колонкой таблицы словаря владельцев
  # на клиентской странице (`/api/subscription`); сверяет их с картой соединений
  # края subscription_owners_declared_test.go — до сборки образа, а не на выкатке.
  #
  # Адрес владельца отдельной ручкой НЕ задаётся: берётся уже объявленный
  # внутренний адрес домена, второго объявления того же адреса не заводится.
  #
  # ПУСТО — «владелец не объявлен», а не «все домены»: ручка отвечает `501` с
  # названной причиной.
  owners: "compute,loadbalancer,registry,storage,vpc"
  # streamBudget — срок жизни одного потока. ОБЯЗАН быть меньше предела чтения
  # КАЖДОГО посредника на пути запроса, иначе поток рвёт посредник и клиент
  # видит сетевой сбой вместо чистого закрытия.
  #
  # Посредников два, и они РАЗНЫЕ — путать их не надо:
  #   · собственный вход края (`ingress.proxyReadTimeout` ниже) — им пользуется
  #     тот, кто ходит на край напрямую; в умбрелле он выключен;
  #   · раздача консоли и её вход — ими ходит БРАУЗЕР, и предел они берут из
  #     `ui-future/deploy/values.yaml` → `subscriptionStream.proxyReadTimeout`.
  # Первый держит gateway/deploy/subscription_stream_budget_test.go, второй —
  # ui-future/deploy/subscription_stream_serving_test.go.
  streamBudget: 90s
  # heartbeat — период служебного кадра поддержания связи: молчащая подписка
  # обычный режим, а посредник закрывает молчащее соединение по тому же пределу.
  heartbeat: 20s
  # maxStreams — потолок одновременных потоков ОДНОЙ реплики края.
  #
  # ВЕЛИЧИНА ВЫВЕДЕНА, А НЕ ВЫБРАНА: она равна потолку потоков ВЛАДЕЛЬЦА
  # (`subscription.maxStreams` его чарта), потому что край не вправе создать
  # больше, чем владелец примет. Один запрос — один владелец, поэтому в худшем
  # случае весь потолок реплики адресуется одному из них.
  #
  # Асимметрия, задающая направление: упереться в СВОЙ потолок — отказ ОДНОМУ
  # вызывающему, у которого своя квота (`maxStreamsPerSubject` ниже); упереться в
  # потолок владельца — отказ всем арендаторам сразу, включая тех, кто подписок не
  # открывал, и адресован он будет не тому, кто перебрал. Поэтому потолок края
  # держится не выше потолка владельца, а не наоборот.
  #
  # Здесь стояло 64 — вчетверо больше того, что принимает владелец. Ошибкой это
  # не было ни дня: пока `owners` пуст, произведение не с чем сравнивать, и
  # арифметика не исполнялась ни разу. Она исполнилась вместе с поставкой.
  #
  # ПРЕДИКАТ ПЕРЕСМОТРА ВВЕРХ: величина растёт вместе с потолком владельца, а тот
  # — вместе с пределом соединений его базы (каждый поток держит соединение ВНЕ
  # пула). Поднимать её отдельно значит вернуть то же расхождение.
  maxStreams: 16
  # maxStreamsPerSubject — потолок потоков ОДНОГО вызывающего. Потолок реплики
  # защищает процесс, этот — арендаторов друг от друга: без него один арендатор
  # занимает потолок реплики целиком, и остальные получают отказ, не имея ни
  # одного собственного потока. Консоль открывает поток на вкладку.
  #
  # Потребность вызывающего — `владельцы × вкладки`; проекты в неё НЕ входят
  # (подписка без `projectId` покрывает все доступные проекты). Расчёт величины,
  # цена отвергнутых исходов и предикат пересмотра —
  # gateway/docs/engineering/architecture/subscription-stream-limits.md.
  #
  # ВЕЛИЧИНА ВЫВЕДЕНА ИЗ ЧИСЛА ВЛАДЕЛЬЦЕВ, А НЕ ВЫБРАНА: `owners` × 2 вкладки.
  # Здесь стояло 8 — при двух владельцах этого хватало на четыре вкладки, и
  # ошибкой это не было ни дня. Поставка объявила ПЯТЬ владельцев, и величина
  # стала мала на своей же формуле: одна вкладка со всеми доменами берёт 5
  # потоков, вторая — 10, то есть отказ по исчерпанию наступал у одного
  # арендатора на ШТАТНОЙ работе, а не под нагрузкой (kacho#1391).
  #
  # ЦЕНА НАЗВАНА, а не умолчана: вызывающий может занять 10 потоков реплики из
  # 16, и запас для всех остальных падает с 8 до 6. Это осознанный размен —
  # отказ своему на второй вкладке виден каждому и постоянен, а тесно занятая
  # реплика наступает только когда арендаторов на ней и правда много.
  #
  # ПРЕДИКАТ ПЕРЕСМОТРА: величина растёт вместе с `owners`. Шестой владелец
  # требует 12, и об этом скажет гейт, а не память, —
  # TestSubjectCeilingCoversEveryOwnerOnTwoTabs (subscription_stream_budget_test.go).
  # Потолком служит `maxStreams`: страж старта не поднимает край, объявивший
  # предел вызывающего выше предела реплики. Упрётся формула в этот потолок —
  # значит исчерпан сам размен, и решать придётся зернистость (один поток на
  # несколько владельцев), а не величину.
  maxStreamsPerSubject: 10
  # Потолок потоков У ВЛАДЕЛЬЦА журнала здесь НЕ объявляется — намеренно.
  #
  # Величина принадлежит чарту владельца, и копия её здесь была бы вторым местом
  # об одном предмете: разойдясь, они разошлись бы молча, потому что обе
  # непусты и обе выглядят действующими. Арифметику
  # `replicas × maxStreams ≤ потолок владельца` сверяет проба
  # gateway/deploy/subscription_stream_budget_test.go, читая объявление
  # ВЛАДЕЛЬЦА, как только `owners` его назовёт.

# Externally advertised endpoint that clients dial for every service.
# Production: api.kacho.local:443 (or whatever externally resolvable host:port).
# Dev (kind + port-forward): override to localhost:18443.
advertisedEndpoint: api.kacho.local:443

# kratosPublicUrl — базовый адрес публичного API провайдера личности, по
# которому край проверяет сессию SPA (cookie → /whoami).
#
# ПУСТО — не «выключено», а «вывести из релиза»: шаблон подставит
# `http://<релиз>-kratos-public.<пространство-имён>.svc:80`. Выключает
# сессионную аутентификацию целиком ТОЛЬКО значение `disabled` — это
# сигнальное значение, которое читает config.go.
#
# Почему выводится, а не вписано литералом (#145): Service провайдера
# называется по имени релиза, поэтому литерал верен ровно для одного релиза и
# ломается молча при установке под другим именем — а профиль при этом не
# меняется, потому что адреса он и не называл.
kratosPublicUrl: ""

# RESERVED — блок `oidc:` снят вместе с обработчиком церемонии.
# Он питал маршруты интерактивного входа края, адресовавшие снятого провайдера
# личности. Ни один профиль его не включал (`enabled: false` здесь был
# единственным объявлением во всём дереве), а секрет клиента наполнял Job,
# удалённый тикетом KAC-127, — то есть маршруты не могли отработать ни разу.
# Церемонию проводит консоль входа развёрнутого провайдера.
# Ключ `oidc` не переиспользовать: вернуть церемонию — отдельная работа со своей
# приёмкой и НОВЫМИ именами, иначе профиль со старым ключом молча сменит смысл.

# AuthN — auth-interceptor configuration.
#   mode:
#     - "production"        : Bearer required, verified by signature against the
#                             identity facade's published JWKS (asymmetric).
#     - "production-strict" : production + reject missing Bearer.
#
# THE RELAXED MODE IS NOT A DEPLOYMENT OPTION. It answers an unauthenticated
# request as somebody, and the symmetric-key path it used to pair with let anyone
# holding the shared key issue tokens the edge could not distinguish from
# provider-signed ones. Neither belongs on a deployed stand, whatever the stand is
# called (security.md §"Production-mode — ОБЯЗАТЕЛЕН ВЕЗДЕ"). Accordingly this
# chart offers NO key for it: there is no `devSecret`, no `devSecretSecretRef`, and
# the process refuses to start if the variable reaches it by another route. The
# symmetric path survives only inside in-process fixtures, which never read this
# chart. Guard: gateway/deploy/symmetric_secret_absent_test.go.
#
# Default {} → no KACHO_API_GATEWAY_AUTHN_* env emitted; the api-gateway Go config
# default (mode=production) applies, so a profile that forgets this block gets the
# safe posture rather than the relaxed one. Every deployable profile states it
# anyway — an omission that happens to be safe today is not a decision.
#
# Per-RPC authentication floor:
#
#   authn:
#     enforceStepUp: true               # apply the catalog `required_acr_min`
#
# The permission catalog states, per RPC, how strongly a caller must have
# authenticated. Applying it is its OWN switch, separate from enableDpop below:
# a proof of possession is a property of some tokens and cannot be demanded
# before issuance mints bound credentials, whereas how strongly the caller
# authenticated is a property of every token. They shared one switch, no profile
# set it, and the floor therefore held nowhere while the catalog, its mirror in
# the identity service and the cluster-internal arm all read as if it did.
# A production-class environment now refuses to start with this off while the
# catalog declares a floor, and every deployable profile states it —
# gateway/deploy/stepup_enforcement_test.go reads those declarations.
#
# Sender-constrained tokens (RFC 7800 `cnf`):
#
#   authn:
#     enableDpop: true                  # mount the DPoP / mTLS-bound proof validators
#     requireMachineTokenBinding: true  # machine (service-account) tokens MUST be bound
#
# Both default off. ROLLOUT ORDER matters — flipping
# requireMachineTokenBinding first rejects every service-account token, because
# nothing mints bound tokens until the identity provider registers the OAuth2
# clients accordingly (kaname `kacho.iam.saKey.bindDpop`):
#
#   1. kaname: saKey.bindDpop=true      → newly issued keys mint bound tokens
#      (reader caveat, #1137: that knob is registration metadata for the client
#      MIRROR at the previous issuer. On a stand whose SA-key contour is
#      TRANSLATED to iam's own token endpoint no mirror is created, so the knob
#      has no reader — iam refuses to start with both set. Step 1 is available
#      only while the contour is not translated.)
#   2. gateway:   authn.enableDpop=true    → the proof of possession is verified
#   3. confirm machine tokens carry `cnf`, and rotate any pre-existing SA keys
#      (a key registered before step 1 keeps minting unbound tokens)
#   4. gateway:   authn.requireMachineTokenBinding=true → unbound machine ⇒ 401
authn:
  # ─── посадка личности (#1125) ──────────────────────────────────────────────
  # ЧЕМ СТЕНД ПРОВЕРЯЕТ ЧЕЛОВЕКА: `external` — внешний поставщик удостоверений,
  # `own` — наша собственная чеканка.
  #
  # На крае она разводит требование АДМИНИСТРАТИВНОГО адреса поставщика: этот
  # адрес нужен ровно затем, чтобы выход человека снял сессию на его стороне, а
  # под `own` такой сессии не существует. Полосу интроспекции поле НЕ разводит —
  # авторитет отзыва остаётся обязательным на обеих полосах.
  #
  # УМОЛЧАНИЯ У ПРОЦЕССА НЕТ намеренно, поэтому оно живёт здесь: профиль,
  # объявивший посадку у службы прав и забывший её на крае, получит отказ
  # старта края — а не тихо разъехавшиеся половины одного стенда.
  #
  # Значение обязано СОВПАДАТЬ с тем, что объявила служба прав: две половины
  # одного стенда, объявившие разное, — расхождение, которого никто не решал.
  # Держит это deploy/identity_posture_profiles_test.go.
  identityProvider: external

# Hydra — OAuth2/OIDC token verification.
# The auth path verifies Hydra-issued RS256 access tokens by fetching Hydra's
# JWKS. config.go reads KACHO_HYDRA_JWKS_URL (explicit) and otherwise derives
# `{KACHO_HYDRA_ISSUER}/.well-known/jwks.json` — whose default issuer
# (`https://hydra.api.kacho.cloud`) is NOT reachable from inside the cluster
# (in dev Hydra's self.issuer is `http://localhost:28080/...`). So the JWKS URL
# MUST be set explicitly to the cluster-internal Hydra PUBLIC Service. Unset →
# no env emitted; the Go config default applies (zero regression for overlays
# that don't opt in). The dev/prod overlays set `jwksUrl` to the in-cluster
# `kacho-umbrella-hydra-public:4444/.well-known/jwks.json`.
#   jwksUrl:    explicit cluster-internal Hydra JWKS endpoint (reachable from
#               the gateway pod). Drives KACHO_HYDRA_JWKS_URL.
#   issuer:     expected `iss` claim. Drives KACHO_HYDRA_ISSUER.
#
# The revocation path needs two MORE addresses, and neither is derivable from
# the issuer: both are served by the provider's ADMIN API, on its own Service
# and port, reachable only inside the cluster.
#
#   introspectionUrl: where the gateway asks whether an access token has been
#               revoked — the admin path `/admin/oauth2/introspect`. Asked per
#               request through a short-TTL cache. Drives
#               KACHO_HYDRA_INTROSPECTION_URL.
#   adminUrl:   admin API base the logout handler uses to end the provider-side
#               session (`DELETE /admin/oauth2/auth/sessions/login`). Drives
#               KACHO_HYDRA_ADMIN_URL.
#
# Both were DERIVED from the public issuer when unset, and no profile set
# either, so every stand ran with them aimed at a server that serves neither.
# They are no longer derived: unset means the control is off, and a
# production-class gateway refuses to start in that state. The provider's admin
# API carries no authentication of its own — it is protected by not being
# routable — so no credentials accompany these addresses; do not publish the
# admin Service outside the cluster.
#
#   hydra:
#     jwksUrl:          http://kacho-umbrella-hydra-public.kacho.svc:4444/.well-known/jwks.json
#     issuer:           https://hydra.api.kacho.cloud
#     introspectionUrl: http://kacho-umbrella-hydra-admin.kacho.svc:4445/admin/oauth2/introspect
#     adminUrl:         http://kacho-umbrella-hydra-admin.kacho.svc:4445
#   adminCa:    trust anchor for the admin hop, when that hop is served over
#               TLS. Since the revocation check moved onto the authN layer the
#               hop carries the caller's LIVE bearer on every introspection
#               cache miss — before that only administrative calls went that
#               way — so the transport is now a tenant-data question, not just
#               an operational one. An in-cluster provider certificate is issued
#               by the internal CA, which the gateway does not trust by default
#               (its default pool is the system roots); this mounts the bundle
#               and points KACHO_HYDRA_ADMIN_CA_FILE at it.
#
#               Set it together with an https address, never instead of one, and
#               never a bundle that does not sign the provider's certificate: an
#               unknown-authority handshake is classified as PERMANENT
#               misconfiguration by the introspection layer, which then refuses
#               every request rather than waving them through. A bundle that
#               cannot be read, or that holds no certificate, refuses the start.
#
#     adminCa:
#       secretName: hydra-admin-tls   # secret carrying the internal-CA bundle
#       key: ca.crt
#       mountPath: /etc/api-gateway/hydra-admin-ca
# tokenAcceptance — ОБЪЯВЛЕНИЕ приёма токена: кого принимаем и откуда берём его
# набор проверочных ключей. Платформа чеканит свои токены сама (задача #897), а
# прежний издатель на переходе остаётся, поэтому издатель здесь — МНОЖЕСТВО.
#
# ПЕРЕХОД АДДИТИВЕН, и это отличается от ПЕРВОЙ конфигурации проверяющего
# осознанно: край ВЫВОДИТ издателя из домена API по умолчанию, поэтому «issuers
# не задано» — сегодняшнее, работающее и повсеместное состояние, а не забытая
# настройка. Три состояния, а не два:
#
#   - не задано ⇒ строится ОДНА запись из hydra.issuer/hydra.jwksUrl ниже —
#     ровно сегодняшнее поведение;
#   - задано, но элементов ноль («,», пробелы) ⇒ ОТКАЗ В СТАРТЕ, безусловный:
#     пустой перечень означает «принимаем любого издателя». Страж считает
#     ЭЛЕМЕНТЫ, а не длину строки;
#   - задано ⇒ принимаются ровно объявленные, у каждого своя запись источника.
#
# Задать И это, И скалярный hydra.issuer/jwksUrl — ОТКАЗ В СТАРТЕ, а не
# старшинство: значение, принятое и не действующее, хуже отвергнутого.
#
# ОТКАТ состоит в снятии platformIssuer (и нашего издателя из issuers), а не в
# перекатке образа.
tokenAcceptance:
  # TOKEN_ISSUERS — принимаемые издатели через запятую.
  issuers: ""
  # TOKEN_ISSUER_KEYSETS — привязка «издатель=адрес его набора ключей».
  # Адрес ОБЪЯВЛЯЕТСЯ и никогда не выводится из издателя: издатель приходит от
  # предъявителя, а производный адрес получался бы у ВСЯКОГО издателя — тогда
  # состояние «записи нет» не наступает никогда, и страж старта остаётся в
  # тексте, не имея возможности упасть.
  # Производственная посадка требует https:// у каждого адреса: набор ключей
  # есть единственный якорь доверия проверки подписи.
  issuerKeySets: ""
  # PLATFORM_TOKEN_ISSUER — издатель, под которым чеканит НАША платформа. Он же
  # выбирает полосу приёма: строгий тип at+jwt (RFC 9068) и чтение отзыва на
  # предъявлении. Пусто ⇒ наша чеканка краем не принимается. Непусто, но вне
  # issuers ⇒ отказ в старте.
  platformIssuer: ""
  # PLATFORM_TOKEN_REVOCATION_URL — НАШ авторитет отзыва (RFC 7662) на
  # cluster-internal слушателе iam. Обязателен, когда platformIssuer
  # принимается: прежний провайдер о наших токенах не знает by construction, и
  # его ответ на наш токен есть утверждение о чужом предмете.
  revocationUrl: ""
  # revocationCa — якорь доверия хопа к нашему авторитету отзыва. По этому хопу
  # едет ПРЕДЪЯВЛЕННЫЙ токен, а не только административный вызов.
  # Пусто ⇒ volume/mount/env не рендерятся, транспорт по умолчанию.
  revocationCa:
    secretName: ""
    key: ca.crt
    mountPath: /etc/api-gateway/platform-revocation-ca
  # revocationClientCert — ЧЕМ край предъявляет СЕБЯ авторитету отзыва.
  #
  # Авторитет наш, и он опознаёт спрашивающего: слушатель, на котором он
  # выставлен, запрашивает сертификат, а сам он отвечает опознавательным словом
  # тому, кто проверенной цепочки не дал. Якоря доверия (revocationCa) для этого
  # НЕ ДОСТАТОЧНО: он проверяет ЕГО, а не представляет НАС.
  #
  # Пути указывают на УЖЕ смонтированную клиентскую личность края
  # (`mtls.mountPath`, секрет `mtls.clientSecretName`) — своего тома у этой пары
  # нет намеренно: вторая копия той же личности разъехалась бы с первой молча.
  # Значит профиль, задающий пару, обязан держать `mtls.enable=true`.
  #
  # Пусто ⇒ хоп идёт без сертификата. Задано наполовину или нечитаемо ⇒ процесс
  # ОТКАЗЫВАЕТСЯ СТАРТОВАТЬ.
  revocationClientCert:
    certFile: ""
    keyFile: ""

hydra:
  jwksUrl: ""
  issuer: ""
  introspectionUrl: ""
  adminUrl: ""
  # Empty secretName ⇒ no volume, no mount, no env: the hop keeps the default
  # transport. That is correct for a plaintext in-cluster admin API and wrong for
  # an https one — see admin-hop-transport-test.sh, which fails a profile whose
  # address is https while this is unset.
  adminCa:
    secretName: ""
    key: ca.crt
    mountPath: /etc/api-gateway/hydra-admin-ca
  # jwksCa — trust anchor for the KEY-FETCH hop (the JWKS mirror), separate from
  # the admin one above.
  #
  # Two different peers on two different addresses: the admin hop goes to the
  # identity provider, the key-fetch hop goes to iam's mirror. Tying them to one
  # bundle would make it impossible to move one to TLS without the other, and it
  # is exactly that coupling which kept this hop on plaintext — an address knob
  # existed here, a trust knob did not, so "serve the mirror over TLS" had no
  # reachable configuration and was worked around by sending the edge straight to
  # the provider instead, past the facade.
  #
  # Empty ⇒ default transport (an in-cluster plaintext mirror needs no anchor).
  # Set ⇒ that bundle is the ONLY anchor for the hop, and an unreadable one
  # REFUSES THE START.
  jwksCa:
    secretName: ""
    key: ca.crt
    mountPath: /etc/api-gateway/hydra-jwks-ca

# AuthZ — per-RPC authorization middleware.
#   enabled: when true, every authenticated request is gated by a
#     `kaname.cloud.iam.v1.AuthorizeService.Check` fan-out. When false (the
#     Go-config default) the middleware is wired but pass-through — only
#     anonymous-mutating requests are blocked (by kaname authzguard), so
#     authenticated-but-unauthorized requests leak through.
#   failOpen: when true, transient IAM-Check failures (Unavailable / timeout)
#     ALLOW the request. Production edition MUST set false (fail-closed). The
#     access-matrix newman suite also needs false so DENY decisions are not
#     masked by IAM hiccups.
#   iamAuthorizeUrl: explicit gRPC address of kaname AuthorizeService
#     (public port 9090). Empty → derived from the `iam` backend address
#     (KACHO_API_GATEWAY_IAM_GRPC). AuthorizeService is the PUBLIC RPC — it is
#     NOT routed through the internal :9091 listener (loop-prevention #6).
#
# Default {} → no KACHO_API_GATEWAY_AUTHZ_* env emitted; Go-config defaults
# (enabled=false, failOpen=false) apply. The dev overlay enables it.
authz: {}

# ─── Deployment-environment label (KACHO_APP_ENV) ────────────────────────────
# Cross-cutting, domain-LESS label (config.go binds `envconfig:"KACHO_APP_ENV"`,
# NOT the per-domain KACHO_API_GATEWAY_* scheme) that keys the composition-root
# production guards: validateProductionAuthzConfig (refuses authn.mode=dev / dev
# HMAC secret) AND validateProductionInternalListener (refuses an insecure internal
# :9091 listener). Secure-by-default: only the explicit dev-class labels
# "dev"/"local"/"test" tolerate the dev auth + insecure-listener posture; every
# other value — INCLUDING empty/unset — is production-class and fails closed, so a
# forgotten label can never silently downgrade to dev.
#
# Default "" → no env emitted → the Go default "" (production-class) applies (zero
# regression for overlays that omit it). The dev overlay sets appEnv: dev; the
# production overlays set appEnv: production (explicit) — both first-class here,
# replacing the earlier generic extraEnv.KACHO_APP_ENV passthrough.
appEnv: ""

# ─── внутренний gRPC-листенер края СНЯТ (#1024) ──────────────────────────────
# Здесь стоял блок `internalListener` (mtls.enable/certFile/keyFile + allowedSpiffe)
# и его собственное надгробие про снятую ручку `internalListener.reflection`.
#
# Предмета у обоих больше нет: единственной службой этого листенера была
# `InternalAuthzCacheService.InvalidateSubject`, которую набирал iam, — обратное
# ребро «сервис гасит кэш решений края». Ребро снято, служба снята, листенер снят.
# Оставшись без единственной службы, он был бы входной поверхностью без единого
# метода: периметр, который надо защищать, объявлять в каждом профиле и доказывать
# гейтом посадки — ради нуля обслуживаемых вызовов.
#
# Ручка снята, а не выключена по умолчанию. Выключенная ручка настраивает
# поверхность, которой нет: значение в профиле читалось бы как принятое решение о
# защите периметра, ничего при этом не делая.
#
# Край по-прежнему НАБИРАЕТ внутренние листенеры соседей (`backends.*Internal`
# выше, `KACHO_API_GATEWAY_<ДОМЕН>_INTERNAL_GRPC`) — это другой предмет: там край
# клиент, а не сервер, и ban #6 у соседей от этого не меняется.
#
# Держится парой: рендер не эмитит ни одной `KACHO_API_GATEWAY_INTERNAL_GRPC_*`
# даже когда оверлей выставляет снятые значения (gateway/deploy/
# render_internal_listener_retired_test.go), а объявлений ручки не осталось ни в
# одном профиле (deploy/internal_listener_knob_retired_test.go).

# ─── mTLS — per-edge backend-dial (cert-manager internal-CA) ─────────────────
# api-gateway is a backend-dial CLIENT (it terminates EXTERNAL TLS separately via
# `tls.*` above — that is unrelated). enable=false (default) → НИ client-cert
# secret, НИ KACHO_API_GATEWAY_MTLS_* env → every backend dial insecure, текущее
# dev (нулевая регрессия). umbrella прокидывает .mtls.enable + per-edge флаги.
#
# One shared "api-gateway" client identity across all edges: the cert-manager
# `api-gateway-client-tls` secret. Per-edge ENABLE toggles each edge
# independently. SERVER_NAME is INTENTIONALLY left unset → config.go
# EdgeTLSClient derives it from each dial-host (`hostFromAddr`), so the iam/nlb
# edges verify against BOTH their public (kaname / kacho-nlb) AND internal
# (kaname-internal / kacho-nlb-internal) dial-hosts — both are in the peer
# server-SAN. A single override would force one name and break the other.
mtls:
  enable: false
  # ─── internal-CA leaf-cert issuance (this chart owns its Certificate) ────────
  # client-only: api-gateway dials backends over mTLS; its external server TLS uses
  # the separate `tls.*` secret above. URI-SAN saName MUST match the IAM module-SA
  # seed: kacho-api-gateway → sva(md5("kacho-api-gateway")) (identity-only role).
  issuer:
    name: kacho-internal-ca
    kind: ClusterIssuer   # ClusterIssuer (cluster-scoped), NOT namespaced Issuer
  spiffe:
    trustDomain: kacho.cloud
    namespace: kacho
    saName: kacho-api-gateway
  leafDuration: 2160h
  leafRenewBefore: 720h
  clientSecretName: api-gateway-client-tls   # cert key = api-gateway
  mountPath: /etc/api-gateway/mtls           # <mp>/{tls.crt,tls.key,ca.crt}
  # hybrid: external TLS listener = VerifyClientCertIfGiven + internal CA as
  # ClientCAs → cert-bearing client authenticates by cert SPIFFE identity, browser
  # (no cert) falls back to JWT. Internal listeners stay strict mTLS. Default off.
  hybridExternal: false
  edges:
    vpc: false        # gateway→vpc (+ vpcInternal)
    compute: false    # gateway→compute (+ computeInternal)
    iam: false        # gateway→iam (+ iamInternal); shared by authz/subject dials
    nlb: false        # gateway→nlb (+ nlbInternal)
    geo: false        # gateway→geo (+ geoInternal); SERVER_NAME unset → derived per
                      # dial-host (kacho-geo / kacho-geo-internal), both in peer SAN
    registry: false   # gateway→registry (+ registryInternal); SERVER_NAME unset →
                      # derived per dial-host (kacho-registry / kacho-registry-internal)
    storage: false    # gateway→storage (+ storageInternal); SERVER_NAME unset →
                      # derived per dial-host (kacho-storage), in peer SAN

# Arbitrary env vars escape-hatch (key: value).
extraEnv: {}

# Default replicas=1; HPA autoscales up to 10 on CPU 70%.
# api-gateway is the request-side bottleneck (~3500 RPS/pod baseline)
# under the in-cluster 10k load test.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# ── ОДНОКРАТНОСТЬ Idempotency-Key: ХРАНИЛИЩЕ И ФЛОТ — ОДНО ОБЪЯВЛЕНИЕ (#694) ──
#
# Край обещает по `Idempotency-Key` однократность: тот же ключ — тот же ответ,
# обработчик ниже вызывается один раз. Домен параллелизма этой гарантии — ВЕСЬ
# ФЛОТ подов, а не один процесс: повтор, попавший в соседнюю реплику, записи в
# чужой памяти не находит, мутация исполняется второй раз, и наблюдаемого
# признака у этого нет.
#
# Здесь стояла записка о том же предмете: она честно называла условие («при
# maxReplicas > 1 хранилища НЕ глобальны») — и не была связана ни с чем. Ниже,
# в том же файле, стояло `maxReplicas: 10`. Два объявления об одном предмете, из
# которых верно ровно одно, и какое — не было решено.
#
# ТЕПЕРЬ ЭТО ОДНО ОБЪЯВЛЕНИЕ. Шаблон развёртывания выводит размер флота из тех
# же значений, что питают автомасштабирование, и передаёт его процессу
# (KACHO_GATEWAY_FLEET_SIZE); процесс ОТКАЗЫВАЕТСЯ СТАРТОВАТЬ, когда хранилище
# живёт в его памяти, а объявлено больше одной реплики; а рендер чарта падает на
# такой паре ещё раньше — с тем же объяснением.
#
# ЧТОБЫ ВЕРНУТЬ ПОТОЛОК В ДЕСЯТЬ РЕПЛИК, НУЖНЫ ДВЕ СТРОКИ, А НЕ СНЯТИЕ ПРОВЕРКИ:
#
#   idempotency:
#     store: postgres
#     dsn: postgres://…/kacho_gateway?sslmode=require   # или existingSecret
#   autoscaling:
#     maxReplicas: 10
#
# Прежняя редакция этой записки предупреждала: «НЕ ограничивай maxReplicas
# единицей — это меняет пограничный случай на просадку пропускной способности».
# Довод был верен, пока у него не было альтернативы: общего хранилища не
# существовало вовсе, и выбор стоял между «потолок ниже» и «гарантия не
# исполняется». Теперь альтернатива есть и стоит двух строк выше, поэтому
# умолчание выбрано в пользу ИСПОЛНИМОГО обещания: край, объявляющий
# однократность и не дающий её, хуже края с меньшим потолком.
#
# ЧЕСТНО ДО КОНЦА: даже при одной реплике перекат развёртывания на короткое
# время держит два пода сразу, и в этом окне хранилище в памяти процесса
# однократности не даёт. Окно ограничено переносимостью соединений и длиной
# переката; закрывает его только общее хранилище.
#
# ЗДЕСЬ ЖЕ СТОЯЛА ЗАПИСКА ПРО ВТОРОЕ ХРАНИЛИЩЕ В ПАМЯТИ — кэш однократности
# предъявления доказательства владения (DPoP `jti`). Она БОЛЬШЕ НЕ ВЕРНА и
# заменена этой: запись о предъявленном `jti` следует ТОМУ ЖЕ выбору хранилища,
# что и ключ однократности (`idempotency.store` + `idempotency.dsn`), и в
# посадке с общей таблицей живёт в ней, а не в памяти процесса. Значит и с
# потолком реплик её связывает ТА ЖЕ проверка пары, что описана выше: два
# предмета, одно условие — запись видна всем репликам либо реплика одна.
#
# Что из прежней записки остаётся верным (перемерено): валидаторы доказательства
# владения ни на одном профиле не смонтированы — `authn.enableDpop` не выставляет
# ни один, — поэтому на сегодняшней посадке эта полоса не исполняется вовсе.
# Разбор — gateway/docs/engineering/architecture/known-divergences.md §3b:
# освобождение снято вместе со своим предметом (#909), а не переписано в
# настоящем времени.
autoscaling:
  enabled: true
  minReplicas: 1
  # Потолок связан с видом хранилища выше. Единица — не «страховка», а
  # исполнимость обещания заголовка; поднимается вместе с `idempotency.store`.
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

# idempotency — где живут записи однократности.
#
#   memory   — в памяти процесса. Законно РОВНО для флота из одной реплики.
#   postgres — общее хранилище флота (схема kacho_gateway, одна таблица).
#              Допуск атомарен одним оператором базы; погашение живёт до
#              истечения ключа, потом запись уносит сборщик.
#
# Адрес задаётся ЯВНО. Производить его из адреса соседа запрещено: такой адрес
# всегда непуст, поэтому хранилище выглядело бы настроенным и вело в никуда, а
# отказ был бы виден только по последствиям.
idempotency:
  store: memory
  # dsn — литеральный адрес (годится стенду). Для боевого профиля — existingSecret.
  dsn: ""
  existingSecret: ""
  secretKey: "dsn"

# INFRA sec-hardening — единый security-floor, идентичный kaname/geo/nlb/registry.
#
# Заведён 2026-07-16: trivy config-скан впервые покрыл ВЕСЬ репозиторий и нашёл, что
# securityContext есть лишь у половины сервисов. В polyrepo IaC-скан был ТОЛЬКО у
# kaname, а в том репо нет ни одного k8s-манифеста (чарты жили в kacho-deploy) —
# гейт зеленел, не проверяя ничего.
#
# runAsUser 65532 совпадает с `USER 65532` в Dockerfile — образ уже собран под nonroot.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem требует writable-scratch: контейнер монтирует emptyDir на /tmp
# (см. deployment.yaml). Без него сервис падает на первой же записи во временный файл.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# metricsScrape — объявление СБОРА величин диагностической поверхности.
#
# Выключение требует ПРИЧИНЫ: пустая строка при enabled=false — это «забыли», и
# декларативная проверка не отличила бы её от «сбора здесь нет намеренно».
metricsScrape:
  enabled: true
  disabledBecause: ""  # port — тот же адрес, который процесс берёт из своей конфигурации.
  # Отдельного ключа портов у этого чарта нет, поэтому он объявлен здесь; там,
  # где ключ уже есть, аннотация читает ЕГО — два места об одном порте
  # разъехались бы молча.
  port: 9095

# ── ПОСАДКА БЕЗОПАСНОСТИ ─────────────────────────────────────────────────
#
# ОДИН адрес на весь флот: `authMode` в корне значений. Ручку звали в дереве
# восемью разными адресами и двумя именами, и вопрос «в какой посадке работает
# этот кластер» нельзя было задать одной командой. Прежний адрес (authn.mode)
# принимается, пока канон не задан; заданы оба и различаются — отказ рендера.
authMode: production
