name: api-gateway
replicas: 1
image: kacho-api-gateway:dev
imagePullPolicy: IfNotPresent

port: 8080
tlsPort: 8443
# Dedicated cluster-internal admin REST listener. It is the ONLY listener that
# serves Internal* REST paths (/vpc/v1/addressPools, `:internal` projections,
# InternalRegistry/Cluster/Operations admin). SECURITY (ban #6): the ingress
# MUST NOT target this port — it is exposed only as the cluster-internal
# `internal-rest` Service port for admin-UI / port-forward / in-cluster tooling.
# Every other listener (cmux :8080 that the ingress hits, and TLS :8443) is
# external and 404s Internal* REST. Set internalRestPort to "" to disable.
internalRestPort: 8081

# Адреса активных backend-сервисов (KACHO_API_GATEWAY_*_GRPC env vars).
# Публичные RPC nlb обслуживаются под /nlb/v1/*.
backends:
  vpc: vpc.kacho.svc.cluster.local:9090
  vpcInternal: vpc.kacho.svc.cluster.local:9091
  compute: compute.kacho.svc.cluster.local:9090
  computeInternal: compute.kacho.svc.cluster.local:9091
  # kacho-iam public + internal endpoints
  iam: kacho-iam.kacho.svc.cluster.local:9090
  iamInternal: kacho-iam-internal.kacho.svc.cluster.local:9091
  # kacho-nlb public + internal endpoints
  nlb: kacho-nlb.kacho.svc.cluster.local:9090
  nlbInternal: kacho-nlb.kacho.svc.cluster.local:9091
  # kacho-geo public + internal endpoints (Geography Region/Zone leaf service).
  # The geo k8s Service is "kacho-geo" / "kacho-geo-internal" (mirrors kacho-iam /
  # kacho-iam-internal). The bare "geo.kacho.svc.cluster.local" host does NOT resolve
  # (NXDOMAIN) → grpc "no children to pick from" 503 on every /geo/v1/* request.
  geo: kacho-geo.kacho.svc.cluster.local:9090
  geoInternal: kacho-geo-internal.kacho.svc.cluster.local:9091
  # kacho-registry public + internal endpoints (OCI/Docker image registry leaf).
  # Public RegistryService on /registries/v1/*; InternalRegistryService (GC/stats)
  # on the internal :9091 mux (ban #6). The registry data-plane :8080 is NOT
  # gateway-routed — docker push/pull go through the registry.kacho.local ingress.
  registry: kacho-registry.kacho.svc.cluster.local:9090
  registryInternal: kacho-registry.kacho.svc.cluster.local:9091

# TLS termination на api-gateway pod. Включается автоматически когда tls.secretName указан.
# Cert поставляется внешне через `kubectl create secret tls api-gateway-tls --cert=tls.crt --key=tls.key`.
# Используется TLS-only клиентами.
tls:
  enabled: true
  secretName: api-gateway-tls
  certPath: /etc/api-gateway/tls/tls.crt
  keyPath: /etc/api-gateway/tls/tls.key

ingress:
  enabled: true
  host: api.kacho.local
  proxyReadTimeout: "120"

# Externally advertised endpoint that clients dial for every service.
# Production: api.kacho.local:443 (or whatever externally resolvable host:port).
# Dev (kind + port-forward): override to localhost:18443.
advertisedEndpoint: api.kacho.local:443

# OIDC — Zitadel auth-flow handlers /iam/v1/auth/{login,callback,me,logout}.
# Server-side (token exchange + userinfo) ходит на `issuer` (cluster-internal),
# browser-redirect — на `externalIssuer` (publicly reachable host).
# Off-by-default. Включается в per-cluster overrides.
oidc:
  enabled: false
  issuer: ""           # cluster-internal Zitadel URL (token exchange / userinfo)
  externalIssuer: ""   # public-facing Zitadel URL (browser redirect)
  clientId: ""
  # ClientId через k8s Secret (заполняется zitadel-oidc-bootstrap Job из umbrella).
  # Если задан — перебивает clientId. Optional=true → pod стартует даже если secret
  # еще не создан (post-install Job его apply'ит).
  # clientIdSecretRef:
  #   name: kacho-iam-oidc-client
  #   key: client_id
  #   optional: true
  clientIdSecretRef: {}
  redirectUri: ""
  # Confidential client secret. Prefer clientSecretSecretRef (k8s Secret) over the
  # inline clientSecret so the secret is never rendered into the PodSpec / Helm
  # release (CWE-522). When set it overrides clientSecret. Optional=true → pod
  # starts even if the Secret is not yet created (post-install Job applies it).
  # clientSecretSecretRef:
  #   name: kacho-iam-oidc-client
  #   key: client_secret
  #   optional: true
  clientSecretSecretRef: {}
  clientSecret: ""

# AuthN — auth-interceptor configuration.
#   mode:
#     - "dev"               : Bearer optional. Valid HS256 Bearer signed with
#                             `devSecret` → real Principal; missing/invalid →
#                             anonymous.
#     - "production"        : Bearer required, Hydra JWKS RS256 validation.
#     - "production-strict" : production + reject missing Bearer.
#   devSecret: HS256 signing secret for dev-mode JWT validation. Empty → all
#     Bearer tokens are ignored in dev-mode (every principal collapses to
#     anonymous / system:bootstrap). MUST be set on the dev stand so per-user
#     JWTs are distinguishable. Dev-only — production uses RS256 / Hydra JWKS,
#     never this secret.
#
# Default {} → no KACHO_API_GATEWAY_AUTHN_* env emitted; the api-gateway Go
# config default (mode=dev, empty devSecret) applies — identical to the
# behaviour before this block existed, so prod overlays that omit `authn`
# are unaffected. The dev overlay (values.dev.yaml) sets this explicitly.
#
# Prefer devSecretSecretRef (k8s Secret) over the inline devSecret so the HMAC
# signing key is never rendered into the PodSpec / Helm release (CWE-522). When
# set it overrides devSecret. Example:
#   authn:
#     mode: dev
#     devSecretSecretRef:
#       name: kacho-api-gateway-authn
#       key: dev_secret
#       optional: true
#
# Per-RPC authentication floor:
#
#   authn:
#     enforceStepUp: true               # apply the catalog `required_acr_min`
#
# The permission catalog states, per RPC, how strongly a caller must have
# authenticated. Applying it is its OWN switch, separate from enableDpop below:
# a proof of possession is a property of some tokens and cannot be demanded
# before issuance mints bound credentials, whereas how strongly the caller
# authenticated is a property of every token. They shared one switch, no profile
# set it, and the floor therefore held nowhere while the catalog, its mirror in
# the identity service and the cluster-internal arm all read as if it did.
# A production-class environment now refuses to start with this off while the
# catalog declares a floor, and every deployable profile states it —
# gateway/deploy/stepup_enforcement_test.go reads those declarations.
#
# Sender-constrained tokens (RFC 7800 `cnf`):
#
#   authn:
#     enableDpop: true                  # mount the DPoP / mTLS-bound proof validators
#     requireMachineTokenBinding: true  # machine (service-account) tokens MUST be bound
#
# Both default off. ROLLOUT ORDER matters — flipping
# requireMachineTokenBinding first rejects every service-account token, because
# nothing mints bound tokens until the identity provider registers the OAuth2
# clients accordingly (kacho-iam `kacho.iam.saKey.bindDpop`):
#
#   1. kacho-iam: saKey.bindDpop=true      → newly issued keys mint bound tokens
#   2. gateway:   authn.enableDpop=true    → the proof of possession is verified
#   3. confirm machine tokens carry `cnf`, and rotate any pre-existing SA keys
#      (a key registered before step 1 keeps minting unbound tokens)
#   4. gateway:   authn.requireMachineTokenBinding=true → unbound machine ⇒ 401
authn: {}

# Hydra — OAuth2/OIDC token verification.
# The auth path verifies Hydra-issued RS256 access tokens by fetching Hydra's
# JWKS. config.go reads KACHO_HYDRA_JWKS_URL (explicit) and otherwise derives
# `{KACHO_HYDRA_ISSUER}/.well-known/jwks.json` — whose default issuer
# (`https://hydra.api.kacho.cloud`) is NOT reachable from inside the cluster
# (in dev Hydra's self.issuer is `http://localhost:28080/...`). So the JWKS URL
# MUST be set explicitly to the cluster-internal Hydra PUBLIC Service. Unset →
# no env emitted; the Go config default applies (zero regression for overlays
# that don't opt in). The dev/prod overlays set `jwksUrl` to the in-cluster
# `kacho-umbrella-hydra-public:4444/.well-known/jwks.json`.
#   jwksUrl:    explicit cluster-internal Hydra JWKS endpoint (reachable from
#               the gateway pod). Drives KACHO_HYDRA_JWKS_URL.
#   issuer:     expected `iss` claim. Drives KACHO_HYDRA_ISSUER.
#
# The revocation path needs two MORE addresses, and neither is derivable from
# the issuer: both are served by the provider's ADMIN API, on its own Service
# and port, reachable only inside the cluster.
#
#   introspectionUrl: where the gateway asks whether an access token has been
#               revoked — the admin path `/admin/oauth2/introspect`. Asked per
#               request through a short-TTL cache. Drives
#               KACHO_HYDRA_INTROSPECTION_URL.
#   adminUrl:   admin API base the logout handler uses to end the provider-side
#               session (`DELETE /admin/oauth2/auth/sessions/login`). Drives
#               KACHO_HYDRA_ADMIN_URL.
#
# Both were DERIVED from the public issuer when unset, and no profile set
# either, so every stand ran with them aimed at a server that serves neither.
# They are no longer derived: unset means the control is off, and a
# production-class gateway refuses to start in that state. The provider's admin
# API carries no authentication of its own — it is protected by not being
# routable — so no credentials accompany these addresses; do not publish the
# admin Service outside the cluster.
#
#   hydra:
#     jwksUrl:          http://kacho-umbrella-hydra-public.kacho.svc.cluster.local:4444/.well-known/jwks.json
#     issuer:           https://hydra.api.kacho.cloud
#     introspectionUrl: http://kacho-umbrella-hydra-admin.kacho.svc.cluster.local:4445/admin/oauth2/introspect
#     adminUrl:         http://kacho-umbrella-hydra-admin.kacho.svc.cluster.local:4445
#   adminCa:    trust anchor for the admin hop, when that hop is served over
#               TLS. Since the revocation check moved onto the authN layer the
#               hop carries the caller's LIVE bearer on every introspection
#               cache miss — before that only administrative calls went that
#               way — so the transport is now a tenant-data question, not just
#               an operational one. An in-cluster provider certificate is issued
#               by the internal CA, which the gateway does not trust by default
#               (its default pool is the system roots); this mounts the bundle
#               and points KACHO_HYDRA_ADMIN_CA_FILE at it.
#
#               Set it together with an https address, never instead of one, and
#               never a bundle that does not sign the provider's certificate: an
#               unknown-authority handshake is classified as PERMANENT
#               misconfiguration by the introspection layer, which then refuses
#               every request rather than waving them through. A bundle that
#               cannot be read, or that holds no certificate, refuses the start.
#
#     adminCa:
#       secretName: hydra-admin-tls   # secret carrying the internal-CA bundle
#       key: ca.crt
#       mountPath: /etc/api-gateway/hydra-admin-ca
hydra:
  jwksUrl: ""
  issuer: ""
  introspectionUrl: ""
  adminUrl: ""
  # Empty secretName ⇒ no volume, no mount, no env: the hop keeps the default
  # transport. That is correct for a plaintext in-cluster admin API and wrong for
  # an https one — see admin-hop-transport-test.sh, which fails a profile whose
  # address is https while this is unset.
  adminCa:
    secretName: ""
    key: ca.crt
    mountPath: /etc/api-gateway/hydra-admin-ca

# AuthZ — per-RPC authorization middleware.
#   enabled: when true, every authenticated request is gated by a
#     `kacho.cloud.iam.v1.AuthorizeService.Check` fan-out. When false (the
#     Go-config default) the middleware is wired but pass-through — only
#     anonymous-mutating requests are blocked (by kacho-iam authzguard), so
#     authenticated-but-unauthorized requests leak through.
#   failOpen: when true, transient IAM-Check failures (Unavailable / timeout)
#     ALLOW the request. Production edition MUST set false (fail-closed). The
#     access-matrix newman suite also needs false so DENY decisions are not
#     masked by IAM hiccups.
#   iamAuthorizeUrl: explicit gRPC address of kacho-iam AuthorizeService
#     (public port 9090). Empty → derived from the `iam` backend address
#     (KACHO_API_GATEWAY_IAM_GRPC). AuthorizeService is the PUBLIC RPC — it is
#     NOT routed through the internal :9091 listener (loop-prevention #6).
#
# Default {} → no KACHO_API_GATEWAY_AUTHZ_* env emitted; Go-config defaults
# (enabled=false, failOpen=false) apply. The dev overlay enables it.
authz: {}

# ─── Deployment-environment label (KACHO_APP_ENV) ────────────────────────────
# Cross-cutting, domain-LESS label (config.go binds `envconfig:"KACHO_APP_ENV"`,
# NOT the per-domain KACHO_API_GATEWAY_* scheme) that keys the composition-root
# production guards: validateProductionAuthzConfig (refuses authn.mode=dev / dev
# HMAC secret) AND validateProductionInternalListener (refuses an insecure internal
# :9091 listener). Secure-by-default: only the explicit dev-class labels
# "dev"/"local"/"test" tolerate the dev auth + insecure-listener posture; every
# other value — INCLUDING empty/unset — is production-class and fails closed, so a
# forgotten label can never silently downgrade to dev.
#
# Default "" → no env emitted → the Go default "" (production-class) applies (zero
# regression for overlays that omit it). The dev overlay sets appEnv: dev; the
# production overlays set appEnv: production (explicit) — both first-class here,
# replacing the earlier generic extraEnv.KACHO_APP_ENV passthrough.
appEnv: ""

# ─── cluster-internal :9091 gRPC listener security (InternalAuthzCacheService) ──
# The dedicated internal listener hosts InternalAuthzCacheService.InvalidateSubject,
# dialed by the kacho-iam subject-change push-drainer. security.md invariant #1/#4:
# the internal perimeter is NOT a trusted zone → mTLS transport (AuthN) + a per-RPC
# SPIFFE caller allow-list (AuthZ) are mandatory. In a production-class env (appEnv
# not dev/local/test) validateProductionInternalListener FATAL-fails the boot unless
# mtls.enable=true here — before this first-class block the only way to wire it was
# the generic extraEnv passthrough, a dev-masked gap that crash-looped the gateway
# under values.prod.yaml.
#
# Server cert: reuses the pod's already-mounted EXTERNAL TLS server secret (tls.*
# above → /etc/api-gateway/tls) — cert-manager issues it from the internal CA on the
# mTLS stands, so the iam push-drainer verifies it against the same internal CA it
# dials with. Incoming client certs are verified against the internal CA
# (KACHO_API_GATEWAY_MTLS_CA_FILE = mtls.mountPath/ca.crt), so this block REQUIRES
# mtls.enable=true (which mounts the internal-CA bundle + sets MTLS_CA_FILE); the
# deployment template hard-fails the render otherwise (fail-fast, not a silent
# half-secured boot). allowedSpiffe = the verified client SANs authorised to invoke
# the listener — the iam module identity is the ONLY legitimate caller.
internalListener:
  mtls:
    enable: false
    certFile: /etc/api-gateway/tls/tls.crt
    keyFile: /etc/api-gateway/tls/tls.key
  allowedSpiffe:
    - spiffe://kacho.cloud/ns/kacho/sa/kacho-iam
  # gRPC server-reflection on the internal listener — debug/incident only (it
  # enumerates the internal admin surface). Default off.
  reflection: false

# ─── mTLS — per-edge backend-dial (cert-manager internal-CA) ─────────────────
# api-gateway is a backend-dial CLIENT (it terminates EXTERNAL TLS separately via
# `tls.*` above — that is unrelated). enable=false (default) → НИ client-cert
# secret, НИ KACHO_API_GATEWAY_MTLS_* env → every backend dial insecure, текущее
# dev (нулевая регрессия). umbrella прокидывает .mtls.enable + per-edge флаги.
#
# One shared "api-gateway" client identity across all edges: the cert-manager
# `api-gateway-client-tls` secret. Per-edge ENABLE toggles each edge
# independently. SERVER_NAME is INTENTIONALLY left unset → config.go
# EdgeTLSClient derives it from each dial-host (`hostFromAddr`), so the iam/nlb
# edges verify against BOTH their public (kacho-iam / kacho-nlb) AND internal
# (kacho-iam-internal / kacho-nlb-internal) dial-hosts — both are in the peer
# server-SAN. A single override would force one name and break the other.
mtls:
  enable: false
  # ─── internal-CA leaf-cert issuance (this chart owns its Certificate) ────────
  # client-only: api-gateway dials backends over mTLS; its external server TLS uses
  # the separate `tls.*` secret above. URI-SAN saName MUST match the IAM module-SA
  # seed: kacho-api-gateway → sva(md5("kacho-api-gateway")) (identity-only role).
  issuer:
    name: kacho-internal-ca
    kind: ClusterIssuer   # ClusterIssuer (cluster-scoped), NOT namespaced Issuer
  spiffe:
    trustDomain: kacho.cloud
    namespace: kacho
    saName: kacho-api-gateway
  leafDuration: 2160h
  leafRenewBefore: 720h
  clientSecretName: api-gateway-client-tls   # cert key = api-gateway
  mountPath: /etc/api-gateway/mtls           # <mp>/{tls.crt,tls.key,ca.crt}
  # hybrid: external TLS listener = VerifyClientCertIfGiven + internal CA as
  # ClientCAs → cert-bearing client authenticates by cert SPIFFE identity, browser
  # (no cert) falls back to JWT. Internal listeners stay strict mTLS. Default off.
  hybridExternal: false
  edges:
    vpc: false        # gateway→vpc (+ vpcInternal)
    compute: false    # gateway→compute (+ computeInternal)
    iam: false        # gateway→iam (+ iamInternal); shared by authz/subject dials
    nlb: false        # gateway→nlb (+ nlbInternal)
    geo: false        # gateway→geo (+ geoInternal); SERVER_NAME unset → derived per
                      # dial-host (kacho-geo / kacho-geo-internal), both in peer SAN
    registry: false   # gateway→registry (+ registryInternal); SERVER_NAME unset →
                      # derived per dial-host (kacho-registry / kacho-registry-internal)
    storage: false    # gateway→storage (+ storageInternal); SERVER_NAME unset →
                      # derived per dial-host (kacho-storage), in peer SAN

# Arbitrary env vars escape-hatch (key: value).
extraEnv: {}

# Default replicas=1; HPA autoscales up to 10 on CPU 70%.
# api-gateway is the request-side bottleneck (~3500 RPS/pod baseline)
# under the in-cluster 10k load test.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# NOTE (per-pod state under HPA): the Idempotency-Key single-flight store and the
# DPoP jti replay cache are per-pod in-memory. With maxReplicas > 1 they are NOT
# global — same-key double-submits that land on different pods can each proceed,
# and a captured DPoP proof can be replayed at most once per replica within the
# 60s iat-freshness window. This is an accepted residual with compensating
# controls (downstream services are the real exactly-once authority via DB-level
# invariants; replay is bounded by freshness). See
# docs/architecture/known-divergences.md §3. Do NOT cap maxReplicas to 1 to
# "fix" it — that trades an edge case for a capacity regression on the RPS
# bottleneck; the correct fix is a shared store (Postgres/Redis).
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# INFRA sec-hardening — единый security-floor, идентичный kacho-iam/geo/nlb/registry.
#
# Заведён 2026-07-16: trivy config-скан впервые покрыл ВЕСЬ репозиторий и нашёл, что
# securityContext есть лишь у половины сервисов. В polyrepo IaC-скан был ТОЛЬКО у
# kacho-iam, а в том репо нет ни одного k8s-манифеста (чарты жили в kacho-deploy) —
# гейт зеленел, не проверяя ничего.
#
# runAsUser 65532 совпадает с `USER 65532` в Dockerfile — образ уже собран под nonroot.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem требует writable-scratch: контейнер монтирует emptyDir на /tmp
# (см. deployment.yaml). Без него сервис падает на первой же записи во временный файл.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
