{{/*
ПРАВИЛА ТРЕВОГИ КРАЯ ПОСТАВЛЯЮТСЯ ОБЪЕКТОМ, А НЕ ТЕКСТОМ СТРАНИЦЫ.

Предмет — звено ограничителя анонимной почты (NTF-2, решение Д66). Поток выше
пропускной способности строки общего ведра кончается ЗАКРЫТЫМ отказом 503 — это
принятая цена замысла, а не дефект. Цена принята при условии, что она ВИДНА:
серия `kacho_api_gateway_anon_mail_bucket_wait_timeouts_total` и правило по
ней. Правило, которое надо перепечатать руками со страницы, не перепечатает
никто, поэтому оно едет объектом вместе с чартом.

ВЫКЛЮЧАТЕЛЬ ОБЯЗАТЕЛЕН. `PrometheusRule` — вид ЧУЖОГО оператора. Где CRD нет,
схема кластера отвергнет объект, и отвергнет она ВСЮ установку края, а не одну
тревогу. Поэтому цепочка без оператора выключает объект ручкой
`alertRules.enabled=false` — и обязана назвать причину в
`alertRules.disabledBecause`: выключение без причины неотличимо от «забыли»,
и рендер его отвергает.

Умолчание — `true`: правило, поставленное молча, звонит; правило, НЕ
поставленное молча, молчит, а молчание неотличимо от исправности.

ВЫРАЖЕНИЯ ЗДЕСЬ — КОПИЯ ОПУБЛИКОВАННОЙ СТРАНИЦЫ
(`gateway/docs/content/install/observability.mdx`), два места об одном
предмете. Разъехаться молча они не могут: alert_rules_delivered_test.go сверяет
набор объекта с набором страницы В ОБЕ СТОРОНЫ (имя, выражение, выдержка, текст
для дежурного) на каждой цепочке стендов. Правя одну сторону, правьте обе;
вывести объект из страницы на рендере нельзя — helm не читает mdx.

ПОРОГ — ПЕРВЫЙ ОТКАЗ ЗА ОКНО, И ЭТО ВРЕМЕННО. Числа нагрузочного прогона
пропускной способности решения ограничителя нет ни для одной ревизии, профиля
флота или машины: порог в долях потока выбрать не из чего. Поэтому стоит
консервативный — любой отказ за 10 минут. ПЕРЕМЕРИТЬ: после нагрузочного
прогона звена (ревизия, число реплик края, класс базы — в записи прогона)
порог переводится в долю отказов от потока, правкой обеих сторон.
*/}}
{{- if not .Values.alertRules.enabled }}
{{- if not .Values.alertRules.disabledBecause }}
{{- fail "alertRules.enabled=false без alertRules.disabledBecause: выключение правил тревоги края обязано назвать причину (например, «CRD PrometheusRule на кластере нет — замер <дата>»). Без причины выключение неотличимо от «забыли», а невыставленная тревога молчит так же, как исправное звено." }}
{{- end }}
{{- else }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.name }}
  namespace: kacho
  labels:
    app: {{ .Values.name }}
spec:
  groups:
    - name: {{ .Values.name }}-anon-mail
      rules:
        - alert: KachoApiGatewayAnonMailSaturated
          expr: sum(increase(kacho_api_gateway_anon_mail_bucket_wait_timeouts_total[10m])) > 0
          for: 5m
          annotations:
            summary: "ограничитель анонимной почты насыщен: решения флота не получают общее ведро, запросы закрыты отказом 503 и письма не уходят"

        - alert: KachoApiGatewayAnonMailStoreUnavailable
          expr: sum(increase(kacho_api_gateway_anon_mail_store_unavailable_total[10m])) > 0
          for: 5m
          annotations:
            summary: "ограничитель анонимной почты отвечает 503: хранилище не ответило в срок либо исход фиксации не разрешён; насыщение входит сюда же"
{{- end }}
