{{/*
ПРАВИЛА ТРЕВОГИ КРАЯ ПОСТАВЛЯЮТСЯ ОБЪЕКТОМ, А НЕ ТЕКСТОМ СТРАНИЦЫ.

Предмет — звено ограничителя анонимной почты (NTF-2, решения Д66, Д69, Д71).
Поток выше пропускной способности строки общего ведра кончается ЗАКРЫТЫМ
отказом 503 — это принятая цена замысла, а не дефект. Цена принята при условии,
что она ВИДНА, и видна ДО отказов: опережающее правило уровня warning по доле
занятости строки ведра (`…_bucket_hold_seconds_total`) звонит, пока запас ещё
есть; правило уровня critical по ожиданиям ведра (`…_bucket_wait_timeouts_total`)
— когда отказы уже идут. Правило, которое надо перепечатать руками со
страницы, не перепечатает никто, поэтому оно едет объектом вместе с чартом.

ВЫКЛЮЧАТЕЛЬ ОБЯЗАТЕЛЕН И ЖИВЁТ ПОД `global` (CX2-92 (а)). `PrometheusRule` —
вид ЧУЖОГО оператора. Где CRD нет, схема кластера отвергнет объект, и отвергнет
она ВСЮ установку края, а не одну тревогу. Поэтому цепочка без оператора
выключает объект ручкой `global.kacho.alertRules.enabled=false` — одной на
дерево kacho — и обязана назвать причину в
`global.kacho.alertRules.disabledBecause`: выключение без причины неотличимо от
«забыли», и рендер его отвергает. Умолчание чарта — `true`: правило,
поставленное молча, звонит; правило, НЕ поставленное молча, молчит, а молчание
неотличимо от исправности.

ВЫРАЖЕНИЯ ЗДЕСЬ — КОПИЯ ОПУБЛИКОВАННОЙ СТРАНИЦЫ
(`gateway/docs/content/install/observability.mdx`), два места об одном
предмете. Разъехаться молча они не могут: alert_rules_delivered_test.go сверяет
набор объекта с набором страницы В ОБЕ СТОРОНЫ (имя, выражение, выдержка,
уровень, текст для дежурного) на каждой цепочке стендов. Правя одну сторону,
правьте обе; вывести объект из страницы на рендере нельзя — helm не читает mdx.

ПОРОГИ И ОТКУДА ОНИ.
  AnonMailBucketSaturation `> 0.8` — ОРИЕНТИР ДО ЗАМЕРА, НЕ ДОВОД. Доля
    занятости строки ведра, при которой начинаются отказы, зависит от времени
    удержания строки, а оно — от задержки базы; числа нагрузочного прогона нет
    ни для одной ревизии, флота или машины. Порог снимается предметом
    «нагрузочный прогон звена анонимной почты с флотом 2» (эпик #2917, полоса
    E2 tasks.md; задачу заводит трекер). ПРЕДИКАТ СНЯТИЯ: запись прогона
    называет ревизию дерева, профиль флота (2 реплики, хранилище postgres),
    машину и медиану RTT до базы края за прогон (атрибуция R25-4) и печатает
    долю занятости в момент первого 503 по насыщению; порог ставится НИЖЕ
    напечатанной доли правкой обеих сторон, а эта запись заменяется атрибуцией
    числа. Смена любой из четырёх величин атрибуции — новый прогон и новый порог.
  AnonMailBucketExhausted `> 0` — не ориентир: любой отказ по насыщению за окно
    означает, что анонимные глаголы уже получают 503.
  AnonMailStoreUnavailable — 503 ограничителя за вычетом насыщения: отказывает
    само хранилище; порог `> 0` по той же причине.
  AnonMailClockSkew `> 2` (секунды) — выведен из кода, а не выбран: смещение
    меряется как «момент решения минус часы базы», момент решения берётся до
    захвата соединения и блокировок, и измерение смещено вниз не больше чем на
    срок решения (anonMailDecisionBudget = 1,5 с). Порог — срок решения плюс
    0,5 с: ожидание внутри решения его не достигает, сдвиг часов больше
    полусекунды сверх срока — достигает.
*/}}
{{- $ar := dig "kacho" "alertRules" dict (.Values.global | default dict) }}
{{- if not $ar.enabled }}
{{- if not $ar.disabledBecause }}
{{- fail "global.kacho.alertRules.enabled=false без global.kacho.alertRules.disabledBecause: выключение правил тревоги края обязано назвать причину (например, «CRD PrometheusRule на кластере нет — замер <дата>»). Без причины выключение неотличимо от «забыли», а невыставленная тревога молчит так же, как исправное звено." }}
{{- end }}
{{- else }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.name }}
  namespace: kacho
  labels:
    app: {{ .Values.name }}
spec:
  groups:
    - name: {{ .Values.name }}-anon-mail
      rules:
        - alert: AnonMailBucketSaturation
          expr: sum(rate(kacho_api_gateway_anon_mail_bucket_hold_seconds_total[5m])) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "строка общего ведра ограничителя анонимной почты занята больше 80% времени: запас до закрытых отказов 503 исчерпывается"

        - alert: AnonMailBucketExhausted
          expr: sum(rate(kacho_api_gateway_anon_mail_bucket_wait_timeouts_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ограничитель анонимной почты насыщен: решения флота не получают общее ведро, запросы закрыты отказом 503 и письма не уходят"

        - alert: AnonMailStoreUnavailable
          expr: (sum(rate(kacho_api_gateway_anon_mail_store_unavailable_total[5m])) - sum(rate(kacho_api_gateway_anon_mail_bucket_wait_timeouts_total[5m]))) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ограничитель анонимной почты отвечает 503 не по насыщению: хранилище не ответило в срок либо исход фиксации не разрешён"

        - alert: AnonMailClockSkew
          expr: max(abs(kacho_api_gateway_anon_mail_clock_offset_seconds)) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "часы реплики края расходятся с часами базы ограничителя больше чем на 2 с: окна счёта и ведро общего потока судятся сдвинутыми часами"
{{- end }}
