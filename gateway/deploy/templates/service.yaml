apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    {{- include "api-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: cmux
      port: {{ .Values.port }}
      targetPort: cmux
    {{- if include "api-gateway.internalRestEnabled" . }}
    # Cluster-internal admin REST (Internal* paths). SECURITY (ban #6): the
    # ingress MUST NOT target this port — it exists for admin-UI / port-forward /
    # in-cluster tooling only. The ingress routes solely to the `cmux` port.
    # Transport — mTLS only (kacho#3131): a client leaf of the installation CA
    # whose URI-SAN is in the circle (internalRest.* in values.yaml).
    - name: internal-rest
      port: {{ .Values.internalRestPort }}
      targetPort: internal-rest
    {{- end }}
    {{- if .Values.tls.enabled }}
    - name: tls
      port: {{ .Values.tlsPort }}
      targetPort: tls
    {{- end }}
