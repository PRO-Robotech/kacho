apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: kacho
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      annotations:
        # ── ОБЪЯВЛЕНИЕ СБОРА ВЕЛИЧИН ──────────────────────────────────────────
        #
        # Поверхность процесса (`GET /metrics`) поднята и отвечает — и до этой
        # аннотации к ней НИКТО НЕ ПРИХОДИЛ. Поднятая поверхность без того, кто
        # её читает, неотличима от отсутствующей: это та же форма без содержания,
        # только этажом выше.
        #
        # Аннотация пода, а не описатель сбора: описателя обслуживает оператор
        # сбора, а типа его ресурса в этом кластере нет. Аннотацию читают агенты
        # обоих семейств и обращаются к ПОДУ напрямую — поэтому порт в Service и
        # `containerPort` для сбора не нужны и здесь не заводятся.
        #
        # Порт обязан совпадать с адресом, который процесс берёт из своей
        # конфигурации; это сверяет декларативная проверка
        # `TestEveryRenderedChartDeclaresItsScrape`, читающая ОБЪЯВЛЕНИЯ, а не
        # отрендеренный манифест.
        {{- if .Values.metricsScrape.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsScrape.port | quote }}
        prometheus.io/path: /metrics
        {{- else }}
        # Сбор выключен ОБЪЯВЛЕНИЕМ, и причина едет в кластер вместе с подом:
        # оператор, увидевший процесс без объявления сбора, обязан прочитать
        # ПОЧЕМУ, а не гадать, забыли ли. Пустая причина при выключенном сборе —
        # находка декларативной проверки, а не пустая строка.
        kacho.cloud/metrics-scrape-disabled-because: {{ .Values.metricsScrape.disabledBecause | quote }}
        {{- end }}
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ОБРАЗА.
        #
        # Тег локального образа (`kacho-*:dev`) неизменен, поэтому пересборка под
        # тем же тегом НЕ меняет шаблон пода: Kubernetes не видит разницы и под не
        # перекатывается — процесс продолжает работать СТАРЫМ бинарником под новым
        # тегом. Ровно тот же разрыв между намерением и исходом, что и у настроек,
        # приезжающих массовым импортом (инцидент 2026-07-25), и лечится он так же —
        # аннотацией, привязанной к содержимому.
        #
        # Значение — идентификатор содержимого образа; его пишет `make build-services`
        # в helm/umbrella/values.image-ids.yaml сразу после сборки. Профиль, который
        # этот файл не накладывает (offline-рендер, чужой реестр), получает "unset" —
        # и тогда привязки нет, что честно: привязывать не к чему.
        kacho.cloud/image-id: {{ dig "kachoImageIds" "api-gateway" "unset" (.Values.global | default dict) | quote }}
      labels:
        app: {{ .Values.name }}
    spec:
      # INFRA sec-hardening (2026-07-16) — единый security-floor, идентичный
      # kaname/geo/nlb/registry. До этого у gateway securityContext не было вовсе:
      # IaC-скан в polyrepo стоял ТОЛЬКО в kaname, где k8s-манифестов нет (чарты
      # жили в kacho-deploy) — гейт зеленел, не проверяя ничего.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/api-gateway"]
          ports:
            - name: cmux
              containerPort: {{ .Values.port }}
            {{- if .Values.internalRestPort }}
            - name: internal-rest
              containerPort: {{ .Values.internalRestPort }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              containerPort: {{ .Values.tlsPort }}
            {{- end }}
          env:
            - name: KACHO_API_GATEWAY_LISTEN_ADDR
              value: ":{{ .Values.port }}"
            # Dedicated cluster-internal admin REST listener — the ONLY listener
            # that serves Internal* REST (ban #6). NEVER targeted by the ingress.
            # Empty → the internal REST listener is disabled.
            - name: KACHO_API_GATEWAY_INTERNAL_REST_ADDR
              value: {{ if .Values.internalRestPort }}":{{ .Values.internalRestPort }}"{{ else }}""{{ end }}
            # Resource-management backend — kaname (отдельной RESOURCEMANAGER_GRPC переменной нет).
            - name: KACHO_API_GATEWAY_VPC_GRPC
              value: "{{ .Values.backends.vpc }}"
            {{- if .Values.backends.vpcInternal }}
            - name: KACHO_API_GATEWAY_VPC_INTERNAL_GRPC
              value: "{{ .Values.backends.vpcInternal }}"
            {{- end }}
            {{- if .Values.backends.compute }}
            - name: KACHO_API_GATEWAY_COMPUTE_GRPC
              value: "{{ .Values.backends.compute }}"
            {{- end }}
            {{- if .Values.backends.computeInternal }}
            - name: KACHO_API_GATEWAY_COMPUTE_INTERNAL_GRPC
              value: "{{ .Values.backends.computeInternal }}"
            {{- end }}
            {{- if .Values.backends.iam }}
            - name: KACHO_API_GATEWAY_IAM_GRPC
              value: "{{ .Values.backends.iam }}"
            {{- end }}
            {{- if .Values.backends.iamInternal }}
            - name: KACHO_API_GATEWAY_IAM_INTERNAL_GRPC
              value: "{{ .Values.backends.iamInternal }}"
            {{- end }}
            {{- if .Values.backends.nlb }}
            - name: KACHO_API_GATEWAY_NLB_GRPC
              value: "{{ .Values.backends.nlb }}"
            {{- end }}
            {{- if .Values.backends.nlbInternal }}
            - name: KACHO_API_GATEWAY_NLB_INTERNAL_GRPC
              value: "{{ .Values.backends.nlbInternal }}"
            {{- end }}
            {{- if .Values.backends.geo }}
            - name: KACHO_API_GATEWAY_GEO_GRPC
              value: "{{ .Values.backends.geo }}"
            {{- end }}
            {{- if .Values.backends.geoInternal }}
            - name: KACHO_API_GATEWAY_GEO_INTERNAL_GRPC
              value: "{{ .Values.backends.geoInternal }}"
            {{- end }}
            {{- if .Values.backends.registry }}
            - name: KACHO_API_GATEWAY_REGISTRY_GRPC
              value: "{{ .Values.backends.registry }}"
            {{- end }}
            {{- if .Values.backends.registryInternal }}
            - name: KACHO_API_GATEWAY_REGISTRY_INTERNAL_GRPC
              value: "{{ .Values.backends.registryInternal }}"
            {{- end }}
            {{- if .Values.backends.storage }}
            - name: KACHO_API_GATEWAY_STORAGE_GRPC
              value: "{{ .Values.backends.storage }}"
            {{- end }}
            {{- if .Values.backends.storageInternal }}
            - name: KACHO_API_GATEWAY_STORAGE_INTERNAL_GRPC
              value: "{{ .Values.backends.storageInternal }}"
            {{- end }}
            # Проекция потока изменений в браузер (kacho#1020).
            #
            # Перечень владельцев объявляется ВСЕГДА, в том числе пустым: пусто
            # означает «владелец не объявлен», и ручка отвечает `501` с
            # названной причиной. Это НЕ «все домены» — пустое значение,
            # прочитанное как «не сужаем», уже стоило этому дереву круга
            # отправителей, который никого не сужал.
            - name: KACHO_API_GATEWAY_SUBSCRIPTION_OWNERS
              value: {{ .Values.subscriptionStream.owners | quote }}
            # Срок жизни потока обязан быть МЕНЬШЕ предела чтения посредника —
            # КАЖДОГО на пути запроса. Их два, и они разные: собственный вход
            # края (`ingress.proxyReadTimeout`) и раздача консоли с её входом,
            # которыми ходит браузер (`ui-future/deploy/values.yaml` →
            # `subscriptionStream.proxyReadTimeout`). Иначе поток рвёт посредник, и клиент
            # читает это как сетевой сбой, а не как чистое закрытие по сроку.
            # Согласие двух величин держит проба gateway/deploy.
            - name: KACHO_API_GATEWAY_SUBSCRIPTION_STREAM_BUDGET
              value: {{ .Values.subscriptionStream.streamBudget | quote }}
            - name: KACHO_API_GATEWAY_SUBSCRIPTION_HEARTBEAT
              value: {{ .Values.subscriptionStream.heartbeat | quote }}
            - name: KACHO_API_GATEWAY_SUBSCRIPTION_MAX_STREAMS
              value: {{ .Values.subscriptionStream.maxStreams | quote }}
            - name: KACHO_API_GATEWAY_SUBSCRIPTION_MAX_STREAMS_PER_SUBJECT
              value: {{ .Values.subscriptionStream.maxStreamsPerSubject | quote }}
            # Адрес провайдера личности для сессии SPA. Объявляется ВСЕГДА, и
            # умолчание выводится из ИМЕНИ РЕЛИЗА и ПРОСТРАНСТВА ИМЁН, а не
            # вписывается литералом: Service провайдера называется
            # `<релиз>-kratos-public`, поэтому литерал держался бы совпадением
            # имени релиза с тем, что кто-то однажды набрал, и ломался бы молча
            # при установке под другим именем. Значение `disabled` выключает
            # сессионную аутентификацию целиком (сигнальное значение config.go).
            - name: KACHO_API_GATEWAY_KRATOS_PUBLIC_URL
              value: {{ .Values.kratosPublicUrl | default (printf "http://%s-kratos-public.%s.svc:80" .Release.Name .Release.Namespace) | quote }}
            {{- if .Values.tls.enabled }}
            - name: KACHO_API_GATEWAY_TLS_LISTEN_ADDR
              value: ":{{ .Values.tlsPort }}"
            - name: KACHO_API_GATEWAY_TLS_CERT_FILE
              value: "{{ .Values.tls.certPath }}"
            - name: KACHO_API_GATEWAY_TLS_KEY_FILE
              value: "{{ .Values.tls.keyPath }}"
            {{- end }}
            - name: KACHO_API_GATEWAY_ADVERTISED_ENDPOINT
              value: "{{ .Values.advertisedEndpoint }}"
            # Домен доверия установки: то, чьи сертификаты край признаёт своими.
            # Вызывающий, пришедший с проверенным клиентским сертификатом,
            # становится служебной учёткой по своему SPIFFE-имени, и опознаётся
            # оно относительно этого домена. Берётся из ТОГО ЖЕ объявления, под
            # которым чеканится собственный сертификат края (certificate.yaml).
            - name: KACHO_API_GATEWAY_AUTHN_TRUST_DOMAIN
              value: {{ include "api-gateway.trustDomain" . | quote }}
            {{- if .Values.authn }}
            - name: KACHO_API_GATEWAY_AUTHN_MODE
              value: {{ include "api-gateway.authMode" . | default "production" | quote }}
            {{- /* ПОСАДКА ЛИЧНОСТИ (задача #1125): чем стенд проверяет человека.
                 Разводит требование АДМИНИСТРАТИВНОГО адреса поставщика — того,
                 которым выход человека снимает сессию на его стороне; под `own`
                 такой сессии не существует. Полосу интроспекции это поле НЕ
                 разводит: её предмет принадлежит соседней задаче.

                 `default` НЕ ставится намеренно: у процесса умолчания нет, и
                 профиль, поля не объявивший, обязан получить отказ старта с
                 именем ручки — а не тихо унаследовать чужой выбор от шаблона.
                 Умолчание живёт в базовом профиле чарта. */}}
            {{- with .Values.authn.identityProvider }}
            - name: KACHO_API_GATEWAY_IDENTITY_PROVIDER
              value: {{ . | quote }}
            {{- end }}
            # There is deliberately NO way here to hand the gateway a shared signing
            # key. The chart used to offer one (inline and via a Secret reference) for
            # the local stand; both are gone, and this comment stands in their place so
            # the next author does not add a third. A symmetric key means the edge
            # cannot tell a token it was handed from one the identity provider signed,
            # so everyone who can read the profile can also issue — which is not a
            # property a deployed stand may have, whatever it is labelled
            # (security.md §"Production-mode — ОБЯЗАТЕЛЕН ВЕЗДЕ"). The process refuses
            # to start if the variable reaches it by any other route, and
            # gateway/deploy/symmetric_secret_absent_test.go fails if this template
            # learns to emit it again. In-process fixtures are unaffected: they build
            # the middleware directly and never read this chart.
            # Sender-constrained (RFC 7800 `cnf`) token handling.
            #
            # enableDpop mounts the DPoP/mTLS-bound validators (they verify the
            # PROOF for a token that carries `cnf`). Until 2026-07-27 no template
            # emitted this env at all, so that whole validation path was
            # unreachable on every deployed stand regardless of intent — the
            # documented `KACHO_API_GATEWAY_AUTHN_ENABLE_DPOP: "true"` had no way
            # to take effect through the chart.
            {{- if .Values.authn.enableDpop }}
            - name: KACHO_API_GATEWAY_AUTHN_ENABLE_DPOP
              value: "true"
            {{- end }}
            # enforceStepUp applies the per-RPC authentication floor
            # (`required_acr_min`) on the authN layer every request passes
            # through. It is deliberately NOT the knob above: that one demands a
            # proof of possession, which issuance does not yet mint, so sharing
            # one switch is how the floor came to be declared per RPC, mirrored
            # into the identity service, and applied by nothing on every stand.
            # A production-class environment refuses to start with this off while
            # the catalog declares a floor.
            {{- if .Values.authn.enforceStepUp }}
            - name: KACHO_API_GATEWAY_AUTHN_ENFORCE_STEP_UP
              value: "true"
            {{- end }}
            # requireMachineTokenBinding demands that MACHINE principals
            # (service accounts) present a bound token; unbound ⇒ 401. Machines
            # are exempt from step-up because they have no second factor, so
            # proof-of-possession is what replaces it. The human path is
            # unaffected. Default off — see values.yaml for the rollout order.
            {{- if .Values.authn.requireMachineTokenBinding }}
            - name: KACHO_API_GATEWAY_AUTHN_REQUIRE_MACHINE_TOKEN_BINDING
              value: "true"
            {{- end }}
            {{- end }}
            {{- if .Values.hydra }}
            # Hydra JWKS for RS256 access-token verification.
            # KACHO_HYDRA_JWKS_URL MUST be the cluster-internal Hydra PUBLIC
            # Service (e.g. kacho-umbrella-hydra-public:4444/.well-known/jwks.json),
            # reachable from the gateway pod. Without it config.ResolvedHydraJWKSURL()
            # derives the public issuer host, which the pod cannot reach → Hydra
            # login tokens never validate → WhoAmI/Account/Project → code 16.
            {{- if .Values.hydra.jwksUrl }}
            - name: KACHO_HYDRA_JWKS_URL
              value: {{ .Values.hydra.jwksUrl | quote }}
            {{- end }}
            {{- if .Values.hydra.issuer }}
            - name: KACHO_HYDRA_ISSUER
              value: {{ .Values.hydra.issuer | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.tokenAcceptance }}
            # Ф1б (#926) — издатель на крае стал МНОЖЕСТВОМ, и у каждого
            # принимаемого издателя СВОЯ объявленная запись источника ключей.
            # Объединить наборы было бы дешевле и уничтожило бы ровно ту защиту,
            # ради которой развязка делается: ключ одного издателя проверял бы
            # токен, объявляющий другого.
            #
            # Пустое значение рендерится НАМЕРЕННО: «не объявлено» и «объявлено
            # пустым» различает сам процесс, и различие это — предмет стража
            # старта, а не шаблона.
            - name: KACHO_API_GATEWAY_TOKEN_ISSUERS
              value: {{ .Values.tokenAcceptance.issuers | quote }}
            - name: KACHO_API_GATEWAY_TOKEN_ISSUER_KEYSETS
              value: {{ .Values.tokenAcceptance.issuerKeySets | quote }}
            - name: KACHO_API_GATEWAY_PLATFORM_TOKEN_ISSUER
              value: {{ .Values.tokenAcceptance.platformIssuer | quote }}
            # Отзыв НАШИХ токенов читается У НАС и НА ПРЕДЪЯВЛЕНИИ: прежний
            # провайдер о наших токенах не знает by construction. Адрес задаётся
            # явно; выведенный из адреса соседа он был бы всегда непуст, то есть
            # контроль выглядел бы включённым, ведя в никуда.
            - name: KACHO_API_GATEWAY_PLATFORM_TOKEN_REVOCATION_URL
              value: {{ .Values.tokenAcceptance.revocationUrl | quote }}
            {{- if (.Values.tokenAcceptance.revocationCa | default dict).secretName }}
            - name: KACHO_API_GATEWAY_PLATFORM_TOKEN_REVOCATION_CA_FILE
              value: {{ printf "%s/%s" .Values.tokenAcceptance.revocationCa.mountPath .Values.tokenAcceptance.revocationCa.key | quote }}
            {{- end }}
            {{- if (.Values.tokenAcceptance.revocationClientCert | default dict).certFile }}
            # Клиентская пара хопа к авторитету отзыва. Своего тома нет: пути
            # указывают на уже смонтированную клиентскую личность края, потому
            # что вторая копия той же личности разъехалась бы с первой молча.
            - name: KACHO_API_GATEWAY_PLATFORM_TOKEN_REVOCATION_CERT_FILE
              value: {{ .Values.tokenAcceptance.revocationClientCert.certFile | quote }}
            - name: KACHO_API_GATEWAY_PLATFORM_TOKEN_REVOCATION_KEY_FILE
              value: {{ .Values.tokenAcceptance.revocationClientCert.keyFile | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.hydra }}
            # Revocation path. A verified signature says who minted the token and
            # when it lapses; it cannot say whether the token has since been
            # turned off. Only the provider knows that, over its ADMIN API —
            # a different Service and port from the public issuer, so neither
            # address is derivable and both must be stated here.
            #
            # introspectionUrl is asked per request (through a short-TTL cache)
            # before a request is let through; adminUrl is how the logout handler
            # ends the provider-side session. Unset, each control is simply off,
            # and a production-class gateway now refuses to start rather than run
            # that way. Guarded by gateway/deploy/revocation_endpoint_test.go,
            # which reads the profiles rather than a render, so it cannot skip.
            {{- if .Values.hydra.introspectionUrl }}
            - name: KACHO_HYDRA_INTROSPECTION_URL
              value: {{ .Values.hydra.introspectionUrl | quote }}
            {{- end }}
            {{- if .Values.hydra.adminUrl }}
            - name: KACHO_HYDRA_ADMIN_URL
              value: {{ .Values.hydra.adminUrl | quote }}
            {{- end }}
            # Trust anchor for the admin hop. Since the revocation check moved
            # onto the authN layer, that hop carries the caller's LIVE bearer on
            # every introspection cache miss — not just administrative calls.
            # Moving it to https only helps if the certificate is VERIFIED, and
            # an in-cluster provider certificate comes from the internal CA,
            # which the gateway does not trust by default. Set together with an
            # https address; a bundle that cannot be read or holds no
            # certificate REFUSES THE START rather than quietly reverting to the
            # system root store.
            {{- if .Values.hydra.adminCa.secretName }}
            - name: KACHO_HYDRA_ADMIN_CA_FILE
              value: {{ printf "%s/%s" (trimSuffix "/" .Values.hydra.adminCa.mountPath) .Values.hydra.adminCa.key | quote }}
            {{- end }}
            {{- if (.Values.hydra.jwksCa | default dict).secretName }}
            # Trust anchor for the KEY-FETCH hop. Over this hop travels the material
            # the edge verifies every bearer's SIGNATURE with, so whoever substitutes
            # it substitutes the access decision itself. Same requirement as the admin
            # hop, separate knob because it is a different peer.
            - name: KACHO_HYDRA_JWKS_CA_FILE
              value: {{ printf "%s/%s" (trimSuffix "/" .Values.hydra.jwksCa.mountPath) .Values.hydra.jwksCa.key | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.authz }}
            - name: KACHO_API_GATEWAY_AUTHZ_ENABLED
              value: {{ .Values.authz.enabled | default false | quote }}
            - name: KACHO_API_GATEWAY_AUTHZ_FAIL_OPEN
              value: {{ .Values.authz.failOpen | default false | quote }}
            {{- if .Values.authz.iamAuthorizeUrl }}
            - name: KACHO_API_GATEWAY_IAM_AUTHORIZE_URL
              value: {{ .Values.authz.iamAuthorizeUrl | quote }}
            {{- end }}
            {{- if .Values.authz.cacheTtlSeconds }}
            - name: KACHO_API_GATEWAY_AUTHZ_CACHE_TTL_SECONDS
              value: {{ .Values.authz.cacheTtlSeconds | quote }}
            {{- end }}
            {{- if .Values.authz.checkTimeoutMs }}
            - name: KACHO_API_GATEWAY_AUTHZ_CHECK_TIMEOUT_MS
              value: {{ .Values.authz.checkTimeoutMs | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.mtls.enable }}
            {{- $mp := .Values.mtls.mountPath }}
            # Per-edge backend-dial mTLS. Shared "api-gateway" client
            # identity (cert-manager api-gateway-client-tls). SERVER_NAME unset →
            # config.go EdgeTLSClient derives it per dial-host (covers public +
            # internal hosts, both in the peer server-SAN).
            - name: KACHO_API_GATEWAY_MTLS_CLIENT_CERT_FILE
              value: {{ printf "%s/tls.crt" $mp | quote }}
            - name: KACHO_API_GATEWAY_MTLS_CLIENT_KEY_FILE
              value: {{ printf "%s/tls.key" $mp | quote }}
            - name: KACHO_API_GATEWAY_MTLS_CA_FILE
              value: {{ printf "%s/ca.crt" $mp | quote }}
            {{- if .Values.mtls.edges.vpc }}
            - name: KACHO_API_GATEWAY_MTLS_VPC_ENABLE
              value: "true"
            {{- end }}
            {{- if .Values.mtls.edges.compute }}
            - name: KACHO_API_GATEWAY_MTLS_COMPUTE_ENABLE
              value: "true"
            {{- end }}
            {{- if .Values.mtls.edges.iam }}
            - name: KACHO_API_GATEWAY_MTLS_IAM_ENABLE
              value: "true"
            {{- end }}
            {{- if .Values.mtls.edges.nlb }}
            - name: KACHO_API_GATEWAY_MTLS_NLB_ENABLE
              value: "true"
            {{- end }}
            {{- if .Values.mtls.edges.geo }}
            - name: KACHO_API_GATEWAY_MTLS_GEO_ENABLE
              value: "true"
            {{- end }}
            {{- if .Values.mtls.edges.registry }}
            - name: KACHO_API_GATEWAY_MTLS_REGISTRY_ENABLE
              value: "true"
            {{- end }}
            {{- if .Values.mtls.edges.storage }}
            # gateway→storage backend mTLS. storage.mtls.enable=true makes the storage
            # server RequireAndVerifyClientCert on both listeners, so the gateway must
            # present its client leaf; SERVER_NAME derives from the dial-host
            # (kacho-storage.kacho.svc ∈ storage server-cert SAN).
            - name: KACHO_API_GATEWAY_MTLS_STORAGE_ENABLE
              value: "true"
            {{- end }}
            {{- if .Values.mtls.hybridExternal }}
            # Hybrid external TLS listener uses VerifyClientCertIfGiven with
            # the internal CA (MTLS_CA_FILE above) as ClientCAs — a client WITH a
            # valid kacho client-cert authenticates by cert identity (SPIFFE SAN),
            # a browser WITHOUT a cert falls back to JWT. Internal listeners stay
            # strict (RequireAndVerifyClientCert).
            - name: KACHO_API_GATEWAY_HYBRID_MTLS_EXTERNAL
              value: "true"
            {{- end }}
            {{- end }}
            {{- if .Values.appEnv }}
            # Deployment-env label (domain-LESS KACHO_APP_ENV) — keys the
            # composition-root production guards (validateProductionAuthzConfig +
            # validateProductionInternalListener). Empty/unset ⇒ production-class
            # (fail-closed); only dev/local/test tolerate the dev posture.
            - name: KACHO_APP_ENV
              value: {{ .Values.appEnv | quote }}
            {{- end }}
            # ── ОДНОКРАТНОСТЬ Idempotency-Key: ХРАНИЛИЩЕ И ФЛОТ — ОДНО ОБЪЯВЛЕНИЕ (#694) ──
            #
            # Размер флота НЕ выписывается второй раз: он ВЫВОДИТСЯ из тех же
            # значений, что питают автомасштабирование. Два объявления об одном
            # предмете расходятся молча — здесь они расходиться не могут by
            # construction.
            {{- $fleet := int .Values.replicas }}
            {{- if .Values.autoscaling.enabled }}
            {{- $fleet = int .Values.autoscaling.maxReplicas }}
            {{- end }}
            {{- if and (eq .Values.idempotency.store "memory") (gt $fleet 1) }}
            {{- fail (printf "idempotency.store=memory keeps Idempotency-Key records inside one process, but this profile declares up to %d api-gateway replicas (autoscaling.maxReplicas / replicas). A repeat that lands on another replica finds no record and the mutation runs a second time, silently — the header promises exactly-once and would not deliver it. Either declare one replica, or set idempotency.store=postgres with idempotency.dsn (or idempotency.existingSecret) pointing at a store the whole fleet shares. See gateway/docs/engineering/architecture/known-divergences.md §3." $fleet) }}
            {{- end }}
            - name: KACHO_GATEWAY_FLEET_SIZE
              value: {{ $fleet | quote }}
            - name: KACHO_IDEMPOTENCY_STORE
              value: {{ .Values.idempotency.store | quote }}
            {{- if eq .Values.idempotency.store "postgres" }}
            {{- if .Values.idempotency.existingSecret }}
            - name: KACHO_IDEMPOTENCY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.idempotency.existingSecret }}
                  key: {{ .Values.idempotency.secretKey }}
            {{- else }}
            {{- if not .Values.idempotency.dsn }}
            {{- fail "idempotency.store=postgres but neither idempotency.dsn nor idempotency.existingSecret is set — the shared idempotency store would have no address. Deriving one from a neighbour's address is forbidden: it is never empty, so the store would look configured and lead nowhere." }}
            {{- end }}
            - name: KACHO_IDEMPOTENCY_DSN
              value: {{ .Values.idempotency.dsn | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # volumeMounts стал БЕЗУСЛОВНЫМ: /tmp нужен всегда, потому что rootfs
          # read-only независимо от tls/mtls. Записи tls/mtls остаются под своими if.
          volumeMounts:
            # Writable scratch для read-only-rootfs.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/api-gateway/tls
              readOnly: true
            {{- end }}
            {{- if .Values.mtls.enable }}
            # mTLS — backend-dial client-cert (cert-manager internal-CA).
            - name: mtls-client
              mountPath: {{ .Values.mtls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.hydra.adminCa.secretName }}
            # Trust anchor for the identity provider's ADMIN API (see the
            # KACHO_HYDRA_ADMIN_CA_FILE env above). Its own mount rather than a
            # reuse of the mTLS bundle: the hop is one-way server-TLS to a
            # different peer, and tying it to the backend-dial client-cert would
            # make it impossible to configure the two independently.
            - name: hydra-admin-ca
              mountPath: {{ .Values.hydra.adminCa.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if (.Values.hydra.jwksCa | default dict).secretName }}
            - name: hydra-jwks-ca
              mountPath: {{ .Values.hydra.jwksCa.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if ((.Values.tokenAcceptance | default dict).revocationCa | default dict).secretName }}
            - name: platform-revocation-ca
              mountPath: {{ .Values.tokenAcceptance.revocationCa.mountPath | quote }}
              readOnly: true
            {{- end }}
          # ГОТОВНОСТЬ СПРАШИВАЕТСЯ ПО ТОМУ, ЧТО КРАЙ СТРОИТ. `/readyz` опрашивает
          # grpc.health.v1.Health у каждого backend и отвечает 503 ТОЛЬКО когда
          # недоступен критичный (iam фронтит authN+authZ на каждом запросе);
          # падение одного домена оставляет реплику Ready намеренно, иначе
          # одно-доменный сбой амплифицируется в полный отказ края (см. godoc
          # health.HTTPReadyz).
          #
          # Прежде ОБА слота спрашивали `/healthz` — безусловный 200, который о
          # backend'ах не знает ничего. Край, потерявший iam, оставался в ротации и
          # принимал запросы, которые не мог авторизовать.
          #
          # Живость остаётся `/healthz` намеренно: готовность зависит от соседей, и
          # ставить её в слот живости значило бы перезапускать край из-за чужого
          # сбоя.
          readinessProbe:
            httpGet:
              path: /readyz
              port: cmux
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: cmux
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
      # volumes стал БЕЗУСЛОВНЫМ ради tmp (см. volumeMounts выше).
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        {{- if .Values.mtls.enable }}
        # mTLS — backend-dial client-cert secret (cert-manager internal-CA).
        - name: mtls-client
          secret:
            secretName: {{ .Values.mtls.clientSecretName | quote }}
        {{- end }}
        {{- if .Values.hydra.adminCa.secretName }}
        - name: hydra-admin-ca
          secret:
            secretName: {{ .Values.hydra.adminCa.secretName | quote }}
            items:
              - key: {{ .Values.hydra.adminCa.key | quote }}
                path: {{ .Values.hydra.adminCa.key | quote }}
        {{- end }}
        {{- if (.Values.hydra.jwksCa | default dict).secretName }}
        - name: hydra-jwks-ca
          secret:
            secretName: {{ .Values.hydra.jwksCa.secretName | quote }}
            items:
              - key: {{ .Values.hydra.jwksCa.key | quote }}
                path: {{ .Values.hydra.jwksCa.key | quote }}
        {{- end }}
        {{- if ((.Values.tokenAcceptance | default dict).revocationCa | default dict).secretName }}
        - name: platform-revocation-ca
          secret:
            secretName: {{ .Values.tokenAcceptance.revocationCa.secretName | quote }}
            items:
              - key: {{ .Values.tokenAcceptance.revocationCa.key | quote }}
                path: {{ .Values.tokenAcceptance.revocationCa.key | quote }}
        {{- end }}
