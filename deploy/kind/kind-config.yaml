kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 28080
        protocol: TCP
      # TLS контроллера входа (консоль и край, kacho#3025). Порт хоста — не 443:
      # он привилегированный и на машине разработчика бывает занят. Его
      # называет происхождение консоли стенда (values.dev.yaml,
      # `global.kacho.identity.appBaseURL`); расхождение двух мест ловит
      # deploy/console_ingress_origin_is_served_over_tls_render_test.go.
      # Кластер, созданный до этой строки, отображения не несёт — подъём
      # стенда отказывает и называет причину (deploy/kind/assert-port-mappings.sh).
      - containerPort: 443
        hostPort: 28443
        protocol: TCP
    # ПАТЧ ОСТАЁТСЯ НЕВЕРСИОНИРОВАННЫМ И В MAP-ФОРМЕ — ОСОЗНАННО.
    #
    # kind 0.32.0 (наш пин в .github/workflows/{e2e-newman,production-posture}.yml)
    # ставит узел Kubernetes 1.36.1 и переходит на формат kubeadm v1beta4 для 1.36.0+.
    # У v1beta4 `kubeletExtraArgs` — СПИСОК, а не отображение. Неверсионированный
    # патч kind переводит в нужный формат сам; версионированный — нет, его пришлось
    # бы держать в двух редакциях и переписывать на каждом переходе.
    #
    # Поэтому: не дописывай сюда `apiVersion: kubeadm.k8s.io/v1beta3` «для строгости».
    # Это выглядит уточнением, а означает отказ от автоперевода — патч станет
    # прицельным в формат, которого узел больше не использует, и метка
    # `ingress-ready=true` не проставится. Контроллер ingress-nginx тогда висит
    # Pending (ему нужен узел с этой меткой), а `helm --wait` отваливается по
    # таймауту — то есть стенд не поднимется, и причина будет далеко от этой строки.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"