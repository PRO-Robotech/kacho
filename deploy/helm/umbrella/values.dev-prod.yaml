# ═══════════════════════════════════════════════════════════════════════════
# values.dev-prod.yaml — PRODUCTION security posture on the LOCAL kind stand.
# ═══════════════════════════════════════════════════════════════════════════
#
# WHY: security.md — «любой деплой = production-mode + mTLS/JWT»; auth.mode=dev
# is a documented security debt (anonymous/HS256/plaintext-DB). The dev stand
# ran authn.mode=dev + sslmode=disable, which MASKS every prod-guard defect. This
# profile brings the SAME kind stand up in the real production security posture so
# those defects surface locally instead of on a prod cluster.
#
# LAYERED ON TOP of values.dev.yaml (like values.fe3455.yaml is) — it inherits ALL
# kind-local adaptations from dev (local kacho-*:dev images, ingress hostPort,
# in-cluster Hydra issuer/JWKS, pg hosts + inline dev secrets) and flips ONLY the
# security knobs from insecure-dev → production:
#
#   helm upgrade --install kacho-umbrella ./helm/umbrella -n kacho \
#     -f ./helm/umbrella/values.dev.yaml \
#     -f ./helm/umbrella/values.dev-prod.yaml \
#     --wait --timeout 12m
#
# ── What this flips (vs the insecure-dev base) ──────────────────────────────
#   1. AuthN mode  dev → production / production-strict  (gateway, iam, vpc, geo,
#      compute, storage, nlb, registry). Anonymous fail-closed; Bearer required;
#      Hydra RS256 only (HS256 dev-secret path OFF). KACHO_APP_ENV=production so
#      the composition-root prod-guard treats the deploy as production-class.
#   2. AuthZ breakglass  true → false  (geo, registry, nlb, vpc). Real per-RPC
#      IAM Check on BOTH listeners (public + internal :9091); no breakglass bypass.
#   3. Postgres ssl-mode  disable → require  — encrypted DB transport (the prod
#      floor). Each kacho pg-<svc> serves a self-signed TLS cert (bitnami
#      tls.autoGenerated); sslmode=require encrypts without cert-verification,
#      which is exactly right for an in-cluster self-signed server cert on kind.
#   4. mTLS stays ON (inherited from values.dev.yaml phase-2) — service→service is
#      already verified-client-cert on every edge; production simply never relaxes
#      it and now the boot-guards REQUIRE it (production + mtls-off = refuse-start).
#
# ── Prerequisite secrets (provisioned out-of-band by scripts/dev-prod-secrets.sh) ─
# iam production-strict Config.Validate fails fast without these (defense-in-depth):
#   - kacho-iam-hook-token       (key: token)    — Hydra token-hook HMAC
#   - kacho-iam-jwks-enc-key      (key: enc_key)  — JWKS private-key encryption
# On the insecure-dev stand both are optional secretKeyRefs (absent) → dev iam
# boots without them; production iam MUST have them.

# ─── provider ADMIN listener over TLS ───────────────────────────────────────
# This stand runs the PRODUCTION posture, and both the gateway and iam refuse to
# start on a plaintext or unanchored hop to the provider's admin API. dev leaves
# that hop in the clear (it is dev-class and exempt); this overlay is where it
# stops being exempt, so the certificate is issued here and the three consumers
# below are pointed at it together.
mtls:
  hydraAdminTls:
    enabled: true
    secretName: kacho-umbrella-hydra-admin-tls

# ─── api-gateway (edge) — production-strict authN ───────────────────────────
api-gateway:
  # Composition-root prod-guard (validateProductionAuthzConfig): an env NOT labelled
  # dev-class is treated as production → it REFUSES to boot if authn.mode=dev or a
  # dev HMAC secret is present (CWE-347 symmetric-key principal forgery). Flip the
  # label to production and drop the dev path.
  #
  # Internal :9091 gRPC listener (InternalAuthzCacheService.InvalidateSubject, dialed
  # by the iam subject-change push-drainer) is ALWAYS up and validateProductionInternal
  # Listener FATAL-fails in a production-class env unless it runs mTLS + a SPIFFE
  # allow-list. The gateway chart has no first-class knob for this (dev-masked gap —
  # values.prod.yaml renders but the pod would Fatalf at boot). Wire it via the chart's
  # generic extraEnv passthrough, reusing the already-mounted server cert
  # (/etc/api-gateway/tls, api-gateway-tls) + backend-dial CA (/etc/api-gateway/mtls/
  # ca.crt, already exported as KACHO_API_GATEWAY_MTLS_CA_FILE). Allow-list = the iam
  # module SPIFFE SAN (the only authorised caller of InvalidateSubject).
  # appEnv (first-class knob → KACHO_APP_ENV) overrides values.dev.yaml's `dev`.
  # MUST NOT set KACHO_APP_ENV via extraEnv here: the chart already renders a
  # KACHO_APP_ENV env from the appEnv knob, so an extraEnv.KACHO_APP_ENV produces a
  # DUPLICATE list key → helm strategic-merge `$setElementOrder` patch failure on
  # `helm upgrade` (dev base appEnv=dev + extraEnv=production → two KACHO_APP_ENV).
  appEnv: production
  extraEnv:
    KACHO_API_GATEWAY_INTERNAL_GRPC_MTLS_ENABLE: "true"
    KACHO_API_GATEWAY_INTERNAL_GRPC_TLS_CERT_FILE: /etc/api-gateway/tls/tls.crt
    KACHO_API_GATEWAY_INTERNAL_GRPC_TLS_KEY_FILE: /etc/api-gateway/tls/tls.key
    KACHO_API_GATEWAY_INTERNAL_GRPC_ALLOWED_SPIFFE: spiffe://kacho.cloud/ns/kacho-iam/sa/kacho-iam
  authn:
    mode: production-strict     # Bearer REQUIRED + Hydra RS256; missing token → 401
    devSecret: ""               # HS256 dev path OFF (guard fails if non-empty in prod)
  # UNIFICATION: verify RS256 tokens through the iam :9097 JWKS proxy, NOT Hydra :4444
  # directly (registry-iam-jwks-unify — iam is the single JWKS facade; direct-Hydra dial
  # is forbidden). iam :9097 is a byte-identical short-TTL mirror of Hydra's public JWKS
  # (Hydra stays issuer/signer); it serves plain HTTP cluster-internal (jwks_proxy_mtls=
  # false) so no CA wiring is needed. `issuer` (iss-pin) is unchanged — inherited from
  # values.dev.yaml (Hydra self.issuer). Requires the :9097 upstream fix (kacho-iam.env).
  hydra:
    jwksUrl: "http://kacho-iam-internal.kacho.svc.cluster.local:9097/.well-known/jwks.json"
    # iss-PIN — the SAME string the provider stamps (hydra.config.urls.self.issuer).
    # values.dev.yaml declares the http form WITH a trailing slash; this stand's provider
    # runs without its development flag, so its issuer identity is https and carries no
    # slash. The verifier compares `iss` EXACTLY (after stripping one trailing slash), so
    # a scheme mismatch here is not a degraded mode — every RS256 token fails validation
    # and the whole surface answers 401.
    issuer: "https://localhost:28080/.ory/hydra/public"
    # dev declares both admin-API addresses in the clear; this stand is
    # production-class, so it addresses them over TLS with the anchor pinned.
    # Introspection asks about a bearer by SENDING it, on every authenticated
    # request that misses the cache — the wire carries a live end-user credential,
    # not merely administrative calls.
    introspectionUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc.cluster.local:4445/admin/oauth2/introspect"
    adminUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc.cluster.local:4445"
    adminCa:
      secretName: kacho-umbrella-hydra-admin-tls
      key: ca.crt
      mountPath: /etc/api-gateway/hydra-admin-ca

# ─── kacho-vpc ──────────────────────────────────────────────────────────────
vpc:
  authn:
    mode: production            # anonymous fail-closed
  repository:
    postgres:
      sslMode: require
  authz:
    breakglass: false
    # Круг отправителей чужой личности — см. values.prod.yaml (там же обоснование
    # состава). Пустой список НЕ запрещает, а не сужает; боевая посадка на нём не
    # стартует, поэтому профиль обязан его нести.
    trustedForwarderSANs:
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-compute
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-nlb
      - spiffe://kacho.cloud/ns/kacho-vpc-operator/sa/kacho-vpc-operator

# ─── kacho-compute (no public mode knob; posture = mTLS + authzIam + sslmode) ─
# The compute chart DEFAULTS auth.mode=production (dev flips it to dev). Restore
# production + require the encrypted DB channel. mTLS + authzIam already wired in dev.
compute:
  auth:
    mode: production
  db:
    sslMode: require

# ─── kacho-geo (Region/Zone leaf) ───────────────────────────────────────────
kacho-geo:
  authMode: production           # anonymous fail-closed on BOTH listeners
  authzBreakglass: false         # real per-RPC Check (internal :9091 NOT exempt)
  db:
    sslmode: require
  # trusted-forwarder-SANs (gateway SPIFFE) inherited from values.dev.yaml env.

# ─── kacho-storage ──────────────────────────────────────────────────────────
storage:
  config:
    authMode: production
  db:
    sslMode: require

# ─── kacho-iam (authz authority + identity tier) — production-strict ────────
kacho-iam:
  config:
    authn:
      mode: production-strict    # Bearer required + Config.Validate requires hook/jwks secrets
      # Hydra's advertised self.issuer on this kind stand is the localhost nodeport
      # (hydra.config.urls.self.issuer = http://localhost:28080/.ory/hydra/public/), NOT
      # the domain-derived https://hydra.api.kacho.cloud. Without this, the private_key_jwt
      # client_assertion iam signs for the bootstrap-mint / registry-token exchange carries
      # aud=<derived>/oauth2/token → Hydra rejects it ("audience must match the token
      # endpoint http://localhost:28080/.ory/hydra/public/oauth2/token", invalid_client).
      # Set as a CONFIG value (ResolveHydraIssuer highest precedence) — the env passthrough
      # KACHO_IAM_HYDRA_ISSUER collides with the chart's domain-derived env of the same name
      # and k8s dedups to the first (external) → non-deterministic. Aligns iam with the
      # gateway (gateway.hydra.issuer already = this localhost issuer); the in-cluster POST
      # target stays hydraTokenURL. authn.go documents this override for non-derivable issuers.
      # Same string the provider stamps (no trailing slash — see hydra.urls.self.issuer).
      hydraIssuer: "https://localhost:28080/.ory/hydra/public"
      # ─── bootstrap-mint caller allow-list — REQUIRED to boot here (#58) ──────
      # This profile ENABLES the mint (kacho.iam.bootstrapToken.signingKeySecretName
      # below ⇒ the signing key is injected), and MintBootstrapToken issues a
      # cluster `system_admin` RS256 Bearer. It has no ReBAC gate (it exists to
      # obtain the FIRST token, before any relation exists) and no api-gateway REST
      # route — the caller's client-certificate SPIFFE SAN IS the credential, checked
      # by authzguard.CallerPolicy on :9091 against exactly this list.
      #
      # In production Config.Validate REFUSES TO START on "mint enabled + empty
      # allow-list" (core rule #16 — an enabled-yet-uncallable mint invites the
      # "fix" of reopening the hole), so this list is not optional here: without it
      # kacho-iam CrashLoopBackOffs and `values.dev-prod` stops being a bootable
      # production profile.
      #
      # The identity is the dedicated operator leaf the umbrella issues
      # (mtls.bootstrapOperator → secret kacho-bootstrap-operator-client-tls,
      # client-auth only). DELIBERATELY NOT the api-gateway SAN: the gateway fronts
      # tenant traffic and is reachable cluster-wide, so "is the api-gateway" must
      # never be a licence to mint cluster-admin. Seed/fixture path:
      # tests/authz-fixtures/mint_rs256.py pulls that Secret and dials iam :9091.
      bootstrapMint:
        allowedClientSANs:
          - spiffe://kacho.cloud/ns/kacho/sa/kacho-bootstrap-operator
    repository:
      postgres:
        sslMode: require         # production-strict enforces ssl-mode ∈ {require,verify-ca,verify-full}
  # NB (deliberately NOT enabling mtls.httpListeners on this stand): mtls.enable=true
  # (inherited from dev.yaml) already wraps the gRPC listeners (:9090/:9091). The
  # httpListeners toggle would ALSO TLS-wrap the JWKS-proxy :9097 — but on this stand
  # the api-gateway verifies RS256 tokens by fetching JWKS from iam :9097 over PLAINTEXT
  # http (registry-iam-jwks-unify routing, gateway env KACHO_HYDRA_JWKS_URL). TLS-ing
  # :9097 breaks that fetch ("HTTP request to an HTTPS server") → EVERY token fails
  # validation → 401. values.prod avoids this by pointing the gateway JWKS at Hydra
  # public directly (:4444), so httpListeners is safe there; this kind stand routes
  # through iam :9097, so the hooks/metrics/jwks HTTP listeners stay PLAINTEXT (the
  # template's documented dev-stand default). The Hydra token_hook reaches :9092 over
  # http; caller-auth is the X-Kacho-Hook-Token HMAC (env-override below), not transport.
  env:
    # UNIFICATION FIX (dev-masked): the iam :9097 JWKS proxy — the endpoint every
    # service is supposed to verify RS256 tokens through (registry-iam-jwks-unify) —
    # derives its upstream from KACHO_IAM_HYDRA_ISSUER = https://hydra.api.kacho.cloud,
    # the EXTERNAL ingress host that is UNREACHABLE in-cluster → the proxy fail-closes
    # 502 and NO service can verify through it (they silently fall back to Hydra-direct,
    # defeating the unification). Point the upstream at the in-cluster Hydra PUBLIC
    # Service (same fix api-gateway.hydra.jwksUrl already carries). ResolveHydraJWKSURL
    # honours this explicit override ahead of the issuer-derived default.
    KACHO_IAM_HYDRA_JWKS_URL: "http://kacho-umbrella-hydra-public.kacho.svc.cluster.local:4444/.well-known/jwks.json"
    # NB: the Hydra issuer override lives in config.authn.hydraIssuer above (a config
    # value, not a KACHO_IAM_HYDRA_ISSUER env — the chart already emits that env from the
    # domain and a duplicate dedups to the first/external on apply, non-deterministic).
  # Bootstrap-token mint (#58) + registry /iam/token shim — the client_credentials
  # exchange target. ResolveHydraTokenURL() honours this ahead of the issuer-derived
  # default (https://hydra.api.kacho.cloud/oauth2/token — UNREACHABLE in-cluster). The
  # POST target is the in-cluster Hydra PUBLIC Service; the minted token's `iss` stays
  # Hydra's self.issuer (http://localhost:28080/.ory/hydra/public/, = the gateway's
  # expected issuer → the RS256 token verifies). deep-merges over dev's hydraAdminUrl.
  kacho:
    iam:
      # Provider-ADMIN hop: declared (never derived) and over TLS with the anchor
      # pinned — the internal-CA bundle already mounted for mTLS is the same CA
      # that signs the provider's admin certificate. dev's plaintext value is
      # deep-merged over here; leaving it would refuse the start on this stand.
      hydraAdminUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc.cluster.local:4445"
      hydraAdminCaFile: /etc/kacho-iam/tls/server/ca.crt
      hydraTokenURL: "http://kacho-umbrella-hydra-public.kacho.svc.cluster.local:4444/oauth2/token"
      # Bootstrap-admin SA ES256 (P-256, PKCS#8) signing key — signs the
      # private_key_jwt client_assertion the mint exchanges at Hydra. Empty ⇒ env
      # absent ⇒ MintBootstrapToken fails closed (UNAVAILABLE). Provisioned as a
      # LOCAL kind secret by scripts/dev-prod-secrets.sh (generated fresh, NOT
      # committed — a real cluster provisions it out-of-band / external-secrets).
      bootstrapToken:
        signingKeySecretName: kacho-iam-bootstrap-sa-key
        signingKeySecretKey: private_key_pem

# ─── kacho-nlb ──────────────────────────────────────────────────────────────
kacho-nlb:
  config:
    mode: production
    authz:
      breakglass: false
      # production + mtls.server.enable requires a non-empty forwarder allow-list
      # (empty ⇒ any mTLS peer may forge the forwarded end-user principal). The only
      # trusted forwarder is the api-gateway (same SPIFFE SAN geo/compute trust).
      trustedForwarderSANs:
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
  db:
    sslmode: require

# ─── kacho-registry ─────────────────────────────────────────────────────────
# production-strict: registry's DB-sslmode guard fires ONLY in production-strict (plain
# `production` leaves DB plaintext). The control-plane guard (validateSecurityConfig —
# authz-addr + both-listener mTLS) is NOT mode-gated: it runs whenever breakglass=off.
# The Docker DATA-plane (push/pull VIP) is out-of-scope on kind (dataplaneLB off) →
# DataplaneAddr empty → the data-plane guards (https-JWKS / issuer-pin / dataplane-TLS-
# ack) stay dormant, so production-strict boots cleanly control-plane-only on kind.
registry:
  authMode: production-strict
  db:
    sslmode: require
  authz:
    breakglass: false
  # Data-plane proxy (KACHO_REGISTRY_DATAPLANE_ADDR is always a non-empty listen addr →
  # the proxy is always built → its 3 production guards fire): (1) requireSecureJWKSURL —
  # verify docker identity-JWT via the iam :9097 JWKS proxy over HTTPS (unification: iam
  # is the JWKS facade, NOT Hydra direct; chart default is http:// which FAILS the guard);
  # (2) requireIssuerPinned — pin the expected iss to Hydra's self.issuer; (3) require
  # DataplaneTLSAck — operator ack the plaintext data-plane sits behind external TLS.
  # The Docker data-plane itself is NOT exercised on kind (dataplaneLB off) — these are
  # config-level boot guards, no live fetch, so registry boots control-plane-only.
  iam:
    jwksUrl: "https://kacho-iam-internal.kacho.svc.cluster.local:9097/.well-known/jwks.json"
  hydra:
    # Same string the provider stamps (no trailing slash — see hydra.urls.self.issuer).
    issuer: "https://localhost:28080/.ory/hydra/public"
  dataplaneTLSTerminatedExternally: true

# ─── Per-service Postgres — serve self-signed TLS so sslmode=require works ───
# bitnami tls.autoGenerated uses helm genSignedCert cached via secrets.lookup
# (idempotent across upgrades — the cert is NOT regenerated once the -crt Secret
# exists). Self-signed server cert; clients use sslmode=require (encrypt, do not
# verify) — the correct floor for an in-cluster self-signed cert.
pg-vpc:
  tls:
    enabled: true
    autoGenerated: true
pg-compute:
  tls:
    enabled: true
    autoGenerated: true
pg-iam:
  tls:
    enabled: true
    autoGenerated: true
pg-geo:
  tls:
    enabled: true
    autoGenerated: true
pg-nlb:
  tls:
    enabled: true
    autoGenerated: true
pg-storage:
  tls:
    enabled: true
    autoGenerated: true
pg-registry:
  tls:
    enabled: true
    autoGenerated: true

# ── Hydra OAuth2 token-hook auth → kacho-iam :9092 (the REAL client_credentials fix) ──
# The token_hook URL + auth-header shape already come from values.dev.yaml (http://…:9092,
# X-Kacho-Hook-Token). The bug: the header VALUE there is the literal YAML placeholder
# `${KACHO_IAM_HOOK_TOKEN}` — and Ory Hydra does NOT interpolate env into config-YAML, so
# Hydra shipped the literal string as the HMAC → iam's hook 401'd → Hydra 500 → EVERY
# client_credentials exchange failed (registry SA-keys AND the #58 bootstrap-token mint),
# independent of #58. FIX: the OAUTH2_*_HOOK_AUTH_CONFIG_VALUE env-overrides (Ory's
# config-path → env-var naming) replace the placeholder with the real secret at runtime.
# This is the ONLY thing the overlay needs — transport stays PLAINTEXT http (see the iam
# mtls note above: TLS-ing the iam HTTP listeners would break the gateway's :9097 JWKS
# fetch). The `deployment` block is a TOP-LEVEL Ory chart key → hydra.deployment.
hydra:
  hydra:
    # THE FLAG THAT MADE ALL OF THE BELOW INERT.
    #
    # `values.dev.yaml` sets `hydra.hydra.dev: true`, which starts the provider as
    # `hydra serve all --dev`. That flag serves every listener in the CLEAR and makes a
    # declared TLS block decoration: the admin certificate was issued, mounted and named
    # in the config, `checksum/hydra-config` matched, the pod was current — and an
    # openssl handshake against :4445 still answered `wrong version number`, i.e.
    # plaintext. The subchart's own default is `false` and its comment says "not secure
    # in production environments"; neither this overlay nor values.prod.yaml used to turn
    # it back off, so the production profile inherited it from the dev base.
    #
    # Visible consequence: the gateway dialled https, got an HTTP answer, correctly
    # classified it as MISCONFIGURATION rather than an outage (security.md §8) and
    # fail-closed every request with `503 revocation check unavailable`. The whole API
    # surface was dead — which is how a control that is present, wired and never
    # exercised finally announced itself.
    dev: false
    config:
      urls:
        self:
          # ISSUER TRAILING-SLASH: values.dev.yaml sets self.issuer WITH a trailing
          # slash (http://localhost:28080/.ory/hydra/public/). Hydra stamps that exact
          # string into every token's `iss`. But the api-gateway verifier normalises its
          # EXPECTED issuer by STRIPPING the trailing slash (config.ResolvedHydraIssuer)
          # and then does an EXACT `iss != expected` compare (jwt_verifier.go) — so a
          # with-slash token `iss` never matches the no-slash expected → EVERY RS256 token
          # fails validation (401 "token validation failed"), production-newman included.
          # Align on the gateway's canonical no-slash form: drop the trailing slash from
          # the issuer identity (the token `iss`). `public` (browser-facing base URL, kept
          # in dev.yaml) is a SEPARATE knob and keeps its slash for routing. iam's assertion
          # audience (ResolveHydraTokenEndpoint = TrimRight(issuer)+"/oauth2/token") is
          # unaffected — it already trims — so the bootstrap-mint exchange still matches
          # Hydra's token endpoint. Scoped to the production-mode overlay (dev-mode authn
          # accepts HS256 and never verifies the Hydra `iss`, so dev.yaml is untouched).
          # SCHEME IS https BECAUSE THE PROVIDER REFUSES ANYTHING ELSE WITHOUT ITS
          # DEVELOPMENT FLAG (see `dev: false` above): «Scheme from configuration key
          # `urls.self.issuer` must be `https` when `dev` is `false`».
          #
          # `iss` IS AN IDENTIFIER, NOT A TRANSPORT. Nothing dials this string — the
          # provider stamps it into every token's `iss`, consumers compare it as a
          # string, and the browser-facing base URL is the SEPARATE `self.public` knob
          # (left in the clear). So moving the scheme here changes the token identity
          # and nothing about how anybody connects.
          #
          # EVERY CONSUMER THAT PINS `iss` MUST CARRY THE SAME STRING, character for
          # character, and there are four of them (gateway, iam, registry, and the
          # harness's client_assertion audience). They are set together below; a
          # mismatch is not a degraded mode — every RS256 token fails the iss check and
          # the whole surface answers 401.
          issuer: "https://localhost:28080/.ory/hydra/public"
          # `public` MOVES WITH `issuer`, AND THIS IS THE WHOLE POINT OF THE PAIR.
          #
          # The provider derives its ADVERTISED `token_endpoint` from `self.public`, not
          # from `self.issuer` — measured on the live discovery document:
          #     issuer         = https://localhost:28080/.ory/hydra/public   (self.issuer)
          #     token_endpoint = http://localhost:28080/.ory/hydra/public/oauth2/token
          # while `iss` comes from `self.issuer`. Consumers that build the private_key_jwt
          # `aud` as «issuer + /oauth2/token» (iam's ResolveHydraTokenEndpoint, and the
          # harness) therefore sent an https audience to a provider advertising an http
          # token endpoint, and every exchange came back «hydra rejected the token
          # exchange» → iam answered `bootstrap token issuer unavailable` → the seed could
          # not obtain its first token.
          #
          # This was self-inflicted: `issuer` had to become https (the provider refuses a
          # non-https issuer without its development flag) and `public` was left behind, so
          # the two disagreed. They describe the SAME identity and must move together.
          #
          # Neither is a transport: both are identifier strings on a stand whose listener
          # is reached over plain http behind a trusted terminator. Changing them changes
          # what the provider ADVERTISES and stamps, not how anybody connects.
          public: "https://localhost:28080/.ory/hydra/public/"
      # ПОЧЕМУ ЗДЕСЬ НЕТ ОБЪЯВЛЕНИЯ TLS ДЛЯ АДМИНИСТРАТИВНОГО ЛИСТЕНЕРА.
      #
      # Развёрнутая версия провайдера ручку TLS ОТДЕЛЬНОГО листенера НЕ ЧИТАЕТ:
      # при выданном, смонтированном и названном в конфигурации сертификате
      # рукопожатие отвечало ошибкой уровня протокола, а собственная строка
      # провайдера при старте сообщала, что он поднял ПРОСТОЙ http-сервер на
      # административном порту. Ручка общая, не полистенная.
      #
      # Это ИЗМЕРЕНО (координата и процедура перемера —
      # deploy/PROVIDER-LISTENER-PREMISE.md), а не выведено из документации: до
      # этого здесь подряд стояли два взаимоисключающих объяснения, и оба были
      # неверны — второе ещё и укоряло первое за непроверенное утверждение.
      #
      # Поэтому TLS терминирует СОСЕД в этом же поде, а листенер провайдера
      # уезжает на петлю (см. serve.admin ниже и deployment.extraContainers).
      serve:
        # WITHOUT `--dev` the provider refuses to serve a listener that has neither TLS
        # nor a declared trusted terminator. The ADMIN listener has its own certificate
        # (below). The PUBLIC OIDC listener is deliberately left in the clear on this
        # stand — the ingress, the JWKS mirror and the token endpoint all reach it over
        # plain http — so it is declared as terminated by a trusted peer instead: pod
        # CIDR, service CIDR, the kind node subnet (kubectl port-forward arrives from the
        # node) and loopback. Documented narrowing for this stand, not a blanket exemption.
        #
        # ONE `serve:` KEY. This block and the trusted-terminator list must stay merged:
        # a second `serve:` mapping in the same parent is a duplicate YAML key, the later
        # one silently wins, and the first one vanishes without a word from helm.
        tls:
          allow_termination_from:
            - 10.244.0.0/16
            - 10.96.0.0/12
            - 172.18.0.0/16
            # ПЕТЛЯ — ИСТОЧНИК ПЛЕЙНТЕКСТА ПОСЛЕ УВОДА ЛИСТЕНЕРА.
            # Административный листенер слушает 127.0.0.1, и плейнтекст ему
            # приносит СОСЕД ПО ПЕТЛЕ. Без этой записи провайдер боевого класса
            # (без отладочного флага) отверг бы его как нетерминированный.
            - 127.0.0.1/32
        admin:
          # ЛИСТЕНЕР СЛУШАЕТ ТОЛЬКО ПЕТЛЮ. Открытого участка между подами больше
          # нет КАК ОБЪЕКТА: он не покидает пода. Это свойство по построению, а
          # не следствие политики, которую надо выдать и поддерживать.
          host: "127.0.0.1"
          # ПОРТ УСТУПЛЕН СОСЕДУ. Инверсия обязательна: действующая политика
          # исходящего трафика боевого профиля разрешает потребителю трафик к
          # поду провайдера ТОЛЬКО на 4444/4445 и матчит ПОРТ ПОДА. Сядь сосед
          # на произвольный порт — политика запретила бы переход на том самом
          # профиле, ради которого работа делается, а стенд без политик этого
          # не показал бы. Закреплено гейтом admin-hop-port-policy-test.sh.
          port: 4455
  service:
    admin:
      # Service провайдера СНЯТ. После увода на петлю он целился бы в порт,
      # который снаружи пода не отвечает: выглядел бы рабочим адресом и однажды
      # получил бы потребителя — с тихим истечением срока вместо внятного
      # отказа. Снятый, он даёт отказ РАЗРЕШЕНИЯ ИМЕНИ: забытый потребитель
      # падает громко и сразу. Потребители адресуют Service терминатора
      # (templates/hydra-admin-tls-service.yaml).
      enabled: false
  deployment:
    # ПРОБЫ ИДУТ ЧЕРЕЗ СОСЕДА К ЭНДПОИНТУ ЗДОРОВЬЯ ПРОВАЙДЕРА.
    #
    # Умолчание чарта — httpGet на порт административного листенера с заголовком
    # `Host: 127.0.0.1`; исполняет их kubelet ПО АДРЕСУ ПОДА, а заголовок петлёй
    # запрос не делает. После увода на петлю такое обращение невозможно by
    # construction, и пробы, оставленные как есть, роняли бы под навсегда.
    #
    # ГОТОВНОСТЬ ЗАКРЫТА В ОБЕ СТОРОНЫ. Порт — СОСЕДА (значит мёртвый сосед ⇒
    # соединение не установится ⇒ под не Ready — цена со-размещения, сделанная
    # наблюдаемой), а ПУТЬ — здоровья ПРОВАЙДЕРА, который сосед проксирует на
    # петлю (значит повисший провайдер ⇒ апстрим не ответит ⇒ под не Ready).
    # Статического пути здоровья у соседа нет намеренно — см. его конфигурацию.
    #
    # Отступление от умолчания чарта названо: готовность читает /health/ready
    # (он зависит от состояния провайдера), а не /health/alive.
    customReadinessProbe:
      httpGet:
        path: /health/ready
        port: 4445
        scheme: HTTPS
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    customStartupProbe:
      httpGet:
        path: /health/ready
        port: 4445
        scheme: HTTPS
      failureThreshold: 30
      periodSeconds: 2
      timeoutSeconds: 5
    extraVolumes:
      - name: hydra-admin-tls
        secret:
          secretName: kacho-umbrella-hydra-admin-tls
      - name: hydra-admin-tls-conf
        configMap:
          name: kacho-umbrella-hydra-admin-tls-nginx
      # Корневая файловая система соседа только для чтения, а nginx пишет
      # pid-файл и временные тела запросов. Два emptyDir — вся его запись.
      - name: hydra-admin-tls-run
        emptyDir: {}
      - name: hydra-admin-tls-cache
        emptyDir: {}
    # МОНТИРОВАНИЯ СЕКРЕТА В КОНТЕЙНЕР ПРОВАЙДЕРА БОЛЬШЕ НЕТ. Ручка, которую он
    # не читает, снята вместе с материалом под неё: держать неработающую ручку
    # рядом с обходным путём, который существует ИМЕННО ПОТОМУ, что она не
    # работает, — гарантия того, что следующий снимет терминатор, поверив ей.
    # Секрет монтируется СОСЕДУ (ниже).
    extraContainers: |
      - name: admin-tls
        image: nginxinc/nginx-unprivileged:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
          - name: https-admin
            containerPort: 4445
            protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: hydra-admin-tls
            mountPath: /etc/tls
            readOnly: true
          - name: hydra-admin-tls-conf
            mountPath: /etc/nginx/conf.d
            readOnly: true
          - name: hydra-admin-tls-run
            mountPath: /tmp
          - name: hydra-admin-tls-cache
            mountPath: /var/cache/nginx
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
    extraEnv:
      - name: OAUTH2_TOKEN_HOOK_AUTH_CONFIG_VALUE
        valueFrom:
          secretKeyRef:
            name: kacho-iam-hook-token
            key: token
      - name: OAUTH2_REFRESH_TOKEN_HOOK_AUTH_CONFIG_VALUE
        valueFrom:
          secretKeyRef:
            name: kacho-iam-hook-token
            key: token

# ─── Kratos self-service UI — provider ADMIN hop over TLS ───────────────────
# dev declares the plaintext admin address; on this stand the hop is fronted by a
# TLS TERMINATOR in the provider's pod, so the consent flow must address the
# terminator over https and trust the internal CA that signed it. Left at dev's
# value the flow does not degrade, it stops: the provider's own admin Service is
# removed, so that address no longer resolves.
kratos-selfservice-ui:
  kratosSelfServiceUI:
    # ADDRESS THE TERMINATOR, NOT THE PROVIDER. The admin hop is fronted by a
    # TLS terminator in the provider's own pod (mtls.hydraAdminTls), so this
    # consumer must address THAT over https and trust the internal CA that
    # signed it — the chart mounts the bundle and exports NODE_EXTRA_CA_CERTS.
    #
    # Left at the chart's plaintext default this flow does not degrade, it stops:
    # the provider's own admin Service is REMOVED, so the old address does not
    # resolve at all. That is deliberate — a consumer left behind must fail
    # loudly on name resolution rather than time out against something that
    # looks like a working address.
    hydraAdminUrl: https://kacho-umbrella-hydra-admin-tls:4445
    caCert:
      secretName: kacho-umbrella-hydra-admin-tls
      key: ca.crt
      mountPath: /etc/kratos-ui-ca

# ─── Хук выдачи доверия внешним эмитентам — адрес административного API ────
# Объявляется значением (реестр потребителей его резолвит), поэтому перевод
# перехода на терминатор его больше не минует. Хук латентен (federationIn
# выключен), но латентность от проверки не освобождает: гейты рендерят его с
# включённым ключом.
hydraTrustGrants:
  adminUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc.cluster.local:4445"
  adminCaFile: /etc/hydra-admin-ca/ca.crt
