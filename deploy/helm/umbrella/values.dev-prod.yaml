# ═══════════════════════════════════════════════════════════════════════════
# values.dev-prod.yaml — PRODUCTION security posture on the LOCAL kind stand.
# ═══════════════════════════════════════════════════════════════════════════
#
# WHY: security.md — «любой деплой = production-mode + mTLS/JWT»; auth.mode=dev
# is a documented security debt (anonymous/HS256/plaintext-DB). The dev stand
# ran authn.mode=dev + sslmode=disable, which MASKS every prod-guard defect. This
# profile brings the SAME kind stand up in the real production security posture so
# those defects surface locally instead of on a prod cluster.
#
# LAYERED ON TOP of values.dev.yaml (like values.fe3455.yaml is) — it inherits ALL
# kind-local adaptations from dev (local `:dev` images — see deploy/images.txt for
# their names, ingress hostPort,
# in-cluster Hydra issuer/JWKS, pg hosts + inline dev secrets) and flips ONLY the
# security knobs from insecure-dev → production:
#
#   helm upgrade --install kacho-umbrella ./helm/umbrella -n kacho \
#     -f ./helm/umbrella/values.dev.yaml \
#     -f ./helm/umbrella/values.dev-prod.yaml \
#     --wait --timeout 12m
#
# ── What this flips (vs the insecure-dev base) ──────────────────────────────
#   1. AuthN mode  dev → production / production-strict  (gateway, iam, vpc, geo,
#      compute, storage, nlb, registry). Anonymous fail-closed; Bearer required;
#      Hydra RS256 only (HS256 dev-secret path OFF). KACHO_APP_ENV=production so
#      the composition-root prod-guard treats the deploy as production-class.
#   2. AuthZ breakglass  true → false  (geo, registry). Real per-RPC IAM
#      Check on BOTH listeners (public + internal :9091); no breakglass bypass.
#      vpc и nlb из этого перечня сняты: у них ручки обхода больше НЕТ — контур
#      поднимает общий носитель, который ставит звено решения о доступе всегда.
#      У nlb ключ при этом ещё и объявлялся тремя профилями, не имея читателя, —
#      снят вместе с ними; держит гейт internal/repohygiene
#      TestDeclaredKnobHasAReader.
#   3. Postgres ssl-mode  disable → require  — encrypted DB transport (the prod
#      floor). Each kacho pg-<svc> serves a self-signed TLS cert (bitnami
#      tls.autoGenerated); sslmode=require encrypts without cert-verification,
#      which is exactly right for an in-cluster self-signed server cert on kind.
#   4. mTLS stays ON (inherited from values.dev.yaml phase-2) — service→service is
#      already verified-client-cert on every edge; production simply never relaxes
#      it and now the boot-guards REQUIRE it (production + mtls-off = refuse-start).
#
# ── Prerequisite secrets (provisioned out-of-band by scripts/dev-prod-secrets.sh) ─
# iam production-strict Config.Validate fails fast without these (defense-in-depth):
#   - kaname-hook-token       (key: token)    — Hydra token-hook HMAC
#   - kaname-jwks-enc-key      (key: enc_key)  — JWKS private-key encryption
# On the insecure-dev stand both are optional secretKeyRefs (absent) → dev iam
# boots without them; production iam MUST have them.

# ─── provider ADMIN listener over TLS ───────────────────────────────────────
# This stand runs the PRODUCTION posture, and both the gateway and iam refuse to
# start on a plaintext or unanchored hop to the provider's admin API. dev leaves
# that hop in the clear (it is dev-class and exempt); this overlay is where it
# stops being exempt, so the certificate is issued here and the three consumers
# below are pointed at it together.
mtls:
  hydraAdminTls:
    enabled: true
    secretName: kacho-umbrella-hydra-admin-tls

# ─── api-gateway (edge) — production-strict authN ───────────────────────────
api-gateway:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: authn.mode).
  # Bearer REQUIRED, verified by signature against published public material;
  # missing token → 401. The line that used to sit under this one blanked a
  # shared-signing-key knob — it is gone because the chart no longer has such a knob
  # to blank, and a value naming a setting that does not exist reads as a decision
  # while doing nothing.
  authMode: production-strict
  # ─── Объявление приёма токена (Ф1б, задача #926) ──────────────────────
  #
  # Издатель на крае — МНОЖЕСТВО: платформа чеканит свои токены сама (задача
  # #897), а прежний издатель на переходе остаётся. У КАЖДОГО принимаемого
  # издателя своя запись источника ключей: объединить наборы было бы дешевле и
  # уничтожило бы ровно ту защиту, ради которой развязка делается — ключ одного
  # издателя проверял бы токен, объявляющий другого.
  #
  # Значения — ТЕ ЖЕ, что у ПЕРВОЙ конфигурации проверяющего
  # (kacho-registry.tokenAcceptance ниже): одна платформа, один набор адресов.
  # Расхождение между ними было бы двумя местами об одном предмете.
  #
  # ОТКАТ состоит в снятии platformIssuer и нашего издателя из issuers — не в
  # перекатке образа.
  tokenAcceptance:
    issuers: "https://kaname.kacho.local,https://localhost:28080/.ory/hydra/public"
    # Адрес ОБЪЯВЛЯЕТСЯ, а не выводится из издателя: издатель приходит от
    # предъявителя, и производный адрес получался бы у ВСЯКОГО издателя —
    # состояние «записи нет» не наступало бы никогда, а страж старта стал бы
    # тождественно истинным.
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json,https://localhost:28080/.ory/hydra/public=https://kaname-internal.kacho.svc:9097/.well-known/jwks.json"
    # Наш издатель выбирает полосу приёма: строгий тип at+jwt и чтение отзыва на
    # предъявлении. Вне issuers — отказ в старте.
    platformIssuer: "https://kaname.kacho.local"
    # НАШ авторитет отзыва. Прежний провайдер о наших токенах не знает by
    # construction: спрошенный про наш токен, он отвечает не «действует» и не
    # «отозван», а утверждение о предмете, которого у него нет.
    revocationUrl: "https://kaname-internal.kacho.svc:9097/internal/tokens/introspect"
    # Якорь доверия хопа к авторитету: по нему едет ПРЕДЪЯВЛЕННЫЙ токен, а не
    # только административный вызов. Та же связка, что у хопа за ключами.
    revocationCa:
      secretName: kaname-server-tls
      key: ca.crt
      mountPath: /etc/api-gateway/platform-revocation-ca
    # ЧЕМ край предъявляет СЕБЯ авторитету. Якоря выше НЕ ДОСТАТОЧНО: он
    # проверяет ЕГО, а не представляет НАС. Авторитет выставлен на слушателе,
    # который сертификат ЗАПРАШИВАЕТ (iam отказывается стартовать иначе), и
    # спрашивающему без проверенной цепочки отвечает отказом — то есть без этой
    # пары КАЖДЫЙ предъявитель нашей чеканки получал бы 503 при исправном на вид
    # контроле. Пути — на УЖЕ смонтированную клиентскую личность края
    # (mtls.mountPath); своего тома у пары нет намеренно, вторая копия той же
    # личности разъехалась бы с первой молча.
    revocationClientCert:
      certFile: /etc/api-gateway/mtls/tls.crt
      keyFile: /etc/api-gateway/mtls/tls.key
  # Composition-root prod-guard (validateProductionAuthzConfig): an env NOT labelled
  # dev-class is treated as production → it REFUSES to boot if authn.mode=dev or a
  # dev HMAC secret is present (CWE-347 symmetric-key principal forgery). Flip the
  # label to production and drop the dev path.
  #
  # ВНУТРЕННЕГО gRPC-ЛИСТЕНЕРА У КРАЯ БОЛЬШЕ НЕТ (#1024) — здесь стоял разбор
  # того, как его настраивать, и он пережил свой предмет целиком.
  #
  # Разбор был про переезд четырёх переменных с родового проброса на
  # первоклассную ручку чарта, и оба его довода остаются верными КАК КЛАСС —
  # проброс обходит проверки связности, стоящие рядом с ручкой, и задваивает
  # запись в контейнере, где побеждает порядок блоков шаблона. Довод переехал
  # туда, где у него есть предмет: deploy/posture_parity_test.go судит это
  # свойство по всем профилям и всем подчартам разом, а не одним абзацем про
  # один листенер.
  #
  # Самого листенера нет: его единственную службу (гашение кэша решений края по
  # запросу iam) сняли вместе с обратным ребром, а листенер без единственной
  # службы был бы входной поверхностью без единого метода. Ни ручки, ни проброса
  # здесь поэтому не осталось — настраивать нечего.
  #
  # Круг законных отправителей, который этот профиль объявлял ЯВНО и НЕ равным
  # умолчанию чарта (модуль iam в пространстве имён kaname), снят вместе с
  # листенером: круг сужает доступ к поверхности, а поверхности нет. Это НЕ смена
  # круга — предмет сужения исчез.

  # appEnv (first-class knob → KACHO_APP_ENV) overrides values.dev.yaml's `dev`.
  # MUST NOT set KACHO_APP_ENV via extraEnv here: the chart already renders a
  # KACHO_APP_ENV env from the appEnv knob, so an extraEnv.KACHO_APP_ENV produces a
  # DUPLICATE list key → helm strategic-merge `$setElementOrder` patch failure on
  # `helm upgrade` (dev base appEnv=dev + extraEnv=production → two KACHO_APP_ENV).
  appEnv: production
  # UNIFICATION: verify RS256 tokens through the iam :9097 JWKS mirror, NOT Hydra :4444
  # directly (iam is the single JWKS facade; a direct-provider dial is forbidden). The
  # mirror is byte-identical and short-TTL; Hydra stays issuer/signer. `issuer` (iss-pin)
  # is unchanged — inherited from values.dev.yaml.
  #
  # THE HOP IS TLS, AND IT IS VERIFIED. Over it travels the material the edge checks every
  # bearer's SIGNATURE with: whoever substitutes it substitutes the access decision, and
  # the edge then believes its own answer. The certificate comes from the internal CA,
  # which the process does not trust by default, so the anchor is configured — same shape
  # as the admin hop right below.
  #
  # This also settles a contradiction that lived in THIS FILE: registry has been fetching
  # from the same :9097 over https all along (see registry.tokenAcceptance.issuerKeySets),
  # while the edge
  # was told plaintext was fine and the canonical profile went around the facade to the
  # provider instead. One port cannot be two transports.
  hydra:
    jwksUrl: ""  # СНЯТ: адрес набора теперь объявляется записью издателя
              # в tokenAcceptance.issuerKeySets выше.
    jwksCa:
      secretName: kacho-internal-ca-root
      key: tls.crt
    # iss-PIN — the SAME string the provider stamps (hydra.config.urls.self.issuer).
    # values.dev.yaml declares the http form WITH a trailing slash; this stand's provider
    # runs without its development flag, so its issuer identity is https and carries no
    # slash. The verifier compares `iss` EXACTLY (after stripping one trailing slash), so
    # a scheme mismatch here is not a degraded mode — every RS256 token fails validation
    # and the whole surface answers 401.
    issuer: ""  # СНЯТ вместе с приходом tokenAcceptance выше: два объявления об одном
                # предмете дают ОТКАЗ В СТАРТЕ, а не молчаливое старшинство.
    # dev declares both admin-API addresses in the clear; this stand is
    # production-class, so it addresses them over TLS with the anchor pinned.
    # Introspection asks about a bearer by SENDING it, on every authenticated
    # request that misses the cache — the wire carries a live end-user credential,
    # not merely administrative calls.
    introspectionUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc:4445/admin/oauth2/introspect"
    adminUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc:4445"
    adminCa:
      secretName: kacho-umbrella-hydra-admin-tls
      key: ca.crt
      mountPath: /etc/api-gateway/hydra-admin-ca

# ─── kacho-vpc ──────────────────────────────────────────────────────────────
vpc:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: authn.mode).
  authMode: production            # anonymous fail-closed
  repository:
    postgres:
      sslMode: require
  authz:
    # Круг отправителей чужой личности — см. values.prod.yaml (там же обоснование
    # состава). Пустой список НЕ запрещает, а не сужает; боевая посадка на нём не
    # стартует, поэтому профиль обязан его нести.
    trustedForwarderSANs:
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-compute
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-nlb
      # Здесь стояла запись оператора сети — компонента с таким именем в дереве нет,
      # и репозитория под него не существует. Круг доверенных отправителей пинится по
      # ФАКТИЧЕСКИМ отправителям: запись под несуществующего разрешала бы говорить за
      # пользователя предъявителю сертификата, которого мы не выпускаем. Появится
      # компонент — запись вернётся вместе с его кодом (решение владельца 2026-08-09).

# ─── kacho-compute (no public mode knob; posture = mTLS + authzIam + sslmode) ─
# The compute chart DEFAULTS auth.mode=production (dev flips it to dev). Restore
# production + require the encrypted DB channel. mTLS + authzIam already wired in dev.
compute:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: auth.mode).
  authMode: production
  db:
    sslMode: require

# ─── kacho-geo (Region/Zone leaf) ───────────────────────────────────────────
kacho-geo:
  authMode: production           # anonymous fail-closed on BOTH listeners
  db:
    sslMode: require
  # ВТОРОЙ клиент базы у этого чарта — Job разовой работы переноса географии. Он
  # ходит НЕ в свою базу, а в pg-compute, и строку соединения собирает из
  # собственного блока `dataMigration.source`, а не из `db` выше. Умолчание чарта
  # там — `disable`, поэтому профиль, который просто НЕ НАЗЫВАЕТ sslmode, получает
  # открытый канал: Job ходил бы к базе, которая на этом стенде TLS отдаёт, по
  # открытому тексту — с паролем БД и строками данных на проводе (CWE-319).
  #
  # Job выключен, и именно поэтому пропуск было не увидеть: гейт посадки
  # свидетельствует со стороны СУБД, то есть видит только те соединения, которые
  # существуют В МОМЕНТ ПРОВЕРКИ, а короткая работа между двумя прогонами гейта
  # не наблюдается вовсе. `values.prod.yaml` эту строку объявлял, этот профиль —
  # нет, при том что оба заявляют одну и ту же посадку.
  #
  # Свойство держит deploy/dbtls_declaration_test.go
  # (TestProductionStacks_DeclareEncryptedDatabaseChannel), а не этот комментарий.
  dataMigration:
    source:
      sslMode: require
  # trusted-forwarder-SANs (gateway SPIFFE) inherited from values.dev.yaml env.

# ─── kacho-storage ──────────────────────────────────────────────────────────
storage:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.authMode).
  authMode: production
  config:
    # Плоскость данных объявлена, потому что посадка БОЕВАЯ: страж старта
    # отказывает в старте боевому сервису без неё — облако, предлагающее API
    # хранения без плоскости данных, не сделает пригодным ни один том, а
    # рапортовать о здоровье будет исправно.
    #
    # ЧТО ЭТОТ СТЕНД НЕ НЕСЁТ, названо прямо: кластера блочного хранения по
    # адресу ниже здесь нет. Следствие ровно одно и оно наблюдаемо: тома
    # остаются созданными-но-непригодными, а причина видна в поле состояния —
    # плоскость данных не отвечает. Это ЧЕСТНОЕ поведение стенда без хранилища,
    # а не поломка: подставьте настоящий кластер — и тома станут пригодными без
    # единой правки здесь.
    #
    # Именно поэтому `storage.enabled` в базовом профиле остаётся выключенным:
    # включать сервис имеет смысл там, где кластер есть.
    blockBackend:
      # ВИД ПУСТ — и это не пропуск, а описание того, что стенд НЕСЁТ.
      #
      # Здесь стоял CEPH_RBD, и он был обещанием: кластера блочного хранения в
      # kind нет. Сервис при этом честно шёл по ветке «плоскость данных
      # объявлена» и ждал подтверждения от сверщика, которому нечего увидеть, —
      # тома оставались непригодными, а сквозные прогоны падали на создании
      # снимка «Volume … is not ready». Профиль обещал то, чего у стенда нет.
      #
      # Пустой вид означает: сверять не с чем, фиксация записи и есть готовность.
      # Kachō — платформа ТОЛЬКО управляющей плоскости, поэтому это штатная
      # посадка, а не неполная. Появится кластер — впишите вид, и готовность
      # начнёт производить сверщик, без единой правки кода.
      kind: ""
      installPrefix: kachostand
      credentialsDir: /etc/kacho/storage/credentials
      callTimeout: 30s
      reconcileInterval: 15s
      reconcileBatch: 100
  db:
    sslMode: require

# ─── kaname (authz authority + identity tier) — production-strict ────────
kaname:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.authn.mode).
  authMode: production-strict    # Bearer required + Config.Validate requires hook/jwks secrets
  config:
    authn:
      # Hydra's advertised self.issuer on this kind stand is the localhost nodeport
      # (hydra.config.urls.self.issuer = http://localhost:28080/.ory/hydra/public/), NOT
      # the domain-derived https://hydra.api.kacho.cloud. Without this, the private_key_jwt
      # client_assertion iam signs for the registry-token exchange carries
      # aud=<derived>/oauth2/token → Hydra rejects it ("audience must match the token
      # endpoint http://localhost:28080/.ory/hydra/public/oauth2/token", invalid_client).
      # Set as a CONFIG value (ResolveHydraIssuer highest precedence) — the env passthrough
      # KANAME_HYDRA_ISSUER collides with the chart's domain-derived env of the same name
      # and k8s dedups to the first (external) → non-deterministic. Aligns iam with the
      # gateway (gateway.hydra.issuer already = this localhost issuer); the in-cluster POST
      # target stays hydraTokenURL. authn.go documents this override for non-derivable issuers.
      # Same string the provider stamps (no trailing slash — see hydra.urls.self.issuer).
      hydraIssuer: "https://localhost:28080/.ory/hydra/public"
      # ─── bootstrap-mint caller allow-list — REQUIRED to boot here (#58) ──────
      # This profile ENABLES the mint (kacho.iam.bootstrapToken.signingKeySecretName
      # below ⇒ the signing key is injected), and MintBootstrapToken issues a
      # cluster `system_admin` RS256 Bearer. It has no ReBAC gate (it exists to
      # obtain the FIRST token, before any relation exists) and no api-gateway REST
      # route — the caller's client-certificate SPIFFE SAN IS the credential, checked
      # by authzguard.CallerPolicy on :9091 against exactly this list.
      #
      # In production Config.Validate REFUSES TO START on "mint enabled + empty
      # allow-list" (core rule #16 — an enabled-yet-uncallable mint invites the
      # "fix" of reopening the hole), so this list is not optional here: without it
      # kaname CrashLoopBackOffs and `values.dev-prod` stops being a bootable
      # production profile.
      #
      # The identity is the dedicated operator leaf the umbrella issues
      # (mtls.bootstrapOperator → secret kacho-bootstrap-operator-client-tls,
      # client-auth only). DELIBERATELY NOT the api-gateway SAN: the gateway fronts
      # tenant traffic and is reachable cluster-wide, so "is the api-gateway" must
      # never be a licence to mint cluster-admin. Seed/fixture path:
      # tests/authz-fixtures/mint_rs256.py pulls that Secret and dials iam :9091.
      bootstrapMint:
        allowedClientSANs:
          - spiffe://kacho.cloud/ns/kacho/sa/kacho-bootstrap-operator
      # СВОЯ ЧЕКАНКА ТОКЕНОВ (F1, задача #897)
      #
      # Контур выдачи докер-токена переводится на НАШ подписант: обе его стороны
      # наши, и подписант без производственного вызывающего — тот же класс, что
      # хранилище без читателя.
      #
      # Каждое значение обязательно: незаданный издатель означает «любой»,
      # пустой перечень допустимых алгоритмов означает «принимаем любой», а
      # вырожденный путь записи набора превращает стража источника в проверку,
      # неспособную упасть.
      tokenSigning:
        enabled: true
        issuer: "https://kaname.kacho.local"
        algorithm: ES256
        allowedAlgorithms: "ES256,RS256"
        keySetPath: /.well-known/kaname/jwks.json
      # ТОКЕН-ЭНДПОИНТ ПЛАТФОРМЫ (F2, задача #898)
      #
      # Клиент предъявляет подписанное утверждение, мы сверяем подпись открытым
      # ключом из своего же реестра и выдаём токен доступа НАШИМ подписантом.
      # Эндпоинт монтируется на уже объявленную внешне досягаемую поверхность
      # выдачи и своего слушателя не заводит.
      #
      # Каждая ручка ниже обязательна, как только эндпоинт включён, и каждая
      # невидима на положительном пути: пустой перечень адресатов означает
      # «выдаём токен, адресованный чему угодно», нулевой потолок тела — «читаем
      # сколько прислали». Страж старта отказывает в пуске на любой из них.
      #
      # АДРЕСАТ КРАЯ СТОИТ В ПЕРЕЧНЕ — ИНАЧЕ ВТОРАЯ ПОЛОСА НЕИСПОЛНИМА (#1014).
      #
      # Край объявлен принимающим ДВУХ издателей (`api-gateway.tokenAcceptance`
      # выше), и наш — второй из них. Но принимает он токен только с адресатом
      # `https://` + собственным доменом API (`ExpectedAudience()`), а перечень
      # здесь называл ОДИН адресат — реестр. Токен нашей чеканки поэтому
      # отвергался краем по адресату, ни разу не дойдя до проверки подписи: полоса
      # объявлена, задокументирована, покрыта типами — и не работала ни при каком
      # входе (`api-conventions.md` §«ДВА ПРАВИЛА ОБ ОДНОМ ПОЛЕ»).
      #
      # Здесь стояло «умолчание не тронуто: докерная полоса по-прежнему получает
      # адресат реестра, не называя его». Умолчания больше нет, и оно не было
      # адресатом реестра: реестр объявлял другое имя (задача #1184).
      clientToken:
        enabled: true
        # АДРЕСАТ ДОКЕРНОЙ ПОЛОСЫ НАЗВАН ЗДЕСЬ ЯВНО (задача #1184). Прежде тут
        # стоял `registry.kacho.local` — встроенное умолчание процесса iam, — а
        # реестр объявлял докер-клиенту `registry.in-cloud.io`. Стороны полосы
        # расходились, и это было НЕВИДИМО: клиент echo-ит услышанное от
        # реестра, подписант чеканил что просят, перечень сверял третье имя,
        # которого не называл никто. Со сверкой адресата то же расхождение
        # означает отказ во входе докера, поэтому перечень называет ДЕЙСТВУЮЩЕЕ
        # имя полосы — то самое `global.kacho.registry.serviceAud`.
        allowedAudiences: "https://api.kacho.cloud,registry.in-cloud.io"
        # АДРЕСАТ ПО УМОЛЧАНИЮ — ЧЛЕН ПЕРЕЧНЯ ВЫШЕ, и это проверяет страж старта.
        #
        # Здесь оставалось `registry.kacho.local` — имя снятого встроенного
        # умолчания процесса iam. Перечень #1184 перевёл на действующее имя
        # полосы, а его двойника — нет, и две величины ОДНОГО профиля разошлись:
        # адресат по умолчанию отвергался бы нашей же сверкой, то есть выдача не
        # работала бы НИ ПРИ КАКОМ входе, где адресат не назван (`api-conventions.md`
        # §«ДВА ПРАВИЛА ОБ ОДНОМ ПОЛЕ»). Страж старта iam именно это и говорит,
        # поэтому под не доходил до готовности, а стенд — до подъёма.
        #
        # Значение — действующее имя полосы, то самое `global.kacho.registry.serviceAud`:
        # запрос докерной полосы адресата не называет и получает этот.
        defaultAudience: "registry.in-cloud.io"
        tokenTtl: "15m"
        bodyCeiling: 65536
    repository:
      postgres:
        sslMode: require         # production-strict enforces ssl-mode ∈ {require,verify-ca,verify-full}
  # mtls.httpListeners=true — the iam HTTP listeners are TLS, and that is REQUIRED here,
  # not optional.
  #
  # THE COMMENT THAT USED TO STAND HERE SAID THE OPPOSITE, AND IT WAS WRONG. It argued
  # that TLS-ing these listeners would break the edge's key fetch, so the toggle had to
  # stay off. That was true only while the edge had no way to trust the internal CA — an
  # address knob existed, a trust knob did not. The trust knob now exists
  # (api-gateway.hydra.jwksCa above), so the premise is gone.
  #
  # It also pointed at the canonical profile as proof that "off" was safe there, because
  # that profile sent the edge straight to the provider. That was not safety, it was the
  # facade bypass wearing a justification — the same bypass this edge had already been
  # caught at once and fixed. It is fixed in that profile too now.
  #
  # What this actually protects: :9096 carries an HTTP Basic password that IS a service
  # account key's private key — never stored by the server, never expiring. iam refuses
  # to start with it in the clear, and it is right to. :9097 carries the signature-
  # verification material. Both stop being readable on the wire here.
  mtls:
    # Слушатель :9097 несёт ДВЕ поверхности с разными требованиями. Набор
    # проверочных ключей обязан оставаться доступен без клиентского сертификата
    # (потребитель origin-agnostic), а авторитет отзыва принимает предъявленный
    # токен и обязан знать, кто спрашивает. Поэтому сертификат ЗАПРАШИВАЕТСЯ и
    # верифицируется, если предъявлен, а отказывает сам обработчик авторитета:
    # режим сам по себе ничего не сужает.
    jwksProxyClientAuthMode: optional-mutual
    # ПОЛИСТЕННО, А НЕ ОДНОЙ РУЧКОЙ — и это не тонкость, а единственная рабочая
    # комбинация. :9096 обязан быть под TLS (по нему едет пароль, который сервер не
    # хранит и который не истекает; загрузочная стража права, что отказывается стартовать
    # иначе). :9097 обязан быть под TLS, потому что по нему край забирает материал для
    # проверки подписей. А :9092 обязан ОСТАТЬСЯ открытым: его вызывает вебхук провайдера
    # личности, который ходит по http и своего доверия не несёт, — завернув и его,
    # получаем «клиент прислал http-запрос на https-сервер», проваленный хук и полностью
    # неработающую выдачу токенов. Измерено на этом стенде, а не выведено.
    httpListeners: false
    jwksProxy: true
    registryToken: true
  kacho:
    iam:
      # Provider-ADMIN hop: declared (never derived) and over TLS with the anchor
      # pinned — the internal-CA bundle already mounted for mTLS is the same CA
      # that signs the provider's admin certificate. dev's plaintext value is
      # deep-merged over here; leaving it would refuse the start on this stand.
      hydraAdminUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc:4445"
      hydraAdminCaFile: /etc/kaname/tls/server/ca.crt
      hydraTokenURL: "http://kacho-umbrella-hydra-public.kacho.svc:4444/oauth2/token"
      # UNIFICATION FIX (dev-masked): the iam :9097 JWKS proxy — the endpoint every
      # service is supposed to verify RS256 tokens through (registry-iam-jwks-unify) —
      # derives its upstream from KANAME_HYDRA_ISSUER = https://hydra.api.kacho.cloud,
      # the EXTERNAL ingress host that is UNREACHABLE in-cluster → the proxy fail-closes
      # 502 and NO service can verify through it (they silently fall back to Hydra-direct,
      # defeating the unification). Point the upstream at the in-cluster Hydra PUBLIC
      # Service (same fix api-gateway.hydra.jwksUrl already carries). ResolveHydraJWKSURL
      # honours this explicit override ahead of the issuer-derived default.
      hydraJwksUrl: "http://kacho-umbrella-hydra-public.kacho.svc:4444/.well-known/jwks.json"
      # Bootstrap-admin SA ES256 (P-256, PKCS#8) signing key — signs the
      # private_key_jwt client_assertion the mint exchanges at Hydra. Empty ⇒ env
      # absent ⇒ MintBootstrapToken fails closed (UNAVAILABLE). Provisioned as a
      # LOCAL kind secret by scripts/dev-prod-secrets.sh (generated fresh, NOT
      # committed — a real cluster provisions it out-of-band / external-secrets).
      bootstrapToken:
        signingKeySecretName: kaname-bootstrap-sa-key
        signingKeySecretKey: private_key_pem

# ─── kacho-nlb ──────────────────────────────────────────────────────────────
kacho-nlb:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.mode).
  authMode: production
  config:
    authz:
      # Ручки аварийного обхода авторизации у nlb нет — звено решения о доступе
      # ставится безусловно. Стоявшее здесь `breakglass: false` не читал ни
      # шаблон чарта, ни описатель настроек процесса.
      #
      # production + mtls.server.enable requires a non-empty forwarder allow-list
      # (empty ⇒ any mTLS peer may forge the forwarded end-user principal). The only
      # trusted forwarder is the api-gateway (same SPIFFE SAN geo/compute trust).
      trustedForwarderSANs:
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
  db:
    sslMode: require

# ─── kacho-registry ─────────────────────────────────────────────────────────
# production-strict: registry's DB-sslmode guard fires ONLY in production-strict (plain
# `production` leaves DB plaintext). The control-plane guard (validateSecurityConfig —
# authz-addr + both-listener mTLS) is NOT mode-gated: it runs whenever breakglass=off.
# The Docker DATA-plane (push/pull VIP) is out-of-scope on kind (dataplaneLB off) →
# DataplaneAddr empty → the data-plane guards (https-JWKS / issuer-pin / dataplane-TLS-
# ack) stay dormant, so production-strict boots cleanly control-plane-only on kind.
registry:
  authMode: production-strict
  db:
    sslMode: require
  authz:
    breakglass: false
  # Data-plane proxy (KACHO_REGISTRY_DATAPLANE_ADDR is always a non-empty listen addr →
  # the proxy is always built → its 3 production guards fire): (1) requireSecureJWKSURL —
  # verify docker identity-JWT via the iam :9097 JWKS proxy over HTTPS (unification: iam
  # is the JWKS facade, NOT Hydra direct; chart default is http:// which FAILS the guard);
  # (2) requireIssuerPinned — pin the expected iss to Hydra's self.issuer; (3) require
  # DataplaneTLSAck — operator ack the plaintext data-plane sits behind external TLS.
  # The Docker data-plane itself is NOT exercised on kind (dataplaneLB off) — these are
  # config-level boot guards, no live fetch, so registry boots control-plane-only.
  # Приём identity-JWT: издатель — МНОЖЕСТВО (F1, задача #897)
  #
  # Платформа чеканит свои токены сама, а прежний издатель на переходе остаётся,
  # поэтому принимаемых издателей двое и у КАЖДОГО своя запись источника ключей.
  # Объединять наборы в один документ дешевле и уничтожило бы ровно ту защиту,
  # ради которой развязка заводится: ключ одного издателя проверял бы токен,
  # объявляющий другого.
  #
  # Прежние ручки `registry.iam.jwksUrl` и `registry.hydra.issuer` СНЯТЫ, а не
  # оставлены мостом: мост был бы вторым местом об одном предмете и обессмыслил
  # бы то, ради чего смена вообще видна при старте — пересмотр пина издателя.
  # Профиль, задающий только снятые имена, принимает НОЛЬ издателей и не
  # поднимается.
  tokenAcceptance:
    issuers: "https://kaname.kacho.local,https://localhost:28080/.ory/hydra/public"
    # Адрес ОБЪЯВЛЯЕТСЯ, а не выводится из издателя: издатель приходит от
    # предъявителя, и производный адрес получался бы у ВСЯКОГО издателя —
    # состояние «записи нет» не наступало бы никогда, а страж старта стал бы
    # тождественно истинным.
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json,https://localhost:28080/.ory/hydra/public=https://kaname-internal.kacho.svc:9097/.well-known/jwks.json"
    # Наш издатель выбирает полосу приёма: тип at+jwt и чтение отзыва на
    # предъявлении. Вне issuers — отказ в старте.
    platformIssuer: "https://kaname.kacho.local"
    # Авторитет отзыва. Контроль, действующий на выдаче и не действующий на
    # предъявлении, отзывом не является: он лишь не выдаёт нового, а
    # предъявленное проходит до истечения срока, и это состояние не сходится
    # само.
    revocationUrl: "https://kaname-internal.kacho.svc:9097/internal/tokens/introspect"
  # Ребро к авторитету отзыва (F1, задача #897). Ему присылают ПРЕДЪЯВЛЕННЫЙ
  # токен, поэтому хоп идёт под клиентским сертификатом. Набор проверочных
  # ключей с того же слушателя по-прежнему берётся БЕЗ сертификата: его
  # origin-agnostic свойство и есть причина, по которой ребро не делается
  # взаимным целиком.
  mtls:
    enable: true
    edges:
      tokenRevocation: true
  dataplaneTLSTerminatedExternally: true

# ─── Per-service Postgres — serve self-signed TLS so sslmode=require works ───
# bitnami tls.autoGenerated uses helm genSignedCert cached via secrets.lookup
# (idempotent across upgrades — the cert is NOT regenerated once the -crt Secret
# exists). Self-signed server cert; clients use sslmode=require (encrypt, do not
# verify) — the correct floor for an in-cluster self-signed cert.
#
# ВКЛЮЧЁННЫЙ TLS — ЭТО ПРЕДЛОЖЕНИЕ, А НЕ ТРЕБОВАНИЕ (выведено из #121).
# `tls.enabled` заставляет сервер УМЕТЬ шифровать, но правила доступа bitnami по
# умолчанию — `host`, а `host` матчит соединение и с TLS, и без него. То есть
# шифрование канала держится РОВНО на том, что каждый клиент помнит про
# `sslmode`: клиент, который его не назвал, соединяется открытым текстом, и со
# стороны клиента это неотличимо от шифрованного. Пропуск виден только со
# стороны СУБД (`pg_stat_ssl`) — постфактум и только пока клиент подключён.
#
# Именно так и вышло: ночной гейт посадки увидел у kacho-umbrella-pg-iam
# нешифрованные соединения, а сам сервис в том же прогоне честно заявлял
# `db_sslmode=require`. Виновника установить не удалось — соединение к тому
# времени закрылось. Пока сервер принимает открытый текст, вопрос «кто это был»
# будет возникать снова, и каждый раз постфактум.
#
# Поэтому требование переносится на СЕРВЕР: он перестаёт принимать
# незашифрованные соединения ПО СЕТИ. Тогда пропущенный `sslmode` — это отказ в
# соединении при старте потребителя, а не тихий открытый канал, и «обязательно»
# перестаёт зависеть от того, что все всё помнят.
#
# ─── ПОЧЕМУ НА СОКЕТЕ И ПЕТЛЕ `trust`, А НЕ `md5` (выведено 2026-08-11) ────────
#
# Здесь стоял `md5`, и с ним НИ ОДИН инстанс не поднимался с нуля. Причина —
# порядок: первичная настройка обязана подключиться к своей же базе, чтобы
# ЗАДАТЬ пароль, и делает это по сокету и петле ДО того, как пароль существует.
# Требование пароля в этот момент замыкает круг: «password authentication failed
# for user postgres … User postgres has no password assigned».
#
# Почему этого не замечали. На стенде с постоянным томом каталог данных
# переживает переустановку, первичная настройка ПРОПУСКАЕТСЯ целиком — и профиль
# выглядит рабочим ровно до кластера без постоянных томов, где каждый запуск
# первичный. То есть проверка была верна для стенда, который уже однажды
# поднялся другим способом.
#
# Почему `trust` здесь не послабление. Сокет и петля живут в сетевом
# пространстве САМОГО пода; снаружи к ним не подключиться, а внутри пода нет
# никого, кроме сервера и его проб. Граница безопасности проходит по сети, и она
# закрыта двумя строками ниже: по сети принимается ТОЛЬКО шифрованное соединение
# с паролем, а нешифрованное отвергается явно.

# Петля и unix-сокет оставлены незашифрованными намеренно: сети там нет, а через
# 127.0.0.1 ходят liveness/readiness-пробы чарта (`pg_isready -h 127.0.0.1`).
# Запрет на них сломал бы готовность пода, ничего не защитив.
#
# Блок объявляется ОДИН раз (якорь) и переиспользуется ссылкой: семь рукописных
# копий разъехались бы, и разъехались бы молча. Гейт — deploy/dbhba_tls_required_test.go:
# он требует этот блок у КАЖДОГО инстанса, чей `tls.enabled: true`, в каждом
# профиле, и падает на инстансе, добавленном без него.
# ─── БЮДЖЕТ ПАМЯТИ БАЗ — ВЫБРАН ЗДЕСЬ, А НЕ УНАСЛЕДОВАН ОТ СТЕНДА РАЗРАБОТКИ ───
#
# ПОЧЕМУ БЛОК СТОИТ ИМЕННО В ЭТОМ ФАЙЛЕ (#808). Этот профиль — общий слой ровно
# трёх стендов, объявляющих боевую посадку (dev-prod, prorobotech, a8f60d), и
# он НЕ входит в цепочку стенда разработки (deploy/stacks.txt: `dev` — это
# только values.dev.yaml). Значит выбор, сделанный здесь, связывает все три
# боевых стенда и НЕ трогает стенд разработки — а вместе с ним не трогает ни
# условия, на которых снят отчёт замера, ни условия, на которых гоняется
# сквозной набор. Это by construction, а не обещание: предикат —
# `grep '^dev:' deploy/stacks.txt`.
#
# ЧТО ЗДЕСЬ МЕНЯЕТСЯ, А ЧТО НАМЕРЕННО НЕТ. Меняется РОВНО `max_connections` —
# потолок числа соединений, которого не достигает ни один стенд. У трёх баз,
# чей потолок здесь опущен, пул объявлен так: vpc — 200 на реплику, compute —
# не объявлен, nlb — объявлен нулём, то есть тоже отдан умолчанию драйвера
# (`max(4, число ядер узла)`, pgx v5). Живых клиентских сессий на поднятом
# стенде замерено 5-7 на каждую из них. `shared_buffers`, `work_mem` и
# `effective_cache_size` оставлены как были — это ручки, меняющие ПЛАН запроса,
# и их правка была бы капасити-решением, требующим прогона, а не объявлением.
# Поэтому вывод любого прежнего замера остаётся действительным: величины, от
# которых он зависит, не тронуты.
#
# ПОЧЕМУ 210 У pg-vpc. Служба обещает базе 200 соединений — произведение
# ширины пула на потолок числа подов (40 × 5, services/vpc/deploy/values.yaml),
# — а PostgreSQL резервирует 3 суперпользователю; ниже 203 опускать нельзя
# (deploy/pool_fits_database_test.go). То же число и по той же причине стоит в
# values.prod.yaml (#762); совпадение здесь намеренное.
#
# Здесь стояло «пул 200 на реплику» — верное слагаемое и неверное обещание:
# потолок подов в счёт не входил вовсе, а он тогда был 10 (#709). Обещание
# читается только по ПАРЕ чисел; одно из них само по себе ничего не значит.
#
# АРИФМЕТИКА, КОТОРУЮ ПРОВЕРЯЕТ deploy/db_footprint_declaration_test.go:
#
#     shared_buffers + max_connections × work_mem  ≤  limits.memory
#
# Потолки приходят из values.dev.yaml и здесь не переобъявляются — кроме
# pg-iam, см. ниже.
#
# autovacuum_naptime ПОВТОРЁН в каждом блоке намеренно: extendedConfiguration —
# СКАЛЯР, и профиль, объявивший свой, замещает строку предыдущего ЦЕЛИКОМ, а не
# дописывает в неё. Пропуск строки был бы молчаливым: он виден только в
# отрендеренном ConfigMap. Держит это deploy/tests/helm/outbox-autovacuum-naptime-test.sh.
# У pg-geo строки нет и не должно быть — geo_outbox курсорный, без дренажа
# (тот же гейт, список NON_QUEUE_INSTANCES).
pg-vpc:
  tls:
    enabled: true
    autoGenerated: true
  primary:
    pgHbaConfiguration: &pgHbaTLSRequired |
      local     all all                trust
      host      all all 127.0.0.1/32   trust
      host      all all ::1/128        trust
      hostssl   all all 0.0.0.0/0      md5
      hostssl   all all ::/0           md5
      hostnossl all all 0.0.0.0/0      reject
      hostnossl all all ::/0           reject
    # 512MB + 300 × 16MB = 5312MiB ≤ 6Gi (предел приезжает из values.dev.yaml).
    #
    # ПОЧЕМУ СНОВА 300 (#1451). Здесь стояло «было 300 соединений (5312MiB) —
    # потолок не вмещал даже объявленную трату»: верно для потолка 4Gi, который
    # этот профиль читал тогда. Предел с тех пор 6Gi, и та же трата в него
    # помещается — то есть довод пережил своё основание.
    #
    # Вернуть пришлось потому, что обещание флота считается по ТРЁМ числам:
    # (40 пул + 16 потолок потоков подписки + 1 дренаж) × 5 подов = 285 (#1384).
    # Прежние 210 отдавали 207, и потолок потоков эту связку не решает — пул
    # 40 × 5 = 200 плюс дренаж 5 уже занимают 205 из 207, значит на потоки
    # остаётся 2 на пять подов. 300 отдаёт 297: 12 сверх обещанного.
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 300
      shared_buffers = 512MB
      work_mem = 16MB
      effective_cache_size = 2GB
      checkpoint_timeout = 15min
      max_wal_size = 2GB
      autovacuum_naptime = 5s
pg-compute:
  tls:
    enabled: true
    autoGenerated: true
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
    # 256MB + 180 × 16MB = 3136MiB ≤ 6Gi (предел приезжает из values.dev.yaml).
    #
    # ПОЧЕМУ 180 СОЕДИНЕНИЙ (#1451). Здесь стояло «служба обещает базе 75 —
    # произведение ширины пула на потолок числа подов (15 × 5)»: слагаемое
    # верное, обещание нет. Соединения ВНЕ пула в счёт не входили, а их на
    # реплику 17 — поток подписки (16) и дренаж очереди (1), и оба пул вычесть
    # из своей ширины не может (#1384). Обещание — (15 + 16 + 1) × 5 = 160, а
    # прежние 100 отдавали 97: отказ ВСЕМУ процессу ровно под нагрузкой, когда
    # поды приходят сами. 180 отдаёт 177 и оставляет 17 сверх обещанного —
    # миграциям старта и опросу готовности, которых арифметика гейта не считает.
    #
    # Здесь же стояло «пул не объявлен, действует умолчание драйвера»: верно на
    # момент записи и снято вместе с предметом (#709) — величину, которую никто
    # не выбирал, теперь выбирает чарт.
    #
    # Загрузочного стража (pkg/db.ConnBudget) у compute НЕТ: он провязан в одной
    # службе из семи (iam). Прежняя редакция обещала его и здесь — обещание
    # защиты, которой нет. Единственное, что сверяет это произведение для
    # compute, — deploy/pool_fits_database_test.go, и сверяет по ОБЪЯВЛЕНИЮ.
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 180
      shared_buffers = 256MB
      work_mem = 16MB
      effective_cache_size = 1GB
      autovacuum_naptime = 5s
pg-iam:
  tls:
    enabled: true
    autoGenerated: true
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
    # ЕДИНСТВЕННАЯ база, у которой поднят ПОТОЛОК, а не опущена трата, и это
    # решение, а не удобство. Здесь объявлено `max_connections = 200` при
    # `work_mem = 8MB` (values.dev.yaml), то есть наполненный пул просит до
    # 1.6Gi только на сортировки — больше прежнего предела в 1Gi. Опустить
    # соединения нельзя, не сделав ложным обоснование в values.a8f60d.yaml,
    # которое на этих 200 × 8MB и построено.
    #
    # То же значение (2Gi) и по той же причине уже стоит там для этой базы —
    # здесь оно распространяется на два оставшихся боевых стенда. И это ровно
    # то, что предсказывает комментарий самой values.dev.yaml: «следующий предел
    # — ПАМЯТЬ, а не ядра».
    #
    # Предел памяти — не резервирование: `requests` не трогается, поэтому
    # планировщик ставит под так же, как раньше.
    #
    # 128MB + 200 × 8MB = 1728MiB ≤ 2Gi.
    resources:
      limits:
        memory: 2Gi
pg-geo:
  tls:
    enabled: true
    autoGenerated: true
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
pg-nlb:
  tls:
    enabled: true
    autoGenerated: true
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
    # 128MB + 100 × 8MB = 928MiB ≤ 1Gi. Было 200 соединений (1728MiB).
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 100
      shared_buffers = 128MB
      work_mem = 8MB
      effective_cache_size = 512MB
      autovacuum_naptime = 5s
pg-storage:
  tls:
    enabled: true
    autoGenerated: true
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
    # ВЫБОР СТАТУС-КВО, А НЕ ПРАВКА. До этой строки базу не настраивал ни один
    # профиль цепочки, поэтому действовали умолчания СБОРКИ PostgreSQL — их
    # никто не выбирал под этот стенд, и замер, снятый на другом, к нему не
    # относился. Названы ровно те же три величины (100 / 128MB / 4MB), то есть
    # поведение не меняется ни на йоту — меняется то, что теперь они ВЫБРАНЫ и
    # арифметика записана: 128MB + 100 × 4MB = 528MiB ≤ 1Gi (и ≤ 640Mi на
    # a8f60d, поэтому своей накладки там не требуется).
    #
    # effective_cache_size здесь НЕ объявляется намеренно: это подсказка
    # планировщику, её правка меняет план запроса и потому является
    # капасити-решением, требующим прогона. Гейт её и не спрашивает.
    extendedConfiguration: |
      max_connections = 100
      shared_buffers = 128MB
      work_mem = 4MB
      autovacuum_naptime = 5s
pg-registry:
  tls:
    enabled: true
    autoGenerated: true
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
    # Выбор статус-кво — обоснование у pg-storage выше.
    # 128MB + 100 × 4MB = 528MiB ≤ 1Gi.
    extendedConfiguration: |
      max_connections = 100
      shared_buffers = 128MB
      work_mem = 4MB
      autovacuum_naptime = 5s

# ── Величина учётных данных обратного вызова провайдера → служба прав :9092 ──
# Адрес полосы и форма заголовка приезжают из values.dev.yaml; здесь — только
# ВЕЛИЧИНА, переменной по пути ключа конфигурации.
#
# ЗДЕСЬ БЫЛ ЗАПИСАН ДЕФЕКТ, КОТОРЫЙ ЭТОТ ЖЕ ФАЙЛ И ЛЕЧИЛ — ТОЛЬКО У СЕБЯ.
# Прежняя редакция объясняла: в базовом профиле величиной стоит литерал
# `${KANAME_HOOK_TOKEN}`, провайдер подстановки не делает, значит литерал
# уезжает в заголовок и служба прав отвечает `401`. Всё верно — и починено было
# только в этом наложении. Базовый профиль остался с литералом и без источника,
# а `make dev-up` поднимает СНАЧАЛА его и ждёт готовности в этом состоянии
# (задача #948). Сегодня источник объявлен в ОБОИХ профилях, литерала нет ни в
# одном, а профиль, объявивший полосу без источника, не рендерится вовсе —
# templates/identity-callback-credential-guard.yaml.
#
# Транспорт остаётся ОТКРЫТЫМ http — см. заметку про mtls службы прав выше:
# TLS на её HTTP-листенерах сломал бы чтение ключей проверки краем (:9097).
# Блок `deployment` — ключ ВЕРХНЕГО уровня чарта провайдера → hydra.deployment.
hydra:
  hydra:
    # THE FLAG THAT MADE ALL OF THE BELOW INERT.
    #
    # `values.dev.yaml` sets `hydra.hydra.dev: true`, which starts the provider as
    # `hydra serve all --dev`. That flag serves every listener in the CLEAR and makes a
    # declared TLS block decoration: the admin certificate was issued, mounted and named
    # in the config, `checksum/hydra-config` matched, the pod was current — and an
    # openssl handshake against :4445 still answered `wrong version number`, i.e.
    # plaintext. The subchart's own default is `false` and its comment says "not secure
    # in production environments"; neither this overlay nor values.prod.yaml used to turn
    # it back off, so the production profile inherited it from the dev base.
    #
    # Visible consequence: the gateway dialled https, got an HTTP answer, correctly
    # classified it as MISCONFIGURATION rather than an outage (security.md §8) and
    # fail-closed every request with `503 revocation check unavailable`. The whole API
    # surface was dead — which is how a control that is present, wired and never
    # exercised finally announced itself.
    dev: false
    config:
      urls:
        self:
          # ISSUER TRAILING-SLASH: values.dev.yaml sets self.issuer WITH a trailing
          # slash (http://localhost:28080/.ory/hydra/public/). Hydra stamps that exact
          # string into every token's `iss`. But the api-gateway verifier normalises its
          # EXPECTED issuer by STRIPPING the trailing slash (config.ResolvedHydraIssuer)
          # and then does an EXACT `iss != expected` compare (jwt_verifier.go) — so a
          # with-slash token `iss` never matches the no-slash expected → EVERY RS256 token
          # fails validation (401 "token validation failed"), production-newman included.
          # Align on the gateway's canonical no-slash form: drop the trailing slash from
          # the issuer identity (the token `iss`). `public` (browser-facing base URL, kept
          # in dev.yaml) is a SEPARATE knob and keeps its slash for routing. iam's assertion
          # audience (ResolveHydraTokenEndpoint = TrimRight(issuer)+"/oauth2/token") is
          # unaffected — it already trims — so the registry-token exchange still matches
          # Hydra's token endpoint. (Контур бутстрапа с 2026-08-23 в этом перечне НЕ
          # участвует: он чеканит сам, задача #1119.) Scoped to the production-mode overlay (dev-mode authn
          # accepts HS256 and never verifies the Hydra `iss`, so dev.yaml is untouched).
          # SCHEME IS https BECAUSE THE PROVIDER REFUSES ANYTHING ELSE WITHOUT ITS
          # DEVELOPMENT FLAG (see `dev: false` above): «Scheme from configuration key
          # `urls.self.issuer` must be `https` when `dev` is `false`».
          #
          # `iss` IS AN IDENTIFIER, NOT A TRANSPORT. Nothing dials this string — the
          # provider stamps it into every token's `iss`, consumers compare it as a
          # string, and the browser-facing base URL is the SEPARATE `self.public` knob
          # (left in the clear). So moving the scheme here changes the token identity
          # and nothing about how anybody connects.
          #
          # EVERY CONSUMER THAT PINS `iss` MUST CARRY THE SAME STRING, character for
          # character, and there are four of them (gateway, iam, registry, and the
          # harness's client_assertion audience). They are set together below; a
          # mismatch is not a degraded mode — every RS256 token fails the iss check and
          # the whole surface answers 401.
          issuer: "https://localhost:28080/.ory/hydra/public"
          # `public` MOVES WITH `issuer`, AND THIS IS THE WHOLE POINT OF THE PAIR.
          #
          # The provider derives its ADVERTISED `token_endpoint` from `self.public`, not
          # from `self.issuer` — measured on the live discovery document:
          #     issuer         = https://localhost:28080/.ory/hydra/public   (self.issuer)
          #     token_endpoint = http://localhost:28080/.ory/hydra/public/oauth2/token
          # while `iss` comes from `self.issuer`. Consumers that build the private_key_jwt
          # `aud` as «issuer + /oauth2/token» (iam's ResolveHydraTokenEndpoint, and the
          # harness) therefore sent an https audience to a provider advertising an http
          # token endpoint, and every exchange came back «hydra rejected the token
          # exchange» → iam answered `bootstrap token issuer unavailable` → the seed could
          # not obtain its first token. (ИСТОРИЯ. С задачи #1119 контур бутстрапа
          # чеканит сам и этой ошибки не производит — искать её текст в дереве
          # бесполезно; разбор оставлен потому, что тот же класс живёт у остальных
          # потребителей пары issuer/public.)
          #
          # This was self-inflicted: `issuer` had to become https (the provider refuses a
          # non-https issuer without its development flag) and `public` was left behind, so
          # the two disagreed. They describe the SAME identity and must move together.
          #
          # Neither is a transport: both are identifier strings on a stand whose listener
          # is reached over plain http behind a trusted terminator. Changing them changes
          # what the provider ADVERTISES and stamps, not how anybody connects.
          public: "https://localhost:28080/.ory/hydra/public/"
      # ПОЧЕМУ ЗДЕСЬ НЕТ ОБЪЯВЛЕНИЯ TLS ДЛЯ АДМИНИСТРАТИВНОГО ЛИСТЕНЕРА.
      #
      # Развёрнутая версия провайдера ручку TLS ОТДЕЛЬНОГО листенера НЕ ЧИТАЕТ:
      # при выданном, смонтированном и названном в конфигурации сертификате
      # рукопожатие отвечало ошибкой уровня протокола, а собственная строка
      # провайдера при старте сообщала, что он поднял ПРОСТОЙ http-сервер на
      # административном порту. Ручка общая, не полистенная.
      #
      # Это ИЗМЕРЕНО (координата и процедура перемера —
      # deploy/PROVIDER-LISTENER-PREMISE.md), а не выведено из документации: до
      # этого здесь подряд стояли два взаимоисключающих объяснения, и оба были
      # неверны — второе ещё и укоряло первое за непроверенное утверждение.
      #
      # Поэтому TLS терминирует СОСЕД в этом же поде, а листенер провайдера
      # уезжает на петлю (см. serve.admin ниже и deployment.extraContainers).
      serve:
        # WITHOUT `--dev` the provider refuses to serve a listener that has neither TLS
        # nor a declared trusted terminator. The ADMIN listener has its own certificate
        # (below). The PUBLIC OIDC listener is deliberately left in the clear on this
        # stand — the ingress, the JWKS mirror and the token endpoint all reach it over
        # plain http — so it is declared as terminated by a trusted peer instead: pod
        # CIDR, service CIDR, the kind node subnet (kubectl port-forward arrives from the
        # node) and loopback. Documented narrowing for this stand, not a blanket exemption.
        #
        # ONE `serve:` KEY. This block and the trusted-terminator list must stay merged:
        # a second `serve:` mapping in the same parent is a duplicate YAML key, the later
        # one silently wins, and the first one vanishes without a word from helm.
        tls:
          allow_termination_from:
            - 10.244.0.0/16
            - 10.96.0.0/12
            - 172.18.0.0/16
            # ПЕТЛЯ — ИСТОЧНИК ПЛЕЙНТЕКСТА ПОСЛЕ УВОДА ЛИСТЕНЕРА.
            # Административный листенер слушает 127.0.0.1, и плейнтекст ему
            # приносит СОСЕД ПО ПЕТЛЕ. Без этой записи провайдер боевого класса
            # (без отладочного флага) отверг бы его как нетерминированный.
            - 127.0.0.1/32
        admin:
          # ЛИСТЕНЕР СЛУШАЕТ ТОЛЬКО ПЕТЛЮ. Открытого участка между подами больше
          # нет КАК ОБЪЕКТА: он не покидает пода. Это свойство по построению, а
          # не следствие политики, которую надо выдать и поддерживать.
          host: "127.0.0.1"
          # ПОРТ УСТУПЛЕН СОСЕДУ. Единственная политика, называющая под
          # провайдера, разрешает трафик к нему только на 4444/4445 и матчит
          # ПОРТ ПОДА, поэтому инверсия оставляет переход внутри её объёма без
          # расширения списка.
          #
          # НАЗЫВАТЬ ЭТО ОГРАНИЧЕНИЕ ДЕЙСТВУЮЩИМ НЕЛЬЗЯ, и прежняя редакция
          # называла: политика выбирает поды по метке сайдкара, которую не
          # эмитит ни один профиль (измерено рендером), а этот стенд политик не
          # рендерит вовсе. Решение остаётся — верное и бесплатное, — но
          # обоснование у него forward-looking, а не «сегодня запрещено».
          # Счёт выбранных подов печатает admin-hop-port-policy-test.sh
          # отдельной строкой открытого долга.
          port: 4455
  service:
    admin:
      # Service провайдера СНЯТ. После увода на петлю он целился бы в порт,
      # который снаружи пода не отвечает: выглядел бы рабочим адресом и однажды
      # получил бы потребителя — с тихим истечением срока вместо внятного
      # отказа. Снятый, он даёт отказ РАЗРЕШЕНИЯ ИМЕНИ: забытый потребитель
      # падает громко и сразу. Потребители адресуют Service терминатора
      # (templates/hydra-admin-tls-service.yaml).
      enabled: false
  deployment:
    # ПРОБЫ ИДУТ ЧЕРЕЗ СОСЕДА К ЭНДПОИНТУ ЗДОРОВЬЯ ПРОВАЙДЕРА.
    #
    # Умолчание чарта — httpGet на порт административного листенера с заголовком
    # `Host: 127.0.0.1`; исполняет их kubelet ПО АДРЕСУ ПОДА, а заголовок петлёй
    # запрос не делает. После увода на петлю такое обращение невозможно by
    # construction, и пробы, оставленные как есть, роняли бы под навсегда.
    #
    # ГОТОВНОСТЬ ЗАКРЫТА В ОБЕ СТОРОНЫ. Порт — СОСЕДА (значит мёртвый сосед ⇒
    # соединение не установится ⇒ под не Ready — цена со-размещения, сделанная
    # наблюдаемой), а ПУТЬ — здоровья ПРОВАЙДЕРА, который сосед проксирует на
    # петлю (значит повисший провайдер ⇒ апстрим не ответит ⇒ под не Ready).
    # Статического пути здоровья у соседа нет намеренно, и это ИСПОЛНЯЕТСЯ:
    # deploy/tests/helm/admin-hop-pod-shape-test.sh краснеет на любом ответе
    # соседа, не зависящем от апстрима, а живой гейт — на прочерке в полях
    # апстрима его журнала. Прежде это свойство держалось на комментарии.
    #
    # Под провайдера несёт ОБА листенера, поэтому неготовность снимает конечные
    # точки И административного перехода, И публичного OIDC — при том что
    # публичному (ключи проверки подписи, токен-эндпоинт) состояние базы для
    # ответа не требуется.
    # ГОТОВНОСТЬ ЧИТАЕТ /health/alive, А ЗАПУСК — /health/ready. Прежняя редакция
    # называла отступление наоборот («готовность читает /health/ready, а не
    # /health/alive») — и втягивала в путь готовности ХРАНИЛИЩЕ, которого
    # инварианту перехода не требуется: достаточно, чтобы отвечали оба процесса
    # пода. Падение базы снимало конечные точки перехода целиком, и потребитель
    # получал отказ разрешения адреса вместо честного отказа провайдера. Запуск
    # по-прежнему ждёт /health/ready: до миграций трафик принимать нечего.
    customReadinessProbe:
      httpGet:
        path: /health/alive
        port: 4445
        scheme: HTTPS
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    customStartupProbe:
      httpGet:
        path: /health/ready
        port: 4445
        scheme: HTTPS
      failureThreshold: 30
      periodSeconds: 2
      timeoutSeconds: 5
    # ПРОБА ЖИВОСТИ ПРОВАЙДЕРА — ПО ЕГО СОБСТВЕННОМУ ПУБЛИЧНОМУ ЛИСТЕНЕРУ, а не
    # через соседа: иначе сломанный СОСЕД перезапускал бы ПРОВАЙДЕРА. Зависший
    # процесс без неё не перезапускается вовсе, и под остаётся неготовым
    # бессрочно, унося конечные точки обоих сервисов. Публичный листенер отдаёт
    # /health/alive — ИЗМЕРЕНО на oryd/hydra:v26.2.0, не выведено из документации.
    customLivenessProbe:
      httpGet:
        path: /health/alive
        port: 4444
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    # ОКНО НА ОСТАНОВКУ — у ОБОИХ контейнеров (второй хук в спецификации соседа).
    # Снятие конечных точек идёт асинхронно с сигналом остановки: без паузы на
    # хвосте КАЖДОГО переката запросы ещё приезжают в умирающий под, а проверка
    # отзыва токена классифицирует такой отказ как временный — то есть тихо не
    # исполняется. `/bin/sleep` в образе провайдера ЕСТЬ — проверено запуском.
    lifecycle:
      preStop:
        exec:
          command: ["/bin/sleep", "5"]
    extraVolumes:
      - name: hydra-admin-tls
        secret:
          secretName: kacho-umbrella-hydra-admin-tls
      - name: hydra-admin-tls-conf
        configMap:
          name: kacho-umbrella-hydra-admin-tls-nginx
      # Корневая файловая система соседа только для чтения, а nginx пишет
      # pid-файл и временные тела запросов. Два emptyDir — вся его запись.
      - name: hydra-admin-tls-run
        emptyDir: {}
      - name: hydra-admin-tls-cache
        emptyDir: {}
    # МОНТИРОВАНИЯ СЕКРЕТА В КОНТЕЙНЕР ПРОВАЙДЕРА БОЛЬШЕ НЕТ. Ручка, которую он
    # не читает, снята вместе с материалом под неё: держать неработающую ручку
    # рядом с обходным путём, который существует ИМЕННО ПОТОМУ, что она не
    # работает, — гарантия того, что следующий снимет терминатор, поверив ей.
    # Секрет монтируется СОСЕДУ (ниже).
    # СОСЕД-ТЕРМИНАТОР. Спецификация и его конфигурация живут в ОДНОМ месте —
    # templates/_hydra-admin-tls.tpl, — потому что спецификация обязана нести
    # ОТПЕЧАТОК конфигурации: аннотацию шаблона пода через значения этого чарта
    # добавить нечем (через шаблонизацию у него проходит ТОЛЬКО этот список), а
    # без привязки правка настроек даёт новый объект настроек и побайтово тот же
    # шаблон пода — переката нет, живой nginx остаётся со старой конфигурацией.
    #
    # Прежде спецификация была выписана здесь литералом и ВТОРОЙ РАЗ в соседнем
    # профиле — байт в байт. Два экземпляра расходятся; один экземпляр не может.
    extraContainers: |
      {{ include "kacho.hydraAdminTls.sidecar" . }}
    extraEnv:
      - name: OAUTH2_TOKEN_HOOK_AUTH_CONFIG_VALUE
        valueFrom:
          secretKeyRef:
            name: kaname-hook-token
            key: token
      - name: OAUTH2_REFRESH_TOKEN_HOOK_AUTH_CONFIG_VALUE
        valueFrom:
          secretKeyRef:
            name: kaname-hook-token
            key: token

# ─── Kratos self-service UI — provider ADMIN hop over TLS ───────────────────
# dev declares the plaintext admin address; on this stand the hop is fronted by a
# TLS TERMINATOR in the provider's pod, so the consent flow must address the
# terminator over https and trust the internal CA that signed it. Left at dev's
# value the flow does not degrade, it stops: the provider's own admin Service is
# removed, so that address no longer resolves.
kratos-selfservice-ui:
  kratosSelfServiceUI:
    # ADDRESS THE TERMINATOR, NOT THE PROVIDER. The admin hop is fronted by a
    # TLS terminator in the provider's own pod (mtls.hydraAdminTls), so this
    # consumer must address THAT over https and trust the internal CA that
    # signed it — the chart mounts the bundle and exports NODE_EXTRA_CA_CERTS.
    #
    # Left at the chart's plaintext default this flow does not degrade, it stops:
    # the provider's own admin Service is REMOVED, so the old address does not
    # resolve at all. That is deliberate — a consumer left behind must fail
    # loudly on name resolution rather than time out against something that
    # looks like a working address.
    hydraAdminUrl: https://kacho-umbrella-hydra-admin-tls:4445
    caCert:
      secretName: kacho-umbrella-hydra-admin-tls
      key: ca.crt
      mountPath: /etc/kratos-ui-ca

