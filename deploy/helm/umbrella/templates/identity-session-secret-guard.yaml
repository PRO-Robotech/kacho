{{/*
Copyright (c) PRO-Robotech
SPDX-License-Identifier: BUSL-1.1

СТРАЖ КЛЮЧА, ОТ КОТОРОГО ЗАВИСИТ УЖЕ ВЫДАННОЕ — отказ наступает при ОБНОВЛЕНИИ,
до того как оно обесценит действующие сессии арендаторов (задачи #1751, #2732).

ПРЕДМЕТ — КЛЮЧ, А НЕ ЧАРТ, И ОТКРЫВАЕТСЯ СТРАЖ ПО ПОСАДКЕ ЛИЧНОСТИ.

Прежде страж открывался условием `.Values.kratos.enabled` — то есть
включённостью ЧУЖОГО подчарта. Замер на дереве до правки (helm v4.2.4, стенд
`own` из stacks.txt, `--is-upgrade`, `kratos.enabled=false`, пустая координата
нашей ключницы): код 0, ни одного слова. Страж не падал — он ЗАМОЛКАЛ, и
замолкал целиком, от одного флага чужой службы. Самая дорогая проверка маршрута
исчезала бы беззвучно ровно в тот шаг, которым чужую службу снимают.

Признак, по которому он открывается теперь, производим МЫ: посадка личности
`kaname.config.authn.identityProvider` (`own` | `external`). Умолчания у неё нет
ни у процесса, ни у чарта — профиль, посадку не объявивший, получает отказ с
именем поля, — поэтому потерять её молча, как чужой `*.enabled`, нельзя: она не
исчезает вместе с подчартом.

ПОСАДКА РЕШАЕТ, ЧЕЙ КЛЮЧ ПОДПИСЫВАЕТ, И СТРАЖ СУДИТ ИМЕННО ЕГО.

── ПОСАДКА `own`: КЛЮЧ НАШ ────────────────────────────────────────────────────

Под `own` удостоверения чеканит платформа сама: приватные половины подписных
ключей ключницы лежат в базе ОБЁРНУТЫМИ, и разворачивает их ключ обёртки из
секрета, чья КООРДИНАТА объявлена профилем. Координата — пара «имя объекта +
ключ в нём»: из половины ссылка на секрет не собирается вовсе.

Что стоит потеря каждой пары — сказано РАЗДЕЛЬНО, а не одной фразой; страж, чей
текст шире предмета, перестают читать, а следом перестают читать и верную его
половину:

  · `platform.iam.jwks.encKey*` — ключ обёртки приватных половин ключницы.
    Развернуть уже лежащее в базе нечем: ни одно выданное удостоверение больше
    не проверяется, и ВСЕ действующие сессии арендаторов перестают быть
    действительными после этой выкатки;
  · `platform.iam.secondFactor.encKey*` — ключ обёртки секретов второго фактора
    (по одному на человека). Сессии от него не зависят; перестают открываться
    ЗАВЕДЁННЫЕ вторые факторы, и человек, у которого он заведён, полосу входа
    не проходит.

Обе пары читаются процессом ТОЛЬКО под `own` (страж старта службы, `Lanes: own`),
поэтому под `external` здесь не спрашиваются: требовать того, чем не
пользуются, значит отказывать без предмета.

── ПОСАДКА `external`: КЛЮЧ ПОСТАВЩИКА ────────────────────────────────────────

Чарт поставщика чеканит секрет подписи печенья и шифрования САМ, когда величины
не объявлены: `secretsCookie`/`secretsCipher` получают `randAlphaNum 32`, то есть
вычисляются НА КАЖДОМ РЕНДЕРЕ. Измерено, а не выведено (kratos-0.62.1, три
рендера подряд одного дерева на боевом профиле): три разных величины. На
объявившем профиле те же три рендера дают одну.

Сам по себе перечеканенный рендер был бы безобиден — величина уехала бы в тот же
секрет и осталась прежней, если бы секрет не пересоздавался. Он пересоздаётся:
секрет несёт `helm.sh/hook: pre-install, pre-upgrade` вместе с
`helm.sh/hook-delete-policy: before-hook-creation`, поэтому каждое обновление
СНАЧАЛА удаляет его, потом создаёт заново — уже с новой величиной.

Соседняя аннотация `helm.sh/resource-policy: keep` от этого НЕ спасает, и
полагаться на неё нельзя: у hook-ресурсов helm её не читает вовсе
(`deleteHookByPolicy` зовёт удаление безусловно, а сам `KeepPolicy` объявлен
относящимся к удалению релиза). Комментарий поставщика рядом с аннотациями
утверждает обратное — это его утверждение, не наше, и оно неверно для helm v3.

Следствие для арендатора зависит от того, КАКАЯ из трёх величин не объявлена:

  · `cookie`/`cipher` — ключ подписи печенья и шифрования. Перечеканка означает,
    что ВСЕ действующие сессии перестают быть действительными: вход надо
    проходить заново после каждой выкатки;
  · `default` — документированный ЗАПАСНОЙ ключ для двух остальных. Пока те
    объявлены, подпись сессии от него не зависит; перечеканивается величина,
    перечень читателей которой никем не установлен.

Наблюдаемо это только тем, у кого сессия была; со стороны стенда всё выглядит
исправным.

ЧТО СЧИТАЕТСЯ ОБЪЯВЛЕННЫМ ИСТОЧНИКОМ ПОД `external` — ДВЕ ФОРМЫ, ОБЕ ЗАКОННЫ.

  1. ВЕЛИЧИНЫ ОБЪЯВЛЕНЫ: `kratos.kratos.config.secrets.default`, `.cookie` и
     `.cipher` — непустые списки непустых строк. Величина СЕКРЕТНАЯ, поэтому в
     git её нет и быть не должно: её объявляет слой учётных данных площадки,
     который скрипт раскатки добавляет поверх цепочки профилей (см.
     deploy/stacks.txt). Профиль стенда объявляет свои величины прямо — они не
     секрет ни для кого.

     ТРИ, А НЕ ДВЕ — и это решение, а не осторожность впрок. `default` объявлен
     самим чартом как обязательный (`required "Value … can not be empty!"`) и
     служит документированным ЗАПАСНЫМ ключом для двух остальных. Оставить его
     необъявленным значило бы: две величины переживают обновление, третья
     перечеканивается на каждом рендере, и перечень того, что от неё зависит,
     никем не установлен.

  2. СЕКРЕТ ЗАВЕДЁН ВНЕ HELM: `kratos.secret.enabled: false` вместе с непустым
     `kratos.secret.nameOverride`. Тогда чарт не чеканит ничего, секретом владеет
     оператор, и величина переживает обновление BY CONSTRUCTION. Цена этой формы
     названа честно: секрет обязан нести и `dsn` — чарт поставщика перенаправляет
     на него ВСЕ ключи, а не только величины сессии.

ПОСТАВЩИКА НЕТ В ДЕРЕВЕ ВОВСЕ — ТРЕТЬЕ СОСТОЯНИЕ, И ОНО ЗАКОННО. Под `external`
профиль вправе указывать на поставщика, которого зонт не несёт (`.Values.kratos`
отсутствует как ветвь значений). Тогда ни один наш шаблон ключа не чеканит и
пересоздавать нечего: величина переживает обновление by construction — ровно как
в форме 2. Это НЕ прежнее молчание по флагу: флаг `enabled` выключает рендер, не
трогая предмета, а отсутствие ветви значений означает отсутствие САМОГО
предмета.

ПОЧЕМУ ОТКАЗ ИМЕННО НА ОБНОВЛЕНИИ, А НЕ ВСЕГДА.

На ПЕРВОЙ установке терять нечего: выданных удостоверений и сессий ещё нет, и
чеканка случайной величины — законное и единственно возможное поведение
(объявить величину в git нельзя, это секрет). Ронять здесь установку значило бы
требовать от оператора величину до того, как у неё появился предмет.

Отказ на обновлении ловит ровно тот момент, когда цена появляется, и ловит его
ДО того, как она заплачена. Ровно поэтому страж читает `.Release.IsUpgrade`:
`helm template` и `helm install` его не взводят, значит ни один рендер дерева
(проверки посадки, `helm template` целей развёртывания) этим стражем не
затрагивается — а `helm upgrade` и `helm upgrade --dry-run` затрагиваются оба.

Ссылка `${…}` координатой быть не может по той же причине, что у соседа-стража
обратного вызова: подстановки в значениях ни helm, ни служба не делают, и строка
уехала бы в имя секрета дословно.

ЧЕГО СТРАЖ НЕ УТВЕРЖДАЕТ (граница названа, чтобы её не приняли шире):
  · что величина СТОЙКАЯ — длину и энтропию он не судит; это вопрос того, кто её
    заводит, и судить её здесь значило бы читать секрет в шаблоне;
  · что объект Secret существует в кластере и непуст — это рантайм;
  · ничего о НОСИТЕЛЕ нашей сессии: под `own` он не подписан ключом вовсе —
    это непрозрачное случайное значение, чей дайджест лежит в базе
    (kaname, internal/domain/human_session.go), поэтому обновление он переживает
    by construction. Предмет здесь — ключи, от которых зависит УЖЕ ВЫДАННОЕ;
  · ничего о первой установке — там предмета нет, и это сказано выше;
  · ничего о величинах Hydra: у неё свой владелец и своя поверхность.

Объект не производится: страж существует ради своих отказов.
*/}}
{{- if .Release.IsUpgrade }}
{{- $posture := ((((.Values.kaname).config).authn).identityProvider) | default "" }}
{{- if eq $posture "own" }}
{{/* НАША КЛЮЧНИЦА И НАШ ВТОРОЙ ФАКТОР. Пара координат на каждый предмет, своя
     цена у каждого предмета — обобщать их в одну фразу нельзя. */}}
{{- $iam := ((.Values.kaname).platform).iam | default dict }}
{{- $subjects := list
      (dict "path" "jwks" "holder" (get $iam "jwks")
            "what" "ключ обёртки приватных половин подписных ключей НАШЕЙ ключницы"
            "cost" "развернуть уже лежащее в базе будет нечем: ни одно выданное удостоверение не проверится, и ВСЕ действующие сессии арендаторов перестанут быть действительными после этой выкатки")
      (dict "path" "secondFactor" "holder" (get $iam "secondFactor")
            "what" "ключ обёртки секретов второго фактора"
            "cost" "заведённые вторые факторы перестанут открываться, и человек, у которого он заведён, не пройдёт полосу входа") }}
{{- range $s := $subjects }}
{{- $holder := ($s.holder) | default dict }}
{{- range $field := (list "encKeySecretName" "encKeySecretKey") }}
{{- $v := trim (toString ((get $holder $field) | default "")) }}
{{- if contains "${" $v }}
{{- fail (printf "kacho-umbrella: обновление ОТКЛОНЕНО — kaname.platform.iam.%s.%s несёт ссылку %q, а подстановки в значениях не делает ни helm, ни служба: строка уехала бы в имя объекта Secret дословно, ссылка не разрешилась бы, и %s до процесса не доехал бы. Объяви координату значением (задача #2732)" $s.path $field $v $s.what) }}
{{- end }}
{{- if eq $v "" }}
{{- fail (printf "kacho-umbrella: обновление ОТКЛОНЕНО — посадка личности `own`, а kaname.platform.iam.%s.%s НЕ объявлена. Это %s; координата — ПАРА «имя объекта + ключ в нём», и из половины ссылка на секрет не собирается вовсе. Цена: %s. Объяви обе половины координаты в профиле стенда (величина живёт в объекте Secret кластера — в git ей не место). Первая установка этим стражем не затрагивается: там выданного ещё нет (задачи #1751, #2732)" $s.path $field $s.what $s.cost) }}
{{- end }}
{{- end }}
{{- end }}
{{- else if eq $posture "external" }}
{{- if .Values.kratos }}
{{- $secret := (.Values.kratos.secret) | default dict }}
{{- $ownedOutside := and (kindIs "bool" (get $secret "enabled")) (not (get $secret "enabled")) (get $secret "nameOverride") }}
{{- if not $ownedOutside }}
{{- $declared := (((.Values.kratos.kratos).config).secrets) | default dict }}
{{- range $key := (list "default" "cookie" "cipher") }}
{{- $vals := get $declared $key }}
{{- $filled := false }}
{{- range $v := ($vals | default list) }}
{{- if and (kindIs "string" $v) (ne (trim $v) "") }}
{{- if contains "${" $v }}
{{- fail (printf "kacho-umbrella: kratos.kratos.config.secrets.%s несёт ссылку %q, а служба личности подстановки в значениях настроек НЕ делает — строка уехала бы в ключ подписи печенья дословно, и сессии подписывались бы этой строкой. Объяви величину значением в слое учётных данных площадки (задача #1751)" $key $v) }}
{{- end }}
{{- $filled = true }}
{{- end }}
{{- end }}
{{- if not $filled }}
{{- $cost := "документированный ЗАПАСНОЙ ключ для cookie и cipher: он перечеканится, а перечень того, что от него зависит, никем не установлен" }}
{{- if ne $key "default" }}{{ $cost = "ключ подписи печенья и шифрования: он перечеканится, и ВСЕ действующие сессии арендаторов перестанут быть действительными после этой выкатки" }}{{ end }}
{{- fail (printf "kacho-umbrella: обновление ОТКЛОНЕНО — посадка личности `external`, а kratos.kratos.config.secrets.%s не объявлена, поэтому чарт поставщика чеканит её заново на КАЖДОМ рендере (randAlphaNum 32), а свой секрет пересоздаёт каждым обновлением (hook pre-upgrade + before-hook-creation; аннотация helm.sh/resource-policy=keep от этого не спасает — у hook-ресурсов helm её не читает). Что именно эта величина: %s. Исходов ДВА: (1) объявить kratos.kratos.config.secrets.default, .cookie и .cipher в слое учётных данных площадки (в git величине не место — это секрет); (2) завести секрет вне helm: kratos.secret.enabled=false плюс kratos.secret.nameOverride=<имя>, и тогда секрет обязан нести также ключ dsn. Первая установка этим стражем не затрагивается: там сессий ещё нет (задачи #1751, #2732)" $key $cost) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- else }}
{{- fail (printf "kacho-umbrella: обновление ОТКЛОНЕНО — посадка личности не объявлена либо неизвестна (kaname.config.authn.identityProvider = %q; ожидается `own` либо `external`). Посадка решает, ЧЕЙ ключ подписывает уже выданное, а значит и что обязано пережить это обновление: судить ключ, не зная посадки, страж не вправе. Объяви посадку ОБЕИМ половинам стенда — kaname.config.authn.identityProvider и api-gateway.authn.identityProvider (задача #2732)" $posture) }}
{{- end }}
{{- end }}
