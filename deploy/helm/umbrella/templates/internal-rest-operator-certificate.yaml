{{- /*
  ─── internal REST operator client identity (kacho#3131) ───

  A different door from the mint identity (templates/bootstrap-operator-
  certificate.yaml), hence a separate file: the api-gateway's
  internal REST listener (Internal* REST, `internal-rest` Service port) is
  mutual-TLS only and admits a client leaf of the installation CA whose URI-SAN
  is in its circle (KACHO_API_GATEWAY_INTERNAL_REST_CLIENT_SANS, rendered by the
  api-gateway chart from `api-gateway.internalRest.operatorSaName`). This leaf is
  that circle's operator: operator tooling (deploy/scripts, tests/authz-fixtures,
  newman) reads it out of the cluster exactly like the mint identity —
  nothing mounts it.

  Separate from the mint identity on purpose: holding the internal REST operator
  leaf must not be a licence to mint cluster-admin, and vice versa — the two SANs
  differ. mTLS here authenticates the TRANSPORT only: the leaf is no principal,
  and authorization on the listener is unchanged.

  Rendered whenever the internal-CA PKI is up (mtls.enabled) — the api-gateway
  chart declares its internal listener under the same condition.

  ИМЯ ЛИСТА — ОДНО НАПИСАНИЕ С КРУГОМ КРАЯ (kacho#3151). URI-имя берётся тем же
  помощником, которым чарт края строит свой круг
  (`api-gateway.internalRestOperatorSAN`), над значениями чарта края: домен
  доверия, ЗАКРЕПЛЁННОЕ пространство личности (`api-gateway.mtls.spiffe.namespace`)
  и имя учётки (`api-gateway.internalRest.operatorSaName`). Прежняя редакция
  брала пространство из пространства релиза, и в любом пространстве, кроме
  рабочего, край отвергал лист оператора, а рендер и установка были зелёными.
  Совпадение держат gateway/deploy/internal_rest_mtls_render_test.go (рендер в
  рабочее пространство) и tools/standns (рендер каждой цепочки в тестовое
  пространство и перенос стенда проб, отказывающий на расхождении).
*/ -}}
{{- $mtls2 := .Values.mtls | default dict -}}
{{- if $mtls2.enabled -}}
{{- $ca2 := $mtls2.internalCA | default dict -}}
{{- $edge := dict "Values" (index .Values "api-gateway") "Release" .Release -}}
{{- $irSa := dig "internalRest" "operatorSaName" "kacho-internal-rest-operator" (index .Values "api-gateway") -}}
{{- $irSecret := "kacho-internal-rest-operator-client-tls" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $irSecret | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    kacho.cloud/component: cert-manager-internal-ca
    app.kubernetes.io/name: {{ $irSa | quote }}
    app.kubernetes.io/managed-by: helm
spec:
  secretName: {{ $irSecret | quote }}
  duration: "2160h"
  renewBefore: "720h"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ $ca2.clusterIssuerName | default "kacho-internal-ca" | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
  uris:
    - {{ include "api-gateway.internalRestOperatorSAN" $edge | quote }}
  usages:
    - client auth        # client-only — this identity never terminates a listener
{{- end }}
