обращении к службе прав (задача #948).

ЧТО ЗАПРЕЩАЕТ И ПОЧЕМУ ИМЕННО ЭТО.

Провайдер (Ory Hydra) читает конфигурацию файлом и НЕ выполняет подстановку
`${ИМЯ}` в её значениях. Измерено, а не выведено: на oryd/hydra:v26.2.0 ссылка,
поставленная значением `urls.self.issuer` при ЗАВЕДЁННОЙ в поде переменной с тем
же именем, дожила до проверки схемы дословно. То же измерено на
oryd/kratos:v26.2.0 — ссылка вернулась в адресе действия потока.

Отсюда два запрета, и оба нужны:

  1. величиной учётных данных не может стоять ссылка `${…}` — она уедет в
     заголовок как есть, служба прав ответит `401`, край переведёт это
     арендатору в `502`;

  2. объявив полосу обратного вызова, профиль ОБЯЗАН объявить и источник её
     величины — переменную по ПУТИ КЛЮЧА конфигурации, которая файл перекрывает.
     Без неё величина пуста, и полоса отвергается ровно так же, только тише.

ПОЧЕМУ СТРАЖ, А НЕ КОММЕНТАРИЙ. Оба запрета уже были записаны прозой — в
values.dev-prod.yaml, дословно и верно. Профиль values.dev.yaml при этом нёс
ссылку без источника, поднимался первой фазой `make dev-up` и ждал готовности в
этом состоянии. Проза не роняет ничего; отказ рендера роняет.

ЧЕГО СТРАЖ НЕ УТВЕРЖДАЕТ (граница названа, чтобы её не приняли шире):
  · что секрет существует и непуст — это рантайм; выполнимость обязательной
    ссылки держит deploy/tests/helm/prerequisite-secrets-test.sh;
  · что величина у отправителя и у проверяющей стороны ОДНА И ТА ЖЕ — обе
    ссылки ведут на один секрет, и это утверждает гейт
    deploy/identity_callback_credential_source_test.go;
  · ничего о конфигурации службы личности (Kratos): её ссылки живут в карте
    настроек kaname-kratos-config, а страж читает значения провайдера
    токенов. Ту карту МОНТИРУЮТ И ЧИТАЮТ — здесь стояло обратное, и это было
    ложью о посадке: профиль объявляет том, монтирует его контейнеру
    подстановки и направляет процесс доводом --config на отрендеренный файл.
    МОНТИРУЮЩИХ ПРОФИЛЕЙ: 2. Число здесь не выписано на память — его сверяет
    с деревом deploy/identity_config_mount_census_test.go, и профиль, начавший
    или переставший монтировать карту, роняет прогон вместе с этой строкой.
    Ссылки самой карты судит deploy/tests/helm/identity-hook-credential-source-test.sh,
    читающий ОТРЕНДЕРЕННЫЕ поды, а не значения.

Объект не производится: страж существует ради своих отказов.
*/}}
{{- if .Values.hydra }}
{{- if .Values.hydra.enabled }}
{{- $cfg := (((.Values.hydra).hydra).config) | default dict }}
{{- $oauth2 := (get $cfg "oauth2") | default dict }}
{{- $env := ((((.Values.hydra).deployment).extraEnv)) | default list }}
{{- $declared := list }}
{{- range $e := $env }}{{ $declared = append $declared $e.name }}{{ end }}
{{- $lanes := dict "token_hook" "OAUTH2_TOKEN_HOOK_AUTH_CONFIG_VALUE" "refresh_token_hook" "OAUTH2_REFRESH_TOKEN_HOOK_AUTH_CONFIG_VALUE" }}
{{- range $lane, $envName := $lanes }}
{{- $hook := (get $oauth2 $lane) }}
{{- if $hook }}
{{- $value := ((($hook.auth).config).value) }}
{{- if and $value (contains "${" (toString $value)) }}
{{- fail (printf "kacho-umbrella: oauth2.%s.auth.config.value несёт ссылку %q, а провайдер подстановки в значениях конфигурации НЕ делает — строка уехала бы в заголовок дословно и служба прав ответила бы 401. Оставь величину пустой в файле и объяви переменную %s в hydra.deployment.extraEnv (задача #948)" $lane (toString $value) $envName) }}
{{- end }}
{{- if not (has $envName $declared) }}
{{- fail (printf "kacho-umbrella: профиль объявляет полосу обратного вызова oauth2.%s, но НЕ объявляет источник её величины — переменной %s нет в hydra.deployment.extraEnv. Без неё величина пуста, служба прав отвечает 401, край переводит это арендатору в 502 (задача #948)" $lane $envName) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
