{{- if .Values.security.txt.enabled }}
{{- /*
security.txt per RFC 9116. This object carries the TEXT of the file; nothing in
this chart serves it at /.well-known/security.txt yet (no route or volume reads
this ConfigMap), so the claim of being served is not made here.

Expires and the publication date are DECLARED values (security.txt.expires,
security.txt.published), never the moment of rendering (kacho#2876): a file whose
Expires has passed is stale per RFC 9116 §2.5.5, and a clock-dependent render
diffs on every upgrade with unchanged input. Both must be UTC in RFC 3339 form
(YYYY-MM-DDTHH:MM:SSZ) and Expires must be later than the publication date;
that Expires is no further than one year from publication and does not fall
within the renewal margin is judged by deploy/security_txt_expires_test.go.
*/}}
{{- $utc := "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$" }}
{{- $expires := .Values.security.txt.expires | default "" | toString }}
{{- $published := .Values.security.txt.published | default "" | toString }}
{{- if not (regexMatch $utc $expires) }}
{{- fail (printf "security.txt.expires=%q: объявленное истечение security.txt обязано быть UTC в форме RFC 3339 (YYYY-MM-DDTHH:MM:SSZ), а не моментом рендера" $expires) }}
{{- end }}
{{- if not (regexMatch $utc $published) }}
{{- fail (printf "security.txt.published=%q: объявленная дата выпуска security.txt обязана быть UTC в форме RFC 3339 (YYYY-MM-DDTHH:MM:SSZ)" $published) }}
{{- end }}
{{- if not (lt $published $expires) }}
{{- fail (printf "security.txt.expires=%s не позже security.txt.published=%s: файл истёк бы в момент выпуска" $expires $published) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kacho-security-txt
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: security-txt
    app.kubernetes.io/managed-by: helm
    kacho.cloud/component: security-disclosure
  annotations:
    kacho.cloud/source: "rfc-9116"
    kacho.cloud/security-txt-published: {{ $published | quote }}
data:
  security.txt: |
    # Kachō Cloud — Security Disclosure
    # https://www.rfc-editor.org/rfc/rfc9116
    #
    # Source: deploy/helm/umbrella/templates/security-txt-configmap.yaml

    Contact: mailto:{{ .Values.security.contactEmail }}
    {{- range .Values.security.altContacts }}
    Contact: {{ . }}
    {{- end }}

    # Declared value, no later than one year from the publication date.
    Expires: {{ $expires }}

    Encryption: {{ .Values.security.pgpKeyUrl }}

    # Where to send acknowledgments of disclosed vulnerabilities.
    Acknowledgments: {{ .Values.security.acknowledgmentsUrl }}

    # Public policy / safe-harbor terms.
    Policy: {{ .Values.security.policyUrl }}

    # Hiring page for security researchers / engineers.
    Hiring: {{ .Values.security.hiringUrl }}

    # Preferred language for security communications.
    Preferred-Languages: en, ru

    # Canonical URLs for this file.
    Canonical: https://{{ .Values.kacho.domain }}/.well-known/security.txt
    {{- range .Values.security.alternateCanonical }}
    Canonical: {{ . }}
    {{- end }}
{{- end }}