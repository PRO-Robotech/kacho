{{/*
Copyright (c) PRO-Robotech
SPDX-License-Identifier: BUSL-1.1

СТРАЖ АНОНИМНОГО СУБЪЕКТА ПЛОСКОСТИ ДАННЫХ — выдающая сторона без узнающей не
включается (kacho#3274, приёмка REG-PUB-1 ред. 13: Р9 п. 2, 5; сценарий 53 (г)).

Общее значение `global.kacho.registry.anonymousSubjectId` читают две стороны:
служба доступа чеканит его в `sub` анонимного токена, реестр по нему узнаёт
анонима и спрашивает модель от имени класса `system_class:anonymous`. Подчарт
реестра выключается условием `registry.enabled` (Chart.yaml зонта), а подчарт
службы доступа — нет. Задано общее значение при выключенном реестре — служба
доступа выдавала бы анонимный токен вызывающему без удостоверения, и узнавать
его было бы некому: включённая наполовину полоса, которой оператор не выбирал.
Исход один — отказ рендера, называющий обе величины.

Отказ — только при ЯВНО выключенном реестре. Ключа `registry.enabled` нет вовсе —
условие Chart.yaml не разрешается, и helm подчарт оставляет включённым; страж
тогда молчит, как молчит и подстановка подчарта. Пустое общее значение при
выключенном реестре законно: поток выключен на обеих сторонах.

Держит tests/helm/registry-anonymous-subject-test.sh (отказ и близнецы).
*/}}
{{- $subject := (((.Values.global).kacho).registry).anonymousSubjectId | default "" -}}
{{- $registry := .Values.registry | default dict -}}
{{- if and $subject (hasKey $registry "enabled") (eq (toString (index $registry "enabled")) "false") -}}
{{- fail (printf "kacho-umbrella: global.kacho.registry.anonymousSubjectId=%q задан при выключенном реестре (registry.enabled=false). Анонимный субъект читают две стороны: служба доступа чеканит его в sub анонимного токена, реестр по нему узнаёт анонима. Без реестра служба доступа выдавала бы анонимный токен, который некому узнать. Включите реестр (registry.enabled=true) либо снимите значение (global.kacho.registry.anonymousSubjectId пусто — анонимный поток выключен на обеих сторонах)." $subject) -}}
{{- end -}}
