{{- /*
  Serving certificate for the identity provider's ADMIN listener (:4445), issued
  by the SEC-F internal-CA ClusterIssuer.

  WHY THIS EXISTS. The admin listener carries, on every authenticated request
  that misses the introspection cache, the CALLER'S LIVE BEARER — introspection
  asks about a token by sending it. It also carries the administrative bearer on
  every OAuth2 client registration, trust grant and session teardown iam makes. In
  the clear, all of that is readable by anything on the path, and the admin API it
  opens authenticates nobody: reaching it IS the authorization.

  ⚠ MEASURED FALSE 2026-07-30 — THE PROVIDER DOES NOT READ `serve.admin.tls`.
  What stood here: "the provider resolves TLS PER LISTENER — the runtime reads
  `serve.admin.tls.*` and `serve.public.tls.*`, each overriding the shared
  `serve.tls` field by field", and it declared a previous note in
  deploy/tests/helm/admin-hop-transport-test.sh (one shared block, therefore the
  admin listener cannot be TLS'd alone) to be "wrong".

  The previous note was RIGHT. Measured on kind, provider v26.2.0, with this
  certificate issued and Ready, the secret mounted, `serve.admin.tls.cert/key`
  present in the live config and the pod's `checksum/hydra-config` matching:
    * `openssl s_client` to the admin ClusterIP:4445 → `wrong version number`
      (i.e. it answered plaintext to a TLS handshake);
    * the provider's OWN startup line: `Setting up http server on 0.0.0.0:4445`.
  So the per-listener override is not a capability of this version, and the
  "correction" was folklore that nobody re-measured.

  ЧТО ИЗ ЭТОГО СЛЕДУЕТ И ЧТО СДЕЛАНО. Загрузочная стража iam ТРЕБУЕТ https на
  этом переходе — справедливо: по нему едет административный предъявитель, а API,
  который он открывает, не аутентифицирует никого. Дать https одному этому
  листенеру провайдер не может. Из двух путей — перевести на TLS ОБЩИЙ листенер
  (тогда с открытого текста уходит и ПУБЛИЧНЫЙ, а его читают ingress, зеркало
  ключей и точка выдачи токена: ≥6 сцепленных адресов и смена идентичности
  токена) либо поставить перед административным листенером ТЕРМИНАТОР — выбран
  второй, и он РЕАЛИЗОВАН: сосед в том же поде провайдера
  (templates/hydra-admin-tls-configmap.yaml + hydra-admin-tls-service.yaml).

  ЭТОТ СЕРТИФИКАТ ТЕПЕРЬ ОБСЛУЖИВАЕТ ТЕРМИНАТОР, а не провайдера: SAN'ы ниже
  называют соседа, имён провайдера в них нет. Материал тот же, секрет тот же,
  якорь потребителей (`ca.crt` того же секрета) не менялся.

  ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: снова написать, что провайдер читает полистенный TLS, не
  перемерив это. Процедура перемера — ИСПОЛНЯЕМАЯ, одной командой:
  `bash deploy/scripts/remeasure-provider-listener-tls.sh --image <образ>`.
  Гейт посадки сам краснеет на смене версии провайдера и называет эту команду.

  The consumers verify against ca.crt of this same secret; a cert-manager
  Certificate secret carries ca.crt alongside tls.crt/tls.key, so no separate
  bundle has to be distributed.

  Gated on mtls.enabled AND mtls.hydraAdminTls.enabled. `and` in Go templates is
  NOT short-circuiting, so the sections are defaulted to empty dicts first — the
  same nil-pointer trap already documented in pg-certificates.yaml.
*/ -}}
{{- $mtls := .Values.mtls | default dict -}}
{{- $hydraTLS := $mtls.hydraAdminTls | default dict -}}
{{- if and $mtls.enabled $hydraTLS.enabled -}}
{{- $ca := .Values.mtls.internalCA -}}
{{- $rel := .Release.Name -}}
{{- /* NOTE the closing `}}` WITHOUT a dash on the next line, and do not "tidy" it.
       Every action above chomps the newline that precedes it (`{{-`), so the whole
       preamble collapses onto the last literal text in the file — the SPDX comment.
       A right-chomp here (`-}}`) then removes the newline that separates that comment
       from the first body key, and the document renders as
         `# SPDX-License-Identifier: BUSL-1.1apiVersion: cert-manager.io/v1`
       i.e. with `apiVersion` swallowed by a comment. `helm template` reports nothing
       (it does not validate), so this only surfaces at `helm upgrade`, as
       `error validating data: apiVersion not set`. Locked by
       deploy/tests/helm/rendered-documents-well-formed-test.sh. */ -}}
{{- $ns := .Release.Namespace }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $hydraTLS.secretName | default (printf "%s-hydra-admin-tls" $rel) | quote }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: hydra-admin
    app.kubernetes.io/component: hydra-admin-server-tls
    app.kubernetes.io/part-of: kacho
spec:
  secretName: {{ $hydraTLS.secretName | default (printf "%s-hydra-admin-tls" $rel) | quote }}
  duration: 2160h        # 90d
  renewBefore: 360h      # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  {{- /* ИМЕНА ТЕРМИНАТОРА, И ТОЛЬКО ОНИ.

         Каждое внутрикластерное написание, которым потребитель может набрать
         СОСЕДА. SAN, которым никто не пользуется, безвреден; тот, которым
         пользуются, а в сертификате его нет, роняет рукопожатие — и слой
         интроспекции считает это ПОСТОЯННОЙ ошибкой конфигурации, после чего
         отказывает КАЖДОМУ запросу. Поэтому список намеренно щедр.

         ИМЁН ПРОВАЙДЕРА (`<release>-hydra-admin`) ЗДЕСЬ НЕТ НАМЕРЕННО. Его
         Service снят, и забытый потребитель обязан падать на разрешении имени —
         громко и сразу. Верни сюда его имя, и однажды такой потребитель получит
         ДЕЙСТВИТЕЛЬНЫЙ сертификат по адресу, который ничего не терминирует.

         `localhost` — для проброса порта оператором. */}}
  dnsNames:
    - {{ printf "%s-hydra-admin-tls" $rel | quote }}
    - {{ printf "%s-hydra-admin-tls.%s" $rel $ns | quote }}
    - {{ printf "%s-hydra-admin-tls.%s.svc" $rel $ns | quote }}
    - {{ printf "%s-hydra-admin-tls.%s.svc.cluster.local" $rel $ns | quote }}
    - "localhost"
  issuerRef:
    name: {{ $ca.clusterIssuerName | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
