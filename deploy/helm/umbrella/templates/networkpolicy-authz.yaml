{{- if .Values.opaSidecar.networkPolicy.enabled }}
{{/*
KAC-127 Phase 3 (acceptance §5.7, defense-in-depth) — NetworkPolicy для
authz-pipeline (OPA bundle endpoint + OPA sidecars).
=====================================================================

Two policies are emitted:

  (1) `opa-bundle-endpoint-ingress` — kaname Internal port :9091 accepts
      bundle.tar.gz pulls ONLY from same-namespace pods carrying label
      `kacho.cloud/opa-sidecar=true` (set by sidecar injection). This is
      belt-and-suspenders on top of запрет #6 (Internal port not on external
      TLS) — even compromised tenant workloads in the same namespace cannot
      directly pull guardrails bundle.

  (2) `opa-sidecar-egress-allowlist` — restricted egress for pods that carry an
      OPA sidecar: bundle pull from kaname internal, FGA queries, DNS, and the
      dependencies the pod's OWN main container needs. Blocks decision-log
      exfiltration to attacker-controlled endpoints.

      READ THIS BEFORE EDITING. NetworkPolicy selects a POD, not a container.
      There is no way to restrict "just the sidecar": the moment this policy
      selects a pod, that pod's egress becomes default-deny and the allowlist
      below governs the MAIN container too. So the list is not "what OPA needs" —
      it is "everything this pod dials", and an omission is an outage, not a
      tightening. That is exactly how it went wrong: the label was rendered
      unconditionally on kaname (whose sidecar is off in every profile) while
      values.prod turned this policy on, so on a NetworkPolicy-enforcing CNI iam
      would have been cut off from its own Postgres and from Hydra. The label is
      now gated on `opaSidecar.enabled`, and the rules below cover the main
      container. Adding a new outbound dependency to an opa-sidecar-labelled
      service means adding a rule here as well.

Toggle via umbrella values:
  opaSidecar:
    networkPolicy:
      enabled: true                   (default true on prod, false on kind/dev)
      iamPodSelector:                 (which pod-label identifies kaname)
        matchLabels:
          app.kubernetes.io/name: kaname
      apiGatewayPodSelector:
        matchLabels:
          app: api-gateway
      backendPodSelector:             (vpc / compute / lb labels)
        matchExpressions:
          - {key: app, operator: In, values: [vpc, compute, loadbalancer]}

NOTE: these policies do NOT cover api-gateway external ingress (TLS edge) — that
is owned by `ingress-nginx` chart and ingress.yaml in api-gateway sub-chart.
This file is **internal pod-to-pod** authz wiring only.
*/}}

# ─── Policy 1: OPA bundle endpoint ingress (kaname :9091) ────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opa-bundle-endpoint-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: kacho
    kacho.cloud/component: authz
    kacho.cloud/phase: "3"
    kacho.cloud/kac-ticket: KAC-127
spec:
  podSelector:
    {{- toYaml .Values.opaSidecar.networkPolicy.iamPodSelector | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    # api-gateway — primary consumer (api-gateway has OPA sidecar, pulls bundle).
    - from:
        - podSelector:
            {{- toYaml .Values.opaSidecar.networkPolicy.apiGatewayPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9091
    # backend services — also pull (each has own OPA sidecar).
    - from:
        - podSelector:
            {{- toYaml .Values.opaSidecar.networkPolicy.backendPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9091
    # self-ingress — kaname's OWN OPA sidecar pulls bundle from kaname
    # internal Service (within the same pod is localhost, but Service-routing
    # may resolve to a sibling kaname replica → allow).
    - from:
        - podSelector:
            {{- toYaml .Values.opaSidecar.networkPolicy.iamPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9091
    # Public port :9090 is governed by separate sub-chart NetworkPolicy
    # (kaname-internal-allowlist etc.); this NetworkPolicy only adds
    # rules — it does NOT override existing ingress rules.
---
# ─── Policy 2: OPA sidecar egress allowlist ─────────────────────────────────
# OPA sidecars are identified by `kacho.cloud/opa-sidecar=true` pod label
# (set on every pod that injects OPA — api-gateway / iam / vpc / compute / lb).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opa-sidecar-egress-allowlist
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: kacho
    kacho.cloud/component: authz
    kacho.cloud/phase: "3"
    kacho.cloud/kac-ticket: KAC-127
spec:
  podSelector:
    matchLabels:
      kacho.cloud/opa-sidecar: "true"
  policyTypes:
    - Egress
  egress:
    # DNS (kube-dns / CoreDNS) — required for service-name resolution.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # kaname internal :9091 — bundle pull origin.
    - to:
        - podSelector:
            {{- toYaml .Values.opaSidecar.networkPolicy.iamPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9091
    # Own datastore :5432 — REQUIRED, and it is the omission that made this policy
    # unsafe to enable. The pod selected here is kaname, and cutting a service
    # off from its own database is not a tightening — it is an outage of the whole
    # authN/authZ tier. The mirror ingress side is networkpolicy-datastore.yaml
    # (`networkPolicy.datastore.instances[pg-iam].from`).
    - to:
        - podSelector:
            {{- toYaml .Values.opaSidecar.networkPolicy.datastorePodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    # Hydra public :4444 / admin :4445 — kaname is the single facade to Hydra
    # (OAuth client lifecycle, token issuance, JWKS mirror). Without this rule the
    # facade cannot reach what it fronts.
    - to:
        - podSelector:
            {{- toYaml .Values.opaSidecar.networkPolicy.hydraPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4444
        - protocol: TCP
          port: 4445
{{- end }}