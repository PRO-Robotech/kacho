{{/*
Copyright (c) PRO-Robotech
SPDX-License-Identifier: BUSL-1.1

СТРАЖ ПОЧТОВОЙ ПОЛОСЫ — место С1 решения Р4а приёмки ID-MAIL-1: отказ наступает
при РЕНДЕРЕ, по ОБЪЯВЛЕНИЯМ профиля.

МЕСТ СТРАЖА ДВА, И У КАЖДОГО СВОЙ ПРЕДМЕТ. Здесь — то, что видно в объявлениях:
половина пары, снятое шифрование, вырожденное значение, неподставленная ссылка,
поднятый приёмник без полосы. Второе место — шаг подстановки
`kacho.identity.configRenderInitContainer` (_kratos-identity.tpl): он видит
ВЕЛИЧИНУ, доехавшую до процесса, в том числе приехавшую слоем учётных данных
вне git, которого рендер не видит by construction, — и роняет ОБА рабочих
объекта личности, включая почтовый.

Доказательство на одном месте за оба не засчитывается: молчание одного стража
ничего не говорит о способности второго упасть.

ПОЧЕМУ ОТКАЗ, А НЕ КОММЕНТАРИЙ. Всё, что здесь запрещено, уже было записано
прозой — и одновременно нарушено умолчанием чарта: три профиля называли узел,
которого не поднимал ни один манифест, а адрес нёс `disable_starttls=true`.
Проза не роняет ничего; отказ рендера роняет.

ЧЕГО ЭТОТ СТРАЖ НЕ УТВЕРЖДАЕТ (граница названа, чтобы её не приняли шире):
  · что узел по этому адресу СУЩЕСТВУЕТ и отвечает — это рантайм. Отказ старта
    из-за неподнявшегося соседа был бы отказом на временной причине;
  · что величина, приехавшая слоем учётных данных, годна — рендер её не видит;
    это предмет С2;
  · что письмо ДОШЛО — это вопрос поднятого стенда и сквозной пробы.

Объект не производится: страж существует ради своих отказов.
*/}}
{{- if (.Values.kratos).enabled }}
{{- $smtp := ((((.Values.global).kacho).identity).smtp) | default dict }}

{{/* ВЫРОЖДЕННОЕ СЧИТАЕТСЯ НЕЗАДАННЫМ, а не «непустым», и предикат тут ОДИН на
     все три величины: пустая строка, пробелы, одинокая запятая. Разные предикаты
     у стража и у потребителя разошлись бы ровно там, где расхождение опасно. */}}
{{- $uri := trim (toString ($smtp.connectionURI | default "")) }}
{{- $from := trim (toString ($smtp.fromAddress | default "")) }}
{{- $fromName := trim (toString ($smtp.fromName | default "")) }}
{{- $uriSet := and (ne $uri "") (ne $uri ",") }}
{{- $fromSet := and (ne $from "") (ne $from ",") }}
{{- $fromNameSet := and (ne $fromName "") (ne $fromName ",") }}
{{- $laneDeclared := or $uriSet $fromSet $fromNameSet }}

{{/* ИСТОЧНИК УДОСТОВЕРЕНИЯ (решение Р6) — здесь судится ОБЪЯВЛЕНИЕ источника, а
     НЕ величина: удостоверение живёт в секрете, и рендеру его содержимое
     неизвестно by construction. Утверждать о величине этот страж не вправе —
     это предмет шага подстановки (С2). */}}
{{- $cred := ($smtp.credentialSecret) | default dict }}
{{- $credName := trim (toString ($cred.name | default "")) }}
{{- $credKey := trim (toString ($cred.key | default "")) }}
{{- $credNameSet := and (ne $credName "") (ne $credName ",") }}
{{- $credKeySet := and (ne $credKey "") (ne $credKey ",") }}
{{- $credDeclared := and $credNameSet $credKeySet }}

{{/* ── (1) ПОЛОВИНА ПАРЫ ХУЖЕ ОТСУТСТВИЯ ОБЕИХ: она ВЫГЛЯДИТ настроенной ──
     Прямая половина — это остаток предиката задачи #1679: профиль, объявивший
     полосу и не задавший адрес отправителя, обязан не подниматься, а не
     подставлять умолчание подчарта. Зеркальная — адрес отправителя без узла:
     письмо некуда отдать, и это так же тихо. */}}
{{- if and $uriSet (not $fromSet) }}
{{- fail (printf "kacho-umbrella: почтовая полоса объявлена (global.kacho.identity.smtp.connectionURI = %q), но адрес отправителя НЕ задан (global.kacho.identity.smtp.fromAddress пуст). Половина настройки хуже отсутствия обеих: она выглядит настроенной, служба стартует, письма уходят с чужим умолчанием либо не уходят вовсе. Задай обе величины в профиле, поднимающем службу личности (предикат задачи #1679, решение Р4 приёмки ID-MAIL-1)" $uri) }}
{{- end }}
{{- if and $fromSet (not $uriSet) }}
{{- fail (printf "kacho-umbrella: адрес отправителя объявлен (global.kacho.identity.smtp.fromAddress = %q), но узел почтовой полосы НЕ задан (global.kacho.identity.smtp.connectionURI пуст). Письмо некуда отдать, и отказ был бы тихим: процесс стартует, отправка молча не состоится (решение Р4 приёмки ID-MAIL-1)" $from) }}
{{- end }}
{{- if and $laneDeclared (not $fromNameSet) }}
{{- fail (printf "kacho-umbrella: почтовая полоса объявлена, но `global.kacho.identity.smtp.fromName` пуст. Величины три, и объявляются они вместе: умолчания у них нет намеренно (решение Р3 приёмки ID-MAIL-1)") }}
{{- end }}

{{/* ── (1а) ИСТОЧНИК УДОСТОВЕРЕНИЯ — САМ ПАРА, И ПОЛОВИНА ЕЁ ТАК ЖЕ ТИХА ────
     Имя секрета без ключа (и зеркально) — не «почти настроено», а объявление,
     из которого не следует ни одной переменной: ссылка на секрет не собирается,
     шаг подстановки величины не получает, и отказ приходит уже на старте пода,
     то есть дальше от того, кто это написал. */}}
{{- if and $credNameSet (not $credKeySet) }}
{{- fail (printf "kacho-umbrella: источник удостоверения почтовой полосы объявлен наполовину — `global.kacho.identity.smtp.credentialSecret.name` = %q задано, а `.key` пусто. Из такой пары не собирается ссылка на секрет: величина до пода не доедет, и отказ придёт на старте, а не здесь (решение Р6 приёмки ID-MAIL-1)" $credName) }}
{{- end }}
{{- if and $credKeySet (not $credNameSet) }}
{{- fail (printf "kacho-umbrella: источник удостоверения почтовой полосы объявлен наполовину — `global.kacho.identity.smtp.credentialSecret.key` = %q задан, а `.name` пусто. Ключ без секрета не адресует ничего (решение Р6 приёмки ID-MAIL-1)" $credKey) }}
{{- end }}

{{/* ── (1б) ЗЕРКАЛО ПОЛОВИНЫ ПАРЫ «УЗЕЛ ↔ УДОСТОВЕРЕНИЕ» ───────────────────
     Источник удостоверения объявлен, а узла нет вовсе: подставлять величину
     некуда. Прямая половина — узел, требующий удостоверения, без источника —
     судится ниже, там, где разобран адрес. */}}
{{- if and $credDeclared (not $uriSet) }}
{{- fail (printf "kacho-umbrella: источник удостоверения почтовой полосы объявлен (`global.kacho.identity.smtp.credentialSecret` = %s/%s), но узел НЕ задан (`global.kacho.identity.smtp.connectionURI` пуст). Обе половины объявляются вместе: одна выглядит настроенной и ничего не делает (решение Р4/Р6 приёмки ID-MAIL-1)" $credName $credKey) }}
{{- end }}

{{- if $uriSet }}
{{/* ── (2) НЕПОДСТАВЛЕННАЯ ССЫЛКА ─────────────────────────────────────────
     Служба личности подстановки в ЗНАЧЕНИЯХ конфигурации не делает — это
     измерено на том же провайдере соседним стражем (identity-callback-
     credential-guard.yaml). Строка уехала бы в адрес соединения дословно. */}}
{{- if contains "${" $uri }}
{{- fail (printf "kacho-umbrella: `global.kacho.identity.smtp.connectionURI` несёт ссылку %q, а служба личности подстановки в значениях конфигурации НЕ делает — строка уехала бы в адрес соединения дословно. Подставляй в поде, шагом `kacho.identity.configRenderInitContainer`, как это уже сделано для величины обратного вызова" $uri) }}
{{- end }}

{{/* ── (3) ШИФРОВАНИЕ СНЯТО — ban #16, исключения для стенда нет ───────────
     Ровно эта величина и стояла в снятом умолчании: `disable_starttls=true`.
     Она была не небрежностью — прежний приёмник TLS не умел вовсе, и полоса до
     него иначе не выражалась. Приёмник заменён; вместе с ним отзывается и
     послабление. Проверка сертификата снимается второй величиной
     (`skip_ssl_verify=true`): шифрование без проверки якоря защищает от
     подслушивания и не защищает от подмены, а решение Р5 требует обоих. */}}
{{- if regexMatch "disable_starttls=(true|1|yes)" $uri }}
{{- fail (printf "kacho-umbrella: `global.kacho.identity.smtp.connectionURI` = %q объявляет полосу до почтового узла НЕЗАШИФРОВАННОЙ (`disable_starttls`). Под ban #16 (production-mode ВЕЗДЕ, включая стенд) такой посадки на поднятом стенде существовать не должно; решение Р5 приёмки ID-MAIL-1 исключения для стенда не знает. Приёмник стенда несёт сертификат внутреннего удостоверяющего — сними эту величину из адреса" $uri) }}
{{- end }}
{{- if regexMatch "skip_ssl_verify=(true|1|yes)" $uri }}
{{- fail (printf "kacho-umbrella: `global.kacho.identity.smtp.connectionURI` = %q снимает ПРОВЕРКУ сертификата почтового узла (`skip_ssl_verify`). Шифрование без проверки якоря защищает от подслушивания и не защищает от подмены; решение Р5 требует обоих. Якорь на стенде — `ca.crt` секрета приёмника (`mailpit.tlsSecretName`)" $uri) }}
{{- end }}

{{/* ── (4) СХЕМА И УЗЕЛ ───────────────────────────────────────────────────
     `smtp://` — STARTTLS, `smtps://` — неявный TLS. Всё прочее до процесса
     доедет и будет отвергнуто им же, но уже молча и на первой отправке. */}}
{{- if not (or (hasPrefix "smtp://" $uri) (hasPrefix "smtps://" $uri)) }}
{{- fail (printf "kacho-umbrella: `global.kacho.identity.smtp.connectionURI` = %q — схема не распознана. Ожидается `smtp://` (STARTTLS) либо `smtps://` (неявный TLS); всё прочее отвергнет сам процесс, но уже на первой отправке и молча" $uri) }}
{{- end }}
{{- $rest := trimPrefix "smtps://" (trimPrefix "smtp://" $uri) }}
{{- $hostpart := (splitList "/" $rest) | first }}
{{- $host := (splitList "@" $hostpart) | last }}
{{- if eq (trim $host) "" }}
{{- fail (printf "kacho-umbrella: `global.kacho.identity.smtp.connectionURI` = %q — схема есть, узла нет. Вырожденное значение считается НЕЗАДАННЫМ, а не «непустым»: иначе страж зелен ровно там, где полоса не работает" $uri) }}
{{- end }}

{{/* ── (4а) УДОСТОВЕРЕНИЕ В АДРЕСЕ — ОНО УЕХАЛО БЫ В КАРТУ НАСТРОЕК ─────────
     Адрес узла рендерится в карту настроек службы личности, то есть в объект,
     который читается шире секрета: его отдаёт `kubectl get configmap`, он
     попадает в рендер чарта, в вывод отладки и в артефакты прогона. Пароль,
     записанный внутрь адреса, оказывается там же — и это НЕ гипотеза о
     небрежности, а единственная форма, в которой удостоверение сегодня вообще
     выразимо, пока источник не объявлен отдельно (решение Р6).

     ЧТО ИМЕННО СУДИТСЯ: часть адреса ДО «@». Двоеточие в ней означает пару
     «имя:пароль» — то есть литеральную величину. Имя пользователя без пароля
     двоеточия не несёт (символ в имени экранируется процентом), поэтому
     законная форма под это отрицание не подпадает; парный положительный
     контроль на неё стоит в доказательстве стража. */}}
{{- $userinfo := "" }}
{{- if contains "@" $hostpart }}
{{- $userinfo = join "@" (initial (splitList "@" $hostpart)) }}
{{- end }}
{{- $userSet := ne (trim $userinfo) "" }}
{{- if and $userSet (contains ":" $userinfo) }}
{{- fail (printf "kacho-umbrella: `global.kacho.identity.smtp.connectionURI` несёт УДОСТОВЕРЕНИЕ внутри адреса (часть до «@» содержит «имя:пароль»). Адрес рендерится в карту настроек, а она читается шире секрета — величина оказалась бы в `kubectl get configmap`, в рендере чарта и в артефактах прогона. Оставь в адресе только имя пользователя, а величину объяви источником: `global.kacho.identity.smtp.credentialSecret.name`/`.key` (решение Р6 приёмки ID-MAIL-1). Ссылку в адрес вставит шаблон, подставит её шаг `identity-config-render` до старта процесса") }}
{{- end }}

{{/* ── (4б) ПОЛОВИНА ПАРЫ «УЗЕЛ ↔ УДОСТОВЕРЕНИЕ», ПРЯМАЯ ────────────────────
     Узел, ТРЕБУЮЩИЙ удостоверения, распознаётся по имени пользователя в
     адресе: имя есть — значит узел спросит пароль. Источник при этом не
     объявлен ⇒ подставлять нечего, процесс предъявит пустое удостоверение, и
     ретранслятор отвергнет отправку — молча, на первом письме, при зелёной
     посадке. Половина хуже отсутствия обеих: она выглядит настроенной.

     ГРАНИЦА: страж судит ОБЪЯВЛЕНИЕ источника, а не содержимое секрета —
     величины он не видит by construction (Р6) и утверждать о ней не вправе.
     Годна ли доехавшая величина, судит шаг подстановки (С2). */}}
{{- if and $userSet (not $credDeclared) }}
{{- fail (printf "kacho-umbrella: почтовая полоса названа на узел, ТРЕБУЮЩИЙ удостоверения (адрес несёт имя пользователя %q), но ИСТОЧНИК удостоверения не объявлен — пусты `global.kacho.identity.smtp.credentialSecret.name` и `.key`. Объявлена одна половина пары из двух: подставлять нечего, процесс предъявит пустое удостоверение, ретранслятор отвергнет отправку на первом письме, а посадка останется зелёной. Либо объяви источник, либо убери имя пользователя из адреса (решение Р4/Р6 приёмки ID-MAIL-1)" $userinfo) }}
{{- end }}
{{- if and $credDeclared (not $userSet) }}
{{- fail (printf "kacho-umbrella: источник удостоверения объявлен (`global.kacho.identity.smtp.credentialSecret` = %s/%s), а адрес узла имени пользователя НЕ несёт (%q) — величину некуда подставлять, и она молча не применится. Объявлена одна половина пары из двух (решение Р4/Р6 приёмки ID-MAIL-1)" $credName $credKey $uri) }}
{{- end }}

{{/* ── (6) ПОЛОСА НАЗВАНА НА ПРИЁМНИК, КОТОРОГО НЕ ПОДНИМАЮТ ───────────────
     ЗЕРКАЛО (5) И ВТОРАЯ ПОЛОВИНА ИСХОДНОГО ДЕФЕКТА. Там приёмник подняли и
     никто ему не пишет; здесь ему пишут, а поднят он под ДРУГИМ именем — либо
     не поднят вовсе. Оба состояния тихи одинаково: рендер проходит, под
     стартует, посадка зелёная, писем нет и сигнала нет ни одного.

     ПОЧЕМУ ЭТО НЕ ЛОВИЛОСЬ. Имя рабочего объекта складывается из ИМЕНИ РЕЛИЗА
     (`kacho.mailReceiver.fullname`), а узел в полосе — ЛИТЕРАЛ профиля. Ручка
     `STACK_RELEASE` рецепта объявлена через `?=`, то есть перекрываема: вызов
     `make stack-up STACK=dev STACK_RELEASE=иное` поднимает `иное-mailpit`, а
     полоса продолжает указывать на прежнее имя. Гейт дерева
     (mail_receiver_core_test.go) сверяет ОБЪЯВЛЕНИЯ и такого вызова не видит
     by construction — поэтому отказ нужен здесь, при рендере.

     СУФФИКС НЕ ВЫПИСАН, А ВЫВЕДЕН из того же объявления: копия литерала
     разошлась бы с манифестом молча — ровно тот класс, который тут и чинится. */}}
{{- $want := include "kacho.mailReceiver.fullname" . }}
{{- $suffix := trimPrefix .Release.Name $want }}
{{/* ПОРТ СНИМАЕТСЯ ЯВНО. `$host` выше вырезан только по «/» и «@», поэтому
     несёт порт: `…-mailpit:1025`. Сравнение имени с непорезанной строкой
     молчало бы ровно на той форме, которую дерево и производит, — то есть
     страж был бы вечно зелен. Поймано инъекцией, а не чтением. */}}
{{- $short := (splitList ":" ((splitList "." (trim $host)) | first)) | first }}
{{- if hasSuffix $suffix $short }}
{{- if not ((.Values.mailpit).enabled) }}
{{- fail (printf "kacho-umbrella: почтовая полоса названа на приёмник %q, но приёмник ВЫКЛЮЧЕН (`mailpit.enabled` не взведён) — узел не поднимает ни один манифест, и письма уйдут в никуда молча. Либо включи приёмник, либо назови полосой внешний ретранслятор" $short) }}
{{- end }}
{{- if ne $short $want }}
{{- fail (printf "kacho-umbrella: почтовая полоса названа на %q, а ЭТОТ релиз поднимает приёмник под именем %q. Имя рабочего объекта складывается из имени релиза, узел в полосе — литерал профиля: два места об одном предмете, и расходятся они молча. Письма уйдут на несуществующее имя, рендер при этом пройдёт, под стартует, посадка останется зелёной" $short $want) }}
{{- end }}
{{- end }}
{{- end }}

{{/* ── (5) ПРИЁМНИК ПОДНЯТ, А ПОЛОСА НЕ ОБЪЯВЛЕНА ─────────────────────────
     Зеркало исходного дефекта: там полосу объявили к узлу, которого никто не
     поднимает; здесь узел поднимают, и никто ему не пишет. Оба состояния тихи
     одинаково. */}}
{{- if and ((.Values.mailpit).enabled) (not $uriSet) }}
{{- fail (printf "kacho-umbrella: приёмник писем включён (`mailpit.enabled`), но почтовая полоса не объявлена (`global.kacho.identity.smtp.connectionURI` пуст). Узел поднимается, и писать в него некому — состояние ровно так же тихо, как обратное") }}
{{- end }}
{{- end }}
