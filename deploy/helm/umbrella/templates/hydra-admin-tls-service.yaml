{{- /*
  Service СОСЕДА-ТЕРМИНАТОРА перед административным листенером провайдера.

  ПОЧЕМУ СВОЙ Service, А НЕ ПЕРЕЦЕЛИТЬ ЧУЖОЙ. Service чарта провайдера целится в
  ИМЕНОВАННЫЙ порт его контейнера (`targetPort: http-admin`) — перецелить его на
  соседа нечем. Свой Service решает это без правки чужого шаблона.

  ПОЧЕМУ Service ПРОВАЙДЕРА СНИМАЕТСЯ (`hydra.service.admin.enabled: false`), а
  не остаётся инертным. После увода листенера на петлю он целился бы в порт,
  который снаружи пода не отвечает: выглядел бы рабочим адресом и однажды получил
  бы потребителя — с тихим истечением срока вместо внятного отказа. Снятый, он
  даёт ОТКАЗ РАЗРЕШЕНИЯ ИМЕНИ: забытый потребитель падает громко и сразу. По той
  же причине имена провайдера убраны из SAN сертификата.

  ДОСЯГАЕМОСТЬ НЕ РАСШИРЯЕТСЯ: ClusterIP, никакого Ingress. Административный API
  остаётся немаршрутизируемым снаружи — это его единственная защита, потому что
  сам он не аутентифицирует никого.
*/ -}}
{{- $mtls := .Values.mtls | default dict -}}
{{- $hydraTLS := $mtls.hydraAdminTls | default dict -}}
{{- if and $mtls.enabled $hydraTLS.enabled -}}
{{- $rel := .Release.Name -}}
{{- $ns := .Release.Namespace -}}
{{- /*
  Порт берётся из ЕДИНСТВЕННОГО объявления (global.kacho.hydraAdminTls) — того
  же, из которого его читают конфигурация соседа и его спецификация. Прежде
  здесь стоял свой литерал с собственным умолчанием: расхождение с портом соседа
  не мешало ни рендеру, ни развёртыванию, и Service тихо целился бы в никуда.
*/ -}}
{{- $listenPort := (fromYaml (include "kacho.hydraAdminTls.settings" .)).terminatorPort }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-hydra-admin-tls" $rel | quote }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: hydra-admin-tls
    app.kubernetes.io/component: hydra-admin-terminator
    app.kubernetes.io/part-of: kacho
spec:
  type: ClusterIP
  ports:
    - name: https-admin
      port: {{ $listenPort }}
      targetPort: {{ $listenPort }}
      protocol: TCP
  {{- /* Метки пода провайдера: сосед живёт в ЕГО поде, поэтому и селектор его. */}}
  selector:
    app.kubernetes.io/name: hydra
    app.kubernetes.io/instance: {{ $rel }}
{{- end }}
