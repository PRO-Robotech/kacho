{{- /*
NetworkPolicy: ограничивает доступ к kacho-vpc internal-port (:9091) только
allowlist'ом pod'ов — край, соседи, которые туда звонят, и admin-tooling. Public
:9090 — открытый ingress для всего namespace.

Соседи названы по тому, КТО ЗВОНИТ, а не по памяти: адрес внутреннего слушателя
получают в настройках край, compute (подключение интерфейса машины) и kacho-nlb
(отметка ссылки на адрес). Пока правило называло один край, оба соседа не
доставали до слушателя (kacho#2941). Метки выводятся из чартов компонентов
(`_network-identity.tpl`); сосед с выключенным чартом не называется — его
селектор не выбрал бы ни одного пода. Что каждый, кто звонит, впущен, держит
deploy/network_policy_admission_render_test.go.

Закрывает security P0 #2 (lateral movement через :9091): без NetworkPolicy
любой pod в namespace `kacho` может вызвать
  - InternalAddressService.AllocateInternalIP/AllocateExternalIP → IPAM privileges
  - InternalAddressPoolService.{Create,Delete} → admin IPAM privileges
  - InternalAddressPoolService.BindAsNetworkDefault → переписать IPAM default для network

Здесь первой строкой перечня стоял поток наблюдения (`InternalWatchService.Watch`)
с обоснованием «массовый вынос очереди». RPC СНЯТ — он числится в надгробии
снятых поверхностей, и вызвать его нельзя ни из какого пода (#816).

Обоснование, пережившее свой предмет, — не безобидная опечатка: перечень читают,
решая, нужна ли политика вообще и что она защищает. Строка про несуществующий
RPC либо завышает ценность защиты, либо (найдя, что RPC нет) обесценивает весь
перечень вместе с живыми тремя пунктами.

Включается через umbrella values:
  vpc:
    networkPolicy:
      enabled: true
      adminPodsSelector:
        matchLabels:
          kacho.io/role: admin
*/ -}}
{{- if .Values.vpc.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpc-internal-allowlist
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "umbrella.appSelectorLabels" (dict "root" $ "chart" "vpc") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "umbrella.appSelectorLabels" (dict "root" $ "chart" "vpc") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Public :9090 — открыт для всего namespace (api-gateway + UI traffic).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9090
    # Internal :9091 — край, соседи compute и kacho-nlb, admin pods.
    - from:
        - podSelector:
            matchLabels:
              {{- include "umbrella.edgeSelectorLabels" . | nindent 14 }}
        {{- range $peer := list "compute" "kacho-nlb" }}
        {{- $peerVals := index $.Values $peer | default dict }}
        {{- /* Условие подчарта без ключа `enabled` helm считает включённым — так же и здесь. */}}
        {{- if or (not (hasKey $peerVals "enabled")) $peerVals.enabled }}
        - podSelector:
            matchLabels:
              {{- include "umbrella.appSelectorLabels" (dict "root" $ "chart" $peer) | nindent 14 }}
        {{- end }}
        {{- end }}
        {{- with .Values.vpc.networkPolicy.adminPodsSelector }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 9091
{{- end }}