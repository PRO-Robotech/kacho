# ═══════════════════════════════════════════════════════════════════════════
# values.prod.yaml — Kachō umbrella PRODUCTION profile (fail-closed).
# ═══════════════════════════════════════════════════════════════════════════
#
# This is the documented production values profile. The chart DEFAULT
# (values.yaml) and the dev/CI profile (values.dev.yaml) intentionally run
# `mode: dev` (anonymous → full access) + `ssl-mode: disable` + mTLS toggles
# that the dev stand flips on/off for black-box REST (api-gateway#71 /
# deploy#80). A bare `helm install` of the umbrella therefore lands on the
# insecure dev posture. PRODUCTION DEPLOYMENTS MUST pass this file explicitly:
#
#   make -C deploy stack-up STACK=prod
#
# The chain is NOT written out here on purpose. It is declared once, in
# deploy/stacks.txt, and the target reads it from there. A command copied into
# a comment cannot be executed and drifts from the table in silence: that is
# exactly how a knob declared in a profile failed to reach the cluster — the
# operator repeated the previous command, the start guard refused, and the
# service went on serving the PREVIOUS image while the stand looked fully
# rolled out (#1161).
#
# An image-tag overlay on top is passed as an extra argument, e.g.
#   make -C deploy stack-up STACK=prorobotech
# which is its own declared stand rather than an optional flag on this one.
#
# Layer the image-tag overlay (values.prorobotech.yaml / a per-cluster overlay)
# AFTER this file. This profile is image-tag-agnostic — it sets ONLY the
# security posture (auth mode, DB ssl-mode, mTLS), reusing the EXISTING SEC-F
# cert-manager internal-CA wiring (no new PKI is introduced here).
#
# ─── What this profile flips (vs the dev/insecure default) ──────────────────
#   1. AuthN mode → production / production-strict on every service that has a
#      mode knob (api-gateway, kaname, kacho-vpc, kacho-nlb, kacho-geo,
#      kacho-storage, kacho-registry). kacho-compute has no `mode` knob: it is a
#      pure cluster-internal backend whose posture is per-RPC IAM Check (authzIam)
#      + fail-closed list-filter + mTLS, all set below.
#
#      MOST OF THIS FILE IS BOOT REQUIREMENTS, NOT PREFERENCES. api-gateway,
#      kacho-vpc, kacho-nlb, kacho-geo, kacho-storage and kacho-registry all carry
#      fail-closed Config.Validate/serve guards that REFUSE TO START on an
#      incomplete production config — plaintext DB, mTLS off on either listener,
#      an empty authz address, an empty trusted-forwarder allow-list, a peer edge
#      configured without a secure transport. A knob missing here is a
#      CrashLoopBackOff, not a soft default.
#
#      COROLLARY, LEARNED THE HARD WAY: `helm template` proves NOTHING about this
#      profile. Every gap listed below rendered perfectly valid YAML. Validate
#      changes with `helm install` + rollout-ready in production posture.
#   2. Postgres ssl-mode → `require` (encrypted transport; the production floor).
#      `require` — not `verify-full` — because the in-cluster Postgres TLS server
#      cert + CA trust bundle are an infra concern provisioned per-cluster, not a
#      chart value. Operators that wire a server-cert CA can override to
#      `verify-full` per service. kaname production-strict ALSO enforces
#      `ssl-mode ∈ {require, verify-ca, verify-full}` at config-validate time.
#   3. mTLS → ON, reusing the SEC-F internal-CA ClusterIssuer + the per-service
#      leaf Certificates already shipped (kacho-<svc>-server-tls /
#      kacho-<svc>-client-tls / api-gateway-tls / api-gateway-client-tls). Same
#      enable + per-edge map the dev profile uses — just kept ON for every edge.
#   4. AuthZ → enabled + fail-closed (failOpen=false) everywhere. Ручка обхода
#      выставляется там, где она есть (registry); у vpc и nlb её нет вовсе —
#      звено решения о доступе ставится безусловно, и объявлять ключ выключенным
#      значило бы сообщать оператору о контроле, которого не существует.
#
# ─── Secrets discipline (workspace rule: no secrets in values) ──────────────
# This file contains NO secret material. AuthN secrets the production binaries
# require are consumed from Secrets the chart already wires via secretKeyRef:
#   - kaname: KANAME_HOOK_TOKEN  ← kacho.hooks.tokenHookSecretName
#                KANAME_JWKS_ENC_KEY ← kacho.iam.jwks.encKeySecretName
#   - per-service DB password           ← <svc>.db.passwordSecretName
#   - kratos-selfservice-ui COOKIE_SECRET/CSRF_COOKIE_SECRET
#                                       ← kratosSelfServiceUI.cookieSecret.existingSecret
#     (render fails fast if unset — no git-committed cookie/CSRF signing key)
# The operator MUST provision those Secrets out-of-band (or via external-secrets)
# BEFORE rollout — kaname Config.Validate fails fast in production if the hook
# secret / JWKS encryption key are missing (defense-in-depth, fail-closed).
# Image tags + the kacho.domain root come from a layered per-cluster overlay.

# ─── Root domain — override per environment via a per-cluster overlay ───────
# (e.g. `-f values.<cluster>.yaml --set kacho.domain=cloud.example.com`). Left at
# the chart default here so this profile stays cluster-neutral.

# ─── cluster-internal mTLS PKI — ON (reuse SEC-F internal-CA, no new PKI) ────
# Master switches: the cert-manager controller + the internal-CA ClusterIssuer
# chain (templates/clusterissuer.yaml) + each sub-chart's own leaf Certificate.
# Identical recipe to values.dev.yaml; production simply never turns it off.
# NB: on a cluster that already runs cert-manager, set `cert-manager.enabled=false`
# and point `mtls.internalCA.caNamespace` at that controller's
# --cluster-resource-namespace (see values.fe3455.yaml) via a per-cluster overlay.
# ─── Обратные вызовы службы личности — под тем же TLS, что и слушатель ────────
#
# Слушатель хуков этого стенда работает под TLS (kaname.mtls.httpListeners
# ниже), значит и полосы к нему обязаны идти https. Прежде две из четырёх полос
# (заведение пользователя и завершение восстановления доступа) были выписаны в
# шаблоне чарта буквой `http`, и профиль переопределить их не мог ВООБЩЕ — то
# есть боевая посадка не была в состоянии объявить их защищёнными.
#
# Узел и порт здесь не объявляются: их умолчания выводятся из имени подчарта и
# порта слушателя и совпадают с прежним адресом байт в байт. Объявляется ровно
# то, что решает профиль, — транспорт.
#
# ПОЧЕМУ В `global`, А НЕ В ЗНАЧЕНИЯХ ПОДЧАРТА. Содержимое настроек службы
# личности читается из ДВУХ контекстов: нашего подчарта (там рендерится карта
# настроек) и подчарта провайдера (там в шаблон пода кладётся отпечаток её
# содержимого, без которого правка карты не перекатывает под). Общими для обоих
# являются только `.Values.global` и `.Release`.
#
# Согласие полосы со слушателем держит deploy/identity_callback_transport_test.go:
# он выводит перечень полос из конфигурации и краснеет и на открытой полосе при
# слушателе под TLS, и на обратном — https к открытому слушателю.
global:
  kacho:
    identity:
      hooks:
        scheme: https


mtls:
  enabled: true
  # ─── Postgres SERVER-TLS from the same internal CA (templates/pg-certificates.yaml) ─
  # LOAD-BEARING, not hardening-extra: this profile sets ssl-mode=require on EVERY
  # kacho service (§2 above). `require` means the client SENDS an SSLRequest and
  # ABORTS if the server refuses it — so a Postgres that does not serve TLS makes
  # every service (and its goose migrator init-container) fail to connect. The
  # bitnami sub-chart default is tls.enabled=false, therefore the profile that
  # demands `require` is the profile that must also issue the server certs.
  # pg-certificates.yaml is gated on `mtls.pgTls.enabled` and was never set here —
  # it rendered nothing while every service still asked for TLS.
  #
  # Server-auth ONLY. Do NOT add `certCAFilename` on the pg-<svc> sub-charts: that
  # switches bitnami Postgres to VERIFY client certs (pg_hba `cert`), and the
  # bitnami readiness/liveness probe presents the server leaf (server-auth EKU) as
  # its client cert → PG rejects it and the pod never turns Ready. Password auth
  # over an encrypted channel is the intended posture.
  pgTls:
    enabled: true
    # One entry per kacho-owned datastore that a service dials with ssl-mode=require.
    # ЭТОТ СПИСОК — ТО, ЧТО ВЫПУСКАЕТ СЕРВЕРНЫЙ СЕРТИФИКАТ. Имя, несущее ниже
    # `tls.enabled: true`, но отсутствующее здесь, оставляет StatefulSet
    # примонтированным к секрету, которого никто не создаёт: под висит, рендер
    # при этом зелёный. Пара «tls.enabled ⇔ имя в списке» держится вручную —
    # правя одно, правь второе.
    #
    # pg-kratos/pg-hydra остаются вне пола: их DSN действительно принадлежат
    # чужим чартам, и это их собственный предмет.
    services: [vpc, compute, iam, geo, nlb, storage, registry]
  # Serving certificate for the ADMIN hop — consumed by the TERMINATOR sidecar in
  # the provider's pod, not by the provider itself (it does not read a
  # per-listener TLS declaration; measured, see deploy/PROVIDER-LISTENER-PREMISE.md).
  # LOAD-BEARING: this profile addresses the hop over https from both the gateway
  # and iam, and BOTH refuse to start on a plaintext or unanchored hop — so the
  # certificate, the terminator and the consumer addresses move together or not
  # at all.
  hydraAdminTls:
    enabled: true
    secretName: kacho-umbrella-hydra-admin-tls
cert-manager:
  enabled: true

# ─── api-gateway (edge) ─────────────────────────────────────────────────────
api-gateway:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: authn.mode).
  authMode: production-strict
  # ─── Объявление приёма токена (Ф1б, задача #926) ──────────────────────
  #
  # Издатель на крае — МНОЖЕСТВО: платформа чеканит свои токены сама (задача
  # #897), а прежний издатель на переходе остаётся. У КАЖДОГО принимаемого
  # издателя своя запись источника ключей: объединить наборы было бы дешевле и
  # уничтожило бы ровно ту защиту, ради которой развязка делается — ключ одного
  # издателя проверял бы токен, объявляющий другого.
  #
  # Значения — ТЕ ЖЕ, что у ПЕРВОЙ конфигурации проверяющего
  # (kacho-registry.tokenAcceptance ниже): одна платформа, один набор адресов.
  # Расхождение между ними было бы двумя местами об одном предмете.
  #
  # ОТКАТ состоит в снятии platformIssuer и нашего издателя из issuers — не в
  # перекатке образа.
  tokenAcceptance:
    issuers: "https://kaname.kacho.local,https://hydra.api.kacho.cloud"
    # Адрес ОБЪЯВЛЯЕТСЯ, а не выводится из издателя: издатель приходит от
    # предъявителя, и производный адрес получался бы у ВСЯКОГО издателя —
    # состояние «записи нет» не наступало бы никогда, а страж старта стал бы
    # тождественно истинным.
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json,https://hydra.api.kacho.cloud=https://kaname-internal.kacho.svc:9097/.well-known/jwks.json"
    # Наш издатель выбирает полосу приёма: строгий тип at+jwt и чтение отзыва на
    # предъявлении. Вне issuers — отказ в старте.
    platformIssuer: "https://kaname.kacho.local"
    # НАШ авторитет отзыва. Прежний провайдер о наших токенах не знает by
    # construction: спрошенный про наш токен, он отвечает не «действует» и не
    # «отозван», а утверждение о предмете, которого у него нет.
    revocationUrl: "https://kaname-internal.kacho.svc:9097/internal/tokens/introspect"
    # Якорь доверия хопа к авторитету: по нему едет ПРЕДЪЯВЛЕННЫЙ токен, а не
    # только административный вызов. Та же связка, что у хопа за ключами.
    revocationCa:
      secretName: kaname-server-tls
      key: ca.crt
      mountPath: /etc/api-gateway/platform-revocation-ca
    # ЧЕМ край предъявляет СЕБЯ авторитету. Якоря выше НЕ ДОСТАТОЧНО: он
    # проверяет ЕГО, а не представляет НАС. Авторитет выставлен на слушателе,
    # который сертификат ЗАПРАШИВАЕТ (iam отказывается стартовать иначе), и
    # спрашивающему без проверенной цепочки отвечает отказом — то есть без этой
    # пары КАЖДЫЙ предъявитель нашей чеканки получал бы 503 при исправном на вид
    # контроле. Пути — на УЖЕ смонтированную клиентскую личность края
    # (mtls.mountPath); своего тома у пары нет намеренно, вторая копия той же
    # личности разъехалась бы с первой молча.
    revocationClientCert:
      certFile: /etc/api-gateway/mtls/tls.crt
      keyFile: /etc/api-gateway/mtls/tls.key
  # KACHO_APP_ENV — keys the two fail-fast production guards
  # (validateProductionAuthzConfig + validateProductionInternalListener). An
  # empty/unset label is ALREADY production-class by design (a forgotten label must
  # not silently downgrade to dev), so this is a statement of intent rather than a
  # behaviour change — but it makes the posture legible instead of implicit.
  appEnv: production
  # ─── cluster-internal :9091 listener — mTLS + SPIFFE caller allow-list ──────
  # Здесь стоял блок `internalListener.mtls.enable: true` — требование СТАРТА, а
  # не необязательное усиление: без него край в боевой посадке не поднимался.
  # Предмета у требования больше нет (#1024): внутреннего gRPC-листенера у края
  # нет вовсе — его единственную службу (гашение кэша решений по запросу iam)
  # сняли вместе с обратным ребром, а листенер без единственной службы был бы
  # входной поверхностью без единого метода.
  #
  # Запись снята, а не выключена: значение, называющее снятую ручку, инертно и
  # потому читается как принятое решение о защите периметра, ничего при этом не
  # делая. Оператор поверил бы ему, а проверить смог бы только чтением шаблона,
  # которого нет.
  #
  # Посадку края это НЕ ослабляет и молчанием не подменяет: гейт посадки
  # (deploy/scripts/assert-production-posture.sh) по-прежнему судит измерение
  # internal_mtls, и край обязан объявить его величиной "n/a" — «листенера нет
  # вовсе». Величина "false" («листенер есть и не защищён») остаётся ОТКАЗОМ.
  # ─── Backend dial addresses ────────────────────────────────────────────────
  # Restated ONLY where the chart default does not resolve in this umbrella —
  # the same class as storage's db.host. Everything else keeps the chart default.
  backends:
    # The registry Services are `registry` / `registry-internal` (registry chart
    # `.Values.name`), NOT `kacho-registry`. The chart default dials
    # kacho-registry.kacho.svc, which does not exist → NXDOMAIN →
    # 503 on every /registry/v1/* call. The dev profile carries this override
    # with the same note; the production profile never did.
    # These hosts are also the registry server-cert SANs, so the derived
    # SERVER_NAME matches once the mTLS edge below is armed.
    registry: registry.kacho.svc:9090
    registryInternal: registry-internal.kacho.svc:9091
    # nlb's internal listener lives on its OWN Service `kacho-nlb-internal`; the
    # public `kacho-nlb` Service publishes only grpc/metrics, so the chart default
    # (kacho-nlb:9091) hits a port the Service does not expose.
    nlbInternal: kacho-nlb-internal.kacho.svc:9091
  # AuthN: production-strict → Bearer REQUIRED (reject missing token) + Hydra
  # JWKS RS256 validation. No devSecret (HS256 dev path is never used in prod).
  authn:
    # Apply the per-RPC authentication floor the catalog declares. The gateway
    # refuses to start in a production-class environment without it, so this is
    # not optional here — it is stated so that no future edit to a chart default
    # can quietly drop it, the same discipline the forwarder allow-list follows
    # below. Machine principals are exempt from the floor by the shared rule.
    enforceStepUp: true
  # Hydra JWKS — the verifier fetches Hydra's JWKS from the cluster-internal
  # Hydra PUBLIC Service (NOT the public ingress hairpin); `issuer` is the public
  # OIDC issuer string the token `iss` claim must match (SEC-J exact-match).
  hydra:
    # KEY-FETCH HOP — through the iam mirror, over TLS, VERIFIED.
    #
    # THIS LINE USED TO POINT STRAIGHT AT THE PROVIDER, and that was the facade bypass
    # this edge had already been caught at once and fixed. It came back because the
    # correct route was unreachable: an address knob existed for this hop, a trust knob
    # did not, so "fetch from the internal mirror over TLS" could not be configured and
    # going around the facade looked like the pragmatic choice. It is not a choice any
    # more — the anchor below makes the right route configurable.
    #
    # Why it matters more than tidiness: over this hop travels the material the edge
    # verifies every bearer's SIGNATURE with. Substituting it substitutes the access
    # decision, and the edge then believes its own answer. Plaintext, or TLS whose
    # certificate nobody checks, both leave that open. registry already fetches from
    # this same :9097 over https (see registry.tokenAcceptance.issuerKeySets below) — one
    # port, one
    # transport.
    jwksUrl: ""  # СНЯТ: адрес набора теперь объявляется записью издателя
              # в tokenAcceptance.issuerKeySets выше.
    # Anchor for the hop above: the internal-CA bundle that signs iam's serving cert.
    # Unreadable or certificate-less ⇒ REFUSES THE START, exactly like the admin hop —
    # falling back to the system roots would read as configured and verify nothing.
    jwksCa:
      secretName: kaname-server-tls
      key: ca.crt
      mountPath: /etc/api-gateway/hydra-jwks-ca
    issuer: ""  # СНЯТ вместе с приходом tokenAcceptance выше: два объявления об одном
                # предмете дают ОТКАЗ В СТАРТЕ, а не молчаливое старшинство.
    # ─── Revocation path (ADMIN API — not the public issuer above) ──────────
    # A verified signature proves who minted the token and when it lapses. It
    # cannot prove the token is still good: a sign-out, a revoked machine key
    # or a back-channel logout all leave a valid signature behind. Only the
    # provider knows, and only over its admin API — a separate Service and
    # port, reachable only in-cluster, so neither address can be derived from
    # anything else in this block.
    #
    # Both WERE derived from the issuer when unset, and no profile set either,
    # so every stand pointed them at a server that serves neither. The gateway
    # no longer derives them, and refuses to start production-class while
    # either is unset — this profile is what keeps that start possible.
    #
    # The admin API has no authentication of its own; it is protected by not
    # being routable. It must never be published outside the cluster.
    #
    # OVER TLS, AND ANCHORED. Since the revocation check moved onto the authN
    # layer, this hop is taken on every authenticated request that misses the
    # introspection cache — and introspection asks about a bearer by SENDING it.
    # So the wire carries a live end-user credential, not merely administrative
    # calls, and a bearer read off the wire is usable by whoever read it. The
    # gateway REFUSES TO START production-class on a plaintext hop, and equally
    # on an https one with no anchor: the provider's in-cluster certificate is
    # issued by the internal CA, the process trusts the system roots, and the
    # introspection layer treats an unknown authority as a permanent
    # misconfiguration — after which it refuses every request.
    introspectionUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc:4445/admin/oauth2/introspect"
    adminUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc:4445"
    # ca.crt of the provider's admin serving secret (templates/hydra-admin-certificate.yaml)
    # — the internal-CA bundle that signs it. Mounted as a volume and pointed at by
    # KACHO_HYDRA_ADMIN_CA_FILE; an unreadable or certificate-less bundle refuses the start.
    adminCa:
      secretName: kacho-umbrella-hydra-admin-tls
      key: ca.crt
      mountPath: /etc/api-gateway/hydra-admin-ca
  # AuthZ: per-RPC IAM Check fan-out, fail-CLOSED on transient IAM errors.
  authz:
    enabled: true
    failOpen: false
  # mTLS: external listener server cert + backend-dial client cert, every edge on.
  # `hybridExternal: false` → external listener is strict (browser clients reach
  # the gateway through the ingress TLS terminator, not this listener directly).
  mtls:
    enable: true
    hybridExternal: false
    serverSecretName: api-gateway-tls
    edges:
      vpc: true
      compute: true
      iam: true
      nlb: true
      # gateway→geo (public :9090 Region/Zone read + the internal :9091 admin
      # surface). kacho-geo runs mtls.enable=true in THIS profile, i.e.
      # RequireAndVerifyClientCert on BOTH listeners — so with this edge off the
      # gateway dials geo without a client cert and every /geo/v1/regions|zones
      # request dies on the handshake (503). The edge map here predates the geo
      # cutover; only the fe3455 cluster overlay patched it, and its comment
      # records exactly this 503. SERVER_NAME is derived per dial-host
      # (kacho-geo / kacho-geo-internal — both in the geo server-cert SAN).
      geo: true
      # gateway→registry (public :9090 Registry/Repository + internal :9091
      # InternalRegistryService). registry.mtls.enable=true below → server-mTLS on
      # both listeners, so this leg is what makes the registry reachable at all;
      # without it every /registry/v1/* call fails the handshake. SERVER_NAME is
      # derived from the corrected dial-hosts above (registry / registry-internal,
      # both in the registry server-cert SAN).
      registry: true
      # gateway→storage (public :9090 Volume/Snapshot/Image/DiskType read + the
      # internal :9091 admin surface). storage runs server-mTLS on BOTH listeners
      # (RequireAndVerifyClientCert), so without this edge every /storage/v1/* call
      # fails the handshake. SERVER_NAME is derived from the dial-host
      # (kacho-storage.kacho.svc ∈ the storage server-cert SAN).
      storage: true

# ─── kacho-vpc ──────────────────────────────────────────────────────────────
vpc:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: authn.mode).
  authMode: production
  repository:
    postgres:
      sslMode: require
  # Defense-in-depth: lock the vpc internal :9091 listener to api-gateway only
  # (umbrella templates/networkpolicy-vpc-internal.yaml). Empty adminPodsSelector
  # → no extra admin pods; widen per cluster via a per-cluster overlay if needed.
  networkPolicy:
    enabled: true
    adminPodsSelector: {}
  # AuthZ: per-RPC IAM Check (default iamEndpoint kaname-internal:9091),
  # FGA-filtered List ON + fail-closed, write-side FGA ON. Ручки обхода у vpc
  # больше нет: контур поднимает общий носитель (pkg/servicehost), который ставит
  # звено решения о доступе всегда, поэтому отменять его нечем.
  authz:
    # Кто вправе ПЕРЕДАВАТЬ личность конечного пользователя (x-kacho-principal-*)
    # на оба листенера vpc. Пустой список НЕ означает «никому»: contract corelib
    # сужает круг только на непустом, поэтому пустой означает «любой пир с
    # сертификатом внутреннего CA может действовать от имени любого тенанта». vpc
    # отказывается стартовать в боевом режиме на пустом списке; здесь он назван
    # явно, чтобы правка чарта его не уронила молча.
    #
    # Список — по ФАКТИЧЕСКИМ отправителям, найденным по графу вызовов, а не по
    # догадке «наверное только шлюз»: сузив до шлюза, мы сломали бы привязку
    # интерфейса и резолв подсети у compute и резолв подсети/адреса/группы у nlb.
    trustedForwarderSANs:
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway      # тенантский REST → :9090
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-compute          # NIC attach/detach, резолв подсети
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-nlb              # резолв subnet/address/SG/NIC
      # Здесь стояла запись оператора сети — компонента с таким именем в дереве нет,
      # и репозитория под него не существует. Круг доверенных отправителей пинится по
      # ФАКТИЧЕСКИМ отправителям: запись под несуществующего разрешала бы говорить за
      # пользователя предъявителю сертификата, которого мы не выпускаем. Появится
      # компонент — запись вернётся вместе с его кодом (решение владельца 2026-08-09).
    listFilter:
      enabled: true
      failOpen: false
  # mTLS: server (gateway/compute/nlb dial here) + client (vpc→iam, vpc→geo).
  mtls:
    enable: true
    edges:
      iamRegister: true
      iamProject: true
      iamAuthz: true
      # vpc→geo ZoneService.Get (Subnet/AddressPool zone_id validation). BOOT
      # REQUIREMENT: vpc's ValidatePeerTransport refuses to start in production
      # when the geo peer edge is configured but neither client-mTLS nor TLS is
      # armed — and extapi.geo.endpoint is non-empty by chart default, so the edge
      # is always configured. This slot previously held `compute: true`, a key the
      # vpc chart does not have at all (its edges are iamRegister/iamProject/
      # iamAuthz/geo): a silent no-op that read like coverage while the one real
      # missing edge — and a fatal one — sat unset. vpc→compute is not an edge in
      # the first place; the zone-validation reason for it moved to geo.
      geo: true

# ─── kacho-compute ──────────────────────────────────────────────────────────
# compute has no `mode` knob — it is a pure cluster-internal backend behind the
# gateway. Production posture = mTLS + per-RPC IAM Check (authzIam, non-empty
# grpcAddr) + fail-closed FGA list-filter + DB ssl-mode=require (env escape-hatch:
# the compute Go config reads KACHO_COMPUTE_DB_SSLMODE, default `disable`).
compute:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот.
  #
  # Здесь её НЕ БЫЛО вовсе: посадка приходила умолчанием чарта, и прочитать её
  # по профилю было нельзя. Для профиля, чьё назначение — боевая посадка, это
  # худший из способов её задать: значение верное, а вопрос «в какой посадке
  # работает этот кластер» по нему не отвечается. Значение то же, что и было
  # умолчанием, — меняется не посадка, а её читаемость.
  authMode: production
  # First-class knob, NOT the free-form `env` passthrough. The chart already emits
  # KACHO_COMPUTE_DB_SSLMODE from db.sslMode; setting the same variable through
  # `env` too put TWO entries with the same name in one container's env list — the
  # strategic-merge $setElementOrder hazard this repo has already been bitten by.
  # (The chart default is require; restated so the profile states its own floor.)
  db:
    sslMode: require
  # Non-empty trusted-forwarder allow-list — restated (it IS the chart default) so
  # that no future edit to this profile can silently drop it: empty ⇒ ANY
  # mTLS-verified peer may forge the forwarded end-user principal
  # (confused-deputy / tenant crossing), and production refuses to boot on it.
  auth:
    trustedForwarderSANs: "spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway"
  authzIam:
    grpcAddr: kaname-internal.kacho.svc:9091
  listFilter:
    enabled: true
    failOpen: false
  # mTLS: server (gateway/vpc/nlb dial here) + client (compute→iam, compute→vpc,
  # compute→storage).
  mtls:
    enable: true
    edges:
      iamRegister: true
      iamProject: true
      iamAuthz: true
      vpc: true
      # compute→geo ZoneService.Get (Instance.zone_id validation, :9090). geo runs
      # RequireAndVerifyClientCert on both listeners in this profile, so without
      # this leg compute dials geo with no client cert and every Instance.Create
      # fails zone validation on the handshake. geoAddr is non-empty by chart
      # default, so the edge is always live — it was only ever missing its cert.
      geo: true
      # compute→storage InternalVolumeService (:9091 attach/detach + the Volume
      # mirror on Instance). storage owns volume_attachments, so this edge IS the
      # attach path — with storage enabled below and running server-mTLS, leaving
      # it off makes every attach fail the handshake (fail-closed Unavailable).
      # serverName.storage chart default kacho-storage.kacho.svc ∈
      # the storage server-cert SAN.
      storage: true

# ─── kacho-geo (Geography Region/Zone leaf-service) ─────────────────────────
# Production posture: AUTH_MODE=production (anonymous fail-closed) + DB ssl-mode
# require + mTLS server-creds on BOTH listeners + the geo→iam Check client edge.
# Internal :9091 is NOT exempt (security.md AuthN+AuthZ ВЕЗДЕ). authzIamGrpcAddr
# stays at iam-internal :9091 (non-empty → per-RPC Check interceptor attached).
# Image tag comes from the per-cluster image-tag overlay (placeholder default).
kacho-geo:
  authMode: production
  # BOOT REQUIREMENT: geo's validateSecurityConfig refuses to start in production
  # with an empty trusted-forwarder allow-list — an empty list means "trust ANY
  # mTLS-verified peer to forward the end-user principal", i.e. principal-spoofing
  # straight through to admin Region/Zone CRUD on :9091. The geo chart ships no
  # default (env: {}), so this profile MUST pin it.
  #
  # СОСТАВ — по ФАКТИЧЕСКИМ отправителям, а не «наверное, только шлюз». Справочник
  # размещения читают на пути запроса пять сервисов, и каждый из них форвардит
  # личность инициатора (auth.PropagateOutgoing в его geo-клиенте): vpc и compute
  # (zone_id/region_id), nlb (region_id + зона→регион), storage (зона тома),
  # registry (region_id пространства имён). Отправитель вне круга не «ходит под
  # своим сертификатом» — его форвардленная личность СНИМАЕТСЯ
  # (TrustedPrincipalExtract), и geo видит вызов без принципала: до тех пор пока
  # чтения справочника были освобождены от проверки, это ничего не меняло, а под
  # проверкой отношения `viewer` даёт отказ на живом пути (#916).
  #
  # SAN пишется по сертификату, который пир РЕАЛЬНО предъявляет: у storage
  # пространство имён своё (kacho-storage), и запись «по образцу соседа» не
  # совпала бы — отказ был бы молчаливым.
  env:
    KACHO_GEO_AUTHZ_TRUSTED_FORWARDER_SANS: "spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway,spiffe://kacho.cloud/ns/kacho/sa/kacho-vpc,spiffe://kacho.cloud/ns/kacho/sa/kacho-compute,spiffe://kacho.cloud/ns/kacho/sa/kacho-nlb,spiffe://kacho.cloud/ns/kacho-storage/sa/kacho-storage,spiffe://kacho.cloud/ns/kacho/sa/kacho-registry"
  db:
    sslMode: require
  mtls:
    enable: true
    edges:
      iamAuthz: true
  # S7: one-time compute→geo geography copy is complete; compute no longer owns
  # Region/Zone (tables dropped). geo seeds its own baseline → the migration Job
  # is obsolete and would fail reading the dropped kacho_compute source. Disabled;
  # the gated template stays as a one-time tool (set enabled=true only for a stand
  # that still has legacy compute-side geography to carry across).
  dataMigration:
    enabled: false
    source:
      sslMode: require

# ─── kaname (authz authority + identity tier) ────────────────────────────
kaname:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.authn.mode).
  authMode: production-strict
  # mTLS: server-only (authz authority; gateway/vpc/compute/nlb dial iam).
  mtls:
    # Слушатель :9097 несёт ДВЕ поверхности с разными требованиями. Набор
    # проверочных ключей обязан оставаться доступен без клиентского сертификата
    # (потребитель origin-agnostic), а авторитет отзыва принимает предъявленный
    # токен и обязан знать, кто спрашивает. Поэтому сертификат ЗАПРАШИВАЕТСЯ и
    # верифицируется, если предъявлен, а отказывает сам обработчик авторитета:
    # режим сам по себе ничего не сужает.
    jwksProxyClientAuthMode: optional-mutual
    enable: true
    # Server-side TLS for the HTTP hooks (:9092) + /metrics (:9095) listeners is
    # ON in prod (kacho-iam#137, supersedes the OFF-gate #122/#136), reusing the
    # SEC-F server cert — no new PKI.
    #
    # WHY ON in server-tls-only mode: the hooks edge carries FOUR HMAC-authed Ory
    # webhook endpoints (Hydra token/refresh + Kratos provision/recovery); every
    # caller is an HTTP client that presents NO transport client-cert (Ory webhooks
    # cannot). A single server-tls-only mode on :9092 covers all four — it
    # encrypts the transport + authenticates the server, while HMAC
    # (X-Kacho-Hook-Token) remains the caller-auth (defense-in-depth). The metrics
    # edge has no scrape client cert wired → server-tls-only too. mutual
    # (RequireAndVerifyClientCert) stays available per edge via {hooks,metrics}
    # ClientAuthMode when a client cert is provisioned. The prod Hydra OAuth2
    # token/refresh webhook URLs are flipped to https://…:9092 and the Hydra pod
    # mounts the internal-CA bundle so it trusts the kaname server cert (below).
    httpListeners: true
    # Both HTTP edges run server-tls-only (default; restated here for prod clarity).
    hooksClientAuthMode: server-tls-only
    metricsClientAuthMode: server-tls-only
  kacho:
    iam:
      # Route to the provider's ADMIN API. DECLARED, never derived: the fallback
      # derivation yields the PUBLIC ingress hostname, which does not resolve
      # in-cluster — and because a derivation is never empty, the facade read as
      # configured on this profile, which never declared it at all. A
      # production-class iam now refuses to start in that state.
      #
      # Over TLS with the anchor pinned, for the same reason the gateway's hop is:
      # every OAuth2 client registration, trust grant and session teardown carries
      # the administrative bearer here, and the admin API it opens authenticates
      # nobody. The anchor is the internal-CA bundle already mounted for mTLS —
      # the same CA that signs the provider's admin certificate.
      hydraAdminUrl: "https://kacho-umbrella-hydra-admin-tls.kacho.svc:4445"
      hydraAdminCaFile: /etc/kaname/tls/server/ca.crt
      # The two hops to the provider's PUBLIC listener, DECLARED for the same
      # reason and by the same rule as the admin one above — and they were the
      # half this profile still left to the derivation.
      #
      #   hydraJwksUrl  — the keyset iam mirrors on its cluster-internal :9097 is
      #                   the data-plane's ONLY anchor for deciding whether a token
      #                   was signed by the provider. Derived, it named the public
      #                   ingress host: in-cluster that does not resolve, so the
      #                   mirror fail-closes 502 and every docker pull is a 401 —
      #                   with nothing at start-up saying why. The gateway's own
      #                   copy of this address (api-gateway.hydra.jwksUrl, above in
      #                   this file) has pointed at the in-cluster Service all
      #                   along; this is the same address for the same reason, and
      #                   it was simply missing here.
      #   hydraTokenURL — the client_credentials exchange the `/iam/token` shim and
      #                   the bootstrap mint post to. Derived, it named the public
      #                   ingress host too.
      #
      # TRANSPORT: plain http, deliberately and temporarily. The provider serves
      # its public listener without TLS on every profile, and giving it one is not
      # a knob — the per-listener override was MEASURED absent on 2026-07-30 (see
      # deploy/helm/umbrella/templates/hydra-admin-certificate.yaml), so the shared
      # serve.tls must move, which moves the ingress, this mirror and the token
      # endpoint together. That is its own change with its own acceptance. What is
      # already in place for it: iam can now be given a pinned anchor for BOTH hops
      # (hydraJwksCaFile / hydraTokenCaFile), and production REFUSES TO START if
      # either address is https without one — so the flip cannot land half-done,
      # verifying against the system roots.
      hydraJwksUrl: "http://kacho-umbrella-hydra-public.kacho.svc:4444/.well-known/jwks.json"
      hydraTokenURL: "http://kacho-umbrella-hydra-public.kacho.svc:4444/oauth2/token"
      # Machine-credential lifetime, production posture.
      #
      # accessTokenTtl pins `access_token_lifespan` ON EACH SA-key OAuth2 client
      # instead of letting it inherit the provider-global TTL. The global TTL is
      # now set (hydra.hydra.config.ttl below) — this is the second, per-client
      # layer, so a future regression in the global value cannot silently extend
      # the life of tokens minted from machine credentials. It matches the
      # documented 15m production access-token lifetime.
      #
      # defaultTtl / maxTtl are inherited from the chart defaults (90d / 365d):
      # a key issued without an explicit ttl_seconds still expires, and no caller
      # can mint one that outlives a year.
      saKey:
        accessTokenTtl: "15m"
  config:
    repository:
      postgres:
        # production-strict (below) enforces ssl-mode ∈ {require,verify-ca,verify-full}.
        sslMode: require
    # production-strict → Bearer required; Config.Validate also requires the
    # AuthN secrets (KANAME_HOOK_TOKEN + KANAME_JWKS_ENC_KEY) — wired via
    # secretKeyRef (kacho.hooks.* / kacho.iam.jwks.*); operator provisions them.
    authn:
      # Who may FORWARD an end-user identity (x-kacho-principal-*) to iam.
      # Restated here even though the chart default already carries it: an EMPTY
      # list does not mean "nobody" — the corelib contract narrows the circle only
      # when the list is non-empty, so empty means "any peer holding an internal-CA
      # certificate may act as any tenant". iam refuses to boot in production on an
      # empty list, and stating it in the production profile means no future edit
      # to the chart default can quietly drop it. WHICH RPC each sender may reach
      # is decided in code (authzguard.PublicPeerCallableRPCs /
      # GatewayFrontedInternalRPCs), not here.
      trustedForwarderSANs:
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-vpc
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-compute
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-nlb
        - spiffe://kacho.cloud/ns/kacho-storage/sa/kacho-storage
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-registry
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-geo

      # СВОЯ ЧЕКАНКА ТОКЕНОВ (F1, задача #897)
      #
      # Контур выдачи докер-токена переводится на НАШ подписант: обе его стороны
      # наши, и подписант без производственного вызывающего — тот же класс, что
      # хранилище без читателя.
      #
      # Каждое значение обязательно: незаданный издатель означает «любой»,
      # пустой перечень допустимых алгоритмов означает «принимаем любой», а
      # вырожденный путь записи набора превращает стража источника в проверку,
      # неспособную упасть.
      tokenSigning:
        enabled: true
        issuer: "https://kaname.kacho.local"
        algorithm: ES256
        allowedAlgorithms: "ES256,RS256"
        keySetPath: /.well-known/kaname/jwks.json
      # ТОКЕН-ЭНДПОИНТ ПЛАТФОРМЫ (F2, задача #898)
      #
      # Клиент предъявляет подписанное утверждение, мы сверяем подпись открытым
      # ключом из своего же реестра и выдаём токен доступа НАШИМ подписантом.
      # Эндпоинт монтируется на уже объявленную внешне досягаемую поверхность
      # выдачи и своего слушателя не заводит.
      #
      # Каждая ручка ниже обязательна, как только эндпоинт включён, и каждая
      # невидима на положительном пути: пустой перечень адресатов означает
      # «выдаём токен, адресованный чему угодно», нулевой потолок тела — «читаем
      # сколько прислали». Страж старта отказывает в пуске на любой из них.
      #
      # АДРЕСАТ КРАЯ СТОИТ В ПЕРЕЧНЕ — ИНАЧЕ ВТОРАЯ ПОЛОСА НЕИСПОЛНИМА (#1014).
      # Край принимает нашего издателя (`api-gateway.tokenAcceptance.platformIssuer`),
      # но токен — только с адресатом `https://` + `kacho.domain`. Перечень называл
      # один адресат — реестр, — поэтому токен нашей чеканки отвергался краем ПО
      # АДРЕСАТУ, не дойдя до проверки подписи.
      #
      # Здесь стояло «умолчание не тронуто: докерная полоса по-прежнему получает
      # адресат реестра, не называя его». Умолчания больше нет, и оно не было
      # адресатом реестра: реестр объявлял другое имя (задача #1184).
      clientToken:
        enabled: true
        # АДРЕСАТ ДОКЕРНОЙ ПОЛОСЫ НАЗВАН ЗДЕСЬ ЯВНО (задача #1184). Прежде тут
        # стоял `registry.kacho.local` — встроенное умолчание процесса iam, — а
        # реестр объявлял докер-клиенту `registry.in-cloud.io`. Стороны полосы
        # расходились, и это было НЕВИДИМО: клиент echo-ит услышанное от
        # реестра, подписант чеканил что просят, перечень сверял третье имя,
        # которого не называл никто. Со сверкой адресата то же расхождение
        # означает отказ во входе докера, поэтому перечень называет ДЕЙСТВУЮЩЕЕ
        # имя полосы — то самое `global.kacho.registry.serviceAud`.
        allowedAudiences: "https://api.kacho.cloud,registry.in-cloud.io"
        # АДРЕСАТ ПО УМОЛЧАНИЮ — ЧЛЕН ПЕРЕЧНЯ ВЫШЕ, и это проверяет страж старта.
        #
        # Здесь оставалось `registry.kacho.local` — имя снятого встроенного
        # умолчания процесса iam. Перечень #1184 перевёл на действующее имя
        # полосы, а его двойника — нет, и две величины ОДНОГО профиля разошлись:
        # адресат по умолчанию отвергался бы нашей же сверкой, то есть выдача не
        # работала бы НИ ПРИ КАКОМ входе, где адресат не назван (`api-conventions.md`
        # §«ДВА ПРАВИЛА ОБ ОДНОМ ПОЛЕ»). Страж старта iam именно это и говорит,
        # поэтому под не доходил бы до готовности, а стенд — до подъёма.
        #
        # Значение — действующее имя полосы, то самое `global.kacho.registry.serviceAud`:
        # запрос докерной полосы адресата не называет и получает этот.
        defaultAudience: "registry.in-cloud.io"
        tokenTtl: "15m"
        bodyCeiling: 65536
  # ── ДОСТАВКА МАНИФЕСТОВ МОДУЛЕЙ (kacho#1875 · #1901 · #1909) ────────────
  #
  # Манифест модуля объявлен источником истины о том, что у платформы
  # существует, и до работающей службы он доезжает ИМЕНОВАННЫМ ConfigMap, а не
  # запечённым в образ файлом: запечённый оставлял бы отзыв модуля релизом iam,
  # то есть не решал бы того, ради чего доставка заводится.
  #
  # ПОЧЕМУ ЭТО ОБЪЯВЛЕНО И НА БОЕВОЙ ПОСАДКЕ. До #1909 доставку объявляли
  # четыре стенда из шести — ровно те, чья цепочка несёт `values.dev.yaml`.
  # Опора на манифест модуля была тем самым выразима ТОЛЬКО на стенде, а это
  # режим, годный только для стенда (ban #14, #16): боевая посадка отличалась от
  # стендовой по оси, которую никто не решал. Расхождение полос одного механизма
  # — находка, а не умолчание (`architecture.md` §«Параллельные полосы одного
  # механизма обязаны сверяться МЕЖДУ СОБОЙ»).
  #
  # ЧТО ЭТО ОБЪЯВЛЕНИЕ ТРЕБУЕТ ОТ ПУТИ ВЫКАТКИ. Объект обязан существовать ДО
  # первого прогона helm: процесс читает каталог на старте и на пустом
  # отказывается подниматься. Оба пути выкатки боевых посадок это делают —
  # `make stack-up` (стенд `prod`) и `helm/umbrella/cutover-fe3455.sh` (площадка
  # `fe3455`) зовут `make module-manifests-configmap` перед helm, и это держит
  # гейт `TestEveryUmbrellaBringUpPathCallsTheManifestProducer`, чья популяция
  # ВЫВОДИТСЯ обходом дерева, а не выписана именами целей.
  #
  # ЧТО ПРОВЕРЕНО И ЧТО НЕТ — названо порознь, а не словом «покрыто». Третья
  # часть предиката #1909 («на ПОДНЯТОЙ площадке даёт зелёный старт, а не
  # отказ») разложена надвое, и большая половина закрыта в дереве:
  #
  #   производитель даёт годный объект для боевой цепочки
  #   (`TestModuleManifestConfigMapHasAProducer`), а его вывод раскладывается
  #   ТАК ЖЕ, как это делает kubelet, и читается ТЕМ ЖЕ кодом, которым читает
  #   старт службы (`TestEveryStackDeliversWhatTheStartupReaderAccepts`,
  #   services/iam/internal/manifest). Популяция круга ВЫВОДИТСЯ из таблицы
  #   стендов, поэтому боевая цепочка входит в него наравне со стендовой. До
  #   этого круг был приколочен к одному профилю разработки и о боевой полосе
  #   не утверждал НИЧЕГО — by construction, а не по недосмотру; та же инъекция,
  #   которую выведенная популяция называет по имени стенда, прежней формой не
  #   находилась вовсе (прогон «слепота прежней формы» в соседнем файле
  #   доказательства).
  #
  # НЕ проверено ровно одно звено — сам kubelet: раскладка тома в пробе
  # ВОСПРОИЗВЕДЕНА, а не смонтирована. Что том объявлен и доезжает до процесса,
  # судит `TestIAMChartDeliversModuleManifestsToTheProcess`; что путь выкатки
  # кладёт объект ПЕРЕД helm — `TestEveryUmbrellaBringUpPathCallsTheManifestProducer`.
  manifests:
    # Имя объекта — ОДНО объявление на производителя и на чарт: производитель
    # читает его отсюда же, из тех же профилей, что получает helm.
    configMapName: kacho-module-manifests
    # Опора объявлена. Вместе с именем выше это ПАРА, и страж старта отвергает
    # её неполной В ОБЕ СТОРОНЫ (kacho#1924): «опираемся, а каталог не назван» —
    # отказ; «каталог назван, а опоры нет» — тоже отказ. Здесь прежде стояло
    # «при названном каталоге величина инертна»: это было верно и было ДЕФЕКТОМ,
    # а не решением — величина принимала значение, которое ничего не меняет.
    # Снимается доставка опустошением ИМЕНИ, а не отзывом опоры; половину пары
    # ловит проверка объявлений до всякого кластера
    # (`TestEveryStackDeclaresTheManifestPairWhole`), а не kubelet боевой площадки.
    required: true
# ─── kacho-nlb (L4 NLB control-plane) ───────────────────────────────────────
# Enabled in production; condition-gated pieces (sub-chart + its Postgres) on.
kacho-nlb:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.mode).
  # production mode: peer-рёбра обязаны быть mTLS, DSN — с sslmode ∈
  # require/verify-ca/verify-full, per-object фильтр списков обязателен и
  # fail-closed. Ручки аварийного обхода авторизации у nlb НЕТ: звено решения
  # о доступе ставится безусловно, отключить его нечем. Здесь стояло
  # `breakglass: false` — строка, которую оператор читает как «обход закрыт»,
  # при том что её не читал ни шаблон чарта, ни описатель настроек процесса.
  authMode: production
  enabled: true
  # mTLS: server (gateway dials here) + client (nlb→iam, nlb→vpc, nlb→compute).
  mtls:
    enable: true
    edges:
      iamRegister: true
      iamProject: true
      vpc: true
      compute: true
      # nlb→geo RegionService.Get (LoadBalancer/TargetGroup region_id validation).
      # BOOT REQUIREMENT: nlb's peer-edge guard demands a secure transport for
      # every CONFIGURED peer edge, and extapi.geo.addr is non-empty by chart
      # default with tls:false — so an unset geo edge is refuse-to-start, not just
      # a broken dial. geo also serves RequireAndVerifyClientCert here.
      geo: true
  db:
    # The nlb chart default host is `kacho-pg-nlb`, which assumes the release is
    # named `kacho`; this release is `kacho-umbrella`, so the real Service is
    # kacho-umbrella-pg-nlb and the default resolves to nothing — the goose
    # migrator init-container fails DNS and the pod never starts. Exactly the
    # trap that storage's db.host below was written to avoid; nlb was missed
    # because the correct host happened to come from the dev profile, which this
    # production layer does not inherit.
    host: kacho-umbrella-pg-nlb
    sslMode: require
    # No plaintext password in values — reference an existing Secret (key
    # `password`). Operator provisions kacho-umbrella-pg-nlb (or override the
    # name per cluster). Same Secret the pg-nlb instance is configured with below.
    existingSecret: kacho-umbrella-pg-nlb
    existingSecretKey: password
  config:
    authz:
      # BOOT REQUIREMENT: non-empty when mode=production AND mtls.enable=true.
      # The chart default is [] — "trust any mTLS peer to forward the end-user
      # principal" — which production refuses to start on. Only api-gateway
      # legitimately forwards a principal.
      trustedForwarderSANs:
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway

# ─── kacho-storage (block-storage control-plane) ────────────────────────────
# Volume / VolumeAttachment / Snapshot / Image / DiskType. Enabled in production:
# storage owns block storage (data-integrity.md ownership map) and owns
# `volume_attachments`, so compute's attach path terminates here. The sub-chart and
# its Postgres are condition-gated and OFF in base values — this profile is the one
# that must turn them on, otherwise the canonical production install has no block
# storage at all and the compute-side duplicate cannot be retired.
#
# storage carries a real production boot-guard (Config.Validate, refuse-to-start),
# so every knob below is load-bearing, not decorative — the pod CrashLoopBackOffs if
# any of them is missing:
#   authMode=production           → arms the guard itself
#   db.sslMode ∈ require|verify-* → plaintext DB refused
#   mtls.enable                   → mTLS demanded on BOTH listeners (:9090 + :9091)
#   config.authzIamGrpcAddr       → per-RPC IAM Check interceptor attached
#   config.listFilter.enabled     → per-object visibility filter. It guards two
#                                   surfaces, and they do not cost the same:
#                                   public List keeps a project-tier per-RPC Check
#                                   behind it (without the filter a project-tier
#                                   viewer sees every volume/snapshot/image), but
#                                   InternalVolumeService/ListAttachments is
#                                   ScopeFiltered — no per-RPC Check at all — so
#                                   there the filter is the ONLY gate
#   config.listFilter.failOpen    → must stay false. An enabled filter that hands
#                                   back the whole page on the first iam error
#                                   protects no more than a disabled one; it just
#                                   switches off later, during someone else's
#                                   outage. Production refuses to boot on true
#                                   while any ScopeFiltered entry exists
#   config.trustedForwarderSANs   → who may forward an end-user identity (without it
#                                   any certificate-verified peer may act as any tenant)
storage:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.authMode).
  authMode: production
  enabled: true
  config:
    # Runtime peer edges. storage→geo (ZoneService.Get for zone_id + the zone's
    # region, which is never derived from the zone name) and storage→iam PUBLIC
    # :9090 (ProjectService.Get) — both fail-closed when unset.
    geoGrpcAddr: kacho-geo.kacho.svc:9090
    iamGrpcAddr: kaname.kacho.svc:9090
    # iam INTERNAL :9091 — carries BOTH the per-RPC Check and the fga-register
    # RegisterResource/UnregisterResource owner-tuple edge.
    authzIamGrpcAddr: kaname-internal.kacho.svc:9091
    # Who may forward an end-user identity (x-kacho-principal-*) into storage.
    # Restated (it IS the chart default) so that no future edit to this profile can
    # silently drop it: an EMPTY list does not mean "nobody" — corelib narrows the
    # circle only when the list is non-empty, so empty means ANY certificate-verified
    # peer may present someone else's identity and have the authorization decision
    # made in that tenant's name. Production refuses to boot on an empty list.
    #
    # BOTH entries are load-bearing:
    #   kacho-api-gateway → public :9090 (tenant requests)
    #   kacho-compute     → internal :9091 (volume attach/detach runs under the
    #                       identity of whoever initiated it) — drop it and volume
    #                       attach breaks.
    trustedForwarderSANs: "spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway,spiffe://kacho.cloud/ns/kacho/sa/kacho-compute"
    # Per-object visibility filter. Both knobs are restated here (they ARE the
    # chart defaults) so that no future edit to this profile can quietly relax
    # either one: `enabled: false` removes the filter, and `failOpen: true`
    # removes it on the first iam error — for the ScopeFiltered attachment
    # listing those are the same outcome, because nothing else gates it.
    # The service refuses to boot on either, so an edit here does not silently
    # degrade the stand; it stops it.
    listFilter:
      enabled: true
      failOpen: false
    # Owner-tuple register-drainer (SEC-D / CS-1 GAP-D). Chart default is already
    # true; restated because without it the gateway scope_extractors
    # {storage_volume,volume_id} / {storage_snapshot,snapshot_id} cannot resolve
    # target→project and own-resource access breaks (anti-BOLA).
    fgaRegisterDrainerEnabled: true
    # Плоскость данных: ЧЕМ обслуживается блочное хранение.
    #
    # В боевом режиме объявление обязательно, и сервис ОТКАЗЫВАЕТСЯ стартовать
    # без него. Что означала бы пустая ручка: сверщик не запускается, ничто не
    # переводит ресурс из намерения в пригодность, КАЖДЫЙ том остаётся
    # создаваемым навсегда — при здоровом рапорте сервиса и пройденной проверке
    # готовности. Ровно тот класс, ради которого боевой страж существует.
    #
    # installPrefix отличает объекты ЭТОГО развёртывания от объектов соседнего
    # облака в общем кластере хранения. Имена объектов выводятся из неизменяемых
    # идентификаторов ресурсов, поэтому два облака с одним префиксом вывели бы
    # ОДНИ И ТЕ ЖЕ имена и усыновили объекты друг друга: удаление в одном
    # уничтожило бы данные в другом. Значение подставляется под конкретную
    # установку — здесь стоит место для него, а не готовый ответ.
    #
    # credentialsDir — каталог, в котором разрешаются ССЫЛКИ на учётный материал.
    # Сам материал монтируется секретом и не проходит ни через API, ни через БД:
    # строка ресурса переживает ротацию и уезжает в резервные копии.
    blockBackend:
      kind: CEPH_RBD
      installPrefix: kachoprod
      credentialsDir: /etc/kacho/storage/credentials
      callTimeout: 30s
      reconcileInterval: 15s
      reconcileBatch: 100
  db:
    # bitnami pg-storage below. The chart default host (kacho-storage-postgres)
    # does not exist in the umbrella — the migrator init-container would fail DNS.
    host: kacho-umbrella-pg-storage
    sslMode: require
    # No plaintext password in this profile — the chart references the Secret the
    # pg-storage instance is configured with (key `password`) via secretKeyRef.
    passwordSecretName: kacho-umbrella-pg-storage
    passwordSecretKey: password
  # server-mTLS on both listeners (gateway + compute dial here) + client-mTLS
  # storage→{geo,iam}. One client leaf (kacho-storage-client-tls) serves every
  # storage→iam dial: serverName kaname.kacho.svc is in the iam
  # server-cert SAN, valid for :9090 and internal :9091 alike.
  mtls:
    enable: true
    edges:
      geo: true
      iam: true

# ─── kacho-registry (OCI/Docker registry control-plane + data-plane) ────────
# Registry / Repository / Tag over a bundled zot storage backend. Enabled in
# production for the same reason storage was: the sub-chart and its Postgres are
# condition-gated, base values.yaml carries NO `registry` key at all, and this
# profile never set one — so the canonical production install shipped WITHOUT AN
# IMAGE REGISTRY. Worse than merely off: with the condition path undefined, the
# posture the profile hands to a per-cluster overlay is the bare chart default
# (mTLS off, all three peer edges off, db sslmode=disable), so a downstream
# overlay that only flips `enabled: true` gets an INSECURE registry.
#
# registry carries real production boot-guards (serve.go), so every knob below is
# load-bearing — the pod refuses to start without them:
#   authMode + breakglass=false → arms the guards; breakglass is fatal in prod
#   mtls.enable                 → mTLS demanded on BOTH listeners (:9090 + :9091)
#   authz.iamGrpcAddr           → per-RPC IAM Check interceptor attached
#   iam.jwksUrl (https)         → requireSecureJWKSURL
#   hydra.issuer (non-empty)    → requireIssuerPinned
#   dataplaneTLSTerminatedExternally → requireDataplaneTLSAck
#   db.sslmode ∈ require|verify-* → production-strict refuses plaintext DB
registry:
  enabled: true
  # production-strict — the same floor iam and the gateway run at. Satisfiable
  # here because pg-registry serves TLS (mtls.pgTls.services includes registry),
  # so the DB leg is encrypted rather than conceded.
  authMode: production-strict
  # ─── Хранилище слоёв: аутентификация + сегментация ──────────────────────────
  # zot тенантов не различает — он хранит слои по path-префиксу. Пока его порт
  # отвечал любому, кто до него дозвонился, весь per-request контроль плоскости
  # данных (подпись docker-Bearer'а, Check, сокрытие существования, запрет
  # разрушительного DELETE) обходился ОДНИМ хопом из сети подов. Соседним
  # хранилищам этот профиль защиту уже выдавал (networkPolicy.datastore и
  # opaSidecar.networkPolicy ниже) — теперь она есть и у третьего.
  #
  # ⚠ ШАГ ОПЕРАТОРА: Secret `zot-auth` (ключи username/password/htpasswd, где
  # htpasswd — bcrypt-строка `<user>:$2y$…` того же пароля) провизионится ВНЕ git,
  # как `zot-s3-creds`. Без него поды zot и registry не запустятся — это намеренно:
  # чарт не умеет разворачивать открытое хранилище, а registry в production-режиме
  # отказывается стартовать без учётных данных (requireZotCredentials).
  zot:
    auth:
      existingSecret: zot-auth
    networkPolicy:
      enabled: true
  db:
    # Chart default host (kacho-umbrella-pg-registry) and existingSecret are
    # already correct for this umbrella — only the ssl floor needs stating.
    sslMode: require
  authz:
    # Restated (they ARE the chart defaults) because all three are fail-closed:
    # an empty address does not degrade, it refuses to boot or refuses the call.
    iamGrpcAddr: kaname-internal.kacho.svc:9091
    iamProjectGrpcAddr: kaname.kacho.svc:9090
    geoGrpcAddr: kacho-geo.kacho.svc:9090
    # Who may forward an end-user identity (x-kacho-principal-*) into registry.
    # Restated (it IS the chart default) so that no future edit to this profile can
    # silently drop it: an EMPTY list does not mean "nobody" — corelib narrows the
    # circle only when the list is non-empty, so empty means ANY certificate-verified
    # peer may present itself as any tenant, and the authorization decision is then
    # made in that tenant's name. Any production mode refuses to start on empty.
    # One entry, because the import graph shows exactly one sender: the api-gateway,
    # which dials BOTH registry listeners.
    trustedForwarderSANs: "spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway"
    # breakglass bypasses per-RPC authz Check AND mTLS on both listeners; any
    # production mode refuses to start with it on. Pinned off explicitly.
    breakglass: false
  # Data-plane docker-Bearer verification: keys come from the cluster-INTERNAL
  # kaname JWKS proxy (:9097) over https — NOT from Hydra directly. iam is the
  # single facade to Hydra (core rule #16); Hydra remains the token SIGNER, only
  # key DISTRIBUTION goes through iam. https is required by requireSecureJWKSURL,
  # and the chart default is http:// — which fails the guard.
  # Приём identity-JWT: издатель — МНОЖЕСТВО (F1, задача #897)
  #
  # Платформа чеканит свои токены сама, а прежний издатель на переходе остаётся,
  # поэтому принимаемых издателей двое и у КАЖДОГО своя запись источника ключей.
  # Объединять наборы в один документ дешевле и уничтожило бы ровно ту защиту,
  # ради которой развязка заводится: ключ одного издателя проверял бы токен,
  # объявляющий другого.
  #
  # Прежние ручки `registry.iam.jwksUrl` и `registry.hydra.issuer` СНЯТЫ, а не
  # оставлены мостом: мост был бы вторым местом об одном предмете и обессмыслил
  # бы то, ради чего смена вообще видна при старте — пересмотр пина издателя.
  # Профиль, задающий только снятые имена, принимает НОЛЬ издателей и не
  # поднимается.
  tokenAcceptance:
    issuers: "https://kaname.kacho.local,https://hydra.api.kacho.cloud"
    # Адрес ОБЪЯВЛЯЕТСЯ, а не выводится из издателя: издатель приходит от
    # предъявителя, и производный адрес получался бы у ВСЯКОГО издателя —
    # состояние «записи нет» не наступало бы никогда, а страж старта стал бы
    # тождественно истинным.
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json,https://hydra.api.kacho.cloud=https://kaname-internal.kacho.svc:9097/.well-known/jwks.json"
    # Наш издатель выбирает полосу приёма: тип at+jwt и чтение отзыва на
    # предъявлении. Вне issuers — отказ в старте.
    platformIssuer: "https://kaname.kacho.local"
    # Авторитет отзыва. Контроль, действующий на выдаче и не действующий на
    # предъявлении, отзывом не является: он лишь не выдаёт нового, а
    # предъявленное проходит до истечения срока, и это состояние не сходится
    # само.
    revocationUrl: "https://kaname-internal.kacho.svc:9097/internal/tokens/introspect"
  # Operator acknowledgement that the plaintext data-plane :8080 listener sits
  # behind external TLS termination — bearer identity-JWTs must not transit
  # cleartext. Required by requireDataplaneTLSAck in any production mode.
  dataplaneTLSTerminatedExternally: true
  # NB (per-cluster): tokenRealm / serviceAud / endpointBase keep their chart
  # defaults, which carry a concrete OCI hostname. They are tenant-facing DNS, not
  # security posture — set them in the per-cluster overlay alongside kacho.domain,
  # the same way image tags are layered.
  #
  # server-mTLS on both listeners (the gateway dials both) + client-mTLS
  # registry→{iam,geo}. iam and geo both run RequireAndVerifyClientCert in this
  # profile, so each client leg is what makes the edge work at all — unset means
  # every Check / ProjectService.Get / RegionService.Get dies on the handshake.
  mtls:
    enable: true
    edges:
      iamAuthz: true
      iamProject: true
      geo: true
      # Авторитету отзыва присылают ПРЕДЪЯВЛЕННЫЙ токен, поэтому хоп к нему идёт
      # под клиентским сертификатом. Набор проверочных ключей с того же
      # слушателя по-прежнему берётся БЕЗ сертификата: его origin-agnostic
      # свойство и есть причина, по которой ребро не делается взаимным целиком.
      tokenRevocation: true

# ─── Per-service Postgres (database-per-service) — credentials via existingSecret ─
# NO plaintext passwords in this profile. Each bitnami pg instance reads its
# password from an existing Secret the operator provisions out-of-band (keys
# `password` + `postgres-password`). username/database stay here (non-secret).
# Override the Secret names per cluster via a layered overlay if they differ.
#
# Each kacho-owned instance also SERVES TLS, consuming the cert-manager Secret
# issued by mtls.pgTls above (kacho-umbrella-pg-<svc>-server-tls). This is the
# server side of the ssl-mode=require floor: without it the services' `require`
# has nothing to negotiate with and every connection is refused. Server-auth
# only — deliberately NO certCAFilename (see the mtls.pgTls note).
# ВКЛЮЧЁННЫЙ TLS — ЭТО ПРЕДЛОЖЕНИЕ, А НЕ ТРЕБОВАНИЕ (выведено из #121).
# `tls.enabled` заставляет сервер УМЕТЬ шифровать, но правила доступа bitnami по
# умолчанию — `host`, а `host` матчит соединение и с TLS, и без него: шифрование
# держится ровно на том, что каждый клиент помнит про `sslmode`. Пропуск виден
# только со стороны СУБД (`pg_stat_ssl`), постфактум и только пока клиент
# подключён — поэтому виновника ночной находки #121 установить уже не удалось.
# Требование перенесено на СЕРВЕР: незашифрованные соединения ПО СЕТИ он больше
# не принимает. Петля и unix-сокет оставлены открытыми намеренно — сети там нет,
# и через 127.0.0.1 ходят пробы готовности чарта (`pg_isready -h 127.0.0.1`).
# Гейт — deploy/dbhba_tls_required_test.go.
#
# ЛОКАЛЬНЫЙ ПУТЬ И ПЕТЛЯ — БЕЗ ПАРОЛЯ, ИНАЧЕ БАЗА НЕ ПОДНИМЕТСЯ ВОВСЕ (#195).
# Здесь стоял `md5`, и с ним профиль не поднимал НИ ОДНОЙ базы на кластере без
# сохранённого тома. Причина — порядок: первичная настройка обязана подключиться
# к своей же базе по сокету и петле, чтобы ЗАДАТЬ пароль, и делает это ДО того,
# как пароль существует. Требование пароля в этот момент замыкает круг, а отказ
# при этом НЕМОЙ — вывод первичной настройки уходит в никуда, контейнер
# завершается без строки о причине. На стенде с сохранённым томом первичная
# настройка пропускается целиком, поэтому профиль выглядел рабочим.
# `trust` здесь не послабление: сокет и петля живут в сетевом пространстве самого
# пода, снаружи к ним не подключиться. Граница безопасности проходит по сети и
# закрыта строками ниже — по сети принимается только шифрованное соединение с
# паролем, нешифрованное отвергается явно.
pg-vpc:
  auth:
    username: vpc
    database: kacho_vpc
    existingSecret: kacho-umbrella-pg-vpc
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-vpc-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
  primary:
    pgHbaConfiguration: &pgHbaTLSRequired |
      local     all all                trust
      host      all all 127.0.0.1/32   trust
      host      all all ::1/128        trust
      hostssl   all all 0.0.0.0/0      md5
      hostssl   all all ::/0           md5
      hostnossl all all 0.0.0.0/0      reject
      hostnossl all all ::/0           reject
    # ── ПОСАДКА И БЮДЖЕТ ПАМЯТИ — ВЫБРАНЫ ЗДЕСЬ, А НЕ УНАСЛЕДОВАНЫ (#756) ───
    #
    # Умолчание подчарта postgresql НЕПУСТО и потому обманчиво: `requests`
    # 250m/256Mi, а `limits` — ПУСТЫЕ. Профиль, не объявивший ничего, получает
    # базу БЕЗ предела памяти (она вправе унести узел) и с запросом, под
    # который планировщик поставит её туда, где памяти уже нет. Настройки самой
    # СУБД при этом приезжают из СБОРКИ: max_connections 100, shared_buffers
    # 128MB, work_mem 4MB — их тоже никто не выбирал под эту поставку.
    #
    # Следствие, ради которого блок и появился: стенд, на котором снимали замер
    # пропускной способности, был настроен ЛУЧШЕ боевой поставки — и вывод
    # замера переносился на посадку, где он не проверялся ни разу.
    #
    # ПОТОЛОК И ТРАТА ОБЯЗАНЫ СХОДИТЬСЯ:
    #
    #     shared_buffers + max_connections × work_mem  ≤  limits.memory
    #
    # Здесь: 512MB + 300 × 8MB = 2912MiB ≤ 4Gi. Оценка верхняя и заведомо
    # грубая — work_mem тратится на узел сортировки, а не на соединение, —
    # поэтому она ловит не «сколько израсходуется», а случай, когда две
    # величины назначены не глядя друг на друга. `effective_cache_size` в сумму
    # НЕ входит: это подсказка планировщику о кэше ОС, а не выделение памяти.
    #
    # ПОЧЕМУ 300 СОЕДИНЕНИЙ (#762, уточнено #709, пересчитано #1451). Служба
    # обещает базе произведение, а PostgreSQL резервирует 3 суперпользователю.
    # Умолчание сборки (100) этого не вмещало — то есть отказ в подключении
    # ровно тогда, когда соединения понадобились.
    #
    # Обещание собирается из ТРЁХ чисел, и здесь стояли два. До #709 читалось
    # «пул 200 на реплику», как если бы реплика была одна; после #709 — «40 × 5
    # = 200», как если бы реплика держала ТОЛЬКО пул. Она держит и вне его:
    # поток подписки (16) и дренаж очереди (1), и вычесть их из ширины пула
    # пул не может (#1384). Сегодня это (40 + 16 + 1) × 5 = 285.
    #
    # ПОТОЛОК ПОТОКОВ ЭТУ СВЯЗКУ НЕ РЕШАЕТ, и это посчитано, а не отброшено:
    # пул 40 × 5 = 200 плюс дренаж 5 = 205 из 207 отдаваемых, значит на потоки
    # остаётся 2 на пять подов — подписка невозможна при ЛЮБОМ потолке ≥ 1.
    # Сужать пул запрещает замер (глубина пула решала хвост задержки в 8.7
    # раза), поэтому единственный оставшийся рычаг — предел самой базы.
    #
    # 300 отдаёт 297: 12 сверх обещанного — миграциям старта и опросу
    # готовности. Лишние поды переката (maxSurge не объявлен, значит 25%) этим
    # запасом НЕ покрыты — остаток назван в docs/architecture, а не умолчан.
    #
    # ЧТО ЭТО ДЕРЖИТ: deploy/db_footprint_declaration_test.go (объявлено ли и
    # сходится ли) и deploy/pool_fits_database_test.go (вмещает ли предел базы
    # пул службы). Обе читают ОБЪЯВЛЕНИЯ, а не рендер: значение, приехавшее из
    # умолчания чарта, в манифесте выглядит точно так же, как объявленное.
    #
    # autovacuum_naptime ПОВТОРЁН здесь намеренно: extendedConfiguration —
    # СКАЛЯР, и профиль, объявивший свой, замещает строку базового values.yaml
    # ЦЕЛИКОМ, а не дописывает в неё.
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: 2000m, memory: 4Gi }
    extendedConfiguration: |
      max_connections = 300
      shared_buffers = 512MB
      work_mem = 8MB
      effective_cache_size = 3GB
      autovacuum_naptime = 5s
pg-compute:
  auth:
    username: compute
    database: kacho_compute
    existingSecret: kacho-umbrella-pg-compute
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-compute-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
    # Посадка и бюджет памяти — развёрнутое обоснование у pg-vpc выше.
    # 256MB + 180 × 4MB = 976MiB ≤ 2Gi.
    #
    # ПОЧЕМУ 180 СОЕДИНЕНИЙ, А НЕ УМОЛЧАНИЕ СБОРКИ (#1451). Флот compute обещает
    # базе (15 пул + 16 потолок потоков подписки + 1 дренаж очереди) × 5 подов
    # (autoscaling.maxReplicas) = 160, а умолчание сборки принимает 97. Это не
    # «иногда медленнее»: упереться в предел базы — отказ ВСЕМУ процессу и всем
    # арендаторам сразу, и наступает он ПОД НАГРУЗКОЙ, потому что поды приходят
    # сами. 180 принимает 177 и оставляет 17 сверх обещанного — миграциям старта
    # и опросу готовности, которых арифметика гейта не считает; сверх этого
    # запаса лишние поды переката (maxSurge) не покрыты — см. docs/architecture.
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 2Gi }
    extendedConfiguration: |
      max_connections = 180
      shared_buffers = 256MB
      work_mem = 4MB
      effective_cache_size = 1GB
      autovacuum_naptime = 5s
pg-iam:
  auth:
    username: iam
    database: kaname
    existingSecret: kacho-umbrella-pg-iam
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-iam-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
    # Посадка и бюджет памяти — развёрнутое обоснование у pg-vpc выше.
    #
    # ЭТА база принимает проверку доступа на КАЖДЫЙ запрос КАЖДОЙ службы, и
    # замер показал, что упирается именно она: подъём предела процессора с
    # одного ядра до трёх поднял потолок ОДНОЙ реплики 300 → 500 запросов в
    # секунду без единой правки кода, тогда как +2 реплики службы дали +100
    # (services/iam/tests/k6/results/BASELINE-internal-check.md). Стенд, на
    # котором снят этот замер, объявлял 3000m/2Gi и все три настройки — а
    # боевой профиль не объявлял НИЧЕГО. Ровно это и есть #756.
    #
    # 512MB + 200 × 8MB = 2112MiB ≤ 4Gi.
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: 3000m, memory: 4Gi }
    extendedConfiguration: |
      max_connections = 200
      shared_buffers = 512MB
      work_mem = 8MB
      effective_cache_size = 3GB
      autovacuum_naptime = 5s
pg-geo:
  auth:
    username: geo
    database: kacho_geo
    existingSecret: kacho-umbrella-pg-geo
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-geo-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
    # Посадка и бюджет памяти — развёрнутое обоснование у pg-vpc выше.
    # 256MB + 100 × 4MB = 656MiB ≤ 2Gi.
    #
    # autovacuum_naptime здесь НЕ ставится НАМЕРЕННО: geo_outbox — курсорный
    # аудит-фид по sequence_no, без `sent_at` и без дренажа, поэтому лишние
    # пробуждения launcher'а ему ничего не дают. Решение держит список
    # NON_QUEUE_INSTANCES в deploy/tests/helm/outbox-autovacuum-naptime-test.sh:
    # он покраснеет, если строку сюда добавить.
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 2Gi }
    extendedConfiguration: |
      max_connections = 100
      shared_buffers = 256MB
      work_mem = 4MB
      effective_cache_size = 1GB
# Здесь стоял инстанс `pg-openfga` — выделенная база внешнего движка прав. Он снят
