# values.own-stand.yaml — СЛОЙ ПЛОЩАДКИ СТЕНДА `own` (kacho#2724).
#
# ── ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ СТРОКИ В values.own.yaml ─────────────────────
#
# `values.own.yaml` объявляет ПОСАДКУ ЛИЧНОСТИ и ничего больше — так написано в
# его шапке, и на него ссылаются предикаты четырёх задач. Здесь предмет другой:
# боевой слой НАМЕРЕННО неполон. Он сам говорит об этом вслух («Per-cluster
# URLs/issuers come from a per-cluster overlay layered on top»), и у боевой
# площадки такой слой есть — `values.fe3455-ory.yaml`, вне git и вне машины CI.
# У стенда `own` его не было ни одного, и цепочка `values.prod.yaml +
# values.own.yaml` не поднималась ВООБЩЕ — не из-за посадки личности, а из-за
# пропусков, перечисленных ниже. Сложить два предмета в один файл значило бы
# сделать шапку соседа ложной.
#
# ── ЧТО ЭТОТ СЛОЙ ЗАКРЫВАЕТ И ЧЕГО НЕ ДЕЛАЕТ ───────────────────────────────
#
# Закрывает ровно то, что у боевой площадки приходит слоем площадки: зеркало и
# адреса образов, почтовая полосу и чеканку первичного удостоверения стенда.
# НЕ трогает ни режима, ни mTLS, ни `sslmode` наших служб, ни посадки личности —
# в файле нет ни одного ключа, который судит
# `deploy/scripts/assert-production-posture.sh`. Одна величина здесь ВКЛЮЧАЕТ
# поверхность, и она названа отдельным разделом ниже (чеканка первичного
# удостоверения): у боевой площадки её нет.
#
# Хранилищ поставщиков, переноса их схемы и издателя поставщика здесь больше нет:
# стек поставщика с цепочки `own` снят целиком (kacho#2816, раздел
# «СТЕК ПОСТАВЩИКА НА ЭТОЙ ЦЕПОЧКЕ НЕ ПОДНИМАЕТСЯ» в values.own.yaml).
#
# ── КЛЮЧ ВЕРХНЕГО УРОВНЯ ЗДЕСЬ РОВНО ОДИН НА ПРЕДМЕТ ───────────────────────
#
# YAML не сливает одноимённые ключи одного документа, а ЗАМЕЩАЕТ: второй `global:`
# молча уносит первый целиком. Поэтому величины сгруппированы по ключу верхнего
# уровня, а не по разделу объяснения.

# ─────────────────────────────────────────────────────────────────────────────
global:
  # ─── ЗЕРКАЛО ОБРАЗОВ: СНЯТО, ИНАЧЕ ССЫЛКИ ЧУЖИХ ПОДЧАРТОВ НЕ СУЩЕСТВУЮТ ────
  #
  # `values.yaml` пинит `global.imageRegistry: docker.io/prorobotech` — зеркало
  # НАШИХ образов; ни один наш шаблон его не читает, у нас ссылки выписаны
  # целиком. Но ЧУЖИЕ подчарты (bitnami postgresql) его уважают и подставляют
  # перед СВОИМ `image`: получается `docker.io/prorobotech/bitnami/postgresql`.
  # Таких репозиториев нет — замер 2026-09-21 на узле стенда: `pull access denied,
  # repository does not exist` у всех пяти тогдашних ссылок (три из них были у
  # подчартов поставщика, которых на этой цепочке больше нет — kacho#2816).
  #
  # То же решение и по той же причине уже принято тремя слоями дерева
  # (`values.dev.yaml`, `values.prorobotech.yaml`, `values.fe3455-prod.yaml`) —
  # здесь оно четвёртое, а не новое.
  imageRegistry: ""
  # Чарты bitnami отказываются принимать неканоничное имя репозитория без этого
  # согласия. Оно требуется ровно потому, что вышестоящий перенёс образы в
  # `bitnamilegacy/*`; то же согласие и по той же причине уже дано слоем площадки
  # боевого стенда.
  security:
    allowInsecureImages: true
  kacho:
    identity:
      # ─── ПОЧТОВАЯ ПОЛОСА СТЕНДА ──────────────────────────────────────────
      #
      # Служба личности ОТКАЗЫВАЕТСЯ стартовать с пустой полосой, и отказ верен:
      # замер на стенде 2026-09-21 — «ОТКАЗ: почтовая полоса пуста — ни переменная,
      # ни файл настроек её не несут. Пусто НЕ означает „не доставляем“».
      # Боевая площадка ведёт полосу во внешний ретранслятор, и его адрес приходит
      # слоем площадки; у локального стенда ретранслятора нет, поэтому приёмник
      # поднимается этой же поставкой (`mailpit.enabled` ниже) — тем же блоком и с
      # тем же адресом, что у стенда разработки.
      #
      # ШИФРОВАНИЕ НЕ СНИМАЕТСЯ: схема `smtp://` означает STARTTLS, ни
      # `disable_starttls`, ни `skip_ssl_verify` здесь нет, и приёмник требует
      # STARTTLS сам. Якорь проверки — тот же внутренний удостоверяющий, чей
      # `ca.crt` боевой слой уже называет службе личности переменной
      # `SSL_CERT_FILE`: сертификат приёмника выпускает он же.
      #
      # Имя узла ВЫВОДИТСЯ из имени выпуска, а не выписывается: выписанный литерал
      # был бы третьим местом об одном предмете и расходился бы на всяком релизе,
      # кроме одного (разбор — у того же блока в `values.dev.yaml`).
      smtp:
        connectionURI: 'smtp://{{ .Release.Name }}-mailpit:1025/'
        fromAddress: "noreply@kacho.cloud"
        fromName: "Kacho Cloud"

# ─────────────────────────────────────────────────────────────────────────────
# ЧЕКАНКА ПЕРВИЧНОГО УДОСТОВЕРЕНИЯ СТЕНДА — ВКЛЮЧЕНА ЗДЕСЬ, И ЭТО ПОВЕРХНОСТЬ
#
# Посев стенда (tests/authz-fixtures/prodseed_all.py) добывает первый
# предъявитель — администратора кластера — чеканкой InternalBootstrapTokenService
# на внутреннем порту службы доступа (:9091), а дальше вся матрица идёт через
# наш API. Боевой слой чеканку НЕ включает (ключа подписи нет, круг вызывающих
# пуст — «никто не чеканит»), и цепочка `own` без этого слоя посева не проходит:
# первый предъявитель берётся неоткуда. У локального стенда разработки чеканку
# включает его слой площадки (values.dev-prod.yaml); здесь она включается той же
# парой величин и по той же причине.
#
# ЧТО ЭТО ОТКРЫВАЕТ — названо, а не подразумевается: выдачу удостоверения
# `system_admin` без проверки модели прав. Ворота у неё ровно одни — SPIFFE-имя
# клиентского сертификата вызывающего; сертификат отдельный, только клиентский,
# выпускается зонтом (mtls.bootstrapOperator) и НЕ совпадает с именем края: край
# принимает трафик арендаторов, и «я край» не может быть правом чеканить
# администратора. Ключ подписи чеканки живёт в объекте Secret кластера и
# заводится посевом (`kaname-bootstrap-sa-key`), в git его нет.
#
# Чеканка без круга вызывающих отказывает в старте (страж старта службы), круг
# без ключа не чеканит ничего — поэтому величины стоят парой.
kaname:
  config:
    authn:
      bootstrapMint:
        allowedClientSANs:
          - spiffe://kacho.cloud/ns/kacho/sa/kacho-bootstrap-operator
  platform:
    iam:
      bootstrapToken:
        signingKeySecretName: kaname-bootstrap-sa-key
        signingKeySecretKey: private_key_pem

# Приёмник писем — часть поставки СТЕНДА; боевая площадка его не получает, там
# полоса ведёт во внешний ретранслятор. Величины (образ с дайджестом, аппетит,
# порты, имя секрета) объявлены в `values.yaml`; здесь только факт подъёма.
mailpit:
  enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# ОБРАЗЫ ХРАНИЛИЩ: `bitnamilegacy`, А НЕ `bitnami`
#
# Вышестоящий перенёс образы bitnami в другой репозиторий, и ссылка умолчания
# подчарта перестала существовать: замер 2026-09-21 на узле стенда —
# `docker.io/bitnami/postgresql:16.1.0-debian-11-r25: not found`, тогда как
# `docker.io/bitnamilegacy/postgresql:16.1.0-debian-11-r25` тянется. Боевой слой
# об образах не высказывается намеренно (их называет слой площадки), поэтому
# перечень здесь — по инстансу на базу, ровно как у слоя площадки боевого стенда.
#
# Версия НЕ трогается: меняется только репозиторий. Пин версии остаётся тем,
# который объявил подчарт, — иначе правка адреса протащила бы заодно смену
# версии СУБД, которую никто не решал. Баз поставщиков в перечне нет: на этой
# цепочке их не поднимается (kacho#2816).
pg-vpc:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
pg-compute:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
pg-iam:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
pg-geo:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
pg-nlb:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
pg-storage:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
pg-registry:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }

# ─────────────────────────────────────────────────────────────────────────────
# ОБРАЗЫ ПРОДУКТА: ОДНА РЕВИЗИЯ НА СЛУЖБЫ И КРАЙ
#
# Базовый слой пинит семь образов на `main-d941344b` (11 сентября). Полоса формы
# — четыре глагола, которые край ретранслирует ТОЛЬКО под посадкой `own`, — вошла
# в ствол позже, коммитом `275240ef` (17 сентября, kacho#1269), а шесть глаголов
# второго фактора — ещё позже. Следствие ИЗМЕРЕНО на этом стенде: край честно
# отчитывается `identity_provider: own`, а на `/iam/v1/auth/csrf` отвечает 403
# AUTHZ_DENIED — глагола в его сборке нет вовсе. То есть стенд выглядел бы
# поднятым и не был бы свидетелем ни одной из задач, ради которых он поднят.
#
# ОДНОЙ РЕВИЗИЕЙ, А НЕ ТОЛЬКО КРАЙ. Расширение контракта выходит наружу лишь
# когда пересобраны ОБЕ половины: у службы поле есть, у клиента его нет, и проба
# читает это как дефект продукта. Поэтому здесь все семь стоят на одном коммите —
# тем же приёмом, каким это сделал слой площадки `a8f60d`.
#
# ПИН НЕ СТАВИТСЯ РУКОЙ, А ВЫВОДИТСЯ ИЗ ЗАПИСИ: тег, собранный мимо неё, был бы
# неотличим от выведенного и лгал бы молча. Запись одна на профиль, обе формы
# тега выводятся из неё.
#
# порождено-от: main 4382f05c0a3d17e0f69573f5a7a074804b5a2b49
#
# Это ствол, на котором стоит ветка волны-1 (kacho#2816): дерево ветки волны
# совпадает с деревом `main` этой ревизии во всех исходниках продукта, поэтому
# провенанс стенда сверяется с ней по коммиту. Прежняя запись (`bec320cf`)
# предшествовала волне-0 (`b32ca653`, носитель сессии края: множество носителей
# выводится из посадки) — стенд исполнял бы край старше профиля, который его
# описывает. Образ этой ревизии опубликован у ВСЕХ семи — замер 2026-09-22:
# реестр отвечает 200 на тег `main-4382f05c` у каждого из семи.
# Служба доступа сюда не входит: её исходники вынесены отдельным продуктом, её
# пин объявлен базовым слоем и из записи выше не выводится by construction.
vpc:
  image: docker.io/prorobotech/kacho-vpc:main-4382f05c
compute:
  image: docker.io/prorobotech/kacho-compute:main-4382f05c
kacho-geo:
  image: docker.io/prorobotech/kacho-geo:main-4382f05c
api-gateway:
  image: docker.io/prorobotech/kacho-api-gateway:main-4382f05c
kacho-nlb:
  image:
    repository: docker.io/prorobotech/kacho-nlb
    tag: main-4382f05c
storage:
  image:
    repository: docker.io/prorobotech/kacho-storage
    tag: main-4382f05c
# ПРИЁМ ТОКЕНА ЗДЕСЬ НЕ ОБЪЯВЛЯЕТСЯ, И ЭТО СКАЗАНО, А НЕ УМОЛЧАНО.
#
# Этот файл — слой площадки: он называет образы и адреса, а посадку безопасности
# не трогает ни одной величиной (шапка выше). Приём identity-JWT реестром —
# именно такая величина: объявить его здесь значило бы выбрать за оператора, кого
# реестр считает издателем, в файле, который о посадке молчать обязан.
#
# Сказано это потому, что поиск по ОДНОМУ файлу профиля даёт ноль попаданий, а
# ноль читается как «забыли»: по такому чтению уже заводилась задача о том, что
# реестр не поднимется, при исправной цепочке.
#
# Строка ниже машинная: проверка требует, чтобы названный слой действительно
# объявлял приём и стоял в цепочке ПЕРЕД этим файлом. Отметка, потерявшая
# предмет, роняет TestProfilesSilentAboutTokenAcceptanceSayWhyTheyAreSilent.
# приём токена наследуется от: values.own.yaml
registry:
  image:
    repository: docker.io/prorobotech/kacho-registry
    tag: main-4382f05c
