    # debian-11) в этом ряду НЕ работает: его initdb отказывается стартовать, когда не может
    # разрешить собственный идентификатор пользователя, а образ записи о нём не
    # несёт. Расхождение было невидимым ровно потому, что два инстанса тег имели,
    # а восемь — нет.
    tag: "16.4.0-debian-12-r0"
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

# kaname — control-plane сервис IAM (Account / Project / User / ServiceAccount /
# Group / Role / AccessBinding).
kaname:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.authn.mode).
  authMode: dev
  # ── ДОСТАВКА МАНИФЕСТОВ МОДУЛЕЙ (kacho#1901) ──────────────────────────────
  # Здесь имя ConfigMap объявляется ОДИН раз на весь стенд: отсюда его читает
  # чарт (том и монтирование) И отсюда же — производитель объекта
  # (`make module-manifests-configmap`, corelib/modulemanifest/producer). Второе
  # объявление разошлось бы с первым молча: под смонтировал бы один объект,
  # производитель положил бы другой, каталог доставки приехал бы пустым — и
  # снаружи это неотличимо от «модулей нет».
  #
  # `required: true` объявлено ВМЕСТЕ с производителем, а не раньше него: до
  # него опору на манифесты нельзя было объявить ни в одном профиле — страж
  # старта пропустил бы посадку (каталог назван), а процесс отказал бы на пустом
  # каталоге, то есть стенд перестал бы подниматься.
  #
  # Объект кладёт шаг подъёма стенда ПЕРЕД первым прогоном helm — как и прочие
  # предусловия (см. dev-prod-secrets.sh): том смонтирован `optional: true`,
  # поэтому отсутствие объекта даёт не зависший под, а отказ САМОГО ПРОЦЕССА с
  # названной причиной.
  manifests:
    configMapName: kacho-module-manifests
    required: true
  name: kaname
  replicas: 1
  # mTLS: server-only (authz authority; gateway/vpc/compute/nlb dial iam over mTLS).
  mtls:
    enable: true
    # :9100 — слушатель полосы входа паролем (Ф3, kacho#1269; предпосылка #2735).
    # По нему едут носитель сессии человека и его пароль, транспорт ВЗАИМНЫЙ.
    # Ручка объявлена, чтобы перевод стенда на `own` не заводил транспорт с нуля;
    # слушатель поднимается посадкой, а не ручкой. Форма — та же, что у среднего
    # слоя (`values.dev-prod.yaml`), откуда её получают три соседних стенда
    # цепочки; второй формы об одном предмете не заводится.
    loginLane: true
    # Единственное годное под `own` значение (приёмка Ф3, Р16): вызывающий — ровно
    # край, судится по SAN клиентского сертификата. Объявлено ЯВНО: величина,
    # которую построение подставляет само, предметом стража быть не может.
    loginLaneClientAuthMode: mutual
    # :9097 — слушатель набора проверочных ключей И авторитета отзыва наших
    # токенов (своя чеканка ниже, `config.authn.tokenSigning`). Под TLS — потому
    # что по нему забирают материал для проверки подписей. Сертификат
    # ЗАПРАШИВАЕТСЯ и верифицируется, если предъявлен: набор ключей обязан
    # оставаться доступен без сертификата, а авторитет отзыва отказывает сам,
    # если вызывающий не проверен. Слушатель, сертификата не запрашивающий,
    # служба при включённой чеканке НЕ ПОДНИМАЕТ — авторитету нечем было бы
    # отказать. Форма — та же, что у боевого слоя values.dev-prod.yaml.
    jwksProxy: true
    jwksProxyClientAuthMode: optional-mutual
    # :9096 — слушатель выдачи, вторая цель ретрансляции края (LINE-A-1,
    # kacho#2817): на него край уводит обе координаты церемонии авторизации
    # по `https` (`api-gateway.authn.iamIssuanceUrl` выше). Общая ручка
    # `httpListeners` здесь не объявлена, и без своей ручки слушатель
    # поднимался открытым текстом: край стартовал бы исправным и получал отказ
    # рукопожатия на каждом запросе церемонии. Форма — та же, что у среднего
    # слоя `values.dev-prod.yaml`.
    registryToken: true
    # Режим слушателя выдачи — запрашивающий (`optional-mutual`): край
    # предъявляет ему свою клиентскую пару на ретрансляции церемонии, и служба
    # берёт адрес источника из `X-Forwarded-For` только у пира с проверенным
    # сертификатом края (приёмка темпа службы доступа, Р7 п. 1, стадия S2 п. 2).
    # Вызывающий без сертификата допускается. Согласие с целью края судит
    # deploy/own_posture_stack_test.go.
    registryTokenClientAuthMode: optional-mutual
  # ОБРАЗ СЛУЖБЫ ДОСТУПА НЕ СОБИРАЕТСЯ ЭТИМ ДЕРЕВОМ — И ЭТО ПРИЧИНА, А НЕ ОТТЕНОК.
  #
  # Здесь стоял локальный `kaname:dev`, который клал в узлы `make dev-up`. Служба
  # вынесена отдельным репозиторием: её каталога здесь нет, её образ производит
  # конвейер её собственного репозитория, и рецепт стенда её больше не строит
  # (`deploy/Makefile`, SERVICES — семь служб, её среди них нет).
  #
  # Накладка снята ЦЕЛИКОМ, а не переписана на другой тег: пин опубликованного
  # образа объявлен ОДИН РАЗ, в `values.yaml` зонта, и второе место о том же
  # предмете разошлось бы с ним молча. Стенд разработчика поднимается теперь на
  # том же артефакте, что и всякий другой.
  #
  # Отказ, если образ не вытянулся, приходит ПОСЛЕ успешного `helm upgrade` —
  # `ImagePullBackOff`, и ни рендер, ни `lint` его не видят. Отличить «стенд не
  # готов» от «продукт сломан» здесь можно ровно по этому: под не стартовал ни
  # разу, а не упал.
  ports:
    grpc: 9090
    internalGrpc: 9091
    # СОБСТВЕННЫЕ REST-ФРОНТЫ ОБЪЯВЛЯЕТ ПРОФИЛЬ, А НЕ УМОЛЧАНИЕ ЧАРТА (#2247).
    # Умолчания у них нет ни у процесса, ни у чарта: порт, здесь не названный,
    # означает «этой двери у пода нет» — фронт не поднимается, под её не
    # объявляет, Service до неё не ведёт, и процесс говорит об этом при старте.
    # Этому стенду оба фронта нужны: до них ходит сквозной харнесс проб.
    rest: 9098
    internalRest: 9099
    # Слушатель полосы входа паролем (Ф3, kacho#1269; предпосылка #2735).
    # Величина и форма — ТЕ ЖЕ, что у боевого профиля (`values.prod.yaml`,
    # `kaname.ports.loginLane: 9100`): второго числа об одном предмете не
    # заводится, и два стенда, назвавшие разные двери, разъехались бы молча.
    #
    # ПОДНИМАЕТСЯ ПОСАДКОЙ, А НЕ АДРЕСОМ: на `external` этого профиля процесс
    # порт читает, объявляет поверхность выключенной с причиной и слушателя не
    # поднимает. Под `own` его отсутствие — отказ старта службы с именем ручки,
    # поэтому объявление стоит ЗАРАНЕЕ: перевод на `own` не заводит полосу с
    # нуля (приёмка Ф3, Р3, Р11, Ф3-42).
    #
    # Порт свой — от фронтов 9098/9099 отличен. Наследуют строку стенды `dev`,
    # `dev-prod`, `prorobotech` и `a8f60d`.
    loginLane: 9100
  service:
    public:
      type: ClusterIP
      port: 9090
      restPort: 9098
    internal:
      type: ClusterIP
      port: 9091
      internalRestPort: 9099
  db:
    host: kacho-umbrella-pg-iam
    port: "5432"
    user: iam
    name: kaname
    passwordSecretName: kacho-umbrella-pg-iam
    passwordSecretKey: password
  config:
    logger:
      level: INFO
    apiServer:
      gracefulShutdown: 10s
    repository:
      postgres:
        # Приведён к НАИМЕНЬШЕМУ пределу, который эта служба может встретить.
        #
        # Здесь стояло 100 — величина, выбранная безотносительно того, сколько
        # соединений принимает база. На стеках, где предел базы не объявлен ни
        # одним профилем, действует умолчание сборки образа (100), из которых
        # обычным клиентам достаётся 97: пул одной реплики не помещался ЦЕЛИКОМ,
        # а при пяти репликах объявленный потолок (500) превышал принимаемое в
        # два с половиной раза.
        #
        # 80 = 97 доступных − запас на СОБСТВЕННЫЕ непуловые соединения службы
        # (ожидание оповещений и опросчики очередей; замером #750 их около
        # четырнадцати на реплику). Это потолок посадки, а не настройка
        # производительности: узким местом в том же замере была не глубина пула,
        # а процессор базы.
        #
        # Держат это число два механизма: deploy/pool_fits_database_test.go — по
        # объявлению, до развёртывания; загрузочный страж службы — по ФАКТИЧЕСКОМУ
        # пределу, спрошенному у базы. Растить число реплик, не уменьшив пул,
        # страж не даст: он откажет в старте.
        #
        # ЗДЕСЬ — 40, и это ЗАМЕРЕННОЕ значение, а не прикидка (#883).
        #
        # Прикидка стояла здесь же и была НЕВЕРНА: «при задержке около
        # миллисекунды и 400 запросах в секунду на реплику одновременных
        # соединений нужно меньше одного, так что 20 — запас в десятки раз».
        # Опровергнута опытом с контролем в обе стороны, прогретое состояние,
        # 1200 запросов в секунду на трёх репликах:
        #
        #     пул 20 → p99 = 139 мс, max 721 мс, среднее 4.52 мс
        #     пул 40 → p99 =  16 мс, max 128 мс, среднее 1.24 мс
        #
        # Отказов нет ни там, ни там: подача обслуживается полностью, различие —
        # ТОЛЬКО хвост, и он падает в 8.7 раза. Средняя длительность обманывает:
        # запросов, идущих В БАЗУ, меньшинство (промах кеша вердикта), но именно
        # они занимают соединение, и при мелком пуле остальные ждут очереди.
        # Ровно поэтому свободный процессор соседствовал с сорванным хвостом.
        #
        # СКОЛЬКО РЕПЛИК ЭТО ДОПУСКАЕТ — 3, и это сказано числом:
        #
        #     3 × 40 пула + 3 × 14 непуловых = 162 ≤ 197 доступных
        #     4 × 40      + 4 × 14           = 216 >  197  — уже нет
        #
        # Замер на пяти репликах снимался при пуле 20 и в этот предел укладывался.
        # Понадобится снова пять — временно опустить пул либо поднять потолок базы
        # ВМЕСТЕ с её памятью; поднимать потолок здесь нельзя, не тронув боевые
        # профили: они наследуют эту величину и подбирают память под неё.
        maxConns: 40
        sslMode: disable
    authn:
      # Bootstrap-mint caller allow-list (#58 hardening). MintBootstrapToken is
      # gated ONLY by the caller's client-certificate SPIFFE SAN (no ReBAC Check is
      # possible before the first token exists; no gateway REST route exists), and
      # authzguard enforces that gate in EVERY mode — dev included. Without this
      # list even the dev stand denies every mint (empty = deny everyone). The SAN
      # is the dedicated operator leaf the umbrella issues
      # (mtls.bootstrapOperator → secret kacho-bootstrap-operator-client-tls);
      # NOT the api-gateway identity — see values.yaml mtls.bootstrapOperator.
      #
      # Orthogonal to ENABLEMENT: the mint only issues tokens when a signing key
      # is present (kacho.iam.bootstrapToken.signingKeySecretName, supplied by the
      # values.dev-prod.yaml overlay). Listing the caller here costs nothing on a
      # stand that never mints, and means the ONE knob that stays fail-closed by
      # default is the credential gate — not a forgotten allow-list that
      # silently 403s the operator.
      bootstrapMint:
        allowedClientSANs:
          - spiffe://kacho.cloud/ns/kacho/sa/kacho-bootstrap-operator

      # ─── СВОЯ ЧЕКАНКА ТОКЕНОВ — УСЛОВИЕ СТАРТА ПОД `own` (#2735) ────────────
      #
      # Под посадкой `own` (ниже) внешнего поставщика нет, и зеркала чужого
      # набора служба не публикует. Единственная запись публикатора набора ключей
      # — СВОЯ, а её ведёт чеканка. Без неё записей ноль, и служба отказывает в
      # старте: «no key-set records declared — a publisher with no records
      # answers nobody». Первой фазы `make dev-up` «без чеканки» под `own` не
      # бывает.
      #
      # Значения — те же, что у боевого слоя values.dev-prod.yaml: одна
      # платформа, один издатель. Каждое обязательно — незаданный издатель
      # означает «любой», пустой перечень подписей — «принимаем любую».
      # Ключ обёртки приватной половины (KANAME_JWKS_ENC_KEY) заводит
      # scripts/dev-prod-secrets.sh ДО первого прогона helm.
      tokenSigning:
        enabled: true
        issuer: "https://kaname.kacho.local"
        algorithm: ES256
        allowedAlgorithms: "ES256,RS256"
        keySetPath: /.well-known/kaname/jwks.json
      # ─── ТО, ЧТО ЧЕКАНКОЙ ДЕРЖИТСЯ: ПРИЁМ ПРЕДЪЯВЛЕННОГО И ТОКЕН-ЭНДПОИНТ ────
      #
      # Край и реестр принимают нашего издателя как издателя платформы (блоки
      # `api-gateway.tokenAcceptance` и `registry.tokenAcceptance` этого файла),
      # значит выпускать предъявителя этой полосы обязан НАШ токен-эндпоинт:
      # принятый издатель, которого нечем выпустить, — полоса, объявленная
      # неисполнимой. Под `own` поставщика нет, и выпуск ключа служебной учётки
      # тоже наш (им получает токены харнесс сквозных проб). Собственный
      # публичный REST-фронт службы (`ports.rest`) поднят, и без читателя
      # предъявленного он отвечал бы на годное удостоверение так же, как на
      # негодное.
      #
      # Значения — те же, что у боевого слоя values.dev-prod.yaml, и по тем же
      # доводам (там они разобраны по каждой ручке): адресат края — член перечня,
      # адресат по умолчанию — действующее имя докерной полосы, окно отзыва
      # короче срока выпускаемого токена.
      presentedCredential:
        enabled: true
        audience: "https://api.kacho.cloud"
        revocationCacheTtl: "30s"
      clientToken:
        enabled: true
        allowedAudiences: "https://api.kacho.cloud,registry.in-cloud.io"
        defaultAudience: "registry.in-cloud.io"
        tokenTtl: "15m"
        bodyCeiling: 65536
        # ТЕМП ПОВЕРХНОСТИ ВЫДАЧИ (kaname#315) — умолчаний нет, незаданная
        # величина есть отказ старта с именем ручки. Числа — §3 приёмки службы
        # ceremony-pace-is-named-by-number.md, кроме двух потолков.
        #
        # ПОТОЛКИ ЗДЕСЬ НЕ РАВНЫ БОЕВЫМ, И ЭТО ВЫВЕДЕНО, А НЕ «ПОМЕНЬШЕ». Приёмка
        # берёт 32 + 32 из пула по умолчанию (80): потолки вместе ниже пула, и
        # 16 соединений остаются gRPC-поверхности и фоновым циклам. Пул этого
        # слоя — 40 (`repository.postgres.maxConns` выше), значит та же
        # арифметика даёт (40 − 16) / 2 = 12 на каждый потолок.
        inFlightCeiling: 12
        exchangesPerClientPerSec: 5
        failedProofsPerSource: 50
        failedProofWindow: 15m
        authorizePerSourcePerSec: 10
        authorizeInFlightCeiling: 12

      # ─── ВЕЛИЧИНЫ ПОЛОСЫ ВХОДА ПАРОЛЕМ (Ф3, kacho#1269) И РЕГИСТРАЦИИ
      #     (Ф4, kacho#2699) · СРОК КОДА ВОССТАНОВЛЕНИЯ (Ф5, kacho#2701) ──────
      #
      # Все они — `RequiredSetting` с `Lanes: [own]` у пиненной службы: под `own`
      # каждая незаданная есть отказ старта с именем ручки, под `external` не
      # читается ни одна. Объявлены ЗАРАНЕЕ по тому же доводу, что величины
      # боевого слоя (приёмка Ф3, Р3, Р11, Ф3-42): перевод стенда на `own` не
      # заводит полосу с нуля. Наследуют строки `dev`, `dev-prod`, `prorobotech`
      # и `a8f60d`.
      #
      # ЁМКОСТЬ ЗДЕСЬ НЕ РАВНА БОЕВОЙ, И ЭТО ВЫВЕДЕНО, А НЕ «ПОМЕНЬШЕ».
      # Страж сверяет бюджет с пределом СРЕДЫ: ёмкость × память одной проверки
      # на потолке формата + резерв ≤ предел контейнера. Память одной проверки
      # задаёт сам продукт (худший формат перечня) — 134217728 Б; её читает у
      # пиненного модуля `deploy/own_lane_memory_budget_test.go`, и величиной
      # профиля она не является. Предел этого слоя — 512Mi = 536870912 Б,
      # резерв процесса сверх проверок — те же 268435456 Б, что и на боевом
      # (свойство процесса, не стенда). Отсюда ёмкость:
      #
      #   ⌊(536870912 − 268435456) / 134217728⌋ = 2
      #   бюджет 2 × 134217728 + 268435456 = 536870912 Б — предел покрывает РОВНО
      #
      # Боевой слой стоит на 8 при пределе 1342177280 Б по той же формуле. Предел
      # контейнера здесь НЕ поднимается: у стенда с меньшим пределом правильна
      # другая точка той же арифметики, а не другая арифметика.
      # Стенд `a8f60d` объявляет предел 448Mi своим слоем и там же сужает ёмкость.
      login:
        # Срок нашей сессии человека, абсолютный, от выдачи. Политика продукта,
        # от стенда не зависит.
        sessionTtl: 24h
        # Ключ Domain печенья сессии. `none` здесь — ЕДИНСТВЕННОЕ годное, а не
        # перенос: консоль этой цепочки отвечает на `localhost` (а у `a8f60d` —
        # на голом IP-литерале, см. шапку его профиля), и печенье с `Domain=`
        # у адресной посадки браузер отбрасывает целиком. Пропуск и `none`
        # обязаны различаться — поэтому слово стоит, а не отсутствует.
        cookieDomain: none
        # Частота неверных предъявлений: по адресу и по источнику (адрес из
        # заголовка пересылки края). По адресу — политика продукта.
        addressAttempts: 5
        addressWindow: 15m
        # ОКНО ИСТОЧНИКА ЗДЕСЬ — ВЕЛИЧИНА СТЕНДА НАБОРОВ, А НЕ ПРОДУКТА (50 за
        # 15m в `values.prod.yaml`). С kaname#456 с этого же окна списывается
        # КАЖДАЯ регистрация, а у сквозных проб консоли бегун один — источник
        # один на весь прогон, — и фикстура заводит человека на пробу.
        # Наблюдалось на #2908: пятьдесят регистраций прошли, пятьдесят первая
        # получила `registration refused`, и упали пять проб по чужой причине.
        # Прогон (около 10 мин) укладывается в одно окно, поэтому величина —
        # верхняя граница его регистраций: проба заводит не больше двух людей,
        # проб объявлено 158 (65fbffda1f3) — не больше 316; взято 400, запас
        # до двухсот проб. Срок окна — продукта: меняется один факт, счёт.
        # Сторож расхода окна прогоном против этой величины — kacho#2909.
        # Стенды, наследующие этот профиль и куда ходят не пробы
        # (`prorobotech`, `a8f60d`), объявляют величину продукта своим слоем;
        # что она туда не протекает, держит
        # `deploy/registration_source_window_stands_test.go`.
        sourceAttempts: 400
        sourceWindow: 15m
        # Одно правило пароля на вход, регистрацию и восстановление.
        passwordMinLength: 8
        # Проверка по базе утечек — СЛОВОМ, а не адресом: авторитета утечек у
        # этого стенда нет, и выключенная молча проверка неотличима от
        # настроенной.
        breachCheck: disabled
        # Что продукт ПИШЕТ. Читает он любой формат перечня; параметры стоимости
        # между полом и потолком записи. В бюджет памяти НЕ входят: бюджет
        # считается по потолку перечня, а не по этим числам.
        hasherFormat: argon2id
        hasherMemory: 65536
        hasherIterations: 3
        hasherParallelism: 4
        # Ёмкость — выведена выше; резерв — свойство процесса сверх проверок.
        verifierCapacity: 2
        memoryReserveBytes: 268435456
        # Срок кода восстановления доступа, от чеканки; код однократен и после
        # срока не оживает.
        recoveryCodeTtl: 5m
        # Подтверждение адреса (kaname#456, Р7, Р9; kacho#2901): дальше экранов
        # входа и подтверждения человек проходит только с подтверждённым адресом,
        # и обхода у рубежа нет ни на одном стенде. Пять величин без умолчания —
        # незаданная роняет старт службы с именем ключа. Величины профиля
        # продукта, от стенда не зависят: срок кода 30 мин, пять неподошедших
        # предъявлений тратят код, между письмами не меньше 60 с, не больше пяти
        # писем за скользящие 24 ч (письмо регистрации в счёт).
        verificationCodeTtl: 30m
        verificationCodeAttempts: 5
        verificationResendInterval: 60s
        verificationResendLimit: 5
        verificationResendWindow: 24h
      # Потолок ТЕМПА заведения аккаунтов одной личностью: сверх первого — три за
      # час. Первое заведение проходит безусловно. Ноль законен и означал бы
      # «сверх первого — ни одного», поэтому величина объявлена явно.
      registration:
        admissionsPerWindow: 3
        admissionWindow: 1h

      # ─── ОКНО СВЕЖЕСТИ ПРАВКИ СВОИХ ДАННЫХ (Ф12, kacho#1281) ─────────────────
      #
      # `RequiredSetting` с `Lanes: [own]`: заведение и подтверждение второго
      # фактора требуют предъявления не старше окна, и тем же окном ограничен
      # срок неподтверждённого заведения. Умолчания нет ни у процесса, ни у
      # чарта — под `own` незаданное окно есть отказ старта с именем ручки
      # `authn.self-service-freshness` (KANAME_AUTHN__SELF_SERVICE_FRESHNESS).
      #
      # Стоит ЗДЕСЬ, в корне цепочки, а не в накладке посадки: под `external`
      # страж её не читает, и объявление ничего не включает — ровно тот же довод,
      # по которому в профилях живут величины полосы (приёмка Ф3, Р3, Р11,
      # Ф3-42). Пока она стояла только в накладке `values.own.yaml`, перевод
      # любого другого стенда на `own` ронял старт службы по имени этой ручки —
      # шестым по счёту после величин полосы.
      #
      # 15 минут — перенос прежней величины (Ф1 §4.1), а не новый выбор.
      selfServiceFreshness: 15m

      # ─── СРОКИ СОБСТВЕННОЙ ЦЕРЕМОНИИ (kaname#318) ────────────────────────────
      #
      # `RequiredSetting` с `Lanes: [own]`: срок кода авторизации от его выдачи и
      # срок семейства токенов обновления от первой выдачи (оборот его не
      # продлевает). Умолчания нет ни у процесса, ни у чарта — под `own`
      # незаданный срок есть отказ старта (KANAME_AUTHN__CEREMONY__*). Стоит в
      # корне цепочки по доводу окна свежести выше.
      #
      # Величины — перенос поведения сборки до ручек, равного потолкам фундамента
      # (tokenpolicy.MaxAuthorizationCodeTTL = 60s,
      # tokenpolicy.MaxRefreshTokenFamilyTTL = 168h): коллекции церемонии судят
      # прежнее поведение, и выбор короче был бы новым решением, а не переносом.
      ceremony:
        codeTtl: 60s
        refreshTtl: 168h

      # ─── ПРИВЯЗКА КЛЮЧЕЙ ДОСТУПА (Ф7, kacho#1273; Р2, Ф7-13) ─────────────────
      #
      # Три величины контракта, каждая — условие старта под `own`; умолчания нет
      # ни у одной (`authn.access-keys.*`, KANAME_AUTHN__ACCESS_KEYS__*). Стоят
      # здесь, в корне цепочки, по доводу окна свежести выше.
      #
      # Перечень происхождений ПУСТ — «никого», и это факт о посадке, а не
      # пропуск: консоль этой цепочки отвечает по `http` (`appBaseURL` в `global`
      # выше; у `a8f60d` — на голом IP-литерале), а схема `http` у службы допустима
      # только для `localhost` — браузер отдаёт ключ лишь в защищённом контексте.
      # Объявить это происхождение значило бы уронить старт; объявить чужое —
      # принять величину, которой ни одна церемония не выполнит. Служба стартует и
      # отвергает всякий ключ; вход — паролем.
      #
      # Имя доверяющей стороны обязано быть доменным и при «никого» (страж его
      # судит безусловно). Здесь его нет: чарт берёт `webauthnRpId` узла
      # `identity` выше — одно имя на обоих читателей (kacho#2905).
      # Перечень алгоритмов — весь словарь проверяющего: ES256, EdDSA, RS256.
      accessKeys:
        origins: []
        algorithms: [-7, -8, -257]

      # ─── КЛЮЧА ПОСАДКИ ЛИЧНОСТИ У СЛУЖБЫ НЕТ (kacho#2818) ──────────────────
      #
      # Посадка у службы одна — своя полоса (kaname#363), и ключ посадки она
      # отвергает при любом значении. Ручка снята с подчарта вместе с читателем;
      # профиль, всё ещё её объявляющий, получает отказ рендера. Посадку края
      # объявляет его собственная ручка (`api-gateway.authn.identityProvider`).
  initContainer:
    migrator:
      enabled: true
      command: ["/usr/local/bin/kaname-migrator", "up"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env:
    # KAC-127 #25: enable AuthorizeService.ListObjects (FGA-filtered List).
    # Scope-filtered List RPCs (vpc NetworkService/List, iam User/SA List) call
    # ListObjects to resolve the caller's allowed-id set; without this the RPC
    # returns Unimplemented and the handler-side scope-filter fails 503.
    KACHO_AUTHZ_LISTOBJECTS: "on"
    # Адрес первого администратора облака (KANAME_BOOTSTRAP_ROOT_EMAIL) —
    # не здесь: его объявляет ручка чарта `platform.iam.bootstrapRootAdmin`
    # (ниже, kacho#2878), родовой проброс той же переменной рендер отвергает.
  # Первый администратор облака стенда разработки — человек фикстур проб
  # (tests/authz-fixtures, prodseed_matrix.py: адрес задан там же). Посев
  # бутстрапа службы выдаёт ему `system_admin` на кластере, как только
  # фикстура его заводит; повторяется до выдачи. Домен зарезервирован для проб
  # (RFC 6761): адрес не учётка ни на одном узле, а слой доезжает и до
  # управляемых стендов — там его замещает ссылка на секрет (kacho#3040).
  platform:
    iam:
      bootstrapRootAdmin:
        email: "admin@example.test"

# ─── KAC-NLB: kacho-nlb L4 NLB control-plane (sub-phase 4.0) ─────────────
#
# Sub-chart lives in `project/kacho-nlb/deploy/` and is wired into the umbrella
# via `file://../../../kacho-nlb/deploy` (Chart.yaml dep above). Schema /
# resources / RPC contract — see `kacho-nlb/docs/specs/sub-phase-4.0-nlb-acceptance.md`.
#
# Wiring rules:
#   - `pg-nlb` (above) is the backing Postgres; kacho-nlb dials it via
#     `kacho-umbrella-pg-nlb:5432` (bitnami pg-* sub-charts expose a Service
#     named `<release>-<alias>`).
#   - `db.existingSecret` binds the bitnami-managed Secret directly so the
#     chart's own `secret.yaml` short-circuits (`{{- if not .Values.db.existingSecret -}}`),
#     i.e. we never commit a duplicate password Secret. The bitnami Secret name
#     follows `<release>-<alias>`; key `password`.
#   - Peers point at the cluster-internal Kubernetes Services of the dependent
#     domains (vpc public 9090 + internal 9091, compute public 9090, iam
#     internal 9091 — kacho-nlb resolves ProjectService through the iam
#     internal listener because it ALSO carries InternalIAMService.Check used
#     by the per-RPC authz interceptor; same dual-purpose port as in kaname
#     values block above).
#   - `config.mode=dev` relaxes the production-only config validation rules
#     (breakglass=false guard, listenInvalidator.iamDsn required, ...). Prod
#     overrides to `production` in values.prod.yaml.
#   - networkPolicy disabled in dev for parity with kaname / kacho-vpc dev
#     overrides (port-forward / kubectl exec convenience).
kacho-nlb:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.mode).
  authMode: dev
  enabled: true
  name: kacho-nlb
  replicas: 1
  # Dev kind stack: nlb already sets db.sslmode=disable below (dev pg-nlb serves
  # no TLS), but the nlb chart defaults config.mode=production, whose
  # config.Validate (audit SEC #1) REJECTS sslmode ∈ disable/allow/prefer — a
  # production stand MUST use a TLS DB channel. production + sslmode=disable =
  # refuse-to-start (migrate + serve) → Init:CrashLoopBackOff. So the dev profile
  # must also flip config.mode=dev (same triplet the compute chart documents:
  # mode=dev + mtls off + sslmode=disable). Ephemeral CI stand only; prod keeps
  # production (values.prod.yaml). The `mode: dev` flip itself lives in the single
  # `config:` block further down — this key was declared TWICE under kacho-nlb
  # (here and again below), and a duplicate mapping key does not merge: the later
  # block replaces this one wholesale. Both happened to set the same mode, so
  # nothing misbehaved — but any key added here would have been silently dropped.
  # mTLS: server (gateway dials here) + client (nlb→iam, nlb→vpc, nlb→compute, nlb→geo).
  mtls:
    enable: true
    edges:
      # Домена величин в этой установке НЕТ (`quota.authority: not-deployed` в чарте
      # каждого потребителя), поэтому удостоверения к нему не бывает: имя для
      # сверки рукопожатия называло бы ПИРА, К КОТОРОМУ РЕБРО НЕ ИДЁТ.
      # Половину пары отвергает страж старта (`pkg/quota/quotaedge`).
      iamRegister: true
      iamProject: true
      vpc: true
      compute: true
      geo: true        # nlb→geo region_id validation (geo cutover, kacho-workspace#82)
  image:
    repository: kacho-nlb
    tag: dev
    pullPolicy: IfNotPresent
  ports:
    grpc: 9090
    internalGrpc: 9091
    metrics: 9101
  serviceAccount:
    create: true
  db:
    host: kacho-umbrella-pg-nlb
    port: 5432
    user: kacho_nlb
    name: kacho_nlb
    sslMode: disable
    existingSecret: kacho-umbrella-pg-nlb
    existingSecretKey: password
  peers:
    iam:
      # KAC-178 §2: ProjectService на PUBLIC (9090); InternalIAMService на INTERNAL (9091).
      addr: kaname.kacho.svc:9090
      internalAddr: kaname-internal.kacho.svc:9091
      tls: false
      dialDuration: 10s
    vpc:
      addr: vpc.kacho.svc:9090
      internalAddr: vpc.kacho.svc:9091
      tls: false
      dialDuration: 10s
    compute:
      addr: compute.kacho.svc:9090
      internalAddr: ""
      tls: false
      dialDuration: 10s
  authz:
    iam:
      # Адреса здесь нет намеренно: соединение, по которому идёт per-RPC Check,
      # строится из peers.iam.internalAddr. Прежний ключ `authz.iam.addr` снят —
      # из него не строилось ни одного соединения, а профиль называл его как
      # действующую настройку.
      dialDeadline: 3s
      requestTimeout: 500ms
  config:
    logger:
      level: INFO
    apiServer:
      gracefulShutdown: 10s
      grpcGwEnable: false
    authn:
      type: none
    authz:
      cache:
        enable: true
        ttl: 5s
      # Здесь стояли ещё четыре ключа — `cache.size`, три `listenInvalidator.*`
      # и `breakglass`, — ни один из которых не читал ни шаблон чарта, ни
      # описатель настроек процесса: у nlb нет ни поля размера кеша вердиктов,
      # ни слушателя инвалидации (это механизм iam), ни ручки аварийного обхода.
      # Последняя опаснее прочих: строка `breakglass: false` читается как
      # заявление «обход закрыт», тогда как закрывать нечего — звено решения о
      # доступе ставится безусловно. Держит снятое гейт
      # internal/repohygiene TestDeclaredKnobHasAReader.
      #
      # Круг отправителей, которым разрешено ГОВОРИТЬ ЗА пользователя
      # (заголовки x-kacho-principal-*). Пустой список — умолчание чарта —
      # НЕ означает «не принимаем ни от кого»: транспорт сужает круг только
      # на непустом списке, а на пустом принимает переданную личность от
      # ЛЮБОГО пира с сертификатом внутреннего CA. mTLS здесь включён
      # (mtls.enable=true выше), поэтому на dev-стенде это было живое
      # «доверяем всем», а не теоретическое: боевая стража старта (config.Validate)
      # при mode=dev не срабатывает, и dev оставался единственным из семи
      # сервисов с несужённым кругом.
      #
      # Состав пинится по ФАКТИЧЕСКИМ отправителям, а не по аналогии с соседом:
      # у vpc их четыре (шлюз, compute, nlb, оператор), и сужение «наверное,
      # только шлюз» сломало бы привязку интерфейса. Для nlb граф даёт РОВНО
      # шлюз: ни один сервис не импортирует nlb-стабы (единственный импортёр —
      # gateway/internal/restmux + его config), а оба листенера nlb (:9090 и
      # :9091) фронтит тот же api-gateway. Совпадает с values.prod.yaml и
      # values.dev-prod.yaml, где круг тот же и по той же причине.
      trustedForwarderSANs:
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
    # Секция `fga:` (endpoint / storeId / modelId / tupleWrite) здесь была и
    # СНЯТА (kacho#1796): адрес внешнего движка отношений и его параметры.
    # Движок снят целиком (#747), читателя у ключей не осталось ни в шаблоне
    # чарта, ни в описателе настроек процесса. `fga.requireIam` этот профиль не
    # переопределял — умолчание сабчарта (true) действует как прежде.
    jobs:
      targetDrain:
        interval: 10s
  migrator:
    enable: true
  networkPolicy:
    enable: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
# ─── kacho-registry — OCI registry control-plane + zot blob backend ───────────
#
# Заголовок «registry: ВЫКЛЮЧЕН в dev (не проварен)» с разбором двух причин
# отключения стоял ровно над `enabled: true` и пережил само включение. Убран:
# оба препятствия сняты (образ собирается локально — `registry` в SERVICES
# Makefile; у pg-registry появился собственный override), а комментарий,
# противоречащий значению под ним, читается как указание вернуть всё назад.
# Enabled for the dev/newman stand. The registry APP image is built locally
# (Makefile SERVICES → kacho-registry:dev); only the zot backend is pulled from
# ghcr.io (dev-up pre-pulls + kind-loads it to avoid an egress race in helm --wait).
# db.* and authz.* chart defaults are already dev-correct (pg-registry Service +
# kaname-internal:9091 / kaname:9090 / kacho-geo:9090). iam/geo run
# server-mTLS → registry MUST run mtls.enable=true (client edges to iam/geo).
# Added to MTLS_SUBCHARTS in deploy/Makefile. Docker DATA-plane (push/pull) is
# out-of-scope on kind (dataplaneLB disabled) — the registry newman suite is
# control-plane REST through the gateway, which does not need the VIP.
registry:
  enabled: true
  image:
    repository: kacho-registry   # local kind image
    tag: dev
  imagePullPolicy: IfNotPresent
  # Хранилище слоёв аутентифицирует своих вызывающих и на локальном стенде: открытый
  # порт zot — объезд ВСЕЙ авторизации плоскости данных одним хопом, и «на dev можно»
  # ровно такие дыры и прячет (production-posture везде, core rule #16). Значения —
  # NON-SECRET dev-плейсхолдеры, как пароль pg-registry ниже. htpasswd задан ЯВНО
  # (bcrypt того же пароля): выведенная из пароля строка несёт случайную соль → её
  # checksum менялся бы на каждом рендере и перекатывал zot на каждом `helm upgrade`.
  zot:
    auth:
      username: kacho-registry
      password: changeme-dev-zot
      htpasswd: "kacho-registry:$2a$10$Tp5G/pTDpzaVxQ8UzLOduOUVMo6rG96xpzEc/hPHzDzFdycxDEdhK"
  authMode: dev                  # relaxes issuer-pin / dataplane-TLS / https-JWKS prod guards
  # Приём identity-JWT плоскостью данных. ОБЪЯВЛЯЕТСЯ, и объявление здесь
  # обязательно: незаполненный перечень принимаемых издателей означает не
  # «принимаем как раньше», а «принимаем ЛЮБОГО», поэтому сервис отказывается
  # стартовать (F1, задача #897). Отказ верен — он и привёл сюда: профиль
  # первой фазы `dev-up` остался без объявления, под уходил в перезапуск по
  # кругу, `helm --wait` истекал, и обе сквозные полосы получали «условие не
  # создано» вместо вердикта.
  #
  # Перечень — тот же, что у края этого файла, и по той же причине: пустой
  # отказывает в старте, прежний издатель не поднимается ни на одном стенде
  # (#2735). Своя чеканка на этом профиле ВКЛЮЧЕНА — под посадкой `own` без неё
  # служба не стартует, — поэтому издатель платформы назван, авторитет отзыва
  # объявлен, а набор ключей берётся по https: :9097 здесь под TLS. Значения —
  # те же, что у боевого слоя values.dev-prod.yaml и у края выше: одна
  # платформа, один набор адресов (согласие держит
  # deploy/own_minting_census_test.go).
  tokenAcceptance:
    issuers: "https://kaname.kacho.local"
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json"
    platformIssuer: "https://kaname.kacho.local"
    revocationUrl: "https://kaname-internal.kacho.svc:9097/internal/tokens/introspect"
  mtls:
    enable: true
    edges:
      # Домена величин в этой установке НЕТ (`quota.authority: not-deployed` в чарте
      # каждого потребителя), поэтому удостоверения к нему не бывает: имя для
      # сверки рукопожатия называло бы ПИРА, К КОТОРОМУ РЕБРО НЕ ИДЁТ.
      # Половину пары отвергает страж старта (`pkg/quota/quotaedge`).
      iamAuthz: true      # registry→iam Check + fga-proxy (:9091)
      iamProject: true    # registry→iam ProjectService.Get (:9090)
      geo: true           # registry→geo RegionService.Get (:9090)
      # Ребро к авторитету отзыва: ему присылают ПРЕДЪЯВЛЕННЫЙ токен, поэтому хоп
      # идёт под клиентским сертификатом. Издатель платформы, объявленный без
      # учётных данных этого ребра, — половина пары.
      tokenRevocation: true

# backing Postgres for kacho-registry (schema kacho_registry). Service
# kacho-umbrella-pg-registry; the registry chart reads its Secret via
# db.existingSecret (chart default kacho-umbrella-pg-registry, key password).
pg-registry:
  enabled: true
  auth:
    username: registry
    password: changeme-dev-registry   # NON-SECRET dev placeholder
    database: kacho_registry
  primary:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1000m, memory: 1Gi }
  image:
    repository: bitnamilegacy/postgresql
    # Тег ПРИПИНЕН и одинаков у всех инстансов. Умолчание чарта (16.1 на
    # debian-11) в этом ряду НЕ работает: его initdb отказывается стартовать, когда не может
    # разрешить собственный идентификатор пользователя, а образ записи о нём не
    # несёт. Расхождение было невидимым ровно потому, что два инстанса тег имели,
    # а восемь — нет.
    tag: "16.4.0-debian-12-r0"
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

# ─────────────────────────────────────────────────────────────────────────────
# Консоль (микрофронтенд: оболочка + модуль на домен).
#
# ВКЛЮЧЕНА, и это исправление, а не настройка вкуса. До 2026-08-11 выключатель
# `uif.enabled` не задавал НИ ОДИН профиль, поэтому подчарт консоли рендерил ноль
# объектов: продукт поставлял интерфейс, который не поднимался ни на одном
# стенде и, как следствие, не проверялся вообще ничем. Три дефекта, найденных в
# первый же проход по поднятой консоли (заслонённый маршрут, разъехавшийся
# базовый путь модуля, абсолютный адрес входа), прожили ровно столько, сколько
# длилось это невключение.
#
# Цена названа честно: `dev-up` теперь собирает ещё девять образов (цель
# `build-ui`), и подъём чистого кластера дорожает. Это плата за то, чтобы
# интерфейс поднимался вместе с продуктом, а не отдельным ритуалом, о котором
# нужно помнить.
uif:
  enabled: true
