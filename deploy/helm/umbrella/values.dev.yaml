# ┌───────────────────────────────────────────────────────────────────────────┐
# │ SECURITY — throwaway DEV/CI credentials only.                              │
# │                                                                           │
# │ Every credential in this file (DB passwords `changeme-dev-*`)             │
# │ stand (`make dev-up`) and the newman CI cluster ONLY. They are committed   │
# │ to git deliberately so the local stand is reproducible — they carry no    │
# │ confidentiality and MUST NEVER be reused on a shared, staging or           │
# │ production cluster.                                                        │
# │                                                                           │
# │ Production sources every credential from external-secrets / SealedSecret  │
# │ + ssl-mode=require). The prod profile is fail-closed and guarded by        │
# │ tests/helm/prod-profile-fail-closed-test.sh. Rotate/override these         │
# │ placeholders before any non-dev use.                                      │
# │ Отдельного документа про эти учётные данные нет — ни в этом репозитории,  │
# │ ни в воркспейсе, ни в одном их коммите; здесь стояла ссылка на такой.     │
# │ Что есть на самом деле: сам профиль values.prod.yaml и названная выше     │
# │ проба, которая держит его fail-closed.                                    │
# └───────────────────────────────────────────────────────────────────────────┘

# KAC-127 — dev-стенд (kind) использует локально-загруженные образы `:dev`
# (`kind load docker-image`, перечень имён — deploy/images.txt), а не DockerHub.
# ИМЯ ОБРАЗА НЕ ВЫВОДИТСЯ ИЗ ИМЕНИ СЛУЖБЫ: служба личности носит собственное имя
# продукта (`kaname`), и прежняя форма `kacho-*` перестала описывать стенд. pullPolicy IfNotPresent —
# образ уже в node-кэше kind. Чтобы тянуть из DockerHub в dev — убрать эти
# override'ы (вернётся registry/tag из values.yaml).

# KAC-127 — обнуляем global.imageRegistry для dev. В values.yaml он =
# `docker.io/prorobotech` (DockerHub-namespace для kacho-* образов). Но
# third-party sub-chart'ы (Ory kratos/hydra/keto, bitnami postgresql)
# тоже уважают `global.imageRegistry` и подставляют его перед СВОИМ image →
# получается несуществующий `docker.io/prorobotech/oryd/hydra`. На dev-стенде
# образы стенда и так заданы явной строкой `image: <имя>:dev` (flat-string,
# global.imageRegistry не используется этими sub-chart'ами), поэтому обнуление
# global безопасно для kacho-сервисов и чинит pull third-party образов
# (Ory → docker.io/oryd/*).
global:
  imageRegistry: ""
  kacho:
    # ─── СЛУЖБА ЛИЧНОСТИ: АДРЕСА СТЕНДА, А НЕ БОЕВЫЕ ─────────────────────────
    #
    # Умолчания собираются из `domain: api.kacho.cloud` и дают
    # `https://app.api.kacho.cloud/auth/<поток>`. На этом стенде такого имени
    # нет, слушателя на 443 тоже нет (kind отображает ТОЛЬКО 80 → 28080), а
    # потоки консольный nginx раздаёт в КОРНЕ (`^/(login|registration|…)`),
    # без префикса `/auth`. Пока это не объявлено, служба личности уводит
    # браузер на боевое имя: оно не разрешается, и ни одна проба консоли до
    # продукта не доходит (прогон 32599157014 — 66 из 66).
    #
    # Величины взяты не на глаз: это ровно то, что раздаёт консольный nginx
    # (ui-future/deploy/templates/configmap-nginx.yaml) — `/.ory/kratos/public/`
    # на публичный API службы и корневые пути на её интерфейс.
    identity:
      appBaseURL: "http://console.kacho.local:28080"
      kratosPublicBaseURL: "/.ory/kratos/public/"
      flowPathPrefix: ""
      # Cookie сессии обязана быть принята браузером на `console.kacho.local`:
      # родительский домен принимается, чужой (`api.kacho.cloud`) отвергается
      # целиком, и сессия не держится вовсе.
      cookieDomain: "kacho.local"
      webauthnRpId: "kacho.local"
      # ─── ПОЧТОВАЯ ПОЛОСА СТЕНДА ─────────────────────────────────────────
      #
      # Узел РЕАЛЬНО поднимается этой же поставкой (блок `mailpit` ниже,
      # шаблон templates/mail-receiver.yaml). Прежде здесь стоял адрес узла,
      # которого не поднимал ни один манифест, и `disable_starttls=true` —
      # два ложных утверждения о дереве в одной строке.
      #
      # ШИФРОВАНИЕ НЕ СНИМАЕТСЯ И НА СТЕНДЕ (Р5, ban #16): схема `smtp://`
      # означает STARTTLS, а `disable_starttls`/`skip_ssl_verify` здесь нет —
      # приёмник их и не принял бы, он требует STARTTLS сам
      # (`MP_SMTP_REQUIRE_STARTTLS`). Обе стороны, потому что посадку не должен
      # выбирать тот, кто её нарушает.
      #
      # ЯКОРЬ ПРОВЕРКИ объявлен ниже, у `kratos.deployment`: `ca.crt` секрета
      # приёмника монтируется службе личности и называется ей переменной
      # `SSL_CERT_FILE`. Без якоря шифрование было бы, а проверки — нет.
      #
      # Имя узла — короткое, в одном пространстве имён, ровно как у DSN баз
      # (`kacho-umbrella-pg-kratos`). Оно же стоит в `dnsNames` сертификата
      # приёмника: проверка сертификата сверяет ИМЯ СОЕДИНЕНИЯ, поэтому
      # расхождение этих двух мест дало бы отказ проверки, а не отказ связи.
      #
      # АДРЕС ОТПРАВИТЕЛЯ — НЕ ИЗ ДОМЕНА ПОСАДКИ, и это не косметика. Этот
      # профиль служит основанием четырём цепочкам из шести, включая посадку
      # БЕЗ доменного имени (`a8f60d`), где браузер приходит на голый адрес.
      # Гейт объявленной посадки (identity_domainless_landing_*) требует, чтобы
      # в настройках такой посадки не осталось НИ ОДНОГО адреса чужой посадки, и
      # требует справедливо: унаследованный `kacho.local` означал бы, что профиль
      # наследует посадку, о которой молчит. Домен продукта под это не подпадает
      # и адресом посадки не является.
      # УЗЕЛ НЕ ВЫПИСАН, А ВЫВЕДЕН — и это не стиль, а починка наблюдавшегося
      # отказа. Имя рабочего объекта приёмника складывается из имени релиза
      # (`kacho.mailReceiver.fullname`, templates/mail-receiver.yaml); оттуда же
      # берутся `dnsNames` его сертификата. Выписанный здесь литерал был ТРЕТЬИМ
      # местом об одном предмете и расходился с ними на всяком релизе, кроме
      # одного: рендер под именем `ci` — а именно так рендерит конвейер —
      # отвергался стражем полосы на ЧЕТЫРЁХ стеках из шести (dev, dev-prod,
      # prorobotech, a8f60d; prod и fe3455 полосы не объявляют вовсе).
      #
      # Выражение раскрывают ОБА читателя величины — шаблон настроек личности и
      # страж полосы, — тем же `.Release`, которым поднят объект и выпущен его
      # сертификат. Значит имя узла следует за релизом by construction, а не по
      # сверке.
      #
      # БЕРЁТСЯ ИМЕННО `.Release.Name`, А НЕ ВКЛЮЧЕНИЕ ШАБЛОНА ИМЕНИ, и это
      # измерено, а не выбрано: шаблон имени объявлен в умбрелле, а подчарт
      # личности рендерится ОДИНОЧНО пятью гейтами дерева и одной самопроверкой —
      # там включаемого шаблона нет, и величина роняла бы рендер на них всех.
      # `.Release` есть в любом контексте.
      #
      # СУФФИКС И ПОРТ ОСТАЮТСЯ ЛИТЕРАЛАМИ, и это сказано вслух, а не умолчано:
      # суффикс объявлен манифестом приёмника, порт — `mailpit.smtpPort`, и оба
      # узла значений видны только умбрелле. Их согласие держат ДВЕ проверки,
      # читающие манифест, — страж полосы при рендере и гейт дерева
      # (mail_receiver_core_test.go), — то есть не построение, а проверка.
      smtp:
        connectionURI: 'smtp://{{ .Release.Name }}-mailpit:1025/'
        fromAddress: "noreply@kacho.cloud"
        fromName: "Kacho Cloud"
      # ─── СХЕМЫ, УНАСЛЕДОВАННЫЕ ОТ СЛОЯ ПОД НАМИ ─────────────────────────
      #
      # Служба личности получает ДВА файла настроек; наш — второй, и его
      # секция `identity.schemas` СПИСОК, то есть замещает чужую целиком, а
      # не дополняет. Всё, что объявил подчарт провайдера ниже, из
      # конфигурации исчезает — а строки личностей, созданные до смены
      # схемы, ссылаются на неё ПО ИМЕНИ и без объявления не читаются
      # (`500 invalid_configuration`).
      #
      # Поэтому здесь стоит ЯКОРЬ, а ниже — ССЫЛКА на него: тело схемы
      # объявлено ОДИН раз и одним узлом YAML. Копия расходится молча, и
      # разойтись она может только в одну сторону — процесс возьмёт ту,
      # что стоит позже, то есть нашу. Якорь делает расхождение
      # невозможным by construction, а не проверяемым.
      #
      # Правя объявление провайдера ниже, правьте ЭТОТ узел: alias
      # подхватит правку сам. Покрытие держит
      # deploy/identity_inherited_schemas_are_declared_test.go.
      inheritedSchemas: &kachoInheritedIdentitySchemas
        - id: default
          url: "base64:"

# ─── cluster-internal mTLS (default ON for the dev stand) ──────────────────
# The whole scheme runs on mTLS: cert-manager mints an internal-CA, every
# component gets a server/client leaf cert, and every service→service edge below
# is verified mTLS. `make dev-up` brings this up in two phases (cert-manager
# first, then the Issuer/Certificate CRs + per-edge enable) to avoid the
# webhook-not-ready race. Set mtls.enabled=false (+ cert-manager.enabled=false)
# to fall back to the insecure dev stand.
mtls:
  enabled: true
cert-manager:
  enabled: true

# ─── УЗЕЛ-ПРИЁМНИК ПИСЕМ — ЧАСТЬ ПОСТАВКИ СТЕНДА ────────────────────────────
#
# Величины (образ с дайджестом, аппетит, порты, имя секрета) объявлены в
# values.yaml; здесь только факт: на СТЕНДЕ приёмник поднимается. Боевая
# площадка его не получает — там полоса ведёт во внешний ретранслятор.
#
# Этот стенд — база четырёх цепочек из шести (`dev`, `dev-prod`, `prorobotech`,
# `a8f60d`, см. deploy/stacks.txt), и ни один ШАРД сквозных проб приёмник не
# снимает: он не значится шлюзуемым компонентом (deploy/e2e-shards.json,
# `gates`), и попытка объявить такой шард — находка гейта
# deploy/mail_receiver_core_test.go. Так решение Р18 приёмки ID-MAIL-1 держится
# предикатом, а не этой фразой.
mailpit:
  enabled: true

api-gateway:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: authn.mode).
  authMode: production-strict
  # ─── Объявление приёма токена (Ф1б, задача #926) — НЕ ОБЪЯВЛЕНО НАМЕРЕННО
  #
  # Своя чеканка на этой фазе стенда не включена (см. kaname ниже: блока
  # tokenSigning здесь нет вовсе), поэтому принимать нашего издателя краю
  # нечего, и объявлять перечень не требуется.
  #
  # «Не объявлено» и «объявлено пустым» — РАЗНЫЕ состояния, и различает их
  # процесс: не объявлено ⇒ строится одна запись из hydra.issuer/jwksUrl ниже
  # (ровно сегодняшнее поведение); объявлено, но элементов ноль ⇒ отказ в
  # старте. Именно поэтому здесь стоит комментарий, а не `tokenAcceptance:` с
  # пустыми полями: пустая строка тут означала бы «принимаем любого издателя».
  #
  # Третья фаза подъёма переводит и это.
  advertisedEndpoint: localhost:18443
  image: kacho-api-gateway:dev
  imagePullPolicy: IfNotPresent
  # sec-hardening (r8): the composition-root prod-guard (validateProductionAuthzConfig)
  # treats an EMPTY KACHO_APP_ENV as production-class and fails closed on a relaxed
  # posture (CWE-1188), so the label is never left to chance.
  #
  # ЧТО ЭТА МЕТКА ПОКУПАЕТ СЕГОДНЯ — И ЭТО НАДО СКАЗАТЬ ЧИСЛОМ, А НЕ ПАМЯТЬЮ.
  # Здесь стояло «она позволяет внутреннему :9091 листенеру края работать без
  # mTLS на этом стенде». Предмета у послабления нет с задачи #1024: внутреннего
  # листенера у края нет вовсе, страж старта, который его градуировал, снят
  # вместе с ним. Послабление, которому нечего послаблять, читается как
  # действующее и потому опаснее отсутствующего.
  #
  # Метка при этом НЕ бесполезна: её по-прежнему читает страж посадки прав
  # (validateProductionAuthzConfig) — см. абзац выше. Исключения на общий ключ
  # подписи она не покупает ни под каким значением: та проверка идёт под любой
  # меткой именно потому, что метку выбирает тот, кто пишет профиль.
  #
  # First-class `appEnv` knob (chart values, KACHO_APP_ENV) — replaces the earlier generic
  # extraEnv.KACHO_APP_ENV passthrough. config.go binds it via `envconfig:"KACHO_APP_ENV"`
  # — a cross-cutting, domain-LESS deployment-env label, NOT the per-domain
  # KACHO_<DOMAIN>_<NAME> scheme.
  appEnv: dev
  # mTLS: backend-dial client to every backend (cert + per-edge env). Hybrid
  # external listener (cert-or-JWT). Cert config (issuer/spiffe/secret) — chart values.
  mtls:
    enable: true
    hybridExternal: true
    # Server leaf for the external listener, issued by kacho-internal-ca (keys
    # tls.crt/tls.key → tls.certPath/keyPath). Without it the pod mounts the
    # `api-gateway-tls` secret (tls.enabled=true) that nothing provisions.
    serverSecretName: api-gateway-tls
    edges:
      vpc: true
      compute: true
      iam: true
      nlb: true
      geo: true        # gateway→geo (+ geoInternal) mTLS; backends.geo uses chart default kacho-geo.* (geo cutover, kacho-workspace#82)
      registry: true   # gateway→registry backend mTLS (registry.mtls.enable=true → server RequireAndVerifyClientCert)
      storage: true    # gateway→storage backend mTLS (storage.mtls.enable=true); needs the storage edge added to the gateway chart (below)
  # KAC-NLB: pre-wire kacho-nlb public + internal endpoints so that when the
  # api-gateway proxy un-freezes the loadbalancer domain (see
  # kacho-api-gateway/internal/allowlist/list.go — `loadbalancer заморожен`),
  # `kacho-nlb.kacho.svc:9090` / `kacho-nlb-internal:9091` are
  # already resolvable through the chart's `backends.*` map (template:
  # kacho-api-gateway/deploy/templates/deployment.yaml emits env vars
  # conditionally — these become `KACHO_API_GATEWAY_NLB_GRPC` /
  # `KACHO_API_GATEWAY_NLB_INTERNAL_GRPC` once the sub-chart adds the
  # corresponding `{{- if .Values.backends.nlb }}` block).
  backends:
    vpc: vpc.kacho.svc:9090
    vpcInternal: vpc.kacho.svc:9091
    compute: compute.kacho.svc:9090
    computeInternal: compute.kacho.svc:9091
    iam: kaname.kacho.svc:9090
    iamInternal: kaname-internal.kacho.svc:9091
    nlb: kacho-nlb.kacho.svc:9090
    nlbInternal: kacho-nlb-internal.kacho.svc:9091
    # registry Service is `registry` / `registry-internal` (registry chart .Values.name),
    # NOT `kacho-registry` — the gateway RegistryAddr default dials `kacho-registry` and
    # would NXDOMAIN 503 every registry control-plane REST call. Override to the real name.
    registry: registry.kacho.svc:9090
    registryInternal: registry-internal.kacho.svc:9091
  # The local stand authenticates the same way every other stand does: a bearer the
  # edge verifies by SIGNATURE against the identity facade's published JWKS.
  #
  # THIS BLOCK USED TO DECLARE THE OPPOSITE, and the replacement is the point of the
  # change rather than a tidy-up. It named a relaxed mode plus a shared signing key
  # committed in the clear, so anyone holding this file could mint a bearer this stand
  # accepted, and the edge had no way to tell such a token from a provider-signed one.
  # Rotating the string would have changed nothing: it is shared by construction and
  # the file is public. `security.md` §"Production-mode — ОБЯЗАТЕЛЕН ВЕЗДЕ" settles it
  # — the relaxed posture is allowed only inside in-process fixtures, never on a stand
  # that is actually up, and "it is only the kind stand" is not an exemption, because
  # a stand that authenticates differently from production proves nothing about
  # production.
  #
  # The chart no longer offers a knob for a shared key at all, and the process refuses
  # to start if one reaches it another way. The harness follows the stand rather than
  # the other way round: tests/authz-fixtures/setup.sh reads the posture the live
  # gateway reports and obtains every bearer THROUGH iam (bootstrap mint →
  # SAKeyService.Issue → OAuth2 client_credentials), forging nothing.
  authn:
    # Apply the per-RPC authentication floor the catalog declares. Stated here
    # and not left to a default: absence is exactly the state in which the floor
    # was declared everywhere and applied nowhere. Machine principals are exempt
    # by the shared rule, which is why the e2e fixtures — service-account tokens
    # throughout — are unaffected.
    enforceStepUp: true
  # KAC-127: Phase 3 per-RPC authz middleware — ENABLED.
  #
  # The two structural blockers that previously forced `enabled: false` are
  # resolved (kacho-api-gateway#20):
  #   * Problem 1 — `RestRouter` is now wired (NewRestRouter, route table
  #     generated from the proto `google.api.http` annotations); REST paths
  #     resolve to gRPC FQNs so catalog lookups succeed.
  #   * Problem 2 — the permission catalog is fully populated (264/264 RPCs
  #     annotated in kacho-proto; the warnings file is empty).
  #
  # failOpen=false (fail-closed); iamAuthorizeUrl unset → derived from the
  # `iam` backend (public 9090); AuthorizeService.Check is the public RPC,
  # not routed through internal :9091 (loop-prevention #6).
  authz:
    enabled: true
    failOpen: false
    # checkTimeoutMs — per-Check hard deadline (KACHO_API_GATEWAY_AUTHZ_CHECK_TIMEOUT_MS).
    # Default 200ms is too tight for the kind dev stand: the FIRST gateway→iam-internal
    # Check pays a cold mTLS handshake (>200ms) → both attempts DeadlineExceeded →
    # "authz service unavailable" (code 14) on the very first authorised mutation
    # (seed Project.Create FATAL, and transient flakiness on cold suites). Once the
    # gRPC connection is warm Checks are sub-ms, so this only widens the cold-start
    # window. Prod keeps the 200ms default (values.prod.yaml unaffected).
    checkTimeoutMs: 2000
  # KAC-127 Phase 2 — Hydra JWKS for RS256 access-token verification.
  #
  # After register+login the SPA carries a Hydra-issued RS256 access token. The
  # gateway auth path validates it by fetching Hydra's JWKS. config.go derives
  # the JWKS endpoint from KACHO_HYDRA_ISSUER unless KACHO_HYDRA_JWKS_URL is set
  # explicitly; the derived default (`https://hydra.api.kacho.cloud/...`) is NOT
  # reachable from inside the cluster (Hydra's dev self.issuer is
  # `http://localhost:28080/.ory/hydra/public/`). So point the gateway at the
  # in-cluster Hydra PUBLIC Service directly.
  #
  # Service: `kacho-umbrella-hydra-public` (release kacho-umbrella), port 4444,
  # JWKS path `/.well-known/jwks.json` (Ory Hydra chart service-public.yaml).
  # Without this the gateway fetches the unreachable default → Hydra tokens are
  # never validated → WhoAmI / Account / Project return code 16 AUTHN_REQUIRED.
  # SEC-J: the verifier does an EXACT-match `iss` check, so the gateway issuer
  # MUST equal Hydra's `self.issuer` (hydra.config.urls.self.issuer below =
  # `http://localhost:28080/.ory/hydra/public/`) — the identity-string Hydra
  # stamps into the token `iss` claim (browser never navigates there). Without
  # it, KACHO_HYDRA_ISSUER derives the unreachable external default and every
  # real login token fails the iss check → AUTHN_REQUIRED persists.
  hydra:
    jwksUrl: "http://kacho-umbrella-hydra-public.kacho.svc:4444/.well-known/jwks.json"
    issuer: "http://localhost:28080/.ory/hydra/public/"
    # ─── Revocation path (ADMIN API — a different Service from the two above) ──
    # Where the gateway asks whether an access token has been revoked, and where
    # the logout handler ends the provider-side session. Neither is derivable:
    # the admin API is its own Service and port, and the dev issuer above is not
    # even a cluster address. This is also the base of the dev-prod stack, which
    # runs production posture — where the gateway refuses to start without both.
    #
    # Same in-cluster Service the identity service already uses for its own
    # admin calls (kaname.hydraAdminUrl below). Never routed outside.
    introspectionUrl: "http://kacho-umbrella-hydra-admin.kacho.svc:4445/admin/oauth2/introspect"
    adminUrl: "http://kacho-umbrella-hydra-admin.kacho.svc:4445"

compute:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: auth.mode).
  authMode: dev
  image: kacho-compute:dev
  imagePullPolicy: IfNotPresent
  # Dev/newman profile deploys iam+vpc+geo but NOT kacho-storage (storage.enabled=false,
  # SERVICES в deploy/Makefile = iam vpc compute api-gateway nlb). Компьют-конфиг
  # ДЕФОЛТИТ KACHO_COMPUTE_STORAGE_INTERNAL_GRPC_ADDR на `kacho-storage…:9091`
  # (config.go, непустой default — как iam/geo/vpc). В dev этот адрес не резолвится →
  # каждая storage-зависимая instance-op (Delete-instance volume-release, AttachDisk,
  # DetachDisk) ретраит down-peer'а retry.OnUnavailable ~30s → завершается code=14
  # "storage service unavailable", а newman poll-budget (~15s) истекает раньше →
  # done:false-каскад (instance-суита) + провал cleanup-Delete в list-filter. Пустой
  # addr → NoopStorageClient (main.go): ListAttachments пуст → step-3 delete-саги и
  # Detach быстрые, Attach → быстрый fail-fast (не 30s-hang). envconfig(kelseyhightower):
  # env, выставленный в "" (present), ПЕРЕБИВАЕТ непустой default (default только при
  # unset). Прод не затронут — values.fe3455-prod.yaml выставляет реальный addr явно.
  # Attach/Detach-VOLUME кейсы (INST-AD/INST-DD) требуют ЖИВОГО storage — зелёные только
  # в umbrella-e2e со storage.enabled=true, не в этом compute-only профиле.
  # storageInternalAddr — first-class compute-chart key (deployment renders
  # KACHO_COMPUTE_STORAGE_INTERNAL_GRPC_ADDR from it). storage is now LIVE in the
  # dev umbrella (storage.enabled=true below), so point compute at it instead of ""
  # (NoopStorageClient). Enables AttachDisk/DetachDisk/ListAttachments + the
  # Delete-instance volume-release step. The 30s-hang risk the "" guarded only
  # applied when storage was DOWN — with storage Ready the InternalVolumeService
  # resolves fast. serverName.storage (compute→storage mTLS) chart default
  # kacho-storage.kacho.svc ∈ storage server-cert SAN.
  storageInternalAddr: kacho-storage.kacho.svc:9091
  # vpcInternalAddr здесь БОЛЬШЕ НЕ ПЕРЕОПРЕДЕЛЯЕТСЯ — действует умолчание чарта
  # (vpc.kacho.svc:9091), как и во всех остальных профилях: ни один
  # другой профиль зонтика этот ключ не задавал.
  #
  # Тут стояло `vpcInternalAddr: ""` с обоснованием «ребро compute→vpc :9091 в этом
  # профиле недоступно (codes.Unavailable), поэтому шаг высвобождения интерфейса
  # сжигает весь 30-секундный бюджет повторов на КАЖДОМ удалении машины». Симптом
  # был описан верно, причина — нет: недоступность создавал сам чарт компьюта.
  # Группу клиентских кред `KACHO_COMPUTE_VPC_NIC_MTLS_*` конфиг читал, а шаблон не
  # выставлял НИ РАЗУ (`git log -S 'VPC_NIC_MTLS' 6b1293713 -- services/compute/deploy/`
  # → 0 коммитов; ревизия названа намеренно — без неё предикат устаревает от того
  # самого коммита, который его закрывает), поэтому дозвон шёл открытым текстом
  # на листенер, который требует проверенный клиентский сертификат, —
  # рукопожатие обрывалось, и вызывающий
  # получал ровно тот самый codes.Unavailable. Производитель группы добавлен в
  # шаблон; парность объявления и производителя держит гейт
  # services/compute/deploy/peer_mtls_producer_test.go.
  #
  # Почему пустую строку нельзя было оставить как «осознанный размен»: она не
  # выключает ребро, а подменяет его заглушкой (NoopNicClient). Привязка интерфейса
  # отвечает Unavailable, а шаг ВЫСВОБОЖДЕНИЯ интерфейса на удалении машины молча
  # находит пустой список и не снимает ничего — то есть тихая деградация вместо
  # отказа. Пустое значение на этом ключе теперь отвергает проба
  # services/compute/deploy/peer_addr_profiles_test.go.
  # Dev kind stack: pg-compute (bitnami postgres) serves NO TLS, so the migrator
  # + serve DB channel must be sslmode=disable. The compute chart DEFAULTS to
  # `require` (stricter than vpc/iam, which default to disable), which here fails
  # with "server refused TLS connection" → the migrate init container
  # CrashLoopBackOff (pod stuck PodInitializing). Service→service mTLS stays on
  # (mtls.enable=true below); only the ephemeral in-cluster DB channel is
  # plaintext — exactly like vpc/iam in this dev profile.
  db:
    sslMode: disable
  # mTLS: server (gateway/vpc/nlb dial here) + client (compute→iam, compute→vpc, compute→geo, compute→storage).
  mtls:
    enable: true
    edges:
      iamRegister: true
      iamProject: true
      iamAuthz: true
      vpc: true
      geo: true        # compute→geo zone_id validation (geo cutover, kacho-workspace#82)
      storage: true    # compute→storage InternalVolumeService (attach/detach) over mTLS;
                       # serverName.storage chart default kacho-storage.kacho.svc ∈ storage SAN
  # KAC-178 follow-up: compute authzIam.grpcAddr дефолт `kaname:9091` в
  # kacho-compute/deploy/values.yaml неверный — Service `kaname`
  # экспонирует только port 9090 (public AuthorizeService);
  # `InternalIAMService.Check` живёт на `kaname-internal:9091`. Без этого
  # override compute per-RPC authz interceptor бил в closed port → i/o
  # timeout → "authorization service unavailable" на каждом list/get RPC
  # (instances/disks/images/snapshots, и т.п.).
  authzIam:
    grpcAddr: kaname-internal.kacho.svc:9091

# ─── kacho-storage — Storage control-plane (Volume/Snapshot/Image/DiskType) ───
# Enabled for the dev/newman stand. Base values.yaml keeps it OFF and pins the
# image to :main-latest (a documented placeholder that doesn't exist) → override
# back to the local kind image (Makefile SERVICES builds kacho-storage:dev).
# storage is FAIL-CLOSED on its peer edges (serve.go dialPeer + geo_client): an
# empty geo/iam addr → Volume.Create returns Unavailable, so the geo/iam edges
# MUST be wired. iam+geo run server-mTLS (RequireAndVerifyClientCert) → storage
# MUST run mtls.enable=true (client-mTLS to them is coupled to server-mTLS under
# one flag). Added to MTLS_SUBCHARTS in deploy/Makefile (phase-1 bootstrap gate).
storage:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.authMode).
  # dev relaxes the prod-guard that would force TLS-DB; service→service mTLS stays ON.
  authMode: dev
  enabled: true
  image:
    repository: kacho-storage   # local kind image (kacho-storage:dev)
    tag: dev
    pullPolicy: IfNotPresent
  config:
    geoGrpcAddr: kacho-geo.kacho.svc:9090        # storage→geo ZoneService.Get (zone_id), :9090
    iamGrpcAddr: kaname.kacho.svc:9090        # storage→iam ProjectService.Get, :9090
    authzIamGrpcAddr: kaname-internal.kacho.svc:9091  # per-RPC Check + RegisterResource, :9091
    # Materialize owner-tuples so gateway scope_extractors {storage_volume,volume_id}/
    # {storage_snapshot,snapshot_id} resolve target→project (own-resource authz).
    # Requires authzIamGrpcAddr + mtls.edges.iam + iam seed 0057_storage_sa_least_priv.
    fgaRegisterDrainerEnabled: true
  db:
    # bitnami pg-storage Service (release alias) + its auto-provisioned Secret.
    host: kacho-umbrella-pg-storage
    sslMode: disable            # dev pg serves no TLS (chart default 'require' would refuse)
    passwordSecretName: kacho-umbrella-pg-storage
    passwordSecretKey: password
  # server-mTLS both listeners + client-mTLS storage→{geo,iam}. serverName.geo/iam
  # chart defaults (kacho-geo… / kaname.kacho.svc) are in the peer SANs.
  mtls:
    enable: true
    edges:
      geo: true
      iam: true

# backing Postgres for kacho-storage (schema kacho_storage). Service
# kacho-umbrella-pg-storage; auto-Secret kacho-umbrella-pg-storage key `password`.
pg-storage:
  enabled: true
  auth:
    username: storage
    password: changeme-dev-storage   # NON-SECRET dev placeholder (see file header)
    database: kacho_storage
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1500m, memory: 1Gi }
  image:
    repository: bitnamilegacy/postgresql
    # Тег ПРИПИНЕН и одинаков у всех инстансов — см. §«Почему тег обязателен»
    # ниже по файлу (у pg-kratos). Умолчание чарта (16.1 на debian-11) в этом
    # ряду НЕ работает: его initdb отказывается стартовать, когда не может
    # разрешить собственный идентификатор пользователя, а образ записи о нём не
    # несёт. Расхождение было невидимым ровно потому, что два инстанса тег имели,
    # а восемь — нет.
    tag: "16.4.0-debian-12-r0"
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

# ─── kacho-geo (Geography Region/Zone leaf-service) ─────────────────────────
# geo is now an external OSS single-repo, consumed as a PUBLISHED dependency
# (not rebuilt from source in this umbrella). The dev stand + newman-e2e pull
# the known-good published tag (the build running on the long-lived fe3455
# stand) instead of a locally-built `kacho-geo:dev` — building from the OSS HEAD
# produced a runtime-broken image (geo-read 503 → cascading compute failures).
# Bump this tag in lockstep with newman-e2e.yml KACHO_GEO_IMAGE + the geo
# sub-chart default when geo cuts a new known-good build.
# dev = insecure posture (AUTH_MODE=dev) BUT mTLS is ON on the dev stand, so
# server-creds on both listeners + the geo→iam Check client edge are enabled
# (mirrors compute/vpc). authzIam stays wired at iam-internal :9091.
kacho-geo:
  # Branch build (kacho-geo:dev, kind-loaded by `make build-services`). Verified
  # locally: geo:dev boots clean (authMode=dev, mTLS server-creds mounted) and serves —
  # the earlier CI CrashLoop was NOT a runtime-broken image but a cert-provisioning race
  # in a fresh helm install. authMode=dev so DB sslmode=disable + insecure dev posture
  # is permitted.
  #
  # ЯВНО dev. Раньше бралось из дефолта сабчарта, который был `dev`; дефолт переведён
  # на `production` (secure-by-default, core rule #16), поэтому dev-профиль обязан
  # declar'ить свою insecure-posture сам, а не наследовать её.
  authMode: dev
  image: kacho-geo:dev
  imagePullPolicy: IfNotPresent
  env:
    # Круг отправителей чужой личности — по ФАКТИЧЕСКИМ отправителям: справочник
    # размещения читают на пути запроса vpc, compute, nlb, storage и registry, и
    # каждый форвардит личность инициатора. Отправитель вне круга получает не
    # «свой сертификат», а СНЯТУЮ личность → geo видит вызов без принципала.
    # Обоснование состава и ловушка с пространством имён storage — values.prod.yaml.
    KACHO_GEO_AUTHZ_TRUSTED_FORWARDER_SANS: "spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway,spiffe://kacho.cloud/ns/kacho/sa/kacho-vpc,spiffe://kacho.cloud/ns/kacho/sa/kacho-compute,spiffe://kacho.cloud/ns/kacho/sa/kacho-nlb,spiffe://kacho.cloud/ns/kacho-storage/sa/kacho-storage,spiffe://kacho.cloud/ns/kacho/sa/kacho-registry"
  mtls:
    enable: true
    edges:
      iamAuthz: true
  # S7: the one-time compute→geo geography copy is complete; compute no longer
  # owns/serves Region/Zone (tables dropped). geo seeds its own baseline, so the
  # migration Job is obsolete (and would fail reading the dropped kacho_compute
  # source). Disabled — the gated template stays as a one-time tool only.
  dataMigration:
    enabled: false

ingress-nginx:
  controller:
    # Standard kind+ingress-nginx pattern: hostPort на kind-ноде,
    # extraPortMappings в kind-config мапит хост:80 → нода:80.
    hostPort:
      enabled: true
      ports:
        http: 80
        https: 443
    service:
      type: ClusterIP
    nodeSelector:
      ingress-ready: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        effect: NoSchedule
    # На single-node kind кластере с одним replica — без anti-affinity
    affinity: {}
    publishService:
      enabled: false
    extraArgs:
      publish-status-address: localhost

