      synchronous_commit = local
      max_connections = 200
      shared_buffers = 128MB
      work_mem = 8MB
      effective_cache_size = 512MB
      # kacho_nlb.fga_register_outbox. Rationale in values.yaml; repeated here
      # because a later -f replaces this whole string instead of merging into it.
      autovacuum_naptime = 5s
  image:
    repository: bitnamilegacy/postgresql
    # Тег ПРИПИНЕН и одинаков у всех инстансов — см. §«Почему тег обязателен»
    # ниже по файлу (у pg-kratos). Умолчание чарта (16.1 на debian-11) в этом
    # ряду НЕ работает: его initdb отказывается стартовать, когда не может
    # разрешить собственный идентификатор пользователя, а образ записи о нём не
    # несёт. Расхождение было невидимым ровно потому, что два инстанса тег имели,
    # а восемь — нет.
    tag: "16.4.0-debian-12-r0"
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

# KAC-127: Zitadel chart + конфиг удалены — auth-tier (identity/OIDC) на Ory
# Kratos + Hydra. OIDC issuer для kaname теперь Hydra.

# KAC-115: Ory stack — Kratos (identity) + Hydra (OIDC) + Keto (REBAC).
# Включаются вместо Zitadel через overrides.yaml.

pg-kratos:
  # KAC-127: backing Postgres для Kratos — включён вместе с kratos.
  enabled: true
  global: { security: { allowInsecureImages: true } }
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "16.4.0-debian-12-r0"
  auth:
    username: kratos
    password: changeme-dev-kratos
    database: kratos
  primary:
    persistence: { enabled: true, size: 1Gi }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1, memory: 1Gi }

pg-hydra:
  # KAC-127: backing Postgres для Hydra — включён вместе с hydra.
  enabled: true
  global: { security: { allowInsecureImages: true } }
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "16.4.0-debian-12-r0"
  auth:
    username: hydra
    password: changeme-dev-hydra
    database: hydra
  primary:
    persistence: { enabled: true, size: 1Gi }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1, memory: 1Gi }

kratos:
  # KAC-127: Phase 2 IAM-стек требует Kratos (identity) включённым для smoke.
  enabled: true
  deployment:
    # ─── КОНФИГУРАЦИЯ ДОЛЖНА ДОЕЗЖАТЬ ДО ПРОЦЕССА, А НЕ ТОЛЬКО РЕНДЕРИТЬСЯ ─────
    #
    # Карты настроек `kaname-kratos-{config,hooks,identity-schema}` собирает
    # наш подчарт, и до этой провязки их НИКТО не монтировал: служба личности
    # работала на СОКРАЩЁННОЙ конфигурации подчарта поставщика (перечень её
    # разделов здесь не воспроизводится — он был бы вторым местом об одном
    # предмете). Практическое следствие — обе полосы обратных вызовов (заведение
    # пользователя и завершение восстановления доступа) не исполнялись ни на
    # одном стенде, а схема личности подменялась умолчанием поставщика.
    #
    # Со стороны это выглядело исправным: шаблоны рендерились, карты в кластере
    # присутствовали, транспорт полос был объявлен защищённым и проверялся
    # соседней пробой. Не хватало ровно одного — чтения.
    #
    # Служба принимает НЕСКОЛЬКО файлов конфигурации и сливает их по порядку,
    # поэтому наш файл идёт ВТОРЫМ — и всякий раздел, который объявляем МЫ,
    # ЗАМЕЩАЕТ одноимённый раздел поставщика ЦЕЛИКОМ, а не дополняет его.
    #
    # Здесь стояло обратное — «дополняет базовый, а не заменяет его: DSN, адреса
    # слушателей и почтовая полоса остаются за подчартом поставщика», — и из трёх
    # названных разделов верно было ОДНО. Наш шаблон объявляет и адреса
    # слушателей, и почтовую полосу (последнюю — безусловно); за поставщиком из
    # перечисленного остаётся только DSN. Цена ложного перечня измерима и почти
    # наступила: по нему делался вывод о МЕСТЕ ПРАВКИ почтовой полосы, и вывод
    # был бы неверным — правится она в нашем шаблоне.
    #
    # Перечень разделов здесь НЕ ВОСПРОИЗВОДИТСЯ: он машинно выводим из
    # `_kratos-identity.tpl`, а второе его изложение переживает правку шаблона
    # молча. Рукописный перечень — находка MAIL-54
    # (deploy/identity_mail_lane_single_declaration_test.go).
    #
    # Пути не выдуманы здесь: они те же, что уже стоят внутри самой
    # конфигурации (`file:///etc/config/kratos/...`), поэтому провязка сводится
    # к монтированию каталога, а не к правке ссылок. Отдельные файлы монтируются через
    # subPath — два тома на один каталог не поставить.
    extraArgs:
      - --config
      - /etc/kacho-identity-rendered/kratos.yaml
    # ─── ВЕЛИЧИНА ОБРАТНОГО ВЫЗОВА ОБЯЗАНА ДОЕХАТЬ ДО ПРОЦЕССА ────────────────
    #
    # Конфигурация объявляет учётные данные обратных вызовов как `${KANAME_HOOK_TOKEN}`
    # — то есть рассчитывает на подстановку. Служба личности подстановки в
    # ЗНАЧЕНИЯХ конфигурации НЕ делает: она переопределяет ключи переменными по
    # пути, а элемент массива хуков таким путём невыразим. Значит строка уезжала
    # в заголовок ДОСЛОВНО, служба прав отвечала `401`, а провайдер — `502`:
    # вход паролем не проходил, посев церемонии не вставал, девять коллекций
    # оставались без отчёта (прогон 32532668160, задача #948).
    #
    # Подставляем в поде, ДО старта процесса. Образ берётся ТОТ ЖЕ, что у
    # главного контейнера, — ничего нового не тянем, и версия совпадает by
    # construction. Секрет при этом не попадает ни в карту настроек, ни в рендер
    # чарта: он приезжает из существующего Secret прямо в память init-контейнера.
    #
    # ОТКАЗ ЗАКРЫТЫЙ: пустая величина и любая непод­ставленная ссылка роняют
    # запуск с текстом, называющим ручку. Молчаливый проход здесь означал бы
    # ровно тот дефект, который чинится: полоса исполняется и отвергается.
    extraInitContainers: |
      {{- include "kacho.identity.configRenderInitContainer" . | nindent 0 }}
    # ─── ОТПЕЧАТКИ СОДЕРЖИМОГО: без них правка настроек НЕ ПЕРЕКАТЫВАЕТ под ────
    #
    # Настройки приезжают томом и читаются процессом ОДИН РАЗ — на старте.
    # Правка карты настроек не меняет шаблон пода, значит Kubernetes под НЕ
    # перекатывает, и процесс продолжает жить со старым содержимым, пока его не
    # перезапустит что-нибудь постороннее. Дерево и работающая система
    # расходятся МОЛЧА, а любой гейт, читающий рендер, отчитается новым значением.
    #
    # ПОЧЕМУ ПЕРЕМЕННЫЕ, А НЕ АННОТАЦИЯ. Из ручек чарта провайдера через
    # шаблонизацию (`tpl`) проходит РОВНО ОДНА — `deployment.extraEnv`;
    # `deployment.annotations` и `podMetadata.annotations` идут прямым `toYaml`,
    # и вычислить в них sha256 не из чего. Тот же вывод и та же развилка, что у
    # соседа-терминатора административного перехода (_hydra-admin-tls.tpl).
    #
    # Значения НЕ читаются процессом — они существуют ради того, чтобы шаблон
    # пода менялся вместе с содержимым. Отпечаток берётся с ТОГО ЖЕ
    # именованного шаблона, из которого рендерится сама карта настроек, поэтому
    # соответствие доказано построением, а не заявлено.
    #
    # Курьер наследует эти переменные тем же способом, каким наследует тома
    # (`statefulSet.extraEnv` пуст ⇒ берётся `deployment.extraEnv`), поэтому
    # привязку получают ОБА рабочих объекта.
    extraEnv:
      - name: KACHO_IDENTITY_CONFIG_SHA256
        value: '{{ printf "%s\n" (include "kacho.identity.configYaml" .) | sha256sum }}'
      - name: KACHO_IDENTITY_SCHEMA_SHA256
        value: '{{ printf "%s\n" (include "kacho.identity.schemaJSON" .) | sha256sum }}'
      - name: KACHO_IDENTITY_HOOKS_SHA256
        value: '{{ printf "%s\n%s\n" (include "kacho.identity.hookIdentityPayload" .) (include "kacho.identity.hookRecoveryPayload" .) | sha256sum }}'
      # ─── ЯКОРЬ ПРОВЕРКИ СЕРТИФИКАТА ПОЧТОВОГО УЗЛА (решение Р5) ───────────
      #
      # Полоса до приёмника шифрована (`smtp://` ⇒ STARTTLS), а сертификат он
      # предъявляет ВНУТРЕННЕГО удостоверяющего — того же, что и весь остальной
      # стенд. В корневых хранилищах образа такого якоря нет, поэтому проверка
      # отвергла бы соединение, и отвергла бы ПРАВИЛЬНО: шифрование без
      # проверки якоря защищает от подслушивания и не защищает от подмены.
      #
      # Отсюда переменная: библиотека времени исполнения службы личности читает
      # `SSL_CERT_FILE` при сборке корневого набора. Величина адресует `ca.crt`
      # ТОГО ЖЕ секрета, который cert-manager выпускает приёмнику, — то есть
      # якорь и предъявляемый сертификат приходят из одного источника by
      # construction, и разойтись им негде.
      #
      # ЧТО ЭТА ВЕЛИЧИНА НЕ ДЕЛАЕТ: она не отменяет остальные корневые якоря —
      # каталог системных корней читается отдельной переменной и здесь не
      # трогается. На этом стенде исходящих соединений с публичными якорями у
      # службы личности нет вовсе (база — без TLS, обратные вызовы — по `http`),
      # поэтому и предмета у такой отмены нет.
      #
      # Курьер наследует переменные тем же способом, каким наследует тома, —
      # значит якорь получает и ПОЧТОВЫЙ объект, а письма шлёт именно он.
      # ДОВЕРИЕ: ДОПОЛНЯЕТ
      #
      # Переменная замещает список ФАЙЛОВ, но не список КАТАЛОГОВ, поэтому
      # набор корней остаётся объединением: замер даёт 123 → 124, а не 123 → 1.
      # Исключительность потребовала бы пинить обе переменные — и сломала бы
      # fail-closed почтового курьера, который в иной посадке смотрит на шлюз
      # TLS. Здесь якорь ДОБАВЛЯЕТСЯ, и это решение, а не побочный эффект.
      - name: SSL_CERT_FILE
        value: /etc/kacho-mail-anchor/ca.crt
    extraVolumes:
      - name: kacho-identity-config
        configMap:
          name: kaname-kratos-config
      # Отрендеренная конфигурация: её пишет init-контейнер, читает процесс.
      # Том пода, а не карта настроек, — величина обратного вызова не обязана
      # существовать нигде, кроме памяти этих двух контейнеров.
      - name: kacho-identity-rendered
        emptyDir: {}
      - name: kacho-identity-hooks
        configMap:
          name: kaname-kratos-hooks
      - name: kacho-identity-schema
        configMap:
          name: kaname-kratos-identity-schema
      # Якорь проверки сертификата почтового узла. Проецируется ОДИН ключ:
      # секрет несёт ещё и закрытый ключ приёмника, а он службе личности не
      # нужен ни для чего. Ключ, смонтированный «за компанию», — это доступ,
      # которого никто не решал.
      - name: kacho-mail-anchor
        secret:
          secretName: kacho-mailpit-tls
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      # Шаблон конфигурации главному контейнеру НЕ монтируется: он читает
      # отрендеренное. Смонтировать оба значило бы держать рядом два файла, из
      # которых один рабочий, — и следующая правка `--config` вернула бы дефект.
      - name: kacho-identity-rendered
        mountPath: /etc/kacho-identity-rendered
        readOnly: true
      - name: kacho-identity-schema
        mountPath: /etc/kacho-identity/identity.schema.json
        subPath: identity.schema.json
        readOnly: true
      - name: kacho-identity-hooks
        mountPath: /etc/kacho-identity/hooks
        readOnly: true
      - name: kacho-mail-anchor
        mountPath: /etc/kacho-mail-anchor
        readOnly: true
  # ─── ПОЧТОВЫЙ ПРОЦЕСС ЧИТАЕТ ТО ЖЕ, ЧТО ОСНОВНОЙ ─────────────────────────
  #
  # Раздача настроек двум рабочим объектам службы личности НЕСИММЕТРИЧНА, и это
  # свойство ЧУЖОГО чарта, а не наше решение: тома, монтирования, переменные и
  # init-контейнеры почтовый процесс НАСЛЕДУЕТ от основного, когда своих не
  # объявлено, — а аргументы командной строки НЕ наследует: у него своя ручка.
  #
  # Поэтому строки ниже — не дубль ради симметрии, и снимать их как избыточные
  # нельзя. Без них карты настроек до почтового процесса ДОЕЗЖАЮТ томами, а
  # указание их читать — нет: со стороны кластера всё смонтировано, со стороны
  # процесса не изменилось ничего. Письма шлёт именно он, а раздел
  # `courier.smtp` живёт в той самой конфигурации — значит отправителя и шлюз
  # мы бы объявляли, применялись бы чужие умолчания, и заметить это неоткуда:
  # письма продолжают уходить.
  #
  # Путь тот же, что у основного процесса, и это обязано остаться так: файл
  # один. Согласие двух ручек держит
  # deploy/identity_courier_reads_what_it_mounts_test.go, а не внимание;
  # предпосылку о чужом чарте перемеряет deploy/identity_courier_arg_premise_test.go.
  statefulSet:
    extraArgs:
      - --config
      - /etc/kacho-identity-rendered/kratos.yaml
  kratos:
    development: true
    automigration:
      enabled: true
      # KAC-127: type=initContainer вместо дефолтного `job`. Ory-чарт по дефолту
      # вешает на migration-Job pre-install hook (job.annotations в values чарта) →
      # Job стартует ДО pg-kratos (обычный release-ресурс) → DNS-резолв
      # `kacho-umbrella-pg-kratos` фейлится навсегда → hook не завершается →
      # `helm --wait` блокируется → release failed. initContainer-режим исполняет
      # миграцию как init-container Kratos-пода — отдельного hook-Job нет.
      type: initContainer
    config:
      dsn: "postgres://kratos:changeme-dev-kratos@kacho-umbrella-pg-kratos:5432/kratos?sslmode=disable"
      serve:
        public:
          # Relative base_url — генерируемые links резолвятся к текущему origin
          # клиента (на каком бы port-forward порту он ни был — :9091, :18888,
          # :28080). Cookies остаются same-origin → пользователь должен
          # использовать ОДИН port в течение session, но любой работает.
          base_url: "/.ory/kratos/public/"
          cors:
            enabled: true
            # Dev: allow any localhost / 127.0.0.1 port (любое port-forward).
            allowed_origins: ["*"]
        admin:
          base_url: "http://kacho-umbrella-kratos-admin:80/"
      selfservice:
        # Все browser-redirect URLs — relative. Браузер сам резолвит к текущему origin.
        default_browser_return_url: "/"
        # ─── ЭТОТ СПИСОК ДО ПРОЦЕССА НЕ ДОЕЗЖАЕТ (#1238) ─────────────────────
        #
        # Здесь стояло «whitelist для return_to query — relative + любой
        # localhost-port», и это утверждение пережило свой предмет. Служба
        # получает ДВА файла настроек и сливает их по порядку; наш идёт ВТОРЫМ, а
        # список под общим ключом не дополняется — он ЗАМЕЩАЕТСЯ целиком. Значит
        # действует ОДНА запись из тела продукта
        # (charts/kaname/templates/_kratos-identity.tpl), а эти десять —
        # умолчание, которое к процессу не относится.
        #
        # Сужение решено и записано: решение и его цена — в ведомости
        # `identityReplacedListDecisions`
        # (deploy/identity_replaced_lists_are_decided_test.go). Правя список
        # здесь, правьте объявление продукта: правка ТОЛЬКО этих строк не
        # доезжает никуда, и это не видно ни в рендере, ни при старте.
        allowed_return_urls:
          - "/"
          - "/dashboard"
          - "http://localhost:9091/"
          - "http://localhost:18888/"
          - "http://localhost:28080/"
          - "http://localhost:8080/"
          - "http://127.0.0.1:9091/"
          - "http://127.0.0.1:18888/"
          - "http://127.0.0.1:28080/"
          - "http://console.kacho.local/"
        # ─── МЕТОДЫ ВХОДА ЗДЕСЬ НЕ ОБЪЯВЛЯЮТСЯ (#1213) ────────────────────────
        #
        # Здесь стоял перечень методов, и он ПРОТИВОРЕЧИЛ единственному
        # объявлению продукта (`charts/kaname/templates/_kratos-identity.tpl`):
        # там одноразовый код по времени включён, здесь — выключен. Процесс
        # получает оба файла и сливает их по порядку, то есть какая из двух
        # величин победит, решал ПОРЯДОК, которого никто не выбирал.
        #
        # Цена измерена: замер на стенде читал метод второго фактора выключенным
        # (эта строка) при включённом в дереве, и вывод «второй уровень
        # уверенности недостижим» строился на половине правды. А недостижимый
        # второй уровень означает, что 32 глагола каталога прав с полом «2»
        # закрыты из браузера ДЛЯ ВСЕХ.
        #
        # Методы объявляются ОДИН раз, в теле настроек продукта. Держит это
        # `deploy/identity_second_factor_reachable_test.go`: профиль, который
        # доводит наши настройки до процесса и при этом сам высказывается о
        # методах второго фактора, — находка.
        flows:
          registration:
            enabled: true
            ui_url: "/registration"
            after:
              password: { hooks: [{ hook: "session" }] }
          login:
            ui_url: "/login"
          settings:
            ui_url: "/settings"
          # ─── О ПОТОКАХ ДОСТАВКИ ЭТОТ ПРОФИЛЬ НЕ ВЫСКАЗЫВАЕТСЯ (MAIL-18) ────
          #
          # Здесь стояли `recovery` и `verification`. Оба были ВТОРЫМ мнением:
          # наша конфигурация личности объявляет раздел `selfservice` целиком и
          # идёт вторым файлом, поэтому одноимённый раздел поставщика замещается
          # ею полностью. Две величины доезжали до процесса, и какая применится,
          # решал бы порядок слияния, а не решение.
          #
          # Практическая цена была наблюдаема: поток подтверждения объявлялся
          # здесь ВЫКЛЮЧЕННЫМ рядом с ВКЛЮЧЁННЫМ в единственном объявлении, при
          # том что требование подтверждённого адреса на входе никуда не
          # девалось. Это и есть #1234, и складывается он только из СУММЫ
          # источников — по файлу каждый из них внутренне согласован.
          #
          # Потоки, доставляемые письмом, объявляются один раз — в
          # `_kratos-identity.tpl`. Держит это
          # deploy/identity_delivery_flows_declared_once_test.go.
          error:
            ui_url: "/error"
      log:
        level: info
        format: json
      secrets:
        default: ["please-change-this-32-bytes-D3Fx"]
        cookie: ["please-change-this-32-bytes-A1Bx"]
        cipher: ["please-change-this-32-bytes-A1Bx"]
      session:
        lifespan: "24h"
      identity:
        default_schema_id: default
        # Тело схемы объявлено ОДНИМ узлом — в global.kacho.identity.inheritedSchemas
        # (см. разбор там же). Здесь стоит ссылка на него, потому что нашей
        # секции настроек значения подчарта провайдера не видны, а копия
        # литерала разошлась бы молча.
        schemas: *kachoInheritedIdentitySchemas
      # ─── ВСТРОЕННОГО БЛОКА `courier` ЗДЕСЬ НЕТ (решение Р27) ──────────────
      #
      # Он здесь стоял и был ВТОРЫМ объявлением почтовой полосы. Единственное
      # объявление — наша конфигурация личности (`_kratos-identity.tpl`),
      # питаемая `global.kacho.identity.smtp.*`; наш файл идёт вторым в цепочке
      # `--config`, поэтому раздел `courier`, объявленный нами, замещает
      # одноимённый раздел поставщика ЦЕЛИКОМ. Пока об одной полосе
      # высказывались два места, какое из них доедет до процесса, решал бы
      # порядок слияния, а не решение.
      #
      # Держит MAIL-54 — deploy/identity_mail_lane_single_declaration_test.go:
      # возвращённый блок здесь — находка с именем профиля.
  # ─── ТРЕТЬЕЙ КОПИИ ТЕЛА СХЕМЫ ЗДЕСЬ НЕТ (#1239) ───────────────────────────
  #
  # Здесь стояло `identitySchemas` с телом схемы, дословно совпадавшим с телом
  # унаследованной схемы выше (совпадал и `$id`). Объявление было МЁРТВЫМ:
  # подчарт поставщика читает `.Values.kratos.identitySchemas`, то есть уровнем
  # НИЖЕ этого ключа, поэтому оно не резолвилось и в рендер не попадало — в
  # карте настроек службы личности как был, так и остался единственный ключ
  # `kratos.yaml` (сверено рендером до и после снятия: состав ключей тот же).
  #
  # Снято, а не перенесено под своего читателя: тело уже приезжает процессу
  # ссылкой на якорь `kachoInheritedIdentitySchemas` (см. выше), отдельный файл
  # схемы рядом с ним никому не нужен, а перенос дал бы ЧЕТВЁРТОЕ место об одном
  # предмете. Мёртвое объявление хуже лишнего: следующий читатель принимает его
  # за действующее и правит ЕГО вместо живого.
  #
  # Держит `deploy/identity_schema_body_single_node_test.go`: тело схемы
  # объявляется ОДНИМ узлом, и узел этот обязан нести имя якоря.

# KAC-127 Phase 2 — Hydra OAuth 2.1 + DPoP + mTLS-bound + JWT-strategy.
# Acceptance §5.2: refresh rotation (force-rotate, 1s race window), PKCE mandatory,
# Implicit + ROPC grants disabled, TTLs (access 15min / refresh 30d / id 15min / auth_code 1min),
# JWT signing (RS256 / ES256 / EdDSA), token_hook + refresh_hook → kaname :9091.
#
# Dev-стенд (kind, kacho.local) — `enabled: false` по умолчанию; включается через
# overrides.yaml в clusters/<cluster>/. URLs используют intentional dev-IP
# (localhost:28080 — kind ingress, host-port 28080). Prod-overlay переопределит
# все `urls.*` через `{{ .Values.kacho.domain }}` — см. values.prod.yaml.
hydra:
  # KAC-127: Phase 2 IAM-стек требует Hydra (OAuth2/OIDC) включённым для smoke.
  enabled: true
  hydra:
    automigration:
      enabled: true
      # KAC-127: type=initContainer вместо `job` — устраняет pre-install hook
      # deadlock (migration-Job дефолтно hook'нут pre-install, стартует до
      # pg-hydra → DNS-резолв фейлится → `helm --wait` блокируется). См.
      # аналогичный комментарий у kratos.automigration выше.
      type: initContainer
    dev: true
    config:
      dsn: "postgres://hydra:changeme-dev-hydra@kacho-umbrella-pg-hydra:5432/hydra?sslmode=disable"
      serve:
        public:
          cors:
            enabled: true
            # Dev: любой localhost port.
            allowed_origins: ["*"]
      urls:
        # Dev: browser-redirect URLs (consent/login/logout/error/post_logout) — relative
        # paths, резолвятся к текущему origin клиента (любой port-forward работает без
        # пересоздания config). В prod values.prod.yaml override'ит на полные https URLs.
        self:
          # `self.public` + `self.issuer` ОБЯЗАНЫ быть full URI (Hydra schema validation).
          # Они идут в JWT `iss` claim — identity-string, browser туда НЕ ходит.
          # Любой stable URL подойдёт (api-gateway validation должна совпасть). Для
          # dev оставляем :28080-prefix — это просто identity, не navigation
          # endpoint. Все NAVIGATION URLs ниже — relative (port-portable).
          public: "http://localhost:28080/.ory/hydra/public/"
          issuer: "http://localhost:28080/.ory/hydra/public/"
        consent: "/consent"
        login: "/login"
        logout: "/logout"
        error: "/error"
        post_logout_redirect: "/"
        # KAC-127 (deploy#37): `urls.identity_provider.publicly_writable` удалён —
        # ключ не существует в Hydra v26.2.0 config-schema (`urls.identity_provider`
        # принимает только `url` / `publicUrl` / `headers`). Динамическая
        # OAuth2-client-регистрация и так выключена by-default; Hydra-admin
        # `/clients` endpoint остаётся cluster-internal через Service-разделение.
      secrets:
        system: ["please-change-this-32-bytes-A1Bx"]
      # ─── OAuth 2.1 / DPoP / mTLS-bound / JWT strategy (acceptance §5.2) ──
      strategies:
        # Self-contained JWT access tokens: api-gateway проверяет ПОДПИСЬ локально,
        # по JWKS, без обращения к провайдеру (acceptance §2.3 token shape).
        # Отзыв — отдельный вопрос и отдельный поход: см. блок revocation в
        # api-gateway.hydra выше. Подпись локальна, отзыв — нет.
        access_token: jwt
        jwt:
          scope_claim: list
      ttl:
        # Acceptance §5.2 — TTL discipline. The production value (15m) lives in
        # values.prod.yaml. NOTE: that was not true until 2026-07-27 — this
        # comment asserted a production block that did not exist, and because
        # the profiles are NOT layered (values.prod.yaml renders standalone,
        # never on top of this file) production was inheriting the identity
        # provider's own 1h default. The block now exists there; keep the two in
        # deliberate disagreement only for the documented reason below.
        # LOCAL TEST-STAND override (#69): e2e waves run 30-40 min serially (iam runs its
        # ~30 collections under the EXCLUSIVE-lock rule) and outran a 15m access_token → late
        # collections failed 401 ("expected 401 == 200") — a token-expiry ARTIFACT, not a
        # product/authz defect. This file drives ONLY the local dev/e2e stand (production
        # fe3455 deploys values.prod.yaml, unchanged 15m). 4h covers the longest wave with
        # headroom so a single seed's RS256 tokens survive the whole run without re-mint.
        access_token: 4h
        refresh_token: 720h        # 30 days
        id_token: 15m
        auth_code: 1m
      oauth2:
        expose_internal_errors: true
        # OAuth 2.1 §6.1 — PKCE mandatory + refresh-token rotation с reuse-detection
        # → family-revoke (acceptance §2.9).
        pkce:
          enforced: true
          enforced_for_public_clients: true
        # KAC-127 (deploy#37): `grant` в Hydra v26.2.0 принимает только `jwt`
        # и `refresh_token`. Старый `grant.authorization_code.{require_pkce,ttl}`
        # удалён — PKCE-enforcement задаётся через `oauth2.pkce.*` выше,
        # auth_code-TTL — через `ttl.auth_code` (1m, см. блок ttl выше).
        grant:
          jwt:
            # Phase 3b (Federation IN, RFC 7521/7523): assertion handling.
            # Hydra v26.2.0 schema for `oauth2.grant.jwt`: only iat_optional,
            # jti_optional, jwks_uri, max_ttl. The previously-added
            # `scope_claim: scope` is REJECTED by the schema validator and
            # crashes Hydra on boot ("additionalProperties scope_claim not
            # allowed"). Per-issuer scope handling is governed by the
            # admin-API trust-grant `scope` array, not by a global claim
            # mapping.
            iat_optional: false      # assertion MUST carry `iat`
            jti_optional: false      # assertion MUST carry `jti` (anti-replay)
            max_ttl: 720h            # assertion `exp - iat` upper bound
          # Refresh-token rotation (OAuth 2.1 §6.1) — в v26.2.0 rotation ВСЕГДА
          # включён (старый toggle `oauth2.refresh_token_rotation` упразднён);
          # настраивается только grace-window. `rotation_grace_period: 1s` —
          # concurrent legit refresh (две вкладки); reuse вне grace → family-revoke.
          # Старые `oauth2.refresh_token_rotation` /
          # `refresh_token_rotation_grace_period` /
          # `refresh_token_grant_skip_token_binding_validation` удалены —
          # их нет в v26.2.0 schema.
          refresh_token:
            rotation_grace_period: 1s
        exclude_not_before_claim: false
        # Phase 2 — `ext_claims` — обёртка, под которой token_hook
        # возвращает kacho_*-claim'ы (см. handler/iamhooks/token_hook_handler.go).
        # Phase 3a — добавляем индивидуальные kacho_* claim'ы как
        # top-level allowed, чтобы кашо-policy-движки могли читать их
        # без unwrap'а `ext_claims` (private_key_jwt SA-токены / interactive
        # user-токены — оба пути).
        allowed_top_level_claims:
          - ext_claims
          # SA / user principal — Phase 3a token_hook enrichment
          - kacho_principal_type
          - kacho_principal_id
          - kacho_account_id
          - kacho_active_account
          - kacho_user_id
          - kacho_sa_key_id
          - kacho_hydra_client_id
        client_credentials:
          default_grant_allowed_scope: false
        # KAC-127 (deploy#37): глобальные `oauth2.dpop` / `oauth2.mtls` блоки
        # удалены — их нет в Hydra v26.2.0 config-schema. В v26.2.0 sender-
        # constrained tokens конфигурируются per-client, а не глобально:
        #   - DPoP (RFC 9449)   — через client-metadata `dpop_bound_access_tokens`
        #     при регистрации OAuth2-клиента (Hydra-admin `/clients`);
        #   - mTLS (RFC 8705)   — через client `tls_client_auth_*` /
        #     `tls_client_certificate_bound_access_tokens`.
        # Acceptance §6.4/§6.5 — enforcement переезжает на per-client регистрацию
        # (см. kaname client-bootstrap); глобального config-knob нет.
        # token_hook + refresh_hook → kaname HTTP hooks listener (acceptance §5.4).
        # KAC-127 (deploy#39): URL исправлен — webhook'и обслуживает HTTP-listener
        # на :9092 Service'а `kaname-internal` (НЕ gRPC :9091 на `kaname`).
        #
        # ─── ВЕЛИЧИНА УЧЁТНЫХ ДАННЫХ ПУСТА НАМЕРЕННО (задача #948) ────────────
        #
        # Здесь стояло `${KANAME_HOOK_TOKEN}`, и этот профиль НЕ объявлял ни
        # одного источника — то есть провайдер отправлял ЭТУ САМУЮ СТРОКУ в
        # заголовке, служба прав её отвергала (`401`), а край переводил отказ
        # арендатору как `502`. Профиль поднимается первой фазой `make dev-up` и
        # ждёт готовности в этом состоянии, поэтому полоса обратных вызовов на
        # нём была мертва целиком.
        #
        # Подстановки в значениях конфигурации провайдер не делает — ИЗМЕРЕНО на
        # oryd/hydra:v26.2.0 и oryd/kratos:v26.2.0 при переменной, ЗАВЕДЁННОЙ в
        # поде: ссылка доживает до чтения дословно. Значит доставка переменной с
        # этим именем предмет бы не закрыла.
        #
        # Величину задаёт переменная по ПУТИ КЛЮЧА (`deployment.extraEnv` ниже) —
        # она перекрывает файл конфигурации. Пустая строка здесь остаётся потому,
        # что ключ `value` требует схема провайдера (измерено: без ключа
        # конфигурация отвергается целиком), и потому, что пустое значение
        # никогда не читается как рабочее — в отличие от ссылки, обещающей
        # подстановку, которой не будет.
        token_hook:
          url: "http://kaname-internal.kacho.svc:9092/iam/v1/hooks/token"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ""
        refresh_token_hook:
          url: "http://kaname-internal.kacho.svc:9092/iam/v1/hooks/refresh"
          auth:
            type: api_key
            config:
              in: header
              name: X-Kacho-Hook-Token
              value: ""
      # JWKS целиком принадлежат Hydra: она и генерирует keypair, и подписывает.
      # iam ключи НЕ чеканит и НЕ ротирует — он лишь проксирует публичный JWKS
      # Hydra байт-в-байт (:9097) для data-plane.
      webfinger:
        jwks:
          broadcast_keys:
            - hydra.openid.id-token         # signing-key set, наполняется САМОЙ Hydra
      log:
        level: info
        format: json
        leak_sensitive_values: true
      tracing:
        provider: otel
        providers:
          # KAC-127 (deploy#37): ключ `endpoint` переименован в `server_url` —
          # Hydra v26.2.0 tracing-schema (ory/x otelx) принимает `otlp.server_url`.
          otlp:
            server_url: otel-collector.observability.svc:4317
            insecure: true
  # ─── ИСТОЧНИК ВЕЛИЧИНЫ ОБРАТНОГО ВЫЗОВА (задача #948) ──────────────────────
  #
  # Провайдер читает величину учётных данных ТОЛЬКО отсюда: подстановки `${…}`
  # в значениях конфигурации он не делает (измерено — см. блок token_hook выше),
  # а переменная по ПУТИ КЛЮЧА конфигурации файл перекрывает. Имя переменной —
  # это и есть путь `oauth2.{token,refresh_token}_hook.auth.config.value`,
  # заглавными и через подчёркивание; своей формой его не заменить.
  #
  # ССЫЛКА ОБЯЗАТЕЛЬНАЯ, А НЕ `optional: true`, И ЭТО ОСОЗНАННО. Необязательная
  # ссылка на отсутствующий секрет даёт ПУСТУЮ величину — то есть ровно тот
  # дефект, который здесь чинится: полоса исполняется и отвергается, а стенд
  # выглядит поднятым. Обязательная не даёт контейнеру стартовать вовсе.
  #
  # Цена названа: секрет обязан существовать ДО первого прогона helm. Он и
  # существует — `make dev-up` зовёт scripts/dev-prod-secrets.sh перед выкаткой
  # продукта, и выполнимость этой ссылки держит deploy/tests/helm/
  # prerequisite-secrets-test.sh (секрет заводит скрипт, который цель реально
  # исполняет).
  deployment:
    extraEnv:
      - name: OAUTH2_TOKEN_HOOK_AUTH_CONFIG_VALUE
        valueFrom:
          secretKeyRef:
            name: kaname-hook-token
            key: token
      - name: OAUTH2_REFRESH_TOKEN_HOOK_AUTH_CONFIG_VALUE
        valueFrom:
          secretKeyRef:
            name: kaname-hook-token
            key: token

  # Phase 3c — Federation OUT: public Hydra ingress for external IdP federation.
  # The counterpart is any OIDC-conformant workload-identity endpoint that
  # exchanges a signed workload assertion for its own credential; Kachō speaks
  # the standard, not one vendor's dialect. Production uses cert-manager + Let's
  # Encrypt — see values.prod.yaml. Dev defaults below are DISABLED — local
  # smoke runs via host-port 28080 + relative URLs (current `urls.self.issuer`
  # http://localhost:28080/.ory/hydra/public/). Enable when you need to
  # exercise the federation-OUT path locally with a fake DNS entry pointing
  # `auth.kacho.local` at the kind ingress.
  ingress:
    public:
      enabled: false
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: kacho-selfsigned
        nginx.ingress.kubernetes.io/proxy-body-size: "8k"
      hosts:
        - host: auth.kacho.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - auth.kacho.local
          secretName: hydra-public-tls
    admin:
      # Admin endpoint MUST stay cluster-internal — no external ingress, ever
      # (it has unauthenticated `/admin/clients` write surface). Explicitly
      # disabled here as a guardrail; enabling this is a security incident.
      enabled: false

# Ory Kratos self-service UI (login/registration/recovery/verification/settings).
# Образ oryd/kratos-selfservice-ui-node. UI nginx проксирует /login,/registration,
# /recovery,/verification,/settings,/error → этот pod на :3000.
# Sub-chart `kratos-selfservice-ui` — значения под вложенным ключом kratosSelfServiceUI.
kratos-selfservice-ui:
  kratosSelfServiceUI:
    # KAC-127: включён вместе с kratos. kacho-ui nginx безусловно проксирует
    # /login,/registration,... → upstream `kratos-selfservice-ui.kacho.svc` —
    # при enabled=false Service не существует → nginx падает на старте
    # (`host not found in upstream`). С включённым Kratos-стеком этот UI-pod
    # обязателен для рабочего IAM-стенда.
    enabled: true
    image:
      repository: oryd/kratos-selfservice-ui-node
      # v26.2.0 — последний тег образа; прыжок с v1.3.1 объясняется сменой схемы
      # версий у Ory (v1.3.1 → v25.x → v26.x), а не двадцатью пятью мажорами
      # изменений. Проверено по каталогу тегов, а не по номеру.
      tag: "v26.2.0"
    # Относительный: значение уходит в редиректы, которые исполняет БРАУЗЕР.
    # Абсолютное `http://localhost:28080/...` работало ровно для того, кто открыл
    # консоль по этому адресу; на её собственном хосте регистрация упиралась в
    # `404 nginx`, потому что редирект уводил на хост без ingress. Разбор и
    # проверка — в умолчании чарта (charts/kratos-selfservice-ui/values.yaml).
    kratosBrowserUrl: "/.ory/kratos/public"
    kratosPublicUrl: "http://kacho-umbrella-kratos-public:80"
    hydraAdminUrl: "http://kacho-umbrella-hydra-admin:4445"
    # Dev-only throwaway signing secret (kind stand). Prod sources it from an
    # operator-provisioned Secret via cookieSecret.existingSecret (values.prod.yaml).
    cookieSecret:
      value: "dev-only-throwaway-32-bytes-A1Bx"
    # Dev stand talks plain-http to kratos/hydra upstreams → opt into skipping
    # Node's outbound TLS verification. Production leaves this OFF (verify on).
    insecureSkipTLSVerify: true

# KAC-127: zitadelOidcBootstrap удалён — identity/OIDC tier перешёл на Ory
# Kratos + Hydra (см. секции pg-kratos / pg-hydra выше).

# kaname — control-plane сервис IAM (Account / Project / User / ServiceAccount /
# Group / Role / AccessBinding). E0 — skeleton + CRUD; интеграция с Ory — E2/E3.
kaname:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.authn.mode).
  authMode: dev
  # ── ДОСТАВКА МАНИФЕСТОВ МОДУЛЕЙ (kacho#1901) ──────────────────────────────
  # Здесь имя ConfigMap объявляется ОДИН раз на весь стенд: отсюда его читает
  # чарт (том и монтирование) И отсюда же — производитель объекта
  # (`make module-manifests-configmap`, pkg/modulemanifest/producer). Второе
  # объявление разошлось бы с первым молча: под смонтировал бы один объект,
  # производитель положил бы другой, каталог доставки приехал бы пустым — и
  # снаружи это неотличимо от «модулей нет».
  #
  # `required: true` объявлено ВМЕСТЕ с производителем, а не раньше него: до
  # него опору на манифесты нельзя было объявить ни в одном профиле — страж
  # старта пропустил бы посадку (каталог назван), а процесс отказал бы на пустом
  # каталоге, то есть стенд перестал бы подниматься.
  #
  # Объект кладёт шаг подъёма стенда ПЕРЕД первым прогоном helm — как и прочие
  # предусловия (см. dev-prod-secrets.sh): том смонтирован `optional: true`,
  # поэтому отсутствие объекта даёт не зависший под, а отказ САМОГО ПРОЦЕССА с
  # названной причиной.
  manifests:
    configMapName: kacho-module-manifests
    required: true
  name: kaname
  replicas: 1
  # In-cluster Hydra ADMIN URL override (deep-merges over the sub-chart's kacho.iam
  # defaults). Without it ResolveHydraAdminURL() derives `https://hydra-admin.api.kacho.cloud`
  # from the issuer — a public ingress host that does NOT resolve in-cluster → sa_keys
  # CreateOAuthClient fails → SAKeyService.Issue op finishes with error ("internal worker
  # error"). Point it at the cluster-internal hydra-admin Service (Ory split public/admin).
  kacho:
    iam:
      hydraAdminUrl: "http://kacho-umbrella-hydra-admin:4445"
  # mTLS: server-only (authz authority; gateway/vpc/compute/nlb dial iam over mTLS).
  mtls:
    enable: true
  image:
    repository: kaname
    tag: dev
    pullPolicy: IfNotPresent
  ports:
    grpc: 9090
    internalGrpc: 9091
  service:
    public:
      type: ClusterIP
      port: 9090
    internal:
      type: ClusterIP
      port: 9091
  db:
    host: kacho-umbrella-pg-iam
    port: "5432"
    user: iam
    name: kaname
    passwordSecretName: kacho-umbrella-pg-iam
    passwordSecretKey: password
  config:
    logger:
      level: INFO
    apiServer:
      gracefulShutdown: 10s
    repository:
      postgres:
        # Приведён к НАИМЕНЬШЕМУ пределу, который эта служба может встретить.
        #
        # Здесь стояло 100 — величина, выбранная безотносительно того, сколько
        # соединений принимает база. На стеках, где предел базы не объявлен ни
        # одним профилем, действует умолчание сборки образа (100), из которых
        # обычным клиентам достаётся 97: пул одной реплики не помещался ЦЕЛИКОМ,
        # а при пяти репликах объявленный потолок (500) превышал принимаемое в
        # два с половиной раза.
        #
        # 80 = 97 доступных − запас на СОБСТВЕННЫЕ непуловые соединения службы
        # (ожидание оповещений и опросчики очередей; замером #750 их около
        # четырнадцати на реплику). Это потолок посадки, а не настройка
        # производительности: узким местом в том же замере была не глубина пула,
        # а процессор базы.
        #
        # Держат это число два механизма: deploy/pool_fits_database_test.go — по
        # объявлению, до развёртывания; загрузочный страж службы — по ФАКТИЧЕСКОМУ
        # пределу, спрошенному у базы. Растить число реплик, не уменьшив пул,
        # страж не даст: он откажет в старте.
        #
        # ЗДЕСЬ — 40, и это ЗАМЕРЕННОЕ значение, а не прикидка (#883).
        #
        # Прикидка стояла здесь же и была НЕВЕРНА: «при задержке около
        # миллисекунды и 400 запросах в секунду на реплику одновременных
        # соединений нужно меньше одного, так что 20 — запас в десятки раз».
        # Опровергнута опытом с контролем в обе стороны, прогретое состояние,
        # 1200 запросов в секунду на трёх репликах:
        #
        #     пул 20 → p99 = 139 мс, max 721 мс, среднее 4.52 мс
        #     пул 40 → p99 =  16 мс, max 128 мс, среднее 1.24 мс
        #
        # Отказов нет ни там, ни там: подача обслуживается полностью, различие —
        # ТОЛЬКО хвост, и он падает в 8.7 раза. Средняя длительность обманывает:
        # запросов, идущих В БАЗУ, меньшинство (промах кеша вердикта), но именно
        # они занимают соединение, и при мелком пуле остальные ждут очереди.
        # Ровно поэтому свободный процессор соседствовал с сорванным хвостом.
        #
        # СКОЛЬКО РЕПЛИК ЭТО ДОПУСКАЕТ — 3, и это сказано числом:
        #
        #     3 × 40 пула + 3 × 14 непуловых = 162 ≤ 197 доступных
        #     4 × 40      + 4 × 14           = 216 >  197  — уже нет
        #
        # Замер на пяти репликах снимался при пуле 20 и в этот предел укладывался.
        # Понадобится снова пять — временно опустить пул либо поднять потолок базы
        # ВМЕСТЕ с её памятью; поднимать потолок здесь нельзя, не тронув боевые
        # профили: они наследуют эту величину и подбирают память под неё.
        maxConns: 40
        sslMode: disable
    authn:
      # Bootstrap-mint caller allow-list (#58 hardening). MintBootstrapToken is
      # gated ONLY by the caller's client-certificate SPIFFE SAN (no ReBAC Check is
      # possible before the first token exists; no gateway REST route exists), and
      # authzguard enforces that gate in EVERY mode — dev included. Without this
      # list even the dev stand denies every mint (empty = deny everyone). The SAN
      # is the dedicated operator leaf the umbrella issues
      # (mtls.bootstrapOperator → secret kacho-bootstrap-operator-client-tls);
      # NOT the api-gateway identity — see values.yaml mtls.bootstrapOperator.
      #
      # Orthogonal to ENABLEMENT: the mint only issues tokens when a signing key
      # is present (kacho.iam.bootstrapToken.signingKeySecretName + the in-cluster
      # Hydra token endpoint, both supplied by the values.dev-prod.yaml overlay).
      # Listing the caller here costs nothing on a stand that never mints, and
      # means the ONE knob that stays fail-closed by default is the credential
      # gate — not a forgotten allow-list that silently 403s the operator.
      bootstrapMint:
        allowedClientSANs:
          - spiffe://kacho.cloud/ns/kacho/sa/kacho-bootstrap-operator
  initContainer:
    migrator:
      enabled: true
      command: ["/usr/local/bin/kacho-migrator", "up"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env:
    # KAC-127 #25: enable AuthorizeService.ListObjects (FGA-filtered List).
    # Scope-filtered List RPCs (vpc NetworkService/List, iam User/SA List) call
    # ListObjects to resolve the caller's allowed-id set; without this the RPC
    # returns Unimplemented and the handler-side scope-filter fails 503.
    KACHO_AUTHZ_LISTOBJECTS: "on"
    # Bug B fix: bootstrap cluster-admin. kaname's startup reconciler grants
    # `system_admin@cluster_kacho_root` to this user and enqueues the FGA tuple
    # via the transactional fga_outbox (replacing the former setup.sh SQL-seed
    # backdoor that bypassed the drainer). The user row is mirrored on first
    # fixture upsert; the reconciler retries until the grant commits. The
    # authz-fixtures bootstrap user is admin@prorobotech.ru.
    KANAME_BOOTSTRAP_ROOT_EMAIL: "admin@prorobotech.ru"
  # KAC-127 Phase 3: OPA sidecar config propagated from umbrella to sub-chart.
  # KAC-127 (deploy#39 fix): включён — kaname отдаёт OPA-bundle по HTTP на
  # :9092; см. комментарий у top-level `opaSidecar` ниже.
  # OPA sidecar config — read by the kaname sub-chart (deployment.yaml injects
  # the sidecar; the opa/jwks ConfigMaps now live in charts/kaname/templates/).
  # Disabled in dev (the OPA bundle-over-HTTP delivery on :9092 is wired but the
  # sidecar is off until the bundle pipeline is finalized — see kaname chart).
  opaSidecar:
    enabled: false
    # `1.0.0-rootless` тег не существует. Нужен ИМЕННО opa-envoy вариант —
    # kaname Deployment передаёт OPA-сайдкару `--set=plugins.envoy_ext_authz_grpc.*`;
    # плагин есть только в opa-envoy-сборке. `-static` = rootless static-build.
    image: openpolicyagent/opa:1.0.0-envoy-static
    logLevel: info
    # OPA pulls the bundle from kaname IN THE SAME pod via loopback
    # (127.0.0.1:9092 HTTP) — not via Service (Service routes only to Ready pods,
    # but the pod is Ready only after the bundle loads → rollout deadlock).
    # Отсюда и отсутствие имени хоста: шаблон подставляет петлю, а стоявший
    # здесь `iamInternalHost` называл Service — то есть противоречил соседней
    # строке и не читался ничем.
    iamInternalPort: 9092
    bundleResource: bundle.tar.gz
    # kaname OpaBundleService currently produces an UNSIGNED tarball, so OPA
    # must not require in-bundle `.signatures.json`. Hardening follow-up: flip true.
    bundleSigningEnabled: false
    # Shorter poll interval on dev for faster iteration on Rego changes.
    bundlePollMinSec: 60   # ~1min
    bundlePollMaxSec: 90
    signingKeyId: kaname-signing-key-current
    jwks:
      configMapName: kaname-jwks
      bootstrapKeyPem: ""
    policiesFallback:
      enabled: false
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi

# ─── Cross-cutting authz NetworkPolicy (umbrella template networkpolicy-authz) ─
# The OPA sidecar config itself now lives in the kaname sub-chart
# (kaname.opaSidecar above). Only the cross-cutting pod-to-pod allowlist stays
# at umbrella level. Disabled on dev (would break port-forward debugging of :9091).
opaSidecar:
  networkPolicy:
    enabled: false

# Sub-chart propagation note: opaSidecar is propagated to the kaname
# sub-chart via the kaname.opaSidecar block above (inside the kaname:
# top-level mapping). Duplicate top-level
# `kaname:` block would last-wins-overwrite — see KAC-127 PR review.

# ─── KAC-NLB: kacho-nlb L4 NLB control-plane (sub-phase 4.0) ─────────────
#
# Sub-chart lives in `project/kacho-nlb/deploy/` and is wired into the umbrella
# via `file://../../../kacho-nlb/deploy` (Chart.yaml dep above). Schema /
# resources / RPC contract — see `kacho-nlb/docs/specs/sub-phase-4.0-nlb-acceptance.md`.
#
# Wiring rules:
#   - `pg-nlb` (above) is the backing Postgres; kacho-nlb dials it via
#     `kacho-umbrella-pg-nlb:5432` (bitnami pg-* sub-charts expose a Service
#     named `<release>-<alias>`).
#   - `db.existingSecret` binds the bitnami-managed Secret directly so the
#     chart's own `secret.yaml` short-circuits (`{{- if not .Values.db.existingSecret -}}`),
#     i.e. we never commit a duplicate password Secret. The bitnami Secret name
#     follows `<release>-<alias>`; key `password`.
#   - Peers point at the cluster-internal Kubernetes Services of the dependent
#     domains (vpc public 9090 + internal 9091, compute public 9090, iam
#     internal 9091 — kacho-nlb resolves ProjectService through the iam
#     internal listener because it ALSO carries InternalIAMService.Check used
#     by the per-RPC authz interceptor; same dual-purpose port as in kaname
#     values block above).
#   - `config.mode=dev` relaxes the production-only config validation rules
#     (breakglass=false guard, listenInvalidator.iamDsn required, ...). Prod
#     overrides to `production` in values.prod.yaml.
#   - networkPolicy disabled in dev for parity with kaname / kacho-vpc dev
#     overrides (port-forward / kubectl exec convenience).
kacho-nlb:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.mode).
  authMode: dev
  enabled: true
  name: kacho-nlb
  replicas: 1
  # Dev kind stack: nlb already sets db.sslmode=disable below (dev pg-nlb serves
  # no TLS), but the nlb chart defaults config.mode=production, whose
  # config.Validate (audit SEC #1) REJECTS sslmode ∈ disable/allow/prefer — a
  # production stand MUST use a TLS DB channel. production + sslmode=disable =
  # refuse-to-start (migrate + serve) → Init:CrashLoopBackOff. So the dev profile
  # must also flip config.mode=dev (same triplet the compute chart documents:
  # mode=dev + mtls off + sslmode=disable). Ephemeral CI stand only; prod keeps
  # production (values.prod.yaml). The `mode: dev` flip itself lives in the single
  # `config:` block further down — this key was declared TWICE under kacho-nlb
  # (here and again below), and a duplicate mapping key does not merge: the later
  # block replaces this one wholesale. Both happened to set the same mode, so
  # nothing misbehaved — but any key added here would have been silently dropped.
  # mTLS: server (gateway dials here) + client (nlb→iam, nlb→vpc, nlb→compute, nlb→geo).
  mtls:
    enable: true
    edges:
      iamRegister: true
      iamProject: true
      vpc: true
      compute: true
      geo: true        # nlb→geo region_id validation (geo cutover, kacho-workspace#82)
  image:
    repository: kacho-nlb
    tag: dev
    pullPolicy: IfNotPresent
  ports:
    grpc: 9090
    internalGrpc: 9091
    metrics: 9101
  serviceAccount:
    create: true
  db:
    host: kacho-umbrella-pg-nlb
    port: 5432
    user: kacho_nlb
    name: kacho_nlb
    sslMode: disable
    existingSecret: kacho-umbrella-pg-nlb
    existingSecretKey: password
  peers:
    iam:
      # KAC-178 §2: ProjectService на PUBLIC (9090); InternalIAMService на INTERNAL (9091).
      addr: kaname.kacho.svc:9090
      internalAddr: kaname-internal.kacho.svc:9091
      tls: false
      dialDuration: 10s
    vpc:
      addr: vpc.kacho.svc:9090
      internalAddr: vpc.kacho.svc:9091
      tls: false
      dialDuration: 10s
    compute:
      addr: compute.kacho.svc:9090
      internalAddr: ""
      tls: false
      dialDuration: 10s
  authz:
    iam:
      # Адреса здесь нет намеренно: соединение, по которому идёт per-RPC Check,
      # строится из peers.iam.internalAddr. Прежний ключ `authz.iam.addr` снят —
      # из него не строилось ни одного соединения, а профиль называл его как
      # действующую настройку.
      dialDeadline: 3s
      requestTimeout: 500ms
  config:
    logger:
      level: INFO
    apiServer:
      gracefulShutdown: 10s
      grpcGwEnable: false
    authn:
      type: none
    authz:
      cache:
        enable: true
        ttl: 5s
      # Здесь стояли ещё четыре ключа — `cache.size`, три `listenInvalidator.*`
      # и `breakglass`, — ни один из которых не читал ни шаблон чарта, ни
      # описатель настроек процесса: у nlb нет ни поля размера кеша вердиктов,
      # ни слушателя инвалидации (это механизм iam), ни ручки аварийного обхода.
      # Последняя опаснее прочих: строка `breakglass: false` читается как
      # заявление «обход закрыт», тогда как закрывать нечего — звено решения о
      # доступе ставится безусловно. Держит снятое гейт
      # internal/repohygiene TestDeclaredKnobHasAReader.
      #
      # Круг отправителей, которым разрешено ГОВОРИТЬ ЗА пользователя
      # (заголовки x-kacho-principal-*). Пустой список — умолчание чарта —
      # НЕ означает «не принимаем ни от кого»: транспорт сужает круг только
      # на непустом списке, а на пустом принимает переданную личность от
      # ЛЮБОГО пира с сертификатом внутреннего CA. mTLS здесь включён
      # (mtls.enable=true выше), поэтому на dev-стенде это было живое
      # «доверяем всем», а не теоретическое: боевая стража старта (config.Validate)
      # при mode=dev не срабатывает, и dev оставался единственным из семи
      # сервисов с несужённым кругом.
      #
      # Состав пинится по ФАКТИЧЕСКИМ отправителям, а не по аналогии с соседом:
      # у vpc их четыре (шлюз, compute, nlb, оператор), и сужение «наверное,
      # только шлюз» сломало бы привязку интерфейса. Для nlb граф даёт РОВНО
      # шлюз: ни один сервис не импортирует nlb-стабы (единственный импортёр —
      # gateway/internal/restmux + его config), а оба листенера nlb (:9090 и
      # :9091) фронтит тот же api-gateway. Совпадает с values.prod.yaml и
      # values.dev-prod.yaml, где круг тот же и по той же причине.
      trustedForwarderSANs:
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
    # Секция `fga:` (endpoint / storeId / modelId / tupleWrite) здесь была и
    # СНЯТА (kacho#1796): адрес внешнего движка отношений и его параметры.
    # Движок снят целиком (#747), читателя у ключей не осталось ни в шаблоне
    # чарта, ни в описателе настроек процесса. `fga.requireIam` этот профиль не
    # переопределял — умолчание сабчарта (true) действует как прежде.
    jobs:
      targetDrain:
        interval: 10s
  migrator:
    enable: true
  networkPolicy:
    enable: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
# ─── kacho-registry — OCI registry control-plane + zot blob backend ───────────
#
# Заголовок «registry: ВЫКЛЮЧЕН в dev (не проварен)» с разбором двух причин
# отключения стоял ровно над `enabled: true` и пережил само включение. Убран:
# оба препятствия сняты (образ собирается локально — `registry` в SERVICES
# Makefile; у pg-registry появился собственный override), а комментарий,
# противоречащий значению под ним, читается как указание вернуть всё назад.
# Enabled for the dev/newman stand. The registry APP image is built locally
# (Makefile SERVICES → kacho-registry:dev); only the zot backend is pulled from
# ghcr.io (dev-up pre-pulls + kind-loads it to avoid an egress race in helm --wait).
# db.* and authz.* chart defaults are already dev-correct (pg-registry Service +
# kaname-internal:9091 / kaname:9090 / kacho-geo:9090). iam/geo run
# server-mTLS → registry MUST run mtls.enable=true (client edges to iam/geo).
# Added to MTLS_SUBCHARTS in deploy/Makefile. Docker DATA-plane (push/pull) is
# out-of-scope on kind (dataplaneLB disabled) — the registry newman suite is
# control-plane REST through the gateway, which does not need the VIP.
registry:
  enabled: true
  image:
    repository: kacho-registry   # local kind image
    tag: dev
  imagePullPolicy: IfNotPresent
  # Хранилище слоёв аутентифицирует своих вызывающих и на локальном стенде: открытый
  # порт zot — объезд ВСЕЙ авторизации плоскости данных одним хопом, и «на dev можно»
  # ровно такие дыры и прячет (production-posture везде, core rule #16). Значения —
  # NON-SECRET dev-плейсхолдеры, как пароль pg-registry ниже. htpasswd задан ЯВНО
  # (bcrypt того же пароля): выведенная из пароля строка несёт случайную соль → её
  # checksum менялся бы на каждом рендере и перекатывал zot на каждом `helm upgrade`.
  zot:
    auth:
      username: kacho-registry
      password: changeme-dev-zot
      htpasswd: "kacho-registry:$2a$10$Tp5G/pTDpzaVxQ8UzLOduOUVMo6rG96xpzEc/hPHzDzFdycxDEdhK"
  authMode: dev                  # relaxes issuer-pin / dataplane-TLS / https-JWKS prod guards
  # Приём identity-JWT плоскостью данных. ОБЪЯВЛЯЕТСЯ, и объявление здесь
  # обязательно: незаполненный перечень принимаемых издателей означает не
  # «принимаем как раньше», а «принимаем ЛЮБОГО», поэтому сервис отказывается
  # стартовать (F1, задача #897). Отказ верен — он и привёл сюда: профиль
  # первой фазы `dev-up` остался без объявления, под уходил в перезапуск по
  # кругу, `helm --wait` истекал, и обе сквозные полосы получали «условие не
  # создано» вместо вердикта.
  #
  # ПОСАДКА ЗДЕСЬ — ПЕРВОЙ ФАЗЫ, и она беднее боевой ровно двумя вещами:
  #
  #   - НАШ издатель не принимается (platformIssuer пуст). Не послабление, а
  #     факт: своя чеканка (iam config.authn.tokenSigning.enabled) на этой фазе
  #     выключена, значит iam не публикует ни нашего набора ключей, ни
  #     авторитета отзыва — принимать было бы нечего и проверять нечем.
  #     Принимается прежний издатель, ровно как до F1. Третья фаза подъёма
  #     (values.dev-prod.yaml) включает чеканку и объявляет обоих издателей;
  #   - набор ключей берётся по открытому HTTP — :9097 на этой фазе ещё без
  #     TLS, симметрично незашифрованному соединению к базе. Боевые режимы
  #     этого не допускают, и третья фаза переводит адрес на https.
  #
  # Издатель назван ДОСЛОВНО так, как его штампует провайдер на этом стенде
  # (hydra.config.urls.self.issuer ниже по файлу, та же строка стоит в
  # gateway.hydra.issuer) — включая завершающий слеш: `iss` сверяется целиком.
  # Адрес набора ОБЪЯВЛЕН, а не выведен из издателя: издатель приходит от
  # предъявителя, и производный адрес получался бы у всякого.
  tokenAcceptance:
    issuers: "http://localhost:28080/.ory/hydra/public/"
    issuerKeySets: "http://localhost:28080/.ory/hydra/public/=http://kaname-internal.kacho.svc:9097/.well-known/jwks.json"
    platformIssuer: ""
    revocationUrl: ""
  mtls:
    enable: true
    edges:
      iamAuthz: true      # registry→iam Check + fga-proxy (:9091)
      iamProject: true    # registry→iam ProjectService.Get (:9090)
      geo: true           # registry→geo RegionService.Get (:9090)

# backing Postgres for kacho-registry (schema kacho_registry). Service
# kacho-umbrella-pg-registry; the registry chart reads its Secret via
# db.existingSecret (chart default kacho-umbrella-pg-registry, key password).
pg-registry:
  enabled: true
  auth:
    username: registry
    password: changeme-dev-registry   # NON-SECRET dev placeholder
    database: kacho_registry
  primary:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1000m, memory: 1Gi }
  image:
    repository: bitnamilegacy/postgresql
    # Тег ПРИПИНЕН и одинаков у всех инстансов — см. §«Почему тег обязателен»
    # ниже по файлу (у pg-kratos). Умолчание чарта (16.1 на debian-11) в этом
    # ряду НЕ работает: его initdb отказывается стартовать, когда не может
    # разрешить собственный идентификатор пользователя, а образ записи о нём не
    # несёт. Расхождение было невидимым ровно потому, что два инстанса тег имели,
    # а восемь — нет.
    tag: "16.4.0-debian-12-r0"
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

# ─────────────────────────────────────────────────────────────────────────────
# Консоль (микрофронтенд: оболочка + модуль на домен).
#
# ВКЛЮЧЕНА, и это исправление, а не настройка вкуса. До 2026-08-11 выключатель
# `uif.enabled` не задавал НИ ОДИН профиль, поэтому подчарт консоли рендерил ноль
# объектов: продукт поставлял интерфейс, который не поднимался ни на одном
# стенде и, как следствие, не проверялся вообще ничем. Три дефекта, найденных в
# первый же проход по поднятой консоли (заслонённый маршрут, разъехавшийся
# базовый путь модуля, абсолютный адрес входа), прожили ровно столько, сколько
# длилось это невключение.
#
# Цена названа честно: `dev-up` теперь собирает ещё девять образов (цель
# `build-ui`), и подъём чистого кластера дорожает. Это плата за то, чтобы
# интерфейс поднимался вместе с продуктом, а не отдельным ритуалом, о котором
# нужно помнить.
uif:
  enabled: true
