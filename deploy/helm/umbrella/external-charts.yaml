#
# ПРОВЕНАНС ВЕНДОРЕННЫХ ВНЕШНИХ ЧАРТОВ (задача #2256).
#
# Чем доказывается, что архив в `charts/` — то, что опубликовал вышестоящий:
# `sha256` здесь есть ДОСЛОВНО значение поля `digest` из `index.yaml` издателя,
# а не наш собственный пересчёт архива. Пересчёт доказывал бы лишь то, что файл
# не менялся с тех пор, как мы его положили; равенство с записью издателя
# доказывает, ЧТО ИМЕННО мы положили.
#
# Замер 2026-09-08: все пять сошлись с издателем побайтово.
#
# ─────────────────────────────────────────────────────────────────────────────
# ПРОЦЕДУРА БАМПА — ЯВНОЕ ИЗМЕНЕНИЕ С ОБЗОРОМ, И ЭТО СМЫСЛ, А НЕ ЦЕНА
#
#   1. поднять версию в `Chart.yaml` (точным пином, диапазон запрещён гейтом);
#   2. `KACHO_HELM_DEPS_REFRESH=1 bash deploy/scripts/helm-umbrella-deps.sh`
#      — единственный владелец материализации сходит в сеть и положит архив;
#   3. `python3 deploy/scripts/assert-vendored-external-charts.py --verify-upstream`
#      — сверить полученное с `index.yaml` издателя и вписать сюда новый `sha256`;
#   4. снять прежний архив из `charts/` тем же изменением: архив, которого не
#      объявляет ни одна зависимость, — находка гейта (послабление обязано
#      истекать само, а не копиться);
#   5. для `hydra` и `kratos` ДОПОЛНИТЕЛЬНО перемерить предпосылку терминатора
#      административного листенера (`deploy/scripts/remeasure-provider-listener-tls.sh`)
#      и обновить `deploy/PROVIDER-LISTENER-PREMISE.md` — она привязана к версии,
#      и плавающая зависимость под прибитой предпосылкой уже давала случайный
#      красный (см. шапку `Chart.yaml`).
#
# ЛОКАЛЬНЫХ САБЧАРТОВ (`file://…`) ЗДЕСЬ НЕТ И НЕ ДОЛЖНО БЫТЬ: они собираются из
# исходников этого же дерева на каждой материализации.
