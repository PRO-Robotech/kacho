# values.prorobotech.yaml — overlay for deploying from public docker.io/prorobotech/*
# images built by each service repo's `docker-build.yml` CI (multi-arch amd64+arm64)
# on push to main.
#
# Usage (e.g. on a managed cluster with its own cert-manager — see values.fe3455.yaml):
#   helm upgrade --install kacho-umbrella ./helm/umbrella -n kacho \
#     -f ./helm/umbrella/values.dev.yaml \
#     -f ./helm/umbrella/values.dev-prod.yaml \
#     -f ./helm/umbrella/values.prorobotech.yaml \
#     --wait --timeout 15m
#
# THE MIDDLE LINE IS NOT OPTIONAL, and it is worth saying why it appeared. This file
# declares images and nothing about security, so it inherits whatever the layer beneath
# it declares — which made a command written for a laptop the recommended way to stand
# the product up on a managed cluster. That is the shape of the problem: an overlay
# reads as safe on its own while the stand it produces is not. The middle line is the
# posture every stand runs; the secrets it requires are provisioned by
# deploy/scripts/dev-prod-secrets.sh (or out-of-band on a real cluster).
#
# Tags pinned to the main-branch commit SHA that CI built (multi-arch manifest):
#   kacho-vpc          main-d752de57   (PR #145 — mTLS leaf cert + cross-compile)
#   kacho-compute      main-e2a6fded   (PR #48)
#   kacho-api-gateway  main-1adc9d12   (PR #70)
#   kacho-nlb          main-ab61eff3   (PR #24)
#   kacho-iam          main-a1b28f4c   (PR #104 — cross-compile Dockerfile)
#
# Здесь стоял блок `ui:` — чарта с таким именем в дереве нет: консоль называется
# `uif` и держит образ ПОМОДУЛЬНО (`uif.host.image`, `uif.dashboard.image`, …),
# одной строкой её не закрепить. Блок не читал никто, и накладка выглядела
# закрепляющей образ, которого она не касалась.
#
# Image-shape: sibling sub-charts (vpc/compute/api-gateway) take a flat `image:`
# string; the vendored sub-charts (kacho-iam/kacho-nlb) take map {repository,tag,pullPolicy}.
# NB: the sub-chart values KEY must equal the Chart.yaml dependency name — `api-gateway`
# (hyphen), NOT `apiGateway`.

global:
  imageRegistry: ""

vpc:
  image: docker.io/prorobotech/kacho-vpc:main-d752de57
  imagePullPolicy: IfNotPresent

compute:
  image: docker.io/prorobotech/kacho-compute:main-e2a6fded
  imagePullPolicy: IfNotPresent

api-gateway:
  image: docker.io/prorobotech/kacho-api-gateway:main-1adc9d12
  imagePullPolicy: IfNotPresent

kacho-iam:
  image:
    repository: docker.io/prorobotech/kacho-iam
    tag: main-a1b28f4c
    pullPolicy: IfNotPresent

kacho-nlb:
  image:
    repository: docker.io/prorobotech/kacho-nlb
    tag: main-ab61eff3
    pullPolicy: IfNotPresent

# Три компонента ниже отсутствовали здесь до 2026-08-11, а слой под накладкой
# объявляет их локальными образами kind (`kacho-storage:dev` и подобными). На
# управляемом кластере такого образа нет НИ В ОДНОМ реестре, поэтому развёртывание
# по документированной команде поднимало пять сервисов и оставляло три в
# ImagePullBackOff — при том что их образы CI публикует наравне с остальными.
#
# Пропуск был невидим по построению: накладка описывает образы, и «компонента здесь
# нет» неотличимо от «компонент не разворачивается». Разницу держит
# TestRegistryPulledStacksLeaveNoStandLocalImage — он судит СЛОЖЕННЫЙ стенд, а не
# отдельный файл, и потому осматривает каждую накладку дерева, а не названную
# константой.
storage:
  image:
    repository: docker.io/prorobotech/kacho-storage
    tag: main-5e8318c8
    pullPolicy: IfNotPresent

kacho-geo:
  image: docker.io/prorobotech/kacho-geo:main-5e8318c8
  imagePullPolicy: IfNotPresent

registry:
  image:
    repository: docker.io/prorobotech/kacho-registry
    tag: main-5e8318c8
  imagePullPolicy: IfNotPresent
  # ⚠ ШАГ ОПЕРАТОРА (до раската): Secret `zot-auth` в ns kacho с ключами
  # username/password/htpasswd провизионится ВНЕ git — как в values.prod.yaml.
  #
  # Накладка описывает образы и ничего не говорила об учётных данных, поэтому
  # хранилище слоёв на управляемом кластере поднималось с плейсхолдером слоя под
  # ней — значением из публичного файла. Хранилище слоёв не различает тенантов:
  # его пароль это доступ ко всем слоям стенда мимо авторизации плоскости данных.
  # Стенд, тянущий образы продукта из реестра, берёт эти данные ссылкой — держит
  # TestStandPullingFromARegistryTakesLayerStoreCredentialByReference.
  zot:
    auth:
      existingSecret: zot-auth
      username: ""
      password: ""
      htpasswd: ""
