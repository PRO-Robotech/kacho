# values.fe3455-prod.yaml — fe3455 PRODUCTION cutover overlay (greenfield stand).
#
# Layer order (production, no dev-auth) — the chain cutover-fe3455.sh actually runs.
# Keep it in step with that script and with the fe3455 row of the stacks table in
# deploy/tests/helm/admin-hop-address-census-test.sh; three hand-written copies of
# one list is exactly how they drift apart.
#
# Until 2026-08-11 this block named `values.fe3455-base.yaml` as its first layer.
# NO SUCH FILE EXISTS in the tree — the statement had outlived its subject, and it
# was the header a reader consults precisely to learn the layer order. It also
# stopped at three layers while the script laid down four.
#
#   helm upgrade --install kacho-umbrella ./helm/umbrella -n kacho \
#     -f values.prod.yaml         # production AUTH flip (correct chart paths):
#                                 #   authn.mode=production/production-strict,
#                                 #   sslmode=require, mTLS on, Hydra JWKS/issuer,
#                                 #   fail-closed authz, opaSidecar+datastore NP.
#     -f values.fe3455-prod.yaml  # THIS: revert values.prod's operator-provisioned
#                                 #   assumptions (existingSecret) back to greenfield
#                                 #   self-provisioning, add cert-manager PG server
#                                 #   TLS, current-main hardened images, api-gateway
#                                 #   internal-:9091 mTLS, geo forwarder SAN.
#     -f values.fe3455-ory-posture.yaml
#                                 # identity-provider POSTURE (tracked): hydra dev
#                                 #   flag/issuer/PKCE/TTL, kratos development flag
#                                 #   and cookie transport. Tracked on purpose — it
#                                 #   used to live inside the gitignored creds file,
#                                 #   where no review and no gate could read it.
#     -f values.fe3455-ory.yaml   # identity-provider CREDENTIALS (gitignored):
#                                 #   Ory DSNs + system/cookie/cipher secrets, and
#                                 #   nothing else. Last, so credentials cannot be
#                                 #   overridden by posture. cutover-fe3455.sh
#                                 #   refuses to deploy if a posture key appears here.
#
# ── SECURITY POSTURE (what "production" means here) ──
#   authN  : Hydra-issued JWT verified at the edge (production-strict, no dev HMAC).
#   authZ  : per-RPC ReBAC Check, fail-closed (RBAC roles).
#   mTLS   : service↔service on both listeners incl. api-gateway internal :9091;
#            EVERY certificate issued by cert-manager (ClusterIssuer
#            kacho-internal-ca) — no self-signed / bitnami-autoGenerated material.
#   DB     : the 5 control-plane service DBs run sslmode=require over cert-manager
#            server certs (templates/pg-certificates.yaml).
#
# ── KNOWN, DOCUMENTED greenfield concessions (follow-ups, not dev-mode) ──
#   1. kratos/hydra backing Postgres keep their Ory-managed DSN (sslmode=disable,
#      in-cluster) — those DSNs belong to their own charts, and hardening them is
#      their own subject.
#   2. PG credentials inherit the base-chart values (k8s Secret material, never
#      exposed on the wire). A cosmetic rotation away from the changeme-* default
#      is a clean follow-up once the stack is green — orthogonal to auth posture.

# ── cert-manager-issued PG server TLS (SEC-F internal CA), NOT self-signed ──
# Server-TLS ONLY: clients connect sslmode=require (transport-encrypted). We do
# NOT set certCAFilename on the pg sub-charts — that would make bitnami PG verify
# CLIENT certs (mTLS/pg_hba `cert`), and the bitnami readiness/liveness probe
# presents the server leaf (server-auth EKU only) as its client cert → PG rejects
# it ("unsupported certificate purpose") and the pod never turns Ready. Password
# auth over TLS is the intended posture here (see pg-certificates.yaml).
mtls:
  pgTls:
    # MUST list every pg-<svc> that carries `tls.enabled: true` below or in
    # values.prod.yaml — this list is what ISSUES the server cert, and Helm
    # REPLACES lists rather than merging them, so omitting a name here while the
    # instance still references kacho-umbrella-pg-<svc>-server-tls leaves the
    # StatefulSet mounting a Secret nobody creates (pod stuck, not a render error).
    # `registry` is included for exactly that reason: values.prod.yaml enables TLS
    # on pg-registry. The registry SERVICE keeps its sslmode=disable concession on
    # this cluster (see the registry block) — a server that offers TLS to a client
    # that does not ask for it is a no-op, so this is safe and reversible.
    services: [vpc, compute, iam, geo, nlb, storage, registry]

# ── greenfield image provisioning: bitnami PGs from docker.io/bitnamilegacy ──
# values.yaml pins global.imageRegistry=docker.io/prorobotech (the kacho-* mirror,
# which has NO bitnami images) → every pg-* Init/main container ImagePullBackOff.
# Reset it to "" so the bitnami sub-charts resolve their own registry (docker.io)
# for the bitnamilegacy/* mirror; the kacho-* services carry fully-qualified image
# strings below so they are unaffected. allowInsecureImages lets the bitnami charts
# accept the non-canonical bitnamilegacy image names.
global:
  imageRegistry: ""
  security:
    allowInsecureImages: true
  kacho:
    registry:
      # Имя службы реестра — ОДНО объявление на ОБЕ стороны докерной полосы
      # (задача #1184). Реестр называет его докер-клиенту в вызове на
      # аутентификацию, iam чеканит его в `aud` и всё прочее отвергает; отсюда
      # его читают оба подчарта. Прежде здесь стояли ДВЕ копии —
      # `registry.serviceAud` и `kaname.config.apiServer.registryToken.service`
      # — и разойтись им мешало только внимание.
      #
      # Значение то же, что действовало прежде: посадка не меняется.
      serviceAud: "registry.in-cloud.io"

# ── each bitnami pg-<svc>: bitnamilegacy image + os-shell init + cert-manager TLS
#    (5 core) + operator-provisioned secret. auth.existingSecret points at the
#    pre-created kacho-umbrella-pg-<svc> Secret (keys password/postgres-password),
#    so the chart REFERENCES it (renders no Secret of its own → no ownership
#    collision). username/database are plain config (NOT secrets) and MUST be set
#    here so the server bootstraps the role/db the kacho service connects as —
#    values.prod carries only existingSecret. ──
# ВКЛЮЧЁННЫЙ TLS — ЭТО ПРЕДЛОЖЕНИЕ, А НЕ ТРЕБОВАНИЕ (выведено из #121).
# `tls.enabled` заставляет сервер УМЕТЬ шифровать, но правила доступа bitnami по
# умолчанию — `host`, а `host` матчит соединение и с TLS, и без него: шифрование
# держится ровно на том, что каждый клиент помнит про `sslmode`. Пропуск виден
# только со стороны СУБД (`pg_stat_ssl`), постфактум и только пока клиент
# подключён — поэтому виновника ночной находки #121 установить уже не удалось.
# Требование перенесено на СЕРВЕР: незашифрованные соединения ПО СЕТИ он больше
# не принимает. Петля и unix-сокет оставлены открытыми намеренно — сети там нет,
# и через 127.0.0.1 ходят пробы готовности чарта (`pg_isready -h 127.0.0.1`).
# Гейт — deploy/dbhba_tls_required_test.go.
#
# ЛОКАЛЬНЫЙ ПУТЬ И ПЕТЛЯ — БЕЗ ПАРОЛЯ, ИНАЧЕ БАЗА НЕ ПОДНИМЕТСЯ ВОВСЕ (#195).
# Здесь стоял `md5`, и с ним профиль не поднимал НИ ОДНОЙ базы на кластере без
# сохранённого тома. Причина — порядок: первичная настройка обязана подключиться
# к своей же базе по сокету и петле, чтобы ЗАДАТЬ пароль, и делает это ДО того,
# как пароль существует. Требование пароля в этот момент замыкает круг, а отказ
# при этом НЕМОЙ — вывод первичной настройки уходит в никуда, контейнер
# завершается без строки о причине. На стенде с сохранённым томом первичная
# настройка пропускается целиком, поэтому профиль выглядел рабочим.
# `trust` здесь не послабление: сокет и петля живут в сетевом пространстве самого
# пода, снаружи к ним не подключиться. Граница безопасности проходит по сети и
# закрыта строками ниже — по сети принимается только шифрованное соединение с
# паролем, нешифрованное отвергается явно.
pg-vpc:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
  auth: { existingSecret: kacho-umbrella-pg-vpc, username: vpc, database: kacho_vpc }
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-vpc-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
  primary:
    pgHbaConfiguration: &pgHbaTLSRequired |
      local     all all                trust
      host      all all 127.0.0.1/32   trust
      host      all all ::1/128        trust
      hostssl   all all 0.0.0.0/0      md5
      hostssl   all all ::/0           md5
      hostnossl all all 0.0.0.0/0      reject
      hostnossl all all ::/0           reject
pg-compute:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
  auth: { existingSecret: kacho-umbrella-pg-compute, username: compute, database: kacho_compute }
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-compute-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
pg-iam:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
  auth: { existingSecret: kacho-umbrella-pg-iam, username: iam, database: kacho_iam }
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-iam-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
pg-geo:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
  auth: { existingSecret: kacho-umbrella-pg-geo, username: geo, database: kacho_geo }
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-geo-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
pg-nlb:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
  auth: { existingSecret: kacho-umbrella-pg-nlb, username: kacho_nlb, database: kacho_nlb }
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-nlb-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key

# ── infra PGs (kratos/hydra): bitnamilegacy image + operator secret;
#    DSN stays Ory-managed (sslmode=disable) per concession #1. ──
  primary:
    pgHbaConfiguration: *pgHbaTLSRequired
pg-kratos:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
  auth: { existingSecret: kacho-umbrella-pg-kratos, username: kratos, database: kratos }
pg-hydra:
  image: { registry: docker.io, repository: bitnamilegacy/postgresql, tag: 16.4.0-debian-12-r0 }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
  auth: { existingSecret: kacho-umbrella-pg-hydra, username: hydra, database: hydra }

# ── ALL NetworkPolicies DISABLED on fe3455 (per operator decision) ──
# The umbrella NPs are authored for the target production cluster's CNI/DNS/topology
# and mis-fire on fe3455 (Beget CNI): the opa-sidecar egress allow-list omits PG
# :5432 and its DNS to-selector (kube-system/k8s-app=kube-dns) doesn't match fe3455
# CoreDNS → iam's DB/DNS egress dropped; the datastore/internal ingress policies
# similarly need per-cluster selector tuning. NetworkPolicy is a defense-in-depth
# network-segmentation layer — NOT the core auth. The production security posture
# (mTLS transport, Hydra-JWT authN, ReBAC authZ, sslmode=require) is fully
# intact without it. Re-enable + per-cluster-tune as a follow-up.
opaSidecar:
  networkPolicy:
    enabled: false           # opa-sidecar-egress + opa-bundle ingress
networkPolicy:
  datastore:
    enabled: false           # pg-<svc>-ingress-allowlist (all 6)

# ── current-main hardened images (supersede rev-56 pins) + production peer edges ──
#
# ОТКУДА ВЫВЕДЕНЫ ТЕГИ. Этот файл — авторитетный для рендера четырёх служб
# (см. заметку о порядке слоёв в values.fe3455.yaml), поэтому его пины и есть
# то, что развернётся. Они ВЫВОДЯТСЯ из записи ниже; расхождение записи и пина
# роняет прогон (deploy/managed_cluster_profile_test.go). Переписывать —
# порождающим deploy/scripts/gen-managed-image-pins.sh, а не рукой:
#   make -C deploy managed-image-pins PROFILE=helm/umbrella/values.fe3455-prod.yaml REF=<коммит>
# порождено-от: main b622b388db3ed304b9077df54526155ab98e559a
# vpc/compute/nlb → geo (geo.v1.{Zone,Region}Service) is a real runtime edge
# (zone_id/region_id validation); values.prod's mtls.edges predates the geo
# cutover (kacho-workspace#82) and omits it, so the hardened services fail-closed
# at startup ("geo edge requires verified transport"). Enable the geo mTLS client
# edge (reuses the per-service kacho-<svc>-client-tls cert; serverName defaults to
# kacho-geo.kacho.svc ∈ geo server-cert SAN).
vpc:
  image: docker.io/prorobotech/kacho-vpc:main-b622b388
  networkPolicy:
    enabled: false           # vpc-internal-allowlist off (all NPs disabled)
  # vpc runs authn.mode=production behind server-mTLS: it must TRUST the api-gateway
  # to forward the end-user principal (x-kacho-* headers). Without this the gateway
  # authenticates+authorizes a request (authz allow logged) but vpc rejects it
  # ("AuthN required: set x-kacho-* identity headers via gateway"). The gateway→vpc
  # edge is mTLS-verified, so trusting the forwarder is safe.
  authn:
    trustedForwarder: true
  mtls:
    edges:
      geo: true
  authz:
    # Круг отправителей чужой личности — см. values.prod.yaml (там же обоснование
    # состава). Пустой список НЕ запрещает, а не сужает; боевая посадка на нём не
    # стартует, поэтому профиль обязан его нести.
    trustedForwarderSANs:
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-compute
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-nlb
      # Здесь стояла запись оператора сети — компонента с таким именем в дереве нет,
      # и репозитория под него не существует. Круг доверенных отправителей пинится по
      # ФАКТИЧЕСКИМ отправителям: запись под несуществующего разрешала бы говорить за
      # пользователя предъявителю сертификата, которого мы не выпускаем. Появится
      # компонент — запись вернётся вместе с его кодом (решение владельца 2026-08-09).
compute:
  image: docker.io/prorobotech/kacho-compute:main-b622b388
  # Same forwarder-trust as vpc — pin the allow-list to the api-gateway SA SPIFFE
  # (chart default, restated so a values.prod override can't drop it).
  auth:
    trustedForwarderSANs: "spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway"
  mtls:
    edges:
      geo: true
      # compute→storage edge (InternalVolumeService attach/detach + Volume mirror, :9091)
      # is now FIRST-CLASS in the compute chart: storageInternalAddr (default
      # kacho-storage.kacho.svc:9091) + mtls.edges.storage → the
      # KACHO_COMPUTE_STORAGE_MTLS_* block. mTLS reuses compute's already-mounted client
      # leaf (kacho-compute-client-tls at /etc/kacho-compute/tls/client) — storage's
      # internal :9091 is RequireAndVerifyClientCert; serverName default
      # kacho-storage.kacho.svc ∈ the storage server-cert SAN
      # (storage.mtls.serverHosts=["kacho-storage"]). NB storage is disabled below
      # (chart not yet umbrella-integrated) so this edge is armed but not yet exercised.
      storage: true
kacho-geo:
  image: docker.io/prorobotech/kacho-geo:main-b622b388
  # hardened geo defaults AUTH_MODE=production → страж посадки требует непустой
  # круг отправителей. Прежде здесь стояло имя `validateSecurityConfig` — такой
  # функции у geo нет и не было (она резолвится только у registry); имя пережило
  # свой предмет и посылало читателя искать защиту не туда.
  # Состав круга и почему он не «только шлюз» — см. values.prod.yaml (#916).
  env:
    KACHO_GEO_AUTHZ_TRUSTED_FORWARDER_SANS: "spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway,spiffe://kacho.cloud/ns/kacho/sa/kacho-vpc,spiffe://kacho.cloud/ns/kacho/sa/kacho-compute,spiffe://kacho.cloud/ns/kacho/sa/kacho-nlb,spiffe://kacho.cloud/ns/kacho-storage/sa/kacho-storage,spiffe://kacho.cloud/ns/kacho/sa/kacho-registry"
kaname:
  # Слушатель :9097 несёт ДВЕ поверхности с разными требованиями. Набор
  # проверочных ключей обязан оставаться доступен без клиентского сертификата
  # (потребитель origin-agnostic), а авторитет отзыва принимает предъявленный
  # токен и обязан знать, кто спрашивает. Поэтому сертификат ЗАПРАШИВАЕТСЯ и
  # верифицируется, если предъявлен, а отказывает сам обработчик авторитета:
  # режим сам по себе ничего не сужает.
  mtls:
    jwksProxyClientAuthMode: optional-mutual
  image:
    # ── FORWARD ROLL: main-c744f956 (kaname main c744f95, multiarch, Docker Hub-
    #    verified 2026-07-15) supersedes the live feature build KAC-registry-docker-auth-
    #    c3000530. The tag drives BOTH the main container AND the kacho-migrator init
    #    (chart helper "kaname.image"). Carries:
    #      • #321 SA-key registry-audience union — the audience bug this cutover fixes;
    #      • #319 token name/labels;
    #      • #322/#323 cluster-internal Hydra-JWKS proxy listener (:9097) — REQUIRED so
    #        registry.tokenAcceptance.issuerKeySets below is coherent (iam must SERVE :9097
    #        before/with the
    #        registry JWKS-flip, else every token-verify 401s);
    #      • #325 RG-1 anon-token + registry RPC catalog entries (418-catalog — must land
    #        together with api-gateway c7dce40d + registry af0eacae);
    #      • #326 docker-login `issued_at` RFC3339 string (see below).
    #
    #    DOCKER-LOGIN issued_at — why this exact tag and not the earlier main-b3d23769:
    #    /iam/token (:9096) emits `issued_at`, which the docker client parses via
    #    time.Time.UnmarshalJSON — that accepts ONLY a JSON string, so a bare int64 breaks
    #    `docker login` ("Time.UnmarshalJSON: input is not a JSON string") → no bearer →
    #    all pull/push 401. The live feature build carries that fix (kaname c300053) but
    #    main-b3d23769 REVERTED it, which made rolling to main a hard blocker. kacho-iam#326
    #    re-applied c300053 onto main (RFC3339 STRING, locked by a wire-shape regression
    #    test) → main c744f95 → CI published main-c744f956. Blocker resolved: this image is
    #    a strict forward over the live build on BOTH halves. Do not repin below this tag —
    #    cutover-fe3455.sh preflight denylists the broken main-b3d23769.
    tag: main-b622b388
  # ─── Docker Registry v2 token shim (`/iam/token`, :9096) ─────────────────────
  # ОБЯЗАТЕЛЬНО на развёрнутом окружении: без этого работает built-in дефолт
  # `service: registry.kacho.local`, и `docker login` падает с `unauthorized`.
  #
  # Почему: `service` уходит не только в fallback для `?service=`, но и в
  # issueUC.RegistryAudience (#321) → whitelist'ится как audience в Hydra-клиенте
  # КАЖДОГО выпускаемого SA-ключа. docker шлёт `?service=registry.in-cloud.io`, iam
  # просит у Hydra этот audience, а в клиенте лежит дефолтный registry.kacho.local →
  #   Hydra: "Requested audience 'registry.in-cloud.io' has not been whitelisted
  #           by the OAuth 2.0 Client" (400) → shim отдаёт 401.
  # Диагностика 2026-07-15: падали и старый, и свежевыпущенный ключ; в логах iam —
  # тишина (все причины схлопнуты в ErrUnauthenticated без лога), реальную причину
  # назвала Hydra. Требует kaname#… (чарт научился рендерить эту секцию).
  #
  # `issuer` = realm в WWW-Authenticate; совпадает с KACHO_REGISTRY_TOKEN_REALM
  # data-plane'а (registry.dataplane ниже).
  #
  # ⚠ audience фиксируется в Hydra-клиенте В МОМЕНТ выпуска ключа → SA-ключи,
  # выпущенные ДО этой правки, надо ПЕРЕВЫПУСТИТЬ (задним числом allowlist не появится).
  #
  # NB: umbrella вендорит iam-чарт из ./charts/kaname (копия ВНУТРИ kacho-deploy),
  # а НЕ из ../kaname/deploy — у копии values вложены под `config`. Правка нужна в
  # обеих (kaname#… — sibling-копия, чтобы standalone-чарт не отстал).
  config:
    apiServer:
      registryToken:
        issuer: https://registry.in-cloud.io/iam/token
        # `service` здесь НЕ объявляется — он ВЫВОДИТСЯ из
        # `global.kacho.registry.serviceAud`, то есть из объявленной стороны
        # реестра. Второе объявление того же предмета расходилось бы молча.
    authn:
      # СВОЯ ЧЕКАНКА ТОКЕНОВ (F1, задача #897)
      #
      # Контур выдачи докер-токена переводится на НАШ подписант: обе его стороны
      # наши, и подписант без производственного вызывающего — тот же класс, что
      # хранилище без читателя.
      #
      # Каждое значение обязательно: незаданный издатель означает «любой»,
      # пустой перечень допустимых алгоритмов означает «принимаем любой», а
      # вырожденный путь записи набора превращает стража источника в проверку,
      # неспособную упасть.
      tokenSigning:
        enabled: true
        issuer: "https://kaname.kacho.local"
        algorithm: ES256
        allowedAlgorithms: "ES256,RS256"
        keySetPath: /.well-known/kaname/jwks.json
      # ТОКЕН-ЭНДПОИНТ ПЛАТФОРМЫ (F2, задача #898)
      #
      # Клиент предъявляет подписанное утверждение, мы сверяем подпись открытым
      # ключом из своего же реестра и выдаём токен доступа НАШИМ подписантом.
      # Эндпоинт монтируется на уже объявленную внешне досягаемую поверхность
      # выдачи и своего слушателя не заводит.
      #
      # Каждая ручка ниже обязательна, как только эндпоинт включён, и каждая
      # невидима на положительном пути: пустой перечень адресатов означает
      # «выдаём токен, адресованный чему угодно», нулевой потолок тела — «читаем
      # сколько прислали». Страж старта отказывает в пуске на любой из них.
      #
      # АДРЕСАТ КРАЯ СТОИТ В ПЕРЕЧНЕ — ИНАЧЕ ВТОРАЯ ПОЛОСА НЕИСПОЛНИМА (#1014).
      # Край принимает нашего издателя (`api-gateway.tokenAcceptance.platformIssuer`),
      # но токен — только с адресатом `https://` + `kacho.domain`. Перечень называл
      # один адресат — реестр, — поэтому токен нашей чеканки отвергался краем ПО
      # АДРЕСАТУ, не дойдя до проверки подписи. Умолчание не тронуто: докерная
      # полоса по-прежнему получает адресат реестра, не называя его.
      clientToken:
        enabled: true
        allowedAudiences: "https://api.kacho.cloud,registry.in-cloud.io"
        defaultAudience: "registry.in-cloud.io"
        tokenTtl: "15m"
        bodyCeiling: 65536
  # In-cluster Hydra token endpoint для registry `/iam/token` shim (client_credentials
  # exchange). Без него ResolveHydraTokenURL() падает на внешний issuer-URL, недостижимый
  # изнутри кластера → docker push/pull ломается на этапе брокеринга токена. (#168)
  kacho:
    iam:
      hydraTokenURL: http://kacho-umbrella-hydra-public.kacho.svc:4444/oauth2/token
      # registry-iam-jwks-unify — upstream the cluster-INTERNAL jwks-proxy (:9097)
      # mirrors byte-for-byte (env KANAME_HYDRA_JWKS_URL). In-cluster hydra-public
      # base so the iam→Hydra JWKS fetch never leaves the cluster; iam re-serves it to
      # the registry data-plane over one-way server-TLS. Hydra stays signer/issuer.
      hydraJwksUrl: http://kacho-umbrella-hydra-public.kacho.svc:4444/.well-known/jwks.json
      # In-cluster Hydra ADMIN endpoint для sa_keys (SAKeyService.Issue/Revoke) +
      # user_tokens (POST /admin/clients + jwt-bearer trust-grants). Без него
      # ResolveHydraAdminURL() падает на внешний `https://hydra-admin.<domain>`,
      # недостижимый изнутри кластера → CreateOAuthClient fails → SAKey.Issue
      # завершается ошибкой ("internal worker error"). Admin API НИКОГДА не
      # публикуется наружу — только cluster-internal Service (Ory split public/admin).
      # Over TLS: the hop carries the administrative bearer, and the admin API it
      # opens authenticates nobody. Plaintext here is refused at start by
      # config.validateProductionProviderAdminHop; so is https with no anchor.
      # The SAN list on the serving certificate covers this `.svc` spelling.
      hydraAdminUrl: https://kacho-umbrella-hydra-admin-tls.kacho.svc:4445
      hydraAdminCaFile: /etc/kaname/tls/server/ca.crt
kacho-nlb:
  image:
    tag: main-b622b388
  networkPolicy:
    enable: false            # kacho-nlb NP off (nlb chart uses `enable`, not `enabled`)
  # nlb chart default db.host=kacho-pg-nlb assumes release name `kacho`; this release
  # is `kacho-umbrella` → the real Service is kacho-umbrella-pg-nlb (the correct host
  # normally comes from values.dev, which the prod layer drops). Point it correctly.
  db:
    host: kacho-umbrella-pg-nlb
  # nlb→geo mTLS edge (region_id validation) + non-empty trusted-forwarder allow-list
  # (production+mTLS fail-closed gate: empty list trusts any mTLS peer to forward the
  # end-user principal → impersonation). Only the api-gateway SA legitimately forwards.
  mtls:
    edges:
      geo: true
  config:
    authz:
      trustedForwarderSANs:
        - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
api-gateway:
  # ─── Объявление приёма токена (Ф1б, задача #926) ──────────────────────
  #
  # Издатель на крае — МНОЖЕСТВО: платформа чеканит свои токены сама (задача
  # #897), а прежний издатель на переходе остаётся. У КАЖДОГО принимаемого
  # издателя своя запись источника ключей: объединить наборы было бы дешевле и
  # уничтожило бы ровно ту защиту, ради которой развязка делается — ключ одного
  # издателя проверял бы токен, объявляющий другого.
  #
  # Значения — ТЕ ЖЕ, что у ПЕРВОЙ конфигурации проверяющего
  # (kacho-registry.tokenAcceptance ниже): одна платформа, один набор адресов.
  # Расхождение между ними было бы двумя местами об одном предмете.
  #
  # ОТКАТ состоит в снятии platformIssuer и нашего издателя из issuers — не в
  # перекатке образа.
  tokenAcceptance:
    issuers: "https://kaname.kacho.local,https://hydra.api.kacho.cloud"
    # Адрес ОБЪЯВЛЯЕТСЯ, а не выводится из издателя: издатель приходит от
    # предъявителя, и производный адрес получался бы у ВСЯКОГО издателя —
    # состояние «записи нет» не наступало бы никогда, а страж старта стал бы
    # тождественно истинным.
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json,https://hydra.api.kacho.cloud=https://kaname-internal.kacho.svc:9097/.well-known/jwks.json"
    # Наш издатель выбирает полосу приёма: строгий тип at+jwt и чтение отзыва на
    # предъявлении. Вне issuers — отказ в старте.
    platformIssuer: "https://kaname.kacho.local"
    # НАШ авторитет отзыва. Прежний провайдер о наших токенах не знает by
    # construction: спрошенный про наш токен, он отвечает не «действует» и не
    # «отозван», а утверждение о предмете, которого у него нет.
    revocationUrl: "https://kaname-internal.kacho.svc:9097/internal/tokens/introspect"
    # Якорь доверия хопа к авторитету: по нему едет ПРЕДЪЯВЛЕННЫЙ токен, а не
    # только административный вызов. Та же связка, что у хопа за ключами.
    revocationCa:
      secretName: kaname-server-tls
      key: ca.crt
      mountPath: /etc/api-gateway/platform-revocation-ca
    # ЧЕМ край предъявляет СЕБЯ авторитету. Якоря выше НЕ ДОСТАТОЧНО: он
    # проверяет ЕГО, а не представляет НАС. Авторитет выставлен на слушателе,
    # который сертификат ЗАПРАШИВАЕТ (iam отказывается стартовать иначе), и
    # спрашивающему без проверенной цепочки отвечает отказом — то есть без этой
    # пары КАЖДЫЙ предъявитель нашей чеканки получал бы 503 при исправном на вид
    # контроле. Пути — на УЖЕ смонтированную клиентскую личность края
    # (mtls.mountPath); своего тома у пары нет намеренно, вторая копия той же
    # личности разъехалась бы с первой молча.
    revocationClientCert:
      certFile: /etc/api-gateway/mtls/tls.crt
      keyFile: /etc/api-gateway/mtls/tls.key
  # FORWARD ROLL: main-c7dce40d (kacho-api-gateway origin/main HEAD, Docker Hub-verified
  # 2026-07-15T14:02) — strict forward from the live main-a7c82963 (a7c82963 IS an
  # ancestor of c7dce40d, no revert). Adds RG-1 #145: registers the 6 public Repository
  # RPCs + syncs the embedded permission-catalog to 418 entries. COUPLED to iam
  # main-b3d23769 (#325, also 418-catalog) — a gateway at 418 with an iam below 418 would
  # AUTHZ_DENY the new registry RPCs ("catalog: no entry for method"); rolling both
  # together keeps iam(418)/gateway(418)/registry(af0eacae) catalog-coherent.
  image: docker.io/prorobotech/kacho-api-gateway:main-b622b388
  # Здесь стоял разбор снятого отсюда блока extraEnv из пяти переменных: край
  # объявлял их и пробросом, и ручками чарта, отчего в контейнере получалось по
  # две записи на имя. `helm template` на это молчит, apiserver отвечает «hides
  # previous definition … may be dropped when using apply», и побеждает та
  # запись, которую выбрал порядок блоков шаблона, — то есть не тот, кто правил
  # профиль. Класс остаётся нормой и держится не этим абзацем, а
  # deploy/posture_parity_test.go, который судит его по всем профилям сразу.
  #
  # Четыре из тех пяти переменных настраивали ВНУТРЕННИЙ gRPC-листенер края.
  # Его больше нет (#1024): единственную службу сняли вместе с обратным ребром
  # «сервис гасит кэш решений края», а листенер без единственной службы был бы
  # входной поверхностью без единого метода. Ни проброса, ни ручки для него
  # сегодня не существует. Пятая (метка окружения) приходит ручкой `appEnv` из
  # values.prod.yaml и здесь не повторяется.
  # gateway→geo backend dial must be mTLS: geo's :9090 runs public_mtls=true, but
  # values.prod's mtls.edges predate the geo cutover (only vpc/compute/iam/nlb) → the
  # gateway dialed geo plaintext → 503 on /geo/v1/regions|zones (region/zone admin).
  mtls:
    edges:
      geo: true

# ── kacho-registry (OCI control-plane) + zot + pg-registry — Stage 1 (epic #129) ──
# Integrates the previously-orphaned registry into the umbrella. Production posture
# matching the running pod + satisfying serve.go prod-guards: AUTH_MODE=production,
# mTLS both listeners + both registry→iam edges (cert-manager kacho-internal-ca),
# DATAPLANE_TLS_TERMINATED_EXTERNALLY=true (dataplane :8080 behind ext TLS),
# HYDRA_ISSUER pinned. DB stays sslmode=disable (Ory/infra-tier concession, like the
# running registry). zot image = the stand's running ghcr.io/project-zot:latest.
registry:
  enabled: true
  # `serviceAud` здесь НЕ объявляется: имя службы полосы объявлено один раз в
  # `global.kacho.registry.serviceAud` (см. выше) и читается обоими подчартами.
  # Объявить его и здесь, но иначе, — отказ рендера с обеими величинами.
  image:
    # FORWARD ROLL: main-af0eacae (kacho-registry origin/main HEAD, Docker Hub-verified
    # 2026-07-15T14:00) — STRICT forward from the live main-5eb21d25 (5eb21d25 IS an
    # ancestor of af0eacae, verified: no revert of any live functionality). Live already
    # carries #35 Defect-A (unknown blob) + #37 Defect-B (new-repo push deadlock) + #38
    # zot S3/redirectBlobURL + #34 authz-TTL + #40 push-grant revoke-safety (delete-on-
    # materialized + 60s TTL) + push-deny 403. af0eacae adds ONLY RG-1 #43 (Repository
    # config-overlay persistence: migration + domain + repo, DB-level invariants) on top.
    # Consistent with the iam(#325)/gateway(#145) 418-catalog + anon-recognition roll.
    tag: main-b622b388
  authMode: production
  db:
    sslMode: disable
  authz:
    iamGrpcAddr: kaname-internal.kacho.svc:9091
    iamProjectGrpcAddr: kaname.kacho.svc:9090
  zot:
    # ─── Аутентификация хранилища слоёв ───────────────────────────────────────
    # zot не различает тенантов: пока его порт отвечал любому в сети подов, весь
    # per-request контроль плоскости данных обходился одним хопом (перечисление
    # репозиториев всех тенантов, выгрузка чужих слоёв, подмена образа под чужим
    # тегом, удаление содержимого). На этом стенде сетевые политики отключены
    # целиком (см. шапку профиля), поэтому аутентификация — ЕДИНСТВЕННЫЙ контроль
    # на этом хопе, и её отсутствие ничем не компенсировалось.
    #
    # ⚠ ШАГ ОПЕРАТОРА (до раската): Secret `zot-auth` в ns kacho с ключами
    # username/password/htpasswd (htpasswd — bcrypt-строка `<user>:$2y$…` того же
    # пароля), провизионится ВНЕ git — ровно как `zot-s3-creds` ниже. Без него поды
    # zot и registry не поднимутся: чарт отказывается разворачивать открытое
    # хранилище, а registry в production-режиме — стартовать без учётных данных.
    auth:
      existingSecret: zot-auth
    # v2.1.18 — carries http.compat + the s3 storageDriver + redirectBlobURL. The
    # fe3455 `:latest` tag already resolves to this sha (sha256:34f18f78…); pin it so a
    # future re-pull can't drift to a build without these config keys.
    #
    # DELIBERATELY BEHIND THE SUB-CHART DEFAULT, WHICH NOW READS v2.1.20. This is an
    # override, not an oversight, and it is recorded here so the divergence is readable
    # rather than silent. Two reasons, and only the second is a blocker:
    #   · this file describes what is RUNNING on the fe3455 stand (cutover-fe3455.sh
    #     records the same sha) — moving the pin here is a deployment, not a dependency
    #     bump, and it belongs to whoever plans that rollout;
    #   · of the three properties named above, http.compat and redirectBlobURL were
    #     re-measured on v2.1.20 (see services/registry/deploy/values.yaml), but the s3
    #     storageDriver path was NOT re-run against a live bucket — and s3 is exactly
    #     what this profile uses. Bumping here would carry an unverified claim onto the
    #     one stand that depends on it.
    # Lift the pin together with an s3 re-verification, in its own change.
    image:
      tag: v2.1.18
    # docker2s2 → rendered under http.compat (zot rejects a TOP-LEVEL compat key). Lets
    # clients push the Docker schema2 manifests `docker push` emits (else 415 on manifest).
    compat:
      - docker2s2
    storage:
      persistence: false     # fe3455 has no dynamic StorageClass → local dir is ephemeral
      dedupe: false          # s3 dedup needs a remote cache DB (dynamodb) — unavailable
      # blob GET → 307 to an S3 presigned URL; clients pull blobs DIRECTLY from Beget
      # object storage (offloads zot; post-authz — the data-plane enforces v_get first).
      redirectBlobURL: true
      # Remote S3 backend (Beget) → blobs PERSIST across zot restarts (the emptyDir is
      # only a local staging dir now). region/endpoint/bucket are operational config; the
      # ACCESS/SECRET keys live ONLY in the `zot-s3-creds` Secret (env), never in git.
      s3:
        enabled: true
        region: ru1
        regionEndpoint: https://s3.ru1.storage.beget.cloud
        bucket: c90bf04ae9a8-transformative-cillian
        rootDirectory: /zot
        secure: true
        forcePathStyle: true
        existingSecret: zot-s3-creds
  # dedicated external VIP for the OCI data-plane (docker login/push/pull), separate
  # from the console — Beget/Cilium LB-IPAM assigns its own external IP (like ui-lb/uif-lb).
  service:
    dataplaneLB:
      enabled: true
      # Beget LB controller annotations (same as ui-lb/uif-lb) — required for the
      # provider to actually provision an external VIP; without them the Service
      # stays <pending>.
      annotations:
        lb.beget.com/type: external
        lb.beget.com/algorithm: round_robin
        lb.beget.com/healthcheck-interval-seconds: "60"
        lb.beget.com/healthcheck-timeout-seconds: "5"
      # ─── TLS-терминация публичного OCI data-plane (docker login/push/pull) ───
      # БЕЗ этого блока чарт рендерит 443→dataplane (plaintext) и docker падает с
      # «http: server gave HTTP response to HTTPS client». Ровно это и произошло
      # 2026-07-15: TLS-стек data-plane был наложен руками (LE-серт + kubectl-patch
      # Service 443→dp-tls) и не жил в values → `helm upgrade --take-ownership`
      # усыновил Service, перерендерил дефолтом и уронил HTTPS реестра. Блок ниже
      # делает живое состояние выразимым чартом — дрейф закрыт.
      tlsSidecar:
        enabled: true
        cert:
          # Имена СОВПАДАЮТ с уже выпущенным в кластере Certificate/секретом →
          # helm усыновляет их без перевыпуска (LE duplicate-limit 5/нед).
          name: registry-dataplane-letsencrypt
          secretName: registry-dataplane-le-tls
          issuerRef:
            # Публично-доверенный issuer обязателен: серт предъявляется docker-клиенту,
            # а internal-CA он отвергает (x509: unknown authority). Trust к iam :9097 не
            # страдает — при mtls.enable=true ca.crt берётся из mtls.serverSecretName.
            name: letsencrypt-prod
            kind: ClusterIssuer
          # Публичный CA не подписывает CN/loopback-IP и навязывает свою keyalg-политику;
          # любое лишнее поле в spec'е = перевыпуск. Пусто → шаблон их опускает, и рендер
          # выходит байт-в-байт равным живому объекту (сверено против кластера).
          commonName: ""
          ipAddresses: []
          usages: []
          privateKey:
            algorithm: ""
            size: ""
  # registry-iam-jwks-unify — the data-plane docker-Bearer verifier now fetches JWKS
  # from the cluster-INTERNAL kaname JWKS proxy (:9097) instead of dialing Hydra.
  # iam serves a byte-for-byte mirror of Hydra's PUBLIC JWKS over one-way server-TLS
  # (internal-CA leaf) — kids/alg match Hydra-signed tokens; the registry pod trusts
  # the internal-CA via SSL_CERT_DIR. This is an https in-cluster Service, so
  # production requireSecureJWKSURL passes without needing an external hydra-https
  # terminator. Hydra stays the SIGNER/ISSUER — only the key-DISTRIBUTION URL moved.
  #
  # ⚠ IAM-FIRST DEPLOY SEQUENCING (fail-closed — do NOT flip prematurely):
  #   the kaname :9097 JWKS endpoint MUST be live and smoke-verified serving
  #   (GET /.well-known/jwks.json → 200 with Hydra kids) BEFORE this key-set flip
  #   (registry.tokenAcceptance.issuerKeySets) reaches a rolling registry pod. A premature flip (iam endpoint not yet
  #   serving) fails every signature verify CLOSED → HTTP 401 on ALL prod docker pulls.
  #   Runbook: roll kaname first (this chart adds the :9097 listener), curl the
  #   in-cluster endpoint, THEN let the registry pod pick up this URL.
  # Приём identity-JWT: издатель — МНОЖЕСТВО (F1, задача #897)
  #
  # Платформа чеканит свои токены сама, а прежний издатель на переходе остаётся,
  # поэтому принимаемых издателей двое и у КАЖДОГО своя запись источника ключей.
  # Объединять наборы в один документ дешевле и уничтожило бы ровно ту защиту,
  # ради которой развязка заводится: ключ одного издателя проверял бы токен,
  # объявляющий другого.
  #
  # Прежние ручки `registry.iam.jwksUrl` и `registry.hydra.issuer` СНЯТЫ, а не
  # оставлены мостом: мост был бы вторым местом об одном предмете и обессмыслил
  # бы то, ради чего смена вообще видна при старте — пересмотр пина издателя.
  # Профиль, задающий только снятые имена, принимает НОЛЬ издателей и не
  # поднимается.
  tokenAcceptance:
    issuers: "https://kaname.kacho.local,https://hydra.api.kacho.cloud"
    # Адрес ОБЪЯВЛЯЕТСЯ, а не выводится из издателя: издатель приходит от
    # предъявителя, и производный адрес получался бы у ВСЯКОГО издателя —
    # состояние «записи нет» не наступало бы никогда, а страж старта стал бы
    # тождественно истинным.
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json,https://hydra.api.kacho.cloud=https://kaname-internal.kacho.svc:9097/.well-known/jwks.json"
    # Наш издатель выбирает полосу приёма: тип at+jwt и чтение отзыва на
    # предъявлении. Вне issuers — отказ в старте.
    platformIssuer: "https://kaname.kacho.local"
    # Авторитет отзыва. Контроль, действующий на выдаче и не действующий на
    # предъявлении, отзывом не является: он лишь не выдаёт нового, а
    # предъявленное проходит до истечения срока, и это состояние не сходится
    # само.
    revocationUrl: "https://kaname-internal.kacho.svc:9097/internal/tokens/introspect"
  dataplaneTLSTerminatedExternally: true
  mtls:
    enable: true
    edges:
      iamAuthz: true
      iamProject: true
      # registry→geo RegionService.Get (public :9090, REG-1 F4). geo runs hardened
      # (AUTH_MODE=production) and requires verified transport, so arm the client-mTLS
      # edge (reuses registry-client-tls; serverName default kacho-geo.kacho.svc
      # ∈ geo server-cert SAN). Without it the geo peer rejects the insecure dial.
      geo: true
      # Авторитету отзыва присылают ПРЕДЪЯВЛЕННЫЙ токен, поэтому хоп к нему идёт
      # под клиентским сертификатом. Набор проверочных ключей с того же
      # слушателя по-прежнему берётся БЕЗ сертификата: его origin-agnostic
      # свойство и есть причина, по которой ребро не делается взаимным целиком.
      tokenRevocation: true

# pg-registry — greenfield bitnamilegacy image + operator secret (like the other pgs)
pg-registry:
  enabled: true
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
  auth: { existingSecret: kacho-umbrella-pg-registry, username: registry, database: kacho_registry }
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }

# ── kacho-storage — Storage control-plane (Volume/VolumeAttachment/Snapshot/DiskType) ──
# gRPC public :9090 + cluster-internal :9091 + diagnostic /healthz. server-mTLS on
# both listeners; per-edge client-mTLS storage→{geo,iam}. DB channel over TLS
# (sslmode=require; pg server cert issued via mtls.pgTls.services above). Peer edges:
# storage→geo (zone_id), storage→iam PUBLIC (ProjectService.Get) + INTERNAL (Check).
storage:
  # ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: config.authMode).
  authMode: production
  # ✅ ВКЛЮЧЁН (2026-07-20) — чарт kacho-storage интегрирован с umbrella
  # (services/storage/deploy: fullnameOverride kacho-storage, certificate.yaml +
  # mtls.*, db.* existingSecret, storage→iam fga-register). Три блокера прошлой
  # попытки закрыты в чарте, не оверлее:
  #   1. Ключи выровнены: чарт читает config.{authMode,geo/iam/authzIamGrpcAddr,
  #      fgaRegisterDrainerEnabled} + db.{host,port,user,name,sslMode,
  #      passwordSecretName,passwordSecretKey} — ровно то, что пишется ниже (раньше
  #      чарт читал config.dbHost и молча дефолтил kacho-storage-postgres → migrator
  #      `no such host`).
  #   2. Пароль БД — existingSecret через secretKeyRef на bitnami-provisioned
  #      kacho-umbrella-pg-storage (ключ password); chart-rendered placeholder-Secret
  #      удалён (secret.yaml). Пароль НЕ в git.
  #   3. Имя ресурсов — fullnameOverride kacho-storage → Service/Deployment/DNS =
  #      kacho-storage (SAN server-cert'а + compute→storage dial-host совпадают).
  # fga-register (SEC-D / CS-1 GAP-D): storage→iam RegisterResource owner-tuple
  # (KACHO_STORAGE_IAM_CLIENT_MTLS_* + fgaRegisterDrainerEnabled) + iam-seed
  # 0057_storage_sa_least_priv (sva(md5("kacho-storage"))#fga_writer@iam_fgaproxy:
  # system) → gateway scope_extractors {storage_volume,volume_id}/
  # {storage_snapshot,snapshot_id} резолвят target→project (анти-BOLA), SEC-A
  # parity с vpc/compute.
  enabled: true
  image:
    # kacho-storage image (docker.io/prorobotech/kacho-storage from base values.yaml);
    # tag drives storage + kacho-migrator both. main-b622b388 — coherent with the
    # vpc/compute/nlb release SHA pinned above.
    tag: main-b622b388
  config:
    # storage→geo (zone_id) + storage→iam PUBLIC (ProjectService.Get, :9090) +
    # INTERNAL (Check + RegisterResource fga-register, :9091).
    geoGrpcAddr: kacho-geo.kacho.svc:9090
    iamGrpcAddr: kaname.kacho.svc:9090
    authzIamGrpcAddr: kaname-internal.kacho.svc:9091
    # fga-register drainer (SEC-D / CS-1 GAP-D). Chart default already true; restated
    # for prod-explicitness. Requires authzIamGrpcAddr (set) + mtls.edges.iam (below).
    fgaRegisterDrainerEnabled: true
  db:
    host: kacho-umbrella-pg-storage
    sslMode: require
    # operator-/bitnami-provisioned Secret (pg-storage.auth.existingSecret below);
    # the storage chart references it via secretKeyRef (renders no Secret of its own).
    passwordSecretName: kacho-umbrella-pg-storage
    passwordSecretKey: password
  # server-mTLS on both listeners + per-edge client-mTLS storage→{geo,iam}. Один
  # client-leaf (kacho-storage-client-tls) на все storage→iam-дозвоны; serverName
  # default kaname.kacho.svc ∈ iam server-cert SAN (валиден и для
  # :9090, и для internal :9091).
  mtls:
    enable: true
    edges:
      geo: true
      iam: true

# pg-storage — greenfield bitnamilegacy image + operator secret + cert-manager TLS
# (server cert kacho-umbrella-pg-storage-server-tls issued via mtls.pgTls.services).
pg-storage:
  # ✅ Включён вместе со `storage` (см. блок storage выше) — БД потребителя storage.
  enabled: true
  image: { registry: docker.io, repository: bitnamilegacy/postgresql }
  volumePermissions: { image: { registry: docker.io, repository: bitnamilegacy/os-shell } }
  auth: { existingSecret: kacho-umbrella-pg-storage, username: storage, database: kacho_storage }
  tls:
    enabled: true
    certificatesSecret: kacho-umbrella-pg-storage-server-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    pgHbaConfiguration: *pgHbaTLSRequired