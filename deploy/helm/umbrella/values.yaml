# Kachō umbrella default values — control-plane dev stand (kind + Helm).
#
# Base defaults for the whole umbrella chart; per-cluster overrides come from
# `values.dev.yaml` (the kind stand brought up by `make dev-up`) or a
# `values.prorobotech.yaml` image-tag overlay.
#
# Домен Kachō — configurable через `kacho.domain`; все Phase 2 template'ы
# (Kratos/Hydra config, api-gateway ingress, kacho-ui BFF, security.txt) обязаны
# использовать `{{ .Values.kacho.domain }}` вместо хардкода. Это позволяет
# деплоить один chart на разные домены без правки template'ов.
#
# Поддоменная схема (производные от `kacho.domain`):
#   - https://<domain>        — публичный API (api-gateway TLS endpoint)
#   - https://app.<domain>    — UI / BFF (kacho-ui)
#   - https://hydra.<domain>  — Hydra public OIDC issuer
#   - https://kratos.<domain> — Kratos public selfservice
#
# Sub-chart propagation: Helm пропагирует автоматически только `global.*`. Для
# sub-chart'ов, которым нужны umbrella-значения, дублируем структуру в namespace'е
# sub-chart'а (`kaname.*`, `kratos-selfservice-ui.*`).

# INFRA sec-hardening — optional Helm-owned Namespace carrying Pod Security
# Admission labels (restricted, warn+audit). Default FALSE: the dev/CI flow
# precreates the namespace (`kubectl create namespace` + `helm --create-namespace`)
# and labels it there (Makefile dev-up / newman-e2e.yml). Set true for GitOps
# installs where Helm owns the namespace object. See templates/namespace.yaml.
namespace:
  create: false

# ЗДЕСЬ ЛЕЖИТ ТОЛЬКО ТО, ЧТО ЧИТАЮТ ШАБЛОНЫ САМОГО ЗОНТИКА.
#
# Ключи сабчарта адресуются через его имя (`kaname.kacho.*`) и в этот блок не
# попадают: helm не пропагирует верхний уровень внутрь сабчарта. Прежде блок нёс
# копию всей ветки `kacho.*` «для документации» — восемь ключей, которых не читал
# ни один шаблон. Копия выглядела главной: оператор правил `--set kacho.subdomains.app=…`
# либо `--set kacho.iam.jwks.encKeySecretName=…`, рендер проходил, ничего не менялось.
#
# Действующие адреса тех же настроек: имена секретов JWKS и хука, а также
# префиксы поддоменов — `kaname.kacho.*` (ниже). Размеры кэшей отзыва сессий и
# повторов DPoP настраиваются переменными окружения ПРОЦЕССА края
# (`api-gateway.extraEnv`), а не этой веткой: их читает api-gateway, и никогда не
# читал kaname.
kacho:
  # Корневой домен Kachō Cloud. Читается шаблонами зонтика (ingress, сертификаты).
  # Override per-cluster:
  #   helm upgrade … --set kacho.domain=test.example.com \
  #                  --set kaname.kacho.domain=test.example.com
  domain: api.kacho.cloud

# ─── kaname sub-chart ─────────────────────────────────────────────────
# Helm не пропагирует top-level `kacho.*` в sub-chart автоматически — дублируем
# в namespace'е sub-chart'а (sub-chart держит fallback в charts/kaname/values.yaml).
kaname:
  # kaname использует структуру image.{repository,tag,pullPolicy}; dev-стенд
  # override'ит в values.dev.yaml на local kaname:dev.
  image:
    repository: docker.io/prorobotech/kaname
    tag: main-be5a45a2
    pullPolicy: IfNotPresent
  kacho:
    domain: api.kacho.cloud
    subdomains:
      # `app` и `kratos` ПЕРЕЕХАЛИ в `global.kacho.identity` вместе с содержимым
      # настроек службы личности: оно обязано вычисляться и в контексте подчарта
      # провайдера, где значений kaname нет. Здесь остаётся только то, что
      # читают шаблоны САМОГО подчарта, — иначе ключ до процесса не доедет,
      # а оператор прочтёт строку как заявление о посадке.
      hydra: hydra
    iam:
      # Ротатора нет (см. выше) — остаются только реально потребляемые ключи.
      jwks:
        encKeySecretName: kaname-jwks-enc-key
        encKeySecretKey: enc_key
      # saKey — lifetime discipline for the machine credential (see the
      # kaname sub-chart values for the full rationale). accessTokenTtl is
      # empty by default: the env is then omitted and the provider-global token
      # TTL applies, so no existing deployment changes on upgrade. Production
      # pins it (values.prod.yaml) as defence-in-depth against a future
      # regression in the global TTL silently extending machine-token life.
      saKey:
        defaultTtl: "2160h"   # 90d — applied when ttl_seconds is omitted
        maxTtl: "8760h"       # 365d — inclusive ceiling on ttl_seconds
        accessTokenTtl: ""
        # bindDpop — mint SENDER-CONSTRAINED (RFC 9449) machine tokens. Off, and
        # deliberately so: binding is per-client REGISTRATION metadata, so it
        # only affects keys issued after it is enabled. Order is load-bearing —
        # enable this, rotate existing SA keys, and only THEN set the gateway's
        # api-gateway.authn.requireMachineTokenBinding. The reverse order rejects
        # every service-account token.
        #
        # Its reader is the client MIRROR at the previous issuer, so a profile
        # that translates the contour (`kaname.config.authn.clientToken.enabled`)
        # has no reader for it at all: iam refuses to start with both set (#1137).
        bindDpop: false
    hooks:
      tokenHookSecretName: kaname-hook-token
      tokenHookSecretKey: token
  # OPA sidecar pipeline (deny-only Rego guardrails + signed bundle pulled from
  # kaname Internal RPC). Full defaults live in charts/kaname/values.yaml;
  # this override block flips the dev-relevant knobs. Disabled by default — the
  # whole opa/jwks ConfigMap set (now owned by the kaname sub-chart) renders
  # only when opaSidecar.enabled=true.
  opaSidecar:
    enabled: false
    image: openpolicyagent/opa:1.0.0-rootless
    logLevel: info
    jwks:
      configMapName: kaname-jwks
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ─── Cross-cutting authz NetworkPolicy (umbrella template networkpolicy-authz) ─
# Defense-in-depth pod-to-pod allowlist spanning kaname + api-gateway
# + backends — no single owning chart, so the selectors live at umbrella level.
# Disabled by default (would block :9091 port-forward debugging in dev). The rest
# of the OPA sidecar config now lives in the kaname sub-chart.
opaSidecar:
  networkPolicy:
    enabled: false
    iamPodSelector:
      matchLabels:
        app.kubernetes.io/name: kaname
    apiGatewayPodSelector:
      matchLabels:
        app: api-gateway
    # Backend services that dial kaname :9091 (per-RPC Check + fga-register).
    # A service missing from this list is fail-CLOSED on every RPC once
    # these policies are enforced — it is an allowlist, not a hint. `kacho-storage` is
    # the storage control-plane pod label (chart fullnameOverride, `app: kacho-storage`).
    # `kacho-geo` and `registry` dial kaname :9091 exactly like the others
    # (per-RPC Check; registry additionally uses the fga-register edge). Both were
    # missing, so once these policies are enforced every geo and registry RPC was
    # refused at the network layer — the same fail-closed omission storage had.
    # Labels are the pods' own `app` values: geo → `kacho-geo`, registry →
    # `registry` (registry chart `.Values.name`, NOT `kacho-registry`).
    backendPodSelector:
      matchExpressions:
        - key: app
          operator: In
          values: [vpc, compute, kacho-nlb, kacho-storage, kacho-geo, registry]
    # Egress-сторона (policy 3). NetworkPolicy действует на ПОД, а не на контейнер,
    # поэтому список исходящих правил обязан покрывать зависимости ОСНОВНОГО
    # контейнера помеченного пода, а не только OPA-сайдкара. Для kaname это его
    # собственная Postgres и Hydra, фасадом к которой он является; без них политика
    # не «сужает трафик», а роняет весь authN/authZ-ярус.
    datastorePodSelector:
      matchLabels:
        app.kubernetes.io/name: pg-iam
    hydraPodSelector:
      matchLabels:
        app.kubernetes.io/name: hydra

# ─── Per-datastore Postgres ingress allowlist (templates/networkpolicy-datastore) ─
# Each backing Postgres StatefulSet (bitnami sub-chart, pod label
# app.kubernetes.io/name=pg-<svc>) is otherwise reachable on :5432 from every pod
# in the namespace. This adds a per-pg ingress allowlist so the pg pod implicitly
# denies all other ingress (CIS Kubernetes 5.3.2 / OWASP A05:2021). Self-contained:
# each policy selects only its own pg pod. Disabled by default (kind/kindnet does
# not enforce NetworkPolicy; :5432 port-forward debugging in dev would break).
# `from` selectors are cluster-tunable defaults — verify consumer coverage before
# enabling on a NetworkPolicy-enforcing CNI. See docs/architecture/known-divergences.md §4.
networkPolicy:
  datastore:
    enabled: false
    port: 5432
    instances:
      - name: pg-vpc
        from:
          - podSelector:
              matchLabels: { app: vpc }
      - name: pg-compute
        from:
          - podSelector:
              matchLabels: { app: compute }
          # compute→geo data-migration Job reads pg-compute as source.
          - podSelector:
              matchLabels: { kacho.cloud/job: geo-data-migration }
      - name: pg-iam
        from:
          # covers kaname Deployment и `migrate` init-container.
          - podSelector:
              matchLabels: { app: kaname }
      - name: pg-geo
        from:
          - podSelector:
              matchLabels: { app: kacho-geo }
          - podSelector:
              matchLabels: { kacho.cloud/job: geo-data-migration }
      - name: pg-nlb
        from:
          - podSelector:
              matchLabels: { app: kacho-nlb }
      # covers the kacho-storage Deployment and its `migrate` init-container
      # (both carry `app: kacho-storage`). Rendering this entry while storage is
      # disabled is harmless — the podSelector then matches no pod.
      - name: pg-storage
        from:
          - podSelector:
              matchLabels: { app: kacho-storage }
      # covers the registry Deployment and its `migrate` init-container (both
      # carry `app: registry`). Rendering this entry while registry is disabled is
      # harmless — the podSelector then matches no pod.
      - name: pg-registry
        from:
          - podSelector:
              matchLabels: { app: registry }

# ─── cluster-internal mTLS PKI (cert-manager internal-CA) ──────────────────
# Master switch for the whole service→service mTLS scheme. When enabled:
#   - the cert-manager dependency installs (controller + CRDs; Chart.yaml
#     `condition: mtls.enabled`);
#   - templates/clusterissuer.yaml mints the self-signed → CA-root → kacho-internal-ca
#     ClusterIssuer chain (post-install hooks, after the webhook is Ready);
#   - each component sub-chart issues its OWN server/client leaf Certificate
#     (templates/certificate.yaml, gated by that component's `mtls.enable`),
#     signed by kacho-internal-ca. Client-cert URI-SANs are SPIRE-format
#     spiffe://kacho.cloud/ns/kacho/sa/kacho-<svc> and MUST match the IAM
#     module-SA seed (kaname SEC-C migration 0009) so the fgaproxy ReBAC gate
#     resolves them. Base default OFF; values.dev.yaml turns it ON.
mtls:
  enabled: false
  internalCA:
    rootIssuerName: kacho-selfsigned
    clusterIssuerName: kacho-internal-ca
    caSecretName: kacho-internal-ca-root
    # Namespace of the CA-root Certificate/secret. Empty → release namespace
    # (in-umbrella cert-manager). Set to the EXISTING cert-manager controller's
    # --cluster-resource-namespace when reusing a pre-installed cert-manager
    # (e.g. "beget-cert-manager" on the fe3455 cluster), else the CA ClusterIssuer
    # cannot find its signing secret.
    caNamespace: ""
    caDuration: "87600h"      # 10y root
    caRenewBefore: "720h"     # 30d
  # ─── provider ADMIN listener server-TLS (templates/hydra-admin-certificate.yaml) ─
  # The admin listener (:4445) carries the CALLER'S LIVE BEARER on every
  # authenticated request that misses the introspection cache (introspection asks
  # about a token by SENDING it), and the administrative bearer on every OAuth2
  # client registration, trust grant and session teardown iam performs. The admin
  # API authenticates nobody — reaching it IS the authorization — so in the clear
  # all of that is readable, and reusable, by anything on the path.
  #
  # Enabling this issues the serving cert AND places the TERMINATOR that uses it:
  # an nginx sidecar inside the provider's own pod (templates/hydra-admin-tls-*),
  # plus its own ClusterIP Service. The profile must ALSO point the consumers at
  # that Service over https with the matching trust anchor. A production-class
  # gateway and iam both REFUSE TO START on a plaintext or unanchored hop, so the
  # pieces move together by construction.
  #
  # WHY A TERMINATOR AND NOT THE PROVIDER'S OWN KNOB. The deployed version does
  # NOT read a PER-LISTENER TLS declaration — MEASURED, not inferred from docs;
  # the coordinate and the one-command re-measurement live in
  # deploy/PROVIDER-LISTENER-PREMISE.md, and the posture gate reddens on any
  # version change and names that command. Do not write here again that the
  # provider resolves TLS per listener without re-measuring it: that claim stood
  # in this very file, was wrong, and had itself replaced a correct note.
  #
  # Only the ADMIN hop moves. The public OIDC listener the ingress and JWKS
  # readers use over plain http is untouched.
  hydraAdminTls:
    enabled: false
    # Secret carrying tls.crt/tls.key for the provider and ca.crt for consumers.
    # Empty → "<release>-hydra-admin-tls".
    secretName: ""
  # ─── bootstrap-operator identity (templates/bootstrap-operator-certificate.yaml) ─
  # A client-auth-ONLY internal-CA leaf whose sole purpose is to call
  # iam.v1.InternalBootstrapTokenService/MintBootstrapToken on kaname :9091
  # (the cluster-admin token mint has no ReBAC gate and no gateway REST route —
  # its ONLY credential is the caller's client certificate). Deliberately NOT the
  # api-gateway identity: "is the api-gateway" must never be a licence to mint
  # cluster-admin.
  #
  # Issuing it grants NOTHING by itself — kaname must also carry this exact SAN
  # in `kaname.config.authn.bootstrapMint.allowedClientSANs` (empty list ⇒ the
  # mint denies everyone, in every mode). Rendered only when mtls.enabled, so the
  # base profile (mTLS off) emits nothing.
  bootstrapOperator:
    enabled: true
    secretName: kacho-bootstrap-operator-client-tls
    spiffe:
      trustDomain: kacho.cloud
      # Pinned (not release-namespace-derived) so the SAN in the cert and the SAN
      # in the iam allow-list are the same literal across profiles.
      namespace: kacho
      saName: kacho-bootstrap-operator
    leafDuration: "2160h"     # 90d
    leafRenewBefore: "720h"   # 30d

# ─── УЗЕЛ-ПРИЁМНИК ПИСЕМ СТЕНДА ──────────────────────────────────────────────
#
# Поднимается шаблоном templates/mail-receiver.yaml — там же разбор, почему он
# вообще заведён и почему именно этот образ. Здесь только величины.
#
# УМОЛЧАНИЕ `false` — это НЕ «выключенный по умолчанию контроль», а факт о
# посадке: приёмник нужен там, где письмо обязана прочитать ПРОБА, и не нужен
# там, где полоса ведёт во внешний ретранслятор. Профиль стенда объявляет
# `true`; боевой не объявляет ничего и получает ретранслятор слоем учётных
# данных.
#
# Это не противоречит решению Р18 («приёмник — часть ЯДРА стенда»): ядром там
# названа раскладка СКВОЗНЫХ ПРОБ, где шлюзуемый приёмник воспроизвёл бы
# чинимый дефект — шард снял бы узел, оставив настройку, стартовал и молча не
# доставлял. Держит это гейт deploy/mail_receiver_core_test.go: приёмник не
# значится шлюзуемым компонентом ни в одном шарде, и попытка объявить такой
# шард — находка.
mailpit:
  enabled: false
  # ─── ОБРАЗ ПРИБИТ ДАЙДЖЕСТОМ ────────────────────────────────────────────
  # `tag` стоит рядом ради читаемости и НЕ участвует в рантайме: в имя образа
  # идёт `digest`. Расхождение между ними — находка гейта, а не вопрос
  # внимания; отсутствие `digest` роняет рендер.
  #
  # Дайджест снят с реестра 2026-08-31 (`docker-content-digest` индекса
  # мультиарх-образа: linux/amd64, linux/arm64, linux/386), повторяется:
  #   curl -H "Authorization: Bearer <token>" \
  #        -H "Accept: application/vnd.oci.image.index.v1+json" \
  #        -sSI https://registry-1.docker.io/v2/axllent/mailpit/manifests/v1.31.0
  image:
    repository: axllent/mailpit
    tag: v1.31.0
    digest: "sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24"
    pullPolicy: IfNotPresent
  # Секрет внутреннего удостоверяющего: `tls.crt`/`tls.key` предъявляет
  # приёмник, `ca.crt` того же секрета служит ЯКОРЕМ отправителю (Р5).
  tlsSecretName: kacho-mailpit-tls
  smtpPort: 1025
  httpPort: 8025
  # Потолок хранимых писем: хранилище приёмника — в памяти, поэтому предел
  # держит его аппетит ограниченным сверху ЧИСЛОМ, а не сроком жизни стенда.
  maxMessages: 500
  # ─── АППЕТИТ НАЗВАН ЗАМЕРОМ, А НЕ ДОГАДКОЙ (MAIL-45) ────────────────────
  #
  # Единица та же, что у остальной раскладки этого стенда, и она не выбрана —
  # она измерена: 30m/64Mi — наименьшая величина, которую стенд УЖЕ применяет к
  # малой службе на Go (её запрашивают восемь модулей консоли). Приёмник ровно
  # такой же формы: один процесс на Go, хранилище в памяти, поверхность —
  # слушатель SMTP и HTTP-чтение.
  #
  # Что именно пришлось измерить и почему знаменатель назван: раскладка обязана
  # оставить САМЫЙ ТЯЖЁЛЫЙ шард сквозных проб ниже allocatable раннера (4000m),
  # а доля от полного стенда на этот вопрос не отвечает вовсе. Замер на дереве
  # 2026-08-31 (`helm template` цепочки dev-prod, единица счёта — workload с его
  # `resources.requests`, шарды с выключенными чужими компонентами):
  #
  #     полный стенд          35 workload   3000m
  #     шард vpc              17 workload   1460m
  #     шард iam (тяжелейший) 23 workload   2360m   ← знаменатель запаса
  #     шард nlb              21 workload   2110m
  #     шард compute-storage  21 workload   2010m
  #     шард edge             18 workload   1410m
  #     раннер (allocatable)                4000m
  #     запас до предела                    1640m
  #
  # Приёмник добавляет 30m ⇒ тяжелейший шард 2390m, запас 1610m. Числа
  # приёмки ID-MAIL-1 (§1.11а: 29 workload, 2980m, шард 2630m) сняты
  # 2026-08-05 и с тех пор ДВИНУЛИСЬ — здесь стоит перемер, а не цитата.
  #
  # Предел выше запроса вчетверо намеренно: приёмник простаивает и оживает
  # рывком на доставке, а вытеснять его в этот момент значит терять письмо,
  # которого ждёт проба.
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 120m
      memory: 192Mi

# cert-manager (jetstack) sub-chart — controller + CRDs + webhook. Installed only
# when mtls.enabled (Chart.yaml condition). Deploys into the umbrella release
# namespace; its --cluster-resource-namespace defaults to that namespace, so the
# CA-root secret + per-service leaf secrets are co-located with the workloads.
cert-manager:
  enabled: false            # base OFF; values.dev.yaml turns it on (Chart.yaml condition)
  crds:
    enabled: true
    keep: true

# ─── Глобальные labels + image registry/tag ────────────────────────────────
global:
  labels: {}
  kacho:
    domain: ""                             # umbrella-level kacho.domain overrides
    region: ""
    cluster: ""
    # ─── докерная полоса выдачи: ЕДИНСТВЕННОЕ объявление имени службы реестра ──
    #
    # У полосы ДВЕ стороны. Реестр называет это имя докер-клиенту в вызове на
    # аутентификацию (`KACHO_REGISTRY_SERVICE_AUD` → `service=` в
    # WWW-Authenticate); клиент возвращает его в `?service=`; iam чеканит
    # удостоверение адресату, которого объявил сам
    # (`api-server.registry-token.service`). Стороны обязаны СОВПАДАТЬ, иначе
    # вход докера отвергается.
    #
    # ЗАЧЕМ ОДНО ОБЪЯВЛЕНИЕ, А НЕ ДВА СВЕДЁННЫХ УМОЛЧАНИЯ. Имя — тенант-фейсинг
    # DNS реестра, оно законно СВОЁ у каждого кластера, поэтому «сделать
    # умолчания равными» не решает ничего: первый же профиль, сменивший имя у
    # себя, разводит стороны снова. Пока iam адресата не сверял, расхождение
    # было НЕВИДИМО — клиент echo-ит услышанное от реестра, реестр это и ждёт,
    # подписант чеканил что просят, — и совпадения не выбирал никто. Со сверкой
    # то же расхождение означает отказ во входе на КАЖДОМ запросе арендатора.
    #
    # Живёт в `global`, потому что читается из ДВУХ контекстов сабчартов
    # (`registry` и `kaname`), а общим для них является только `.Values.global`
    # — тот же довод, что у формирующих значений службы личности ниже.
    #
    # Объявить вторую сторону ОТДЕЛЬНО по-прежнему можно (одиночная установка
    # любого из двух чартов), но объявить её ИНАЧЕ — нельзя: рендер отказывает и
    # называет обе величины. Держат это
    # services/registry/deploy/lane_service_aud_test.go и
    # deploy/helm/umbrella/iam_lane_service_aud_test.go, а значения профилей —
    # deploy/registry_token_lane_sides_agree_test.go.
    #
    # Величина здесь — та, что действовала умолчанием чарта реестра: посадка ни
    # одного профиля не меняется.
    registry:
      serviceAud: "registry.in-cloud.io"
    # ─── административный переход: ЕДИНСТВЕННОЕ объявление формирующих значений ─
    #
    # Живёт в `global`, потому что читается из ДВУХ контекстов: шаблонами умбреллы
    # (объект настроек соседа, его Service) и строкой `hydra.deployment.extraContainers`,
    # которую разворачивает `tpl` уже в контексте САБЧАРТА провайдера — там
    # `.Values.mtls` не существует, а `.Values.global` одинаков в обоих.
    #
    # ЗАЧЕМ ОДНО ОБЪЯВЛЕНИЕ. Эти числа обязаны совпадать попарно (порт соседа — в
    # поде, в его конфигурации, в пробах и в Service; апстрим соседа — с листенером
    # провайдера). Прежде каждое было отдельным литералом в двух профилях, и смена
    # одного НЕ ПЕРЕКАТЫВАЛА ПОД: настройки приезжают томом, читаются один раз при
    # старте, поэтому дерево и работающая система разошлись бы молча — до следующего
    # несвязанного рестарта, который уносит конечные точки обоих сервисов.
    # Совпадение сверяет deploy/tests/helm/admin-hop-pod-shape-test.sh.
    #
    # Включение самого перехода — по-прежнему `mtls.hydraAdminTls.enabled`: здесь
    # только ЧИСЛА, а не переключатель.
    # ─── служба личности: ЕДИНСТВЕННОЕ объявление формирующих значений ─────────
    #
    # Живёт в `global` по той же причине, что и блок ниже: читается из ДВУХ
    # контекстов. Из нашего подчарта — когда рендерится карта настроек; из
    # подчарта провайдера — когда в шаблон пода кладётся ОТПЕЧАТОК её
    # содержимого (`kratos.deployment.extraEnv`). Общими для обоих контекстов
    # являются только `.Values.global` и `.Release`.
    #
    # ЗАЧЕМ ОТПЕЧАТОК. Настройки приезжают томом и читаются процессом один раз —
    # на старте. Правка карты не меняет шаблон пода, под не перекатывается, и
    # процесс живёт со старым содержимым, пока его не перезапустит что-нибудь
    # постороннее. Ручка провайдера, проходящая через шаблонизацию, ровно одна —
    # `extraEnv`; в аннотации sha256 вычислить не из чего.
    #
    # Содержимое собирается из этих значений ОДНИМ объявлением —
    # charts/kaname/templates/_kratos-identity.tpl. Второго текста нет
    # намеренно: разойдясь, карта и отпечаток дали бы ЛОЖНУЮ привязку — та,
    # что не перекатывает под именно тогда, когда содержимое изменилось.
    identity:
      # Корневой домен платформы. Отсюда собираются адреса службы личности и
      # `rp.id` ключей доступа, поэтому пустым он быть не может — рендер
      # отказывает и называет ручку.
      domain: api.kacho.cloud
      appSubdomain: app
      kratosSubdomain: kratos
      # ─── браузерные адреса: ПУСТО ⇒ вывести из `domain` ──────────────────
      # Та же идиома, что у `hooks.host`/`hooks.port`. Объявлены затем, чтобы
      # посадка, где консоль стоит не на `https://<app>.<domain>`, была
      # ВЫРАЗИМА: стенд разработки раздаёт её по `http://console.kacho.local:28080`
      # (kind отображает 80 → 28080, слушателя на 443 нет), а потоки — в корне.
      appBaseURL: ""
      kratosPublicBaseURL: ""
      # ─── префикс путей потоков: ПУСТО, то есть КОРЕНЬ ───────────────────
      # Пустая строка здесь — не «ручка не настроена», а РЕШЕНИЕ, и принято оно
      # замером на стенде (#1048), а не вкусом. Раздача консоли обслуживает
      # потоки в КОРНЕ — `^/(login|registration|…)(/|$)` в
      # ui-future/deploy/templates/configmap-nginx.yaml — и проксирует их службе
      # Ory. Путь с лишним сегментом в эту регулярку не попадает и уезжает в
      # SPA-заглушку `location /`, которая отвечает `200` с оболочкой консоли:
      # отказ выглядит УСПЕХОМ. Ни `404`, ни записи в журнале — только «вход не
      # открывается», и искать причину неоткуда.
      #
      # Почему корень, а не `/auth`. Прежде здесь стояло `/auth`, и ни один
      # профиль этого не переопределял, кроме стенда разработки. Боевой не
      # переопределяет и сейчас — значит величина, стоящая ЗДЕСЬ, и есть
      # величина боя. Возвращать `/auth` можно только вместе с полосой в
      # раздаче: два места об одном предмете, и их согласие держит
      # deploy/identity_flow_path_is_served_test.go, а не внимание.
      flowPathPrefix: ""
      # Домен cookie сессии и `rp.id` ключей доступа. Пусто ⇒ `domain`.
      # Cookie с чужим доменом браузер отвергает целиком, поэтому величина
      # обязана быть родительской для хоста консоли.
      cookieDomain: ""
      webauthnRpId: ""
      # ─── ПОСАДКА БЕЗ ДОМЕННОГО ИМЕНИ ────────────────────────────────────
      # `true` объявляет ФАКТ о посадке: у её внешнего origin доменного имени
      # НЕТ — браузер приходит на голый IP-литерал (так стоит консоль на
      # управляемом кластере a8f60d: ни имени, ни TLS снаружи).
      #
      # Следствий два, и оба ВЫНУЖДЕНЫ стандартами, а не выбраны:
      #   · печенье сессии становится host-only — ключ `domain` не печатается
      #     вовсе (RFC 6265 §5.1.3: domain-match с IP-литералом ложен всегда,
      #     значит ЛЮБОЕ значение заставляет браузер отбросить печенье целиком,
      #     и вход не состоится молча);
      #   · ключи доступа выключаются — RP ID по WebAuthn L3 §5.1.3 обязан быть
      #     валидным доменным именем, у IP-литерала его нет by construction.
      #
      # Отдельная ручка, а не «пусто ⇒ не печатать»: пустое у `cookieDomain`
      # уже занято смыслом «не объявлено ⇒ вывести из `domain`», на нём стоит
      # боевой профиль. Второй смысл у пустого снял бы `domain` печенья в бою.
      # Одна ручка на два следствия: факт о посадке ОДИН, а две ручки о нём
      # разошлись бы молча.
      #
      # Объявив `true`, профиль ОБЯЗАН очистить `cookieDomain`/`webauthnRpId`,
      # если их объявил слой под ним, — иначе рендер отказывает и называет обе
      # величины. Молча выбросить принятое нельзя.
      domainless: false
      hooks:
        # Транспорт обратных вызовов — решение ПРОФИЛЯ, не константа шаблона.
        # Боевой профиль объявляет `https`; пустое значение роняет рендер.
        scheme: http
        # Пусто ⇒ `kaname-internal.<namespace>.svc`.
        host: ""
        # Пусто ⇒ 9092 (порт слушателя хуков на внутреннем Service).
        port: ""
      # ─── ПОЧТОВАЯ ПОЛОСА: УМОЛЧАНИЯ НЕТ, И ЭТО РЕШЕНИЕ (Р3 приёмки ID-MAIL-1) ──
      #
      # Здесь стояло `smtp://mailhog.kacho.svc:1025/?disable_starttls=true`, и в
      # одной строке было ДВА ложных утверждения о дереве:
      #
      #   · узел `mailhog` не поднимал НИ ОДИН манифест поставки — ни умбрелла,
      #     ни подчарт, ни рецепт стенда. Профиль, ничего о почте не сказавший,
      #     молча получал координату несуществующего узла и стартовал: письма
      #     уходили в никуда, и сигнала не было ни одного;
      #   · `disable_starttls=true` объявлял полосу НЕЗАШИФРОВАННОЙ. Под ban #16
      #     («production-mode ВЕЗДЕ, включая стенд») это не дев-удобство, а
      #     посадка, которой на поднятом стенде существовать не должно.
      #
      # Пусто ⇒ отказ, а не «разумное значение»: величина, которую построение
      # подставляет молча, предметом стража быть не может — он зелен при любом
      # входе, потому что незаданной величина не бывает. Отказ производят ДВА
      # места, у каждого свой предмет (Р4а):
      #
      #   · templates/identity-mail-lane-guard.yaml — при РЕНДЕРЕ, по
      #     объявлениям профиля: половина пары, снятое шифрование, вырожденное
      #     значение, неподставленная ссылка;
      #   · шаг подстановки `kacho.identity.configRenderInitContainer` — при
      #     СТАРТЕ пода, по величине, ДОЕХАВШЕЙ до процесса. Он единственный
      #     видит то, что приезжает слоем учётных данных вне git, и роняет ОБА
      #     рабочих объекта личности, включая почтовый.
      #
      # Кто эти величины задаёт: стенд — `values.dev.yaml` (там же поднимается
      # приёмник, блок `mailpit`); боевая площадка — слой учётных данных,
      # перечень разрешённых координат которого назван в cutover-fe3455.sh.
      smtp:
        connectionURI: ""
        fromAddress: ""
        fromName: ""
        # ─── УДОСТОВЕРЕНИЕ ПРИЕЗЖАЕТ ИЗ СЕКРЕТА (решение Р6) ────────────────
        #
        # Здесь объявляется ИСТОЧНИК удостоверения — имя секрета и ключ в нём, —
        # а НЕ сама величина. Причина названа прямо: адрес узла уезжает в карту
        # настроек, то есть в объект, который читается шире секрета и попадает в
        # рендер чарта. Пароль, записанный внутрь адреса, оказался бы там же.
        #
        # ЧТО ПИШЕТ ПРОФИЛЬ. Адрес несёт ИМЯ пользователя и НЕ несёт пароля:
        #     connectionURI: "smtp://noreply%40kacho.cloud@relay.example:587/"
        #     credentialSecret: { name: kacho-identity-smtp, key: password }
        # Ссылку на величину в адрес вставляет ШАБЛОН, а не профиль: имя
        # переменной принадлежит нам, и профиль, выписавший его руками, разошёлся
        # бы с шаблоном молча. Подставляет её шаг `identity-config-render` до
        # старта процесса — тем же приёмом, каким уже подставляется учётная
        # величина обратных вызовов; второго механизма не заводится.
        #
        # ПАРА, И ПОЛОВИНА ЕЁ ХУЖЕ ОТСУТСТВИЯ ОБЕИХ. Узел, требующий
        # удостоверения (адрес несёт имя пользователя), без объявленного
        # источника — и зеркально, источник без имени пользователя в адресе —
        # отвергаются стражем рендера: половина выглядит настроенной.
        #
        # Умолчания нет намеренно (Р3): величина, которую построение подставляет
        # молча, предметом стража быть не может.
        credentialSecret:
          name: ""
          key: ""
    hydraAdminTls:
      # Порт СОСЕДА внутри пода. Инверсия с портом провайдера обязательна — см.
      # `providerListenerPort` ниже.
      terminatorPort: 4445
      # Порт административного листенера ПРОВАЙДЕРА (он слушает только петлю).
      # Значение обязано совпадать с `hydra.hydra.config.serve.admin.port` профиля:
      # эта ручка чарта провайдера через шаблонизацию не проходит, поэтому свести
      # их одним объявлением нельзя, и совпадение проверяет гейт формы пода.
      providerListenerPort: 4455
      # Бюджет запроса принадлежит владельцу запроса: не короче самого длинного
      # per-call дедлайна потребителя.
      upstreamTimeout: "30s"
      image: nginxinc/nginx-unprivileged:1.31-alpine
      # Окно между сигналом остановки и уходом процесса — чтобы снятие конечных
      # точек успело распространиться.
      preStopSeconds: 5
  # Container image registry + tag. Образы kacho-* публикуются в DockerHub под
  # namespace = DOCKERHUB_USERNAME; тег = `<branch>-<sha8>` или semver. Per-service
  # `image:` ниже выписаны явно и должны совпадать с `<imageRegistry>/<svc>:<imageTag>`.
  # dev-стенд (kind) переопределяет на локально-загруженные `:dev` образы (values.dev.yaml).
  imageRegistry: docker.io/prorobotech       # override: --set global.imageRegistry=docker.io/<user>
  imageTag: latest                           # override: --set global.imageTag=<branch>-<sha8>

# ─── Per-service image references (DockerHub) ──────────────────────────────
# Packaged sub-charts (vpc/compute/ui/api-gateway) принимают плоскую строку
# `image:` + `imagePullPolicy:`. dev-стенд переопределяет на local `:dev` образы.
#
# ЗАПИСИ О ВЫВОДЕ ЗДЕСЬ НЕТ, И ЭТО НЕ УПУЩЕНИЕ. Умолчания чарта не описывают ни
# один стенд: каждый профиль дерева переопределяет их целиком, и ни одна из
# четырёх ссылок ниже не разрешается в коммит этого дерева — это теги прежних
# полирепозиториев. Ещё две (`main-latest`) коммита не называют вовсе: это
# заглушки, и заглушка не станет выводимой сама.
#
# Записать сюда «порождено-от» значило бы объявить вывод из коммита, которого
# нет, — то есть завести ровно ту ложь, против которой запись и придумана.
# Исход принадлежит оператору: либо умолчания перепиниваются на коммит этого
# дерева одним заходом, либо снимаются в пользу `global.imageTag`. До тех пор
# каждая ссылка обязана называть себя невыводимой — иначе она неотличима от
# выведенной. Держит это deploy/managed_cluster_profile_test.go.
# без-вывода: kacho-vpc kacho-compute kacho-api-gateway kaname — коммит прежнего полирепозитория, в этом дереве не разрешается
# без-вывода: kacho-geo kacho-storage — тег-заглушка `main-latest`, коммита не называет; настоящий тег приходит профилем
vpc:
  image: docker.io/prorobotech/kacho-vpc:main-3b48f99b
  imagePullPolicy: IfNotPresent

compute:
  image: docker.io/prorobotech/kacho-compute:main-1ecb2817
  imagePullPolicy: IfNotPresent

# kacho-geo — vendored sub-chart (Geography Region/Zone leaf-service). Image tag
# is a PLACEHOLDER: the kacho-geo image is not yet pushed to the registry (epic
# kacho-geo). `main-latest` is a values-overridable placeholder; the real
# docker.io/prorobotech/kacho-geo:main-<sha> tag + pull secret are provisioned at
# deploy time (per-profile override + per-cluster overlay). Full sub-chart
# defaults live in charts/kacho-geo/values.yaml; this block overrides image only.
kacho-geo:
  image: docker.io/prorobotech/kacho-geo:main-latest
  imagePullPolicy: IfNotPresent

api-gateway:
  image: docker.io/prorobotech/kacho-api-gateway:main-fa9a8422
  imagePullPolicy: IfNotPresent
  # INFRA sec-hardening r3 — the sub-chart's own ingress backends the plaintext
  # `cmux` port, which is the CLUSTER-INTERNAL (unmarked) listener and therefore
  # serves Internal* REST to any external caller. Disable it and let the umbrella
  # render the public ingress (templates/api-gateway-ingress.yaml) pointing at the
  # EXTERNAL-marked `tls` listener so listenerorigin.ExternalListener tags the edge
  # and the REST dispatcher 404s Internal* paths. See docs/architecture/known-divergences.md.
  ingress:
    enabled: false

# INFRA sec-hardening r3 — umbrella-owned public ingress for api-gateway. Replaces
# the sub-chart ingress (disabled above). Routes the external edge through the
# api-gateway pod's EXTERNAL-marked TLS listener (Service port `tls`, GRPCS) so
# Internal* REST is never served on the public endpoint. host / tls.secretName /
# proxyReadTimeout are inherited from the api-gateway sub-chart values.
apiGatewayIngress:
  enabled: true

# Federated ui-future console (aliased `uif` sub-chart). Default OFF — a bare
# `helm upgrade` must NOT deploy it (the condition path must exist or helm treats
# an absent value as enabled). Per-cluster overlays that run the federated console
# set `uif.enabled: true` and reproduce the host/remote images below.
uif:
  enabled: false

# ─── Ory Hydra sub-chart — базовые значения умбреллы ───────────────────────
hydra:
  # РЕКОНСАЙЛЕР КЛИЕНТОВ ПРОВАЙДЕРА СНЯТ — У НЕГО НЕТ ПРЕДМЕТА.
  #
  # Умолчание чарта-зависимости — `true`, и ни один профиль его не переопределял,
  # поэтому нагрузка разворачивалась ВЕЗДЕ. Померено по дереву и по кластеру:
  # ресурсов того типа, который он реконсайлит (`OAuth2Client`), НЕТ НИ ОДНОГО —
  # ни в дереве, ни в живом кластере. То есть он ничего не делал.
  #
  # При этом он — потребитель административного API, невидимый переписи по
  # объявлениям (его адрес приходит умолчанием зависимости), и у него НЕТ НИ ОДНОЙ
  # ПРОБЫ. При смене адреса он не покраснел бы, а тихо перестал разрешать имя, и
  # заметить это было бы нечем.
  #
  # Возврат — вместе с первым ресурсом его типа, и тогда же: адрес объявить
  # значением, внести в реестр потребителей, снабдить пробой.
  maester:
    enabled: false

# ─── Ory Kratos self-service UI sub-chart ──────────────────────────────────
# Disabled in base; values.dev.yaml enables it. Service name `kratos-selfservice-ui`
# must stay stable (kacho-ui nginx proxies to it by name).
kratos-selfservice-ui:
  kratosSelfServiceUI:
    enabled: false

# ─── kacho-nlb — disabled in base values ───────────────────────────────────
# Both the kacho-nlb sub-chart and its backing Postgres are condition-gated.
# Base keeps them OFF so existing clusters don't implicitly start a new
# Deployment + StatefulSet on the next `helm upgrade`. dev overlay flips both true.
kacho-nlb:
  enabled: false
pg-nlb:
  enabled: false
  # Carries kacho_nlb.fga_register_outbox. See "Statistics freshness for the
  # databases that carry an outbox queue" at the bottom of this file.
  primary:
    extendedConfiguration: |
      autovacuum_naptime = 5s

# ─── kacho-storage — disabled in base values ───────────────────────────────
# Storage control-plane (Volume/VolumeAttachment/Snapshot/DiskType) + its backing
# Postgres are condition-gated. Base keeps them OFF so an existing cluster does not
# implicitly start a new Deployment + StatefulSet on the next `helm upgrade`; the
# fe3455-prod overlay flips both true. Image is a placeholder overridden per env.
storage:
  enabled: false
  image:
    repository: docker.io/prorobotech/kacho-storage
    tag: main-latest
pg-storage:
  enabled: false
  # Carries kacho_storage.fga_register_outbox. See "Statistics freshness for the
  # databases that carry an outbox queue" at the bottom of this file.
  primary:
    extendedConfiguration: |
      autovacuum_naptime = 5s

# ─── security.txt (RFC 9116) — served at /.well-known/security.txt via api-gateway
# ingress; runtime-configurable per cluster.
security:
  txt:
    enabled: true
  # Primary security contact — REQUIRED override per environment.
  contactEmail: security@kacho.cloud
  altContacts:
    - "https://kacho.cloud/security/disclosure"
  pgpKeyUrl: "https://kacho.cloud/.well-known/pgp-key.txt"
  acknowledgmentsUrl: "https://kacho.cloud/security/acknowledgments"
  policyUrl: "https://kacho.cloud/security/disclosure"
  hiringUrl: "https://kacho.cloud/careers"
  alternateCanonical:
    - "https://kacho.cloud/.well-known/security.txt"

# ─── Statistics freshness for the databases that carry an outbox queue ──────
#
# WHAT THIS IS THE REMAINING HALF OF.
#
# An outbox WITH DELIVERY is drained by a claim that filters on `sent_at IS NULL`,
# and the planner's row estimate for that predicate comes from
# the last ANALYZE.
#
# NOT EVERY TABLE BELOW IS ONE. Two of iam's are journals, not queues:
# `kaname.fga_outbox` is read by a trigger that folds the direct fact inside the
# SAME transaction as the insert, and `kaname.subject_change_outbox` is read by
# the edge with a cursor. Their delivery columns were dropped with the drainer
# (kacho#917, #1396), so no claim predicate applies to them at all. The line still
# stands for pg-iam, on the other half of the argument below: both are append-mostly,
# and frozen statistics on an append-mostly table stay frozen. See kacho#1049. A queue is empty almost all of the time, so the last ANALYZE
# almost always ran against an empty backlog, and the estimate carried into a
# burst is `rows=1`. On a one-row estimate the partial claim indexes are not worth
# taking, and the claim degrades from ~0.2 ms to ~125 ms — measured on a live
# stand, Postgres 16, 32 000 pending rows. At 16 rows per claim batch that is
# ~128 rows/s against a producer measured at ~150-185 rows/s, so the backlog grows
# for as long as the statistics stay stale.
#
# The per-table half of the treatment already landed, as migrations: analyze and
# vacuum every 1000 modifications with scale_factor 0 (iam 0064, vpc 0021,
# compute 0020, nlb 0027, storage 0010, registry 0010). That bounds ELIGIBILITY —
# at the measured peak a table becomes analyze-eligible ~5.4 s into a burst. It
# does not bound DETECTION: the autovacuum launcher revisits a database only once
# per `autovacuum_naptime`, which defaults to 60 s. So a burst arriving after a
# lull waits on the LAUNCHER, not on the threshold — 60 s against 5.4 s. That is
# the one-minute onset spike still visible in the after-measurements of the
# claim-throughput fix, and this section is what removes it.
#
# WHY IT IS HERE AND NOT IN A MIGRATION. `autovacuum_naptime` cannot be narrowed
# to the queue tables. It is not a per-table storage parameter and it is not
# settable per database — verified on Postgres 16:
#
#   ALTER TABLE q SET (autovacuum_analyze_threshold = 1000);  ->  ALTER TABLE
#   ALTER TABLE q SET (autovacuum_naptime = '5s');            ->  ERROR: unrecognized parameter
#   ALTER DATABASE d SET autovacuum_naptime = '5s';           ->  ERROR: cannot be changed now
#   SELECT context FROM pg_settings WHERE name='autovacuum_naptime';  ->  sighup
#
# It is a postmaster knob, so postgresql.conf is the only place it can live, and
# `primary.extendedConfiguration` is how this chart reaches postgresql.conf
# (rendered into conf.d/override.conf; the sub-chart already hashes that ConfigMap
# into the pod template as `checksum/extended-configuration`, so changing it does
# roll the StatefulSet rather than leaving a live process on its boot-time value).
#
# The blast radius is narrowed by WHICH INSTANCES carry the line, not by scoping
# inside one: these are database-per-service instances, so the line on pg-iam
# reaches iam's tables and nothing else. Deliberately NOT listed: pg-geo (its
# geo_outbox is a sequence-cursor audit feed with no `sent_at` claim and no
# drainer), pg-kratos, pg-hydra (third-party stores, no Kacho queue).
#
# WHY 5s. The launcher has to stop being the binding term: 5 s sits below the
# ~5.4 s it takes to accumulate the per-table threshold of 1000 modifications at
# the measured peak producer rate, so staleness is once again governed by the
# per-table setting — which lives in a migration, beside the queue it describes,
# and can be tuned per queue. Going lower buys nothing (the threshold dominates
# below ~5 s) while forking an autovacuum worker more often than the check is
# worth; going to 10-15 s puts the launcher back in front of the threshold, which
# is exactly the property being removed. The cost of the shorter nap is a CHECK,
# not work: the worker reads per-table modification counters (shared memory since
# PG 15) and still acts only on tables over their OWN threshold, which is
# unchanged for every non-queue table in these databases.
#
# A LATER `-f` REPLACES THIS WHOLE STRING. `extendedConfiguration` is a scalar, so
# any profile that declares its own (values.dev.yaml does, for four of these) must
# repeat the line. Two gates keep that honest:
#   * tests/helm/outbox-autovacuum-naptime-test.sh — renders every deployed values
#     combination and asserts the surviving ConfigMap still carries it (offline);
#   * scripts/assert-outbox-autovacuum.sh — asks the RUNNING postmaster what it
#     actually uses, because a ConfigMap that never reached a process is not a
#     setting.
pg-vpc:
  # Carries kacho_vpc.fga_register_outbox.
  primary:
    extendedConfiguration: |
      autovacuum_naptime = 5s
pg-compute:
  # Carries public.compute_fga_register_outbox.
  primary:
    extendedConfiguration: |
      autovacuum_naptime = 5s
pg-iam:
  # Carries kaname.fga_outbox, .subject_change_outbox, .resource_reconcile_outbox.
  primary:
    extendedConfiguration: |
      autovacuum_naptime = 5s
pg-registry:
  # Carries kacho_registry.registry_outbox.
  primary:
    extendedConfiguration: |
      autovacuum_naptime = 5s