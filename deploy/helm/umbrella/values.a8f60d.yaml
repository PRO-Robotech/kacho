# ═══════════════════════════════════════════════════════════════════════════
# values.a8f60d.yaml — посадка на управляемый кластер a8f60d (Beget).
# ═══════════════════════════════════════════════════════════════════════════
#
# Накладывается ТРЕТЬИМ, поверх values.dev.yaml + values.dev-prod.yaml:
#
#   helm upgrade --install kacho-umbrella ./helm/umbrella -n kacho \
#     -f helm/umbrella/values.dev.yaml \
#     -f helm/umbrella/values.dev-prod.yaml \
#     -f helm/umbrella/values.a8f60d.yaml
#
# Средний слой НЕ опционален: он и есть production-посадка. Этот файл объявляет
# только то, чем ЭТОТ кластер отличается, и ничего о безопасности.
#
# ── Чем отличается кластер (померено, а не предположено) ────────────────────
#
#  1. cert-manager УЖЕ установлен оператором (ns beget-cert-manager) — свой не
#     ставим. Корневой сертификат при этом рождается в пространстве ресурсов
#     cert-manager, а поды монтируют его из СВОЕГО: секрет kacho-internal-ca-root
#     копируется в ns kacho отдельным шагом.
#  2. IngressClass в кластере НЕТ ни одного (есть GatewayClass envoy-gateway) —
#     контроллер ingress-nginx поднимать бессмысленно, объекты Ingress инертны.
#     Внешний доступ — Service типа LoadBalancer с аннотациями lb.beget.com/*.
#  3. StorageClass НЕТ ни одного и CSI-драйвера хранения нет — постоянные тома
#     невозможны by construction, все базы эфемерны. Отсюда же требование к
#     первичной настройке Postgres: каждый запуск здесь ПЕРВИЧНЫЙ, и профиль,
#     работавший на стенде с постоянным томом, тут ломается (см. values.dev-prod
#     §«Почему на сокете и петле trust»).
#  4. Узлов 4 по 1500m/3Gi, и 84%% процессора уже заняты компонентами самого
#     кластера — потолки здесь ниже, чем на стенде разработчика. Это решение о
#     РАЗМЕРЕ, а не о посадке: посадка остаётся production.
#
# ── ОБРАЗЫ ПРОДУКТА: ПИНЫ ПОРОЖДАЮТСЯ, ПРАВИТСЯ ПОРОЖДАЮЩИЙ ────────────────
#
#   deploy/scripts/gen-managed-image-pins.sh --ref <коммит main>
#
# Прежде здесь стояло «файл порождается; правится порождающий скрипт, а не он» —
# при том, что порождающего в дереве не было ни одного. Указание без координаты
# правку не переадресует, а отменяет: следующий читатель не станет править файл
# и не найдёт, что править вместо. Теперь порождающий существует, и порождает он
# ровно пины — остальное в этом файле написано рукой и правится рукой.
#
# Тег выводится из ОДНОЙ записи ниже. Форм у тега две, потому что образы
# публикуют две сборки одного дерева: сборка сервисов режет коммит до восьми
# знаков, сборка консоли не режет. Обе срабатывают на пуш в main без фильтра по
# путям, поэтому у любого коммита main есть образы обеих семей — и одной записи
# на профиль достаточно. Расхождение пина с записью роняет
# TestProductImagePinsAreDerivedFromTheRecordedCommit и `--check` порождающего.
#
# Какой коммит здесь стоит — решение оператора о том, что развёрнуто на стенде,
# а не свойство дерева. Проверка утверждает не свежесть, а невозможность
# разойтись: пин, собранный рукой мимо записи, был неотличим от выведенного.
# порождено-от: main d00616453addb3264a6d1bce7e422cc7788cb031
cert-manager:
  enabled: false
mtls:
  enabled: true
  internalCA:
    caNamespace: beget-cert-manager
ingress-nginx:
  enabled: false
# ─── БЮДЖЕТ ПАМЯТИ БАЗ НА ЭТОМ КЛАСТЕРЕ (#808) ───────────────────────────────
#
# Потолок здесь 640Mi — вчетверо-вшестеро ниже, чем на стенде разработчика (см.
# п.4 шапки: узлов 4 по 1500m/3Gi). Трата при этом приезжала из values.dev.yaml
# и values.dev-prod.yaml, где потолки другие, поэтому у четырёх баз объявленная
# трата не помещалась в объявленный потолок — у pg-vpc в восемь раз (5312MiB
# против 640Mi). Такое объявление не «оптимистично», оно НЕИСПОЛНИМО:
# shared_buffers выделяется при старте, и 512MB общей памяти в контейнере на
# 640Mi не помещаются вместе с самим сервером.
#
# Поэтому здесь опущены shared_buffers и work_mem — на этом кластере иначе
# нельзя. Это отличается от слоя dev-prod, где менялся ТОЛЬКО потолок числа
# соединений: там правка ничего не могла замедлить, здесь она приводит
# объявление в область возможного. a8f60d — отдельный кластер, не тот стенд, на
# котором гоняется сквозной набор.
#
# Арифметика — deploy/db_footprint_declaration_test.go:
#     shared_buffers + max_connections × work_mem  ≤  limits.memory
#
# autovacuum_naptime повторён в каждом блоке (скаляр замещается целиком);
# у pg-geo его нет и не должно быть — geo_outbox курсорный, без дренажа
# (deploy/tests/helm/outbox-autovacuum-naptime-test.sh, NON_QUEUE_INSTANCES).
pg-vpc:
  primary:
    persistence:
      enabled: false
    resources: &id001
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 640Mi
    # 128MB + 210 × 2MB = 548MiB ≤ 640Mi. Соединения остаются 210: пул службы
    # vpc — 200 на реплику плюс 3 суперпользователю, ниже 203 нельзя
    # (deploy/pool_fits_database_test.go). Значит вместить пришлось за счёт
    # work_mem, и это осознанный размен: сортировка сверх 2MB уйдёт во временный
    # файл вместо отказа по памяти всего процесса.
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 210
      shared_buffers = 128MB
      work_mem = 2MB
      effective_cache_size = 2GB
      checkpoint_timeout = 15min
      max_wal_size = 2GB
      autovacuum_naptime = 5s
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
pg-compute:
  primary:
    persistence:
      enabled: false
    resources: *id001
    # 128MB + 100 × 4MB = 528MiB ≤ 640Mi.
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 100
      shared_buffers = 128MB
      work_mem = 4MB
      effective_cache_size = 1GB
      autovacuum_naptime = 5s
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
pg-iam:
  primary:
    persistence:
      enabled: false
    # База iam ВЫВЕДЕНА из общего якоря *id001 намеренно: она единственная на
    # этом стенде принимает проверку доступа на каждый запрос каждого сервиса,
    # и замер пропускной способности показал, что упирается именно она.
    #
    # Память поднята 640Mi → 2Gi ВМЕСТЕ с ядрами, а не вместо них. Причина
    # арифметическая, не вкусовая: тут же объявлено `max_connections = 200`
    # при `work_mem = 8MB`, то есть наполненный пул просит до 1.6Gi только на
    # сортировки — больше прежнего предела. Подняв ядра втрое и оставив 640Mi,
    # мы получили бы отказ по памяти и ложный вывод «ядра не помогли».
    #
    # Предел процессора здесь НЕ объявлен намеренно: он приходит из
    # values.dev.yaml (3000m), и второе объявление того же предмета разошлось
    # бы с первым молча. Профили складываются в порядке -f, дальний выигрывает.
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 2Gi
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
pg-geo:
  primary:
    persistence:
      enabled: false
    resources: *id001
    # 128MB + 100 × 4MB = 528MiB ≤ 640Mi. Строки autovacuum_naptime здесь нет
    # НАМЕРЕННО — см. шапку блока выше.
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 100
      shared_buffers = 128MB
      work_mem = 4MB
      effective_cache_size = 512MB
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
pg-nlb:
  primary:
    persistence:
      enabled: false
    resources: *id001
    # 128MB + 100 × 4MB = 528MiB ≤ 640Mi.
    extendedConfiguration: |
      synchronous_commit = local
      max_connections = 100
      shared_buffers = 128MB
      work_mem = 4MB
      effective_cache_size = 512MB
      autovacuum_naptime = 5s
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
pg-storage:
  primary:
    persistence:
      enabled: false
    resources: *id001
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
pg-registry:
  primary:
    persistence:
      enabled: false
    resources: *id001
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
pg-openfga:
  primary:
    persistence:
      enabled: false
    resources: *id001
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
pg-kratos:
  primary:
    persistence:
      enabled: false
    resources: *id001
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
pg-hydra:
  primary:
    persistence:
      enabled: false
    resources: *id001
  volumePermissions:
    enabled: false
  readReplicas:
    persistence:
      enabled: false
vpc:
  resources: &id002
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 448Mi
  image: docker.io/prorobotech/kacho-vpc:main-d0061645
compute:
  resources: *id002
  image: docker.io/prorobotech/kacho-compute:main-d0061645
storage:
  resources: *id002
  image:
    repository: docker.io/prorobotech/kacho-storage
    tag: main-d0061645
    pullPolicy: IfNotPresent
registry:
  resources: *id002
  image:
    repository: docker.io/prorobotech/kacho-registry
    tag: main-d0061645
    pullPolicy: IfNotPresent
  zot:
    # ⚠ ШАГ ОПЕРАТОРА (до раската): Secret `zot-auth` в ns kacho с ключами
    # username/password/htpasswd (htpasswd — bcrypt-строка `<user>:$2y$…` того же
    # пароля) провизионится ВНЕ git — как в values.prod.yaml. Без него поды zot и
    # registry не поднимутся: чарт отказывается разворачивать хранилище слоёв без
    # учётных данных.
    #
    # Здесь стояло значение. Хранилище слоёв не различает тенантов — его пароль
    # это доступ ко всем слоям стенда мимо авторизации плоскости данных, — а
    # стенд на управляемом кластере живёт долго и доступен не только автору.
    # Держит форму TestStandPullingFromARegistryTakesLayerStoreCredentialByReference:
    # стенд, тянущий образы продукта из реестра, берёт эти данные ссылкой.
    #
    # Секрет заводится с НОВЫМ паролем: то, что стояло здесь значением, лежит в
    # истории публичного репозитория и остаётся там после этой правки — снятие
    # значения из файла раскрытое значение не отзывает. Переиспользовать его
    # означало бы починить форму и оставить предмет.
    auth:
      existingSecret: zot-auth
      username: ""
      password: ""
      htpasswd: ""
    storage:
      persistence: false
    resources: *id002
api-gateway:
  resources: *id002
  image: docker.io/prorobotech/kacho-api-gateway:main-d0061645
kacho-iam:
  resources: *id002
  image:
    repository: docker.io/prorobotech/kacho-iam
    tag: main-d0061645
    pullPolicy: IfNotPresent
kacho-geo:
  resources: *id002
  image: docker.io/prorobotech/kacho-geo:main-d0061645
kacho-nlb:
  resources: *id002
  image:
    repository: docker.io/prorobotech/kacho-nlb
    tag: main-d0061645
    pullPolicy: IfNotPresent
openfga:
  resources: *id002
hydra:
