#
# values.own.yaml — НАКЛАДКА ПОСАДКИ `own`: платформа проверяет человека СВОЕЙ
# полосой, а не внешним поставщиком удостоверений (kacho#2716, стадия S2 приёмки
# Ф4д §8).
#
# ── ЧТО ЭТО ЗА СЛОЙ ─────────────────────────────────────────────────────────
#
# Накладка, а не самостоятельный профиль: цепочка стенда — `values.prod.yaml`
# плюс этот файл (объявлена в deploy/stacks.txt, единственной таблице дерева).
# Боевой слой под ней уже несёт ВСЁ, что полоса требует числами:
#
#   ports.loginLane 9100 · mtls.loginLane true · loginLaneClientAuthMode mutual
#   config.authn.login.* (ёмкость 8, резерв 256 МиБ, правило пароля, хешер, …)
#   config.authn.registration.* (3 за 1 ч) · resources.limits.memory 1280Mi
#
# и несёт по решению приёмки Ф3 (Р3, Р11, Ф3-42): дословный перенос величин
# живёт в профиле, где его видит читающий, и перевод стенда на `own` НЕ ЗАВОДИТ
# ПОЛОСУ С НУЛЯ. Поэтому здесь объявляется ровно то, чего на `external` нет и
# быть не может, — сама посадка и то, что читается только под ней.
#
# ── ПОЧЕМУ ОБЕ ПОЛОВИНЫ В ОДНОМ ФАЙЛЕ ───────────────────────────────────────
#
# Посадку читают ДВА процесса: служба доступа и край. Половины разводят по ней
# РАЗНЫЕ требования, и профиль, объявивший посадку одной и забывший второй, даёт
# стенд, у которого половины решают о личности по-разному, — расхождение,
# которого никто не решал. Держит это
# deploy/helm/umbrella/identity_posture_profiles_test.go.

# ── ЧТО ОСТАЛОСЬ В ЭТОМ ФАЙЛЕ И ПОЧЕМУ ЭТО ПУСТО ───────────────────────────
#
# НИЧЕГО, И ЭТО ИСХОД, А НЕ НЕДОДЕЛКА. Накладка несла ровно три объявления:
# посадку службы, посадку края и адрес полосы формы. Все три переехали в КОРНИ
# ЦЕПОЧЕК (`values.dev.yaml` и `values.prod.yaml`, под которым лежит и этот
# стенд), потому что посадку `own` объявляют теперь ВСЕ СЕМЬ стендов таблицы, а
# не один. Копии здесь не оставлено намеренно: два места об одном предмете
# разъехались бы молча, и стенд `own` исполнял бы своё объявление, а шесть
# остальных — чужое.
#
# ПРЕДМЕТ САМОГО СТЕНДА ИСЧЕРПАН ВМЕСТЕ С СОДЕРЖИМЫМ. Стек `own` заводился
# (kacho#2716, стадия S2 приёмки Ф4д §8) ровно затем, чтобы посадку `own` было
# ЧЕМ выразить, когда её не объявлял ни один профиль. Теперь её объявляют все,
# и цепочка `values.prod.yaml,values.own.yaml` совпадает с цепочкой стенда
# `prod` по каждому объявлению.
#
# СНЯТИЕ СТЕНДА ЗДЕСЬ НЕ ДЕЛАЕТСЯ: состав стендов объявляет `deploy/stacks.txt`,
# на имя `own` ссылаются рецепты подъёма и приёмка, и решение об инвентаре —
# не следствие правки посадки. Это находка с предикатом снятия: стек `own`
# убирается из таблицы вместе со снятием этого файла и правкой ссылок на имя,
# и до тех пор файл остаётся пустой накладкой, чьё имя цепочка называет.
