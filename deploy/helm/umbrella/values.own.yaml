#
# values.own.yaml — НАКЛАДКА ПОСАДКИ `own`: платформа проверяет человека СВОЕЙ
# полосой, а не внешним поставщиком удостоверений (kacho#2716, стадия S2 приёмки
# Ф4д §8).
#
# ── ЧТО ЭТО ЗА СЛОЙ ─────────────────────────────────────────────────────────
#
# Накладка, а не самостоятельный профиль: цепочка стенда — `values.prod.yaml`
# плюс этот файл (объявлена в deploy/stacks.txt, единственной таблице дерева).
# Боевой слой под ней уже несёт ВСЁ, что полоса требует числами:
#
#   ports.loginLane 9100 · mtls.loginLane true · loginLaneClientAuthMode mutual
#   config.authn.login.* (ёмкость 8, резерв 256 МиБ, правило пароля, хешер, …)
#   config.authn.registration.* (3 за 1 ч) · resources.limits.memory 1280Mi
#
# и несёт по решению приёмки Ф3 (Р3, Р11, Ф3-42): дословный перенос величин
# живёт в профиле, где его видит читающий, и перевод стенда на `own` НЕ ЗАВОДИТ
# ПОЛОСУ С НУЛЯ. Поэтому здесь объявляется ровно то, чего на `external` нет и
# быть не может, — сама посадка и то, что читается только под ней.
#
# ── ПОЧЕМУ ОБЕ ПОЛОВИНЫ В ОДНОМ ФАЙЛЕ ───────────────────────────────────────
#
# Посадку читают ДВА процесса: служба доступа и край. Половины разводят по ней
# РАЗНЫЕ требования, и профиль, объявивший посадку одной и забывший второй, даёт
# стенд, у которого половины решают о личности по-разному, — расхождение,
# которого никто не решал. Держит это
# deploy/helm/umbrella/identity_posture_profiles_test.go.

kaname:
  config:
    authn:
      # ПОСАДКА ЛИЧНОСТИ. Умолчания нет ни у процесса, ни у чарта: профиль,
      # посадку не объявивший, получает отказ старта с именем поля, а не тихо
      # наследует чужой выбор.
      identityProvider: own

      # ОКНО СВЕЖЕСТИ ПРАВКИ СВОИХ ДАННЫХ (Ф12, kacho#1281;
      # KANAME_AUTHN__SELF_SERVICE_FRESHNESS). Заведение и подтверждение второго
      # фактора требуют предъявления не старше окна, и тем же окном ограничен
      # срок неподтверждённого заведения.
      #
      # Читается ТОЛЬКО под `own`, поэтому стоит здесь, а не в боевом слое: там
      # страж её не судит, и запись пришлось бы объяснять ведомостью. 15 минут —
      # перенос прежней величины, а не новый выбор.
      selfServiceFreshness: 15m

api-gateway:
  # ПУБЛИЧНЫЙ АДРЕС ЧУЖОЙ СЛУЖБЫ ЛИЧНОСТИ — ВЫКЛЮЧЕН НА ЭТОЙ ЦЕПОЧКЕ.
  #
  # Читателя сессии поставщика край заводит по МНОЖЕСТВУ читателей носителя, а
  # не по посадке и не по наличию адреса (gateway/cmd/api-gateway/main.go, ветка
  # `sessionCarriers.ReadsProvider()`). Эта цепочка множества не объявляет
  # (`api-gateway.authn.sessionCarriers` пуст), и край выводит его из посадки:
  # под `own` — только наш носитель (config.ResolvedSessionCarriers). Читатель
  # поставщика здесь поэтому не заводится. Величина при этом оставалась в поде:
  # у процесса умолчание непустое, а шаблон чарта при пустом значении выводит
  # адрес из имени выпуска, — и стенд объявлял адрес чужой службы, которого
  # никто не спрашивает.
  #
  # `disabled` — то самое слово, которым код выключает полосу, а не выдуманный
  # признак. Поведение не меняется ни на один запрос, пока множество выведено из
  # посадки: ветка читателя поставщика здесь не исполняется. Меняется
  # читаемость стенда и перепись: профилей, называющих публичный адрес чужой
  # службы личности, становится на один меньше, и снятие самой ручки перестаёт
  # упираться в «а на `own` её зачем-то задают».
  #
  # ПЕРЕХОДНОЕ `own,external` С ЭТИМ ЗНАЧЕНИЕМ НЕ ОБЪЯВИТЬ: страж старта
  # отказывает объявленному чужому читателю без адреса
  # (validateSessionCarrierConfig, gateway/cmd/api-gateway/session_carrier_validation.go),
  # поэтому вместе с таким множеством сюда возвращается и адрес.
  #
  # СНЯТЬ ЗДЕСЬ МОЖНО ТОЛЬКО ЭТО. Административный адрес поставщика и якоря
  # доверия остаются: первый рвёт живые чужие сессии при выходе человека,
  # второй один на всех издателей, включая нашего.
  kratosPublicUrl: disabled

  authn:
    # Вторая половина той же посадки. Значение обязано СОВПАДАТЬ с объявленным
    # службе выше.
    identityProvider: own

    # АДРЕС ПОЛОСЫ ФОРМЫ, на который край ретранслирует четыре глагола (вход ·
    # выход · смена пароля · признак формы). Под `own` пустое значение — отказ
    # старта с именем ручки: ретрансляция без цели отвечала бы 503 на каждом
    # запросе всю жизнь, неотличимо от «служба лежит».
    #
    # Имя — внутренний Service службы (`kaname-internal`), порт — тот самый
    # `kaname.ports.loginLane: 9100` боевого слоя. Схема `https` обязательна:
    # ретранслируемый запрос несёт печенье сессии человека, а слушатель полосы
    # взаимный по TLS. Клиентская пара и якорь берутся из тех же `mtls.*`, что
    # у gRPC-рёбер к службе, — второго объявления об одном предмете не
    # заводится.
    #
    # Написание — то же, что у остальных адресов службы в боевом слое
    # (`kaname-internal.kacho.svc:9097` у набора ключей и авторитета отзыва):
    # имя выводится из `kaname.name`, а не из имени выпуска.
    iamLoginLaneUrl: https://kaname-internal.kacho.svc:9100

# ─── ЧУЖОЙ ПОСТАВЩИК СЕССИИ ЧЕЛОВЕКА ЗДЕСЬ ПОДНИМАЕТСЯ — ЭТО ЦЕНА, А НЕ ЗАБЫВЧИВОСТЬ
#
# Здесь НЕТ `kratos.enabled: false` (ни его хранилища, ни его интерфейса входа),
# хотя на этой цепочке печенье поставщика личностью не становится. Решает это
# не посадка, а МНОЖЕСТВО читателей носителя: цепочка его не объявляет, край
# выводит его из посадки `own` — только наш носитель — и читателя чужого
# печенья не заводит (config.ResolvedSessionCarriers; держит
# TestSessionCarriers_UndeclaredDerivesTodaysBehaviourFromThePosture). Поставщик
# на этой цепочке чеканит сессии, которых край не читает, — и это названо, а не
# забыто. Объяви цепочка переходное `own,external`, живые чужие сессии,
# заведённые до открытия окна, читались бы — и адрес выше пришлось бы вернуть.
#
# Выключение здесь СТОЯЛО и снято, потому что с ним цепочка не проходит гейт
# TestIdentityFileKeysAreNotOverriddenByTheEnvironment
# (deploy/identity_file_keys_survive_the_environment_test.go). Замер по рендеру
# цепочки `own`:
#
#   - наш файл настроек службы личности (карта `kaname-kratos-config`, метка
#     `kacho.cloud/component: kratos-config`) рендерит чарт службы доступа по
#     `kaname.kratos.config.enabled`, а НЕ по `kratos.enabled`, — и с
#     выключенным поставщиком карта оставалась в рендере;
#   - монтировать её становилось некому: «процессов-читателей 0», и «B = 0»
#     означало бы «ноль прочитанного» — гейт отказывает ровно на этом;
#   - снять вместе с поставщиком и карту нельзя тем же гейтом: он требует НАШЕЙ
#     карты от КАЖДОЙ цепочки deploy/stacks.txt и отказывает на её отсутствии.
#
# Значит снятие поставщика с этой цепочки — ОТДЕЛЬНЫЙ предмет, и приходит оно
# одним изменением с гейтом: тот должен отличать цепочку, объявившую отсутствие
# службы личности, от процесса, потерявшего аргумент файла настроек. Порознь
# любая из двух правок роняет конвейер.

# ─── ЧУЖОЙ ИЗДАТЕЛЬ ТОКЕНА (hydra) ОСТАЁТСЯ, И ЭТО НЕ ЗАБЫВЧИВОСТЬ ──────────
#
# Здесь НЕТ `hydra.enabled: false`, и отсутствие объявлено, чтобы читающий не
# принял его за недоделку. У приёма прежнего издателя на этой цепочке ТРИ живых
# предмета, и каждый измерен:
#
#   1. перечень приёма края (`tokenAcceptance.issuers` боевого слоя) называет
#      `https://hydra.api.kacho.cloud` рядом с нашим издателем. Посадка этого НЕ
#      разводит: приём токена и чтение печенья сессии — разные предметы, и на
#      `own` чужой токен принимается ровно как на `external`;
#   2. зеркало набора ключей службы доступа тянет чужой набор с
#      `KANAME_HYDRA_JWKS_URL` (hydra-public:4444) — выключенный издатель оставил
#      бы перечень приёма без проверочного материала, и чужой токен перестал бы
#      проверяться, оставаясь объявленным принимаемым;
#   3. посев церемонии (`tests/authz-fixtures/prodseed_ceremony.py`) добывает
#      предъявителя прежнего издателя обменом у него же. Что предмет ЖИВ —
#      печатает гейт, а не память:
#      `python3 deploy/scripts/assert-legacy-issuer-acceptance-has-a-subject.py --root .`
#      → «мест обмена у прежнего издателя: 1 … требование обосновано» (код 0).
#
# Снятие издателя начинается с ТОГО гейта: пока он зелен, снимать нечего.
