#
# values.own.yaml — НАКЛАДКА СТЕНДА `own`: боевой слой, над которым КОНСОЛЬ
# ведёт церемонии личности сама (приёмка F8 §4, п. 2; kacho#2777, #2735).
#
# ── ЧТО ЭТО ЗА СЛОЙ ─────────────────────────────────────────────────────────
#
# Накладка, а не самостоятельный профиль. Цепочка стенда — строка `own` таблицы
# deploy/stacks.txt (единственной в дереве); перечень её слоёв здесь намеренно не
# выписан — копия разошлась бы с таблицей молча (kacho#2805).
#
# ── ЧЕГО ЗДЕСЬ БОЛЬШЕ НЕТ И ГДЕ ОНО ТЕПЕРЬ ──────────────────────────────────
#
# Накладка несла посадку `own` обеим половинам, адрес полосы формы, окно
# свежести и снятие стека поставщика личности с этой цепочки (#2816). Посадку
# `own` теперь объявляют ВСЕ стенды таблицы, поэтому всё это переехало туда,
# откуда его наследует каждый стенд, и копии здесь не оставлено — два места об
# одном предмете разошлись бы молча:
#
#   посадка обеих половин, адрес полосы формы, окно свежести, приём токена
#     только нашего издателя            — корни цепочек (values.prod.yaml,
#                                          values.dev.yaml);
#   поставщик личности, его издатель, их базы, чужой экран входа, наши карты
#     его настроек                       — база зонта (values.yaml, раздел
#                                          «ЧУЖОЙ СТЕК ЛИЧНОСТИ НЕ ПОДНИМАЕТСЯ»);
#   его публичный адрес у края           — нигде: ручка снята вместе с
#                                          читателем его сессии (#2792).
#
# ── ЧТО ЗДЕСЬ ОСТАЁТСЯ: КОНСОЛЬ НА БОЕВОМ СЛОЕ ──────────────────────────────
#
# Боевой слой консоль не разворачивает (`uif.enabled` базы зонта — false, и
# values.prod.yaml его не включает). Предмет этого стенда — ровно то, чего
# другим боевым стендам не дано: цепочка, которая одновременно РАЗВОРАЧИВАЕТ
# консоль и НЕ отдаёт адреса церемоний чужому экрану. Без такой цепочки ни
# один сценарий §11 приёмки F8 не исполним (её §4 называет это предусловием
# прогона).
#
# Адреса церемоний (`/login`, `/registration`, …) достаются здесь ОБОЛОЧКЕ
# консоли: полоса потоков к чужому экрану рендерится только при непустом
# `host.upstreams.kratosUi`, а его умолчание в чарте консоли пусто
# (ui-future/deploy/values.yaml). Держит это рендером каждой цепочки
# deploy/tests/helm/console-serves-identity-flows-test.sh.
#
# Образы консоли пинит слой площадки этого стенда (values.own-stand.yaml) — там
# же, где образы остальных служб.
uif:
  enabled: true
