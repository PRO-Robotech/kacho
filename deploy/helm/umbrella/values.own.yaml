#
# values.own.yaml — НАКЛАДКА ПОСАДКИ `own`: платформа проверяет человека СВОЕЙ
# полосой, а не внешним поставщиком удостоверений (kacho#2716, стадия S2 приёмки
# Ф4д §8).
#
# ── ЧТО ЭТО ЗА СЛОЙ ─────────────────────────────────────────────────────────
#
# Накладка, а не самостоятельный профиль. Цепочка стенда — строка `own` таблицы
# deploy/stacks.txt (единственной в дереве); перечень её слоёв здесь намеренно не
# выписан — копия разошлась бы с таблицей молча (kacho#2805). Этот файл стоит в
# ней поверх боевого слоя, и боевой слой уже несёт ВСЁ, что полоса требует
# числами:
#
#   ports.loginLane 9100 · mtls.loginLane true · loginLaneClientAuthMode mutual
#   config.authn.login.* (ёмкость 8, резерв 256 МиБ, правило пароля, хешер, …)
#   config.authn.registration.* (3 за 1 ч) · resources.limits.memory 1280Mi
#
# и несёт по решению приёмки Ф3 (Р3, Р11, Ф3-42): дословный перенос величин
# живёт в профиле, где его видит читающий, и перевод стенда на `own` НЕ ЗАВОДИТ
# ПОЛОСУ С НУЛЯ. Поэтому здесь объявляется ровно то, чего на `external` нет и
# быть не может, — сама посадка и то, что читается только под ней.
#
# ── ПОЧЕМУ ОБЕ ПОЛОВИНЫ В ОДНОМ ФАЙЛЕ ───────────────────────────────────────
#
# Посадку читают ДВА процесса: служба доступа и край. Половины разводят по ней
# РАЗНЫЕ требования, и профиль, объявивший посадку одной и забывший второй, даёт
# стенд, у которого половины решают о личности по-разному, — расхождение,
# которого никто не решал. Держит это
# deploy/helm/umbrella/identity_posture_profiles_test.go.

kaname:
  config:
    authn:
      # ПОСАДКА ЛИЧНОСТИ. Умолчания нет ни у процесса, ни у чарта: профиль,
      # посадку не объявивший, получает отказ старта с именем поля, а не тихо
      # наследует чужой выбор.
      identityProvider: own

      # ОКНО СВЕЖЕСТИ ПРАВКИ СВОИХ ДАННЫХ (Ф12, kacho#1281;
      # KANAME_AUTHN__SELF_SERVICE_FRESHNESS). Заведение и подтверждение второго
      # фактора требуют предъявления не старше окна, и тем же окном ограничен
      # срок неподтверждённого заведения.
      #
      # Читается ТОЛЬКО под `own`, поэтому стоит здесь, а не в боевом слое: там
      # страж её не судит, и запись пришлось бы объяснять ведомостью. 15 минут —
      # перенос прежней величины, а не новый выбор.
      selfServiceFreshness: 15m

  # ─── СТЕК ПОСТАВЩИКА НЕ ПОДНИМАЕТСЯ: НАША СТОРОНА (kacho#2816) ─────────────
  # Разбор — в разделе «СТЕК ПОСТАВЩИКА НА ЭТОЙ ЦЕПОЧКЕ НЕ ПОДНИМАЕТСЯ» ниже.
  kratos:
    # НАШИ карты настроек поставщика личности (`kaname-kratos-config`,
    # `kaname-kratos-hooks`, `kaname-kratos-identity-schema`): монтировать их
    # некому. Карта без читателя — объявление, которое не исполняется.
    config:
      enabled: false
    identitySchema:
      enabled: false
  platform:
    iam:
      # Дороги службы к издателю поставщика. Под `own` служба их не требует
      # (страж старта: `Lanes: external`), строителю дороги их не на что вести.
      # Пустое значение — «переменная не выставляется» (`with` шаблона чарта).
      # Издатель поставщика (`KANAME_HYDRA_ISSUER`) шаблон чарта выставлял
      # безусловно, и выключить его величиной было нечем; под посадкой `own`
      # шаблон его больше не выставляет сам (kacho#2816).
      hydraAdminUrl: ""
      hydraAdminCaFile: ""
      hydraJwksUrl: ""
      hydraTokenURL: ""

api-gateway:
  authn:
    # Вторая половина той же посадки. Значение обязано СОВПАДАТЬ с объявленным
    # службе выше.
    identityProvider: own

    # АДРЕС ПОЛОСЫ ФОРМЫ, на который край ретранслирует четыре глагола (вход ·
    # выход · смена пароля · признак формы). Под `own` пустое значение — отказ
    # старта с именем ручки: ретрансляция без цели отвечала бы 503 на каждом
    # запросе всю жизнь, неотличимо от «служба лежит».
    #
    # Имя — внутренний Service службы (`kaname-internal`), порт — тот самый
    # `kaname.ports.loginLane: 9100` боевого слоя. Схема `https` обязательна:
    # ретранслируемый запрос несёт печенье сессии человека, а слушатель полосы
    # взаимный по TLS. Клиентская пара и якорь берутся из тех же `mtls.*`, что
    # у gRPC-рёбер к службе, — второго объявления об одном предмете не
    # заводится.
    #
    # Написание — то же, что у остальных адресов службы в боевом слое
    # (`kaname-internal.kacho.svc:9097` у набора ключей и авторитета отзыва):
    # имя выводится из `kaname.name`, а не из имени выпуска.
    iamLoginLaneUrl: https://kaname-internal.kacho.svc:9100

  # ─── СТЕК ПОСТАВЩИКА НЕ ПОДНИМАЕТСЯ: СТОРОНА КРАЯ (kacho#2816) ─────────────
  # Разбор — в разделе «СТЕК ПОСТАВЩИКА НА ЭТОЙ ЦЕПОЧКЕ НЕ ПОДНИМАЕТСЯ» ниже.
  # ПЕРЕЧЕНЬ ПРИЁМА — ТОЛЬКО НАШ ИЗДАТЕЛЬ. Прежний издатель стоял вторым, и его
  # набор ключей край брал с `…:9097/.well-known/jwks.json` — записью зеркала,
  # которую служба под `own` не публикует вовсе: принимаемый издатель без
  # проверочного материала.
  tokenAcceptance:
    issuers: "https://kaname.kacho.local"
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json"
  hydra:
    # Отзыв и снос сессии у поставщика. Под `own` край их не требует (страж
    # отзыва: ось поставщика «замещается осью нашего авторитета отзыва»), а
    # заданный адрес вёл бы к процессу, которого нет.
    introspectionUrl: ""
    adminUrl: ""
    adminCa:
      secretName: ""
    # `jwksCa` НЕ СНИМАЕТСЯ: это якорь хопа за набором ключей НАШЕГО издателя
    # (`kaname-server-tls`), один на всех издателей. Имя ручки называет
    # поставщика по истории, величина — нет.

# ─── СТЕК ПОСТАВЩИКА НА ЭТОЙ ЦЕПОЧКЕ НЕ ПОДНИМАЕТСЯ (kacho#2816) ─────────────
#
# Человека проверяет НАША полоса, токены чеканит НАШ издатель (подписант службы
# доступа). Поставщик личности и его издатель на этой цепочке не читались
# никем: край выводит множество носителей из посадки и читателя печенья
# поставщика не заводит (config.ResolvedSessionCarriers), служба не публикует
# зеркало его набора ключей (providerKeySetMirrorIsPublished — только при
# внешнем поставщике), обмен посева идёт у нашего издателя. Поэтому снято всё
# сразу, одним изменением, и каждая строка ниже называет, что она снимает.
#
# ОДНИМ ИЗМЕНЕНИЕМ — НЕ АККУРАТНОСТЬ, А УСЛОВИЕ. Издатель уходит из перечня
# приёма ровно тем же коммитом, которым выключаются его нагрузки: порознь стенд
# либо принимает токен, чей набор ключей никто не держит, либо держит издателя,
# которого никто не читает.
#
# ЧТО ПРОВЕРЯЕТ, ЧТО ОТСУТСТВИЕ НАСТОЯЩЕЕ. Гейт
# TestIdentityFileKeysAreNotOverriddenByTheEnvironment различает эту цепочку по
# НАШЕМУ признаку — посадке, объявленной службой в её карте настроек, — и
# требует: ни одного объекта поставщика в рендере (имя или образ
# kratos|hydra|ory) и ни одного адреса поставщика у наших нагрузок. Одно-фактная
# инъекция любой из снятых нагрузок обратно роняет его
# (identity_file_keys_survive_the_environment_injection_test.go).

# Поставщик личности, его почтовый процесс, его база и его консоль входа.
kratos:
  enabled: false
pg-kratos:
  enabled: false
kratos-selfservice-ui:
  kratosSelfServiceUI:
    enabled: false

# Издатель поставщика и его база.
hydra:
  enabled: false
pg-hydra:
  enabled: false

mtls:
  # Терминатор TLS административного слушателя издателя (сертификат, сайдкар,
  # его карта и Service `…-hydra-admin-tls`): переход ведёт к процессу, которого
  # на этой цепочке нет.
  hydraAdminTls:
    enabled: false

# Реестр принимает identity-токены тем же перечнем, что и край: один издатель.
registry:
  tokenAcceptance:
    issuers: "https://kaname.kacho.local"
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json"
