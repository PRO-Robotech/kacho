#
# values.own.yaml — НАКЛАДКА ПОСАДКИ `own`: платформа проверяет человека СВОЕЙ
# полосой, а не внешним поставщиком удостоверений (kacho#2716, стадия S2 приёмки
# Ф4д §8).
#
# ── ЧТО ЭТО ЗА СЛОЙ ─────────────────────────────────────────────────────────
#
# Накладка, а не самостоятельный профиль: цепочка стенда — `values.prod.yaml`
# плюс этот файл (объявлена в deploy/stacks.txt, единственной таблице дерева).
# Боевой слой под ней уже несёт ВСЁ, что полоса требует числами:
#
#   ports.loginLane 9100 · mtls.loginLane true · loginLaneClientAuthMode mutual
#   config.authn.login.* (ёмкость 8, резерв 256 МиБ, правило пароля, хешер, …)
#   config.authn.registration.* (3 за 1 ч) · resources.limits.memory 1280Mi
#
# и несёт по решению приёмки Ф3 (Р3, Р11, Ф3-42): дословный перенос величин
# живёт в профиле, где его видит читающий, и перевод стенда на `own` НЕ ЗАВОДИТ
# ПОЛОСУ С НУЛЯ. Поэтому здесь объявляется ровно то, чего на `external` нет и
# быть не может, — сама посадка и то, что читается только под ней.
#
# ── ПОЧЕМУ ОБЕ ПОЛОВИНЫ В ОДНОМ ФАЙЛЕ ───────────────────────────────────────
#
# Посадку читают ДВА процесса: служба доступа и край. Половины разводят по ней
# РАЗНЫЕ требования, и профиль, объявивший посадку одной и забывший второй, даёт
# стенд, у которого половины решают о личности по-разному, — расхождение,
# которого никто не решал. Держит это
# deploy/helm/umbrella/identity_posture_profiles_test.go.

kaname:
  config:
    authn:
      # ПОСАДКА ЛИЧНОСТИ. Умолчания нет ни у процесса, ни у чарта: профиль,
      # посадку не объявивший, получает отказ старта с именем поля, а не тихо
      # наследует чужой выбор.
      identityProvider: own

      # ОКНО СВЕЖЕСТИ ПРАВКИ СВОИХ ДАННЫХ (Ф12, kacho#1281;
      # KANAME_AUTHN__SELF_SERVICE_FRESHNESS). Заведение и подтверждение второго
      # фактора требуют предъявления не старше окна, и тем же окном ограничен
      # срок неподтверждённого заведения.
      #
      # Читается ТОЛЬКО под `own`, поэтому стоит здесь, а не в боевом слое: там
      # страж её не судит, и запись пришлось бы объяснять ведомостью. 15 минут —
      # перенос прежней величины, а не новый выбор.
      selfServiceFreshness: 15m

api-gateway:
  authn:
    # Вторая половина той же посадки. Значение обязано СОВПАДАТЬ с объявленным
    # службе выше.
    identityProvider: own

    # АДРЕС ПОЛОСЫ ФОРМЫ, на который край ретранслирует четыре глагола (вход ·
    # выход · смена пароля · признак формы). Под `own` пустое значение — отказ
    # старта с именем ручки: ретрансляция без цели отвечала бы 503 на каждом
    # запросе всю жизнь, неотличимо от «служба лежит».
    #
    # Имя — внутренний Service службы (`kaname-internal`), порт — тот самый
    # `kaname.ports.loginLane: 9100` боевого слоя. Схема `https` обязательна:
    # ретранслируемый запрос несёт печенье сессии человека, а слушатель полосы
    # взаимный по TLS. Клиентская пара и якорь берутся из тех же `mtls.*`, что
    # у gRPC-рёбер к службе, — второго объявления об одном предмете не
    # заводится.
    #
    # Написание — то же, что у остальных адресов службы в боевом слое
    # (`kaname-internal.kacho.svc:9097` у набора ключей и авторитета отзыва):
    # имя выводится из `kaname.name`, а не из имени выпуска.
    iamLoginLaneUrl: https://kaname-internal.kacho.svc:9100

  # ─── ЧУЖОЙ ИЗДАТЕЛЬ НА ЭТОМ СТЕНДЕ НЕ ПРИНИМАЕТСЯ ─────────────────────────
  #
  # Накладка объявляла посадку `own` и НЕ снимала перечень издателей боевого
  # слоя. Наблюдаемый исход, снятый рендером цепочки `own` (values.prod.yaml +
  # этот файл) на `bec320cf47d`:
  #
  #   KACHO_API_GATEWAY_IDENTITY_PROVIDER = "own"
  #   KACHO_API_GATEWAY_TOKEN_ISSUERS     = "https://kaname.kacho.local,
  #                                          https://hydra.api.kacho.cloud"
  #
  # То есть стенд, объявивший «человека проверяем СВОЕЙ полосой», принимал
  # токен, выпущенный чужим издателем, — и принимал его наравне со своим. Это
  # не мёртвая ручка, а действующая дверь: проверяется подпись ключом чужого
  # набора, и дальше токен неотличим от нашего.
  #
  # ПОЧЕМУ ЗДЕСЬ, А НЕ В БОЕВОМ СЛОЕ. Цепочки `prod`, `fe3455` и четыре
  # dev-класса стоят на посадке `external` ПО РЕШЕНИЮ: чужой издатель —
  # единственный, кто им выдаёт. Снятие в боевом слое оставило бы их без
  # принимаемого издателя вовсе, то есть без входа. Снимается ровно там, где
  # объявлена посадка: накладка и посадка едут вместе или никак.
  #
  # ОТКАТ — снять этот файл из цепочки стенда (deploy/stacks.txt): перечень
  # возвращается к боевому слою целиком, вместе с посадкой.
  #
  # Скаляр ЗАМЕЩАЕТСЯ целиком (так helm накладывает не-карты), поэтому запись
  # нашего издателя переписана здесь дословно, а не «дополнена».
  tokenAcceptance:
    issuers: "https://kaname.kacho.local"
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json"

  # ─── ТРИ РУЧКИ ЧУЖОГО ПОСТАВЩИКА, У КОТОРЫХ ПОД `own` НЕТ ЧИТАТЕЛЯ ────────
  #
  # Каждая снимается ПУСТЫМ значением, а не удалением строки: край различает
  # «не объявлено» и «объявлено пустым», и выключение осью значения — та самая
  # форма, которую несёт его страж старта
  # (gateway/cmd/api-gateway/revocation_validation.go):
  #
  #   * introspectionUrl — интроспекция ЧУЖИХ токенов. Читателя выбирает запись
  #     издателя (VerifiedToken.ReadRevocation); чужого издателя выше больше
  #     нет, значит спрашивать нечего и не о чем. Страж: требование снимается
  #     под `own` и ЗАМЕЩАЕТСЯ авторитетом отзыва НАШЕЙ чеканки
  #     (KACHO_API_GATEWAY_PLATFORM_TOKEN_REVOCATION_URL боевого слоя), а не
  #     отменяется;
  #   * adminUrl — выход человека, снимающий сессию НА СТОРОНЕ ПОСТАВЩИКА. Под
  #     `own` сессии у поставщика не существует: носитель браузерной сессии —
  #     наш `kaname_session`, и снимает его наша служба. Страж требование под
  #     `own` снимает явно;
  #   * adminCa.secretName — якорь доверия административного хопа. Хоп снят
  #     двумя строками выше, и якорь без хопа — не защита, а том, который под
  #     монтируется из секрета чужого терминатора TLS. На стенде, где выдающая
  #     половина поставщика выключена, такого секрета нет, и под встал бы на
  #     монтировании тома.
  #
  # ЧТО ЗДЕСЬ НЕ СНЯТО И ЭТО РЕШЕНИЕ: `hydra.jwksCa` остаётся. Имя ручки
  # называет чужого поставщика, а предмет у неё НАШ — якорь хопа за ключами
  # верификации, который едет к нашему зеркалу набора на внутреннем слушателе
  # службы доступа (`kaname-server-tls`, боевой слой). Снятие оставило бы наш
  # собственный хоп на системных корнях. Переименование ручки — отдельный
  # предмет (ban #2), контракт настройки, а не снятие.
  hydra:
    introspectionUrl: ""
    adminUrl: ""
    adminCa:
      secretName: ""

  # ─── АДРЕС ЧУЖОЙ СЛУЖБЫ ЛИЧНОСТИ ─────────────────────────────────────────
  #
  # Читателя у него под `own` нет: в композиционном корне края провязка клиента
  # печенья поставщика стоит под `identityLane == External`
  # (gateway/cmd/api-gateway/main.go), а носитель нашей сессии читается своей
  # веткой. Шаблон края эмитит ручку ВСЕГДА и при незаданном значении выводит
  # адрес из имени выпуска, поэтому «не объявить» здесь недостаточно: стенд
  # получил бы живой адрес чужой службы в объявлении процесса. Объявляется
  # сигнальное значение `disabled` — то самое, которым край выключает полосу.
  #
  # Ручка при этом ОСТАЁТСЯ эмитируемой (одно вхождение в рендере цепочки
  # `own`): её подавление — правка шаблона края
  # (gateway/deploy/templates/deployment.yaml), то есть отдельный предмет и
  # отдельная полоса.
  kratosPublicUrl: "disabled"

# ─── ВТОРАЯ ПОЛОВИНА ТОГО ЖЕ ПРИЁМА ──────────────────────────────────────────
#
# Токены принимает не только край: реестр несёт СВОЁ объявление приёма тем же
# ключом значений. Накладка, снявшая чужого издателя у края и забывшая реестр,
# оставила бы дверь открытой на одной из двух половин — и обе половины были бы
# «исправны» каждая по своей пробе.
registry:
  tokenAcceptance:
    issuers: "https://kaname.kacho.local"
    issuerKeySets: "https://kaname.kacho.local=https://kaname-internal.kacho.svc:9097/.well-known/kaname/jwks.json"
