# Default values for the kratos-selfservice-ui sub-chart.
#
# The template reads `.Values.kratosSelfServiceUI.*`; the umbrella overrides via
# its `kratos-selfservice-ui:` block (nested key mirrors the former top-level
# `kratosSelfServiceUI` so the template needed no rewrite on the move).
#
# Off by default; dev enables it (umbrella values.dev.yaml). NOTE: the Service
# name must stay `kratos-selfservice-ui` — kacho-ui nginx proxies to it by name.
kratosSelfServiceUI:
  # Умолчание ресурсов. Живёт здесь, а не в шаблоне: зашитое в шаблон значение
  # нельзя переопределить, и профиль, объявлявший потолок, до процесса не доезжал.
  defaultResources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  enabled: false
  image:
    repository: oryd/kratos-selfservice-ui-node
    tag: v1.3.1
  # INFRA sec-hardening r2 — session + CSRF cookie signing secret.
  # There is NO committed default: a chart that ships one runs every install
  # (incl. production) on a git-known, world-readable signing key (CWE-798).
  #   - prod: set .existingSecret → operator-provisioned Secret (mirrors the
  #     kaname hook-token pattern), consumed via secretKeyRef.
  #   - dev : set .value → a throwaway inline secret for the kind stand.
  # Neither set (while enabled) → the template FAILS render (fail-closed).
  cookieSecret:
    existingSecret: ""
    existingSecretKey: cookieSecret
    value: ""
  # Outbound TLS verification. Default: ON (verify certs). The dev stand opts
  # into skipping it (self-signed / plain-http upstreams); production keeps it
  # enforced. When an internal-CA bundle must be trusted instead of disabling
  # verification, set caCert.secretName → mounted + NODE_EXTRA_CA_CERTS.
  insecureSkipTLSVerify: false
  caCert:
    secretName: ""
    key: ca.crt
    mountPath: /etc/kratos-ui-ca
  # Restricted securityContext floor (parity with kaname / kacho-geo). The
  # Ory kratos-selfservice-ui-node image runs as UID 10000; readOnlyRootFilesystem
  # is satisfied by redirecting HOME + npm cache into the emptyDir /tmp.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 10000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  hydraAdminUrl: http://kacho-umbrella-hydra-admin:4445
  # ОТНОСИТЕЛЬНЫЙ, а не абсолютный. Значение попадает в редиректы, которые видит
  # БРАУЗЕР: с абсолютным адресом вход и регистрация уводят с того хоста, на
  # котором открыта консоль, — то есть работают, только если её открыли ровно по
  # этому адресу. Здесь стояло `http://localhost:28080/.ory/kratos/public`, и на
  # хосте консоли `/registration` отвечал `303` на `localhost:28080`, где такого
  # ingress нет: регистрация упиралась в `404 nginx`. Найдено проходом браузера
  # 2026-08-11, воспроизведено одним curl с заголовком хоста.
  #
  # Относительная форма верна по построению: всё, с чем говорит консоль,
  # проксируется ЧЕРЕЗ НЕЁ же, same-origin (`location /.ory/kratos/public/` в её
  # nginx), и сам Kratos рядом сконфигурирован так же — `base_url:
  # /.ory/kratos/public/`. Абсолютным этот адрес был единственным во всей связке.
  #
  # Проверено на стенде: с относительным значением `/registration` отвечает `303`
  # на тот же хост, форма открывается, регистрация проходит до `/dashboard`.
  kratosBrowserUrl: /.ory/kratos/public
  kratosPublicUrl: http://kacho-umbrella-kratos-public:80
# ─── Ресурсы контейнера ───────────────────────────────────────────────────────
#
# `resources` — ручка для профиля развёртывания. Пустое значение означает «взять
# умолчание ниже», а не «без ограничений»: контейнер без запроса планируется
# куда угодно и вытесняется первым.
resources: {}
