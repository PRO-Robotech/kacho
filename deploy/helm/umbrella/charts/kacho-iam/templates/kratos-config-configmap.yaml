{{/*
KAC-127 Phase 2 — Kratos config ConfigMap (WebAuthn / Passkey enabled).

Соответствует acceptance §5.1 (sub-phase 3.2):

  - webauthn passwordless=true, rp.id = {{ .Values.kacho.domain }} (root domain WebAuthn-RP);
    rp.origin = https://{app-subdomain}.{{ .Values.kacho.domain }} (UI origin).
  - password fallback с Argon2id (m=64MB t=3 p=4) + HIBP k-anonymity check;
  - totp secondary (RFC 6238) для AAL2 fallback;
  - lookup_secret (backup codes) для recovery-edge;
  - recovery: magic-link, lifespan 5min (acceptance §2.8 — IP-bound enforced на use-time);
  - post-registration/post-login web_hook → kacho-iam provisioning HTTP route
    `/iam/v1/hooks/provision` on the :9092 hooks listener (Service kacho-iam-internal).
    C4 fix: the previous target was the PURE gRPC :9091 port with a REST-style
    path that does not exist there → every hook failed silently → users were
    never mirrored into kacho_iam (no project/namespace). Body = identity-payload.jsonnet
    (kacho-iam-kratos-hooks ConfigMap), emitting {external_id, email, display_name}.
  - post-recovery web_hook → `/iam/v1/hooks/recovery` на том же :9092. Прежде он
    указывал на легаси :9091 с REST-подобным путём и падал молча, а объяснение
    ссылалось на «нереализованный» RPC — тот был реализован, не хватало маршрута.

Файл маунтится в Kratos pod как `/etc/kacho-identity/kratos.yaml`. Hydra/Kratos
helm subchart'ы умеют читать config из этого ConfigMap через `config.fromConfigMap`
или через volume-mount + `kratos --config /etc/kacho-identity/kratos.yaml`.
В Phase 2 предпочитаем второй вариант (явный mount) — даёт нам полный контроль
над структурой YAML без оборачивания в `kratos.config.*` (sub-chart wrapper).

ENV substitution (`$KACHO_IAM_HOOK_TOKEN`) — Kratos выполняет на старте через
`config.envsubst` (если включён) ИЛИ через KRATOS_*-env-binding (kratos sub-chart
по умолчанию делает upper-case mapping). В dev это работает через ENV-vars
проброшенные в Kratos pod из Secret `kacho-iam-hook-token`.
─────────────────────────────────────────────────────────────────────────────
ПОТОКИ ОБЪЯВЛЯЮТСЯ В КОРНЕ, А НЕ ПОД ОТДЕЛЬНЫМ СЕГМЕНТОМ (#1048)

Здесь у всех шести потоков стоял лишний сегмент `/auth`. Раздача консоли
обслуживает потоки в КОРНЕ — регулярка `^/(login|registration|…)(/|$)` в
`ui-future/deploy/templates/configmap-nginx.yaml` — и проксирует их отдельной
службе `kratos-selfservice-ui`. Путь с лишним сегментом в эту регулярку не
попадает и уезжает в SPA-заглушку `location /`.

ЧТО «РАЗРЕШАЛО» ЛИШНИЙ СЕГМЕНТ — ИЗМЕРЕНО 2026-08-23, И ОТВЕТ: НИЧТО.
Вопрос стоило задать прямо, потому что расхождение прожило долго и вход при
этом работал. Замер на боевом стенде: карт настроек службы личности в
пространстве имён две, смонтирована ОДНА, и это не та, что рендерит этот
шаблон, — монтирований у неё НОЛЬ. Смонтированная объявляет потоки в корне,
и по ним браузер ходит: поток входа уводит на `/login?flow=…`, корневой
`/registration` отвечает `303` в поток Ory. То есть лишний сегмент был
безвреден ровно потому, что не доезжал до процесса, — а не потому, что его
кто-то умел обслужить.

Отсюда два следствия, и второе важнее первого:
  1. верно то место, которое ОТВЕЧАЕТ ПОЛЬЗОВАТЕЛЮ, — раздача; значит адреса
     выводятся в корень, и они выведены;
  2. как только эта карта настроек будет смонтирована (её предмет — #931),
     прежняя редакция стала бы ЖИВЫМ отказом. Причём отказ выглядит успехом:
     заглушка отдаёт `200` с оболочкой консоли, маршрутизатор такого пути не
     знает и уводит на `/dashboard`. Ни `404`, ни записи в журнале.

Держится гейтом `deploy/identity_flow_path_is_served_test.go`: он выводит
множество обслуживаемых сегментов из самой регулярки раздачи и сверяет с ним
каждое `ui_url:` дерева. Перечень путей там не выписан ни одной строкой,
поэтому расширение раздачи гейта не касается, а сужение немедленно делает его
строже. Путь, начало которого вычисляет шаблон, гейт объявляет неразрешимым и
роняет прогон: «не смогли установить» обязано быть отличимо от «установили,
что верно».
*/}}
{{- if .Values.kratos.config.enabled }}
{{- /* Схема обратных вызовов обязана быть ОБЪЯВЛЕНА: без неё адрес отрендерился
     бы как `<no value>://…`, служба личности молча не дозвонилась бы до слушателя
     хуков, и заведение пользователя не доехало бы НИКОГДА. Отказ рендера называет
     ручку прямо — иначе стенд не поднять. */ -}}
{{- if not ((.Values.global.kacho).identity).hooks.scheme }}
{{- fail "kacho-iam: global.kacho.identity.hooks.scheme не объявлен — транспорт обратных вызовов службы личности к слушателю хуков :9092 задаётся значением профиля (http|https), а не константой шаблона" }}
{{- end }}
{{- if not ((.Values.global.kacho).identity).domain }}
{{- fail "kacho-iam: global.kacho.identity.domain не объявлен — адреса службы личности и rp.id ключей доступа собираются из него; пустой домен даёт адрес вида https://app./, по которому вход не работает" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kacho-iam.fullname" . }}-kratos-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kacho-iam.labels" . | nindent 4 }}
    kacho.cloud/component: kratos-config
data:
  kratos.yaml: |
    {{- include "kacho.identity.configYaml" . | nindent 4 }}
{{- end }}
