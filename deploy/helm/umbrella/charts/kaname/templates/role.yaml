{{/*
Минимальные права для kaname ServiceAccount.
На E0 — пусто (configmap-чтение покрыто defaultами k8s). Скелет — для следующих
фаз, если потребуется чтение Secret'ов / coordination-leases для leader-election.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kaname.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaname.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.db.passwordSecretName | quote }}
    verbs: ["get"]