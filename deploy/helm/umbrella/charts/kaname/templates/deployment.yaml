{{/*
СНЯТЫЕ РУЧКИ ТРАНСПОРТА: отказ рендера, а не молчаливый откат к умолчанию.

Две ручки накрывали по ДВА слушателя каждая, и у слушателей под ними были разные
требования — то есть профиль не мог быть верным ни в одном положении. Теперь у
каждого слушателя ручка своя. Профиль, всё ещё называющий снятое имя, объявляет
величину, которой шаблон не читает: он выглядит настроенным и не настраивает
ничего. Поэтому — отказ рендера с именем замены, а не тишина.
*/}}
{{- if hasKey (.Values.mtls | default dict) "hooksAndMetrics" }}
{{- fail "kaname: mtls.hooksAndMetrics снята — она накрывала ДВА слушателя с противоположными требованиями (обратные вызовы службы личности и скрейп). Слушателя обратных вызовов у службы больше нет (kaname#363); транспорт скрейпа объявляется mtls.metrics" }}
{{- end }}
{{- include "kaname.refuseRetiredKnobs" . }}
{{- if hasKey (.Values.mtls | default dict) "rest" }}
{{- fail "kaname: mtls.rest снята — она накрывала ОБА собственных REST-фронта. Объявите mtls.publicRest и mtls.internalRest по отдельности" }}
{{- end }}
{{- /* Узел почтовой полосы (`smtp` узла личности раздела `global`) читается
     ОДИН раз на рабочий объект: его берут и том якоря узла (kacho#2901), и пара
     удостоверения отправителя ниже. */}}
{{- $mailNode := (((.Values.global).kacho).identity).smtp | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaname.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaname.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "kaname.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaname.labels" . | nindent 8 }}
      annotations:
        # ── ОБЪЯВЛЕНИЕ СБОРА ВЕЛИЧИН ──────────────────────────────────────────
        #
        # Поверхность процесса (`GET /metrics`) поднята и отвечает — и до этой
        # аннотации к ней НИКТО НЕ ПРИХОДИЛ. Поднятая поверхность без того, кто
        # её читает, неотличима от отсутствующей: это та же форма без содержания,
        # только этажом выше.
        #
        # Аннотация пода, а не описатель сбора: описателя обслуживает оператор
        # сбора, а типа его ресурса в этом кластере нет. Аннотацию читают агенты
        # обоих семейств и обращаются к ПОДУ напрямую — поэтому порта в Service
        # для сбора нет. `containerPort` этой поверхности объявлен у контейнера
        # ниже (`metrics`) не ради сбора, а ради проб готовности и живости,
        # которые живут на ней же (kacho#2871), — тем же ключом номера.
        #
        # Порт обязан совпадать с адресом, который процесс берёт из своей
        # конфигурации; это сверяет декларативная проверка
        # `TestEveryRenderedChartDeclaresItsScrape`, читающая ОБЪЯВЛЕНИЯ, а не
        # отрендеренный манифест.
        {{- if .Values.metricsScrape.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsScrape.port | quote }}
        prometheus.io/path: /metrics
        # СХЕМА ЧИТАЕТСЯ У ТОЙ ЖЕ РУЧКИ, ЧТО ПОДНИМАЕТ ТРАНСПОРТ СЛУШАТЕЛЯ.
        # Объявление сбора говорит агенту, КУДА идти; включённый транспорт меняет
        # это «куда», и объявление, о нём умолчавшее, посылает агента открытым
        # текстом на слушатель под TLS — то есть перестаёт быть правдой. Два места
        # об одном предмете здесь не заводится: ручка одна.
        prometheus.io/scheme: {{ ternary "https" "http" (dig "metrics" .Values.mtls.httpListeners .Values.mtls | default false | eq true) | quote }}
        {{- else }}
        # Сбор выключен ОБЪЯВЛЕНИЕМ, и причина едет в кластер вместе с подом:
        # оператор, увидевший процесс без объявления сбора, обязан прочитать
        # ПОЧЕМУ, а не гадать, забыли ли. Пустая причина при выключенном сборе —
        # находка декларативной проверки, а не пустая строка.
        kacho.cloud/metrics-scrape-disabled-because: {{ .Values.metricsScrape.disabledBecause | quote }}
        {{- end }}
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ОБРАЗА.
        #
        # Тег локального образа (`:dev`) неизменен, поэтому пересборка под
        # тем же тегом НЕ меняет шаблон пода: Kubernetes не видит разницы и под не
        # перекатывается — процесс продолжает работать СТАРЫМ бинарником под новым
        # тегом. Ровно тот же разрыв между намерением и исходом, что и у настроек,
        # приезжающих массовым импортом (инцидент 2026-07-25), и лечится он так же —
        # аннотацией, привязанной к содержимому.
        #
        # Значение — идентификатор содержимого образа; его пишет `make build-services`
        # в helm/umbrella/values.image-ids.yaml сразу после сборки. Профиль, который
        # этот файл не накладывает (offline-рендер, чужой реестр), получает "unset" —
        # и тогда привязки нет, что честно: привязывать не к чему.
        kacho.cloud/image-id: {{ dig "kachoImageIds" "iam" "unset" (.Values.global | default dict) | quote }}
        # ConfigMap-content hash → pod rolling-restart при изменении config.yaml.
        kacho.cloud/config-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.manifests.configMapName }}
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ДОСТАВКИ МАНИФЕСТОВ (kacho#1981).
        #
        # Манифесты приезжают ИМЕНОВАННЫМ ConfigMap и читаются процессом ОДИН
        # РАЗ, на старте: перечитывания нет. Правка карты меняет файлы в томе и
        # НЕ меняет шаблон пода — Kubernetes не видит причины перекатывать под,
        # и объявленное оператором состояние наступает не в момент правки, а при
        # постороннем перезапуске. Тот же разрыв «намерение против исхода», что
        # у настроек, читаемых на старте (инцидент 2026-07-25), и вместе с
        # отзывом права (#1969) он становится несущим: снятие перестаёт
        # наступать в названный момент.
        #
        # ПОЧЕМУ НЕ ФОРМОЙ ТРЁХ ПРИВЯЗОК ВЫШЕ. Те считаются по ШАБЛОНУ чарта
        # (`include $.Template.BasePath …`). У этой карты шаблона НЕТ by
        # construction: объект порождается ВНЕ чарта (`make
        # module-manifests-configmap`) и применяется до helm, потому что его
        # содержимое есть данные, а не релиз службы. Хэшировать в чарте нечего.
        #
        # Поэтому форма взята у соседа сверху — у неизменного тега локального
        # образа: производитель кладёт отпечаток СОДЕРЖИМОГО в величину,
        # профиль отдаёт величину helm, шаблон её штампует. Значение пишет
        # `make module-manifests-configmap` в helm/umbrella/values.module-manifests.yaml.
        #
        # Профиль, который этот файл не накладывает (офлайн-рендер, чужой
        # конвейер), получает "unset" — и тогда привязки нет, что честно:
        # привязывать не к чему. Что файл доезжает до КАЖДОГО пути выкатки,
        # проверяет декларативная проба (deploy, #1981) — иначе привязка стояла
        # бы в шаблоне и не могла исполниться ни при каком входе.
        #
        # Условие то же, что у тома ниже: где доставки нет, там нет и предмета
        # привязки, а аннотация о несуществующем монтировании есть утверждение
        # ни о чём.
        kacho.cloud/module-manifests-digest: {{ dig "kachoModuleManifests" "digest" "unset" (.Values.global | default dict) | quote }}
        {{- end }}
    spec:
      # KANAME_* — собственный config-namespace сервиса. К-net auto-инжектит
      # KANAME_INTERNAL_PORT=tcp://<ip>:9091 (из Service `kaname-internal`),
      # что viper-binding путает с config-полями → "too many colons in address" на listen.
      # Гасим service-link-инъекцию: всё конфигурим из своих env / config.yaml.
      enableServiceLinks: false
      serviceAccountName: {{ include "kaname.fullname" . }}
      # INFRA sec-hardening — pod-level securityContext (runAsNonRoot + seccomp
      # RuntimeDefault). Per-container floor is applied on each container below.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kaname.fullname" . }}-config
        # Writable scratch for the read-only-rootfs main container.
        - name: tmp
          emptyDir: {}
        {{- if .Values.manifests.configMapName }}
        # МАНИФЕСТЫ МОДУЛЕЙ (kacho#1875) — источник ВНЕ релиза образа.
        #
        # ConfigMap ведёт тот, кто применяет манифесты, а не этот чарт: правка
        # его содержимого есть операция над данными и релиза службы не требует.
        # Именно ради этого доставка заводится — манифест, запечённый в образ,
        # оставлял бы отзыв модуля релизом iam.
        #
        # `optional: true` — НЕ послабление. Отсутствующий ConfigMap без него
        # держит под в ContainerCreating без объяснения; с ним каталог приезжает
        # пустым, а отказ произносит САМ ПРОЦЕСС и называет причину
        # (manifest.LoadDelivered: «отсутствие манифеста снятием НЕ является»).
        # Диагностируемый отказ дороже недиагностируемого при том же исходе.
        - name: module-manifests
          configMap:
            name: {{ .Values.manifests.configMapName | quote }}
            optional: true
        {{- end }}
        {{- if include "kaname.mailAnchor.declared" $mailNode }}
        {{- $anchor := $mailNode.trustAnchorSecret }}
        # ЯКОРЬ ПОЧТОВОГО УЗЛА (kacho#2901, F6b-56). Проецируется ОДИН ключ:
        # секрет приёмника стенда несёт и его закрытый ключ, а он службе не нужен
        # ни для чего — ключ, смонтированный «за компанию», есть доступ, которого
        # никто не решал.
        - name: mail-anchor
          secret:
            secretName: {{ $anchor.name | quote }}
            items:
              - key: {{ $anchor.key | quote }}
                path: ca.crt
        {{- end }}
        {{- if .Values.mtls.enable }}
        # SEC-H mTLS — cert-manager internal-CA секреты: лист СЛУШАТЕЛЯ и лист
        # КЛИЕНТА, в разных каталогах (cert-manager кладёт tls.crt/tls.key/ca.crt).
        #
        # Здесь стояло «server-side only, no client edge in scope» — и это
        # пережило свой предмет: собственные REST-фронты службы дозваниваются до
        # её же gRPC-слушателя, то есть исходящее соединение у неё ЕСТЬ. Пока
        # клиентского листа не было, фронт предъявлял серверный, слушатель
        # отвергал его на рукопожатии, и каждый доходивший до обработчика запрос
        # возвращался арендатору как 503 (задача #2186).
        - name: mtls-server
          secret:
            secretName: {{ .Values.mtls.serverSecretName | quote }}
        {{- if .Values.mtls.clientSecretName }}
        - name: mtls-client
          secret:
            secretName: {{ .Values.mtls.clientSecretName | quote }}
        {{- end }}
        {{- end }}
      initContainers:
        {{- if .Values.initContainer.migrator.enabled }}
        # skill evgeniy §9 K.1: миграции БД исполняет отдельный binary `kaname-migrator`
        # (тот же image, отдельный entrypoint). DSN собирается мигратором из
        # KANAME_DB_* env (через config-fallback).
        - name: migrate
          image: "{{ include "kaname.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            {{- toYaml .Values.initContainer.migrator.command | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kaname
              readOnly: true
          env:
            - name: KANAME_CONFIG_PATH
              value: /etc/kaname/config.yaml
            - name: KANAME_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
        {{- end }}
      containers:
        - name: {{ include "kaname.fullname" . }}
          image: "{{ include "kaname.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/kaname", "serve"]
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: grpc-internal
              containerPort: {{ .Values.ports.internalGrpc }}
            # Диагностическая поверхность процесса (:9095): `/metrics`, а с
            # ревизии службы, несущей kaname#360, — и `/healthz`, `/readyz`.
            # Поднимается всегда, поэтому по этому порту идут пробы, а
            # оператор, ищущий, куда постучаться за причиной неготовности, читает
            # именно `ports:`. Номер — тот же ключ, что у объявления сбора
            # (`metricsScrape.port`): у одной поверхности один адрес.
            - name: metrics
              containerPort: {{ .Values.metricsScrape.port }}
            # Docker Registry v2 `/iam/token` auth-server HTTP listener — отдельный,
            # external-reachable порт (:9096), куда data-plane реестра проксирует
            # docker-обмен SA-key/user-token → identity-JWT. Отличается от metrics
            # (:9095). Публикуется как Service-порт registry-token.
            - name: registry-token
              containerPort: {{ .Values.ports.registryToken | default 9096 }}
            # Cluster-INTERNAL listener of the verification KEY SET, one-way server-TLS:
            # OUR key set at the path declared by `config.authn.tokenSigning.keySetPath`
            # (the signer of every token the service mints) — one record, ours
            # (kaname#361). The registry data-plane reads the record named by the
            # token's issuer (`registry.tokenAcceptance.issuerKeySets`).
            # Exposed ONLY on kaname-internal (never external, ban #6).
            - name: http-jwks
              containerPort: {{ .Values.ports.jwksProxy | default 9097 }}
            # Собственные REST-фронты службы (KAN-REST-1). Два РАЗНЫХ порта, а не
            # разбор пути на общем: принадлежность маршрута фронту обязана быть
            # свойством того, куда вообще можно дозвониться.
            {{- if .Values.ports.rest }}
            - name: http-rest
              containerPort: {{ .Values.ports.rest }}
            {{- end }}
            {{- if .Values.ports.internalRest }}
            - name: http-rest-int
              containerPort: {{ .Values.ports.internalRest }}
            {{- end }}
            # Слушатель полосы входа паролем (Ф3, kacho#1269): по нему край
            # ретранслирует четыре глагола формы. Порт объявляется ПРОФИЛЕМ,
            # умолчания нет; незаданный порт — отказ старта с именем ручки.
            {{- if .Values.ports.loginLane }}
            - name: http-login-lane
              containerPort: {{ .Values.ports.loginLane }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kaname
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.manifests.configMapName }}
            # Каталог берётся из ТОГО ЖЕ ключа, что и `manifests.dir`
            # конфигурации процесса (см. configmap.yaml): два литерала об одном
            # каталоге разошлись бы молча, и процесс читал бы пустой путь.
            - name: module-manifests
              mountPath: {{ .Values.manifests.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if include "kaname.mailAnchor.declared" $mailNode }}
            - name: mail-anchor
              mountPath: {{ include "kaname.mailAnchor.dir" $ | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.mtls.enable }}
            - name: mtls-server
              mountPath: {{ printf "%s/server" .Values.mtls.mountPath | quote }}
              readOnly: true
            {{- if .Values.mtls.clientSecretName }}
            - name: mtls-client
              mountPath: {{ printf "%s/client" .Values.mtls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
          env:
            - name: KANAME_CONFIG_PATH
              value: /etc/kaname/config.yaml
            - name: KANAME_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
            {{- if .Values.mtls.enable }}
            {{- $srv := printf "%s/server" .Values.mtls.mountPath }}
            {{- $cli := printf "%s/client" .Values.mtls.mountPath }}
            # SEC-H mTLS server-creds (both listeners) — corelib grpcsrv.TLSServer
            # via config.LoadPrefixed("KANAME"). RequireAndVerifyClientCert
            # against the internal-CA bundle (ca.crt in the server secret).
            #
            # ДВА КАТАЛОГА, А НЕ ОДИН, И ЭТО НЕСУЩЕЕ. `$srv` — лист СЛУШАТЕЛЯ, он
            # выписан с назначением `server auth` и БЕЗ `client auth` (так и
            # сказано в шаблоне сертификата). `$cli` — лист КЛИЕНТА, которым
            # процесс представляется, когда звонит сам. Проверка клиентской цепи
            # идёт с назначением `clientAuth`, поэтому серверный лист её не
            # проходит НИ ПРИ КАКОМ входе — путать их нельзя.
            - name: KANAME_PUBLIC_SERVER_MTLS_ENABLE
              value: "true"
            - name: KANAME_PUBLIC_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KANAME_PUBLIC_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KANAME_PUBLIC_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            - name: KANAME_INTERNAL_SERVER_MTLS_ENABLE
              value: "true"
            - name: KANAME_INTERNAL_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KANAME_INTERNAL_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KANAME_INTERNAL_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- if (dig "metrics" .Values.mtls.httpListeners .Values.mtls) }}
            # ─── СЛУШАТЕЛЬ СКРЕЙПА (:9095) ───────────────────────────────────
            #
            # Счётчики процесса суть внутренняя кардинальность,
            # которую канон держит вне всякой поверхности, читаемой посторонним;
            # открытый текст выносит её всякому, кто слушает сеть пода. Отсюда:
            # объявленного исключения у этого слушателя НЕТ и быть не может —
            # ручки `plaintextExceptions.metrics` не существует, и профиль,
            # оставивший его открытым, получает отказ старта, а не тихий откат.
            #
            # Режим односторонний: у собирателя клиентского сертификата пока нет.
            # Переведёшь его на двусторонний — правкой `metricsClientAuthMode`,
            # когда сертификат появится.
            #
            # СЛЕДСТВИЕ, КОТОРОЕ НАДО ЗНАТЬ ОПЕРАТОРУ: включённый транспорт
            # меняет схему адреса сбора на https. Объявление сбора несёт её
            # рядом (аннотация `prometheus.io/scheme` выше), поэтому агент, эту
            # аннотацию читающий, приходит верной схемой.
            - name: KANAME_METRICS_SERVER_MTLS_ENABLE
              value: "true"
            - name: KANAME_METRICS_SERVER_MTLS_CLIENTAUTHMODE
              value: {{ .Values.mtls.metricsClientAuthMode | default "server-tls-only" | quote }}
            - name: KANAME_METRICS_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KANAME_METRICS_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KANAME_METRICS_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- end }}
            {{- if (dig "jwksProxy" .Values.mtls.httpListeners .Values.mtls) }}
            # registry-iam-jwks-unify — server-TLS for the cluster-INTERNAL key-set
            # listener (:9097). Reuses the SAME SEC-F
            # internal-CA server cert-trio mounted above (no new PKI). ONE-WAY
            # (server-tls-only) ON PURPOSE: the route serves PUBLIC OIDC verification
            # keys and is unauthenticated-by-design — the registry data-plane verifier
            # fetches it with a plain https client presenting NO client cert, so
            # RequireAndVerifyClientCert would reject the handshake. Registry trusts
            # this leaf via the internal-CA it already mounts (SSL_CERT_DIR). Gated on
            # mtls.jwksProxy (defaults to mtls.httpListeners) → dev stays plaintext :9097.
            - name: KANAME_JWKSPROXY_SERVER_MTLS_ENABLE
              value: "true"
            - name: KANAME_JWKSPROXY_SERVER_MTLS_CLIENTAUTHMODE
              value: {{ .Values.mtls.jwksProxyClientAuthMode | default "server-tls-only" | quote }}
            - name: KANAME_JWKSPROXY_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KANAME_JWKSPROXY_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KANAME_JWKSPROXY_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- end }}
            {{- if (dig "publicRest" .Values.mtls.httpListeners .Values.mtls) }}
            # ─── СОБСТВЕННЫЙ ПУБЛИЧНЫЙ REST-ФРОНТ (:9098) ────────────────────
            #
            # РУЧКА У НЕГО СВОЯ. Здесь стояло условие, накрывавшее ОБА фронта, и
            # это тот же класс, что был у пары «вебхуки + скрейп»: перечень
            # поверхностей под одной ручкой растёт молча, а профиль объявляет
            # одно значение на две поверхности, о требованиях которых он ничего
            # не говорит. Прежнее имя ручки (`rest`) снято, а не сужено: молча
            # сузить его значило бы оставить внутренний фронт открытым у всякого,
            # кто уже объявил старое имя.
            #
            # Переиспользует ТОТ ЖЕ серверный набор внутреннего УЦ, что смонтирован
            # выше, — новой PKI не заводится. Режим односторонний НАМЕРЕННО: до
            # публичного фронта дотягивается арендатор обычным HTTP-клиентом,
            # клиентского сертификата он не носит, и требование предъявить его
            # отвергло бы каждого на рукопожатии. Вызывающего здесь аутентифицирует
            # предъявленное удостоверение — его проверяет звено собственного
            # слушателя, а не транспорт.
            #
            # Объявленного исключения у этого фронта НЕТ: по проводу идёт
            # предъявленное удостоверение арендатора, и снятое с провода оно
            # предъявляется повторно кем угодно до истечения срока.
            - name: KANAME_REST_SERVER_MTLS_ENABLE
              value: "true"
            - name: KANAME_REST_SERVER_MTLS_CLIENTAUTHMODE
              value: {{ .Values.mtls.restClientAuthMode | default "server-tls-only" | quote }}
            - name: KANAME_REST_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KANAME_REST_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KANAME_REST_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- end }}
            {{- if (dig "internalRest" .Values.mtls.httpListeners .Values.mtls) }}
            # ─── СОБСТВЕННЫЙ ВНУТРЕННИЙ REST-ФРОНТ (:9099) ───────────────────
            #
            # Своя ручка, а не общая с публичным фронтом: поверхности разные, и
            # «внутренний — значит доверенный» объявлено запрещённым допущением
            # (защита в глубину против бокового движения). По этому проводу идут
            # служебные поверхности, и открытый текст выносит их всякому, кто
            # слушает сеть пода, — объявленного исключения здесь тоже нет.
            #
            # Режим односторонний по той же причине, что у публичного фронта.
            - name: KANAME_INTERNALREST_SERVER_MTLS_ENABLE
              value: "true"
            - name: KANAME_INTERNALREST_SERVER_MTLS_CLIENTAUTHMODE
              value: {{ .Values.mtls.internalRestClientAuthMode | default "server-tls-only" | quote }}
            - name: KANAME_INTERNALREST_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KANAME_INTERNALREST_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KANAME_INTERNALREST_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- end }}
            {{- if (dig "loginLane" .Values.mtls.httpListeners .Values.mtls) }}
            # ─── СЛУШАТЕЛЬ ПОЛОСЫ ВХОДА ПАРОЛЕМ (Ф3, kacho#1269) ──────────────
            #
            # Своя ручка, а не общая с фронтами: у этого слушателя ДРУГОЙ
            # вызывающий и другое требование к нему. Транспорт ВЗАИМНЫЙ: вызывать
            # полосу вправе ровно край платформы, и слушатель судит его по SAN
            # проверенного клиентского сертификата — тем же различителем, что
            # ярус «только край» внутреннего gRPC-слушателя (приёмка Ф3, Р16).
            # Круг законных отправителей переданной личности здесь НЕ читается:
            # он шире края by construction (семь SAN, шесть — не край), и допуск
            # по нему открывал бы вход, выход и смену пароля с носителем шести
            # пирам кластера. По этому проводу едет носитель сессии человека и
            # его пароль — объявленного исключения нет и быть не может.
            #
            # Режим клиента объявляет ПРОФИЛЬ; умолчание — единственное годное
            # под `own` значение: иной режим страж старта службы отвергает
            # (requireLoginLaneTLS), поэтому подставить неверное умолчание нельзя.
            - name: KANAME_LOGINLANE_SERVER_MTLS_ENABLE
              value: "true"
            - name: KANAME_LOGINLANE_SERVER_MTLS_CLIENTAUTHMODE
              value: {{ .Values.mtls.loginLaneClientAuthMode | default "mutual" | quote }}
            - name: KANAME_LOGINLANE_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KANAME_LOGINLANE_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KANAME_LOGINLANE_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- end }}
            {{- if or (dig "publicRest" .Values.mtls.httpListeners .Values.mtls) (dig "internalRest" .Values.mtls.httpListeners .Values.mtls) }}
            # ─── УДОСТОВЕРЕНИЕ ФРОНТА ПЕРЕД СОБСТВЕННЫМ СЛУШАТЕЛЕМ ───────────
            #
            # Это НЕ слушатель, а исходящий вызов, поэтому и условие у него своё:
            # оно спрашивает «поднят ли хоть один фронт», а не «под TLS ли он».
            # Страж старта требует удостоверения ровно при этом условии
            # (requireRESTUpstreamCredential), и привязать его к транспорту
            # одного из двух фронтов значило бы завести третье правило о чужом
            # предмете.
            #
            # Фронт — обычный клиент своего слушателя: широкого допуска он не
            # получает и в круг разрешённых отправителей личности не вносится.
            # Имя сервера сверяется с SAN серверного листа, потому что дозвон
            # идёт в петлю, а лист выписан на имя Service.
            {{- if not .Values.mtls.clientSecretName }}
            {{- fail "kaname: подняты собственные REST-фронты, а mtls.clientSecretName не объявлен — предъявить своему gRPC-слушателю нечего. Серверный лист выписан с назначением `server auth` и БЕЗ `client auth`, проверка клиентской цепи идёт именно этим назначением, поэтому подстановка серверного листа даёт `tls: bad certificate` на КАЖДОМ запросе. Объявите mtls.clientSecretName (шаблон сертификата выпустит клиентский лист сам) либо снимите mtls.publicRest и mtls.internalRest" }}
            {{- end }}
            - name: KANAME_REST_UPSTREAM_MTLS_ENABLE
              value: "true"
            #
            # ПРЕДЪЯВЛЯЕТСЯ КЛИЕНТСКИЙ ЛИСТ (`$cli`), а не серверный. Здесь стоял
            # `$srv`, и это был не недосмотр в одну букву: серверный лист выписан
            # БЕЗ `client auth`, слушатель проверяет клиентскую цепь именно этим
            # назначением, поэтому рукопожатие обрывалось предупреждением
            # `bad certificate` — и фронт возвращал арендатору
            # `503 {"code":14,… "tls: bad certificate"}` на КАЖДОМ запросе,
            # доходившем до обработчика. Отказ был детерминированный и от токена
            # не зависел: проверка предъявленного живёт на слушателе, до которого
            # фронт не доезжал (задача #2186).
            - name: KANAME_REST_UPSTREAM_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $cli | quote }}
            - name: KANAME_REST_UPSTREAM_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $cli | quote }}
            - name: KANAME_REST_UPSTREAM_MTLS_CAFILES
              value: {{ printf "%s/ca.crt" $cli | quote }}
            # ИМЯ ДЛЯ СВЕРКИ — КОРОТКОЙ СЛУЖЕБНОЙ ФОРМОЙ, как остальные 22 ребра.
            # Здесь стояла полная форма с доменом кластера. Обе работают: лист
            # выписан на три имени каждого хоста, поэтому рукопожатие проходило
            # при любой, и расхождение было ТИХИМ — единственное ребро из
            # двадцати трёх, о различии которого никто не решал (#2179). Сломать
            # его смог бы день, когда состав SAN сузят: отказало бы ровно оно, а
            # остальные продолжили бы работать, и причина была бы неочевидна.
            #
            # Короткая форма не зависит от домена кластера. Это НЕ адрес — по нему
            # не делается ни одного запроса DNS: значение кладётся в SNI и
            # сравнивается с SAN серверного листа, дозвон же идёт в петлю.
            - name: KANAME_REST_UPSTREAM_MTLS_SERVERNAME
              value: {{ printf "%s.%s.svc" (include "kaname.fullname" .) .Release.Namespace | quote }}
            {{- end }}
            {{- if (dig "registryToken" .Values.mtls.httpListeners .Values.mtls) }}
            # docker-token listener (:9096, `/iam/token`) server-TLS. По этому хопу
            # `docker login` шлёт HTTP Basic, чей ПАРОЛЬ — приватный ключ ключа
            # служебной учётки: сервер его не хранит (сверяет выведенный SPKI с
            # сохранённым публичным), срок жизни не ограничен, ротации нет. То есть
            # единственное место в системе, где приватный ключ вообще транзитит, и
            # снятый с провода он предъявляется без всякого окна TTL — в отличие от
            # короткоживущего bearer'а на соседней ноге, которая гейт получила раньше.
            # Тот же internal-CA cert-trio, что у соседних HTTP-рёбер. ONE-WAY
            # (server-tls-only): caller-auth здесь и ЕСТЬ Basic, а mutual потребовал бы
            # client-cert у nginx-sidecar реестра. Gated on mtls.httpListeners → dev
            # остаётся plaintext, и production boot-guard там не срабатывает.
            - name: KANAME_REGISTRYTOKEN_SERVER_MTLS_ENABLE
              value: "true"
            - name: KANAME_REGISTRYTOKEN_SERVER_MTLS_CLIENTAUTHMODE
              value: {{ .Values.mtls.registryTokenClientAuthMode | default "server-tls-only" | quote }}
            - name: KANAME_REGISTRYTOKEN_SERVER_MTLS_CERTFILE
              value: {{ printf "%s/tls.crt" $srv | quote }}
            - name: KANAME_REGISTRYTOKEN_SERVER_MTLS_KEYFILE
              value: {{ printf "%s/tls.key" $srv | quote }}
            - name: KANAME_REGISTRYTOKEN_SERVER_MTLS_CLIENTCAFILES
              value: {{ printf "%s/ca.crt" $srv | quote }}
            {{- end }}
            {{- end }}
            # АДРЕСА КРАЯ ЗДЕСЬ НЕТ — направление развёрнуто (задача продукта #1024).
            #
            # Стояла обязательная ручка адреса края: владелец прав дозванивался до
            # него и гасил его кэш решений. Ручка была обязательной в коде, поэтому
            # iam не поднимался там, где края нет вовсе, — и это, а не сам вызов,
            # делало вынос iam отдельным продуктом невыразимым.
            #
            # Соединение открывает ПОТРЕБИТЕЛЬ: край сам читает журнал смены субъекта
            # курсором. Владелец прав о крае не знает, и знать ему нечем.
            # Ключ ОБЁРТКИ приватной половины подписного ключа (AES-256-GCM).
            #
            # Форма значения — HEX, 64 знака на ключ: резолв
            # (authn.jwks-encryption-key-hex) декодирует hex и требует ровно 32
            # байта. Здесь стояло «32-byte base64url» — кодировка, которой резолв
            # не читает; шедший по этому комментарию получал отказ старта про
            # длину ключа и искал дефект не там.
            #
            # Значение может быть ПЕРЕЧНЕМ через запятую: первый ключ
            # оборачивает, все открывают. Так и меняется ключ обёртки — без
            # простоя и без переписывания хранилища (задача #1065); порядок
            # смены — README чарта, раздел «Changing the wrapping key».
            - name: KANAME_JWKS_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platform.iam.jwks.encKeySecretName }}
                  key: {{ .Values.platform.iam.jwks.encKeySecretKey }}
                  optional: true
            # Перечень ключей ОБЁРТКИ секретов второго фактора (Ф12, kacho#1281) —
            # условие старта.
            #
            # СВОЯ ручка, а не ключ обёртки ключницы выше (Ф12 Р2): предмет другой —
            # секретов много, по одному на человека, — и смена одного перечня не
            # обязана останавливать другой. Форма та же: HEX, 64 знака на ключ,
            # перечень через запятую (первый оборачивает, все открывают).
            #
            # СЕКРЕТОМ, А НЕ ЗНАЧЕНИЕМ ПРОФИЛЯ: профиль отслеживается git. Карты
            # `secrets` в этой копии чарта нет — секреты здесь провязаны ПОИМЁННО,
            # поэтому одного объекта Secret в кластере мало: без этой строки процесс
            # переменной не увидит ни при каком содержимом секрета.
            #
            # `optional: true` — по той же причине, что у соседей: недостающий секрет
            # обязан дать ИМЕНОВАННЫЙ отказ стража старта, а не `CreateContainerConfigError`,
            # по которому оператор не узнает, какой ручки не хватает.
            - name: KANAME_SECOND_FACTOR_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platform.iam.secondFactor.encKeySecretName }}
                  key: {{ .Values.platform.iam.secondFactor.encKeySecretKey }}
                  optional: true
            {{- /*
            ─── УДОСТОВЕРЕНИЕ ПОЧТОВОГО УЗЛА (Р6, MAIL-48) ──────────────────

            ВЕЛИЧИНЫ, А НЕ ИМЕНА: имена переменных объявляет карта настроек
            (`invite-mail.username-env` / `.password-env`), сами величины
            приезжают сюда — пароль ссылкой на секрет, имя пользователя из того
            же адреса соединения, который уезжает поставщику. Второй записи
            узла или пользователя не заводится: она разошлась бы с первой ровно
            там, где расхождение опасно.

            ПАРА ОТДАЁТСЯ ЦЕЛИКОМ либо не отдаётся вовсе — то же условие, что и
            у карты настроек: половина настройки выглядит настроенной и
            отвергается стражем старта процесса.

            `%40` РАСКРЫВАЕТСЯ, и это названо, а не умолчано: имя пользователя
            почтового узла обычно есть адрес, а «собака» внутри части до «@»
            обязана быть закодирована — иначе разбор адреса разъедет. Прочие
            процентные последовательности здесь не раскрываются; профилю, чьё
            имя пользователя их требует, этого механизма не хватит, и он обязан
            завести свой предметом, а не молча.
            */}}
            {{- $mailRaw := tpl (toString ($mailNode.connectionURI | default "")) . }}
            {{- $mailScheme := ternary "smtps://" (ternary "smtp://" "" (hasPrefix "smtp://" $mailRaw)) (hasPrefix "smtps://" $mailRaw) }}
            {{- $mailRest := trimPrefix $mailScheme $mailRaw }}
            {{- $mailUser := ternary (index (splitn "@" 2 $mailRest) "_0") "" (contains "@" $mailRest) }}
            {{- $mailCred := ($mailNode.credentialSecret) | default dict }}
            {{- $mailCredName := trim (toString ($mailCred.name | default "")) }}
            {{- $mailCredKey := trim (toString ($mailCred.key | default "")) }}
            {{- if and (ne $mailCredName "") (ne $mailCredKey "") (ne $mailUser "") }}
            - name: KANAME_INVITE_MAIL_USERNAME
              value: {{ replace "%40" "@" $mailUser | quote }}
            - name: KANAME_INVITE_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $mailCredName | quote }}
                  key: {{ $mailCredKey | quote }}
            {{- end }}
            # SA-key lifetime discipline. A service-account key is the machine's
            # credential; machine principals are exempt from step-up (a machine
            # has no second factor), which holds only while the credential is
            # itself time-bounded. defaultTtl replaces "ttl_seconds omitted ⇒
            # never expires"; maxTtl is the inclusive ceiling.
            {{- with .Values.platform.iam.saKey }}
            {{- if .defaultTtl }}
            - name: KANAME_SAKEY_DEFAULT_TTL
              value: {{ .defaultTtl | quote }}
            {{- end }}
            {{- if .maxTtl }}
            - name: KANAME_SAKEY_MAX_TTL
              value: {{ .maxTtl | quote }}
            {{- end }}
            # accessTokenTtl — per-client access_token_lifespan stamped on the
            # OAuth2 client of every issued SA key. Empty ⇒ env absent ⇒ the
            # provider-global TTL applies (unchanged behaviour), so a profile
            # opts in rather than inheriting a silent change.
            {{- if .accessTokenTtl }}
            - name: KANAME_SAKEY_ACCESS_TOKEN_TTL
              value: {{ .accessTokenTtl | quote }}
            {{- end }}
            {{- end }}
            # Bootstrap-token (#58) — requested token audience the gateway accepts
            # (ExpectedAudience = https://{APIDomain}); signing key from a Secret
            # (optional — empty ⇒ env absent ⇒ MintBootstrapToken fails closed).
            - name: KANAME_BOOTSTRAP_TOKEN_AUDIENCE
              value: {{ printf "https://%s" .Values.platform.domain | quote }}
            {{- with .Values.platform.iam.bootstrapToken }}
            {{- if .signingKeySecretName }}
            - name: KANAME_BOOTSTRAP_SA_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ .signingKeySecretName }}
                  key: {{ .signingKeySecretKey | default "private_key_pem" }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- /* ДОРОГА ОБМЕНА К ПРЕЖНЕМУ ИЗДАТЕЛЮ — ПОКА ЕЁ ЧИТАЕТ СЛУЖБА.
            Контур полосы `/iam/token`, не переведённый на свою чеканку
            (`config.authn.tokenSigning.enabled: false`), обменивает подписанное
            утверждение у прежнего издателя по этому адресу; переведённый дороги
            не строит вовсе. Пин службы оба ключа ещё читает, поэтому ручки
            остаются здесь до изменения, снимающего их читателя (эпик kaname#357).
            Ни один стек их не объявляет: пусто ⇒ не эмитится. */}}
            {{- with .Values.platform.iam.hydraTokenURL }}
            - name: KANAME_HYDRA_TOKEN_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.platform.iam.hydraTokenCaFile }}
            # Trust anchor for the token-endpoint hop: empty → default transport;
            # set → the only anchor; unreadable → refuse the start rather than
            # fall back to the system roots.
            - name: KANAME_HYDRA_TOKEN_CA_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # ГОТОВНОСТЬ СПРАШИВАЕТСЯ ПО ТОМУ, ЧТО СЕРВИС СТРОИТ. `/readyz` живёт на
          # диагностической поверхности (:9095, порт `metrics` выше) и отражает
          # коннект к базе, версию схемы и поднятый LRO-worker; `/healthz` там же —
          # чистая живость. Прежде оба слота спрашивали `tcpSocket: grpc`, то есть
          # «открыт ли порт»: iam с недоступной базой оставался Ready, а он фронтит
          # authN+authZ каждому сервису платформы.
          #
          # ПОЧЕМУ ДИАГНОСТИКА (kacho#2871, служба — kaname#360). Пробы шли на
          # слушатель вебхуков прежнего поставщика, которого процесс не поднимает:
          # kubelet стучался бы в закрытый порт, под не становился готовым
          # никогда, а проба живости перезапускала контейнер по кругу.
          # Диагностика поднимается всегда — поэтому пробы здесь.
          #
          # Схема следует TLS диагностического слушателя: та же ручка, что
          # включает его транспорт (`KANAME_METRICS_SERVER_MTLS_ENABLE` выше) и
          # задаёт схему объявления сбора, переключает и пробу. Двух редакций одного
          # решения тут быть не должно — проба по http на TLS-слушателе не ответит
          # никогда, и под не станет готовым ни при каких условиях.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
              {{- if (dig "metrics" .Values.mtls.httpListeners .Values.mtls) }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
              {{- if (dig "metrics" .Values.mtls.httpListeners .Values.mtls) }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 30
          # Ресурсы — через `kaname.containerResources`: запрос памяти выводится
          # из предела (kacho#2727), довод — у помощника.
          resources:
            {{- include "kaname.containerResources" . | nindent 12 }}