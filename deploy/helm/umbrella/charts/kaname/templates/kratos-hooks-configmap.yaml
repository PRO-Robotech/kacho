{{/*
C4 — Kratos web_hook body templates (Jsonnet).

The registration/login provisioning web_hook in kratos-config-configmap.yaml
references `file:///etc/kacho-identity/hooks/identity-payload.jsonnet`. Kratos
renders this Jsonnet against the flow context (the `ctx` top-level object that
Kratos injects: `ctx.identity`, `ctx.flow`, `ctx.request_*`, …) and POSTs the
result to the kaname provisioning route `/iam/v1/hooks/provision` on the
:9092 HTTP hooks listener.

The emitted JSON MUST match the shape decoded by
`internal/handler/iamhooks/provision_hook_handler.go`
(`kratosProvisionRequest`): {external_id, email, display_name}. Keep the two in
lockstep — the handler test (`provision_hook_handler_test.go`) pins the same
keys.

  - external_id  = ctx.identity.id        — Kratos identity UUID == OIDC `sub`.
  - email        = ctx.identity.traits.email
  - display_name = ctx.identity.traits.display_name (optional; "" when unset).

This ConfigMap is mounted into the Kratos pod at /etc/kacho-identity/hooks/
(alongside kratos.yaml + identity.schema.json) by the Kratos sub-chart's
extraVolumes/extraVolumeMounts wiring — see values.<cluster>.yaml.

recovery-payload.jsonnet AUTHORED HERE since the recovery route landed. Прежде
его тут не было, и объяснение ссылалось на «ещё не реализованный» RPC — а тот был
реализован; не хватало HTTP-маршрута. Отсутствие полезной нагрузки при этом было
вторым дефектом того же места: даже верно нацеленный хук отправил бы
несуществующий файл.
*/}}
{{- if .Values.kratos.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kaname.fullname" . }}-kratos-hooks
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaname.labels" . | nindent 4 }}
    kacho.cloud/component: kratos-hooks
data:
  identity-payload.jsonnet: |
    {{- include "kacho.identity.hookIdentityPayload" . | nindent 4 }}
  recovery-payload.jsonnet: |
    {{- include "kacho.identity.hookRecoveryPayload" . | nindent 4 }}
{{- end }}
