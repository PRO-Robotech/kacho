apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kaname.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaname.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kaname.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kaname.fullname" . }}
    namespace: {{ .Release.Namespace }}