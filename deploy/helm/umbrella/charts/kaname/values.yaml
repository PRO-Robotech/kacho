# Default values for kaname sub-chart.
#
# ЗДЕСЬ СТОЯЛО «все ключи — fallback'и для umbrella values.dev.yaml». Это
# неверно, и неверность увела разбор задачи #2599 на ложный след: боевой стек
# `prod` состоит из ОДНОГО профиля (`deploy/stacks.txt`), поэтому всё, чего тот
# не назвал, приезжает ИМЕННО ОТСЮДА — на замере 2026-09-12 это 7 ключей из 9 в
# блоках `image`/`db`, и стек `fe3455` берёт отсюда же все шесть ключей `db`.
# Значит эти значения — умолчания ВСЕХ стеков, а не только стенда разработки.
#
# Почему это законно и почему стражей на пустоту здесь НЕ заводится (координата
# узла базы выводится helm из имени релиза и псевдонима подчарта; профиль
# объявляет те же координаты у владельца — `pg-iam.auth`; согласие сторон
# подтверждает гейт посадки на живом стенде, падая и на нуле соединений) —
# `docs/architecture/umbrella-subchart-defaults-name-the-release-it-installs.md`.
# Там же названы два остатка и предикат повторения замера.
#
# НЕ ставить здесь production-secret'ы: пароли приходят ссылкой на секрет.

# Phase 2 (KAC-127) — `kacho.domain` пробрасывается из umbrella values.yaml
# через subchart-import (см. dependencies в umbrella Chart.yaml). Sub-chart
# читает `.Values.platform.domain`, но fallback (если subchart запускается
# standalone, без umbrella) — `api.kacho.cloud`.
platform:
  domain: api.kacho.cloud
  iam:
    # Bootstrap-token (#58) — non-interactive production-seed entry point
    # (InternalBootstrapTokenService.MintBootstrapToken, :9091). The signing key is
    # an ES256 (P-256, PKCS#8) private-key PEM held in a Secret; empty secret name →
    # the env is not emitted → MintBootstrapToken fails closed (mint disabled). The
    # requested token audience defaults to https://{kacho.domain} (exactly what the
    # gateway's ExpectedAudience accepts).
    bootstrapToken:
      signingKeySecretName: ""
      signingKeySecretKey: private_key_pem
    # jwks.encKey* — КЛЮЧ ОБЁРТКИ приватной половины подписного ключа (#897).
    #
    # СМЫСЛ РУЧКИ СМЕНИЛСЯ, ИМЯ — НЕТ, и это решение, а не недосмотр. Прежде она
    # шифровала строки снятого хранилища ключей, у которых не было ни одного
    # читателя. Теперь ею оборачивается приватная половина подписного ключа в
    # ключнице iam: платформа чеканит свои токены сама, приватная половина ложится
    # в базу, класть её открытым текстом нельзя — значит ключ обёртки нужен по
    # существу.
    #
    # Почему не переименовали. Переименование стоило бы правки КАЖДОГО профиля
    # развёртывания и дало бы окно, в котором старое имя молча игнорируется:
    # профиль, задавший прежнее имя, выглядел бы настроенным, а процесс читал бы
    # пустоту. Сменился смысл — он записан здесь и в godoc самой ручки.
    #
    # Второй ручки об этом предмете не заводится: одна из двух неизбежно
    # оказалась бы необязательной. Форма совпадает — страж уже требовал ровно
    # 32 байта, то есть размер ключа симметричного шифра, которым обёртка и
    # делается.
    #
    # Требуется production boot-guard'ом; без него iam refuse-to-start в
    # production-mode, и это верно и до, и после смены смысла — изменилось лишь
    # то, ЧТО перестанет работать при отсутствии ключа: теперь чеканка токенов.
    #
    # rotationDays СНЯТ и не возвращается: он объявлялся читаемым отчётом о
    # состоянии ключей, а ни одна строка Go не читала ни env, ни ключ конфигмапа.
    # Ротацию ключей ключницы задаёт config.authn.tokenSigning.keyLifetime ниже.
    jwks:
      encKeySecretName: kaname-jwks-enc-key
      encKeySecretKey: enc_key
    # secondFactor — КООРДИНАТА СЕКРЕТА с перечнем ключей обёртки секретов второго
    # фактора (Ф12, kacho#1281; переменная KANAME_SECOND_FACTOR_ENC_KEY).
    #
    # Требуется стражем старта; `optional: true` у ссылки оставляет решение об
    # отсутствии секрета стражу, который называет ручку, а не kubelet.
    #
    # Здесь КООРДИНАТА, а не величина: сама величина живёт в объекте Secret кластера,
    # потому что профиль отслеживается git. Умолчание имени — то же соглашение, что у
    # ключницы выше: один секрет на ручку, имя выводится из предмета.
    #
    # СВОЙ секрет, а не ключ ключницы (Ф12 Р2): предмет другой — секретов второго
    # фактора много, по одному на человека, — и смена одного перечня не обязана
    # останавливать выдачу токенов.
    secondFactor:
      encKeySecretName: kaname-second-factor-enc-key
      encKeySecretKey: enc_key
    # saKey — lifetime discipline for service-account keys (the machine
    # credential). Go duration strings.
    #   defaultTtl    — applied when the caller omits ttl_seconds. Finite by
    #                   design: "omitted ⇒ never expires" made the default call
    #                   shape the unbounded one.
    #   maxTtl        — inclusive ceiling; a larger ttl_seconds is refused
    #                   InvalidArgument before any OAuth2 client is registered.
    #   accessTokenTtl — per-client access_token_lifespan for tokens minted from
    #                   the key. EMPTY here on purpose: the env is then omitted
    #                   and the provider-global TTL applies, so an existing
    #                   deployment is unchanged. Production pins it explicitly
    #                   (values.prod.yaml); the local e2e stand deliberately does
    #                   NOT, because its previous issuer's access_token TTL is
    #                   widened to cover long serial newman waves.
    saKey:
      defaultTtl: "2160h"   # 90d
      maxTtl: "8760h"       # 365d
      accessTokenTtl: ""
      # Ключа `bindDpop` здесь НЕТ, и профиль, объявивший его, получает отказ
      # рендера (`kaname.refuseRetiredKnobs`, kacho#2949): токен-эндпоинт, где
      # обменивается ключ служебной учётки, доказательства владения не
      # принимает, и машинный токен `cnf` не несёт ни на одном профиле.

# ─── Умолчания глобальных значений службы личности ────────────────────────────
#
# АВТОРИТЕТНОЕ объявление — в умбрелле (values.yaml, `global.kacho.identity`):
# оттуда узел читают и этот подчарт, и стражи рендера зонта (почтовая полоса).
# Значения `global`, объявленные подчартом, соседям не раздаются — это свойство
# Helm, а не наше решение.
#
# Здесь они нужны ровно для одного: чтобы `helm template charts/kaname`
# рендерился САМ ПО СЕБЕ, без умбреллы. На таком рендере стоит самопроверка
# гейта сетевых политик (deploy/tests/helm/networkpolicy-egress-test.sh, случай
# «метка сайдкара безусловна»): без умолчаний страж рендера отказывает, вывод
# пуст, и гейт «пропускает» внесённый дефект — то есть перестаёт краснеть там,
# где обязан.
#
# Копия несёт ТОЛЬКО то, что читают шаблоны подчарта: имя доверяющей стороны
# ключей доступа и происхождение консоли (`kaname.identity.webauthnRpId`,
# `kaname.identity.consoleOrigin`) и почтовую полосу. Узлы, которые читали
# настройки прежнего поставщика личности, ушли вместе с ними (kacho#2818).
#
# Расхождение этой копии с авторитетной держит гейт, а не внимание:
# deploy/identity_global_defaults_agree_test.go.
global:
  kacho:
    identity:
      domain: api.kacho.cloud
      appSubdomain: app
      # Происхождение консоли. ПУСТО ⇒ вывести `https://<appSubdomain>.<domain>`.
      # Объявлено затем, чтобы посадка, где консоль стоит не там, была ВЫРАЗИМА:
      # стенд разработки раздаёт её по `http://console.kacho.local:28080` (kind
      # отображает 80 → 28080, слушателя на 443 нет).
      appBaseURL: ""
      # Имя доверяющей стороны ключей доступа. Пусто ⇒ `domain`.
      webauthnRpId: ""
      # ─── ПОЧТОВАЯ ПОЛОСА: УМОЛЧАНИЯ НЕТ (Р3 приёмки ID-MAIL-1) ──────────
      # Пусто ⇒ отказ, а не «разумное значение». Разбор — в умбрелле
      # (values.yaml, тот же узел): здесь копия ради одиночного рендера
      # подчарта, и второго изложения одного предмета тут не заводится.
      smtp:
        connectionURI: ""
        fromAddress: ""
        fromName: ""
        # Источник удостоверения, не сама величина (Р6). Разбор — в умбрелле.
        credentialSecret:
          name: ""
          key: ""
        # Якорь проверки сертификата узла — тоже источник (секрет и ключ), а не
        # величина. Разбор — в умбрелле.
        trustAnchorSecret:
          name: ""
          key: ""

# JWKS rotator CronJob — УДАЛЁН (был вестигиальным) и НЕ возвращается.
#
# Он ротировал хранилище подписных ключей, у которого не было ни одного читателя
# приватной половины: iam тогда токенов не чеканил (единственная подпись — RFC 7523
# client_assertion ПРЕДЪЯВЛЕННЫМ SA-ключом), а публиковалась только публичная
# половина, которой подписать ничего нельзя. Хранилище выглядело исправным, потому
# что запись в него удавалась. Само хранилище снято миграцией.
#
# Плюс к тому задание звало подкоманду, которой в бинаре нет, — то есть падало в
# 100% запусков с самого начала, и никто этого не замечал.
#
# ЧТО ЗАМЕНИЛО ЕГО ПРЕДМЕТ (#897). Платформа чеканит токены сама, и у ключницы
# есть ЧИТАТЕЛЬ приватной половины — подписант. Ротация живёт ВНУТРИ службы, а не
# в отдельном задании: состояния ключа переключаются под инвариантом базы («в
# наборе → подписывает», подписывающий ровно один), и внешнее задание не смогло бы
# ни соблюсти этот порядок, ни увидеть его нарушение. Срок ключа задаётся
# config.authn.tokenSigning.keyLifetime; ключ обёртки приватной половины — той же
# ручкой kacho.iam.jwks.encKey* выше.

name: kaname
replicas: 1

# АВТОМАСШТАБИРОВАНИЕ — ключ ОБЪЯВЛЕН, хотя и выключен, и это не украшение.
#
# Шаблон карты настроек его ЧИТАЕТ (`replica-budget`), а объявлен он не был ни
# здесь, ни одним профилем: ключ, которого нет ни в одном файле значений чарта,
# оператор не может ни найти, ни прочесть — он виден только тому, кто открыл
# наш шаблон. Из шести чартов дерева, читающих этот ключ, объявляли его пять.
#
# Величины подобраны так, чтобы обе ветви шаблона остались прежними:
#   `enabled: false`   — бюджет реплик берётся из `replicas`, как и до объявления;
#   `maxReplicas: ""`  — пустое значение сохраняет отказ рендера с его текстом,
#                        если автомасштабирование включат, не назвав потолка.
# Своего объекта автомасштабирования этот чарт не несёт: ключ описывает, из чего
# считается бюджет соединений, а не поднимает масштабирование.
autoscaling:
  enabled: false
  maxReplicas: ""
image:
  repository: kaname
  tag: dev
  # Optional immutable digest pin. When set (e.g. sha256:...) the container image
  # is referenced as `repository@digest` and `tag` is ignored — reproducible,
  # tamper-evident deploys (SLSA provenance). Override per env via
  # values.digests.example.yaml. Empty by default → tag-based reference.
  digest: ""
  pullPolicy: IfNotPresent

# INFRA sec-hardening — pod- and per-container securityContext floor applied to
# EVERY container of this workload (main + migrate init).
# runAsNonRoot + readOnlyRootFilesystem + drop ALL caps +
# no privilege escalation + seccomp RuntimeDefault (CIS Kubernetes 5.2 / PSS
# restricted). Overridable per profile; a writable emptyDir is mounted at /tmp
# so the read-only rootfs does not break scratch writes.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

ports:
  grpc: 9090
  internalGrpc: 9091
  # Docker Registry v2 `/iam/token` auth-server HTTP listener — external-reachable
  # (TLS terminated externally), distinct from metrics (:9095). The
  # registry data-plane TLS-sidecar proxies docker token exchange here.
  registryToken: 9096
  # Cluster-INTERNAL listener of the verification KEY SET: OUR key set at
  # `config.authn.tokenSigning.keySetPath` — the signer of every token the service
  # mints; one record, ours (kaname#361). The registry data-plane and the edge read
  # the record named by the token's issuer (`tokenAcceptance.issuerKeySets`).
  # ONE-WAY server-TLS, exposed ONLY on the kaname-internal Service (never
  # external, ban #6).
  jwksProxy: 9097
  # Собственные REST-фронты службы (KAN-REST-1). Вынесенная отдельным продуктом,
  # служба края платформы не имеет by construction — её HTTP-поверхность обязана
  # существовать сама. Фронтов ДВА, и раздельность есть свойство СОКЕТА:
  # «внутреннее не опубликовано наружу» проверяемо ровно тогда, когда оно
  # недосягаемо, а не отклоняется по дороге.
  #
  # УМОЛЧАНИЯ У НИХ НЕТ НАМЕРЕННО, и это то же решение, что у процесса (#2247).
  # Здесь стояли номера портов, поэтому состояние «фронта на этом стенде нет»
  # не выражалось профилем ВОВСЕ: всякая посадка поднимала оба фронта, ничего о
  # них не сказав, — при том что комментарий у рендера обещал обратное.
  #
  #   rest: 9098          # публичный фронт: объявляет ПРОФИЛЬ
  #   internalRest: 9099  # внутренний фронт: объявляет ПРОФИЛЬ
  # Слушатель полосы входа паролем (Ф3, kacho#1269): четыре глагола формы, на
  # которые край ретранслирует вход, выход, смену пароля и признак формы.
  # Умолчания нет по той же причине, что у фронтов: незаданный адрес — отказ
  # старта с именем ручки
  # (`KANAME_API_SERVER__LOGIN_LANE_ENDPOINT`). Порт свой — от фронтов отличен.
  #   loginLane: 9100     # объявляет ПРОФИЛЬ (см. values.prod.yaml умбреллы)

service:
  public:
    type: ClusterIP
    port: 9090
    # Публичный REST-фронт службы. Номер порта Service выводится из объявленного
    # порта фронта (`ports.rest`), если профиль не назвал его отдельно: одно
    # объявление фронта — один источник, и Service не может указать туда, где
    # контейнер не слушает.
    #   restPort: 9098    # объявляет ПРОФИЛЬ
  internal:
    type: ClusterIP
    port: 9091
    # Внутренний REST-фронт: выставлен ТОЛЬКО на внутренний Service. Номер
    # выводится из `ports.internalRest`, если профиль не назвал его отдельно.
    #   internalRestPort: 9099   # объявляет ПРОФИЛЬ
    # Слушатель полосы входа паролем (Ф3): выставлен ТОЛЬКО на внутренний
    # Service — его единственный вызывающий край платформы. Номер выводится из
    # `ports.loginLane`, если профиль не назвал его отдельно.
    #   loginLanePort: 9100      # объявляет ПРОФИЛЬ
    # Cluster-INTERNAL key-set listener port, exposed ONLY on kaname-internal
    # (never the public Service, ban #6). Consumed by service-internal.yaml —
    # the registry data-plane fetches the service's key set from here.
    jwksProxyPort: 9097

# Эти шесть ключей — умолчания ВСЕХ стеков, а не только стенда: боевые профили
# объявляют те же координаты у ВЛАДЕЛЬЦА (`pg-iam.auth`), а не здесь, и адрес
# узла helm выводит из имени релиза и псевдонима подчарта. Почему стража на
# пустоту здесь нет и чем согласие сторон удержано —
# `docs/architecture/umbrella-subchart-defaults-name-the-release-it-installs.md`.
db:
  host: kacho-umbrella-pg-iam
  port: "5432"
  user: iam
  name: kaname
  passwordSecretName: kacho-umbrella-pg-iam
  passwordSecretKey: password

config:
  logger:
    level: INFO
  # ТРИ СОБСТВЕННЫХ ПОТОЛКА СЛУЖБЫ (приёмка `KAN-QUOTA-1`, `П25`; задача #2117):
  # сколько аккаунтов заводит ОДНА личность и сколько путей входа держит человек и
  # машина. Авторитета величин у этих видов больше нет — их объявляет посадка, и
  # страж старта не выпускает процесс без всех трёх.
  #
  # ЗДЕСЬ величины ОБЪЯВЛЕНЫ, а в чарте самой службы их нет намеренно, и различие
  # не в аккуратности: тот чарт ставит ЧУЖОЙ оператор в своём облаке, и выбирать за
  # него, сколько аккаунтов держит его личность, мы не вправе. Зонт — объявление
  # НАШЕГО стенда, и не назвать величину значит не поднять стенд вовсе.
  #
  # Числа — те, которыми продукт жил до `П25` (посев применённой миграции): перевод
  # источника величины не меняет наблюдаемого. Профиль вправе их переопределить.
  ownCeilings:
    accountsPerIdentity: 5
    credentialsPerUser: 12
    credentialsPerServiceAccount: 24
    # ЧЕТВЁРТЫЙ потолок — ключи доступа человека (Ф7, kacho#1273; Р8, Ф7-38).
    #
    # Объявлен здесь по тому же доводу, что три выше: зонт — объявление НАШЕГО
    # стенда, и не назвать величину значит не поднять стенд вовсе. Проверка
    # потолков у службы БЕЗУСЛОВНА (`validate.go`): она не смотрит ни на режим, ни
    # на посадку, поэтому незаданный потолок роняет старт.
    #
    # Пин службы (`cbd729cfa9b1`, kacho#2915) этот потолок ЧИТАЕТ: четвёртая
    # строка таблицы пришла в `39628487` (kaname#270), и величина — условие
    # старта. Ключ заведён здесь раньше подъёма пина намеренно: обратный порядок
    # (поднять пин, потом дописать чарт) дал бы стенд, который не поднимается ни
    # при каком профиле.
    accessKeysPerUser: 8
  # ─── почта службы (приёмка NTF-2 службы Р4, NTF2-33; NTF-1 Р9) ─────────────
  # ФЛАГА ЗДЕСЬ НЕТ (CX1-111 (в), CX1-112): флаг почты службы — вывод помощника
  # `kacho.notifications.enabledFor` над `global.kacho.notifications`, которые
  # объявляет только зонтик. Ключ `config.notifications.enabled`, заданный любым
  # слоем, — отказ стража зонтика с полным путём; умолчание здесь делало бы этот
  # отказ срабатывающим на каждом рендере.
  notifications:
    # ─── полоса отсечки выдачи уведомлений (приёмка NTF-1 Р5, NTF1-F20; Д112 (в))
    # Ключ процесса `notifications.cutoff-guard` — условие старта пина
    # `745640d6c296` и новее: служба выдачи собирается всегда, её строитель без
    # величины отказывает в старте; граница [1s..10m] судится им же. Умолчание
    # здесь — решение о ЗОНТЕ: подчарт рендерят и отдельно (гейты дерева), и без
    # величины такой рендер не собирается; профили стендов объявляют её сами. Незаданная,
    # пустая, нулевая либо не-длительность — отказ рендера с именем ключа.
    cutoffGuard: 30s
  # ─── потолки приглашений (приёмка NTF-2 службы Р7, Р8; kacho#2915) ─────────
  # Условие старта на ЛЮБОЙ посадке, умолчания нет ни здесь, ни у процесса.
  # Объявляет ПРОФИЛЬ:
  #   invite:                          # KANAME_INVITE__*
  #     ttl: 168h                      # срок строки приглашения; 24h…720h
  #     accountPerDay: 200
  #     youngAccountPerDay: 50         # ≤ accountPerDay
  #     youngAccountAge: 720h
  #     pendingMax: 200
  #     recipientPerHour: 3            # ≤ recipientPerDay ≤ recipientPerDayAll
  #     recipientPerDay: 5
  #     recipientPerDayAll: 10
  apiServer:
    gracefulShutdown: 10s
    # ─── Docker Registry v2 token shim (`/iam/token`, :9096) ──────────────────
    # `issuer` пусто → built-in умолчание (api.kacho.local), пригодное лишь для
    # локального стенда; на развёрнутом окружении оно обязано нести РЕАЛЬНЫЙ
    # публичный хост реестра.
    #
    # `service` УМОЛЧАНИЯ НЕ ИМЕЕТ — ни здесь, ни в процессе (задача #1184).
    # Это имя службы РЕЕСТРА, у него две стороны, и объявляет его посадка ОДИН
    # раз: `global.kacho.registry.serviceAud`. Отсюда оно и приезжает
    # (см. kaname.laneServiceAud). Встроенное умолчание, стоявшее прежде,
    # было вторым объявлением того же предмета и молча расходилось с именем,
    # которое реестр называет докер-клиенту. Задать ключ ниже можно — но только
    # при ОДИНОЧНОЙ установке чарта; задать его И источник, но по-разному, —
    # отказ рендера с обеими величинами. Полоса поднята, а имени нет нигде —
    # отказ старта процесса.
    #
    # `service` — это НЕ только fallback для `?service=`: оно же адресат `aud`,
    # который полоса чеканит (#321). Расхождение с тем, что docker шлёт в
    # `?service=`, ломает login: shim отдаёт 401 → docker: unauthorized.
    #
    # `issuer` — `iss` + realm в WWW-Authenticate; должен совпадать с realm'ом
    # data-plane реестра (KACHO_REGISTRY_TOKEN_REALM).
    registryToken:
      issuer: ""
      service: ""
  repository:
    postgres:
      # Приведён к НАИМЕНЬШЕМУ пределу, который эта служба может встретить.
      #
      # Здесь стояло 100 — величина, выбранная безотносительно того, сколько
      # соединений принимает база. На стеках, где предел базы не объявлен ни
      # одним профилем, действует умолчание сборки образа (100), из которых
      # обычным клиентам достаётся 97: пул одной реплики не помещался ЦЕЛИКОМ,
      # а при пяти репликах объявленный потолок (500) превышал принимаемое в
      # два с половиной раза.
      #
      # 80 = 97 доступных − запас на СОБСТВЕННЫЕ непуловые соединения службы
      # (ожидание оповещений и опросчики очередей; замером #750 их около
      # четырнадцати на реплику). Это потолок посадки, а не настройка
      # производительности: узким местом в том же замере была не глубина пула,
      # а процессор базы.
      #
      # Держат это число два механизма: deploy/pool_fits_database_test.go — по
      # объявлению, до развёртывания; загрузочный страж службы — по ФАКТИЧЕСКОМУ
      # пределу, спрошенному у базы. Растить число реплик, не уменьшив пул,
      # страж не даст: он откажет в старте.
      maxConns: 80
      sslMode: disable
  # Секция `authz` снята вместе с внешним движком отношений (kacho#747, S6): её две
  # ручки переключали источник вердикта потипово и включали теневую сверку двух
  # форм. Источник один — переключать нечего, сверять не с чем. Профиль, сохранивший
  # эти значения, объявлял бы посадку, которой в дереве нет; держит это гейт
  # TestR7_3_32_NoProfileNamesTheRetiredLanding.
  authn:
    # secure-by-default (core rule #16); dev — явный opt-in dev-профиля.
    # ─── посадки личности здесь НЕТ (kacho#2818) ─────────────────────────────
    # Посадка у службы одна (kaname#363), и ключ посадки она отвергает при любом
    # значении. Ручка `identityProvider` снята вместе с читателем; профиль,
    # всё ещё её объявляющий, получает отказ рендера (`kaname.refuseRetiredKnobs`).
    # ─── полоса входа паролем (Ф3, kacho#1269) ─────────────────────────────
    # Рендерится в config.yaml как authn.login.* (env-override:
    # KANAME_AUTHN__LOGIN__<KEY>). Каждая величина — условие старта; умолчания нет
    # ни у одной, пустое значение — отказ старта с именем ручки. Образец — тот же,
    # что у собственного чарта службы:
    #   login:
    #     sessionTtl: 24h               # абсолютный срок нашей сессии
    #     cookieDomain: none            # `none` — печенье только на хост (#1222)
    #     addressAttempts: 5            # неверных предъявлений на адрес почты…
    #     addressWindow: 15m            # …за окно
    #     sourceAttempts: 50            # …и на источник запроса за окно
    #     sourceWindow: 15m
    #     passwordMinLength: 8
    #     breachCheck: disabled         # `enabled` | `disabled` — проверка утечек
    #     breachCheckUrl: https://…     # авторитет утечек; обязателен при `enabled`
    #     hasherFormat: argon2id        # чем ПИСАТЬ новый материал
    #     hasherMemory: 65536           # KiB на одну проверку
    #     hasherIterations: 3
    #     hasherParallelism: 4
    #     verifierCapacity: 8           # одновременных проверок пароля
    #     memoryReserveBytes: 268435456 # резерв памяти процесса сверх проверяющего
    #     recoveryCodeTtl: 5m           # срок кода восстановления доступа (Ф5,
    #                                   # kacho#2701; KANAME_AUTHN__LOGIN__RECOVERY_CODE_TTL)
    #     # подтверждение адреса (kaname#456, Р7, Р9) — пять величин без умолчания,
    #     # KANAME_AUTHN__LOGIN__VERIFICATION_{CODE_TTL,CODE_ATTEMPTS,RESEND_INTERVAL,
    #     # RESEND_LIMIT,RESEND_WINDOW}; величины профиля продукта:
    #     verificationCodeTtl: 30m        # срок кода подтверждения от выдачи письма
    #     verificationCodeAttempts: 5     # неподошедших предъявлений на код
    #     verificationResendInterval: 60s # промежуток между письмами одному человеку
    #     verificationResendLimit: 5      # писем одному человеку за окно
    #     verificationResendWindow: 24h   # скользящее окно счёта писем
    #     # ПОЧТОВЫЕ РУЧКИ ТАБЛИЦЫ Р8 (приёмка NTF-2 службы; kacho#2915) — условие
    #     # старта НА ЛЮБОЙ ПОСАДКЕ; умолчания нет ни у
    #     # одной (KANAME_AUTHN__LOGIN__{REGISTRATION_CODE_TTL,MAIL_WINDOW__*,
    #     # ATTEMPTS__*,MAIL_THROTTLED_INTERVAL,TRUSTED_DEVICE__*}); границы и
    #     # порядки судит страж старта. Образец — ориентиры базового профиля:
    #     registrationCodeTtl: 60m        # 5m…24h, не короче firstPause окна
    #     mailWindow:                     # окно адресата по назначению письма —
    #       recovery:                     # recovery · verification · registration,
    #         firstPause: 60s             # у каждого пять одинаковых ключей
    #         secondPause: 5m
    #         perHour: 3
    #         perDay: 5
    #         floorInterval: 6h
    #     attempts:                       # перебор кода
    #       addressSourcePerWindow: 5
    #       window: 15m
    #       addressFailureCeiling: 100
    #     mailThrottledInterval: 168h     # письмо о торможении; 24h…720h
    #     trustedDevice:                  # метка доверенного устройства
    #       ttl: 2160h
    #       recoveryPerDay: 2
    # ─── файлы ключей почтовой полосы (NTF-2 службы З18; kacho#2915) ──────────
    # Рендерится в config.yaml как authn.secrets.{mail-window,device-label}-key-file
    # — пути ВЫВОДЯТСЯ из каталога ниже и имён файлов шаблона. Том из объекта
    # Secret `secretName` (ключи `mail-window.key` и `device-label.key`, случайные
    # байты не короче 32 каждый) БЕЗУСЛОВЕН: служба без файлов не стартует ни на
    # какой посадке. Имя — объявление НАШЕГО стенда той же формы, что
    # `db.passwordSecretName` и `platform.hooks.tokenHookSecretName` выше: объект
    # с этим именем заводит посев стенда (deploy/scripts/dev-prod-secrets.sh,
    # однажды), на площадке — оператор (ведомость производителей
    # helm/umbrella/cutover-fe3455.sh). Профиль, сменивший имя на пустое либо
    # пробельное, получает отказ рендера с именем ключа, а не том без имени.
    secrets:
      secretName: kaname-mail-keys
      mountPath: /etc/kaname/secrets   # <mountPath>/{mail-window.key,device-label.key}
    # ─── регистрация нашей полосой (Ф4, kacho#2699) ─────────────────────────
    # Рендерится в config.yaml как authn.registration.* (env-override:
    # KANAME_AUTHN__REGISTRATION__<KEY>). Обе величины — условие старта,
    # умолчания нет ни у одной (Ф4 Р5, Ф4-18/19). Первое
    # заведение аккаунта — сама регистрация — проходит безусловно; величина
    # ограничивает следующие за окно, 0 законен («сверх первого — ни одного»).
    # Образец — величина справочника службы (3 за 1 ч):
    #   registration:
    #     admissionsPerWindow: 3        # KANAME_AUTHN__REGISTRATION__ADMISSIONS_PER_WINDOW
    #     admissionWindow: 1h           # KANAME_AUTHN__REGISTRATION__ADMISSION_WINDOW
    #
    # ─── окно свежести правки своих данных (Ф12, kacho#1281) ──────────────────
    # Рендерится в config.yaml как authn.self-service-freshness (env-override:
    # KANAME_AUTHN__SELF_SERVICE_FRESHNESS).
    #
    # Условие старта: заведение и подтверждение второго
    # фактора требуют предъявления не старше окна, и тем же окном ограничен срок
    # неподтверждённого заведения. УМОЛЧАНИЯ НЕТ намеренно — перенос прежней величины
    # (15 мин) объявляет профиль, где его видит читающий, а не построение, где его не
    # видит никто.
    #   selfServiceFreshness: 15m
    #
    # ─── привязка ключей доступа (Ф7, kacho#1273) ─────────────────────────────
    # Рендерится в config.yaml как authn.access-keys.* (env-override:
    # KANAME_AUTHN__ACCESS_KEYS__{RP_ID,ORIGINS,ALGORITHMS}).
    #
    # Три величины КОНТРАКТА, каждая — условие старта;
    # умолчания нет ни у одной, и это не забывчивость:
    #   rp-id      — доменное имя установки строчными, без схемы, порта и пути: к
    #                нему браузер привязывает КАЖДЫЙ ключ (WebAuthn L2 §5.1.3).
    #                Ручки в этом блоке у него НЕТ (kacho#2905): чарт берёт его из
    #                узла `identity` раздела `global` — `webauthnRpId`, а пусто —
    #                `domain`, одним шаблоном (`kaname.identity.webauthnRpId`).
    #                Второе объявление рядом с общим разошлось бы с ним молча, а
    #                ключи, привязанные не к тому имени, перестают предъявляться.
    #                Объявленный здесь `rpId` роняет рендер с именем ключа;
    #   origins    — перечень происхождений консоли `https://хост[:порт]`, каждое
    #                под именем доверяющей стороны; сверяется побайтово. ПУСТОЙ
    #                список — законная величина «никого»: служба стартует и
    #                отвергает всякий ключ. Незаданный перечень — отказ старта:
    #                «принимаем любое» не политика, а отсутствие привязки.
    #                `originFromConsole: true` вместо перечня — происхождение
    #                консоли посадки из того же узла (`appBaseURL`, а пусто —
    #                `https://<appSubdomain>.<domain>`); обе ручки сразу — отказ
    #                рендера;
    #   algorithms — идентификаторы COSE: -7 (ES256), -8 (EdDSA), -257 (RS256).
    #                Пустого «никого» здесь не бывает — перечень без единого
    #                алгоритма делает церемонию невыполнимой.
    #
    # Образец НЕРЕЗОЛВИМЫЙ намеренно (RFC 2606) и согласован сам с собой: хост
    # происхождения лежит под именем доверяющей стороны, иначе страж отверг бы и
    # образец (имя — `webauthnRpId: access.example.invalid` узла `identity` в
    # `global`).
    #   accessKeys:
    #     origins:
    #       - https://console.access.example.invalid
    #     algorithms: [-7, -257]
    # ─── своя чеканка токенов (#897) ──────────────────────────────────────────
    # Рендерится в config.yaml как authn.token-signing.* (env-override:
    # KANAME_AUTHN__TOKEN_SIGNING__<KEY>).
    #
    # ВЫКЛЮЧЕНА ПО УМОЛЧАНИЮ, и это не осторожность, а форма стража: пока чеканка
    # выключена, её настройки не требуются — страж, требующий того, чем не
    # пользуются, отказывает в старте без предмета. ВКЛЮЧЁННАЯ чеканка требует их
    # ВСЕ, и каждое незаданное значение — отказ в старте с именем настройки.
    #
    # Асимметрия цены, из которой это выведено: слишком строгая настройка даёт
    # отказ В СТАРТЕ — видимый сразу; слишком слабая даёт принимаемый чужой токен,
    # не видимый никогда. Поэтому пустое значение здесь означает НЕ «взять
    # разумное», а «не сужаем» — и отвергается.
    tokenSigning:
      # enabled — включена ли своя чеканка. false → блок не рендерится вовсе, и
      # ключница с подписантом не поднимаются.
      enabled: false
      # issuer — НАШ издатель. Попадает в каждый выпущенный токен и в привязку
      # «издатель → источник набора» на приёмной стороне. Пусто при enabled:true
      # = отказ в старте: незаданный издатель означает «любой», то есть токен
      # любого происхождения принимался бы как наш.
      issuer: ""
      # algorithm — алгоритм, закрепляемый за порождаемым ключом 1:1. Значение
      # вне закрытого словаря платформы (RS256 | ES256 | EdDSA) = отказ в старте.
      # Умолчания у алгоритма подписи нет намеренно: подпись умолчанием — решение,
      # принятое за оператора.
      algorithm: ""
      # allowedAlgorithms — перечень допустимых алгоритмов ПРИЁМА, через запятую.
      # Страж считает ЭЛЕМЕНТЫ, а не длину строки: одинокая запятая непуста по
      # длине и пуста по существу, а пустой перечень означает «принимаем любой» —
      # и обесценивает заодно сверку «алгоритм токена равен алгоритму ключа»,
      # которая на этом перечне и держится. Алгоритм чеканки обязан входить сюда:
      # иначе мы выпускали бы то, что сами же отвергаем.
      allowedAlgorithms: ""
      # keySetPath — путь НАШЕЙ записи публикуемого набора на cluster-внутреннем
      # слушателе (:9097). ОБЪЯВЛЯЕТСЯ, а не выводится из издателя: производный
      # путь получается у ВСЯКОГО издателя, поэтому состояние «записи источника
      # нет» не наступало бы никогда, и страж старта стал бы тождественно
      # истинным. Путь собственный, а не канонический well-known: по каноническому
      # тот же слушатель отдаёт зеркало прежнего издателя, и оно остаётся там,
      # пока прежний издатель принимается.
      keySetPath: /.well-known/kaname/jwks.json
      # keyLifetime — срок ключа ключницы (Go duration). Ротация исполняется
      # внутри службы; отдельного задания для неё нет и не заводится.
      keyLifetime: 2160h
    # ─── приём ПРЕДЪЯВЛЕННОГО арендатором удостоверения (#2077, #2191) ────────
    # Рендерится в config.yaml как authn.presented-credential.* (env-override:
    # KANAME_AUTHN__PRESENTED_CREDENTIAL__<KEY>).
    #
    # ЗАЧЕМ ЭТО ЕСТЬ. Собственный публичный REST-фронт службы (ports.rest)
    # поднимается на ЛЮБОЙ посадке, и всякий, кто до него дотянулся, приходит
    # обычным клиентом: модульного сертификата у арендатора нет и быть не может,
    # а нашего края перед этим фронтом нет by construction. Предъявленное
    # удостоверение — единственное, чем он может назваться. Без читателя фронт
    # отвечает на годное удостоверение ровно тем же, чем на негодное, и это
    # выглядит настроенным.
    #
    # ВЫКЛЮЧЕН ПО УМОЛЧАНИЮ — той же формой стража, что и чеканка выше: пока
    # приём выключен, его настройки не требуются. ВКЛЮЧЕНИЕ — РЕШЕНИЕ ПРОФИЛЯ,
    # а не сборки: умолчание, включающее читателя, приняло бы за оператора
    # решение о том, что служба принимает с провода.
    #
    # СВЯЗЫВАНИЕ, которое это держит: в боевой посадке поднятый публичный фронт
    # ТРЕБУЕТ читателя — служба не стартует, называя обе ручки
    # (PresentedCredentialConfig.ValidateBinding). Половина пары хуже отсутствия
    # обеих.
    presentedCredential:
      # enabled — читает ли публичный слушатель предъявленное удостоверение.
      # Требует включённой своей чеканки: подпись проверяется НАШИМ реестром
      # ключей, и без неё реестра нет вовсе.
      enabled: false
      # audience — адресат ЭТОЙ поверхности. Токен, выданный для другой,
      # здесь не годится: адресат есть свойство поверхности предъявления, а не
      # издателя. Пусто при enabled:true = отказ в старте: незаданный адресат
      # означает «не сужаем», то есть токен любой поверхности этой установки
      # принимался бы на публичном слушателе.
      audience: ""
      # revocationCacheTtl — срок кеша ПОЛОЖИТЕЛЬНОГО вердикта об отзыве, он же
      # ОБЪЯВЛЕННОЕ ОКНО ОТЗЫВА: столько времени субъект с отобранным правом
      # продолжает проходить. Величина оператора, а не платформы, — поэтому
      # объявляется, а не подставляется. Срок, дотягивающий до жизни самих
      # токенов, окном быть перестаёт, и страж старта это отвергает.
      revocationCacheTtl: ""
    # ─── bootstrap-mint caller allow-list (#58 hardening) ────────────────────
    # SPIFFE SANs of the client certificates permitted to call
    # InternalBootstrapTokenService/MintBootstrapToken on :9091 — the cluster-admin
    # token mint. It has NO ReBAC gate (it exists to obtain the FIRST token, before
    # any relation exists) and NO gateway REST route, so this list IS the
    # authN+authZ gate; authzguard.CallerPolicy enforces it in EVERY mode.
    #
    # DEFAULT EMPTY = deny everyone (the mint has no default caller). An operator
    # names the identity explicitly — the umbrella issues one for exactly this
    # purpose (mtls.bootstrapOperator → spiffe://kacho.cloud/ns/kacho/sa/
    # kacho-bootstrap-operator). In production an ENABLED mint (signing key
    # present) with an empty list REFUSES TO BOOT (Config.Validate, core rule #16),
    # so the insecure combination cannot be reached by omission.
    #
    # Rendered into config.yaml as authn.bootstrap-mint.allowed-client-sans (env
    # override: KANAME_AUTHN__BOOTSTRAP_MINT__ALLOWED_CLIENT_SANS, comma-separated).
    bootstrapMint:
      allowedClientSANs: []
    # ─── who may FORWARD an end-user identity to iam ─────────────────────────
    # Client-certificate SPIFFE SANs permitted to send x-kacho-principal-* headers.
    # Rendered into config.yaml as authn.trusted-forwarder-sans (env override:
    # KANAME_AUTHN__TRUSTED_FORWARDER_SANS, comma-separated) and fed into
    # grpcsrv.WithTrustedForwarders on BOTH gRPC listeners.
    #
    # DEFAULT NON-EMPTY, unlike bootstrapMint above, and for the opposite reason:
    # there an empty list denies everyone (fail-closed), here an empty list TRUSTS
    # EVERYONE — the corelib contract narrows the circle only when the list is
    # non-empty. A profile that forgot this knob would ship "any pod with an
    # internal-CA certificate may act as any tenant". Production refuses to boot on
    # an empty list, so the omission is loud rather than silent, but the default
    # must still be safe.
    #
    # The entries are the senders that legitimately speak for a user, each
    # established from a runtime edge rather than by name:
    #   - api-gateway — the front door; the only sender on the whole surface.
    #   - vpc/compute/nlb/storage/registry — ProjectService.Get on :9090 (project
    #     existence + owning account on their own Create path) and
    #     InternalIAMService.Check / fga-proxy on :9091, all under the end user.
    #   - geo — InternalIAMService.Check on :9091 under the end user.
    #
    # The ns segment is NOT uniform and must not be assumed: it comes from each
    # peer chart's own mtls.spiffe.namespace, which defaults to the release
    # namespace but is overridden by storage (kacho-storage). An entry copied
    # "by pattern" from a neighbour would not
    # match the certificate that peer actually presents, and the effect would be a
    # SILENT denial of service on a working path — the peer stays itself, its
    # forwarded identity is scrubbed, and its read answers as if unauthenticated.
    # deploy/tests/helm/iam-trusted-forwarder-test.sh derives the expected set by
    # rendering the peer charts, so a chart that moves namespace fails loudly here
    # instead of at runtime.
    #
    # WHICH RPC each may reach is a separate, narrower decision made in code
    # (authzguard.PublicPeerCallableRPCs / GatewayFrontedInternalRPCs).
    trustedForwarderSANs:
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-api-gateway
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-vpc
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-compute
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-nlb
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-storage
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-registry
      - spiffe://kacho.cloud/ns/kacho/sa/kacho-geo
      # Здесь стояла запись оператора сети — компонента с таким именем в дереве нет,
      # и репозитория под него не существует. Круг доверенных отправителей пинится по
      # ФАКТИЧЕСКИМ отправителям: запись под несуществующего разрешала бы говорить за
      # пользователя предъявителю сертификата, которого мы не выпускаем. Появится
      # компонент — запись вернётся вместе с его кодом (решение владельца 2026-08-09).

initContainer:
  migrator:
    enabled: true
    command: ["/usr/local/bin/kaname-migrator", "up"]

# Ресурсы контейнера службы. `requests.memory` НЕ читается: запрос памяти равен `limits.memory` — пределу,
# который несёт бюджет полосы входа (`kaname.containerResources`, kacho#2727).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

env: {}

# ─── SEC-H mTLS — оба листа, per-edge opt-in (cert-manager internal-CA) ──
# Служба — лист графа: соседей она не зовёт, и в этом смысле «leaf-owner»
# остаётся верным. Но ОДНОГО листа сертификата ей не хватает, и здесь стояло
# обратное — «holds no outgoing peer-dial edges … wires the SERVER only».
#
# Утверждение пережило свой предмет: собственные REST-фронты службы
# дозваниваются до её ЖЕ gRPC-слушателя, то есть исходящее соединение у неё
# есть — просто оно идёт в петлю, а не к соседу. Пока клиентского листа не было,
# фронт предъявлял серверный; тот выписан БЕЗ `client auth`, слушатель отвергал
# его на рукопожатии, и каждый доходивший до обработчика запрос возвращался
# арендатору как 503 (задача #2186).
#
# enable=false (умолчание) → секреты не монтируются и переменные транспорта не
# эмитятся → прежняя посадка стенда разработки, байт-в-байт. При enable=true:
#   - монтируется kaname-server-tls (tls.crt/tls.key/ca.crt) в томе mtls-server
#     по пути <mountPath>/server — ЛИСТ СЛУШАТЕЛЯ, назначение `server auth`;
#   - монтируется kaname-client-tls в томе mtls-client по пути <mountPath>/client
#     — ЛИСТ КЛИЕНТА, назначение `client auth`, с SPIFFE-именем в SAN;
#   - эмитятся, через corelib LoadPrefixed("KANAME"):
#       KANAME_PUBLIC_SERVER_MTLS_*   (публичный слушатель :9090)
#       KANAME_INTERNAL_SERVER_MTLS_* (внутренний слушатель :9091)
#     каждый = {ENABLE, CERTFILE, KEYFILE, CLIENTCAFILES} → RequireAndVerifyClientCert
#     по корням внутреннего центра (ca.crt в секрете слушателя);
#       KANAME_REST_UPSTREAM_MTLS_*   (удостоверение фронта перед своим же
#     слушателем) = {ENABLE, CERTFILE, KEYFILE, CAFILES, SERVERNAME} — и все три
#     файла берутся из КЛИЕНТСКОГО секрета, а не из серверного.
mtls:
  enable: false
  # ОБЩАЯ РУЧКА — УМОЛЧАНИЕ ДЛЯ ПОЛИСТЕННЫХ НИЖЕ, А НЕ РЕШЕНИЕ О ТРАНСПОРТЕ.
  # Отдельная от `enable` НАМЕРЕННО: стенд разработки поднимает gRPC-слушатели под
  # взаимным TLS (enable=true) и при этом держит HTTP-слушатели открытыми — их
  # вызывающие на том стенде клиентских сертификатов не носят. Умолчание false ⇒
  # переменные транспорта не эмитятся ⇒ слушатели открыты (байт-в-байт как было).
  #
  # БОЕВОЙ ПРОФИЛЬ НА НЕЁ НЕ ОПИРАЕТСЯ: он объявляет каждую полистенную ручку явно.
  # Величина, которую построение подставляет само, предметом стража быть не может —
  # он зелен при любом входе. Держит это deploy/kaname_listener_knobs_test.go.
  httpListeners: false
  # ─── ПОЛИСТЕННЫЕ РУЧКИ: ОДНА РУЧКА — ОДИН СЛУШАТЕЛЬ ────────────────────────
  #
  # Пусто ⇒ берётся общая ручка выше. Здесь они закомментированы затем, чтобы
  # умолчание чарта осталось прежним; боевой профиль обязан объявить ВСЕ.
  #
  # ПОЧЕМУ ПО ОДНОЙ НА СЛУШАТЕЛЯ, А НЕ ПО ГРУППАМ. Здесь стояли две групповые
  # ручки — одна на «вебхуки и скрейп», вторая на «оба REST-фронта», — и внутри
  # каждой пары требования оказались ПРОТИВОПОЛОЖНЫМИ. Комментарий рядом честно
  # называл ловушку словами «включишь — падает выдача токенов, выключишь — не
  # стартует сервис»: то есть верного значения у ручки не было НИ ОДНОГО, и
  # боевой профиль был невыразим by construction. Служба не поднималась вовсе.
  #
  # metrics: false        # :9095 — скрейп счётчиков процесса
  # registryToken: false  # :9096 — докерная полоса выдачи токена
  # jwksProxy: false      # :9097 — набор ключей проверки подписи
  # publicRest: false     # :9098 — собственный публичный REST-фронт
  # internalRest: false   # :9099 — собственный внутренний REST-фронт
  # loginLane: false      # :9100 — слушатель полосы входа паролем (Ф3); транспорт
  #                       #         ВЗАИМНЫЙ, вызывающий — ровно край платформы
  # ОТКРЫТОГО ТЕКСТА КАК ОБЪЯВЛЕННОГО ИСКЛЮЧЕНИЯ БОЛЬШЕ НЕТ НИ У ОДНОГО СЛУШАТЕЛЯ.
  # Единственное стояло у слушателя обратных вызовов прежнего поставщика
  # личности; слушателя у службы нет (kaname#363), и исключение ушло вместе с
  # ним (kacho#2818).
  #
  # Per-edge TLS ClientAuth mode for the metrics listener. Default
  # server-tls-only: the metrics edge has no scrape client cert wired yet.
  # Flip to "mutual" when a client cert is provisioned (e.g. an internal-CA
  # Prometheus scrape client).
  metricsClientAuthMode: server-tls-only
  # jwks-proxy (:9097) HTTP listener ClientAuth mode. ONE-WAY server-tls-only ON
  # PURPOSE: the JWKS route serves PUBLIC OIDC verification keys and is
  # unauthenticated-by-design (a documented exception to authN-on-every-listener,
  # security.md) — the registry data-plane verifier fetches it with a plain https
  # client that presents NO client cert; RequireAndVerifyClientCert would reject the
  # handshake. Encryption + server-auth via the internal-CA leaf; internal-only surface.
  jwksProxyClientAuthMode: server-tls-only
  # docker-token listener (:9096) — ONE-WAY server-TLS: аутентификация вызывающего
  # на этом эндпоинте и ЕСТЬ предъявляемый им Basic (в этом его смысл); не хватало
  # шифрования и аутентификации СЕРВЕРА. mutual потребовал бы client-cert у
  # nginx-sidecar реестра, который его не носит.
  registryTokenClientAuthMode: server-tls-only
  # Собственные REST-фронты. Обе полосы — ONE-WAY server-TLS: до публичного
  # фронта дотягивается арендатор обычным HTTP-клиентом и клиентского
  # сертификата не носит, а RequireAndVerifyClientCert отверг бы его на
  # рукопожатии — то есть поверхность была бы недостижима ни для кого.
  # Вызывающего на ней аутентифицирует ПРЕДЪЯВЛЕННОЕ УДОСТОВЕРЕНИЕ, которое
  # проверяет звено собственного слушателя; TLS здесь даёт шифрование и
  # аутентификацию СЕРВЕРА, а не вызывающего.
  restClientAuthMode: server-tls-only
  internalRestClientAuthMode: server-tls-only
  # Слушатель полосы входа паролем (Ф3, kacho#1269) — ВЗАИМНЫЙ: вызывать его
  # вправе ровно край платформы, и слушатель судит его по SAN проверенного
  # клиентского сертификата (приёмка Ф3, Р16). Это единственное годное под `own`
  # значение: иной режим страж старта службы отвергает с именем ручки, поэтому
  # умолчание здесь не подставляет неверного; боевой профиль объявляет его явно.
  loginLaneClientAuthMode: mutual
  # ─── internal-CA leaf-cert issuance (this chart owns its Certificate, rule #1) ─
  # Листа ДВА, и это не симметрия ради симметрии. Серверный SAN покрывает оба
  # Service (публичный kaname :9090 и внутренний kaname-internal :9091) И зеркало
  # ключей :9097, которое живёт на том же имени, — SAN привязаны к хосту, а не к
  # порту, поэтому один лист терминирует и одностороннюю TLS зеркала, которой
  # доверяет плоскость данных реестра (registry-iam-jwks-unify).
  #
  # КЛИЕНТСКИЙ ЛИСТ ЗАВЕДЁН ЗАДАЧЕЙ #2186. Здесь стояло «SERVER cert only (no
  # client cert … it does not dial peers)», и это утверждение пережило свой
  # предмет: собственные REST-фронты службы дозваниваются до её же
  # gRPC-слушателя, то есть исходящее соединение у неё ЕСТЬ. Пока клиентского
  # листа не было, фронт предъявлял серверный — а тот выписан БЕЗ `client auth`,
  # и слушатель отвергал его на рукопожатии; каждый доходивший до обработчика
  # запрос возвращался арендатору как 503.
  #
  # Клиентский лист НЕ расширяет допуска: он лишь позволяет фронту завершить
  # рукопожатие. В круг тех, кто вправе говорить за пользователя
  # (`authn.trustedForwarderSANs`), эта личность не вносится, и решение о доступе
  # по-прежнему принимается по удостоверению, предъявленному арендатором.
  issuer:
    name: kacho-internal-ca
    kind: ClusterIssuer   # ClusterIssuer (cluster-scoped), NOT namespaced Issuer
  serverHosts: ["kaname", "kaname-internal"]
  spiffe:
    trustDomain: kacho.cloud
    namespace: kacho
    saName: kaname
  leafDuration: 2160h
  leafRenewBefore: 720h
  # cert-manager secret names. Пусто у клиентского означало бы «личности нет»:
  # блок клиентского сертификата в templates/certificate.yaml читает ИМЕННО этот
  # ключ, и без него он не срабатывает ни разу — молча, потому что шаблон
  # рендерится и под поднимается.
  serverSecretName: kaname-server-tls
  clientSecretName: kaname-client-tls
  mountPath: /etc/kaname/tls   # <mountPath>/server|client/{tls.crt,tls.key,ca.crt}

# metricsScrape — объявление СБОРА величин диагностической поверхности.
#
# Выключение требует ПРИЧИНЫ: пустая строка при enabled=false — это «забыли», и
# декларативная проверка не отличила бы её от «сбора здесь нет намеренно».
metricsScrape:
  enabled: true
  disabledBecause: ""  # port — тот же адрес, который процесс берёт из своей конфигурации.
  # Отдельного ключа портов у этого чарта нет, поэтому он объявлен здесь; там,
  # где ключ уже есть, аннотация читает ЕГО — два места об одном порте
  # разъехались бы молча.
  port: 9095

# ── ПОСАДКА БЕЗОПАСНОСТИ ─────────────────────────────────────────────────
# ОДИН адрес на весь флот: `authMode` в корне значений сервиса. Прежний адрес
# (config.authn.mode) снят; профиль, всё ещё задающий его, получает отказ
# рендера — молчаливого отката к умолчанию не будет.
authMode: production

# ── ДОСТАВКА МАНИФЕСТОВ МОДУЛЕЙ (kacho#1875) ─────────────────────────────
# Манифест модуля объявлен источником истины о том, что у платформы существует,
# а доехать до работающей службы ему было НЕЧЕМ: ни ручки каталога у процесса,
# ни монтирования у чарта. Здесь заводится вторая половина — первая живёт в
# конфигурации службы (секция `manifests`, см. templates/configmap.yaml).
#
# ИСТОЧНИК — ВНЕ РЕЛИЗА ОБРАЗА, И ЭТО ПРЕДМЕТ, А НЕ ДЕТАЛЬ. Манифест, запечённый
# в образ, оставляет отзыв модуля релизом iam — то есть не решает того, ради чего
# доставка заводится. Поэтому монтируется ИМЕНОВАННЫЙ ConfigMap, который ведёт
# тот, кто применяет манифесты, а не этот чарт: правка его содержимого есть
# операция над данными и релиза службы не требует.
#
# КТО ЕГО КЛАДЁТ (kacho#1901). Объект порождает `make module-manifests-configmap`
# (инструмент — corelib/modulemanifest/producer): он обходит `services/*/manifest.yaml`
# того же дерева и берёт ИМЯ ОБЪЕКТА из тех же профилей, что и helm, — отсюда,
# из `configMapName` ниже. Одно объявление на обе стороны: второе разошлось бы с
# первым молча, под смонтировал бы один объект, производитель положил бы другой,
# каталог доставки приехал бы пустым — и снаружи это неотличимо от «модулей нет».
#
# Цель зовёт КАЖДЫЙ путь выкатки ПЕРЕД первым прогоном helm — `dev-up`,
# `stack-up` и скрипт боевой площадки `helm/umbrella/cutover-fe3455.sh`: процесс
# читает каталог на старте и на пустом отказывается подниматься. Стенд ей
# называют явно (`MODULE_MANIFESTS_STACK=<стенд>`), а kind-стража она не несёт —
# он отвергал бы два боевых пути из трёх (kacho#1901). На посадке, поднимаемой не
# ими, объект кладут тем же инструментом руками:
#
#	go run ./tools/modulemanifests/cmd/module-manifests-configmap \
#	  -root . deploy/helm/umbrella/<профиль>… | kubectl -n <ns> apply -f -
#
# Профиль, не объявивший `configMapName`, доставку не заводит вовсе, и инструмент
# говорит это отдельным кодом возврата, а не отказом.
manifests:
  # configMapName — имя ConfigMap с манифестами модулей. Пусто = доставка не
  # заведена на этой посадке: том не монтируется, процесс получает пустой
  # `manifests.dir` и поднимается ровно как прежде.
  #
  # Ключ объявлен ПУСТЫМ, а не отсутствует: «доставки нет» — это решение,
  # принятое посадкой, и оно обязано быть написано, а не выведено из молчания.
  configMapName: ""
  # mountPath — каталог, в который том монтируется И из которого читает процесс.
  # ОДНО объявление на обе половины: два литерала разошлись бы молча, а процесс
  # читал бы пустой путь — состояние, снаружи неотличимое от «модулей нет».
  mountPath: /etc/kaname/manifests
  # required — опирается ли посадка на манифесты. Вместе с `configMapName` это
  # ПАРА, и страж старта отвергает её неполной В ОБЕ СТОРОНЫ (Config.Validate →
  # ManifestsConfig.Validate, kacho#1924):
  #
  #	configMapName пуст, required: false  — доставка не заведена, посадка поднимается
  #	configMapName назван, required: true — доставка заведена и обязательна
  #	configMapName пуст, required: true   — ОТКАЗ: опираемся и не сказали, откуда читать
  #	configMapName назван, required: false — ОТКАЗ: сказали откуда и объявили, что не опираемся
  #
  # Четвёртое сочетание прежде ПРИНИМАЛОСЬ и означало не то, что говорит: чтение
  # включает сам каталог, и сорванную доставку процесс отвергает независимо от
  # этой величины. Снимается доставка опустошением ИМЕНИ выше, а не отзывом опоры
  # здесь. Умолчания у каталога нет намеренно: подставленный был бы непуст всегда.
  required: false
  # composeModel — УЧАСТВУЮТ ли доставленные манифесты в модели прав установки
  # (kacho#1971). Не «читать манифесты»: чтение включает сам каталог выше.
  #
  # Величина меняет ПОВЕРХНОСТЬ посадки: пока сборки нет, правка карты настроек
  # кластера ни на что не влияет; с ней та же правка начинает модель прав
  # ОПРЕДЕЛЯТЬ. Поэтому объявление сборки обязывает назвать `admission` ниже, и
  # держит это страж старта службы — ОТКАЗ В ПУСКЕ, а не предупреждение.
  #
  # Ключ объявлен ЯВНО, а не опущен, по тому же доводу, что `configMapName`
  # выше: «сборки нет» — решение посадки, и оно обязано быть написано, а не
  # выведено из молчания. Умолчание — `false`: умолчание чарта достаётся всякой
  # посадке, ничего не объявившей, и включённая здесь сборка досталась бы каждому
  # стенду разом.
  composeModel: false
  # admission — КАКИМ ДОПУСКОМ судится собранная модель. Значение — из закрытого
  # набора службы (`ManifestsConfig`); перечень допустимых печатает отказ старта,
  # и второй копии этого перечня здесь не заводится: два места об одном предмете
  # разошлись бы молча — ни сборка, ни пробы такого расхождения не замечают.
  #
  #	composeModel: false, admission: ""      — сборка не заведена, посадка поднимается
  #	composeModel: true,  admission назван   — сборка заведена и суждена
  #	composeModel: true,  admission: ""      — ОТКАЗ: собираем и не сказали, чем судим
  #	composeModel: true,  доставки нет       — ОТКАЗ: собирать не из чего
  #
  # Умолчания у допуска нет намеренно: подставленный был бы непуст ВСЕГДА, и
  # собранная модель выглядела бы суждённой на посадке, которая допуска не
  # объявляла. Состояния «сборка без допуска» не существует.
  admission: ""
