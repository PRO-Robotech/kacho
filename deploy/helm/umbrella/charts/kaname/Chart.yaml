apiVersion: v2
name: kaname
version: 1.2.0
appVersion: 1.2.0
type: application
description: "Kaname — Account / Project / User / ServiceAccount / Group / Role / AccessBinding. Решение о доступе принимает реляционная модель прав в собственной базе службы: наложение правил снято вместе со своим потребителем (#2141)."

# ИМЯ ЧАРТА НЕ АДРЕСУЕТ: в дереве их ДВА с этим именем. Второй — чарт продукта,
# уезжающий тому, кто ставит Kaname отдельно (`services/iam/deploy/Chart.yaml`),
# и он НЕ ставится ни одним стеком этого дерева.
#
# Различие объявлено ДАННЫМИ, а не комментарием, потому что предмет — ловушка
# замера: за две задачи подряд вердикт по открытому предмету был вынесен не по
# тому чарту. Разбор и цена трёх исходов — в шапке чарта-тёзки; здесь он не
# пересказывается, иначе два места об одном предмете разойдутся.
#
# Держатель — `deploy/chart_name_addresses_exactly_one_chart_test.go`.
annotations:
  # Назначение поставки: этот чарт — часть НАШЕГО стенда, арендатору он не
  # уезжает. Отсюда и лицензия, отличная от лицензии тёзки.
  distribution: platform
  # Полный путь чарта-тёзки от корня монорепо; взаимность требует держатель.
  nameTwin: services/iam/deploy/Chart.yaml
