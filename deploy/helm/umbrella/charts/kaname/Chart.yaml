apiVersion: v2
name: kaname
version: 1.2.0
appVersion: 1.2.0
type: application
description: "Kaname — Account / Project / User / ServiceAccount / Group / Role / AccessBinding. Решение о доступе принимает реляционная модель прав в собственной базе службы: наложение правил снято вместе со своим потребителем (#2141)."

# ИМЯ ЧАРТА СНОВА АДРЕСУЕТ: в дереве он ОДИН с этим именем.
#
# Здесь стояло объявление различия — `distribution` и `nameTwin`, — заведённое
# потому, что тёзок было двое: этот подчарт стенда и чарт продукта, уезжавший
# тому, кто ставит Kaname отдельно. Продукт вынесен собственным репозиторием,
# тёзка уехал вместе с ним, и объявлению стало НЕЧЕГО различать.
#
# Снято оно не «заодно», а по вердикту держателя
# (`deploy/chart_name_addresses_exactly_one_chart_test.go`): он краснеет на
# объявлении, у которого в дереве нет второго имени, — запись без предмета
# читается как действующее ограничение и переживает свою причину.
#
# Ловушка, ради которой различие заводилось, названа здесь и остаётся верной:
# за две задачи подряд вердикт по открытому предмету был вынесен НЕ ПО ТОМУ
# чарту. Появится второй тёзка — объявление обязано вернуться вместе с ним.
