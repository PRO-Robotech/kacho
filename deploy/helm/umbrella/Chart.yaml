apiVersion: v2
name: kacho-umbrella
version: 2.0.0
description: "Kachō Cloud Control Plane — umbrella chart (flat API + Operations). Bundles the control-plane services (api-gateway, vpc, compute, kaname, kacho-nlb, ui) with their per-service Postgres instances, the Ory identity tier (Kratos + Hydra), plus dev infrastructure (ingress-nginx, in-cluster. Matches the kind dev stand brought up by `make dev-up` (values.dev.yaml)."
#
# ТРИ ЧАРТА ЛЕЖАТ В `charts/` И НАМЕРЕННО НЕ ОБЪЯВЛЕНЫ ЗАВИСИМОСТЯМИ:
# kaname, kacho-geo, kratos-selfservice-ui. Их исходники
# версионируются здесь же, а `charts/` — это и есть каталог сабчартов: helm
# загружает оттуда всё, что является чартом, без всякого объявления.
#
# Объявить такой чарт зависимостью `file://./charts/<имя>` — значит попросить
# helm МАТЕРИАЛИЗОВАТЬ его в тот же каталог, где лежит исходник. Так и было, и
# после `helm dep update` каждый из них существовал в `charts/` ДВАЖДЫ:
# каталогом-исходником и собранным архивом. Какая из двух копий попадёт в рендер
# — не определено: замерено на неизменном дереве, шесть рендеров подряд дали
# каталог 5 раз и архив 1 раз.
#
# Чем это стоило: правка сабчарта могла не попасть в рендер, а ДВА РЕНДЕРА ОДНОГО
# И ТОГО ЖЕ ДЕРЕВА могли отличаться. На этом молча ослеп гейт привязки пода к
# содержимому образа: его самопроверка вносит дефект в каталог и требует красного,
# а расхождение копий выглядело для гейта как «шаблон пода изменился», то есть как
# доказательство привязки. Гейт отчитывался зелёным о workload'е, у которого
# привязки в этот момент не было вовсе.
#
# Здешний же комментарий про `uif` эту ловушку называл прямым текстом — «два
# одноимённых сабчарта делают рендер helm недетерминированным», — и вендоренные
# чарты её воспроизводили. Запрет держит гейт internal/repohygiene/subchartdup_test.go.
dependencies:
  - name: ingress-nginx
    version: 4.x
    repository: https://kubernetes.github.io/ingress-nginx
    # condition-gated: clusters that expose via LoadBalancer Services disable the
    # kind-style ingress-nginx via `ingress-nginx.enabled: false`. Without the
    # `condition:` the sub-chart installs unconditionally and its controller hangs
    # Pending (no node-label `ingress-ready=true`) → `helm --wait` timeout.
    condition: ingress-nginx.enabled

  # ─── Per-service Postgres (database-per-service, workspace CLAUDE.md ban #8) ──
  # pg-vpc / pg-compute condition-gated ровно как pg-nlb / pg-storage / pg-registry.
  # Прежде эти двое были ЕДИНСТВЕННЫМИ базами без условия — не по решению, а по
  # умолчанию: их просто не дописали, когда условия заводили остальным. Цена
  # измерена: pg-vpc просит 2Gi/200m, pg-compute — 1Gi/200m, то есть 3Gi из 8.3Gi
  # запросов всего стенда нельзя было не поднимать даже там, где ни vpc, ни compute
  # не участвуют. Умолчание — `true` (условие с отсутствующим значением helm
  # игнорирует, зависимость остаётся включённой), поэтому ни один существующий
  # профиль не меняется.
  - name: postgresql
    alias: pg-vpc
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-vpc.enabled
  - name: postgresql
    alias: pg-compute
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-compute.enabled
  - name: postgresql
    alias: pg-iam
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  # kacho-geo owns its own Postgres instance (schema kacho_geo, goose migrator).
  # database-per-service (ban #8). Always on (geo is a core leaf-service like iam).
  - name: postgresql
    alias: pg-geo
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
  # kacho-nlb owns its own Postgres instance (schema `kacho_nlb`, goose migrator).
  # Condition-gated so lean clusters can stay without NLB.
  - name: postgresql
    alias: pg-nlb
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-nlb.enabled

  # ─── Control-plane services (sibling sub-charts, resolved from sibling repo
  # checkouts laid out next to kacho-deploy; the `file://` path is branch-agnostic).
  # Versions left unpinned (`>= 0.0.0`) — CI clones origin/main of each sibling and
  # the Chart.yaml there can be any version; a hard pin breaks `helm dep update`.
  # vpc / compute condition-gated ровно как kacho-nlb / storage / registry.
  # Отсутствие условия здесь означало, что `--set vpc.enabled=false` РЕНДЕРИЛСЯ
  # успешно и НЕ ДЕЛАЛ НИЧЕГО: замер 2026-08-05 — выключение vpc+compute+registry+
  # storage+nlb одной командой убирало пять последних и оставляло первые два на
  # месте. Ручка, которая принимается и не читается, хуже отсутствующей: вызывающий
  # уверен, что стенд сужен. Умолчание — `true` (см. выше про отсутствующее значение).
  - name: vpc
    version: ">= 0.0.0"
    repository: file://../../../services/vpc/deploy
    condition: vpc.enabled
  - name: compute
    version: ">= 0.0.0"
    repository: file://../../../services/compute/deploy
    condition: compute.enabled
  # kacho-nlb L4 NLB control-plane (NetworkLoadBalancer / Listener / TargetGroup).
  # Condition-gated so clusters without NLB skip it entirely.
  - name: kacho-nlb
    version: ">= 0.0.0"
    repository: file://../../../services/nlb/deploy
    condition: kacho-nlb.enabled
  - name: api-gateway
    version: ">= 0.0.0"
    repository: file://../../../gateway/deploy
  # Federated ui-future console (host + dashboard/vpc/iam/nlb/registry/system
  # Module-Federation remotes). Chart is named `uif` (renamed from `ui` in
  # kacho-ui-future so it never collides with the legacy `ui` chart above — two
  # same-named subcharts make helm's render non-deterministic). Values live under
  # `uif:`; resources are named from those values (name/dashboard.name/… → uif,
  # uif-dashboard, …), matching the standalone `uif` release this consolidates.
  # Condition-gated (`uif.enabled`); default OFF. Enabling it on a cluster that
  # already runs the standalone `uif` release requires a one-time `helm upgrade …
  # --take-ownership` to adopt the existing uif-* resources in place (the hand-applied
  # uif-lb LoadBalancer is out-of-band and untouched → Beget IP preserved). See #161.
  - name: uif
    version: ">= 0.0.0"
    repository: file://../../../ui-future/deploy
    condition: uif.enabled
  # kacho-registry — OCI registry control-plane (gRPC + data-plane :8080) + zot
  # StatefulSet (OCI blob backend). Condition-gated; own Postgres (pg-registry).
  - name: registry
    version: ">= 0.0.0"
    repository: file://../../../services/registry/deploy
    condition: registry.enabled
  - name: postgresql
    alias: pg-registry
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-registry.enabled

  # kacho-storage — Storage control-plane (Volume/VolumeAttachment/Snapshot/DiskType,
  # gRPC public :9090 + cluster-internal :9091). Condition-gated; own Postgres
  # (pg-storage, schema kacho_storage). Runtime edges storage→geo (zone_id) +
  # storage→iam (ProjectService.Get + per-RPC Check); consumed by compute→storage
  # (InternalVolumeService attach/detach).
  - name: storage
    version: ">= 0.0.0"
    repository: file://../../../services/storage/deploy
    condition: storage.enabled
  - name: postgresql
    alias: pg-storage
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-storage.enabled

  # ─── Identity tier ────────────────────────────────────────────────────────
  # Ory stack — Kratos (identity + self-service flows) + Hydra (OAuth2/OIDC).
  #
  # ВЕРСИИ ПРИБИТЫ, А НЕ ПЛАВАЮТ — это условие работы гейта посадки, а не вкусовщина.
  #
  # Здесь стояло `0.x`, поэтому `helm dep update` брал НАИБОЛЬШУЮ доступную версию:
  # один и тот же коммит разворачивал разного провайдера в разные дни, без единой
  # правки в дереве. Ровно это и случилось 2026-07-31 — подъём взял `hydra-0.63.0`
  # вместо `hydra-0.62.1`, и гейт посадки покраснел на SEC-HAT-17 («предпосылка
  # терминатора измерена на другой версии»). Гейт был прав.
  #
  # Терминатор административного листенера существует ТОЛЬКО потому, что развёрнутая
  # версия провайдера не читает объявление TLS отдельного листенера. Предмет этого
  # обходного пути привязан к версии, а записанная координата предпосылки
  # (`deploy/PROVIDER-LISTENER-PREMISE.md`) называет ИМЕННО `hydra-0.62.1`. Плавающая
  # зависимость под прибитой предпосылкой — гарантированный случайный красный:
  # проверка ссылается на версию, которую сборка не обязана поставить.
  #
  # Поднять версию — значит В ТОМ ЖЕ изменении перемерить предпосылку
  # (`deploy/scripts/remeasure-provider-listener-tls.sh`) и обновить запись. Это и есть
  # дисциплина, которую гейт кодирует; прибитая версия просто перестаёт её обходить.
  # Побочно чинится воспроизводимость замеров: два прогона, которые сравнивают между
  # собой, обязаны идти на одном и том же провайдере.
  - name: kratos
    version: 0.62.1
    repository: https://k8s.ory.sh/helm/charts
    condition: kratos.enabled
  - name: hydra
    version: 0.62.1
    repository: https://k8s.ory.sh/helm/charts
    condition: hydra.enabled
  - name: postgresql
    alias: pg-kratos
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-kratos.enabled
  - name: postgresql
    alias: pg-hydra
    version: 13.x
    repository: https://charts.bitnami.com/bitnami
    condition: pg-hydra.enabled

  # ─── cluster-internal mTLS PKI ────────────────────────────────────────────
  # cert-manager controller + CRDs. Installs into the umbrella release namespace;
  # its cluster-resource-namespace defaults to that namespace, so the internal-CA
  # root secret + per-service leaf secrets all live alongside the workloads.
  # The internal-CA ClusterIssuer chain is in umbrella templates/clusterissuer.yaml;
  # each component sub-chart owns its own server/client leaf Certificate. All are
  # post-install/post-upgrade hooks so they are admitted only after the
  # cert-manager webhook is Ready. Gated on the master mtls.enabled flag.
  - name: cert-manager
    version: v1.16.x
    repository: https://charts.jetstack.io
    # Gated separately from mtls.enabled so `make dev-up` can bring the controller
    # up FIRST (phase 1, mtls off) and only then apply the Issuer/Certificate CRs
    # (phase 2, mtls on) — cert-manager + its own CRs cannot share one fresh apply
    # (webhook-not-ready race). cert-manager.enabled defaults true wherever mtls is used.
    condition: cert-manager.enabled