# values.run-stand.yaml — СЛОЙ СТЕНДА ПРОГОНА (стенд П1 приёмки NTF-2).
# ═══════════════════════════════════════════════════════════════════════════
#
# Последний слой цепочки `dev-prod` (deploy/stacks.txt) — той, что применяет
# `make dev-up` и что называет `STAND_STACK` (deploy/Makefile). Здесь лежат
# величины, которые нужны ТОЛЬКО стенду, где идут сквозные пробы, и которые на
# любой другой площадке ослабили бы рубеж молча.
#
# Почему отдельный слой, а не средний `values.dev-prod.yaml`. Средний слой
# наследуют цепочки площадок с внешним ретранслятором (`a8f60d`, `prorobotech`),
# и объявленное в нём доходит до них. Этот файл не называет ни одна цепочка,
# кроме `dev-prod`, — поэтому их пределы остаются базой чарта, и повторять базу
# в их слоях не нужно. Держится пробой
# TestEdgeStandChain_AnonMailRelaxationStaysOnTheStand (gateway/deploy).

# ─── kacho-api-gateway ──────────────────────────────────────────────────────
api-gateway:
  # ─── Пороги ограничителя анонимной почты стенда (приёмка NTF-2 §5) ───────
  # Все запросы прогона идут к краю с одного источника — источника раннера, и
  # посев стенда заводит людей регистрацией через край. Приёмка требует: объём
  # анонимных почтовых запросов прогона V меньше порога «без проверки» FREE, а
  # V+FREE меньше жёсткого порога источника и порогов подсети; ступень
  # лестницы утверждают только кейсы, строящие её сами. Ориентиры поставки
  # (база чарта края, 3 за 15 мин) этого не выполняют: четвёртая регистрация
  # посева получала `429 proof of work required`.
  #
  # Здесь — только счёт; окна и сложность вызова — ориентиры базы. Границы
  # стража соблюдены: FREE ≤ POW ≤ HARD, HARD/W_H = 1000/ч; POW ≤ HARD и
  # HARD/W_Hs = 5000/ч у каждой длины префикса. При этих числах условие
  # держится для V < 600. Проба — TestEdgeStandChain_AnonMailThresholdsAdmitTheSeedVolume
  # (gateway/deploy): цепочка — STAND_STACK, пороги — разбором стража, V — посев.
  anonMail:
    ipFreeLimit: 400
    ipPowLimit: 500
    ipHardLimit: 1000
    subnetV4Len24PowLimit: 2000
    subnetV4Len24HardLimit: 5000
    subnetV6Len56PowLimit: 2000
    subnetV6Len56HardLimit: 5000
    subnetV6Len48PowLimit: 2000
    subnetV6Len48HardLimit: 5000
