{{- if include "notify.renders" . }}
# ─── КЛЮЧ ОТПЕЧАТКА АДРЕСА — СВОЙ ОБЪЕКТ (NTF-4 Р15, Р11; Д23) ────────────────
#
# Отдельный объект: не поле секрета почты и не объект ключа сетки. Монтируется
# томом ЦЕЛИКОМ (без `items` и `subPath`, Р11) в каталог `notify.addressKeyDir`;
# процесс читает в нём файл `addressKey` при старте (ручка
# KACHO_NOTIFY_ADDRESS_KEY_DIR, страж validateAddressKeyDir).
#
# Имя ПОСТОЯННО — `<полное имя>-address-key` — и от значения не зависит. Ключ
# НЕ ПОРОЖДАЕТСЯ (форма УК91 ключа сетки): ни `rand*`, ни `lookup`; пусто —
# отказ рендера с именем ручки. Иначе каждое обновление установки меняло бы
# ключ, а ключ отпечатка не ротируется (NTF-4 Р15): все отпечатки журнала и
# подавлений стали бы чужими.
#
# Форма — та же, что судит страж старта: шестнадцатеричные символы чётным
# числом, не короче 64 (32 октета, выход HMAC-SHA256). Отказ на рендере, а не
# только на старте: установка с негодным ключом иначе применялась бы и
# оставляла под в отказе старта. Ни значение, ни его длина в текст отказа не
# попадают — только ручка и граница.
{{- /* Ключ объектом стенда (Д123): чарт объекта не рендерит; оба способа сразу —
     отказ (у ключа одно место). */}}
{{- $standKey := (.Values.addressKeySecret | default dict).name }}
{{- if and $standKey .Values.addressKey }}
{{- fail "notify.addressKey и notify.addressKeySecret.name заданы оба: ключ отпечатка адреса задаётся одним способом — значением установки либо объектом стенда (Д23, Д123)" }}
{{- end }}
{{- if not $standKey }}
{{- $addressKey := required "notify.addressKey (значение addressKey чарта notify): ключ отпечатка адреса не задан — шаблон его не порождает, задайте значение установки либо объект стенда notify.addressKeySecret.name (NTF-4 Р15, Д23)" .Values.addressKey }}
{{- if not (regexMatch "^([0-9a-fA-F]{2}){32,}$" $addressKey) }}
{{- fail "notify.addressKey (значение addressKey чарта notify): ключ отпечатка адреса не материал HMAC-SHA256 шестнадцатеричными символами не короче 64 символов (32 октетов) — NTF-4 Р15, Д89" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notify.fullname" . }}-address-key
  labels:
    {{- include "notify.labels" . | nindent 4 }}
type: Opaque
data:
  addressKey: {{ $addressKey | b64enc | quote }}
{{- end }}
{{- end }}
