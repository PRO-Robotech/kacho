{{- if include "notify.renders" . }}
# Учётка notify-api — сегмент `sa/` его SPIFFE-идентичности: лист с этим SAN
# выпускает политика выпуска (З30), по нему край и служба доступа узнают
# notify-api. Токен учётки в под не монтируется: API кластера процессу не нужен.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "notify.api.fullname" . }}
  labels:
    {{- include "notify.api.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
