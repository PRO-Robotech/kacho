{{- if include "notify.renders" . }}
{{- $smtp := include "notify.mailNode" . | fromJson }}
# Конфигурация процесса notify — ключи KACHO_NOTIFY_* (замысел З20). Читается
# один раз, при старте: смену карты перекатывает аннотация `checksum/config`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notify.fullname" . }}-config
  labels:
    {{- include "notify.labels" . | nindent 4 }}
data:
  KACHO_NOTIFY_AUTH_MODE: {{ .Values.authMode | quote }}
  KACHO_NOTIFY_PEER_TLS_CERT_FILE: {{ printf "%s/tls.crt" (include "notify.peerTLSDir" .) | quote }}
  KACHO_NOTIFY_PEER_TLS_KEY_FILE: {{ printf "%s/tls.key" (include "notify.peerTLSDir" .) | quote }}
  KACHO_NOTIFY_PEER_TLS_CA_FILE: {{ printf "%s/ca.crt" (include "notify.peerTLSDir" .) | quote }}
  KACHO_NOTIFY_DB_HOST: {{ .Values.db.host | quote }}
  KACHO_NOTIFY_DB_PORT: {{ .Values.db.port | quote }}
  KACHO_NOTIFY_DB_USER: {{ .Values.db.user | quote }}
  KACHO_NOTIFY_DB_NAME: {{ .Values.db.name | quote }}
  KACHO_NOTIFY_DB_SSLMODE: {{ .Values.db.sslMode | quote }}
  KACHO_NOTIFY_DB_MAX_CONNS: {{ .Values.db.maxConns | toString | quote }}
  KACHO_NOTIFY_DIAG_ADDR: {{ printf ":%d" (int .Values.ports.diag) | quote }}
  KACHO_NOTIFY_CLAIM_INTERVAL: {{ .Values.claimInterval | quote }}
  KACHO_NOTIFY_RESOLVE_SEND_TIMEOUT: {{ .Values.resolveSendTimeout | quote }}
  KACHO_NOTIFY_SMTP_SESSION_TIMEOUT: {{ .Values.smtpSessionTimeout | quote }}
  KACHO_NOTIFY_ORIGIN: {{ .Values.origin | quote }}
  # ── ЦИКЛ ДОСТАВКИ (§8 замысла, З21, З23, З25; полоса A2) ───────────────────
  # Умолчания нет: незаданный ключ — отказ рендера с его именем (в зонтике ключ
  # лежит под `notify.`). Границы — у стража старта.
  KACHO_NOTIFY_WORKERS: {{ required "workers (в зонтике notify.workers): число исполнителей цикла доставки не задано — умолчания нет, задайте его в профиле установки (ручка процесса notify.workers, [1..256])" .Values.workers | toString | quote }}
  KACHO_NOTIFY_DEFER_FOR: {{ required "deferFor (в зонтике notify.deferFor): отсрочка DEFER не задана — умолчания нет, задайте её в профиле установки (ручка процесса notify.deferFor, [1s..15m])" .Values.deferFor | quote }}
  KACHO_NOTIFY_KANAME_ADDR: {{ required "kaname.addr (в зонтике notify.kaname.addr): внутренний слушатель kaname для ResolveSend не задан — адрес называет профиль, из адреса соседа он не выводится (ручка процесса notify.kaname.addr, узел:порт)" .Values.kaname.addr | quote }}
  KACHO_NOTIFY_KANAME_SAN: {{ required "kaname.san (в зонтике notify.kaname.san): точный URI SAN листа kaname не задан — решение о письме принимается только от него (ручка процесса notify.kaname.san, URI SAN в форме SPIFFE)" .Values.kaname.san | quote }}
  # ── DNS УСТАНОВКИ И ПОДПИСЬ DKIM (Р19, §12а; D10) ──────────────────────────
  # Срок стража и интервал перепроверки — значения чарта; пути пары DKIM —
  # файлы тома объекта ключа, смонтированного без `subPath` (оба в одном
  # каталоге, CX1-134). Зона стенда — исход единственного помощника
  # `notify.standDNS`: `off` либо хост приёмника стенда (Д104).
  KACHO_NOTIFY_DNS_BOOT_DEADLINE: {{ .Values.dns.bootDeadline | quote }}
  KACHO_NOTIFY_DNS_RECHECK_INTERVAL: {{ .Values.dns.recheckInterval | quote }}
  {{- $dkim := include "notify.dkimNode" . | fromJson }}
  KACHO_NOTIFY_DKIM_KEY_FILE: {{ printf "%s/%s" (include "notify.dkimDir" .) $dkim.privateKeyKey | quote }}
  KACHO_NOTIFY_DKIM_SELECTOR_FILE: {{ printf "%s/%s" (include "notify.dkimDir" .) $dkim.selectorKey | quote }}
  KACHO_NOTIFY_STAND_DNS: {{ include "notify.standDNS" . | quote }}
  # ── РУЧКИ NTF-4 СТАДИИ S1 (Р16; страж — validateNTF4) ──────────────────────
  # Значения — профиля установки, умолчаний в чарте нет: пустое доезжает до
  # процесса и отвергается стражем с именем ручки. Каталог ключа отпечатка —
  # путь монтирования тома объекта ключа (тот же помощник, что у тома).
  # KACHO_NOTIFY_SECRET_RELOAD_INTERVAL здесь не стоит: это интервал, а не
  # секрет, но имя переменной с «SECRET» карта нести не может — гейт IaC
  # (KSV-0109) судит ключи карты по имени, а исключение в `.trivyignore.yaml`
  # пофайловое и сняло бы суждение со всей карты. Ручка — литералом `env`
  # контейнера notify (deployment.yaml); смена значения меняет шаблон пода и
  # перекатывает его.
  KACHO_NOTIFY_FEEDBACK_MAILBOX_ADDR: {{ tpl (.Values.feedback.mailboxAddr | toString) $ | quote }}
  KACHO_NOTIFY_FEEDBACK_MAILBOX_LOCAL_PART: {{ .Values.feedback.mailboxLocalPart | toString | quote }}
  KACHO_NOTIFY_RETURN_DOMAIN: {{ .Values.returnDomain | toString | quote }}
  KACHO_NOTIFY_FEEDBACK_POLL_INTERVAL: {{ .Values.feedback.pollInterval | toString | quote }}
  KACHO_NOTIFY_FEEDBACK_POLL_STALE_MAX: {{ .Values.feedback.pollStaleMax | toString | quote }}
  KACHO_NOTIFY_FEEDBACK_MAX_MESSAGE_BYTES: {{ .Values.feedback.maxMessageBytes | toString | quote }}
  KACHO_NOTIFY_FEEDBACK_MAX_EXPANSION_RATIO: {{ .Values.feedback.maxExpansionRatio | toString | quote }}
  KACHO_NOTIFY_FEEDBACK_CANARY_INTERVAL: {{ .Values.feedback.canaryInterval | toString | quote }}
  KACHO_NOTIFY_FEEDBACK_CANARY_DEADLINE: {{ .Values.feedback.canaryDeadline | toString | quote }}
  KACHO_NOTIFY_FEEDBACK_LEASE_TTL: {{ .Values.feedback.leaseTTL | toString | quote }}
  KACHO_NOTIFY_SENT_LOG_RETENTION: {{ .Values.sentLog.retention | toString | quote }}
  KACHO_NOTIFY_SUPPRESSION_HARD_TTL: {{ .Values.suppression.hardTTL | toString | quote }}
  KACHO_NOTIFY_SUPPRESSION_SOFT_THRESHOLD: {{ .Values.suppression.softThreshold | toString | quote }}
  KACHO_NOTIFY_SUPPRESSION_SOFT_WINDOW: {{ .Values.suppression.softWindow | toString | quote }}
  KACHO_NOTIFY_SUPPRESSION_SOFT_TTL: {{ .Values.suppression.softTTL | toString | quote }}
  KACHO_NOTIFY_SUPPRESSION_SWEEP_INTERVAL: {{ .Values.suppression.sweepInterval | toString | quote }}
  KACHO_NOTIFY_ADDRESS_KEY_DIR: {{ include "notify.addressKeyDir" . | quote }}
  KACHO_NOTIFY_REPUTATION_HARD_BOUNCE_RATE_MAX: {{ .Values.reputation.hardBounceRateMax | toString | quote }}
  KACHO_NOTIFY_REPUTATION_COMPLAINT_RATE_MAX: {{ .Values.reputation.complaintRateMax | toString | quote }}
  KACHO_NOTIFY_REPUTATION_WINDOW: {{ .Values.reputation.window | toString | quote }}
  # ── ЛИМИТЫ Р10 (З24, NTF1-H07, H08) ───────────────────────────────────────
  KACHO_NOTIFY_LIMITS_RECIPIENT_SECURITY_PER_DAY: {{ .Values.limits.recipient.security.perDay | toString | quote }}
  KACHO_NOTIFY_LIMITS_RECIPIENT_NOTICE_PER_HOUR: {{ .Values.limits.recipient.notice.perHour | toString | quote }}
  KACHO_NOTIFY_LIMITS_RECIPIENT_NOTICE_PER_DAY: {{ .Values.limits.recipient.notice.perDay | toString | quote }}
  KACHO_NOTIFY_LIMITS_GLOBAL_PER_DAY: {{ .Values.limits.global.perDay | toString | quote }}
  {{- $roster := include "kacho.notifications.sources" (dict "global" .Values.global) }}
  KACHO_NOTIFY_SOURCES: {{ $roster | quote }}
  # Ручки на источник — записи ровно модулей перечня (NTF1-N03, H08).
  KACHO_NOTIFY_SOURCE_LIMITS: {{ include "notify.sourceLimits" (dict "limits" .Values.sourceLimits "roster" ($roster | fromJsonArray)) | quote }}
  # ── УЗЕЛ ПОЧТЫ → КЛЮЧИ ПРОЦЕССА (Д44, Д46, Д47; CX1-77, CX1-81 (б)) ──────────
  #
  # Адрес — `tpl` значения узла под `required` с именем узла, без умолчания и
  # без разбора: разбор адреса и пара «имя ⇔ удостоверение» — у стража старта
  # (З20). Шаблон рендерится только при непустом перечне (NTF1-N04), поэтому
  # `required` срабатывает ровно при «источник включён, а узел пуст».
  # Поля отправителя — значением узла без умолчания и без `required`: пустое
  # доезжает до процесса, и отказывает его страж (NTF2-34 (е)).
  KACHO_NOTIFY_SMTP_CONNECTION_URI: {{ tpl (required "global.kacho.identity.smtp.connectionURI: адрес ретранслятора почты не задан, а notify рендерится (перечень источников непуст) — задайте узел почты установки либо выключите генерацию почтовых запросов: global.kacho.notifications.enabled: false" $smtp.connectionURI) $ | quote }}
  KACHO_NOTIFY_SMTP_FROM_ADDRESS: {{ $smtp.fromAddress | quote }}
  KACHO_NOTIFY_SMTP_FROM_NAME: {{ $smtp.fromName | quote }}
  {{- $anchor := $smtp.trustAnchorSecret }}
  {{- if and $anchor $anchor.name }}
  # Якорь проверки листа ретранслятора — файл тома из секрета узла (только у
  # notify); без якоря — корневое хранилище образа.
  KACHO_NOTIFY_SMTP_TRUST_ANCHOR_FILE: {{ printf "%s/%s" (include "notify.anchorDir" .) $anchor.key | quote }}
  {{- end }}
{{- end }}
