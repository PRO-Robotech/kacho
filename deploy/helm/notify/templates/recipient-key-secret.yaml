{{- if include "notify.renders" . }}
# ─── КЛЮЧ СЕТКИ НА АДРЕСАТА — СВОЙ ОБЪЕКТ (замысел З24, З28; Д23) ─────────────
#
# Не поле секрета почты: секрет почты чарт не рендерит вовсе (CX1-82 (а)), а
# ключ сетки монтирует ровно notify и только переменной `secretKeyRef`.
#
# Имя ПОСТОЯННО (CX1-68 (г)) — от содержимого и значения ключа не зависит:
# ограда ключа в базе (З24) сходится только на одном имени.
#
# Ключ НЕ ПОРОЖДАЕТСЯ (УК91): ни `rand*`, ни `genPrivateKey`, ни `lookup`.
# Пустой ключ — отказ рендера с именем ручки. Иначе каждое обновление
# установки меняло бы аннотацию `checksum/recipient-key` и становилось
# ротацией со следствием З24.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notify.fullname" . }}-recipient-key
  labels:
    {{- include "notify.labels" . | nindent 4 }}
type: Opaque
data:
  recipientKey: {{ required "notify.recipientKey (значение recipientKey чарта notify): ключ сетки на адресата не задан — шаблон его не порождает, задайте значение установки" .Values.recipientKey | b64enc | quote }}
{{- end }}
