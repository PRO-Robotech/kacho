{{- if include "notify.renders" . }}
# ─── КЛЮЧ СЕТКИ НА АДРЕСАТА — СВОЙ ОБЪЕКТ (замысел З24, З28; Д23) ─────────────
#
# Не поле секрета почты: секрет почты чарт не рендерит вовсе (CX1-82 (а)), а
# ключ сетки монтирует ровно notify и только переменной `secretKeyRef`.
#
# Имя ПОСТОЯННО (CX1-68 (г)) — от содержимого и значения ключа не зависит:
# ограда ключа в базе (З24) сходится только на одном имени.
#
# Ключ НЕ ПОРОЖДАЕТСЯ (УК91): ни `rand*`, ни `genPrivateKey`, ни `lookup`.
# Пустой ключ — отказ рендера с именем ручки. Иначе каждое обновление
# установки меняло бы аннотацию `checksum/recipient-key` и становилось
# ротацией со следствием З24.
#
# Ключ КОРОЧЕ 32 байт — тоже отказ рендера (Д94), той же границей, что страж
# старта (`config.RecipientKeyMinBytes`, Д89): ключ — материал HMAC-SHA256, и
# короче выхода хеша он ослабляет строки сетки и отпечаток ограды ключа, а
# аннотация `checksum/recipient-key` становится оракулом перебора. Отказ на
# рендере, а не только на старте: установка с коротким ключом иначе применялась
# бы и оставляла под в отказе старта. Ни значение, ни его длина в текст отказа
# не попадают — только ручка и граница.
{{- $recipientKey := required "notify.recipientKey (значение recipientKey чарта notify): ключ сетки на адресата не задан — шаблон его не порождает, задайте значение установки" .Values.recipientKey }}
{{- if lt (len $recipientKey) 32 }}
{{- fail "notify.recipientKey (значение recipientKey чарта notify): ключ сетки на адресата короче 32 байт — ключ HMAC-SHA256 обязан быть не короче выхода хеша (З24, Д89, Д94)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notify.fullname" . }}-recipient-key
  labels:
    {{- include "notify.labels" . | nindent 4 }}
type: Opaque
data:
  recipientKey: {{ $recipientKey | b64enc | quote }}
{{- end }}
