{{- if include "notify.renders" . }}
# Доступность notify-api: реплик ≥ 2, добровольное выселение не снимает последнюю.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "notify.api.fullname" . }}
  labels:
    {{- include "notify.api.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "notify.api.selectorLabels" . | nindent 6 }}
{{- end }}
