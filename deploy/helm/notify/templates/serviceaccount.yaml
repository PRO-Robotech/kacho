{{- if include "notify.renders" . }}
# Учётка notify — сегмент `sa/` его SPIFFE-идентичности: политика выпуска (З30)
# выдаёт лист с SAN этой учётки, и по нему источники и kaname узнают notify.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "notify.fullname" . }}
  labels:
    {{- include "notify.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
