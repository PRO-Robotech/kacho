{{- if include "notify.renders" . }}
{{- $m := .Values.mtls }}
{{- $trust := include "notify.trustDomain" . }}
{{- $name := include "notify.api.fullname" . }}
{{- $ns := .Release.Namespace }}
# ─── УДОСТОВЕРЕНИЕ notify-api (NTF-4 Р20, Р22) ─────────────────────────────────
#
# Один лист внутреннего УЦ на обе стороны процесса: сервер единственного
# внутреннего слушателя (к нему ходит край, имя для сверки — узел адреса края,
# `<имя>.<пространство>.svc`) и клиент ребра Check к службе доступа. SAN —
# идентичность учётки notify-api; иную политика выпуска не одобрит. Выключателя
# mTLS нет: без файлов листа процесс не стартует.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "notify.api.labels" . | nindent 4 }}
spec:
  secretName: {{ $name }}-tls
  duration: {{ $m.leafDuration | quote }}
  renewBefore: {{ $m.leafRenewBefore | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ $m.issuer.name | quote }}
    kind: {{ $m.issuer.kind | quote }}
    group: cert-manager.io
  dnsNames:
    - {{ $name | quote }}
    - {{ printf "%s.%s" $name $ns | quote }}
    - {{ printf "%s.%s.svc" $name $ns | quote }}
    - {{ printf "%s.%s.svc.cluster.local" $name $ns | quote }}
  uris:
    - {{ printf "spiffe://%s/ns/%s/sa/%s" $trust $ns $name | quote }}
  usages:
    - server auth
    - client auth
{{- end }}
