#
# Закрытая ведомость намеренных отличий копии чарта службы доступа в зонте
# (helm/umbrella/charts/kaname) от собственного чарта службы — kacho#3314.
#
# differences — ручки процесса (config:<путь файла настроек> | env:<ИМЯ>),
#   которые есть у чарта службы по пину go.mod, а у копии нет. Судит
#   deploy/kaname_subchart_knob_parity_test.go: ручка без строки здесь — красное;
#   строка без причины либо без предмета — тоже.
# overrides — величины подчарта, которые зонт объявляет, а рендер подчарта от их
#   изменения не меняется ни на одной цепочке, где они объявлены. Судит
#   deploy/kaname_subchart_override_reaches_render_test.go (тег helmcharts).
differences: []
overrides:
  - value: mtls.httpListeners
    why: >-
      Общее умолчание транспорта HTTP-слушателей: шаблон читает его как запасное
      значение (dig <слушатель> mtls.httpListeners mtls) для слушателя, которого
      профиль не назвал. Сегодня профили называют каждый слушатель, поэтому
      рендер от него не зависит; снять его значит отдать новый слушатель
      умолчанию подчарта (открытый текст) вместо решения профиля.
  - value: resources.requests.memory
    why: >-
      Помощник kaname.containerResources выравнивает запрос памяти по пределу
      (класс Guaranteed по памяти), когда предел объявлен — а цепочки его
      объявляют. Объявленный запрос действует лишь в профиле без предела;
      снятие объявления — отдельное решение о профилях (суммы ресурсов
      пространства стенда читают объявления), не предмет этого гейта.
