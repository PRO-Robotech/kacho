# edge.yaml — слой рендера ЧАРТА КРАЯ БЕЗ ЗОНТИКА (приёмка NTF-2 Р8, решение
# Д52). НЕ ПРОФИЛЬ И НЕ ПОСТАВКА: файл подают только рендеры каталога
# gateway/deploy самого по себе — пробы рендера края, ведомость чартов конвейера,
# сверка томов, IaC-скан. Число доверенных прыжков в базе чарта не объявлено
# (Д51), и без этого слоя рендер отказывает с именем ручки.
#
# Ключ один и в корне: чарт края без зонтика читает значения из корня. Других
# ключей здесь нет — множество листьев файла равно одному ключу ручки.
trustedHops: 1
