#
# Собственные значения НОГИ БЕЗ ЗОНТИКА — рендера чарта deploy/helm/notify/
# отдельно (NTF-1, полоса D1; замысел З28, CX1-97, CX1-98 (в); форма NTF1-I06).
#
# НЕ ПРОФИЛЬ И НЕ ПОСТАВКА: файл читают только пробы рендера
# (deploy/notify_secret_layout_test.go). Значения — фикстурные.
#
# УЗЛА ПОЧТЫ ЗДЕСЬ НЕТ НАМЕРЕННО. Узел `global.kacho.identity.smtp` приходит
# только слоем образца из каталога deploy/testdata/mail-node/; проба печатает
# его отсутствие в этом файле и без него не проводится — иначе снятый
# `--set …connectionURI=null` адрес мог бы вернуться отсюда.
#
# Ключей формы зонтика (`api-gateway`, подчарты) здесь нет (N24): чарт notify
# отдельно их не читает.
#
# Флага и перечня источников здесь нет: в полосе D1 таблица подключаемых
# источников (`templates/_sources.tpl`) пуста, флаг вносит D2. Перечень из
# одного источника пробы получают фикстурной копией таблицы.
image:
  tag: fixture
origin: "https://console.example.invalid"
recipientKey: "fixture-recipient-key-not-a-secret-0123456789"
db:
  host: notify-postgres
  passwordSecret:
    name: notify-db-password
