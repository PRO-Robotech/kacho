# operator.yaml — образец слоя оператора для рендера цепочки `prod` гейтами
# (NTF-1, полоса D9; замысел З28 «Образец узла — в фикстуре гейта», Д48, CX1-87).
#
# НЕ ПРОФИЛЬ И НЕ ПОСТАВКА. В `values.prod.yaml` узла почты нет намеренно: его
# задаёт оператор, а образец в профиле стал бы узлом, который оператор не
# задавал. Этот файл подставляет ТОЛЬКО тестовая обёртка рендера цепочек
# (`deploy/stacks_render_wrapper_test.go`, `deploy/tests/helm/lib/render-chain.sh`),
# и только к цепочке `prod`. `deploy/stacks.txt` каталог не называет, маска
# `values*.yaml` зонтика его не захватывает.
#
# ФОРМА — УЗЕЛ ОПЕРАТОРА, А НЕ СТЕНДА (CX1-87 (а)): внешний узел с неявным TLS,
# пара «имя в адресе ⇔ источник удостоверения» целиком, без якоря (корневое
# хранилище), отправитель задан; ключей `mailpit.*` нет — приёмник стенда на
# `prod` выключен, и узел формы `values.dev.yaml` страж почтовой полосы отвергает.
#
# Ключи — ТОЛЬКО формой зонтика (N24): корневой ключ, которого рендер зонтика не
# читает, был бы значением принятым и проигнорированным. Держит
# `TestMailNodeSamplesSpeakTheUmbrellaForm`.
global:
  kacho:
    identity:
      smtp:
        connectionURI: "smtps://noreply@relay.operator.example:465/"
        credentialSecret:
          name: kacho-identity-smtp
          key: password
        fromAddress: "noreply@operator.example"
        fromName: "Kacho Cloud"
        # Объект ключа DKIM установки (Р19 «Подпись», §8): его создаёт оператор,
        # чарт notify объекта не рендерит и монтирует томом без `subPath`.
        dkim:
          secretName: kacho-notify-dkim
          privateKeyKey: private.key
          selectorKey: selector

# Число доверенных прыжков края (приёмка NTF-2 Р8, Д51): поставляемый `prod` его
# не несёт, и рендер `prod` без него отказывает с именем
# KACHO_API_GATEWAY_TRUSTED_HOPS. Образец оператора задаёт его так же, как узел
# почты, — ключом формы зонтика, только под `api-gateway`.
api-gateway:
  trustedHops: 1
