# ntf2-p7.yaml — образец П7-узла: минимально-законный почтовый узел цепочки
# `prod` для гейтов и проб NTF-2 (приёмка NTF-2 §5 «П7-узел», Д48; замысел
# issue-2917 З29, CX2-66). Подставляет его только тестовая обёртка рендера
# цепочек NTF1-D9 (`deploy/tests/helm/lib/render-chain.sh`,
# `deploy/stacks_render_wrapper_test.go`) и только к цепочке `prod`.
#
# ТРИ СТРОКИ УЗЛА — И МЕНЬШЕ НЕЛЬЗЯ: адрес внешнего узла без имени пользователя,
# адрес и имя отправителя. Страж почтовой полосы зонтика отвергает узел без
# любой из двух последних. Якоря и удостоверения нет: адрес без имени
# пользователя удостоверения не требует, якорь — корневое хранилище.
#
# Значения контрольные: узел и отправитель отличимы от любой настоящей посадки.
global:
  kacho:
    identity:
      smtp:
        connectionURI: "smtp://relay.ntf2-p7.example:587/"
        fromAddress: "p7-sender@ntf2-p7.example"
        fromName: "NTF2 P7 sample"

# Число доверенных прыжков края (приёмка NTF-2 Р8, Д51): поставляемый `prod` его
# не несёт, и рендер `prod` без него отказывает с именем
# KACHO_API_GATEWAY_TRUSTED_HOPS. Образец оператора задаёт его так же, как узел
# почты, — ключом формы зонтика, только под `api-gateway`.
api-gateway:
  trustedHops: 1
