# Ведомость приёмок, под которыми ведётся кодирование этого дерева.
#
# ЗАЧЕМ ОНА СУЩЕСТВУЕТ
#
# Приёмки живут в ДРУГОМ репозитории (`PRO-Robotech/kacho-workspace`,
# `docs/specs/`), поэтому гейт продукта прочитать их вердикт не может by
# construction. Ведомость — перенос вердикта в дерево продукта: утверждение с
# координатой вместо молчания.
#
# ЧТО ЭТО НЕ ЕСТЬ
#
# Это НЕ список прощённых и не разрешение кодировать. `verdict` здесь —
# ЗАФИКСИРОВАННЫЙ ФАКТ о состоянии приёмки на названную ревизию воркспейса, а не
# позволение. Гейт (`internal/repohygiene`, TestNewMigrationCitesAnApprovedAcceptance)
# требует APPROVED от приёмки, которую цитирует миграция, ДОБАВЛЕННАЯ этим
# изменением, — то есть в тот момент, когда решение ещё принимается.
#
# ПОЧЕМУ ЗАПИСЬ НЕ ЖИВЁТ ВЕЧНО
#
# Запись, которую не цитирует ни одна миграция дерева, — находка: у неё нет
# предмета, и следующий читатель примет её за действующее основание. Запись с
# вердиктом не-APPROVED обязана называть открытую задачу — иначе долг остаётся
# без ответственного.
#
# КАК ПРАВИТЬ
#
# Вердикт берётся из шапки самого документа приёмки, вместе с ревизией воркспейса,
# на которой он прочитан. Списывать по памяти нельзя: вердикт снимается автором и
# ставится заново, и «APPROVED» без ревизии — утверждение о неизвестном моменте.

