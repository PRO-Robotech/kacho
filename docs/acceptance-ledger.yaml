  - acceptance: sub-phase-IAM-ID-2-membership-read-acceptance.md
    prefix: IAM-ID-2
    verdict: APPROVED
    verdict_dated: "2026-08-27"
    workspace_revision: 132f8d484
    note: >-
      Круг 7, вердикт вынесен acceptance-reviewer после ОТЗЫВА преждевременного
      одобрения круга 5 — то есть санкция восстановлена, а не унаследована.
      Прочитано в ШАПКЕ документа на названной ревизии, и ревизия эта лежит в
      СТВОЛЕ воркспейса, а не на ветке ревью: предикат `git show
      132f8d484:docs/specs/sub-phase-IAM-ID-2-membership-read-acceptance.md |
      sed -n 3p` даёт строку APPROVED круга 7. Разбор, читавший рабочую копию до
      вливания, решил было, что вердикт на ветке; это перемерено и исправлено —
      оговорка про ветку здесь не нужна.
      ОБЪЁМ САНКЦИИ: стадии S1 -> S2 в этом порядке, каждая production-complete в
      своих границах. S1 — чтение членства на аккаунт-скоупных путях
      (`/iam/v1/accounts/{accountId}/memberships[/{membershipId}]`), пообъектный
      гейт края по `viewer` @ `account`, пагинация и отказы, анти-оракул как
      СВОЙСТВО стадии, состояния членства, экран консоли; полос сужения на данных
      у глаголов S1 — ноль, и это утверждение, а не умолчание. S2 — свой список
      членств, гейт личностью.
      ВНЕ санкции — восемь предметов, каждый со своим предикатом: поток
      приглашения, правка записи человека, запрет участия, выпуск токенов и
      действие от имени, возврат поля аккаунта на ресурс пользователя,
      приглашение как отдельный ресурс с наблюдаемым PENDING в своём списке,
      приведение поверхности членства к одной адресной форме, изменение модели
      прав (типа членства в модели нет и обязано остаться 0).
      ЧТО ЦИТИРУЕТ ЭТУ ЗАПИСЬ СЕГОДНЯ: миграция курсорного индекса членств
      аккаунта. Прежняя редакция DoD п. 7б утверждала, что обе стадии миграций не
      несут; утверждение перестало быть верным по его же предикату, и запись
      заведена ВМЕСТЕ с миграцией — пустая запись немедленно краснела бы как
      послабление без предмета.

