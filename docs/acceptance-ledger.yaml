      разрешено этим вердиктом.

  # ЗДЕСЬ СТОЯЛО ТРИНАДЦАТЬ ЗАПИСЕЙ СЛУЖБЫ ДОСТУПА — шесть приёмок воркспейса и
  # семь приёмок её ВТОРОГО дома (`services/iam/docs/engineering/acceptance/`).
  #
  # Все тринадцать сняты вместе со своим предметом: миграции, которые их
  # цитировали, уехали из этого дерева вместе со службой, вынесенной отдельным
  # продуктом. Ведомость сама объявляет этот исход своим правилом выше —
  # «запись, которую не цитирует ни одна миграция дерева, — находка: у неё нет
  # предмета, и следующий читатель примет её за действующее основание».
  #
  # Второго дома приёмки в этом дереве больше нет ЦЕЛИКОМ, и это остаток, а не
  # поломка: запрет #1 на дереве продукта перестал измеряться, потому что
  # измерять стало нечего. Перенос вердикта нужен там, где кодируют, — а
  # кодируют под эти приёмки теперь в дереве службы.
