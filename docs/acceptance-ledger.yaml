      ЧТО ЦИТИРУЕТ ЭТУ ЗАПИСЬ СЕГОДНЯ: миграция очереди писем приглашения
      (`invite_mail_outbox`) — ШЕСТАЯ очередь сервиса, заведённая под §10 пп. 20
      и 21 в порядке §11 шага 8а.
      ОБЪЁМ САНКЦИИ, к которому относится эта миграция: наш отправитель письма
      приглашения с СОБСТВЕННЫМ пределом времени на попытку и ОГРАНИЧЕННЫМ
      повтором (две РАЗНЫЕ величины, §4.1 замечание В1 круга 6), очередь в нашей
