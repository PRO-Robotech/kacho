  - acceptance: sub-phase-KAN-QUOTA-1-limit-authority-leaves-iam-acceptance.md
    prefix: KAN-Q1
    verdict: APPROVED
    verdict_dated: "2026-09-06"
    workspace_revision: 5024be89
    note: >-
      Круг 2, вердикт вынесен acceptance-reviewer. Названная ревизия лежит на
      ветке ревью `lane/acc-2117` воркспейса, а НЕ в его стволе: круг записывает
      вердикт на свою ветку, и ствол несёт прежнее состояние. Предикат записи:
      `git show 5024be89:docs/specs/sub-phase-KAN-QUOTA-1-limit-authority-leaves-iam-acceptance.md
      | sed -n 3p` даёт строку APPROVED круга 2.
      ОТПЕЧАТОК, К КОТОРОМУ ПРИВЯЗАН ВЕРДИКТ, НЕ РАВЕН отпечатку файла на этой
      ревизии, и это не расхождение: одобрение относится к содержимому, которое
      рецензировали (SHA-256
      `c5690bfefe5c828ab851c2a60478ffd128af6dd6bccb448e037a25be25daeb68`, коммит
      `6eb840bf`), а объявление вердикта вносится в шапку ПОСЛЕ и содержимое
      меняет. Шапка на 5024be89 называет оба отпечатка сама.
      ОБЪЁМ САНКЦИИ ЭТОЙ МИГРАЦИИ — стадия S1 (§4): источник величин у пяти
      потребителей становится ОБЪЯВЛЕННЫМ, а не выведенным из адреса
      авторизации, и покрываются ОБЕ полосы ребра — разрешение величины на пути
      запроса и фоновая дельта. Миграция заводит производителя П32: состояние
      курсора синхронизации, называющее причину молчания тянущего (сценарии
      KAN-Q1-06 и KAN-Q4-13). ВНЕ санкции этой миграции — стадии S2, S3 и S4:
      переезд каталога видов в фундамент, уход службы доступа из потребителей и
      снятие авторитета величин идут своими изменениями.
