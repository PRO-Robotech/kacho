      экранов), глагол повторной отправки (п. 9), ограничение частоты и наша
      строка предъявителя со сроком (пп. 10, 17, 22), гейты согласия полос
      (п. 6) и потолка сроков (п. 18), единое объявление настройки (п. 19),
      требование к стенду (п. 23) и координата оснастки раскатки (п. 25).
      Каждый из них ведётся своей задачей и своей полосой.
