# Ведомость приёмок, под которыми ведётся кодирование этого дерева.
#
# ЗАЧЕМ ОНА СУЩЕСТВУЕТ
#
# Приёмки живут в ДРУГОМ репозитории (`PRO-Robotech/kacho-workspace`,
# `docs/specs/`), поэтому гейт продукта прочитать их вердикт не может by
# construction. Ведомость — перенос вердикта в дерево продукта: утверждение с
# координатой вместо молчания.
#
# ЧТО ЭТО НЕ ЕСТЬ
#
# Это НЕ список прощённых и не разрешение кодировать. `verdict` здесь —
# ЗАФИКСИРОВАННЫЙ ФАКТ о состоянии приёмки на названную ревизию воркспейса, а не
# позволение. Гейт (`internal/repohygiene`, TestNewMigrationCitesAnApprovedAcceptance)
# требует APPROVED от приёмки, которую цитирует миграция, ДОБАВЛЕННАЯ этим
# изменением, — то есть в тот момент, когда решение ещё принимается.
#
# ПОЧЕМУ ЗАПИСЬ НЕ ЖИВЁТ ВЕЧНО
#
# Запись, которую не цитирует ни одна миграция дерева, — находка: у неё нет
# предмета, и следующий читатель примет её за действующее основание. Запись с
# вердиктом не-APPROVED обязана называть открытую задачу — иначе долг остаётся
# без ответственного.
#
# ОТКУДА БЕРЁТСЯ ВЕРДИКТ — С САМОЙ СВЕЖЕЙ РЕВИЗИИ, НЕСУЩЕЙ ЕГО
#
# Не из рабочей копии рядом: общая копия отстаёт, и прочитанный в ней вердикт
# бывает СТАРШЕ действительного. Цена измерена в день заведения ведомости: копия
# отставала на 17 коммитов, и первая редакция записи IAM-ID-1 объявила DRAFT там,
# где в стволе уже стоял APPROVED круга 5. Ложный факт прожил один коммит и был бы
# принят следующим читателем за основание.
#
# Обычно свежайшее — `origin/main` воркспейса, и тогда читают его. Но ПРАВИЛО
# ЗДЕСЬ — «свежайшее», а не имя ссылки, и разница не педантская: круг ревью
# записывает вердикт на СВОЮ ветку, и до слияния ствол несёт прежнее состояние.
# Читать в такой момент `origin/main` — значит получить ровно тот устаревший
# вердикт, ради которого этот блок и написан. Наблюдалось 2026-08-24: APPROVED
# круга 12 у IAM-ID-1 лежал на `acc/iam-id-1-b3`, а `origin/main` воркспейса
# (3d47901) говорил DRAFT с отозванной санкцией. Ветка не отстала — она опережала.
#
# Поэтому `workspace_revision` называет ту ревизию, НА КОТОРОЙ ВЕРДИКТ ПРОЧИТАН, а
# ветку, если это не ствол, называет `note`. Запись проверяема одной командой, и
# это единственная форма, не зависящая от того, какая ссылка вердикт несёт:
#
#   git show <workspace_revision>:docs/specs/<acceptance> | sed -n 3p
#
# обязано воспроизвести записанный вердикт. Не воспроизводит — запись лжёт.
#
# РЕВИЗИЯ ЗАМЕРА КРУГА — НЕ РЕВИЗИЯ ЗАПИСИ ВЕРДИКТА
#
# Шапка приёмки называет ревизию, на которой круг МЕРИЛ; сам вердикт записывается
# коммитом ПОЗЖЕ. Списать ревизию замера — значит назвать момент, на котором в
# шапке стоит ещё прежний вердикт. Наблюдалось на том же круге 12: замер —
# `e917367`, где шапка говорит CHANGES REQUESTED круга 10, а APPROVED появляется
# только в `4662a7e`. Предикат выше различает эти две ревизии сам.
#
# ВЕРДИКТ БЫВАЕТ НЕ ТОЛЬКО СТАРШЕ ДЕЙСТВИТЕЛЬНОГО, НО И ОТОЗВАННЫМ — И ВЕРНУТЬСЯ
#
# Это ТРИ РАЗНЫХ случая, и лечатся они разным:
#
#   отставание копии — запись говорит о ревизии, которая уже не последняя;
#                      чинится ПЕРЕЧИТЫВАНИЕМ шапки на свежайшей ревизии, несущей
#                      вердикт (обычно ствол воркспейса, но см. блок выше);
#   отзыв санкции    — запись верна о названной ревизии и всё равно лжёт о
#                      настоящем: вердикт был вынесен и снят ПОЗЖЕ. Перечитать ту
#                      же ревизию — значит получить прежний APPROVED снова;
#                      обновление копии этого НЕ чинит, нужен новый круг ревью;
#   восстановление   — новый круг санкцию ВЕРНУЛ. Отзыв не бессрочен и не
#                      необратим: он говорит «санкции нет СЕЙЧАС», а не «её больше
#                      не будет». Чинится тем же перечитыванием шапки — но лечит
#                      оно здесь не отставание записи, а исчерпание её предмета.
#
# Отзыв ОБРАТИМ, и это надо было сказать прямо: прежняя редакция описывала только
# путь вниз (APPROVED → отозван) и молчала про путь вверх, отчего запись с
# `verdict_withdrawn` читалась как терминальная. Механизм возврата в ведомости уже
# был — самоистечение поля, — но не был назван случаем.
#
# Отзыв объявляется полем `verdict_withdrawn: true`, а не только прозой в `note`:
# гейт печатает по нему РАЗНЫЙ текст находки, потому что читателю предстоят разные
# действия. Прозу гейт не читает, и класс, названный одними словами, не удержан
# ничем. Поле истекает само: `verdict: APPROVED` вместе с ним — находка (запись
# объявила бы действующую санкцию и её отсутствие разом).
#
# Наблюдалось (PRO-Robotech/kacho#1200): запись IAM-ID-1 говорила APPROVED @
# 5d6a2d6 — про ту ревизию верно — уже после того, как вердикт круга 5 был отозван
# частью решением по PRO-Robotech/kacho#1085. Пока запись говорила APPROVED, гейт
# пропустил бы миграцию, цитирующую документ без действующей санкции: ban #1
# переставал держаться ровно там, где держится машинно.
#
# КАК ПРАВИТЬ
#
# Вердикт берётся из шапки самого документа приёмки, вместе с ревизией воркспейса,
# на которой он прочитан. Списывать по памяти нельзя: вердикт снимается автором и
# ставится заново, и «APPROVED» без ревизии — утверждение о неизвестном моменте.
# Снятый вердикт записывается двумя утверждениями сразу: `verdict` — тем, что
# стоит в шапке документа СЕЙЧАС, и `verdict_withdrawn: true` — тем, что санкция
# была и снята.
#
# ВОЗВРАЩЁННЫЙ вердикт правится в обратную сторону, и все четыре части сразу:
# `verdict: APPROVED`, `verdict_withdrawn` СНЯТЬ (иначе запись объявит санкцию и
# её отсутствие разом — гейт на это падает), `debt_issue` СНЯТЬ (поле означает
# «эта запись — долг», а долга у действующей санкции нет), `verdict_dated` и
# `workspace_revision` — новыми. Оставить хоть одно старым значит смешать два
# состояния в одной записи, и читателю не из чего выбрать верное.
#
# ОБЪЁМ САНКЦИИ, если она выдана уже документа, называется прозой в `note`.
# Отдельного поля под него НЕТ намеренно: гейт судит наличие санкции, а не её
# границы, и поле без читателя было бы принято-и-проигнорировано. Прозу читает
# человек — он же и решает, попадает ли его правка в разрешённое.

