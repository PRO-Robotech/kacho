# trivy-vendored-charts.yaml — настройки ВТОРОГО прохода IaC-скана: каталог
# вендоренных внешних чартов `deploy/helm/vendor/`, БЕЗ заглушек.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ ПРОСТО ВЫЗОВ БЕЗ `--config`. trivy подхватывает
# `trivy.yaml` из текущего каталога САМ. Проход, запущенный из корня без явного
# файла, получил бы заглушки корневого `trivy.yaml` — и внешний чарт с закрытой
# схемой значений снова отказал бы в рендере молча. Поэтому список заглушек здесь
# объявлен ЯВНО пустым.
#
# Почему проходов несколько и чем их совпадение с CI держится — шапка
# `deploy/scripts/iac_scan_passes.py`. Что каждый вендоренный архив дал цели —
# гейт `deploy/scripts/assert-iac-scan-covers-every-chart.py`.
misconfiguration:
  helm:
    set: []
