# trivy.yaml — настройки IaC-скана, БЕЗ КОТОРЫХ ЧАСТЬ ДЕРЕВА НЕ ОСМАТРИВАЕТСЯ.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ ЕСТЬ. Два чарта продукта несут намеренный отказ рендера, если
# оператор не назвал координаты, которых чарт не заводит: `services/registry/deploy`
# (учётные данные хранилища слоёв zot) и `services/nlb/deploy` (пароль к БД).
# Это правильная защита — чарт не умеет разворачивать открытое хранилище и не
# подставляет общеизвестный «дефолтный» пароль. Предикат перечня — не память, а
# прогон: `helm template t <чарт>` по каждому кандидату гейта покрытия; отказ
# рендера дают ровно эти два.
#
# У этой защиты есть побочный эффект, который сам по себе не виден:
# `trivy config` рендерит чарт, чтобы его прочитать, и на отказе рендера ПРОПУСКАЕТ
# чарт целиком — молча, с кодом возврата 0.
#
# Итог до этого файла (замер 2026-08-09, перемерен 2026-08-10, trivy 0.64.1): в
# целях скана — 86 файлов, и среди них НИ ОДНОГО из `services/registry/deploy` и
# `services/nlb/deploy`. Оба чарта рендерятся целиком — 9 и 11 манифестов, — то
# есть двадцать манифестов, включая StatefulSet хранилища слоёв, не проверялись
# вовсе, а отчёт выглядел так же, как если бы они были чисты. «Ноль находок» там
# означало «ноль прочитанного».
#
# ДВА ЧИСЛА РЯДОМ — РАЗНЫЕ ЕДИНИЦЫ, вычитать одно из другого нельзя. 20 — это
# отрендеренные манифесты двух чартов (предикат: `helm template … | grep '^# Source:'`).
# 10 — прирост ЦЕЛЕЙ скана, 86 → 96 (предикат: число `Results[].Target` в JSON-отчёте).
# Цель сканер заводит только на манифест, к которому применима хоть одна проверка:
# Certificate, HPA, Role, RoleBinding, ServiceMonitor не дают её ни при каком
# содержимом. Поэтому «двадцать введено в осмотр» и «десять новых целей» верны
# одновременно, и оба числа названы вместе со своим предикатом — порознь каждое
# читается как опровержение другого.
#
# ЧТО ЗДЕСЬ ЗАДАНО. Значения ТОЛЬКО ДЛЯ СКАНА — заглушки, удовлетворяющие проверку
# наличия секрета, чтобы шаблон отрендерился и его можно было прочитать. Они не
# попадают ни в один профиль развёртывания и ни во что, кроме памяти сканера:
# `helm install` этот файл не читает вовсе. Значение выбрано так, чтобы его нельзя
# было принять за настоящее (`trivy-scan-only`).
#
# ЭТО НЕ ОСЛАБЛЕНИЕ ПРОВЕРКИ. Заглушка снимает отказ РЕНДЕРА, а не находку: после
# неё чарт реестра честно предъявил AVD-KSV-0014 на StatefulSet zot (закрыт тем же
# заходом — `zot.containerSecurityContext.readOnlyRootFilesystem`), а чарт nlb
# оказался чист по-настоящему, а не по умолчанию.
#
# КТО ЭТОТ ФАЙЛ ЧИТАЕТ. `trivy` подхватывает `trivy.yaml` из текущего каталога сам,
# но полагаться на неявное поведение здесь нельзя — от него зависит, ОСМАТРИВАЕТСЯ
# ли пятая часть манифестов. Поэтому оба потребителя называют файл ЯВНО:
#   * `.github/workflows/security-scan.yml` — `trivy-config: trivy.yaml` у обоих
#     шагов `scan-type: config` (и SARIF, и гейт);
#   * `deploy/scripts/assert-iac-exclusions-still-have-a-subject.py` — `--config`,
#     чтобы гейт исключений судил РОВНО о том же множестве целей, что и гейт скана.
#     Разойдись они — «путь вне осмотра» у одного означало бы «путь чист» у другого.
#
# ЧЕМ ЭТО ДЕРЖИТСЯ — ДВУМЯ ГЕЙТАМИ, И ОНИ ПРО РАЗНОЕ.
#   * `deploy/scripts/assert-iac-scan-covers-every-chart.py` требует, чтобы КАЖДЫЙ
#     отслеживаемый чарт дал сканеру хотя бы одну цель. Пропадёт этот файл,
#     сломается значение, заведут третий чарт с отказом рендера — гейт покраснеет
#     и назовёт чарт по имени, вместо того чтобы дерево тихо ушло из осмотра.
#   * `deploy/scripts/assert-scan-stubs-hide-nothing.py` требует, чтобы заглушки
#     только ОТКРЫВАЛИ находки и никогда их не гасили. Первый гейт ловит заглушку,
#     которая выбила чарт из осмотра; второй — заглушку, которая чарт осмотреть дала,
#     но подменила величину так, что находка пропала. Второе первым не ловится: цели
#     на месте, счёт целей не падает, пропадает только находка.
#
# > [!note] Здесь стояли четыре заглушки kaname (`image.trivyScanOnly`, `db.host`,
# > `db.passwordSecretName`, `db.passwordSecretKey`) и врезка о том, почему образ
# > задан под-ключом, а не строкой — предмет обеих снят 2026-09-12.
# >
# > Заглушки держали отказ рендера СТАНДАЛОН-чарта `services/iam/deploy` (там же
# > жили его собственные тесты-стражи — `boot_guard_defaults_test.go`,
# > `defaultless_keys_test.go`, `image_coordinate_test.go`), а не чарта,
# > оставшегося в дереве. Служба доступа выехала отдельным продуктом (kaname,
# > #1111): каталог `services/iam` снят целиком, вместе со стандалон-чартом и его
# > стражами. Единственный кандидат, который читает `git ls-files
# > '**/Chart.yaml'` сегодня, — вендоренный подчарт `deploy/helm/umbrella/charts/
# > kaname/`, и он всегда рендерился со своими значениями (`image.repository:
# > kaname`, `db.host: kacho-umbrella-pg-iam`, …) — отказа рендера, который
# > закрывали эти четыре заглушки, у него не было ни секунды.
# >
# > Найдено гейтом `assert-scan-stubs-hide-nothing.py` дословно так, как он и
# > обещает: «снятие заглушки не меняет НИЧЕГО — ни целей, ни находок» по каждой
# > из четырёх. Держит непустоту оставшихся заглушек тот же гейт — он самоистекает
# > по каждой записи отдельно (`testing.md` §«Гейт на класс», п. 5), и это
# > означает, что следующая заглушка без предмета будет найдена тем же прогоном,
# > а не памятью.
misconfiguration:
  helm:
    set:
      # `zot.auth.username` здесь не стоит НАМЕРЕННО: у него есть рабочее
      # умолчание чарта (`kacho-registry`), страж требует только пароль, и заглушка
      # подменяла величину, ничего не открывая. Снята по находке гейта
      # `assert-scan-stubs-hide-nothing.py` — снятие не меняет ни целей, ни находок.
      - zot.auth.password=trivy-scan-only
      - db.password=trivy-scan-only
