# dependabot — автообновление зависимостей и версий инструментов.
#
# В polyrepo этот файл был ТОЛЬКО у kacho-compute и kacho-vpc (2 репо из 12) и покрывал
# лишь gomod + github-actions. Остальные репо не обновлялись вообще, а в монорепу файл
# не переехал (GitHub читает .github только из корня). Здесь — единообразно и на все
# экосистемы сразу: единый go.mod покрывает весь Go-граф, плюс npm консоли и базовые
# образы Dockerfile'ов.
#
# ЗАЧЕМ ЭТО ВАЖНО ИМЕННО СЕЙЧАС: мы осознанно запинили инструменты, чтобы local == CI
# (buf, golangci-lint, helm, kind, grpcurl, trivy-action — см. kacho-ci-determinism в
# vault). Пин без автообновления протухает молча: trivy со старой базой CVE, gosec без
# новых правил, helm — не той версии, что на проде. Бот превращает пин из «замороженного
# навсегда» в «обновляется осознанно, через PR с зелёным CI».
version: 2
updates:
  # Go — единый модуль на всю платформу (proto + corelib + 7 сервисов + gateway).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Группируем связанное: grpc и protobuf обязаны идти в ногу с версиями
      # protoc-плагинов (tools/tools.go), иначе generate-diff начнёт мигать.
      go-grpc:
        patterns: ['google.golang.org/grpc*', 'google.golang.org/protobuf*']
      go-otel:
        patterns: ['go.opentelemetry.io/*']

  # GitHub Actions — сюда попадают и SECURITY-инструменты: aquasecurity/trivy-action,
  # github/codeql-action, actions/setup-*. Именно этот блок держит сканеры свежими.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly   # было monthly — сканеры безопасности не должны отставать на месяц
    open-pull-requests-limit: 5
    groups:
      security-tools:
        patterns: ['aquasecurity/*', 'github/codeql-action*']

  # Базовые образы Dockerfile'ов — их CVE закрываются апстримом, а мы бы узнавали об
  # этом только из падения trivy fs.
  #
  # ДОМЕН ЗАДАН ШАБЛОНОМ, А НЕ ПЕРЕЧНЕМ. Здесь стоял рукописный список из девяти
  # каталогов, тогда как Dockerfile'ов в дереве двадцать пять: шестнадцать — сайты
  # документации семи сервисов и девять приложений консоли — не обновлялись вообще.
  # Заметно это не было ничем: бот молчит о том, чего ему не поручили смотреть, и его
  # молчание неотличимо от «всё свежее». Расхождение наблюдалось прямо — единственный
  # сайт документации, попавший в список, уехал на node 26 и nginx 1.31, а семь его
  # точных близнецов остались на node 22 и nginx 1.27.
  #
  # Перечень намеренно НЕ «дополнен до двадцати пяти»: список той же природы отстал бы
  # снова на первом же новом каталоге. Шаблоны глубины покрывают дерево целиком и
  # отстать от него не могут — предмет дрейфа убран, а не взят под присмотр.
  #
  # Почему `*`, а НЕ `**`: справочник dependabot гарантирует у ключа `directories`
  # «globbing и подстановочный символ `*`», а рекурсивный `**` документирует только у
  # `exclude-paths`. Опираться на недокументированное здесь особенно опасно: неверный
  # шаблон не ошибка, а ТИШИНА — покрытие стало бы нулевым вместо девяти каталогов, и
  # выглядело бы это ровно как «всё свежее». Манифесты лежат на глубине 1-3
  # (`/gateway`, `/services/<svc>`, `/services/<svc>/docs-site`), поэтому трёх
  # односегментных шаблонов достаточно; проверено пересчётом по дереву — 25 каталогов
  # с Dockerfile и 15 с package-lock.json покрыты полностью.
  - package-ecosystem: docker
    directories:
      - '/*'
      - '/*/*'
      - '/*/*/*'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      base-images:
        patterns: ['*']

  # Консоль и сайты документации. Тот же шаблон и по той же причине, что у docker:
  # рукописный перечень называл семь каталогов консоли, а `package-lock.json` в дереве
  # пятнадцать — восемь сайтов документации (Docusaurus у gateway и семи сервисов) не
  # обновлялись вообще. Workspace-корень `/ui-future` покрывает своих участников
  # (shared/vpc/iam/system) их общим локом, остальные пакеты несут свой.
  - package-ecosystem: npm
    directories:
      - '/*'
      - '/*/*'
      - '/*/*/*'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*']
      test-tooling:
        patterns: ['jest*', '@testing-library/*', '@playwright/*', 'playwright*']
