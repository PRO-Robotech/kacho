# production-posture — стенд ДЕЙСТВИТЕЛЬНО поднимается в production-режиме.
#
# ЗАКРЫВАЕМЫЙ ПРОБЕЛ. security.md требует: «values.prod ОБЯЗАН реально boots
# (helm install + rollout-ready в production-mode, не только helm template)». До этого
# workflow единственной проверкой чартов был `helm lint` + `helm template` в ci.yaml, а
# единственной РЕАЛЬНОЙ установкой — `make dev-up` внутри e2e-newman, и та по DEV-профилю.
# То есть production-профиль не поднимался автоматически НИКОГДА.
#
# Почему template недостаточно: production boot-guard'ы (Config.Validate → refuse-to-start
# при insecure config) срабатывают в РАНТАЙМЕ, шаблон при этом рендерится идеально.
# Реальный инцидент: chart api-gateway рендерился зелёным, но не нёс knob'а для
# mTLS+SPIFFE на internal :9091 → crash-loop ровно на values.prod. Ловится только
# подъёмом + ожиданием rollout.
#
# ЧТО ГЕЙТ ДОКАЗЫВАЕТ: каждый сервис СТАРТУЕТ с production-конфигом (authMode=
# production/-strict, mTLS везде, sslmode=require, breakglass off) и доходит до Ready,
# т.е. чарты несут все knob'ы, которых требуют их boot-guard'ы.
# ЧЕГО НЕ ДОКАЗЫВАЕТ: функциональную корректность authz/токенов — это e2e-newman.
#
# ── ПОЧЕМУ ОТДЕЛЬНЫЙ WORKFLOW, А НЕ ДЖОБА В ci.yaml ────────────────────────────
# 1. Стенд тяжёлый: ~4.2 ГБ memory.requests плюс kind-нода, и полный bring-up ~13 мин
#    до фазы production. Джобе в ci.yaml (минуты, а не десятки минут) это не место.
# 2. [ДОВОД СНЯТ 2026-08-22, задача #957] Здесь стояло: имя kind-кластера
#    (`kacho`) общее с e2e-newman, поэтому триггер на запрос слияния дал бы два
#    прогона, дерущихся за один кластер, и любой сносил бы чужой.
#
#    Довод неверен, и опровергает его тот же абзац, которым он дописывался:
#    джоба идёт на `ubuntu-latest`, то есть получает СВОЮ виртуальную машину, а
#    кластер kind живёт ВНУТРИ неё. Два одноимённых кластера на двух разных
#    машинах друг друга не видят by construction; «один и тот же ИМЕНОВАННЫЙ
#    кластер в двух прогонах» — это два разных кластера с одинаковым именем.
#    Довод пережил своё основание: он писался во времена своего ранера, где
#    машина была общей, и остался после переезда, поменяв формулировку, но не
#    предмет.
#
#    Довод №1 (стенд тяжёлый) верен и остаётся единственным, поэтому запрос
#    слияния покрыт ИЗБИРАТЕЛЬНО: только с базой `main`, то есть на MR
#    релизной ветки. См. блок `on:` ниже.
#
# Это ровно та форма, которую предписывает регламент, когда полноценный install слишком
# тяжёл для pre-merge джобы: гейт СУЩЕСТВУЕТ и ПАДАЕТ при недоборе rollout.
#
# ── ЧТО ИМЕННО ЗАПУСКАЕТСЯ ─────────────────────────────────────────────────────
# `make dev-prod-up` (deploy/Makefile): проверенный двухфазный bring-up dev-up
# (cert-manager CRD → mTLS), затем фаза 3 — `helm upgrade` с
# values.dev-prod.yaml (production-posture поверх kind-локальных адаптаций), затем:
#   * assert-rollout-ready       — КАЖДЫЙ Deployment/StatefulSet rollout-complete,
#                                  БЕЗ `|| true`; на провале печатает describe + логи
#                                  (в т.ч. --previous, где и виден boot-guard Fatalf);
#   * assert-production-posture  — на живом стенде НЕТ ни одного mode=dev (защита от
#                                  ложного зелёного, если профиль не применился).
name: production-posture

on:
  workflow_dispatch:
  # ЗАПРОС СЛИЯНИЯ В СТВОЛ — да; внутрь релизной ветки — нет.
  #
  # До 2026-08-22 триггера на запрос слияния не было вовсе, и это означало ровно
  # то, что записано в задаче #957: «зелёный запрос слияния области подъёма НЕ
  # ПОКРЫВАЕТ», а знал об этом один документ. Теперь покрывает — и ровно в той
  # единственной точке, где корпус разрешает тратить ранеры
  # (`git-issues.md` §«Накопительная релизная ветка»): на MR релизной ветки
  # в `main`.
  #
  # Сужение по `branches` обязательно и в обратную сторону: без него
  # четвертьчасовой подъём стенда шёл бы на КАЖДЫЙ запрос слияния внутрь
  # релизной ветки — тот самый расход, ради устранения которого накопительный
  # режим и заведён.
  pull_request:
    branches: [main]
  schedule:
    # 02:17 UTC ежедневно. Ночное окно выбрано было ради развода с чужими
    # прогонами; довод про общий кластер снят (см. пункт 2 шапки), но время
    # оставлено: ночной прогон отвечает на другой вопрос — «ствол ДЕРЖИТ
    # посадку сегодня», независимо от того, был ли за сутки хоть один MR.
    - cron: '17 2 * * *'

permissions:
  contents: read

# Своя группа + cancel-in-progress: false. Отменять НЕЛЬЗЯ: прерванный прогон не доходит
# до шага уборки, а вердикт этого гейта — «стенд ПОДНЯЛСЯ», и отменённый прогон его не
# выносит. На одноразовой VM брошенный кластер исчезает вместе с ней, поэтому прежний
# довод (занятый диск живущей машины) снят — довод остался, причина у него другая.
concurrency:
  group: production-posture
  cancel-in-progress: false

# СТАТУС КОНВЕЙЕРА НЕ ТЕРЯЕТСЯ. Умолчание GitHub для `run:` — `bash -e {0}`, то
# есть БЕЗ pipefail: `<проверка> | tee`, `<сборка> | grep` отдают шагу код
# возврата ПРАВОЙ команды и зеленеют при любом провале левой. `shell: bash` —
# документированный синоним `bash --noprofile --norc -eo pipefail {0}`;
# относительно умолчания это добавляет ровно pipefail.
# Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги,
# которых тут ещё нет. Гейт класса — internal/repohygiene/pipefailguard_test.go.
defaults:
  run:
    shell: bash

jobs:
  stand:
    name: values.dev-prod boots (kind, production posture)
    # GitHub-hosted (решение владельца 2026-08-04 — собственный ранер выведен из строя).
    # Job, ждущий метку `self-hosted`, которую больше некому предъявить, не падает, а
    # молча висит в очереди: гейт формально провязан и не способен ни подтвердить
    # посадку, ни опровергнуть.
    runs-on: ubuntu-latest
    # dev-up ~13м + фаза 3 (перезапуск всех подов с production-конфигом) + rollout-wait.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Тулчейны ставим сами и с ПИНАМИ, не полагаясь на состав образа ранера: он
      # меняется без нашего участия, и «оно там было» — не инвариант.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      # ПИН ОБЯЗАТЕЛЕН — та же причина и то же значение, что в ci.yaml/e2e-newman:
      # без `version` setup-helm ставит ПОСЛЕДНЮЮ, и версия менялась бы без единой
      # правки в дереве. Прежний v3.17.0 удерживал прошлую мажорную из-за двойного
      # владения аннотацией `kacho.cloud/openfga-model-id-rev` под server-side apply
      # (kacho#3); второй писатель снят вместе со всем движком прав (S6 эпика #747),
      # изнутри релиза шаблон пода не патчит никто — предмета у запрета нет.
      # Расхождение значения между тремя конвейерами ловит
      # .github/scripts/check-pinned-tools.sh --divergence-only.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v4.2.4
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5
      # kind — БИНАРЬ, без создания кластера: кластер поднимает `make dev-up` своим
      # kind-config (host-port mappings для ingress). БЕЗ sudo и в ~/bin — установка
      # переносима между ранерами и переживает смену площадки.
      #
      # ВЕРСИЯ ОБЯЗАНА СОВПАДАТЬ с пином в e2e-newman.yml, и это не оформление: версия
      # kind задаёт версию Kubernetes узла (0.32.0 → `kindest/node:v1.36.1`, 0.30.0
      # ставил v1.34.0). Два конвейера, поднимающие стенд разными kind, судят о том же
      # дереве на разных кластерах — вердикты становятся несравнимы. Совпадение держит
      # .github/scripts/check-pinned-tools.sh (--divergence-only), там же — разбор
      # перехода на kubeadm v1beta4.
      - name: kind
        run: |
          mkdir -p "$HOME/bin"
          curl -sSLo "$HOME/bin/kind" https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x "$HOME/bin/kind"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/kind" version

      # ДИСК — узкое место: на ubuntu-latest свободно ~14 ГБ, а production-фаза держит
      # образы всех сервисов, kind-ноду и слои. Предустановленные тулчейны, которых не
      # касается ни один шаг, снимаем ДО стенда, а не после `no space left`.
      # `|| true` намеренно: состав образа ранера меняется, отсутствие каталога —
      # законный ответ. Печатаем диск до и после, чтобы «ноль освобождённого» было
      # видно числом, а не подразумевалось.
      - name: освободить диск под стенд
        env:
          DISK_FLOOR_GB: "40"
        run: |
          set -u
          # УБОРКА ПРИМЕНЯЕТСЯ, ТОЛЬКО ЕСЛИ ЕСТЬ БОЛЕЗНЬ (#675).
          #
          # Прежняя редакция печатала свободное место и не читала его: при 85 ГБ
          # свободных из 145 она всё равно сносила гигабайты каталогов и однажды
          # провисела свои шесть минут, уронив джобу. Вердикта по пробам не
          # получила НИ ОДНА — то есть мера против нехватки места сама стала
          # причиной отказа, а её отказ был неотличим от красноты продукта.
          #
          # Порог — 40 ГБ: полный стенд (образы всех сервисов + консоль + kind)
          # укладывается в ~25 ГБ, остаток оставлен на слои сборки.
          #
          # У КАЖДОЙ КОМАНДЫ СВОЙ ПРЕДЕЛ. Предел шага — не предел команды: он
          # говорит «что-то встало», но не говорит что. Тот же класс уже чинили у
          # добычи браузера. `|| true` здесь не помогает by construction: команда,
          # которая не вернётся, не вернётся и с ним.
          FREE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "=== свободно ${FREE_GB} ГБ, порог ${DISK_FLOOR_GB} ГБ"
          if [ "$FREE_GB" -ge "$DISK_FLOOR_GB" ]; then
            echo "=== уборка НЕ НУЖНА — места достаточно, шаг пропущен"
            exit 0
          fi

          echo "=== места мало, убираю"
          if ! sudo timeout 120 rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                                       /opt/hostedtoolcache/CodeQL /usr/local/share/boost; then
            echo "::warning title=Уборка каталогов не завершилась::снятие предустановленных каталогов не уложилось в 120 с либо отказало; продолжаю — место могло освободиться частично"
          fi
          if ! sudo timeout 120 docker image prune -af > /dev/null; then
            echo "::warning title=Уборка образов не завершилась::обход образов не уложился в 120 с либо отказал; продолжаю"
          fi
          echo "=== после уборки:"; df -h / | tail -1

      # Сносим ДО, а не только ПОСЛЕ: прошлый прогон мог упасть жёстко (timeout/kill) и
      # не дойти до уборки, а переиспользованный кластер — источник ложных результатов.
      - name: снести кластер от прошлого прогона
        run: |
          kind delete cluster --name kacho 2>/dev/null || true
          echo "=== диск до стенда:"; df -h / | tail -1

      # ГЕЙТ. Падает, если хоть один workload не дошёл до rollout-complete в
      # production-posture, либо если стенд поднялся не в production-режиме.
      - name: стенд в production-posture (dev-prod-up)
        id: stand
        working-directory: deploy
        run: make dev-prod-up

      # ДИАГНОСТИКА ПРИВЯЗАНА К ПРЕДМЕТУ (#728). Код возврата здесь погашен и
      # раньше — падать шаг не умел, — но на отсутствующем кластере он молчал:
      # печатал пустой заголовок «auth-mode на живом стенде» и ни слова о том,
      # что живого стенда нет. Тихая форма того же класса.
      #
      # Положения шага подъёма выписаны поимённо, а не отрицанием: у шага,
      # который вовсе не начинался, исход ПУСТ, и `!= 'skipped'` пропустило бы
      # диагностику ровно в том случае, ради которого она привязывается.
      - name: что поднялось
        if: ${{ always() && (steps.stand.outcome == 'success' || steps.stand.outcome == 'failure') }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/stand-present-or-explain.sh" "стенд в боевой посадке" || exit 0
          kubectl -n kacho get pods -o wide || true
          echo "=== auth-mode на живом стенде ==="
          kubectl -n kacho get pods -o json 2>/dev/null \
            | jq -r '.items[].spec.containers[]?.env[]? | select(.name|test("AUTH_?N?_MODE$")) | "\(.name)=\(.value)"' \
            | sort -u || true

          # ─── ЧТО СКАЗАЛ УПАВШИЙ ШАГ, А НЕ ТОЛЬКО ЧТО ОН УПАЛ ────────────────
          #
          # Стражи наших init-контейнеров устроены так, чтобы ГОВОРИТЬ: у шага
          # подстановки девять именованных отказов, каждый называет причину, ручку
          # и следующий шаг. Пока их вывод сюда не доезжает, разбор идёт
          # воспроизведением — извлечь шаг из рендера, собрать карту настроек,
          # подставить условия, — и это десяток заходов, которые могут дать
          # ЗЕЛЁНОЕ, потому что воспроизвести удаётся не все условия стенда.
          # Наблюдалось (#1787): оба пода личности в Init:CrashLoopBackOff, в логе
          # задания ноль строк с текстом отказа, причина осталась неустановленной.
          #
          # `--previous` обязателен: перезапущенный контейнер отдаёт журнал ЖИВОЙ
          # попытки, а нужна та, что упала. Оба вызова терпимы к отказу — под мог
          # не дойти до запуска вовсе, и это не повод рушить шаг отчёта.
          echo "=== журналы НЕготовых подов (включая init) ==="
          { kubectl -n kacho get pods -o json 2>/dev/null || true; } \
            | { jq -r '.items[] | select([.status.containerStatuses[]?, .status.initContainerStatuses[]?] | map(.ready) | all | not) | .metadata.name' || true; } \
            | while read -r pod; do
                [ -n "$pod" ] || continue
                echo "--- под $pod ---"
                kubectl -n kacho describe pod "$pod" 2>/dev/null | sed -n '/^Events:/,$p' | head -30 || true
                names=$(kubectl -n kacho get pod "$pod" -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}' 2>/dev/null || true)
                for c in $names; do
                  echo "  ·· $pod/$c (текущий) ··"
                  kubectl -n kacho logs "$pod" -c "$c" --tail=40 2>&1 | head -40 || true
                  echo "  ·· $pod/$c (предыдущая попытка) ··"
                  kubectl -n kacho logs "$pod" -c "$c" --previous --tail=40 2>&1 | head -40 || true
                done
              done || true

      # ─── ВЕРДИКТ ЧИСЛАМИ, В СВОДКУ ПРОГОНА ─────────────────────────────────
      #
      # Гейт, чей вердикт лежит только в логе, ничем не отличается от невызванного:
      # логи планового прогона не читает никто, а «зелёная галочка» не говорит,
      # СКОЛЬКО было проверено. Тогда «ноль отказов за всю жизнь контроля»
      # неотличимо от «контроль ничего не осматривал» — та же беда, что у очереди,
      # не доставившей ни одной строки.
      #
      # Поэтому здесь печатается ПЕРЕПИСЬ: сколько workload'ов в пространстве имён,
      # сколько из них готовы, сколько процессов заявили боевую посадку при старте и
      # сколько соединений СУБД реально шифровано. Последнее — независимое
      # подтверждение со стороны БД: настройкой его не подделать.
      #
      # Это ОТЧЁТ, а не гейт: вердикт выносит `make dev-prod-up` выше своим кодом
      # возврата, и подменять его тут нечем. Но отчёт обязан честно сказать, когда
      # он не прочитал НИЧЕГО, — иначе пустая сводка сойдёт за чистую.
      - name: вердикт числами (в сводку прогона)
        # ПРИВЯЗКА К ПРЕДМЕТУ (#728). Положения шага подъёма выписаны поимённо,
        # а не отрицанием: у шага, который вовсе не начинался, исход ПУСТ, и
        # `!= 'skipped'` пропустило бы отчёт ровно тогда, когда отчитываться не
        # о чем.
        if: ${{ always() && (steps.stand.outcome == 'success' || steps.stand.outcome == 'failure') }}
        run: |
          set -uo pipefail

          # СТЕНДА МОГЛО НЕ БЫТЬ, И ТОГДА ОТЧЁТ ГОВОРИТ ЭТО ПРЯМО.
          #
          # Ниже перепись читается с кластера. Без него всякое чтение отказывает,
          # а `pipefail` (объявлен строкой выше) делает отказ кодом возврата
          # ПРИСВОЕНИЯ — под `bash -e`, которым GitHub исполняет тело шага, это
          # обрывало шаг на первой же строке. Следствие было хуже эха: ветка
          # «прочитано НОЛЬ», написанная ровно для этого случая, не исполнялась
          # НИКОГДА, а в сводку не попадало ничего. Замерено исполнением тела в
          # обеих оболочках: без `-e` — код 0 и полная перепись, с `-e` — код 1 и
          # пустой вывод.
          "$GITHUB_WORKSPACE/.github/scripts/stand-present-or-explain.sh" "стенд в боевой посадке" || {
            {
              echo "### стенд в боевой посадке — перепись НЕ СНЯТА"
              echo
              echo "Кластера нет: подъём стенда (\`dev-prod-up\`) не состоялся или оборвался —"
              echo "виновник назван ТЕМ шагом. Осматривать было нечего, поэтому чисел ниже нет,"
              echo "и пустую сводку нельзя прочесть как «отказов ноль»."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Счётчик ВСЕГДА отдаёт ровно одно целое.
          #
          # Наивное `... | grep -c . || echo 0` этого НЕ делает: `grep -c` на нуле
          # совпадений печатает `0` И выходит с кодом 1, поэтому `|| echo 0`
          # срабатывает ТОЖЕ, и в переменную попадает две строки. Дальше числовое
          # сравнение ломается — а вместе с ним и ветка «прочитано ноль», то есть
          # отчёт терял ровно то утверждение, ради которого написан. Поймано
          # прогоном этого шага без кластера, а не вычитано, — но в оболочке БЕЗ
          # `-e`, отчего сам обрыв присваивания и остался тогда незамеченным.
          count() { awk 'END{print NR+0}'; }

          # `|| true` на КАЖДОМ чтении — не украшение: кластер может исчезнуть и
          # между стражем выше и строкой ниже, а отчёт обязан дойти до переписи в
          # любом случае. Значение при отказе не теряется: awk печатает `0` сам,
          # и погашен здесь только КОД ВОЗВРАТА, а не результат.
          pods=$(kubectl -n kacho get pods --no-headers 2>/dev/null | count) || true
          ready=$(kubectl -n kacho get pods --no-headers 2>/dev/null \
                    | awk '{split($2,a,"/"); if (a[1]==a[2] && a[2]!="0") n++} END{print n+0}') || true
          prod=$(kubectl -n kacho get pods -o json 2>/dev/null \
                   | jq -r '[.items[].spec.containers[]?.env[]?
                             | select(.name|test("AUTH_?N?_MODE$"))
                             | select(.value=="production")] | length' 2>/dev/null) || true
          pods=${pods:-0}
          ready=${ready:-0}
          prod=${prod:-0}

          # Шифрование со стороны СУБД — независимое подтверждение: настройкой пода
          # его не подделать. «?» означает «не спросили», и это НЕ ноль.
          pg=$(kubectl -n kacho get pods --no-headers -o custom-columns=:metadata.name 2>/dev/null \
                 | awk '/^pg-/{print; exit}') || true
          if [ -n "${pg:-}" ]; then
            ssl=$(kubectl -n kacho exec "$pg" -- \
                    psql -tAc "select count(*) from pg_stat_ssl where ssl" 2>/dev/null | tr -d ' ') || true
          fi
          ssl=${ssl:-?}

          {
            echo "### стенд в боевой посадке — вердикт"
            echo
            echo "| что | сколько |"
            echo "|---|---|"
            echo "| workload'ов в пространстве имён | $pods |"
            echo "| из них готовых | $ready |"
            echo "| процессов заявили боевую посадку | $prod |"
            echo "| шифрованных соединений СУБД (pg_stat_ssl) | $ssl |"
            echo
            if [ "$pods" -eq 0 ]; then
              echo "**Прочитано НОЛЬ workload'ов.** Это не «чисто»: осматривать было нечего,"
              echo "и вердикт выше относится к подъёму стенда, а не к его посадке."
            else
              echo "Вердикт посадки — код возврата шага \`dev-prod-up\` выше; здесь перепись"
              echo "того, что было осмотрено, чтобы «ноль отказов» нельзя было спутать с"
              echo "«ноль осмотренного»."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "перепись: workload'ов=$pods готовых=$ready боевых=$prod pg_ssl=$ssl"
          if [ "$pods" -eq 0 ]; then
            echo "::warning::прочитано ноль workload'ов — перепись пуста, посадка не подтверждена"
          fi

      # ─── ПРОВЕНАНС УЧЁТНЫХ ДАННЫХ ОБРАТНОГО ВЫЗОВА (отчёт) ─────────────────
      #
      # ЭТО РАБОТА ПОСАДКИ — И ИМЕННО ЗДЕСЬ ОТКАЗ НАБЛЮДАЛСЯ (задача #1803).
      # Отчёт звали два соседних конвейера, а работа, поднимающая стенд в боевой
      # посадке, диагноза не собирала: единственное место, где шаг подстановки
      # роняет под, оставалось без ответа на вопрос «одну ли величину держат
      # стороны». Разбор шёл воспроизведением — извлечь шаг из рендера, собрать
      # карту, подставить условия, — и стоил трёх полных прогонов стенда.
      #
      # ОТЧЁТ, А НЕ ГЕЙТ. Вердикт о величине выносит страж запуска
      # (init-контейнер подстановки): он роняет ПОД, то есть отказывает раньше и
      # ближе к причине. Роняя здесь, мы получили бы второй красный шаг об одном
      # предмете. Поэтому код возврата разбирается на ТРИ исхода, и ни один из
      # них не роняет job.
      #
      # Собственного `id` у шага НЕТ намеренно: в этой работе его исход не читает
      # никто, а объявленная и никем не читаемая величина — мёртвое объявление.
      # Привязка к подъёму выписана поимённо, как у соседних шагов: у шага,
      # который не начинался, исход ПУСТ, и отрицанием его не поймать.
      - name: провенанс учётных данных обратного вызова (отчёт)
        if: ${{ always() && (steps.stand.outcome == 'success' || steps.stand.outcome == 'failure') }}
        working-directory: deploy
        run: |
          # Код возврата берётся ВЕЛИЧИНОЙ, а не условием продолжения: тело шага
          # исполняется под `bash -e`, и ненулевой код оборвал бы его молча — до
          # развилки, ради которой шаг и написан.
          bash scripts/identity-hook-credential-provenance.sh kacho && rc=0 || rc=$?
          case "$rc" in
            0) echo "провенанс: находок нет среди ИЗМЕРЕННОГО — объём осмотренного назван переписью выше" ;;
            1) echo "::warning title=Провенанс обратного вызова::стороны держат РАЗНЫЕ величины либо в конфигурации голое имя — вердикт выносит страж запуска, здесь только отчёт" ;;
            *) echo "провенанс: условие не создано (код $rc) — вердикта о величине нет" ;;
          esac

      # Кластер сносится ВСЕГДА. На одноразовой VM он и так не переживёт job, но шаг
      # остаётся: он стоит копейки и держит workflow переносимым обратно на машину,
      # живущую между прогонами, — где его отсутствие ломало бы следующий e2e-newman.
      - name: снести стенд
        if: always()
        run: |
          kind delete cluster --name kacho 2>/dev/null || true
          echo "=== диск после уборки:"; df -h / | tail -1
