# runner-probe — разведка ранера: что на нём вообще есть, прежде чем переносить туда
# job'ы. Ядра/память/диск. Запускается только руками (workflow_dispatch), ничего не меняет.
#
# JOB `probe` СНЯТ вместе со своим предметом (2026-08-04): он обследовал self-hosted
# beget-runner, которого больше нет. Оставленный, он не падал бы, а МОЛЧА висел в
# очереди до таймаута — то есть предъявлял бы вид работающей разведки, ничего не
# разведав. Именно этот механизм и скрывал от нас, что e2e не гонялся: очередь за
# несуществующей меткой выглядит как «ещё идёт», а не как «некому исполнить».
#
# Останется ЗДЕСЬ и когда появится новый свой ранер: вернуть job — три строки, а
# число, которое он печатает (сколько даёт площадка), нужно до переноса, а не после.
name: runner-probe

on:
  workflow_dispatch:

permissions:
  contents: read

# СТАТУС КОНВЕЙЕРА НЕ ТЕРЯЕТСЯ. Умолчание GitHub для `run:` — `bash -e {0}`, то
# есть БЕЗ pipefail: `<проверка> | tee`, `<сборка> | grep` отдают шагу код
# возврата ПРАВОЙ команды и зеленеют при любом провале левой. `shell: bash` —
# документированный синоним `bash --noprofile --norc -eo pipefail {0}`;
# относительно умолчания это добавляет ровно pipefail.
# Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги,
# которых тут ещё нет. Гейт класса — internal/repohygiene/pipefailguard_test.go.
defaults:
  run:
    shell: bash

jobs:
  # Сколько даёт площадка, на которой теперь идёт ВСЁ. Репо ПУБЛИЧНЫЙ, и публичным
  # репозиториям GitHub выдаёт увеличенные ранеры — но «выдаёт» это утверждение о
  # чужой политике, а не о нашем прогоне, и стоит оно ровно до следующей её правки.
  # Поэтому число берётся ЗАМЕРОМ: стенд newman требует 4.2 ГБ requests, и влезает он
  # или нет — читается отсюда, а не из документации провайдера.
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: сколько даёт ubuntu-latest
        run: |
          echo "  CPU: $(nproc) ядер"
          free -h | sed 's/^/  /'
          df -h / | tail -1 | sed 's/^/  диск: /'
