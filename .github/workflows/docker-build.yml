# docker-build — multiarch-сборка и пуш образов всех сервисов монорепы.
#
# Одна матрица вместо 8 отдельных per-repo workflow. Build-context — КОРЕНЬ репо
# (единый Go-модуль), Dockerfile берётся по раскладке: services/<svc>/ либо gateway/.
#
# Теги: <branch>-<sha8>.

name: docker-build

on:
  push:
    branches:
      - main
      - "KAC-*"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  # ─── СБОРКА ПОСЛЕ e2e, А НЕ РЯДОМ С НИМ ────────────────────────────────────
  #
  # Историческая часть, объясняющая, зачем строка появилась: триггер знал только
  # main, KAC-* и теги, а работа шла в долгоживущую интеграционную ветку — то есть
  # образ собирался НЕ ИЗ ТОГО состояния, которое проверяется. Ветка снята
  # 2026-08-07 (ствол опубликован прямо в main), но правило пережило её и потому
  # остаётся: собирать образ надо из состояния, прогнанного через стенд.
  # Это уже стоило прода однажды: сервис не собирался, образ не обновлялся, а
  # узнали по 403 на живом стенде. Сборка образа — такой же гейт, как тест.
  #
  # Почему НЕ `push:` на эту ветку. Изначально — потому что ранер был ОДИН и сборка
  # состязалась бы с e2e-newman (~35 мин) за единственную машину. На GitHub-hosted
  # состязания за машину нет, но триггер сохранён по ДРУГОЙ, уцелевшей причине:
  # собирать образ имеет смысл из состояния, которое уже прогнали через стенд, а не
  # рядом с ним. То есть цепочка «сборка после e2e» осталась, а её обоснование
  # сменилось — и это записано, чтобы следующий читатель не снял её как наследие
  # мёртвого ранера.
  #
  # `branches:` здесь фильтрует ветку ВЫШЕСТОЯЩЕГО прогона (не ветку этого файла).
  workflow_run:
    workflows: [e2e-newman]
    types: [completed]
    branches: [main]

  # Ручной запуск на произвольной ветке — остаётся единственным способом собрать
  # ветку, которую не покрывает ни один автотриггер.
  workflow_dispatch:

# Заведено под один ранер, где очередь росла быстрее, чем разбиралась. На GitHub-hosted
# очередь так не копится, но группа СОХРАНЕНА: образы устаревшего коммита не нужны никому,
# а multiarch-сборка восьми образов — не та работа, которую стоит доводить до конца ради
# состояния, которое уже вытеснено следующим. Довод сменился с «одна машина» на «лишняя
# работа», сама отмена — нет.
#
# Ключ — ветка ПРОВЕРЯЕМОГО состояния, а не `github.ref`: у прогона по workflow_run
# `github.ref` указывает на ветку по умолчанию (см. шаг «состояние под проверкой»),
# поэтому на нём все такие прогоны попали бы в ОДНУ группу и отменяли друг друга
# независимо от того, какую ветку собирают.
concurrency:
  group: docker-build-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

# `actions: write` — НЕ расширение прав «на всякий случай»: кэш `type=gha` пишется через
# Actions Cache API, и без этой записи `--cache-to` не падает, а МОЛЧА ничего не сохраняет.
# То есть кэш был бы объявлен, провязан и пуст на каждом прогоне — форма без содержания,
# и заметить это можно было бы только по времени сборки.
permissions:
  contents: read
  actions: write

env:
  # Namespace для тега при НЕзаданных секретах. Тег обязан остаться WELL-FORMED и в
  # build-only режиме: пустой namespace даёт "/kacho-x:tag", а Docker reference grammar
  # запрещает пустой name-компонент → buildx падает `invalid reference format` ДО пуша,
  # т.е. build-only путь ломается вместе с push'ем (реальный инцидент kacho-storage,
  # 2026-07-15: все docker-build падали, образ CS-1 не собирался).
  FALLBACK_NS: local

# СТАТУС КОНВЕЙЕРА НЕ ТЕРЯЕТСЯ. Умолчание GitHub для `run:` — `bash -e {0}`, то
# есть БЕЗ pipefail: `<проверка> | tee`, `<сборка> | grep` отдают шагу код
# возврата ПРАВОЙ команды и зеленеют при любом провале левой. `shell: bash` —
# документированный синоним `bash --noprofile --norc -eo pipefail {0}`;
# относительно умолчания это добавляет ровно pipefail.
# Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги,
# которых тут ещё нет. Гейт класса — internal/repohygiene/pipefailguard_test.go.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: образы (8 шт, один job)
    # GitHub-hosted (решение владельца 2026-08-04 — собственный ранер выведен из строя).
    #
    # ЧТО ЭТИМ ПОТЕРЯНО, названо честно: на self-hosted кэш слоёв жил в томе
    # персистентного builder-контейнера и ПЕРЕЖИВАЛ прогоны. Одноразовая VM этого не
    # даёт by construction, поэтому кэш ниже переведён на `type=gha` — он тянется по
    # сети и медленнее локального. Это ОСОЗНАННЫЙ размен, а не недосмотр: сборка,
    # которая молча висит в очереди за меткой, которую некому предъявить, не собирает
    # ничего вовсе — а медленная собирает.
    runs-on: ubuntu-latest

    # Отменённый вышестоящий прогон собирать НЕЧЕГО: e2e-newman идёт с
    # cancel-in-progress, поэтому `cancelled` означает «этот коммит вытеснен
    # следующим», а образы устаревшего коммита никому не нужны — та же причина, по
    # которой у этого workflow стоит своя concurrency.
    #
    # А вот `failure` СОБИРАЕМ, и это решение, а не недосмотр: «образ собирается»
    # и «продукт проходит e2e» — разные вопросы, и второй не отвечает за первый.
    # Гейтить сборку на зелёный e2e значило бы получить джоб, который на красной
    # ветке не запускается НИ РАЗУ, при этом выглядит провязанным — то есть снова
    # ноль покрытия, только незаметный.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.conclusion != 'skipped')

    steps:
      # ── СОСТОЯНИЕ ПОД ПРОВЕРКОЙ ────────────────────────────────────────────
      #
      # У прогона по `workflow_run` контекст указывает на ВЕТКУ ПО УМОЛЧАНИЮ, а не
      # на коммит, из-за которого он запустился: `GITHUB_SHA` — последний коммит
      # main, `GITHUB_REF` — main. Это документированное поведение, и это ловушка
      # именно потому, что она беззвучная: checkout по умолчанию возьмёт main,
      # сборка пройдёт, теги отрендерятся, образ уедет в реестр — и будет собран
      # НЕ ИЗ ТОГО состояния, ради покрытия которого триггер и добавлен. То есть
      # исходный дефект вернулся бы в новой маске и выглядел бы исправленным.
      #
      # Поэтому ветка и коммит берутся из полезной нагрузки события, а
      # push/dispatch-семантика остаётся запасной ветвью. Один шаг — один источник
      # истины: ниже и checkout, и теги читают только его выводы.
      - name: состояние под проверкой (ветка и коммит)
        id: subject
        env:
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${RUN_BRANCH:-}" ] && [ -n "${RUN_SHA:-}" ]; then
            ref="$RUN_SHA"; branch="$RUN_BRANCH"; sha="$RUN_SHA"
            echo "источник: завершившийся прогон e2e-newman"
          else
            ref="${GITHUB_REF}"; branch="${GITHUB_REF_NAME}"; sha="${GITHUB_SHA}"
            echo "источник: push/dispatch этого workflow"
          fi
          # Предпосылка: без коммита собирать нечего, и молчать об этом нельзя.
          if [ -z "$sha" ] || [ -z "$branch" ]; then
            echo "::error::не определены ветка/коммит проверяемого состояния — собирать нечего"
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "branch=$(echo "$branch" | sed 's/\//-/g')"
            echo "sha=${sha:0:8}"
            # ПОЛНЫЙ коммит — ОТДЕЛЬНЫЙ вывод, и это не дублирование. В ТЕГ идёт
            # восьмизначный (так пинятся профили посадки), а в ПРОВЕНАНС образа —
            # полный: тег отвечает «что собрали», провенанс — «из чего собрали»,
            # и совпадают они лишь пока никто не пересобирал под тем же именем.
            echo "sha_full=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "ветка=$branch коммит=${sha:0:8}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # НЕ убирать: без явного ref здесь собирался бы main (см. шаг выше).
          ref: ${{ steps.subject.outputs.ref }}

      - name: gate on DockerHub secrets
        id: gate
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Эмитим И push, И namespace: тег НИКОГДА не подставляет секрет напрямую
          # (см. FALLBACK_NS выше — пустой секрет ронял бы даже build-only).
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "ns=$DH_USER" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "ns=$FALLBACK_NS" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB secrets unset — build only, no push (ns '$FALLBACK_NS')"
          fi

      - name: login to Docker Hub
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ПИН ПО DIGEST, а не по `latest`. Тег движется, и тогда вердикт прогона относится
      # к образу, который завтра другой: перемер сравнивает две неизвестные. Особенно
      # больно тут — binfmt задаёт эмуляцию arm64, то есть влияет на то, ЧТО собрано.
      # `qemu-v10.2.3` на 2026-08-04 совпадает с `latest`; digest снимает и это допущение.
      - name: QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      # Обычный builder: на одноразовой VM персистентный контейнер бессмыслен — он не
      # переживает job, а `cleanup: false` при этом создавал бы ВИДИМОСТЬ живущего кэша.
      # Кэш слоёв теперь внешний (`type=gha` в шаге сборки), и это единственное место,
      # где он есть: builder своего между прогонами не хранит.
      - name: Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # ОДИН job на все 8 образов вместо matrix — решение, ДОСТАВШЕЕСЯ от одного ранера,
      # и оно намеренно НЕ пересматривается этой правкой. На GitHub-hosted матрица снова
      # дала бы параллельность (своя VM на образ), но это отдельное изменение со своей
      # ценой (8 VM вместо одной, 8 × checkout/QEMU/buildx, 8 наборов кэша) и своим
      # замером, которого пока нет. Менять посадку и раскладку job'ов ОДНИМ коммитом —
      # значит потом не знать, что из двух дало эффект.
      #
      # КЭШ — `type=gha`, по одному scope на образ. Внутренний кэш builder'а исчезает
      # вместе с VM, поэтому без внешнего каждая сборка шла бы с нуля. `mode=max`
      # сохраняет и промежуточные слои: у многостадийных Dockerfile без него кэшируется
      # только финальная стадия, то есть кэш есть, а толку с него мало.
      # scope на образ обязателен: общий scope означал бы, что восемь сборок пишут в
      # одну запись и затирают друг друга — кэш при этом «есть» и почти всегда мимо.
      - name: сборка образов (8 шт)
        run: |
          set -uo pipefail
          # image:dir:context — у большинства образов контекст сборки КОРЕНЬ монорепы
          # (единый go.mod + pkg/ + proto/ нужны каждому), и меняется только
          # -f Dockerfile.
          #
          # ИСКЛЮЧЕНИЕ — iam, и оно объявлено полем, а не догадкой в коде цикла.
          # Служба несёт СВОЙ go.mod и подключает фундамент внешним модулем по
          # версии, поэтому её контекст — собственный каталог. Дай ей корень —
          # соберётся тоже, но контекст будет на порядок больше нужного, а шапка
          # её Dockerfile утверждает обратное, и утверждение стало бы ложным.
          images="kaname:services/iam:services/iam
          kacho-vpc:services/vpc:.
          kacho-compute:services/compute:.
          kacho-geo:services/geo:.
          kacho-nlb:services/nlb:.
          kacho-storage:services/storage:.
          kacho-registry:services/registry:.
          kacho-api-gateway:gateway:."

          push_flag=""
          [ "${{ steps.gate.outputs.push }}" = "true" ] && push_flag="--push"

          # Собираем ВСЕ, потом падаем — а не set -e на первой. Иначе первый же сбой
          # прячет состояние остальных семи, и вместо «упал registry» видно «упало что-то».
          failed=""
          for entry in $images; do
            image="${entry%%:*}"; rest="${entry#*:}"; dir="${rest%%:*}"; ctx="${rest##*:}"
            echo "::group::$image"
            # ПРОВЕНАНС. Без этих двух аргументов образ уезжает в реестр, не неся
            # ревизии вовсе: `--provenance=false` выше снимает вложение buildkit, а
            # своей величины у образа не было ни в клейме, ни в файле. Тогда
            # `make -C deploy stand-provenance` на управляемом кластере отвечает
            # «не установлена», и «какой код там работает» снова выводится ИЗ ИМЕНИ
            # образа — то есть из величины, которая лжёт при пересборке под прежним
            # тегом. Что аргументы переданы КАЖДОЙ сборкой дерева, держит
            # deploy/stand_provenance_declaration_test.go.
            if docker buildx build \
                 --platform linux/amd64,linux/arm64 \
                 --provenance=false \
                 --build-arg KACHO_IMAGE_REVISION="${{ steps.subject.outputs.sha_full }}" \
                 --build-arg KACHO_IMAGE_VERSION="${{ steps.subject.outputs.branch }}" \
                 --cache-from "type=gha,scope=$image" \
                 --cache-to "type=gha,mode=max,scope=$image" \
                 -f "./$dir/Dockerfile" \
                 -t "${{ steps.gate.outputs.ns }}/$image:${{ steps.subject.outputs.branch }}-${{ steps.subject.outputs.sha }}" \
                 $push_flag "$ctx" ; then
              echo "✓ $image"
            else
              echo "::error::сборка $image упала"; failed="$failed $image"
            fi
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then echo "УПАЛИ:$failed"; exit 1; fi
          echo "✓ все 8 образов собраны"

      # Шаг `prune` СНЯТ вместе со своим предметом: он берёг диск машины, живущей между
      # прогонами, и держал горячий кэш в персистентном builder'е. На одноразовой VM
      # чистить нечего — всё исчезает вместе с ней, а кэш теперь внешний и живёт по
      # правилам Actions Cache (вытеснение по объёму и возрасту — на стороне GitHub).
      # Оставленный «на всякий случай», он был бы шагом, которому нечего убирать.
      #
      # Диск всё же печатаем: сборка восьми multiarch-образов — главный его потребитель
      # в этом job'е, и «не влезли» обязано читаться числом, а не гадаться по падению.
      - name: диск после сборки
        if: always()
        run: df -h / | tail -1
