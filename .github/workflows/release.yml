# release — ПРОИЗВОДИТЕЛЬ ВЕРСИИ ПЛАТФОРМЫ.
#
# ПРЕДМЕТ. Служба iam вынесена отдельным репозиторием и потребляет платформу как
# внешний модуль `github.com/PRO-Robotech/kacho`. Публиковать при этом было
# нечего: семантических тегов на удалённом ноль, заметок о выпусках ноль, и хотя
# механизм проверки предпосылок в дереве лежал, ЗВАЛ ЕГО НОЛЬ ОБЪЯВЛЕНИЙ — ни
# конвейер, ни рецепт сборки. Механизм без зовущего не отличается от
# отсутствующего: «поставим версию когда надо» означает «не поставим никогда».
# Этот файл и есть тот зовущий.
#
# ПОЧЕМУ ТОЛЬКО РУЧНОЙ ЗАПУСК, И ПОЧЕМУ ЭТО НЕ РАСХОД РАНЕРОВ.
#
# Автоматического триггера у процесса нет НИ ОДНОГО, поэтому он идёт ровно
# столько раз, сколько его позвали: накопительный режим (`git-issues.md`
# §«Накопительная релизная ветка») не задет by construction — сужать по ветке
# нечего, событий нет. Это не послабление и не исключение из правила о
# триггерах: у процесса просто нет предмета, который событие могло бы вызвать.
#
# Автоматический выпуск на каждое слияние отвергнут по существу, а не по цене:
# НОМЕР ВЕРСИИ — СУЖДЕНИЕ О СОВМЕСТИМОСТИ, а не следствие слияния. Машина умеет
# сказать, что дельта контрактов ломающая (`breaking-since-release.sh`), и не
# умеет сказать, что изменение поведения ломающим НЕ является. Тег на каждое
# слияние обещал бы совместимость, которой никто не проверял, а отозвать
# обещание нельзя: модуль-прокси кэширует опубликованную версию навсегда.
#
# ПОЧЕМУ ТОЛКАЕТ ССЫЛКУ ПРОЦЕСС, А НЕ ЧЕЛОВЕК РУКАМИ. Ровно ради того, чтобы
# гейты стали НЕОБХОДИМЫМ условием публикации. Публикующий руками их обходит, и
# обходит молча; здесь обойти нельзя — ссылка создаётся тем же прогоном, который
# их спросил. Дистанция для человека та же (он всё равно нажимает), а пропустить
# проверку он больше не может.
#
# ЛОГИКА ЖИВЁТ В СКРИПТАХ, А НЕ В `run:`. Тело шага исполняется под `bash -e`:
# ненулевой код обрывает шаг МОЛЧА — до любой развилки, до `case`, до чтения
# кода. Развилка, написанная в объявлении, не исполнилась бы ни разу, и заметить
# это было бы нечем. Поэтому каждый шаг — один вызов скрипта, а все три исхода
# различает сам скрипт.
#
# ЧТО ПРОЦЕСС МЕНЯЕТ В СОСЕДНЕМ ПОВЕДЕНИИ — НАЗВАНО, А НЕ УМОЛЧАНО.
# Ссылка, созданная встроенным токеном площадки, НЕ ПОРОЖДАЕТ СОБЫТИЙ для других
# процессов (защита площадки от самозацикливания). Значит триггер `tags:` в
# `docker-build.yml` на такой ссылке НЕ СРАБОТАЕТ. Потери в этом нет: образы
# ревизии уже собраны — `docker-build` идёт и на push в `main`, и по завершении
# сквозных проб на `main`, а публикуется ВЕРШИНА СТВОЛА и только она. Если образ
# с именем версии всё же нужен, его собирает явный вызов, и он напечатан в сводке
# прогона.

name: выпуск версии платформы

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия в форме vМАЖОР.МИНОР.ПАТЧ (напр. v0.1.0)'
        required: true
        type: string
      confirm:
        description: 'Повторите номер версии ДОСЛОВНО — подтверждение намерения'
        required: true
        type: string
      publish:
        description: 'Выполнить НЕОБРАТИМЫЙ шаг. Снято — только проверка предпосылок'
        required: true
        type: boolean
        default: false

# Ровно то, что нужно необратимому шагу, и ни правом больше: создать ссылку и
# заметку о выпуске. Прочие права процессу не нужны, а лишнее право переживает
# того, кто его выдал.
permissions:
  contents: write

# Две публикации разом невозможны: вторая ждёт первую, а не гонится с ней за
# одну и ту же ссылку. Отмены на ходу здесь нет НАМЕРЕННО — прогон, который
# может создать необратимую ссылку, не снимают в середине.
concurrency:
  group: release-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: производитель версии
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ПУБЛИКУЕТСЯ ВЕРШИНА СТВОЛА И ТОЛЬКО ОНА. Ветка названа явно, а не взята
      # из `github.ref`: ручной запуск позволяет выбрать любую ссылку, и версия,
      # выпущенная с ветки, ссылалась бы на код, которого в стволе нет.
      # `fetch-depth: 0` нужен гейтам: они читают ссылки и историю.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          # cache: false — по той же причине, что в `ci.yaml`: `go.mod` несёт
          # директиву тулчейна, и распаковка кэша поверх скачанного тулчейна
          # роняет шаг через раз.
          cache: false

      # Версия пинится ровно так же, как в `ci.yaml`: разбор контрактов обязан
      # быть одним и тем же у проверки слияния и у выпуска, иначе «разрывов нет»
      # означало бы разное в двух местах.
      - uses: bufbuild/buf-setup-action@3e33fea8596569a62fcaa33eb3880b6ac7098941  # v1.9.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      # Отправка ссылки идёт учётной записью процесса: подпись автора у ссылки
      # отсутствует (она указывает на чужой коммит), но отправитель обязан быть
      # назван — иначе `git push` откажет за отсутствием личности.
      - name: личность отправителя
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ЕДИНСТВЕННЫЙ шаг, принимающий решение. Три исхода различает сам скрипт:
      # 0 — сошлось (и, при `publish`, ссылка создана), 1 — находка, 2 — позван
      # неверно, 3 — не спрошено. Объявление их не пересказывает и не ветвится.
      # СТРОКОВЫЕ ВХОДЫ ПРИХОДЯТ ЧЕРЕЗ ОКРУЖЕНИЕ, А НЕ ПОДСТАВЛЯЮТСЯ В ТЕЛО.
      # Подстановка выражения прямо в `run:` склеивает ввод пользователя с
      # текстом команды ДО оболочки: кавычки в значении разрывают строку, и
      # дальше исполняется то, что в нём написано. Права на ручной запуск есть
      # не у всех, кто открывает запрос слияния, поэтому это не дыра, а
      # поверхность, которую незачем заводить. Логическая ручка `publish`
      # остаётся выражением осознанно: у неё объявлен тип, значений ровно два, и
      # текстом она не бывает.
      - name: предпосылки выпуска и публикация
        env:
          GH_TOKEN: ${{ github.token }}
          KACHO_RELEASE_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: >-
          scripts/release/publish-tag.sh "$RELEASE_VERSION"
          --confirm "$RELEASE_CONFIRM"
          ${{ inputs.publish && '--publish' || '' }}

      # ГОДНОСТЬ ОПУБЛИКОВАННОГО — ОТДЕЛЬНЫЙ ФАКТ ОТ ГОДНОСТИ ДЕРЕВА.
      # Гейт упаковки внутри предпосылок доказывает, что дерево упаковывается;
      # эта проба спрашивает, СОСТОЯЛАСЬ ли публикация и собирается ли версия у
      # постороннего потребителя через модуль-прокси. Красное здесь — настоящая
      # находка: ссылка уже создана, и «не знаю, годна ли она» после необратимого
      # шага обязано быть громким.
      - name: версия собирается у внешнего потребителя
        if: ${{ inputs.publish }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/release/probe-published.sh "$RELEASE_VERSION"

      - name: сводка прогона
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: scripts/release/summarize-run.sh "$RELEASE_VERSION" "$RELEASE_PUBLISH"
