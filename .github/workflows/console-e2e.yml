# console-e2e — сквозные пробы консоли через браузер, СО СВОИМ стендом.
#
# ─── ПОЧЕМУ ОТДЕЛЬНЫЙ КОНВЕЙЕР, А НЕ РАБОТА В `ui.yml` ──────────────────────
#
# Пробы были написаны 2026-08-11 и жили работой внутри `ui.yml` под условием
# `github.event_name == 'workflow_dispatch'`. Условие честно называло, чего им не
# хватает — поднятого стенда, — но следствие было ровно то, которого правила
# запрещают: работу не запускал НИ ОДИН автоматический триггер, а её соседи по
# конвейеру запускались. Молчание такой работы неотличимо от зелёного, и семь
# проб были слотом в отчёте, а не проверкой.
#
# «Здесь его не запустить» — факт расписания, а не вердикт. Пробе полагается
# СВОЯ ВОЛНА, СОЗДАЮЩАЯ УСЛОВИЕ, и это она: конвейер поднимает собственный
# стенд и гоняет пробы против него. Маски здесь нет — есть подъём.
#
# Отдельный файл, а не работа в `ui.yml`, по одной причине: триггеры принадлежат
# волне. `ui.yml` — лёгкие гейты исходников (типы, линт, юниты, сборка образов),
# и им незачем расписание стенда; стенду незачем идти на каждый прогон типов.
# Разведя их по файлам, мы получаем два независимых набора триггеров вместо
# одного набора с условиями по работам — а условие по работе и есть та форма,
# из-за которой пробы молчали.
#
# ─── ПОЧЕМУ СТЕНД ПОЛНЫЙ, А НЕ ШАРД ────────────────────────────────────────
#
# Проба «каждый модуль загружается и делает свой вызов к API» перебирает ВСЕ
# девять модулей консоли — vpc, compute, storage, nlb, registry, iam, geo,
# сводку и системный раздел. Ни один из пяти стендов `e2e-newman` этого набора
# не несёт: каждый шард намеренно выключает компоненты, которых его суиты не
# трогают. Пристроить пробы к чужому стенду значило бы сузить их до того, что
# на нём поднято, — то есть ослабить утверждение ради экономии.
#
# Консоль на стенде уже есть: `values.dev.yaml` включает подчарт (`uif.enabled`),
# а `make dev-up` собирает её образы (`build-ui`) и сеет базовый каталог
# размещения. То есть волна не заводит своей раскладки — она поднимает ровно тот
# стенд, который поднимает разработчик локально, и это её главное свойство.
#
# ─── ТРЕТЬЯ КАТЕГОРИЯ НЕ ЗАЧИТЫВАЕТСЯ В ЗЕЛЁНОЕ ────────────────────────────
#
# «Пробы не выполнились» и «пробы красные» — разные исходы, и они разведены:
# сначала шаг проверяет, что консоль ОТВЕЧАЕТ через ingress, и падает с
# названной причиной, если условие не создано; вердикт по самим пробам выносит
# код возврата прогона плюс гейт по отчёту, который считает исполненное и
# сверяет его с объявленным в дереве. Суита без отчёта — провалена, не зелёная.
name: console-e2e

on:
  # Пре-мерж-гейт: консоль ломается ровно теми правками, которые проходят типы и
  # юниты (заслонённый маршрут, разъехавшийся базовый путь модуля, абсолютный
  # адрес входа — все три наблюдались живьём и ни один не ловится сборкой).
  pull_request:
    branches: [main]
  # …и на push В САМ main — по той же причине, что в `ui.yml`: гейт обязан
  # смотреть туда, где ИДЁТ работа, а не только на вход в main.
  push:
    branches: [main]
  # Против УЖЕ поднятого стенда (кластер разработчика, боевой контур): адрес
  # приходит входом и подменяет собственный подъём. Это дополнение к
  # автоматическим триггерам, а не замена им.
  workflow_dispatch:
    inputs:
      console_url:
        description: >-
          Адрес уже поднятой консоли (например http://console.example). Пусто —
          конвейер поднимает свой стенд.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: console-e2e-${{ github.ref }}
  cancel-in-progress: true

# СТАТУС КОНВЕЙЕРА НЕ ТЕРЯЕТСЯ. Умолчание GitHub для `run:` — `bash -e {0}`, то
# есть БЕЗ pipefail: `<проверка> | tee`, `<подъём> | grep` отдают шагу код
# возврата ПРАВОЙ команды и зеленеют при любом провале левой. `shell: bash` —
# документированный синоним `bash --noprofile --norc -eo pipefail {0}`.
# Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги,
# которых тут ещё нет. Гейт класса — internal/repohygiene/pipefailguard_test.go.
defaults:
  run:
    shell: bash

env:
  # Имя кластера своё — чтобы шаг «снести кластер от прошлого прогона» не убивал
  # чужой стенд, если волна когда-нибудь переедет на машину, живущую между
  # прогонами.
  CLUSTER_NAME: kacho-console
  # Хост ingress консоли объявлен подчартом (`ui-future/deploy/values.yaml`),
  # порт — отображением kind (`deploy/kind/kind-config.yaml`: 80 → 28080).
  CONSOLE_HOST: console.kacho.local
  CONSOLE_PORT: '28080'

jobs:
  probes:
    name: сквозные пробы консоли (свой стенд)
    runs-on: ubuntu-latest
    # Подъём полного стенда с нуля + девять образов консоли + прогон браузером.
    # Потолок взят от шарда e2e-newman (90) — он измерен на той же площадке и на
    # том же `make dev-up`; своего замера у этой волны пока нет, и придумывать
    # число вместо замера здесь не за что.
    timeout-minutes: 90
    steps:
      # У КАЖДОГО ШАГА ЕСТЬ `id`, И ЭТО НЕ УКРАШЕНИЕ (#726). Шаг без него не
      # попадает в контекст `steps` вовсе, поэтому разметчик исхода
      # (`console-run-category.py`, последний шаг) его не видит и не может
      # отнести к «условие не создано». Полноту держит гейт
      # `internal/repohygiene` `TestEveryStepOfTheProbeJobIsVisibleToTheCategoriser`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        id: checkout

      # ─── ГЕЙТ ВЕРДИКТА ПРОВЕРЯЕТСЯ ДО СТЕНДА ────────────────────────────
      # Он статический, стоит секунды, а стенд — десятки минут. Гейт, не
      # доказавший, что умеет краснеть, доказательством не является — и узнавать
      # об этом через сорок минут незачем.
      - name: гейт — самопроверка вердикта по отчёту проб
        id: selftest-verdict
        run: python3 .github/scripts/assert-console-probes-verdict.py --self-test

      # То же и для разметчика исхода: он отвечает на вопрос «какой из трёх
      # исходов», и неспособный ошибиться разметчик отвечал бы всегда одно.
      - name: гейт — самопроверка разметки исхода
        id: selftest-category
        run: python3 .github/scripts/console-run-category.py --self-test

      # …И ДЛЯ РЕШЕНИЯ О БРАУЗЕРЕ (#1288). Оно объявляет, что пробы ходят только
      # МЕСТНЫМ браузером, и отказывает загрузке конфигурации, если удалённый
      # выбран хоть одной из трёх форм. Причина у решения не вкусовая: на полосе
      # удалённого браузера трасса упавшей пробы собирается дописыванием в
      # готовый архив, а дописывание распаковывает каждую его запись — тот самый
      # механизм #1242, из-за которого файл трассы оставался без центрального
      # каталога.
      #
      # Самопроверка гоняется ГОЛЫМ `node`, без установленных зависимостей и без
      # стенда, поэтому стоит секунды и стоит ЗДЕСЬ — до подъёма. Она проверяет
      # не только саму функцию решения, но и ПРОВЯЗКУ: грузит копию настоящей
      # конфигурации с подставным прогонщиком и смотрит, отказала ли она. Решение,
      # которое никто не зовёт, отказывает безупречно и не мешает ничему.
      - name: гейт — самопроверка решения о браузере
        id: selftest-browser-policy
        working-directory: ui-future/e2e
        run: node scripts/remote-browser-policy-selftest.ts

      # То же и для ОТОБРАЖЕНИЯ ИМЕНИ СТЕНДА: у прогона две половины — браузер и
      # путь запроса Node, — и до #1750 ручка закрывала одну. На ранере имя стоит
      # в /etc/hosts, поэтому разрыв здесь не виден НИКОГДА: самопроверка
      # воспроизводит его на заведомо нерезолвимом имени и настоящем сервере на
      # петле, без стенда и за секунды.
      - name: гейт — самопроверка отображения имени стенда
        id: selftest-host-mapping
        working-directory: ui-future/e2e
        run: node scripts/host-mapping-selftest.ts

      # И для РАЗБОРА ОТКАЗА ПРОБЫ ПОТОКА (#2016). Проба падала и проходила на
      # одной ревизии, а её отказ говорил «событий 0» и молчал о соединении: под
      # этим молчанием неразличимы «строку не отправили», «строку не довезли» и
      # «мы не дождались» — три беды с тремя разными владельцами. Разбор, который
      # на любом входе отвечает одинаково, читается ровно так же убедительно, как
      # работающий, поэтому его различающая способность доказывается ЧЕТЫРЬМЯ
      # входами, а не прочтением. Без стенда и за секунды: гонку, ради которой
      # разбор написан, подъёмом кластера всё равно не воспроизвести.
      - name: гейт — самопроверка разбора отказа пробы потока
        id: selftest-stream-verdict
        working-directory: ui-future/e2e
        run: node scripts/stream-verdict-selftest.ts

      # И для установки системных пакетов: она решает, что считать полной
      # установкой, а неспособная ошибиться проверка полноты объявляла бы полным
      # что угодно.
      - name: гейт — самопроверка установки системных пакетов
        id: selftest-deps
        run: bash .github/scripts/install-browser-deps.sh --self-test

      # Различение фаз добычи браузера доказывается на заглушках и без сети —
      # секунды. Гоняется ДО всего: скрипт, потерявший способность отличить
      # распаковку от раздачи, снова начал бы обвинять чужую сторону.
      - name: гейт — самопроверка различения фаз добычи браузера
        id: selftest-browser
        run: bash .github/scripts/install-pinned-browser.sh --self-test

      # ─── ТУЛЧЕЙНЫ С ПИНАМИ ──────────────────────────────────────────────
      # Ставим сами и с пинами, не полагаясь на состав образа ранера: он меняется
      # без нашего участия. Значения обязаны совпадать с e2e-newman.yml и
      # production-posture.yml — это сверяет
      # .github/scripts/check-pinned-tools.sh --divergence-only: два конвейера,
      # поднимающие стенд разными версиями, дают несравнимые вердикты о том же дереве.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        id: setup-go
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.console_url == '' }}
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        id: setup-helm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.console_url == '' }}
        with:
          version: v4.2.4
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5
        id: setup-kubectl
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.console_url == '' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        id: setup-node
        with:
          node-version: '26'

      - name: kind
        id: kind
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.console_url == '' }}
        run: |
          mkdir -p "$HOME/bin"
          curl -sSLo "$HOME/bin/kind" https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x "$HOME/bin/kind"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/kind" version

      - name: установка проб
        id: npm
        timeout-minutes: 8
        working-directory: ui-future/e2e
        run: npm ci

      # Установка разбита НА ДВА шага и у каждого свой предел времени.
      #
      # Наблюдалось 2026-08-12: добыча браузера одним шагом вместе с системными
      # пакетами провисела 24 минуты при норме в одну-две и продолжала бы до
      # предела ДЖОБЫ (90 минут). Предел джобы — не предел шага: зависание в
      # начале съедает и прогон проб, и снос стенда, а вердикта не получает НИ
      # ОДНА проба. Это третий исход, «не выполнилось», и он дороже красного:
      # ранер занят полтора часа, кластер остаётся поднятым, ответа нет.
      #
      # Системные пакеты ставит apt, и без DEBIAN_FRONTEND он ждёт ввода,
      # которого на ранере не будет никогда, — а по одному общему шагу нельзя
      # сказать, что именно встало: apt или загрузка браузера. Отсюда два шага.
      #
      # ─── СИСТЕМНЫЕ ПАКЕТЫ: КЭШ, А НЕ БОЛЬШИЙ ПРЕДЕЛ (#726) ───────────────
      #
      # Что было. Шаг не уложился в свои пять минут, и джоба покраснела ДО
      # всяких проб — «не выполнилось» пришло в сводку неотличимым от «продукт
      # сломан», а двадцать пять минут стенда были потрачены впустую.
      #
      # Замер по журналу прогона 32197604354 называет виновника точно:
      #
      #   пакетов в списке playwright             33
      #   из них уже стоит в образе ранера        24
      #   ставится заново (все — шрифты)           9
      #   объём загрузки                      21.1 МБ
      #   индексы apt                    11.3 МБ за 1 с (8958 кБ/с)
      #   загрузка девяти пакетов     начата, строки «Fetched» НЕТ
      #
      # Индекс приходит за секунду, а двадцать мегабайт не приходят за четыре с
      # половиной минуты. Значит это НЕ «медленное зеркало» в смысле пропускной
      # способности, а ЗАВИСШЕЕ соединение — и предел шага его только
      # переименовывает: на зависании не хватит и десяти минут.
      #
      # Отсюда три меры, и первая несущая:
      #
      #  1. КЭШ .deb-файлов. На попадании установка идёт `dpkg` из локального
      #     каталога и в сеть не обращается ВОВСЕ. Кэш маленький — те самые
      #     девять шрифтов.
      #  2. Ограниченное ожидание сокета у apt на промахе (`Acquire::*::Timeout`
      #     20 с вместо стандартных 120 плюс три попытки): зависание рвётся и
      #     повторяется, а не съедает предел шага целиком.
      #  3. Категория исхода. Отказ ЭТОГО шага — «условие не создано», и
      #     разметчик в конце джобы называет его так, чтобы читатель сводки не
      #     принял его за красноту проб.
      #
      # ПОЧЕМУ КЭШ НЕ ПОВТОРИТ БЕДУ «СОХРАНЁННОЙ НЕУДАЧИ». Полнота установки не
      # предполагается, а ПРОВЕРЯЕТСЯ после неё: список пакетов спрашивается у
      # самого playwright, и по каждому имени опрашивается dpkg. Признак
      # `complete` выставляется только тогда, когда недостающих не осталось, и
      # только он открывает сохранение. Кэш, оказавшийся неполным (образ ранера
      # обновился, состав предустановленного изменился), не маскирует установку:
      # проверка ловит недостачу и отправляет шаг в сеть.
      - name: системные пакеты — ключ кэша
        id: deps-key
        env:
          LOCK_HASH: ${{ hashFiles('ui-future/e2e/package-lock.json') }}
        run: |
          set -u
          # В ключе ТРИ величины, и каждая своя причина:
          #   слепок зависимостей проб — от него зависит СПИСОК пакетов (список
          #     задаёт playwright и меняет вместе со своей версией);
          #   версия образа ранера — от неё зависит, чего из списка НЕ ХВАТАЕТ
          #     (24 из 33 уже стоят, и этот состав меняется с каждым образом);
          #   ОС — очевидно.
          # `ImageOS`/`ImageVersion` приходят переменными окружения ранера, а
          # контекст `env` выражений их не видит, поэтому ключ собирается здесь.
          echo "key=pw-deps-${RUNNER_OS}-${ImageOS:-noimage}-${ImageVersion:-noversion}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
          echo "prefix=pw-deps-${RUNNER_OS}-" >> "$GITHUB_OUTPUT"

      # Запасной префикс намеренно шире точного ключа: на обновлении образа
      # ранера прежний набор шрифтов почти наверняка ещё годится, а годность
      # проверяется опросом dpkg, а не доверием к ключу. Если не годится —
      # `cache-hit` при попадании по префиксу равен `false`, и шаг сохранения
      # запишет пересобранный набор под точным ключом. Кэш чинит себя сам.
      - name: системные пакеты — восстановить из кэша
        id: cache-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/kacho-playwright-deps
          key: ${{ steps.deps-key.outputs.key }}
          restore-keys: ${{ steps.deps-key.outputs.prefix }}

      # Тело установки живёт СКРИПТОМ, а не строками в этом файле, по одной
      # причине: логику в YAML нельзя прогнать. У скрипта есть `--self-test` —
      # девять случаев на заглушках, включая тот, ради которого всё и делается:
      # неполная установка обязана дать отказ и НЕ выставить признак, открывающий
      # сохранение в кэш. Самопроверка идёт первым делом, до стенда.
      - name: браузер — системные зависимости
        id: install-deps
        working-directory: ui-future/e2e
        # Двенадцать, а не десять: внутри скрипта свои пределы (180 с на индексы
        # плюс 420 с на загрузку), и предел ШАГА обязан быть заведомо больше их
        # суммы. Иначе шаг снимут раньше, чем скрипт назовёт причину, — а
        # безымянный отказ и есть то, из-за чего эта задача заведена.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-browser-deps.sh"
             --cache-dir "$HOME/.cache/kacho-playwright-deps"

      # Сохраняем ТОЛЬКО доказанно полную установку — признак `complete` ставит
      # шаг выше и только после опроса dpkg по всему списку.
      #
      # `!cancelled()` — не украшение, а несущая часть условия: условие БЕЗ
      # функции состояния вычисляется так, как если бы к нему приписали
      # `success()`, и любой красный шаг ниже отменил бы сохранение. Тогда
      # разделённая форма была бы куплена, а свойство — нет.
      # Класс держит гейт `internal/repohygiene` `TestCacheFillsOnTheRunThatPaidForIt`.
      - name: системные пакеты — сохранить в кэш
        id: save-deps
        if: ${{ !cancelled() && steps.install-deps.outputs.complete == 'true' && steps.cache-deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/kacho-playwright-deps
          key: ${{ steps.deps-key.outputs.key }}

      # Сама загрузка браузера — САМАЯ ДОЛГАЯ часть подготовки, и она не зависит
      # от изменения: один и тот же архив тянется каждым прогоном. Кэш сводит её к
      # распаковке, а предел времени остаётся — он ловит зависание, а не медленную
      # сеть.
      #
      # Ключ привязан к слепку зависимостей: версия браузера меняется вместе с
      # playwright, поэтому обновление пакета само промахивается мимо кэша и тянет
      # новый архив. Ключ по имени ветки или по дате этого свойства не даёт.
      # ВОССТАНОВЛЕНИЕ И СОХРАНЕНИЕ РАЗДЕЛЕНЫ НАМЕРЕННО.
      #
      # Единый `actions/cache` сохраняет каталог шагом «после» — и только если
      # задание дошло до конца ЗЕЛЁНЫМ: его собственное описание объявляет
      # `post-if: "success()"`. Здесь стояло «при любом исходе job'ы» — неверно, и
      # неверность была тихой: из неё следовало бы, что разделение формы нужно лишь
      # ради полноты установки, тогда как оно нужно ещё и ради того, чтобы кэш
      # вообще наполнялся прогоном, который за него заплатил.
      # Прошлый прогон сохранил НЕДОКАЧАННУЮ установку, следующий получил попадание
      # и пропустил шаг установки — браузера нет, а кэш «есть». Пробы упали с
      # «Executable doesn't exist», то есть кэш замаскировал установку навсегда:
      # ключ стабилен, пока не меняется package-lock, и сам он не истечёт.
      #
      # Поэтому сохраняем ТОЛЬКО доказанно полную установку (шаг ниже выставляет
      # признак), а восстановление отделено и ни на что не влияет, кроме скорости.
      - name: браузер — восстановить из кэша
        id: cache-browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui-future/e2e/package-lock.json') }}

      # ЗАГРУЗКА ЗДОРОВА — НЕ УКЛАДЫВАЛАСЬ РАСПАКОВКА. ДИАГНОЗ ПЕРЕМЕРЕН 2026-08-17.
      #
      # Здесь стояло «архив приходит за полторы секунды либо не приходит вовсе»,
      # и из этого выводились шесть коротких заходов по 90 с. Журнал шести
      # прогонов подряд ОПРОВЕРГ обе половины утверждения.
      #
      # Что в журнале на самом деле (шаг занимал РОВНО 540 с во всех шести):
      #
      #   внешних заходов (их делал сам шаг)      6
      #   строк «Downloading Chromium»            6
      #   строк «100% of 173.9 MiB»               6
      #   строк «downloaded to»                   0
      #   строк «Downloading FFMPEG»              0
      #
      # Тело архива приходило ПОЛНОСТЬЮ и каждый раз — 182 333 649 байт примерно
      # за секунду. Раздача исправна; «зеркало молчит» было неверным диагнозом,
      # и повторы лечили болезнь, которой нет.
      #
      # Виновника называет арифметика повторов. Playwright стережёт молчащий
      # сокет сам: `NET_DEFAULT_TIMEOUT` = 30 с, и на срабатывание повторяет
      # загрузку до пяти раз, ПЕЧАТАЯ «Downloading …» на каждом повторе. За 88 с
      # тишины таких строк добавилось бы две. Их ноль. Значит сокет не простаивал
      # и процесс сети не ждал — всё это время он РАСПАКОВЫВАЛ архив.
      #
      # Распаковка 174 МиБ в тысячи файлов занимает 7.1 с на незанятой машине
      # (замерено `DEBUG=pw:install`: «download complete» → «fixing permissions»).
      # Не укладывалась она потому, что шаг стоял ПОСЛЕ подъёма стенда: kind-нода,
      # восемь сервисов, Postgres, Hydra, девять подов консоли и etcd со
      # своими fsync занимают ранер целиком.
      #
      # ЛЕЧИТСЯ ПОРЯДКОМ. Добыча браузера переехала выше подъёма стенда и
      # исполняется на незанятом ранере. Порядок держит гейт
      # `internal/repohygiene` `TestBrowserIsAcquiredBeforeTheStandTakesTheRunner`.
      #
      # ─── ЗДЕСЬ СТОЯЛО «Внешний `timeout 90` СНЯТ» — И ЭТО БЫЛО НЕВЕРНО (#1047)
      #
      # Утверждение об одном предмете в двух местах, из которых верно одно: на
      # двадцать три строки ниже жил `timeout 60`, то есть предел не сняли, а
      # УЖЕСТОЧИЛИ. Он обрывал распаковку (21:40:54 → 21:41:54 — ровно 60 с), а
      # текст отказа при этом объявлял виновной раздачу, которая ответила `200` и
      # отдала 174 МиБ за секунду. Следствие: пиннутый браузер в этой полосе не
      # использовался НИ РАЗУ — пять прогонов из пяти пробы шли в системный
      # `/usr/bin/google-chrome`, и полоса при этом была зелёной.
      #
      # Второе было хуже первого. Пока текст обвиняет внешнюю сторону, никто не
      # ищет дефект у себя — и не замечает, что версия браузера в вердикте
      # произвольная.
      #
      # ─── ЧТО ТЕПЕРЬ. ДВА ПРЕДЕЛА, КАЖДЫЙ СО СВОЕЙ ВЕЛИЧИНОЙ ────────────────
      #
      # Один внешний `timeout` на весь процесс не различает фаз by construction.
      # Поэтому добыча живёт в скрипте, который стережёт фазы РАЗДЕЛЬНО:
      # `KACHO_BROWSER_DOWNLOAD_BUDGET` — до признака завершённой загрузки,
      # `KACHO_BROWSER_UNPACK_BUDGET` — от него до выхода процесса. Отказ
      # называет ТУ фазу, в которой процесс застрял; заведомо малый предел
      # распаковки даёт сообщение про распаковку, а не про раздачу — это
      # доказано самопроверкой скрипта на заглушках, без сети.
      #
      # `timeout-minutes` шага стал ЗАДНИМ УПОРОМ, а не рабочим пределом: он
      # обязан быть больше суммы двух бюджетов (240 + 180 = 420 с), иначе снова
      # обрывал бы их раньше, чем они успеют назвать причину.
      #
      # ПЕЧАТАЕТСЯ ПУТЬ И ВЕРСИЯ БРАУЗЕРА, которым пойдут пробы, — на обоих
      # исходах. Без этой строки «пин действует» и «пин не действует» неотличимы:
      # оба состояния дают зелёную полосу, и различие видно только в том, чего в
      # журнале нет.
      #
      # `DEBUG=pw:install` — не отладочный мусор, а разделитель фаз в журнале:
      # именно по его строкам скрипт и различает загрузку от распаковки.
      #
      # Шаг идёт ВСЕГДА, а не «при промахе кэша»: `playwright install`
      # идемпотентен и при готовой установке выходит мгновенно, зато отсутствие
      # браузера при попадании в кэш перестаёт быть невидимым.
      - name: браузер — сам chromium
        id: install-browser
        working-directory: ui-future/e2e
        timeout-minutes: 10
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-pinned-browser.sh"

      # В кэш кладётся ТОЛЬКО полная установка. Откат на браузер образа полноты не
      # даёт: сохранив его исход, мы записали бы в кэш пустоту и получили бы ровно
      # ту беду, из-за которой кэш и разделён.
      #
      # `!cancelled()` — не украшение условия, а его несущая часть. Условие БЕЗ
      # функции состояния вычисляется так, как если бы к нему приписали
      # `success()`: любой красный шаг выше отменил бы сохранение, и разделённая
      # форма оказалась бы куплена, а свойство — нет. Сегодня шаг стоит ДО прогона
      # проб, поэтому свойство держалось расположением и молча умерло бы от
      # перестановки. Красные пробы браузер добытым быть не перестают; отменённый
      # прогон — другое дело, там писать в кэш незачем.
      # Класс держит гейт `internal/repohygiene` `TestCacheFillsOnTheRunThatPaidForIt`.
      - name: браузер — сохранить в кэш
        id: save-browser
        if: ${{ !cancelled() && steps.install-browser.outputs.complete == 'true' && steps.cache-browser.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui-future/e2e/package-lock.json') }}

      # ДИСК — УЗКОЕ МЕСТО: стенду нужны образы восьми сервисов, девяти модулей
      # консоли, kind-нода и слои buildkit. Предустановленные тулчейны, которых
      # здесь не касается ни один шаг, занимают десятки гигабайт — снимаем их ДО
      # стенда, а не после `no space left`. `|| true` намеренно: отсутствие
      # каталога — законный ответ (состав образа ранера меняется), и это ОПИСЬ, а
      # не гейт. Чтобы «ноль освобождённого» не сошло за успех, печатаем число.
      - name: освободить диск под стенд
        id: disk
        timeout-minutes: 6
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.console_url == '' }}
        env:
          DISK_FLOOR_GB: "40"
        run: |
          set -u
          # УБОРКА ПРИМЕНЯЕТСЯ, ТОЛЬКО ЕСЛИ ЕСТЬ БОЛЕЗНЬ (#675).
          #
          # Прежняя редакция печатала свободное место и не читала его: при 85 ГБ
          # свободных из 145 она всё равно сносила гигабайты каталогов и однажды
          # провисела свои шесть минут, уронив джобу. Вердикта по пробам не
          # получила НИ ОДНА — то есть мера против нехватки места сама стала
          # причиной отказа, а её отказ был неотличим от красноты продукта.
          #
          # Порог — 40 ГБ: полный стенд (образы всех сервисов + консоль + kind)
          # укладывается в ~25 ГБ, остаток оставлен на слои сборки.
          #
          # У КАЖДОЙ КОМАНДЫ СВОЙ ПРЕДЕЛ. Предел шага — не предел команды: он
          # говорит «что-то встало», но не говорит что. Тот же класс уже чинили у
          # добычи браузера. `|| true` здесь не помогает by construction: команда,
          # которая не вернётся, не вернётся и с ним.
          FREE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "=== свободно ${FREE_GB} ГБ, порог ${DISK_FLOOR_GB} ГБ"
          if [ "$FREE_GB" -ge "$DISK_FLOOR_GB" ]; then
            echo "=== уборка НЕ НУЖНА — места достаточно, шаг пропущен"
            exit 0
          fi

          echo "=== места мало, убираю"
          if ! sudo timeout 120 rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                                       /opt/hostedtoolcache/CodeQL /usr/local/share/boost; then
            echo "::warning title=Уборка каталогов не завершилась::снятие предустановленных каталогов не уложилось в 120 с либо отказало; продолжаю — место могло освободиться частично"
          fi
          if ! sudo timeout 120 docker image prune -af > /dev/null; then
            echo "::warning title=Уборка образов не завершилась::обход образов не уложился в 120 с либо отказал; продолжаю"
          fi
          echo "=== после уборки:"; df -h / | tail -1

      - name: снести кластер от прошлого прогона
        id: preclean
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.console_url == '' }}
        run: |
          kind delete cluster --name "$CLUSTER_NAME" 2>/dev/null || true
          echo "=== диск до стенда:"; df -h / | tail -1

      # СТЕНД ПОЛНЫЙ И БЕЗ СУЖЕНИЙ. `make dev-up` без DEV_UP_VALUES поднимает
      # ровно то, что поднимает разработчик локально: восемь сервисов, консоль
      # (`uif.enabled` в values.dev.yaml), боевую посадку и посев каталога
      # размещения. Пробе зонального ресурса последнее необходимо: без каталога
      # любое создание отвечает «зона не найдена», и ни один «под Ready» этого
      # не показывает.
      - name: стенд (dev-up, полный)
        id: stand
        timeout-minutes: 35
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.console_url == '' }}
        working-directory: deploy
        run: make dev-up CLUSTER_NAME="$CLUSTER_NAME"

      # ДИАГНОСТИКА ПРИВЯЗАНА К ПРЕДМЕТУ (#728). `always()` без привязки значит
      # «исполняйся и тогда, когда работа сорвалась ЗАДОЛГО до стенда»: кластера
      # нет, обращение отказывает, и рядом с названной причиной встаёт второй
      # красный шаг с посторонним текстом. Наблюдалось на PR #725 — отказ
      # установки зависимостей браузера читался как две поломки.
      #
      # Привязка к исходу шага подъёма отсекает случай «стенда даже не пробовали
      # поднять» (пустой исход шага — не `skipped`, поэтому положения выписаны
      # поимённо, а не отрицанием). Условие про `console_url` больше не нужно:
      # при внешнем адресе шаг подъёма пропущен, и его исход это и говорит.
      - name: что поднялось
        # `id` обязателен: разметчик исхода (`console-run-category.py`) находит
        # шаг по нему и относит его отказ к «условие не создано». Шаг без `id`
        # в контекст `steps` не попадает вовсе — его отказ пришёл бы в сводку
        # неотличимым от красноты проб, то есть ровно тем, что обе задачи и
        # чинят. Требование держит гейт полноты разметки.
        id: pods
        if: ${{ always() && (steps.stand.outcome == 'success' || steps.stand.outcome == 'failure') }}
        run: |
          # Стенд мог не подняться — тогда печатаем ПРИЧИНУ и выходим успехом:
          # диагностика вердикта не выносит.
          "$GITHUB_WORKSPACE/.github/scripts/stand-present-or-explain.sh" "стенд консоли" || exit 0
          kubectl -n kacho get pods -o wide || true

      # ─── ПРОВЕНАНС УЧЁТНЫХ ДАННЫХ ОБРАТНОГО ВЫЗОВА — ОТЧЁТ, А НЕ ГЕЙТ ───
      #
      # Величина обратного вызова живёт ТОЛЬКО в памяти двух контейнеров: ни в
      # карте настроек, ни в рендере чарта её нет, а стенда прогона к моменту
      # разбора уже не существует. Из-за этого разбор задачи #1754 стоил девяти
      # опровергнутых гипотез и трёх полных прогонов: вопрос «одну ли величину
      # держат стороны» было НЕГДЕ задать.
      #
      # Шаг снимает три отпечатка — у источника, у отправителя (файл, который
      # ЧИТАЕТ процесс) и у принимающей стороны — и печатает ДЛИНУ И ОТПЕЧАТОК,
      # никогда величину: журнал конвейера публичен.
      #
      # ЭТО ОТЧЁТ. Вердикт о самой величине выносит страж запуска
      # (init-контейнер подстановки): он роняет ПОД, то есть отказывает раньше и
      # ближе к причине. Роняя здесь, мы получили бы второй красный шаг об одном
      # предмете и разметку исхода, к которой он не относится.
      - name: провенанс учётных данных обратного вызова (отчёт)
        # `id` обязателен: разметчик исхода находит шаг по нему, и шаг без `id`
        # в контекст `steps` не попадает вовсе. Здесь он объявлен СЛУЖЕБНЫМ —
        # отчёт вердикта не выносит, и его отказ не имеет права читаться как
        # краснота проб.
        id: provenance
        if: ${{ always() && (steps.stand.outcome == 'success' || steps.stand.outcome == 'failure') }}
        working-directory: deploy
        run: |
          bash scripts/identity-hook-credential-provenance.sh kacho && rc=0 || rc=$?
          case "$rc" in
            0) echo "провенанс: величина одна у всех измеренных сторон" ;;
            1) echo "::warning title=Провенанс обратного вызова::стороны держат РАЗНЫЕ величины либо в конфигурации голое имя — вердикт выносит страж запуска, здесь только отчёт" ;;
            *) echo "провенанс: условие не создано (код $rc) — вердикта о величине нет" ;;
          esac

      # ─── УСЛОВИЕ СОЗДАНО? ПОЛОСА ВНЕШНЕГО АДРЕСА ───────────────────────
      #
      # Проба «внешний балансировщик создаётся ТОЛЬКО на IPv4» предполагает, что
      # публичный адрес есть откуда выделить. Внешнее размещение бывает только
      # региональным, значит балансировщик зоне-независим by construction и берёт
      # адрес из полосы `zone_id IS NULL`. Пока полоса пуста, создание отвечает
      # «could not allocate load balancer address», сага сносит handle
      # компенсацией, и GET по названному идентификатору отдаёт настоящий 404 —
      # то есть проба честно ждёт ресурс, которого не будет, и падает по
      # ИСТЕЧЕНИИ БЮДЖЕТА, назвав виновником продукт.
      #
      # Это третья категория исхода — «условие не создано», и по e2e-flow.md §6
      # ей полагается СВОЙ шаг со СВОИМ сообщением: иначе «стенд не готов»
      # неотличимо от «продукт сломан». Шаг стоит ДО проб и ничего не пишет —
      # посев уже отработал внутри `make dev-up`; здесь только утверждение, и
      # предикат у него тот же самый, из того же файла.
      #
      # Ходит в базу, а не в API: полоса консоли не выпускает cluster-admin, а
      # `GET /vpc/v1/addressPools` живёт на внутреннем слушателе и авторизуется на
      # кластерном синглтоне. База — то самое место, которое читает резолвер.
      - name: условие создано — полоса внешнего адреса пригодна
        id: pools
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.console_url == '' }}
        timeout-minutes: 5
        working-directory: deploy
        run: make seed-vpc-pools-check

      # ─── УСЛОВИЕ СОЗДАНО? ЭТО ОТДЕЛЬНЫЙ ВОПРОС ОТ «ПРОБЫ ЗЕЛЁНЫЕ» ───────
      #
      # Ingress консоли host-based (`console.kacho.local`), kind отображает 80 на
      # 28080. Пока имя не разрешается, браузер уходил бы в никуда и падал по
      # таймауту — то есть «не выполнилось» подавалось бы как «красное». Поэтому
      # доступность проверяется ЗДЕСЬ и падает со своей причиной.
      #
      # Адрес из входа приходит ПЕРЕМЕННОЙ ОКРУЖЕНИЯ, а не подстановкой в текст
      # команды: подставленное значение исполняется оболочкой, и вход, который
      # задаёт запускающий, стал бы кодом. Переменная читается как данные.
      - name: адрес консоли разрешается и консоль отвечает
        id: console
        env:
          GIVEN_URL: ${{ inputs.console_url }}
        run: |
          if [ -n "$GIVEN_URL" ]; then
            url="$GIVEN_URL"
          else
            url="http://${CONSOLE_HOST}:${CONSOLE_PORT}"
            echo "127.0.0.1 ${CONSOLE_HOST}" | sudo tee -a /etc/hosts >/dev/null
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -z "$GIVEN_URL" ]; then
            # Пробы получают имя стенда ОТОБРАЖЕНИЕМ, а не через резолвер
            # браузера (#935): резолвер ОС и резолвер браузера разошлись, и
            # ни одна проба не доходила до продукта. Ручка явная и только
            # для СВОЕГО кластера — на внешнем стенде имя настоящее.
            echo "host_ip=127.0.0.1" >> "$GITHUB_OUTPUT"
          fi

          # Ждём ОТВЕТ, а не время: ожидание временем даёт красное на медленном
          # стенде и зелёное на быстром при одном и том же коде.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "✓ консоль отвечает на $url/healthz (попытка $i)"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Условие не создано::консоль не ответила на $url/healthz за 300с. Это НЕ вердикт проб: они не выполнялись вовсе, и такой исход не зачитывается ни в зелёное, ни в красное."
          exit 1


      # ВЕРДИКТ ПЕРВЫЙ — код возврата прогона. Повторов у проб нет намеренно
      # (см. ui-future/e2e/README.md): повтор скрывает ровно тот класс, ради
      # которого они написаны.
      # УСЛОВИЕ СОЗДАНО ДЛЯ ТОГО, КТО ИМ ПОЛЬЗУЕТСЯ (#935). Шаг выше спрашивает
      # доступность СВОИМ резолвером (curl); пробы ходят ЧУЖИМ (браузерным), и
      # эти два ответа однажды разошлись — гейт был зелен, а все 31 проба упали
      # на разрешении имени, не дойдя до продукта. Проверка ниже задаёт тот же
      # вопрос ТЕМ ЖЕ браузером и с тем же отображением, что и пробы: её отказ
      # означает «условие не создано», а не «продукт сломан».
      - name: браузер видит консоль по тому же адресу
        id: browser_reach
        timeout-minutes: 5
        working-directory: ui-future/e2e
        env:
          KACHO_CONSOLE_URL: ${{ steps.console.outputs.url }}
          KACHO_CONSOLE_HOST_IP: ${{ steps.console.outputs.host_ip }}
        run: node scripts/browser-reach.mjs

      # ПРЕДЕЛ ВРЕМЕНИ РАЗМЕРЯЕТСЯ ПО ЧИСЛУ ПРОБ, А НЕ ПО ПРИВЫЧКЕ.
      #
      # Было 20 минут при 31 пробе. Набор вырос до 65 (канон консоли, #925), и
      # прогон оборвало на 52-й: остаток не выполнился ВОВСЕ, а в сводку это
      # пришло красным — тем самым третьим исходом, который дороже красного и
      # про который говорит комментарий у шагов установки выше.
      #
      # Замер того прогона: 52 пробы за 20 минут, то есть около 23 секунд на
      # пробу на этом стенде (локально — впятеро быстрее; медленнее здесь потому,
      # что каждая заводит СВОЕГО арендатора и ждёт материализации его прав).
      # 65 × 23 с ≈ 25 минут; 35 даёт запас на медленные и на то, что набор
      # продолжит расти. Величина названа здесь, чтобы её пересматривали замером,
      # а не правкой наугад.
      #
      # Ускорять числом работников нельзя без пересмотра изоляции: пробы делят
      # один стенд, и параллельные арендаторы конкурируют за материализацию прав
      # — это отдельный предмет, а не строка в этом файле.
      - name: прогон проб
        id: probes
        timeout-minutes: 35
        working-directory: ui-future/e2e
        env:
          KACHO_CONSOLE_URL: ${{ steps.console.outputs.url }}
          KACHO_CONSOLE_HOST_IP: ${{ steps.console.outputs.host_ip }}
        run: npx playwright test

      # ВЕРДИКТ ВТОРОЙ — по СОДЕРЖИМОМУ отчёта. Код возврата говорит «упало ли
      # то, что запускалось»; этот гейт говорит ещё две вещи, о которых код
      # возврата молчит. Первая: запускалось ВСЁ объявленное — проба, молча
      # выпавшая из набора, иначе уносит с собой своё утверждение, а прогон
      # остаётся зелёным. Вторая (#1287): у КАЖДОЙ упавшей пробы есть вложение
      # трассы — единственная запись того, что происходило в браузере. Теряется
      # она ровно на падении, то есть там, где нужна, и теряется тихо: одну такую
      # потерю (#1242) нашли вручную, когда попытались открыть файл.
      # Отсутствие отчёта — провал, а не «нечего проверять».
      #
      # Условие — `always()` ПОСЛЕ созданного условия, а не всегда: если консоль
      # не отвечала, причина уже названа тем шагом, и второй вердикт рядом с
      # первым дал бы два разных ответа на один вопрос («суита красная» вместо
      # «суита не выполнялась»). Внутри же прогона гейт обязан отработать именно
      # на красном — там его предмет.
      # КОД ВОЗВРАТА ЭТОГО ГЕЙТА НЕСЁТ ТРИ РАЗНЫХ ОТВЕТА, а не два (#1041):
      # 0 — зелено, 1 — красное о продукте, 3 — до продукта не дошла НИ ОДНА
      # проба. Третий существует потому, что только этот гейт читает ТЕКСТЫ
      # отказов: разметчик исхода видит лишь исходы шагов, а условные шаги в
      # этом случае честно отработали — стенд был достижим, когда их
      # спрашивали, и перестал быть достижим позже.
      #
      # Наблюдалось: 66 проб упали за 500–800 мс с одним и тем же отказом
      # разрешения имени, вердикт пришёл красным, и разбор ушёл в консоль — при
      # том что ветка проб не касалась её ни строкой.
      #
      # Шаг ПАДАЕТ И НА КОДЕ 3: вычета нет, прогон зелёным не становится.
      # Меняется не строгость, а то, что читателю сводки предложат разбирать.
      - name: гейт — исполнено всё объявленное, упавших нет, трасса на месте
        id: report-gate
        if: ${{ always() && steps.console.outcome == 'success' }}
        run: |
          set +e
          python3 .github/scripts/assert-console-probes-verdict.py
          rc=$?
          if [ "$rc" = 3 ]; then
            echo "unmet=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: отчёт (в том числе на красном)
        id: artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: console-e2e-results
          path: |
            ui-future/e2e/results.json
            ui-future/e2e/test-results/
          retention-days: 7

      # Стенд одноразовый (VM ранера его не переживает), но снос объявлен явно —
      # без него волна была бы непереносима обратно на машину, живущую между
      # прогонами, а перенос этот конвейер уже однажды пережил.
      # ─── КАКОЙ ИЗ ТРЁХ ИСХОДОВ — НАЗВАННЫЙ СЛОВОМ (#726) ────────────────
      #
      # Сводка запроса на слияние показывает одну строку «console-e2e» и её
      # цвет. Цвет один и тот же у «продукт сломан» и у «условие не создано» —
      # а это разные исходы, и второй из вердикта не вычитается и в зелёное не
      # зачитывается. Различить их по имени упавшего шага читатель сводки не
      # может: он видит красноту, а не журнал.
      #
      # Разметчик читает исходы ВСЕХ шагов джобы (потому у каждого и есть `id`)
      # и печатает категорию заголовком в сводку прогона плюс аннотацией, то
      # есть ровно туда, куда смотрят из запроса на слияние. Он ничего не решает:
      # вердикт уже вынесен прогоном проб и гейтом отчёта, а второй вердикт
      # рядом с первым дал бы два разных ответа на один вопрос.
      - name: разметка исхода — какая из трёх категорий
        id: category
        if: ${{ always() }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          # Свидетельство вердиктного шага. Пустое значение и любое, кроме
          # `true`, читаются как «свидетельства нет» — умолчание обязано быть
          # тем, что НЕ выдаёт послаблений.
          VERDICT_UNMET: ${{ steps.report-gate.outputs.unmet }}
        run: |
          printf '%s' "$STEPS_JSON" > /tmp/console-e2e-steps.json
          python3 .github/scripts/console-run-category.py \
            --steps /tmp/console-e2e-steps.json \
            --probe-step probes \
            --verdict-step report-gate \
            --verdict-unmet "$VERDICT_UNMET" \
            --bookkeeping pods,provenance,artifact,category,teardown

      - name: снести стенд
        id: teardown
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.console_url == '') }}
        run: kind delete cluster --name "$CLUSTER_NAME" 2>/dev/null || true
