# ui — гейты консоли ui-future (module federation: host + 8 remotes + shared).
#
# В монорепе UI не проверялся ВООБЩЕ: у kacho-ui-future был свой `.github/workflows/`,
# но GitHub читает workflow только из корня — при переезде он стал мёртв и был удалён
# вместе с остальными 18 приехавшими `.github/`.
#
# Покрытие — ЕДИНООБРАЗНОЕ, все 9 пакетов. В polyrepo его не было: матрица образов несла
# 7 проектов (без compute и storage), а standalone-зависимости ставились только для
# `host dashboard nlb registry` — при том, что корневой `npm run typecheck` перебирает
# ВСЕ 9 через `--prefix`. То есть typecheck для compute/storage там падал бы на
# неустановленных зависимостях. Здесь список один и тот же везде.
name: ui

on:
  # Только pre-merge гейт для PR в main (не на push в main после мерджа).
  pull_request:
    branches: [main]

  # …и на push В САМ main. Условия «только PR в main» НЕ ХВАТАЕТ, и это выведено из
  # реального провала: прежде здесь стояла долгоживущая интеграционная ветка, которая
  # в main не мержилась месяцами, поэтому гейт на ней не отработал НИ РАЗУ — вся работа
  # шла в слепой зоне. Ветка снята 2026-08-07: ствол опубликован прямо в main
  # (1306 коммитов), и разработка ведётся там же. Правило, ради которого строка живёт,
  # от смены имени не изменилось: гейт обязан смотреть туда, где ИДЁТ работа, а не
  # только на вход в main. Пушим мы сегодня напрямую, поэтому push-триггер несущий,
  # а не избыточный.
  #
  # Очередь это не растит: все job'ы здесь `runs-on: ubuntu-latest` (за единственный
  # self-hosted-ранер соперничают e2e-newman / docker-build / production-posture, а
  # этот workflow к нему не обращается), плюс `concurrency` с cancel-in-progress
  # держит один живой прогон на ветку, а не N.
  #
  # Фильтра по путям сознательно нет: он стал бы слепой зоной ровно того же рода,
  # что и отсутствующий триггер.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      console_url:
        description: >-
          Адрес поднятой консоли для сквозных проб через браузер
          (например http://46.173.29.131). Пусто — пробы не гоняются.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui-future
    # `shell: bash` — документированный синоним `bash --noprofile --norc -eo pipefail {0}`;
    # относительно умолчания GitHub (`bash -e {0}`) это добавляет ровно pipefail. Без него
    # шаг с конвейером отдаёт код возврата ПРАВОЙ команды и зеленеет при любом провале
    # левой — здесь это означало бы тег, молча собранный из пустоты после отказа `tr`.
    # Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги, которых
    # тут ещё нет — тем же порядком, что в ci.yaml. Гейт класса —
    # internal/repohygiene/pipefailguard_test.go, он и поймал это место.
    shell: bash

env:
  # Пакеты со СВОИМ package-lock.json — они standalone и корневой `npm ci` их не ставит.
  # Workspaces (shared/vpc/iam/system, см. package.json) ставятся корневым npm ci.
  # e2e стоит здесь по тому же признаку, что и остальные, — у него свой lock-файл.
  # Он не входит ни в матрицу сборки, ни в typecheck/test (там перечислены девять
  # приложений консоли), но гейт покрытия линта загружает конфигурацию КАЖДОГО
  # пакета его же инструментом, поэтому набор e2e обязан быть установлен.
  STANDALONE: host dashboard compute storage nlb registry e2e

jobs:
  typecheck:
    name: typecheck (10 пакетов)
    runs-on: ubuntu-latest
    # hard-гейт качества UI (tsc --noEmit по всем 9 приложениям + shared).
    # `shared` добавлен вместе с его собственным tsconfig.json: прежде общий код
    # проверялся только внутри проектов-потребителей (каждый из девяти включает
    # ../shared/src), то есть отдельного «пакет собирается сам по себе» утверждения
    # не было. timeout-backstop, чтобы зависший tsc не держал прогон.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui-future/package-lock.json
      - name: зависимости workspace
        run: npm ci
      - name: зависимости standalone-пакетов
        run: for p in $STANDALONE; do npm ci --prefix "$p"; done
      - run: npm run typecheck

  lint:
    name: линт (покрытие 11 пакетов + shared + scripts)
    runs-on: ubuntu-latest
    # Прежде в этом workflow не было НИ ОДНОГО шага линта — ни для одного пакета
    # (предикат: `grep -c lint .github/workflows/ui.yml` давал 0). Отдельно от этого
    # `eslint .`, запущенный из каталога приложения, отвергал ../shared целиком
    # («outside of base path»), поэтому общий код, который потребляют все девять
    # приложений, не попадал НИ В ОДНУ область линта: 351 отслеживаемый файл из 1369.
    #
    # Здесь четыре гейта, и все способны упасть:
    #   1. покрытие — каждый отслеживаемый линтуемый файл обязан попадать в область
    #      линта своего пакета (иначе «ноль находок» означает «ноль прочитанного»);
    #   2. долг shared — находки не растут сверх поимённо зафиксированного числа,
    #      и запись, которой больше нечего исключать, сама краснит гейт;
    #   3. единственный источник ФОРМЫ ресурса — типы, которыми консоль описывает
    #      любой ресурс, объявлены ровно в одном модуле каждый (KAC #132). Форма жила
    #      в пяти копиях, копии разошлись молча, и узналось это падением сборки трёх
    #      приложений, а не проверкой. Гейт разбирает AST, поэтому реэкспорт (тела нет,
    #      разойтись не может) законен, а повторное ОБЪЯВЛЕНИЕ — находка;
    #   4. линт самой оснастки scripts/ — гейты судятся тем же инструментом, что и код.
    #
    # Линт девяти приложений в CI пока НЕ гоняется — это отдельный предмет со своими
    # находками (см. residual в описании ветки), а не забытый шаг: гейт покрытия
    # проверяет конфигурации всех одиннадцати пакетов, включая девять приложений.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui-future/package-lock.json
      - name: зависимости workspace
        run: npm ci
      # Гейт покрытия загружает конфигурацию КАЖДОГО пакета его же инструментом,
      # поэтому standalone-пакетам нужен их собственный установленный набор — иначе
      # плагины резолвились бы подъёмом в ui-future/node_modules и гейт судил бы не
      # о той оснастке, которой пакет линтуется на самом деле.
      - name: зависимости standalone-пакетов
        run: for p in $STANDALONE; do npm ci --prefix "$p"; done
      - name: покрытие линта (все пакеты)
        run: node scripts/check-lint-coverage.mjs
      - name: линт shared против зафиксированного долга
        run: node scripts/check-shared-lint-debt.mjs
      - name: форма ресурса объявлена в одном месте
        run: node scripts/check-resource-spec-single-source.mjs
      # Принятое отступление от политики контента обязано иметь предмет и предикат
      # снятия, который РОНЯЕТ прогон, когда наступает. Без вызова гейт исчезает из
      # конвейера незаметно — а он и написан против записей, переживающих своё
      # основание, так что молчащий гейт был бы экземпляром своего же класса.
      - name: отступления от политики контента держатся предметом
        run: node scripts/check-csp-divergence-records.mjs
      - name: линт оснастки scripts/
        working-directory: ui-future/scripts
        run: ../node_modules/.bin/eslint .

  test:
    name: unit (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Каждый пакет — свой параллельный job. Прежде 9 пакетов шли ПОСЛЕДОВАТЕЛЬНО в одном
    # job (npm test --prefix X && …) → не влезали в 20-мин timeout (vpc 170 тестов/102 suites
    # под ts-jest-ESM). Матрица — быстрый фидбэк (~5 мин/пакет параллельно). Корень бывшего
    # host-hang (@ant-design/icons unstable_mockModule Proxy → ESM-link-hang) устранён стабом
    # jest.config moduleNameMapper → src/test/antd-icons-stub.tsx (kacho#7).
    strategy:
      fail-fast: false
      matrix:
        pkg: [host, dashboard, vpc, compute, storage, nlb, registry, iam, system]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui-future/package-lock.json
      - name: зависимости (workspace + standalone-пакет если нужно)
        run: |
          npm ci
          case " $STANDALONE " in *" ${{ matrix.pkg }} "*) npm ci --prefix "${{ matrix.pkg }}" ;; esac
      # host-hang guard (kacho#7): 3 shell-integration файла (App/HostShell/HostRail) виснут,
      # если @ant-design/icons НЕ замаплен на статический стаб. КОРЕНЬ (DIAG6): HostRail
      # импортит 20 named-иконок; прежний setup.ts jest.unstable_mockModule Proxy-мок не давал
      # статических named-экспортов → ESM-линкер `import { XOutlined }` висел вечно под
      # --experimental-vm-modules (доказано: `import { ApartmentOutlined }` виснет на link ДАЖЕ
      # без рендера; lucide — ok). Fix: moduleNameMapper → src/test/antd-icons-stub.tsx (реальные
      # named-экспорты). Guard гоняет эти 3 файла с таймаутом ПЕРЕД полным npm test → быстрый
      # сигнал регресса (иначе полный сьют висел бы до 20-мин job-timeout). set +e чтобы собрать
      # все 3, потом exit по агрегату.
      # host виснул на @ant-design/icons без статического стаба (kacho#7, DIAG6). Guard ловит
      # регресс этого класса на 3 shell-тестах (все рендерят HostRail — единственный импортёр
      # @ant-design/icons). Только для pkg=host.
      - name: host-hang guard (kacho#7)
        if: matrix.pkg == 'host'
        working-directory: ui-future/host
        run: |
          set +e
          J="node --no-warnings --experimental-vm-modules node_modules/jest/bin/jest.js"
          rc_all=0
          for f in src/App.test.tsx \
                   src/components/organisms/HostShell/HostShell.test.tsx \
                   src/components/organisms/HostRail/HostRail.test.tsx; do
            timeout 120 $J --runInBand --silent "$f" >/dev/null 2>&1; rc=$?
            if [ "$rc" = "124" ]; then echo "::error::$(basename "$f") ВИСНЕТ (kacho#7 регресс — @ant-design/icons стаб / mapper)"; rc_all=1
            elif [ "$rc" != "0" ]; then echo "::error::$(basename "$f") упал rc=$rc"; rc_all=1
            else echo "  ✓ $(basename "$f") прошёл"; fi
          done
          exit $rc_all
      - run: npm test --prefix ${{ matrix.pkg }}

  build:
    name: build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ВСЕ 9 remotes — ровно те, для которых есть Dockerfile и которые деплоит
        # ui-future/deploy. compute и storage в polyrepo-матрице отсутствовали.
        project: [host, dashboard, vpc, compute, storage, nlb, registry, iam, system]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # ─── ПУБЛИКАЦИЯ, А НЕ ТОЛЬКО СБОРКА ────────────────────────────────────
      #
      # Здесь стояло `push: false`, и это означало ровно одно: образы консоли
      # собирались и ВЫБРАСЫВАЛИСЬ. Следствие обнаружилось при попытке поднять
      # консоль на кластере — на Docker Hub лежали теги `master-*` времён
      # отдельного репозитория, то есть НИ ОДНА починка консоли не могла доехать
      # ни до одного стенда. Сборка при этом была зелёной и выглядела работающей:
      # она честно проверяла, что Dockerfile собирается, и молчала о том, что
      # результат некому взять.
      #
      # Гейт на секреты — тот же, что у сборки сервисов: без учётных данных
      # публикация выключается, а сборка остаётся. Так проверка не превращается в
      # «красное у всякого, кто форкнул», и при этом отсутствие публикации
      # СКАЗАНО предупреждением, а не подразумевается.
      - name: gate on DockerHub secrets
        id: gate
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "ns=$DH_USER" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "ns=local" >> "$GITHUB_OUTPUT"
            echo "::warning::публикация выключена (нет секретов либо это не push) — образ будет собран и выброшен"
          fi

          # ─── ТЕГ ОБРАЗА ВАЛИДЕН ПРИ ЛЮБОМ СОБЫТИИ ────────────────────────────
          #
          # Здесь стояло `${{ github.ref_name }}-${{ github.sha }}` прямо в `tags:`,
          # и это ломало сборку КАЖДОГО pull_request: у PR ref_name — «<номер>/merge»,
          # а слэш в теге Docker недопустим, buildx падает «invalid reference format».
          # На push в main ref_name — «main», тег проходит, поэтому дефект невидим до
          # первого же PR — и был им: девять сборок консоли из девяти падали на каждом.
          #
          # Слэш законен в имени ветки и незаконен в теге, поэтому его не запрещают, а
          # ПЕРЕВОДЯТ: любой символ вне алфавита тега становится дефисом. Подряд идущие
          # схлопываются — иначе ветка с кириллицей или пробелами даёт тег из трёх
          # десятков дефисов, по которому уже ничего не сверишь, а тег для того и нужен.
          # Обрезка до 60 оставляет запас под sha (40) и разделитель при потолке 128.
          raw='${{ github.ref_name }}'
          safe=$(printf '%s' "$raw" | tr -c 'a-zA-Z0-9._-' '-' | tr -s '-' | cut -c1-60)
          # Тег обязан НАЧИНАТЬСЯ с буквы, цифры или подчёркивания — ветка вида
          # «-hotfix» или «.tmp» дала бы иначе негодный тег после перевода.
          case "$safe" in [a-zA-Z0-9_]*) ;; *) safe="ref-$safe" ;; esac
          tag="$safe-${{ github.sha }}"
          # Проверка ровно та, что применяет сам buildx. Без неё отказ приезжает из
          # глубины сборки чужим сообщением, а место, которое его породило, молчит.
          printf '%s' "$tag" | grep -Eq '^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$' || {
            echo "::error::негодный тег образа «$tag» (ref_name=«$raw») — перевод не дал валидной формы"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: login to Docker Hub
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build ${{ matrix.project }}
        uses: docker/build-push-action@v7
        with:
          # Контекст — ui-future/: Dockerfile'ы remotes копируют shared/ рядом.
          context: ui-future
          file: ui-future/${{ matrix.project }}/Dockerfile
          push: ${{ steps.gate.outputs.push == 'true' }}
          provenance: false
          # Тег той же формы, что у сборки сервисов (`<ветка>-<sha>`): стенд
          # поднимается ОДНИМ идентификатором ревизии, и «какой код там работает»
          # отвечается сверкой тегов, а не памятью. Форму собирает шаг gate — там же
          # слэш ветки переводится в дефис и результат проверяется; сырой ref_name
          # сюда подставлять нельзя (см. разбор в том шаге).
          tags: ${{ steps.gate.outputs.ns }}/kacho-ui-future-${{ matrix.project }}:${{ steps.gate.outputs.tag }}
          cache-from: type=gha,scope=uif-${{ matrix.project }}
          cache-to: type=gha,scope=uif-${{ matrix.project }},mode=max

  # Гейт против дрейфа «пакет есть, а в CI его нет» — ровно того, из-за чего compute и
  # storage не проверялись в polyrepo. Сверяет матрицу build с Dockerfile'ами на диске.
  matrix-complete:
    name: матрица покрывает все remotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: сверить матрицу с деревом
        run: |
          find . -maxdepth 2 -name Dockerfile -not -path './node_modules/*' \
            | sed -E 's|^\./([^/]+)/Dockerfile$|\1|' | sort -u > /tmp/on-disk.txt
          grep -oE '^        project: \[.*\]$' ../.github/workflows/ui.yml \
            | sed -E 's/^        project: \[(.*)\]$/\1/' | tr ',' '\n' | tr -d ' ' | sort -u > /tmp/in-matrix.txt

          echo "=== Dockerfile'ы на диске:"; tr '\n' ' ' < /tmp/on-disk.txt; echo
          echo "=== в матрице:";             tr '\n' ' ' < /tmp/in-matrix.txt; echo

          if ! diff -u /tmp/in-matrix.txt /tmp/on-disk.txt > /tmp/d.txt; then
            echo "::error::матрица build разошлась с Dockerfile'ами"
            echo "  '+' пакет есть на диске, но НЕ собирается в CI (так было с compute/storage)"
            echo "  '-' пакет в матрице, но Dockerfile'а нет → job упадёт"
            cat /tmp/d.txt
            exit 1
          fi
          echo "✓ матрица и дерево совпадают ($(wc -l < /tmp/on-disk.txt) remotes)"

  # ─── СКВОЗНЫЕ ПРОБЫ КОНСОЛИ ЧЕРЕЗ БРАУЗЕР ──────────────────────────────────
  #
  # Гоняются ТОЛЬКО против поднятого стенда: они проверяют поток входа, загрузку
  # модулей и создание ресурса, а это свойства РАЗВЁРНУТОГО продукта, не сборки.
  # Адрес стенда приходит входом; без него работа не «пропускается тихо», а
  # ОТКАЗЫВАЕТСЯ с названной причиной — иначе «зелёная консоль» означала бы
  # «пробы не выполнялись».
  #
  # Почему не на каждый push: стенда в этом конвейере нет. Заводить его здесь
  # значило бы дублировать развёртывание; пробы вызываются по требованию против
  # уже поднятого стенда и в конвейере развёртывания.
  console-e2e:
    name: сквозные пробы консоли (браузер)
    if: github.event_name == 'workflow_dispatch' && inputs.console_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: установка
        working-directory: ui-future/e2e
        run: npm ci || npm install --no-audit --no-fund
      - name: браузер
        working-directory: ui-future/e2e
        run: npx playwright install --with-deps chromium
      - name: прогон
        working-directory: ui-future/e2e
        env:
          KACHO_CONSOLE_URL: ${{ inputs.console_url }}
        run: npx playwright test
      - name: отчёт (в том числе на красном)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-e2e-results
          path: |
            ui-future/e2e/results.json
            ui-future/e2e/test-results/
          retention-days: 7
