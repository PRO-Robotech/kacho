# ui — гейты консоли ui-future (module federation: host + 8 remotes + shared).
#
# В монорепе UI не проверялся ВООБЩЕ: у kacho-ui-future был свой `.github/workflows/`,
# но GitHub читает workflow только из корня — при переезде он стал мёртв и был удалён
# вместе с остальными 18 приехавшими `.github/`.
#
# Покрытие — ЕДИНООБРАЗНОЕ, все 9 пакетов. В polyrepo его не было: матрица образов несла
# 7 проектов (без compute и storage), а standalone-зависимости ставились только для
# `host dashboard nlb registry` — при том, что корневой `npm run typecheck` перебирает
# ВСЕ 9 через `--prefix`. То есть typecheck для compute/storage там падал бы на
# неустановленных зависимостях. Здесь список один и тот же везде.
name: ui

on:
  # Только pre-merge гейт для PR в main (не на push в main после мерджа).
  pull_request:
    branches: [main]

  # …и на push В САМ main. Условия «только PR в main» НЕ ХВАТАЕТ, и это выведено из
  # реального провала: прежде здесь стояла долгоживущая интеграционная ветка, которая
  # в main не мержилась месяцами, поэтому гейт на ней не отработал НИ РАЗУ — вся работа
  # шла в слепой зоне. Ветка снята 2026-08-07: ствол опубликован прямо в main
  # (1306 коммитов), и разработка ведётся там же. Правило, ради которого строка живёт,
  # от смены имени не изменилось: гейт обязан смотреть туда, где ИДЁТ работа, а не
  # только на вход в main. Пушим мы сегодня напрямую, поэтому push-триггер несущий,
  # а не избыточный.
  #
  # Очередь это не растит: все job'ы здесь `runs-on: ubuntu-latest` (за единственный
  # self-hosted-ранер соперничают e2e-newman / docker-build / production-posture, а
  # этот workflow к нему не обращается), плюс `concurrency` с cancel-in-progress
  # держит один живой прогон на ветку, а не N.
  #
  # Фильтра по путям сознательно нет: он стал бы слепой зоной ровно того же рода,
  # что и отсутствующий триггер.
  push:
    branches: [main]
  # Вход `console_url` снят вместе с работой, которая его читала (см. ниже, где
  # она стояла). Вход, который принимают и не читают, — обещание возможности,
  # которой нет: вызывающий задаёт адрес и уверен, что пробы пошли по нему.
  # Адрес поднятого стенда принимает конвейер, который умеет с ним работать, —
  # `console-e2e.yml`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui-future
    # `shell: bash` — документированный синоним `bash --noprofile --norc -eo pipefail {0}`;
    # относительно умолчания GitHub (`bash -e {0}`) это добавляет ровно pipefail. Без него
    # шаг с конвейером отдаёт код возврата ПРАВОЙ команды и зеленеет при любом провале
    # левой — здесь это означало бы тег, молча собранный из пустоты после отказа `tr`.
    # Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги, которых
    # тут ещё нет — тем же порядком, что в ci.yaml. Гейт класса —
    # internal/repohygiene/pipefailguard_test.go, он и поймал это место.
    shell: bash

env:
  # Пакеты со СВОИМ package-lock.json — они standalone и корневой `npm ci` их не ставит.
  # Workspaces (shared/vpc/iam/system, см. package.json) ставятся корневым npm ci.
  # e2e стоит здесь по тому же признаку, что и остальные, — у него свой lock-файл.
  # В матрицу СБОРКИ и в `test` он не входит (собирать нечего, а его пробы гоняет
  # `console-e2e.yml` на поднятом стенде), но в `typecheck` — входит с тех пор, как
  # у пакета появился свой tsconfig; гейт покрытия линта, кроме того, загружает
  # конфигурацию КАЖДОГО пакета его же инструментом, поэтому набор e2e обязан
  # быть установлен в обеих работах.
  STANDALONE: host dashboard compute storage nlb registry e2e

jobs:
  typecheck:
    name: typecheck (11 пакетов)
    runs-on: ubuntu-latest
    # hard-гейт качества UI (tsc --noEmit по всем 9 приложениям + shared + e2e).
    # `shared` добавлен вместе с его собственным tsconfig.json: прежде общий код
    # проверялся только внутри проектов-потребителей (каждый из девяти включает
    # ../shared/src), то есть отдельного «пакет собирается сам по себе» утверждения
    # не было.
    #
    # `e2e` добавлен по той же причине и с той же ценой, только уплаченной раньше:
    # у пакета не было tsconfig, поэтому его не проверял НИКТО — линт снимает
    # `no-undef` на файлах TypeScript, полагаясь на `tsc`, а `tsc` по пакету не
    # ходил. Переименование помощника (#601) обновило два вызова из трёх, третий
    # уехал в ствол, и первым читателем кода оказался браузер: проба умерла на
    # `ReferenceError`, сожгла предел времени и вернула вердикт о продукте,
    # которого не спрашивала. Ошибка уровня опечатки стоила полного прогона стенда.
    #
    # timeout-backstop, чтобы зависший tsc не держал прогон.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui-future/package-lock.json
      - name: зависимости workspace
        run: npm ci
      - name: зависимости standalone-пакетов
        run: for p in $STANDALONE; do npm ci --prefix "$p"; done
      - run: npm run typecheck

  lint:
    name: линт (покрытие 11 пакетов + shared + scripts)
    runs-on: ubuntu-latest
    # Прежде в этом workflow не было НИ ОДНОГО шага линта — ни для одного пакета
    # (предикат: `grep -c lint .github/workflows/ui.yml` давал 0). Отдельно от этого
    # `eslint .`, запущенный из каталога приложения, отвергал ../shared целиком
    # («outside of base path»), поэтому общий код, который потребляют все девять
    # приложений, не попадал НИ В ОДНУ область линта: 351 отслеживаемый файл из 1369.
    #
    # Здесь четыре гейта, и все способны упасть:
    #   1. покрытие И ИСПОЛНИМОСТЬ — каждый отслеживаемый линтуемый файл обязан
    #      попадать в область линта своего пакета (иначе «ноль находок» означает
    #      «ноль прочитанного»), а объявленная пакетом команда `npm run lint:js`
    #      обязана запускаться: гейт линтует настоящий файл пакета ЕГО СОБСТВЕННЫМ
    #      ESLint — тем, что резолвится от каталога пакета, как это делает npm;
    #   2. долг shared — находки не растут сверх поимённо зафиксированного числа,
    #      и запись, которой больше нечего исключать, сама краснит гейт;
    #   3. единственный источник ФОРМЫ ресурса — типы, которыми консоль описывает
    #      любой ресурс, объявлены ровно в одном модуле каждый (KAC #132). Форма жила
    #      в пяти копиях, копии разошлись молча, и узналось это падением сборки трёх
    #      приложений, а не проверкой. Гейт разбирает AST, поэтому реэкспорт (тела нет,
    #      разойтись не может) законен, а повторное ОБЪЯВЛЕНИЕ — находка;
    #   4. линт самой оснастки scripts/ — гейты судятся тем же инструментом, что и код.
    #
    # Линт девяти приложений в CI пока НЕ гоняется — это отдельный предмет со своими
    # находками (см. residual в описании ветки), а не забытый шаг: гейт покрытия
    # проверяет конфигурации всех одиннадцати пакетов, включая девять приложений.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui-future/package-lock.json
      - name: зависимости workspace
        run: npm ci
      # Гейт покрытия судит КАЖДЫЙ пакет его же инструментом — ESLint резолвится от
      # каталога пакета (ближайший node_modules, затем корень), как это делает npm при
      # `npm run lint:js`. Поэтому standalone-пакетам нужен их собственный установленный
      # набор: без него гейт судил бы не о той оснастке, которой пакет линтуется.
      #
      # Прежде здесь стояло то же утверждение, а гейт брал ESLint подъёмом от scripts/ —
      # то есть корневой (#572). Пока замок держал под четырьмя членами workspace вторую
      # копию eslint другого мажора, объявленная команда падала на загрузке правила во
      # всех четырёх, а гейт был зелён и печатал число прочитанных файлов.
      - name: зависимости standalone-пакетов
        run: for p in $STANDALONE; do npm ci --prefix "$p"; done
      # `--self-test` вносит во ВРЕМЕННЫЙ каталог конфигурацию, чьё правило падает при
      # создании — ровно ту форму отказа, с которой заведена #572, — и требует, чтобы
      # гейт её назвал; затем ставит рядом законную конфигурацию той же внешности и
      # требует молчания. Без второй половины гейт ловил бы форму, а не существо.
      #
      # ПОДПОРКА ПО ПАМЯТИ СНЯТА ВМЕСТЕ С ПРИЧИНОЙ (#934).
      #
      # Здесь стоял `NODE_OPTIONS: --max-old-space-size=6144`: гейт держал по
      # экземпляру ESLint на каждый из двенадцати пакетов в ОДНОМ процессе, и
      # потребление росло вместе с деревом — прогон умирал с `Ineffective
      # mark-compacts` и кодом 134, то есть давал «не выполнилось», а не находку.
      # Подпорка отодвигала предел, а не убирала рост.
      #
      # Теперь каждый пакет судит отдельный процесс, и память возвращается ОС
      # после каждого. Замер на одном дереве, различие только в устройстве:
      # 4.39 ГБ и отказ при умолчании ноды → 763 МБ у самого дорогого пакета и
      # код 0. Пик печатается в переписи гейта — следующий подход к пределу
      # будет виден заранее, а не обнаружится отказом.
      - name: покрытие и исполнимость линта (все пакеты)
        run: |
          node scripts/check-lint-coverage.mjs --self-test
          node scripts/check-lint-coverage.mjs
      - name: линт shared против зафиксированного долга
        run: node scripts/check-shared-lint-debt.mjs
      - name: форма ресурса объявлена в одном месте
        run: node scripts/check-resource-spec-single-source.mjs
      # Часть компонентов antd получает видимое оператору ПРОПОМ, а не детьми
      # (`menu`, `items`, `treeData`, `dataSource`, `count`). Заменитель, который
      # такое имя подменяет пустым `<div>`, делает НЕПРОВЕРЯЕМЫМ весь класс
      # утверждений о составе меню, вкладок, дерева: проба на нём зелена при
      # любом составе, включая пустой.
      #
      # Вторая половина гейта (#625): привести заменитель к настоящей форме —
      # половина дела. Пока на приведённый вид нет пробы НА ПРОДУКТОВОЙ
      # поверхности, наблюдаемость есть, а наблюдения нет; хуже того, пробу можно
      # написать по атрибуту, который производил дублёр, — и она переживёт
      # продукт. Перечень `PROBED_BY` истекает сам по трём осям: проба исчезла,
      # вид снова стал `<div>`, продукт перестал вид употреблять.
      #
      # Четвёртая часть (#1349): у вида ТРИ состояния, а не два. Третье — «рисует
      # ЧУЖОЕ»: вид, отданный псевдонимом другого вида (`AutoComplete: Input`).
      # Прежний разбор знал только форму `X: Component`, поэтому псевдоним не
      # давал ни красного, ни зелёного — он был вне наблюдения, а рисовал при
      # этом правдоподобное и тем искажал ПОВЕДЕНИЕ продукта (#1348). Перечень
      # `ALIASED` истекает сам по двум осям: подмены больше нет; подменяет не тем.
      #
      # Пятая часть (#1670): признак носителя объявлен ПО ВИДАМ, а не один на
      # все. Прежде носителя распознавал общий список пропов, и в нём есть
      # `title` — нативный атрибут DOM, который настоящий компонент, дублёр и
      # проходной `<div>` отдают одинаково. У `Tag` носителями назывались шесть
      # мест с `title` (все ложные), а шесть настоящих — с `closable`, рисующим
      # крестик снятия, — не видел никто; пересечение множеств пусто. Ложный
      # носитель не даёт ни красного, ни зелёного и при этом гонит пробу к месту,
      # где вид фактически не нарисован. Перечень `CARRIER_SIGN` истекает сам по
      # трём осям и полон: вид, который заменитель рисует и продукт употребляет,
      # обязан иметь СВОЙ признак, а каждый объявленный проп обоснован разбором
      # самой реализации.
      #
      # `--self-test` вносит в перечень заменителя ровно тот дефект, с которого
      # заведена задача, и требует красного с координатой; затем требует молчания
      # на законном заменителе. То же — для второй и четвёртой частей, причём у
      # четвёртой законных близнеца два: неизменённый перечень и та же реализация
      # под ЛОКАЛЬНЫМ именем (`Spin: SpinBox`) — тот же виджет, а не чужой.
      - name: дублёр antd рисует то, что видит оператор
        run: |
          node scripts/check-antd-double-draws-what-the-operator-sees.mjs --self-test
          node scripts/check-antd-double-draws-what-the-operator-sees.mjs
      # Окружений проб было три, а не одно: семь пакетов брали общее, а host и
      # dashboard держали свои — и подмены общего заменителя виджетов в них не
      # было вовсе, поэтому правка заменителя до них НЕ ДОЕЗЖАЛА. Разойтись это
      # могло молча: прогон обоих пакетов был зелёным и до, и после любой такой
      # правки. `--self-test` заводит синтетическое дерево во временном каталоге
      # и требует красного на второй посадке и на окружении без пути до неё,
      # затем — молчания на законном.
      - name: посадка проб одна
        run: |
          node scripts/check-single-test-landing.mjs --self-test
          node scripts/check-single-test-landing.mjs
      # Форма заказа машины объявлена в ДВУХ реестрах. Возможность, доехавшая до
      # одной копии, оставляет второй путь пользователя без неё — и разницу он
      # читает как другое место продукта. Перечень копий гейт выводит из дерева,
      # поэтому третья копия становится находкой, а не третьим расхождением.
      - name: цепочка загрузки одинакова во всех копиях формы машины
        run: node scripts/check-instance-boot-chain-parity.mjs
      # Принятое отступление от политики контента обязано иметь предмет и предикат
      # снятия, который РОНЯЕТ прогон, когда наступает. Без вызова гейт исчезает из
      # конвейера незаметно — а он и написан против записей, переживающих своё
      # основание, так что молчащий гейт был бы экземпляром своего же класса.
      - name: отступления от политики контента держатся предметом
        run: node scripts/check-csp-divergence-records.mjs
      # Переход на eslint 10 держится переходником `@eslint/compat` для двух плагинов,
      # которые объявляют peer до девятого мажора и под десятым падают на снятом API.
      # Послабление обязано истекать САМО: гейт краснеет в тот день, когда плагин выпустит
      # совместимую версию, — иначе шим переживёт своё основание и снимать его будет некому.
      - name: послабление под eslint 10 держится предметом
        run: node scripts/check-eslint-shim-still-needed.mjs
      # Интерфейс русский — подписи в нём тоже. Английское имя сущности рядом с
      # русским («Группы безопасности» строкой выше, `Security Group` строкой
      # ниже) пользователь читает как ДВА разных предмета. `--self-test` вносит
      # в дерево настоящую подпись из продукта и требует красного с координатой,
      # затем ставит рядом законный `CIDR` и требует молчания: без обеих сторон
      # гейт ловил бы латиницу, а не переводимое слово.
      - name: подписи консоли — на языке интерфейса
        run: |
          node scripts/check-ui-language.mjs --self-test
          node scripts/check-ui-language.mjs
      - name: линт оснастки scripts/
        working-directory: ui-future/scripts
        run: ../node_modules/.bin/eslint .
      # ПРОВЕРКА ФОРМАТА — задача #1653. Девять пакетов объявляли `format:check`
      # (`prettier . --check`), настройка у всех девяти одинаковая и рабочая, а
      # производителей у скрипта было НОЛЬ: ни один процесс конвейера, ни один
      # скрипт, ни одна цель Makefile его не звали (контроль того же предиката:
      # у `typecheck` производителей семь). Расхождение копилось невидимо и
      # обнаружилось бы только тем, кто позовёт команду руками, — то есть никем:
      # на стволе его набралось 22 файла в семи пакетах из девяти. Число снято
      # КАЖДЫМ пакетом в его СОБСТВЕННОЙ закреплённой версии prettier: судей тогда
      # было три (3.8.3 · 3.9.4 · 3.9.6), и они не согласны между собой. Судья
      # сведён к одному задачей #1674: версия объявлена ТОЧНО (без каретки) и
      # одинаково всеми девятью, замки разрешают ровно её. Держит это свойство
      # internal/repohygiene/consoleformatterversion_test.go — иначе следующий
      # npm install развёл бы судей заново, и никто бы этого не заметил.
      #
      # Го-половина дерева такую проверку имеет давно (`gofmt -l` в ci.yaml), а
      # консольная не имела вовсе — расхождение двух полос одного механизма,
      # которое никто не решал.
      #
      # Шаг стоит ПОСЛЕДНИМ намеренно: задание останавливается на первом упавшем
      # шаге, а находка формата дешевле и механичнее находок гейтов выше. Стоя
      # первым, она скрывала бы их.
      #
      # Вторую половину шва держит internal/repohygiene/consoleformatproducer_test.go:
      # он выводит перечень объявивших ИЗ ДЕРЕВА и требует, чтобы каждого звал
      # корневой скрипт, а корневой скрипт — этот шаг. Десятый пакет консоли,
      # заведённый завтра, покраснеет сам, а не окажется вне наблюдения молча.
      # Тот же шов у проверки типов держит
      # internal/repohygiene/consoletypecheckproducer_test.go (#1675), и там ось
      # шире на один шаг: пакет с собственным tsconfig.json, не объявивший скрипт
      # typecheck, — тоже находка. Так у пакета e2e не было tsconfig вовсе, и его
      # типы не проверял НИКТО (см. шапку задания typecheck выше).
      - name: формат консоли (9 пакетов)
        run: npm run format:check

      # ЛИНТ КОНСОЛИ — ЗДЕСЬ ЕГО ЕДИНСТВЕННЫЙ ПРОИЗВОДИТЕЛЬ (#1800).
      #
      # Команду `lint` объявляли ДЕСЯТЬ пакетов, а звал её НИКТО: производителей в
      # дереве было ноль (контроль тем же предикатом: у `typecheck` — один, у
      # `format:check` — один). То есть команда, которой пользуется разработчик, не
      # влияла ни на что, и её краснота копилась невидимо — ровно как расхождение
      # формата до #1653. Цена измерена, а не предположена: на дне заведения линт
      # был красен в `dashboard` (лишнее приведение типа в пробе), и об этом не
      # говорил ни один вердикт.
      #
      # Покрытие соседей НЕ перекрывало эту команду, и это надо сказать прямо:
      # `lint` = `lint:js && lint:css && typecheck`, где производитель был только у
      # третьей части. Шаг покрытия выше доказывает, что `lint:js` ИСПОЛНИМА, но
      # находок линта не судит (это сказано его же шапкой), а `lint:css` не
      # запускался НИ РАЗУ — stylelint не звал никто.
      #
      # ЦЕНА НАЗВАНА: внутри цепочки каждый пакет заново гоняет `typecheck`, который
      # уже прогнан отдельной job'ой. Дублирование сознательное — оно следует из
      # ОБЪЯВЛЕННОГО пакетами состава `lint`, и менять состав значило бы менять
      # команду разработчика ради экономии на ubuntu-latest (за дефицитный
      # self-hosted этот workflow не соперничает). Предмет заведён отдельно.
      #
      # Держит производителя гейт internal/repohygiene/consolelintproducer_test.go:
      # он читает РАЗОБРАННЫЙ YAML, а не текст, — упоминание `npm run lint:js` в
      # комментарии содержит подстроку `npm run lint`, и предикат по тексту остался
      # бы зелёным при снятом вызове.
      - name: линт консоли (10 пакетов)
        run: npm run lint

  federation:
    name: федерация исполняется
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ЕДИНСТВЕННАЯ проверка консоли, которая федерацию ИСПОЛНЯЕТ. Ни typecheck, ни
    # unit её не исполняют вовсе: они разбирают исходники, а федерация живёт в коде,
    # который плагин дописывает в уже собранный бандл. Из-за этого подъём сборщика
    # оставлял оба соседних job'а зелёными при мёртвом рантайме, и узнавалось это
    # только полным стендом — ценой прогона за итерацию (#309 → откат 6368136c,
    # разбор #310, запись в ui-future/docs/architecture/known-divergences.md).
    #
    # Стенд здесь не нужен: гейт собирает маленький remote той же оснасткой, что и
    # продукт, и выполняет его точку входа в том же процессе — секунды.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui-future/package-lock.json
      - name: зависимости workspace
        run: npm ci
      # `--self-test` доказывает, что гейт СПОСОБЕН упасть: вносит в собранный бандл
      # тот самый дефект (и получает дословно то же сообщение, что даёт настоящий
      # сломанный сборщик), затем требует молчания на законной сборке той же формы.
      # Без обеих сторон гейт ловил бы форму, а не существо.
      - name: федерация отдаёт и выполняет выставленные модули
        run: node scripts/check-federation-executes.mjs --self-test
      # Пин сборочной цепочки держится названной причиной, а не инерцией: гейт
      # краснеет в тот день, когда причина исчезает, — иначе она переживёт свой
      # предмет и снимать пин будет некому. С #337 он же держит ШИРИНУ пина: тот
      # обязан дотягиваться до мажора, свободного от препятствия, и не дальше.
      # `--self-test` ДОБАВЛЯЕТ к боевому вердикту инъекцию в обе стороны (пять
      # синтетических случаев, сети не требуют), а не подменяет его.
      - name: пин сборочной цепочки держится предметом и не шире причины
        run: node scripts/check-federation-pin-still-needed.mjs --self-test

  test:
    name: unit (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Каждый пакет — свой параллельный job. Прежде 9 пакетов шли ПОСЛЕДОВАТЕЛЬНО в одном
    # job (npm test --prefix X && …) → не влезали в 20-мин timeout (vpc 170 тестов/102 suites
    # под ts-jest-ESM). Матрица — быстрый фидбэк (~5 мин/пакет параллельно). Корень бывшего
    # host-hang (@ant-design/icons unstable_mockModule Proxy → ESM-link-hang) устранён стабом
    # jest.config moduleNameMapper → src/test/antd-icons-stub.tsx (kacho#7).
    strategy:
      fail-fast: false
      matrix:
        pkg: [host, dashboard, vpc, compute, storage, nlb, registry, iam, system]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui-future/package-lock.json
      - name: зависимости (workspace + standalone-пакет если нужно)
        run: |
          npm ci
          case " $STANDALONE " in *" ${{ matrix.pkg }} "*) npm ci --prefix "${{ matrix.pkg }}" ;; esac
      # host-hang guard (kacho#7): 3 shell-integration файла (App/HostShell/HostRail) виснут,
      # если @ant-design/icons НЕ замаплен на статический стаб. КОРЕНЬ (DIAG6): HostRail
      # импортит 20 named-иконок; прежний setup.ts jest.unstable_mockModule Proxy-мок не давал
      # статических named-экспортов → ESM-линкер `import { XOutlined }` висел вечно под
      # --experimental-vm-modules (доказано: `import { ApartmentOutlined }` виснет на link ДАЖЕ
      # без рендера; lucide — ok). Fix: moduleNameMapper → src/test/antd-icons-stub.tsx (реальные
      # named-экспорты). Guard гоняет эти 3 файла с таймаутом ПЕРЕД полным npm test → быстрый
      # сигнал регресса (иначе полный сьют висел бы до 20-мин job-timeout). set +e чтобы собрать
      # все 3, потом exit по агрегату.
      # host виснул на @ant-design/icons без статического стаба (kacho#7, DIAG6). Guard ловит
      # регресс этого класса на 3 shell-тестах (все рендерят HostRail — единственный импортёр
      # @ant-design/icons). Только для pkg=host.
      - name: host-hang guard (kacho#7)
        if: matrix.pkg == 'host'
        working-directory: ui-future/host
        run: |
          set +e
          J="node --no-warnings --experimental-vm-modules node_modules/jest/bin/jest.js"
          rc_all=0
          for f in src/App.test.tsx \
                   src/components/organisms/HostShell/HostShell.test.tsx \
                   src/components/organisms/HostRail/HostRail.test.tsx; do
            timeout 120 $J --runInBand --silent "$f" >/dev/null 2>&1; rc=$?
            if [ "$rc" = "124" ]; then echo "::error::$(basename "$f") ВИСНЕТ (kacho#7 регресс — @ant-design/icons стаб / mapper)"; rc_all=1
            elif [ "$rc" != "0" ]; then echo "::error::$(basename "$f") упал rc=$rc"; rc_all=1
            else echo "  ✓ $(basename "$f") прошёл"; fi
          done
          exit $rc_all
      - run: npm test --prefix ${{ matrix.pkg }}

  build:
    name: build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ВСЕ 9 remotes — ровно те, для которых есть Dockerfile и которые деплоит
        # ui-future/deploy. compute и storage в polyrepo-матрице отсутствовали.
        project: [host, dashboard, vpc, compute, storage, nlb, registry, iam, system]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      # ─── ПУБЛИКАЦИЯ, А НЕ ТОЛЬКО СБОРКА ────────────────────────────────────
      #
      # Здесь стояло `push: false`, и это означало ровно одно: образы консоли
      # собирались и ВЫБРАСЫВАЛИСЬ. Следствие обнаружилось при попытке поднять
      # консоль на кластере — на Docker Hub лежали теги `master-*` времён
      # отдельного репозитория, то есть НИ ОДНА починка консоли не могла доехать
      # ни до одного стенда. Сборка при этом была зелёной и выглядела работающей:
      # она честно проверяла, что Dockerfile собирается, и молчала о том, что
      # результат некому взять.
      #
      # Гейт на секреты — тот же, что у сборки сервисов: без учётных данных
      # публикация выключается, а сборка остаётся. Так проверка не превращается в
      # «красное у всякого, кто форкнул», и при этом отсутствие публикации
      # СКАЗАНО предупреждением, а не подразумевается.
      - name: gate on DockerHub secrets
        id: gate
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "ns=$DH_USER" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "ns=local" >> "$GITHUB_OUTPUT"
            echo "::warning::публикация выключена (нет секретов либо это не push) — образ будет собран и выброшен"
          fi

          # ─── ТЕГ ОБРАЗА ВАЛИДЕН ПРИ ЛЮБОМ СОБЫТИИ ────────────────────────────
          #
          # Здесь стояло `${{ github.ref_name }}-${{ github.sha }}` прямо в `tags:`,
          # и это ломало сборку КАЖДОГО pull_request: у PR ref_name — «<номер>/merge»,
          # а слэш в теге Docker недопустим, buildx падает «invalid reference format».
          # На push в main ref_name — «main», тег проходит, поэтому дефект невидим до
          # первого же PR — и был им: девять сборок консоли из девяти падали на каждом.
          #
          # Слэш законен в имени ветки и незаконен в теге, поэтому его не запрещают, а
          # ПЕРЕВОДЯТ: любой символ вне алфавита тега становится дефисом. Подряд идущие
          # схлопываются — иначе ветка с кириллицей или пробелами даёт тег из трёх
          # десятков дефисов, по которому уже ничего не сверишь, а тег для того и нужен.
          # Обрезка до 60 оставляет запас под sha (40) и разделитель при потолке 128.
          raw='${{ github.ref_name }}'
          safe=$(printf '%s' "$raw" | tr -c 'a-zA-Z0-9._-' '-' | tr -s '-' | cut -c1-60)
          # Тег обязан НАЧИНАТЬСЯ с буквы, цифры или подчёркивания — ветка вида
          # «-hotfix» или «.tmp» дала бы иначе негодный тег после перевода.
          case "$safe" in [a-zA-Z0-9_]*) ;; *) safe="ref-$safe" ;; esac
          tag="$safe-${{ github.sha }}"
          # Проверка ровно та, что применяет сам buildx. Без неё отказ приезжает из
          # глубины сборки чужим сообщением, а место, которое его породило, молчит.
          # Сверка — БЕЗ трубы. `defaults.run.shell: bash` включает `pipefail`, а
          # `… | grep -Eq` возвращает ОТКАЗ НА СОВПАДЕНИИ: grep выходит по первому
          # попаданию, printf получает SIGPIPE, и статус берётся от него (#658).
          if ! [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "::error::негодный тег образа «$tag» (ref_name=«$raw») — перевод не дал валидной формы"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: login to Docker Hub
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build ${{ matrix.project }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          # Контекст — ui-future/: Dockerfile'ы remotes копируют shared/ рядом.
          context: ui-future
          file: ui-future/${{ matrix.project }}/Dockerfile
          push: ${{ steps.gate.outputs.push == 'true' }}
          provenance: false
          # Тег той же формы, что у сборки сервисов (`<ветка>-<sha>`): стенд
          # поднимается ОДНИМ идентификатором ревизии, и «какой код там работает»
          # отвечается сверкой тегов, а не памятью. Форму собирает шаг gate — там же
          # слэш ветки переводится в дефис и результат проверяется; сырой ref_name
          # сюда подставлять нельзя (см. разбор в том шаге).
          tags: ${{ steps.gate.outputs.ns }}/kacho-ui-future-${{ matrix.project }}:${{ steps.gate.outputs.tag }}
          # ПРОВЕНАНС — из какого дерева собран образ. Модулей консоли на стенде
          # девять из семнадцати контейнеров продукта; без этих аргументов ответ на
          # «что исполняет стенд» был бы половинчатым, а половинчатый ответ на этот
          # вопрос ничем не лучше отсутствующего: смешанный стенд читался бы как
          # один коммит. Что аргументы переданы КАЖДОЙ сборкой дерева, держит
          # deploy/stand_provenance_declaration_test.go.
          build-args: |
            KACHO_IMAGE_REVISION=${{ github.sha }}
            KACHO_IMAGE_VERSION=${{ steps.gate.outputs.tag }}
          cache-from: type=gha,scope=uif-${{ matrix.project }}
          cache-to: type=gha,scope=uif-${{ matrix.project }},mode=max

  # Гейт против дрейфа «пакет есть, а в CI его нет» — ровно того, из-за чего compute и
  # storage не проверялись в polyrepo. Сверяет матрицу build с Dockerfile'ами на диске.
  matrix-complete:
    name: матрица покрывает все remotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: сверить матрицу с деревом
        run: |
          find . -maxdepth 2 -name Dockerfile -not -path './node_modules/*' \
            | sed -E 's|^\./([^/]+)/Dockerfile$|\1|' | sort -u > /tmp/on-disk.txt
          grep -oE '^        project: \[.*\]$' ../.github/workflows/ui.yml \
            | sed -E 's/^        project: \[(.*)\]$/\1/' | tr ',' '\n' | tr -d ' ' | sort -u > /tmp/in-matrix.txt

          echo "=== Dockerfile'ы на диске:"; tr '\n' ' ' < /tmp/on-disk.txt; echo
          echo "=== в матрице:";             tr '\n' ' ' < /tmp/in-matrix.txt; echo

          if ! diff -u /tmp/in-matrix.txt /tmp/on-disk.txt > /tmp/d.txt; then
            echo "::error::матрица build разошлась с Dockerfile'ами"
            echo "  '+' пакет есть на диске, но НЕ собирается в CI (так было с compute/storage)"
            echo "  '-' пакет в матрице, но Dockerfile'а нет → job упадёт"
            cat /tmp/d.txt
            exit 1
          fi
          echo "✓ матрица и дерево совпадают ($(wc -l < /tmp/on-disk.txt) remotes)"

  # ─── СКВОЗНЫЕ ПРОБЫ КОНСОЛИ ПЕРЕЕХАЛИ В СВОЙ КОНВЕЙЕР ──────────────────────
  #
  # Здесь стояла работа `console-e2e` под условием
  # `github.event_name == 'workflow_dispatch' && inputs.console_url != ''`.
  # Условие честно называло, чего пробам не хватает — поднятого стенда, — но
  # следствие было то, которое правила запрещают: работу не запускал НИ ОДИН
  # автоматический триггер, а её соседи по этому файлу запускались. Молчание
  # такой одиночки неотличимо от зелёного, и семь проб были слотом в отчёте.
  #
  # Теперь у них СВОЯ ВОЛНА, СОЗДАЮЩАЯ УСЛОВИЕ: `console-e2e.yml` поднимает
  # собственный полный стенд и гоняет пробы против него на PR и на push в main.
  # Разведены по файлам потому, что триггеры принадлежат волне: этому конвейеру
  # (типы, линт, юниты, образы) незачем расписание стенда, а стенду незачем идти
  # на каждый прогон типов. Условие по работе — как раз та форма, из-за которой
  # пробы и молчали.
  #
  # Класс держит гейт, а не эта запись:
  # internal/repohygiene TestManualOnlyJobNeverHidesInsideAutomaticWorkflow —
  # он краснеет на любой работе, замкнутой на ручной запуск внутри
  # автоматически запускаемого конвейера, и молчит на конвейере, объявленном
  # ручным целиком.

