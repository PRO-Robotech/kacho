# ci — единый гейт монорепы.
#
# Заменяет 10 отдельных per-repo CI (proto/corelib/7 сервисов/gateway). Один модуль →
# один `go build ./...` проверяет ВЕСЬ граф разом: рассинхрон вроде «сервис отстал от
# corelib» или «код обогнал proto» падает здесь, а не всплывает при деплое через месяц.
# GitHub читает workflow ТОЛЬКО из корня — per-service .github/ были бы мертвы, поэтому
# их не существует.

name: ci

on:
  # Только как pre-merge гейт для PR в main (не на push в main после мерджа —
  # squash-merge переносит уже провалидированное PR-дерево, повторный прогон избыточен).
  pull_request:
    branches: [main]

  # …и на push В САМ main. Условия «только PR в main» НЕ ХВАТАЕТ, и это выведено из
  # реального провала: прежде здесь стояла долгоживущая интеграционная ветка, которая
  # в main не мержилась месяцами, поэтому гейт на ней не отработал НИ РАЗУ — вся работа
  # шла в слепой зоне. Ветка снята 2026-08-07: ствол опубликован прямо в main
  # (1306 коммитов), и разработка ведётся там же. Правило, ради которого строка живёт,
  # от смены имени не изменилось: гейт обязан смотреть туда, где ИДЁТ работа, а не
  # только на вход в main. Пушим мы сегодня напрямую, поэтому push-триггер несущий,
  # а не избыточный.
  #
  # Очередь это не растит: все job'ы здесь `runs-on: ubuntu-latest` (за единственный
  # self-hosted-ранер соперничают e2e-newman / docker-build / production-posture, а
  # этот workflow к нему не обращается), плюс `concurrency` с cancel-in-progress
  # держит один живой прогон на ветку, а не N.
  #
  # Фильтра по путям сознательно нет: он стал бы слепой зоной ровно того же рода,
  # что и отсутствующий триггер.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Шаг «workflow с триггером только с ветки по умолчанию — зарегистрирован»
  # спрашивает у API список зарегистрированных workflow. Без этого права он
  # получил бы отказ доступа — и обязан упасть, а не счесть дерево чистым.
  actions: read


# Одна живая проверка на ветку: серия пушей подряд иначе поставит по семь job'ов
# на каждый, и очередь растёт быстрее, чем разбирается.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# СТАТУС КОНВЕЙЕРА НЕ ТЕРЯЕТСЯ. Умолчание GitHub для `run:` — `bash -e {0}`, то
# есть БЕЗ pipefail: `<проверка> | tee`, `<сборка> | grep` отдают шагу код
# возврата ПРАВОЙ команды и зеленеют при любом провале левой. `shell: bash` —
# документированный синоним `bash --noprofile --norc -eo pipefail {0}`;
# относительно умолчания это добавляет ровно pipefail.
# Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги,
# которых тут ещё нет. Гейт класса — internal/repohygiene/pipefailguard_test.go.
defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build · vet · gofmt · test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # ПОЛНАЯ ИСТОРИЯ — ПРЕДПОСЫЛКА ВЕРДИКТА, А НЕ УДОБСТВО (#1211).
          #
          # Здесь гоняются гейты дерева (`internal/repohygiene`), и два из них
          # судят «добавленное ЭТИМ изменением» — то есть `origin/main...HEAD`.
          # При умолчании (`fetch-depth: 1`) клон этой джобы не содержит ствола
          # НИ НА ОДНОМ событии: на `pull_request` в нём лежит только
          # `refs/remotes/pull/N/merge`, на `push` — только голова своей ветки.
          # Воспроизведено настоящим мелким checkout'ом, оба события:
          # `origin/main` НЕ РЕЗОЛВИТСЯ, `main` НЕ РЕЗОЛВИТСЯ.
          #
          # Прежде это стоило гейту приёмок всей его жизни в конвейере
          # (`TestNewMigrationCitesAnApprovedAcceptance`, `internal/repohygiene`):
          # он уходил в `t.Skip`, а прогон идёт без
          # `-v`, поэтому строка `SKIP` не попадала в вывод вовсе. Контроль,
          # машинно державший ban #1, присутствовал, был провязан, отчитывался
          # зелёным — и не отказал НИ РАЗУ. Сегодня тот же случай — красный
          # (см. `requireTrunkRef`), а красный без истории был бы структурным.
          #
          # ЦЕНА ИЗМЕРЕНА, А НЕ ПРЕДПОЛОЖЕНА. Пять прогонов подряд, тот же
          # репозиторий, тот же класс ранера, единица — длительность шага
          # checkout из API прогонов:
          #
          #   fetch-depth: 0 (джобы `proto` и `carry-drift`), n=10 — медиана 6 с,
          #                                                    среднее 6.4 с;
          #   умолчание (эта джоба),                    n=5  — медиана 6 с,
          #                                                    среднее 4.6 с.
          #
          # То есть медиана НЕ СДВИНУЛАСЬ, среднее выросло на 1.8 с при
          # длительности этой джобы 19–20 минут — ≤0.2 %. Разрешение отметок
          # времени в API — секунда, поэтому меньшего различия здесь и не увидеть:
          # число названо тем, что оно есть, а не округлено в удобную сторону.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      # МОДУЛЬ СЛУЖБЫ IAM — ОТДЕЛЬНЫЙ ПРОГОН, А НЕ ПОДРАЗУМЕВАЕМЫЙ.
      #
      # Служба iam несёт свой `go.mod` (она выносится отдельным репозиторием),
      # поэтому корневой `./...` её пакетов НЕ ВИДИТ: модуль-родитель кончается
      # там, где начинается вложенный. Без второго прогона джоба осталась бы
      # зелёной, перестав проверять службу вовсе, — а «ноль находок» здесь было
      # бы неотличимо от «ноль прочитанного».
      - name: go mod download (модуль службы iam)
        run: go mod download -C services/iam

      - name: build
        run: go build ./...

      - name: build (модуль службы iam)
        run: go build -C services/iam ./...

      - name: vet
        run: go vet ./...

      - name: vet (модуль службы iam)
        run: go vet -C services/iam ./...

      - name: gofmt
        run: |
          # Сгенерённое исключаем: его форматирует генератор, а не человек.
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -vE '\.pb\.go$|_grpc\.pb\.go$|\.pb\.gw\.go$') || true)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      # -short ОБЯЗАТЕЛЕН: без него сюда затягиваются integration-тесты, поднимающие
      # postgres:16 через testcontainers на КАЖДОМ из 202 пакетов → джоба упиралась в
      # `panic: test timed out after 15m0s` (23 минуты wall-clock и красный CI).
      # Локально с -short — 5 секунд. Integration гоняет отдельная джоба ниже.
      #
      # Команда — В КОРНЕВОМ Makefile, а не здесь: она должна быть ОДНОЙ и той же у
      # конвейера, у человека и у Makefile'ов сервисов. Инлайн её сюда — и следующий,
      # набрав `go test ./...` без флагов, получит красное на «том же» прогоне.
      # Прогонщик юнитов сам выносит часть вердикта — перепись «исполнено ·
      # упало · ПРОПУЩЕНО» и сверку пропусков у гейтов дерева с ведомостью
      # `.github/scripts/gate-skips-allowed.txt`. Значит его способность УПАСТЬ
      # обязана быть доказана ДО того, как его вердикту поверят: иначе он сам
      # стал бы формой без содержания — ровно тем классом, ради которого заведён.
      # Инъекция идёт по каждой оси в ОБЕ стороны (необъявленный пропуск —
      # красно, законный близнец — зелено, граница сверки, пустая ведомость,
      # падение пробы, падение пакета, ноль проб, сохранность диагностики,
      # не-JSON от сборки).
      - name: прогонщик юнитов способен упасть (самопроба инъекцией)
        run: python3 .github/scripts/go-test-verdict.py --self-test

      - name: test -race -short (unit)
        run: make test-unit

  # ── TERRAFORM ────────────────────────────────────────────────────────────────
  #
  # Go-сторона провайдера УЖЕ покрыта джобой выше: он живёт в общем модуле, поэтому
  # `go build ./...`, `go vet ./...`, `make test-unit`, golangci-lint и gosec видят его
  # без единой строки настройки. Проверено, а не предположено: `go test ./terraform/...
  # -race -short` даёт 35 проб.
  #
  # Здесь — то, чего Go-сторона не видит вовсе: сами файлы `.tf`. Модули не
  # компилируются, поэтому опечатка в связывании ресурсов и снятая проверка входа
  # проходят молча до первого apply у пользователя.
  terraform:
    name: terraform — формат · модульные пробы · приёмка провайдера
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f  # v1
        with:
          tofu_version: 1.12.5
          # Обёртка перехватывает код возврата и подменяет вывод; вердикт должен
          # приходить от самого tofu.
          tofu_wrapper: false

      # Пробы гоняются против ТОГО ЖЕ провайдера, что собирается из этого дерева, а не
      # против опубликованного: иначе они судили бы чужую версию.
      - name: собрать провайдер из этого дерева
        run: |
          mkdir -p "$RUNNER_TEMP/plugins"
          go build -o "$RUNNER_TEMP/plugins/terraform-provider-kacho" ./terraform/cmd/terraform-provider-kacho

      - name: направить tofu на собранный провайдер
        run: |
          cat > "$RUNNER_TEMP/tofu.tfrc" <<RC
          provider_installation {
            dev_overrides { "PRO-Robotech/kacho" = "$RUNNER_TEMP/plugins" }
            direct {}
          }
          RC
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/tofu.tfrc" >> "$GITHUB_ENV"

      - name: формат .tf
        run: tofu fmt -check -recursive terraform

      # Перечень модулей ВЫВОДИТСЯ из дерева, а не выписывается: рукописный список
      # разошёлся бы с деревом молча, и новый модуль приехал бы непроверенным.
      #
      # Ноль модулей — ОТКАЗ, а не успех: обходчик, которому нечего обходить, обязан
      # быть отличим от обходчика, у которого всё сошлось. Печатается объём осмотренного.
      - name: модульные пробы (tofu test)
        run: |
          modules=$(git ls-files 'terraform/modules/*/main.tf' | xargs -r -n1 dirname | sort -u)
          if [ -z "$modules" ]; then
            echo "::error::модулей terraform не найдено — предикат поиска устарел или каталог переехал"
            exit 1
          fi
          seen=0
          for m in $modules; do
            suites=$(git ls-files "$m/tests/*.tftest.hcl" | wc -l)
            if [ "$suites" -eq 0 ]; then
              echo "::error file=$m/main.tf::модуль без модульных проб: заведите $m/tests/*.tftest.hcl"
              exit 1
            fi
            echo "── $m ($suites сюит)"
            ( cd "$m" && tofu test -no-color )
            seen=$((seen + 1))
          done
          echo "модулей осмотрено: $seen"

      # Примеры — то, что читатель копирует первым. Непроверяемый пример устаревает
      # тише всего: он не собирается ничем и не падает нигде.
      - name: примеры разбираются и сходятся по типам
        run: |
          examples=$(git ls-files 'terraform/examples/*/main.tf' | xargs -r -n1 dirname | sort -u)
          if [ -z "$examples" ]; then
            echo "::error::примеров terraform не найдено — предикат поиска устарел"
            exit 1
          fi
          seen=0
          for e in $examples; do
            # `tofu get`, а НЕ `tofu init`: провайдер здесь приходит подменой пути
            # (dev_overrides), и init на нём выходит с кодом 1, потому что честно не
            # находит его в реестре. Глушить этот код было бы мягким проходом, не
            # отличающим настройку от сбоя; `get` ставит только модули и таким
            # вопросом не задаётся.
            ( cd "$e" && tofu get -no-color && tofu validate -no-color )
            seen=$((seen + 1))
          done
          echo "примеров осмотрено: $seen"

      # Поведение РЕСУРСОВ под настоящим terraform: план, повторный план, пересоздание,
      # импорт, уборка. Джоба go этого не видит вовсе — она проверяет отображение полей,
      # а не то, что делает с ними цикл. Провайдер разговаривает с поддельным краем в том
      # же процессе, поэтому ни стенда, ни сети пробам не нужно.
      #
      # Исполнителя пробы находят сами: setup-opentofu выше положил tofu в PATH. Отбор
      # `-run Acceptance` берёт ровно приёмочные — юнитовые уже прогнаны джобой go.
      - name: приёмка провайдера (цикл terraform)
        run: go test ./terraform/internal/provider -run Acceptance -count=1

  integration:
    name: integration (${{ matrix.svc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [iam, vpc, compute, geo, nlb, storage, registry]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      # internal/repo/*integration_test.go поднимают postgres:16 через testcontainers
      # (Docker есть на ubuntu-latest). Отдельная джоба, а НЕ часть unit-прогона:
      # иначе -short-путь исчезает и быстрый сигнал (59с) тонет в контейнерах.
      #
      # МАТРИЦА ПО СЕРВИСАМ, а не один прогон на все 45 пакетов. Причина: одним job'ом
      # это не влезает — iam/internal/repo/kaname/pg держит 398 тестов против
      # testcontainers-Postgres и под -race выбирает 15m в одиночку:
      #   panic: test timed out after 15m0s   (весь job шёл 35 минут и падал)
      # В polyrepo этой нагрузки не было: у kaname integration-джобы НЕ СУЩЕСТВОВАЛО
      # вовсе — его 398 pg-тестов не гонялись в CI НИКОГДА. Монорепа их подхватила
      # (это плюс: покрытие, которого не было), но им нужен свой бюджет.
      # Матрица заодно параллелит: wall-clock = самый долгий сервис, а не сумма.
      #
      # -p 1 ВНУТРИ сервиса: пакеты сериализуются. Под -race + Docker-contention
      # параллельные testcontainers-пакеты голодают друг у друга ресурсы, и
      # concurrent-кейсы (CAS/EXCLUDE/SKIP-LOCKED) флакают. Дизайн — из polyrepo kacho-vpc/nlb.
      # Отбор пакетов (`go list`, а НЕ шелл-глоб: `./services/*/internal/repo/...` не
      # работает — bash глобит СЛОВО ЦЕЛИКОМ, а `...` не каталог, совпадений нет →
      # паттерн уходит в go test литералом и job краснеет за 18с, не запустив НИ ОДНОГО
      # теста) и бюджет пакета живут в КОРНЕВОМ Makefile — там же, где их видит человек.
      #
      # Сервис передаётся ОКРУЖЕНИЕМ, а не аргументом: `make test-integration
      # SVC=${{ matrix.svc }}` разбирается гейтом ci_gate_wiring как три цели
      # («test-integration», «matrix.svc», «}}»), и он прав — по командной строке
      # цель от подстановки не отличить. Через env строка остаётся однозначной,
      # а make всё равно видит SVC как переменную.
      # Исходов ТРИ, и шаг их различает. Код 75 — «условие не создано»: Postgres
      # для контейнерных проб не поднялся, вердикта нет ни у одной пробы пакета,
      # включая успевшие пройти. Красным это подавать нельзя — читатель идёт
      # искать дефект в коде, которого нет (стоило круга конвейера 2026-08-19);
      # зелёным тем более нельзя — не исполнено ничего. Поэтому отдельный текст
      # и НЕНУЛЕВОЙ исход: прогон недействителен и повторяется.
      - name: integration ${{ matrix.svc }} (-p 1, сериализовано)
        env:
          SVC: ${{ matrix.svc }}
          # Уборщик контейнеров на ЭФЕМЕРНОМ исполнителе не нужен: машина
          # исчезает целиком вместе со всем, что на ней поднято. Зато его
          # собственный подъём — сетевой шаг, и он дважды подряд не уложился в
          # минуту (`wait for reaper: context dead`), уронив двенадцать проб,
          # у которых вердикта не было вовсе. Снимаем ПРИЧИНУ, а не симптом;
          # локально переменная не выставляется, там уборщик уместен.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          rc=0; make test-integration || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::error title=УСЛОВИЕ НЕ СОЗДАНО (${{ matrix.svc }})::Postgres для integration не поднялся — прогон недействителен, это не дефект кода. Повторить после устранения причины."
            exit 1
          fi
          exit "$rc"

  # ЗАДАНИЯ «модель прав на настоящем движке» БОЛЬШЕ НЕТ — движка нет.
  #
  # Оно гоняло поведенческие пробы модели против живого внешнего хранилища
  # отношений и запрещало им пропускать себя. Хранилище снято стадией S6 эпика
  # #747; пробы переписаны на реляционную форму и требуют теперь Postgres, а не
  # чужой сервер, поэтому их семь пакетов переехали в перечень задания ниже
  # (`PG_OUTSIDE_SELECTION_PKGS`) — туда, где живут остальные пакеты с той же
  # нуждой. Восьмой (`internal/authzcascade`) стал обычным и идёт быстрой волной.
  #
  # Разрыв, ради которого то задание заводилось, при этом не вернулся: пакеты
  # по-прежнему не попадают в отбор интеграционной джобы по пути, и по-прежнему
  # исполняются СВОИМ заданием с числовым вердиктом.

  # Пробы, которым нужен НАСТОЯЩИЙ Postgres, но которых отбор интеграционной
  # джобы не достаёт (`/internal/(repo|clients|reconciler)` внутри services/).
  #
  # ОТДЕЛЬНОЕ ЗАДАНИЕ, и это не оформление. До него такие пробы исполняла ТОЛЬКО
  # быстрая джоба — а она идёт `./... -race -short` с умолчанием `-p` = число
  # ядер, то есть 12 пакетов разом. Контейнерная проба в такой раскладке отдаёт
  # красное там, где ничего не сломано (шапка корневого Makefile: «под -p 12
  # контейнерные пакеты голодают друг у друга»), и ровно это наблюдалось дважды
  # за день на пробах iam. Плюс быстрая джоба задумана как обходящаяся без
  # Docker, а pkg/pgtest по построению ОТКАЗЫВАЕТ, когда демона нет.
  #
  # Перечень пакетов и числовой вердикт — в корневом Makefile (цель
  # test-pg-outside-selection), а не здесь: команда обязана быть ОДНОЙ у
  # конвейера, у человека и у гейта провязки. Провязка залочена
  # internal/repohygiene/shortgatedselection_test.go — запись в
  # shortGatedRunByOwnCIStep, за которой нет этой строки, краснеет.
  # ЗДЕСЬ ЖЕ ГОНЯЕТСЯ ДОКАЗАТЕЛЬСТВО НАКАТА МИГРАЦИЙ (задача #1637), и это стоит
  # назвать: до него тракт миграций не проверял НИ ОДИН процесс конвейера, при том
  # что его отказ означает «сервис не разворачивается». Проб у семи миграторов было
  # пять, и все пять — про разбор аргументов; живой базы не открывала ни одна.
  #
  # Пакет internal/migratorapply собирает бинарь КАЖДОЙ точки наката дерева
  # (перечень выводится `go list`, а не выписывается) и запускает его против пустой
  # базы, сверяя число применённых миграций с длиной цепочки. Отдельного задания у
  # него нет намеренно: нужда та же, что у соседей по перечню, — настоящий Postgres
  # вне отбора интеграционной джобы, — а второе задание об одном предмете разошлось
  # бы с первым в посадке и бюджете.
  pg-outside-selection:
    name: Postgres-пробы вне отбора интеграционной джобы (пропуск = отказ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      # Прибор переписи источников (services/iam/internal/scopesourcecensus)
      # исполняется внешним psql. Без него пробы делают t.Skip, а пропуск в этой
      # цели — ОТКАЗ: джоба стала бы красной не по вине дерева. Условие создаётся
      # здесь явно, отдельным шагом, чтобы «не установлено» было отличимо от
      # «пробы упали».
      - name: клиент psql — условие для проб, исполняющих прибор
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: пробы с настоящим Postgres вне отбора (пропуск = отказ)
        run: make test-pg-outside-selection

  proto:
    name: buf lint · breaking · generate-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          # cache: false — ОСОЗНАННО, не оплошность. С `cache: true` джоба флакала:
          #   /usr/bin/tar: .../toolchain@v0.0.1-go1.25.12.linux-amd64/README.md:
          #     Cannot open: File exists
          # go.mod несёт toolchain-директиву → setup-go СКАЧИВАЕТ тулчейн, а следом
          # restore кэша распаковывает его же поверх → tar падает на существующих
          # файлах. Проявляется через раз (зависит от того, что лежит в кэше), из-за
          # чего выглядит как «CI моргает».
          # Терять тут нечего: вся сборка Go в этой джобе — три плагина генерации,
          # которые объявление зовёт через `go run` (версия из go.mod); кэш экономил
          # секунды и стоил красных прогонов.
          cache: false
      # Пин: buf влияет и на lint-правила, и на генерацию. Разъезд local-vs-CI уже
      # стоил ложного «unused import» (свежий buf ловит то, что старый пропускал) —
      # находка была ВЕРНАЯ, но версия должна быть одна и та же у всех.
      #
      # Подъём 1.69.0 → 1.72.0 (2026-08-08, отслеживается #54) сам это подтвердил:
      # свежая версия нашла ЧЕТЫРЕ мёртвых импорта, которых прежняя не видела. Они
      # сняты в том же изменении, дескрипторы перегенерированы — то есть версия
      # поднята вместе со своими находками, а не поверх них.
      #
      # github_token ОБЯЗАТЕЛЕН: без него действие ходит за релизом buf
      # НЕАУТЕНТИФИЦИРОВАННО, а квота у такого запроса общая на IP ранера. При
      # нескольких параллельных прогонах она исчерпывается, действие падает, и
      # ТРИ ШАГА НИЖЕ (`buf lint`, `buf breaking`, `generate-diff`) получают
      # статус skipped — джоба красная по причине, к предмету проверок отношения
      # не имеющей. Это третья категория исхода: проверки не выполнялись, а
      # вердикт о них выдан. Наблюдалось на прогоне 31101264016.
      - uses: bufbuild/buf-setup-action@3e33fea8596569a62fcaa33eb3880b6ac7098941  # v1.9.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: buf lint
        working-directory: proto
        run: buf lint

      # АДЪЮДИКАЦИЯ, А НЕ ПРОСТО `buf breaking`.
      #
      # Прежде здесь стоял голый `buf breaking`, и он верен ровно до того дня, когда
      # ломающее изменение становится ОСОЗНАННЫМ (снятие метода, отвечающего отказом при
      # любом входе; снятие поля, которое сервис принимает и не читает). Тогда шаг красен
      # по построению, и у читателя остаётся два плохих хода: снять шаг — потерять защиту
      # от СЛУЧАЙНЫХ разрывов на всём дереве ради одного объявленного; либо внести файл в
      # `breaking.ignore` — послабление без предмета и без срока, ослепляющее проверку на
      # целом файле НАВСЕГДА.
      #
      # Теперь разрыв проходит только через `proto/declared-breaks.yaml`, и запись живёт
      # ровно пока у неё есть предмет: находка вне перечня — красное, запись без находки —
      # ТОЖЕ красное. Гейт доказан трёхсторонней инъекцией на реальном выводе buf
      # (tools/declaredbreak), печатает перепись и различает три исхода, а не два.
      #
      # Код возврата buf разбирается, а не проглатывается: 100 — «есть находки» (штатный
      # вход адъюдикатора), 0 — «разрывов нет», ЛЮБОЙ ДРУГОЙ — гейт не сделал своей
      # работы, и это отдельный исход. Иначе сетевой отказ читался бы как «разрывов нет».
      #
      # ШАГ ИДЁТ И НА PUSH В СТВОЛ, И ЭТО НЕСУЩЕЕ СВОЙСТВО, А НЕ НЕДОСМОТР (kacho#490).
      #
      # Здесь стояло `if: github.event_name == 'pull_request'`, и адъюдикация не
      # исполнялась на стволе НИ РАЗУ. Предмет записи перечня истекает не тогда, когда
      # правят контракт, а тогда, когда накопительная ветка ВЛИВАЕТСЯ: база сравнения
      # поднимается, и разрыв становится историей. То есть проверка не смотрела ровно
      # туда, где её предмет и истекает. Ствол был зелен не оттого, что перечень чист, а
      # оттого, что там его никто не спрашивал, — а красное доставалось первому же PR,
      # догнавшему ствол, и выглядело как дефект ЭТОГО PR. Класс повторился четыре раза
      # (21 запись → 2 → 4 → 9), и в последний раз девять записей снимали две линии
      # независимо, потому что ни одна не видела другую.
      #
      # ЧТО ШАГ УТВЕРЖДАЕТ НА СТВОЛЕ. База сравнения — сам ствол, поэтому находок 0 по
      # построению, и содержательное утверждение ровно одно: ПЕРЕЧЕНЬ НА СТВОЛЕ ПУСТ.
      # Это и есть его нормальное состояние (см. шапку proto/declared-breaks.yaml).
      # Непустой перечень на стволе — истёкшие записи, названные поимённо, здесь и сейчас.
      #
      # ЦЕНЫ ПОЛНОГО ПРОГОНА ЭТО НЕ СТОИТ: джоба `proto` и без того идёт на push в main
      # (триггер объявлен вверху файла), поэтому добавляется один вызов buf внутри уже
      # идущей джобы, а не второй прогон конвейера.
      #
      # Гонка, названная честно: `--against branch=main` тянет ствол С GITHUB, и если
      # между push и этим шагом в ствол уехал ещё один коммит, ДОБАВИВШИЙ символ, то
      # текущее дерево относительно новой базы выглядит снятием. Радиус мал: `concurrency`
      # с cancel-in-progress снимает предыдущий прогон ветки, как только приходит
      # следующий push, — то есть переживает гонку ровно последний, у которого база и
      # дерево сходятся.
      #
      # Свойство «шаг не сужен событием» держится пробой tools/declaredbreak
      # TestGateRunsWhereItsSubjectExpires, а не этим комментарием.
      - name: adjudicate breaking (vs main)
        run: |
          set -uo pipefail
          go build -o /tmp/adjudicate-declared-breaks ./tools/declaredbreak/cmd/adjudicate-declared-breaks
          cd proto
          set +e
          buf breaking \
            --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto" \
            --error-format=json > /tmp/buf-breaking.jsonl 2>/tmp/buf-breaking.err
          rc=$?
          set -e
          case "$rc" in
            0|100) ;;
            *)
              echo "::error::buf breaking не сделал своей работы (код $rc) — это НЕ «разрывов нет»"
              cat /tmp/buf-breaking.err >&2 || true
              exit 2
              ;;
          esac
          cd ..
          /tmp/adjudicate-declared-breaks proto/declared-breaks.yaml < /tmp/buf-breaking.jsonl

      # Стабы закоммичены → они ОБЯЗАНЫ совпадать с .proto. Иначе кто-то правил
      # сгенерённое руками (что вдобавок бьёт rawDesc — см. README) либо забыл
      # перегенерировать после правки .proto.
      - name: generate-diff (стабы в синхроне с .proto)
        run: |
          # ПЛАГИНЫ ЗДЕСЬ НЕ СТАВЯТСЯ, И ЭТО НЕ УПУЩЕНИЕ. Объявление генерации
          # (proto/buf.gen.yaml) зовёт каждый плагин через `go run <пакет>`, то есть
          # берёт его версию из go.mod в момент вызова. Предустановка в PATH ничего
          # не добавляла бы: её копия всё равно не будет исполнена.
          #
          # Рукописные файлы, живущие рядом со стабами (напр.
          # registry_rest_routing_test.go — ловит REST-shadow catch-all-роутов), buf НЕ
          # генерит. `rm -rf pkg/api` их сносит, и diff показывал бы их как удаление —
          # гейт краснел не из-за расхождения стабов, а из-за собственной уборки.
          # Поэтому: запоминаем их список ДО сноса и возвращаем из git ПОСЛЕ генерации.
          git ls-files pkg/api | grep -vE '\.pb\.go$|_grpc\.pb\.go$|\.pb\.gw\.go$' > /tmp/handwritten.list || true
          echo "рукописных файлов в pkg/api: $(wc -l < /tmp/handwritten.list)"

          rm -rf pkg/api
          (cd proto && buf generate)
          while read -r f; do [ -n "$f" ] && git checkout -- "$f"; done < /tmp/handwritten.list

          if ! git diff --quiet -- pkg/api; then
            echo "::error::pkg/api разошёлся с proto/ — прогони './scripts/ci-local.sh proto' и закоммить"
            echo "::notice::Причина здесь ровно одна: дерево не перегенерировано после правки .proto. Версия плагина в неё больше не входит — объявление генерации зовёт плагины через 'go run <пакет>', то есть версией из go.mod, и копия в PATH не исполняется. Класс держит гейт internal/repohygiene TestGeneratorPluginsArePinned."
            git diff --stat -- pkg/api
            exit 1
          fi


  authz-artifacts:
    name: permission-catalog · rest-route-table (staleness + copy-drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          # cache: false — та же причина, что в job `proto` выше: go.mod несёт
          # toolchain-директиву, setup-go скачивает тулчейн, а restore кэша
          # распаковывает его же поверх → `tar: ... Cannot open: File exists`.
          cache: false
      # Тот же пин, что в job `proto`: каталог и route-table ГЕНЕРИРУЮТСЯ через buf,
      # значит версия buf влияет на содержимое артефакта. Разъезд версий local-vs-CI
      # превратил бы гейт в источник фантомного диффа.
      #
      # github_token — по той же причине, что в job `proto`: без него релиз buf
      # берётся неаутентифицированно, квота общая на IP ранера, и на её исчерпании
      # шаги гейта дрейфа получают skipped при красной джобе.
      - uses: bufbuild/buf-setup-action@3e33fea8596569a62fcaa33eb3880b6ac7098941  # v1.9.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      # Permission catalog — рантайм source-of-truth per-RPC authz. Он вшит ДВУМЯ
      # копиями (gateway/internal/middleware/embed + iam seed/embedded), и до этого
      # гейта их расхождение НИЧЕМ не ловилось: `grep permission.catalog .github/`
      # был пуст. Цена дрейфа — не «некрасиво», а прод-инцидент: RPC без записи в
      # каталоге получает `catalog: no entry for method` → AUTHZ_DENIED (fail-closed)
      # на КАЖДЫЙ вызов, независимо от грантов (security.md инв. 4).
      #
      # Гейт ПАДАЕТ (не warn) в ТРЁХ случаях:
      #   1. embedded-каталог STALE относительно proto (новый/переименованный RPC
      #      уехал без записи);
      #   2. iam-копия разошлась с gateway-копией байт-в-байт;
      #   3. одной из копий НЕТ на месте — сверять не с чем.
      # Третий случай назван отдельно, потому что до #2041 он был тихим успехом:
      # сверка копий стояла под `if [ -f $IAM_CATALOG ]`, и отсутствие копии
      # означало «проверку не исполнять», а не «отказать». Обёртка ничего не
      # пропускала ровно до дня, когда копия уедет, — а её уезд запланирован
      # выносом iam отдельным продуктом. Теперь сверку исполняет отдельная цель
      # `permission-catalog-copies-in-sync` (зависимость проверяемой), она не
      # требует buf и потому проверяется запуском в `go test`
      # (internal/repohygiene/catalogcopyparity_test.go).
      # Все три проверки — внутри `make permission-catalog-check` (gateway/Makefile),
      # существующего таргета: гейт не изобретает свою логику сравнения, а
      # переиспользует ту, которой пользуется разработчик локально.
      - name: permission-catalog staleness + copy-drift
        working-directory: gateway
        run: make permission-catalog-check

      # REST route-table — тот же класс: генерируемый из `google.api.http`-аннотаций
      # committed-артефакт, по которому authz-middleware переводит REST-путь в FQN.
      # Stale-таблица = endpoint, чей путь middleware не резолвит → каждый вызов
      # denied (уже стреляло 6 registry Repository-роутами). Таргет тоже уже
      # существовал и тоже не был подключён к CI.
      - name: rest-route-table staleness
        working-directory: gateway
        run: make rest-route-table-check

      # listauthz — гейт «публичный List обязан фильтровать результат по правам на
      # ОБЪЕКТ». ТРЕТИЙ подряд случай того же класса в этом же job'е: скрипт и
      # make-таргет существовали в 4 сервисах (compute, nlb, storage, vpc) и **не
      # вызывались ни одним workflow** — то есть гейт не запускался ни разу.
      #
      # Цена бездействия измерена, а не предположена: в storage фильтрации по объектам
      # не было ВООБЩЕ (любой член проекта видел каждый том/снимок/образ), при том что
      # Get/Update/Delete тех же ресурсов требовали per-object грант. Локальный гейт
      # storage при этом печатал OK — он проверял более слабый инвариант (project-scope),
      # а его собственный фикстур-тест фиксировал именно слабое поведение, поэтому
      # слепое пятно было самосогласованно зелёным.
      #
      # Гоняем ВСЕ сервисы с публичным List: гейт, не покрывающий сервис, — это ровно
      # тот же дефект, который он призван ловить.
      #
      # registry добавлен пятым и показал ту же пару дефектов сразу в обе стороны:
      # его таргет печатал строчку и выходил с нулём (проверял ноль), а этот цикл его
      # всё равно не звал. Каждый документ, ссылавшийся на «зелёный audit-list-filter»
      # реестра, ссылался на пустоту. Сам гейт реестра устроен иначе (разбор AST
      # хендлера, а не грепы по repo/service): его List-поверхность не проектная —
      # права живут на реестре и репозитории, а теги и референсы объектами прав не
      # являются. Что этот цикл действительно зовёт registry, залочено тестом
      # services/registry/tools/auditlistfilter/ci_wiring_test.go.
      #
      # Список сервисов ЗДЕСЬ обязан совпадать с деревом, и это не вопрос
      # внимательности: пока он писался руками, сначала не было registry, потом
      # iam, а geo не было ни разу. Сверку делают ДВА независимых гейта, и оба
      # выводят перечни, а не хранят их: internal/repohygiene/
      # listfiltergatewiring_test.go сверяет «кто объявляет цель в Makefile» с
      # «кого обходит этот цикл» в обе стороны, а pkg/listfiltergate/
      # coverage_test.go считает НАХОДКОЙ и сервис без анализатора, и запись без
      # сервиса. Рукописность и была причиной каждого из трёх пропусков.
      #
      # Единица счёта сменилась вместе с предметом. Прежняя редакция судила ТОЛЬКО
      # методы, названные ровно `List`, и молчала обо всех прочих списочных —
      # двадцати в четырёх сервисах. Теперь судится КАЖДЫЙ списочный метод, и
      # каждый обязан объявить ФОРМУ сужения (RowFilter / ParentGate / EdgeGate /
      # SubjectScoped / ClusterScoped); метод без объявления — находка, объявление
      # без метода — тоже. Поэтому «у iam десять List» и «у iam 30 списочных методов»
      # — не расхождение, а две разные единицы счёта.
      #
      # Исключения переехали из флага --allow=<ресурс> в объявление формы. Флаг
      # исключал ЦЕЛИКОМ ресурс — вместе со списочными методами, которых никто не
      # рассматривал, — и причину не хранил нигде, где гейт мог бы её прочесть.
      # sa_keys и user_tokens теперь объявлены EdgeGate: гейт ЧИТАЕТ proto и
      # убеждается, что край действительно гейтит родителя по названному полю
      # (v_list @ iam_service_account / @ iam_user), вместо того чтобы поверить
      # списку. Исключения conditions больше нет — не потому, что о нём вспомнили,
      # а потому что снят его предмет: тенантская поверхность условного доступа
      # ретайрена, объявлять нечего.
      - name: listauthz — списочные методы сужены по объекту (все 7 сервисов)
        run: |
          set -euo pipefail
          fail=0
          for svc in compute geo iam nlb registry storage vpc; do
            echo "::group::audit-list-filter ${svc}"
            make -C "services/${svc}" audit-list-filter || fail=1
            echo "::endgroup::"
          done
          exit "$fail"

      # Перепись сверху: КАЖДЫЙ списочный метод дерева обязан быть УВИДЕН
      # анализатором своего сервиса. Шаг выше судит то, что анализатор рассмотрел;
      # этот — что он рассмотрел всё. Разные вопросы: перепись по построению не
      # может сообщить о методе, которого не было у неё в виду.
      #
      # ОТДЕЛЬНЫЙ ШАГ, и это не оформление. Проверка несёт пропуск под `-short`, а
      # обе джобы с `go test` до неё не доходят: быстрая гоняет `./... -race -short`
      # (пропуск срабатывает), интеграционная отбирает только пакеты
      # `/internal/(repo|clients|reconciler)` под `services/<svc>/...` (этого пакета там нет).
      # Из одиннадцати тестов пакета под `-short` пропускался ровно один — этот, —
      # поэтому зелёное самого пакета о переписи не говорило ничего.
      # Провязка залочена тестом pkg/listfiltergate (TestCIRunsThisCensus).
      - name: listauthz — анализатор видит КАЖДЫЙ списочный метод дерева
        run: go test ./pkg/listfiltergate/ -run TestCensus_EveryTransportListingIsSeenByItsAnalyser -count=1 -v

      # Форму манифеста домена судит ОДИН исполнитель — загрузчик
      # services/iam/internal/manifest, и второго заводить нельзя (решение #1778).
      # У единственности есть цена, и она была предъявлена: цель существовала, была
      # полна и защитима — и не исполнялась НИ РАЗУ за свою жизнь (#1851). Значит
      # ось, которую судит ТОЛЬКО она (ключ `producer` вне закрытого набора), не
      # встречала ни одной автоматической проверки: гейт `resources[]` о ней не
      # высказывается ни одной из трёх своих ветвей, а загрузчик, который отверг бы
      # такую запись, никто не звал. Молчание было неотличимо от исправной работы.
      #
      # ИСХОДОВ ЧЕТЫРЕ, И ЧИТАЮТСЯ ОНИ КОДОМ ВОЗВРАТА, А НЕ ВИДОМ ВЫВОДА:
      #   0  годно   — каждый найденный манифест прочитан, разобран и связен;
      #   1  находка — манифест негоден либо путь не прочитан;
      #   2  VOID    — манифестов не найдено ни одного: ПРОВЕРЯТЬ НЕЧЕГО;
      #   3  проверка НЕ ИСПОЛНЯЛАСЬ — вызов разобрать не удалось.
      #
      # VOID НЕ схлопывается в успех и НЕ роняет шаг — обе половины намеренны, и
      # каждая закрывает свою ошибку. Не в успех: дерево без манифестов отчитывалось
      # бы зелёным так же уверенно, как проверенное, и манифест, положенный мимо
      # ожидаемого имени, остался бы невидимым навсегда. Не в красное: «сверять не с
      # чем» есть третья категория, а не находка, и шаг, красный по построению,
      # перестаёт быть сигналом на третий день. Отличить одно от другого молчанием
      # нельзя, поэтому VOID говорит словами и попадает в сводку отдельной строкой.
      #
      # Здесь стояло «манифестов сегодня ноль по РАСПИСАНИЮ, а не по поломке (первый
      # приезжает своей задачей)»: утверждение пережило свой предмет — манифесты
      # приехали (#1897). Развилка от этого не меняется, она про ИСХОД, а не про
      # сегодняшнее его значение; сегодняшнее значение сюда не переписано, потому что
      # устареет так же молча. Спрашивают его у самой цели:
      #   make -C services/iam module-manifest-check; echo $?
      #
      # Код берётся КАК ДАННЫЕ: тело шага исполняется под `bash -e`, и ненулевой исход
      # оборвал бы его ДО развилки — до `case`, до печати, до вердикта. Собственный
      # `set` здесь `-e` не снимает, поэтому исход снимается через `||`, а не проверкой
      # после команды.
      #
      # Что цель НЕ ИСПОЛНЯЕТСЯ, впредь роняет прогон: провязка залочена гейтом
      # internal/repohygiene/modulemanifestcheckwiring_test.go в ОБЕ стороны — он
      # выводит и «кто объявляет цель», и «кто её зовёт», и читает исполняемую часть,
      # а не прозу, которая эту же цель объясняет.
      - name: манифесты модулей — форму судит один загрузчик
        run: |
          set -uo pipefail
          rc=0
          make -C services/iam module-manifest-check || rc=$?
          case "$rc" in
            0) echo "годно: каждый найденный манифест прочитан, разобран и связен" ;;
            2) echo "::notice::манифестов в дереве нет ни одного — это НЕ успех, а «проверять нечего»: манифесты отслеживаются деревом, поэтому пустой обход означает, что до них не дошли — смотрите выкладку и корень обхода, а не форму манифеста" ;;
            1) echo "::error::манифест негоден либо путь не прочитан — координаты в выводе выше"
               exit 1 ;;
            *) echo "::error::проверка НЕ ИСПОЛНЯЛАСЬ (код $rc) — вердикта нет ни одного, и в успех это не засчитывается"
               exit 1 ;;
          esac

      # Блоки модели доступов сверяются с манифестами модулей ПОБАЙТОВО (#1089):
      # обход закрытого набора порождает блоки типов из манифеста каждого модуля и
      # сравнивает их с каноном proto/kacho/cloud/iam/v1/fga_model.fga, прочитанным
      # ИЗ ДЕРЕВА. Предмет сверки — ПРАВО: лишняя строка в модели есть лишнее право,
      # недостающая — отказ там, где доступ выдан.
      #
      # ОТДЕЛЬНЫЙ ШАГ, И ПРИЧИНА ТА ЖЕ, ЧТО У СОСЕДА ВЫШЕ. До #1893 исполнителя звал
      # ровно ОДИН вызывающий — проба services/iam/tools
      # (TestModelCanonCheckOnTheRealTreeComparesEveryOwnedBlock), попадавшая сюда
      # частью `go test ./... -race -short`. Это работало и ничем не удерживалось:
      # пропуск под `-short`, отбор пакетов, переименование пробы — любое из трёх
      # снимает единственного вызывающего МОЛЧА, и сверка перестаёт исполняться,
      # оставаясь на вид рабочей.
      #
      # ИСХОДОВ ЧЕТЫРЕ, И ЧИТАЮТСЯ ОНИ КОДОМ ВОЗВРАТА, А НЕ ВИДОМ ВЫВОДА:
      #   0  сверено  — каждый блок канона, принадлежащий модулю набора, порождён и равен;
      #   1  находка  — расхождение блоков, блок без источника в манифесте, модуль без
      #                 манифеста и без записи ведомости, негодный документ, запись без предмета;
      #   2  VOID     — сверять нечего НИ ДЛЯ ОДНОГО модуля: ПРОВЕРЯТЬ НЕЧЕГО;
      #   3  проверка НЕ ИСПОЛНЯЛАСЬ — вызов разобрать не удалось.
      #
      # VOID НЕ схлопывается ни в успех, ни в красное, и обе половины намеренны. Не в
      # успех: дерево без манифестов отчитывалось бы зелёным так же уверенно, как
      # сверенное. Не в красное: шаг, красный по построению, перестают читать.
      #
      # СЕГОДНЯ ЦЕЛЬ ОТДАЁТ 0, и это уже не «нечего сверять»: манифестов в дереве
      # шесть (#1091), ведомость послаблений пуста, сверено 27 блоков из 27
      # принадлежащих модулям, 79923 байта (замер 2026-09-02 на этом дереве,
      # предикат — сама цель).
      #
      # Код берётся КАК ДАННЫЕ: тело шага исполняется под `bash -e`, и ненулевой исход
      # оборвал бы его ДО развилки — до `case`, до печати, до вердикта. Собственный
      # `set` здесь `-e` не снимает, поэтому исход снимается через `||`.
      #
      # Что цель НЕ ИСПОЛНЯЕТСЯ, впредь роняет прогон: провязка залочена гейтом
      # internal/repohygiene/modelcanoncheckwiring_test.go в ОБЕ стороны — он выводит
      # и «кто объявляет цель», и «кто её зовёт», а конвейер читает РАЗОБРАННЫМ YAML:
      # имя цели, попавшее в заголовок шага, комментарием не является, а вызовом не
      # становится.
      # Здесь стояло «предмет у сверки появляется вместе с манифестом модуля»:
      # утверждение пережило свой предмет ровно так же, как у соседнего шага выше
      # (#1897) — манифесты приехали, и пустой обход означает теперь «до них не
      # дошли», а не «первый ещё не приехал». Развилка не меняется, она про ИСХОД;
      # сегодняшнее значение сюда не переписано, потому что устареет так же молча.
      # Спрашивают его у дерева: git ls-files | grep -cE '/manifest\.yaml$'
      #
      # Пара шагов разошлась потому, что предикат снятия #1897 искал ОДНУ
      # формулировку, а живых было четыре — см. перепись форм в той задаче.
      - name: модель доступов — блоки сверяются с манифестами побайтово
        run: |
          set -uo pipefail
          rc=0
          make -C services/iam model-canon-check || rc=$?
          case "$rc" in
            0) echo "сверено: каждый блок канона, принадлежащий модулю набора, порождён и равен" ;;
            2) echo "::notice::сверять нечего ни для одного модуля — это НЕ успех, а «проверять нечего»: манифесты отслеживаются деревом, поэтому пустой обход означает, что до них не дошли — смотрите выкладку и корень обхода, а не форму манифеста" ;;
            1) echo "::error::блоки модели разошлись с манифестами — координаты в выводе выше"
               exit 1 ;;
            *) echo "::error::проверка НЕ ИСПОЛНЯЛАСЬ (код $rc) — вердикта нет ни одного, и в успех это не засчитывается"
               exit 1 ;;
          esac

      # Доказательства инструмента сравнительного замера форм модели прав.
      #
      # Гоняется ЗДЕСЬ по той же причине, что перепись выше: пакет поднимает
      # контейнеры, поэтому пропускает себя под `-short` (быстрая джоба до него не
      # доходит), а отбор интеграционной джобы смотрит только внутрь
      # `services/<svc>/internal/(repo|clients|reconciler)` — `tools/` в него не входит вовсе.
      # Без своего шага исполнялся бы НИГДЕ, и его зелёное не значило бы ничего.
      #
      # Исполняются именно ДОКАЗАТЕЛЬСТВА, а не сам замер: что харнесс способен
      # показать разницу, что все формы отвечают одинаково, что преобразование
      # действительно преобразует, и что стек один на процесс при своих областях —
      # последнее держит санкцию соседнего гейта containerperpackage. Сам прогон
      # матрицы требует переменной окружения и часов: он ручной по построению и в
      # конвейере ему не место.
      - name: authzformbench — доказательства харнесса замера форм модели прав
        run: go test -C services/iam ./tools/authzformbench/ -count=1 -timeout 25m

      # Сюита обязана говорить правду О СЕБЕ, иначе её зелёное нечем читать.
      #
      # Два утверждения storage-сюиты разошлись с сюитой одновременно: запись
      # «известное красное» продолжала объявлять открытыми два дефекта, закрытых в
      # дереве (один — тем же деревом, что несло запись), а таблица состава отстала
      # на две коллекции и 40 кейсов. Оба — ложные утверждения о продукте, и оба
      # переживают ровно потому, что никто не сверяет документ с артефактами.
      #
      # Гейт делает эту сверку механически и требует, чтобы всякое исключение
      # ИСТЕКАЛО САМО: у записи обязан быть ОТКРЫТЫЙ тикет и кейс с парной
      # аннотацией; закрытый тикет — находка, а не повод «обновить» запись.
      # Измерение живости тикета спрашивает трекер: без доступа гейт не падает, но
      # печатает каждую непроверенную запись координатой (не выполнялось ≠ прошло).
      - name: сюита не переживает свои фиксы (known-failing + состав)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -C services/storage audit-known-failing

      # Сверщики переписи кейсов существовали у ШЕСТИ сюит и не запускались НИ ОДНИМ
      # шагом: у nlb была цель в Makefile, которую никто не звал, у остальных — только
      # файл. Гейт, которого никто не исполняет, стоит ровно столько же, сколько гейт,
      # который ничего не проверяет; здесь сошлись оба, и compute вдобавок сверщика не
      # имел вовсе — там и выжили раздел про удалённый файл кейсов и перепись,
      # разошедшаяся с деревом (111 против 117).
      #
      # Список сюит НЕ выписан рукой: он находится обходом дерева, поэтому новая сюита
      # попадает под гейт по построению, а не после того, как кто-то вспомнит. Ноль
      # найденных сверщиков — ПРОВАЛ шага, иначе «ничего не проверено» отчиталось бы
      # как «всё чисто». Вердикт — по числу упавших, а не по факту запуска.
      #
      # Что этот шаг существует и остаётся обходом, а не списком, залочено тестом
      # tools/newmancensus (TestCIRunsEveryCaseCensusValidator).
      - name: перепись кейсов сюиты совпадает с деревом (сверщики всех сюит)
        run: |
          set -uo pipefail
          fail=0
          found=0
          for v in services/*/tests/newman/scripts/validate-cases.py; do
            [ -f "$v" ] || continue
            found=$((found + 1))
            suite="$(dirname "$(dirname "$v")")"
            echo "::group::validate-cases ${suite}"
            ( cd "${suite}" && python3 scripts/validate-cases.py ) || fail=1
            echo "::endgroup::"
          done
          echo "сверщиков найдено: ${found}"
          if [ "${found}" -eq 0 ]; then
            echo "::error::ни одного validate-cases.py не найдено — шаг ничего не проверил"
            exit 1
          fi
          exit "$fail"

      # Регрессионные пробы вокруг ОСНАСТКИ сюит (генератор коллекций, гейт покрытия,
      # гейт исполненности прогона) лежали в дереве и не запускались НИКЕМ: ни
      # workflow, ни Makefile, ни другой гейт. Слово `pytest` встречалось во всём
      # дереве ОДИН раз — в `.dockerignore`, где закрыт кэш его прогонов; то есть их
      # гоняли руками, и след остался только от кэша.
      #
      # Среди них — доказательство гейта, который в своё время нашёл, что прогон
      # послал не все запросы, а сюита при этом отчиталась зелёной. Проверка,
      # ловящая ложное зелёное, сама была ложно-зелёной: её вердикт не доходил ни до
      # чьего кода выхода.
      #
      # Состав НЕ выписан рукой: прогонщик находит пробы обходом отслеживаемого
      # дерева, поэтому проба новой сюиты попадает под гейт по построению. Ноль
      # найденных файлов и ноль исполненных проб — ОТКАЗ, а не успех; объём
      # осмотренного печатается, чтобы «ноль находок» было отличимо от «ноль
      # прочитанного».
      #
      # `--self-test` идёт ПЕРВЫМ и обязателен: прогонщик — тоже проверка, и его
      # зелёный обычный проход ничего не значит, пока не доказано, что он умеет
      # краснеть. Первая редакция прогонщика печатала PASS, имея одну упавшую пробу,
      # — нашла это именно самопроверка.
      #
      # Что этот шаг существует, зовёт самопроверку и не глотает отказ — залочено
      # тестом tools/pythonprobes (TestCIRunsThePythonProbeRunner), а покрытие
      # образца по каждой пробе дерева — TestRunnerPatternCoversEveryTrackedProbeFile.
      - name: регрессионные пробы оснастки сюит исполняются (не только существуют)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pytest
          python3 .github/scripts/run-python-probes.py --self-test
          python3 .github/scripts/run-python-probes.py

          # Пробы вокруг решения сводного вердикта лежат ВНЕ образца прогонщика
          # (`services/*/tests/newman/scripts/*_test.py`), поэтому зовутся здесь
          # поимённо. До #1073 их не звал никто: во всём дереве имя файла
          # встречалось РОВНО ОДИН раз — в комментарии `required-verdict.yml`,
          # который перечислял их как доказательство. Гейт достижимости считает
          # упоминание в сыром тексте вызовом, поэтому немоту не показывал, а
          # одиннадцать утверждений о вердикте не исполнялись ни разу.
          python3 -m pytest -q .github/scripts/pr_verdict_test.py

      # Сетевая поверхность сборки образа равна её графу импортов.
      #
      # `go mod download` без аргументов тянет ОБЪЯВЛЕННЫЙ граф модуля (142), а не
      # то, что компилирует бинарь (27…82 по образам этого дерева). Разница — от 60
      # до 115 модулей на образ, и каждый из них — ещё один способ уронить сборку по
      # причине, к продукту отношения не имеющей. Так и вышло: образ упал на модуле
      # поставщика инструментов инфраструктуры, которого не компилирует ни один из
      # восьми (kacho#503).
      #
      # `--self-test` идёт ПЕРВЫМ: гейт обязан доказать, что умеет краснеть, прежде
      # чем его зелёный что-то значит.
      - name: сборка образа тянет ровно то, что компилирует
        run: |
          set -euo pipefail
          python3 .github/scripts/assert-build-fetch-matches-imports.py --self-test
          python3 .github/scripts/assert-build-fetch-matches-imports.py

      # Второй non-negotiable — «никаких упоминаний чужих облаков» — до сих пор
      # существовал только как проза и держался на ревью. Проверки не было НИ ОДНОЙ:
      # ни цели, ни скрипта, ни шага. При этом отчёты о чистоте писались — то есть
      # отчитывались не о результате проверки, а о её отсутствии.
      #
      # Инвариант шире, чем у comment-стража compute (тот читает один сервис, только
      # Go-комментарии, и в основном ловит процессный шум): здесь — всё дерево, любой
      # текстовый файл и каждый путь.
      #
      # Вердикт — число нарушений, а не факт запуска. Что этот шаг существует,
      # залочено тестом tools/foreignclouds (TestCIRunsThisGate), а сам анализ
      # гоняется и внутри обычного `go test ./...`.
      - name: продукт описан своими словами (второй non-negotiable)
        run: go run ./tools/foreignclouds/cmd/verify-no-foreign-clouds .

      # Тенантный контейнер называется Project. Слово folder — доредизайновое:
      # обе несшие его колонки переименованы миграциями (compute 0009, iam 0070),
      # но само имя пережило переименование в поле запроса, в именах параметров,
      # в фикстурах, в query-ключах и в архитектурных доках, которые продолжали
      # описывать колонку, которой в БД уже нет. Проза переименование не держит —
      # держит то, что запускается.
      #
      # Вердикт — число нарушений И количество осмотренного: обход, не дошедший
      # ни до одного файла, выходит с кодом 2, а не «чисто». Что этот шаг
      # существует, залочено тестом tools/legacyfolder (TestCIRunsThisGate), сам
      # анализ гоняется и внутри обычного `go test ./...` (TestTreeIsClean).
      - name: тенантный контейнер называется Project, не folder
        run: go run ./tools/legacyfolder/cmd/verify-no-legacy-folder .

      # «Правильно ли составлен запрос» и «что этому вызывающему видно» — два
      # РАЗНЫХ вопроса, и у первого один ответ для всех. Порядок записан в
      # api-conventions.md (формат → authz → repo), но держался прозой.
      #
      # Разошлись обе половины сразу. Четырнадцать списочных RPC iam насыщали
      # page_size сужением int64→int32 ДО проверки: отрицательное значение
      # становилось нулём, ноль значит «умолчание», и вызывающий получал страницу,
      # о которой не просил. Валидатор при этом стоял, был верен и задокументирован
      # — и не мог сработать. Два RPC реестра спрашивали права раньше формата, из-за
      # чего мусорный курсор отвечал по-разному в зависимости от того, что
      # вызывающему выдано.
      #
      # Вердикт — число находок И перепись осмотренного: обход, не осудивший ни
      # одного пагинированного метода, выходит с кодом 2, а не «чисто». Что этот шаг
      # существует, залочено тестом tools/paginationordergate (TestCIRunsThisGate);
      # сам анализ гоняется и внутри обычного `go test ./...`
      # (TestTreeHasNoPageFormatDecidedByAccess).
      - name: формат страницы судится до прав и до сужения типа
        run: go run ./tools/paginationordergate/cmd/pagination-order-gate services gateway

      # Утверждение, принимающее исход, ПРОТИВОПОЛОЖНЫЙ обещанию своей метки, —
      # это отсутствие утверждения: кейс с заголовком «доступ запрещён», чей
      # `oneOf` принимает и 200, не может упасть ни по какой причине.
      #
      # Предикат лежал в дереве и НЕ ВЫЗЫВАЛСЯ НИКЕМ, а вызванный руками — не мог
      # сказать «нет»: печатал числа и выходил нулём даже на находках. Его
      # собственная шапка объясняет своё существование тем, что «стало 0»
      # проверяемо только вместе с предикатом, которым мерили; проверяемо оно
      # только если предикат умеет отказать. Теперь умеет — и вызывается отсюда.
      #
      # Что этот шаг существует, залочено internal/repohygiene/artifactgates/scriptgatewiring_test.go
      # (каждый гейт-скрипт tools/ обязан быть достижим из конвейера).
      - name: утверждение не принимает исход против обещания своей метки
        run: python3 tools/mixedoutcomeaudit/mixed_outcome_audit.py

      # Структурная половина того же класса, БЕЗ словаря: шаг вправе объявить
      # законной полосу, на которой Operation не чеканится, — но тогда её обязан
      # кто-то прочитать. Опрос `GET /operations/{{opId}}` без проверки пустого
      # имени уходит на `/operations/` без сегмента, край отвечает 403, обёртка
      # ожидания видимости повторяет его до исчерпания бюджета, и кейс падает
      # сообщением, которое не называет ни причину, ни предмет (наблюдалось в
      # прогоне 31061894576: 27 запросов подряд, ни один не мог пройти).
      #
      # Мерка словарная (шаг выше) этого НЕ ловит, если заголовок кейса не
      # называет направления, а эта не ловит случая, когда полоса не объявлена, —
      # они дополняют друг друга, а не дублируют.
      - name: у объявленной полосы отказа есть читатель
        run: python3 deploy/scripts/assert-refusal-lane-has-a-reader.py

      # Приём прежнего издателя на крае обязан иметь ПРЕДМЕТ — живой контур, который
      # предъявителя этого издателя ещё добывает. Требование держать второго издателя
      # записано пробой приёма (`TestF1b_OurIssuerIsADDEDToTheListNotSubstitutedForIt`),
      # и довод у неё был ПРОЗОЙ: «предъявитель прежней полосы добывается интерактивным
      # входом человека». Проза не исполняется и покраснеть не может.
      #
      # Замер инъекцией на `release/identity-3`: если убрать из посева церемонии обмен у
      # прежнего издателя, НЕ КРАСНЕЕТ НИЧТО — ни проба приёма, ни ведомость поверхностей
      # поставщика, ни `ceremony_credentials.py --verify`. Три стража зелены, предмета нет,
      # а блок на снятие прежнего издателя (#1123) переживает своё основание.
      #
      # Место здесь, а не в e2e: проверка СТАТИЧЕСКАЯ — читает объявление церемонии, посев
      # и профили зонта, стенда не требует, поэтому обязана падать до его подъёма.
      - name: приём прежнего издателя на крае имеет предмет
        run: |
          python3 deploy/scripts/assert-legacy-issuer-acceptance-has-a-subject.py --self-test
          python3 deploy/scripts/assert-legacy-issuer-acceptance-has-a-subject.py

      # Соседний по предмету шаг, и полосы у них РАЗНЫЕ — их легко перепутать.
      # Шаг выше сторожит контур, который предъявителя прежнего издателя ещё
      # ДОБЫВАЕТ (интерактивный вход, посев церемонии). Этот — сторожит машинный
      # чеканщик, где такого контура больше НЕТ: выдача перестала заводить зеркала
      # клиента у поставщика для служебной учётки (#1120) и для человека (#1121),
      # поэтому обмен там отвечает отказом опознания при любом входе.
      #
      # Ловится не «функция без вызывающих», а полоса, ПОТЕРЯВШАЯ ПРЕДМЕТ, и вред
      # от неё — проза: шапка называла снятую полосу доказанной сквозной, и
      # следующий читатель чинил бы обмен, которого не бывает. Отдельно: предикат
      # «какой-то файл фикстур называет путь выдачи» считал бы такую полосу живым
      # производителем, и требование держать прежнего издателя принятым не истекло
      # бы никогда — то есть немой остаток подпирал бы шаг выше ложным основанием.
      #
      # Место здесь, а не в e2e: проверка СТАТИЧЕСКАЯ — разбирает чеканщик и его
      # соседей по каталогу фикстур, стенда не требует, поэтому обязана падать до
      # его подъёма.
      - name: полоса обмена в машинном чеканщике имеет вызывающего
        run: |
          python3 deploy/scripts/assert-machine-minter-has-no-dead-exchange-lane.py --self-test
          python3 deploy/scripts/assert-machine-minter-has-no-dead-exchange-lane.py

      # Шаг под человеческим предъявителем несёт тот уровень входа, которого требует
      # каталог для его ручки. Гейт СУЩЕСТВОВАЛ и не вызывался ниоткуда — ни один
      # workflow, ни одна достижимая цель Makefile его не звали, и это нашёл
      # TestEveryToolScriptGateIsInvoked. Невызванный гейт — не «запас на будущее»:
      # порог `required_acr_min` ломается каждый раз, когда пишут следующий шаг, а
      # отказ приходит 401-м в середине фикстуры и читается как «сервис не поднялся».
      # Место здесь, а не в e2e: проверка СТАТИЧЕСКАЯ — читает каталог прав и
      # коллекции, стенда не требует, поэтому обязана падать до подъёма стенда.
      - name: уровень входа шага совпадает с каталогом (человеческий предъявитель)
        run: python3 deploy/scripts/assert-step-up-bearer-matches-catalog.py

      # Запись «известное красное» покупает кейсу освобождение от «всё зелёное».
      # Пока её обосновывало вычитание в прогонщике, она была хотя бы на что-то
      # опёрта; вычитание снято, и записи остались утверждениями о продукте, за
      # которыми не стоит ни один механизм. Одна такая пережила свой фикс на сутки
      # и поставила в очередь работу, которой не требовалось; три называли кейсы,
      # которых в наборе нет вовсе.
      #
      # Здесь проверяются предмет и срок жизни: кейс называется и существует, тикет
      # назван вместе с репозиторием и ещё открыт. Третье измерение — «названный
      # кейс всё ещё красный» — требует отчёта прогона, поэтому оно проверяется в
      # e2e-newman, а тут печатается как НЕ проверенное: «проверка не выполнялась»
      # обязано быть отличимо от «проверка прошла».
      #
      # Те же три вопроса задаются пометке `# verifies <тикет>` в `cases/*.py` любой
      # сюиты: по ban #13 она означает ровно то же — «кейс ожидаемо красный, пока
      # дефект открыт». Раньше такую пометку не читал ни один древесный гейт, и все
      # четыре, стоявшие в дереве, ссылались на закрытые тикеты.
      #
      # Вердикт — число находок И объём осмотренного: обход, не прочитавший ни
      # одного документа отчёта, выходит с находкой, а не «чисто».
      #
      # Токен обязателен: без него «жив ли тикет» не спрашивается вовсе, и измерение
      # осталось бы навсегда непроверенным — ровно тот мягкий проход, который здесь и
      # ловится. Гейт при недоступном трекере не падает, но печатает каждую запись
      # координатой, поэтому пустой токен видно по выводу, а не по тишине.
      - name: запись «известное красное» имеет предмет
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/knownfailingsubject/cmd/verify-known-failing-subject .

      # ─── WORKFLOW, КОТОРЫЙ НЕ МОЖЕТ ЗАПУСТИТЬСЯ, — ТОТ ЖЕ НЕВЫЗВАННЫЙ ГЕЙТ ───
      #
      # `schedule`/`workflow_dispatch`/`workflow_run` регистрируются ТОЛЬКО для
      # файла на ветке по умолчанию. Такой workflow в дереве выглядит живым, а не
      # запускается ни разу: «ноль отказов» у него значит «контроля не было».
      #
      # ЛОГИКА ВЫНЕСЕНА В СКРИПТ, И ЭТО НЕ КОСМЕТИКА. Прежняя редакция жила здесь
      # инлайном, знала один вопрос — «зарегистрирован ли?» — и всякий
      # незарегистрированный объявляла находкой с дихотомией «довести до ветки по
      # умолчанию либо удалить». Оба исхода НЕДОСТИЖИМЫ из того изменения, которое
      # такой workflow вводит: на ветку по умолчанию файл попадает только слиянием,
      # а слияние блокировал сам гейт. Завести новый workflow этого класса было
      # нельзя вообще — кроме как через рукописный список ожидания, который потом
      # приходилось снимать вторым заходом. Разделяет состояния присутствие файла
      # на ветке по умолчанию — вопрос, которого прежняя редакция не задавала.
      #
      # Инлайн-шаг вдобавок нечем проверить инъекцией: у него нет входа, который
      # можно подать. У скрипта есть `--self-test`, и он идёт ПЕРВЫМ.
      - name: workflow с триггером только «с ветки по умолчанию» — зарегистрирован
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 .github/scripts/assert-default-branch-workflows-can-run.py --self-test
          python3 .github/scripts/assert-default-branch-workflows-can-run.py

      # Поле публичного запроса обязано иметь читателя в прод-коде своего сервиса
      # (api-conventions.md, «Принято-и-проигнорировано — ЗАПРЕЩЕНО»): молча
      # принять и выбросить — не исход, вызывающий получает успех и уверен, что
      # его параметр применён.
      #
      # Предикат тоже не вызывался НИКЕМ. В отличие от соседа выше, отказывать он
      # умеет — и на дереве отказывал: находки были, и это был ДОЛГ ТРЁХ СЕРВИСОВ
      # (compute/iam/vpc), а не регресс. Поэтому порог назван числом и может
      # только СУЖАТЬСЯ:
      #   * находок больше порога — красное (новое поле без читателя не пройдёт);
      #   * находок меньше порога — тоже красное, с требованием опустить порог,
      #     иначе исключение переживёт свой предмет и снова начнёт лгать.
      # Это не сужение покрытия: обход полный, гейт полный, порог — объявленный
      # долг с числом. Разбор полей — продуктовое решение (реализовать / отвергать
      # явно / снять с контракта), не задача конвейера.
      #
      # ДОЛГ ЗАКРЫТ, И ЭТО ИЗМЕРЕНО, А НЕ ОБЪЯВЛЕНО: на 8c2eba3e предикат читает
      # 847 полей и находит 0 без читателя, поэтому порог опущен 29 → 0. Ветка
      # «находок меньше порога» сработала сама и потребовала этой правки — ровно
      # то самоистечение, ради которого она написана: запись, которой больше
      # нечего исключать, обязана быть находкой, а не тихо пережить свой предмет.
      #
      # ПОРОГ 0 → 1 ПОДНИМАЛСЯ ОДНАЖДЫ И ВМЕСТЕ СО СМЕНОЙ ОСНОВЫ (issue #110).
      # Прежде читатель искался ПО ИМЕНИ геттера в пределах домена, а имя между
      # сообщениями не уникально: на e5bbd92f слабой атрибуцией закрывалось 755
      # полей из 826, то есть «находок 0» держалось на совпадении имён. Основа
      # сменилась на типовую (`tools/unreadfieldaudit/cmd/proto-field-readers`
      # резолвит получателя через go/types), тот же обход нашёл одно поле, и порог
      # был поднят до 1. Поднимать порог позволено ТОЛЬКО так — вместе со сменой
      # основы в том же коммите; во всех прочих случаях он сужается, см. выше.
      #
      # ПОРОГ ВЕРНУЛСЯ К 0, И СОСТАВ ОСМАТРИВАЕМОГО ВЫРОС (issue #110, вторая
      # половина). Слепых зон у обхода было три, и все три закрыты:
      #   * поля внутри `oneof` не осматривались ВООБЩЕ — разборщик вырезал блок
      #     вместе с любым `{…}`; на 982b0849 таких полей 62 в дереве;
      #   * вложенное сообщение (`Parent.Nested`) не сходилось ни с индексом, ни с
      #     геттерами (Go-имя `Parent_Nested`) и объявлялось «нет .pb.go»;
      #   * `message X {}` объявлялось тем же «нет .pb.go» — по отсутствию
      #     геттеров, которых у пустого сообщения нет by construction.
      # Осмотрено полей: 826 → 905; сообщений без сгенерированного кода: 2 → 0.
      # Найденные при этом четыре поля разобраны продуктовым решением (все —
      # исход №2, явный отказ с именем поля), поэтому находок снова 0.
      #
      # СЛАБАЯ АТРИБУЦИЯ ТОЖЕ ПОД ПОРОГОМ, и он опущен 8 → 2. Поле попадает сюда,
      # когда его закрыл только строковый литерал имени (рефлексивный читатель:
      # known-set маски, whitelist фильтра, from_request_field каталога прав) — у
      # строки нет получателя, приписать её сообщению нечем. Число упало по трём
      # причинам, и ни одна не является ослаблением: (а) член `oneof` теперь
      # засчитывается по типу-обёртке и по различению ветки, а не по имени;
      # (б) структурные освобождения (нереализованный RPC, отвергнутый предок)
      # считаются ПЕРЕД слабой корзиной — раньше поле нереализованного RPC
      # объявлялось «закрытым слабо», хотя мерка к нему не применялась вовсе;
      # (в) два настоящих принято-и-выброшено, прятавшихся в этой корзине,
      # закрыты отказом. Порог обязан только убывать: иначе следующая правка
      # вернёт закрытие по совпадению имён, а число промолчит.
      #
      # Перепись читается тоже: обход, не дошедший ни до одного поля, красный.
      #
      # ЦЕНА НОВОЙ ОСНОВЫ, названная честно: предикат теперь зовёт `go run` и через
      # него `go list -deps -export ./services/... ./gateway/... ./internal/...`,
      # то есть КОМПИЛИРУЕТ замыкание зависимостей прод-деревьев (у setup-go в этой
      # джобе `cache: false`, поэтому сборка холодная). Шаг стал дороже — это плата
      # за то, что читатель приписывается сообщению по типу, а не по совпадению
      # имени. Если дерево не собирается, предикат отказывает (rc=2), а не молча
      # возвращается к слабой основе.
      - name: поле публичного запроса имеет читателя (порог сужается, не растёт)
        run: |
          set -o pipefail
          # Порог = текущий объявленный долг. Опускать при каждом закрытом поле.
          BASELINE_UNREAD=0
          BASELINE_UNSEEN=0
          # Порог слабой атрибуции: сколько полей закрыто именем-строкой при
          # неуникальном имени. Только вниз.
          #
          # 2 → 0 вместе с выносом iam. Оба поля слабой корзины были iam-овыми —
          # `BatchAuthorizeCheckRequest.scope_id` и `UpdateRoleRequest.permissions`
          # (замер зелёного прогона main `034faebf4`, 2026-09-04). Их обработчики
          # уехали в `kaname`, поэтому оба закрывались тогда не именем-строкой,
          # а полосой «RPC-НЕ-РЕАЛИЗОВАН», и слабой корзине покрывать было нечего.
          # Арифметика сходилась: закрыто чтением 982 → 716, полоса без обработчика
          # 0 → 268, и 982 − 716 + 2 = 268. Полей осмотрено 996 в обоих прогонах —
          # линия ни одного поля публичного запроса не завела и не сняла.
          #
          # 0 → 2 ВМЕСТЕ СО СМЕНОЙ ОСНОВЫ ОБХОДА (issue #2093) — второй и пока
          # единственный случай, когда порогу позволено вырасти, и условие то же,
          # что было названо выше: смена основы в ТОМ ЖЕ коммите.
          #
          # ЧТО СМЕНИЛОСЬ. Обход перечислял пакеты одним `go list` в корне
          # репозитория, а `go list` в каталог со СВОИМ `go.mod` не спускается by
          # construction. После выноса службы в модуль `github.com/PRO-Robotech/kaname`
          # её 136 пакетов стали НЕВИДИМЫ: не «непрочитанными» и не «находками», а
          # ничем. Вместе с ними исчезли обработчики её типов запроса, поэтому все
          # 268 полей домена уехали в «РПЦ-не-реализован» — корзину, которая ничего
          # не утверждает и предиката снятия не имеет. Со стороны это выглядело как
          # исправное дерево: находок ноль, слабая корзина пуста.
          #
          # Теперь обход идёт ПО МОДУЛЯМ (перечень выводится из дерева — `go.mod`
          # под обойденными каталогами), а прод-дерево домена адресуется путём ЕГО
          # модуля. Числа сошлись обратно с дособытийными: осмотрено 996 (не
          # изменилось ни на одно поле), закрыто чтением 716 → 982, полоса без
          # обработчика 268 → 0, слабая корзина 0 → 2 — те же два поля, что
          # назывались выше поимённо. То есть порог не поднят, а ВОССТАНОВЛЕН: он
          # был опущен на замере, снятом при 268 неизмеренных полях, и само это
          # опускание было следствием слепоты, а не закрытием долга.
          #
          # ПРЕДПОСЫЛКА ТЕПЕРЬ ПРОВЕРЯЕТСЯ, А НЕ ПОДРАЗУМЕВАЕТСЯ. Прежняя проверка
          # «нашлось ли дерево прод-кода» брала три дерева сразу (сервис, край,
          # общий internal/) и оставалась непустой, пока жив край, — то есть о
          # ПРОПАЖЕ дерева службы не спрашивала вовсе. Предикат отвечает rc=2, если
          # у домена ноль пакетов СОБСТВЕННОГО дерева либо если хоть один обойденный
          # модуль не дал ни одного пакета; объём осмотренного печатается по модулям
          # порознь, потому что суммарное число росло бы от чего угодно.
          #
          # ЦЕНА, названная честно: шаг теперь компилирует ЗАМЫКАНИЕ ЗАВИСИМОСТЕЙ
          # и вложенного модуля тоже, а он резолвит платформу опубликованной
          # версией — значит тянет её из прокси. Недоступность прокси даёт rc=2
          # (предпосылка не выполнена), а не тихий возврат к обходу одного дерева.
          BASELINE_WEAK=2
          rc=0
          python3 tools/unreadfieldaudit/unread_field_audit.py > unread.txt 2>&1 || rc=$?
          cat unread.txt
          if [[ "$rc" == "2" ]]; then
            echo "::error::предпосылка предиката не выполнена (см. вывод) — домен не измерен."
            exit 1
          fi
          seen=$(sed -nE 's/^осмотрено полей: ([0-9]+)$/\1/p' unread.txt | tail -1)
          found=$(sed -nE 's/^полей БЕЗ читателя в прод-коде: ([0-9]+)$/\1/p' unread.txt | tail -1)
          unseen=$(sed -nE 's/^.*НЕ осмотрены: ([0-9]+)\)$/\1/p' unread.txt | tail -1)
          weak=$(sed -nE 's/^закрыто СЛАБОЙ АТРИБУЦИЕЙ [^:]*: ([0-9]+) из [0-9]+$/\1/p' unread.txt | tail -1)
          if [[ -z "$seen" || -z "$found" || -z "$unseen" || -z "$weak" ]]; then
            echo "::error::формат вывода предиката изменился — числа не разобраны, а без них"
            echo "::error::вердикт этого шага ничего не означает. Предпосылка не выполняется."
            exit 1
          fi
          echo "осмотрено полей: $seen; без читателя: $found (порог $BASELINE_UNREAD);"
          echo "не осмотрено сообщений: $unseen (порог $BASELINE_UNSEEN);"
          echo "закрыто слабой атрибуцией: $weak (порог $BASELINE_WEAK)"
          if (( seen == 0 )); then
            echo "::error::обход не дошёл ни до одного поля — это провал, а не чистота."
            exit 1
          fi
          if (( found > BASELINE_UNREAD )); then
            echo "::error::полей без читателя $found — больше объявленного долга $BASELINE_UNREAD."
            echo "::error::Новое поле публичного запроса без читателя. Три исхода: реализовать,"
            echo "::error::отвергать явно INVALID_ARGUMENT, либо снять с контракта (reserved)."
            exit 1
          fi
          if (( found < BASELINE_UNREAD )); then
            echo "::error::полей без читателя $found — МЕНЬШЕ порога $BASELINE_UNREAD. Долг закрыт"
            echo "::error::частично: опусти BASELINE_UNREAD до $found в этом шаге. Порог, который"
            echo "::error::больше своего предмета, — ложное утверждение о продукте."
            exit 1
          fi
          if (( unseen > BASELINE_UNSEEN )); then
            echo "::error::сообщений без сгенерированного кода $unseen — больше порога"
            echo "::error::$BASELINE_UNSEEN. Такое сообщение НЕ ОСМОТРЕНО: слепая зона растёт."
            exit 1
          fi
          if (( unseen < BASELINE_UNSEEN )); then
            echo "::error::сообщений без сгенерированного кода $unseen — меньше порога"
            echo "::error::$BASELINE_UNSEEN. Опусти BASELINE_UNSEEN до $unseen."
            exit 1
          fi
          if (( weak > BASELINE_WEAK )); then
            echo "::error::слабой атрибуцией закрыто $weak полей — больше порога $BASELINE_WEAK."
            echo "::error::Поле закрыто ИМЕНЕМ поля строкой, а имя объявлено не в одном сообщении"
            echo "::error::домена: читатель мог принадлежать другому сообщению. Заведи чтение у"
            echo "::error::самого сообщения (req.GetX()) либо назови поле в маске/whitelist так,"
            echo "::error::чтобы имя было уникально."
            exit 1
          fi
          if (( weak < BASELINE_WEAK )); then
            echo "::error::слабой атрибуцией закрыто $weak полей — МЕНЬШЕ порога $BASELINE_WEAK."
            echo "::error::Опусти BASELINE_WEAK до $weak: объявленная слабость мерки, которой"
            echo "::error::больше нечего покрывать, — ложное утверждение о ней самой."
            exit 1
          fi
          echo "порог держится: долг не вырос, слепая зона не выросла, слабая атрибуция не выросла."

      # Прогонщик newman обязан выносить вердикт ПО ЧИСЛАМ, а не по одному
      # измерению. У vpc он читал только число упавших утверждений и код возврата
      # newman, печатая при этом колонки, которые не оценивал: коллекция, не
      # выполнившая НИ ОДНОГО запроса, давала ноль провалов и засчитывалась
      # зелёной — как и прогон, все запросы которого остались без ответа.
      #
      # Самопроверка гоняет настоящую функцию вердикта на синтетических отчётах и
      # доказывает обе стороны: пустой отчёт и неотвеченные запросы валят вердикт,
      # а честный полный прогон — проходит. Ей не нужен ни стенд, ни newman.
      #
      # Она существовала и до этого шага, но её не звал НИ ОДИН workflow, то есть
      # проверка честности прогонщика сама ни разу не выполнялась — тот же класс,
      # что и два случая выше в этом job'е.
      - name: вердикт прогонщика newman по числам (vpc)
        working-directory: services/vpc/tests/newman
        run: bash scripts/run_selftest.sh

      # Тот же жанр: доказать инъекцией, что предикат «первый доступ к своему
      # свежему ресурсу обёрнут ограниченным ретраем» ловит НАСТОЯЩИЙ пропуск и
      # МОЛЧИТ на законном близнеце. Числа держит сама самопроверка: она печатает
      # объём осмотренного последней строкой, поэтому перечислять близнецов здесь
      # не надо — перечень уже разошёлся с ней однажды (было «четырёх» при шести).
      # Без второй половины гейт ловил бы форму, а не существо, и первый же
      # ложный срабат его бы снял. Стенд и newman не нужны.
      - name: предикат обёртки первого доступа (vpc)
        working-directory: services/vpc/tests/newman
        run: python3 scripts/selftest_autowrap.py

  # Здесь стояла job `tofu-fmt` — второй `tofu fmt -check`, по terraform/modules и
  # terraform/examples. Джоба terraform выше проверяет формат по ВСЕМУ terraform/, то
  # есть строго шире, поэтому вторая ничего не добавляла и стоила отдельного ранера —
  # того самого ресурса, ради которого работа сводится в накопительную ветку.
  #
  # Дороже расхода было другое: она пинила версию tofu ВТОРОЙ раз, в URL для curl.
  # Сторож пинов (.github/scripts/check-pinned-tools.sh) ищет этот инструмент по входу
  # `tofu_version:` и URL не видел — то есть докладывал «сходится во всех вхождениях (1)»,
  # имея в дереве два. Разъехавшись, они дали бы два разных вердикта об одном предмете
  # при зелёном стороже. Пин теперь один на конвейер, второй — в scripts/ci-local.sh, и
  # оба сторожу видны.

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      # go install, а НЕ golangci-lint-action: action ставит предсобранный бинарь, и
      # если он собран Go старше нашего go.mod — падает с
      #   "the Go language version (go1.24) used to build golangci-lint is lower than
      #    the targeted Go version (1.25.7)"
      # Сборка из исходников нашим же toolchain'ом делает этот рассинхрон невозможным.
      - name: install golangci-lint (нашим toolchain'ом)
        # Пин версии: с @latest новые линтеры/правила прилетают сами и роняют CI без
        # единой правки кода. Версия обязана быть собрана Go >= go.mod (см. ниже) —
        # go install собирает НАШИМ toolchain'ом, поэтому рассинхрон невозможен.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: golangci-lint
        # Кэш линтера — В РАБОЧЕЙ КОПИИ этого job'а. Умолчание (~/.cache/golangci-lint)
        # общее на машину, а запись в нём ключуется содержимым пакета, не деревом:
        # где рабочих копий одного модуля больше одной (self-hosted runner, второй
        # checkout, локальные worktree) прогон возвращает разбор ЧУЖИХ файлов — с
        # чужими путями, мимо якорных исключений .golangci.yml. На эфемерном
        # github-hosted runner'е предмета сейчас нет, и пин стоит именно поэтому:
        # инвариант не должен зависеть от того, на чьей машине job приземлился.
        # Гейт: internal/repohygiene/lintverdict_test.go
        env:
          GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
        run: golangci-lint run --timeout=10m

      - name: golangci-lint (модуль службы iam)
        # Линтер работает В ГРАНИЦАХ МОДУЛЯ. Служба несёт свой `go.mod`, поэтому
        # прогон выше её пакетов не осматривает вовсе — второй прогон обязателен,
        # иначе линт целого продукта молча перестал бы её видеть.
        env:
          GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
        working-directory: services/iam
        run: golangci-lint run --timeout=10m --config=${{ github.workspace }}/.golangci.yml

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          # Модуль службы iam — свой граф зависимостей, свой прогон: корневой
          # `./...` в него не спускается.
          govulncheck -C services/iam ./...

  helm:
    name: helm lint · template (dev + prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # ПИН ОБЯЗАТЕЛЕН: без `version` setup-helm ставит ПОСЛЕДНЮЮ, то есть версия
      # менялась бы без единой правки в дереве, а гейт проверял бы чарты не тем,
      # чем поднимается стенд. Значение обязано совпадать с e2e-newman.yml и
      # production-posture.yml — это сверяет
      # .github/scripts/check-pinned-tools.sh --divergence-only.
      #
      # Здесь стоял v3.17.0 не ради свежести, а потому что Helm 4 применяет
      # манифесты на стороне сервера, где владение полем энфорсится, и у аннотации
      # шаблона пода `kacho.cloud/openfga-model-id-rev` было ДВА писателя — чарт и
      # задание начальной настройки хранилища прав (kacho#3). Сначала снялся второй
      # писатель, а с ним и его гейт: движок прав снят целиком (S6 эпика #747),
      # вместе с заданием начальной настройки. Изнутри релиза шаблон пода теперь
      # НЕ ПАТЧИТ НИКТО — предмета у запрета не осталось, поэтому и проверки на
      # него в дереве нет: гейт снят вместе с предметом, а не ослаблен.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v4.2.4

      # Go нужен ровно одному шагу — проверке умолчаний чужих чартов личности
      # (`-tags helmcharts`): её условие создаёт `helm dependency build`, а не
      # unit-прогон, поэтому она живёт здесь.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod

      # Только `helm lint`, БЕЗ голого `helm template <chart>`: последний НЕ является
      # валидным гейтом — часть чартов ОСОЗНАННО падает без секретов (kacho-nlb:
      # «db.password is required when db.existingSecret is empty» — fail-closed,
      # дефолтного пароля нет и быть не должно). Такой рендер наказывал бы за
      # правильный дизайн. Реальную интеграцию даёт рендер umbrella с ПРОФИЛЕМ (ниже).
      - name: lint сервисных чартов
        run: |
          for c in services/*/deploy gateway/deploy ui-future/deploy; do
            [ -f "$c/Chart.yaml" ] || continue
            echo "=== $c"; helm lint "$c"
          done

      # Рендер umbrella с профилем — гейт, который ловит класс «шаблон падает только на
      # реальном профиле»: `and` в Go-шаблонах не короткозамкнутый (pg-certificates ронял
      # ВЕСЬ рендер), забытый сабчарт в MTLS_OFF, pg на несуществующем образе.
      #
      # Был ВЫКЛЮЧЕН, пока ui-future жил снаружи: umbrella ссылается на него file://, и
      # `helm dependency build` без sibling-чекаута не проходил. После переезда ui-future
      # в монорепу гейт вернулся.
      #
      # СОСТАВ БОЕВОГО НАБОРА ЧИТАЕТСЯ ИЗ ЕДИНСТВЕННОЙ ТАБЛИЦЫ (deploy/stacks.txt),
      # а не выписан здесь: пока он был выписан, шаг рендера знал о цепочке на слой
      # меньше, чем раскатывает скрипт, и его зелёное относилось к другому стенду.
      # Вне репозитория остаётся ТОЛЬКО слой кредов площадки — посадки он не несёт,
      # и это проверяет cutover-fe3455.sh перед раскаткой.
      # Материализация зависимостей — у ЕДИНСТВЕННОГО владельца
      # (deploy/scripts/helm-umbrella-deps.sh), а не голым вызовом helm. Причина
      # измерена, а не предположена: подкачка ходит в сеть за КАЖДОЙ из 22
      # объявленных зависимостей и ничего не переиспользует (полный проход ~3.5
      # мин, mtime всех `charts/*.tgz` обновляется и на повторном вызове). Пока
      # её звали шесть мест в дереве, этот job делал до десяти таких походов, и
      # отказ ЛЮБОГО красил прогон — два прогона подряд на релизной ветке так и
      # упали, на одной и той же зависимости, в двух разных местах. Владелец
      # пропускает поход, если зависимости уже на месте и исходники сабчартов не
      # менялись, печатает вывод helm целиком при отказе и повторяет попытку
      # ограниченное число раз. Свойство «владелец один» держит гейт
      # deploy/helm_deps_single_owner_test.go.
      - name: зависимости умбреллы (без sibling-чекаутов)
        run: bash deploy/scripts/helm-umbrella-deps.sh

      # Умолчания чужих чартов личности. Проверка читает АРХИВ (charts/*.tgz),
      # который подкачивает шаг выше и который git не отслеживает, — поэтому её
      # место здесь, а не в unit-прогоне: там её условие не создаётся ничем, и
      # «архив не читается» было бы безусловным красным на исправном дереве.
      # Файлы выведены из общего прогона тегом `helmcharts`; что тег зовётся —
      # утверждает deploy/identity_chart_premise_reachability_test.go, читающий
      # ЭТОТ файл, поэтому удаление шага ниже уронит unit-прогон.
      #
      # Отбор перечисляет ВСЕ пробы тега, и перечень не выписан на память:
      # internal/repohygiene TestBuildTagTestsAreSelectedByTheDeclaredRun читает
      # это объявление, достаёт из него `-run` и сверяет с именами проб,
      # объявленных под признаком в дереве. Следующая проба под тем же тегом
      # уронит unit-прогон, пока её имя не появится здесь.
      #
      # Пока имя стояло ОДНО, вторая проба (несимметричность раздачи настроек
      # двум процессам службы личности) не исполнялась ни разу за свою жизнь:
      # пакет в область попадал, поэтому гейт достижимости молчал, а `-run` её
      # не брал. Вердикта у неё не было вовсе — ни зелёного, ни красного (#1678).
      #
      # Четыре имени добавлены вместе с гейтом переписи «ключ нашего файла не
      # перебивается переменной» (#1733): он рендерит УМБРЕЛЛУ каждым стеком
      # таблицы, а рендер умбреллы требует тех же материализованных архивов, что
      # и проверки умолчаний, — то есть его условие создаёт ровно этот шаг.
      - name: умолчания чартов личности всё ещё безопасны
        run: >-
          go test -tags helmcharts ./deploy/
          -run 'TestIdentityDevFlags_ChartDefaultsAreStillSecure|TestCourierArgsAreNotInheritedFromTheDeployment|TestIdentityFileKeysAreNotOverriddenByTheEnvironment|TestEnvNamesForCoversPathAndItsPrefixes|TestFileKeyOverrideInjection_RealKnobRedsAndLegalTwinIsSilent|TestFileKeyOverrideInjection_ExistingControlStillReds'
          -count=1 -v

      - name: umbrella template — каждый стек таблицы
        working-directory: deploy/helm/umbrella
        run: |
          set -euo pipefail
          n=0
          for stack in $(bash ../../tests/helm/stacks.sh --names); do
            args="$(bash ../../tests/helm/stacks.sh --args "$stack")"
            echo "=== $stack: helm template $args ==="
            # shellcheck disable=SC2086
            helm template ci . $args > /dev/null
            n=$((n + 1))
          done
          # «Ноль находок» обязано быть отличимо от «ноль прочитанного».
          [ "$n" -ge 1 ] || { echo "не отрендерено НИ ОДНОГО стека"; exit 1; }
          echo "осмотрено: стеков $n"

      # helm template/lint НЕ ловят монт на несуществующий том — манифест рендерится, а
      # валится только на apiserver, уже при деплое. Проверяем МАТРИЦУ тумблеров, потому
      # что дефолт чарта её не покрывает (поймано на себе: у compute volumes были под
      # `if or opa mtls`, и при обоих false — профиль umbrella-фазы 1 — том исчезал).
      - name: каждый volumeMount имеет свой volume (матрица тумблеров)
        run: bash .github/scripts/check-volume-mounts.sh

      # Офлайновые стражи рендера сервисных чартов: провязка межсервисного ребра
      # обязана РЕАЛЬНО попасть в манифест (адрес соседа в config.yaml,
      # serverName для mTLS, отсутствие мёртвого хоста). Чистый `helm template`,
      # кластер не нужен — поэтому им место здесь, а не в прогоне на стенде.
      #
      # Не звал НИКТО: у kacho-nlb цель существовала и не встречалась ни в одном
      # конвейере, у kacho-vpc цели не было вовсе — скрипт просто лежал в дереве.
      # Оба стража были мёртвыми при полностью здоровом виде. Что они вызываются,
      # залочено гейтом internal/repohygiene/artifactgates/renderguard_test.go: он находит
      # стражей по дереву и требует достижимости каждого из конвейера, поэтому
      # следующий такой скрипт не сможет тихо остаться немым.
      - name: стражи рендера сервисных чартов (vpc, nlb)
        run: |
          make -C services/vpc helm-render-guard
          make -C services/nlb helm-render-guard

      # Здесь стоял шаг «mtls-off список покрывает values.dev.yaml». Он снят
      # вместе со своим предметом: подъём стенда больше не двухфазный, фазы с
      # выключенным mTLS не существует, и полноту её списка защищать не от чего.
      # cert-manager ставится отдельным релизом ДО продукта, поэтому CRD есть
      # раньше первого объекта продукта, а продукт поднимается одним прогоном и
      # сразу в боевой посадке (deploy/Makefile, CERT_MANAGER_RELEASE).

      # Офлайновый набор утверждений о манифестах (deploy/tests/helm/). Число скриптов
      # здесь НЕ выписывается: цель обходит `tests/helm/*-test.sh` и печатает счёт сама,
      # а выписанное число устаревает молча — на день этой правки в дереве их 31, тогда
      # как строка годами обещала 14.
      # Он существовал, но его не звал НИКТО: цель `helm-manifest-test` не была
      # ничьей зависимостью и не упоминалась ни в одном workflow — около двух тысяч
      # строк проверок не исполнялись ни разу. Прогон «как есть» это подтвердил: две
      # проверки утверждали неправду (путь чарта шлюза от прежнего polyrepo и
      # небезопасное умолчание authMode у geo, которое чарт с тех пор осознанно
      # сменил). Проверки покрывают то, чего не ловят ни `helm lint`, ни рендер
      # профиля: согласованность двух манифестов между собой (разрешённый SAN у
      # минта ↔ выпускаемый сертификат), привязку пода к содержимому его настроек,
      # PSS-этаж у Job'ов, allowlist'ы NetworkPolicy.
      #
      # yq на ubuntu-latest — mikefarah v4; цель это проверяет и отказывается
      # работать на подмене (python-yq молча отдаёт пусто, и утверждения проходят,
      # ничего не сверив).
      # Самопроверки гейтов — отдельным НАЗВАННЫМ шагом, чтобы их падение читалось
      # сразу, а не разбиралось внутри большого прогона. Каждая из них — инъекция
      # реального дефекта в проверяемый артефакт: гейт обязан покраснеть на дефекте
      # и промолчать на законной конструкции той же формы. До этого шага их не
      # вызывал никто: цель манифест-проверок запускала скрипты без аргументов, а в
      # workflow'ах их не было вовсе — доказательства существовали как текст.
      # Прогонщик проб python — ПРЕДПОСЫЛКА его самопроверки, а не удобство.
      # Без него прогонщик честно ОТКАЗЫВАЕТ («нет pytest, а пробы написаны под
      # него — прогон НЕ ВЫПОЛНЕН») вместо ложного успеха, и его самопроверка
      # краснеет — что и произошло на первом же прогоне этой волны. Зависимость
      # ставилась в другом job'е; здесь она нужна своя, потому что окружения
      # у job'ов раздельные.
      - name: pytest для самопроверки прогонщика проб
        run: python3 -m pip install --quiet --disable-pip-version-check pytest

      - name: самопроверки гейтов (инъекция дефекта в обе стороны)
        working-directory: deploy
        run: make gate-self-test

      # Вторая форма того же доказательства: не ветка `--self-test` ВНУТРИ гейта,
      # а отдельный скрипт `<тема>-inject.sh` рядом с ним. Десять таких лежали в
      # дереве и не встречались ни в одной джобе — доказательство существовало
      # как текст, то есть ровно то, ради борьбы с чем оно пишется. Класс
      # наблюдался дважды за сутки: гейт зелёный и ЛЖИВЫЙ (распознаватель не
      # видел стандартной формы записи) и гейт, верный лишь из-за узости
      # популяции; оба нашлись потому, что инъекцию прогнали руками.
      #
      # Перечень запускаемых ВЫВОДИТСЯ из дерева (git ls-files по форме имени), а
      # не выписывается здесь: выписанный оставил бы следующее заведённое
      # доказательство вне вызова. Отдельным НАЗВАННЫМ шагом — чтобы его отказ
      # читался сразу, а не разбирался внутри большого прогона.
      - name: доказательства инъекцией (отдельным файлом) исполняются
        working-directory: deploy
        run: make injection-proofs

      # Пины инструментов, встречающиеся в НЕСКОЛЬКИХ определениях конвейера, обязаны
      # совпадать. `--divergence-only` не обращается к сети (сверка идёт внутри дерева),
      # поэтому стоит здесь, на КАЖДОМ прогоне, а не только в недельном сторожа
      # pinned-tools-freshness: пока расхождение ловилось раз в неделю, оно жило в
      # стволе до недели, и разные конвейеры всё это время поднимали стенд разными
      # версиями — вердикты о том же дереве были несравнимы, причём молча.
      #
      # Отставание от апстрима здесь НЕ проверяется намеренно: это вопрос к апстриму,
      # он требует сети, ответ меняется без наших правок и обязан приходить issue'й, а
      # не красным прогоном на коммит, который к версии не прикасался.
      - name: пины инструментов не расходятся между конвейерами
        run: bash .github/scripts/check-pinned-tools.sh --divergence-only

      # Шаг подключает чужой код ПО СОДЕРЖИМОМУ, а не по подвижному тегу (#699).
      # Проверка местная и без сети: она читает объявления шагов этого дерева.
      # Отставание пинов от апстрима здесь не проверяется и не должно: красным
      # прогоном на коммит, который версий не касался, оно приходить не может.
      # Кому этот вопрос адресован — с 2026-08-27 НИКОМУ: автообновление
      # зависимостей снято владельцем, а недельный сторож pinned-tools-freshness
      # читает пины внутри шагов и `uses:` не видит. Пробел назван в шапке
      # .github/scripts/check-pinned-tools.sh.
      - name: шаги конвейера подключены по содержимому
        run: bash .github/scripts/check-actions-pinned.sh

      - name: манифест-проверки (deploy/tests/helm)
        working-directory: deploy
        run: make helm-manifest-test

      # Ожидание и остановка по ЗАХВАЧЕННОМУ идентификатору процесса, а не по
      # шаблону командной строки: поиск по шаблону сопоставляет его и с командной
      # строкой самого ждущего, поэтому петля не завершается никогда, а остановка
      # по шаблону сносит ждущего вместе с ожидаемым. Класс сработал четырежды за
      # один день и каждый раз выглядел как «висит непонятно почему». Гейт
      # превентивный: живых вхождений нет, и перепись прочитанного печатается,
      # чтобы «ноль находок» отличалось от «ноль прочитанного».
      - name: ожидание и остановка — по захваченному идентификатору
        working-directory: deploy
        run: make waiter-discipline

      # Вердикт о прогоне берётся из СВОДКИ отчёта, а не из массива исполнений.
      # Цель существовала в deploy/Makefile и не звалась ни одним workflow: на
      # дереве гейт исполнялся ТОЛЬКО как `--self-test`, то есть доказывал, что
      # умеет краснеть на синтетике, и ни разу не смотрел на само дерево.
      - name: вердикт о прогоне — из сводки отчёта, не из массива
        working-directory: deploy
        run: make report-reader-discipline

      # «Другая» фикстура обязана быть другой И иметь производителя.
      # Тот же класс, и заметнее: комментарий в
      # services/nlb/tests/newman/cases/listener.py утверждал, что этот гейт
      # «keeps the pair distinct AND its value produced», — а гейт не запускался
      # ни одним конвейером и ни одной целью Makefile. Девять объявлений
      # окружения несли схлопнутую пару, и проверка «репойнт между регионами
      # отвергнут» читала как отвергнутое то, о чём продукт не спрашивали.
      - name: «другая» фикстура отличается от своей пары
        working-directory: deploy
        run: make alt-fixture-discipline

      # Ветвь на посадке посева обязана быть способной уйти в обе стороны.
      # Классификатор посева оставляет стоять РОВНО ОДНО значение, поэтому
      # сравнение с ним — константа, а охраняемый им блок недостижим. Два
      # прогонщика newman несли ровно такую ветвь, и запасным значением у обоих
      # стояла посадка, которую сам классификатор ОТВЕРГАЕТ. Ни один прогон об
      # этом сказать не мог: недостижимый блок молчит так же, как исправный.
      # Гейт сам истекает — появится второе производимое значение, и запрет на
      # сравнение снимется, потому что ветвление станет осмысленным.
      - name: ветвь на посадке посева может уйти в обе стороны
        working-directory: deploy
        run: make posture-branch-discipline

      # Вердикт КАЖДОЙ суиты берётся из чисел отчёта — доказано ИСПОЛНЕНИЕМ.
      # Класс «прогонщик печатает GREEN при упавших проверках» здесь уже чинили,
      # но доказательство инъекцией существовало у ОДНОГО агрегатора из восьми, а
      # у пяти функцию нельзя было даже подгрузить (нет guard'а BASH_SOURCE). Гейт
      # извлекает её из каждого прогонщика и гоняет на синтетических отчётах:
      # чистый обязан дать ноль, каждая из пяти непрошедших форм — ненуль. Первый
      # прогон нашёл живой экземпляр: incremental-прогонщик nlb не читал ни
      # запросы без ответа, ни немой отчёт, и оба читались как чистая суита.
      - name: вердикт суиты выносится из чисел, а не из завершения команды
        working-directory: deploy
        run: make verdict-aggregator-discipline

      # У каждой записи объявления церемонии есть предмет в дереве.
      # Набор коллекций, которым нужен ЧЕЛОВЕЧЕСКИЙ вызывающий, выводится из
      # дерева единственным объявлением, а не выписывается: тот же перечень уже
      # лежит прозой в четырёх местах, а проза покраснеть не может.
      - name: объявление церемонии не разошлось с деревом
        working-directory: deploy
        run: make ceremony-declaration-discipline

      # У каждого адреса, который набирает волна, есть производитель в прогонщике.
      # Волна церемонии включалась фактом о дереве, печатала свою строку и выводила
      # набор коллекций — а четыре адреса её посева прогонщик не создавал. Держал их
      # человек руками, поэтому на чистой машине волна не проходила НИ РАЗУ, и это
      # было неотличимо от работающего механизма. Гейт идёт по модулям, достижимым из
      # прогонщика, и требует у каждого адреса-умолчания либо проброс, либо явную
      # передачу; «ноль прочитанного» отличается от «находок нет» по построению.
      - name: набираемый адрес имеет производителя, а не только имя
        working-directory: deploy
        run: make dialled-transport-discipline

      # Каждый скрипт сгенерированной коллекции обязан РАЗБИРАТЬСЯ.
      # Шаг, чей скрипт не разбирается, не падает — он НЕ ИСПОЛНЯЕТСЯ, и newman
      # считает это в канале, отдельном от `assertions.failed`. Поэтому сводка
      # суиты читается как «0 упавших» ровно там, где проверки не выполнялись
      # вовсе, — то есть вердикт молчит про целый класс.
      # Гейт разбирает НАСТОЯЩИМ парсером: первая перепись этого дефекта бралась
      # регулярным выражением и завысила радиус на порядок, потому что выражение
      # не отличает сломанный литерал от корректно экранированного и не имеет
      # контроля ни в одну сторону. Перепись прочитанного печатается, чтобы
      # «ноль находок» отличалось от «ноль прочитанного», а пустой набор файлов
      # сам по себе является провалом.
      - name: скрипты сгенерированных коллекций разбираются
        working-directory: deploy
        run: make generated-scripts-parse

      # Шаг удаления обязан НЕСТИ УТВЕРЖДЕНИЕ. Перепись: 82 коллекции, 8233 шага,
      # 1359 из них DELETE — и 457 читали 200, 403 и 500 одинаково, потому что не
      # утверждали ничего. Тихим это не оставалось: у асинхронного удаления шаг
      # захватывает `opId` из тела, а следующий опрашивает операцию по нему; отказ
      # тела не несёт, `opId` остаётся от ПРЕДЫДУЩЕЙ операции, и опрос подтверждает
      # чужой завершённый успех — кейс зелёный, ресурс жив, ограниченный пул течёт.
      # Утверждение ставит генератор; здесь проверяется его исход по дереву.
      - name: шаг удаления несёт утверждение и способен упасть
        working-directory: deploy
        run: make delete-step-discipline

      # Роль, которую заводит фикстура, обязана быть построена из глаголов, которые
      # модель прав объявляет. Сегмент глагола в Role.Create словарём не закрыт —
      # роль создаётся успешно, а отношения `v_*` за несуществующим глаголом
      # реконсайлер не эмитит, молча. Кейс, утверждающий «этот субъект может», тогда
      # не проходит ни при каком исправном продукте; а роль, которой никто не
      # пользуется, не краснеет вовсе — именно так вторая такая роль пережила
      # починку первой, лежавшей двумя строками выше. Словарь читается из
      # канонической модели, а не из второго рукописного списка; перепись
      # прочитанного печатается, и пустой состав фикстур сам по себе провал.
      - name: глаголы ролей в фикстурах объявлены моделью прав
        working-directory: deploy
        run: make fixture-role-verbs

  # ─── ПЕРЕНОС ВЕТКИ НЕ ОТКАТИЛ СТВОЛ ────────────────────────────────────────
  #
  # ПРЕДМЕТ. Ветка, отставшая от ствола, при посадке может ВЕРНУТЬ содержимое
  # своей базы на файлах, которых она не касалась, — и это проходит без единого
  # конфликта, потому что конфликт возникает только там, где ОБЕ стороны правили
  # одно место. Молчание git о конфликте не есть утверждение о сохранности
  # ствола, и побайтовое равенство файлов этого тоже не ловит.
  #
  # Гейт для этого написан и лежал в дереве НЕВЫЗВАННЫМ: ни один workflow и ни
  # одна достижимая цель Makefile его не запускали, то есть он не мог ни
  # покраснеть, ни отчитаться. Предмет при этом жив — 168 из последних 200
  # коммитов ствола суть посадки, а последняя из них правила ровно этот класс.
  #
  # Судится КАЖДАЯ посадка ЛИНИИ сверх ствола, а не прирост этой отправки.
  #
  # Здесь стояло «каждая посадка, внесённая ЭТИМ прогоном», и это было верно про
  # реализацию, но неверно про предмет: диапазон события несёт лишь прирост с
  # прошлой отправки, а всё, что судья говорит — и находка, и перечень
  # объявленных снятий, — относится к линии целиком. Замер на `release/modules-5`
  # (2026-09-02): из 17 посадок, судимых одной отправкой, в следующую не попала
  # НИ ОДНА; при выведенном из графа диапазоне не выпала ни одна из 24. То есть
  # и находка, и запись перечня жили ровно один прогон (задача #1911).
  carry-drift:
    name: перенос ветки не откатил ствол
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Гейт судит ГРАФ — родителей посадки и точку расхождения ветки со
          # стволом. Мелкий клон их не содержит: merge-base не разрешается,
          # скрипт выходит кодом 2, и «не выполнилось» прочиталось бы как
          # «чисто». Полная история здесь — предпосылка вердикта, не удобство.
          fetch-depth: 0
          # НАСТОЯЩАЯ ГОЛОВА ВЕТКИ, а не синтетическое слияние запроса.
          #
          # Этот конвейер идёт ТОЛЬКО на `pull_request`, и `github.sha` там —
          # коммит, который GitHub создаёт сам: слияние головы с базой. В ветке
          # его нет, посадкой он не является, а его первый родитель — сама база.
          # Гейт, получив его, сверял НОЛЬ файлов и честно объявлял себя слепым;
          # отказ был структурным и повторялся бы на каждом прогоне.
          #
          # Наблюдалось 2026-08-13: `диапазон прогона: <ветка>..<c5f0d1be>`, где
          # последнего коммита нет ни в одной ветке. На настоящем графе тот же
          # гейт в ту же минуту проходил — 625 файлов сверено побайтово, находок 0.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: судью судит его проба (синтетические графы)
        run: |
          # Проба идёт ПЕРВОЙ и в том же задании: она решает, чего стоит вердикт
          # следующего шага. Судья, не прошедший своей пробы, не вправе судить
          # чужую посадку — ни зелёным, ни красным.
          #
          # Здесь её не было. Комментарий соседнего шага называл её тем, что
          # «судит судью», а не исполнял её НИ ОДИН шаг: проба лежала в дереве и
          # не роняла ничего. Обещание без механизма — пожелание, и цена ему
          # известна: дефект различителя пустой области дожил до боевого прогона
          # и покрасил два несвязанных PR, притом что случай на него пишется за
          # десять строк. Прогон занимает секунды: синтетический репозиторий на
          # случай, в сеть не ходит. Числа случаев здесь нет намеренно — оно
          # растёт с каждой находкой и устарело бы молча; своё перепись печатает
          # сама последней строкой.
          bash tools/carrydrift/drift-test.sh

      - name: перенос ветки не откатил ствол
        env:
          # Через env, а не подстановкой в тело: значения приходят из события и
          # в теле скрипта были бы кодом.
          #
          # ЗАПАСНОЙ путь, а не основной: диапазон судья выводит из графа сам.
          # Прирост события нужен там, где выводить нечего — на push в сам
          # `main`, где линии сверх ствола не существует by construction. Сверх
          # того `before` есть не у всякого события: у `pull_request` его несёт
          # действие `synchronize`, но не `opened`, — и пока охват зависел от
          # него, на открытии запроса судилась одна вершина при любом числе
          # накопленных посадок.
          BEFORE: ${{ github.event.before }}
          # Та же голова, что и у checkout: иначе гейт судил бы один граф, а
          # читал другой.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Вся логика — в скрипте: его можно прогнать локально тем же вызовом,
          # а его собственная проба (tools/carrydrift/drift-test.sh) судит судью
          # на синтетических графах — шагом выше, а не на словах. Пока тело жило
          # здесь, прогнать его вне конвейера было нечем, и три дефекта дожили
          # до боевого прогона.
          bash tools/carrydrift/judge.sh

  docs-sites:
    name: docs-sites (8 сайтов документации)
    runs-on: ubuntu-latest
    # Полный прогон восьми сборок — минуты; backstop, чтобы зависший webpack не держал очередь.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '26'
          cache: npm
          # Ключ кэша — по ВСЕМ восьми lock-файлам сразу: сайты ставят зависимости
          # каждый в своём каталоге, и кэш, привязанный к одному из них, обновлялся бы
          # мимо остальных семи.
          cache-dependency-path: |
            gateway/docs/package-lock.json
            services/*/docs/package-lock.json
      # Вся логика — в скрипте (его можно прогнать локально: `make docs-sites`).
      # Здесь только вызов, чтобы гейт не расходился с тем, что запускает человек.
      #
      # Скрипт судит КАЖДУЮ сборку по коду возврата и НИКОГДА по наличию `build/`:
      # провалившаяся сборка Docusaurus оставляет каталог результата целиком
      # (воспроизведено: rc=1 при 8 готовых страницах на 4.3 МБ), поэтому шаг вида
      # «есть build/ — значит собралось» опубликовал бы непроверенное.
      - name: собрать все сайты
        run: python3 .github/scripts/build-docs-sites.py

      # Артефакт грузится ТОЛЬКО после зелёного шага выше (умолчание `if: success()`).
      # Это не оформление: ровно здесь и живёт ловушка пункта выше — выложить каталог,
      # оставшийся от упавшей сборки, значит опубликовать то, что гейт отверг.
      #
      # Практический смысл артефакта: пока сайты никто не собирал, спор «единый портал
      # против восьми отдельных» вести было не на чем. Собранные восемь деревьев дают
      # предмет — размеры, пересечения маршрутов, дубли разделов — по которому решение
      # можно принять по фактам, а не по вкусу.
      - name: выложить собранные сайты
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: docs-sites
          path: |
            gateway/docs/build
            services/*/docs/build
          retention-days: 7
