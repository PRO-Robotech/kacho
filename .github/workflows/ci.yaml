# ci — единый гейт монорепы.
#
# Заменяет 10 отдельных per-repo CI (proto/corelib/7 сервисов/gateway). Один модуль →
# один `go build ./...` проверяет ВЕСЬ граф разом: рассинхрон вроде «сервис отстал от
# corelib» или «код обогнал proto» падает здесь, а не всплывает при деплое через месяц.
# GitHub читает workflow ТОЛЬКО из корня — per-service .github/ были бы мертвы, поэтому
# их не существует.

name: ci

on:
  # Только как pre-merge гейт для PR в main (не на push в main после мерджа —
  # squash-merge переносит уже провалидированное PR-дерево, повторный прогон избыточен).
  pull_request:
    branches: [main]

  # …и на push в интеграционную ветку. Одного условия на PR в main НЕ ХВАТИЛО:
  # redesign/integration живёт месяцами и в main не мержится, поэтому этот гейт на
  # ней не отработал НИ РАЗУ — вся работа шла в слепой зоне, и первый же ручной
  # прогон это показал. Гейт, который смотрит только на вход в main, не пересекается
  # с веткой, где идёт разработка.
  #
  # Очередь это не растит: все job'ы здесь `runs-on: ubuntu-latest` (за единственный
  # self-hosted-ранер соперничают e2e-newman / docker-build / production-posture, а
  # этот workflow к нему не обращается), плюс `concurrency` с cancel-in-progress
  # держит один живой прогон на ветку, а не N.
  #
  # Фильтра по путям сознательно нет: он стал бы слепой зоной ровно того же рода,
  # что и отсутствующий триггер.
  push:
    branches: [redesign/integration]
  workflow_dispatch:

permissions:
  contents: read


# Одна живая проверка на ветку: серия пушей подряд иначе поставит по семь job'ов
# на каждый, и очередь растёт быстрее, чем разбирается.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · vet · gofmt · test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gofmt
        run: |
          # Сгенерённое исключаем: его форматирует генератор, а не человек.
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -vE '\.pb\.go$|_grpc\.pb\.go$|\.pb\.gw\.go$') || true)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      # -short ОБЯЗАТЕЛЕН: без него сюда затягиваются integration-тесты, поднимающие
      # postgres:16 через testcontainers на КАЖДОМ из 202 пакетов → джоба упиралась в
      # `panic: test timed out after 15m0s` (23 минуты wall-clock и красный CI).
      # Локально с -short — 5 секунд. Integration гоняет отдельная джоба ниже.
      - name: test -race -short (unit)
        run: go test ./... -race -short -count=1 -timeout 5m

  integration:
    name: integration (${{ matrix.svc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [iam, vpc, compute, geo, nlb, storage, registry]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      # internal/repo/*integration_test.go поднимают postgres:16 через testcontainers
      # (Docker есть на ubuntu-latest). Отдельная джоба, а НЕ часть unit-прогона:
      # иначе -short-путь исчезает и быстрый сигнал (59с) тонет в контейнерах.
      #
      # МАТРИЦА ПО СЕРВИСАМ, а не один прогон на все 45 пакетов. Причина: одним job'ом
      # это не влезает — iam/internal/repo/kacho/pg держит 398 тестов против
      # testcontainers-Postgres и под -race выбирает 15m в одиночку:
      #   panic: test timed out after 15m0s   (весь job шёл 35 минут и падал)
      # В polyrepo этой нагрузки не было: у kacho-iam integration-джобы НЕ СУЩЕСТВОВАЛО
      # вовсе — его 398 pg-тестов не гонялись в CI НИКОГДА. Монорепа их подхватила
      # (это плюс: покрытие, которого не было), но им нужен свой бюджет.
      # Матрица заодно параллелит: wall-clock = самый долгий сервис, а не сумма.
      #
      # -p 1 ВНУТРИ сервиса: пакеты сериализуются. Под -race + Docker-contention
      # параллельные testcontainers-пакеты голодают друг у друга ресурсы, и
      # concurrent-кейсы (CAS/EXCLUDE/SKIP-LOCKED) флакают. Дизайн — из polyrepo kacho-vpc/nlb.
      - name: integration ${{ matrix.svc }} (-p 1, сериализовано)
        run: |
          # `go list`, а НЕ шелл-глоб: `./services/*/internal/repo/...` не работает —
          # bash глобит СЛОВО ЦЕЛИКОМ, а `...` не каталог, совпадений нет → паттерн уходит
          # в go test литералом («lstat …: no such file or directory»), и job краснеет за
          # 18с не запустив НИ ОДНОГО теста. go list заодно сам разбирается с тем, что у
          # geo нет internal/clients.
          pkgs=$(go list ./services/${{ matrix.svc }}/... | grep -E '/internal/(repo|clients)(/|$)' || true)
          if [ -z "$pkgs" ]; then echo "нет integration-пакетов у ${{ matrix.svc }} — пропуск"; exit 0; fi
          echo "пакетов: $(echo "$pkgs" | wc -l)"
          echo "$pkgs" | xargs go test -race -count=1 -timeout 25m -p 1

  proto:
    name: buf lint · breaking · generate-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # cache: false — ОСОЗНАННО, не оплошность. С `cache: true` джоба флакала:
          #   /usr/bin/tar: .../toolchain@v0.0.1-go1.25.12.linux-amd64/README.md:
          #     Cannot open: File exists
          # go.mod несёт toolchain-директиву → setup-go СКАЧИВАЕТ тулчейн, а следом
          # restore кэша распаковывает его же поверх → tar падает на существующих
          # файлах. Проявляется через раз (зависит от того, что лежит в кэше), из-за
          # чего выглядит как «CI моргает».
          # Терять тут нечего: джобе нужен лишь `go install` трёх protoc-плагинов,
          # кэш экономил секунды и стоил красных прогонов.
          cache: false
      # Пин: buf влияет и на lint-правила, и на генерацию. Разъезд local-vs-CI уже
      # стоил ложного «unused import» (свежий buf ловит то, что 1.69.0 пропускал) —
      # находка была ВЕРНАЯ, но версия должна быть одна и та же у всех.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.69.0

      - name: buf lint
        working-directory: proto
        run: buf lint

      - name: buf breaking (vs main)
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"

      # Стабы закоммичены → они ОБЯЗАНЫ совпадать с .proto. Иначе кто-то правил
      # сгенерённое руками (что вдобавок бьёт rawDesc — см. README) либо забыл
      # перегенерировать после правки .proto.
      - name: generate-diff (стабы в синхроне с .proto)
        run: |
          # БЕЗ @latest: версии плагинов пинит go.mod через tools/tools.go. Плагины
          # ОПРЕДЕЛЯЮТ содержимое pkg/api — с @latest версия у разработчика и в CI
          # разъезжается по времени, и этот самый generate-diff начинает мигать
          # «фантомным диффом» при нетронутых .proto.
          go install google.golang.org/protobuf/cmd/protoc-gen-go
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway

          # Рукописные файлы, живущие рядом со стабами (напр.
          # registry_rest_routing_test.go — ловит REST-shadow catch-all-роутов), buf НЕ
          # генерит. `rm -rf pkg/api` их сносит, и diff показывал бы их как удаление —
          # гейт краснел не из-за расхождения стабов, а из-за собственной уборки.
          # Поэтому: запоминаем их список ДО сноса и возвращаем из git ПОСЛЕ генерации.
          git ls-files pkg/api | grep -vE '\.pb\.go$|_grpc\.pb\.go$|\.pb\.gw\.go$' > /tmp/handwritten.list || true
          echo "рукописных файлов в pkg/api: $(wc -l < /tmp/handwritten.list)"

          rm -rf pkg/api
          (cd proto && buf generate)
          while read -r f; do [ -n "$f" ] && git checkout -- "$f"; done < /tmp/handwritten.list

          if ! git diff --quiet -- pkg/api; then
            echo "::error::pkg/api разошёлся с proto/ — прогони 'cd proto && buf generate' и закоммить"
            git diff --stat -- pkg/api
            exit 1
          fi

  authz-artifacts:
    name: permission-catalog · rest-route-table (staleness + copy-drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # cache: false — та же причина, что в job `proto` выше: go.mod несёт
          # toolchain-директиву, setup-go скачивает тулчейн, а restore кэша
          # распаковывает его же поверх → `tar: ... Cannot open: File exists`.
          cache: false
      # Тот же пин, что в job `proto`: каталог и route-table ГЕНЕРИРУЮТСЯ через buf,
      # значит версия buf влияет на содержимое артефакта. Разъезд версий local-vs-CI
      # превратил бы гейт в источник фантомного диффа.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.69.0

      # Permission catalog — рантайм source-of-truth per-RPC authz. Он вшит ДВУМЯ
      # копиями (gateway/internal/middleware/embed + iam seed/embedded), и до этого
      # гейта их расхождение НИЧЕМ не ловилось: `grep permission.catalog .github/`
      # был пуст. Цена дрейфа — не «некрасиво», а прод-инцидент: RPC без записи в
      # каталоге получает `catalog: no entry for method` → AUTHZ_DENIED (fail-closed)
      # на КАЖДЫЙ вызов, независимо от грантов (security.md инв. 4).
      #
      # Гейт ПАДАЕТ (не warn) в двух случаях:
      #   1. embedded-каталог STALE относительно proto (новый/переименованный RPC
      #      уехал без записи);
      #   2. iam-копия разошлась с gateway-копией байт-в-байт.
      # Обе проверки — внутри `make permission-catalog-check` (gateway/Makefile),
      # существующего таргета: гейт не изобретает свою логику сравнения, а
      # переиспользует ту, которой пользуется разработчик локально.
      - name: permission-catalog staleness + copy-drift
        working-directory: gateway
        run: make permission-catalog-check

      # REST route-table — тот же класс: генерируемый из `google.api.http`-аннотаций
      # committed-артефакт, по которому authz-middleware переводит REST-путь в FQN.
      # Stale-таблица = endpoint, чей путь middleware не резолвит → каждый вызов
      # denied (уже стреляло 6 registry Repository-роутами). Таргет тоже уже
      # существовал и тоже не был подключён к CI.
      - name: rest-route-table staleness
        working-directory: gateway
        run: make rest-route-table-check

      # listauthz — гейт «публичный List обязан фильтровать результат по правам на
      # ОБЪЕКТ». ТРЕТИЙ подряд случай того же класса в этом же job'е: скрипт и
      # make-таргет существовали в 4 сервисах (compute, nlb, storage, vpc) и **не
      # вызывались ни одним workflow** — то есть гейт не запускался ни разу.
      #
      # Цена бездействия измерена, а не предположена: в storage фильтрации по объектам
      # не было ВООБЩЕ (любой член проекта видел каждый том/снимок/образ), при том что
      # Get/Update/Delete тех же ресурсов требовали per-object грант. Локальный гейт
      # storage при этом печатал OK — он проверял более слабый инвариант (project-scope),
      # а его собственный фикстур-тест фиксировал именно слабое поведение, поэтому
      # слепое пятно было самосогласованно зелёным.
      #
      # Гоняем ВСЕ сервисы с публичным List: гейт, не покрывающий сервис, — это ровно
      # тот же дефект, который он призван ловить.
      #
      # registry добавлен пятым и показал ту же пару дефектов сразу в обе стороны:
      # его таргет печатал строчку и выходил с нулём (проверял ноль), а этот цикл его
      # всё равно не звал. Каждый документ, ссылавшийся на «зелёный audit-list-filter»
      # реестра, ссылался на пустоту. Сам гейт реестра устроен иначе (разбор AST
      # хендлера, а не грепы по repo/service): его List-поверхность не проектная —
      # права живут на реестре и репозитории, а теги и референсы объектами прав не
      # являются. Что этот цикл действительно зовёт registry, залочено тестом
      # services/registry/tools/auditlistfilter/ci_wiring_test.go.
      - name: listauthz — публичный List фильтрует по объекту (5 сервисов)
        run: |
          set -euo pipefail
          fail=0
          for svc in compute nlb registry storage vpc; do
            echo "::group::audit-list-filter ${svc}"
            make -C "services/${svc}" audit-list-filter || fail=1
            echo "::endgroup::"
          done
          exit "$fail"

      # Сюита обязана говорить правду О СЕБЕ, иначе её зелёное нечем читать.
      #
      # Два утверждения storage-сюиты разошлись с сюитой одновременно: запись
      # «известное красное» продолжала объявлять открытыми два дефекта, закрытых в
      # дереве (один — тем же деревом, что несло запись), а таблица состава отстала
      # на две коллекции и 40 кейсов. Оба — ложные утверждения о продукте, и оба
      # переживают ровно потому, что никто не сверяет документ с артефактами.
      #
      # Гейт делает эту сверку механически и требует, чтобы всякое исключение
      # ИСТЕКАЛО САМО: у записи обязан быть ОТКРЫТЫЙ тикет и кейс с парной
      # аннотацией; закрытый тикет — находка, а не повод «обновить» запись.
      # Измерение живости тикета спрашивает трекер: без доступа гейт не падает, но
      # печатает каждую непроверенную запись координатой (не выполнялось ≠ прошло).
      - name: сюита не переживает свои фиксы (known-failing + состав)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -C services/storage audit-known-failing

      # Второй non-negotiable — «никаких упоминаний чужих облаков» — до сих пор
      # существовал только как проза и держался на ревью. Проверки не было НИ ОДНОЙ:
      # ни цели, ни скрипта, ни шага. При этом отчёты о чистоте писались — то есть
      # отчитывались не о результате проверки, а о её отсутствии.
      #
      # Инвариант шире, чем у comment-стража compute (тот читает один сервис, только
      # Go-комментарии, и в основном ловит процессный шум): здесь — всё дерево, любой
      # текстовый файл и каждый путь.
      #
      # Вердикт — число нарушений, а не факт запуска. Что этот шаг существует,
      # залочено тестом tools/foreignclouds (TestCIRunsThisGate), а сам анализ
      # гоняется и внутри обычного `go test ./...`.
      - name: продукт описан своими словами (второй non-negotiable)
        run: go run ./tools/foreignclouds/cmd/verify-no-foreign-clouds .

      # Тенантный контейнер называется Project. Слово folder — доредизайновое:
      # обе несшие его колонки переименованы миграциями (compute 0009, iam 0070),
      # но само имя пережило переименование в поле запроса, в именах параметров,
      # в фикстурах, в query-ключах и в архитектурных доках, которые продолжали
      # описывать колонку, которой в БД уже нет. Проза переименование не держит —
      # держит то, что запускается.
      #
      # Вердикт — число нарушений И количество осмотренного: обход, не дошедший
      # ни до одного файла, выходит с кодом 2, а не «чисто». Что этот шаг
      # существует, залочено тестом tools/legacyfolder (TestCIRunsThisGate), сам
      # анализ гоняется и внутри обычного `go test ./...` (TestTreeIsClean).
      - name: тенантный контейнер называется Project, не folder
        run: go run ./tools/legacyfolder/cmd/verify-no-legacy-folder .

      # Прогонщик newman обязан выносить вердикт ПО ЧИСЛАМ, а не по одному
      # измерению. У vpc он читал только число упавших утверждений и код возврата
      # newman, печатая при этом колонки, которые не оценивал: коллекция, не
      # выполнившая НИ ОДНОГО запроса, давала ноль провалов и засчитывалась
      # зелёной — как и прогон, все запросы которого остались без ответа.
      #
      # Самопроверка гоняет настоящую функцию вердикта на синтетических отчётах и
      # доказывает обе стороны: пустой отчёт и неотвеченные запросы валят вердикт,
      # а честный полный прогон — проходит. Ей не нужен ни стенд, ни newman.
      #
      # Она существовала и до этого шага, но её не звал НИ ОДИН workflow, то есть
      # проверка честности прогонщика сама ни разу не выполнялась — тот же класс,
      # что и два случая выше в этом job'е.
      - name: вердикт прогонщика newman по числам (vpc)
        working-directory: services/vpc/tests/newman
        run: bash scripts/run_selftest.sh

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # go install, а НЕ golangci-lint-action: action ставит предсобранный бинарь, и
      # если он собран Go старше нашего go.mod — падает с
      #   "the Go language version (go1.24) used to build golangci-lint is lower than
      #    the targeted Go version (1.25.7)"
      # Сборка из исходников нашим же toolchain'ом делает этот рассинхрон невозможным.
      - name: install golangci-lint (нашим toolchain'ом)
        # Пин версии: с @latest новые линтеры/правила прилетают сами и роняют CI без
        # единой правки кода. Версия обязана быть собрана Go >= go.mod (см. ниже) —
        # go install собирает НАШИМ toolchain'ом, поэтому рассинхрон невозможен.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: golangci-lint
        run: golangci-lint run --timeout=10m

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  helm:
    name: helm lint · template (dev + prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ПИН ОБЯЗАТЕЛЕН. setup-helm без version ставит ПОСЛЕДНЮЮ — и притащил Helm 4.2.3,
      # тогда как локально и на проде helm v3.17. Helm 4 по умолчанию делает
      # SERVER-SIDE APPLY (Helm 3 — client-side 3-way merge), а это разная семантика
      # владения полями: apply упирается в чужой field-manager и валится
      #   UPGRADE FAILED: conflict with "kubectl-patch" using apps/v1:
      #   .spec.template.metadata.annotations.kacho.cloud/openfga-model-id-rev
      # (аннотацию объявляет чарт kacho-iam и патчит openfga-bootstrap-job — двойное
      # владение, для Helm 3 безобидное). Гейт при этом «зеленел», проверяя чарты НЕ той
      # версией, которой разворачивается прод, — ложная уверенность.
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      # Только `helm lint`, БЕЗ голого `helm template <chart>`: последний НЕ является
      # валидным гейтом — часть чартов ОСОЗНАННО падает без секретов (kacho-nlb:
      # «db.password is required when db.existingSecret is empty» — fail-closed,
      # дефолтного пароля нет и быть не должно). Такой рендер наказывал бы за
      # правильный дизайн. Реальную интеграцию даёт рендер umbrella с ПРОФИЛЕМ (ниже).
      - name: lint сервисных чартов
        run: |
          for c in services/*/deploy gateway/deploy ui-future/deploy; do
            [ -f "$c/Chart.yaml" ] || continue
            echo "=== $c"; helm lint "$c"
          done

      # Рендер umbrella с профилем — гейт, который ловит класс «шаблон падает только на
      # реальном профиле»: `and` в Go-шаблонах не короткозамкнутый (pg-certificates ронял
      # ВЕСЬ рендер), забытый сабчарт в MTLS_OFF, pg на несуществующем образе.
      #
      # Был ВЫКЛЮЧЕН, пока ui-future жил снаружи: umbrella ссылается на него file://, и
      # `helm dependency build` без sibling-чекаута не проходил. После переезда ui-future
      # в монорепу гейт вернулся.
      #
      # prod-профиль требует values.fe3455-ory.yaml (gitignored — несёт креды кластера),
      # поэтому в CI рендерим dev + prod-БЕЗ-ory: этого хватает, чтобы поймать
      # шаблонные дефекты, а секрет остаётся вне репозитория.
      - name: umbrella dependency build (без sibling-чекаутов)
        working-directory: deploy/helm/umbrella
        run: helm dependency build

      - name: umbrella template — dev-профиль
        working-directory: deploy/helm/umbrella
        run: helm template ci . -f values.dev.yaml > /dev/null

      - name: umbrella template — prod-профиль
        working-directory: deploy/helm/umbrella
        run: helm template ci . -f values.prod.yaml -f values.fe3455.yaml -f values.fe3455-prod.yaml > /dev/null

      # helm template/lint НЕ ловят монт на несуществующий том — манифест рендерится, а
      # валится только на apiserver, уже при деплое. Проверяем МАТРИЦУ тумблеров, потому
      # что дефолт чарта её не покрывает (поймано на себе: у compute volumes были под
      # `if or opa mtls`, и при обоих false — профиль umbrella-фазы 1 — том исчезал).
      - name: каждый volumeMount имеет свой volume (матрица тумблеров)
        run: bash .github/scripts/check-volume-mounts.sh

      - name: mtls-off список покрывает values.dev.yaml
        working-directory: deploy
        run: make check-mtls-off-complete

      # Офлайновый набор утверждений о манифестах (deploy/tests/helm/, 14 скриптов).
      # Он существовал, но его не звал НИКТО: цель `helm-manifest-test` не была
      # ничьей зависимостью и не упоминалась ни в одном workflow — около двух тысяч
      # строк проверок не исполнялись ни разу. Прогон «как есть» это подтвердил: две
      # проверки утверждали неправду (путь чарта шлюза от прежнего polyrepo и
      # небезопасное умолчание authMode у geo, которое чарт с тех пор осознанно
      # сменил). Проверки покрывают то, чего не ловят ни `helm lint`, ни рендер
      # профиля: согласованность двух манифестов между собой (разрешённый SAN у
      # минта ↔ выпускаемый сертификат), привязку пода к содержимому его настроек,
      # PSS-этаж у Job'ов, allowlist'ы NetworkPolicy.
      #
      # yq на ubuntu-latest — mikefarah v4; цель это проверяет и отказывается
      # работать на подмене (python-yq молча отдаёт пусто, и утверждения проходят,
      # ничего не сверив).
      # Самопроверки гейтов — отдельным НАЗВАННЫМ шагом, чтобы их падение читалось
      # сразу, а не разбиралось внутри большого прогона. Каждая из них — инъекция
      # реального дефекта в проверяемый артефакт: гейт обязан покраснеть на дефекте
      # и промолчать на законной конструкции той же формы. До этого шага их не
      # вызывал никто: цель манифест-проверок запускала скрипты без аргументов, а в
      # workflow'ах их не было вовсе — доказательства существовали как текст.
      - name: самопроверки гейтов (инъекция дефекта в обе стороны)
        working-directory: deploy
        run: make gate-self-test

      - name: манифест-проверки (deploy/tests/helm)
        working-directory: deploy
        run: make helm-manifest-test
