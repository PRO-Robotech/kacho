# Сводный вердикт запроса на слияние — ОДИН контекст, который держит защиту.
#
# ─────────────────────────────────────────────────────────────────────────────
# ПРЕДМЕТ (#614)
#
# Обязательная проверка блокирует слияние, только когда она СУЩЕСТВУЕТ. Между
# открытием запроса и появлением её check-run есть окно: контекста нет ни как
# pending, ни как failure, и слияние проходит. Защита при этом выглядит
# исполненной — список контекстов настроен, обход администратора выключен.
#
# Цена измерена: в ствол уехала ревизия, чья обязательная проверка впоследствии
# покраснела, и красное осталось незамеченным трое суток — его нашли, только
# когда та же проверка заблокировала следующие два запроса. Хуже прямого
# следствия косвенное: из «влито» перестаёт следовать «было зелёным», и всякий,
# кто читает историю ствола, сделает это неверное умозаключение снова.
#
# ЧТО ДЕЛАЕТ ЭТА ДЖОБА
#
# Стартует немедленно и без зависимостей, поэтому её контекст появляется в первые
# секунды жизни запроса — окно сжимается со «времени старта ВСЕХ джоб» до
# «времени старта одной». Дальше она ждёт остальные проверки и зеленеет, только
# если каждая завершилась успехом.
#
# Она же закрывает второй, более тихий класс: проверка, не появившаяся ВООБЩЕ.
# Ноль check-run'ов — это не «замечаний нет», а «никто не смотрел».
#
# РЕШЕНИЕ ЖИВЁТ В СКРИПТЕ, А НЕ ЗДЕСЬ
#
# `.github/scripts/pr-verdict.py` — чистая функция над набором проверок, и её
# доказывает `pr_verdict_test.py` (11 утверждений: краснеет, зеленеет, отличает
# «ещё идёт» и «ни одной»). Пока логика жила шагом workflow, проверить её можно
# было только прогоном в конвейере — тем самым способом, надёжность которого она
# и обеспечивает.
#
# «СВОДНЫХ ВЕРДИКТОВ» В ДЕРЕВЕ ДВА, И ЭТО РАЗНЫЕ ПРЕДМЕТЫ
#
# Имена похожи настолько, что их принимали за расхождение одного предмета. Они им
# не являются:
#
#   `e2e-newman.yml`, джоба `summary` — «сводный вердикт (все шарды)». Судит ОДИН
#       процесс: сошлись ли отчёты его шардов. Стоит в обязательных контекстах
#       защиты ствола.
#   этот файл, джоба `all-checks-green` — «сводный вердикт (все проверки
#       завершились и зелены)». Судит ВЕСЬ набор проверок запроса на слияние,
#       включая тот свод. В обязательных контекстах его НЕТ.
#
# Пока его там нет, окно из #614 остаётся открытым: джоба исполняется и выносит
# вердикт, но слияние им не гейтится. Внесение контекста в защиту ствола — решение
# владельца, оно делается в настройке репозитория, а не здесь.
#
# ПОЧЕМУ НЕ strict=true И НЕ ОЧЕРЕДЬ СЛИЯНИЙ
#
# `strict=true` закрыл бы окно побочно, но платится переочередью на каждом
# вливании: ранеров и так не хватает. Очередь слияний — современный ответ на тот
# же вопрос, но она делает ДОПОЛНИТЕЛЬНЫЙ прогон на слитой базе, то есть удваивает
# расход там, где он и есть ограничение. Сторож стоит одного дешёвого ранера,
# который почти всё время спит.
name: сводный вердикт

on:
  # ТОЛЬКО запрос на слияние — иного предмета у этой джобы нет.
  #
  # Здесь до 2026-08-23 стоял ещё и `push: branches: ['**']`, заведённый против
  # красноты на каждом push. Его предмет СНЯТ вместе с причиной той красноты, и
  # это измерено, а не предположено: краснел не прогон, а РАЗБОР объявления —
  # ключ задания был записан кириллицей, поэтому провайдер не читал файл целиком
  # (#1073). Отсюда три следствия, каждое проверено:
  #
  #   1. Прогоны на push создавались и ДО того, как push был объявлен: 92 штуки
  #      за те двое суток, когда `on:` содержал один `pull_request`. То есть
  #      объявление push ничего не включало — неразбираемый файл провайдер
  #      проверяет на каждом push сам. Снятие триггера этой тревоги НЕ ЛИШАЕТ:
  #      именно она и обнаружила дефект.
  #   2. Пропуск условием даёт прогону исход `skipped`, а НЕ `success` — прежний
  #      комментарий здесь утверждал обратное. Проверено на первом же разобранном
  #      коммите этой ветки.
  #   3. С разобранным файлом объявленный push создавал бы пустой прогон на
  #      каждый push каждой ветки — при темпе этого репозитория порядка сотни
  #      записей в сутки, не делающих ничего.
  #
  # Класс — «послабление, у которого не осталось предмета»; держит его гейт
  # `internal/repohygiene` `TestWorkflowJobAndStepIdentifiersAreMachineReadable`,
  # а не память о том, почему тут когда-то стоял push.
  pull_request:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: verdict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-checks-green:
    name: сводный вердикт (все проверки завершились и зелены)
    # Предмет джобы — набор проверок ЗАПРОСА НА СЛИЯНИЕ: у иного события такого
    # набора нет by construction, `github.event.pull_request.head.sha` пуст, и
    # опрос ушёл бы по адресу `repos/<repo>/commits//check-runs`.
    #
    # Названо прямо, чтобы условие не читалось как действующая развилка: после
    # сужения триггеров выше оно ВСЕГДА ИСТИННО и ни одного прогона не отсекает.
    # Стоит оно как явное предусловие — чтобы добавленный когда-нибудь триггер
    # не запустил эту джобу молча на событии без запроса слияния.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: ждать остальные проверки и вынести вердикт
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          SELF: сводный вердикт (все проверки завершились и зелены)
        run: |
          set -uo pipefail

          # Опрос, а не подписка: события «все проверки завершились» у API нет.
          # Интервал крупный — предмет ожидания меняется минутами, а не секундами.
          for i in $(seq 1 170); do
            if ! gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" > runs.json 2> api.err; then
              echo "::warning::опрос не удался (заход $i): $(tail -1 api.err)"
              sleep 20; continue
            fi

            python3 .github/scripts/pr-verdict.py --self-name "$SELF" < runs.json
            rc=$?
            case "$rc" in
              0) exit 0 ;;                       # зелено
              1) exit 1 ;;                       # красно — решает сразу
              3) sleep 20 ;;                     # не готово — ждём
              *) echo "::error::вердикт не вынесен (код $rc) — это НЕ «зелено»"; exit 1 ;;
            esac
          done

          echo "::error::проверки не завершились за отведённое время — вердикта НЕТ, и это не «зелено»"
          exit 1
