# continuous-fuzz — ночной фаззинг по расписанию.
#
# Был в ПЯТИ репо polyrepo (iam/vpc/compute/nlb/api-gateway) и при переезде не поехал:
# GitHub читает workflow только из корня. Здесь одна матрица на все таргеты монорепы.
#
# Матрица перечисляет ТОЛЬКО реально существующие Fuzz-функции. В polyrepo у kacho-nlb
# в списке стоял `FuzzInstanceSpecValidate`, которого в nlb нет (он в compute) — job
# гонял пустоту и зеленел. Сверка матрицы с деревом в ОБЕ стороны живёт в
# `internal/repohygiene/fuzzsubject_test.go` и идёт обычным `go test ./...`, то есть
# детерминированно на каждом PR — а не в этом файле, чьи триггеры только расписание
# (см. подробнее у бывшей джобы `matrix-complete` ниже).
#
# Сверка имён — НЕ проверка того, что цели есть что проверять: имя может стоять и в
# матрице, и в коде, а тело цели — звать заглушку, объявленную рядом в том же файле.
# Это держит отдельный гейт `internal/repohygiene/fuzzsubject_test.go` (он же требует
# `pipefail` в шаге ниже), и гоняется он обычным `go test ./...`.
name: continuous-fuzz

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Длительность на таргет (напр. 1h)'
        required: false
        default: '1h'

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzPermissionCatalogLookup, pkg: ./services/iam/internal/fuzz }
          - { target: FuzzCIDRParse,               pkg: ./services/vpc/internal/fuzz }
          - { target: FuzzInstanceSpecValidate,    pkg: ./services/compute/internal/fuzz }
          # Верификатор токена живёт в gateway — цель стоит рядом с предметом.
          # Раньше она лежала в дереве iam и звала заглушку, которая на посевы
          # `alg=none` и `alg=HS256` отвечала «годен» вопреки собственной пометке.
          - { target: FuzzJWTVerify,               pkg: ./gateway/internal/fuzz }
          - { target: FuzzDPoPProof,               pkg: ./gateway/internal/fuzz }
          - { target: FuzzAuthzMiddleware,         pkg: ./gateway/internal/fuzz }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Корпус переживает прогоны: фаззер накапливает интересные входы, и без
      # восстановления каждая ночь начинала бы с нуля.
      - name: restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: run fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '1h' }}
        run: |
          # pipefail обязателен: без него статус шага берётся от `tee`, а не от
          # прогона, и шаг зеленеет при ЛЮБОЙ находке фаззера — краш оседает в
          # артефакте, за которым никто не приходит, потому что приходить зовёт
          # красный. Замерено инъекцией заведомо падающей цели: без pipefail шаг
          # выходит с 0, с pipefail — с 1. Залочено
          # TestFuzzWorkflowDoesNotSwallowExitCode.
          set -o pipefail
          go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime="${FUZZTIME}" \
            ${{ matrix.pkg }} 2>&1 | tee fuzz-output.log

      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: |
            ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}/
            fuzz-output.log

  # Сверка матрицы с деревом ЖИВЁТ НЕ ЗДЕСЬ, и это осознанно.
  #
  # Она была здесь — джобой `matrix-complete`. Но у этого workflow триггеры только
  # `schedule` и `workflow_dispatch`, а расписание у провайдера исполняется
  # НЕНАДЁЖНО: прогоны пропускаются под нагрузкой, а на ветке, отличной от
  # основной, крон вообще не заводится. То есть единственный контроль направления
  # «Fuzz-функция в коде есть, в матрице её нет» не исполнялся предсказуемо ни
  # разу — при том что именно он ловит цель, которую не фаззит никто и никогда.
  #
  # Теперь сверка идёт обычным `go test ./...` (job `build-test` в ci.yaml, то
  # есть на КАЖДОМ PR и КАЖДОМ пуше в интеграционную ветку):
  #   internal/repohygiene/fuzzsubject_test.go
  #     · TestScheduledMatrixCoversEveryFuzzTarget — расхождение в обе стороны;
  #     · TestMatrixDivergenceIsSymmetric — инъекции, доказывающие оба направления.
  # Разбор там строже прежнего grep'а: требуется ПОДПИСЬ `func Fuzz…(f *testing.F)`,
  # а не совпадение текста `func Fuzz`. Дублировать правило двумя реализациями
  # незачем — они разъезжаются.
