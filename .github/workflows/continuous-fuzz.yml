# continuous-fuzz — ночной фаззинг по расписанию.
#
# Был в ПЯТИ репо polyrepo (iam/vpc/compute/nlb/api-gateway) и при переезде не поехал:
# GitHub читает workflow только из корня. Здесь одна матрица на все таргеты монорепы.
#
# Матрица перечисляет ТОЛЬКО реально существующие Fuzz-функции. В polyrepo у kacho-nlb
# в списке стоял `FuzzInstanceSpecValidate`, которого в nlb нет (он в compute) — job
# гонял пустоту и зеленел. Сверка матрицы с деревом в ОБЕ стороны живёт в
# `internal/repohygiene/fuzzsubject_test.go` и идёт обычным `go test ./...`, то есть
# детерминированно на каждом PR — а не в этом файле, чьи триггеры только расписание
# (см. подробнее у бывшей джобы `matrix-complete` ниже).
#
# Сверка имён — НЕ проверка того, что цели есть что проверять: имя может стоять и в
# матрице, и в коде, а тело цели — звать заглушку, объявленную рядом в том же файле.
# Это держит отдельный гейт `internal/repohygiene/fuzzsubject_test.go` (он же требует
# `pipefail` в шаге ниже), и гоняется он обычным `go test ./...`.
name: continuous-fuzz

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Длительность на таргет (напр. 1h)'
        required: false
        default: '1h'

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ПОЛЕЙ ТРИ, И ЭТО НЕ ИЗБЫТОК.
          #
          #   mod — каталог МОДУЛЯ (`go test -C`). Модуль в дереве больше не один:
          #         служба iam несёт свой `go.mod`, потому что выносится отдельным
          #         репозиторием, и её пакеты корневым `./…` не резолвятся вовсе;
          #   pkg — путь пакета ВНУТРИ своего модуля (аргумент `go test`);
          #   dir — путь от корня дерева. Им адресуются корпус и артефакты: они
          #         лежат в рабочей копии, а не в модуле, и склейка `mod`+`pkg`
          #         давала бы `././…` — форму, на которой действия кэша и выгрузки
          #         молчаливо промахиваются мимо каталога.
          #
          # Свести три поля в два нельзя ни одним способом, который не вычислял бы
          # путь в шаге, — а вычисленный путь в объявлении не виден глазом.
          - { target: FuzzPermissionCatalogLookup, mod: services/iam, pkg: ./internal/fuzz, dir: services/iam/internal/fuzz }
          - { target: FuzzCIDRParse, mod: ., pkg: ./services/vpc/internal/fuzz, dir: services/vpc/internal/fuzz }
          - { target: FuzzInstanceSpecValidate, mod: ., pkg: ./services/compute/internal/fuzz, dir: services/compute/internal/fuzz }
          - { target: FuzzJWTVerify, mod: ., pkg: ./gateway/internal/fuzz, dir: gateway/internal/fuzz }
          - { target: FuzzDPoPProof, mod: ., pkg: ./gateway/internal/fuzz, dir: gateway/internal/fuzz }
          - { target: FuzzAuthzMiddleware, mod: ., pkg: ./gateway/internal/fuzz, dir: gateway/internal/fuzz }
          - { target: FuzzKeyIDNeverReachesTheKeySetSource, mod: ., pkg: ./services/registry/internal/clients/jwks, dir: services/registry/internal/clients/jwks }
          # Верификатор токена живёт в gateway — цель стоит рядом с предметом.
          # Раньше она лежала в дереве iam и звала заглушку, которая на посевы
          # `alg=none` и `alg=HS256` отвечала «годен» вопреки собственной пометке.
          #
          # Идентификатор ключа приходит из заголовка предъявленного токена и
          # читается ДО проверки подписи — цель гоняет прод-путь плоскости данных
          # реестра целиком, а не отдельную проверку формы.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      # Корпус переживает прогоны: фаззер накапливает интересные входы, и без
      # восстановления каждая ночь начинала бы с нуля.
      #
      # ФОРМА РАЗДЕЛЁННАЯ, и здесь это принципиальнее, чем где-либо. У
      # комбинированного `actions/cache` сохранение объявлено `post-if: success()`
      # — то есть корпус уезжал в кэш только той ночью, которая НИЧЕГО НЕ НАШЛА.
      # Ночь, нашедшая падение, роняет шаг, и входы, ради которых фаззер и
      # работает, из корпуса терялись: в артефакт они попадали, в корпус — нет,
      # и следующая ночь начинала подбираться к тому же месту заново. Смысл меры
      # был перевёрнут ровно на том исходе, ради которого она заведена.
      # Класс держит гейт `internal/repohygiene` `TestCacheFillsOnTheRunThatPaidForIt`.
      - name: restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ matrix.dir }}/testdata/fuzz/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: run fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '1h' }}
        run: |
          # pipefail обязателен: без него статус шага берётся от `tee`, а не от
          # прогона, и шаг зеленеет при ЛЮБОЙ находке фаззера — краш оседает в
          # артефакте, за которым никто не приходит, потому что приходить зовёт
          # красный. Замерено инъекцией заведомо падающей цели: без pipefail шаг
          # выходит с 0, с pipefail — с 1. Залочено
          # TestFuzzWorkflowDoesNotSwallowExitCode.
          set -o pipefail
          go test -C '${{ matrix.mod }}' -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime="${FUZZTIME}" \
            ${{ matrix.pkg }} 2>&1 | tee fuzz-output.log

      # Сохранение НА КРАСНОМ — не оговорка, а предмет: `always()` обязателен,
      # потому что условие без функции состояния вычисляется с подразумеваемым
      # `success()` и отменялось бы находкой фаззера. Ключ несёт номер прогона,
      # поэтому каждая ночь пишет свою запись, а восстановление берёт свежайшую
      # по префиксу.
      - name: save fuzz corpus
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ matrix.dir }}/testdata/fuzz/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: |
            ${{ matrix.dir }}/testdata/fuzz/${{ matrix.target }}/
            fuzz-output.log

  # Сверка матрицы с деревом ЖИВЁТ НЕ ЗДЕСЬ, и это осознанно.
  #
  # Она была здесь — джобой `matrix-complete`. Но у этого workflow триггеры только
  # `schedule` и `workflow_dispatch`, а расписание у провайдера исполняется
  # НЕНАДЁЖНО: прогоны пропускаются под нагрузкой, а на ветке, отличной от
  # основной, крон вообще не заводится. То есть единственный контроль направления
  # «Fuzz-функция в коде есть, в матрице её нет» не исполнялся предсказуемо ни
  # разу — при том что именно он ловит цель, которую не фаззит никто и никогда.
  #
  # Теперь сверка идёт обычным `go test ./...` (job `build-test` в ci.yaml, то
  # есть на КАЖДОМ PR и КАЖДОМ пуше в интеграционную ветку):
  #   internal/repohygiene/fuzzsubject_test.go
  #     · TestScheduledMatrixCoversEveryFuzzTarget — расхождение в обе стороны;
  #     · TestMatrixDivergenceIsSymmetric — инъекции, доказывающие оба направления.
  # Разбор там строже прежнего grep'а: требуется ПОДПИСЬ `func Fuzz…(f *testing.F)`,
  # а не совпадение текста `func Fuzz`. Дублировать правило двумя реализациями
  # незачем — они разъезжаются.
