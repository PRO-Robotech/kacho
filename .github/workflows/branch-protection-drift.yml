#
# ДРЕЙФ МЕЖДУ ЗАЩИТОЙ СТВОЛА И ИМЕНАМИ ДЖОБ.
#
# Имя джобы после подстановки матрицы — это и есть строка обязательного контекста,
# то есть контракт с защитой ветки. Переименовал джобу — объявленный контекст
# перестаёт производиться, и сервер ждёт его вечно: запирается КАЖДЫЙ pull request
# в ствол, включая тот, что несёт само переименование (kacho#582).
#
# ПОЧЕМУ ОТДЕЛЬНЫМ РАСПИСАНИЕМ, А НЕ ШАГОМ В ci.yaml. Две причины, обе жёсткие:
#
#   * НОВАЯ ДЖОБА В ci.yaml — ЭТО НОВЫЙ КОНТЕКСТ. Гейт, заведённый обязательной
#     джобой, потребовал бы правки защиты ветки, чтобы стать обязательным, —
#     то есть ровно того ручного действия вне дерева, которое он и стережёт;
#   * ЧТЕНИЕ ЗАЩИТЫ ВЕТКИ ТРЕБУЕТ ПРАВ АДМИНИСТРАТОРА. Штатному токену конвейера
#     их не выдают: `administration` нет среди областей, которые `permissions:`
#     умеет запрашивать для `GITHUB_TOKEN`. Значит на pull request'е гейт всё
#     равно не смог бы измерить — и его молчание читалось бы как порядок.
#
# ОН ЖЕ — ДЕРЖАТЕЛЬ ОБЪЯВЛЕНИЯ `.github/required-contexts.txt` (kacho#2306).
# Производитель версии читает перечень обязательных контекстов из ДЕРЕВА, а не
# из ручки защиты: встроенному токену её не выдают, и запросить право нельзя —
# площадка отвергает `administration` вместе со всем объявлением процесса
# (`HTTP 422 … Unexpected value 'administration'`, проверено запуском). Гейт
# сверяет объявление ПО ДВУМ ОСЯМ, и вторая работает без прав администратора:
# с ЗАЩИТОЙ ветки (нужны права) и с ПРОИЗВЕДЁННЫМ прогоном ствола (довольно
# `checks: read`). Объявление без держателя было бы тем же обещанием, которое
# корпус ловит в продукте.
#
# ТРИ ИСХОДА, И НИ ОДИН НЕ ГЛОТАЕТСЯ:
#   0 — сошлось по ВСЕМ осям;
#   1 — дрейф: запирание, тихая дыра, истёкшее исключение либо расхождение
#       объявления с защитой. Объявляется ПЕРВЫМ: находка сильнее несделанного
#       измерения, иначе отсутствие прав маскировало бы дрейф, видимый и без них;
#   2 — ИЗМЕРЕНИЕ НЕ СДЕЛАНО хотя бы по одной оси (нет прав на чтение защиты).
#       Это ТОЖЕ красное. Мягкий проход здесь был бы тем самым «контролем, не
#       отказавшим ни разу за всю жизнь, потому что он никуда не дозванивался»
#       (security.md §8).
#
# ЧТОБЫ ИСХОД 2 СТАЛ ИСХОДОМ 0, нужен секрет `BRANCH_PROTECTION_TOKEN` — токен с
# правом читать защиту ветки. Его нет: секретов в репозитории ноль, и три
# прогона по расписанию подряд (24.08, 31.08, 07.09) красны кодом 2 с одним и тем
# же 403. Пока его нет, ось «объявление ↔ защита» не меряется — но ось
# «объявление ↔ произведённое» меряется КАЖДЫМ прогоном, штатным токеном, и
# именно она закрывает опасное направление дрейфа. Прогон никого не блокирует:
# расписание не держит ни одного pull request'а.
name: branch-protection-drift

on:
  schedule:
    - cron: '17 6 * * 1'   # понедельник, до начала недели
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  administration: read

jobs:
  drift:
    name: защита ствола сходится с именами джоб
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Самопроверка ПЕРВОЙ и без сети: она доказывает, что гейт умеет краснеть
      # на переименовании и молчать на согласованной правке. Её вердикт не зависит
      # от прав токена, поэтому отделяет «гейт сломан» от «нет доступа».
      - name: самопроверка гейта (инъекция в обе стороны, без сети)
        run: python3 .github/scripts/assert-required-contexts-match-jobs.py --self-test

      - name: сверка набора с произведёнными контекстами
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || github.token }}
        run: python3 .github/scripts/assert-required-contexts-match-jobs.py
