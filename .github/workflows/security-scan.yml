# security-scan — gosec (Go static analysis) + trivy (fs + IaC).
#
# Был в СЕМИ репо polyrepo (iam/vpc/compute/geo/nlb/registry/api-gateway) и при переезде
# в монорепу не поехал: GitHub читает workflow только из корня, а приехавшие с сервисами
# `.github/` были мертвы и удалены. Итого монорепа осталась вообще без gosec и trivy.
# Здесь ОДИН прогон на весь модуль вместо семи — единый go.mod покрывает граф целиком.
#
# Порог: ноль HIGH / ноль CRITICAL → мерж блокируется. SARIF → вкладка Security.
name: security-scan

on:
  # Pre-merge гейт для PR в main (не на push в main после мерджа: PR-дерево уже
  # провалидировано).
  pull_request:
    branches: [main]

  # …и на push В САМ main. Условия «только PR в main» НЕ ХВАТАЕТ, и это выведено из
  # реального провала: прежде здесь стояла долгоживущая интеграционная ветка, которая
  # в main не мержилась месяцами, поэтому гейт на ней не отработал НИ РАЗУ — вся работа
  # шла в слепой зоне. Ветка снята 2026-08-07: ствол опубликован прямо в main
  # (1306 коммитов), и разработка ведётся там же. Правило, ради которого строка живёт,
  # от смены имени не изменилось: гейт обязан смотреть туда, где ИДЁТ работа, а не
  # только на вход в main. Пушим мы сегодня напрямую, поэтому push-триггер несущий,
  # а не избыточный.
  #
  # Очередь это не растит, и вот почему — проверять надо оба пункта, а не один:
  #   * оба job'а тут `runs-on: ubuntu-latest`, то есть GitHub-hosted. За ЕДИНСТВЕННЫЙ
  #     self-hosted-ранер соперничают e2e-newman / docker-build / production-posture,
  #     а этот workflow к нему не обращается вовсе;
  #   * `concurrency` ниже уже с `cancel-in-progress`, поэтому серия пушей подряд
  #     держит один живой прогон на ветку, а не N.
  #
  # Фильтра по путям СОЗНАТЕЛЬНО нет: оба сканера читают дерево целиком (gosec —
  # весь Go-граф, trivy — все локи и манифесты), и любой список путей стал бы
  # слепой зоной ровно того же рода, что и отсутствующий триггер.
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF в Security-tab
  pull-requests: write

env:
  # Отслеживаемые исключения IaC-гейта (каждое — с путём, причиной и тикетом; см. файл).
  # Привязаны к ПУТЯМ, не к правилам целиком: Go-сервисы остаются под гейтом — проверено
  # негативом (убрать securityContext у compute → KSV014 ловится).
  TRIVY_IGNOREFILE: .trivyignore.yaml

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

# СТАТУС КОНВЕЙЕРА НЕ ТЕРЯЕТСЯ. Умолчание GitHub для `run:` — `bash -e {0}`, то
# есть БЕЗ pipefail: `<проверка> | tee`, `<сборка> | grep` отдают шагу код
# возврата ПРАВОЙ команды и зеленеют при любом провале левой. `shell: bash` —
# документированный синоним `bash --noprofile --norc -eo pipefail {0}`;
# относительно умолчания это добавляет ровно pipefail.
# Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги,
# которых тут ещё нет. Гейт класса — internal/repohygiene/pipefailguard_test.go.
defaults:
  run:
    shell: bash

jobs:
  gosec:
    name: gosec (Go static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ЗАПИНЕНО. С `@latest` вердикт гейта менялся без единой правки кода: новый
      # релиз добавляет правило — и main краснеет на коммите, который ничего не
      # трогал; а воспроизвести локально то, что увидел CI, нельзя вообще, потому
      # что «latest» у них и у тебя в разные дни разный. Свежесть пина стережёт
      # pinned-tools-freshness (см. .github/scripts/check-pinned-tools.sh) — она
      # заведёт issue, когда апстрим уйдёт вперёд.
      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: run gosec
        run: |
          set +e
          # pkg/api исключён: это сгенерённые protobuf-стабы. gosec G101 ложно
          # срабатывает на FullMethodName-константах с подстрокой "Token"/"LogoutToken"
          # (OIDC/IAM RPC). Рукописный код проверяется полностью; golangci-lint исключает
          # pkg/api по той же причине.
          #
          # ФЛАГА `-tests` ЗДЕСЬ НЕТ — И ЭТО РЕШЕНИЕ, А НЕ НЕДОСМОТР.
          #
          # Без него gosec не читает *_test.go вовсе. Дефолт защитимый: тесты не
          # поставляются, в них не бывает эксплуатируемой в проде поверхности, а
          # харнесс по своей природе делает ровно то, на что правила и срабатывают —
          # ходит по дереву репозитория, поднимает докер, берёт самоподписанный cert.
          #
          # Замерено на пине v2.28.0 (2026-07-28), а не прикинуто: включение даёт
          # **132** находки level=error против нынешней 0. По правилам:
          #   G304 40 · G101 33 · G115 15 · G204 7 · G122 6 · G401 5 · G306 5 ·
          #   G301 5 · G124 5 · G501 4 · G403 2 · G705/G703/G402/G302/G112 по 1
          # Все 132 — в *_test.go: НИ ОДНОЙ находки в непроверяемом сейчас
          # прод-коде включение не открывает (проверено отдельно). То есть
          # выключенный `-tests` сегодня НЕ прячет ни одного прод-дефекта.
          #
          # Поэтому: НЕ включаем. Включить молча нельзя — это мгновенно красный
          # гейт на 132 позиции, и «починка» свелась бы к 132 подавлениям, то есть
          # к воспроизводству ровно того класса, который отсюда убирали.
          #
          # Если включать когда-нибудь — то отдельным job'ом со СВОИМ порогом
          # (non-blocking, только SARIF в Security-tab), а не поднятием этого
          # гейта: смешивать прод-поверхность и харнесс в одном пороге значит
          # обесценить прод-порог. Предметный разбор 132 находок — своя задача.
          # `-stdout -verbose text` НЕ косметика: SARIF не несёт ПЕРЕПИСИ осмотренного,
          # а без переписи «ноль находок» неотличимо от «ноль прочитанного» — замерено
          # на дереве, которое сканер не смог собрать: он написал отчёт, ПОБАЙТОВО
          # такой же, как у чистого дерева (`results: []`, валидный JSON, тот же код
          # возврата), и гейт ниже честно доложил «level=error: 0». То есть отказ
          # анализа выглядел ровно как чистота. Текстовая сводка на stdout отвечает на
          # оба вопроса, на которые SARIF не отвечает: строки `Golang errors in file:`
          # (дерево не загрузилось) и перепись `Files : N` (сколько файлов прочитано).
          # Код возврата gosec НЕ является вердиктом ЭТОГО шага (вердикт — ниже,
          # по SARIF и переписи; см. `exit 0` в конце блока). Он снимается ЯВНО и
          # печатается: с `pipefail` (объявлен файлом) находки иначе оборвали бы
          # шаг на этой строке, до дедупликации тегов и до выгрузки в Security-tab.
          # «Ноль» и «не выполнилось» обязаны различаться и здесь.
          gosec_rc=0
          "$(go env GOPATH)/bin/gosec" -exclude-dir=pkg/api -stdout -verbose text \
            -fmt sarif -out gosec.sarif ./... | tee gosec-summary.txt || gosec_rc=$?
          echo "gosec завершился с кодом $gosec_rc (находки роняют не этот шаг, а гейт ниже)"

          # gosec пишет ДУБЛИ в rule properties.tags, а codeql-валидатор SARIF их
          # отвергает ("contains duplicate item") → upload-sarif падает. Дедупим теги.
          #
          # НЕВАЛИДНЫЙ ОТЧЁТ — ЭТО ОТКАЗ СКАНИРОВАНИЯ, А НЕ «НОЛЬ НАХОДОК».
          #
          # Прежде здесь на месте невалидного отчёта писался ПУСТОЙ схема-валидный
          # документ, и шаг выходил нулём. Дальше гейт ниже честно считал в этом
          # документе находки, получал 0 и печатал «gosec level=error: 0». То есть
          # обрезанный отчёт превращался в зелёный вердикт всего анализа. Ровно то,
          # что запрещено: «не выполнилось» не идёт в зачёт «прошло».
          #
          # Подстановка пустого документа была нужна не гейту, а ВЫГРУЗКЕ (upload-sarif
          # с `if: always()` давится «Unexpected end of JSON» на обрезанном файле).
          # Поэтому пустой документ по-прежнему пишется — но рядом остаётся МЕТКА
          # отказа, и гейт ниже читает её раньше, чем число находок.
          rm -f gosec-scan-failed
          if jq -e . gosec.sarif >/dev/null 2>&1; then
            jq '(.runs[].tool.driver.rules[]?.properties.tags) |= (if . then unique else . end)' \
              gosec.sarif > gosec.sanitized.sarif && mv gosec.sanitized.sarif gosec.sarif
          else
            echo "SARIF, который написал gosec, не разбирается — сканирование не состоялось" \
              > gosec-scan-failed
            printf '%s' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"gosec","rules":[]}},"results":[]}]}' > gosec.sarif
          fi
          # exit 0 всегда: НАХОДКИ не роняют ЭТОТ шаг (они должны попасть в Security-tab
          # через upload ниже). Отказ сканера роняет гейт ниже — по метке, не по числу.
          exit 0

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

      # Гейтим по SARIF `level == "error"`. ЭТО НЕ ТО ЖЕ, что `severity == HIGH` в
      # JSON-выводе gosec: G304 в tlsutil приходил как MEDIUM в JSON, но level=error в
      # SARIF — то есть локальная проверка «severity HIGH» показывала 0, пока CI честно
      # краснел. Унаследованный из polyrepo комментарий утверждал «severity error
      # (HIGH)» и уводил в сторону. Сверяться с CI надо ИМЕННО по SARIF:
      #   gosec -fmt sarif -out g.sarif ./... && jq '[.runs[].results[]|select(.level=="error")]|length' g.sarif
      #
      # ВЕРДИКТ ПО СОДЕРЖИМОМУ, И «НЕ ВЫПОЛНИЛОСЬ» — ОТДЕЛЬНЫЙ ИСХОД. Две ветки
      # раньше отдавали зелёное на том, что анализа не было вовсе: отсутствующий
      # файл отчёта (`exit 0`) и отчёт, подменённый пустым после отказа сканера.
      # Обе выглядели как аккуратная обработка краевого случая и обе означали
      # «ничего не проверено — считаем, что чисто».
      #
      # Теперь три исхода различены: отказ сканера, отсутствие отчёта, находки.
      # Ноль находок засчитывается ТОЛЬКО когда отчёт есть, он разобран и в нём
      # реально перечислены осмотренные правила.
      - name: fail on level=error
        run: |
          if [[ -f gosec-scan-failed ]]; then
            echo "::error::gosec не завершил анализ: $(cat gosec-scan-failed). Ноль находок здесь"
            echo "::error::означает «не сканировали», а не «чисто» — вердикт не выносится."
            exit 1
          fi
          if [[ ! -f gosec.sarif ]]; then
            echo "::error::отчёта gosec.sarif нет — шаг сканирования не оставил результата."
            echo "::error::Это провал гейта: судить не о чем."
            exit 1
          fi
          if ! jq -e . gosec.sarif >/dev/null 2>&1; then
            echo "::error::gosec.sarif не разбирается — судить не о чем."
            exit 1
          fi

          # ── ПЕРЕПИСЬ ОСМОТРЕННОГО ─────────────────────────────────────────────
          # Отчёт SARIF на дереве, которое сканер НЕ СМОГ СОБРАТЬ, побайтово такой
          # же, как на чистом: пустой список результатов, валидный JSON, тот же код
          # возврата. Поэтому «ноль находок» из одного SARIF читать нельзя — сначала
          # надо убедиться, что дерево вообще было прочитано.
          if [[ ! -f gosec-summary.txt ]]; then
            echo "::error::нет сводки gosec — перепись осмотренного не снята, а без неё"
            echo "::error::ноль находок ничего не означает."
            exit 1
          fi
          if grep -q 'Golang errors in file' gosec-summary.txt; then
            echo "::error::gosec не смог загрузить часть дерева — это отказ анализа, а не"
            echo "::error::чистота. Пустой отчёт здесь означает «не сканировали»:"
            # Печать диагностики, а не вердикт: вердикт — `exit 1` строкой ниже.
            # `head` закрывает вход после двадцатой строки, отчего `grep` получает
            # SIGPIPE, и с `pipefail` конвейер отдал бы 141 ровно на длинной
            # сводке — то есть отказ читался бы тем сильнее, чем больше улик.
            # И выборка, и обрезка делаются ОДНОЙ командой — конвейера здесь нет.
            awk '/Golang errors in file/{c=3} c-->0 && n++<20' gosec-summary.txt
            exit 1
          fi
          files=$(sed -nE 's/^[[:space:]]*Files[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' gosec-summary.txt | tail -1)
          lines=$(sed -nE 's/^[[:space:]]*Lines[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' gosec-summary.txt | tail -1)
          echo "осмотрено: файлов=${files:-нет} строк=${lines:-нет}"
          if [[ -z "$files" ]]; then
            echo "::error::в сводке gosec не разобрана перепись файлов — формат сводки"
            echo "::error::изменился, и предпосылка этой проверки больше не выполняется."
            exit 1
          fi
          if (( files == 0 )); then
            echo "::error::gosec прочитал 0 файлов. Это провал: пустой отчёт не является"
            echo "::error::чистым деревом."
            exit 1
          fi

          err=$(jq '[.runs[].results[] | select(.level == "error")] | length' gosec.sarif)
          echo "gosec level=error: $err"
          if (( err > 0 )); then
            # С ПУТЁМ И СТРОКОЙ: без них лог даёт лишь «- G304: Potential file inclusion
            # via variable» на 1019 файлов — находку приходится искать вручную.
            jq -r '.runs[].results[] | select(.level=="error")
                   | "- \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) — \(.message.text)"' gosec.sarif
            echo "::error::gosec нашёл $err проблем level=error. См. вкладку Security."
            exit 1
          fi

  trivy:
    name: trivy (fs + IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Каждый скан идёт ДВАЖДЫ: sarif (exit-code 0, только в Security-tab) и table
      # (exit-code 1 — реальный гейт). Причина: с `format: sarif` trivy-action
      # срабатывает на ЛЮБОЕ правило в SARIF независимо от фильтра `severity`
      # (известное поведение action'а) → sarif-проход гейтить нельзя.
      #
      # ПОРЯДОК ШАГОВ НЕСУЩИЙ: сначала ОБА sarif-прохода и обе выгрузки, и только
      # потом оба гейта. Раньше шаги чередовались (fs-sarif, fs-upload, fs-гейт,
      # config-sarif, config-upload, config-гейт) и это давало два отдельных сбоя:
      #   1) красный fs-гейт останавливал job → шаг, который ПИШЕТ
      #      trivy-config.sarif, пропускался, а выгрузка ниже с `if: always()`
      #      всё равно запускалась и падала «Path does not exist:
      #      trivy-config.sarif». В логе это выглядит как отказ выгрузки SARIF —
      #      то есть как проблема прав токена, — хотя причина в порядке шагов;
      #   2) красный fs-гейт скрывал вердикт IaC-гейта: чинишь fs, гоняешь
      #      заново и только тогда узнаёшь, что красный ещё и config.
      # Теперь один прогон отвечает на оба вопроса, а выгрузка не может сослаться
      # на файл, который никто не создавал.
      - name: trivy fs (SARIF → Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      # `trivy-config: trivy.yaml` — НЕ косметика и не «на всякий случай». Два чарта
      # продукта намеренно ОТКАЗЫВАЮТ в рендере без секрета оператора, а сканер на
      # отказе рендера пропускает чарт целиком, молча и с кодом 0. Заглушки ТОЛЬКО
      # ДЛЯ СКАНА в этом файле вводят их в осмотр; без него не осматриваются 20
      # манифестов этих чартов (из них цели скана дают 10: 86 → 96 — единицы у
      # этих двух чисел разные, оба предиката названы в `trivy.yaml`), включая
      # StatefulSet хранилища слоёв, и отчёт выглядит так же, как если бы они были
      # чисты. Кроме того, `trivy-config` не отменяет остальные входы шага:
      # приоритет — входы, затем переменные окружения, затем файл настроек
      # (README trivy-action v0.36.0), поэтому `severity`/`format`/`exit-code`
      # продолжают действовать. trivy подхватил бы файл из рабочего каталога и
      # сам, но здесь от него зависит ОБЪЁМ ОСМОТРЕННОГО — поэтому назван явно.
      # Полноту осмотра держит отдельный гейт (последний шаг job'а).
      - name: trivy config (SARIF → Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          trivy-config: 'trivy.yaml'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: trivy fs (гейт CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # `!cancelled()` (а не `always()`) — чтобы красный fs-гейт не прятал вердикт
      # IaC, но отменённый прогон не запускал скан впустую: выше стоит
      # cancel-in-progress, отмена здесь штатна. Оба гейта роняют job независимо;
      # job зелёный только когда зелены оба.
      - name: trivy config (гейт CRITICAL/HIGH)
        if: '!cancelled()'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          trivy-config: 'trivy.yaml'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Сколько дерева этот гейт вообще прочитал. Отказ рендера чарта сканер
      # проглатывает молча: «ноль находок» и «ноль прочитанного» на выходе выглядят
      # одинаково, а разница между ними — вся ценность гейта выше. Замер 2026-08-09,
      # перемерен 2026-08-10: два чарта с намеренным отказом рендера не давали ни
      # одной цели, а рендерятся они целиком — 20 манифестов; введённые в осмотр,
      # они дали 10 новых целей (86 → 96) и на первом же прогоне настоящую находку.
      # Идёт под `!cancelled()` по той же причине, что и соседи: вердикты независимы.
      - name: IaC-скан покрывает каждый чарт
        if: '!cancelled()'
        run: python3 deploy/scripts/assert-iac-scan-covers-every-chart.py

      # Перечень исключений сам по себе ничего не держит: он переживает свои находки.
      # Файл выше это прямо предупреждает («сайт вычистили — строка лишняя»), но
      # предупреждение без исполнителя — форма без содержания, и один такой случай в
      # дереве уже был. Здесь исполнитель: запись, которой больше нечего исключать,
      # становится находкой. Гейт отличает «путь осмотрен и чист» от «путь вне целей
      # сканера» — второе не судится, потому что там отсутствие находки говорит об
      # отсутствии ОСМОТРА, а не об отсутствии дефекта.
      #
      # Идёт ПОСЛЕ обоих гейтов и под `!cancelled()`: его вердикт независим, и красный
      # скан не должен прятать устаревшее исключение — как и наоборот.
      # Гейт прогоняет скан САМ и БЕЗ ignorefile — иначе он видел бы уже отфильтрованный
      # результат и не смог бы отличить «находки нет, потому что путь чист» от «находки
      # нет, потому что её скрыли». Но С ТЕМ ЖЕ `trivy.yaml`, что и гейт скана выше:
      # множество осмотренных целей у них обязано совпадать, иначе «путь вне осмотра»
      # у одного означало бы «путь чист» у другого, и оба были бы уверены в своей
      # правоте. Отдельная установка `trivy` для этого НЕ нужна:
      # `trivy-action` выше уже кладёт бинарь в PATH раннера (`.local/bin/trivy-bin`) и
      # оставляет его там для последующих шагов. Свой шаг установки здесь стоял ровно
      # один прогон и был снят как избыточный: он ставил второй экземпляр той же
      # программы и при этом сам же ронял job.
      - name: исключения IaC-скана ещё имеют предмет
        if: '!cancelled()'
        run: python3 deploy/scripts/assert-iac-exclusions-still-have-a-subject.py
