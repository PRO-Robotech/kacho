#
# Текст запроса на слияние — заголовок и тело — без атрибуции (kacho#2807).
#
# ПРЕДМЕТ. Правило `gi-no-attribution-trailers` держателя не имело: шагов,
# судящих текст запроса, в дереве было ноль. Коммит слияния площадка собирает
# из этого текста (`merge_commit_title: PR_TITLE`, `merge_commit_message:
# PR_BODY`), поэтому трейлер в теле становится трейлером коммита слияния. На
# 200 последних запросах (#2213…#2854, 2026-09-24) гейт краснеет на 10 — все
# несут строку «Generated with Claude Code» и ссылку на сессию; единственное
# упоминание формы в прозе (#2438, в обратных кавычках) он пропускает. Формы,
# близнецы и граница — в шапке скрипта.
#
# ОТДЕЛЬНЫЙ ПРОЦЕСС, А НЕ ШАГ `ci.yaml`, — из-за вида события. Текст запроса
# меняется правкой (`edited`), а не отправкой: шаг конвейера судил бы тело,
# каким оно было на последней отправке, и правка после зелёного вердикта
# осталась бы несудимой. Здесь `types` шире умолчания на `edited`, и вердикт
# снимается заново с каждой правкой; весь конвейер ради правки текста не идёт.
#
# Базы — те же, что у `ci.yaml` (довод и перепись веток — в шапке его `on:`),
# и их равенство держит `.github/scripts/assert-review-trigger-scope.py`.
# `push` нет: у отправки текста запроса нет.
#
# ПРОВОДКУ ДЕРЖИТ ВНИМАНИЕ. Что этот файл зовёт скрипт, не проверяет ни один
# гейт. Контекста задания нет ни в защите ствола, ни в
# `.github/required-contexts.txt`, и туда он не вносится как есть: объявление
# читает и производитель версии на ревизии ствола, а на стволе этого задания
# нет. Поэтому красное здесь слияния не запирает. Его видит сводный вердикт
# `required-verdict.yml`, судящий весь набор проверок головы запроса, — но
# только набор на момент своего вердикта: правку текста после него он заново
# не судит.
name: текст запроса

on:
  pull_request:
    branches:
      - main
      - '[0-9]+'
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: review-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attribution:
    name: заголовок и тело запроса без атрибуции
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          sparse-checkout: .github/scripts
      # Самопроверка ПЕРВОЙ: она доказывает, что гейт краснеет на каждой форме
      # атрибуции и молчит на её упоминании, прежде чем он судит этот запрос.
      # Текст запроса скрипт читает из полезной нагрузки события
      # (GITHUB_EVENT_PATH), а не подстановкой в `run:`: тело запроса —
      # чужой ввод, и в оболочку оно не попадает.
      - name: самопроверка гейта (подача входа в обе стороны)
        run: python3 .github/scripts/assert-review-text-carries-no-attribution.py --self-test
      - name: заголовок и тело запроса без атрибуции
        run: python3 .github/scripts/assert-review-text-carries-no-attribution.py
