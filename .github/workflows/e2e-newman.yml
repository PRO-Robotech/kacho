# e2e-newman — чёрный ящик против REST api-gateway на живом стенде.
#
# 85 newman-коллекций восьми суит (vpc 16, iam 31, nlb 9, storage 9, geo 7,
# compute 7, registry 5, api-gateway 1 — перемерено 2026-08-10 предикатом гейта
# покрытия; он же печатает это число на каждом прогоне, поэтому расхождение видно
# без чтения этой шапки). Всё, что ловится только на собранном
# стенде (регистрация RPC в gateway, проброс Internal*, цепочка authz, миграции,
# fga-seed), проверяется здесь и больше нигде.
#
# ─── ЧТО ИЗМЕНИЛОСЬ 2026-08-05: ОДИН СТЕНД → ПЯТЬ (решение владельца) ────────
#
# Прежде ОДИН раннер (4 ядра / 16 ГБ) держал весь стенд — 8 сервисов, 9 Postgres,
# движок прав, Hydra, Kratos, ingress, cert-manager, — и поверх этого восемь суит
# гонялись одновременно, каждая ещё и с внутренней конкуренцией (JOBS=2), то есть
# до шестнадцати коллекций сразу.
#
# ПРИЧИНА ИЗМЕРЕНА, А НЕ ПРЕДПОЛОЖЕНА:
#   * окно материализации прав локально (12 ядер) p50 2.0с / p90 5.0с, петель
#     ≥10с — ноль; в CI (4 ядра) p50 6.0с / p90 11.0с, петель ≥10с — 52;
#   * 5 отказов вида «authorization backend unavailable» / «context deadline
#     exceeded» — исчерпание ёмкости, а не дефект логики;
#   * 288 наблюдений ожидания блокировки, среднее 0.72с, максимум 4.6с — и это
#     ещё на 12 ядрах.
#
# Стенд по запросам ресурсов (helm template values.dev + values.dev-prod, единица
# счёта — workload со своими requests): 29 workload, 8298Mi, 2980m на 4000m
# allocatable раннера. То есть 75% процессора кластера зарезервировано до того,
# как отправлен первый запрос.
#
# ТЕПЕРЬ: пять job'ов, у каждого свой kind-кластер с УНИКАЛЬНЫМ именем и свой
# набор компонентов (deploy/e2e-shards.json), и внутри каждого — строго
# последовательный прогон (JOBS=1, WAVE_JOBS=1).
#
# ЧЕСТНЫЕ ЧИСЛА ПО СТЕНДАМ ШАРДОВ (замер 2026-08-05, тот же способ):
#   полный        29 workload  8298Mi  2980m   (100%)
#   шард vpc      20 workload  5034Mi  1730m   ( 58% CPU)
#   шард edge     21 workload  3434Mi  1680m   ( 56%)
#   шард comp-st  24 workload  6890Mi  2280m   ( 77%)
#   шард nlb      24 workload  7018Mi  2380m   ( 80%)
#   шард iam      26 workload  7594Mi  2630m   ( 88%)
#
# И ЭТО НАДО НАЗВАТЬ ПРЯМО: сужение стенда — НЕ главный выигрыш. Неснимаемое ядро
# (iam, geo, gateway, Hydra, Kratos, cert-manager, ingress и их базы)
# стоит 1330m из 2980m, то есть 45% стенда не зависит от того, что тестируется.
# Шард iam вдобавок вынужден поднимать vpc/nlb/storage/compute, потому что три
# его коллекции (label-revoke-vpc/-nlb/-storage) ходят в чужие домены — он снимает
# только registry с zot, 12% CPU. Постановка «минимальный достаточный стенд»
# выполнена, но её вклад измерен и он скромный.
#
# ГЛАВНЫЙ ВЫИГРЫШ — В КОНКУРЕНТНОСТИ, и он на порядок: было до 16 коллекций
# одновременно на одном стенде, стало ровно 1 на стенд при пяти стендах. Именно
# это бьёт в измеренную причину (окно материализации и исчерпание ёмкости), а не
# экономия двух гигабайт.
#
# ВЕРДИКТ НЕ ТЕРЯЕТСЯ. Каждый шард судит свои суиты тем же гейтом, что и раньше
# (assert-suites-green.sh), и пишет ОПИСЬ (shard-verdict.py). Job `свод` требует,
# чтобы описи пришли от ВСЕХ шардов и чтобы сумма отчитавшихся коллекций равнялась
# числу коллекций в дереве. Шард, который не отчитался, — это «не выполнилось»:
# оно никогда не вычитается и никогда не засчитывается за успех.
#
# ПОКРЫТИЕ. `assert-shard-coverage.py` (job `план`, до подъёма любого стенда)
# доказывает, что каждая суита дерева назначена ровно одному шарду и что сумма
# коллекций по шардам равна числу коллекций в дереве. Без этого шардирование
# стало бы тихим способом не гонять часть кейсов.
name: e2e-newman

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-newman-${{ github.ref }}
  cancel-in-progress: true

# СТАТУС КОНВЕЙЕРА НЕ ТЕРЯЕТСЯ. Умолчание GitHub для `run:` — `bash -e {0}`, то
# есть БЕЗ pipefail: `<проверка> | tee`, `<сборка> | grep` отдают шагу код
# возврата ПРАВОЙ команды и зеленеют при любом провале левой. `shell: bash` —
# документированный синоним `bash --noprofile --norc -eo pipefail {0}`.
# Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги,
# которых тут ещё нет. Гейт класса — internal/repohygiene/pipefailguard_test.go.
defaults:
  run:
    shell: bash

jobs:
  # ─── ПЛАН: матрица выводится из дерева, и покрытие доказывается ДО стендов ──
  #
  # Матрица не выписана в этом файле намеренно. Список шардов и список суит — два
  # места об одном предмете, и рукописная копия разъезжается молча (ровно так уже
  # разъехались три копии списка репозиториев в скриптах воркспейса). Здесь
  # единственный источник — deploy/e2e-shards.json, а этот job его читает.
  #
  # Гейты здесь стоят ПЕРЕД подъёмом стендов: они стоят секунды, а стенд — минуты,
  # и красное покрытие незачем узнавать через сорок минут.
  plan:
    name: план шардов + гейты покрытия
    # ─── ЗДЕСЬ СТОЯЛО СУЖЕНИЕ ОХВАТА ПО АВТОРУ — СНЯТО ВМЕСТЕ С ПРЕДМЕТОМ ────
    #
    # Работы `plan` и `summary` не исполнялись, когда автором события был бот
    # обновления зависимостей, то есть e2e на таких PR отсутствовал как
    # проверка. Довод был назван честно и был ровно один: стенды поднимаются на
    # ЕДИНСТВЕННОЙ своей площадке, и поток обновлений занимал бы её на десятки
    # минут, вытесняя прогон ствола.
    #
    # Предмета у этого довода НЕТ. Замер 2026-08-12: работ на своей площадке в
    # дереве — ноль (`runs-on: self-hosted` не объявляет ни один из девяти
    # конвейеров), зарегистрированных своих ранеров у репозитория — ноль. Всё
    # идёт на ранерах площадки, где очередь общая и ничья: занять её «у ствола»
    # прогон обновлений не может.
    #
    # И довод обнулил сам себя. Предикат снятия был взят от ЧИСЛА своих ранеров
    # («снимем, когда их станет больше одного»), а переезд на ранеры площадки
    # сделал это число нулём — навсегда. Условие снятия перестало наступать в
    # тот же день, когда исчезла причина; послабление осталось и продолжало
    # выглядеть решением, которое кто-то принял. Это и есть класс «послабление
    # не истекает само», ради которого правила требуют предикат ОТ ПРЕДМЕТА, а
    # не от наблюдения рядом с ним.
    #
    # Теперь PR обновления зависимостей проходит e2e как любой другой. Секреты
    # этому не мешают: конвейер не читает НИ ОДНОГО (`secrets.` в файле —
    # единственное вхождение здесь, в этой строке).
    #
    # Класс держит гейт, а не эта запись:
    # internal/repohygiene TestActorExemptionRequiresAScarceRunnerThatExists —
    # он краснеет на сужении охвата по автору, пока в дереве нет ни одной работы
    # на своей площадке, и ОТСТУПАЕТ САМ, как только она появляется. То есть
    # послабление станет снова законным ровно тогда, когда вернётся его предмет.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: pyyaml (нужен гейту связности суита↔гейт↔артефакт)
        run: python3 -m pip install --quiet pyyaml

      # Покрытие: каждая суита дерева назначена ровно одному шарду, сумма
      # коллекций по шардам = коллекций в дереве. Самопроверка гоняется рядом —
      # гейт, не доказавший, что умеет краснеть, доказательством не является.
      - name: гейт — покрытие шардов полное (без потерь и дублей; число печатает сам гейт)
        run: |
          python3 deploy/scripts/assert-shard-coverage.py --self-test
          python3 deploy/scripts/assert-shard-coverage.py

      - name: гейт — самопроверка сводного вердикта
        run: python3 .github/scripts/aggregate-shard-verdicts.py --self-test

      # «Условие не создано» доезжает до вердикта (kacho#655). Механизм из
      # четырёх звеньев — отметка владельца материализации, её чтение шагом
      # стенда, пропуск шагов-вердиктов, ПРОПУСК ПРОПУСКА у шага описи, — и
      # любое разорванное звено возвращает исходный дефект молча: чужая
      # недоступность снова читается как красный шард, то есть как дефект
      # продукта. Ломается обычно третье: девятая суита заводится копированием
      # восьмой, и условие в копию не переносят.
      #
      # Место здесь, а не в шарде: гейт статический (плюс исполнение тела шага с
      # подменённым `make`), стенда не требует и обязан краснеть до того, как на
      # подъём потрачен первый ранер-час.
      - name: гейт — «условие не создано» доезжает до вердикта
        run: |
          python3 deploy/scripts/assert-stand-precondition-wiring.py --self-test
          python3 deploy/scripts/assert-stand-precondition-wiring.py

      # Планировщик волн обязан ЗАВЕРШАТЬСЯ, когда рядом живут вечные фоновые
      # процессы. Гейт написан вместе с фиксом (ограничитель ждал вечные пробросы
      # портов и вставал навсегда) и НЕ ЗВАЛСЯ НИОТКУДА — его нашёл гейт класса
      # «скрипт-проверка без вызывающего». Место здесь, а не в шарде: он статический,
      # стенда не требует и обязан падать до того, как поднят первый кластер.
      - name: гейт — планировщик волн завершается при вечном фоне
        run: bash deploy/scripts/assert-wave-scheduler-terminates.sh

      # Слепая зона автообёртки: конкурентный кейс шлёт запросы из тест-скрипта,
      # а сам шаг ходит на служебный путь — предикат такой URL не видит ПО
      # ПОСТРОЕНИЮ. Залп по СВЕЖЕМУ объекту без ожидания окна видимости целиком
      # получал отказ на крае, и проба на гонку краснела, не проверив ничего.
      # Гейт статический, стенда не требует и печатает объём осмотренного.
      - name: гейт — залп по свежему объекту ждёт своё окно видимости
        run: |
          python3 deploy/scripts/assert-burst-waits-for-materialization.py --self-test
          python3 deploy/scripts/assert-burst-waits-for-materialization.py

      # Предикат автообёртки доказывается в обе стороны: инъекция настоящего
      # пропуска краснеет, законные близнецы молчат. Гейт по дереву
      # (`internal/repohygiene`) утверждает, что предикат ПРОВЯЗАН у каждого
      # генератора; здесь проверяется, что он ещё и РАБОТАЕТ. Шаг заведён потому,
      # что шапка гейта дерева на него уже ссылалась, а вызывающего у самопроверки
      # не было ни одного — ссылка на несуществующий шаг CI.
      - name: предикат обёртки первого доступа (vpc)
        run: python3 services/vpc/tests/newman/scripts/selftest_autowrap.py

      # ALLOW-полоса набора authz-deny обязана РАЗЛИЧАТЬ здоровый ответ и отказ по
      # пересечению адресов. До issue #505 она утверждала «код не 403 и не 401» —
      # отрицание, зелёное и на успехе, и на пересечении, и на исчерпании пула; заодно
      # оно делало шаг НЕВИДИМЫМ для двух гейтов дерева, которые классифицируют шаг по
      # его утверждениям о статусе и читали такой шаг как пробу отказа.
      #
      # Проба гоняет НАСТОЯЩИЙ newman по НАСТОЯЩЕЙ сгенерированной коллекции против
      # подставного сервера, отдающего ровно две объявленные формы ответа, и требует
      # трёх вещей сразу: молчания на здоровом, падения на пересечении С ЕГО ИМЕНЕМ в
      # тексте, и зелени ПРЕЖНЕЙ формы на том же ответе. Третье — не украшение: без
      # него «мы усилили утверждение» остаётся заявлением.
      #
      # Стенд не нужен; newman нужен — и если его нет, проба выходит НЕнулевым кодом,
      # а не молча. Установка ставит ту же мажорную версию, что и шард: вердикт о
      # разборе утверждений на другой версии был бы вердиктом о другом предмете.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version: '26' }
      - name: newman (нужен пробе ALLOW-полос authz-deny)
        run: npm i -g newman@6
      - name: ALLOW-полоса authz-deny различает пересечение адресов (vpc)
        run: python3 services/vpc/tests/newman/scripts/selftest_authz_allow_lanes.py

      # Проба внедрения в имя (`*-CR-SEC-*`) до issue #670 утверждала одно
      # `oneOf([200, 400, 413])` — то есть принимала И приём имени, И отказ, а
      # значит пропустила бы ровно ту регрессию валидации, ради которой написана.
      # Исход установим: ни одна из семи нагрузок не проходит самый разрешительный
      # контракт имени, поэтому кейс утверждает ПАРУ (400 и код 3) плюс имя поля.
      # Инъекция пятисторонняя: молчание на объявленном отказе; падение на принятом
      # имени С НАЗВАННЫМ статусом; зелень ПРЕЖНЕЙ формы на том же ответе; падение
      # утверждения о коде на 400 с кодом 9 (довод в пользу пары — один статус не
      # отличает валидацию от состояния); падение утверждения о поле на отказе без
      # `BadRequest`. Newman нужен, стенд — нет.
      - name: проба внедрения в имя различает отказ и приём (vpc)
        run: python3 services/vpc/tests/newman/scripts/selftest_security_injection_lanes.py

      # Тот же класс на двух ОСТАВШИХСЯ полосах (issue #698): списочный фильтр и
      # уборка фикстуры несли `oneOf([200, 400])` — 209 шагов по переписи собранных
      # коллекций. У фильтра исход УСТАНОВЛЕН (`pkg/filter`.`Parse` разбирает
      # нагрузку штатно, значение уезжает параметром → 200 и ПУСТАЯ страница), у
      # уборки производителей действительно два, но каждый теперь ПРОЧИТАН своей
      # подписью: 200 обязан нести конверт Operation, 400 — код 9.
      #
      # Инъекция восьмисторонняя и двусторонняя по каждому утверждению: молчание на
      # законных близнецах обеих полос; падение на непустой странице, на 400 по
      # законному выражению, на смене формы ответа, на 403, на 400 с кодом 3 и на
      # 200 без конверта; и — контролем — измеренная слепота ПРЕЖНЕЙ формы на
      # четырёх из пяти этих ответов. Newman нужен и уже поставлен выше; стенд — нет.
      - name: полосы списочного фильтра и уборки различают дефект (vpc)
        run: python3 services/vpc/tests/newman/scripts/selftest_list_and_cleanup_lanes.py
      # Тот же класс, закрытый в остальных пяти наборах (issue #668). До него ALLOW-
      # полосы iam / compute / geo / registry / storage утверждали «код не 403» — то
      # есть проходили на успехе, на отказе валидации, на 500 и на 503, а гейтам
      # дерева такой шаг виден как проба отказа и в рассмотрение не попадает.
      #
      # Каждая проба гоняет НАСТОЯЩИЙ newman по НАСТОЯЩЕЙ сгенерированной коллекции
      # против подставного сервера и требует трёх вещей: молчания на здоровом ответе,
      # падения на реальном дефекте С ЕГО ИМЕНЕМ в тексте, и — третьей стороной —
      # ЗЕЛЕНИ прежней формы на том же дефекте. Без третьей стороны «мы усилили
      # утверждение» остаётся заявлением. Стенд не нужен; newman нужен и уже поставлен
      # шагом выше — если его нет, проба выходит НЕнулевым кодом, а не молча.
      #
      # Пробы перечислены поимённо, а не собраны шаблоном: шаблон, не нашедший ни
      # одной пробы, вышел бы успехом, и «ноль исполненного» было бы неотличимо от
      # «ноль находок».
      - name: ALLOW-полосы authz различают дефект (iam)
        run: python3 services/iam/tests/newman/scripts/selftest_authz_allow_lanes.py
      - name: ALLOW-полосы authz различают дефект (compute)
        run: python3 services/compute/tests/newman/scripts/selftest_authz_allow_lanes.py
      - name: ALLOW-полосы authz различают дефект (geo)
        run: python3 services/geo/tests/newman/scripts/selftest_authz_allow_lanes.py
      - name: ALLOW-полосы authz различают дефект (registry)
        run: python3 services/registry/tests/newman/scripts/selftest_authz_allow_lanes.py
      - name: ALLOW-полосы authz различают дефект (storage)
        run: python3 services/storage/tests/newman/scripts/selftest_authz_allow_lanes.py

      # Базовое удостоверение: зелёное утверждение о форме ПРОИЗВОДИТСЯ ЗДЕСЬ
      # (kacho#1253). Во всём сквозном прогоне не было ни одного успешного ответа,
      # из которого читался бы секрет, — и образец формы ждал разделитель после
      # префикса вида, тогда как идентификатор чеканится слитно. Такое утверждение
      # не совпало бы НИ ПРИ КАКОМ ответе и было неотличимо от исправного ровно
      # потому, что положительного прохода не существовало вовсе.
      #
      # Проба гоняет НАСТОЯЩИЙ newman по НАСТОЯЩЕЙ порождённой коллекции против
      # подставного края, и секрет в законном ответе НЕ выписан — его чеканит код
      # продукта (`go run ./services/iam/tests/newman/scripts/credsecretmint`,
      # те же `ids.NewID` и `credsecret.Mint`, что стоят на пути выдачи). Поэтому
      # зелёное здесь означает: утверждение о форме СОВПАЛО со значением продукта,
      # предъявление этим секретом прошло, а после отзыва — отказ.
      #
      # Стенда не требует, требует go: чеканку нельзя повторить на стороне пробы,
      # в значении контрольная сумма, и своя её реализация стала бы второй копией
      # предиката формы — тем самым, что уже разошлось молча.
      #
      # Чем это СЛАБЕЕ прогона против стенда — названо прямо: доказано «утверждения
      # кейса различают эти входы», не доказано «продукт на стенде отвечает именно
      # так». Второе подтверждает шард, а не этот шаг.
      #
      # Провязку держит гейт дерева internal/repohygiene
      # TestBasicCredentialFormProofIsProducedByARun: снятый отсюда вызов —
      # находка, а не тишина.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - name: форма базового удостоверения сверена с чеканкой продукта (iam)
        run: python3 services/iam/tests/newman/scripts/selftest_basic_access_token.py

      # Шаг удаления, не несущий утверждения, зеленеет при ЛЮБОМ ответе — включая
      # отказ. Перепись по дереву нашла 457 таких на 1359 шагов DELETE. Тихим это
      # не остаётся: у асинхронного удаления шаг захватывает `opId` из тела, а
      # следующий опрашивает операцию по нему; отказ тела не несёт, `opId` остаётся
      # от ПРЕДЫДУЩЕЙ операции, и опрос подтверждает чужой завершённый успех —
      # кейс зелёный, ресурс жив, пул течёт. Гейт статический, стенда не требует
      # и обязан падать до подъёма первого кластера.
      - name: гейт — шаг удаления несёт утверждение и способен упасть
        run: |
          python3 deploy/scripts/assert-delete-steps-are-asserted.py --self-test
          python3 deploy/scripts/assert-delete-steps-are-asserted.py

      # Два остатка той же волны, оба живут не в шаге удаления, а в ПАРЕ
      # «удаление → опрос операции», и оба зеленеют:
      #   • опрос дожидается `done` и на этом успокаивается — но `done` есть и у
      #     операции, завершившейся ОШИБКОЙ, поэтому отказ удаления читался как
      #     успех: ресурс оставался жить, пул деградировал, вердикт не менялся;
      #   • шаг удаления захватывал идентификатор операции, не сняв предыдущий, —
      #     отказ тела `id` не несёт, и опрос уезжал на ЧУЖУЮ, давно завершённую
      #     операцию. Этот коварнее: зелёный приходит БЫСТРО и уверенно.
      # Гейт статический, стенда не требует и обязан падать до подъёма кластера.
      - name: гейт — исход операции удаления утверждается, идентификатор свой
        run: |
          python3 deploy/scripts/assert-delete-operation-outcome.py --self-test
          python3 deploy/scripts/assert-delete-operation-outcome.py

      # Следствие предыдущего гейта, проявившееся ровно тогда, когда исход удаления
      # стали утверждать: уборка кейса удаляла РОДИТЕЛЯ, не сняв ПОТОМКА, которого
      # сам кейс и завёл. Продукт отказывает законно — ссылочную целостность он
      # держит на уровне БД, — поэтому чинится фикстура, а не продукт. Класс
      # проявился сразу в двух доменах за двое суток (группа целей у балансировщика,
      # роль с отозванной выдачей у прав), и первый экземпляр чинился без гейта.
      # Отзыв выдачи — переход состояния, а не удаление: строка остаётся и ссылку
      # держит, поэтому «отозвал» уборку не заменяет. Гейт статический, стенда не
      # требует и обязан падать до подъёма первого кластера.
      - name: гейт — уборка снимает потомка прежде, чем удалять родителя
        run: |
          python3 deploy/scripts/assert-teardown-frees-parent.py --self-test
          python3 deploy/scripts/assert-teardown-frees-parent.py

      # Третий остаток той же волны, и он про потомка, которого кейс НЕ ЗАВОДИЛ:
      # сага `Account.Create` co-commit'ит проект `default` в своей же транзакции,
      # а `Account.Delete` отказывает, пока в аккаунте есть хоть один проект. Кейс
      # видит этого потомка только как `metadata.defaultProjectId`; не сняв его,
      # уборка получает ЗАКОННЫЙ отказ на последнем шаге, аккаунт переживает
      # прогон, и красным становится кейс, а не продукт. Стало видно ровно тогда,
      # когда шаг удаления начал утверждать ИСХОД операции (гейт выше). Гейт
      # статический, стенда не требует, проверяет свои предпосылки и падает, если
      # сага исчезла, — на снятом предмете он зеленеть не вправе.
      - name: гейт — уборка снимает потомка, заведённого САГОЙ создания родителя
        run: |
          python3 deploy/scripts/assert-cocreated-child-is-torn-down.py --self-test
          python3 deploy/scripts/assert-cocreated-child-is-torn-down.py

      # Тот же класс с другой стороны: предыдущие гейты требуют, чтобы кейс за
      # собой убирал, — а этот считает, сколько аккаунтов живёт ОДНОВРЕМЕННО, пока
      # он ещё не убрал. Аккаунт занимает слот потолка своей ЛИЧНОСТИ, а вся волна
      # церемонии идёт под одним человеком: сумма упирается в один потолок, и
      # отказ достаётся не тому кейсу, который полку исчерпал. Пик считается по
      # СГЕНЕРИРОВАННЫМ коллекциям в порядке волны; порядок берётся у того же
      # объявления, которым волну гоняет прогонщик. Гейт статический, стенда не
      # требует и обязан падать до подъёма первого кластера.
      - name: гейт — волна не подходит к потолку аккаунтов личности вплотную
        run: |
          python3 deploy/scripts/assert-identity-account-peak-under-ceiling.py --self-test
          python3 deploy/scripts/assert-identity-account-peak-under-ceiling.py

      # Вторая полоса того же потолка, и она НЕ дублирует первую: та считает
      # ОДНОВРЕМЕННО ЖИВЫЕ аккаунты (снятие освобождает слот), эта — ЧИСЛО
      # ЗАВЕДЕНИЙ за окно (снятие не возвращает ничего). Восемь заведений волны
      # под одним человеком давали десять списаний при потолке три: первое
      # проходило, семь получали RESOURCE_EXHAUSTED, и падало не то место,
      # которое полку исчерпало, — 83 упавших утверждения на прогоне 32612214045.
      # Гейт статический, стенда не требует и обязан падать до подъёма первого
      # кластера: отказ по темпу иначе приходит через сорок минут и на чужом кейсе.
      - name: гейт — ни одна личность не заводит аккаунтов сверх темпа
        run: |
          python3 deploy/scripts/assert-identity-admission-rate-headroom.py --self-test
          python3 deploy/scripts/assert-identity-admission-rate-headroom.py

      # Проба, которая ПОРТИТ подлинного предъявителя и требует отказа, держится
      # на допущении: отправленное действительно отличается от подлинного. В
      # base64url это допущение неверно для терминального символа кодировки —
      # часть его бит заполняющие, и разные строки бывают одними и теми же
      # байтами. Кейс сравнивал строки, поэтому примерно на каждом шестнадцатом
      # прогоне отправлял краю ПОБАЙТОВО подлинную подпись, получал законный
      # `200` и объявлял это принятой подделкой — ложное обвинение продукта в
      # обходе аутентификации, стоившее трёх красных PR за один заход.
      #
      # Гейт исполняет ТУ ЖЕ подстановку, что уедет в прогон (берёт её из
      # сгенерированной коллекции), над всеми 256 значениями обоих краевых байт
      # на пяти длинах подписи — покрыты все три остатка длины по модулю 3, то
      # есть все три раскладки бит заполнения. Судит он по БАЙТАМ, а не по
      # строке. Статический, стенда и npm не требует, печатает объём
      # осмотренного и обязан падать до подъёма первого кластера.
      - name: гейт — порча подписи меняет подпись побайтово, а не только строку
        run: |
          python3 gateway/tests/newman/scripts/selftest_tamper_mutation.py --self-test
          python3 gateway/tests/newman/scripts/selftest_tamper_mutation.py

      - name: гейт — у каждой исполняемой суиты есть свой шаг-гейт и артефакт
        run: |
          python3 .github/scripts/check-newman-suite-gates.py --self-test
          python3 .github/scripts/check-newman-suite-gates.py

      # Матрица + производные строки (--set для helm, список образов) считаются
      # ЗДЕСЬ, один раз, из манифеста. Считать их в каждом шарде значило бы
      # завести пять копий одной логики.
      - name: матрица из deploy/e2e-shards.json
        id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m = json.load(open("deploy/e2e-shards.json"))
          gates, gi = m["gates"], m["gate_images"]
          rows = []
          for s in m["shards"]:
              off = [g for g in gates if g not in s["components"]]
              images = list(m["core_images"]) + [gi[c] for c in s["components"] if c in gi]
              rows.append({
                  "id": s["id"],
                  "suites": " ".join(s["suites"]),
                  # Компонент, не названный шардом, выключается ЯВНО. Умолчание
                  # чарта — «включён», поэтому «не упомянул» означало бы «поднял».
                  "helm": " ".join(f"--set {g}.enabled=false" for g in off),
                  "images": " ".join(sorted(set(images))),
                  # Сборка консоли выводится ИЗ ТОЙ ЖЕ строки, что и её выключение
                  # (`off` выше), а не объявляется вторым местом: иначе стенд без
                  # консоли и девять всё равно собранных образов разъехались бы
                  # молча — и разъехались бы именно в тихую сторону, где расход
                  # есть, а предмета у него нет.
                  "build_ui": "0" if "uif" in off else "1",
                  # Гейт посадки держит ЖЁСТКИЙ список ожидаемых сервисов, чтобы
                  # не развернувшийся сервис не делал его зелёным молчанием.
                  # Поэтому отсутствие называется явно — тем же способом, который
                  # гейт для этого и завёл, и из той же карты gate_images.
                  "skip": " ".join(sorted({gi[g] for g in off if g in gi})),
                  # Домены, чью изоляцию Internal*-методов этот шард способен
                  # проверить: у пробы ban #6 есть встречный контроль на внутреннем
                  # листенере домена, и не развёрнутый домен ответить не может.
                  # Полноту объединения по шардам утверждает assert-shard-coverage.py.
                  # Значение карты — СПИСОК: один компонент способен дать больше
                  # одного домена. `subscription` (поток изменений) служат пять
                  # носителей сразу, и своего сервиса у него нет ни одного.
                  "ban6": " ".join(sorted(set(m["core_ban6_domains"]).union(*(
                      m["gate_ban6_domains"].get(c, []) for c in s["components"]
                  ), set()))),
              })
          print("matrix=" + json.dumps({"shard": rows}, ensure_ascii=False))
          PY
          cat "$GITHUB_OUTPUT"

  # ─── ШАРД: свой кластер, свой стенд, свои суиты, строго по одной коллекции ──
  shard:
    name: e2e ${{ matrix.shard.id }} (${{ matrix.shard.suites }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — обязательно. С отменой по первому падению остальные
      # шарды снимаются с полдороги, и их исход становится «не выполнилось» из-за
      # чужой красноты. Тогда сводный вердикт не может отличить «у нас всё
      # красное» от «мы не смотрели», а это ровно та подмена, которую свод и
      # существует, чтобы не допустить.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Прогон стал последовательным (JOBS=1), поэтому шард со своей стороны длиннее
    # прежней параллельной волны; зато шардов пять и они идут одновременно.
    # 90 — прежний потолок; он оставлен, пока не измерен новый.
    timeout-minutes: 90
    env:
      # Имя кластера УНИКАЛЬНО на шард. Совпадение имён означало бы, что шаг
      # «снести кластер от прошлого прогона» в одном job'е убивает чужой стенд —
      # на общем раннере это отказ, неотличимый от дефекта продукта.
      CLUSTER_NAME: kacho-${{ matrix.shard.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Тулчейны ставим сами и с ПИНАМИ, не полагаясь на состав образа ранера: он
      # меняется без нашего участия, и «оно там было» — не инвариант.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      # ПИН ОБЯЗАТЕЛЕН: без `version` setup-helm ставит ПОСЛЕДНЮЮ, то есть версия
      # менялась бы без единой правки в дереве. Значение обязано совпадать с
      # ci.yaml и production-posture.yml — это сверяет
      # .github/scripts/check-pinned-tools.sh --divergence-only.
      #
      # Здесь стоял v3.17.0 не ради свежести, а потому что Helm 4 применяет
      # манифесты на стороне сервера, где владение полем энфорсится, и у аннотации
      # шаблона пода `kacho.cloud/openfga-model-id-rev` было ДВА писателя — чарт и
      # задание начальной настройки хранилища прав (kacho#3). Сначала снялся второй
      # писатель, а с ним и его гейт: движок прав снят целиком (S6 эпика #747),
      # вместе с заданием начальной настройки. Изнутри релиза шаблон пода теперь
      # НЕ ПАТЧИТ НИКТО — предмета у запрета не осталось, поэтому и проверки на
      # него в дереве нет: гейт снят вместе с предметом, а не ослаблен.
      #
      # ИМЕННО ЭТОТ КОНВЕЙЕР ЭТО И ПРОВЕРЯЕТ на живом кластере: `make dev-up`
      # поднимает стенд С НУЛЯ и делает три фазы helm подряд, поэтому проходит
      # ровно тот путь, где задание впервые записывает аннотацию, а следующая
      # фаза применяет релиз поверх уже записанного.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v4.2.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version: '26' }
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5
      # buf нужен пробе ban #6: она берёт дескрипторы из `buf build proto`, а не из
      # reflection — reflection на внутреннем листенере закрыт намеренно и снимать
      # его ради пробы нельзя. Пин 1.72.0 — тот же, что у job'ов `proto` и каталога
      # в ci.yaml: версия buf влияет на состав дескрипторов, а значит на предмет
      # пробы, и разъезд версий сделал бы вердикты о том же дереве несравнимыми.
      # github_token — по той же причине, что в обоих job'ах ci.yaml: без него
      # релиз buf берётся неаутентифицированно, квота общая на IP ранера, и на её
      # исчерпании проба ban #6 не выполняется вовсе при красной джобе.
      - uses: bufbuild/buf-setup-action@3e33fea8596569a62fcaa33eb3880b6ac7098941  # v1.9.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      # kind — БИНАРЬ, без создания кластера (kind-action создаёт его сам и не умеет
      # переиспользовать наш путь). Кластер поднимает `make dev-up` с НАШИМ
      # kind-config (host-port mappings для ingress). Так CI идёт ровно тем же путём,
      # что и разработчик локально. БЕЗ sudo и в ~/bin: установка в ~/bin переносима
      # между ранерами и потому переживает смену площадки — а этот workflow её уже
      # пережил однажды.
      #
      # ВЕРСИЯ kind ЗАДАЁТ ВЕРСИЮ KUBERNETES стенда — это не косметический пин. 0.32.0
      # ставит узел `kindest/node:v1.36.1` (0.30.0 ставил v1.34.0), и вместе с ним
      # kind переходит на формат kubeadm v1beta4 для Kubernetes 1.36.0+. Наш
      # deploy/kind/kind-config.yaml патчит `nodeRegistration.kubeletExtraArgs`
      # НЕВЕРСИОНИРОВАННЫМ патчем в map-форме — именно та форма, которую 0.32.0
      # переводит в list-форму v1beta4 сам. Версионированный патч пришлось бы
      # переписывать под v1beta4 руками; у нас его нет, и завести — значит взять эту
      # работу на себя без нужды.
      #
      # Второй пин этой версии — в production-posture.yml. Их совпадение держит
      # .github/scripts/check-pinned-tools.sh (--divergence-only): два конвейера,
      # поднимающие стенд разными kind, дают несравнимые вердикты о том же дереве.
      - name: kind
        run: |
          mkdir -p "$HOME/bin"
          curl -sSLo "$HOME/bin/kind" https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x "$HOME/bin/kind"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/kind" version

      - name: newman
        run: npm i -g newman@6

      # grpcurl нужен фикстурам (tests/authz-fixtures/setup.sh сеет пользователей через
      # kacho-iam-internal:9091). Без него шаг падает `FATAL: 'grpcurl' not found in PATH`
      # ДО первой коллекции — стенд поднят, а проверено ноль.
      - name: grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz \
            | tar -xz -C "$HOME/bin" grpcurl
          grpcurl --version

      # ДИСК — ОПИСЬ, А НЕ ПОКУПКА.
      #
      # Здесь стояла уборка предустановленных тулчейнов (`rm -rf` пяти каталогов
      # плюс `docker image prune -af`), обоснованная комментарием «на ubuntu-latest
      # свободно ~14 ГБ». Утверждение пережило свой предмет: на прогоне 31954684113
      # ВСЕ ПЯТЬ шардов напечатали одно и то же — `145G 60G 85G 42%`, то есть
      # свободно 85 ГБ до всякой уборки. Уборка добирала ещё 19 ГБ (до 104 ГБ) и
      # стоила 48…97 с на шард, 6.3 ранер-минуты за прогон.
      #
      # Сколько нужно на самом деле, измерено там же: пик стенда на шарде vpc — 51 ГБ
      # занято при 41 ГБ после уборки, то есть стенд добавляет около 10 ГБ. Без
      # уборки он упёрся бы в ~70 ГБ из 145 ГБ, оставив ~75 ГБ свободными. Запас
      # семикратный, и покупалось место, которого и так вчетверо больше нужного.
      #
      # ОПИСЬ ОСТАЁТСЯ. Свидетельство объёма нужно: прогон на исчерпанном ресурсе —
      # это «не выполнилось», а не красный вердикт, и отличить одно от другого можно
      # только числом. Печать никуда не делась, ушла только трата. Диск после стенда
      # печатает шаг сноса — там же, где и печатал.
      - name: диск перед стендом (опись, не уборка)
        run: |
          echo "=== диск:"; df -h / | tail -1

      # VM здесь одноразовая, и кластер её не переживает — но сносим ДО всё равно:
      # шаг стоит копейки, а его отсутствие сделало бы workflow непереносимым обратно
      # на живущую между прогонами машину. Почему переиспользованный стенд вреден,
      # замерено вручную 2026-07-16: в кластере, пережившем много прогонов, копились
      # мусорные AccessBinding'и, и кейсы, ждущие чистое состояние, краснели сами по себе.
      # Имя — своё у шарда, поэтому снос не задевает соседей.
      - name: снести кластер от прошлого прогона
        run: |
          kind delete cluster --name "$CLUSTER_NAME" 2>/dev/null || true
          echo "=== диск до стенда:"; df -h / | tail -1

      # Стенд шарда. Четыре вещи приходят из манифеста и нигде не дублируются:
      #   CLUSTER_NAME  — уникальное имя кластера (см. env выше);
      #   DEV_UP_VALUES — явное выключение всех компонентов, которых шард не назвал
      #                   (умолчание чарта — «включён», поэтому молчание = поднял);
      #   IMAGES        — какие образы вообще собирать. Восемь `docker build` подряд
      #                   стоят дороже всего остального bring-up'а, и собирать образ,
      #                   который на этом кластере не разворачивается, — чистая трата.
      #   BUILD_UI      — та же мысль про консоль, и выведен он ИЗ ТОЙ ЖЕ строки, что
      #                   её выключение: `uif` переключаем и не назван ни одним шардом,
      #                   потому что newman к консоли не ходит (предикат — в
      #                   deploy/e2e-shards.json §_uif). Её проверяет console-e2e.yml
      #                   своим полным стендом, здесь она — девять образов на шард ни
      #                   для чего. `IMAGES` этого не закрывает: он сужает только
      #                   бэкенд, а модули консоли выводятся из дерева и всегда полны.
      # ЧЕЙ ЭТО ОТКАЗ — НАШ ИЛИ ЧУЖОГО ХОСТА (kacho#655).
      #
      # Подъём стенда тянет десять зависимостей чарта с ПОСТОРОННЕГО хоста, и его
      # недоступность роняла шард целиком: девять коллекций не выполнялись вовсе,
      # а в сводке PR это выглядело как красный шард — то есть как дефект
      # продукта. `e2e-flow.md` §6 требует обратного: «условие не создано — не
      # вердикт: отдельный шаг, отдельное сообщение».
      #
      # Код возврата через `make` не проходит: make отвечает своей двойкой на
      # любой упавший рецепт. Поэтому причину несёт ОТМЕТКА, которую кладёт
      # единственный владелец материализации зависимостей — и только когда у него
      # есть ДОКАЗАТЕЛЬСТВО (строка helm о недостижимом удалённом репозитории).
      # Отметка снимается в начале каждого прогона, поэтому здоровый стенд её не
      # застанет; послаблению нечего переживать.
      #
      # ШАГ ОСТАЁТСЯ КРАСНЫМ, И ЭТО НАМЕРЕННО: «не выполнилось» не идёт в зачёт
      # «прошло», а третьего цвета у работы конвейера нет. Меняется то, ЧТО
      # красное и что об этом сказано: заголовок называет категорию, гейты проб
      # ниже ПРОПУСКАЮТСЯ (а не краснеют «нет отчётов»), опись несёт причину, и
      # свод печатает её первой строкой вместо «часть дерева не судилась».
      # Ровно тем же порядком это устроено в console-e2e.yml.
      - name: стенд (dev-up, только компоненты шарда)
        id: stand
        working-directory: deploy
        run: |
          echo "кластер:     $CLUSTER_NAME"
          echo "выключаем:   ${{ matrix.shard.helm }}"
          echo "собираем:    ${{ matrix.shard.images }}"
          echo "нет на стенде (явно, для гейта посадки): ${{ matrix.shard.skip }}"
          echo "консоль:     BUILD_UI=${{ matrix.shard.build_ui }}"
          rc=0
          make dev-up \
            CLUSTER_NAME="$CLUSTER_NAME" \
            IMAGES="${{ matrix.shard.images }}" \
            BUILD_UI="${{ matrix.shard.build_ui }}" \
            POSTURE_SKIP="${{ matrix.shard.skip }}" \
            DEV_UP_VALUES="${{ matrix.shard.helm }}" || rc=$?
          [ "$rc" -eq 0 ] && exit 0

          mark=helm/umbrella/.kacho-deps-precondition-unmet
          if [ ! -f "$mark" ]; then
            echo "::error title=Стенд не поднялся::подъём стенда шарда '${{ matrix.shard.id }}' упал (код $rc), и это НАШ отказ: доказательства недоступности постороннего источника чартов нет. Причина названа выводом выше."
            exit "$rc"
          fi

          # Отметка есть — причина ЧУЖАЯ. Называем это шагом ниже по течению
          # (гейты проб) и своду, а не только человеку в журнале.
          echo "STAND_PRECONDITION_UNMET=1" >> "$GITHUB_ENV"
          echo "::error title=УСЛОВИЕ НЕ СОЗДАНО (внешний источник чартов)::стенд шарда '${{ matrix.shard.id }}' не поднялся: $(cat "$mark"). Пробы НЕ ВЫПОЛНЯЛИСЬ — это третья категория исхода, не зелёное и не красное: дефекта продукта здесь НЕ показано. Прогон повторяется, а не разбирается как упавшая проба. Предмет — kacho#655."
          exit "$rc"

      # ДИАГНОСТИКА ПРИВЯЗАНА К ПРЕДМЕТУ (#728). `always()` без привязки значит
      # «исполняйся и тогда, когда работа сорвалась ЗАДОЛГО до стенда»: кластера
      # нет, обращение отказывает, и рядом с названной причиной встаёт второй
      # красный шаг с посторонним текстом — один отказ выглядит как два.
      #
      # Положения шага подъёма выписаны поимённо, а не отрицанием: у шага,
      # который вовсе не начинался, исход ПУСТ, и `!= 'skipped'` пропустило бы
      # диагностику ровно в том случае, ради которого она привязывается.
      - name: что поднялось
        if: ${{ always() && (steps.stand.outcome == 'success' || steps.stand.outcome == 'failure') }}
        run: |
          # Стенд мог не подняться — тогда печатаем ПРИЧИНУ и выходим успехом:
          # диагностика вердикта не выносит.
          "$GITHUB_WORKSPACE/.github/scripts/stand-present-or-explain.sh" "стенд шарда '${{ matrix.shard.id }}'" || exit 0
          kubectl -n kacho get pods -o wide || true

      # ПРОГОН. SERVICES сужает набор суит до состава шарда; JOBS/WAVE_JOBS=1 —
      # конкуренция снята (решение владельца), и это подтверждается явно, а не
      # умолчанием скрипта: ручка, от которой зависит смысл прогона, называется в
      # том месте, где её читают.
      #
      # `|| true` — НЕ проглатывание: код возврата прогона здесь ни на что не влияет
      # by design, вердикт выносят шаги-гейты ниже по СОДЕРЖИМОМУ отчётов (и считают
      # отсутствие отчёта провалом). Ранний обрыв прогона спрятать нельзя.
      #
      # Наблюдатель пишет таблицу прогресса в ЭТОТ ЖЕ стримящийся лог: прогон, за
      # которым нельзя следить, отлаживают следующим прогоном, а цена ошибки в
      # фикстуре — полный цикл стенда. Вердикта он не выносит и говорит это первой
      # строкой: второй вердикт рядом с первым — способ получить два разных ответа
      # на один вопрос.
      - name: newman — суиты шарда, строго по одной (+ live-отчёт)
        working-directory: deploy
        timeout-minutes: 75
        env:
          DELAY: "10"
          JOBS: "1"
          WAVE_JOBS: "1"
          SERVICES: ${{ matrix.shard.suites }}
        run: |
          rm -f /tmp/newman-live.stop
          # --services сужает наблюдателя до состава ШАРДА. Без этого он читал бы
          # умолчание прогонщика (все восемь суит) и печатал бы «0 отчётов» по тем,
          # которых этот шард не гоняет, — числа, выглядящие как потеря.
          python3 "${GITHUB_WORKSPACE}/.github/scripts/newman-live.py" watch \
            --services "$SERVICES" --interval 20 &
          live_pid=$!
          ./scripts/newman-parallel.sh; rc=$?
          touch /tmp/newman-live.stop
          wait "$live_pid" || true

          # ТРЕТЬЯ КАТЕГОРИЯ ВАЛИТ ТОТ ШАГ, НА КОТОРОМ ПРОИЗОШЛА.
          #
          # Здесь стояло `|| true`, и оно НЕ различало два разных исхода:
          #   rc=1 — суиты ИСПОЛНИЛИСЬ, часть красная. Вердикт по ним выносят
          #          шаги-гейты ниже, и он обязан остаться за ними: второй вердикт
          #          рядом с первым — способ получить два разных ответа на один
          #          вопрос. Поэтому rc=1 здесь действительно проглатывается.
          #   rc=2 — прогон НЕДЕЙСТВИТЕЛЕН: суиты не запускались вовсе (не встал
          #          проброс, упал посев). Результата нет — ни красного, ни зелёного.
          # Проглатывая оба, шаг отчитывался `success`, не исполнив ничего, а красным
          # становился ШАГ ЧЕРЕЗ ДВА — гейт суиты, докладывающий «нет отчётов». Разбор
          # после этого начинался не с той стороны: упавшее утверждение искали там, где
          # не исполнилось ни одного запроса (прогон 31344367968, четыре шарда).
          #
          # Гейты ниже (`if: always()`) от этого не теряются: они всё равно отработают и
          # всё равно доложат «нет отчётов». Меняется только то, ГДЕ впервые виден
          # незапуск — на своём шаге, а не двумя шагами позже.
          if [ "$rc" -eq 2 ]; then
            echo "::error title=Прогон недействителен::Суиты НЕ запускались (rc=2): результата нет — ни красного, ни зелёного. Причина названа выше, в выводе newman-parallel.sh."
            exit 2
          fi

      # Условие не создано ⇒ отчётов нет by construction, и сводка напечатала бы
      # «0 отчётов» — числа, выглядящие как потеря. Пропуск здесь ничего не
      # прячет: причина уже названа заголовком шага стенда, а опись её несёт.
      - name: сводка прогона (числа + находки)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' }}
        run: python3 .github/scripts/newman-live.py report --services "${{ matrix.shard.suites }}"

      # НАСТОЯЩИЕ ГЕЙТЫ. ОДИН скрипт (живёт в iam) применяется к КАЖДОЙ суите — он
      # глобит `collections/` + `out/` относительно cwd, поэтому запускается из
      # каталога проверяемой суиты. Гейт НИЧЕГО НЕ ВЫЧИТАЕТ: любое упавшее
      # утверждение, упавший скрипт, неотвеченный запрос и отсутствие отчёта
      # («(no-report)») валят его.
      #
      # Шаги объявлены для ВСЕХ восьми суит и включаются условием по составу шарда.
      # Так гейт суиты остаётся ровно один на всё дерево (гейт связности
      # check-newman-suite-gates.py это и проверяет), а не размножается по шардам.
      # Условие сверяется по СПИСКУ с разделителями, а не подстрокой: без
      # обрамляющих пробелов `contains('compute storage', 'compute')` был бы верен и
      # для суиты `comp`, если бы такая завелась.
      - name: гейт — newman зелёный (iam)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' && contains(format(' {0} ', matrix.shard.suites), ' iam ') }}
        working-directory: services/iam/tests/newman
        env:
          SUITE_LABEL: iam
        run: bash scripts/assert-suites-green.sh

      - name: гейт — newman зелёный (vpc)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' && contains(format(' {0} ', matrix.shard.suites), ' vpc ') }}
        working-directory: services/vpc/tests/newman
        env:
          SUITE_LABEL: vpc
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      - name: гейт — newman зелёный (compute)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' && contains(format(' {0} ', matrix.shard.suites), ' compute ') }}
        working-directory: services/compute/tests/newman
        env:
          SUITE_LABEL: compute
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      - name: гейт — newman зелёный (nlb)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' && contains(format(' {0} ', matrix.shard.suites), ' nlb ') }}
        working-directory: services/nlb/tests/newman
        env:
          SUITE_LABEL: nlb
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      - name: гейт — newman зелёный (storage)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' && contains(format(' {0} ', matrix.shard.suites), ' storage ') }}
        working-directory: services/storage/tests/newman
        env:
          SUITE_LABEL: storage
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      - name: гейт — newman зелёный (registry)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' && contains(format(' {0} ', matrix.shard.suites), ' registry ') }}
        working-directory: services/registry/tests/newman
        env:
          SUITE_LABEL: registry
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      - name: гейт — newman зелёный (geo)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' && contains(format(' {0} ', matrix.shard.suites), ' geo ') }}
        working-directory: services/geo/tests/newman
        env:
          SUITE_LABEL: geo
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      # api-gateway: суита живёт в gateway/, а не в services/ — отсюда отдельный
      # working-directory и отдельная строка в маске артефактов ниже. Она покрывает
      # cluster-RBAC админ-поверхность (InternalClusterService на cluster-internal
      # REST-листенере), которой нет ни в одной per-service суите.
      - name: гейт — newman зелёный (api-gateway)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' && contains(format(' {0} ', matrix.shard.suites), ' api-gateway ') }}
        working-directory: gateway/tests/newman
        env:
          SUITE_LABEL: api-gateway
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      # ban #6 на внешнем листенере — свойство ЛИСТЕНЕРА, а не суиты, и гоняется на
      # КАЖДОМ шарде по СВОЕМУ набору доменов.
      #
      # Почему не на одном. Проба несёт встречный контроль: тот же Internal*-метод
      # обязан быть доказанно ОБСЛУЖЕН на внутреннем листенере своего домена — иначе
      # «метода нет на внешнем» неотличимо от «метода нет нигде». Не развёрнутый
      # домен ответить не может, и на первом же разнесённом прогоне проба честно
      # отказалась работать (registry отсутствовал на шарде iam, exit 2). Гейт был
      # прав; неверен был замысел «спросить всё на одном стенде», которого больше нет.
      # Поэтому каждый шард измеряет то, что поднял, а полноту объединения требует
      # assert-shard-coverage.py: домен, чей Internal*-контракт кто-то регистрирует,
      # но не измеряет НИ ОДИН шард, — находка, а не тишина. Домен, чей контракт
      # ещё не провязан ни одним композиционным корнем, в предмет не входит (его
      # встречный контроль подтвердить нечем) и НАЗЫВАЕТСЯ переписью гейта.
      #
      # REST-проба на этой поверхности не может быть свидетельством в принципе:
      # листенер согласует ALPN h2 и говорит только gRPC. Скрипт несёт ТРИ контроля
      # (публичный метод обязан маршрутизироваться; Internal*-метод обязан быть
      # доказанно обслужен на своём :9091; дескриптор обязан резолвиться) и печатает
      # числа: сколько методов проверено, сколько недостижимо, сколько НЕ проверено.
      # Отдельный вердикт `INCONCLUSIVE` существует потому, что authz шлюза отвечает
      # раньше резолвера — засчитать такой ответ в изоляцию значило бы позеленеть на
      # непроверенном методе.
      # Стенда нет ⇒ спрашивать листенер не у кого. Гейт честно отказался бы
      # («не выполнилось», его же код 2), но красным при этом стал бы ОН — то
      # есть чужая недоступность снова читалась бы как находка о продукте.
      - name: гейт — ban #6 на внешнем листенере (gRPC, домены шарда)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' }}
        run: |
          python3 deploy/scripts/assert-ban6-external-isolation.py \
            --domains "${{ matrix.shard.ban6 }}"

      # coverage-гейт: proto RPC → newman case-id. Порог — не «сколько получилось»,
      # а ПОЛ, ниже которого падаем: он ловит регресс (RPC добавили, кейс — нет).
      # Живёт на шарде, который гоняет iam: его коллекции и есть предмет.
      - name: coverage-гейт (proto RPC → newman)
        if: ${{ always() && env.STAND_PRECONDITION_UNMET != '1' && contains(format(' {0} ', matrix.shard.suites), ' iam ') }}
        working-directory: services/iam/tests/newman
        env:
          COVERAGE_MIN: "30"
        run: |
          python3 scripts/coverage.py \
            --proto-glob "${GITHUB_WORKSPACE}/proto/kacho/cloud/iam/v1/*.proto" \
            --collections-glob 'collections/*.postman_collection.json' \
            --min "$COVERAGE_MIN"

      # ОПИСЬ ШАРДА — то, из чего свод соберёт один ответ. Это не вердикт: шаг
      # зелёный, если сумел записать файл. Пишется ВСЕГДА, в том числе на упавшем
      # прогоне: именно тогда свод и должен увидеть, чего не хватает.
      - name: опись шарда (числа для сводного вердикта)
        if: always()
        run: |
          python3 .github/scripts/shard-verdict.py \
            --shard "${{ matrix.shard.id }}" \
            --out "shard-verdicts/shard-verdict-${{ matrix.shard.id }}.json"

      # ОДИН артефакт на шард — опись И отчёты вместе. Разделение на два было
      # соблазнительно (свод читает килобайты описи, отчёты нужны человеку), но
      # ломало пути внутри архива: upload-artifact кладёт файлы относительно ОБЩЕГО
      # предка найденного набора. У шарда с одной суитой все отчёты лежат под одним
      # каталогом, общий предок схлопывается до него, и `*.json` приезжают в корень —
      # то есть `services/vpc/tests/newman/out/` в архиве уже нет. Свод, скачивающий
      # такой архив в дерево, отчётов на местах не находит, и гейт «известное красное»
      # теряет своё третье измерение МОЛЧА: он честно скажет «непроверено», и это
      # будет выглядеть как свойство дерева, а не как потерянные пути.
      #
      # Опись лежит в `shard-verdicts/` в корне рабочей копии, поэтому общий предок
      # набора — корень, и пути отчётов сохраняются по построению. Это не приём:
      # архив шарда несёт и то, чем судят, и то, по чему разбирают, — вместе.
      #
      # `if-no-files-found: error` — «нечего грузить» это отказ, а не тихий успех.
      # `ignore` означал бы ровно то, чего шаг обязан не допускать: прогон, не
      # оставивший НИ ОДНОГО отчёта, загружался бы как успех и не создавал артефакта
      # вовсе. Так прошли два прогона 2026-07-26/27 (все суиты умерли на `missing env`
      # до запуска newman): гейты покраснели верно, а разобраться постфактум было не
      # по чему. Пустой набор файлов — это отказ, и он обязан называться отказом.
      # ЖУРНАЛЫ СЕРВИСОВ — В АРТЕФАКТ, А НЕ ХВОСТОМ В ЖУРНАЛ РАБОТЫ.
      #
      # Ниже стоял шаг, печатавший `kubectl logs --tail=60` В ЖУРНАЛ РАБОТЫ, и он
      # исполнялся ПОСЛЕ выгрузки. Из этого следовало то, чего никто не объявлял:
      # запись, ради которой сервису добавляли наблюдаемость, до разбирающего НЕ
      # ДОЕЗЖАЛА. Шард nlb гоняет десять коллекций; отказ, случившийся на первой,
      # уходит за шестьдесят строк задолго до конца прогона, а в артефакте журналов
      # не было вовсе.
      #
      # Наблюдалось на подписи «привязка адреса отвергнута» (задача #434): причина
      # отказа была внесена в сервис PR #433 как УСЛОВИЕ дальнейшего разбора — и
      # осталась внутри кластера, который сносится следующим шагом. Перепись по
      # шести упавшим прогонам окна 08-13…08-16: строк с этой записью в журналах
      # работ — ноль.
      #
      # Поэтому: журналы пишутся ФАЙЛАМИ до выгрузки и уезжают тем же артефактом,
      # что отчёты. `--tail` оставлен большим, но конечным — журнал без предела
      # уносит гигабайты и делает артефакт непригодным ровно тогда, когда он нужен.
      # В журнал работы по-прежнему печатается хвост: он читается без скачивания.
      #
      # Привязка и объяснение — по тем же основаниям, что у «что поднялось»
      # (#728). Здесь класс проявлялся ТИХО: шаг не падал (у каждого чтения свой
      # запасной путь), но выкладывал девять файлов «журнал недоступен» без
      # единого слова о причине — и она искалась в продукте.
      - name: журналы сервисов и события кластера (в артефакт)
        if: ${{ always() && (steps.stand.outcome == 'success' || steps.stand.outcome == 'failure') }}
        run: |
          mkdir -p stand-logs
          # Причина уезжает В АРТЕФАКТ, а не только в журнал работы: артефакт
          # читают отдельно от него, и пустая выкладка там неотличима от потери.
          if ! "$GITHUB_WORKSPACE/.github/scripts/stand-present-or-explain.sh" "стенд шарда '${{ matrix.shard.id }}'" \
                 > stand-logs/no-cluster.txt 2>&1; then
            cat stand-logs/no-cluster.txt
            exit 0
          fi
          rm -f stand-logs/no-cluster.txt
          # Перечень собираемых журналов ВЫВОДИТСЯ ИЗ ПОДНЯТОГО СТЕНДА, а не
          # выписывается здесь. Выписанный перечень называл восемь наших служб и
          # не называл службу личности, её курьера и провайдера токенов, которые
          # тот же чарт поднимает, — поэтому при поломке полосы личности
          # единственный журнал с причиной выбрасывался вместе с кластером
          # (#1741). Числа «поднято · собрано» печатает сам скрипт: «журналы
          # собраны» обязано быть отличимо от «собраны не все».
          "$GITHUB_WORKSPACE/.github/scripts/collect-stand-logs.sh" kacho stand-logs 20000

      - name: upload — опись шарда + newman-отчёты + журналы стенда
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: newman-shard-${{ matrix.shard.id }}
          # Три строки: опись (она же якорь общего предка) + отчёты. Суита
          # api-gateway живёт в gateway/, а не в services/ — одна маска её не
          # покрывает, и её отчёты терялись.
          path: |
            shard-verdicts/*.json
            services/*/tests/newman/out/*.json
            gateway/tests/newman/out/*.json
            stand-logs/*
          if-no-files-found: error
          retention-days: 7

      # Логи падений: без них newman-краснота в CI неотлаживаема — видно «ожидал 200,
      # получил 500», но не видно, ПОЧЕМУ сервис отдал 500.
      # Хвост в журнал работы — чтобы причина читалась без скачивания артефакта.
      # Полные журналы уже уехали файлами шагом выше: `--tail` здесь про удобство,
      # а не про сохранность. Диагностика, а не вердикт — недоступный кластер не
      # подменяет причину красноты своей (с `pipefail`, объявленным файлом, отказ
      # `kubectl` иначе стал бы кодом возврата шага).
      - name: хвост журналов при падении (в журнал работы)
        if: failure()
        run: |
          # Хвост печатается по СОБРАННЫМ ФАЙЛАМ, а не по второму перечню имён.
          # Здесь стоял ВТОРОЙ выписанный перечень — то есть два места об одном
          # предмете, из которых верно одно: правка одного молча не доезжала до
          # другого (#1741).
          shopt -s nullglob
          logs=(stand-logs/*.log)
          echo "───────── журналов собрано: ${#logs[@]}"
          for f in "${logs[@]}"; do
            echo "───────── ${f#stand-logs/}"
            tail -60 "$f" 2>/dev/null || echo "  (нет)"
          done
          echo "───────── события"
          tail -25 stand-logs/events.txt 2>/dev/null || echo "  (события недоступны)"

      - name: снести стенд
        if: always()
        run: |
          kind delete cluster --name "$CLUSTER_NAME" 2>/dev/null || true
          echo "=== диск после уборки:"; df -h / | tail -1

  # ─── СВОД: один ответ про весь прогон ───────────────────────────────────────
  #
  # `if: always()` и `needs` на оба предыдущих job'а — обязательно вместе. Без
  # `always()` свод не исполнится, когда хоть один шард красный, то есть ровно
  # тогда, когда он нужен. Без `needs.shard` он побежал бы раньше описей.
  #
  # Свод — ЕДИНСТВЕННОЕ место, где произносится «зелено». Он краснеет, если хоть
  # один шард не отчитался, если сумма отчитавшихся коллекций не равна числу
  # коллекций в дереве, если есть упавшие утверждения, неотвеченные запросы,
  # упавшие скрипты или отчёты без единого утверждения. Ничего не вычитается.
  summary:
    name: сводный вердикт (все шарды)
    needs: [plan, shard]
    # Условие обязано пропускать КРАСНОЕ — без этого свод не исполнится ровно
    # тогда, когда он нужен, — и обязано НЕ судить прогон, которого не было.
    # `!cancelled()` даёт и то, и другое: красный шард свод переживает, снятый
    # прогон — пропускает.
    #
    # Здесь стоял `always()`, и он произносил вердикт над отменённым прогоном.
    # Замер окна из 100 прогонов (2026-08-15T22:17Z…2026-08-17T09:56Z; предикат —
    # перекрёстная таблица «исход прогона × исход работы свода»): работа «сводный
    # вердикт» красна в 52 прогонах, при том что красных прогонов 14. Все
    # остальные 38 — ОТМЕНЁННЫЕ прогоны, где свод успевал начаться и погибал
    # вместе с ними, оставляя после себя красную работу внутри отменённого
    # прогона. Вердикта у отменённого прогона нет ни у одной ревизии (третья
    # категория), поэтому такая работа не сообщала ничего, кроме шума в разборе.
    #
    # Условие по автору события отсюда снято вместе со своим предметом — разбор
    # у работы `plan`. Пока оно стояло, свод на PR обновления зависимостей был
    # ПРОПУЩЕН, а до правки 2026-08-11 — красен на пустом наборе описей; обе
    # редакции говорили об одном: «мы сюда не ходили». Теперь стенды на таких PR
    # поднимаются, описи есть, и свод произносит про них ровно то же, что про
    # любой другой прогон.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      # Архивы шардов раскладываются ПОВЕРХ рабочей копии: внутри они несут пути от
      # корня, поэтому описи попадают в `shard-verdicts/`, а отчёты — на свои места
      # под `…/tests/newman/out/`. Второе нужно следующему гейту: запись «известное
      # красное», называющая кейс, который исполнился и прошёл, — находка, и увидеть
      # это можно, только имея отчёты ВСЕХ шардов сразу. До разнесения такой полноты
      # не было ни у кого.
      #
      # `continue-on-error` — отсутствие артефакта шарда законный исход скачивания
      # (job мог быть снят по таймауту), и именно поэтому шаг НЕ падает здесь:
      # «описи нет» обязано доехать до СВОДА и быть названо там, а не превратиться в
      # отказ скачивания, из которого не видно, чьей описи не хватает.
      - name: скачать архивы шардов (описи + отчёты)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: newman-shard-*
          path: .
          merge-multiple: true

      - name: что скачалось
        run: |
          echo "=== описи:"; ls -la shard-verdicts/ 2>/dev/null || echo "  (ни одной)"
          echo "=== отчётов на местах: $(ls services/*/tests/newman/out/*.json \
                                            gateway/tests/newman/out/*.json 2>/dev/null | wc -l)"

      # Исходы работ передаются ЯВНО. Своими силами свод не отличает «шард
      # исполнялся и не доехал» от «шард не запускался вовсе»: следов у обоих
      # ровно ноль. Различие не косметическое — первое находка сама по себе,
      # второе следствие красноты плана, и свод, печатавший пять «шард не
      # отчитался» поверх одной находки плана, описывал каскад как коллапс.
      - name: СВОДНЫЙ ВЕРДИКТ
        run: |
          python3 .github/scripts/aggregate-shard-verdicts.py \
            --dir shard-verdicts \
            --plan-result '${{ needs.plan.result }}' \
            --shard-result '${{ needs.shard.result }}' \
            --summary "$GITHUB_STEP_SUMMARY"

      # Запись «известное красное» обязана оставаться красной. `if: always()` —
      # запись, пережившая свой фикс, тем более видна на красном прогоне: именно
      # тогда по ней и планируют работу. Здесь у гейта есть третье измерение
      # (отчёты под out/), потому что артефакты всех шардов уже разложены по дереву.
      - name: гейт — запись «известное красное» всё ещё красная
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/knownfailingsubject/cmd/verify-known-failing-subject .
