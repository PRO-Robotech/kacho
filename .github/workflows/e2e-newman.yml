# e2e-newman — чёрный ящик против REST api-gateway на живом стенде.
#
# Закрывает главный пробел CI: 69 newman-коллекций (iam 27, vpc 15, nlb 9, compute 9,
# storage 6, registry 3) не гонялись НИ РАЗУ автоматически — только руками. Всё, что
# ловится лишь на собранном стенде (регистрация RPC в gateway, проброс Internal*,
# authz-цепочка, миграции, fga-seed), проверялось глазами и «когда вспомнили».
#
# ПОЧЕМУ self-hosted (beget-runner). Замерено, а не предположено: стенд требует 4.2 ГБ
# memory.requests, а у ранера после апгрейда 2026-07-16 — 15 ГБ (14 свободно) и 12 ядер
# против 4 ядер у ubuntu-latest. До апгрейда было 3.8 ГБ и стенд не влезал даже урезанным
# (3.08 ГБ + kind control-plane ~0.7 ГБ), поэтому job изначально жил на ubuntu-latest.
#
# Диск ранера — УЗКОЕ МЕСТО: 29 ГБ всего, ~11 ГБ свободно (кэш buildkit от docker-build
# занимает остальное). Поэтому кластер сносится после КАЖДОГО прогона (см. ниже) — и ради
# места, и ради герметичности.
name: e2e-newman

on:
  # Только pre-merge гейт для PR в main. НЕ на push в main: тяжёлый self-hosted kind-стенд
  # (~35м) не нужно гонять повторно после мерджа — PR-дерево уже провалидировано.
  pull_request:
    branches: [main]

  # …и на push в интеграционную ветку. Одного условия на PR в main НЕ ХВАТИЛО, и
  # здесь это дороже, чем у ci/ui: `redesign/integration` живёт месяцами и в main
  # не мержится, поэтому ЕДИНСТВЕННЫЙ прогон чёрного ящика по всему продукту не
  # отрабатывал на ней ни разу. Всё, что ловится только на собранном стенде
  # (регистрация RPC, проброс Internal*, цепочка authz, миграции, fga-seed),
  # месяцами не проверялось вовсе — при том, что вся работа шла именно там.
  #
  # Очередь за self-hosted ранером это растит, и осознанно: `concurrency` ниже
  # ключуется на ref и отменяет предыдущий прогон той же ветки, поэтому живых
  # прогонов на ветку остаётся один. Пуши в интеграционную ветку — это мерджи
  # готовых веток, а не поток коммитов.
  #
  # Фильтра по путям сознательно нет: он стал бы слепой зоной ровно того же рода,
  # что и отсутствующий триггер (чарт/фикстура/скрипт ломают стенд не хуже кода).
  push:
    branches: [redesign/integration]
  workflow_dispatch:

permissions:
  contents: read

# Стенд тяжёлый (~20 мин). Гонять его для устаревшего коммита незачем.
concurrency:
  group: e2e-newman-${{ github.ref }}
  cancel-in-progress: true

# СТАТУС КОНВЕЙЕРА НЕ ТЕРЯЕТСЯ. Умолчание GitHub для `run:` — `bash -e {0}`, то
# есть БЕЗ pipefail: `<проверка> | tee`, `<сборка> | grep` отдают шагу код
# возврата ПРАВОЙ команды и зеленеют при любом провале левой. `shell: bash` —
# документированный синоним `bash --noprofile --norc -eo pipefail {0}`;
# относительно умолчания это добавляет ровно pipefail.
# Объявляется файлом, а не по шагам, чтобы защита распространялась и на шаги,
# которых тут ещё нет. Гейт класса — internal/repohygiene/pipefailguard_test.go.
defaults:
  run:
    shell: bash

jobs:
  newman:
    name: newman e2e (kind-стенд)
    # Dependabot dep-bump'ы НЕ гоняют тяжёлый self-hosted kind-стенд (~35м): один runner
    # забивается десятками PR'ов, а dep-bump валидируется ci/unit/integration. Реальные
    # PR в main (не dependabot) проходят e2e как pre-merge гейт.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: self-hosted
    # e2e тяжёлый: fresh dev-up (~13м) + newman-суиты + gates. Суиты теперь гоняются
    # ПАРАЛЛЕЛЬНО (newman-parallel.sh: один seed → 2 волны — vpc/compute/nlb concurrent,
    # затем iam изолированно) → wall-time = dev-up + max(wave1) + wave2(iam). iam отдельной
    # волной: его full-path authz-материализация (AccessBinding CRUD, label-revoke) под
    # конкурентной нагрузкой leaf-сервисов дрейнила (get-confirms 404, revoke не залипал).
    # Цель ≤30м на leaf; iam-волна добавляет ~11м → ~40м; 55 — запас на 2-фазу.
    # TRANSIENT 55→90: failure-heavy прогоны (redesign-integration, retry-обёртки на
    # 403/404 EC-окне) переваливают за 55м и job'а hard-kill'ится ДО `if:always()`
    # upload-шага → artifact (newman-out-reports) теряется, CI-арбитр слепнет. 90 даёт
    # прогону завершиться И загрузить отчёты. Вернуть к ~45 когда suite снова зелёный (~35м).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # На ранере из тулчейнов есть только docker/git/jq/make — go/helm/node/kubectl/kind
      # ставим сами (setup-* кэшируют их в tool-cache ранера, т.е. платим один раз).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # ПИН ОБЯЗАТЕЛЕН. setup-helm без version ставит ПОСЛЕДНЮЮ — и притащил Helm 4.2.3,
      # тогда как локально и на проде helm v3.17. Helm 4 по умолчанию делает
      # SERVER-SIDE APPLY (Helm 3 — client-side 3-way merge), а это разная семантика
      # владения полями: apply упирается в чужой field-manager и валится
      #   UPGRADE FAILED: conflict with "kubectl-patch" using apps/v1:
      #   .spec.template.metadata.annotations.kacho.cloud/openfga-model-id-rev
      # (аннотацию объявляет чарт kacho-iam и патчит openfga-bootstrap-job — двойное
      # владение, для Helm 3 безобидное). Гейт при этом «зеленел», проверяя чарты НЕ той
      # версией, которой разворачивается прод, — ложная уверенность.
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: azure/setup-kubectl@v4

      # kind — БИНАРЬ, без создания кластера (kind-action создаёт его сам и не умеет
      # переиспользовать наш путь). Кластер поднимает `make dev-up`: он уже делает
      # `kind get clusters | grep -q kacho || ./kind/create-cluster.sh` с НАШИМ
      # kind-config (host-port mappings для ingress; дефолтный конфиг их не несёт).
      # Так CI идёт ровно тем же путём, что и разработчик локально.
      # БЕЗ sudo: на self-hosted ранере беспарольный sudo не гарантирован (на
      # ubuntu-latest он есть всегда — это ровно тот класс различий, на котором
      # «работало на hosted» ломается при переезде). Ставим в ~/bin и кладём в PATH
      # через GITHUB_PATH.
      - name: kind
        run: |
          mkdir -p "$HOME/bin"
          curl -sSLo "$HOME/bin/kind" https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x "$HOME/bin/kind"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/kind" version

      - name: newman
        run: npm i -g newman@6

      # grpcurl нужен фикстурам (tests/authz-fixtures/setup.sh сеет пользователей через
      # kacho-iam-internal:9091). Без него шаг падает `FATAL: 'grpcurl' not found in PATH`
      # ДО первой коллекции — стенд поднят, а проверено ноль.
      - name: grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz \
            | tar -xz -C "$HOME/bin" grpcurl
          grpcurl --version

      # КРИТИЧНО на self-hosted и не нужно на ubuntu-latest: там VM умирает вместе с
      # job'ом, здесь машина живёт и kind-кластер переживает прогоны.
      # Переиспользованный стенд — НЕ экономия, а источник ложных падений: доказано
      # вручную 2026-07-16 — в кластере, пережившем много прогонов, накопились мусорные
      # AccessBinding'и, и кейсы, ждущие чистое состояние, краснели «сами по себе».
      #
      # Сносим ДО, а не только ПОСЛЕ: прошлый job мог упасть жёстко (timeout/kill) и не
      # дойти до уборки.
      - name: снести кластер от прошлого прогона
        run: |
          kind delete cluster --name kacho 2>/dev/null || true
          echo "=== диск до стенда:"; df -h / | tail -1

      - name: стенд (dev-up)
        working-directory: deploy
        run: make dev-up

      - name: что поднялось
        if: always()
        run: kubectl -n kacho get pods -o wide

      # Наборы гоняем по сервисам, которые dev-профиль реально поднимает. Список —
      # умолчание SERVICES в scripts/newman-parallel.sh: iam vpc compute nlb storage
      # registry geo api-gateway. Все восемь dev-профиль поднимает (values.dev.yaml:
      # storage.enabled=true, registry.enabled=true), и у каждого ниже свой шаг-гейт
      # и своя строка в маске артефактов — исполнение без гейта означало бы прогон,
      # результат которого ни на что не влияет.
      #
      # ПАРАЛЛЕЛЬНО (newman-parallel.sh): ОДИН seed (per-service изолированные accounts/
      # projects — директива #2, фикстуры не коллизят) + port-forward один раз → fan-out
      # iam/vpc/compute/nlb ОДНОВРЕМЕННО. wall-time = dev-up + max(суита) вместо суммы —
      # это убирает прежний 90м-таймаут (4 серийных суита + retry-инфляция уходили в
      # no-report при cancel). nlb внутри форсированно --jobs 1 (shared external-VIP pool),
      # остальные --jobs=$JOBS.
      #
      # `|| true` — НЕ проглатывание ошибок: прогон обязан дойти до конца и оставить
      # отчёты в out/; вердикт выносит assert-suites-green.sh (шаги ниже), который ничего
      # не вычитает и считает отсутствие отчёта провалом («(no-report)»), поэтому ранний
      # обрыв прогона спрятать нельзя.
      # ВИДИМОСТЬ ПОКА ПРОГОН ИДЁТ. Восемь суит гоняются одним шагом
      # параллельно, а их вывод уходит в файлы — до этой правки в интерфейсе
      # сорок минут не было видно ничего, кроме крутящегося шага, и первое число
      # появлялось вместе с гейтами. Прогон, за которым нельзя следить,
      # отлаживают следующим прогоном; цена ошибки в фикстуре — полный цикл стенда.
      #
      # Канал выбран по одному критерию — «видно, НЕ ДОЖИДАЯСЬ конца»:
      #   * лог шага стримится ⇒ таблица прогресса (каждые 20с: суита, стадия,
      #     отчётов из скольких, запросов, утверждений, УПАВШИХ, без ответа) видна
      #     сразу;
      #   * `::error file=…,line=…::` всплывает в интерфейсе тогда же, с
      #     координатой в исходнике кейса — крестик, который можно чинить, не
      #     скачивая артефакт.
      # `$GITHUB_STEP_SUMMARY` для реального времени НЕ ГОДИТСЯ: файл сводки
      # читается, когда ШАГ ЗАВЕРШИЛСЯ. Он используется ниже — короткими
      # шагами-гейтами, которые как раз и завершаются один за другим.
      #
      # Наблюдатель НЕ выносит вердикт (и говорит это в первой же строке):
      # вердикт — у шагов-гейтов. Второй, более мягкий вердикт рядом с первым —
      # способ получить два разных ответа на один вопрос.
      # Наблюдатель запускается ВНУТРИ этого шага, а не отдельным: он обязан
      # писать в СТРИМЯЩИЙСЯ лог, а стрим — у идущего шага. Фоновый процесс,
      # запущенный в предыдущем шаге, писал бы в лог, который уже закрыт, — вся
      # затея с реальным временем ровно на этом и разваливается.
      - name: newman — параллельно (+ live-отчёт в этот же лог)
        working-directory: deploy
        # Belt-and-suspenders: step-timeout < job-timeout (90) так, что даже если
        # newman-параллель зависнет/затянется, шаг убивается САМ и pipeline доходит до
        # `if:always()` upload. Оговорка, которой здесь не хватало: шаг доходит до
        # upload ВСЕГДА, но артефакт появляется только если отчёты реально написаны
        # — прогон, умерший до первой коллекции, оставляет пустой набор. Поэтому
        # upload ниже переведён на `if-no-files-found: error`: «нечего грузить» —
        # это отказ, а не тихий успех. `|| true` уже глотает newman-exit;
        # step-timeout ловит именно hang/overrun.
        timeout-minutes: 80
        env:
          DELAY: "10"   # per-request pacing (ms); parallel fan-out уже нагружает стенд
          JOBS: "2"     # per-suite collection concurrency (nlb форсированно 1)
        run: |
          rm -f /tmp/newman-live.stop
          python3 "${GITHUB_WORKSPACE}/.github/scripts/newman-live.py" watch --interval 20 &
          live_pid=$!
          # `|| true` — НЕ проглатывание: код возврата прогона здесь ни на что не
          # влияет by design, вердикт выносят шаги-гейты ниже по СОДЕРЖИМОМУ
          # отчётов (и считают отсутствие отчёта провалом). Ранний обрыв прогона
          # спрятать нельзя.
          ./scripts/newman-parallel.sh || true
          touch /tmp/newman-live.stop
          wait "$live_pid" || true

      # Итоговая сводка в интерфейс: числа по каждой суите (отчётов из скольких,
      # запросов, утверждений, УПАВШИХ, без ответа, пустых отчётов) + разворачиваемый
      # список находок с адресом в исходнике кейса. Отдельным коротким шагом —
      # `$GITHUB_STEP_SUMMARY` попадает в интерфейс, когда ШАГ завершился, поэтому
      # писать её из длинного шага прогона бессмысленно.
      #
      # Это ОТЧЁТ, не вердикт (шаг всегда зелёный): вердикт выносят гейты ниже.
      # Второй вердикт рядом с первым — способ получить два разных ответа на один
      # вопрос, поэтому его здесь нет.
      - name: сводка прогона (числа + находки)
        if: always()
        run: python3 .github/scripts/newman-live.py report

      # НАСТОЯЩИЙ гейт. ОДИН скрипт (живёт в iam) применяется к КАЖДОМУ сервису — он
      # глобит `collections/` + `out/` относительно cwd, поэтому запускается из каталога
      # проверяемого сервиса. Ровно так было в polyrepo: там vpc/compute/nlb звали
      # `${GITHUB_WORKSPACE}/kacho-iam/tests/newman/scripts/assert-suites-green.sh` со
      # своим working-directory.
      #
      # Зачем один скрипт: логика вердикта раньше дублировалась инлайном в
      # newman-e2e.yml каждого репо и РАЗЪЕХАЛАСЬ — правки доезжали только до копии
      # kacho-iam, а vpc/compute/nlb оставались красными на тех же самых общих наборах,
      # которые iam рапортовал зелёными.
      #
      # При переезде в монорепу вызов гейта потерялся вовсе.
      #
      # Гейт НИЧЕГО НЕ ВЫЧИТАЕТ (вычитание «известного красного» снято 2026-07-30 —
      # обоснование в самом гейте): любое упавшее утверждение, упавший скрипт,
      # неотвеченный запрос и отсутствие отчёта («(no-report)») валят его. Остаток
      # красноты ведётся числом и списком в docs/RESULTS.md суиты.
      #
      # Гейт iam заодно грейдит коллекцию authz-failclosed — ту, которой нужен
      # ВЫКЛЮЧЕННЫЙ store прав. Её гоняет WAVE 3 внутри newman-parallel.sh
      # (services/iam/tests/newman/scripts/run-failclosed.sh: свернуть в ноль →
      # выждать кэш решений шлюза → одна коллекция → поднять и дождаться
      # готовности), после того как все остальные суиты отчитались. Отдельным
      # шагом CI она НЕ гоняется намеренно: путь один и тот же локально и здесь,
      # иначе местный прогон и CI отвечали бы по-разному. Раньше на её месте было
      # исключение в гейте — то есть инвариант «нет ответа о правах ⇒ отказ,
      # никогда не 200» не проверялся ни разу. Исключения больше нет: не
      # отработала волна ⇒ нет отчёта ⇒ `authz-failclosed(no-report)` ⇒ красный.
      - name: гейт — newman зелёный (iam)
        if: always()
        working-directory: services/iam/tests/newman
        env:
          SUITE_LABEL: iam
        run: bash scripts/assert-suites-green.sh

      - name: гейт — newman зелёный (vpc)
        if: always()
        working-directory: services/vpc/tests/newman
        env:
          SUITE_LABEL: vpc
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      - name: гейт — newman зелёный (compute)
        if: always()
        working-directory: services/compute/tests/newman
        env:
          SUITE_LABEL: compute
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      - name: гейт — newman зелёный (nlb)
        if: always()
        working-directory: services/nlb/tests/newman
        env:
          SUITE_LABEL: nlb
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      # storage + registry + geo: их редизайн раньше НЕ был под e2e-покрытием (не в
      # newman-parallel.sh SERVICES → нет отчёта в artifact). Теперь прогоняются +
      # гейтятся (fixtures засеяны shared authz-fixtures). geo получил СВОЮ полную
      # суиту (Region/Zone public + Internal admin :9091 + authz + placement) —
      # owner-директива «каждый модуль — свои тесты»; iam geo-read superseded.
      - name: гейт — newman зелёный (storage)
        if: always()
        working-directory: services/storage/tests/newman
        env:
          SUITE_LABEL: storage
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      - name: гейт — newman зелёный (registry)
        if: always()
        working-directory: services/registry/tests/newman
        env:
          SUITE_LABEL: registry
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      - name: гейт — newman зелёный (geo)
        if: always()
        working-directory: services/geo/tests/newman
        env:
          SUITE_LABEL: geo
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      # api-gateway: суита ИСПОЛНЯЛАСЬ (сервис входит в умолчание SERIVCES
      # newman-parallel.sh), но шага-гейта у неё не было, и её отчёты не попадали
      # под маску артефактов — то есть прогон шёл, а результат не влиял ни на что и
      # не сохранялся. Она покрывает cluster-RBAC админ-поверхность
      # (InternalClusterService на cluster-internal REST-листенере), которой нет ни
      # в одной per-service суите. Суита живёт в gateway/, а не в services/ —
      # отсюда отдельный working-directory и отдельная строка в маске ниже.
      - name: гейт — newman зелёный (api-gateway)
        if: always()
        working-directory: gateway/tests/newman
        env:
          SUITE_LABEL: api-gateway
        run: bash "${GITHUB_WORKSPACE}/services/iam/tests/newman/scripts/assert-suites-green.sh"

      # Ни один сервис из умолчания SERVICES не должен снова оказаться исполняемым
      # без гейта и без артефакта: список сервисов живёт в одном файле, а его
      # следствия — в другом, и разъезжаются молча.
      - name: гейт — у каждой исполняемой суиты есть свой шаг-гейт и артефакт
        if: always()
        run: python3 .github/scripts/check-newman-suite-gates.py

      # То же, что и в ci.yaml, но ПОСЛЕ прогона — и потому с третьим измерением:
      # здесь под out/ лежат отчёты, поэтому запись, называющая кейс, который
      # исполнился и прошёл, становится находкой. Без отчётов это измерение
      # печатается как непроверенное, а не как пройденное, поэтому шаг в ci.yaml
      # его не подменяет.
      #
      # `if: always()` — запись, пережившая свой фикс, тем более видна на красном
      # прогоне: именно тогда по ней и планируют работу.
      - name: гейт — запись «известное красное» всё ещё красная
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/knownfailingsubject/cmd/verify-known-failing-subject .

      # coverage-гейт: proto RPC → newman case-id. Тоже был в polyrepo и тоже потерялся.
      # Порог — не «сколько получилось», а ПОЛ, ниже которого падаем: он ловит регресс
      # (RPC добавили, кейс — нет). Замерено на монорепе: iam 54/96 RPC (56%).
      #
      # proto-glob указывает ВНУТРЬ монорепы. В polyrepo он смотрел на sibling-чекаут
      # kacho-proto ($GITHUB_WORKSPACE/kacho-proto/...), а до этого — на in-repo дерево,
      # которого уже не существовало, и гейт падал «no RPCs discovered» (exit 2).
      # ban #6 на advertised external листенере — ТОЛЬКО gRPC-пробой.
      #
      # REST-проба на этой поверхности не может быть свидетельством в принципе:
      # листенер согласует ALPN h2 и говорит только gRPC, обычный HTTP-запрос он
      # закрывает `close notify` без единого ответа, а kubectl-проброс при этом
      # умирает `broken pipe`. Контрольный кейс REST-суиты («внешний листенер
      # отдаёт REST») падал ровно поэтому — и вместе с ним обесценивались все
      # «404 на внешнем» рядом: нет ответа ⇒ нет вердикта.
      #
      # Скрипт несёт ТРИ контроля (публичный метод обязан маршрутизироваться;
      # Internal*-метод обязан быть доказанно обслужен на своём :9091; дескриптор
      # обязан резолвиться) и печатает числа: сколько методов проверено, сколько
      # недостижимо, сколько НЕ проверено. Отдельный вердикт `INCONCLUSIVE`
      # существует потому, что authz шлюза отвечает раньше резолвера — засчитать
      # такой ответ в изоляцию значило бы позеленеть на непроверенном методе.
      - name: гейт — ban #6 на внешнем листенере (gRPC)
        if: always()
        run: python3 deploy/scripts/assert-ban6-external-isolation.py

      - name: coverage-гейт (proto RPC → newman)
        if: always()
        working-directory: services/iam/tests/newman
        env:
          COVERAGE_MIN: "30"
        run: |
          python3 scripts/coverage.py \
            --proto-glob "${GITHUB_WORKSPACE}/proto/kacho/cloud/iam/v1/*.proto" \
            --collections-glob 'collections/*.postman_collection.json' \
            --min "$COVERAGE_MIN"

      # newman-отчёты (per-suite out/*.json) — артефакт для оффлайн-диагноза сигнатур
      # падений (какой кейс, expected-vs-got). Без него краснота гейта неотлаживаема вне раннера.
      - name: upload newman reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-out-reports
          # Две строки, потому что суита api-gateway живёт в gateway/, а не в
          # services/ — одна маска её не покрывает, и её отчёты терялись.
          path: |
            services/*/tests/newman/out/*.json
            gateway/tests/newman/out/*.json
          # `ignore` здесь означал ровно то, чего шаг обязан не допускать: прогон,
          # не оставивший НИ ОДНОГО отчёта, загружался как успех и не создавал
          # артефакта вовсе. Так прошли два прогона 2026-07-26/27 (все суиты
          # умерли на `missing env` до запуска newman): гейты покраснели верно, а
          # разобраться постфактум было не по чему — артефакта не существовало,
          # хотя шаг рядом заявлял «artifact есть ВСЕГДА». Пустой набор файлов —
          # это отказ, и он обязан называться отказом.
          if-no-files-found: error
          retention-days: 7

      # Логи падений: без них newman-краснота в CI неотлаживаема — видно «ожидал 200,
      # получил 500», но не видно, ПОЧЕМУ сервис отдал 500.
      - name: логи сервисов при падении
        if: failure()
        run: |
          for d in kacho-iam vpc compute kacho-nlb api-gateway; do
            echo "───────── $d"
            kubectl -n kacho logs "deploy/$d" --tail=60 2>/dev/null || echo "  (нет)"
          done
          # Диагностика, а не вердикт: шаг исполняется на УЖЕ упавшем прогоне
          # (`if: failure()`), и недоступный кластер не должен подменять причину
          # красноты своей. С `pipefail` (объявлен файлом) отказ kubectl иначе
          # стал бы кодом возврата шага.
          kubectl -n kacho get events --sort-by=.lastTimestamp | tail -25 || echo "  (события недоступны)"

      # if: always() — кластер надо снести и когда прогон упал. Иначе красный job
      # оставляет за собой ~5 ГБ на диске, где свободно 11, и следующая СБОРКА падает на
      # `no space left on device` — в месте, никак не связанном с причиной.
      - name: снести стенд
        if: always()
        run: |
          kind delete cluster --name kacho 2>/dev/null || true
          echo "=== диск после уборки:"; df -h / | tail -1
