# pinned-tools-freshness — сторож за версиями, ЗАПИНЕННЫМИ ВНУТРИ шагов workflow.
#
# Дополняет dependabot, а не дублирует. Dependabot обновляет `uses: owner/action@v4`,
# go.mod, package.json и Dockerfile-FROM — но НЕ видит версию, заданную входом шага
# (`with: {version: v3.17.0}`), командой (`go install …@v2.12.2`) или URL'ом в curl
# (kind, grpcurl). Мы пиним именно так, осознанно, ради local == CI: незапиненный
# setup-helm однажды притащил Helm 4, и helm-гейт зеленел на версии, которой нет на
# проде. Без сторожа такой пин протухает МОЛЧА — trivy со старой базой CVE, gosec без
# новых правил.
#
# Вся логика — в .github/scripts/check-pinned-tools.sh (её можно прогнать локально:
# `bash .github/scripts/check-pinned-tools.sh`). Здесь только расписание и issue.
name: pinned-tools-freshness

on:
  schedule:
    - cron: '0 6 * * 1'   # понедельник, до начала недели
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: пины vs апстрим
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: сверить версии
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # У сторожа ДВА независимых сигнала, и раньше сюда доезжал только один.
          #
          #   stdout — markdown-строки находок (пусто = всё свежее и сходится):
          #     отставание пина от апстрима ЛИБО расхождение пинов одного
          #     инструмента между определениями конвейера;
          #   код возврата — расхождение пинов (дефект дерева: конвейеры исполняют
          #     разные версии) ЛИБО сам сторож неисправен — regex больше не находит
          #     пин, то есть проверять нечего и НЕ ПРОВЕРЕНО НИЧЕГО.
          #
          # Второй сигнал печатает ПУСТОЙ stdout, поэтому шаг с issue его не видит,
          # а прежний `|| true` стирал и код возврата — job зеленел, рапортуя «пины
          # свежие» ровно тогда, когда ни один пин не был сверен. Тем же способом
          # терялась любая жёсткая поломка скрипта (нет jq, синтаксис, обрыв сети).
          #
          # Поэтому: код запоминаем в отдельный выход и валим job ОТДЕЛЬНЫМ шагом
          # ПОСЛЕ issue — так доезжают оба сигнала, а не тот, что случился первым.
          # `|| rc=$?` обязателен: под `set -e` (умолчание GitHub) падение в
          # присваивании оборвало бы шаг ДО записи выходов.
          rc=0
          out="$(bash .github/scripts/check-pinned-tools.sh)" || rc=$?
          {
            echo 'stale<<PINEOF'
            printf '%s\n' "$out"
            echo 'PINEOF'
            echo "rc=$rc"
          } >> "$GITHUB_OUTPUT"

      # ОДИН переиспользуемый issue вместо нового каждую неделю — иначе трекер зарастает
      # и его перестают читать.
      - name: завести/обновить issue
        if: steps.check.outputs.stale != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.check.outputs.stale }}
        run: bash .github/scripts/report-stale-pins.sh

      # Отдельный шаг, а не `exit` в шаге сверки: issue про находки обязан завестись
      # ДАЖЕ когда сторож вдобавок сообщил о расхождении или о своей неисправности.
      - name: пины сходятся и сторож исправен
        if: always() && steps.check.outputs.rc != '0'
        run: |
          echo "::error::check-pinned-tools.sh вышел с кодом ${{ steps.check.outputs.rc }}."
          echo "Ненулевой код означает ОДНО ИЗ ДВУХ, и разбор — в stderr шага «сверить"
          echo "версии» выше:"
          echo "  «✗ <name> — пины РАСХОДЯТСЯ: …» — один инструмент запинен разными"
          echo "    версиями в разных определениях конвейера. Конвейеры исполняют"
          echo "    разные версии, вердикты о том же дереве несравнимы. Приведи к"
          echo "    одному значению — все вхождения названы в строке находки."
          echo "  «⚠ <name> — пин не найден (regex устарел?)» — сверка НЕ состоялась:"
          echo "    пустой список при ненулевом коде не означает «всё свежее». Поправь"
          echo "    зонд в каталоге PROBES под изменившийся синтаксис пина ЛИБО убери"
          echo "    запись, если пина больше нет."
          exit 1
